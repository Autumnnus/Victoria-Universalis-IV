l_braz_por:
 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Esta campanha é executada com o Victoria Universalis IV refeito. Em suma:\n\n#Y Religião#! - Sua lei de Igreja e Estado agora define um de quatro Modelos Religiosos. Você possui um medidor de 0-100 de Concordata Religiosa, gasta Fundo de Piedade em oito programas permanentes por modelo, e pode executar um Projeto Religioso direcionado em um estado de sua escolha.\n\n#Y Identidade Nacional#! - Nacionalidade Étnica, Cívica ou Composta, com Mandato Cultural para gastar, um medidor de Coesão Nacional para manter alto, e cinco Projetos Culturais.\n\n#Y Grupos de Doutrinas#! - 21 grupos divididos entre Produção, Sociedade e Militar, incluindo o novo grupo Agrário. Os espaços de grupo são obtidos por meio de investimento em doutrinas em vez do calendário, e cada compra custa a você um período de implementação de 24 meses.\n\n#Y Ideias Nacionais#! - Doze novos perfis de país, e o progresso agora provém de cada nível de doutrina individual que você adquire.\n\n#Y Eras#! - Três Eras com objetivos, treze espaços de Recompensa da Era e três Eras de Ouro, além de uma jornada de Encruzilhada da Era estratégica por Era.\n\n#Y Novo conteúdo#! - Mais de cem novos eventos: dilemas de doutrinas, Jornadas de Doutrinas plurianuais, incidentes de projetos e crises, e correntes temáticas para os Otomanos, o Japão e os Estados Unidos.\n\n#Y Interface#! - Uma nova linha superior, páginas de Religião e Identidade Nacional reconstruídas, um resumo de doutrinas em cada painel de país, e um Livro de Doutrinas mundial."
 ve_welcome.1.f:0 "Cada doutrina deixa sua marca na nação que a adota."
 ve_welcome.1.a:0 "Para os detalhes, consulte a descrição do mod. Divirta-se ^_^"
