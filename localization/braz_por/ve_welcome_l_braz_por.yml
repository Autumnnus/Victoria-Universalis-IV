l_braz_por:
 # Evento de boas-vindas do Victoria Universalis IV 2.0 - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Esta campanha usa a Victoria Universalis IV reconstruída. Em resumo:\n\n#Y Religião#! - Sua lei de Igreja e Estado agora define um de quatro Modelos Religiosos. Você tem um medidor de Assentamento Religioso de 0 a 100, gasta Reforma da piedade em oito programas permanentes por modelo e pode conduzir um Projeto Religioso direcionado no estado que escolher.\n\n#Y Identidade Nacional#! - Nação Étnica, Cívica ou Composta, com Mandato Cultural para gastar, um medidor de Coesão Nacional para manter alto e cinco Projetos Culturais.\n\n#Y Grupos de Ideias#! - 21 grupos entre Produção, Sociedade e Militar, incluindo o novo grupo Agrário. As vagas de grupo agora são conquistadas com investimento em doutrina, e não pelo calendário, e cada compra custa um período de implementação de 24 meses.\n\n#Y Ideias Nacionais#! - Doze novos perfis de país, e o progresso agora vem de cada nível de ideia que você compra.\n\n#Y Eras#! - Três eras com objetivos, treze recompensas de era e três Idades de Ouro, além de uma jornada estratégica de Encruzilhada da Era em cada era.\n\n#Y Novo conteúdo#! - Mais de cem novos eventos: dilemas de doutrina, Jornadas de Doutrina de vários anos, incidentes e crises de projeto, e cadeias temáticas para os otomanos, o Japão e os Estados Unidos.\n\n#Y Interface#! - Uma nova linha na barra superior, páginas de Religião e Identidade Nacional reconstruídas, um resumo de doutrina no painel de cada país e um Doutrina Ledger mundial."
 ve_welcome.1.f:0 "Toda doutrina deixa sua marca na nação que a adota."
 ve_welcome.1.a:0 "Para os detalhes, veja a descrição do mod. Divirta-se ^_^"
