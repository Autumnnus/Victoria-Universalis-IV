l_braz_por:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Doutrina Nacional"
 VE_CP_COLLAPSE_TT:0 "Ocultar a visão geral do Victoria Universalis para este país"
 VE_CP_EXPAND_TT:0 "Exibir a visão geral do Victoria Universalis para este país"

 VE_CP_INSIGHT_LABEL:0 "Visão Nacional"
 VE_CP_INSIGHT_TT:0 "#header Visão Nacional#!\nEstoque: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nGasto em doutrinas individuais dentro de um grupo de doutrinas adotado."
 VE_CP_PIETY_LABEL:0 "Fundo de Piedade"
 VE_CP_PIETY_TT:0 "#header Fundo de Piedade#!\nEstoque: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nGasto em Programas Religiosos e no Projeto Religioso Alvo."
 VE_CP_MANDATE_LABEL:0 "Mandato Cultural"
 VE_CP_MANDATE_TT:0 "#header Mandato Cultural#!\nEstoque: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nGasto na alteração do Modelo de Identidade e em Projetos Culturais."
 VE_CP_MOMENTUM_LABEL:0 "Embalo da Era"
 VE_CP_MOMENTUM_TT:0 "#header Ímpeto da Era#!\nStock: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nEarned from satisfied Era Objectives and spent on Era Rewards. Momentum resets when a new Age begins."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Doutrinas"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Grupos de Doutrinas#!\nEspaços usados: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nEspaços livres: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInvestimento Atual em Doutrinas: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! doutrinas ativas adquiridas\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nDoutrinas de grupos ativos geram artifício permanente aos #Y 4, 8, 13, 19, 26#! e #Y 34#!. Os espaços 5–6 também exigem a Era 2 e o espaço 7 exige a Era 3. Cancelar um grupo reduz o investimento atual e nunca reembolsa Visão Nacional, mas o artifício já obtido é retido."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Doutrinas Nacionais"
 VE_CP_PROGRESS_LABEL:0 "Progresso da Doutrina"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Progresso da Doutrina Nacional#!\nDoutrinas de grupo adquiridas: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nA cada três doutrinas de grupo adquiridas, desbloqueia-se a próxima Doutrina Nacional. A vigésima primeira também concede o Bônus Nacional."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Nenhum grupo de doutrinas adotado ainda.#!"
 VE_CP_PROGRAMS_LABEL:0 "Programas Religiosos"
 VE_CP_NONE_YET:0 "#lore Nenhum ainda#!"
 VE_CP_PROJECT_LABEL:0 "Projeto"
 VE_CP_COHESION_LABEL:0 "Coesão Nacional"
 VE_CP_OBJECTIVES_LABEL:0 "Objetivos da Era"
 VE_CP_OBJECTIVES_TT:0 "#header Objetivos da Era#!\nConcluídos nesta Era: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nCada objetivo satisfeito concede Ímpeto da Era mensalmente. Quatro objetivos concluídos desbloqueiam uma Era de Ouro."
 VE_CP_REWARDS_LABEL:0 "Recompensas da Era"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] compradas nesta Era"
 VE_CP_REWARDS_TT:0 "#header Recompensas da Era#!\nCompradas nesta Era: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nCada recompensa custa mais do que a anterior, e os efeitos das recompensas terminam com a Era. Os espaços 10-13 são específicos de cada país."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Era Desconhecida"
 ve_cp_golden_age_industrial_active:0 "#P Era de Ouro Industrial#!"
 ve_cp_golden_age_cultural_active:0 "#P Era de Ouro Cultural#!"
 ve_cp_golden_age_strategic_active:0 "#P Era de Ouro Estratégica#!"
 ve_cp_golden_age_spent:0 "#lore Era de Ouro usada#!"
 ve_cp_golden_age_ready:0 "#Y Era de Ouro disponível#!"
 ve_cp_golden_age_locked:0 "#lore Era de Ouro bloqueada#!"
 ve_cp_tier_high:0 "#P Próspero#!"
 ve_cp_tier_stable:0 "#lore Estável#!"
 ve_cp_tier_low:0 "#N Tenso#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Adotado, mas nenhuma doutrina comprada neste grupo ainda.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Concordata Religiosa#!\nAtual: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nEquilíbrio: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMovimento mensal: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nO medidor move-se 20% em direção ao equilíbrio a cada mês, limitado a #Y 5#! pontos. Em #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\nEm #N 25#! ou menos: #N -5 de Legitimidade e -5% de Sucesso da Promulgação#!."
 VE_CP_COHESION_TT:0 "#header Coesão Nacional#!\nAtual: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nEquilíbrio: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMovimento mensal: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nA Coesão move-se 20% em direção ao equilíbrio a cada mês, limitado a #Y 5#! pontos. Em #P 75#! o Modelo de Identidade concede um benefício adicional; em #N 25#! ou abaixo, aplica-se instabilidade nacional."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Projeto Religioso Direcionado#!\nStatus: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Projeto Cultural#!\nStatus: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nAlvo: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "Progresso: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nProgresso mensal: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Nenhum projeto está em andamento. Um projeto é iniciado no painel de um estado possuído, e a Separação Total não pode executar um.#!"
 ve_cp_cultural_project_detail_active:0 "Progresso: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nProgresso mensal: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Nenhum projeto está em andamento. Projetos de âmbito nacional iniciam-se no painel de Identidade Nacional, e os direcionados no painel de um estado possuído.#!"
