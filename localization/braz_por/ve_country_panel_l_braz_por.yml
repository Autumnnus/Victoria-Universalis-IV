l_braz_por:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Doutrina Nacional"
 VE_CP_COLLAPSE_TT:0 "Ocultar a visão geral da Victoria Universalis para este país"
 VE_CP_EXPAND_TT:0 "Mostrar a visão geral da Victoria Universalis para este país"

 VE_CP_INSIGHT_LABEL:0 "Visão Nacional"
 VE_CP_INSIGHT_TT:0 "#header National Insight#!\nEstoque: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nGasto em ideias individuais dentro de um grupo de ideias abraçadas."
 VE_CP_PIETY_LABEL:0 "Reforma da piedade"
 VE_CP_PIETY_TT:0 "#header Piety Reform#!\nEstoque: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nGasto em Programas Religiosos e no Projeto Religioso Alvo."
 VE_CP_MANDATE_LABEL:0 "Mandato Cultural"
 VE_CP_MANDATE_TT:0 "#header Mandato Cultural#!\nEstoque: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nGasto na mudança do Modelo de Identidade e em Projetos Culturais."
 VE_CP_MOMENTUM_LABEL:0 "Momento da Era"
 VE_CP_MOMENTUM_TT:0 "#header Era Momentum#!\nEstoque: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nGanhou com Objetivos da Era satisfeitos e gasto em Recompensas da Era. O impulso é redefinido quando uma nova Era começa."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Ideias"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Grupos de Ideias#!\nSlots usados: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nVagas gratuitas: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInvestimento atual em Doutrina: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! ideias compradas ativas\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nIdeias de grupo ativas ganham capacidade permanente em #Y 4, 8, 13, 19, 26#! e #Y 34#!. Os slots 5–6 também exigem a idade 2 e o slot 7 requer a idade 3. O cancelamento de um grupo reduz o investimento atual e nunca reembolsa o Insight, mas a capacidade já conquistada é mantida."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Ideias Nacionais"
 VE_CP_PROGRESS_LABEL:0 "Progresso da Ideia"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Progresso da Ideia Nacional#!\nIdeias de grupo compradas: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nCada terceira ideia de grupo comprada desbloqueia a próxima Ideia Nacional. A vigésima primeira também concede o Bônus Nacional."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Nenhum grupo de ideias adotado ainda.#!"
 VE_CP_PROGRAMS_LABEL:0 "Programas Religiosos"
 VE_CP_NONE_YET:0 "#lore Nenhum ainda#!"
 VE_CP_PROJECT_LABEL:0 "Projeto"
 VE_CP_COHESION_LABEL:0 "Coesão Nacional"
 VE_CP_OBJECTIVES_LABEL:0 "Objetivos da Era"
 VE_CP_OBJECTIVES_TT:0 "#header Objetivos da Era#!\nConcluído nesta Era: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nCada objetivo satisfeito paga Era Momentum todos os meses. Quatro objetivos concluídos desbloqueiam uma Era de Ouro."
 VE_CP_REWARDS_LABEL:0 "Recompensas da Era"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] comprados nesta Era"
 VE_CP_REWARDS_TT:0 "#header Era Rewards#!\nComprados nesta Era: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nCada recompensa custa mais que a anterior e os efeitos da recompensa terminam com a Era. Os slots 10-13 são específicos do país."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Idade Desconhecida"
 ve_cp_golden_age_industrial_active:0 "#P Idade de Ouro Industrial#!"
 ve_cp_golden_age_cultural_active:0 "#P Idade de Ouro Cultural#!"
 ve_cp_golden_age_strategic_active:0 "#P Idade de Ouro Estratégica#!"
 ve_cp_golden_age_spent:0 "#lore Idade de Ouro usada#!"
 ve_cp_golden_age_ready:0 "#Y Idade de Ouro disponível#!"
 ve_cp_golden_age_locked:0 "#lore Idade de Ouro bloqueada#!"
 ve_cp_tier_high:0 "#P Próspero#!"
 ve_cp_tier_stable:0 "#lore Estável#!"
 ve_cp_tier_low:0 "#N Tensado#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Abraçado, mas nenhuma ideia comprada neste grupo ainda.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Assentamento Religioso#!\nAtual: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nEquilíbrio: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMovimento mensal: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nO medidor se move 20% em direção ao equilíbrio a cada mês, limitado a #Y 5#! pontos. Em #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\nEm #N 25#! ou abaixo: #N -5 Legitimidade e -5% de sucesso na promulgação da lei#!."
 VE_CP_COHESION_TT:0 "#header Coesão Nacional#!\nAtual: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nEquilíbrio: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMovimento mensal: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nA coesão se move 20% em direção ao equilíbrio a cada mês, limitado a #Y 5#! pontos. No #P 75#! o Modelo de Identidade concede um benefício extra; no #N 25#! ou abaixo da instabilidade nacional se aplica."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Projeto religioso direcionado#!\nStatus: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Projeto Cultural#!\nStatus: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nMeta: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "Progresso: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nProgresso mensal: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Nenhum projeto está em execução. Um projeto é iniciado a partir do painel de um estado de propriedade e a Total Separation não pode executá-lo.#!"
 ve_cp_cultural_project_detail_active:0 "Progresso: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nProgresso mensal: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Nenhum projeto está em execução. Os projetos de âmbito nacional partem do painel de Identidade Nacional, direcionados ao painel de um estado próprio.#!"
