 ve_je_doctrine_journey_industrialist:0 "Padronizando o Sistema de Fábrica"
 ve_je_doctrine_journey_industrialist_reason:0 "A doutrina industrial se espalhou para além das fábricas individuais. Os fabricantes, inspetores e administradores devem agora transformar a prática local num sistema nacional durável."
 ve_je_doctrine_journey_industrialist_status_both:0 "Progresso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgresso mensal: #P +2#!\n\n#P Escala de fabricação atendida#!: pelo menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! níveis de construção de fabricação.\n#P Administração estável atendida#!: burocracia não negativa, nenhuma escassez iminente e menos de 15% de turbulência no país.\n\nRecompensa de sucesso: #P +40 National Insight#!. Se o Progresso não chegar a 60 em 60 meses, a Jornada termina sem recompensa."
