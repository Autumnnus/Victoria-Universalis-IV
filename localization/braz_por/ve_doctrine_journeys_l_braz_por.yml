 ve_je_doctrine_journey_professional_army:0 "Reformando o Estado-Maior"
 ve_je_doctrine_journey_professional_army_reason:0 "Um corpo de oficiais profissional exige mais do que quartéis e comissões. O treinamento, o planejamento e a mobilização devem ser organizados em um sistema de equipe durável."
