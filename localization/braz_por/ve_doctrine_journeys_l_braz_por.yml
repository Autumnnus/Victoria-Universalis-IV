 ve_doctrine_journey_general_staff_reform_mdf:0 "Estado-Maior Institucional"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Faculdades de estado-maior, tabelas de mobilização e padrões comuns de treinamento tornaram-se parte duradoura das forças armadas."

 ve_doctrine_journey.1.t:0 "Padronização do Sistema Fabril"
 ve_doctrine_journey.1.d:0 "Associações industriais propõem um esforço nacional para alinhar maquinário, inspeções e práticas de fabricação. A empreitada duraria cinco anos e exigiria escala industrial sustentada e estabilidade administrativa."
 ve_doctrine_journey.1.a:0 "Iniciar o esforço de padronização."
 ve_doctrine_journey.1.b:0 "Reconsiderar a proposta em cinco anos."
 ve_doctrine_journey.1.c:0 "Nossas fábricas não precisam de doutrina nacional."
 ve_doctrine_journey.2.t:0 "Uma República de Eruditos"
 ve_doctrine_journey.2.d:0 "Reitores e sociedades letradas propõem um esforço de cinco anos para conectar universidades em uma comunidade nacional duradoura de pesquisa. Seu sucesso dependeria tanto da capacidade acadêmica quanto da disseminação da instrução."
 ve_doctrine_journey.2.a:0 "Patrocinar a república de eruditos."
 ve_doctrine_journey.2.b:0 "Retornar à proposta em cinco anos."
 ve_doctrine_journey.2.c:0 "O aprendizado deve permanecer organizado localmente."
 ve_doctrine_journey.3.t:0 "Reforma do Estado-Maior"
 ve_doctrine_journey.3.d:0 "Oficiais superiores propõem uma reforma de cinco anos no treinamento, no planejamento e na mobilização. O estado-maior teria de provar que a doutrina profissional pode sobreviver além de um círculo de comandantes favorecidos."
 ve_doctrine_journey.3.a:0 "Comissionar a reforma do estado-maior."
 ve_doctrine_journey.3.b:0 "Revisar os planos novamente em cinco anos."
 ve_doctrine_journey.3.c:0 "O sistema de comando existente é suficiente."

 ve_doctrine_journey_start_tt:0 "Inicia esta Jornada de Doutrina de cinco anos. Apenas uma Jornada de Doutrina pode estar ativa por vez."
 ve_doctrine_journey_defer_tt:0 "Adia a oferta deste grupo por #Y 5 anos#!. Ela poderá ser oferecida novamente depois."
 ve_doctrine_journey_decline_tt:0 "Recusa permanentemente a Jornada de Doutrina deste grupo."

 ve_doctrine_journey.10.t:0 "Medidas e Tolerâncias"
 ve_doctrine_journey.10.d:0 "As fábricas utilizam calibres, conexões e tolerâncias incompatíveis. Os engenheiros instam o Estado a impor um único catálogo, enquanto os fabricantes provinciais alertam que um padrão rígido pode congelar práticas locais úteis."
 ve_doctrine_journey.10.a:0 "Financiar um catálogo nacional de padrões."
 ve_doctrine_journey.10.a.tt:0 "Gasta #N 15#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.10.b:0 "Permitir padrões regionais compatíveis."
 ve_doctrine_journey.10.b.tt:0 "A Jornada continua sem alteração imediata de recursos ou progresso."
 ve_doctrine_journey.10.c:0 "Utilizar os escritórios de Obras para coordenar a adoção."
 ve_doctrine_journey.10.c.tt:0 "Requer a Doutrina Industrialista V.\nGasta #N 10#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.11.t:0 "A Inspetoria Nacional"
 ve_doctrine_journey.11.d:0 "Os primeiros padrões comuns agora exigem aplicação. Os oficiais propõem uma inspetoria central, os fabricantes preferem a autocertificação, e planejadores industriais experientes defendem a auditoria de ambos."
 ve_doctrine_journey.11.a:0 "Estabelecer uma inspetoria industrial central."
 ve_doctrine_journey.11.a.tt:0 "Gasta #N 15#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.11.b:0 "Reconhecer a autocertificação da indústria."
 ve_doctrine_journey.11.b.tt:0 "A Jornada continua sem alteração imediata de recursos ou progresso."
 ve_doctrine_journey.11.c:0 "Auditar inspetores e fabricantes através de um único sistema."
 ve_doctrine_journey.11.c.tt:0 "Requer a Doutrina Industrialista VII.\nGasta #N 10#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."

 ve_doctrine_journey.20.t:0 "Cátedras Abertas"
 ve_doctrine_journey.20.d:0 "As universidades divergem sobre se as novas cátedras devem responder a faculdades locais, prioridades nacionais ou a um mandato de ensino público. As primeiras nomeações definirão com que liberdade a rede acadêmica trocará pessoas e ideias."
 ve_doctrine_journey.20.a:0 "Financiar um programa nacional coordenado de cátedras."
 ve_doctrine_journey.20.a.tt:0 "Gasta #N 15#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.20.b:0 "Deixar que cada faculdade defina suas próprias cátedras."
 ve_doctrine_journey.20.b.tt:0 "A Jornada continua sem alteração imediata de recursos ou progresso."
 ve_doctrine_journey.20.c:0 "Vincular as cátedras a uma rede pública de palestras."
 ve_doctrine_journey.20.c.tt:0 "Requer a Doutrina Acadêmica V.\nGasta #N 10#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.21.t:0 "Uma República de Árbitros"
 ve_doctrine_journey.21.d:0 "A pesquisa agora circula entre instituições mais rápido do que o antigo mecenato pode julgá-la. Os estudiosos propõem a revisão por pares nacional, enquanto as academias estabelecidas defendem o convite seletivo e a independência disciplinar."
 ve_doctrine_journey.21.a:0 "Financiar um serviço nacional de revisão por pares."
 ve_doctrine_journey.21.a.tt:0 "Gasta #N 15#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.21.b:0 "Deixar a revisão para as sociedades letradas."
 ve_doctrine_journey.21.b.tt:0 "A Jornada continua sem alteração imediata de recursos ou progresso."
 ve_doctrine_journey.21.c:0 "Convocar conselhos de revisão interdisciplinares."
 ve_doctrine_journey.21.c.tt:0 "Requer a Doutrina Acadêmica VII.\nGasta #N 10#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."

 ve_doctrine_journey.30.t:0 "A Escola de Estado-Maior"
 ve_doctrine_journey.30.d:0 "A nova escola de Estado-Maior deve decidir o que torna um oficial apto para o comando. Os reformistas exigem exames e instrução comum, enquanto os comandantes estabelecidos defendem a antiguidade e o julgamento adquirido no serviço de campanha."
 ve_doctrine_journey.30.a:0 "Financiar exames nacionais e um currículo comum."
 ve_doctrine_journey.30.a.tt:0 "Gasta #N 15#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.30.b:0 "Equilibrar a antiguidade com as recomendações da escola."
 ve_doctrine_journey.30.b.tt:0 "A Jornada continua sem alteração imediata de recursos ou progresso."
 ve_doctrine_journey.30.c:0 "Rodizar oficiais de campo pelas salas de aula do Estado-Maior."
 ve_doctrine_journey.30.c.tt:0 "Requer a Doutrina Exército Profissional V.\nGasta #N 10#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.31.t:0 "As Tabelas de Mobilização"
 ve_doctrine_journey.31.d:0 "Os planejadores produziram cronogramas concorrentes para homens, suprimentos e transporte ferroviário. Uma única tabela nacional promete coordenação, mas os comandos regionais alertam que cronogramas rígidos ignorarão a artifício local."
 ve_doctrine_journey.31.a:0 "Financiar um escritório central de mobilização."
 ve_doctrine_journey.31.a.tt:0 "Gasta #N 15#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.31.b:0 "Deixar que os comandos regionais mantenham cronogramas compatíveis."
 ve_doctrine_journey.31.b.tt:0 "A Jornada continua sem alteração imediata de recursos ou progresso."
 ve_doctrine_journey.31.c:0 "Integrar o planejamento de ferrovia, depósito e comando."
 ve_doctrine_journey.31.c.tt:0 "Requer Doutrina Exército Profissional VII.\nGasta #N 10#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
