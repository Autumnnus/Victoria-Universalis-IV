 ve_je_doctrine_journey_academic:0 "Uma República de Acadêmicos"
 ve_je_doctrine_journey_academic_reason:0 "As universidades e as sociedades científicas estão prontas para se tornarem uma comunidade nacional de investigação, desde que suas instituições e fundações sociais possam sustentá-la."
