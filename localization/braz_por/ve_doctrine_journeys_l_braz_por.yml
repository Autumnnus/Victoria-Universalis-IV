 ve_je_doctrine_journey_industrialist:0 "Padronização do Sistema Fabril"
 ve_je_doctrine_journey_industrialist_reason:0 "A doutrina industrial espalhou-se além de fábricas individuais. Fabricantes, inspetores e administradores devem agora transformar a prática local em um sistema nacional duradouro."
 ve_je_doctrine_journey_industrialist_status_both:0 "Progresso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgresso mensal: #P +2#!\n\n#P Escala fabril alcançada#!: pelo menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! níveis de Construção de manufatura.\n#P Administração estável alcançada#!: Burocracia não negativa, sem escassez iminente e menos de 15% de Instabilidade no país.\n\nRecompensa de sucesso: #P +40 Visão Nacional#!. Se o Progresso não atingir 60 dentro de 60 meses, a Jornada termina sem recompensa."
