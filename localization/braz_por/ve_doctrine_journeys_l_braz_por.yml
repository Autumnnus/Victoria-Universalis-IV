 ve_doctrine_journey_general_staff_reform_mdf:0 "Estado-Maior Institucional"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "As faculdades de estado-maior, as mesas de mobilização e os padrões de treinamento comuns tornaram-se uma parte durável das forças armadas."

 ve_doctrine_journey.1.t:0 "Padronização do Sistema de Fábrica"
 ve_doctrine_journey.1.d:0 "As associações industriais propõem um esforço nacional para alinhar máquinas, inspeções e práticas de fabricação. O empreendimento duraria cinco anos e exigiria escala industrial sustentada e estabilidade administrativa."
 ve_doctrine_journey.1.a:0 "Iniciar o esforço de padronização."
 ve_doctrine_journey.1.b:0 "Reconsiderar a proposta em cinco anos."
 ve_doctrine_journey.1.c:0 "Nossas fábricas não precisam de doutrina nacional."
 ve_doctrine_journey.2.t:0 "Uma República de Estudiosos"
 ve_doctrine_journey.2.d:0 "Os reitores e as sociedades científicas propõem um esforço de cinco anos para ligar as universidades a uma comunidade nacional duradoura de investigação. Seu sucesso dependeria tanto da capacidade acadêmica quanto da disseminação da alfabetização."
 ve_doctrine_journey.2.a:0 "Patrocinar a república dos estudiosos."
 ve_doctrine_journey.2.b:0 "Retornar à proposta em cinco anos."
 ve_doctrine_journey.2.c:0 "A aprendizagem deve permanecer organizada localmente."
 ve_doctrine_journey.3.t:0 "Reforma do Estado-Maior"
 ve_doctrine_journey.3.d:0 "Os oficiais superiores propõem uma reforma de cinco anos na formação, planeamento e mobilização. O Estado-Maior teria de provar que a doutrina profissional pode sobreviver para além de um círculo de comandantes favorecidos."
 ve_doctrine_journey.3.a:0 "Encomendar a reforma do Estado-Maior."
 ve_doctrine_journey.3.b:0 "Revisar os planos novamente em cinco anos."
 ve_doctrine_journey.3.c:0 "O sistema de comando existente é suficiente."

 ve_doctrine_journey_start_tt:0 "Inicia esta Jornada Doutrinária de cinco anos. Apenas uma Jornada Doutrinária pode estar ativa por vez."
 ve_doctrine_journey_defer_tt:0 "Adia a oferta deste grupo por #Y 5 anos#!. Poderá ser oferecido novamente posteriormente."
 ve_doctrine_journey_decline_tt:0 "Recusa permanentemente a Jornada Doutrinária deste grupo."

 ve_doctrine_journey.10.t:0 "Medidas e Tolerâncias"
 ve_doctrine_journey.10.d:0 "As fábricas usam medidores, acessórios e tolerâncias incompatíveis. Os engenheiros instam o estado a impor um catálogo, enquanto os fabricantes provinciais alertam que um padrão rígido pode congelar práticas locais úteis."
 ve_doctrine_journey.10.a:0 "Financiar um catálogo nacional de padrões."
 ve_doctrine_journey.10.a.tt:0 "Gastar #N 15#! Insight Nacional.\nO progresso da jornada aumenta em #P 4#!."
 ve_doctrine_journey.10.b:0 "Permitir padrões regionais compatíveis."
 ve_doctrine_journey.10.b.tt:0 "A jornada continua sem um recurso imediato ou mudança de progresso."
 ve_doctrine_journey.10.c:0 "Use os escritórios de construção para coordenar a adoção."
 ve_doctrine_journey.10.c.tt:0 "Requer Ideia Industrial V.\nGasto #N 10#! Insight Nacional.\nO progresso da jornada aumenta em #P 4#!."
 ve_doctrine_journey.11.t:0 "A Inspecção Nacional"
 ve_doctrine_journey.11.d:0 "As primeiras normas comuns exigem agora aplicação. As autoridades propõem uma inspecção central, os fabricantes preferem a autocertificação e os planeadores industriais experientes defendem a auditoria de ambos."
 ve_doctrine_journey.11.a:0 "Estabelecer uma inspecção industrial central."
 ve_doctrine_journey.11.a.tt:0 "Gastar #N 15#! National Insight.\nO progresso da jornada aumenta em #P 4#!."
 ve_doctrine_journey.11.b:0 "Reconheça a autocertificação do setor."
 ve_doctrine_journey.11.b.tt:0 "A jornada continua sem um recurso imediato ou mudança de progresso."
 ve_doctrine_journey.11.c:0 "Audite inspetores e fabricantes por meio de um sistema."
 ve_doctrine_journey.11.c.tt:0 "Requer a Ideia Industrial VII.\nGaste #N 10#! National Insight.\nO progresso da jornada aumenta em #P 4#!."

 ve_doctrine_journey.20.t:0 "Cátedras Abertas"
 ve_doctrine_journey.20.d:0 "As universidades discordam sobre se as novas cátedras devem responder às faculdades locais, às prioridades nacionais ou a um mandato de ensino público. As primeiras nomeações definirão a liberdade com que a rede acadêmica troca pessoas e ideias."
 ve_doctrine_journey.20.a:0 "Financiar um programa de cátedra nacional coordenado."
 ve_doctrine_journey.20.a.tt:0 "Gaste #N 15#! National Insight.\nO progresso da jornada aumenta em #P 4#!."
 ve_doctrine_journey.20.b:0 "Deixe que cada corpo docente defina suas próprias cadeiras."
 ve_doctrine_journey.20.b.tt:0 "A Jornada continua sem um recurso imediato ou mudança de progresso."
 ve_doctrine_journey.20.c:0 "Vincule as cadeiras a uma rede pública de palestras."
 ve_doctrine_journey.20.c.tt:0 "Requer Ideia Acadêmica V.\nGaste #N 10#! Intuição Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.21.t:0 "Uma República de Árbitros"
 ve_doctrine_journey.21.d:0 "A investigação move-se agora entre instituições mais rapidamente do que o antigo patrocínio pode julgar. Os estudiosos propõem a revisão nacional por pares, enquanto as academias estabelecidas defendem o convite seletivo e a independência disciplinar."
 ve_doctrine_journey.21.a:0 "Financiar um serviço nacional de revisão por pares."
 ve_doctrine_journey.21.a.tt:0 "Gastar #N 15#! Visão Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.21.b:0 "Deixar a revisão para as sociedades científicas."
 ve_doctrine_journey.21.b.tt:0 "A Jornada continua sem um recurso imediato ou mudança de progresso."
 ve_doctrine_journey.21.c:0 "Convocar conselhos de revisão interdisciplinares."
 ve_doctrine_journey.21.c.tt:0 "Requer Idéia Acadêmica VII.\nGaste #N 10#! National Insight.\nO progresso da jornada aumenta em #P 4#!."

 ve_doctrine_journey.30.t:0 "A Faculdade de Pessoal"
 ve_doctrine_journey.30.d:0 "O novo colégio de estado-maior deve decidir o que torna um oficial apto para o comando. Os reformadores exigem exames e instrução comum, enquanto os comandantes estabelecidos defendem a antiguidade e o julgamento obtido no serviço de campo."
 ve_doctrine_journey.30.a:0 "Financiar exames nacionais e um currículo comum."
 ve_doctrine_journey.30.a.tt:0 "Gaste #N 15#! National Insight.\nO progresso da jornada aumenta em #P 4#!."
 ve_doctrine_journey.30.b:0 "Equilibrar a antiguidade com as recomendações da faculdade."
 ve_doctrine_journey.30.b.tt:0 "A Jornada continua sem um recurso imediato ou mudança de progresso."
 ve_doctrine_journey.30.c:0 "Rode os oficiais de campo pelas salas de aula do estado-maior."
 ve_doctrine_journey.30.c.tt:0 "Requer a Ideia Profissional do Exército V.\nGaste #N 10#! Insight Nacional.\nO progresso da Jornada aumenta em #P 4#!."
 ve_doctrine_journey.31.t:0 "As Tabelas de Mobilização"
 ve_doctrine_journey.31.d:0 "Os planejadores produziram horários concorrentes para homens, suprimentos e transporte ferroviário. Uma única mesa nacional promete coordenação, mas os comandos regionais alertam que calendários rígidos ignorarão a capacidade local."
 ve_doctrine_journey.31.a:0 "Financiar um gabinete central de mobilização."
 ve_doctrine_journey.31.a.tt:0 "Gastar #N 15#! National Insight.\nO progresso da jornada aumenta em #P 4#!."
 ve_doctrine_journey.31.b:0 "Deixe que os comandos regionais mantenham cronogramas compatíveis."
 ve_doctrine_journey.31.b.tt:0 "A Jornada continua sem um recurso imediato ou mudança de progresso."
 ve_doctrine_journey.31.c:0 "Integre ferrovia, depósito e planejamento de comando."
 ve_doctrine_journey.31.c.tt:0 "Requer Idéia do Exército Profissional VII.\nGaste #N 10#! Perspicácia Nacional.\nO progresso da Jornada aumenta em #P 4#!."
