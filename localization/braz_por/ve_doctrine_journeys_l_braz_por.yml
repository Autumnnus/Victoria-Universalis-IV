 ve_je_doctrine_journey_academic:0 "Uma República de Eruditos"
 ve_je_doctrine_journey_academic_reason:0 "Universidades e sociedades letradas estão prontas para se tornarem uma comunidade nacional de investigação, desde que suas instituições e bases sociais possam sustentá-la."
