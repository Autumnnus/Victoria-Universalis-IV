 ve_je_doctrine_journey_professional_army:0 "Reforma do Estado-Maior"
 ve_je_doctrine_journey_professional_army_reason:0 "Um corpo de oficiais profissional exige mais do que quartéis e comissões. O treinamento, o planejamento e a mobilização devem ser organizados em um sistema de estado-maior duradouro."
 ve_je_doctrine_journey_professional_army_status_both:0 "Progresso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgresso mensal: #P +2#!\n\n#P Escala de Quartéis atingida#!: pelo menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! níveis de Construção de Quartéis.\n#P Doutrina profissional atingida#!: lei de Exército Profissional ou tecnologia de Estado-Maior.\n\nRecompensa de sucesso: #Y Estado-Maior Institucional#! (+7,5% de Taxa de Treinamento, 36 meses). Se o Progresso não alcançar 60 em até 60 meses, a Jornada termina sem recompensa."
