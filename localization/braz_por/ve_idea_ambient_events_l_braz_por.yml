 ve_idea_evt.42.t:0 "A Coligação Fractura"
 ve_idea_evt.42.d:0 "A coligação reformista está dividida quanto a prioridades, timing e liderança. A menos que um programa comum seja restaurado, a energia política organizada irá consolidar-se em campos radicais rivais."
 ve_idea_evt.42.a:0 "Reescrever o programa comum."
 ve_idea_evt.42.a.tt:0 "Gaste #N 25#! National Insight e evite a penalidade reformista."
 ve_idea_evt.42.b:0 "Deixe a divisão entrar na política aberta."
 ve_idea_evt.42.b.tt:0 "Sofrer #N +5%#! Radicais de Movimentos Políticos por 24 meses."
 ve_idea_evt.42.c:0 "Reaplicar a estrutura igualitária."
 ve_idea_evt.42.c.tt:0 "Gastar #N 10#! National Insight e evitar a pena reformista."

 ve_idea_evt.50.t:0 "Antiguidade ou Mérito"
 ve_idea_evt.50.d:0 "O corpo de oficiais está dividido quanto à promoção. Os comandantes superiores defendem a patente por serviço e costume, enquanto os reformadores exigem exames e registos de desempenho que abririam o avanço para capacidades comprovadas."
 ve_idea_evt.50.a:0 "Introduzir exames de mérito."
 ve_idea_evt.50.a.tt:0 "Gaste #N 25#! National Insight e ganhe #P +5%#! Taxa de treinamento por 24 meses. As Forças Armadas perdem #N 1#! aprovação por 24 meses."
 ve_idea_evt.50.b:0 "Preservam o sistema de antiguidade."
 ve_idea_evt.50.b.tt:0 "As Forças Armadas ganham #P +1#! Aprovação por 24 meses, mas a Taxa de Treinamento cai em #N -5%#! por 12 meses."
 ve_idea_evt.50.c:0 "Use os registros de serviço do estado-maior geral."
 ve_idea_evt.50.c.tt:0 "Gaste #N 10#! National Insight e ganhe #P +5%#! Taxa de Treinamento por 24 meses. A aprovação do grupo de interesse não muda."
 ve_idea_evt.51.t:0 "O Grande Exercício da Equipe"
 ve_idea_evt.51.d:0 "Um grande exercício de estado-maior expôs lições valiosas em termos de mobilização, instrução e comando. A expansão do programa poderia difundir essas lições por todo o exército, enquanto o arquivamento dos resultados os preservaria a baixo custo."
 ve_idea_evt.51.a:0 "Expanda o exercício."
 ve_idea_evt.51.a.tt:0 "Gaste #N 40#! National Insight e ganhe #P +5%#! Taxa de treinamento por 36 meses."
