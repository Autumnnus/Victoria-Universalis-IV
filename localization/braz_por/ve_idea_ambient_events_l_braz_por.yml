 ve_idea_evt.32.d:0 "As sociedades rivais reivindicam agora o direito de falar em nome da nação. As suas cerimónias e publicações concorrentes estão a transformar uma linguagem política partilhada numa fonte de queixas."
 ve_idea_evt.32.a:0 "Elabore uma carta comum."
 ve_idea_evt.32.a.tt:0 "Gaste #N 25#! National Insight e evite a penalidade nacionalista."
