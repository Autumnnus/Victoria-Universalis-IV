 ve_doctrine_ambient_ig_supported_mdf:0 "Apoio Institucional"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "O governo deu a este Grupo de Interesse um papel visível na resolução de um debate doutrinário."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Luz Institucional"
