 ve_idea_evt.52.b.tt:0 "Sofra #N -5%#! Taxa de treinamento por 24 meses."
 ve_idea_evt.52.c:0 "Transfira a reserva de pessoal logístico."
 ve_idea_evt.52.c.tt:0 "Gaste #N 10#! National Insight e evite a penalidade militar."
