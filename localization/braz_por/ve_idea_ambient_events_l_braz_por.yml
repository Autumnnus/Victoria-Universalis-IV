 ve_doctrine_professional_army_positive_mdf:0 "Ciclo de Treinamento de Pessoal"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Um programa coordenado de estado-maior está melhorando o sistema de treinamento do exército."
 ve_doctrine_professional_army_negative_mdf:0 "Estrangulamento do Corpo de Oficiais"
