l_braz_por:
 ve_doctrine_ambient_cooldown_mdf:0 "Esfriamento de Debate de Doutrina"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "As instituições do país estão absorvendo as consequências de um debate recente sobre doutrinas."
 ve_doctrine_ambient_ig_supported_mdf:0 "Apoio Institucional"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "O governo concedeu a este Grupo de Interesse um papel visível na solução de um debate de doutrina."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Desprezo Institucional"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "O governo excluiu este Grupo de Interesse de uma resolução recente de doutrina."

 ve_doctrine_industrialist_positive_mdf:0 "Prática Industrial Padronizada"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Os fabricantes estão se beneficiando de um corpo coordenado de práticas industriais."
 ve_doctrine_industrialist_negative_mdf:0 "Gargalos Industriais"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Falhas de coordenação não resolvidas estão limitando a indústria."
 ve_doctrine_academic_positive_mdf:0 "Rede de Pesquisa Coordenada"
 ve_doctrine_academic_positive_mdf_desc:0 "As universidades estão compartilhando métodos, pessoal e resultados por meio de uma rede coordenada."
 ve_doctrine_academic_negative_mdf:0 "Gargalos Acadêmicos"
 ve_doctrine_academic_negative_mdf_desc:0 "Disputas de credenciamento e coordenação estão desorganizando as universidades."
 ve_doctrine_nationalist_positive_mdf:0 "Rede de Associações Nacionais"
 ve_doctrine_nationalist_positive_mdf_desc:0 "As associações nacionais estão convertendo um governo legítimo em maior lealdade."
 ve_doctrine_nationalist_negative_mdf:0 "Sociedades Nacionais Concorrentes"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Organizações nacionais rivais estão transformando a legitimidade política em novas queixas."
 ve_doctrine_reformist_positive_mdf:0 "Rede de Reforma Organizada"
 ve_doctrine_reformist_positive_mdf_desc:0 "Os movimentos políticos obtiveram canais ordenados para participação e compromisso."
 ve_doctrine_reformist_negative_mdf:0 "Coalizão Reformista Fraturada"
 ve_doctrine_reformist_negative_mdf_desc:0 "Organizações reformistas concorrentes estão convertendo a mobilização política em radicalismo."
 ve_doctrine_professional_army_positive_mdf:0 "Ciclo de Treinamento de Estado-Maior"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Um programa coordenado de pessoal está aprimorando o sistema de treinamento do exército."
 ve_doctrine_professional_army_negative_mdf:0 "Gargalo no Corpo de Oficiais"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Disputas de promoção e lotação estão desacelerando o treinamento militar."
 ve_doctrine_agrarian_positive_mdf:0 "Prática Agrícola Coordenada"
 ve_doctrine_agrarian_positive_mdf_desc:0 "As instituições rurais estão difundindo métodos confiáveis por toda a economia agrícola."
 ve_doctrine_agrarian_negative_mdf:0 "Escassez de Suprimentos Agrícolas"
 ve_doctrine_agrarian_negative_mdf_desc:0 "A escassez de sementes, crédito e coordenação está reduzindo o rendimento agrícola."

 ve_idea_evt.10.t:0 "Códigos de Segurança em Plena Produção"
 ve_idea_evt.10.d:0 "Uma série de acidentes fabris trouxe a questão da inspeção industrial para o centro das discussões. Inspetores independentes prometem padrões confiáveis, enquanto os fabricantes insistem que regras voluntárias preservarão a produção e a iniciativa."
 ve_idea_evt.10.a:0 "Nomear inspetores independentes."
 ve_idea_evt.10.a.tt:0 "Gastar #N 25#! de Visão Nacional. Os Sindicatos ganham #P +1#! de Aprovação e os Industrialistas perdem #N 1#! de Aprovação por 24 meses."
 ve_idea_evt.10.b:0 "Deixar que as indústrias redijam códigos voluntários."
 ve_idea_evt.10.b.tt:0 "Os Industrialistas ganham #P +1#! de Aprovação e os Sindicatos perdem #N 1#! de Aprovação por 24 meses."
 ve_idea_evt.10.c:0 "Padronizar as regras em etapas."
 ve_idea_evt.10.c.tt:0 "Gastar #N 10#! de Visão Nacional. Nenhuma alteração na Aprovação do Grupo de Interesse."

 ve_idea_evt.11.t:0 "Peças de Máquinas Padronizadas"
 ve_idea_evt.11.d:0 "Engenheiros de vários distritos industriais produziram um catálogo comum de calibres, conexões e peças de máquinas. Financiar um padrão nacional seria custoso, mas poderia remover atritos em toda a rede de fabricação."
 ve_idea_evt.11.a:0 "Adotar os padrões em âmbito nacional."
 ve_idea_evt.11.a.tt:0 "Gastar #N 40#! de Visão Nacional e obter #P +5%#! de Rendimento de Manufatura por 36 meses."
 ve_idea_evt.11.b:0 "Arquivar as descobertas para mais tarde."
 ve_idea_evt.11.b.tt:0 "Obter #P 15#! de Visão Nacional."
 ve_idea_evt.11.c:0 "Nossas redes de produção já estão preparadas."
 ve_idea_evt.11.c.tt:0 "Gastar #N 20#! de Visão Nacional e obter #P +5%#! de Rendimento de Manufatura por 36 meses."

 ve_idea_evt.12.t:0 "O Gargalo nas Obras"
 ve_idea_evt.12.d:0 "Ordens estão se acumulando enquanto procedimentos incompatíveis, componentes atrasados e cronogramas confusos sufocam as fábricas do país. O governo pode enviar especialistas, deixar o problema para as empresas ou usar escritórios de construção estabelecidos para coordenar uma resposta."
 ve_idea_evt.12.a:0 "Despachar uma equipe de especialistas."
 ve_idea_evt.12.a.tt:0 "Gastar #N 25#! de Visão Nacional e evitar a penalidade industrial."
 ve_idea_evt.12.b:0 "As fábricas devem resolver isso sozinhas."
 ve_idea_evt.12.b.tt:0 "Sofre #N -5%#! de Rendimento de Manufatura por 24 meses."
 ve_idea_evt.12.c:0 "Ativar os departamentos de construção."
 ve_idea_evt.12.c.tt:0 "Gastar #N 10#! de Visão Nacional e evitar a penalidade industrial."

 ve_idea_evt.60.t:0 "Mecanização e Posse da Terra"
 ve_idea_evt.60.d:0 "Novas máquinas poderiam elevar a produção agrícola, mas arrendatários e pequenos proprietários temem que uma transição rápida desarraigue os meios de subsistência rurais. O governo deve decidir se acelera a mecanização, protege a posse primeiro ou coordena uma transição local gradual."
 ve_idea_evt.60.a:0 "Criar um fundo de mecanização."
 ve_idea_evt.60.a.tt:0 "Gastar #N 25#! de Visão Nacional e obter #P +5%#! de Rendimento de Agricultura por 24 meses. Os Industrialistas ganham #P +1#! de Aprovação e a Comunidade Rural perde #N 1#! de Aprovação por 24 meses."
 ve_idea_evt.60.b:0 "Garantir os arrendatários antes de mudar as fazendas."
 ve_idea_evt.60.b.tt:0 "A Comunidade Rural ganha #P +1#! de Aprovação e os Latifundiários perdem #N 1#! de Aprovação por 24 meses."
 ve_idea_evt.60.c:0 "Usar redes de produção locais para uma transição gradual."
 ve_idea_evt.60.c.tt:0 "Gastar #N 10#! de Visão Nacional e obter #P +5%#! de Rendimento de Agricultura por 24 meses. Nenhuma mudança na Aprovação de Grupo de Interesse."

 ve_idea_evt.61.t:0 "Celeiros Cooperativos"
 ve_idea_evt.61.d:0 "Delegados rurais demonstraram uma rede de celeiros cooperativos capaz de compartilhar reservas, registros e transporte. Um programa nacional poderia fortalecer a coordenação agrícola, enquanto simplesmente preservar os planos ainda enriqueceria o conhecimento institucional do governo."
 ve_idea_evt.61.a:0 "Financiar a rede cooperativa."
 ve_idea_evt.61.a.tt:0 "Gastar #N 40#! de Visão Nacional e obter #P +5%#! de Rendimento de Agricultura por 36 meses."
 ve_idea_evt.61.b:0 "Distribuir os registros aos escritórios agrícolas."
 ve_idea_evt.61.b.tt:0 "Obter #P 15#! de Visão Nacional."
 ve_idea_evt.61.c:0 "Usar as instituições rurais já existentes."
 ve_idea_evt.61.c.tt:0 "Gastar #N 20#! de Visão Nacional e obter #P +5%#! de Rendimento de Agricultura por 36 meses."

 ve_idea_evt.62.t:0 "Escassez de Sementes e Crédito"
 ve_idea_evt.62.d:0 "Estoques de sementes ruins e o arrocho do crédito rural ameaçam o próximo ciclo agrícola. Especialistas podem organizar uma resposta de emergência, redes locais podem ser deixadas para improvisar, ou instituições de subsistência estabelecidas podem carregar o fardo temporariamente."
 ve_idea_evt.62.a:0 "Organizar um programa de especialização de emergência."
 ve_idea_evt.62.a.tt:0 "Gastar #N 25#! de Visão Nacional e evitar a penalidade agrícola."
 ve_idea_evt.62.b:0 "Deixar que as redes locais encontrem sua própria solução."
 ve_idea_evt.62.b.tt:0 "Sofre #N -5%#! de Rendimento de Agricultura por 24 meses."
 ve_idea_evt.62.c:0 "Usar redes de subsistência como suporte temporário."
 ve_idea_evt.62.c.tt:0 "Gastar #N 10#! de Visão Nacional e evitar a penalidade agrícola."

 ve_idea_evt.20.t:0 "Patrocínio ou Revisão por Pares"
 ve_idea_evt.20.d:0 "O governo espera resultados práticos de suas bolsas de pesquisa, enquanto acadêmicos alertam que o patrocínio substituirá as evidências pela conveniência política. Um acordo duradouro deve definir quem julga o saber do país."
 ve_idea_evt.20.a:0 "Estabelecer comitês de revisão independentes."
 ve_idea_evt.20.a.tt:0 "Gastar #N 25#! Visão Nacional. A Elite Intelectual ganha #P +1#! Aprovação e a Pequena Burguesia perde #N 1#! Aprovação por 24 meses."
 ve_idea_evt.20.b:0 "Deixar o governo definir as prioridades de pesquisa."
 ve_idea_evt.20.b.tt:0 "A Pequena Burguesia ganha #P +1#! Aprovação e a Elite Intelectual perde #N 1#! Aprovação por 24 meses."
 ve_idea_evt.20.c:0 "Institucionalizar padrões acadêmicos comuns."
 ve_idea_evt.20.c.tt:0 "Gastar #N 10#! Visão Nacional. Nenhuma mudança na Aprovação do Grupo de Interesse."
 ve_idea_evt.21.t:0 "Uma Rede de Pesquisa Provincial"
 ve_idea_evt.21.d:0 "Faculdades provinciais começaram a trocar conferencistas, instrumentos e descobertas sem direção central. O apoio formal poderia transformar essa cooperação improvisada em uma rede de pesquisa nacional."
 ve_idea_evt.21.a:0 "Financiar a rede."
 ve_idea_evt.21.a.tt:0 "Gastar #N 40#! Visão Nacional e ganhar #P +5%#! Rendimento de Universidade por 36 meses."
 ve_idea_evt.21.b:0 "Colocar os relatórios no arquivo central."
 ve_idea_evt.21.b.tt:0 "Ganhar #P 15#! Visão Nacional."
 ve_idea_evt.21.c:0 "Conectá-la à academia nacional."
 ve_idea_evt.21.c.tt:0 "Gastar #N 20#! Visão Nacional e ganhar #P +5%#! Rendimento de Universidade por 36 meses."
 ve_idea_evt.22.t:0 "O Gargalo de Credenciamento"
 ve_idea_evt.22.d:0 "As universidades não conseguem avaliar rapidamente o crescente número de estudantes, instrutores e novas disciplinas. Credenciamentos atrasados agora ameaçam o sistema de pesquisa mais amplo."
 ve_idea_evt.22.a:0 "Expandir capacidade de avaliação."
 ve_idea_evt.22.a.tt:0 "Gastar #N 25#! Visão Nacional e evitar a penalidade acadêmica."
 ve_idea_evt.22.b:0 "As instituições existentes devem lidar com isso."
 ve_idea_evt.22.b.tt:0 "Sofrer #N -5%#! Rendimento de Universidade por 24 meses."
 ve_idea_evt.22.c:0 "Padronizar por meio da rede escolar."
 ve_idea_evt.22.c.tt:0 "Gastar #N 10#! Visão Nacional e evitar a penalidade acadêmica."

 ve_idea_evt.30.t:0 "Um Cânone, Muitas Tradições"
 ve_idea_evt.30.d:0 "Autoridades preparando um cânone nacional discordam sobre o lugar dos costumes provinciais. Um relato único promete clareza, mas excluir as tradições locais pode enfraquecer a própria nação que pretende definir."
 ve_idea_evt.30.a:0 "Tecer tradições locais na história comum."
 ve_idea_evt.30.a.tt:0 "Gastar #N 25#! Visão Nacional. A Comunidade Rural ganha #P +1#! Aprovação e a Pequena Burguesia perde #N 1#! Aprovação por 24 meses."
 ve_idea_evt.30.b:0 "Proclamar um cânone oficial."
 ve_idea_evt.30.b.tt:0 "A Pequena Burguesia ganha #P +1#! Aprovação e a Comunidade Rural perde #N 1#! Aprovação por 24 meses."
 ve_idea_evt.30.c:0 "Confiar o trabalho a quadros culturais treinados."
 ve_idea_evt.30.c.tt:0 "Gastar #N 10#! Visão Nacional. Nenhuma mudança na Aprovação do Grupo de Interesse."
 ve_idea_evt.31.t:0 "Associações Nacionais de Veteranos"
 ve_idea_evt.31.d:0 "Veteranos organizaram associações que unem cerimônia, ajuda mútua e lealdade ao Estado. A rede deles poderia ser expandida nacionalmente ou estudada sem conceder-lhe uma função oficial."
 ve_idea_evt.31.a:0 "Apoiar as associações nacionalmente."
 ve_idea_evt.31.a.tt:0 "Gastar #N 40#! Visão Nacional e ganhar #P +5%#! Lealistas de Legitimidade por 36 meses."
 ve_idea_evt.31.b:0 "Registrar a experiência deles nos arquivos do Estado."
 ve_idea_evt.31.b.tt:0 "Ganhar #P 15#! Visão Nacional."
 ve_idea_evt.31.c:0 "Usar as redes nacionais já estabelecidas."
 ve_idea_evt.31.c.tt:0 "Gastar #N 20#! Visão Nacional e ganhar #P +5%#! Lealistas de Legitimidade por 36 meses."
 ve_idea_evt.32.t:0 "Sociedades Nacionais Concorrentes"
 ve_idea_evt.32.d:0 "Sociedades rivais agora reivindicam o direito de falar pela nação. Suas cerimônias e publicações concorrentes estão transformando uma linguagem política compartilhada em uma fonte de ressentimento."
 ve_idea_evt.32.a:0 "Redigir uma carta comum."
 ve_idea_evt.32.a.tt:0 "Gastar #N 25#! Visão Nacional e evitar a penalidade nacionalista."
 ve_idea_evt.32.b:0 "A competição encontrará seus próprios limites."
 ve_idea_evt.32.b.tt:0 "Sofre #N +5%#! Radicais de Legitimidade por 24 meses."
 ve_idea_evt.32.c:0 "Deixar as instituições nacionais arbitrarem."
 ve_idea_evt.32.c.tt:0 "Gastar #N 10#! Visão Nacional e evitar a penalidade nacionalista."

 ve_idea_evt.40.t:0 "Comitê ou Rua"
 ve_idea_evt.40.d:0 "Reformistas estão divididos entre comissões de especialistas e pressão de massa. Comitês prometem legislação coerente, enquanto movimentos organizados insistem que a reforma sem força pública será adiada indefinidamente."
 ve_idea_evt.40.a:0 "Criar uma comissão de reforma independente."
 ve_idea_evt.40.a.tt:0 "Gastar #N 25#! Visão Nacional. A Elite Intelectual ganha #P +1#! Aprovação e os Sindicatos perdem #N 1#! Aprovação por 24 meses."
 ve_idea_evt.40.b:0 "Dar margem para os movimentos agirem."
 ve_idea_evt.40.b.tt:0 "Os Sindicatos ganham #P +1#! Aprovação e os Industrialistas perdem #N 1#! Aprovação por 24 meses."
 ve_idea_evt.40.c:0 "Aplicar a estrutura estabelecida de direitos e procedimentos."
 ve_idea_evt.40.c.tt:0 "Gastar #N 10#! Visão Nacional. Nenhuma alteração na Aprovação do Grupo de Interesse."
 ve_idea_evt.41.t:0 "A Rede de Petições"
 ve_idea_evt.41.d:0 "Petições locais tornaram-se uma rede nacional coordenada capaz de triar reclamações e propor reformas. O governo pode reconhecê-la como um canal consultivo ou preservar seus métodos para uso posterior."
 ve_idea_evt.41.a:0 "Transformar a rede em consulta formal."
 ve_idea_evt.41.a.tt:0 "Gastar #N 40#! Visão Nacional e ganhar #P +5%#! Lealistas de Movimentos Políticos por 36 meses."
 ve_idea_evt.41.b:0 "Arquivar as demandas no acervo de revisões."
 ve_idea_evt.41.b.tt:0 "Ganhar #P 15#! Visão Nacional."
 ve_idea_evt.41.c:0 "Utilizar as organizações de reforma já estabelecidas."
 ve_idea_evt.41.c.tt:0 "Gastar #N 20#! Visão Nacional e ganhar #P +5%#! Lealistas de Movimentos Políticos por 36 meses."
 ve_idea_evt.42.t:0 "A Coalizão Fratura"
 ve_idea_evt.42.d:0 "A coalizão reformista está se dividindo por causa de prioridades, prazos e liderança. A menos que um programa comum seja restaurado, a energia política organizada endurecerá em campos radicais rivais."
 ve_idea_evt.42.a:0 "Reescrever o programa comum."
 ve_idea_evt.42.a.tt:0 "Gastar #N 25#! Visão Nacional e evitar a penalidade reformista."
 ve_idea_evt.42.b:0 "Deixar a divisão entrar na política aberta."
 ve_idea_evt.42.b.tt:0 "Sofre #N +5%#! Radicais de Movimentos Políticos por 24 meses."
 ve_idea_evt.42.c:0 "Reaplicar a estrutura igualitária."
 ve_idea_evt.42.c.tt:0 "Gastar #N 10#! Visão Nacional e evitar a penalidade reformista."

 ve_idea_evt.50.t:0 "Antiguidade ou Mérito"
 ve_idea_evt.50.d:0 "O corpo de oficiais está dividido sobre promoções. Comandantes seniores defendem o ranque por tempo de serviço e costume, enquanto reformistas exigem exames e registros de desempenho que abram o avanço à habilidade comprovada."
 ve_idea_evt.50.a:0 "Introduzir exames de mérito."
 ve_idea_evt.50.a.tt:0 "Gastar #N 25#! Visão Nacional e ganhar #P +5%#! Taxa de Treinamento por 24 meses. As Forças Armadas perdem #N 1#! Aprovação por 24 meses."
 ve_idea_evt.50.b:0 "Preservar o sistema de antiguidade."
 ve_idea_evt.50.b.tt:0 "As Forças Armadas ganham #P +1#! Aprovação por 24 meses, mas a Taxa de Treinamento cai em #N -5%#! por 12 meses."
 ve_idea_evt.50.c:0 "Usar os registros de serviço do estado-maior."
 ve_idea_evt.50.c.tt:0 "Gastar #N 10#! Visão Nacional e ganhar #P +5%#! Taxa de Treinamento por 24 meses. A Aprovação do Grupo de Interesse não se altera."
 ve_idea_evt.51.t:0 "O Grande Exercício do Estado-Maior"
 ve_idea_evt.51.d:0 "Um grande exercício de estado-maior revelou lições valiosas em mobilização, instrução e comando. Expandir o programa poderia difundir essas lições por todo o exército, enquanto arquivar as conclusões as preservaria a baixo custo."
 ve_idea_evt.51.a:0 "Expandir o exercício."
 ve_idea_evt.51.a.tt:0 "Gasta #N 40#! de Visão Nacional e concede #P +5%#! de Taxa de Treinamento por 36 meses."
 ve_idea_evt.51.b:0 "Arquivar as conclusões no repositório de doutrinas."
 ve_idea_evt.51.b.tt:0 "Concede #P 15#! de Visão Nacional."
 ve_idea_evt.51.c:0 "Utilizar a rede de comando profissional."
 ve_idea_evt.51.c.tt:0 "Gasta #N 20#! de Visão Nacional e concede #P +5%#! de Taxa de Treinamento por 36 meses."
 ve_idea_evt.52.t:0 "Um Gargalo no Corpo de Oficiais"
 ve_idea_evt.52.d:0 "O exército está se expandindo mais rápido do que seus instrutores e oficiais de estado-maior podem ser preparados. Os cronogramas de treinamento agora dependem de um grupo restrito de quadros exaustos."
 ve_idea_evt.52.a:0 "Expandir o quadro de treinamento."
 ve_idea_evt.52.a.tt:0 "Gasta #N 25#! de Visão Nacional e evita a penalidade militar."
 ve_idea_evt.52.b:0 "Exigir mais dos quadros existentes."
 ve_idea_evt.52.b.tt:0 "Sofre #N -5%#! de Taxa de Treinamento por 24 meses."
 ve_idea_evt.52.c:0 "Transferir a reserva do pessoal logístico."
 ve_idea_evt.52.c.tt:0 "Gasta #N 10#! de Visão Nacional e evita a penalidade militar."
