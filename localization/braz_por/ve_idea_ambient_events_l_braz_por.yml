 ve_idea_evt.32.c:0 "Deixe as instituições nacionais arbitrar."
 ve_idea_evt.32.c.tt:0 "Gaste #N 10#! National Insight e evite a penalidade nacionalista."

 ve_idea_evt.40.t:0 "Comitê ou Rua"
 ve_idea_evt.40.d:0 "Os reformadores estão divididos entre comissões de especialistas e pressão das massas. Os comités prometem legislação coerente, enquanto os movimentos organizados insistem que a reforma sem força pública será adiada indefinidamente."
 ve_idea_evt.40.a:0 "Criar uma comissão de reforma independente."
 ve_idea_evt.40.a.tt:0 "Gastar #N 25#! National Insight. A Intelligentsia ganha #P +1#! aprovação e os sindicatos perdem #N 1#! aprovação por 24 meses."
 ve_idea_evt.40.b:0 "Dê aos movimentos espaço para agir."
 ve_idea_evt.40.b.tt:0 "Os sindicatos ganham #P +1#! A aprovação e os industriais perdem #N 1#! aprovação por 24 meses."
 ve_idea_evt.40.c:0 "Aplicar a estrutura estabelecida de direitos e procedimentos."
 ve_idea_evt.40.c.tt:0 "Gaste #N 10#! National Insight. Nenhuma mudança na aprovação dos grupos de interesse."
 ve_idea_evt.41.t:0 "A Rede de Petições"
 ve_idea_evt.41.d:0 "As petições locais tornaram-se uma rede nacional coordenada capaz de classificar queixas e propor reformas. O governo pode reconhecê-la como um canal consultivo ou preservar seus métodos para uso posterior."
 ve_idea_evt.41.a:0 "Transformar a rede em consulta formal."
 ve_idea_evt.41.a.tt:0 "Gastar #N 40#! Insight Nacional e ganhe #P +5%#! Lealistas de Movimentos Políticos por 36 meses."
