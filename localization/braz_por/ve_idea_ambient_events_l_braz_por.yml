 ve_idea_evt.51.c.tt:0 "Gaste #N 20#! National Insight e ganhe #P +5%#! Taxa de treinamento por 36 meses."
 ve_idea_evt.52.t:0 "Um Gargalo no Corpo de Oficiais"
 ve_idea_evt.52.d:0 "O exército está se expandindo mais rápido do que seus instrutores e oficiais de estado-maior podem ser preparados. Os cronogramas de treinamento agora dependem de um grupo restrito de quadros exaustos."
 ve_idea_evt.52.a:0 "Expandir o quadro de treinamento."
 ve_idea_evt.52.a.tt:0 "Gaste #N 25#! National Insight e evite a penalidade militar."
