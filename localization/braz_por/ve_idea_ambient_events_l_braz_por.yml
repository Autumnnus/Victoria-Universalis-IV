 ve_doctrine_agrarian_negative_mdf_desc:0 "Escassez de sementes, crédito e coordenação estão a reduzir o rendimento agrícola."

 ve_idea_evt.10.t:0 "Códigos de segurança em saída total"
 ve_idea_evt.10.d:0 "Uma série de acidentes fabris trouxe à tona a questão da inspeção industrial. Os inspectores independentes prometem normas credíveis, enquanto os fabricantes insistem que as regras voluntárias preservarão a produção e a iniciativa."
 ve_idea_evt.10.a:0 "Nomear inspetores independentes."
 ve_idea_evt.10.a.tt:0 "Gastar #N 25#! Visão Nacional. Os Sindicatos ganham #P +1#! Aprovação e os Industriais perdem #N 1#! Aprovação por 24 meses."
 ve_idea_evt.10.b:0 "Deixe as indústrias escreverem códigos voluntários."
 ve_idea_evt.10.b.tt:0 "Os Industriais ganham #P +1#! Aprovação e os Sindicatos perdem #N 1#! Aprovação por 24 meses."
 ve_idea_evt.10.c:0 "Padronize as regras em etapas."
 ve_idea_evt.10.c.tt:0 "Gaste #N 10#! National Insight. Nenhuma alteração na aprovação do grupo de interesse."

 ve_idea_evt.11.t:0 "Peças de máquinas padronizadas"
 ve_idea_evt.11.d:0 "Engenheiros de vários distritos industriais produziram um catálogo comum de medidores, acessórios e peças de máquinas. Financiar uma norma nacional seria dispendioso, mas poderia eliminar o atrito em toda a rede de produção."
 ve_idea_evt.11.a:0 "Adote os padrões em todo o país."
 ve_idea_evt.11.a.tt:0 "Gaste #N 40#! National Insight e ganhe #P +5%#! Produto de Fabricação por 36 meses."
 ve_idea_evt.11.b:0 "Arquive as descobertas para mais tarde."
 ve_idea_evt.11.b.tt:0 "Ganhe #P 15#! National Insight."
 ve_idea_evt.11.c:0 "Nossas redes de produção já estão preparadas."
 ve_idea_evt.11.c.tt:0 "Gaste #N 20#! National Insight e ganhe #P +5%#! Produto de Fabricação por 36 meses."

 ve_idea_evt.12.t:0 "O Gargalo nas Obras"
 ve_idea_evt.12.d:0 "Os pedidos estão se acumulando enquanto procedimentos incompatíveis, componentes atrasados ​​e cronogramas confusos sufocam as fábricas do país. O governo pode enviar especialistas, deixar o problema para as empresas ou utilizar escritórios de construção estabelecidos para coordenar uma resposta."
 ve_idea_evt.12.a:0 "Envie uma equipe especializada."
 ve_idea_evt.12.a.tt:0 "Gaste #N 25#! National Insight e evite a penalidade industrial."
 ve_idea_evt.12.b:0 "As fábricas devem resolver isso sozinhas."
 ve_idea_evt.12.b.tt:0 "Sofrem #N -5%#! Produto de fabricação por 24 meses."
 ve_idea_evt.12.c:0 "Ativem as agências de construção."
 ve_idea_evt.12.c.tt:0 "Gastem #N 10#! Visão Nacional e evitar a penalidade industrial."

 ve_idea_evt.60.t:0 "Mecanização e Posse"
 ve_idea_evt.60.d:0 "Novas máquinas poderiam aumentar a produção agrícola, mas os arrendatários e os pequenos proprietários temem que uma transição rápida erradicará os meios de subsistência rurais. O governo deve decidir se acelera a mecanização, protege primeiro a posse ou coordena uma transição local gradual."
 ve_idea_evt.60.a:0 "Criar um fundo de mecanização."
 ve_idea_evt.60.a.tt:0 "Gastar #N 25#! Insight nacional e ganho #P +5%#! Produção agrícola por 24 meses. Os industriais ganham #P +1#! Aprovação e o povo rural perde #N 1#! Aprovação por 24 meses."
 ve_idea_evt.60.b:0 "Garanta os inquilinos antes de mudar de fazenda."
 ve_idea_evt.60.b.tt:0 "O Povo Rural ganha #P +1#! Aprovação e os Proprietários de Terra perdem #N 1#! Aprovação por 24 meses."
 ve_idea_evt.60.c:0 "Use redes de produção locais para uma transição gradual."
 ve_idea_evt.60.c.tt:0 "Gaste #N 10#! Insight Nacional e ganhe #P +5%#! Produto Agrícola por 24 meses. Nenhuma alteração na aprovação do grupo de interesse."

 ve_idea_evt.61.t:0 "Celeiros Cooperativos"
 ve_idea_evt.61.d:0 "Os delegados rurais demonstraram uma rede de celeiros cooperativos capazes de partilhar reservas, registos e transporte. Um programa nacional poderia reforçar a coordenação agrícola, mas a simples preservação dos planos ainda enriqueceria o conhecimento institucional do governo."
 ve_idea_evt.61.a:0 "Financiar a rede cooperativa."
 ve_idea_evt.61.a.tt:0 "Gaste #N 40#! National Insight e ganhe #P +5%#! Produto Agrícola por 36 meses."
 ve_idea_evt.61.b:0 "Distribua os registros aos escritórios agrícolas."
 ve_idea_evt.61.b.tt:0 "Ganhe #P 15#! Percepção Nacional."
 ve_idea_evt.61.c:0 "Use as instituições rurais já existentes."
 ve_idea_evt.61.c.tt:0 "Gaste #N 20#! Visão e ganho nacional #P +5%#! Produto Agrícola por 36 meses."

 ve_idea_evt.62.t:0 "Escassez de sementes e crédito"
 ve_idea_evt.62.d:0 "As fracas reservas de sementes e a restrição do crédito rural ameaçam o próximo ciclo agrícola. Os especialistas podem organizar uma resposta de emergência, as redes locais podem ser deixadas à improvisação ou as instituições de subsistência estabelecidas podem suportar temporariamente o fardo."
 ve_idea_evt.62.a:0 "Organize um programa de especialização em emergências."
 ve_idea_evt.62.a.tt:0 "Gaste #N 25#! National Insight e evite a penalidade agrícola."
 ve_idea_evt.62.b:0 "Deixe as redes locais encontrarem sua própria solução."
 ve_idea_evt.62.b.tt:0 "Sofra #N -5%#! Produto Agrícola por 24 meses."
 ve_idea_evt.62.c:0 "Use redes de subsistência como uma espinha dorsal temporária."
 ve_idea_evt.62.c.tt:0 "Gaste #N 10#! National Insight e evite a penalidade agrícola."

 ve_idea_evt.20.t:0 "Mecenato ou Revisão por Pares"
 ve_idea_evt.20.d:0 "O governo espera resultados práticos das suas bolsas de investigação, enquanto os académicos alertam que o mecenato substituirá as provas por conveniência política. Um acordo duradouro deve definir quem julga a aprendizagem do país."
 ve_idea_evt.20.a:0 "Estabelecer conselhos de revisão independentes."
 ve_idea_evt.20.a.tt:0 "Gastar #N 25#! National Insight. O ganho da intelectualidade #P +1#! Aprovação e a Pequena Burguesia perde #N 1#! Aprovação por 24 meses."
 ve_idea_evt.20.b:0 "Deixe o estado definir as prioridades de pesquisa."
 ve_idea_evt.20.b.tt:0 "A Pequena Burguesia ganha #P +1#! Aprovação e a Intelligentsia perde #N 1#! Aprovação por 24 meses."
 ve_idea_evt.20.c:0 "Institucionalize padrões acadêmicos comuns."
 ve_idea_evt.20.c.tt:0 "Gaste #N 10#! National Insight. Nenhuma mudança na aprovação do grupo de interesse."
 ve_idea_evt.21.t:0 "Uma Rede Provincial de Pesquisa"
 ve_idea_evt.21.d:0 "As faculdades provinciais começaram a trocar palestrantes, instrumentos e descobertas sem direção central. O apoio formal poderia transformar esta cooperação improvisada numa rede nacional de investigação."
 ve_idea_evt.21.a:0 "Financiar a rede."
 ve_idea_evt.21.a.tt:0 "Gaste #N 40#! National Insight e ganhe #P +5%#! Rendimento Universitário por 36 meses."
