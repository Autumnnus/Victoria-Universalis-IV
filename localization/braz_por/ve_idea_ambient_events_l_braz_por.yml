 ve_doctrine_industrialist_negative_mdf:0 "Industrial Gargalos"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Falhas de coordenação não resolvidas estão restringindo a produção."
 ve_doctrine_academic_positive_mdf:0 "Rede de Pesquisa Coordenada"
 ve_doctrine_academic_positive_mdf_desc:0 "As universidades estão compartilhando métodos, pessoal e resultados através de uma rede coordenada."
 ve_doctrine_academic_negative_mdf:0 "Gargalos Acadêmicos"
 ve_doctrine_academic_negative_mdf_desc:0 "Disputas de credenciais e coordenação estão perturbando as universidades."
 ve_doctrine_nationalist_positive_mdf:0 "Rede de Associação Nacional"
 ve_doctrine_nationalist_positive_mdf_desc:0 "As associações nacionais estão traduzindo o governo legítimo em lealdade mais ampla."
 ve_doctrine_nationalist_negative_mdf:0 "Sociedades Nacionais Concorrentes"
