 ve_idea_evt.21.b.tt:0 "Ganhe #P 15#! National Insight."
 ve_idea_evt.21.c:0 "Conecte-o à academia nacional."
 ve_idea_evt.21.c.tt:0 "Gaste #N 20#! Insight nacional e ganho #P +5%#! Produção universitária por 36 meses."
 ve_idea_evt.22.t:0 "O Gargalo de Credenciais"
 ve_idea_evt.22.d:0 "As universidades não conseguem avaliar o número crescente de estudantes, instrutores e novas disciplinas com rapidez suficiente. Credenciais atrasadas ameaçam agora o sistema de investigação mais amplo."
 ve_idea_evt.22.a:0 "Expandir a capacidade de avaliação."
 ve_idea_evt.22.a.tt:0 "Gaste #N 25#! National Insight e evite a penalidade acadêmica."
 ve_idea_evt.22.b:0 "As instituições existentes devem lidar com isso."
 ve_idea_evt.22.b.tt:0 "Sofrer #N -5%#! Rendimento Universitário por 24 meses."
 ve_idea_evt.22.c:0 "Padronize através da rede escolar."
 ve_idea_evt.22.c.tt:0 "Gaste #N 10#! National Insight e evite a penalidade acadêmica."

 ve_idea_evt.30.t:0 "Um Cânone, Muitas Tradições"
 ve_idea_evt.30.d:0 "As autoridades que preparam um cânone nacional discordam sobre o lugar dos costumes provinciais. Um único relato promete clareza, mas excluir as tradições locais pode enfraquecer a própria nação que pretende definir."
 ve_idea_evt.30.a:0 "Incorpore as tradições locais na história comum."
 ve_idea_evt.30.a.tt:0 "Gaste #N 25#! National Insight. O povo rural ganha #P +1#! Aprovação e a Pequena Burguesia perde #N 1#! Aprovação por 24 meses."
 ve_idea_evt.30.b:0 "Proclama um cânone oficial."
 ve_idea_evt.30.b.tt:0 "A Pequena Burguesia ganha #P +1#! Aprovação e o Povo Rural perde #N 1#! Aprovação por 24 meses."
 ve_idea_evt.30.c:0 "Confie o trabalho a quadros culturais treinados."
 ve_idea_evt.30.c.tt:0 "Gaste #N 10#! Nacionais Visão. Nenhuma alteração na aprovação do grupo de interesse."
 ve_idea_evt.31.t:0 "Associações Nacionais de Veteranos"
 ve_idea_evt.31.d:0 "Os veteranos organizaram associações que vinculam cerimônia, ajuda mútua e lealdade ao estado. Sua rede poderia ser expandida em todo o país ou estudada sem conceder-lhe um papel oficial."
 ve_idea_evt.31.a:0 "Apoie as associações em todo o país."
 ve_idea_evt.31.a.tt:0 "Gaste #N 40#! Insight Nacional e ganhe #P +5%#! Lealistas da Legitimidade por 36 meses."
