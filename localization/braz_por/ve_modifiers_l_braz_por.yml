 ve_composite_identity_mdf_desc:0 "O Estado equilibra diversos povos por meio de Instituições negociadas e administrativas."
 ve_ethnic_high_cohesion_mdf:0 "Comunidade Nacional Mobilizada"
 ve_ethnic_high_cohesion_mdf_desc:0 "Uma Nação Étnica coesa pode Mobilizar sua População e conferir Legitimidade ao Estado."
 ve_civic_high_cohesion_mdf:0 "Sociedade Cívica Confiante"
 ve_civic_high_cohesion_mdf_desc:0 "Instituições cívicas compartilhadas criam Legitimidade e mobilidade social."
 ve_composite_high_cohesion_mdf:0 "Pacto Imperial Estável"
 ve_composite_high_cohesion_mdf_desc:0 "Um pacto estável entre os povos do Estado fortalece a Legitimidade e a diplomacia."
