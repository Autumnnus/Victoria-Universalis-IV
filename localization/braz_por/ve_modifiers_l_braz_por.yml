 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "Nação Étnica"
 ve_ethnic_identity_mdf_desc:0 "O estado define adesão política em torno de suas culturas primárias."
 ve_civic_identity_mdf:0 "Nação Cívica"
 ve_civic_identity_mdf_desc:0 "O estado define a adesão política através de instituições comuns e cidadania."
 ve_composite_identity_mdf:0 "Estado Composto"
 ve_composite_identity_mdf_desc:0 "O estado equilibra vários povos através de instituições negociadas e administrativas."
 ve_ethnic_high_cohesion_mdf:0 "Comunidade Nacional Mobilizada"
 ve_ethnic_high_cohesion_mdf_desc:0 "Uma nação étnica coesa pode mobilizar a sua população e legitimar o estado."
 ve_civic_high_cohesion_mdf:0 "Sociedade Cívica Confiante"
 ve_civic_high_cohesion_mdf_desc:0 "Instituições cívicas partilhadas criam legitimidade e mobilidade social."
 ve_composite_high_cohesion_mdf:0 "Pacto Imperial Estável"
 ve_composite_high_cohesion_mdf_desc:0 "Um pacto estável entre os povos do estado fortalece legitimidade e diplomacia."
 ve_low_national_cohesion_mdf:0 "Baixa Coesão Nacional"
 ve_low_national_cohesion_mdf_desc:0 "A definição de nação do estado está perdendo legitimidade."
 ve_identity_transition_backlash_mdf:0 "Reação de Transição de Identidade"
 ve_identity_transition_backlash_mdf_desc:0 "Instituições e comunidades resistem à redefinição da nação."
 ve_cultural_project_administration_mdf:0 "Administração de Projetos Culturais"
 ve_cultural_project_administration_mdf_desc:0 "Funcionários e capital político estão comprometidos com o Projeto Cultural ativo."
 ve_cultural_project_backlash_mdf:0 "Projeto Cultural Abandonado"
 ve_cultural_project_backlash_mdf_desc:0 "O abandono abrupto de um programa cultural prejudicou a confiança pública e a coordenação administrativa."
 ve_national_curriculum_result_mdf:0 "Nacional Currículo"
 ve_national_curriculum_result_mdf_desc:0 "Um currículo comum expande a educação e as qualificações, embora mantê-lo consuma burocracia."
 ve_shared_symbols_result_mdf:0 "Símbolos Nacionais Compartilhados"
 ve_shared_symbols_result_mdf_desc:0 "Rituais e símbolos cívicos compartilhados reforçam a lealdade e a autoridade do estado."
 ve_ethnic_campaign_active_mdf:0 "Campanha de Integração Étnica"
 ve_ethnic_campaign_active_mdf_desc:0 "O estado está acelerando ativamente a assimilação, provocando resistência ao apagamento cultural."
 ve_ethnic_campaign_result_mdf:0 "Programa de Assimilação"
 ve_ethnic_campaign_result_mdf_desc:0 "Uma campanha de integração concluída continua a acelerar a assimilação enquanto gera tensões de apagamento cultural."
 ve_civic_initiative_active_mdf:0 "Cidadania Igualitária Iniciativa"
 ve_civic_initiative_active_mdf_desc:0 "Escolas e instituições públicas estão sendo reorganizadas para ampliar as oportunidades e reduzir o preconceito aberto."
 ve_civic_initiative_result_mdf:0 "Programa Cidadania Igualitária"
 ve_civic_initiative_result_mdf_desc:0 "A iniciativa melhora as qualificações, a atração da migração e a resistência ao preconceito aberto."
 ve_composite_compact_active_mdf:0 "Negociações do Pacto Constituinte"
 ve_composite_compact_active_mdf_desc:0 "As negociações reduzem as queixas da cidadania de segunda categoria, mas sobrecarregam temporariamente a administração tributária."
