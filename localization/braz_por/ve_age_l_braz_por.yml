l_braz_por:
 ve_splendor:0 "#tooltippable_name Ímpeto da Era: "
 ve_age_of_victoria_title:0 "Indústria e Nações"
 ve_age_of_victoria_desc:0 "Antigas ordens confrontam fábricas, ferrovias, públicos instruídos e o Estado moderno. O Ímpeto pertence aos países que transformam instituições herdadas em capacidade nacional duradoura."
 ve_imperialism_age_title:0 "Império e Sociedade de Massa"
 ve_imperialism_age_desc:0 "A indústria alcança continentes enquanto a educação, instituições públicas e exércitos organizados remodelam a sociedade de massa. Superpotências podem expandir-se no exterior; Estados menores podem prosperar por meio da soberania e do desenvolvimento interno."
 ve_great_wars_age_title:0 "Política de Massas e Guerra Total"
 ve_great_wars_age_desc:0 "Eletricidade, petróleo, participação de massas, bem-estar social e guerra industrial transformam a relação entre Estado e sociedade. A sobrevivência agora depende tanto das instituições quanto dos exércitos."
 ve_age_notify_option:0 "Uma nova era amanhece."
 ve_victorian_age_icon_p_tt:0 "#P Indústria e Nações (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Indústria e Nações (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Império e Sociedade de Massa (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Império e Sociedade de Massa (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Política de Massas e Guerra Total (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Política de Massas e Guerra Total (1906–1936)"

 ve_golden_age:0 "Era de Ouro"
 ve_golden_age_industrial:0 "Era de Ouro Industrial"
 ve_golden_age_cultural:0 "Era de Ouro Cultural"
 ve_golden_age_strategic:0 "Era de Ouro Estratégica"
 ve_golden_age_tt:0 "Disponível a partir de #v 1845#! após concluir #v 5 objetivos distintos#! na era atual. Um país pode escolher apenas uma Era de Ouro durante todo o jogo; seus efeitos duram #v 15 anos#!."
 ve_golden_age_requirement_unused:0 "Nenhuma Era de Ouro foi escolhida durante esta campanha."
 ve_golden_age_requirement_year:0 "Requer o ano de #v 1845#! ou posterior."
 ve_golden_age_requirement_objectives:0 "Conclua pelo menos #v 5 objetivos distintos#! na era atual."
 ve_golden_age_industrial_tt:0 "#header Era de Ouro Industrial#!\nPor #Y 15 anos#!: #P +10% Rendimento de Manufatura#! e #P +10% Chance de Descoberta de Recurso#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Era de Ouro Cultural#!\nPor #Y 15 anos#!: #P +5% Acesso à Educação#! e #P +10% Prestígio#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Era de Ouro Estratégica#!\nPor #Y 15 anos#!: #P +5% Ataque do Exército#! e #P -10% Exaustão da Guerra por Baixas#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Objetivos da Era"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Decolagem Industrial"
 ve_victorian_age_obj_desc_1:0 "Reduza a fatia de camponeses para menos de 40%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Fim da Antiga Ordem"
 ve_victorian_age_obj_desc_2:0 "Proíba a escravidão e abolha a servidão."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Estado Funcional"
 ve_victorian_age_obj_desc_3:0 "Mantenha pelo menos 70 de legitimidade e um saldo de burocracia não negativo sem escassez iminente."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Público Instruído"
 ve_victorian_age_obj_desc_4:0 "Alcance 50% de instrução ou escolas de nível 3."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Mercado Integrado"
 ve_victorian_age_obj_desc_5:0 "Possua pelo menos 3 níveis de ferrovia se tiver menos de 5 milhões de população, ou 6 níveis de ferrovia caso contrário."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Despertar Nacional"
 ve_victorian_age_obj_desc_6:0 "Seja independente com pelo menos 65 de legitimidade e menos de 5% de instabilidade no país."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Alcance Global"
 ve_victorian_age_obj_desc_7:0 "Seja uma Potência Principal ou Superpotência, ou mantenha pelo menos 5 interesses declarados."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Poder Industrial"
 ve_imperialism_age_obj_desc_1:0 "Alcance £100 milhões de PIB ou reduza a parcela de camponeses para menos de 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Educação em Massa"
 ve_imperialism_age_obj_desc_2:0 "Alcance 65% de instrução ou Escolas nível 4."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Império ou Soberania"
 ve_imperialism_age_obj_desc_3:0 "Tenha ao menos 2 súditos, ou continue independente e reconhecido."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Comércio Global"
 ve_imperialism_age_obj_desc_4:0 "Possua 2 níveis de Porto se tiver menos de 10 milhões de população, possua 10 níveis de Porto caso contrário, ou mantenha 5 interesses declarados."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Construção de Nação"
 ve_imperialism_age_obj_desc_5:0 "Mantenha pelo menos 60 de legitimidade e menos de 5% de instabilidade no país."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header A Questão Social"
 ve_imperialism_age_obj_desc_6:0 "Eleve o Sistema de Saúde, a Segurança no Ambiente de Trabalho ou a Segurança Social ao nível 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Forças Armadas Modernas"
 ve_imperialism_age_obj_desc_7:0 "Mantenha em campo pelo menos 50% de Infantaria de Escaramuça ou de Trincheira e 10% de Artilharia Móvel no exército."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Política de Massas"
 ve_great_wars_age_obj_desc_1:0 "Promulgue Sufrágio Universal ou República Conciliar, ou mantenha 75 de legitimidade como uma República Parlamentar ou Presidencialista."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Estado Social"
 ve_great_wars_age_obj_desc_2:0 "Mantenha pelo menos duas instituições de nível 3 entre Saúde, Segurança Social, Segurança no Ambiente de Trabalho e Escolas."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Economia Eletrizada"
 ve_great_wars_age_obj_desc_3:0 "Possua 1 nível de Usina Elétrica se tiver menos de 10 milhões de população, ou 5 níveis de Usina Elétrica caso contrário."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Petróleo e Motores"
 ve_great_wars_age_obj_desc_4:0 "Possua uma Torre de Petróleo ou pelo menos 5 níveis de Indústria de Motores."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Militar Moderno"
 ve_great_wars_age_obj_desc_5:0 "Mantenha em campo pelo menos 50% de Infantaria de Trincheira ou de Linha e 15% de Artilharia de Shrapnel no exército."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Artifício de Guerra Total"
 ve_great_wars_age_obj_desc_6:0 "Mantenha 40 unidades do exército e pelo menos 5 níveis de Indústria de Armas ou 3 de Fábrica de Munição."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Influência Mundial"
 ve_great_wars_age_obj_desc_7:0 "Seja uma Potência Principal ou Superpotência, lidere um Bloco de Poder ou mantenha pelo menos 6 interesses declarados."

 ve_age_splendor_tt:0 "#title Ímpeto da Era#!\nEstoque atual: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nObjetivos satisfeitos: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nGrupos de Doutrinas (Era atual, máx. +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nVariação mensal: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nObjetivos distintos concluídos nesta era: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nRecompensas compradas nesta era: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nCusto da próxima recompensa: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Como os Grupos de Doutrinas contribuem#!\nQualquer grupo de nível IV correspondente concede #P +1#! por mês apenas enquanto sua Era atribuída for a atual. A linha acima mostra o total ativo, limitado a #Y +2#!.\n#P Era 1#!: grupos de indústria, comércio, administração e acadêmicos\n#P Era 2#!: grupos de recursos, sociedade, diplomacia, nacionalistas/reformistas e coloniais\n#P Era 3#!: grupos militares e de economia de guerra\n\nCada objetivo atualmente satisfeito também concede #P +1#! de Ímpeto da Era por mês. Os Grupos de Doutrinas não alteram a conclusão de objetivos nem sua recompensa única de #P +50#!.\n\nOs custos das recompensas escalam dentro de cada era: #Y 200, 300, 400, 500#!, depois #Y 600#! para cada recompensa posterior. O ímpeto e a escala de custos são reiniciados quando uma nova era começa."
 ve_age_obj_efct_tt:0 "Enquanto satisfeito: #P +1 de Ímpeto da Era por mês#!\nPrimeira conclusão nesta era: #P +50 de Ímpeto da Era#!"
 splendor_default_bonus:0 "Tenha pelo menos #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! de Ímpeto da Era"
