l_braz_por:
 ve_splendor:0 "#tooltippable_name Momentum da Era: "
 ve_age_of_victoria_title:0 "Indústria e Nações"
 ve_age_of_victoria_desc:0 "As velhas ordens confrontam as fábricas, os caminhos-de-ferro, os públicos alfabetizados e o Estado moderno. A dinâmica pertence aos países que transformam instituições herdadas em capacidade nacional durável."
 ve_imperialism_age_title:0 "Império e Sociedade de Massa"
 ve_imperialism_age_desc:0 "A indústria atravessa todos os continentes enquanto a educação, as instituições públicas e os exércitos organizados remodelam a sociedade de massas. As grandes potências podem expandir-se para o estrangeiro; os estados mais pequenos podem prosperar através da soberania e do desenvolvimento interno."
 ve_great_wars_age_title:0 "Política de massa e guerra total"
 ve_great_wars_age_desc:0 "A electricidade, o petróleo, a participação das massas, o bem-estar e a guerra industrial transformam a relação entre o Estado e a sociedade. A sobrevivência depende agora tanto das instituições como dos exércitos."
 ve_age_notify_option:0 "Amanhece uma nova era."
 ve_victorian_age_icon_p_tt:0 "#P Indústria e Nações (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Indústria e Nações (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Império e Sociedade de Massa (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Império e Sociedade de Massa (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Política de Massa e Guerra Total (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Política de Massa e Guerra Total (1906–1936)"

 ve_golden_age:0 "Idade de Ouro"
 ve_golden_age_industrial:0 "Idade de Ouro Industrial"
 ve_golden_age_cultural:0 "Idade de Ouro Cultural"
 ve_golden_age_strategic:0 "Idade de Ouro Estratégica"
 ve_golden_age_tt:0 "Disponível a partir de #v 1845#! após completar #v 5 objetivos distintos#! na era atual. Um país pode escolher apenas uma Idade de Ouro durante todo o jogo; seus efeitos duram #v 15 anos#!."
 ve_golden_age_requirement_unused:0 "Nenhuma Idade de Ouro foi escolhida durante esta campanha."
 ve_golden_age_requirement_year:0 "Requer o ano #v 1845#! ou posterior."
 ve_golden_age_requirement_objectives:0 "Complete pelo menos #v 5 objetivos distintos#! na era atual."
 ve_golden_age_industrial_tt:0 "#header Idade de Ouro Industrial#!\nPor #Y 15 anos#!: #P +10% de produtividade de fabricação#! e #P +10% de descoberta de recursos Chance#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Idade de Ouro Cultural#!\nPor #Y 15 anos#!: #P +5% de Acesso à Educação#! e #P +10% de Prestígio#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Era de Ouro Estratégica#!\nPor #Y 15 anos#!: #P +5% de Ofensiva do Exército#! e #P -10% de Exaustão de Guerra por Vítimas#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Objetivos de Idade"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Decolagem Industrial"
 ve_victorian_age_obj_desc_1:0 "Reduzir a participação camponesa abaixo de 40%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Acabar com o Velho Ordem"
 ve_victorian_age_obj_desc_2:0 "Proibir a escravidão e abolir a servidão."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Estado Funcional"
 ve_victorian_age_obj_desc_3:0 "Manter pelo menos 70 legitimidade e um equilíbrio burocrático não negativo sem uma escassez iminente."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Público Educado"
 ve_victorian_age_obj_desc_4:0 "Atingir 50% de alfabetização ou escolas de nível 3."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Mercado Integrado"
 ve_victorian_age_obj_desc_5:0 "Possuir pelo menos 3 níveis ferroviários se estiver abaixo de 5 milhões de habitantes, ou 6 níveis ferroviários caso contrário."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Nacional Despertar"
 ve_victorian_age_obj_desc_6:0 "Seja independente com pelo menos 65 legitimidade e menos de 5% de turbulência no país."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Alcance global"
 ve_victorian_age_obj_desc_7:0 "Seja uma grande potência ou mantenha pelo menos 5 interesses declarados."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Poder Industrial"
 ve_imperialism_age_obj_desc_1:0 "Atingir £ 100 milhões do PIB ou reduzir a participação camponesa abaixo de 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Educação de massa"
 ve_imperialism_age_obj_desc_2:0 "Alcançar 65% de alfabetização ou escolas de nível 4."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Império ou Soberania"
 ve_imperialism_age_obj_desc_3:0 "Ter pelo menos 2 súditos, ou permanecer independente e reconhecido."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Comércio Global"
 ve_imperialism_age_obj_desc_4:0 "Possuir 2 níveis de porto se estiver abaixo de 10 milhões de população, possuir 10 níveis de porto caso contrário, ou manter 5 interesses declarados."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Construção da nação"
 ve_imperialism_age_obj_desc_5:0 "Manter pelo menos 60 legitimidade e menos de 5% de turbulência no país."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header A questão social"
 ve_imperialism_age_obj_desc_6:0 "Elevar o sistema de saúde, a segurança no trabalho ou a seguridade social ao nível 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Forças Armadas Modernas"
 ve_imperialism_age_obj_desc_7:0 "Possuem pelo menos 50% de Infantaria de Escaramuça ou de Trincheira e 10% de Artilharia Móvel no exército."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Política de Massa"
 ve_great_wars_age_obj_desc_1:0 "Promulgar o Sufrágio Universal ou República do Conselho, ou manter 75 legitimidade como uma República Parlamentar ou Presidencial."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Estado Social"
 ve_great_wars_age_obj_desc_2:0 "Manter pelo menos duas instituições de nível 3 entre Saúde, Segurança Social, Segurança no Trabalho e Escolas."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Economia Eletrificada"
 ve_great_wars_age_obj_desc_3:0 "Tenha 1 nível de Usina de Energia se tiver menos de 10 milhões de habitantes, ou 5 níveis de Usina de Energia caso contrário."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Petróleo e motores"
 ve_great_wars_age_obj_desc_4:0 "Possuir uma plataforma de petróleo ou pelo menos 5 níveis de indústria automobilística."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Militar Moderno"
 ve_great_wars_age_obj_desc_5:0 "Coloque pelo menos 50% de Infantaria de Trincheira ou Esquadrão e 15% de Artilharia de Estilhaços no exército."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Capacidade Total de Guerra"
 ve_great_wars_age_obj_desc_6:0 "Manter 40 unidades do exército e pelo menos 5 níveis de Indústria de Armas ou 3 níveis de Fábrica de Munições."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Influência Mundial"
 ve_great_wars_age_obj_desc_7:0 "Seja uma Grande ou Grande Potência, lidere um Bloco de Poder ou mantenha pelo menos 6 interesses declarados."

 ve_age_splendor_tt:0 "#title Momentum da Era#!\nEstoque atual: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nObjetivos satisfeitos: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nGrupos de Ideias (Idade atual, máx. +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nMudança mensal: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nCompletou objetivos distintos nesta idade: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nRecompensas adquiridas nesta idade: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nCusto da próxima recompensa: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Como os Grupos de Ideias contribuem#!\nQualquer grupo de nível IV correspondente dá #P +1#! por mês apenas enquanto sua Idade atribuída estiver atual. A linha acima mostra o total ativo, limitado a #Y +2#!.\n#P Idade 1#!: Indústria, comércio, administração e grupos acadêmicos\n#P Idade 2#!: recursos, sociedade, diplomacia, grupos nacionalistas/reformistas e coloniais\n#P 3 anos#!: grupos militares e de economia de guerra\n\nCada objetivo atualmente satisfeito também concede #P +1#! Era Momentum por mês. Os Grupos de Ideias não alteram a conclusão do objetivo ou seu desempenho único #P +50#! recompensa.\n\nOs custos da recompensa aumentam em cada idade: #Y 200, 300, 400, 500#!, então #Y 600#! para cada recompensa posterior. O impulso e a escala de custos são reiniciados quando uma nova era começa."
 ve_age_obj_efct_tt:0 "Enquanto estiver satisfeito: #P +1 Era Momentum por mês#!\nPrimeira conclusão nesta idade: #P +50 Era Momentum#!"
 splendor_default_bonus:0 "Ter pelo menos #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Era Momentum"
