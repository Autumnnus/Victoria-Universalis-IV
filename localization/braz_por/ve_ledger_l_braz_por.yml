l_braz_por:
 # Doctrine Ledger - gui/ve_panel_ledger.gui
 VE_LEDGER:0 "Livro de Registros"
 VE_LEDGER_SELECTED:0 "#bold Livro de Registros#!"
 VE_LG_TITLE:0 "Livro de Doutrinas"
 VE_LG_HINT:0 "A situação doutrinária de cada país. Clique no cabeçalho de uma coluna para ordenar, em um filtro para estreitar a lista e em um país para abrir seu painel com os detalhes completos por grupo."

 # Columns
 VE_LG_COL_RANK:0 "#"
 VE_LG_COL_COUNTRY:0 "País"
 VE_LG_COL_INSIGHT:0 "Visão"
 VE_LG_COL_GROUPS:0 "Grupos"
 VE_LG_COL_IDEAS:0 "Doutrinas de Grupo"
 VE_LG_COL_NATIONAL_IDEAS:0 "Doutrinas Nacionais"
 VE_LG_COL_NATIONAL_IDEAS_TT:0 "#header Doutrinas Nacionais#!\nUm marcador por espaço de Doutrina Nacional, mais o Bônus Nacional à direita. Um país desbloqueia o próximo espaço a cada três doutrinas de grupo adquiridas."
 VE_LG_COL_RELIGION:0 "Modelo Religioso"
 VE_LG_COL_IDENTITY:0 "Modelo de Identidade"
 VE_LG_COL_ERA:0 "Era"

 # Cell values
 VE_LG_GROUPS_VALUE:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_LG_IDEAS_VALUE:0 "[Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21"
 VE_LG_REWARDS_VALUE:0 "R [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]"
 VE_LG_ERA_TT:0 "#header [Country.GetCustom('ve_cp_age_name')]#!\nÍmpeto da Era: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\nRecompensas de Era compradas nesta Era: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nObjetivos atendidos atualmente: #Y [Country.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0] / 7#!\nObjetivos assegurados nesta Era: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\nEra de Ouro: [Country.GetCustom('ve_cp_golden_age_status')]"
 VE_LG_OPEN_COUNTRY_TT:0 "Abra o painel deste país. Os detalhes de Doutrinas, Religião, Identidade e Era encontram-se na seção #Y Doutrina Nacional#! ali."

 # Sort tooltips
 VE_LG_SORT_PRESTIGE_TT:0 "Ordenar por #Y Prestígio#! - a ordem padrão, do maior para o menor."
 VE_LG_SORT_INSIGHT_TT:0 "Ordenar por #Y Visão Nacional#! acumulada, da maior para a menor."
 VE_LG_SORT_GROUPS_TT:0 "Ordenar por #Y grupos de doutrinas adotados#!, do maior para o menor."
 VE_LG_SORT_IDEAS_TT:0 "Ordenar por #Y doutrinas de grupo adquiridas#! (progresso da Doutrina Nacional), da maior para a menor."
 VE_LG_SORT_SETTLEMENT_TT:0 "Ordenar por #Y Concordata Religiosa#!, da maior para a menor."
 VE_LG_SORT_COHESION_TT:0 "Ordenar por #Y Coesão Nacional#!, da maior para a menor."
 VE_LG_SORT_MOMENTUM_TT:0 "Ordenar por #Y Ímpeto da Era#!, do maior para o menor."

 # Filters
 VE_LG_F_ALL:0 "Todos"
 VE_LG_F_GREAT_POWERS:0 "Superpotências"
 VE_LG_F_MAJOR_POWERS:0 "Grandes Potências+"
 VE_LG_F_RECOGNIZED:0 "Reconhecidas"
 VE_LG_F_RELEVANT:0 "Relevantes para Mim"
 VE_LG_F_WITH_GROUPS:0 "Possui Grupos de Doutrinas"

 # Paging
 VE_LG_PAGE_INFO:0 "Página [GetGlobalVariable('ve_ledger_page_number').GetValue|0] / [GetGlobalVariable('ve_ledger_page_count').GetValue|0]  ([GetGlobalVariable('ve_ledger_total').GetValue|0])"
 VE_LG_REFRESH:0 "Atualizar"
 VE_LG_REFRESH_TT:0 "Reconstruir a lista. Os valores das linhas são sempre em tempo real; apenas a ordem e os membros da página são definidos quando a lista é construída."
 VE_LG_FIRST_TT:0 "Primeira página"
 VE_LG_PREV_TT:0 "Página anterior"
 VE_LG_NEXT_TT:0 "Próxima página"
 VE_LG_YOU:0 "#lore Seu país#!"
 VE_LG_EMPTY:0 "#lore Nenhum país corresponde a este filtro. Pressione Atualizar ou escolha um filtro mais abrangente.#!"

