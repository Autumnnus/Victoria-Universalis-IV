 VE_LG_PREV_TT:0 "Página anterior"
 VE_LG_NEXT_TT:0 "Próxima página"
 VE_LG_YOU:0 "#lore Seu país#!"
 VE_LG_EMPTY:0 "#lore Nenhum país corresponde a este filtro. Pressione Atualizar ou escolha um filtro mais amplo.#!"

