l_braz_por:
 # Doctrine Ledger - gui/ve_panel_ledger.gui
 VE_LEDGER:0 "Razão"
 VE_LEDGER_SELECTED:0 "#bold Razão#!"
 VE_LG_TITLE:0 "Doutrina Ledger"
 VE_LG_HINT:0 "A posição da doutrina de cada país. Clique no cabeçalho de uma coluna para classificar, em um filtro para restringir a lista e em um país para abrir seu painel para obter todos os detalhes por grupo."

 # Columns
 VE_LG_COL_RANK:0 "#"
 VE_LG_COL_COUNTRY:0 "País"
 VE_LG_COL_INSIGHT:0 "Entendimento"
 VE_LG_COL_GROUPS:0 "Grupos"
 VE_LG_COL_IDEAS:0 "Ideias de Grupo"
 VE_LG_COL_NATIONAL_IDEAS:0 "Ideias Nacionais"
 VE_LG_COL_NATIONAL_IDEAS_TT:0 "#header Ideias Nacionais#!\nUm marcador por slot de Ideia Nacional, mais o Bônus Nacional à direita. Um país desbloqueia o próximo espaço para cada terceira ideia de grupo que compra."
 VE_LG_COL_RELIGION:0 "Modelo Religioso"
 VE_LG_COL_IDENTITY:0 "Modelo de Identidade"
 VE_LG_COL_ERA:0 "Era"

 # Cell values
 VE_LG_GROUPS_VALUE:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_LG_IDEAS_VALUE:0 "[Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21"
 VE_LG_REWARDS_VALUE:0 "R [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]"
 VE_LG_ERA_TT:0 "#header [Country.GetCustom('ve_cp_age_name')]#!\nEra Momentum: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\nEra Rewards comprados nesta Era: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nObjetivos atualmente alcançados: #Y [Country.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0] / 7#!\nObjetivos garantidos nesta Era: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\nIdade de Ouro: [Country.GetCustom('ve_cp_golden_age_status')]"
 VE_LG_OPEN_COUNTRY_TT:0 "Abra o painel deste país. Seus detalhes de Idéias, Religião, Identidade e Era estão no #Y Doutrina Nacional#! seção lá."

 # Sort tooltips
 VE_LG_SORT_PRESTIGE_TT:0 "Classificar por #Y Prestígio#! - a ordem padrão, o mais alto primeiro."
 VE_LG_SORT_INSIGHT_TT:0 "Classificar por estoque #Y National Insight#!, o mais alto primeiro."
 VE_LG_SORT_GROUPS_TT:0 "Classificar por #Y grupos de ideias adotadas#!, a maioria primeiro."
 VE_LG_SORT_IDEAS_TT:0 "Classificar por #Y ideias de grupo compradas#! (progresso da Ideia Nacional), a maioria primeiro."
 VE_LG_SORT_SETTLEMENT_TT:0 "Classificar por #Y Assentamento Religioso#!, mais alto primeiro."
 VE_LG_SORT_COHESION_TT:0 "Classificar por #Y Coesão Nacional#!, mais alto primeiro."
 VE_LG_SORT_MOMENTUM_TT:0 "Classificar por #Y Era Momentum#!, mais alto primeiro."

 # Filters
 VE_LG_F_ALL:0 "Todos"
 VE_LG_F_GREAT_POWERS:0 "Grandes Poderes"
 VE_LG_F_MAJOR_POWERS:0 "Poderes principais +"
 VE_LG_F_RECOGNIZED:0 "Reconhecido"
 VE_LG_F_RELEVANT:0 "Relevante para mim"
 VE_LG_F_WITH_GROUPS:0 "Tem grupos de ideias"

 # Paging
 VE_LG_PAGE_INFO:0 "Página [GetGlobalVariable('ve_ledger_page_number').GetValue|0] / [GetGlobalVariable('ve_ledger_page_count').GetValue|0]  ([GetGlobalVariable('ve_ledger_total').GetValue|0])"
 VE_LG_REFRESH:0 "Atualizar"
