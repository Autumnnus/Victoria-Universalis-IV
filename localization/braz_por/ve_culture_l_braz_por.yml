l_braz_por:
 ve_national_identity:0 "Identidade Nacional"
 ve_primary_cultures_label:0 "Culturas Primárias"
 ve_identity_models:0 "Modelos de Identidade"
 ve_identity_model_active_footer:0 "Já Ativos"
 ve_switch_identity_button:0 "Mudar"
 ve_switch_identity_cost_label:0 "Custos #Y 200 Mandato Cultural#!"
 ve_begin_project_button:0 "Iniciar Projeto"
 ve_identity_models_help:0 "Sua nação sempre tem exatamente um Modelo de Identidade e é #P já ativo#! — você não precisa escolher nada aqui. O modelo apenas decide como #Y Coesão Nacional#! é ganho e qual projeto cultural você pode executar.\n#Y A troca é opcional:#! custa #Y 200 Mandato Cultural#!, redefine a Coesão para #Y 35#!, cancela qualquer Projeto Cultural em execução e bloqueia outra troca por 5 anos.\n#Y Passe o mouse sobre qualquer cartão ou medidor para ver todos os efeitos.#!"
 ve_ethnic_identity_name:0 "Nação Étnica"
 ve_civic_identity_name:0 "Nação Cívica"
 ve_composite_identity_name:0 "Estado Composto"
 ve_ethnic_identity_short:0 "A nação é definida em torno de suas culturas primárias.\nA coesão vem da #Y dominância demográfica#!."
 ve_civic_identity_short:0 "Uma nação política construída através da escolaridade.\nA coesão vem da #Y alfabetização e de minorias aceitas#!."
 ve_composite_identity_short:0 "Vários povos sob instituições negociadas.\nA coesão vem de #Y uma população genuinamente plural#!."
 ve_ethnic_identity_unlocks:0 "Desbloqueia o #Y Campanha de Integração Étnica#! projeto"
 ve_civic_identity_unlocks:0 "Desbloqueia o #Y Iniciativa de Cidadania Igualitária#! projeto"
 ve_composite_identity_unlocks:0 "Desbloqueia o #Y Pacto Constituinte#! projeto"
 ve_ethnic_identity_desc:0 "#header Nação Étnica#!\nA nação é definida em torno de suas culturas primárias.\n\n#Y Enquanto ativo#!\n#P +15% de Assimilação, +5% de Autoridade#!\n#N -5% de Atração de Migração, +5% de Radicais por Preconceito Aberto#!\n\n#Y Coesão#!\nAumenta quando as culturas primárias compõem pelo menos 60–75% da população e cai acentuadamente abaixo de 40%.\n\n#Y Aos 75 Coesão#!\n#P +5% Taxa de recrutamento, +3 Legitimidade#!\n\n#Y Projeto Cultural#!\nCampanha de Integração Étnica"
 ve_civic_identity_desc:0 "#header Nação Cívica#!\nUma nação política compartilhada é construída através da educação e da participação.\n\n#Y Enquanto ativo#!\n#P +7% de atração de migração, +1% de acesso à educação#!\n#N -10% de assimilação, -5% Autoridade, -50 Burocracia#!\n\n#Y Coesão#!\nAlfabetização aumenta, mas qualquer cultura não primária acima de 10% da população com aceitação muito baixa a reduz.\n\n#Y Aos 75 Coesão#!\n#P +5% Qualificações, +3 Legitimidade#!\n\n#Y Projeto Cultural#!\nCidadania Igualitária Iniciativa"
 ve_composite_identity_desc:0 "#header Estado Composto#!\nVários povos são governados através de instituições negociadas.\n\n#Y Enquanto ativo#!\n#P -10% de Radicais do Apagamento Cultural e Cidadania de Segunda Classe, +5% de Influência#!\n#N -15% Assimilação, -5% Autoridade, -75 Burocracia#!\n\n#Y Coesão#!\nUma população genuinamente plural a cria; uma população com mais de 90% de culturas primárias enfraquece este modelo.\n\n#Y Aos 75 Coesão#!\n#P +5% Influência, +3 Legitimidade#!\n\n#Y Projeto Cultural#!\nPacto Constituinte"
 ve_identity_change_cost_tt:0 "Mudar o Modelo de Identidade requer #Y 200 Mandato Cultural#! e nenhuma reação ativa de transição de identidade. A mudança redefine a Coesão para #Y 35#!, causa um #Y Reação de transição de 5 anos#! e cancela qualquer Projeto Cultural ativo sem uma penalidade de cancelamento adicional."
 ve_cultural_mandate:0 "Mandato Cultural"
 ve_culture_reform_point:0 "Mandato Cultural"
 ve_cultural_mandate_hint:0 "Gasto em projetos culturais. Economizar é seguro, mas a renda cai pela metade em 400 e termina em 500."
 ve_culture_reform_point_tt:0 "#header Mandato Cultural#!\nAtual: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nVariação mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Em que é gasto#!\nProjetos Culturais (75–150) e mudanças no Modelo de Identidade (200). Nenhum dos dois é necessário: poupar O mandato é seguro, a renda é reduzida apenas pela metade em 400 e para em 500.\n\n#Y Repartição mensal#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLegitimidade: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nSociedade modelo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nEstabilidade e movimentos culturais: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nAlinhamento da lei: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nDoutrina de ideias: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nCap multiplicador: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Doutrina da ideia — apenas o seu modelo de identidade atual conta#!\n#P Nação Étnica#!: Nacionalista V #P +1#!\n#P Nação Cívica#!: Reformista V #P +1#!; Acadêmico V #P +1#!\n#P Estado Composto#!: V #P +1 Reformista#!\nO total ativo acima é limitado a #Y +2#!.\n\nA Nação Cívica extrai o componente Sociedade Modelo da alfabetização, o Estado Composto da alfabetização em uma sociedade plural e a Nação Étnica da força demográfica da cultura primária.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Coesão Nacional"
 ve_national_cohesion_hint:0 "desvia em direção ao equilíbrio que seu Modelo de Identidade produz. Com 75+ você ganha um bônus, com 25 ou menos de instabilidade."
 ve_national_cohesion_tt:0 "#header Coesão Nacional#!\nAtual: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nEquilíbrio: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMovimento mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nCondições comuns: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nCondições do modelo de identidade: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nA coesão se move 20% da distância em direção ao equilíbrio a cada mês, até 5 pontos. Os movimentos culturais radicais reduzem o equilíbrio em 10. Aos 75 anos ou mais, o modelo actual concede um benefício adicional; com 25 anos ou menos, a instabilidade nacional se aplica.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Sem efeito"
 ve_cultural_projects:0 "Projetos Culturais"
 ve_cultural_projects_intro:0 "Projetos Culturais são #Y opcional#!. Apenas um pode ser executado por vez: seu custo de Mandato é pago imediatamente e #N -75 Burocracia e -25 Autoridade#! inscreva-se enquanto estiver em execução. A conclusão de um projeto devolve algum mandato e aumenta a coesão. Os projectos a nível nacional só podem ser repetidos após expirar o seu benefício de conclusão; um alvo de Estado/Cultura concluído não pode ser selecionado novamente.\n#Y Passe o mouse sobre qualquer carta ou medidor para ver todos os efeitos.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Projeto em andamento"
 ve_cultural_project_progress:0 "Progresso do projeto"
 ve_cultural_project_progress_tt:0 "#header Progresso mensal do projeto#!\nAtual: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nRestantes: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nTotal mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (mínimo 1, máximo 7)\n\n#Y Detalhamento mensal#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLegitimidade: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nSociedade modelo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nCoesão: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nMovimentos culturais: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nEstado-alvo Turbulência: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nGrupos de Ideias: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Grupos de Ideias — apenas os bônus que correspondem ao seu Modelo de Identidade atual estão ativos#!\n#P Nação Étnica#!: Nacionalista VII #P +1#!\n#P Nação Cívica#!: Reformista VII, Acadêmico VII ou Bem-Estar VI — #P +1#! cada\n#P Composto Estado#!: Reformista VII ou Diplomático VI — #P +1#! cada\nO total do Grupo de Ideias ativo acima é limitado a #Y +2#!; quaisquer bônus correspondentes adicionais não aumentam o progresso.\n\nA Sociedade Modelo recompensa a alfabetização cívica, a concentração demográfica étnica ou a diversidade composta de acordo com o Modelo de Identidade ativo. A conclusão é resolvida na próxima atualização mensal após o progresso atingir #Y 100#!."
 ve_cancel_cultural_project_button:0 "Cancelar Projeto"
 ve_cancel_cultural_project_tt:0 "#header Cancelar Projeto Cultural#!\nO Mandato Cultural investido #N não é reembolsado#!. A Coesão Nacional cai #N 5#! e uma reação de #N 2 anos#! impede outro projeto."
 ve_start_cultural_project_button:0 "Projeto Inicial"
 ve_national_curriculum_name:0 "Currículo Nacional"
 ve_national_curriculum_cost:0 "Custo: #Y 100 Mandato Cultural#!"
 ve_national_curriculum_short:0 "Uma reforma escolar em todo o país.\n#P +20 Mandato, +5 Coesão#!, depois melhor educação."
 ve_national_curriculum_desc:0 "#header Currículo Nacional#!\nUma reforma escolar atravessa o todo o país.\n\n#Y Custo#!\n#Y 100 Mandato Cultural#!, pago imediatamente\n\n#Y Após a conclusão#!\n#P +20 Mandato Cultural, +5 Coesão Nacional#!\n\n#Y Por 10 anos depois#!\n#P +2% de Acesso à Educação, +5% de Qualificações#!\n#N -25 Burocracia#!"
 ve_national_curriculum_requirements_tt:0 "Requer #Y 100 Mandato Cultural#!, nenhum Projeto Cultural ativo e nenhum Reação do projeto. Também não pode começar enquanto o anterior #Y Currículo Nacional#! benefício está ativo."
 ve_shared_symbols_name:0 "Símbolos Compartilhados"
 ve_shared_symbols_cost:0 "Custo: #Y 75 Mandato Cultural#!"
 ve_shared_symbols_short:0 "Bandeiras, hinos e cerimônia pública.\n#P +20 Mandato, +7 Coesão#!, depois legalistas e Autoridade."
 ve_shared_symbols_desc:0 "#header Símbolos Compartilhados#!\nBandeiras, hinos e cerimônia pública, promovidos em todo o país.\n\n#Y Custo#!\n#Y 75 Mandato Cultural#!, pago imediatamente\n\n#Y Após a conclusão#!\n#P +20 Mandato Cultural, +7 Coesão Nacional#!\n\n#Y Por 8 anos depois#!\n#P +10% Legalistas de Pops Totalmente Aceitos, +25 Autoridade#!"
 ve_shared_symbols_requirements_tt:0 "Requer #Y 75 Mandato Cultural#!, nenhum Projeto Cultural ativo e nenhuma reação negativa do projeto. Também não pode começar enquanto o anterior #Y Símbolos Compartilhados#! benefício está ativo."
 ve_ethnic_campaign_name:0 "Campanha de Integração Étnica"
 ve_ethnic_campaign_cost:0 "Custo: #Y 125 Mandato Cultural#!"
 ve_ethnic_campaign_short:0 "Assimilar uma grande minoria em um Estado.\n#P +25 Mandato, +8 Coesão#!, mas cria radicais."
 ve_ethnic_campaign_desc:0 "#header Campanha de Integração Étnica#!\nExecutada em um único Estado contra sua maior cultura não primária, que deve conter pelo menos #Y 5%#! da população desse Estado.\n\n#Y Custo#!\n#Y 125 Cultural Mandato#!, pago imediatamente\n\n#Y Após conclusão#!\nAssimila #Y 5%#! da cultura alvo em uma cultura primária, ou #Y 7%#! com Nacionalista VII\n#P +25 Mandato Cultural, +8 Coesão Nacional#!\nDeixa um #Y 10 anos#! programa de assimilação no Estado\n\n#Y Aviso#!\n#N Tanto o início quanto o término do projeto criam radicais entre a cultura alvo.#!"
 ve_civic_initiative_name:0 "Iniciativa de Cidadania Igualitária"
 ve_civic_initiative_cost:0 "Custo: #Y 100 Mandato Cultural#!"
 ve_civic_initiative_short:0 "Aumentar a aceitação de uma minoria em um Estado.\n#P +25 Mandato, +10 Coesão#!, mais legalistas."
 ve_civic_initiative_desc:0 "#header Equal Citizenship Initiative#!\nExecutada em um único Estado em sua maior cultura não primária, que deve conter pelo menos #Y 5%#! da população desse Estado.\n\n#Y Custo#!\n#Y 100 Mandato Cultural#!, pago imediatamente\n\n#Y Após a conclusão#!\n#P +15 Aceitação dessa cultura por 10 anos#!\nLealistas no Estado alvo\n#P +25 Mandato Cultural, +10 Coesão Nacional#!\nDez anos de melhores qualificações e atração de migração"
 ve_composite_compact_name:0 "Pacto Constituinte"
 ve_composite_compact_cost:0 "Custo: #Y 150 Mandato Cultural#! e #Y 40 Coesão#!"
 ve_composite_compact_short:0 "Reconhecer uma minoria como uma cultura constituinte.\n#P +30 Mandato, +12 Coesão#!, permanentemente."
 ve_composite_compact_desc:0 "#header Pacto Constituinte#!\nExecutado em um único Estado com base em uma cultura não primária não reconhecida que detenha pelo menos #Y 5%#! da população daquele Estado.\n\n#Y Custo#!\n#Y 150 Mandato Cultural#!, pago imediatamente, e pelo menos #Y 40 Coesão Nacional#!\n\n#Y Ao concluir#!\n#P +15 Aceitação dessa cultura, permanentemente#!\nReconhece-a como uma cultura constituinte\nLealistas no Estado alvo\n#P +30 Mandato Cultural, +12 Coesão Nacional#!"
 ve_targeted_project_start_instruction:0 "#Y Como começar#!\n1. Abra um dos seus próprios estados.\n2. Imprensa #Y Iniciar projeto#! no painel desse estado.\nA cultura alvo e qualquer coisa que ainda esteja faltando estão listadas na dica de ferramenta desse botão."
 ve_targeted_project_state_requirements_tt:0 "O estado deve ser de nossa propriedade e conter uma cultura não primária elegível compreendendo pelo menos #Y 5%#! de sua população. A maior cultura elegível torna-se o alvo. Uma cultura já concluída neste Estado não pode ser alvo de novo, mas pode ser alvo de outro Estado. Os custos e requisitos do modelo de identidade atual também devem ser atendidos."
 ve_targeted_cultural_project_target:0 "Meta: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! em #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Escopo: #Y País inteiro#!"
 ve_no_cultural_project_target:0 "Nenhum objetivo de projeto"
 ve_no_active_cultural_project:0 "Nenhum projeto cultural ativo"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "COESIVO - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "FRAGMENTADO - #N a instabilidade nacional se aplica#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% Taxa de recrutamento e +3 Legitimidade#!."
 ve_civic_high_cohesion_effect:0 "#P +5% Qualificações e +3 Legitimidade#!."
 ve_composite_high_cohesion_effect:0 "#P +5% Influência e +3 Legitimidade#!."
 ve_identity_transition_backlash_notice:0 "Uma reação de transição de identidade ainda está ativa - o modelo não pode ser alterado novamente até que expire."
 ve_cultural_project_backlash_notice:0 "Um projeto cancelado ainda bloqueia um novo - a reação de 2 anos deve expirar primeiro."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Reação de transição ativo"
 ve_cultural_project_backlash_notice_short:0 "Reação de cancelamento ativa"
 ve_targeted_project_start_instruction_short:0 "Inicie a partir de um de seus próprios estados: abra o estado e pressione #Y Iniciar projeto#!."
