l_braz_por:
 ve_national_identity:0 "Identidade Nacional"
 ve_primary_cultures_label:0 "Culturas Primárias"
 ve_identity_models:0 "Modelos de Identidade"
 ve_identity_model_active_footer:0 "Já Ativo"
 ve_switch_identity_button:0 "Trocar"
 ve_switch_identity_cost_label:0 "Custa #Y 200 Mandato Cultural#!"
 ve_begin_project_button:0 "Iniciar Projeto"
 ve_identity_models_help:0 "Sua nação sempre tem exatamente um Modelo de Identidade e ele está #P já ativo#! — você não precisa escolher nada aqui. O modelo apenas decide como a #Y Coesão Nacional#! é obtida e qual Projeto Cultural você pode executar.\n#Y A troca é opcional:#! custa #Y 200 Mandato Cultural#!, redefine a Coesão para #Y 35#!, cancela qualquer Projeto Cultural em andamento e bloqueia outra troca por 5 anos.\n#Y Passe o mouse sobre qualquer cartão ou medidor para ver seus efeitos completos.#!"
 ve_ethnic_identity_name:0 "Nação Étnica"
 ve_civic_identity_name:0 "Nação Cívica"
 ve_composite_identity_name:0 "Estado Composto"
 ve_ethnic_identity_short:0 "A nação é definida em torno de suas culturas primárias.\nA Coesão vem da #Y dominância demográfica#!."
 ve_civic_identity_short:0 "Uma nação política construída por meio da escolarização.\nA Coesão vem da #Y instrução e de minorias aceitas#!."
 ve_composite_identity_short:0 "Vários povos sob instituições negociadas.\nA Coesão vem de #Y uma população genuinamente plural#!."
 ve_ethnic_identity_unlocks:0 "Desbloqueia o projeto #Y Campanha de Integração Étnica#!"
 ve_civic_identity_unlocks:0 "Desbloqueia o projeto #Y Iniciativa de Cidadania Igualitária#!"
 ve_composite_identity_unlocks:0 "Desbloqueia o projeto #Y Pacto Constituinte#!"
 ve_ethnic_identity_desc:0 "#header Nação Étnica#!\nA nação é definida em torno de suas culturas primárias.\n\n#Y Enquanto ativo#!\n#P +15% Assimilação, +5% Autoridade#!\n#N -5% Atração de Migração, +5% Radicais por Preconceito Aberto#!\n\n#Y Coesão#!\nSobe quando as culturas primárias compõem pelo menos 60–75% da população, e cai drasticamente abaixo de 40%.\n\n#Y A 75 de Coesão#!\n#P +5% Taxa de Conscrição, +3 Legitimidade#!\n\n#Y Projeto Cultural#!\nCampanha de Integração Étnica"
 ve_civic_identity_desc:0 "#header Nação Cívica#!\nUma nação política compartilhada é construída por meio da educação e participação.\n\n#Y Enquanto ativo#!\n#P +7% Atração de Migração, +1% Acesso à Educação#!\n#N -10% Assimilação, -5% Autoridade, -50 Burocracia#!\n\n#Y Coesão#!\nA instrução a eleva, mas qualquer cultura não primária acima de 10% da população com Aceitação muito baixa a reduz.\n\n#Y A 75 de Coesão#!\n#P +5% Qualificações, +3 Legitimidade#!\n\n#Y Projeto Cultural#!\nIniciativa de Cidadania Igualitária"
 ve_composite_identity_desc:0 "#header Estado Composto#!\nVários povos são governados por meio de instituições negociadas.\n\n#Y Enquanto ativo#!\n#P -10% Radicais por Apagamento Cultural e Cidadania de Segunda Classe, +5% Influência#!\n#N -15% Assimilação, -5% Autoridade, -75 Burocracia#!\n\n#Y Coesão#!\nUma população genuinamente plural a eleva; uma população com mais de 90% de culturas primárias enfraquece este modelo.\n\n#Y A 75 de Coesão#!\n#P +5% Influência, +3 Legitimidade#!\n\n#Y Projeto Cultural#!\nPacto Constituinte"
 ve_identity_change_cost_tt:0 "Mudar o Modelo de Identidade exige #Y 200 Mandato Cultural#! e nenhuma Reação de Transição de Identidade ativa. A mudança redefine a Coesão para #Y 35#!, causa uma #Y reação de transição de 5 anos#! e cancela qualquer Projeto Cultural ativo sem uma penalidade de cancelamento adicional."
 ve_cultural_mandate:0 "Mandato Cultural"
 ve_culture_reform_point:0 "Mandato Cultural"
 ve_cultural_mandate_hint:0 "Gasto em Projetos Culturais. Guardá-lo é seguro, mas a renda cai pela metade em 400 e cessa em 500."
 ve_culture_reform_point_tt:0 "#header Mandato Cultural#!\nAtual: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nMudança mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y No que é gasto#!\nProjetos Culturais (75–150) e mudanças de Modelo de Identidade (200). Nenhum é obrigatório: guardar Mandato é seguro, a renda só cai pela metade em 400 e cessa em 500.\n\n#Y Detalhamento mensal#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLegitimidade: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nSociedade do Modelo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nEstabilidade e Movimentos Culturais: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nAlinhamento de leis: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nDoutrina de ideia: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nMultiplicador de limite: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Doutrina de ideia — apenas seu Modelo de Identidade atual conta#!\n#P Nação Étnica#!: Nacionalista V #P +1#!\n#P Nação Cívica#!: Reformista V #P +1#!; Acadêmico V #P +1#!\n#P Estado Composto#!: Reformista V #P +1#!\nO total ativo acima tem limite de #Y +2#!.\n\nA Nação Cívica extrai o componente Sociedade do Modelo da instrução, o Estado Composto da instrução em uma sociedade plural e a Nação Étnica da força demográfica da cultura primária.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Coesão Nacional"
 ve_national_cohesion_hint:0 "Desvia em direção ao equilíbrio que seu Modelo de Identidade produz. Em 75+ você ganha um bônus, em 25 ou menos, instabilidade."
 ve_national_cohesion_tt:0 "#header Coesão Nacional#!\nAtual: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nEquilíbrio: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMovimento mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nCondições comuns: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nCondições do modelo de identidade: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nA Coesão desloca-se 20% da distância em direção ao equilíbrio a cada mês, até 5 pontos. Movimentos culturais radicais reduzem o equilíbrio em 10. Em 75 ou mais, o modelo atual concede um benefício adicional; em 25 ou menos, aplica-se instabilidade nacional.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Sem efeito"
 ve_cultural_projects:0 "Projetos Culturais"
 ve_cultural_projects_intro:0 "Projetos Culturais são #Y opcionais#!. Apenas um pode estar em andamento por vez: seu custo em Mandato é pago imediatamente e aplica-se #N -75 Burocracia e -25 Autoridade#! enquanto durar. A conclusão de um projeto reembolsa parte do Mandato e aumenta a Coesão. Projetos de âmbito nacional só podem ser repetidos após o término do benefício anterior; um alvo de Estado/Cultura concluído não pode ser selecionado novamente.\n#Y Passe o cursor sobre qualquer cartão ou medidor para ver seus efeitos completos.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Projeto em andamento"
 ve_cultural_project_progress:0 "Progresso do Projeto"
 ve_cultural_project_progress_tt:0 "#header Progresso Mensal do Projeto#!\nAtual: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nRestante: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nTotal mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (mínimo 1, máximo 7)\n\n#Y Detalhamento mensal#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLegitimidade: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nSociedade do Modelo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nCoesão: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nMovimentos Culturais: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nInstabilidade do Estado-Alvo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nGrupos de Doutrinas: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Grupos de Doutrinas — apenas bônus correspondentes ao seu Modelo de Identidade atual estão ativos#!\n#P Nação Étnica#!: Nacionalista VII #P +1#!\n#P Nação Cívica#!: Reformista VII, Acadêmico VII ou Bem-Estar Social VI — #P +1#! cada\n#P Estado Composto#!: Reformista VII ou Diplomático VI — #P +1#! cada\nO total de Grupos de Doutrinas ativos acima é limitado a #Y +2#!; quaisquer bônus correspondentes adicionais não aumentam o progresso.\n\nA Sociedade do Modelo recompensa a instrução cívica, a concentração demográfica étnica ou a diversidade composta de acordo com o Modelo de Identidade ativo. A conclusão é resolvida na próxima atualização mensal após o progresso atingir #Y 100#!."
 ve_cancel_cultural_project_button:0 "Cancelar Projeto"
 ve_cancel_cultural_project_tt:0 "#header Cancelar Projeto Cultural#!\nO Mandato Cultural investido #N não é reembolsado#!. A Coesão Nacional cai em #N 5#! e uma #N reação de 2 anos#! impede outro projeto."
 ve_start_cultural_project_button:0 "Iniciar Projeto"
 ve_national_curriculum_name:0 "Currículo Nacional"
 ve_national_curriculum_cost:0 "Custo: #Y 100 Mandato Cultural#!"
 ve_national_curriculum_short:0 "Uma reforma escolar em todo o país.\n#P +20 Mandato, +5 Coesão#!, depois melhor educação."
 ve_national_curriculum_desc:0 "#header Currículo Nacional#!\nUma reforma escolar realizada em todo o país.\n\n#Y Custo#!\n#Y 100 Mandato Cultural#!, pago imediatamente\n\n#Y Ao concluir#!\n#P +20 Mandato Cultural, +5 Coesão Nacional#!\n\n#Y Por 10 anos depois#!\n#P +2% Acesso à Educação, +5% Qualificações#!\n#N -25 Burocracia#!"
 ve_national_curriculum_requirements_tt:0 "Requer #Y 100 Mandato Cultural#!, nenhum Projeto Cultural ativo e nenhuma Reação ao Projeto. Também não pode começar enquanto o benefício anterior de #Y Currículo Nacional#! estiver ativo."
 ve_shared_symbols_name:0 "Símbolos Compartilhados"
 ve_shared_symbols_cost:0 "Custo: #Y 75 Mandato Cultural#!"
 ve_shared_symbols_short:0 "Bandeiras, hinos e cerimônias públicas.\n#P +20 Mandato, +7 Coesão#!, depois lealistas e Autoridade."
 ve_shared_symbols_desc:0 "#header Símbolos Compartilhados#!\nBandeiras, hinos e cerimônias públicas, promovidos em todo o país.\n\n#Y Custo#!\n#Y 75 Mandato Cultural#!, pago imediatamente\n\n#Y Ao concluir#!\n#P +20 Mandato Cultural, +7 Coesão Nacional#!\n\n#Y Por 8 anos depois#!\n#P +10% Lealistas de Pops Plenamente Aceitos, +25 Autoridade#!"
 ve_shared_symbols_requirements_tt:0 "Requer #Y 75 Mandato Cultural#!, nenhum Projeto Cultural ativo e nenhuma Reação ao Projeto. Também não pode começar enquanto o benefício anterior de #Y Símbolos Compartilhados#! estiver ativo."
 ve_ethnic_campaign_name:0 "Campanha de Integração Étnica"
 ve_ethnic_campaign_cost:0 "Custo: #Y 125 Mandato Cultural#!"
 ve_ethnic_campaign_short:0 "Assimilar uma grande minoria em um Estado.\n#P +25 Mandato, +8 Coesão#!, mas gera radicais."
 ve_ethnic_campaign_desc:0 "#header Campanha de Integração Étnica#!\nExecutada em um único Estado contra sua maior cultura não primária, que deve representar pelo menos #Y 5%#! da população desse Estado.\n\n#Y Custo#!\n#Y 125 Mandatos Culturais#!, pagos imediatamente\n\n#Y Ao concluir#!\nAssimila #Y 5%#! da cultura-alvo em uma cultura primária, ou #Y 7%#! com Nacionalista VII\n#P +25 Mandato Cultural, +8 Coesão Nacional#!\nDeixa um programa de assimilação de #Y 10 anos#! no Estado\n\n#Y Aviso#!\n#N Tanto o início quanto a conclusão do projeto geram radicais entre a cultura-alvo.#!"
 ve_civic_initiative_name:0 "Iniciativa de Cidadania Igualitária"
 ve_civic_initiative_cost:0 "Custo: #Y 100 Mandato Cultural#!"
 ve_civic_initiative_short:0 "Eleva a Aceitação de uma minoria em um Estado.\n#P +25 Mandato, +10 Coesão#!, mais lealistas."
 ve_civic_initiative_desc:0 "#header Iniciativa de Cidadania Igualitária#!\nExecutado em um único Estado sobre sua cultura não primária mais expressiva, que deve compor pelo menos #Y 5%#! da população desse Estado.\n\n#Y Custo#!\n#Y 100 Mandato Cultural#!, pago imediatamente\n\n#Y Ao concluir#!\n#P +15 Aceitação para essa cultura por 10 anos#!\nLealistas no Estado-alvo\n#P +25 Mandato Cultural, +10 Coesão Nacional#!\nDez anos de Qualificações e Atração de Migração aprimoradas"
 ve_composite_compact_name:0 "Pacto Constituinte"
 ve_composite_compact_cost:0 "Custo: #Y 150 Mandato Cultural#! e #Y 40 Coesão#!"
 ve_composite_compact_short:0 "Reconhece uma minoria como uma cultura constituinte.\n#P +30 Mandato, +12 Coesão#!, permanentemente."
 ve_composite_compact_desc:0 "#header Pacto Constituinte#!\nExecutado em um único Estado com base em uma cultura não primária não reconhecida que detenha pelo menos #Y 5%#! da população daquele Estado.\n\n#Y Custo#!\n#Y 150 Mandato Cultural#!, pago imediatamente, e pelo menos #Y 40 Coesão Nacional#!\n\n#Y Ao concluir#!\n#P +15 Aceitação dessa cultura, permanentemente#!\nReconhece-a como uma cultura constituinte\nLealistas no Estado alvo\n#P +30 Mandato Cultural, +12 Coesão Nacional#!"
 ve_targeted_project_start_instruction:0 "#Y Como iniciá-lo#!\n1. Abra um de seus próprios Estados.\n2. Pressione #Y Iniciar Projeto#! no painel desse Estado.\nA cultura-alvo e tudo o que ainda faltar são listados na dica de ferramenta desse botão."
 ve_targeted_project_state_requirements_tt:0 "O estado deve ser de nossa propriedade e conter uma cultura não primária elegível que compreenda pelo menos #Y 5%#! de sua população. A cultura elegível maior torna-se o alvo. Uma cultura já concluída neste Estado não pode ser alvo novamente, mas pode ser alvo em outro Estado. O custo e os requisitos do Modelo de Identidade atual também devem ser atendidos."
 ve_targeted_cultural_project_target:0 "Alvo: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! em #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Escopo: #Y País Inteiro#!"
 ve_no_cultural_project_target:0 "Nenhum alvo de projeto"
 ve_no_active_cultural_project:0 "Nenhum Projeto Cultural Ativo"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "COESO - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "FRAGMENTADO - #N instabilidade nacional aplicada#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% de Taxa de Conscrição e +3 de Legitimidade#!."
 ve_civic_high_cohesion_effect:0 "#P +5% de Qualificações e +3 de Legitimidade#!."
 ve_composite_high_cohesion_effect:0 "#P +5% de Influência e +3 de Legitimidade#!."
 ve_identity_transition_backlash_notice:0 "Uma Reação à Transição de Identidade ainda está ativa - o modelo não pode ser trocado novamente até que expire."
 ve_cultural_project_backlash_notice:0 "Um projeto cancelado ainda bloqueia um novo - a reação de 2 anos deve expirar primeiro."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Reação de transição ativa"
 ve_cultural_project_backlash_notice_short:0 "Reação de cancelamento ativa"
 ve_targeted_project_start_instruction_short:0 "Inicie-o a partir de um de seus próprios Estados: abra o Estado e pressione #Y Iniciar Projeto#!."
