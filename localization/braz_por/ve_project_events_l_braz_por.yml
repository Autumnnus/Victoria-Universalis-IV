l_braz_por:
 ve_je_religious_project:0 "Projeto Religioso"
 ve_je_religious_project_reason:0 "O governo está dirigindo um projeto religioso de longo prazo. Seu progresso é governado pela capacidade administrativa, legitimidade política, condições religiosas e eventos no estado alvo."
 ve_je_religious_project_progress:0 "Progresso do Projeto Religioso em direção à conclusão"
 ve_je_religious_project_status_confessional:0 "A Conversão Confessional in [JournalEntry.GetTarget.GetState.GetName] busca estender a fé do estado através de uma campanha organizada.\n\nConclusão no #Y 125#! progresso: converte 5% da população do estado alvo para a religião do estado, reembolsa #P 20#! Reforma da Piedade, e adiciona #P 5#! Assentamento Religioso."
 ve_je_religious_project_status_freedom:0 "O Alcance da Liberdade em [JournalEntry.GetTarget.GetState.GetName] está construindo um acordo baseado na consciência e na associação voluntária.\n\nConclusão em #Y 100#! progresso: adiciona legalistas ao estado sem conversão forçada, reembolsos #P 20#! Reforma da Piedade, e acrescenta #P 7#! Assentamento Religioso."
 ve_je_religious_project_status_secularization:0 "A Campanha de Secularização em [JournalEntry.GetTarget.GetState.GetName] está reduzindo a autoridade pública da religião organizada.\n\nConclusão em #Y 150#! progresso: converte 5% da população do estado alvo ao ateísmo, reembolsa #P 25#! Reforma da Piedade e adiciona #P 8#! Assentamento Religioso."
 ve_je_religious_project_complete_tt:0 "O Projeto Religioso atingiu seu objetivo."
 ve_je_religious_project_fail_tt:0 "O Projeto Religioso foi cancelado."

 ve_je_cultural_project:0 "Projeto Cultural"
 ve_je_cultural_project_reason:0 "O governo está dirigir um projeto cultural de longo prazo. Capacidade administrativa, legitimidade, educação, coesão nacional e condições locais determinam seu ritmo."
 ve_je_cultural_project_progress:0 "Progresso do Projeto Cultural em direção à conclusão"
 ve_je_cultural_project_status_curriculum:0 "Um Currículo Nacional está sendo preparado para as escolas e instituições do país.\n\nConclusão em #Y 100#! progresso: #P +20#! Mandato Cultural, #P +5#! Coesão Nacional e um resultado de 10 anos de +2% de Acesso à Educação, +5% de Qualificações, -25 de Burocracia."
 ve_je_cultural_project_status_symbols:0 "Um programa de Símbolos Compartilhados está forjando um vocabulário cívico comum.\n\nConclusão em #Y 75#! progresso: #P +20#! Mandato Cultural, #P +7#! Coesão Nacional e um resultado de 8 anos de +10% de fiéis de pops totalmente aceitos e +25"
 ve_je_cultural_project_status_ethnic:0 "Autoridade. [JournalEntry.GetTarget.GetState.GetName] A Campanha de Integração Étnica está pressionando uma população minoritária em direção à cultura primária.\n\nConclusão em #Y 125#! progresso: converte 5% dos pops da cultura alvo para a cultura primária (7% com Nacionalista VII), #P +25#! Mandato Cultural, #P +8#! Coesão Nacional e um resultado de assimilação de 10 anos."
 ve_je_cultural_project_status_civic:0 "A Iniciativa para a Igualdade de Cidadania em [JournalEntry.GetTarget.GetState.GetName] está ampliando um status cívico comum além das fronteiras culturais.\n\nConclusão em #Y 100#! progresso: +15% de aceitação por 10 anos, legalistas do estado, #P +25#! Mandato Cultural, #P +10#! Coesão Nacional e um resultado de qualificação/migração de 10 anos."
 ve_je_cultural_project_status_composite:0 "O Pacto Constituinte em [JournalEntry.GetTarget.GetState.GetName] está negociando o reconhecimento permanente dentro de um estado composto.\n\nConclusão em #Y 150#! progresso (requer 40+ Coesão Nacional): aceitação permanente +15%, adiciona a cultura à lista constituinte, legalistas do estado, #P +30#! Mandato Cultural, #P +12#! Coesão Nacional."
 ve_je_cultural_project_complete_tt:0 "O Projeto Cultural atingiu seu objetivo."
 ve_je_cultural_project_fail_tt:0 "O Projeto Cultural foi cancelado."
 ve_je_project_resolving_status:0 "A administração do projeto está apresentando seu relatório final."

 ve_evt_religious_incident_cooldown_mdf:0 "Resfriamento do Incidente do Projeto Religioso"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "A administração do projeto está absorvendo as consequências de um incidente recente."
 ve_evt_cultural_incident_cooldown_mdf:0 "Resfriamento do Incidente do Projeto Cultural"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "A administração do projeto está absorvendo as consequências de um incidente recente."
 ve_evt_central_clergy_supported_mdf:0 "Clero Central Apoiado"
 ve_evt_central_clergy_supported_mdf_desc:0 "O governo manteve a autoridade da hierarquia religiosa central."
 ve_evt_central_clergy_slighted_mdf:0 "Clero Central Desprezado"
 ve_evt_central_clergy_slighted_mdf_desc:0 "O governo favoreceu prática local sobre as preferências da hierarquia religiosa central."
 ve_evt_municipal_patronage_mdf:0 "Redes Municipais de Mecenato"
 ve_evt_municipal_patronage_mdf_desc:0 "Os notáveis ​​locais estão a avançar com o projecto através de acordos que enfraquecem a arrecadação de impostos."

 ve_rel_evt.1.t:0 "A Petição dos Notáveis ​​Locais"
 ve_rel_evt.1.d:0 "Uma delegação de clérigos, figuras municipais e anciãos do bairro de [SCOPE.sState('ve_evt_target_state').GetName] solicitou ao governo que retardasse a conversão confessional. Alertam que um calendário inflexível transformará o cumprimento em ressentimento duradouro."
 ve_rel_evt.1.f:0 "“A fé imposta sem conselho pode encher os registros enquanto esvazia os bancos.”"
 ve_rel_evt.1.a:0 "Ouça a petição deles."
 ve_rel_evt.1.a.tt:0 "O progresso do Projeto Religioso diminui em #N 4#!.\nO Assentamento Religioso aumenta em #P 3#!."
 ve_rel_evt.1.b:0 "O cronograma não mudará."
 ve_rel_evt.1.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 5#!.\nAssentamento religioso diminui em #N 2#!.\n#N 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.1.c:0 "Comissiona intermediários de confiança."
 ve_rel_evt.1.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 3#!.\nO Assentamento Religioso aumenta em #P 1#!."

 ve_rel_evt.2.t:0 "Escassez de Oficiais de Campo"
 ve_rel_evt.2.d:0 "Os relatórios de [SCOPE.sState('ve_evt_target_state').GetName] descrevem petições não respondidas, instruções contraditórias e distritos que não veem um oficial de projeto há semanas. A Conversão Confessional está ultrapassando a administração designada para realizá-la."
 ve_rel_evt.2.f:0 "\\"Um decreto pode cruzar o país em um dia. Um escrivão competente não pode.\\""
 ve_rel_evt.2.a:0 "Contratar oficiais de campo temporários."
 ve_rel_evt.2.a.tt:0 "Gastar #N 15#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 4#!."
 ve_rel_evt.2.b:0 "Retarda o programa."
 ve_rel_evt.2.b.tt:0 "O progresso do Projeto Religioso diminui em #N 6#!.\nO Assentamento Religioso aumenta em #P 2#!."
 ve_rel_evt.2.c:0 "Use os quadros de registro central."
 ve_rel_evt.2.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!."

 ve_cul_evt.1.t:0 "Os Escritórios de Tradução"
 ve_cul_evt.1.d:0 "Funcionários em [SCOPE.sState('ve_evt_target_state').GetName] discordam sobre como a Iniciativa para a Igualdade de Cidadania deveria abordar a [SCOPE.sCulture('ve_evt_target_culture').GetName] linguagem. Os administradores locais querem escritórios bilíngues; os ministérios centrais exigem um padrão administrativo único."
 ve_cul_evt.1.f:0 "\\"Um cidadão não deveria precisar de um intérprete para compreender os direitos concedidos em seu próprio nome.\\""
 ve_cul_evt.1.a:0 "Deixe as línguas locais viverem nas instituições públicas."
 ve_cul_evt.1.a.tt:0 "O progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.1.b:0 "Impõe um padrão administrativo."
 ve_cul_evt.1.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional diminui em #N 2#!.\n#N 0,5%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.1.c:0 "Estabelecer uma comissão de tradução acadêmica."
 ve_cul_evt.1.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 1#!."

 ve_cul_evt.2.t:0 "Escassez de professores locais"
 ve_cul_evt.2.d:0 "As escolas de [SCOPE.sState('ve_evt_target_state').GetName] faltam professores capazes de servir tanto o currículo estadual quanto [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidades. Sem um quadro local treinado, a igualdade de cidadania corre o risco de permanecer uma promessa escrita apenas em papel oficial."
 ve_cul_evt.2.f:0 "\\"A lei declara igualdade numa tarde; a sala de aula deve ensiná-la durante uma geração.\""
 ve_cul_evt.2.a:0 "Financiar novas faculdades de professores."
 ve_cul_evt.2.a.tt:0 "Gaste #N 15#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!."
 ve_cul_evt.2.b:0 "Implementação lenta."
 ve_cul_evt.2.b.tt:0 "O progresso do Projeto Cultural diminui em #N 6#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.2.c:0 "Use as instituições já existentes."
 ve_cul_evt.2.c.tt:0 "Gaste #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 1#!."

 ve_rel_evt.3.t:0 "Registros Conflitantes"
 ve_rel_evt.3.d:0 "As listas paroquiais, os livros municipais e os relatórios dos responsáveis ​​pelo projecto fornecem relatos incompatíveis de adesão religiosa em [SCOPE.sState('ve_evt_target_state').GetName]. A administração deve decidir se perde tempo para estabelecer a verdade ou avança com números que sabe serem incertos."
 ve_rel_evt.3.f:0 "\"Cada escritório possui um total exato. Não há dois totais que concordem.\""
 ve_rel_evt.3.a:0 "Realize uma auditoria completa."
 ve_rel_evt.3.a.tt:0 "Ganho #P 8#! Reforma da Piedade.\nO progresso do Projeto Religioso diminui em #N 6#!."
 ve_rel_evt.3.b:0 "Prossiga com estimativas razoáveis."
 ve_rel_evt.3.b.tt:0 "Gaste #N 8#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!."
 ve_rel_evt.3.c:0 "Use os registros da Administração Sagrada."
 ve_rel_evt.3.c.tt:0 "O progresso do Projeto Religioso aumenta em #P 3#!."

 ve_rel_evt.4.t:0 "Rumores e Contra-Pregação"
 ve_rel_evt.4.d:0 "Panfletos, sermões de rua e rumores ansiosos descrevem agora a Conversão Confessional em [SCOPE.sState('ve_evt_target_state').GetName] como um ataque à vida local. As autoridades alertam que o silêncio permitirá que os oponentes definam o projeto, enquanto a repressão poderá confirmar suas reivindicações mais sombrias."
 ve_rel_evt.4.f:0 "\\"Um boato não requer cargo, selo ou orçamento.\""
 ve_rel_evt.4.a:0 "Realize audiências públicas."
 ve_rel_evt.4.a.tt:0 "O progresso do projeto religioso diminui em #N 3#!.\nAssentamento religioso aumenta em #P 3#!.\n#P 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Legalista."
 ve_rel_evt.4.b:0 "Punir os agitadores."
 ve_rel_evt.4.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 4#!.\nAssentamento Religioso diminui em #N 3#!.\n#N 1%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.4.c:0 "Publique os registros e resultados."
 ve_rel_evt.4.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 2#!.\nO Assentamento Religioso aumenta em #P 1#!."

 ve_rel_evt.5.t:0 "A Linguagem do Sermão"
 ve_rel_evt.5.d:0 "O clero do projeto em [SCOPE.sState('ve_evt_target_state').GetName] relatam que os sermões formais preservam a unidade doutrinária, mas não conseguem alcançar muitos congregados. A pregação na língua local levaria a campanha mais longe, embora a hierarquia central tema que a adaptação se transforme em independência."
 ve_rel_evt.5.f:0 "“Uma palavra sagrada não ouvida é preservada perfeitamente – e não recebida por ninguém.”"
 ve_rel_evt.5.a:0 "Pregue nas línguas locais."
 ve_rel_evt.5.a.tt:0 "O progresso do Projeto Religioso aumenta em #P 6#!.\nOs Devotos perdem #N 1#! Aprovação por #Y 2,5 anos#!."
 ve_rel_evt.5.b:0 "Preservam a unidade litúrgica."
 ve_rel_evt.5.b.tt:0 "O progresso do Projeto Religioso diminui em #N 3#!.\nAssentamento Religioso aumenta em #P 3#!.\nOs Devotos ganham #P 1#! Aprovação para #Y 2,5 anos#!."
 ve_rel_evt.5.c:0 "Treinar intérpretes qualificados."
 ve_rel_evt.5.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 4#!.\nAssentamento Religioso aumenta em #P 1#!."

 ve_rel_evt.6.t:0 "Autoridades Eclesiásticas Rivais"
 ve_rel_evt.6.d:0 "Nomeados centrais e clérigos locais estabelecidos em [SCOPE.sState('ve_evt_target_state').GetName] cada um reivindica o direito de dirigir a conversão confessional. Apoiar um lado pode restaurar o comando rapidamente, mas a disputa já se tornou um teste para saber quem fala pela fé."
 ve_rel_evt.6.f:0 "\\"A disputa diz respeito à jurisdição, que é como as instituições descrevem o poder.\\""
 ve_rel_evt.6.a:0 "Apoie o clero central."
 ve_rel_evt.6.a.tt:0 "O progresso do Projeto Religioso aumenta em #P 5#!.\nO ganho Devoto #P 1#! Aprovação por #Y 2,5 anos#!.\nAssentamento Religioso diminui em #N 3#!.\n#N 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.6.b:0 "Acalma o clero local."
 ve_rel_evt.6.b.tt:0 "O progresso do Projeto Religioso diminui em #N 4#!.\nOs Devotos perdem #N 1#! Aprovação por #Y 2,5 anos#!.\nAssentamento Religioso aumenta em #P 3#!."
 ve_rel_evt.6.c:0 "Definem seus poderes por escrito."
 ve_rel_evt.6.c.tt:0 "Gastam #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 3#!.\nAssentamento Religioso aumenta em #P 1#!."

 ve_cul_evt.3.t:0 "As Categorias do Censo"
 ve_cul_evt.3.d:0 "Funcionários do censo em [SCOPE.sState('ve_evt_target_state').GetName] não podemos concordar com a forma como os cidadãos [SCOPE.sCulture('ve_evt_target_culture').GetName] cultura deve ser registrada. Os entrevistados locais utilizam identidades sobrepostas, enquanto os formulários centrais exigem uma resposta numa caixa."
 ve_cul_evt.3.f:0 "\\"Uma categoria simplifica o livro-razão muito antes de simplificar o país.\\""
 ve_cul_evt.3.a:0 "Permite a autoidentificação."
 ve_cul_evt.3.a.tt:0 "O progresso do projeto cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 4#!."
 ve_cul_evt.3.b:0 "As categorias serão definidas centralmente."
 ve_cul_evt.3.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão Nacional diminui em #N 4#!.\n#N 0,5%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população em [SCOPE.sState('ve_evt_target_state').GetName] se torna Radical."
 ve_cul_evt.3.c:0 "Use o sistema de registro moderno."
 ve_cul_evt.3.c.tt:0 "Gaste #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 1#!."

 ve_cul_evt.4.t:0 "Os Notáveis ​​Municipais"
 ve_cul_evt.4.d:0 "Patrocinadores Municipais de [SCOPE.sState('ve_evt_target_state').GetName] oferecem seus escritórios, clientes e influência para promover a igualdade de cidadania para o [SCOPE.sCulture('ve_evt_target_culture').GetName] população. A sua cooperação seria rápida, mas o seu preço é o controlo contínuo sobre as receitas locais."
 ve_cul_evt.4.f:0 "\\"O caminho mais curto para a Câmara Municipal passa por várias salas de estar privadas.\\""
 ve_cul_evt.4.a:0 "Use as redes locais."
 ve_cul_evt.4.a.tt:0 "O progresso do Projecto Cultural aumenta em #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] perde #N 5%#! Capacidade Fiscal por #Y 2 anos#!."
 ve_cul_evt.4.b:0 "Criar conselhos abertos."
 ve_cul_evt.4.b.tt:0 "O progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.4.c:0 "Negociar um acordo baseado em regras."
 ve_cul_evt.4.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 1#!."

 ve_cul_evt.5.t:0 "Os Concursos para a Função Pública"
 ve_cul_evt.5.d:0 "A abertura dos concursos para a função pública aos [SCOPE.sCulture('ve_evt_target_culture').GetName] candidatos expôs uma lacuna entre a igualdade legal e a preparação prática. O acesso imediato seria simbolicamente poderoso, mas anos de escolaridade desigual não podem ser eliminados por decreto."
 ve_cul_evt.5.f:0 "\\"O mesmo exame não é a mesma oportunidade quando apenas um candidato aprendeu seu idioma.\\""
 ve_cul_evt.5.a:0 "Finance cursos preparatórios."
 ve_cul_evt.5.a.tt:0 "Gaste #N 15#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.5.b:0 "A igualdade de acesso começa imediatamente."
 ve_cul_evt.5.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 7#!.\nA Coesão Nacional diminui em #N 4#!.\n#N 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se radical."
 ve_cul_evt.5.c:0 "Mobilizar as redes escolares e de assistência social."
 ve_cul_evt.5.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.5.e:0 "Reforma primeiro o sistema de exames."
 ve_cul_evt.5.e.tt:0 "O progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 3#!."

 ve_cul_evt.6.t:0 "A maioria recua"
 ve_cul_evt.6.d:0 "Os oponentes da Iniciativa de Cidadania Igualitária afirmam que a extensão dos direitos comuns aos [SCOPE.sCulture('ve_evt_target_culture').GetName] população diminui a posição de todos os outros. Manifestações em [SCOPE.sState('ve_evt_target_state').GetName] estão a transformar uma reforma administrativa num teste político nacional."
 ve_cul_evt.6.f:0 "\\"Um direito compartilhado está sendo descrito como um privilégio roubado.\\""
 ve_cul_evt.6.a:0 "Defenda a iniciativa abertamente."
 ve_cul_evt.6.a.tt:0 "O progresso do Projeto Cultural aumenta em #P 4#!.\nA Coesão Nacional diminui em #N 4#!.\n#N 1%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.6.b:0 "Reduz o ritmo de implementação."
 ve_cul_evt.6.b.tt:0 "O progresso do Projeto Cultural diminui em #N 5#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.6.c:0 "Mobilizar a coalizão de reforma."
 ve_cul_evt.6.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 2#!.\n#P 0,5%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população [SCOPE.sState('ve_evt_target_state').GetName] torna-se Legalista."

 ve_rel_evt.7.t:0 "A Missão no Ponto de Ruptura"
 ve_rel_evt.7.d:0 "A conversão confessional em [SCOPE.sState('ve_evt_target_state').GetName] está perto do colapso administrativo e político. Os escritórios deixaram de responder uns aos outros, a resistência pública está a aumentar e o clero no terreno alerta que a missão não pode continuar nos termos actuais."
 ve_rel_evt.7.f:0 "\"Os relatórios ainda chamam isso de dificuldade temporária. As ruas escolheram um nome mais duro.\""
 ve_rel_evt.7.a:0 "Aceite as perdas e retire-se."
 ve_rel_evt.7.a.tt:0 "Cancelar o Projeto Religioso sem reembolso da Reforma da Piedade.\nAssentamento Religioso diminui em #N 5#!.\nPara #Y 2 anos#!: #N -50#! Burocracia, #N -50#! Autoridade e #N -3%#! Sucesso na promulgação da lei."
 ve_rel_evt.7.b:0 "Transferir recursos de emergência."
 ve_rel_evt.7.b.tt:0 "Gastar #N 25#! Reforma da Piedade.\nO progresso do projeto religioso diminui em #N 5#!.\n#N 1%#! da população in [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."
 ve_rel_evt.7.c:0 "Continua com uma equipe mínima."
 ve_rel_evt.7.c.tt:0 "O progresso do Projeto Religioso diminui em #N 10#!.\nAssentamento Religioso diminui em #N 2#!.\nO projeto continua."
 ve_rel_evt.7.e:0 "Renegociar o método."
 ve_rel_evt.7.e.tt:0 "Gastar #N 15#! Reforma da Piedade.\nO progresso do Projeto Religioso diminui em #N 3#!.\nAssentamento Religioso aumenta em #P 2#!.\n#N 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."

 ve_cul_evt.7.t:0 "A iniciativa perde legitimidade"
 ve_cul_evt.7.d:0 "A Iniciativa para a Igualdade de Cidadania em [SCOPE.sState('ve_evt_target_state').GetName] está a perder o apoio tanto das instituições estabelecidas como do [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidades que deveria servir. Os movimentos radicais agora retratam cada compromisso como prova de que o governo não pode proporcionar igualdade."
 ve_cul_evt.7.f:0 "\\"Uma reforma pode sobreviver à oposição. Não pode sobreviver a tornar-se inacreditável.\\""
 ve_cul_evt.7.a:0 "Encerrar a iniciativa."
 ve_cul_evt.7.a.tt:0 "Cancelar o Projeto Cultural sem reembolso do Mandato Cultural.\nA Coesão Nacional diminui em #N 5#!.\nPor #Y 2 anos#!: #N -50#! Burocracia, #N -25#! Autoridade e #N -3%#! Sucesso na promulgação da lei."
 ve_cul_evt.7.b:0 "Emitir subsídios locais de emergência."
 ve_cul_evt.7.b.tt:0 "Gastar #N 25#! Mandato Cultural.\nO progresso do projeto cultural diminui em #N 5#!.\n#N 1%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."
 ve_cul_evt.7.c:0 "Continua com um programa mínimo."
 ve_cul_evt.7.c.tt:0 "O progresso do Projeto Cultural diminui em #N 10#!.\nA Coesão Nacional diminui em #N 2#!.\nO projeto continua."
 ve_cul_evt.7.e:0 "Reconstruir a coalizão."
 ve_cul_evt.7.e.tt:0 "Gastar #N 15#! Mandato Cultural.\nO progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 2#!.\n#N 0,5%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população em [SCOPE.sState('ve_evt_target_state').GetName] se torna Radical.\nO projeto continua."

 ve_rel_evt.8.t:0 "Uma concordância local inesperada"
 ve_rel_evt.8.d:0 "Clérigos, funcionários municipais e anciãos da comunidade em [SCOPE.sState('ve_evt_target_state').GetName] chegamos a um acordo que nenhuma directiva central poderia ter produzido. A resistência local está a diminuir, as congregações estão a coordenar elas próprias a missão e a Conversão Confessional adquiriu um impulso inesperado."
 ve_rel_evt.8.f:0 "“O que começou como uma ordem da capital tornou-se um pacto feito na praça da cidade.”"
 ve_rel_evt.8.a:0 "Use esse impulso ao máximo."
 ve_rel_evt.8.a.tt:0 "Assentamento Religioso aumenta em #P 1#!.\nO progresso do Projeto Religioso aumenta em #P 25#!.\nSe o progresso atingir #Y 100#!, o efeito de conclusão normal do projeto é aplicado."
 ve_rel_evt.8.b:0 "Durabilidade antes da velocidade."
 ve_rel_evt.8.b.tt:0 "Assentamento Religioso aumenta em #P 4#!.\nO progresso do Projeto Religioso aumenta em #P 10#!.\nSe o progresso atingir #Y 100#!, o efeito normal de conclusão do projeto será aplicado."

 ve_cul_evt.8.t:0 "Uma Coalizão Cívica Local"
 ve_cul_evt.8.d:0 "Professores, autoridades municipais, associações comerciais e representantes do [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidade in [SCOPE.sState('ve_evt_target_state').GetName] formaram um comitê comum. Ao resolver disputas antes de chegarem à capital, esta coligação deu à Iniciativa de Cidadania Igualitária um impulso que a administração não conseguiu fabricar."
 ve_cul_evt.8.f:0 "\\"A cidadania tornou-se real quando instituições que raramente partilhavam uma mesa começaram a partilhar responsabilidades.\""
 ve_cul_evt.8.a:0 "Aproveite o impulso da coalizão."
 ve_cul_evt.8.a.tt:0 "A coesão nacional aumenta em #P 1#!.\nO progresso do Projeto Cultural aumenta em #P 25#!.\nSe o progresso atingir #Y 100#!, o efeito normal de conclusão do projeto é aplicado."
 ve_cul_evt.8.b:0 "Tornar as instituições permanentes."
 ve_cul_evt.8.b.tt:0 "A Coesão Nacional aumenta em #P 4#!.\nO progresso do Projeto Cultural aumenta em #P 10#!.\nSe o progresso atingir #Y 100#!, o efeito normal de conclusão do projeto é aplicado."

 ve_rel_evt.40.t:0 "Registros fora de sintonia"
 ve_rel_evt.40.d:0 "Os registros provinciais in [SCOPE.sState('ve_evt_target_state').GetName] usam categorias incompatíveis para congregações, associações cívicas e instituições públicas. Os relatórios que chegam à capital agora se contradizem, deixando o projeto incapaz de distinguir o cumprimento da resistência."
 ve_rel_evt.40.f:0 "\\"Uma política administrada através de três livros logo adquire três realidades diferentes.\\""
 ve_rel_evt.40.a:0 "Envie uma auditoria central."
 ve_rel_evt.40.a.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nAssentamento Religioso aumenta em #P 1#!."
 ve_rel_evt.40.b:0 "Reconcilie os registros localmente."
 ve_rel_evt.40.b.tt:0 "O progresso do Projeto Religioso diminui em #N 3#!.\nO Assentamento Religioso aumenta em #P 2#!."
 ve_rel_evt.40.c:0 "Aplique o procedimento de registro padrão."
 ve_rel_evt.40.c.tt:0 "Gaste #N 5#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 4#!.\nO assentamento religioso aumenta em #P 1#!."

 ve_rel_evt.41.t:0 "Falta de pessoal provincial"
 ve_rel_evt.41.d:0 "Os escritórios que dirigem o projeto em [SCOPE.sState('ve_evt_target_state').GetName] não consegue encontrar funcionários, professores e inspetores treinados em número suficiente. As directivas estão a acumular-se mais rapidamente do que as autoridades locais conseguem interpretá-las, e as nomeações apressadas ameaçam piorar cada disputa."
 ve_rel_evt.41.f:0 "“O decreto chegou em um dia. As pessoas capazes de cumpri-lo podem levar uma geração.”"
 ve_rel_evt.41.a:0 "Financiar um novo quadro de funcionários."
 ve_rel_evt.41.a.tt:0 "Gaste #N 15#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 6#!."
 ve_rel_evt.41.b:0 "Retarda a implementação."
 ve_rel_evt.41.b.tt:0 "O progresso do Projeto Religioso diminui em #N 6#!.\nO Assentamento Religioso aumenta em #P 2#!."
 ve_rel_evt.41.c:0 "Use a rede educacional existente."
 ve_rel_evt.41.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nO assentamento religioso aumenta em #P 1#!."

 ve_rel_evt.42.t:0 "Rumores em todo o distrito"
 ve_rel_evt.42.d:0 "Rumores em [SCOPE.sState('ve_evt_target_state').GetName] afirmam que o projeto esconde medidas muito mais duras do que as anunciadas pelo governo. Organizadores religiosos e agitadores locais repetem histórias contraditórias, enquanto o silêncio oficial dá espaço para que cada nova versão se espalhe."
 ve_rel_evt.42.f:0 "\\"Um boato não requer escritório, nem orçamento, nem assinatura.\\""
 ve_rel_evt.42.a:0 "Publique os relatórios."
 ve_rel_evt.42.a.tt:0 "O progresso do Projeto Religioso diminui em #N 3#!.\nAssentamento Religioso aumenta em #P 4#!."
 ve_rel_evt.42.b:0 "Rejeite a agitação."
 ve_rel_evt.42.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 5#!.\nAssentamento Religioso diminui em #N 3#!.\n#N 1%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.42.c:0 "Comissione mediadores locais."
 ve_rel_evt.42.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 4#!.\nAssentamento Religioso aumenta em #P 2#!.\n#P 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Legalista."

 ve_rel_evt.43.t:0 "A Administração no Ponto de Ruptura"
 ve_rel_evt.43.d:0 "O projeto em [SCOPE.sState('ve_evt_target_state').GetName] está se aproximando do colapso administrativo. Os gabinetes provinciais estão sobrecarregados, a confiança pública foi abalada e a oposição organizada trata agora cada nova directiva como prova de que o governo perdeu o controlo."
 ve_rel_evt.43.f:0 "\\"Quando os ficheiros param de circular, a crise vai para as ruas.\""
 ve_rel_evt.43.a:0 "Encerre o programa."
 ve_rel_evt.43.a.tt:0 "Cancelar o Projeto Religioso sem reembolso da Reforma Piedade.\nAssentamento Religioso diminui em #N 5#!.\nPor #Y 2 anos#!: #N -50#! Burocracia, #N -50#! Autoridade e #N -3%#! Sucesso na promulgação da lei."
 ve_rel_evt.43.b:0 "Transferência de recursos de emergência."
 ve_rel_evt.43.b.tt:0 "Gaste #N 25#! Reforma da Piedade.\nO progresso do projeto religioso diminui em #N 5#!.\n#N 1%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."
 ve_rel_evt.43.c:0 "Continue com uma equipe esquelética."
 ve_rel_evt.43.c.tt:0 "O progresso do Projeto Religioso diminui em #N 10#!.\nAssentamento Religioso diminui em #N 2#!.\nO projeto continua."
 ve_rel_evt.43.e:0 "Reconstruir a parceria local."
 ve_rel_evt.43.e.tt:0 "Gastar #N 15#! Reforma da Piedade.\nO progresso do Projeto Religioso diminui em #N 3#!.\nAssentamento Religioso aumenta em #P 2#!.\n#N 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."

 ve_rel_evt.100.t:0 "Assentos no Conselho Inter-religioso"
 ve_rel_evt.100.d:0 "Delegados em [SCOPE.sState('ve_evt_target_state').GetName] concordam que um conselho inter-religioso é necessário, mas não sobre quem merece um assento. A representação proporcional tranquilizaria as comunidades mais pequenas, enquanto um assentamento fixo concebido na capital poderia começar a funcionar imediatamente."
 ve_rel_evt.100.f:0 "\\"Todos apoiam uma mesa comum até que as cadeiras sejam contadas.\\""
 ve_rel_evt.100.a:0 "Distribuir a representação por população."
 ve_rel_evt.100.a.tt:0 "O progresso do Projeto Religioso diminui em #N 3#!.\nAssentamento Religioso aumenta em #P 4#!."
 ve_rel_evt.100.b:0 "Impõe um compromisso central fixo."
 ve_rel_evt.100.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 5#!.\nAssentamento Religioso diminui em #N 2#!.\n#N 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.100.c:0 "Capacitar os Conselhos Inter-religiosos."
 ve_rel_evt.100.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nAssentamento Religioso aumenta em #P 2#!."

 ve_rel_evt.101.t:0 "Um currículo escolar compartilhado"
 ve_rel_evt.101.d:0 "Escolas em [SCOPE.sState('ve_evt_target_state').GetName] precisam de lições cívicas comuns sem transformar o Freedom Outreach numa campanha contra a crença local. Os professores solicitam materiais claros e formação conjunta, enquanto os líderes comunitários insistem que o ensino local reserve espaço para as suas tradições."
 ve_rel_evt.101.f:0 "\\"Uma aula compartilhada só terá sucesso se cada família reconhecer a sala de aula como sua.\\""
 ve_rel_evt.101.a:0 "Financiar um quadro de ensino comum."
 ve_rel_evt.101.a.tt:0 "Gastar #N 15#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 6#!.\nAssentamento Religioso aumenta em #P 1#!."
 ve_rel_evt.101.b:0 "Deixa espaço para currículos locais."
 ve_rel_evt.101.b.tt:0 "O progresso do Projeto Religioso diminui em #N 4#!.\nAssentamento Religioso aumenta em #P 3#!."
 ve_rel_evt.101.c:0 "Traga a coalizão de reforma para as escolas."
 ve_rel_evt.101.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nAssentamento Religioso aumenta em #P 2#!.\n#P 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se legalista."

 ve_rel_evt.102.t:0 "Uma Carta de Garantias Mútuas"
 ve_rel_evt.102.d:0 "Comunidades religiosas, funcionários municipais e associações reformistas em [SCOPE.sState('ve_evt_target_state').GetName] redigiram uma carta comum. Cada signatário aceita as mesmas obrigações cívicas em troca de garantias públicas de que nenhuma comunidade será excluída das instituições locais."
 ve_rel_evt.102.f:0 "\\"A confiança tornou-se possível quando cada promessa foi escrita como um direito de outra parte.\\""
 ve_rel_evt.102.a:0 "Use o impulso do pacto."
 ve_rel_evt.102.a.tt:0 "Assentamento Religioso aumenta em #P 2#!.\nO progresso do Projeto Religioso aumenta em #P 20#!.\nSe o progresso atingir #Y 100#!, o efeito de conclusão normal do projeto é aplicado."
 ve_rel_evt.102.b:0 "Torna as garantias permanentes."
 ve_rel_evt.102.b.tt:0 "Assentamento Religioso aumenta em #P 4#!.\n#P 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Legalista.\nO progresso do Projeto Religioso aumenta em #P 10#!.\nSe o progresso atingir #Y 100#!, o efeito normal de conclusão do projeto é aplicado."

 ve_rel_evt.150.t:0 "Professores ou Inspetores?"
 ve_rel_evt.150.d:0 "A Campanha de Secularização em [SCOPE.sState('ve_evt_target_state').GetName] expôs a falta de pessoal alfabetizado. A administração pode expandir o corpo docente que desenvolve capacidade cívica a longo prazo, ou contar com inspectores que possam fazer cumprir as novas regras com o pessoal já disponível."
 ve_rel_evt.150.f:0 "“Um inspetor pode fechar uma escola em uma tarde. Um professor pode levar anos para substituir o que foi ensinado lá.”"
 ve_rel_evt.150.a:0 "Expandir o corpo docente."
 ve_rel_evt.150.a.tt:0 "Gastar #N 15#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 6#!."
 ve_rel_evt.150.b:0 "Retarda o programa para corresponder ao pessoal existente."
 ve_rel_evt.150.b.tt:0 "O progresso do Projeto Religioso diminui em #N 5#!.\nAssentamento Religioso aumenta em #P 2#!."
 ve_rel_evt.150.c:0 "Comissionar a rede de educação pública."
 ve_rel_evt.150.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nAssentamento Religioso aumenta em #P 1#!."

 ve_rel_evt.151.t:0 "Os Bens Apreendidos"
 ve_rel_evt.151.d:0 "Ex-propriedades religiosas em [SCOPE.sState('ve_evt_target_state').GetName] estejam prontos para serem convertidos em escolas, clínicas e escritórios cívicos. A transferência imediata daria à campanha uma infra-estrutura valiosa, mas a ausência de compensação está a tornar-se um ponto de encontro para os Devotos."
 ve_rel_evt.151.f:0 "\"As chaves mudaram de mãos pela manhã. A discussão sobre a propriedade sobreviverá às fechaduras.\""
 ve_rel_evt.151.a:0 "Pague a compensação em etapas."
 ve_rel_evt.151.a.tt:0 "Gaste #N 15#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 3#!.\nAssentamento Religioso aumenta em #P 3#!."
 ve_rel_evt.151.b:0 "Coloque as propriedades no serviço público imediatamente."
 ve_rel_evt.151.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 7#!.\nAssentamento Religioso diminui em #N 4#!.\n#N 1%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nOs Devotos perdem #N 1#! Aprovação para #Y 2,5 anos#!."
 ve_rel_evt.151.c:0 "Transfira-os para instituições de bem-estar seculares."
 ve_rel_evt.151.c.tt:0 "Gaste #N 10#! Reforma da Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nO assentamento religioso aumenta em #P 2#!.\n#P 0,5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se legalista."

 ve_rel_evt.152.t:0 "Associações cívicas criam raízes"
 ve_rel_evt.152.d:0 "Círculos de professores, sociedades de ajuda mútua e associações municipais em [SCOPE.sState('ve_evt_target_state').GetName] começaram a prestar serviços antes organizados através de instituições religiosas. A sua cooperação deu à Campanha de Secularização uma fundação cívica local em vez de apenas uma presença administrativa."
 ve_rel_evt.152.f:0 "\\"A nova ordem perdurou quando os cidadãos começaram a mantê-la sem esperar por um inspetor.\\""
 ve_rel_evt.152.a:0 "Use o impulso local."
 ve_rel_evt.152.a.tt:0 "O Assentamento Religioso aumenta em #P 2#!.\nO progresso do Projeto Religioso aumenta em #P 20#!.\nSe o progresso atingir #Y 100#!, o efeito de conclusão normal do projeto é aplicado."
 ve_rel_evt.152.b:0 "Transformar as associações em instituições permanentes."
 ve_rel_evt.152.b.tt:0 "Assentamento Religioso aumenta em #P 4#!.\nO progresso do Projeto Religioso aumenta em #P 10#!.\nSe o progresso atingir #Y 100#!, o efeito normal de conclusão do projeto é aplicado."

 ve_cul_evt.40.t:0 "Conselhos Escolares Locais"
 ve_cul_evt.40.d:0 "Conselhos escolares em [SCOPE.sState('ve_evt_target_state').GetName] discordar sobre o local do [SCOPE.sCulture('ve_evt_target_culture').GetName] língua no ensino público. O ensino do idioma local preservaria a confiança, enquanto um único idioma administrativo tornaria o projeto nacional mais fácil de dirigir."
 ve_cul_evt.40.f:0 "\\"O idioma escolhido para a primeira aula muitas vezes decide quem acredita que a escola pertence a eles.\\""
 ve_cul_evt.40.a:0 "Proteja o idioma local."
 ve_cul_evt.40.a.tt:0 "O progresso do projeto cultural diminui em #N 4#!.\nA coesão nacional aumenta em #P 3#!."
 ve_cul_evt.40.b:0 "Impor um idioma administrativo."
 ve_cul_evt.40.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional diminui em #N 2#!.\n#N 0,5%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população em [SCOPE.sState('ve_evt_target_state').GetName] se torna Radical."
 ve_cul_evt.40.c:0 "Expandir a rede de professores."
 ve_cul_evt.40.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!.\nA Coesão Nacional aumenta por #P 2#!."

 ve_cul_evt.41.t:0 "Limites Estatísticos"
 ve_cul_evt.41.d:0 "As autoridades que pesquisam [SCOPE.sState('ve_evt_target_state').GetName] não conseguem concordar onde a [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidade começa e termina. As identidades locais se sobrepõem em termos de idioma, distrito e costumes, mas o projeto nacional exige categorias que possam ser contadas e administradas."
 ve_cul_evt.41.f:0 "\\"Uma fronteira traçada para o censo logo adquire funcionários, orçamentos e defensores.\\""
 ve_cul_evt.41.a:0 "Deixa espaço para a autoidentificação."
 ve_cul_evt.41.a.tt:0 "O progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.41.b:0 "Deixe o centro definir os limites."
 ve_cul_evt.41.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão Nacional diminui em #N 3#!.\n#N 0,5%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.41.c:0 "Use o sistema de registro padrão."
 ve_cul_evt.41.c.tt:0 "Gaste #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 1#!."

 ve_cul_evt.42.t:0 "O Projeto Nacional no Ponto de Ruptura"
 ve_cul_evt.42.d:0 "O projeto nacional em [SCOPE.sState('ve_evt_target_state').GetName] está se aproximando do colapso. Os movimentos radicais afirmam que o governo traiu o [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidade ou se rendeu a ela, enquanto os escritórios locais não possuem mais a confiança necessária para impor outro compromisso."
 ve_cul_evt.42.f:0 "\\"Um assentamento atacado como coerção e rendição pode em breve deixar de ser um acordo.\\""
 ve_cul_evt.42.a:0 "Terminar o projeto."
 ve_cul_evt.42.a.tt:0 "Cancelar o Projeto Cultural sem reembolso do Mandato Cultural.\nA Coesão Nacional diminui em #N 5#!.\nPor #Y 2 anos#!: #N -50#! Burocracia, #N -25#! Autoridade e #N -3%#! Sucesso na promulgação da lei."
 ve_cul_evt.42.b:0 "Transferir recursos locais de emergência."
 ve_cul_evt.42.b.tt:0 "Gastar #N 25#! Mandato Cultural.\nO progresso do Projeto Cultural diminui em #N 5#!.\n#N 1%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população in [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."
 ve_cul_evt.42.c:0 "Continua com um programa mínimo."
 ve_cul_evt.42.c.tt:0 "O progresso do Projeto Cultural diminui em #N 10#!.\nA Coesão Nacional diminui em #N 2#!.\nO projeto continua."
 ve_cul_evt.42.e:0 "Reconstruir a estrutura de negociação."
 ve_cul_evt.42.e.tt:0 "Gastar #N 15#! Mandato Cultural.\nO progresso do Projeto Cultural diminui em #N 3#!.\nA coesão nacional aumenta em #P 2#!.\n#N 0,5%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."

 ve_cul_evt.50.t:0 "A Diretiva de Sobrenome e Idioma"
 ve_cul_evt.50.d:0 "Funcionários em [SCOPE.sState('ve_evt_target_state').GetName] propor a padronização de sobrenomes e registros públicos na língua nacional. A directiva tornaria o [SCOPE.sCulture('ve_evt_target_culture').GetName] É mais fácil classificar a população pela administração central, mas as famílias temem que a identidade privada se esteja a tornar um objecto de comando do Estado."
 ve_cul_evt.50.f:0 "\\"Um nome escrito de forma diferente no registro ainda pode ser o nome pelo qual uma família se lembra de si mesma.\\""
 ve_cul_evt.50.a:0 "Financie uma campanha de registro gradual."
 ve_cul_evt.50.a.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!.\nA Coesão Nacional aumenta em #P 1#!.\n#N 0,5%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população em [SCOPE.sState('ve_evt_target_state').GetName] se torna Radical."
 ve_cul_evt.50.b:0 "Aplicar um padrão nacional."
 ve_cul_evt.50.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 7#!.\nA Coesão Nacional diminui em #N 4#!.\n#N 1%#! da [SCOPE.sCulture('ve_evt_target_culture').GetName] população [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.50.c:0 "Retirar a directiva para revisão."
 ve_cul_evt.50.c.tt:0 "O progresso do Projecto Cultural diminui em #N 5#!.\nA Coesão Nacional aumenta em #P 3#!."

 ve_cul_evt.51.t:0 "Os Registros de Conscrição"
 ve_cul_evt.51.d:0 "Oficiais militares em [SCOPE.sState('ve_evt_target_state').GetName] exigir um único registro para obrigações de serviço, sobrenomes e comandos. Aplicando-o ao [SCOPE.sCulture('ve_evt_target_culture').GetName] a população fortaleceria o impulso de integração étnica, mas a resistência está a crescer entre as comunidades que vêem o exército como outro instrumento de apagamento cultural."
 ve_cul_evt.51.f:0 "\\"O estado aprende primeiro os nomes de uma aldeia quando deseja cobrar os seus impostos ou convocar os seus filhos.\""
 ve_cul_evt.51.a:0 "Aplicar os registros nacionais."
 ve_cul_evt.51.a.tt:0 "O progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional diminui em #N 2#!.\n#N 0,5%#! do [SCOPE.sCulture('ve_evt_target_culture').GetName] população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se radical."
 ve_cul_evt.51.b:0 "Preservar as práticas de registro locais."
 ve_cul_evt.51.b.tt:0 "O progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.51.c:0 "Integrar os registros através do serviço militar."
 ve_cul_evt.51.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão Nacional aumenta em #P 1#!.\n#N 0,5%#! do [SCOPE.sCulture('ve_evt_target_culture').GetName] população in [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."

 ve_cul_evt.100.t:0 "A Delegação Constituinte"
 ve_cul_evt.100.d:0 "Uma delegação do [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidade em [SCOPE.sState('ve_evt_target_state').GetName] chegou com reivindicações de representação nas instituições do Pacto Constituinte. A negociação atrasaria o projecto, mas reforçaria a sua legitimidade; um acordo imposto pela capital poderia avançar mais rapidamente à custa da confiança."
 ve_cul_evt.100.f:0 "“Um pacto se torna comum somente quando cada constituinte pode apontar para uma cláusula que ajudou a escrever.”"
 ve_cul_evt.100.a:0 "Negocie seu lugar no pacto."
 ve_cul_evt.100.a.tt:0 "O progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 4#!."
 ve_cul_evt.100.b:0 "Impõe o acordo central."
 ve_cul_evt.100.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional diminui em #N 2#!.\n#N 0,5%#! do [SCOPE.sCulture('ve_evt_target_culture').GetName] população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se radical."
 ve_cul_evt.100.c:0 "Traga a coalizão parlamentar para as negociações."
 ve_cul_evt.100.c.tt:0 "Gaste #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!.\nA coesão nacional aumenta em #P 2#!."

 ve_cul_evt.101.t:0 "Administração Dupla"
 ve_cul_evt.101.d:0 "O Pacto Constituinte em [SCOPE.sState('ve_evt_target_state').GetName] depende agora de duas administrações sobrepostas. Funcionários centrais e representantes do [SCOPE.sCulture('ve_evt_target_culture').GetName] a comunidade duplica registos, contesta nomeações e emite instruções contraditórias enquanto a burocracia do país se aproxima da exaustão."
 ve_cul_evt.101.f:0 "\"Dois escritórios podem compartilhar autoridade com mais facilidade do que um arquivo.\""
 ve_cul_evt.101.a:0 "Financiar uma equipe administrativa conjunta."
 ve_cul_evt.101.a.tt:0 "Gastar #N 15#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 6#!."
 ve_cul_evt.101.b:0 "Retarde o pacto até que os escritórios concordem."
 ve_cul_evt.101.b.tt:0 "O progresso do Projeto Cultural diminui em #N 6#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.101.c:0 "Unificar os cargos da função pública."
 ve_cul_evt.101.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projecto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 2#!."

 ve_cul_evt.150.t:0 "Implementação nas Províncias"
 ve_cul_evt.150.d:0 "As administrações provinciais relatam que o projecto cultural nacional está a avançar a velocidades radicalmente diferentes. Alguns escritórios exigem comissões de implementação financiadas, enquanto outros alertam que impor um cronograma único para cada região consumirá pessoal escasso e enfraquecerá a confiança do público."
 ve_cul_evt.150.f:0 "\\"Um decreto nacional é escrito uma vez, mas deve ser implementado em todos os escritórios do país.\""
 ve_cul_evt.150.a:0 "Financiar as comissões de implementação."
 ve_cul_evt.150.a.tt:0 "Gastos #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!."
 ve_cul_evt.150.b:0 "Use um cronograma gradual."
 ve_cul_evt.150.b.tt:0 "O progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.150.c:0 "Padronizar a administração existente."
 ve_cul_evt.150.c.tt:0 "Gastar #N 5#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 2#!."

 ve_cul_evt.151.t:0 "A Linguagem de Instrução"
 ve_cul_evt.151.d:0 "O Currículo Nacional exige uma língua de ensino comum, mas as escolas de todo o país servem comunidades com tradições linguísticas muito diferentes. Os materiais multilingues preservariam a confiança, mas atrasariam a distribuição, enquanto um currículo único poderia chegar rapidamente às salas de aula, correndo o risco de transformar a educação num concurso cultural."
 ve_cul_evt.151.f:0 "“Uma lição ministrada em um idioma em que o aluno não confia pode ser lembrada por tudo, exceto pelo assunto.”"
 ve_cul_evt.151.a:0 "Financie materiais multilíngues."
 ve_cul_evt.151.a.tt:0 "Gaste #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.151.b:0 "Aplicar um currículo nacional."
 ve_cul_evt.151.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão Nacional diminui em #N 3#!."
 ve_cul_evt.151.c:0 "Unir as redes de ensino e bem-estar."
 ve_cul_evt.151.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 2#!."

 ve_cul_evt.160.t:0 "Quem Representa a Nação?"
 ve_cul_evt.160.d:0 "O projeto Símbolos Compartilhados reabriu a questão de qual história, uniformes, monumentos e cerimônias podem representar todo o país. A rotação das tradições ampliaria o reconhecimento, mas retardaria o acordo; selecionar uma narrativa oficial criaria clareza, ao mesmo tempo que deixaria muitos cidadãos de fora dela."
 ve_cul_evt.160.f:0 "\\"Um símbolo se torna nacional somente quando os cidadãos se veem nele sem precisar de explicação.\\""
 ve_cul_evt.160.a:0 "Rodar os símbolos no uso público."
 ve_cul_evt.160.a.tt:0 "O progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 4#!."
 ve_cul_evt.160.b:0 "Selecione uma narrativa oficial."
 ve_cul_evt.160.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão Nacional diminui em #N 3#!."
 ve_cul_evt.160.c:0 "Projete uma cerimônia pública compartilhada."
 ve_cul_evt.160.c.tt:0 "Gaste #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!.\nA Coesão Nacional aumenta em #P 2#!."
