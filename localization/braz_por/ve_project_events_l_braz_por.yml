l_braz_por:
 ve_je_religious_project:0 "Projeto Religioso"
 ve_je_religious_project_reason:0 "O governo está conduzindo um projeto religioso de longo prazo. O seu progresso é regido por capacidade administrativa, legitimidade política, condições religiosas e eventos no estado alvo."
 ve_je_religious_project_progress:0 "Progresso do Projeto Religioso rumo à conclusão"
 ve_je_religious_project_status_confessional:0 "A Conversão Confessional em [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] busca expandir a fé do estado por meio de uma campanha organizada.\n\nConclusão a #Y 125#! de progresso: converte 5% da população do estado alvo para a religião do estado, restitui #P 20#! de Fundo de Piedade e adiciona #P 5#! de Concordata Religiosa."
 ve_je_religious_project_status_freedom:0 "A Ação Comunitária de Consciência em [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] está construindo uma concórdia baseada na consciência e associação voluntária.\n\nConclusão a #Y 100#! de progresso: adiciona lealistas ao estado sem conversão forçada, restitui #P 20#! de Fundo de Piedade e adiciona #P 7#! de Concordata Religiosa."
 ve_je_religious_project_status_secularization:0 "A Campanha de Secularização em [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] está reduzindo a autoridade pública da religião organizada.\n\nConclusão a #Y 150#! de progresso: converte 5% da população do estado alvo para o ateísmo, restitui #P 25#! de Fundo de Piedade e adiciona #P 8#! de Concordata Religiosa."
 ve_je_religious_project_complete_tt:0 "O Projeto Religioso atingiu seu objetivo."
 ve_je_religious_project_fail_tt:0 "O Projeto Religioso foi cancelado."

 ve_je_cultural_project:0 "Projeto Cultural"
 ve_je_cultural_project_reason:0 "O governo está conduzindo um projeto cultural de longo prazo. Capacidade administrativa, legitimidade, educação, coesão nacional e condições locais determinam o seu ritmo."
 ve_je_cultural_project_progress:0 "Progresso do Projeto Cultural rumo à conclusão"
 ve_je_cultural_project_status_curriculum:0 "Um Currículo Nacional está sendo preparado para as escolas e instituições do país.\n\nConclusão a #Y 100#! de progresso: #P +20#! de Mandato Cultural, #P +5#! de Coesão Nacional e um resultado de 10 anos de +2% de Acesso à Educação, +5% de Qualificações, -25 de Burocracia."
 ve_je_cultural_project_status_symbols:0 "Um programa de Símbolos Compartilhados está forjando um vocabulário cívico comum.\n\nConclusão a #Y 75#! de progresso: #P +20#! de Mandato Cultural, #P +7#! de Coesão Nacional e um resultado de 8 anos de +10% de lealistas de pops totalmente aceitos e +25 de Autoridade."
 ve_je_cultural_project_status_ethnic:0 "A Campanha de Integração Étnica em [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] está pressionando uma população minoritária em direção à cultura primária.\n\nConclusão a #Y 125#! de progresso: converte 5% dos pops da cultura alvo para a cultura primária (7% com Nacionalista VII), #P +25#! de Mandato Cultural, #P +8#! de Coesão Nacional e um resultado de assimilação de 10 anos."
 ve_je_cultural_project_status_civic:0 "A Iniciativa de Cidadania Igualitária em [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] está estendendo um status cívico comum através de divisões culturais.\n\nConclusão a #Y 100#! de progresso: +15% de Aceitação por 10 anos, lealistas no estado, #P +25#! de Mandato Cultural, #P +10#! de Coesão Nacional e um resultado de qualificações/migração de 10 anos."
 ve_je_cultural_project_status_composite:0 "O Pacto Constituinte em [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] está negociando reconhecimento permanente dentro de um estado composto.\n\nConclusão a #Y 150#! de progresso (requer 40+ de Coesão Nacional): +15% de Aceitação permanente, adiciona a cultura à lista constituinte, lealistas no estado, #P +30#! de Mandato Cultural, #P +12#! de Coesão Nacional."
 ve_je_cultural_project_complete_tt:0 "O Projeto Cultural atingiu seu objetivo."
 ve_je_cultural_project_fail_tt:0 "O Projeto Cultural foi cancelado."
 ve_je_project_resolving_status:0 "A administração do projeto está protocolando seu relatório final."

 ve_evt_religious_incident_cooldown_mdf:0 "Esfriamento de Incidente do Projeto Religioso"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "A administração do projeto está absorvendo as consequências de um incidente recente."
 ve_evt_cultural_incident_cooldown_mdf:0 "Esfriamento de Incidente do Projeto Cultural"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "A administração do projeto está absorvendo as consequências de um incidente recente."
 ve_evt_central_clergy_supported_mdf:0 "Clero Central Apoiado"
 ve_evt_central_clergy_supported_mdf_desc:0 "O governo apoiou a autoridade da hierarquia religiosa central."
 ve_evt_central_clergy_slighted_mdf:0 "Clero Central Ignorado"
 ve_evt_central_clergy_slighted_mdf_desc:0 "O governo favoreceu a prática local em detrimento das preferências da hierarquia religiosa central."
 ve_evt_municipal_patronage_mdf:0 "Redes de Patronagem Municipal"
 ve_evt_municipal_patronage_mdf_desc:0 "Notáveis locais estão promovendo o projeto por meio de acordos que enfraquecem a cobrança de impostos."

 ve_rel_evt.1.t:0 "A Petição dos Notáveis Locais"
 ve_rel_evt.1.d:0 "Uma delegação de clérigos, figuras municipais e anciãos de bairro de [SCOPE.sState('ve_evt_target_state').GetName] peticionou ao governo para desacelerar a Conversão Confessional. Eles alertam que um cronograma inflexível transformará a obediência em ressentimento duradouro."
 ve_rel_evt.1.f:0 "\"A fé imposta sem conselho pode preencher os registros enquanto esvazia os bancos.\""
 ve_rel_evt.1.a:0 "Ouvir a petição deles."
 ve_rel_evt.1.a.tt:0 "O progresso do Projeto Religioso diminui em #N 4#!.\nO Assentamento Religioso aumenta em #P 3#!."
 ve_rel_evt.1.b:0 "O cronograma não mudará."
 ve_rel_evt.1.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 5#!.\nO Assentamento Religioso diminui em #N 2#!.\n#N 0.5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.1.c:0 "Comissionar intermediários de confiança."
 ve_rel_evt.1.c.tt:0 "Gastar #N 10#! Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 3#!.\nO Assentamento Religioso aumenta em #P 1#!."

 ve_rel_evt.2.t:0 "Escassez de de Oficiais de Campo"
 ve_rel_evt.2.d:0 "Relatórios de [SCOPE.sState('ve_evt_target_state').GetName] descrevem petições sem resposta, instruções contraditórias e distritos que não veem um oficial de projetos há semanas. A Conversão Confessional está superando a administração encarregada de realizá-la."
 ve_rel_evt.2.f:0 "\"Um decreto pode cruzar o país em um dia. Um escrivão competente não.\""
 ve_rel_evt.2.a:0 "Contratar oficiais de campo temporários."
 ve_rel_evt.2.a.tt:0 "Gastar #N 15#! Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 4#!."
 ve_rel_evt.2.b:0 "Desacelerar o programa."
 ve_rel_evt.2.b.tt:0 "O progresso do Projeto Religioso diminui em #N 6#!.\nO Assentamento Religioso aumenta em #P 2#!."
 ve_rel_evt.2.c:0 "Utilizar os quadros do registro central."
 ve_rel_evt.2.c.tt:0 "Gastar #N 10#! Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!."

 ve_cul_evt.1.t:0 "As Repartições de Tradução"
 ve_cul_evt.1.d:0 "Autoridades em [SCOPE.sState('ve_evt_target_state').GetName] discordam sobre como a Iniciativa de Cidadania Igualitária deve tratar o idioma de [SCOPE.sCulture('ve_evt_target_culture').GetName]. Administradores locais querem escritórios bilíngues; ministérios centrais exigem um padrão administrativo único."
 ve_cul_evt.1.f:0 "\"Um cidadão não deveria precisar de um intérprete para compreender os direitos concedidos em seu próprio nome.\""
 ve_cul_evt.1.a:0 "Permitir que os idiomas locais vivam em instituições públicas."
 ve_cul_evt.1.a.tt:0 "O progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.1.b:0 "Impor um padrão administrativo."
 ve_cul_evt.1.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional diminui em #N 2#!.\n#N 0.5%#! da população de [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.1.c:0 "Estabelecer uma comissão acadêmica de tradução."
 ve_cul_evt.1.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 1#!."

 ve_cul_evt.2.t:0 "Escassez de Professores Locais"
 ve_cul_evt.2.d:0 "As escolas de [SCOPE.sState('ve_evt_target_state').GetName] carecem de professores capazes de atender tanto ao currículo estatal quanto às comunidades de [SCOPE.sCulture('ve_evt_target_culture').GetName]. Sem um quadro local treinado, a cidadania igualitária corre o risco de permanecer uma promessa escrita apenas no papel oficial."
 ve_cul_evt.2.f:0 "\"A lei declara a igualdade em uma tarde; a sala de aula deve ensiná-la por uma geração.\""
 ve_cul_evt.2.a:0 "Financiar novas faculdades de formação de professores."
 ve_cul_evt.2.a.tt:0 "Gastar #N 15#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!."
 ve_cul_evt.2.b:0 "Desacelerar a implementação."
 ve_cul_evt.2.b.tt:0 "O progresso do Projeto Cultural diminui em #N 6#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.2.c:0 "Utilizar as instituições já existentes."
 ve_cul_evt.2.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 1#!."

 ve_rel_evt.3.t:0 "Registros Conflitantes"
 ve_rel_evt.3.d:0 "Os registros paroquiais, os livros municipais e os relatórios dos oficiais de projeto fornecem relatos incompatíveis sobre a adesão religiosa em [SCOPE.sState('ve_evt_target_state').GetName]. A administração deve decidir entre perder tempo estabelecendo a verdade ou prosseguir com números que sabe serem incertos."
 ve_rel_evt.3.f:0 "\"Todo escritório possui um total exato. Nenhum dos dois totais concorda.\""
 ve_rel_evt.3.a:0 "Conduzir uma auditoria completa."
 ve_rel_evt.3.a.tt:0 "Ganhe #P 8#! Fundo de Piedade.\nO progresso do Projeto Religioso diminui em #N 6#!."
 ve_rel_evt.3.b:0 "Prosseguir com estimativas razoáveis."
 ve_rel_evt.3.b.tt:0 "Gaste #N 8#! Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!."
 ve_rel_evt.3.c:0 "Usar os registros da Administração Sagrada."
 ve_rel_evt.3.c.tt:0 "O progresso do Projeto Religioso aumenta em #P 3#!."

 ve_rel_evt.4.t:0 "Rumores e Contrapregação"
 ve_rel_evt.4.d:0 "Panfletos, sermões de rua e boatos ansiosos agora descrevem a Conversão Confessional em [SCOPE.sState('ve_evt_target_state').GetName] como um ataque à vida local. Oficiais alertam que o silêncio permitirá que os opositores definam o projeto, enquanto a repressão pode confirmar suas reivindicações mais sombrias."
 ve_rel_evt.4.f:0 "\"Um rumor não requer escritório, selo e nem orçamento.\""
 ve_rel_evt.4.a:0 "Realizar audiências públicas."
 ve_rel_evt.4.a.tt:0 "O progresso do Projeto Religioso diminui em #N 3#!.\nO Assentamento Religioso aumenta em #P 3#!.\n#P 0.5%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Lealista."
 ve_rel_evt.4.b:0 "Punir os Incitantes."
 ve_rel_evt.4.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 4#!.\nO Assentamento Religioso diminui em #N 3#!.\n#N 1%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.4.c:0 "Publicar os registros e resultados."
 ve_rel_evt.4.c.tt:0 "Gaste #N 10#! Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 2#!.\nO Assentamento Religioso aumenta em #P 1#!."

 ve_rel_evt.5.t:0 "A Linguagem do Sermão"
 ve_rel_evt.5.d:0 "O clero do projeto em [SCOPE.sState('ve_evt_target_state').GetName] relata que sermões formais preservam a unidade doutrinária, mas falham em alcançar muitos fiéis. A pregação em língua local faria a campanha avançar mais, embora a hierarquia central tema que a adaptação se torne independência."
 ve_rel_evt.5.f:0 "\"Uma palavra sagrada não ouvida é perfeitamente preservada — e recebida por ninguém.\""
 ve_rel_evt.5.a:0 "Pregar em línguas locais."
 ve_rel_evt.5.a.tt:0 "O progresso do Projeto Religioso aumenta em #P 6#!.\nOs Devotos perdem #N 1#! Aprovação do grupo por #Y 2.5 anos#!."
 ve_rel_evt.5.b:0 "Preservar a unidade litúrgica."
 ve_rel_evt.5.b.tt:0 "O progresso do Projeto Religioso diminui em #N 3#!.\nO Assentamento Religioso aumenta em #P 3#!.\nOs Devotos ganham #P 1#! Aprovação do grupo por #Y 2.5 anos#!."
 ve_rel_evt.5.c:0 "Treinar intérpretes instruídos."
 ve_rel_evt.5.c.tt:0 "Gaste #N 10#! Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 4#!.\nO Assentamento Religioso aumenta em #P 1#!."

 ve_rel_evt.6.t:0 "Autoridades Eclesiásticas Rivais"
 ve_rel_evt.6.d:0 "Nomeados centrais e o clero local estabelecido em [SCOPE.sState('ve_evt_target_state').GetName] reivindicam o direito de direcionar a Conversão Confessional. Apoiar um dos lados pode restaurar o Comando rapidamente, mas a disputa já se tornou um teste de quem fala em nome da fé."
 ve_rel_evt.6.f:0 "\"A contenda diz respeito à jurisdição, que é como as instituições descrevem o poder.\""
 ve_rel_evt.6.a:0 "Apoiar o clero central."
 ve_rel_evt.6.a.tt:0 "O progresso do Projeto Religioso aumenta em #P 5#!.\nOs Devotos ganham #P 1#! Aprovação do grupo por #Y 2.5 anos#!.\nO Assentamento Religioso diminui em #N 3#!.\n#N 0.5%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.6.b:0 "Apaziguar o clero local."
 ve_rel_evt.6.b.tt:0 "O progresso do Projeto Religioso diminui em #N 4#!.\nOs Devotos perdem #N 1#! Aprovação do grupo por #Y 2.5 anos#!.\nO Assentamento Religioso aumenta em #P 3#!."
 ve_rel_evt.6.c:0 "Definir os poderes deles por escrito."
 ve_rel_evt.6.c.tt:0 "Gaste #N 10#! Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 3#!.\nO Assentamento Religioso aumenta em #P 1#!."

 ve_cul_evt.3.t:0 "As Categorias do Censo"
 ve_cul_evt.3.d:0 "Os oficiais do censo em [SCOPE.sState('ve_evt_target_state').GetName] não conseguem entrar em acordo sobre como os cidadãos da cultura [SCOPE.sCulture('ve_evt_target_culture').GetName] devem ser registrados. Os respondentes locais usam identidades sobrepostas, enquanto os formulários centrais exigem uma resposta em uma única caixa."
 ve_cul_evt.3.f:0 "\"Uma categoria simplifica o livro-razão muito antes de simplificar o país.\""
 ve_cul_evt.3.a:0 "Permitir a autoidentificação."
 ve_cul_evt.3.a.tt:0 "O Progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 4#!."
 ve_cul_evt.3.b:0 "As categorias serão definidas centralmente."
 ve_cul_evt.3.b.tt:0 "O Progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão Nacional diminui em #N 4#!.\n#N 0.5%#! da População [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.3.c:0 "Usar o sistema de registro moderno."
 ve_cul_evt.3.c.tt:0 "Gasta #N 10#! Mandato Cultural.\nO Progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 1#!."

 ve_cul_evt.4.t:0 "Os Notáveis Municipais"
 ve_cul_evt.4.d:0 "Patronos municipais em [SCOPE.sState('ve_evt_target_state').GetName] oferecem seus escritórios, clientes e Influência para avançar a cidadania igualitária para a População [SCOPE.sCulture('ve_evt_target_culture').GetName]. A cooperação deles seria rápida, mas o preço é o controle contínuo sobre as receitas locais."
 ve_cul_evt.4.f:0 "\"O caminho mais curto para a prefeitura passa por vários salões privados.\""
 ve_cul_evt.4.a:0 "Usar as redes locais."
 ve_cul_evt.4.a.tt:0 "O Progresso do Projeto Cultural aumenta em #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] perde #N 5%#! de Artifício de Imposto por #Y 2 anos#!."
 ve_cul_evt.4.b:0 "Criar conselhos abertos."
 ve_cul_evt.4.b.tt:0 "O Progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.4.c:0 "Negociar um acordo baseado em regras."
 ve_cul_evt.4.c.tt:0 "Gasta #N 10#! Mandato Cultural.\nO Progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 1#!."

 ve_cul_evt.5.t:0 "Os Exames do Serviço Público"
 ve_cul_evt.5.d:0 "Abrir os exames do Serviço Público para candidatos da cultura [SCOPE.sCulture('ve_evt_target_culture').GetName] expôs uma lacuna entre a igualdade legal e a preparação prática. O acesso imediato seria simbolicamente Poderoso, mas anos de escolaridade desigual não podem ser apagados por Decreto."
 ve_cul_evt.5.f:0 "\"O mesmo exame não é a mesma oportunidade quando apenas um candidato foi ensinado em seu idioma.\""
 ve_cul_evt.5.a:0 "Financiar cursos preparatórios."
 ve_cul_evt.5.a.tt:0 "Gasta #N 15#! Mandato Cultural.\nO Progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.5.b:0 "O acesso igualitário começa imediatamente."
 ve_cul_evt.5.b.tt:0 "O Progresso do Projeto Cultural aumenta em #P 7#!.\nA Coesão Nacional diminui em #N 4#!.\n#N 0.5%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.5.c:0 "Mobilizar as redes escolares e de Bem-Estar Social."
 ve_cul_evt.5.c.tt:0 "Gasta #N 10#! Mandato Cultural.\nO Progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.5.e:0 "Reformar o sistema de exames primeiro."
 ve_cul_evt.5.e.tt:0 "O Progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 3#!."

 ve_cul_evt.6.t:0 "A Maioria Reage"
 ve_cul_evt.6.d:0 "Opositores da Iniciativa de Cidadania Igualitária alegam que estender direitos comuns à População [SCOPE.sCulture('ve_evt_target_culture').GetName] diminui o status de todos os outros. Manifestações em [SCOPE.sState('ve_evt_target_state').GetName] estão transformando uma reforma administrativa em um teste político nacional."
 ve_cul_evt.6.f:0 "\"Um direito compartilhado está sendo descrito como um privilégio roubado.\""
 ve_cul_evt.6.a:0 "Defender a iniciativa abertamente."
 ve_cul_evt.6.a.tt:0 "O Progresso do Projeto Cultural aumenta em #P 4#!.\nA Coesão Nacional diminui em #N 4#!.\n#N 1%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.6.b:0 "Reduzir o ritmo de implementação."
 ve_cul_evt.6.b.tt:0 "O Progresso do Projeto Cultural diminui em #N 5#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.6.c:0 "Mobilizar a coalizão de reforma."
 ve_cul_evt.6.c.tt:0 "Gasta #N 10#! Mandato Cultural.\nO Progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 2#!.\n#P 0.5%#! da População [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Lealista."

 ve_rel_evt.7.t:0 "A Missão no Ponto de Ruptura"
 ve_rel_evt.7.d:0 "A Conversão Confessional em [SCOPE.sState('ve_evt_target_state').GetName] está próxima do colapso administrativo e político. Os escritórios pararam de responder uns aos outros, a resistência pública está se endurecendo e o clero de campo adverte que a missão não pode continuar em seus termos atuais."
 ve_rel_evt.7.f:0 "\"Os relatórios ainda chamam isso de uma dificuldade temporária. As ruas escolheram um nome mais severo.\""
 ve_rel_evt.7.a:0 "Aceitar as perdas e retirar-se."
 ve_rel_evt.7.a.tt:0 "Cancela o Projeto Religioso sem reembolso de Fundo de Piedade.\nA Concordata Religiosa diminui em #N 5#!.\nPor #Y 2 anos#!: #N -50#! Burocracia, #N -50#! Autoridade e #N -3%#! de Sucesso da Promulgação de Leis."
 ve_rel_evt.7.b:0 "Transferir recursos de emergência."
 ve_rel_evt.7.b.tt:0 "Gasta #N 25#! de Fundo de Piedade.\nO progresso do Projeto Religioso diminui em #N 5#!.\n#N 1%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."
 ve_rel_evt.7.c:0 "Continuar com uma equipe reduzida."
 ve_rel_evt.7.c.tt:0 "O progresso do Projeto Religioso diminui em #N 10#!.\nA Concordata Religiosa diminui em #N 2#!.\nO projeto continua."
 ve_rel_evt.7.e:0 "Renegociar o método."
 ve_rel_evt.7.e.tt:0 "Gasta #N 15#! de Fundo de Piedade.\nO progresso do Projeto Religioso diminui em #N 3#!.\nA Concordata Religiosa aumenta em #P 2#!.\n#N 0.5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."

 ve_cul_evt.7.t:0 "A Iniciativa Perde Legitimidade"
 ve_cul_evt.7.d:0 "A Iniciativa de Cidadania Igualitária em [SCOPE.sState('ve_evt_target_state').GetName] está perdendo o apoio tanto das instituições estabelecidas quanto das comunidades [SCOPE.sCulture('ve_evt_target_culture').GetName] que ela deveria servir. Movimentos radicais agora retratam cada compromisso como prova de que o governo não pode entregar igualdade."
 ve_cul_evt.7.f:0 "\"Uma reforma pode sobreviver à oposição. Ela não pode sobreviver ao fato de se tornar inacreditável.\""
 ve_cul_evt.7.a:0 "Encerrar a iniciativa."
 ve_cul_evt.7.a.tt:0 "Cancela o Projeto Cultural sem reembolso de Mandato Cultural.\nA Coesão Nacional diminui em #N 5#!.\nPor #Y 2 anos#!: #N -50#! Burocracia, #N -25#! Autoridade e #N -3%#! de Sucesso da Promulgação de Leis."
 ve_cul_evt.7.b:0 "Emitir subsídios locais de emergência."
 ve_cul_evt.7.b.tt:0 "Gasta #N 25#! de Mandato Cultural.\nO progresso do Projeto Cultural diminui em #N 5#!.\n#N 1%#! da população [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."
 ve_cul_evt.7.c:0 "Continuar com um programa mínimo."
 ve_cul_evt.7.c.tt:0 "O progresso do Projeto Cultural diminui em #N 10#!.\nA Coesão Nacional diminui em #N 2#!.\nO projeto continua."
 ve_cul_evt.7.e:0 "Reconstruir a coalizão."
 ve_cul_evt.7.e.tt:0 "Gasta #N 15#! de Mandato Cultural.\nO progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 2#!.\n#N 0.5%#! da população [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."

 ve_rel_evt.8.t:0 "Uma Concórdia Local Inesperada"
 ve_rel_evt.8.d:0 "Clérigos, oficiais municipais e anciãos comunitários em [SCOPE.sState('ve_evt_target_state').GetName] alcançaram um acordo que nenhuma diretiva central poderia ter produzido. A resistência local está diminuindo, as congregações estão coordenando a missão por conta própria e a Conversão Confessional adquiriu um Embalo inesperado."
 ve_rel_evt.8.f:0 "\"O que começou como uma ordem da capital tornou-se um pacto feito na praça da cidade.\""
 ve_rel_evt.8.a:0 "Usar este Embalo ao máximo."
 ve_rel_evt.8.a.tt:0 "A Concordata Religiosa aumenta em #P 1#!.\nO progresso do Projeto Religioso aumenta em #P 25#!.\nSe o progresso atingir #Y 100#!, o efeito de conclusão normal do projeto é aplicado."
 ve_rel_evt.8.b:0 "Durabilidade antes da velocidade."
 ve_rel_evt.8.b.tt:0 "A Concordata Religiosa aumenta em #P 4#!.\nO progresso do Projeto Religioso aumenta em #P 10#!.\nSe o progresso atingir #Y 100#!, o efeito de conclusão normal do projeto é aplicado."

 ve_cul_evt.8.t:0 "Uma Coalizão Cívica Local"
 ve_cul_evt.8.d:0 "Professores, oficiais municipais, associações de comércio e representantes da comunidade [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] formaram um comitê comum. Ao resolver disputas antes que cheguem à capital, esta coalizão deu à Iniciativa de Cidadania Igualitária um Embalo que a administração não pôde fabricar."
 ve_cul_evt.8.f:0 "\"A cidadania tornou-se real quando instituições que raramente partilhavam a mesma mesa começaram a partilhar responsabilidades.\""
 ve_cul_evt.8.a:0 "Usar o Embalo da coalizão."
 ve_cul_evt.8.a.tt:0 "A Coesão Nacional aumenta em #P 1#!.\nO progresso do Projeto Cultural aumenta em #P 25#!.\nSe o progresso atingir #Y 100#!, o efeito de conclusão normal do projeto é aplicado."
 ve_cul_evt.8.b:0 "Tornar as instituições permanentes."
 ve_cul_evt.8.b.tt:0 "A Coesão Nacional aumenta em #P 4#!.\nO progresso do Projeto Cultural aumenta em #P 10#!.\nSe o progresso atingir #Y 100#!, o efeito de conclusão normal do projeto é aplicado."

 ve_rel_evt.40.t:0 "Registros em Desacordo"
 ve_rel_evt.40.d:0 "Os registros provinciais em [SCOPE.sState('ve_evt_target_state').GetName] utilizam categorias incompatíveis para congregações, associações cívicas e instituições públicas. Os relatórios que chegam à capital agora se contradizem, deixando o projeto incapaz de distinguir conformidade de resistência."
 ve_rel_evt.40.f:0 "\"Uma política administrada por meio de três livros razão logo adquire três realidades diferentes.\""
 ve_rel_evt.40.a:0 "Enviar uma auditoria central."
 ve_rel_evt.40.a.tt:0 "Gasta #N 10#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nO Acordo Religioso aumenta em #P 1#!."
 ve_rel_evt.40.b:0 "Reconciliar os registros localmente."
 ve_rel_evt.40.b.tt:0 "O progresso do Projeto Religioso diminui em #N 3#!.\nO Acordo Religioso aumenta em #P 2#!."
 ve_rel_evt.40.c:0 "Aplicar o procedimento de cartório padrão."
 ve_rel_evt.40.c.tt:0 "Gasta #N 5#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 4#!.\nO Acordo Religioso aumenta em #P 1#!."

 ve_rel_evt.41.t:0 "Escassez de Pessoal Provincial"
 ve_rel_evt.41.d:0 "Os escritórios que dirigem o projeto em [SCOPE.sState('ve_evt_target_state').GetName] não conseguem encontrar funcionários, professores e inspetores treinados em número suficiente. As diretrizes estão se acumulando mais rápido do que os oficiais locais conseguem interpretá-las, e nomeações precipitadas ameaçam agravar cada disputa."
 ve_rel_evt.41.f:0 "\"O decreto chegou em um dia. As pessoas capazes de executá-lo podem levar uma geração.\""
 ve_rel_evt.41.a:0 "Financiar um novo quadro de oficiais."
 ve_rel_evt.41.a.tt:0 "Gasta #N 15#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 6#!."
 ve_rel_evt.41.b:0 "Desacelerar a implementação."
 ve_rel_evt.41.b.tt:0 "O progresso do Projeto Religioso diminui em #N 6#!.\nO Acordo Religioso aumenta em #P 2#!."
 ve_rel_evt.41.c:0 "Utilizar a rede de Educação existente."
 ve_rel_evt.41.c.tt:0 "Gasta #N 10#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nO Acordo Religioso aumenta em #P 1#!."

 ve_rel_evt.42.t:0 "Rumores pelo Distrito"
 ve_rel_evt.42.d:0 "Rumores em [SCOPE.sState('ve_evt_target_state').GetName] afirmam que o projeto oculta medidas muito mais severas do que as anunciadas pelo Governo. Organizadores religiosos e Incitantes locais repetem histórias contraditórias, enquanto o silêncio oficial dá espaço para cada nova versão se espalhar."
 ve_rel_evt.42.f:0 "\"Um rumor não requer escritório, orçamento ou assinatura.\""
 ve_rel_evt.42.a:0 "Publicar os relatórios."
 ve_rel_evt.42.a.tt:0 "O progresso do Projeto Religioso diminui em #N 3#!.\nO Acordo Religioso aumenta em #P 4#!."
 ve_rel_evt.42.b:0 "Descartar a agitação."
 ve_rel_evt.42.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 5#!.\nO Acordo Religioso diminui em #N 3#!.\n#N 1%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.42.c:0 "Comissionar mediadores locais."
 ve_rel_evt.42.c.tt:0 "Gasta #N 10#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 4#!.\nO Acordo Religioso aumenta em #P 2#!.\n#P 0.5%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Lealista."

 ve_rel_evt.43.t:0 "A Administração no Ponto de Ruptura"
 ve_rel_evt.43.d:0 "O projeto em [SCOPE.sState('ve_evt_target_state').GetName] está se aproximando do colapso administrativo. Os escritórios provinciais estão sobrecarregados, a Confiança pública foi quebrada e a Oposição Organizada agora trata cada nova diretriz como evidência de que o Governo perdeu o controle."
 ve_rel_evt.43.f:0 "\"Quando os arquivos param de se mover, a crise vai para as ruas.\""
 ve_rel_evt.43.a:0 "Encerrar o programa."
 ve_rel_evt.43.a.tt:0 "Cancela o Projeto Religioso sem reembolso de Fundo de Piedade.\nO Acordo Religioso diminui em #N 5#!.\nPor #Y 2 anos#!: #N -50#! de Burocracia, #N -50#! de Autoridade e #N -3%#! de Sucesso da Promulgação de Lei."
 ve_rel_evt.43.b:0 "Transferir recursos de emergência."
 ve_rel_evt.43.b.tt:0 "Gasta #N 25#! de Fundo de Piedade.\nO progresso do Projeto Religioso diminui em #N 5#!.\n#N 1%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."
 ve_rel_evt.43.c:0 "Continuar com uma equipe reduzida."
 ve_rel_evt.43.c.tt:0 "O progresso do Projeto Religioso diminui em #N 10#!.\nO Acordo Religioso diminui em #N 2#!.\nO projeto continua."
 ve_rel_evt.43.e:0 "Reconstruir a parceria local."
 ve_rel_evt.43.e.tt:0 "Gasta #N 15#! de Fundo de Piedade.\nO progresso do Projeto Religioso diminui em #N 3#!.\nO Acordo Religioso aumenta em #P 2#!.\n#N 0.5%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."

 ve_rel_evt.100.t:0 "Assentos no Conselho Inter-religioso"
 ve_rel_evt.100.d:0 "Delegados em [SCOPE.sState('ve_evt_target_state').GetName] concordam que um conselho inter-religioso é necessário, mas não sobre quem merece um assento. A representação proporcional tranquilizaria as comunidades menores, enquanto uma concordata religiosa fixa desenhada na capital poderia iniciar os trabalhos imediatamente."
 ve_rel_evt.100.f:0 "\"Todos apoiam uma mesa comum até que as cadeiras sejam contadas.\""
 ve_rel_evt.100.a:0 "Distribuir a representação por população."
 ve_rel_evt.100.a.tt:0 "O progresso do Projeto Religioso diminui em #N 3#!.\nA Concordata Religiosa aumenta em #P 4#!."
 ve_rel_evt.100.b:0 "Impor um compromisso central fixo."
 ve_rel_evt.100.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 5#!.\nA Concordata Religiosa diminui em #N 2#!.\n#N 0.5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_rel_evt.100.c:0 "Capacitar os Conselhos Inter-religiosos."
 ve_rel_evt.100.c.tt:0 "Gasta #N 10#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nA Concordata Religiosa aumenta em #P 2#!."

 ve_rel_evt.101.t:0 "Um Currículo Escolar Compartilhado"
 ve_rel_evt.101.d:0 "As escolas em [SCOPE.sState('ve_evt_target_state').GetName] precisam de lições cívicas comuns sem transformar a Ação Comunitária de Consciência em uma campanha contra a crença local. Os professores solicitam materiais claros e treinamento conjunto, enquanto as lideranças comunitárias insistem que a instrução local retenha espaço para suas tradições."
 ve_rel_evt.101.f:0 "\"Uma lição compartilhada só é bem-sucedida se cada família reconhecer a sala de aula como sua.\""
 ve_rel_evt.101.a:0 "Financiar um corpo docente comum."
 ve_rel_evt.101.a.tt:0 "Gasta #N 15#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 6#!.\nA Concordata Religiosa aumenta em #P 1#!."
 ve_rel_evt.101.b:0 "Deixar espaço para currículos locais."
 ve_rel_evt.101.b.tt:0 "O progresso do Projeto Religioso diminui em #N 4#!.\nA Concordata Religiosa aumenta em #P 3#!."
 ve_rel_evt.101.c:0 "Trazer a coalizão de reforma para dentro das escolas."
 ve_rel_evt.101.c.tt:0 "Gasta #N 10#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nA Concordata Religiosa aumenta em #P 2#!.\n#P 0.5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Lealista."

 ve_rel_evt.102.t:0 "Uma Carta de Garantias Mútuas"
 ve_rel_evt.102.d:0 "Comunidades religiosas, oficiais municipais e associações de reforma em [SCOPE.sState('ve_evt_target_state').GetName] redigiram uma carta comum. Cada signatário aceita as mesmas obrigações cívicas em troca de garantias públicas de que nenhuma comunidade será excluída das instituições locais."
 ve_rel_evt.102.f:0 "\"A confiança tornou-se possível quando cada promessa foi escrita como o direito de outra parte.\""
 ve_rel_evt.102.a:0 "Aproveitar o embolo do pacto."
 ve_rel_evt.102.a.tt:0 "A Concordata Religiosa aumenta em #P 2#!.\nO progresso do Projeto Religioso aumenta em #P 20#!.\nSe o progresso atingir #Y 100#!, o efeito normal de conclusão do projeto é aplicado."
 ve_rel_evt.102.b:0 "Tornar as garantias permanentes."
 ve_rel_evt.102.b.tt:0 "A Concordata Religiosa aumenta em #P 4#!.\n#P 0.5%#! da população em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Lealista.\nO progresso do Projeto Religioso aumenta em #P 10#!.\nSe o progresso atingir #Y 100#!, o efeito normal de conclusão do projeto é aplicado."

 ve_rel_evt.150.t:0 "Professores ou Inspetores?"
 ve_rel_evt.150.d:0 "A Campanha de Secularização em [SCOPE.sState('ve_evt_target_state').GetName] expôs uma escassez de pessoal instruídos. A administração pode expandir o corpo docente que constrói Artifício cívico a longo prazo, ou confiar em inspetores que podem fazer cumprir as novas regras com o pessoal já disponível."
 ve_rel_evt.150.f:0 "\"Um inspetor pode fechar uma escola em uma tarde. Um professor pode levar anos para substituir o que foi ensinado ali.\""
 ve_rel_evt.150.a:0 "Expandir o corpo docente."
 ve_rel_evt.150.a.tt:0 "Gasta #N 15#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 6#!."
 ve_rel_evt.150.b:0 "Desacelerar o programa para corresponder ao pessoal existente."
 ve_rel_evt.150.b.tt:0 "O progresso do Projeto Religioso diminui em #N 5#!.\nA Concordata Religiosa aumenta em #P 2#!."
 ve_rel_evt.150.c:0 "Comissionar a rede de educação pública."
 ve_rel_evt.150.c.tt:0 "Gasta #N 10#! de Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nA Concordata Religiosa aumenta em #P 1#!."

 ve_rel_evt.151.t:0 "As Propriedades Confiscadas"
 ve_rel_evt.151.d:0 "Antigas propriedades religiosas em [SCOPE.sState('ve_evt_target_state').GetName] estão prontas para conversão em escolas, clínicas e repartições cívicas. A transferência imediata daria à campanha valiosa infraestrutura, mas a ausência de compensação está se tornando um ponto de rallying para os Devotos."
 ve_rel_evt.151.f:0 "\"As chaves mudaram de mãos em uma manhã. A discussão sobre a propriedade sobreviverá às fechaduras.\""
 ve_rel_evt.151.a:0 "Pagar compensação em etapas."
 ve_rel_evt.151.a.tt:0 "Gasta #N 15#! Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 3#!.\nA Concordata Religiosa aumenta em #P 3#!."
 ve_rel_evt.151.b:0 "Colocar as propriedades em serviço público imediatamente."
 ve_rel_evt.151.b.tt:0 "O progresso do Projeto Religioso aumenta em #P 7#!.\nA Concordata Religiosa diminui em #N 4#!.\n#N 1%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nOs Devotos perdem #N 1#! Aprovação do grupo por #Y 2.5 anos#!."
 ve_rel_evt.151.c:0 "Transferi-las para instituições de Bem-Estar Social secular."
 ve_rel_evt.151.c.tt:0 "Gasta #N 10#! Fundo de Piedade.\nO progresso do Projeto Religioso aumenta em #P 5#!.\nA Concordata Religiosa aumenta em #P 2#!.\n#P 0.5%#! da População em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Lealista."

 ve_rel_evt.152.t:0 "Associações Cívicas Criam Raízes"
 ve_rel_evt.152.d:0 "Círculos de professores, sociedades de ajuda mútua e associações municipais em [SCOPE.sState('ve_evt_target_state').GetName] começaram a fornecer serviços outrora Organizada através de instituições religiosas. Sua cooperação deu à Campanha de Secularização uma fundação cívica local em vez de meramente uma Presença administrativa."
 ve_rel_evt.152.f:0 "\"A nova ordem perdurou quando os cidadãos começaram a mantê-la sem esperar por um inspetor.\""
 ve_rel_evt.152.a:0 "Usar o Embalo local."
 ve_rel_evt.152.a.tt:0 "A Concordata Religiosa aumenta em #P 2#!.\nO progresso do Projeto Religioso aumenta em #P 20#!.\nSe o progresso atingir #Y 100#!, o efeito normal de conclusão do projeto será aplicado."
 ve_rel_evt.152.b:0 "Transformar as associações em instituições permanentes."
 ve_rel_evt.152.b.tt:0 "A Concordata Religiosa aumenta em #P 4#!.\nO progresso do Projeto Religioso aumenta em #P 10#!.\nSe o progresso atingir #Y 100#!, o efeito normal de conclusão do projeto será aplicado."

 ve_cul_evt.40.t:0 "Conselhos escolares locais"
 ve_cul_evt.40.d:0 "Conselhos escolares em [SCOPE.sState('ve_evt_target_state').GetName] discordam sobre o lugar da língua [SCOPE.sCulture('ve_evt_target_culture').GetName] na instrução pública. O ensino na língua local preservaria a confiança, enquanto uma única língua administrativa tornaria o projeto nacional mais fácil de direcionar."
 ve_cul_evt.40.f:0 "\"A língua escolhida para a primeira lição frequentemente decide quem acredita que a escola lhes pertence.\""
 ve_cul_evt.40.a:0 "Proteger a língua local."
 ve_cul_evt.40.a.tt:0 "O progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão nacional aumenta em #P 3#!."
 ve_cul_evt.40.b:0 "Impor uma única língua administrativa."
 ve_cul_evt.40.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão nacional diminui em #N 2#!.\n#N 0.5%#! da População [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.40.c:0 "Expandir a rede de professores."
 ve_cul_evt.40.c.tt:0 "Gasta #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!.\nA Coesão nacional aumenta em #P 2#!."

 ve_cul_evt.41.t:0 "Limites Estatísticos"
 ve_cul_evt.41.d:0 "Funcionários inspecionando [SCOPE.sState('ve_evt_target_state').GetName] não conseguem concordar onde a comunidade [SCOPE.sCulture('ve_evt_target_culture').GetName] começa e termina. Identidades locais se sobrepõem através de língua, distrito e costume, mas o projeto nacional exige categorias que possam ser contadas e administradas."
 ve_cul_evt.41.f:0 "\"Uma fronteira traçada para o censo logo adquire funcionários, orçamentos e defensores.\""
 ve_cul_evt.41.a:0 "Deixar espaço para autoidentificação."
 ve_cul_evt.41.a.tt:0 "O progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão nacional aumenta em #P 3#!."
 ve_cul_evt.41.b:0 "Deixar o centro definir os limites."
 ve_cul_evt.41.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão nacional diminui em #N 3#!.\n#N 0.5%#! da População [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.41.c:0 "Usar o sistema de registro padrão."
 ve_cul_evt.41.c.tt:0 "Gasta #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão nacional aumenta em #P 1#!."

 ve_cul_evt.42.t:0 "O Projeto Nacional no Ponto de Ruptura"
 ve_cul_evt.42.d:0 "O projeto nacional em [SCOPE.sState('ve_evt_target_state').GetName] aproxima-se do colapso. Movimentos radicais alegam que o governo traiu a comunidade [SCOPE.sCulture('ve_evt_target_culture').GetName] ou rendeu-se a ela, ao passo que os gabinetes locais já não possuem a confiança necessária para impor outro compromisso."
 ve_cul_evt.42.f:0 "\"Um acordo atacado tanto como coação quanto como rendição logo poderá deixar de ser um acordo de todo.\""
 ve_cul_evt.42.a:0 "Encerrar o projeto."
 ve_cul_evt.42.a.tt:0 "Cancela o Projeto Cultural sem reembolso de Mandato Cultural.\nA Coesão Nacional diminui em #N 5#!.\nPor #Y 2 anos#!: #N -50#! Burocracia, #N -25#! Autoridade e #N -3%#! de Sucesso da Promulgação de Leis."
 ve_cul_evt.42.b:0 "Transferir recursos locais de emergência."
 ve_cul_evt.42.b.tt:0 "Gasta #N 25#! de Mandato Cultural.\nO progresso do Projeto Cultural diminui em #N 5#!.\n#N 1%#! da população [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."
 ve_cul_evt.42.c:0 "Continuar com um programa mínimo."
 ve_cul_evt.42.c.tt:0 "O progresso do Projeto Cultural diminui em #N 10#!.\nA Coesão Nacional diminui em #N 2#!.\nO projeto continua."
 ve_cul_evt.42.e:0 "Reconstruir a estrutura de negociação."
 ve_cul_evt.42.e.tt:0 "Gasta #N 15#! de Mandato Cultural.\nO progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 2#!.\n#N 0,5%#! da população [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical.\nO projeto continua."

 ve_cul_evt.50.t:0 "A Diretiva de Sobrenomes e Idioma"
 ve_cul_evt.50.d:0 "Funcionários em [SCOPE.sState('ve_evt_target_state').GetName] propõem padronizar os sobrenomes e os registros públicos no idioma nacional. A diretiva tornaria a população [SCOPE.sCulture('ve_evt_target_culture').GetName] mais fácil de ser classificada pela administração central, mas as famílias temem que a identidade privada esteja a tornar-se objeto de comando do Estado."
 ve_cul_evt.50.f:0 "\"Um nome escrito de forma diferente no registro ainda pode ser o nome pelo qual uma família se recorda a si mesma.\""
 ve_cul_evt.50.a:0 "Financiar uma campanha de registro gradual."
 ve_cul_evt.50.a.tt:0 "Gasta #N 10#! de Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!.\nA Coesão Nacional aumenta em #P 1#!.\n#N 0,5%#! da população [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.50.b:0 "Aplicar um padrão nacional único."
 ve_cul_evt.50.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 7#!.\nA Coesão Nacional diminui em #N 4#!.\n#N 1%#! da população [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.50.c:0 "Retirar a diretiva para revisão."
 ve_cul_evt.50.c.tt:0 "O progresso do Projeto Cultural diminui em #N 5#!.\nA Coesão Nacional aumenta em #P 3#!."

 ve_cul_evt.51.t:0 "Os Registros de Conscrição"
 ve_cul_evt.51.d:0 "Autoridades militares em [SCOPE.sState('ve_evt_target_state').GetName] demandam um registro único para obrigações de serviço, sobrenomes e comandos. Aplicá-lo à população [SCOPE.sCulture('ve_evt_target_culture').GetName] fortaleceria o esforço de Integração Étnica, mas a resistência cresce entre as comunidades que veem o exército como mais um instrumento de apagamento cultural."
 ve_cul_evt.51.f:0 "\"O Estado só toma conhecimento dos nomes de uma aldeia quando deseja cobrar os seus impostos ou convocar os seus filhos.\""
 ve_cul_evt.51.a:0 "Aplicar os registros nacionais."
 ve_cul_evt.51.a.tt:0 "O progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional diminui em #N 2#!.\n#N 0,5%#! da população [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.51.b:0 "Preservar as práticas de registro locais."
 ve_cul_evt.51.b.tt:0 "O progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.51.c:0 "Integrar os registros por meio do serviço militar."
 ve_cul_evt.51.c.tt:0 "Gasta #N 10#! de Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão Nacional aumenta em #P 1#!.\n#N 0,5%#! da população [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."

 ve_cul_evt.100.t:0 "A Delegação Constituinte"
 ve_cul_evt.100.d:0 "Uma delegação da comunidade de [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] chegou com demandas por representação nas instituições do Pacto Constituinte. Negociar retardaria o projeto, mas fortaleceria sua legitimidade; um acordo imposto a partir da capital poderia avançar mais rapidamente ao custo de confiança."
 ve_cul_evt.100.f:0 "\"Um pacto torna-se comum apenas quando cada constituinte pode apontar para uma cláusula que ajudou a redigir.\""
 ve_cul_evt.100.a:0 "Negociar o lugar deles no pacto."
 ve_cul_evt.100.a.tt:0 "O progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 4#!."
 ve_cul_evt.100.b:0 "Impor o acordo central."
 ve_cul_evt.100.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional diminui em #N 2#!.\n#N 0.5%#! da população de [SCOPE.sCulture('ve_evt_target_culture').GetName] em [SCOPE.sState('ve_evt_target_state').GetName] torna-se Radical."
 ve_cul_evt.100.c:0 "Incluir a coalizão parlamentar nas conversas."
 ve_cul_evt.100.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!.\nA Coesão Nacional aumenta em #P 2#!."

 ve_cul_evt.101.t:0 "Administração Dupla"
 ve_cul_evt.101.d:0 "O Pacto Constituinte em [SCOPE.sState('ve_evt_target_state').GetName] agora depende de duas administrações sobrepostas. Funcionários centrais e representantes da comunidade de [SCOPE.sCulture('ve_evt_target_culture').GetName] duplicam registros, disputam nomeações e emitem instruções contraditórias enquanto a burocracia do país se aproxima da exaustão."
 ve_cul_evt.101.f:0 "\"Dois escritórios podem compartilhar autoridade mais facilmente do que podem compartilhar um arquivo.\""
 ve_cul_evt.101.a:0 "Financiar um quadro administrativo conjunto."
 ve_cul_evt.101.a.tt:0 "Gastar #N 15#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 6#!."
 ve_cul_evt.101.b:0 "Lentificar o pacto até que os escritórios concordem."
 ve_cul_evt.101.b.tt:0 "O progresso do Projeto Cultural diminui em #N 6#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.101.c:0 "Unificar os escritórios sob o serviço público."
 ve_cul_evt.101.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 2#!."

 ve_cul_evt.150.t:0 "Implementação nas Províncias"
 ve_cul_evt.150.d:0 "Administrações provinciais relatam que o projeto cultural nacional está avançando a velocidades radicalmente diferentes. Alguns escritórios exigem comissões de implementação financiadas, enquanto outros alertam que impor um único cronograma a cada região consumirá pessoal escasso e enfraquecerá a confiança pública."
 ve_cul_evt.150.f:0 "\"Um decreto nacional é escrito uma vez, mas deve ser implementado em todos os escritórios do país.\""
 ve_cul_evt.150.a:0 "Financiar as comissões de implementação."
 ve_cul_evt.150.a.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!."
 ve_cul_evt.150.b:0 "Usar um cronograma gradual."
 ve_cul_evt.150.b.tt:0 "O progresso do Projeto Cultural diminui em #N 4#!.\nA Coesão Nacional aumenta em #P 2#!."
 ve_cul_evt.150.c:0 "Padronizar a administração existente."
 ve_cul_evt.150.c.tt:0 "Gastar #N 5#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 2#!."

 ve_cul_evt.151.t:0 "A Língua de Instrução"
 ve_cul_evt.151.d:0 "O Currículo Nacional exige uma língua comum de instrução, contudo as escolas por todo o país atendem comunidades com tradições linguísticas muito diferentes. Materiais multilíngues preservariam a confiança mas retardariam a distribuição, enquanto um único currículo poderia alcançar as salas de aula rapidamente ao risco de transformar a educação em uma contenda cultural."
 ve_cul_evt.151.f:0 "\"Uma lição ensinada em uma língua em que o aluno desconfia pode ser lembrada por tudo, exceto por seu assunto.\""
 ve_cul_evt.151.a:0 "Financiar materiais multilíngues."
 ve_cul_evt.151.a.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 3#!.\nA Coesão Nacional aumenta em #P 3#!."
 ve_cul_evt.151.b:0 "Aplicar um currículo nacional."
 ve_cul_evt.151.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão Nacional diminui em #N 3#!."
 ve_cul_evt.151.c:0 "Unir as redes de ensino e de bem-estar social."
 ve_cul_evt.151.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 5#!.\nA Coesão Nacional aumenta em #P 2#!."

 ve_cul_evt.160.t:0 "Quem Representa a Nação?"
 ve_cul_evt.160.d:0 "O projeto de Símbolos Compartilhados reabriu a questão sobre cuja história, uniformes, monumentos e cerimônias podem representar o país inteiro. Alternar tradições ampliaria o reconhecimento, mas retardaria o acordo; selecionar uma narrativa oficial criaria clareza ao mesmo tempo que deixaria muitos cidadãos de fora dela."
 ve_cul_evt.160.f:0 "\"Um símbolo torna-se nacional apenas quando os cidadãos se veem nele sem precisar de explicação.\""
 ve_cul_evt.160.a:0 "Alternar os símbolos no uso público."
 ve_cul_evt.160.a.tt:0 "O progresso do Projeto Cultural diminui em #N 3#!.\nA Coesão Nacional aumenta em #P 4#!."
 ve_cul_evt.160.b:0 "Selecionar uma narrativa oficial."
 ve_cul_evt.160.b.tt:0 "O progresso do Projeto Cultural aumenta em #P 6#!.\nA Coesão Nacional diminui em #N 3#!."
 ve_cul_evt.160.c:0 "Conceber uma cerimônia pública compartilhada."
 ve_cul_evt.160.c.tt:0 "Gasta #N 10#! de Mandato Cultural.\nO progresso do Projeto Cultural aumenta em #P 4#!.\nA Coesão Nacional aumenta em #P 2#!."
