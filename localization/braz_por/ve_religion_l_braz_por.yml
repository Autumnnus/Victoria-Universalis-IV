 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Religião do Estado"
 ve_settlement_tier_high:0 "RESOLVIDA - [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "CONTESTADA - #N -5 Legitimidade e -5% Sucesso na promulgação da lei#!."
 ve_settlement_hint:0 "Desvia em direção ao equilíbrio que seu modelo religioso produz. Com 75+ você ganha um bônus, com 25 ou menos instabilidade."
 ve_piety_reform_hint:0 "Gasto em Programas (25 cada) e em Projetos Religiosos. Economizar é seguro, mas a renda cai pela metade em 400 e termina em 500."
 ve_religious_project_hint:0 "Opcional. Iniciado em um de seus próprios estados, se o seu modelo religioso permitir."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Modelos religiosos"
 ve_religious_models_help:0 "Seu modelo religioso é decidido pelo seu #Y Igreja e Estado#! lei e é #P já ativo#! - não há nada para escolher aqui. O modelo apenas decide como #Y Acordo Religioso#! é conquistado, quais oito programas você pode adotar e qual projeto religioso você pode executar.\n#Y Mudar a lei é opcional:#! ele redefine o Acordo para #Y 35#!, remove todos os Programas que você adotou, cancela um Projeto Religioso em execução e aplica um #Y 3-5 anos#! Crise de liquidação.\n#Y Passe o mouse sobre qualquer cartão ou medidor para ver todos os seus efeitos.#!"
 ve_religious_model_active_footer:0 "Modelo Atual"
 ve_confessional_state_short:0 "Igreja e estado governam juntos.\nO assentamento vem de #Y aprovação devota e influência#!."
 ve_freedom_state_short:0 "Toda fé é tolerada sob um estado.\nO assentamento vem de #Y um país calmo e bem administrado#!."
 ve_separation_state_short:0 "O estado não tem nenhuma posição religiosa.\nO assentamento começa mais alto e as recompensas #Y baixa turbulência#!."
 ve_atheism_state_short:0 "Secularização ativa liderada pelo Estado.\nO assentamento vem da #Y alfabetização e da intelectualidade#!."
 ve_confessional_state_unlocks:0 "Administra o #Y Projeto#! Conversão Confessional"
 ve_freedom_state_unlocks:0 "Executa o #Y Freedom Outreach#! projeto"
 ve_separation_state_unlocks:0 "#N Não é possível executar um projeto religioso#!"
 ve_atheism_state_unlocks:0 "Executa o #Y Campanha de Secularização#! projeto"
 ve_confessional_state_desc:0 "#header Estado Confessional#!\nIgreja e Estado governam juntos.\n\n#Y Enquanto ativo#!\n#P +5% de Autoridade, +10% de Conversão, +10% de Força Política Devota#!\n#N -3% de Atração Migratória, +5% de Radicais por Preconceito Aberto#!\nAlém de um pequeno pacote para a família religiosa da sua religião estadual (cristã, islâmica, judaica, dármica, erudita ou animista).\n\n#Y Assentamento#!\nEquilíbrio básico #Y 55#!. Aprovação devota e influência são os que mais o movem.\n\n#Y No Acordo 75#!\n#P +5% de Autoridade, +5 de Legitimidade#!\n\n#Y Projeto Religioso#!\nConversão Confessional"
 ve_freedom_state_desc:0 "#header Liberdade de Consciência#!\nToda fé é tolerada sob um estado.\n\n#Y Enquanto ativa#!\n#P +5% de Atração de Migração, -5% Radicais por Preconceito Aberto#!\n#N -15% Conversão, -25 Burocracia#!\n\n#Y Acordo#!\nEquilíbrio básico #Y 55#!. Baixa turbulência, legitimidade e uma administração saudável aumentam isso.\n\n#Y No Acordo 75#!\n#P +5% de Atração de Migração, +5 de Legitimidade#!\n\n#Y Projeto Religioso#!\nAlcanço da Liberdade"
 ve_separation_state_desc:0 "#header Separação Total#!\nO modelo neutro: o estado não assume nenhuma posição religiosa.\n\n#Y Enquanto ativo#!\n#P +8% de Atração de Migração, -10% de Radicais por Preconceito Aberto, -5% de Radicais por Violência Hostilidade#!\n#N -30% Conversão#!\n\n#Y Assentamento#!\nEquilíbrio de base #Y 60#!, o mais alto dos quatro. A baixa turbulência aumenta ainda mais.\n\n#Y No Acordo 75#!\n#P +5% de sucesso na promulgação da lei, +5 de legitimidade#!\n\n#Y Projeto religioso#!\n#N Nenhum. Este modelo deliberadamente não tem campanha religiosa.#!"
 ve_atheism_state_desc:0 "#header Ateísmo de Estado#!\nUm modelo de secularização agressivo, não tolerante.\n\n#Y Enquanto ativo#!\n#P +5% de propagação de tecnologia, +2% de acesso à educação, +20% de conversão#!\n#N -5% de autoridade, -10% de força política devota, +5% de radicais por preconceito aberto#!\n\n#Y Assentamento#!\nEquilíbrio de base #Y 45#!, o mais baixo dos quatro. A aprovação da alfabetização e da intelectualidade aumenta; uma forte influência Devota o reduz.\n\n#Y No Acordo 75#!\n#P +5% de Spread de Tecnologia, +5% de Burocracia#!\n\n#Y Projeto Religioso#!\nCampanha de Secularização\n\n#Y Nota#!\nMudar para este modelo custa um #N 5 anos#! crise em vez de 3 se a alfabetização estiver abaixo de 50% ou a influência devota for 20% ou mais."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Os programas são #Y opcional#! e permanente. Cada um custa #Y 25 Reforma da Piedade#! e inicia um #Y 24 meses#! tensão de implementação durante a qual nenhum outro programa pode ser adotado. Todos os oito pertencem ao seu modelo religioso atual e serão perdidos se esse modelo mudar.\n#Y Passe o mouse sobre qualquer carta ou medidor para ver todos os seus efeitos.#!"
 ve_religious_program_strain_notice:0 "Um Programa ainda está sendo implementado - nenhum outro Programa pode ser adotado até que essa linhagem expire."
 ve_religious_program_adopted_badge:0 "ADOTADO"
 ve_adopt_program_button:0 "Adotar"
 ve_religious_program_cost_label:0 "Custos #Y 25 Reforma da Piedade#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Projeto Religioso Direcionado"
 ve_religious_projects_intro:0 "Um projeto religioso é #Y opcional#! e apenas um pode ser executado por vez. O custo da Reforma da Piedade é pago imediatamente e #N -50 Burocracia e -25 Autoridade#! inscreva-se enquanto estiver em execução. Concluí-lo reembolsa parte da Reforma da Piedade e aumenta o Acordo Religioso.\n#Y Passe o mouse sobre qualquer carta ou medidor para ver todos os efeitos.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Projeto em andamento"
 ve_religious_project_backlash_notice:0 "Um projeto cancelado ainda bloqueia um novo – a reação de 24 meses deve expirar primeiro."
 ve_religious_project_start_instruction:0 "#Y Como iniciá-lo#!\n1. Abra um dos seus próprios estados.\n2. Imprensa #Y Iniciar projeto#! no painel desse estado.\nTudo o que ainda estiver faltando será listado na dica de ferramenta desse botão."
 ve_targeted_religious_project_target:0 "Meta: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Nenhuma meta de projeto"
 ve_no_active_religious_project:0 "Nenhum projeto religioso ativo"
 ve_confessional_conversion_name:0 "Conversão confessional"
 ve_confessional_conversion_cost:0 "Custo: #Y 125 Reforma da piedade#!"
 ve_confessional_conversion_short:0 "Converter um estado para a religião do estado.\n#P +20 Reforma da Piedade, +5 Acordo#! na conclusão - mas cria radicais."
 ve_confessional_conversion_desc:0 "#header Conversão Confessional#!\nExecutar em um único estado cuja parcela de sua própria religião seja inferior a #Y 90%#!.\n\n#Y Custo#!\n#Y 125 Reforma da Piedade#!, pago imediatamente\n\n#Y Enquanto estiver em execução#!\n#N -50 Burocracia, -25 Autoridade#! para o país\n#N +20% de Conversão e +20% de canais de radicalismo#! no Estado alvo\n\n#Y Após a conclusão#!\nConverte #Y 5%#! da população do Estado para a religião do seu estado, ou #Y 7%#! com o Nacionalista VII\n#P +20 Reforma Piedade, +5 Religiosa Liquidação#!\n\n#Y Atenção#!\n#N A conversão cria radicais no Estado alvo.#!"
 ve_freedom_outreach_name:0 "Alcance da Liberdade"
 ve_freedom_outreach_cost:0 "Custo: #Y 100 Piety Reform#!"
 ve_freedom_outreach_short:0 "Conquistar um estado sem forçar a conversão.\n#P +20 Piety Reform, +7 Acordo#! na conclusão, mais legalistas."
 ve_freedom_outreach_desc:0 "#header Freedom Outreach#!\nExecutar em um único estado cuja parcela de sua própria religião seja inferior a #Y 90%#!.\n\n#Y Custo#!\n#Y 100 Reforma da Piedade#!, paga imediatamente\n\n#Y Enquanto estiver em execução#!\n#N -50 Burocracia, -25 Autoridade#! para o país\n\n#Y Após a conclusão#!\n#P Sem conversão forçada#! - legalistas no estado alvo em vez disso\n#P +20 Reforma da Piedade, +7 Assentamento Religioso#!"
 ve_secularization_campaign_name:0 "Campanha de Secularização"
 ve_secularization_campaign_cost:0 "Custo: #Y 150 Reforma da Piedade#!"
 ve_secularization_campaign_short:0 "Converter um Estado ao ateísmo.\n#P +25 Reforma da Piedade, +8 Acordo#! na conclusão - mas cria radicais."
 ve_secularization_campaign_desc:0 "#header Campanha de Secularização#!\nExecutada em um único Estado cuja parcela de sua própria religião está abaixo de #Y 90%#!.\n\n#Y Custo#!\n#Y 150 Reforma da Piedade#!, paga imediatamente\n\n#Y Enquanto funciona#!\n#N -50 Burocracia, -25 Autoridade#! para o país\n#N +20% de Conversão e +20% de canais de radicalismo#! no Estado alvo\n\n#Y Após a conclusão#!\nConverte #Y 5%#! da população do Estado ao Ateísmo, ou #Y 7%#! ao Nacionalista VII\n#P +25 Reforma Piedade, +8 Acordo Religioso#!\n\n#Y Aviso#!\n#N A conversão cria radicais no Estado alvo.#!"
 ve_religious_project_unavailable_name:0 "Nenhum Projeto Disponível"
