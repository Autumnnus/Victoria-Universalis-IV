 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Religião do Estado"
 ve_settlement_tier_high:0 "ESTABELECIDO - [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "CONTESTADO - #N -5 Legitimidade e -5% Sucesso da Promulgação#!."
 ve_settlement_hint:0 "Desvia em direção ao equilíbrio que seu Modelo Religioso produz. Em 75+ você ganha um bônus, em 25 ou menos, instabilidade."
 ve_piety_reform_hint:0 "Gasto em Programas (25 cada) e em Projetos Religiosos. Guardá-lo é seguro, mas a renda cai pela metade em 400 e para em 500."
 ve_religious_project_hint:0 "Opcional. Iniciado a partir de um de seus próprios Estados, se o seu Modelo Religioso permitir."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Modelos Religiosos"
 ve_religious_models_help:0 "Seu Modelo Religioso é decidido pela sua lei de #Y Igreja e Estado#! e está #P já ativo#! - não há nada para escolher aqui. O modelo apenas decide como a #Y Concordata Religiosa#! é obtida, quais oito Programas você pode adotar e qual Projeto Religioso você pode executar.\n#Y Mudar a lei é opcional:#! redefine a Concordata para #Y 35#!, remove todos os Programas que você adotou, cancela um Projeto Religioso em andamento e aplica uma Crise de Concordata de #Y 3-5 anos#!.\n#Y Passe o cursor sobre qualquer carta ou medidor para ver todos os seus efeitos.#!"
 ve_religious_model_active_footer:0 "Modelo Atual"
 ve_confessional_state_short:0 "Igreja e estado governam juntos.\nA Concordata vem da #Y Aprovação dos Devotos e Pressão#!."
 ve_freedom_state_short:0 "Todas as fés são toleradas sob um único estado.\nA Concordata vem de #Y um país calmo e bem administrado#!."
 ve_separation_state_short:0 "O estado não assume nenhuma posição religiosa.\nA Concordata Religiosa começa no valor mais alto e recompensa #Y baixa instabilidade#!."
 ve_atheism_state_short:0 "Secularização ativa conduzida pelo estado.\nA Concordata Religiosa provém da #Y instrução e da Elite Intelectual#!."
 ve_confessional_state_unlocks:0 "Executa o projeto de #Y Conversão Confessional#!"
 ve_freedom_state_unlocks:0 "Executa o projeto de #Y Ação Comunitária de Consciência#!"
 ve_separation_state_unlocks:0 "#N Não pode executar um Projeto Religioso#!"
 ve_atheism_state_unlocks:0 "Executa o projeto de #Y Campanha de Secularização#!"
 ve_confessional_state_desc:0 "#header Estado Confessional#!\nIgreja e estado governam juntos.\n\n#Y Enquanto ativo#!\n#P +5% Autoridade, +10% Conversão, +10% Força Política do grupo Devotos#!\n#N -3% Atração de Migração, +5% Radicais de Preconceito Aberto#!\nMais um pequeno pacote para a família de fé da sua religião do estado (Cristã, Islâmica, Judaica, Dármica, Erudita ou Animista).\n\n#Y Concordata Religiosa#!\nEquilíbrio base #Y 55#!. A aprovação e a pressão dos Devotos são o que mais o movimentam.\n\n#Y A 75 de Concordata Religiosa#!\n#P +5% Autoridade, +5 Legitimidade#!\n\n#Y Projeto Religioso#!\nConversão Confessional"
 ve_freedom_state_desc:0 "#header Liberdade de Consciência#!\nToda fé é tolerada sob um só estado.\n\n#Y Enquanto ativo#!\n#P +5% Atração de Migração, -5% Radicais de Preconceito Aberto#!\n#N -15% Conversão, -25 Burocracia#!\n\n#Y Concordata Religiosa#!\nEquilíbrio base #Y 55#!. Baixa instabilidade, legitimidade e uma administração saudável o elevam.\n\n#Y A 75 de Concordata Religiosa#!\n#P +5% Atração de Migração, +5 Legitimidade#!\n\n#Y Projeto Religioso#!\nAção Comunitária de Consciência"
 ve_separation_state_desc:0 "#header Separação Total#!\nO modelo neutro: o estado não assume nenhuma posição religiosa.\n\n#Y Enquanto ativo#!\n#P +8% Atração de Migração, -10% Radicais de Preconceito Aberto, -5% Radicais de Hostilidade Violenta#!\n#N -30% Conversão#!\n\n#Y Concordata Religiosa#!\nEquilíbrio base #Y 60#!, o mais alto dos quatro. Baixa instabilidade o eleva ainda mais.\n\n#Y A 75 de Concordata Religiosa#!\n#P +5% Sucesso da Promulgação, +5 Legitimidade#!\n\n#Y Projeto Religioso#!\n#N Nenhum. Este modelo deliberadamente não possui nenhuma campanha religiosa.#!"
 ve_atheism_state_desc:0 "#header Ateísmo de Estado#!\nUm modelo de secularização agressivo, não tolerante.\n\n#Y Enquanto ativo#!\n#P +5% Propagação de Tecnologia, +2% Acesso à Educação, +20% Conversão#!\n#N -5% Autoridade, -10% Força Política do grupo Devotos, +5% Radicais de Preconceito Aberto#!\n\n#Y Concordata Religiosa#!\nEquilíbrio base #Y 45#!, o mais baixo dos quatro. A instrução e a aprovação da Elite Intelectual o elevam; forte pressão dos Devotos o rebaixa.\n\n#Y A 75 de Concordata Religiosa#!\n#P +5% Propagação de Tecnologia, +5% Burocracia#!\n\n#Y Projeto Religioso#!\nCampanha de Secularização\n\n#Y Nota#!\nMudar para este modelo custa uma crise de #N 5 anos#! em vez de 3 se a instrução estiver abaixo de 50% ou a pressão dos Devotos for de 20% ou mais."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Os programas são #Y opcionais#! e permanentes. Cada um custa #Y 25 Fundo de Piedade#! e inicia uma sobrecarga de implementação de #Y 24 meses#! durante a qual nenhum outro Programa pode ser adotado. Todos os oito pertencem ao seu Modelo Religioso atual e são perdidos se esse modelo mudar.\n#Y Passe o cursor sobre qualquer cartão ou medidor para ver seus efeitos completos.#!"
 ve_religious_program_strain_notice:0 "Um Programa ainda está sendo implementado - nenhum outro Programa pode ser adotado até que essa sobrecarga expire."
 ve_religious_program_adopted_badge:0 "ADOTADO"
 ve_adopt_program_button:0 "Adotar"
 ve_religious_program_cost_label:0 "Custa #Y 25 Fundo de Piedade#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Projeto Religioso Direcionado"
 ve_religious_projects_intro:0 "Um Projeto Religioso é #Y opcional#! e apenas um pode estar em execução por vez. Seu custo em Fundo de Piedade é pago imediatamente e #N -50 Burocracia e -25 Autoridade#! aplicam-se enquanto ele estiver em execução. Concluí-lo reembolsa parte do Fundo de Piedade e eleva a Concordata Religiosa.\n#Y Passe o cursor sobre qualquer cartão ou medidor para ver seus efeitos completos.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Projeto em andamento"
 ve_religious_project_backlash_notice:0 "Um projeto cancelado ainda bloqueia um novo - a reação de 24 meses deve expirar primeiro."
 ve_religious_project_start_instruction:0 "#Y Como iniciá-lo#!\n1. Abra um dos seus próprios Estados.\n2. Pressione #Y Iniciar Projeto#! no painel desse Estado.\nTudo o que ainda estiver faltando é listado na dica de ferramenta desse botão."
 ve_targeted_religious_project_target:0 "Alvo: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Sem alvo de projeto"
 ve_no_active_religious_project:0 "Nenhum Projeto Religioso Ativo"
 ve_confessional_conversion_name:0 "Conversão Confessional"
 ve_confessional_conversion_cost:0 "Custo: #Y 125 Fundo de Piedade#!"
 ve_confessional_conversion_short:0 "Converte um Estado em direção à religião do estado.\n#P +20 Fundo de Piedade, +5 de Concordata#! na conclusão - mas cria radicais."
 ve_confessional_conversion_desc:0 "#header Conversão Confessional#!\nExecutado em um único Estado cuja parcela da sua própria religião esteja abaixo de #Y 90%#!.\n\n#Y Custo#!\n#Y 125 Fundo de Piedade#!, pago imediatamente\n\n#Y Enquanto estiver em execução#!\n#N -50 Burocracia, -25 Autoridade#! para o país\n#N +20% de Conversão e canais de radicalismo +20%#! no Estado alvo\n\n#Y Na conclusão#!\nConverte #Y 5%#! da população do Estado para a sua religião do estado, ou #Y 7%#! com Nacionalista VII\n#P +20 Fundo de Piedade, +5 de Concordata Religiosa#!\n\n#Y Aviso#!\n#N A conversão cria radicais no Estado alvo.#!"
 ve_freedom_outreach_name:0 "Ação Comunitária de Consciência"
 ve_freedom_outreach_cost:0 "Custo: #Y 100 Fundo de Piedade#!"
 ve_freedom_outreach_short:0 "Conquiste um Estado sem forçar a conversão.\n#P +20 Fundo de Piedade, +7 de Concordata#! na conclusão, mais lealistas."
 ve_freedom_outreach_desc:0 "#header Ação Comunitária de Consciência#!\nExecutado em um único Estado cuja parcela da sua própria Religião seja inferior a #Y 90%#!.\n\n#Y Custo#!\n#Y 100 Fundo de Piedade#!, pago imediatamente\n\n#Y Enquanto estiver ativo#!\n#N -50 Burocracia, -25 Autoridade#! para o país\n\n#Y Ao concluir#!\n#P Sem conversão forçada#! - em vez disso, lealistas no Estado-alvo\n#P +20 Fundo de Piedade, +7 Concordata Religiosa#!"
 ve_secularization_campaign_name:0 "Campanha de Secularização"
 ve_secularization_campaign_cost:0 "Custo: #Y 150 Fundo de Piedade#!"
 ve_secularization_campaign_short:0 "Converter um Estado para o ateísmo.\n#P +25 Fundo de Piedade, +8 Concordata#! ao concluir - mas gera radicais."
