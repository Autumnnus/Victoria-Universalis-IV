l_braz_por:
 ve_piety:0 "Piedade"
 ve_piety_reform:0 "Fundo de Piedade"
 ve_piety_reform_tt:0 "#header Fundo de Piedade#!\nAtual: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nRendimento mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Detalhamento mensal#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nApoio dos devotos: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nDoutrina de ideias: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Doutrina de ideias — apenas seu Modelo Religioso atual conta#!\n#P Estado Confessional / Ateísmo de Estado#!: Nacionalista V #P +1#!\n#P Liberdade de Consciência / Separação Total#!: Reformista V #P +1#!\nO total ativo acima é limitado a #Y +1#!, de modo que os dois caminhos não podem se acumular.\n\nGasto em Doutrinas e Programas (#Y 25#! cada) e no Projeto Religioso Alvo (#Y 100-150#!, dependendo do modelo). O rendimento desacelera após #Y 400#! e cessa em #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doutrinas e Programas"
 ve_piety_tt:0 "#header Concordata Religiosa#!\nEstado atual: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nEquilíbrio social: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMovimento mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Detalhamento do equilíbrio#!\nModelo de concordata: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nApoio ao modelo: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitimidade, administração e estabilidade: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nO medidor move-se #Y 20%#! em direção ao equilíbrio a cada mês, limitado a #Y ±5#!.\nEm #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nEm #N 25#! ou menos: #N -5 Legitimidade e -5% Sucesso da Promulgação#!.\n\nEste medidor não paga mais por Programas - veja Fundo de Piedade. Os Programas exigem pelo menos #Y 25#! Fundo de Piedade, custam #Y 25#! e impõem uma sobrecarga de implementação de #Y 24 meses#!.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Projeto Religioso"
 ve_religious_project_progress_tt:0 "#header Projeto Religioso Alvo#!\nProgresso: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nProgresso mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (mínimo 1, máximo 7)\n\n#Y Detalhamento mensal#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLegitimidade: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nApoio ao modelo: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nConcordata: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nMovimentos Religiosos: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nInstabilidade do Estado-Alvo: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nGrupos de Doutrinas: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Grupos de Doutrinas — apenas os bônus correspondentes ao seu Modelo Religioso atual estão ativos#!\n#P Estado Confessional#!: Nacionalista VII #P +1#!\n#P Liberdade de Consciência#!: Reformista VII #P +1#!\n#P Ateísmo de Estado#!: Nacionalista VII #P +1#! e Acadêmico VII #P +1#!\nO total de Grupos de Doutrinas ativos acima é limitado a #Y +2#!.\n\nInicie um a partir do painel de um estado possuído. Estado Confessional e Ateísmo de Estado convertem #Y 5%#! da população do estado-alvo ao concluir, ou #Y 7%#! com Nacionalista VII, e adicionam radicais. Liberdade de Consciência, em vez disso, adiciona lealistas sem forçar a conversão. Separação Total não pode iniciar um projeto - é o modelo totalmente neutro.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "Em andamento"
 ve_religious_project_none:0 "Nenhum ativo"

