l_braz_por:
 ve_piety:0 "Piedade"
 ve_piety_reform:0 "Reforma Piedade"
 ve_piety_reform_tt:0 "#header Reforma Piedade#!\nAtual: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nRenda mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Detalhamento mensal#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLegitimidade: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nApoio devoto: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nDoutrina da ideia: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Doutrina da ideia — apenas o seu modelo religioso atual conta#!\n#P Estado Confessional / Ateísmo de Estado#!: Nacionalista V #P +1#!\n#P Liberdade de Consciência / Separação Total#!: Reformista V #P +1#!\nO total ativo acima é limitado a #Y +1#!, então os dois caminhos não podem ser acumulados.\n\nGasto em Doutrinas e Programas (#Y 25#! cada) e no Projeto Religioso Alvo (#Y 100-150#!, dependendo do modelo). Renda desacelera #Y 400#! e para em #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doutrinas e Programas"
 ve_piety_tt:0 "#header Assentamento Religioso#!\nEstado atual: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nEquilíbrio social: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMovimento mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Quebra de equilíbrio#!\nModelo de assentamento: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nSuporte ao modelo: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitimidade, administração e estabilidade: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nO medidor se move #Y 20%#! em direção ao equilíbrio a cada mês, limitado a #Y ±5#!.\nEm #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nEm #N 25#! ou abaixo: #N -5 Legitimidade e -5% de sucesso na promulgação da lei#!.\n\nEste medidor não paga mais por Programas - veja Reforma da Piedade. Os programas exigem pelo menos #Y 25#! Reforma da Piedade, custo #Y 25#! e impor uma #Y 24 meses#! tensão de implementação.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Projeto Religioso"
 ve_religious_project_progress_tt:0 "#header Projeto Religioso Direcionado#!\nProgresso: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nProgresso mensal: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (mínimo 1, máximo 7)\n\n#Y Detalhamento mensal#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLegitimidade: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nApoio ao modelo: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nAssentamento: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nMovimentos religiosos: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nEstado-alvo Turbulência: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nGrupos de Ideias: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Grupos de Ideias — apenas bônus correspondentes ao seu modelo religioso atual estão ativos#!\n#P Estado Confessional#!: Nacionalista VII #P +1#!\n#P Liberdade de Consciência#!: Reformista VII #P +1#!\n#P Ateísmo de Estado#!: Nacionalista VII #P +1#! e Acadêmico VII #P +1#!\nO total do Grupo de Ideias ativo acima é limitado a #Y +2#!.\n\nInicie um a partir do painel de um estado de propriedade. Ateísmo Confessional e de Estado converte #Y 5%#! da população do estado-alvo após a conclusão, ou  #Y 7%#! com o Nacionalista VII, e adicionar radicais. A liberdade de consciência, em vez disso, adiciona legalistas sem forçar a conversão. A Separação Total não pode iniciar um projeto - é o modelo totalmente neutro.\n\n$ve_religious_project_hint$"
