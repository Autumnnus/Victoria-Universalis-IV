l_braz_por:
 ve_tag_flavor_delayed_result_tt:0 "As consequências desta escolha institucional surgirão em aproximadamente um ano."
 ve_tag_flavor_free_route_tt:0 "Esta rota não gasta nenhuma visão nacional, mandato cultural ou reforma piedade."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Um Léxico Cívico Comum"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Um vocabulário oficial compartilhado leva a reforma para escolas e escritórios provinciais, mas a explicação constante consome autoridade central."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Continuidade Sagrada"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "A reforma foi estruturada através de instituições religiosas herdadas, reforçando o comando enquanto estreita os canais através dos quais os métodos estrangeiros circulam."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Tradução Administrativa"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "A a burocracia traduz a reforma em procedimentos familiares. A administração torna-se mais estável, mas a mudança legislativa perde alguma velocidade."
 ve_tag_flavor.1.t:0 "A Linguagem da Reforma"
 ve_tag_flavor.1.d:0 "Um decreto pode sair da capital em prosa impecável e ainda assim chegar a uma escola, tribunal, escritório provincial ou fundação religiosa como quatro instruções diferentes. Os reformadores exigem agora um vocabulário comum. A questão é saber quais instituições darão significado a esse vocabulário."
 ve_tag_flavor.1.a:0 "Elabore um léxico cívico comum."
 ve_tag_flavor.1.a.tt:0 "Requer Nação Cívica ou Estado Composto.\nGaste #N 20 Mandato Cultural#! agora.\nApós aproximadamente um ano: ganhe #P 8 Visão Nacional#! e #P 3 Coesão Nacional#!, depois ganhe #P +1% de Acesso à Educação#! e #N -25 Autoridade#! por 24 meses."
 ve_tag_flavor.1.b:0 "Reforma básica em continuidade sagrada."
 ve_tag_flavor.1.b.tt:0 "Requer o Modelo Religioso Confessional.\nGaste #N 20 Reforma da Piedade#! agora.\nApós aproximadamente um ano: ganhe #P 8 Visão Nacional#! e #P 3 Assentamento Religioso#!, então ganhe #P +25 Autoridade#! e #N -2,5% de Spread de Tecnologia#! por 24 meses."
 ve_tag_flavor.1.c:0 "Deixe que cada agência traduza o pedido."
 ve_tag_flavor.1.c.tt:0 "Após aproximadamente um ano: ganhe #P 4 Insight Nacional#!, depois ganhe #P +25 de Burocracia#! e #N -2,5% de Velocidade de Promulgação da Lei#! durante 24 meses."
 ve_tag_flavor.2.t:0 "Palavras Tornam-se Procedimento"
 ve_tag_flavor.2.d:0 "Um ano de circulares, comentários, livros escolares, sermões e correspondência provincial deu ao programa de reforma uma linguagem de trabalho. Não é perfeitamente uniforme, mas as autoridades sabem agora quais as frases que comandam o acordo – e quais as que ainda escondem o desacordo."
 ve_tag_flavor.2.a:0 "O vocabulário entra na máquina do Estado."
 ve_tag_flavor.2.a.tt:0 "O resultado seleccionado há um ano entra agora em vigor. As suas alterações de recursos são limitadas aos seus limites normais e o seu modificador institucional dura 24 meses."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Bureaus de Tradução"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Escritórios especializados aceleram a circulação de métodos estrangeiros, embora a sua autonomia enfraqueça o comando imediato do centro."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Empréstimos Dirigidos"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "As instituições importadas são reorganizadas sob a direcção central. A autoridade é preservada, mas cada reforma leva mais tempo para passar pelos canais oficiais."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Adoção Seletiva"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "O Estado admite apenas métodos que possam ser conciliados com a autoridade estabelecida, trocando a velocidade de difusão pelo controle político."
 ve_tag_flavor.10.t:0 "Métodos Emprestados, Autoridade Nativa"
 ve_tag_flavor.10.d:0 "Manuais, máquinas, planos escolares e mesas administrativas estrangeiras chegam mais rápido do que qualquer ministério possa julgá-los. Alguns funcionários exigem escritórios de tradução permanentes; outros insistem que todas as instituições emprestadas sejam refeitas sob a direcção central. Uma terceira facção admitiria apenas o que pudesse ser absorvido sem perturbar a ordem estabelecida."
 ve_tag_flavor.10.a:0 "Estabelecer agências de tradução."
 ve_tag_flavor.10.a.tt:0 "Requer Ideia Acadêmica IV ou Ideia de Infraestrutura IV.\nGasto #N 15 National Insight#! agora.\nApós aproximadamente um ano: ganhe #P 10 Era Momentum#!, então ganhe #P +2,5% de Tecnologia Spread#! e #N -25 Autoridade#! por 24 meses."
 ve_tag_flavor.10.b:0 "Empréstimo somente sob orientação central."
 ve_tag_flavor.10.b.tt:0 "Requer Ideia Nacional Japonesa IV.\nGaste #N 10 National Insight#! agora.\nDepois de aproximadamente um ano: ganhe #P 7 Era Momentum#!, depois ganhe #P +25 Autoridade#! e #N -2,5% de velocidade de promulgação da lei#! por 24 meses."
 ve_tag_flavor.10.c:0 "Adote seletivamente e preserve o comando."
 ve_tag_flavor.10.c.tt:0 "Após aproximadamente um ano: ganhe #P 3 Era Momentum#!, depois ganhe #P +25 Autoridade#! e #N -2,5% Spread Tecnológico#! por 24 meses."
 ve_tag_flavor.11.t:0 "Métodos criados por nós"
 ve_tag_flavor.11.d:0 "Um ano de tradução, testes, reformulação e argumentação oficial separou a novidade da utilidade. Os métodos adotados não aparecem mais como instruções estrangeiras; eles entraram no vocabulário de comando do próprio estado."
 ve_tag_flavor.11.a:0 "Use o que sobreviveu ao exame."
 ve_tag_flavor.11.a.tt:0 "O resultado selecionado há um ano agora entra em vigor. O Era Momentum mantém seu piso zero normal e o modificador institucional dura 24 meses."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Pacto de Cidadania"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Uma linguagem comum de cidadania facilita a chegada e a participação, mas explicar o pacto em todas as jurisdições consome a autoridade central."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Barganha Composta"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "A administração federal aprende a negociar entre as comunidades constituintes, fortalecendo os escritórios e ao mesmo tempo reduzindo a pressão em direção a uma única forma cultural."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Ambiguidade Federal"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "A ambiguidade deliberada amplia a voz diplomática da União, mas por um tempo reduz o equilíbrio da Coesão Nacional em 2."
 ve_tag_flavor.20.t:0 "O Significado da União"
 ve_tag_flavor.20.d:0 "Os recém-chegados, os Estados estabelecidos e as comunidades com costumes públicos diferentes invocam a União nos seus próprios termos. Os legisladores concordam que é necessária uma fórmula comum, mas não se esta deve definir a cidadania individual, preservar um acordo entre as comunidades constituintes ou permanecer suficientemente ampla para ser interpretada por cada jurisdição."
 ve_tag_flavor.20.a:0 "Escrever um pacto de cidadania."
 ve_tag_flavor.20.a.tt:0 "Requer Nação Cívica.\nGaste #N 20 Mandato Cultural#! agora.\nApós aproximadamente um ano: ganhe #P 8 Visão Nacional#! e #P 3 Coesão Nacional#!, então ganhe #P +2,5% de Atração Migratória#! e #N -25 de Autoridade#! por 24 meses."
 ve_tag_flavor.20.b:0 "Negocie uma barganha composta."
 ve_tag_flavor.20.b.tt:0 "Requer Estado Composto.\nGaste #N 20 Mandato Cultural#! agora.\nApós aproximadamente um ano: ganhe #P 8 Insight Nacional#! e #P 3 Coesão Nacional#!, então ganhe #P +25 Burocracia#! e #N -2,5% de Assimilação#! por 24 meses."
 ve_tag_flavor.20.c:0 "Deixar a fórmula federal deliberadamente ampla."
 ve_tag_flavor.20.c.tt:0 "Após aproximadamente um ano: ganhar #P 4 Visão Nacional#! e #P +25 Influência#! por 24 meses. Enquanto o modificador estiver activo, o equilíbrio da Coesão Nacional é #N 2 inferior#!."
 ve_tag_flavor.21.t:0 "Uma Fórmula para a União"
 ve_tag_flavor.21.d:0 "Um ano de convenções, relatórios de comissões, resoluções estaduais e debate público produziu uma linguagem que as instituições podem utilizar. Os seus silêncios têm tantas consequências como as suas declarações, definindo quais as disputas que a União resolve e quais deixa à negociação."
 ve_tag_flavor.21.a:0 "Deixe a fórmula entrar na vida pública."
 ve_tag_flavor.21.a.tt:0 "O resultado seleccionado há um ano entra agora em vigor. As alterações de recursos são limitadas aos seus limites normais e o modificador institucional dura 24 meses."
