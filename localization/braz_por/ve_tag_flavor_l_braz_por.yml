l_braz_por:
 ve_tag_flavor_delayed_result_tt:0 "As consequências desta escolha institucional surgirán em aproximadamente um ano."
 ve_tag_flavor_free_route_tt:0 "Esta rota não consome Visão Nacional, Mandato Cultural ou Fundo de Piedade."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Um Léxico Cívico Comum"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Um vocabulário oficial compartilhado leva a reforma às escolas e repartições provinciais, mas a explicação constante consome a autoridade central."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Continuidade Sagrada"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "A reforma foi moldada através de instituições religiosas herdadas, reforçando o comando e estreitando os canais pelos quais circulam métodos estrangeiros."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Tradução Administrativa"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "A burocracia traduz a reforma em procedimentos familiares. A administração torna-se mais estável, mas a mudança legislativa perde alguma velocidade."
 ve_tag_flavor.1.t:0 "A Linguagem da Reforma"
 ve_tag_flavor.1.d:0 "Um decreto pode deixar a capital em prosa impecável e ainda assim chegar a uma escola, tribunal, repartição provincial ou fundação religiosa como quatro instruções diferentes. Os reformistas agora exigem um vocabulário comum. A questão é cujas instituições darão significado a esse vocabulário."
 ve_tag_flavor.1.a:0 "Redigir um léxico cívico comum."
 ve_tag_flavor.1.a.tt:0 "Requer Nação Cívica ou Estado Composto.\nConsome #N 20 Mandato Cultural#! agora.\nApós aproximadamente um ano: ganha #P 8 Visão Nacional#! e #P 3 Coesão Nacional#!, depois ganha #P +1% Acesso à Educação#! e #N -25 Autoridade#! por 24 meses."
 ve_tag_flavor.1.b:0 "Fundamentar a reforma na continuidade sagrada."
 ve_tag_flavor.1.b.tt:0 "Requer o Modelo Religioso Confessional.\nConsome #N 20 Fundo de Piedade#! agora.\nApós aproximadamente um ano: ganha #P 8 Visão Nacional#! e #P 3 Concordata Religiosa#!, depois ganha #P +25 Autoridade#! e #N -2,5% Propagação de Tecnologia#! por 24 meses."
 ve_tag_flavor.1.c:0 "Deixar que cada repartição traduza a ordem."
 ve_tag_flavor.1.c.tt:0 "Após aproximadamente um ano: ganha #P 4 Visão Nacional#!, depois ganha #P +25 Burocracia#! e #N -2,5% Velocidade de Promulgação#! de lei por 24 meses."
 ve_tag_flavor.2.t:0 "As Palavras Tornam-se Procedimento"
 ve_tag_flavor.2.d:0 "Um ano de circulares, comentários, livros escolares, sermões e correspondência provincial deu ao programa de reforma uma linguagem de trabalho. Não é perfeitamente uniforme, mas os oficiais agora sabem quais frases impõem concordância — e quais ainda ocultam divergência."
 ve_tag_flavor.2.a:0 "O vocabulário entra na engrenagem do Estado."
 ve_tag_flavor.2.a.tt:0 "O resultado selecionado há um ano entra em vigor agora. Suas alterações de recursos são limitadas aos seus limites normais, e seu modificador institucional dura 24 meses."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Gabinetes de Tradução"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Escritórios especializados aceleram a circulação de métodos estrangeiros, embora sua autonomia enfraqueça o comando imediato do centro."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Empréstimo Dirigido"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Instituições importadas são reorganizadas sob direção central. A autoridade é preservada, mas cada reforma leva mais tempo para passar pelos canais oficiais."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Adoção Seletiva"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "O Estado admite apenas métodos que possam ser reconciliados com a autoridade estabelecida, trocando a velocidade de difusão pelo controle político."
 ve_tag_flavor.10.t:0 "Métodos Emprestados, Autoridade Nativa"
 ve_tag_flavor.10.d:0 "Manuais, máquinas, planos escolares e tabelas administrativas estrangeiras chegam mais rápido do que qualquer ministério pode julgá-los. Alguns oficiais exigem gabinetes de tradução permanentes; outros insistem que cada instituição emprestada seja refeita sob direção central. Uma terceira facção admitiria apenas o que pode ser absorvido sem perturbar a ordem estabelecida."
 ve_tag_flavor.10.a:0 "Estabelecer gabinetes de tradução."
 ve_tag_flavor.10.a.tt:0 "Requer Acadêmico Doutrina IV ou Infraestrutura Doutrina IV.\nConsome #N 15 Visão Nacional#! agora.\nApós aproximadamente um ano: ganha #P 10 Ímpeto da Era#!, depois ganha #P +2,5% Propagação de Tecnologia#! e #N -25 Autoridade#! por 24 meses."
 ve_tag_flavor.10.b:0 "Emprestar apenas sob direção central."
 ve_tag_flavor.10.b.tt:0 "Requer Doutrina Nacional Japonesa IV.\nConsome #N 10 Visão Nacional#! agora.\nApós aproximadamente um ano: ganha #P 7 Ímpeto da Era#!, depois ganha #P +25 Autoridade#! e #N -2,5% Velocidade de Promulgação#! de lei por 24 meses."
 ve_tag_flavor.10.c:0 "Adotar seletivamente e preservar o comando."
 ve_tag_flavor.10.c.tt:0 "Após aproximadamente um ano: ganha #P 3 Ímpeto da Era#!, depois ganha #P +25 Autoridade#! e #N -2,5% Propagação de Tecnologia#! por 24 meses."
 ve_tag_flavor.11.t:0 "Métodos Tornados Nossos"
 ve_tag_flavor.11.d:0 "Um ano de tradução, testes, reescrita e discussão oficial separou a novidade da utilidade. Os métodos adotados já não parecem instruções estrangeiras; eles entraram no vocabulário de comando do próprio Estado."
 ve_tag_flavor.11.a:0 "Usar o que sobreviveu ao exame."
 ve_tag_flavor.11.a.tt:0 "O resultado selecionado há um ano entra em vigor agora. O Ímpeto da Era retém seu limite inferior de zero, e o modificador institucional dura 24 meses."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Pacto de Cidadania"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Uma linguagem comum de cidadania torna a chegada e a participação mais fáceis, mas explicar o pacto em cada jurisdição consome a autoridade central."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Acordo Composto"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "A administração federal aprende a negociar entre as comunidades constituintes, fortalecendo os gabinetes enquanto reduz a pressão em direção a uma única forma cultural."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Ambiguidade Federal"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "A ambiguidade deliberada amplia a voz diplomática da União, mas por um tempo reduz o equilíbrio da Coesão Nacional em 2."
 ve_tag_flavor.20.t:0 "O Significado da União"
 ve_tag_flavor.20.d:0 "Novas chegadas, estados estabelecidos e comunidades com diferentes costumes públicos invocam a União em seus próprios termos. Os legisladores concordam que uma fórmula comum é necessária, mas não se ela deve definir a cidadania individual, preservar um acordo entre comunidades constituintes ou permanecer ampla o suficiente para cada jurisdição interpretar."
 ve_tag_flavor.20.a:0 "Escrever um pacto de cidadania."
 ve_tag_flavor.20.a.tt:0 "Requer Nação Cívica.\nGaste #N 20 Mandato Cultural#! agora.\nApós aproximadamente um ano: ganhe #P 8 Visão Nacional#! e #P 3 Coesão Nacional#!, então ganhe #P +2.5% Atração de Migração#! e #N -25 Autoridade#! por 24 meses."
 ve_tag_flavor.20.b:0 "Negociar um acordo composto."
 ve_tag_flavor.20.b.tt:0 "Requer Estado Composto.\nGaste #N 20 Mandato Cultural#! agora.\nApós aproximadamente um ano: ganhe #P 8 Visão Nacional#! e #P 3 Coesão Nacional#!, então ganhe #P +25 Burocracia#! e #N -2.5% Assimilação#! por 24 meses."
 ve_tag_flavor.20.c:0 "Deixar a fórmula federal deliberadamente ampla."
 ve_tag_flavor.20.c.tt:0 "Após aproximadamente um ano: ganhe #P 4 Visão Nacional#! e #P +25 Influência#! por 24 meses. Enquanto o modificador estiver ativo, o equilíbrio da Coesão Nacional é #N 2 menor#!."
 ve_tag_flavor.21.t:0 "Uma Fórmula para a União"
 ve_tag_flavor.21.d:0 "Um ano de convenções, relatórios de comitês, resoluções estaduais e debate público produziu uma linguagem que as instituições podem usar. Seus silêncios são tão consequentes quanto suas declarações, definindo quais disputas a União resolve e quais deixa para a negociação."
 ve_tag_flavor.21.a:0 "Deixar a fórmula entrar na vida pública."
 ve_tag_flavor.21.a.tt:0 "O resultado selecionado há um ano entra em vigor agora. As mudanças de recursos são limitadas aos seus limites normais, e o modificador institucional dura 24 meses."
