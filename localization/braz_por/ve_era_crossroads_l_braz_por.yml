 ve_era_crossroads.1.t:0 "Steam e o Estado"
 ve_era_crossroads.1.d:0 "Ferrovias, escolas, reformadores e administradores oferecem relatos rivais da nação moderna. O governo deve decidir qual relação entre a sociedade e o Estado organizará a primeira era."
 ve_era_crossroads.1.a:0 "Unir o país através de uma Rede Steam."
 ve_era_crossroads.1.b:0 "Construir uma Cidadania Educada."
 ve_era_crossroads.1.c:0 "Consolidar um Estado Administrativo."
 ve_era_crossroads.1.d.option:0 "Esta era não precisa de encruzilhadas nacionais."
 ve_era_crossroads.1.a.tt:0 "Inicia a #Y Rede Steam#! rota (Foco: Industrialização, Migração Camponesa e Ferrovias).\n• Meta: Alcançar 60 Progressos para ganhar #P +50 Impulso da Era#!.\n• Velocidade de Progresso: Ganha +1 de progresso mensal básico, mais +1 extra para cada âncora da Era 1 completada (Compartilhamento Camponês e objetivos Ferroviários).\n• Sinergia de Doutrina: Ter #Y Industrialista IV#! ou #Y Infraestrutura IV#! desbloqueia decisões de marcos mais baratas (5 Insights em vez de 10)."
 ve_era_crossroads.1.b.tt:0 "Inicia a #Y Cidadania Educada#! rota (Foco: Educação, Alfabetização e Trabalho Gratuito).\n• Meta: Alcançar 60 Progressos para ganhar #P +50 Momentum da Era#!.\n• Velocidade de Progresso: Ganha +1 de progresso mensal básico, mais +1 extra para cada âncora da Era 1 completada (objetivos de Trabalho Gratuito e Alfabetização/Escolas).\n• Sinergia de Doutrina: Ter #Y Acadêmico IV#! ou #Y Reformista IV#! desbloqueia decisões de marcos mais baratas (5 Insights em vez de 10)."
 ve_era_crossroads.1.c.tt:0 "Inicia o #Y Estado Administrativo#! rota (Foco: Legitimidade, Burocracia e Estabilidade do Governo).\n• Meta: Alcançar 60 Progresso para ganhar #P +50 Era Momentum#!.\n• Velocidade de Progresso: Ganha +1 de progresso base mensal, mais +1 extra para cada âncora da Era 1 concluída (objetivos de Legitimidade/Burocracia e Estabilidade Independente).\n• Sinergia de Doutrina: Ter #Y Burocrática IV#! ou #Y Parlamentar IV#! desbloqueia decisões de marcos mais baratas (5 Insights em vez de 10)."
 ve_era_crossroads.2.t:0 "Império ou Sociedade de Massa?"
 ve_era_crossroads.2.d:0 "O Estado já não pode tratar o alcance ultramarino, o bem-estar popular e a integração nacional como questões separadas. Um deles definirá como os outros serão perseguidos."
 ve_era_crossroads.2.a:0 "Olhe em direção ao Horizonte Imperial."
 ve_era_crossroads.2.b:0 "Construa um sistema de Bem-Estar de Massa."
 ve_era_crossroads.2.c:0 "Forje uma Nação Integrada."
 ve_era_crossroads.2.d.option:0 "Deixe a era encontrar sua própria direção."
 ve_era_crossroads.2.a.tt:0 "Começa o #Y Horizonte Imperial#! rota (Foco: Poder Diplomático e Alcance Internacional).\n• Meta: Alcançar 60 progressos para obter #P +50 de Impulso da Era#!.\n• Velocidade de Progresso: Ganha +1 de progresso mensal base, mais +1 extra para cada âncora da Era 2 concluída (objetivos de Capacidade de Estado Reconhecida e Portos/Interesses).\n• Sinergia de Doutrina: Ter #Y Diplomatic IV#! ou #Y Colonial IV#! desbloqueia decisões de marcos mais baratas (5 Insight em vez de 10)."
 ve_era_crossroads.2.b.tt:0 "Inicia o #Y Bem-estar em massa#! rota (Foco: Instituições Sociais, Saúde e Educação).\n• Meta: Alcançar 60 Progresso para obter #P +50 Momento da Era#!.\n• Velocidade de progresso: ganha +1 de progresso base mensal, mais +1 extra para cada âncora completa da Idade 2 (objetivos de Alfabetização/Escolas e Instituições Sociais).\n• Sinergia de Doutrina: Ter #Y Bem-estar IV#! ou #Y Reformista IV#! desbloqueia decisões de marcos mais baratas (5 Insight em vez de 10)."
 ve_era_crossroads.2.c.tt:0 "Começa a #Y Nação Integrada#! rota (Foco: Transformação Econômica e Estabilidade Interna).\n• Meta: Alcançar 60 Progressos para ganhar #P +50 Impulso da Era#!.\n• Velocidade de Progresso: Ganha +1 de progresso mensal básico, mais +1 extra para cada âncora da Era 2 completada (objetivos de Transformação Econômica e Legitimidade de Baixa Turbulência).\n• Sinergia de Doutrina: Ter #Y Nacionalista IV#! ou #Y Trabalho IV#! desbloqueia decisões mais baratas (5 Insights em vez de 10)."
 ve_era_crossroads.3.t:0 "A Sociedade Mobilizada"
 ve_era_crossroads.3.d:0 "A política de massa, o comando estratégico e a mobilização industrial agora alcançam todas as instituições. A era final exige uma escolha sobre qual forma de mobilização definirá a nação."
 ve_era_crossroads.3.a:0 "Comprometa-se com uma República Social."
 ve_era_crossroads.3.b:0 "Coloque a nação sob Comando Estratégico."
 ve_era_crossroads.3.c:0 "Construa uma Sociedade Arsenal."
 ve_era_crossroads.3.d.option:0 "Rejeite um projeto de mobilização permanente."
 ve_era_crossroads.3.a.tt:0 "Inicia a #Y República Social#! rota (Foco: Política de Massa e Instituições Sociais).\n• Meta: Alcançar 60 Progressos para ganhar #P +50 Momentum da Era#!.\n• Velocidade de Progresso: Ganha +1 de progresso mensal base, mais +1 extra para cada âncora de 3 anos completada (objetivos de Política de Massa e Instituições Sociais Maduras).\n• Sinergia de Doutrina: Ter #Y Parlamentar IV#! ou #Y Bem-estar IV#! desbloqueia decisões de marcos mais baratas (5 Insights em vez de 10)."
 ve_era_crossroads.3.b.tt:0 "Inicia o #Y Comando Estratégico#! rota (Foco: Modernização Militar e Alcance de Poder Global).\n• Meta: Alcançar 60 de Progresso para ganhar #P +50 de Impulso de Era#!.\n• Velocidade de Progresso: Ganha +1 de progresso base mensal, mais +1 extra para cada âncora da Era 3 completada (objetivos de Composição da Força Moderna e Alcance de Grande Poder).\n• Sinergia de Doutrina: Ter #Y Exército Profissional IV#! ou #Y Defensivo IV#! desbloqueia decisões de marcos mais baratas (5 Insights em vez de 10)."
 ve_era_crossroads.3.c.tt:0 "Inicia o #Y Sociedade Arsenal#! rota (Foco: Economia de Guerra Industrial e Armamentos em Massa).\n• Meta: Alcançar 60 progressos para obter #P +50 de Impulso de Era#!.\n• Velocidade de Progresso: ganha +1 de progresso mensal básico, mais +1 extra para cada âncora da Era 3 concluída (objetivos de Indústria Elétrica e Armamentos em Massa).\n• Sinergia de Doutrina: Ter #Y Economia de Guerra IV#! ou #Y Conscrição em massa IV#! desbloqueia decisões de marcos mais baratas (5 Insights em vez de 10)."

 ve_era_crossroads_decline_tt:0 "Recusa permanentemente a Encruzilhada da Era da Era atual. As idades posteriores permanecem elegíveis."

 ve_era_crossroads.10.t:0 "Um Calendário Nacional"
 ve_era_crossroads.10.d:0 "Os gabinetes provinciais, as associações privadas e os ministérios estão a prosseguir a transformação escolhida a diferentes velocidades. Um calendário comum poderia transformar realizações dispersas num programa nacional, mas a própria coordenação exige pouca atenção administrativa."
 ve_era_crossroads.10.a:0 "Financiar uma comissão central de coordenação."
 ve_era_crossroads.10.b:0 "Deixar as instituições negociarem o seu próprio calendário."
 ve_era_crossroads.10.c:0 "Use as redes construídas por nossas doutrinas estabelecidas."
 ve_era_crossroads.10.a.tt:0 "Gaste #N 10 National Insight#! para obter #P +3 progresso na Encruzilhada#!."
 ve_era_crossroads.10.b.tt:0 "Não gaste nenhum recurso e não faça nenhuma mudança imediata no progresso da Encruzilhada."
 ve_era_crossroads.10.c.tt:0 "Requer um Grupo de Ideias de nível IV adequado à rota. Gaste #N 5 National Insight#! para ganhar #P +3 progresso na Encruzilhada#!."

 ve_era_crossroads.11.t:0 "Quem Direcionará o Progresso?"
 ve_era_crossroads.11.d:0 "O programa tornou-se demasiado importante para continuar a ser um acordo frouxo. Os ministros reivindicam autoridade nacional, os especialistas exigem isolamento da política e os intervenientes locais alertam que um comando rígido irá quebrar as instituições que tornaram possível o progresso."
 ve_era_crossroads.11.a:0 "Dê ao centro um mandato de coordenação claro."
 ve_era_crossroads.11.b:0 "Preservar o equilíbrio negociado de autoridade."
 ve_era_crossroads.11.c:0 "Confiar a coordenação às nossas instituições doutrinárias."
 ve_era_crossroads.11.a.tt:0 "Gastar #N 10 Visão Nacional#! para obter #P +3 progresso na Encruzilhada#!."
 ve_era_crossroads.11.b.tt:0 "Não gaste recursos e não faça nenhuma mudança imediata no progresso da Encruzilhada."
 ve_era_crossroads.11.c.tt:0 "Requer um Grupo de Ideias de nível IV de ajuste de rota. Gaste #N 5 National Insight#! para ganhar #P +3 progresso no Crossroads#!."

 ve_era_crossroads.40.t:0 "O Vapor e o Estado"
 ve_era_crossroads.40.d:0 "O rumo escolhido não é mais uma série de conquistas isoladas. Infraestrutura, cidadania ou administração formam agora um programa nacional durável através do qual o Estado pode compreender e dirigir as transformações da época."
 ve_era_crossroads.40.a:0 "A primeira era encontrou a sua forma institucional."
 ve_era_crossroads.40.a.tt:0 "A Era concluída A Encruzilhada concedeu #P +50 Era Momentum#!. Não completou um objetivo nem alterou a elegibilidade para a Idade de Ouro."

 ve_era_crossroads.20.t:0 "O alcance do Estado"
 ve_era_crossroads.20.d:0 "O programa escolhido estende-se agora para além das instituições que o patrocinaram inicialmente. Portos, escolas, escritórios e autoridades locais discordam sobre onde deve terminar a coordenação nacional e começar a discricionariedade local."
 ve_era_crossroads.20.a:0 "Mapear as obrigações do estado através de uma comissão central."
 ve_era_crossroads.20.b:0 "Permitir que limites institucionais surjam por meio de negociação."
 ve_era_crossroads.20.c:0 "Coordene através de nossas redes doutrinárias estabelecidas."
 ve_era_crossroads.20.a.tt:0 "Gaste #N 10 Conhecimento Nacional#! para obter #P +3 progresso na Encruzilhada#!."
 ve_era_crossroads.20.b.tt:0 "Não gaste nenhum recurso e não faça nenhuma mudança imediata no progresso da Encruzilhada."
 ve_era_crossroads.20.c.tt:0 "Requer um Grupo de Ideias de nível IV adequado à rota. Gaste #N 5 National Insight#! para ganhar #P +3 progresso na Encruzilhada#!."

 ve_era_crossroads.21.t:0 "O Preço da Integração"
 ve_era_crossroads.21.d:0 "O alcance externo, a provisão social e a disciplina nacional criam vencedores, custos e novas expectativas. O programa só poderá durar se o Estado decidir como esses encargos serão distribuídos."
 ve_era_crossroads.21.a:0 "Criar um conselho nacional para gerir o ajustamento."
 ve_era_crossroads.21.b:0 "Distribua o fardo através de compromissos negociados."
 ve_era_crossroads.21.c:0 "Deixe que nossas instituições doutrinárias absorvam a tensão."
 ve_era_crossroads.21.a.tt:0 "Gaste #N 10 Visão Nacional#! para obter #P +3 progresso na Encruzilhada#!."
 ve_era_crossroads.21.b.tt:0 "Não gaste recursos e não faça nenhuma mudança imediata no progresso da Encruzilhada."
 ve_era_crossroads.21.c.tt:0 "Requer um Grupo de Ideias de nível IV de ajuste de rota. Gaste #N 5 National Insight#! para ganhar #P +3 progresso no Crossroads#!."

 ve_era_crossroads.41.t:0 "Império e Sociedade de Massa"
 ve_era_crossroads.41.d:0 "O acordo escolhido liga agora o alcance externo do Estado, as obrigações sociais e as instituições nacionais. O que começou como uma direcção estratégica tornou-se num quadro duradouro para governar a sociedade de massas."
 ve_era_crossroads.41.a:0 "A segunda era encontrou seu assentamento."
 ve_era_crossroads.41.a.tt:0 "A Era Crossroads concluída concedeu #P +50 Era Momentum#!. Não completou um objetivo nem alterou a elegibilidade para a Idade de Ouro."

 ve_era_crossroads.30.t:0 "A nação é chamada ao dever"
 ve_era_crossroads.30.d:0 "Cidadãos, comandantes, trabalhadores e administradores estão todos a receber novas obrigações pelo programa escolhido. A menos que esses deveres sejam legíveis entre si, a mobilização continuará a ser um conjunto de exigências concorrentes."
 ve_era_crossroads.30.a:0 "Codificar os deveres nacionais através de uma comissão central."
 ve_era_crossroads.30.b:0 "Deixe as instituições negociarem as suas responsabilidades."
 ve_era_crossroads.30.c:0 "Use nossas organizações doutrinárias para coordenar os deveres."
 ve_era_crossroads.30.a.tt:0 "Gaste #N 10 National Insight#! para ganhar #P +3 Progresso da Encruzilhada#!."
 ve_era_crossroads.30.b.tt:0 "Não gaste recursos e não faça nenhuma mudança imediata no progresso da Encruzilhada."
 ve_era_crossroads.30.c.tt:0 "Requer um Grupo de Ideias de nível IV de ajuste de rota. Gaste #N 5 National Insight#! para ganhar #P +3 progresso na Encruzilhada#!."

 ve_era_crossroads.31.t:0 "Uma Emergência Permanente"
 ve_era_crossroads.31.d:0 "A maquinaria construída para a participação das massas, a prontidão estratégica ou a mobilização industrial está a tornar-se permanente. O Estado deve decidir como preservar a capacidade sem permitir que a disciplina de emergência consuma a vida nacional normal."
 ve_era_crossroads.31.a:0 "Definir limites permanentes através de uma revisão nacional."
 ve_era_crossroads.31.b:0 "Mantenha o acordo deliberadamente flexível."
 ve_era_crossroads.31.c:0 "Confie em instituições doutrinárias para conter o maquinário."
 ve_era_crossroads.31.a.tt:0 "Gaste #N 10 Visão Nacional#! para obter #P +3 progresso na Encruzilhada#!."
 ve_era_crossroads.31.b.tt:0 "Não gaste recursos e não faça nenhuma mudança imediata no progresso da Encruzilhada."
 ve_era_crossroads.31.c.tt:0 "Requer um Grupo de Ideias de nível IV de ajuste de rota. Gaste #N 5 National Insight#! para ganhar #P +3 progresso no Crossroads#!."

 ve_era_crossroads.42.t:0 "A Sociedade Mobilizada"
 ve_era_crossroads.42.d:0 "A cidadania, o comando e a capacidade industrial formam agora um acordo nacional duradouro. As instituições de mobilização passaram a fazer parte do governo ordinário, em vez de serem deixadas como respostas improvisadas a cada nova crise."
 ve_era_crossroads.42.a:0 "A idade final encontrou sua forma nacional."
 ve_era_crossroads.42.a.tt:0 "A Era Crossroads concluída concedeu #P +50 Era Momentum#!. Não completou um objetivo nem alterou a elegibilidade para a Idade de Ouro."
