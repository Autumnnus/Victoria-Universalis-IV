 ve_era_crossroads.1.t:0 "Vapor e o Estado"
 ve_era_crossroads.1.d:0 "Ferrovias, escolas, reformadores e administradores oferecem relatos rivais da nação moderna. O governo deve decidir qual relação entre a sociedade e o Estado organizará a primeira era."
 ve_era_crossroads.1.a:0 "Unir o país por meio de uma Rede de Vapor."
 ve_era_crossroads.1.b:0 "Construir uma Cidadania Educada."
 ve_era_crossroads.1.c:0 "Consolidar um Estado Administrativo."
 ve_era_crossroads.1.d.option:0 "Esta era não precisa de encruzilhadas nacionais."
 ve_era_crossroads.1.a.tt:0 "Inicia a rota da #Y Rede de Vapor#! (Foco: Industrialização, Migração Camponesa & Ferrovias).\n• Meta: Atingir 60 de Progresso para obter #P +50 de Ímpeto da Era#!.\n• Velocidade de Progresso: Concede +1 de progresso mensal base, mais +1 extra para cada âncora da Era 1 concluída (objetivos de Fatia de Camponeses e Ferrovias).\n• Sinergia de Doutrina: Possuir #Y Industrialista IV#! ou #Y Infraestrutura IV#! desbloqueia decisões de marco mais baratas (5 de Visão em vez de 10)."
 ve_era_crossroads.1.b.tt:0 "Inicia a rota de #Y Cidadania Educada#! (Foco: Educação, Instrução & Trabalho Livre).\n• Meta: Atingir 60 de Progresso para obter #P +50 de Ímpeto da Era#!.\n• Velocidade de Progresso: Concede +1 de progresso mensal base, mais +1 extra para cada âncora da Era 1 concluída (objetivos de Trabalho Livre e Instrução/Escolas).\n• Sinergia de Doutrina: Possuir #Y Acadêmico IV#! ou #Y Reformista IV#! desbloqueia decisões de marco mais baratas (5 de Visão em vez de 10)."
 ve_era_crossroads.1.c.tt:0 "Inicia a rota do #Y Estado Administrativo#! (Foco: Legitimidade do Governo, Burocracia & Estabilidade).\n• Meta: Atingir 60 de Progresso para obter #P +50 de Ímpeto da Era#!.\n• Velocidade de Progresso: Concede +1 de progresso mensal base, mais +1 extra para cada âncora da Era 1 concluída (objetivos de Legitimidade/Burocracia e Estabilidade Independente).\n• Sinergia de Doutrina: Possuir #Y Burocrático IV#! ou #Y Parlamentar IV#! desbloqueia decisões de marco mais baratas (5 de Visão em vez de 10)."
 ve_era_crossroads.2.t:0 "Império ou Sociedade de Massas?"
 ve_era_crossroads.2.d:0 "O Estado não pode mais tratar o alcance ultramarino, o bem-estar popular e a integração nacional como questões separadas. Uma delas definirá como as outras serão perseguidas."
 ve_era_crossroads.2.a:0 "Voltar-se para o Horizonte Imperial."
 ve_era_crossroads.2.b:0 "Construir um sistema de Bem-Estar Social de Massas."
 ve_era_crossroads.2.c:0 "Forjar uma Nação Integrada."
 ve_era_crossroads.2.d.option:0 "Deixar que a era encontre sua própria direção."
 ve_era_crossroads.2.a.tt:0 "Inicia a rota do #Y Horizonte Imperial#! (Foco: Poder Diplomático & Alcance Ultramarino).\n• Meta: Atingir 60 de Progresso para obter #P +50 de Ímpeto da Era#!.\n• Velocidade de Progresso: Concede +1 de progresso mensal base, mais +1 extra para cada âncora da Era 2 concluída (objetivos de Capacidade de Estado Reconhecida e Portos/Interesses).\n• Sinergia de Doutrina: Possuir #Y Diplomático IV#! ou #Y Colonial IV#! desbloqueia decisões de marco mais baratas (5 de Visão em vez de 10)."
 ve_era_crossroads.2.b.tt:0 "Inicia a rota de #Y Bem-Estar Social#! de Massas (Foco: Instituições Sociais, Cuidados de Saúde & Educação).\n• Meta: Atingir 60 de Progresso para obter #P +50 de Ímpeto da Era#!.\n• Velocidade de Progresso: Concede +1 de progresso mensal base, mais +1 extra para cada âncora da Era 2 concluída (objetivos de Instrução/Escolas e Instituições Sociais).\n• Sinergia de Doutrina: Possuir #Y Bem-Estar Social IV#! ou #Y Reformista IV#! desbloqueia decisões de marco mais baratas (5 de Visão em vez de 10)."
 ve_era_crossroads.2.c.tt:0 "Inicia a rota da #Y Nação Integrada#! (Foco: Transformação Econômica & Estabilidade Interna).\n• Meta: Atingir 60 de Progresso para obter #P +50 de Ímpeto da Era#!.\n• Velocidade de Progresso: Concede +1 de progresso mensal base, mais +1 extra para cada âncora da Era 2 concluída (objetivos de Transformação Econômica e Legitimidade de Baixa Instabilidade).\n• Sinergia de Doutrina: Possuir #Y Nacionalista IV#! ou #Y Trabalho IV#! desbloqueia decisões de marco mais baratas (5 de Visão em vez de 10)."
 ve_era_crossroads.3.t:0 "A Sociedade Mobilizada"
 ve_era_crossroads.3.d:0 "A política de massas, o comando estratégico e a mobilização industrial agora alcançam todas as instituições. A era final exige uma escolha sobre qual forma de mobilização definirá a nação."
 ve_era_crossroads.3.a:0 "Comprometer-se com uma República Social."
 ve_era_crossroads.3.b:0 "Colocar a nação sob Comando Estratégico."
 ve_era_crossroads.3.c:0 "Construir uma Sociedade de Arsenal."
 ve_era_crossroads.3.d.option:0 "Rejeitar um projeto de mobilização permanente."
 ve_era_crossroads.3.a.tt:0 "Inicia a rota #Y República Social#! (Foco: Política de Massas e Instituições Sociais).\n• Objetivo: Alcançar 60 de Progresso para obter #P +50 de Ímpeto da Era#!.\n• Velocidade de Progresso: Concede +1 de progresso mensal base, mais +1 extra para cada âncora concluída da Era 3 (objetivos de Política de Massas e Instituições Sociais Maduras).\n• Sinergia de Doutrina: Possuir #Y Parlamentar IV#! ou #Y Bem-Estar Social IV#! desbloqueia decisões de marco mais baratas (5 Visão Nacional em vez de 10)."
 ve_era_crossroads.3.b.tt:0 "Inicia a rota #Y Comando Estratégico#! (Foco: Modernização Militar e Alcance de Superpotência Global).\n• Objetivo: Alcançar 60 de Progresso para obter #P +50 de Ímpeto da Era#!.\n• Velocidade de Progresso: Concede +1 de progresso mensal base, mais +1 extra para cada âncora concluída da Era 3 (objetivos de Composição de Força Moderna e Alcance de Superpotência).\n• Sinergia de Doutrina: Possuir #Y Exército Profissional IV#! ou #Y Defensiva IV#! desbloqueia decisões de marco mais baratas (5 Visão Nacional em vez de 10)."
 ve_era_crossroads.3.c.tt:0 "Inicia a rota #Y Sociedade de Arsenal#! (Foco: Economia de Guerra Industrial e Armamentos em Massa).\n• Objetivo: Alcançar 60 de Progresso para obter #P +50 de Ímpeto da Era#!.\n• Velocidade de Progresso: Concede +1 de progresso mensal base, mais +1 extra para cada âncora concluída da Era 3 (objetivos de Indústria Elétrica e Armamentos em Massa).\n• Sinergia de Doutrina: Possuir #Y Economia de Guerra IV#! ou #Y Conscrição em Massa IV#! desbloqueia decisões de marco mais baratas (5 Visão Nacional em vez de 10)."

 ve_era_crossroads_decline_tt:0 "Recusa permanentemente a Encruzilhada da Era atual. Eras posteriores continuarão elegíveis."

 ve_era_crossroads.10.t:0 "Um Calendário Nacional"
 ve_era_crossroads.10.d:0 "Escritórios provinciais, associações privadas e ministérios estão prosseguindo com a transformação escolhida a diferentes velocidades. Um calendário comum poderia transformar realizações dispersas em um programa nacional, mas a coordenação em si exige atenção administrativa escassa."
 ve_era_crossroads.10.a:0 "Financiar uma comissão de coordenação central."
 ve_era_crossroads.10.b:0 "Deixar que as instituições negociem seu próprio cronograma."
 ve_era_crossroads.10.c:0 "Usar as redes construídas por nossas doutrinas estabelecidas."
 ve_era_crossroads.10.a.tt:0 "Gasta #N 10 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada#!."
 ve_era_crossroads.10.b.tt:0 "Não gasta nenhum recurso e não faz nenhuma alteração imediata no progresso da Encruzilhada."
 ve_era_crossroads.10.c.tt:0 "Requer um Grupo de Doutrinas nível IV compatível com a rota. Gasta #N 5 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada#!."

 ve_era_crossroads.11.t:0 "Quem Dirigirá o Progresso?"
 ve_era_crossroads.11.d:0 "O programa tornou-se consequente demais para permanecer um acordo frouxo. Ministros reivindicam autoridade nacional, especialistas exigem isolamento da política, e atores locais alertam que o comando rígido quebrará as instituições que tornaram o progresso possível."
 ve_era_crossroads.11.a:0 "Dar ao centro um mandato de coordenação claro."
 ve_era_crossroads.11.b:0 "Preservar o equilíbrio de autoridade negociado."
 ve_era_crossroads.11.c:0 "Confiar a coordenação às nossas instituições doutrinais."
 ve_era_crossroads.11.a.tt:0 "Gasta #N 10 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada#!."
 ve_era_crossroads.11.b.tt:0 "Não gasta nenhum recurso e não faz nenhuma alteração imediata no progresso da Encruzilhada."
 ve_era_crossroads.11.c.tt:0 "Requer um Grupo de Doutrinas nível IV compatível com a rota. Gasta #N 5 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada#!."

 ve_era_crossroads.40.t:0 "Vapor e o Estado"
 ve_era_crossroads.40.d:0 "O rumo escolhido deixou de ser uma série de realizações isoladas. Infraestrutura, cidadania ou administração agora formam um programa nacional durável através do qual o estado pode compreender e direcionar as transformações da era."
 ve_era_crossroads.40.a:0 "A primeira era encontrou sua forma institucional."
 ve_era_crossroads.40.a.tt:0 "A Encruzilhada da Era concluída concedeu #P +50 de Ímpeto da Era#!. Ela não concluiu um objetivo nem alterou a elegibilidade para a Era de Ouro."

 ve_era_crossroads.20.t:0 "O Alcance do Estado"
 ve_era_crossroads.20.d:0 "O programa escolhido agora se estende além das instituições que primeiro o patrocinaram. Portos, escolas, escritórios e autoridades locais discordam sobre onde a coordenação nacional deve terminar e a discrição local deve começar."
 ve_era_crossroads.20.a:0 "Mapear as obrigações do estado através de uma comissão central."
 ve_era_crossroads.20.b:0 "Permitir que as fronteiras institucionais surjam por negociação."
 ve_era_crossroads.20.c:0 "Coordenar através de nossas redes doutrinais estabelecidas."
 ve_era_crossroads.20.a.tt:0 "Gasta #N 10 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada#!."
 ve_era_crossroads.20.b.tt:0 "Não gasta nenhum recurso e não faz nenhuma alteração imediata no progresso da Encruzilhada."
 ve_era_crossroads.20.c.tt:0 "Requer um Grupo de Doutrinas nível IV compatível com a rota. Gasta #N 5 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada#!."

 ve_era_crossroads.21.t:0 "O Preço da Integração"
 ve_era_crossroads.21.d:0 "O alcance externo, a provisão social e a disciplina nacional geram vencedores, custos e novas expectativas. O programa só poderá perdurar se o Estado decidir como esses encargos serão distribuídos."
 ve_era_crossroads.21.a:0 "Criar um conselho nacional para gerir o ajuste."
 ve_era_crossroads.21.b:0 "Distribuir o encargo por meio de compromissos negociados."
 ve_era_crossroads.21.c:0 "Deixar que nossas instituições doutrinárias absorvam a sobrecarga."
 ve_era_crossroads.21.a.tt:0 "Gastar #N 10 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada da Era#!."
 ve_era_crossroads.21.b.tt:0 "Não gastar recursos nem alterar imediatamente o progresso na Encruzilhada da Era."
 ve_era_crossroads.21.c.tt:0 "Requer um Grupo de Doutrinas de nível IV compatível com a rota. Gastar #N 5 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada da Era#!."

 ve_era_crossroads.41.t:0 "Império e Sociedade de Massa"
 ve_era_crossroads.41.d:0 "O acordo escolhido conecta agora o alcance externo, as obrigações sociais e as instituições nacionais do Estado. O que começou como uma direção estratégica tornou-se uma estrutura duradoura para governar a sociedade de massa."
 ve_era_crossroads.41.a:0 "A segunda era encontrou o seu acordo."
 ve_era_crossroads.41.a.tt:0 "A Encruzilhada da Era concluída concedeu #P +50 de Ímpeto da Era#!. Não concluiu um objetivo nem alterou a elegibilidade para a Era de Ouro."

 ve_era_crossroads.30.t:0 "A Nação É Chamada ao Dever"
 ve_era_crossroads.30.d:0 "Cidadãos, comandantes, trabalhadores e administradores estão recebendo novas obrigações do programa escolhido. A menos que esses deveres sejam tornados compreensíveis entre si, a mobilização continuará sendo uma coleção de demandas concorrentes."
 ve_era_crossroads.30.a:0 "Codificar os deveres nacionais por meio de uma comissão central."
 ve_era_crossroads.30.b:0 "Deixar que as instituições negociem suas responsabilidades."
 ve_era_crossroads.30.c:0 "Usar nossas organizações doutrinárias para coordenar o dever."
 ve_era_crossroads.30.a.tt:0 "Gastar #N 10 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada da Era#!."
 ve_era_crossroads.30.b.tt:0 "Não gastar recursos nem alterar imediatamente o progresso na Encruzilhada da Era."
 ve_era_crossroads.30.c.tt:0 "Requer um Grupo de Doutrinas de nível IV compatível com a rota. Gastar #N 5 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada da Era#!."

 ve_era_crossroads.31.t:0 "Uma Emergência Permanente"
 ve_era_crossroads.31.d:0 "A maquinaria construída para a participação de massa, a prontidão estratégica ou a mobilização industrial está se tornando permanente. O Estado deve decidir como preservar o artifício sem permitir que a disciplina de emergência consuma a vida nacional comum."
 ve_era_crossroads.31.a:0 "Definir limites permanentes por meio de uma revisão nacional."
 ve_era_crossroads.31.b:0 "Manter o acordo deliberadamente flexível."
 ve_era_crossroads.31.c:0 "Contar com as instituições doutrinárias para conter a maquinaria."
 ve_era_crossroads.31.a.tt:0 "Gastar #N 10 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada da Era#!."
 ve_era_crossroads.31.b.tt:0 "Não gastar recursos nem alterar imediatamente o progresso na Encruzilhada da Era."
 ve_era_crossroads.31.c.tt:0 "Requer um Grupo de Doutrinas de nível IV compatível com a rota. Gastar #N 5 Visão Nacional#! para obter #P +3 de progresso na Encruzilhada da Era#!."

 ve_era_crossroads.42.t:0 "A Sociedade Mobilizada"
 ve_era_crossroads.42.d:0 "A cidadania, o comando e o artifício industrial formam agora um acordo nacional duradouro. As instituições de mobilização passaram a fazer parte do governo ordinário, em vez de serem deixadas como respostas improvisadas a cada nova crise."
 ve_era_crossroads.42.a:0 "A era final encontrou a sua forma nacional."
 ve_era_crossroads.42.a.tt:0 "A Encruzilhada da Era concluída concedeu #P +50 de Ímpeto da Era#!. Não concluiu um objetivo nem alterou a elegibilidade para a Era de Ouro."
