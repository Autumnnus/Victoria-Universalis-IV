l_braz_por:
 ve_je_religious_settlement_transition:0 "Transição da Concordata Religiosa"
 ve_je_religious_settlement_transition_reason:0 "A concordata legal entre a igreja e o Estado mudou. Instituições, comunidades e autoridades devem se adaptar enquanto a crise de transição estiver em vigor. O modificador de crise — e não o calendário deste Registro no Diário — é a autoridade máxima."
 ve_je_religious_settlement_transition_complete_tt:0 "A crise de transição da Concordata Religiosa terminou."
 ve_je_religious_settlement_transition_status_confessional:0 "Concordata-alvo: #Y Estado Confessional#!\nConcordata Religiosa: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTempo aproximado restante: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] meses#!\nMarcos concluídos: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nResultado ao término da crise: #Y 60+#! a concordata se estabiliza antecipadamente, #Y 26-59#! resolve-se de forma neutra, #Y 25 ou menos#! transforma-se em crise. Cada marco restante oferece uma escolha que afeta a Concordata Religiosa."
 ve_je_religious_settlement_transition_status_freedom:0 "Concordata-alvo: #Y Liberdade de Consciência#!\nConcordata Religiosa: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTempo aproximado restante: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] meses#!\nMarcos concluídos: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nResultado ao término da crise: #Y 60+#! a concordata se estabiliza antecipadamente, #Y 26-59#! resolve-se de forma neutra, #Y 25 ou menos#! transforma-se em crise. Cada marco restante oferece uma escolha que afeta a Concordata Religiosa."
 ve_je_religious_settlement_transition_status_separation:0 "Concordata-alvo: #Y Separação Total#!\nConcordata Religiosa: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTempo aproximado restante: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] meses#!\nMarcos concluídos: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nResultado ao término da crise: #Y 60+#! a concordata se estabiliza antecipadamente, #Y 26-59#! resolve-se de forma neutra, #Y 25 ou menos#! transforma-se em crise. Cada marco restante oferece uma escolha que afeta a Concordata Religiosa."
 ve_je_religious_settlement_transition_status_atheism:0 "Concordata-alvo: #Y Ateísmo de Estado#!\nConcordata Religiosa: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTempo aproximado restante: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] meses#!\nMarcos concluídos: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nResultado ao término da crise: #Y 60+#! a concordata se estabiliza antecipadamente, #Y 26-59#! resolve-se de forma neutra, #Y 25 ou menos#! transforma-se em crise. Cada marco restante oferece uma escolha que afeta a Concordata Religiosa."

 ve_je_national_compact_transition:0 "Transição do Pacto Nacional"
 ve_je_national_compact_transition_reason:0 "O Estado adotou uma nova definição de pertencimento nacional. Administradores, elites e comunidades devem Negociar o pacto enquanto a reação da transição permanecer em vigor. O modificador de reação — e não o calendário deste Registro no Diário — é a autoridade máxima."
 ve_je_national_compact_transition_complete_tt:0 "A reação de transição do Pacto Nacional terminou."
 ve_je_national_compact_transition_status_ethnic:0 "Identidade-alvo: #Y Identidade Étnica#!\nCoesão Nacional: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTempo aproximado restante: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] meses#!\nMarcos concluídos: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nResultado ao término da reação: #Y 60+#! a coesão se estabiliza antecipadamente, #Y 26-59#! resolve-se de forma neutra, #Y 25 ou menos#! transforma-se em crise. Cada marco restante oferece uma escolha que afeta a Coesão Nacional."
 ve_je_national_compact_transition_status_civic:0 "Identidade-alvo: #Y Identidade Cívica#!\nCoesão Nacional: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTempo aproximado restante: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] meses#!\nMarcos concluídos: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nResultado ao término da reação: #Y 60+#! a coesão se estabiliza antecipadamente, #Y 26-59#! resolve-se de forma neutra, #Y 25 ou menos#! transforma-se em crise. Cada marco restante oferece uma escolha que afeta a Coesão Nacional."
 ve_je_national_compact_transition_status_composite:0 "Identidade-alvo: #Y Identidade Composta#!\nCoesão Nacional: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTempo aproximado restante: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] meses#!\nMarcos concluídos: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nResultado ao término da reação: #Y 60+#! a coesão se estabiliza antecipadamente, #Y 26-59#! resolve-se de forma neutra, #Y 25 ou menos#! transforma-se em crise. Cada marco restante oferece uma escolha que afeta a Coesão Nacional."
 ve_je_transition_resolving_status:0 "O registro de transição está sendo reconciliado com a concordata nacional atual."

 ve_rel_transition_conciliatory_tt:0 "Gastar #N 10#! Fundo de Piedade e ganhar #P 3#! Concordata Religiosa."
 ve_rel_transition_central_tt:0 "Ganhar #P 5#! Fundo de Piedade e perder #N 3#! Concordata Religiosa."
 ve_rel_transition_doctrine_tt:0 "Gastar #N 5#! Fundo de Piedade e ganhar #P 2#! Concordata Religiosa."

 ve_rel_evt.210.t:0 "Os Limites da Nomeação Clerical"
 ve_rel_evt.210.d:0 "As autoridades religiosas apresentaram listas de candidatos para cargos públicos, enquanto administradores seniores insistem que o serviço do Estado ainda deve premiar a competência. As primeiras nomeações sob o novo acordo definirão onde termina o conselho clerical e começa a autoridade civil."
 ve_rel_evt.210.a:0 "Convocar um conselho de nomeações mistas."
 ve_rel_evt.210.b:0 "Aceitar as listas clericais."
 ve_rel_evt.210.c:0 "Emparelhar exames padrão com aconselhamento religioso."

 ve_rel_evt.211.t:0 "Escolas e Juramentos de Lealdade"
 ve_rel_evt.211.d:0 "As escolas paroquiais buscam um lugar reconhecido no sistema público. Seus patronos exigem proteção para a instrução religiosa, enquanto funcionários temem que currículos e juramentos concorrentes dividam a próxima geração."
 ve_rel_evt.211.a:0 "Garantir um currículo básico compartilhado."
 ve_rel_evt.211.b:0 "Impor um único juramento de Lealdade uniforme."
 ve_rel_evt.211.c:0 "Colocar o compromisso sob inspeção burocrática."

 ve_rel_evt.220.t:0 "A Linguagem das Garantias às Minorias"
 ve_rel_evt.220.d:0 "As comunidades minoritárias querem suas proteções redigidas explicitamente no novo acordo. Juristas do Governo, em contrapartida, favorecem uma única cláusula geral, alertando que promessas específicas de comunidades podem endurecer antigas divisões."
 ve_rel_evt.220.a:0 "Escrever as garantias claramente."
 ve_rel_evt.220.b:0 "Usar uma única cláusula de cidadania uniforme."
 ve_rel_evt.220.c:0 "Deixar a coalizão de reforma mediar a redação."

 ve_rel_evt.221.t:0 "Representação em Instituições Comuns"
 ve_rel_evt.221.d:0 "Escolas, hospitais e conselhos locais devem agora servir cidadãos de várias confissões em termos iguais. A questão é se a representação deve seguir as realidades locais ou uma fórmula imposta a partir do centro."
 ve_rel_evt.221.a:0 "Equilibrar a representação localmente."
 ve_rel_evt.221.b:0 "Estabelecer uma cota central."
 ve_rel_evt.221.c:0 "Negociar uma fórmula de representação diplomática."

 ve_rel_evt.230.t:0 "O Registro Neutro"
 ve_rel_evt.230.d:0 "Nascimentos, casamentos e reivindicações de propriedade estão passando de custodiantes religiosos para registradores civis. Os funcionários podem preservar registros duplicados durante a transição, mas os reformistas exigem uma ruptura limpa e imediata."
 ve_rel_evt.230.a:0 "Manter registros duplos por um período de transição."
 ve_rel_evt.230.b:0 "Fechar os registros religiosos imediatamente."
 ve_rel_evt.230.c:0 "Implantar uma rede de serviço civil treinada."

 ve_rel_evt.231.t:0 "Escola e Cerimônia Pública"
 ve_rel_evt.231.d:0 "O princípio da neutralidade do Estado alcançou assembleias escolares e cerimônias públicas. As comunidades locais querem espaço para costumes herdados; funcionários centrais querem um protocolo secular que não deixe margem para ambiguidade."
 ve_rel_evt.231.a:0 "Deixar espaço para cerimônias locais."
 ve_rel_evt.231.b:0 "Tornar obrigatório um protocolo secular."
 ve_rel_evt.231.c:0 "Criar um padrão cívico ceremonial compartilhado."

 ve_rel_evt.240.t:0 "Uma Escassez de Quadros Seculares"
 ve_rel_evt.240.d:0 "A nova administração precisa de professores, registradores e inspetores capazes de operar sem instituições clericais. Há poucos candidatos treinados, e forçar a equipe existente a converter sua prática pode provocar resistência."
 ve_rel_evt.240.a:0 "Financiar um novo programa de treinamento de quadros."
 ve_rel_evt.240.b:0 "Compelir a equipe existente a se adaptar."
 ve_rel_evt.240.c:0 "Construir uma rede de treinamento acadêmico."

 ve_rel_evt.241.t:0 "Propriedade e Culto Clandestino"
 ve_rel_evt.241.d:0 "A transferência de propriedades religiosas forçou algumas congregações a operarem às escondidas. A confiscação imediata equiparia o novo Estado rapidamente, mas um acordo apressado arrisca transformar a adoração privada em desafio organizado."
 ve_rel_evt.241.a:0 "Transferir a propriedade gradualmente."
 ve_rel_evt.241.b:0 "Nacionalizar imediatamente."
 ve_rel_evt.241.c:0 "Direcionar os ativos para instituições de bem-estar social supervisionadas."

 ve_rel_evt.290.t:0 "Uma Concordata Cria Raízes"
 ve_rel_evt.290.d:0 "A crise de transição passou sem quebrar a concordata religiosa do país. Os administradores agora trabalham sob as novas regras, as comunidades sabem qual é a sua posição, e o governo pode transformar a experiência em capacidade de reforma ou em maior confiança pública."
 ve_rel_evt.290.a:0 "Lavar as lições para a próxima reforma."
 ve_rel_evt.290.a.tt:0 "Ganhe #P 10#! de Fundo de Piedade."
 ve_rel_evt.290.b:0 "Reafirmar publicamente a concordata."
 ve_rel_evt.290.b.tt:0 "Ganhe #P 3#! de Concordata Religiosa."

 ve_rel_evt.291.t:0 "Um Equilíbrio Frágil"
 ve_rel_evt.291.d:0 "A transição formal está concluída, mas a nova concordata continua a ser um acordo de cautela e não de convicção. Ela pode ser deixada para amadurecer por conta própria, fortalecida por meio de outra concessão limitada ou estabilizada por instituições adequadas ao modelo adotado."
 ve_rel_evt.291.a:0 "Deixar o compromisso vigente."
 ve_rel_evt.291.a.tt:0 "A transição termina sem nenhum efeito mecânico adicional."
 ve_rel_evt.291.b:0 "Financiar uma última acomodação."
 ve_rel_evt.291.b.tt:0 "Gaste #N 10#! de Fundo de Piedade e ganhe #P 3#! de Concordata Religiosa."
 ve_rel_evt.291.c:0 "Confiar a concordata a instituições adaptadas ao modelo."
 ve_rel_evt.291.c.tt:0 "Gaste #N 5#! de Fundo de Piedade e ganhe #P 2#! de Concordata Religiosa. Requer uma Doutrina adequada ao Modelo Religioso adotado."

 ve_rel_evt.292.t:0 "Uma Crise de Concordata"
 ve_rel_evt.292.d:0 "O modificador de transição expirou, mas o país não aceitou a nova ordem religiosa. O governo pode gastar escassa capacidade de reforma em uma acomodação de emergência, contar com instituições adaptadas ao modelo para uma intervenção mais restrita, ou permitir que o conflito não resolvido radicalize parte da população."
 ve_rel_evt.292.a:0 "Pagar o preço de uma acomodação de emergência."
 ve_rel_evt.292.a.tt:0 "Gaste #N 15#! de Fundo de Piedade e ganhe #P 5#! de Concordata Religiosa."
 ve_rel_evt.292.b:0 "O Estado não tem mais concessões a oferecer."
 ve_rel_evt.292.b.tt:0 "#N 0.25%#! da População do país se torna Radical."
 ve_rel_evt.292.c:0 "Usar as instituições construídas para esta concordata."
 ve_rel_evt.292.c.tt:0 "Gaste #N 5#! de Fundo de Piedade e ganhe #P 2#! de Concordata Religiosa. Requer uma Doutrina adequada ao Modelo Religioso adotado."

 ve_identity_transition_conciliatory_tt:0 "Gaste #N 10#! de Mandato Cultural e ganhe #P 3#! de Coesão Nacional."
 ve_identity_transition_central_tt:0 "Ganhe #P 5#! de Mandato Cultural e perca #N 3#! de Coesão Nacional."
 ve_identity_transition_doctrine_tt:0 "Gaste #N 5#! de Mandato Cultural e ganhe #P 2#! de Coesão Nacional."

 ve_cul_evt.210.t:0 "A Língua Oficial do Estado"
 ve_cul_evt.210.d:0 "O novo pacto nacional exige uma língua comum para tribunais, escolas e serviço público. A uniformidade imediata seria fácil de administrar, mas muitos funcionários experientes e cidadãos ainda não conseguem atingir o padrão proposto."
 ve_cul_evt.210.a:0 "Introduzir a língua por meio de instrução gradual."
 ve_cul_evt.210.b:0 "Emitir uma ordem de língua única."
 ve_cul_evt.210.c:0 "Mobilizar a administração nacionalista."

 ve_cul_evt.211.t:0 "Serviço e Membresia"
 ve_cul_evt.211.d:0 "O serviço militar e o status de veterano estão se tornando provas de pertencimento nacional. As comunidades integradas ao novo pacto exigem tempo para se adaptar, enquanto o centro insiste que o pertencimento deve acarretar uma obrigação uniforme."
 ve_cul_evt.211.a:0 "Conceder isenções transitórias."
 ve_cul_evt.211.b:0 "Aplicar uma única obrigação de serviço."
 ve_cul_evt.211.c:0 "Criar um registro de serviço universal."

 ve_cul_evt.220.t:0 "O Registro de Cidadania Igualitária"
 ve_cul_evt.220.d:0 "Antigas categorias étnicas e religiosas permanecem embutidas nos registros públicos. Sua remoção imediata proclamaria a igualdade de cidadania, mas os gabinetes locais alertam que uma conversão apressada pode apagar Reivindicações e perturbar o acesso aos serviços."
 ve_cul_evt.220.a:0 "Introduzir gradualmente um registro cívico comum."
 ve_cul_evt.220.b:0 "Remover as categorias antigas imediatamente."
 ve_cul_evt.220.c:0 "Colocar a conversão sob uma comissão de reforma."

 ve_cul_evt.221.t:0 "Escola Comum, Serviço Comum"
 ve_cul_evt.221.d:0 "A igualdade de acesso existe na lei, mas as escolas e repartições públicas carecem do pessoal necessário para garanti-la. O governo deve escolher entre o investimento paciente, um padrão central aplicável e uma rede nacional de qualificações acadêmicas."
 ve_cul_evt.221.a:0 "Investir em professores e servidores públicos."
 ve_cul_evt.221.b:0 "Impor um padrão central único."
 ve_cul_evt.221.c:0 "Construir uma rede de qualificações acadêmicas."

 ve_cul_evt.230.t:0 "O Conselho de Povos Constituintes"
 ve_cul_evt.230.d:0 "As comunidades nomeadas no pacto composto exigem voz em sua administração. Negociações abertas podem produzir legitimidade, enquanto uma cota fixa desenhada na capital promete um acordo mais rápido e previsível."
 ve_cul_evt.230.a:0 "Abrir negociações representativas."
 ve_cul_evt.230.b:0 "Impor a cota fixa da capital."
 ve_cul_evt.230.c:0 "Negociar um compromisso parlamentar."

 ve_cul_evt.231.t:0 "Administração em Camadas"
 ve_cul_evt.231.d:0 "A autoridade local e os padrões centrais agora se sobrepõem no estado composto. Sem um protocolo claro, cada repartição negociará os limites novamente; com uma cadeia de comando rígida demais, o pacto pode perder seu sentido."
 ve_cul_evt.231.a:0 "Negociar um protocolo de competências."
 ve_cul_evt.231.b:0 "Estabelecer uma cadeia de comando central."
 ve_cul_evt.231.c:0 "Criar um registro burocrático compartilhado."

 ve_cul_evt.290.t:0 "Um Novo Pacto Nacional"
 ve_cul_evt.290.d:0 "A reação diminuiu e a nova definição de pertença nacional criou raízes. O governo pode preservar as lições administrativas como Mandato Cultural ou usar o momento para reforçar a confiança no pacto."
 ve_cul_evt.290.a:0 "Leva a experiência para a arte de governar futura."
 ve_cul_evt.290.a.tt:0 "Ganhe #P 10#! Mandato Cultural."
 ve_cul_evt.290.b:0 "Celebrar o pacto por todo o país."
 ve_cul_evt.290.b.tt:0 "Ganhe #P 3#! Coesão Nacional."

 ve_cul_evt.291.t:0 "Um Pacto Frágil"
 ve_cul_evt.291.d:0 "A transição formal terminou, mas a nova identidade nacional permanece aceita de forma desigual. O governo pode permitir que o compromisso amadureça, gastar mandato limitado em outra acomodação ou reforçá-lo por meio de instituições adequadas ao modelo adotado."
 ve_cul_evt.291.a:0 "Deixar que o compromisso encontre seu próprio saldo."
 ve_cul_evt.291.a.tt:0 "A transição termina sem um efeito mecânico adicional."
 ve_cul_evt.291.b:0 "Financiar uma acomodação final."
 ve_cul_evt.291.b.tt:0 "Gaste #N 10#! Mandato Cultural e ganhe #P 3#! Coesão Nacional."
 ve_cul_evt.291.c:0 "Confiar o pacto a instituições adaptadas ao modelo."
 ve_cul_evt.291.c.tt:0 "Gaste #N 5#! Mandato Cultural e ganhe #P 2#! Coesão Nacional. Requer uma Doutrina adequada ao Modelo de Identidade adotado."

 ve_cul_evt.292.t:0 "Uma Crise do Pacto Nacional"
 ve_cul_evt.292.d:0 "A reação da transição expirou, mas a nova definição de pertença falhou em comandar ampla lealdade. O governo pode gastar o escasso mandato em uma acomodação de emergência, confiar em instituições adaptadas ao modelo para uma intervenção mais restrita ou aceitar uma onda de radicalização."
 ve_cul_evt.292.a:0 "Pagar por uma acomodação de emergência."
 ve_cul_evt.292.a.tt:0 "Gaste #N 15#! Mandato Cultural e ganhe #P 5#! Coesão Nacional."
 ve_cul_evt.292.b:0 "O Estado fará cumprir o pacto tal como escrito."
 ve_cul_evt.292.b.tt:0 "#N 0.25%#! da População do país torna-se Radical."
 ve_cul_evt.292.c:0 "Usar as instituições construídas para esta identidade."
 ve_cul_evt.292.c.tt:0 "Gaste #N 5#! Mandato Cultural e ganhe #P 2#! Coesão Nacional. Requer uma Doutrina adequada ao Modelo de Identidade adotado."
