 ve_targeted_religious_project_state_action_tt:0 "#header Projeto Religioso Direcionado#!\nInicia o projeto associado ao Modelo Religioso atual contra a composição religiosa deste estado. A Separação Total não pode iniciá-lo. Abra o painel de Religião para custos exatos, regras de progresso e resultados."
