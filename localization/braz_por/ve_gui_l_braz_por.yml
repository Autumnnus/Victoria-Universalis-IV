 ve_keep_project_button:0 "Manter Projeto"
 ve_targeted_religious_project_state_requirements_tt:0 "O estado deve ser de nossa propriedade, e nossa própria religião não deve já deter #Y 90%#! ou mais de sua população. O Estado Confessional, a Liberdade de Consciência e o Ateísmo de Estado podem iniciar um cada; a Separação Total não pode. O custo de Fundo de Piedade do Modelo Religioso ativo também deve ser atendido."

