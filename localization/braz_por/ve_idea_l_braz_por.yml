 ve_national_ideas:0 " Doutrinas Nacionais"
 ve_idea_points:0 "#tooltippable_name Visão Nacional"
 ve_national_insight_tt:0 "#header Visão Nacional#!\nReserva: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nEste mês: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nStatus de compra: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title O que faz#!\nVisão Nacional compra doutrinas individuais dentro de um Grupo de Doutrinas adotado. Cada compra ativa avança as Doutrinas Nacionais e contribui para o Investimento em Doutrina atual; alcançar um marco de investimento concede permanentemente artifício de grupo.\n\n#title Por que a renda mensal muda#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nAlfabetização: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nEscolas: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniversidades: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLegitimidade: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nIntelligentsia: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nDívida, instabilidade e implementação: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Pressão de reserva#!\nMultiplicador de renda: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nA renda é reduzida pela metade em #Y 750#!, cai para um quarto em #Y 900#! e cessa em #Y 1000#!. Gastar antes do limite de reserva evita o desperdício de renda."
 ve_national_insight_implementation_strain:0 "Sobrecarga de Implementação de Doutrina"
 ve_national_insight_implementation_strain_desc:0 "A administração está adaptando instituições e procedimentos a uma doutrina recém-adotada. Nenhuma outra doutrina do grupo pode ser adotada até que este ciclo de implementação de 24 meses termine."
 ve_total_ideas:0 "Grupos de Doutrinas"
 ve_traditions:0 "#tooltippable_concept Tradições: "
 ve_bonus:0 "#tooltippable_concept Bônus: "
 ve_ambition:0 "Ambição"
 ve_ambition_tooltip:0 "#Y Ambição#!\n#P Recompensa de ápice permanente#!\nDesbloqueia automaticamente quando todas as sete doutrinas neste grupo forem adotadas."
 ve_idea_cancel_warning:0 "#header Cancelar [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Todos os modificadores de doutrina ativos neste grupo serão removidos.#!\n#N O modificador de Ambição dele também será removido caso tenha sido desbloqueado.#!\n\nA Visão Nacional gasta não será reembolsada.\nVisão Nacional devolvida: #Y 0#!\n\n#title Efeitos que serão removidos#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Confirmar: cancelar este grupo de doutrinas.#! Progresso e modificadores são perdidos, a Visão Nacional não é reembolsada."
 ve_idea_cancel_keep_tt:0 "Manter este grupo de doutrinas - não cancelar."
 ve_embrace:0 "Adotar"
 ve_idea_locked:0 "Caminho Fechado"
 ve_idea_locked_tt:0 "#N Este grupo de doutrinas é mutuamente exclusivo com o que você já adotou. Cancele esse grupo para abrir este caminho."
 ve_idea_age_locked:0 "Tecnologia Necessária"
 ve_idea_age_locked_tt:0 "#N Este grupo de doutrinas requer uma tecnologia que ainda não foi pesquisada."
 ve_idea_labour_technology_locked_tt:0 "#N Requer [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Requer [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Requer [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Requer [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Requer [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Requer [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Requer [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Impulsionar Doutrina"
 ve_boost_idea_tt:0 "#header Adote a próxima doutrina#!\nVisão Nacional: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nStatus da compra: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Custo do próximo nível#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nUse o custo correspondente ao próximo nível não preenchido neste grupo.\n\n#title O que acontece quando comprado#!\n#P O próximo modificador neste grupo fica ativo.#!\n#P O progresso do Investimento em Doutrina e da Doutrina Nacional aumenta em 1, cada um.#!\n#N Um ciclo de Implementação de Doutrina de 24 meses começa. Nenhuma outra doutrina do grupo pode ser comprada durante isso.#!\n\n#title Por que o botão pode ser desativado?#!\nA Visão Nacional está abaixo do custo do próximo nível; a Implementação de Doutrina está ativa; o grupo está completo; ou o próximo nível requer uma tecnologia não pesquisada.\n\nCancelar este grupo remove os modificadores de doutrina e o progresso atual. A Visão Nacional gasta nunca é reembolsada, mas uma vaga de grupo já conquistada em um marco nunca é revogada."
