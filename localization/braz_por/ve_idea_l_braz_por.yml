 ve_idea_mass_conscription_technology_locked_tt:0 "#N Requer [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Requer [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Requer [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Impulsionar a ideia"
 ve_boost_idea_tt:0 "#header Adote a próxima ideia#!\nInsight Nacional: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nStatus da compra: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Custo do próximo nível#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nUse o custo correspondente ao próximo nível não preenchido neste grupo.\n\n#title O que acontece quando comprado#!\n#P O próximo modificador neste grupo fica ativo.#!\n#P O progresso do Investimento em Doutrina e da Ideia Nacional aumenta em 1, cada um.#!\n#N Um ciclo de Implementação de Doutrina de 24 meses começa. Nenhuma outra ideia de grupo pode ser comprada durante isso.#!\n\n#title Por que o botão pode ser desativado?#!\nO Insight está abaixo do custo do próximo nível; A Implementação da Doutrina está ativa; o grupo está completo; ou o próximo nível requer uma tecnologia não pesquisada.\n\nCancelar este grupo remove os modificadores de ideia e o progresso atual. O Spent Insight nunca é reembolsado, mas uma vaga de grupo já conquistada em um marco nunca é revogada."
