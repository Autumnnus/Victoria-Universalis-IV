 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Fundo de Piedade/mês#! em Confessional ou Ateísmo de Estado, e #P +1 Mandato Cultural/mês#! em Nação Étnica."
 nationalist_idea_7_tt:0 "#P +1 de progresso de Projeto Religioso/mês#! em Confessional ou Ateísmo de Estado; #P +1 de progresso de Projeto Cultural/mês#! em Nação Étnica; os resultados de Integração religiosa e étnica coercitiva melhoram de #Y 5%#! para #Y 7%#!."
 embrace_idea_tt:0 "#header Capacidade de Grupos de Doutrinas#!\nEspaços usados: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nEspaços livres atuais: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInvestimento em Doutrinas Atual: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! doutrinas ativas adquiridas\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Como funciona a capacidade#!\nCada doutrina de grupo ativa adquirida fornece #P +1#! de Investimento em Doutrinas. Alcançar #Y 4, 8, 13, 19, 26#! ou #Y 34#! adiciona permanentemente um espaço de grupo. Os espaços 5–6 também exigem a Era 2; o espaço 7 exige a Era 3.\n\n#title Adoção e cancelamento#!\nAdotar um grupo não custa Compreensão, mas ocupa um espaço livre. Cancelar libera esse espaço, remove os modificadores do grupo e reduz o Investimento em Doutrinas atual; a Compreensão gasta não é reembolsada. Qualquer espaço de capacidade já obtido permanece permanentemente disponível."
 ve_idea_capacity_player_progress:0 "#title Próximo espaço permanente#!\nEspaço: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgresso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! doutrinas adquiridas\nAinda necessário: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Próximo espaço permanente#!\nEspaço: #Y 5#!\nProgresso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! doutrinas adquiridas\nAinda necessário: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nRequisito de Era: #N Aguardando a Era 2#!"
 ve_idea_capacity_player_age_3:0 "#title Próximo espaço permanente#!\nEspaço: #Y 7#!\nProgresso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! doutrinas adquiridas\nAinda necessário: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nRequisito de Era: #N Aguardando a Era 3#!"
 ve_idea_capacity_player_max:0 "#P Capacidade máxima atingida: todos os 7 espaços de grupo permanentes estão disponíveis.#!"
