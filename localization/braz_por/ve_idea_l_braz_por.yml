 ve_national_insight_tt:0 "#header National Insight#!\nEstoque: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nEste mês: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nStatus de compra: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title O que faz#!\nA National Insight compra ideias individuais dentro de um Grupo de Ideias adotado. Cada compra ativa promove as Idéias Nacionais e aumenta o Investimento Doutrinário atual; atingir um marco de investimento premia permanentemente a capacidade do grupo.\n\n#title Por que a renda mensal muda#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nAlfabetização: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nEscolas: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniversidades: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nAdministração: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLegitimidade: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nInteligência: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nDívida, turbulência e implementação: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Estoque pressão#!\nMultiplicador de renda: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nA renda cai pela metade em #Y 750#!, cai para um quarto em #Y 900#! e para em #Y 1000#!. Gastar antes do limite das ações evita desperdício de renda."
 ve_national_insight_implementation_strain:0 "Tensão de implementação de doutrina"
 ve_national_insight_implementation_strain_desc:0 "A administração está a adaptar instituições e procedimentos a uma doutrina nacional recentemente adoptada. Outra ideia de grupo não pode ser adotada até que este ciclo de implementação de 24 meses termine."
 ve_total_ideas:0 "Grupos de Ideias"
 ve_traditions:0 "#tooltippable_concept Tradições: "
 ve_bonus:0 "#tooltippable_concept Bônus: "
 ve_ambition:0 "Ambição"
 ve_ambition_tooltip:0 "#Y Ambição#!\n#P Recompensa máxima permanente#!\nDesbloqueia automaticamente quando todas as sete ideias deste grupo forem adotadas."
 ve_idea_cancel_warning:0 "#header Cancelar [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Todos os modificadores de ideias ativos neste grupo serão removidos.#!\n#N Seu modificador de Ambição também será removido se tiver sido desbloqueado.#!\n\nNational Insight gasto não é reembolsado.\nNational Insight retornado: #Y 0#!\n\n#title Efeitos que serão removidos#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Confirmar: cancelar esta ideia grupo.#! O progresso e os modificadores são perdidos, o National Insight não é reembolsado."
 ve_idea_cancel_keep_tt:0 "Mantenha este grupo de ideias - não cancele."
 ve_embrace:0 "Abrace"
 ve_idea_locked:0 "Caminho fechado"
 ve_idea_locked_tt:0 "#N Este grupo de ideias é mutuamente exclusivo daquele que você já abraçou. Cancele esse grupo para abrir este caminho."
 ve_idea_age_locked:0 "Tecnologia necessária"
 ve_idea_age_locked_tt:0 "#N Este grupo de ideias requer uma tecnologia que ainda não foi pesquisada."
 ve_idea_labour_technology_locked_tt:0 "#N Requer [GetTechnology('labor_movement').GetName].#!"
