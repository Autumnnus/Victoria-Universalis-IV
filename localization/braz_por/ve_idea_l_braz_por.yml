 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Reforma Piedade/mês#! in Ateísmo Confessional ou de Estado, e #P +1 Mandato Cultural/mês#! em Nação Étnica."
 nationalist_idea_7_tt:0 "#P +1 Progresso de Projeto Religioso/mês#! em Ateísmo Confessional ou de Estado; #P +1 Progresso de Projeto Cultural/mês#! em Nação Étnica; os resultados coercivos da Integração Religiosa e Étnica melhoram de #Y 5%#! para #Y 7%#!."
 embrace_idea_tt:0 "#header Capacidade do Grupo de Ideias#!\nSlots usados: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nVagas gratuitas agora: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInvestimento atual em Doutrina: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! ideias compradas ativas\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Como funciona a capacidade#!\nCada ideia de grupo comprada ativa fornece suprimentos #P +1#! Investimento em Doutrina. Alcançando #Y 4, 8, 13, 19, 26#! ou #Y 34#! adiciona permanentemente um slot de grupo. Os slots 5–6 também exigem Idade 2; o slot 7 requer 3 anos.\n\n#title Abraçar e cancelar#!\nAbraçar um grupo não custa nenhum Insight, mas ocupa um espaço livre. O cancelamento libera esse espaço, remove os modificadores do grupo e reduz o Investimento em Doutrina atual; o Insight gasto não é reembolsado. Qualquer slot de capacidade já ganho permanece permanentemente disponível."
 ve_idea_capacity_player_progress:0 "#title Próximo slot permanente#!\nSlot: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgresso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! ideias compradas\nAinda necessário: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Próximo slot permanente#!\nSlot: #Y 5#!\nProgresso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! ideias compradas\nAinda necessário: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nRequisito de idade: #N Aguardando idade 2#!"
 ve_idea_capacity_player_age_3:0 "#title Próximo slot permanente#!\nSlot: #Y 7#!\nProgresso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! ideias compradas\nAinda necessário: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nRequisito de idade: #N Aguardando 3 anos#!"
 ve_idea_capacity_player_max:0 "#P Capacidade máxima atingida: todos os 7 slots de grupo permanentes estão disponíveis.#!"
