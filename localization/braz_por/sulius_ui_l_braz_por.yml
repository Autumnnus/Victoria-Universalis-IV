l_braz_por:
 SULIUS_LEGITIMACY_LEVEL_ACTIVE_TOOLTIP:0 "#tooltip_header [concept_legitimacy] \n[LegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\n$LEGITIMACY_LEVEL_BOUNDS_DESC$\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\nEfeitos:#indent_newline:2 \n[LegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\nIsso se deve a:#indent_newline:2 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 SULIUS_CAPITAL_MONEY:0 "#tooltip_header [concept_money]#!\nBalanço: #variable @money![AccessPlayer.PredictWeeklyBalance|D=+]#![GetPlayer.GetPowerDeltaIcon('money')]\n[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.GetPrincipal, '(CFixedPoint)0'), 'CREDIT_DESC', 'GOLD_RESERVES_DESC')]\nLimite de Reservas de Ouro: @money![GetPlayer.GetGoldReserveLimit|Dv]#!#![SelectLocalization(GetMetaPlayer.GetPlayedOrObservedCountry.IsValid, 'CAPITAL_MONEY_DELAYED', 'OBSERVER_NO_COUNTRY_SELECTED') ]"
 
 SULIUS_RESEARCH:0 "#tooltip_header [concept_technology]#!\n[SelectLocalization( GetPlayer.GetCurrentlyResearchedTechnology.IsValid, 'SULIUS_RESEARCHING', 'SULIUS_NOT_RESEARCHING' )]\n$TOOLTIP_DELIMITER$\n#V Progresso de Tecnologia#!\n#help De [concept_innovation]: @innovation![GetPlayer.GetWeeklyInnovation|+0]\nDe [concept_technology_spread]: [GetPlayer.GetWeeklyTechnologySpreadForTechDesc(GetPlayer.GetCurrentlyResearchedTechnology.Self)]\n$TOOLTIP_DELIMITER$\n#V [concept_innovation]#!\nGeramos #v @innovation![GetPlayer.GetWeeklyInnovation|+2]#! [concept_innovation] a cada semana:\n[GetPlayer.GetWeeklyInnovationDesc]\n\nUm máximo de @innovation![GetPlayer.GetWeeklyMaxInnovation|v2] [concept_innovation] pode ser investido na pesquisa ativa a cada semana:\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\nQualquer [concept_innovation] não gasta devido a limites de investimento ou falta de pesquisa ativa aumentará a taxa de [concept_technology_spread] para o nosso país"
 SULIUS_RESEARCHING:0 "[GetPlayer.GetName] está pesquisando atualmente [GetPlayer.GetCurrentlyResearchedTechnology.GetName]#!\nProgresso: #v @innovation! [GetPlayer.GetCurrentlyResearchedTechnology.GetProgress(GetPlayer.Self)|D]#! / #maximum [GetPlayer.GetCurrentlyResearchedTechnology.GetCost(GetPlayer.Self)|D]#! ([GetPlayer.GetCurrentlyResearchedTechnology.GetTimeLeftDesc( GetPlayer.Self )] restante)"
 SULIUS_NOT_RESEARCHING:0 "[GetPlayer.GetName] não está pesquisando nada no momento."
