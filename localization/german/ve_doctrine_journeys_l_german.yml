l_german:
 ve_je_doctrine_journey_industrialist:0 "Standardisierung des Fabriksystems"
 ve_je_doctrine_journey_industrialist_reason:0 "Die industrielle Lehre hat sich über einzelne Fabriken hinaus ausgebreitet. Hersteller, Inspektoren und Administratoren müssen nun die lokale Praxis in ein dauerhaftes nationales System umwandeln."
 ve_je_doctrine_journey_industrialist_status_both:0 "Fortschritt: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nVerbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] Monate#!\nMonatlicher Fortschritt: #P +2#!\n\n#P Fertigungsmaßstab erfüllt#!: mindestens #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! Fertigungsgebäudestufen.\n#P Stabile Verwaltung erfüllt#!: nicht negative Bürokratie, kein drohender Mangel und weniger als 15 % Länderunruhen.\n\nErfolgsbelohnung: #P +40 National Insight#!. Wenn der Fortschritt innerhalb von 60 Monaten nicht 60 erreicht, endet die Reise ohne Belohnung."
