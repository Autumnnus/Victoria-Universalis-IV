 ve_je_doctrine_journey_academic:0 "Eine Republik der Gelehrten"
 ve_je_doctrine_journey_academic_reason:0 "Universitäten und gelehrte Gesellschaften sind bereit, eine nationale Forschungsgemeinschaft zu werden, sofern ihre Institutionen und sozialen Stiftungen dies aufrechterhalten können."
