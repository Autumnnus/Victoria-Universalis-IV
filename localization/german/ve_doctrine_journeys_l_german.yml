 ve_je_doctrine_journey_professional_army:0 "Reform des Generalstabs"
 ve_je_doctrine_journey_professional_army_reason:0 "Ein professionelles Offizierskorps erfordert mehr als Kasernen und Patente. Ausbildung, Planung und Mobilisierung müssen in einem dauerhaften Stabssystem organisiert werden."
