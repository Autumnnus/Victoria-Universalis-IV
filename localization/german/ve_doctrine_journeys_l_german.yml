 ve_doctrine_journey_general_staff_reform_mdf:0 "Institutioneller Generalstab"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Stabsakademien, Mobilisierungstabellen und einheitliche Ausbildungsstandards sind zu einem dauerhaften Bestandteil der Streitkräfte geworden."

 ve_doctrine_journey.1.t:0 "Standardisierung des Fabriksystems"
 ve_doctrine_journey.1.d:0 "Industrieverbände schlagen eine nationale Anstrengung vor, um Maschinen, Inspektionen und Fertigungspraktiken aneinander anzugleichen. Das Vorhaben würde fünf Jahre dauern und einen anhaltenden industriellen Maßstab sowie administrative Stabilität erfordern."
 ve_doctrine_journey.1.a:0 "Beginnt die Standardisierungsbemühungen."
 ve_doctrine_journey.1.b:0 "Überdenkt den Vorschlag in fünf Jahren."
 ve_doctrine_journey.1.c:0 "Unsere Fabriken benötigen keine nationale Doktrin."
 ve_doctrine_journey.2.t:0 "Gelehrtenrepublik"
 ve_doctrine_journey.2.d:0 "Rektoren und gelehrte Gesellschaften schlagen ein fünfjähriges Unterfangen vor, um Universitäten zu einer dauerhaften nationalen Forschungsgemeinschaft zu verbinden. Dessen Erfolg hinge sowohl von der akademischen Kapazität als auch von der Ausbreitung der Alphabetisierung ab."
 ve_doctrine_journey.2.a:0 "Sponsert die Gelehrtenrepublik."
 ve_doctrine_journey.2.b:0 "Kehrt in fünf Jahren zu dem Vorschlag zurück."
 ve_doctrine_journey.2.c:0 "Wissen sollte lokal organisiert bleiben."
 ve_doctrine_journey.3.t:0 "Reform des Generalstabs"
 ve_doctrine_journey.3.d:0 "Höhere Offiziere schlagen eine fünfjährige Reform der Ausbildung, Planung und Mobilisierung vor. Der Generalstab müsste beweisen, dass die professionelle Doktrin über einen Kreis bevorzugter Befehlshaber hinaus Bestand haben kann."
 ve_doctrine_journey.3.a:0 "Beauftragt die Reform des Generalstabs."
 ve_doctrine_journey.3.b:0 "Überprüft die Pläne in fünf Jahren erneut."
 ve_doctrine_journey.3.c:0 "Das bestehende Befehlssystem ist ausreichend."

 ve_doctrine_journey_start_tt:0 "Startet diesen fünfjährigen Doktrinen-Weg. Es kann immer nur ein Doktrinen-Weg gleichzeitig aktiv sein."
 ve_doctrine_journey_defer_tt:0 "Schiebt das Angebot dieser Gruppe für #Y 5 Jahre#! auf. Es kann danach erneut angeboten werden."
 ve_doctrine_journey_decline_tt:0 "Lehnt den Doktrinen-Weg dieser Gruppe dauerhaft ab."

 ve_doctrine_journey.10.t:0 "Maße und Toleranzen"
 ve_doctrine_journey.10.d:0 "Fabriken verwenden inkompatible Maße, Passungen und Toleranzen. Ingenieure drängen den Staat dazu, einen einheitlichen Katalog vorzugeben, während provinzielle Hersteller warnen, dass starre Normen nützliche lokale Praktiken unterbinden könnten."
 ve_doctrine_journey.10.a:0 "Einen nationalen Normenkatalog finanzieren."
 ve_doctrine_journey.10.a.tt:0 "Kostet #N 15#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.10.b:0 "Kompatible regionale Normen zulassen."
 ve_doctrine_journey.10.b.tt:0 "Die Reise wird ohne unmittelbare Änderung von Ressourcen oder Fortschritt fortgesetzt."
 ve_doctrine_journey.10.c:0 "Die Bauämter zur Koordinierung der Einführung einsetzen."
 ve_doctrine_journey.10.c.tt:0 "Erfordert Industrielle-Doktrin V.\nKostet #N 10#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.11.t:0 "Die Nationale Inspektion"
 ve_doctrine_journey.11.d:0 "Die ersten gemeinsamen Normen müssen nun durchgesetzt werden. Beamte schlagen eine zentrale Inspektion vor, Hersteller bevorzugen Eigenzertifizierung und erfahrene Industrieplaner plädieren für die Prüfung beider."
 ve_doctrine_journey.11.a:0 "Eine zentrale Industrieinspektion einrichten."
 ve_doctrine_journey.11.a.tt:0 "Kostet #N 15#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.11.b:0 "Eigenzertifizierung der Industrie anerkennen."
 ve_doctrine_journey.11.b.tt:0 "Die Reise wird ohne unmittelbare Änderung von Ressourcen oder Fortschritt fortgesetzt."
 ve_doctrine_journey.11.c:0 "Inspektoren und Hersteller über ein einheitliches System prüfen."
 ve_doctrine_journey.11.c.tt:0 "Erfordert Industrielle-Doktrin VII.\nKostet #N 10#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."

 ve_doctrine_journey.20.t:0 "Offene Lehrstühle"
 ve_doctrine_journey.20.d:0 "Universitäten sind uneins darüber, ob neue Lehrstühle lokalen Fakultäten, nationalen Prioritäten oder einem öffentlichen Lehrauftrag unterstehen sollen. Die ersten Berufungen werden bestimmen, wie frei das Gelehrtennetzwerk Personen und Ideen austauscht."
 ve_doctrine_journey.20.a:0 "Ein koordiniertes nationales Lehrstuhlprogramm finanzieren."
 ve_doctrine_journey.20.a.tt:0 "Kostet #N 15#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.20.b:0 "Jede Fakultät ihre eigenen Lehrstühle definieren lassen."
 ve_doctrine_journey.20.b.tt:0 "Die Reise wird ohne unmittelbare Änderung von Ressourcen oder Fortschritt fortgesetzt."
 ve_doctrine_journey.20.c:0 "Die Lehrstühle an ein öffentliches Vortragsnetzwerk knüpfen."
 ve_doctrine_journey.20.c.tt:0 "Erfordert Akademische Doktrin V.\nKostet #N 10#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.21.t:0 "Eine Republik der Gutachter"
 ve_doctrine_journey.21.d:0 "Forschung bewegt sich heute schneller zwischen Institutionen, als alte Gönnerschaft sie beurteilen kann. Gelehrte schlagen nationale Begutachtung durch Fachkollegen vor, während etablierte Akademien selektive Einladung und fachliche Unabhängigkeit verteidigen."
 ve_doctrine_journey.21.a:0 "Einen nationalen Begutachtungsdienst finanzieren."
 ve_doctrine_journey.21.a.tt:0 "Kostet #N 15#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.21.b:0 "Die Begutachtung den gelehrten Gesellschaften überlassen."
 ve_doctrine_journey.21.b.tt:0 "Die Reise wird ohne unmittelbare Änderung von Ressourcen oder Fortschritt fortgesetzt."
 ve_doctrine_journey.21.c:0 "Fächerübergreifende Begutachtungsräte einberufen."
 ve_doctrine_journey.21.c.tt:0 "Erfordert Akademische Doktrin VII.\nKostet #N 10#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."

 ve_doctrine_journey.30.t:0 "Die Kriegsakademie"
 ve_doctrine_journey.30.d:0 "Die neue Kriegsakademie muss entscheiden, was einen Offizier für das Kommando befähigt. Reformer fordern Prüfungen und gemeinsamen Unterricht, während etablierte Befehlshaber Dienstalter und im Felddienst erworbenes Urteilsvermögen verteidigen."
 ve_doctrine_journey.30.a:0 "Nationale Prüfungen und einen gemeinsamen Lehrplan finanzieren."
 ve_doctrine_journey.30.a.tt:0 "Kostet #N 15#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.30.b:0 "Dienstalter mit den Empfehlungen der Akademie ausgleichen."
 ve_doctrine_journey.30.b.tt:0 "Die Reise wird ohne unmittelbare Änderung von Ressourcen oder Fortschritt fortgesetzt."
 ve_doctrine_journey.30.c:0 "Feldoffiziere durch die Klassenzimmer der Akademie rotieren lassen."
 ve_doctrine_journey.30.c.tt:0 "Erfordert Berufsheer-Doktrin V.\nKostet #N 10#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.31.t:0 "Die Mobilisierungstabellen"
 ve_doctrine_journey.31.d:0 "Planer haben konkurrierende Zeitpläne für Männer, Vorräte und Schienenverkehr erstellt. Eine einzige nationale Tabelle verspricht Koordinierung, doch Regionalkommandos warnen, starre Zeitpläne würden die lokale Kapazität ignorieren."
 ve_doctrine_journey.31.a:0 "Ein zentrales Mobilisierungsbüro finanzieren."
 ve_doctrine_journey.31.a.tt:0 "Verbraucht #N 15#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.31.b:0 "Regionale Kommandos kompatible Zeitpläne aufstellen lassen."
 ve_doctrine_journey.31.b.tt:0 "Die Reise wird ohne unmittelbare Änderung von Ressourcen oder Fortschritt fortgesetzt."
 ve_doctrine_journey.31.c:0 "Eisenbahn-, Depot- und Befehlsplanung eingliedern."
 ve_doctrine_journey.31.c.tt:0 "Erfordert Berufsheer-Doktrin VII.\nVerbraucht #N 10#! Nationaleinsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
