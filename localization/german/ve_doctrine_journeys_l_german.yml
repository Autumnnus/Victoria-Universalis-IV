 ve_doctrine_journey_general_staff_reform_mdf:0 "Institutioneller Generalstab"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Stabsschulen, Mobilisierungstische und gemeinsame Ausbildungsstandards sind zu einem dauerhaften Bestandteil der Streitkräfte geworden."

 ve_doctrine_journey.1.t:0 "Standardisierung des Fabriksystems"
 ve_doctrine_journey.1.d:0 "Industrieverbände schlagen eine landesweite Anstrengung zur Angleichung von Maschinen, Inspektionen und Herstellungspraktiken vor. Die Unternehmung würde fünf Jahre dauern und nachhaltige industrielle Größe und Verwaltungsstabilität erfordern."
 ve_doctrine_journey.1.a:0 "Beginn der Standardisierungsbemühungen."
 ve_doctrine_journey.1.b:0 "Überprüfung des Vorschlags in fünf Jahren."
 ve_doctrine_journey.1.c:0 "Unsere Fabriken brauchen keine nationale Doktrin."
 ve_doctrine_journey.2.t:0 "Eine Republik der Gelehrten"
 ve_doctrine_journey.2.d:0 "Rektoren und Gelehrtengesellschaften schlagen eine fünfjährige Anstrengung vor, um Universitäten zu einer dauerhaften nationalen Forschungsgemeinschaft zu verbinden. Sein Erfolg würde sowohl von der akademischen Kapazität als auch von der Verbreitung der Alphabetisierung abhängen."
 ve_doctrine_journey.2.a:0 "Sponsoren Sie die Republik der Gelehrten."
 ve_doctrine_journey.2.b:0 "Rückkehr zum Vorschlag in fünf Jahren."
 ve_doctrine_journey.2.c:0 "Das Lernen sollte lokal organisiert bleiben."
 ve_doctrine_journey.3.t:0 "Reform des Generalstabes"
 ve_doctrine_journey.3.d:0 "Hochrangige Offiziere schlagen eine fünfjährige Reform der Ausbildung, Planung und Mobilisierung vor. Der Generalstab müsste beweisen, dass die Berufsdoktrin über den Kreis bevorzugter Kommandeure hinaus Bestand haben kann."
 ve_doctrine_journey.3.a:0 "Beauftragen Sie die Generalstabsreform."
 ve_doctrine_journey.3.b:0 "Überprüfen Sie die Pläne in fünf Jahren noch einmal."
 ve_doctrine_journey.3.c:0 "Das vorhandene Befehlssystem ist ausreichend."

 ve_doctrine_journey_start_tt:0 "Beginnt diese fünfjährige Lehrreise. Es kann jeweils nur eine Doctrine Journey aktiv sein."
 ve_doctrine_journey_defer_tt:0 "Schiebt das Angebot dieser Gruppe um #Y 5 Jahre#!. Es kann später erneut angeboten werden."
 ve_doctrine_journey_decline_tt:0 "Lehnt die Doctrine Journey dieser Gruppe dauerhaft ab."

 ve_doctrine_journey.10.t:0 "Maße und Toleranzen"
 ve_doctrine_journey.10.d:0 "Fabriken verwenden inkompatible Messgeräte, Anschlüsse und Toleranzen. Ingenieure fordern den Staat auf, einen einheitlichen Katalog einzuführen, während die Hersteller in den Provinzen warnen, dass ein starrer Standard nützliche örtliche Verfahren zum Erliegen bringen könnte."
 ve_doctrine_journey.10.a:0 "Finanzieren Sie einen nationalen Normenkatalog."
 ve_doctrine_journey.10.a.tt:0 "Geben Sie #N 15 aus#! Nationale Einsicht.\nDer Reisefortschritt erhöht sich um #P 4#!."
 ve_doctrine_journey.10.b:0 "Ermöglicht kompatible regionale Standards."
 ve_doctrine_journey.10.b.tt:0 "Die Reise wird ohne unmittelbare Ressource oder Fortschrittsänderung fortgesetzt."
 ve_doctrine_journey.10.c:0 "Verwenden Sie die Baubüros, um die Einführung zu koordinieren."
 ve_doctrine_journey.10.c.tt:0 "Erfordert Industrialist Idea V.\nGeben Sie #N 10#! Nationale Einsicht aus.\nDer Reisefortschritt erhöht sich um #P 4#!."
 ve_doctrine_journey.11.t:0 "Die nationale Aufsichtsbehörde"
 ve_doctrine_journey.11.d:0 "Die ersten gemeinsamen Standards müssen nun durchgesetzt werden. Beamte schlagen eine zentrale Inspektion vor, Hersteller bevorzugen eine Selbstzertifizierung und erfahrene Industrieplaner plädieren für die Prüfung beider."
 ve_doctrine_journey.11.a:0 "Einrichtung einer zentralen Industrieinspektion."
 ve_doctrine_journey.11.a.tt:0 "Ausgaben #N 15#! National Insight.\nDer Journey-Fortschritt erhöht sich um #P 4#!."
 ve_doctrine_journey.11.b:0 "Erkennen Sie die Selbstzertifizierung der Branche an."
 ve_doctrine_journey.11.b.tt:0 "Die Journey wird ohne unmittelbare Ressourcen- oder Fortschrittsänderung fortgesetzt."
 ve_doctrine_journey.11.c:0 "Auditinspektoren und Hersteller über ein System."
 ve_doctrine_journey.11.c.tt:0 "Erfordert Industrialist Idea VII.\nAusgeben #N 10#! Nationaler Einblick.\nDer Reisefortschritt erhöht sich um #P 4#!."

 ve_doctrine_journey.20.t:0 "Offene Stühle"
 ve_doctrine_journey.20.d:0 "Die Universitäten sind sich nicht einig darüber, ob neue Lehrstühle lokalen Fakultäten, nationalen Prioritäten oder einem öffentlichen Lehrauftrag entsprechen sollen. Die ersten Ernennungen werden festlegen, wie frei das wissenschaftliche Netzwerk Menschen und Ideen austauscht."
 ve_doctrine_journey.20.a:0 "Finanzieren Sie ein koordiniertes nationales Lehrstuhlprogramm."
 ve_doctrine_journey.20.a.tt:0 "Gib #N 15#! National Insight aus.\nDer Reisefortschritt erhöht sich um #P 4#!."
 ve_doctrine_journey.20.b:0 "Lassen Sie jede Fakultät ihre eigenen Lehrstühle definieren."
 ve_doctrine_journey.20.b.tt:0 "Die Reise geht ohne unmittelbare Ressourcen- oder Fortschrittsänderung weiter."
 ve_doctrine_journey.20.c:0 "Binden Sie die Lehrstühle an ein öffentliches Vortragsnetzwerk."
 ve_doctrine_journey.20.c.tt:0 "Erfordert Akademische Idee V.\nGeben Sie #N 10#! National Insight aus.\nDer Reisefortschritt erhöht sich um #P 4#!."
 ve_doctrine_journey.21.t:0 "Eine Republik der Schiedsrichter"
 ve_doctrine_journey.21.d:0 "Die Forschung bewegt sich mittlerweile schneller zwischen den Institutionen, als die alte Schirmherrschaft es beurteilen kann. Wissenschaftler schlagen eine nationale Peer-Review vor, während etablierte Akademien eine selektive Einladung und disziplinäre Unabhängigkeit verteidigen."
 ve_doctrine_journey.21.a:0 "Finanzieren Sie einen nationalen Peer-Review-Dienst."
 ve_doctrine_journey.21.a.tt:0 "Geben Sie #N 15 aus#! Nationale Einsicht.\nDer Fortschritt der Reise erhöht sich um #P 4#!."
 ve_doctrine_journey.21.b:0 "Überlassen Sie die Überprüfung den gelehrten Gesellschaften."
 ve_doctrine_journey.21.b.tt:0 "Die Reise geht ohne unmittelbare Ressourcen- oder Fortschrittsänderung weiter."
 ve_doctrine_journey.21.c:0 "Berufen Sie interdisziplinäre Überprüfungsräte."
 ve_doctrine_journey.21.c.tt:0 "Erfordert akademische Idee VII.\nAusgeben #N 10#! Nationaler Einblick.\nDer Reisefortschritt erhöht sich um #P 4#!."

 ve_doctrine_journey.30.t:0 "Die Stabsakademie"
 ve_doctrine_journey.30.d:0 "Das neue Stabskollegium muss entscheiden, was einen Offizier für das Kommando geeignet macht. Reformatoren fordern Prüfungen und gemeinsame Ausbildung, während etablierte Kommandeure das Dienstalter und das im Felddienst erworbene Urteilsvermögen verteidigen."
 ve_doctrine_journey.30.a:0 "Finanzierung nationaler Prüfungen und eines gemeinsamen Lehrplans."
 ve_doctrine_journey.30.a.tt:0 "Gib #N 15#! National Insight aus.\nDer Reisefortschritt erhöht sich um #P 4#!."
 ve_doctrine_journey.30.b:0 "Vergleichen Sie das Dienstalter mit den Empfehlungen des Colleges."
 ve_doctrine_journey.30.b.tt:0 "Die Reise geht ohne unmittelbare Ressourcen- oder Fortschrittsänderung weiter."
 ve_doctrine_journey.30.c:0 "Rotieren Sie Außendienstmitarbeiter durch die Klassenzimmer des Personals."
 ve_doctrine_journey.30.c.tt:0 "Erfordert Professional Army Idea V.\nAusgeben #N 10#! National Insight.\nDer Reisefortschritt steigt um #P 4#!."
 ve_doctrine_journey.31.t:0 "Die Mobilisierungstabellen"
 ve_doctrine_journey.31.d:0 "Planer haben konkurrierende Fahrpläne für Männer, Vorräte und Schienentransport erstellt. Ein einziger nationaler Tisch verspricht Koordination, aber regionale Kommandos warnen davor, dass starre Zeitpläne die lokalen Kapazitäten außer Acht lassen."
 ve_doctrine_journey.31.a:0 "Finanzieren Sie ein zentrales Mobilisierungsbüro."
 ve_doctrine_journey.31.a.tt:0 "Ausgaben #N 15#! National Insight.\nReisefortschritt erhöht sich um #P 4#!."
 ve_doctrine_journey.31.b:0 "Lassen Sie regionale Kommandos kompatible Zeitpläne pflegen."
 ve_doctrine_journey.31.b.tt:0 "Die Reise geht ohne unmittelbare Ressourcen- oder Fortschrittsänderung weiter."
 ve_doctrine_journey.31.c:0 "Integrieren Sie Eisenbahn-, Depot- und Kommandoplanung."
 ve_doctrine_journey.31.c.tt:0 "Erfordert Professional Army Idea VII.\nGeben Sie #N 10#! National Insight aus.\nDer Reisefortschritt erhöht sich um #P 4#!."
