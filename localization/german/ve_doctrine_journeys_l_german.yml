 ve_je_doctrine_journey_professional_army:0 "Reform des Generalstabs"
 ve_je_doctrine_journey_professional_army_reason:0 "Ein professionelles Offizierskorps erfordert mehr als Kasernen und Dienststellen. Schulung, Planung und Mobilisierung müssen in einem dauerhaften Personalsystem organisiert werden."
 ve_je_doctrine_journey_professional_army_status_both:0 "Fortschritt: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nVerbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] Monate#!\nMonatlicher Fortschritt: #P +2#!\n\n#P Kasernenskala erreicht#!: mindestens #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! Kasernengebäudeebene.\n#P Berufsdoktrin erfüllt#!: Professionelles Heeresrecht oder Generalstabstechnologie.\n\nErfolgsbelohnung: #Y Institutioneller Generalstab#! (+7,5 % Ausbildungsquote, 36 Monate). Wenn der Fortschritt innerhalb von 60 Monaten nicht 60 erreicht, endet die Reise ohne Belohnung."
 ve_je_doctrine_journey_professional_army_status_core:0 "Fortschritt: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nVerbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] Monate#!\nMonatlicher Fortschritt: #P +1#!\n\n#P Kasernenskala erfüllt#!: mindestens #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! Stufen des Kasernengebäudes.\n#N Berufsdoktrin nicht erfüllt#!: erfordert das Berufsheergesetz oder Generalstabstechnologie.\n\nErfolgsbelohnung: #Y Institutioneller Generalstab#! (+7,5 % Ausbildungsrate, 36 Monate). Wenn der Fortschritt innerhalb von 60 Monaten nicht 60 erreicht, endet die Reise ohne Belohnung."
 ve_je_doctrine_journey_professional_army_status_support:0 "Fortschritt: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nVerbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] Monate#!\nMonatlicher Fortschritt: #P +1#!\n\n#N Kasernenskala nicht erfüllt#!: erfordert mindestens #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! Kasernengebäudestufen.\n#P Berufsdoktrin erfüllt#!: Professionelles Heeresrecht oder Generalstabstechnologie.\n\nErfolgsbelohnung: #Y Institutioneller Generalstab#! (+7,5 % Ausbildungsrate, 36 Monate). Wenn der Fortschritt innerhalb von 60 Monaten nicht 60 erreicht, endet die Reise ohne Belohnung."
