l_german:
 # Willkommensereignis von Victoria Universalis IV 2.0 - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Diese Kampagne läuft auf dem neu gebauten Victoria Universalis IV. Kurz gefasst:\n\n#Y Religion#! - Euer Kirche-und-Staat-Gesetz bestimmt nun eines von vier Religiösen Modellen. Ihr habt eine Religiöse Übereinkunft von 0 bis 100, gebt Frömmigkeitsreform für acht dauerhafte Programme je Modell aus und könnt in einem Staat eurer Wahl ein gezieltes Religiöses Projekt führen.\n\n#Y Nationale Identität#! - Ethnische, bürgerliche oder zusammengesetzte Nation, mit dem Kulturauftrag zum Ausgeben, einem Nationalen Zusammenhalt, der hoch bleiben sollte, und fünf Kulturprojekten.\n\n#Y Ideengruppen#! - 21 Gruppen in Produktion, Gesellschaft und Militär, darunter die neue Agrarische Gruppe. Gruppenplätze werden nun durch Doktrininvestition statt durch den Kalender verdient, und jeder Kauf kostet eine Umsetzungsphase von 24 Monaten.\n\n#Y Nationale Ideen#! - Zwölf neue Länderprofile, und der Fortschritt ergibt sich nun aus jeder gekauften Ideenstufe.\n\n#Y Zeitalter#! - Drei Zeitalter mit Zielen, dreizehn Zeitalter-Belohnungen und drei Goldene Zeitalter, dazu je Zeitalter eine strategische Zeitalter-Wegscheide.\n\n#Y Neue Inhalte#! - Über hundert neue Ereignisse: Doktrin-Dilemmata, mehrjährige Doktrin-Reisen, Projektvorfälle und -krisen sowie Flavour-Ketten für die Osmanen, Japan und die Vereinigten Staaten.\n\n#Y Oberfläche#! - Eine neue Reihe in der obersten Leiste, neu gebaute Seiten für Religion und Nationale Identität, eine Doktrinübersicht in jedem Länderpanel und ein weltweites Lehrbuch."
 ve_welcome.1.f:0 "Jede Doktrin hinterlässt ihre Spur in der Nation, die sie annimmt."
 ve_welcome.1.a:0 "Details findet ihr in der Mod-Beschreibung. Viel Spaß ^_^"
