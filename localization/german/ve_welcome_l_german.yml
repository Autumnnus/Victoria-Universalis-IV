l_german:
 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Diese Kampagne basiert auf dem überarbeiteten Victoria Universalis IV. Kurz gesagt:\n\n#Y Religion#! – Ihr Gesetz zu Kirche und Staat legt nun eines von vier religiösen Modellen fest. Sie verfügen über eine Anzeige für den Religiösen Ausgleich von 0-100, geben Frömmigkeitsfonds für acht dauerhafte Programme pro Modell aus und können ein gezieltes religiöses Projekt in einem Staat Ihrer Wahl durchführen.\n\n#Y Nationale Identität#! – Ethnische, bürgerliche oder zusammengesetzte Nationalität, mit auszugebendem Kulturmandat, einer Anzeige für den nationalen Zusammenhalt, die hoch zu halten ist, und fünf kulturellen Projekten.\n\n#Y Ideengruppen#! – 21 Gruppen in den Bereichen Produktion, Gesellschaft und Militär, einschließlich der neuen Agrar-Gruppe. Gruppenplätze werden durch Doktrininvestitionen statt durch den Kalender erworben, und jeder Kauf kostet Sie eine 24-monatige Umsetzungsperiode.\n\n#Y Nationale Ideen#! – Zwölf neue Länderprofile, und Fortschritt resultiert nun aus jeder einzelnen Ideenstufe, die Sie erwerben.\n\n#Y Zeitalter#! – Drei Zeitalter mit Zielen, dreizehn Zeitalterbelohnungsplätze und drei Goldene Zeitalter, plus eine strategische Epochen-Scheideweg-Reise pro Zeitalter.\n\n#Y Neue Inhalte#! – Über hundert neue Ereignisse: Doktrin-Dilemmata, mehrjährige Doktrin-Reisen, Projekt-Vorfälle und -Krisen sowie Flavour-Ketten für die Osmanen, Japan und die Vereinigten Staaten.\n\n#Y Benutzeroberfläche#! – Eine neue obere Leiste, überarbeitete Seiten für Religion und Nationale Identität, eine Doktrin-Anzeige auf jedem Länderpanel und eine weltweite Doktrinenübersicht."
 ve_welcome.1.f:0 "Jede Doktrin hinterlässt ihre Spuren bei der Nation, die sie annimmt."
 ve_welcome.1.a:0 "Für Details siehe die Mod-Beschreibung. Viel Spaß ^_^"
