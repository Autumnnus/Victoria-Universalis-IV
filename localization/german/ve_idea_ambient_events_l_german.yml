l_german:
 ve_doctrine_ambient_cooldown_mdf:0 "Abklingzeit der Doktrindebatte"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Die Institutionen des Landes absorbieren die Konsequenzen einer jüngsten Debatte über die Doktrin."
 ve_doctrine_ambient_ig_supported_mdf:0 "Institutionelle Unterstützung"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Die Regierung hat dieser Interessengruppe eine sichtbare Rolle bei der Beilegung einer Doktrindebatte gegeben."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Institutionelle Geringfügigkeit"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Die Regierung hat diese Interessengruppe von einer kürzlich erfolgten Regelung der Doktrin ausgeschlossen."

 ve_doctrine_industrialist_positive_mdf:0 "Standardisierte industrielle Praxis"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Hersteller profitieren von einer koordinierten Sammlung industrieller Praktiken."
 ve_doctrine_industrialist_negative_mdf:0 "Industrielle Engpässe"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Ungelöste Koordinationsfehler schränken die Fertigung ein."
 ve_doctrine_academic_positive_mdf:0 "Koordiniertes Forschungsnetzwerk"
 ve_doctrine_academic_positive_mdf_desc:0 "Universitäten tauschen Methoden, Personal und Ergebnisse über ein koordiniertes Netzwerk aus."
 ve_doctrine_academic_negative_mdf:0 "Akademische Engpässe"
 ve_doctrine_academic_negative_mdf_desc:0 "Berechtigungs- und Koordinationsstreitigkeiten stören die Universitäten."
 ve_doctrine_nationalist_positive_mdf:0 "Nationales Verbandsnetzwerk"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Nationale Verbände übersetzen legitime Regierung in breitere Loyalität."
 ve_doctrine_nationalist_negative_mdf:0 "Konkurrierende nationale Gesellschaften"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Rivalisierende nationale Organisationen verwandeln politische Legitimität in neue Missstände."
 ve_doctrine_reformist_positive_mdf:0 "Organisiertes Reformnetzwerk"
 ve_doctrine_reformist_positive_mdf_desc:0 "Politische Bewegungen haben geordnete Kanäle für Beteiligung und Kompromisse gewonnen."
 ve_doctrine_reformist_negative_mdf:0 "Zerbrochene Reformkoalition"
 ve_doctrine_reformist_negative_mdf_desc:0 "Konkurrierende Reformorganisationen wandeln politische Mobilisierung in Radikalismus um."
 ve_doctrine_professional_army_positive_mdf:0 "Stabsausbildungszyklus"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Ein koordiniertes Personalprogramm verbessert das Ausbildungssystem der Armee."
 ve_doctrine_professional_army_negative_mdf:0 "Offizierkorps-Engpass"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Beförderungs- und Personalstreitigkeiten verlangsamen die militärische Ausbildung."
 ve_doctrine_agrarian_positive_mdf:0 "Koordinierte landwirtschaftliche Praxis"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Ländliche Institutionen verbreiten zuverlässige Methoden in der gesamten Agrarwirtschaft."
 ve_doctrine_agrarian_negative_mdf:0 "Verknappung landwirtschaftlicher Versorgung"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Mangel an Saatgut, Kredite und Koordination verringern den landwirtschaftlichen Durchsatz."

 ve_idea_evt.10.t:0 "Sicherheitscodes bei voller Leistung"
 ve_idea_evt.10.d:0 "Eine Reihe von Fabrikunfällen hat die Frage der industriellen Inspektion an die Öffentlichkeit gerückt. Unabhängige Prüfer versprechen glaubwürdige Standards, während Hersteller darauf bestehen, dass freiwillige Regeln Leistung und Initiative bewahren."
 ve_idea_evt.10.a:0 "Ernennen Sie unabhängige Inspektoren."
 ve_idea_evt.10.a.tt:0 "Geben Sie #N 25 aus#! Nationaler Einblick. Die Gewerkschaften erhalten #P +1#! Zustimmung und die Industriellen verlieren #N 1#! Zulassung für 24 Monate."
 ve_idea_evt.10.b:0 "Lassen Sie die Industrien freiwillige Kodizes schreiben."
 ve_idea_evt.10.b.tt:0 "Die Industriellen erhalten #P +1#! Zustimmung und die Gewerkschaften verlieren #N 1#! Genehmigung für 24 Monate."
 ve_idea_evt.10.c:0 "Vereinheitlichung der Regeln in Etappen."
 ve_idea_evt.10.c.tt:0 "Gib #N 10#! National Insight aus. Keine Änderungen bei der Interessengruppengenehmigung."

 ve_idea_evt.11.t:0 "Standardisierte Maschinenteile"
 ve_idea_evt.11.d:0 "Ingenieure aus mehreren Industriegebieten haben einen gemeinsamen Katalog von Lehren, Armaturen und Maschinenteilen erstellt. Die Finanzierung eines nationalen Standards wäre kostspielig, könnte aber Reibungsverluste im gesamten Fertigungsnetzwerk beseitigen."
 ve_idea_evt.11.a:0 "Übernehmen Sie die Standards landesweit."
 ve_idea_evt.11.a.tt:0 "Geben Sie #N 40 aus#! Nationale Einsicht und Gewinn #P +5 %#! Fertigungsdurchsatz für 36 Monate."
 ve_idea_evt.11.b:0 "Archivieren Sie die Ergebnisse für später."
 ve_idea_evt.11.b.tt:0 "Gewinn #P 15#! National Insight."
 ve_idea_evt.11.c:0 "Unsere Produktionsnetzwerke sind bereits vorbereitet."
 ve_idea_evt.11.c.tt:0 "Verbringen Sie #N 20#! Nationale Einsicht und Gewinn #P +5 %#! Fertigungsdurchsatz für 36 Monate."

 ve_idea_evt.12.t:0 "Der Engpass in den Werken"
 ve_idea_evt.12.d:0 "Aufträge häufen sich, während inkompatible Verfahren, verzögerte Komponenten und verwirrte Zeitpläne die Fabriken des Landes überlasten. Die Regierung kann Spezialisten entsenden, das Problem den Firmen überlassen oder etablierte Baubüros mit der Koordinierung einer Reaktion beauftragen."
 ve_idea_evt.12.a:0 "Entsenden Sie ein Spezialistenteam."
 ve_idea_evt.12.a.tt:0 "Verbringen #N 25#! National Insight und die Industriestrafe vermeiden."
 ve_idea_evt.12.b:0 "Die Fabriken müssen dieses Problem selbst lösen."
 ve_idea_evt.12.b.tt:0 "Leiden #N -5 %#! Fertigungsdurchsatz für 24 Monate."
 ve_idea_evt.12.c:0 "Aktiviere die Baubüros."
 ve_idea_evt.12.c.tt:0 "Gebe #N 10 aus#! National Insight und vermeiden Sie die industrielle Benachteiligung."

 ve_idea_evt.60.t:0 "Mechanisierung und Besitzverhältnisse"
 ve_idea_evt.60.d:0 "Neue Maschinen könnten die landwirtschaftliche Produktion steigern, aber Pächter und Kleinbauern befürchten, dass ein schneller Übergang die Lebensgrundlagen auf dem Land zerstören wird. Die Regierung muss entscheiden, ob sie die Mechanisierung beschleunigt, zunächst die Besitzverhältnisse schützt oder einen schrittweisen lokalen Übergang koordiniert."
 ve_idea_evt.60.a:0 "Einen Mechanisierungsfonds einrichten."
 ve_idea_evt.60.a.tt:0 "Ausgaben #N 25#! Nationaler Einblick und Gewinn #P +5 %#! Landwirtschaftlicher Durchsatz für 24 Monate. Die Industriellen gewinnen #P +1#! Zustimmung und das Landvolk verliert #N 1#! Genehmigung für 24 Monate."
 ve_idea_evt.60.b:0 "Sichern Sie die Pächter, bevor Sie die Farmen wechseln."
 ve_idea_evt.60.b.tt:0 "Die Landbevölkerung erhält #P +1#! Genehmigung und die Grundbesitzer verlieren #N 1#! Genehmigung für 24 Monate."
 ve_idea_evt.60.c:0 "Nutzen Sie lokale Produktionsnetzwerke für einen schrittweisen Übergang."
 ve_idea_evt.60.c.tt:0 "Geben Sie #N 10#! Nationale Erkenntnisse aus und gewinnen Sie #P +5 %#! Landwirtschaftlicher Durchsatz für 24 Monate. Keine Änderungen bei der Zustimmung der Interessengruppen."

 ve_idea_evt.61.t:0 "Kooperative Getreidespeicher"
 ve_idea_evt.61.d:0 "Landesdelegierte haben ein Netzwerk von kooperativen Getreidespeichern demonstriert, die in der Lage sind, Reserven, Aufzeichnungen und Transportmittel zu teilen. Ein nationales Programm könnte die landwirtschaftliche Koordinierung stärken, während die bloße Beibehaltung der Pläne dennoch das institutionelle Wissen der Regierung bereichern würde."
 ve_idea_evt.61.a:0 "Finanzieren Sie das kooperative Netzwerk."
 ve_idea_evt.61.a.tt:0 "Geben Sie #N 40#! National Insight aus und steigern Sie #P +5 %#! Landwirtschaftlichen Durchsatz für 36 Monate."
 ve_idea_evt.61.b:0 "Verteilen Sie die Aufzeichnungen an die Landwirtschaftsämter."
 ve_idea_evt.61.b.tt:0 "Gewinnen #P 15#! Nationaler Einblick."
 ve_idea_evt.61.c:0 "Nutzen Sie die bereits vorhandenen ländlichen Institutionen."
 ve_idea_evt.61.c.tt:0 "Geben Sie #N 20 aus#! Nationale Einsicht und Gewinn #P +5 %#! Landwirtschaftlicher Durchsatz für 36 Monate."

 ve_idea_evt.62.t:0 "Saatgut- und Kreditmangel"
 ve_idea_evt.62.d:0 "Schlechte Saatgutvorräte und eine knappere Kreditvergabe auf dem Land gefährden den kommenden Agrarzyklus. Spezialisten können eine Notfallhilfe organisieren, lokale Netzwerke können der Improvisation überlassen werden oder etablierte Subsistenzeinrichtungen können vorübergehend die Last tragen."
 ve_idea_evt.62.a:0 "Organisieren Sie ein Notfall-Expertenprogramm."
 ve_idea_evt.62.a.tt:0 "Geben Sie #N 25#! National Insight aus und vermeiden Sie die landwirtschaftliche Strafe."
 ve_idea_evt.62.b:0 "Lassen Sie lokale Netzwerke ihre eigene Lösung finden."
 ve_idea_evt.62.b.tt:0 "Leiden #N -5 %#! Landwirtschaftlicher Durchsatz für 24 Monate."
 ve_idea_evt.62.c:0 "Nutzen Sie Subsistenznetzwerke als temporäres Rückgrat."
 ve_idea_evt.62.c.tt:0 "Geben Sie #N 10#! National Insight aus und vermeiden Sie die Agrarstrafe."

 ve_idea_evt.20.t:0 "Schirmherrschaft oder Peer Review"
 ve_idea_evt.20.d:0 "Die Regierung erwartet von ihren Forschungsstipendien praktische Ergebnisse, während Wissenschaftler warnen, dass Mäzenatentum Beweise durch politische Zweckmäßigkeit ersetzen wird. Eine dauerhafte Regelung muss festlegen, wer über die Bildung des Landes urteilt."
 ve_idea_evt.20.a:0 "Richten Sie unabhängige Prüfungsausschüsse ein."
 ve_idea_evt.20.a.tt:0 "Geben Sie #N 25#! National Insight aus. Die Intelligenz gewinnt #P +1#! Anerkennung und das Kleinbürgertum verliert #N 1#! Anerkennung für 24 Monate."
 ve_idea_evt.20.b:0 "Lassen Sie den Staat Forschungsprioritäten festlegen."
 ve_idea_evt.20.b.tt:0 "Das Kleinbürgertum gewinnt #P +1#! Anerkennung und die Intelligenzija verliert #N 1#! Anerkennung für 24 Monate."
 ve_idea_evt.20.c:0 "Institutionalisierung gemeinsamer akademischer Standards."
 ve_idea_evt.20.c.tt:0 "Gib #N 10#! National Insight aus. Keine Änderungen bei der Interessengruppengenehmigung."
 ve_idea_evt.21.t:0 "Ein provinzielles Forschungsnetzwerk"
 ve_idea_evt.21.d:0 "Provinzhochschulen haben damit begonnen, Dozenten, Instrumente und Erkenntnisse ohne zentrale Leitung auszutauschen. Eine formelle Unterstützung könnte aus dieser improvisierten Kooperation ein nationales Forschungsnetzwerk machen."
 ve_idea_evt.21.a:0 "Finanzieren Sie das Netzwerk."
 ve_idea_evt.21.a.tt:0 "Geben Sie #N 40#! National Insight aus und gewinnen Sie #P +5 %#! Universitätsdurchsatz für 36 Monate."
 ve_idea_evt.21.b:0 "Platzieren Sie die Berichte im Zentralarchiv."
 ve_idea_evt.21.b.tt:0 "Gewinn #P 15#! National Insight."
 ve_idea_evt.21.c:0 "Verbinden Sie sie mit der Nationalen Akademie."
 ve_idea_evt.21.c.tt:0 "Geben Sie #N 20 aus#! Nationale Einsicht und Gewinn #P +5 %#! Hochschuldurchsatz für 36 Monate."
 ve_idea_evt.22.t:0 "Der Engpass bei den Qualifikationen"
 ve_idea_evt.22.d:0 "Universitäten können die wachsende Zahl von Studierenden, Dozenten und neuen Disziplinen nicht schnell genug bewerten. Verspätete Zulassungen gefährden nun das gesamte Forschungssystem."
 ve_idea_evt.22.a:0 "Erweitern Sie die Evaluierungskapazität."
 ve_idea_evt.22.a.tt:0 "Geben Sie #N 25 aus#! Nationale Einsicht und die akademische Strafe vermeiden."
 ve_idea_evt.22.b:0 "Die bestehenden Institutionen müssen damit zurechtkommen."
 ve_idea_evt.22.b.tt:0 "Leiden #N -5 %#! Universitätsdurchsatz für 24 Monate."
 ve_idea_evt.22.c:0 "Standardisierung durch das Schulnetzwerk."
 ve_idea_evt.22.c.tt:0 "Geben Sie #N 10#! Nationale Erkenntnisse aus und vermeiden Sie die akademische Strafe."

 ve_idea_evt.30.t:0 "Ein Kanon, viele Traditionen"
 ve_idea_evt.30.d:0 "Beamte, die einen nationalen Kanon vorbereiten, sind sich über den Stellenwert provinzieller Bräuche uneinig. Ein einzelner Bericht verspricht Klarheit, aber der Ausschluss lokaler Traditionen kann genau die Nation schwächen, die er definieren möchte."
 ve_idea_evt.30.a:0 "Verweben Sie lokale Traditionen in die gemeinsame Geschichte."
 ve_idea_evt.30.a.tt:0 "Geben Sie #N 25#! National Insight aus. Das Landvolk gewinnt #P +1#! Zustimmung und das Kleinbürgertum verliert #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.30.b:0 "Proklamieren Sie einen offiziellen Kanon."
 ve_idea_evt.30.b.tt:0 "Das Kleinbürgertum erhält #P +1#! Zustimmung und das Landvolk verliert #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.30.c:0 "Vertrauen Sie die Arbeit ausgebildeten Kulturkadern an."
 ve_idea_evt.30.c.tt:0 "Verbringen #N 10#! Nationaler Einblick. Keine Änderungen bei der Genehmigung durch Interessengruppen."
 ve_idea_evt.31.t:0 "Nationale Veteranenverbände"
 ve_idea_evt.31.d:0 "Veteranen haben Verbände organisiert, die Zeremonien, gegenseitige Hilfe und Loyalität gegenüber dem Staat verbinden. Ihr Netzwerk könnte bundesweit ausgeweitet oder erforscht werden, ohne ihm eine offizielle Rolle zuzuweisen."
 ve_idea_evt.31.a:0 "Unterstützen Sie die Vereine bundesweit."
 ve_idea_evt.31.a.tt:0 "Spenden Sie #N 40#! Nationaler Einblick und Gewinn #P +5 %#! Loyalisten von Legitimacy für 36 Monate."
 ve_idea_evt.31.b:0 "Zeichnen Sie ihre Erfahrungen in den Staatsarchiven auf."
 ve_idea_evt.31.b.tt:0 "Gewinn #P 15#! National Insight."
 ve_idea_evt.31.c:0 "Nutzen Sie die bereits etablierten nationalen Netzwerke."
 ve_idea_evt.31.c.tt:0 "Geben Sie #N 20#! National Insight aus und gewinnen Sie #P +5 %#! Loyalisten von Legitimacy für 36 Monate."
 ve_idea_evt.32.t:0 "Konkurrierende nationale Gesellschaften"
 ve_idea_evt.32.d:0 "Rivalisierende Gesellschaften beanspruchen nun das Recht, für die Nation zu sprechen. Ihre konkurrierenden Zeremonien und Veröffentlichungen verwandeln eine gemeinsame politische Sprache in eine Quelle des Unmuts."
 ve_idea_evt.32.a:0 "Entwerfen Sie eine gemeinsame Charta."
 ve_idea_evt.32.a.tt:0 "Geben Sie #N 25#! National Insight aus und vermeiden Sie die nationalistische Strafe."
 ve_idea_evt.32.b:0 "Der Wettbewerb wird seine eigenen Grenzen finden."
 ve_idea_evt.32.b.tt:0 "Erleiden #N +5%#! Radikale unter Legitimität für 24 Monate."
 ve_idea_evt.32.c:0 "Lassen Sie die nationalen Institutionen schlichten."
 ve_idea_evt.32.c.tt:0 "Geben Sie #N 10#! National Insight aus und vermeiden Sie die nationalistische Strafe."

 ve_idea_evt.40.t:0 "Komitee oder Straße"
 ve_idea_evt.40.d:0 "Die Reformer sind gespalten zwischen Expertenkommissionen und Massendruck. Ausschüsse versprechen eine kohärente Gesetzgebung, während organisierte Bewegungen darauf bestehen, dass Reformen ohne öffentliche Gewalt auf unbestimmte Zeit verzögert werden."
 ve_idea_evt.40.a:0 "Schaffen Sie eine unabhängige Reformkommission."
 ve_idea_evt.40.a.tt:0 "Geben Sie #N 25#! National Insight aus. Die Intelligenz erhält #P +1#! Zustimmung und die Gewerkschaften verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.40.b:0 "Geben Sie den Bewegungen Handlungsspielraum."
 ve_idea_evt.40.b.tt:0 "Die Gewerkschaften gewinnen #P +1#! Zustimmung und die Industriellen verlieren #N 1#! Zulassung für 24 Monate."
 ve_idea_evt.40.c:0 "Wenden Sie den festgelegten Rechts- und Verfahrensrahmen an."
 ve_idea_evt.40.c.tt:0 "Ausgeben #N 10#! Nationaler Einblick. Keine Änderungen bei der Zustimmung der Interessengruppen."
 ve_idea_evt.41.t:0 "Das Petitionsnetzwerk"
 ve_idea_evt.41.d:0 "Lokale Petitionen sind zu einem koordinierten nationalen Netzwerk geworden, das in der Lage ist, Beschwerden zu klären und Reformen vorzuschlagen. Die Regierung kann es als Beratungskanal anerkennen oder seine Methoden für eine spätere Verwendung aufbewahren."
 ve_idea_evt.41.a:0 "Das Netzwerk in eine formelle Konsultation umwandeln."
 ve_idea_evt.41.a.tt:0 "Ausgaben #N 40#! Nationale Einsicht und Gewinn #P +5 %#! Loyalisten aus politischen Bewegungen seit 36 ​​Monaten."
 ve_idea_evt.41.b:0 "Legen Sie die Forderungen im Rezensionsarchiv ab."
 ve_idea_evt.41.b.tt:0 "Gewinn #P 15#! National Insight."
 ve_idea_evt.41.c:0 "Nutzen Sie die bereits etablierten Reformorganisationen."
 ve_idea_evt.41.c.tt:0 "Geben Sie #N 20 aus#! Nationale Einsicht und Gewinn #P +5 %#! Loyalisten aus politischen Bewegungen seit 36 ​​Monaten."
 ve_idea_evt.42.t:0 "Die Brüche der Koalition"
 ve_idea_evt.42.d:0 "Die Reformkoalition spaltet sich hinsichtlich Prioritäten, Zeitpunkt und Führung. Wenn kein gemeinsames Programm wiederhergestellt wird, wird sich die organisierte politische Energie zu rivalisierenden radikalen Lagern verhärten."
 ve_idea_evt.42.a:0 "Schreiben Sie das gemeinsame Programm neu."
 ve_idea_evt.42.a.tt:0 "Verbringen #N 25#! Nationale Einsicht und die reformistische Strafe vermeiden."
 ve_idea_evt.42.b:0 "Lassen Sie die Spaltung in die offene Politik eintreten."
 ve_idea_evt.42.b.tt:0 "Leiden #N +5 %#! Radikale aus politischen Bewegungen für 24 Monate."
 ve_idea_evt.42.c:0 "Wenden Sie den egalitären Rahmen erneut an."
 ve_idea_evt.42.c.tt:0 "Verbringen #N 10#! National Insight und die reformistische Strafe vermeiden."

 ve_idea_evt.50.t:0 "Dienstalter oder Verdienst"
 ve_idea_evt.50.d:0 "Das Offizierskorps ist hinsichtlich der Beförderung gespalten. Hochrangige Kommandeure verteidigen ihren Rang durch Dienst und Sitte, während Reformer Prüfungen und Leistungsnachweise verlangen, die den Aufstieg zu nachgewiesenen Fähigkeiten ermöglichen."
 ve_idea_evt.50.a:0 "Leistungsprüfungen einführen."
 ve_idea_evt.50.a.tt:0 "Ausgeben #N 25#! Nationale Einsicht und Gewinn #P +5 %#! Ausbildungspauschale für 24 Monate. Die Streitkräfte verlieren #N 1#! Zulassung für 24 Monate."
 ve_idea_evt.50.b:0 "Bewahrung des Dienstaltersystems."
 ve_idea_evt.50.b.tt:0 "Die Streitkräfte erhalten #P +1#! Zulassung für 24 Monate, aber Ausbildungsrate sinkt um  #N -5 %#! für 12 Monate."
 ve_idea_evt.50.c:0 "Verwenden Sie die Dienstunterlagen des Generalstabs."
 ve_idea_evt.50.c.tt:0 "Verbringen #N 10#! Nationale Erkenntnisse und Gewinne #P +5 %#! Ausbildungspauschale für 24 Monate. Die Zustimmung der Interessengruppe ändert sich nicht."
 ve_idea_evt.51.t:0 "Die große Stabsübung"
 ve_idea_evt.51.d:0 "Eine große Stabsübung hat wertvolle Erkenntnisse in den Bereichen Mobilisierung, Unterweisung und Führung ans Licht gebracht. Durch eine Ausweitung des Programms könnten diese Erkenntnisse in der Armee verbreitet werden, während die Archivierung der Ergebnisse sie zu geringen Kosten bewahren würde."
 ve_idea_evt.51.a:0 "Erweitern Sie die Übung."
 ve_idea_evt.51.a.tt:0 "Ausgeben #N 40#! Nationale Erkenntnisse und Gewinne #P +5 %#! Ausbildungspauschale für 36 Monate."
 ve_idea_evt.51.b:0 "Platzieren Sie die Erkenntnisse im Lehrarchiv."
 ve_idea_evt.51.b.tt:0 "Gewinn #P 15#! National Insight."
 ve_idea_evt.51.c:0 "Nutzen Sie das professionelle Kommandonetzwerk."
 ve_idea_evt.51.c.tt:0 "Ausgeben #N 20#! Nationale Erkenntnisse und Gewinne #P +5 %#! Ausbildungspauschale für 36 Monate."
 ve_idea_evt.52.t:0 "Ein Engpass im Offizierskorps"
 ve_idea_evt.52.d:0 "Die Armee expandiert schneller, als ihre Ausbilder und Stabsoffiziere vorbereitet werden können. Die Trainingspläne hängen jetzt von einer kleinen Gruppe erschöpfter Kader ab."
 ve_idea_evt.52.a:0 "Erweitern Sie den Ausbildungskader."
 ve_idea_evt.52.a.tt:0 "Gib #N 25#! National Insight aus und vermeide die Militärstrafe."
 ve_idea_evt.52.b:0 "Drücke die vorhandenen Kader stärker."
 ve_idea_evt.52.b.tt:0 "Erleide #N -5 %#! Ausbildungsrate für 24 Monate."
 ve_idea_evt.52.c:0 "Übertrage die logistische Personalreserve."
 ve_idea_evt.52.c.tt:0 "Gib #N 10#! National Insight aus und vermeide die Militärstrafe."
