l_german:
 ve_doctrine_ambient_cooldown_mdf:0 "Abklingzeit der Doktrin-Debatte"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Die Institutionen des Landes absorbieren die Konsequenzen einer kürzlichen Doktrin-Debatte."
 ve_doctrine_ambient_ig_supported_mdf:0 "Institutionelle Unterstützung"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Die Regierung hat dieser Interessengruppe eine sichtbare Rolle bei der Beilegung einer Doktrin-Debatte zugewiesen."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Institutionelle Brüskierung"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Die Regierung hat diese Interessengruppe von einer kürzlichen Doktrin-Beilegung ausgeschlossen."

 ve_doctrine_industrialist_positive_mdf:0 "Standardisierte Industriepraxis"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Hersteller profitieren von einem koordinierten Gremium industrieller Praxis."
 ve_doctrine_industrialist_negative_mdf:0 "Industrielle Engpässe"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Ungelöste Koordinierungsfehler schränken die Fertigung ein."
 ve_doctrine_academic_positive_mdf:0 "Koordiniertes Forschungsnetzwerk"
 ve_doctrine_academic_positive_mdf_desc:0 "Universitäten tauschen Methoden, Personal und Ergebnisse über ein koordiniertes Netzwerk aus."
 ve_doctrine_academic_negative_mdf:0 "Akademische Engpässe"
 ve_doctrine_academic_negative_mdf_desc:0 "Ausweis- und Koordinierungsstreitigkeiten stören den Universitätsbetrieb."
 ve_doctrine_nationalist_positive_mdf:0 "Nationale Vereinigungsnetzwerk"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Nationale Vereinigungen übersetzen legitime Regierung in breitere Loyalität."
 ve_doctrine_nationalist_negative_mdf:0 "Konkurrierende nationale Gesellschaften"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Rivale nationale Organisationen verwandeln politische Legitimität in neue Missstimmungen."
 ve_doctrine_reformist_positive_mdf:0 "Organisiertes Reformnetzwerk"
 ve_doctrine_reformist_positive_mdf_desc:0 "Protestbewegungen haben geordnete Kanäle für Partizipation und Kompromiss erlangt."
 ve_doctrine_reformist_negative_mdf:0 "Zersplitterte Reformkoalition"
 ve_doctrine_reformist_negative_mdf_desc:0 "Konkurrierende Reformorganisationen bekehre politische Mobilisierung in Radikalität."
 ve_doctrine_professional_army_positive_mdf:0 "Stabsausbildungszyklus"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Ein koordiniertes Stabsprogramm verbessert das Ausbildungssystem der Armee."
 ve_doctrine_professional_army_negative_mdf:0 "Offizierkorps-Engpass"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Beförderungs- und Personalstreitigkeiten verlangsamen die militärische Ausbildung."
 ve_doctrine_agrarian_positive_mdf:0 "Koordinierte landwirtschaftliche Praxis"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Ländliche Institutionen verbreiten verlässliche Methoden in der gesamten Agrarwirtschaft."
 ve_doctrine_agrarian_negative_mdf:0 "Landwirtschaftliche Versorgungsknappheit"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Knappheiten an Saatgut, Kredit und Koordination verringern den landwirtschaftlichen Durchsatz."

 ve_idea_evt.10.t:0 "Sicherheitsvorschriften bei vollem Ausstoß"
 ve_idea_evt.10.d:0 "Eine Reihe von Fabrikunfällen hat die Frage der industriellen Inspektion offengelegt. Unabhängige Inspektoren versprechen glaubwürdige Standards, während die Industriellen darauf bestehen, dass freiwillige Regeln Ausstoß und Initiative wahren."
 ve_idea_evt.10.a:0 "Unabhängige Inspektoren ernennen."
 ve_idea_evt.10.a.tt:0 "Verbraucht #N 25#! Nationaleinsicht. Die Gewerkschafter erhalten #P +1#! Zustimmung und die Industriellen verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.10.b:0 "Die Industriellen freiwillige Regeln verfassen lassen."
 ve_idea_evt.10.b.tt:0 "Die Industriellen erhalten #P +1#! Zustimmung und die Gewerkschafter verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.10.c:0 "Die Regeln schrittweise standardisieren."
 ve_idea_evt.10.c.tt:0 "Verbraucht #N 10#! Nationaleinsicht. Keine Änderung der Interessengruppen-Zustimmung."

 ve_idea_evt.11.t:0 "Standardisierte Maschinenteile"
 ve_idea_evt.11.d:0 "Ingenieure aus mehreren Industriebezirken haben einen gemeinsamen Katalog für Lehren, Armaturen und Maschinenteile erstellt. Die Finanzierung eines nationalen Standards wäre kostspielig, könnte aber Reibungsverluste im gesamten Fertigungsnetzwerk beseitigen."
 ve_idea_evt.11.a:0 "Die Standards landesweit übernehmen."
 ve_idea_evt.11.a.tt:0 "Kostet #N 40#! Nationaleinsicht und gewährt #P +5%#! Fertigungs-Durchsatz für 36 Monate."
 ve_idea_evt.11.b:0 "Die Erkenntnisse für später archivieren."
 ve_idea_evt.11.b.tt:0 "Gewährt #P 15#! Nationaleinsicht."
 ve_idea_evt.11.c:0 "Unsere Produktionsnetzwerke sind bereits vorbereitet."
 ve_idea_evt.11.c.tt:0 "Kostet #N 20#! Nationaleinsicht und gewährt #P +5%#! Fertigungs-Durchsatz für 36 Monate."

 ve_idea_evt.12.t:0 "Der Engpass in den Fabriken"
 ve_idea_evt.12.d:0 "Befehle häufen sich an, während unvereinbare Abläufe, verzögerte Komponenten und unklare Zeitpläne die Fabriken des Landes lahmlegen. Die Regierung kann Spezialisten entsenden, das Problem den Betrieben überlassen oder etablierte Baubüros zur Koordinierung einer Antwort einsetzen."
 ve_idea_evt.12.a:0 "Ein Spezialistenteam entsenden."
 ve_idea_evt.12.a.tt:0 "Kostet #N 25#! Nationaleinsicht und verhindert den Industriestrafus."
 ve_idea_evt.12.b:0 "Die Fabriken müssen dies selbst lösen."
 ve_idea_evt.12.b.tt:0 "Verursacht #N -5%#! Fertigungs-Durchsatz für 24 Monate."
 ve_idea_evt.12.c:0 "Die Bauämter aktivieren."
 ve_idea_evt.12.c.tt:0 "Kostet #N 10#! Nationaleinsicht und verhindert den Industriestrafus."

 ve_idea_evt.60.t:0 "Mechanisierung und Pachtverhältnisse"
 ve_idea_evt.60.d:0 "Neue Maschinen könnten den landwirtschaftlichen Ertrag steigern, aber Pächter und Kleinbauern befürchten, dass ein rascher Übergang die ländliche Existenzgrundlage zerstört. Die Regierung muss entscheiden, ob sie die Mechanisierung beschleunigt, zuerst die Pachtverhältnisse schützt oder einen schrittweisen lokalen Übergang koordiniert."
 ve_idea_evt.60.a:0 "Einen Mechanisierungsfond einrichten."
 ve_idea_evt.60.a.tt:0 "Kostet #N 25#! Nationaleinsicht und gewährt #P +5%#! Landwirtschafts-Durchsatz für 24 Monate. Die Industrielle erhalten #P +1#! Zustimmung und die Landbewohner verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.60.b:0 "Die Pächter absichern, bevor die Höfe umgestellt werden."
 ve_idea_evt.60.b.tt:0 "Die Landbewohner erhalten #P +1#! Zustimmung und die Grundbesitzer verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.60.c:0 "Lokale Produktionsnetzwerke für einen schrittweisen Übergang nutzen."
 ve_idea_evt.60.c.tt:0 "Kostet #N 10#! Nationaleinsicht und gewährt #P +5%#! Landwirtschafts-Durchsatz für 24 Monate. Keine Änderung der Interessengruppen-Zustimmung."

 ve_idea_evt.61.t:0 "Genossenschaftliche Getreidespeicher"
 ve_idea_evt.61.d:0 "Ländliche Delegierte haben ein Netzwerk genossenschaftlicher Getreidespeicher vorgestellt, das Reserven, Aufzeichnungen und Transporte gemeinsam nutzen kann. Ein nationales Programm könnte die landwirtschaftliche Koordinierung stärken, während die bloße Bewahrung der Pläne das institutionelle Wissen der Regierung bereichern würde."
 ve_idea_evt.61.a:0 "Das Genossenschaftsnetzwerk finanzieren."
 ve_idea_evt.61.a.tt:0 "Kostet #N 40#! Nationaleinsicht und gewährt #P +5%#! Landwirtschafts-Durchsatz für 36 Monate."
 ve_idea_evt.61.b:0 "Die Aufzeichnungen an die Landwirtschaftsämter verteilen."
 ve_idea_evt.61.b.tt:0 "Gewährt #P 15#! Nationaleinsicht."
 ve_idea_evt.61.c:0 "Die bereits bestehenden ländlichen Institutionen nutzen."
 ve_idea_evt.61.c.tt:0 "Kostet #N 20#! Nationaleinsicht und gewährt #P +5%#! Landwirtschafts-Durchsatz für 36 Monate."

 ve_idea_evt.62.t:0 "Saatgut- und Kreditknappheit"
 ve_idea_evt.62.d:0 "Schlechte Saatgutbestände und restriktivere ländliche Kredite gefährden den kommenden landwirtschaftlichen Zyklus. Spezialisten können eine Notfallmaßnahme organisieren, lokale Netzwerke können sich selbst überlassen werden oder etablierte Subsistenzinstitutionen können die Last vorübergehend tragen."
 ve_idea_evt.62.a:0 "Ein Notfall-Expertiseprogramm organisieren."
 ve_idea_evt.62.a.tt:0 "Kostet #N 25#! Nationaleinsicht und verhindert den Landwirtschaftsstrafus."
 ve_idea_evt.62.b:0 "Lokale Netzwerke ihre eigene Lösung finden lassen."
 ve_idea_evt.62.b.tt:0 "Verursacht #N -5%#! Landwirtschafts-Durchsatz für 24 Monate."
 ve_idea_evt.62.c:0 "Subsistenznetzwerke als vorübergehendes Rückgrat nutzen."
 ve_idea_evt.62.c.tt:0 "Kostet #N 10#! Nationaleinsicht und verhindert den Landwirtschaftsstrafus."

 ve_idea_evt.20.t:0 "Patronage oder Peer-Review"
 ve_idea_evt.20.d:0 "Die Regierung erwartet praktische Ergebnisse von ihren Forschungsbeihilfen, während Gelehrte warnen, dass Patronage Beweise durch politische Zweckmäßigkeit ersetzen wird. Eine dauerhafte Regelung muss definieren, wer über das Bildungswesen des Landes richtet."
 ve_idea_evt.20.a:0 "Unabhängige Prüfungsausschüsse einrichten."
 ve_idea_evt.20.a.tt:0 "Verbraucht #N 25#! Nationaleinsicht. Die Intellektuelle erhalten #P +1#! Zustimmung und die Kleinbürger verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.20.b:0 "Den Staat Forschungsprioritäten festlegen lassen."
 ve_idea_evt.20.b.tt:0 "Die Kleinbürger erhalten #P +1#! Zustimmung und die Intellektuelle verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.20.c:0 "Gemeinsame akademische Standards institutionalisieren."
 ve_idea_evt.20.c.tt:0 "Verbraucht #N 10#! Nationaleinsicht. Keine Änderung der Interessengruppen-Zustimmung."
 ve_idea_evt.21.t:0 "Ein provinzielles Forschungsnetzwerk"
 ve_idea_evt.21.d:0 "Provinzkollegs haben begonnen, Dozenten, Instrumente und Erkenntnisse ohne zentrale Lenkung auszutauschen. Formelle Unterstützung könnte diese improvisierte Zusammenarbeit in ein nationales Forschungsnetzwerk verwandeln."
 ve_idea_evt.21.a:0 "Das Netzwerk finanzieren."
 ve_idea_evt.21.a.tt:0 "Verbraucht #N 40#! Nationaleinsicht und gewährt #P +5%#! Durchsatz von Universität für 36 Monate."
 ve_idea_evt.21.b:0 "Die Berichte im zentralen Archiv ablegen."
 ve_idea_evt.21.b.tt:0 "Gewährt #P 15#! Nationaleinsicht."
 ve_idea_evt.21.c:0 "An die nationale Akademie anbinden."
 ve_idea_evt.21.c.tt:0 "Verbraucht #N 20#! Nationaleinsicht und gewährt #P +5%#! Durchsatz von Universität für 36 Monate."
 ve_idea_evt.22.t:0 "Der Qualifikationsengpass"
 ve_idea_evt.22.d:0 "Universitäten können die wachsende Zahl an Studenten, Dozenten und neuen Disziplinen nicht schnell genug bewerten. Verzögerte Qualifikationen gefährden nun das gesamte Forschungssystem."
 ve_idea_evt.22.a:0 "Die Prüfungskapazität erweitern."
 ve_idea_evt.22.a.tt:0 "Verbraucht #N 25#! Nationaleinsicht und vermeidet den akademischen Malus."
 ve_idea_evt.22.b:0 "Die bestehenden Institutionen müssen klarkommen."
 ve_idea_evt.22.b.tt:0 "Erleidet #N -5%#! Durchsatz von Universität für 24 Monate."
 ve_idea_evt.22.c:0 "Durch das Schulnetzwerk standardisieren."
 ve_idea_evt.22.c.tt:0 "Verbraucht #N 10#! Nationaleinsicht und vermeidet den akademischen Malus."

 ve_idea_evt.30.t:0 "Ein Kanon, viele Traditionen"
 ve_idea_evt.30.d:0 "Beamte, die einen nationalen Kanon vorbereiten, sind sich über den Platz provinzieller Bräuche uneinig. Eine einheitliche Darstellung verspricht Klarheit, aber der Ausschluss lokaler Traditionen könnte genau die Nation schwächen, die sie definieren soll."
 ve_idea_evt.30.a:0 "Lokale Traditionen in die gemeinsame Erzählung einweben."
 ve_idea_evt.30.a.tt:0 "Verbraucht #N 25#! Nationaleinsicht. Die Landbewohner erhalten #P +1#! Zustimmung und die Kleinbürger verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.30.b:0 "Einen offiziellen Kanon proklamieren."
 ve_idea_evt.30.b.tt:0 "Die Kleinbürger erhalten #P +1#! Zustimmung und die Landbewohner verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.30.c:0 "Die Arbeit geschulten kulturellen Kadern anvertrauen."
 ve_idea_evt.30.c.tt:0 "Verbraucht #N 10#! Nationaleinsicht. Keine Änderung der Interessengruppen-Zustimmung."
 ve_idea_evt.31.t:0 "Nationale Veteranenverbände"
 ve_idea_evt.31.d:0 "Veteranen haben Verbände organisiert, die Zeremonie, gegenseitige Hilfe und Loyalität gegenüber dem Staat verknüpfen. Ihr Netzwerk könnte landesweit ausgebaut oder studiert werden, ohne ihm eine offizielle Rolle zu verleihen."
 ve_idea_evt.31.a:0 "Die Verbände landesweit unterstützen."
 ve_idea_evt.31.a.tt:0 "Verbraucht #N 40#! Nationaleinsicht und gewährt #P +5%#! Loyalisten aus Legitimität für 36 Monate."
 ve_idea_evt.31.b:0 "Ihre Erfahrung in den Staatsarchiven festhalten."
 ve_idea_evt.31.b.tt:0 "Gewährt #P 15#! Nationaleinsicht."
 ve_idea_evt.31.c:0 "Die bereits etablierten nationalen Netzwerke nutzen."
 ve_idea_evt.31.c.tt:0 "Verbraucht #N 20#! Nationaleinsicht und gewährt #P +5%#! Loyalisten aus Legitimität für 36 Monate."
 ve_idea_evt.32.t:0 "Konkurrierende nationale Gesellschaften"
 ve_idea_evt.32.d:0 "Rivalisierende Gesellschaften beanspruchen nun das Recht, für die Nation zu sprechen. Ihre konkurrierenden Zeremonien und Publikationen lassen eine gemeinsame politische Sprache zu einer Quelle von Missstimmungen werden."
 ve_idea_evt.32.a:0 "Einen gemeinsamen Pakt entwerfen."
 ve_idea_evt.32.a.tt:0 "Verbraucht #N 25#! Nationaleinsicht und verhindert den nationalistischen Malus."
 ve_idea_evt.32.b:0 "Die Konkurrenz wird ihre eigenen Grenzen finden."
 ve_idea_evt.32.b.tt:0 "Verursacht #N +5%#! Radikale durch Legitimität für 24 Monate."
 ve_idea_evt.32.c:0 "Die nationalen Institutionen schlichten lassen."
 ve_idea_evt.32.c.tt:0 "Verbraucht #N 10#! Nationaleinsicht und verhindert den nationalistischen Malus."

 ve_idea_evt.40.t:0 "Ausschuss oder Straße"
 ve_idea_evt.40.d:0 "Die Reformer sind gespalten zwischen Expertenkommissionen und dem Druck der Straße. Ausschüsse versprechen kohärente Gesetzgebung, während organisierte Bewegungen darauf beharren, dass Reformen ohne öffentlichen Druck auf unbestimmte Zeit verzögert werden."
 ve_idea_evt.40.a:0 "Eine unabhängige Reformkommission einsetzen."
 ve_idea_evt.40.a.tt:0 "Verbraucht #N 25#! Nationaleinsicht. Die Intelligentsia erhält #P +1#! Zustimmung und die Gewerkschafter verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.40.b:0 "Den Bewegungen Handlungsspielraum lassen."
 ve_idea_evt.40.b.tt:0 "Die Gewerkschafter erhalten #P +1#! Zustimmung und die Industriellen verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.40.c:0 "Den etablierten Rahmen aus Rechten und Verfahren anwenden."
 ve_idea_evt.40.c.tt:0 "Verbraucht #N 10#! Nationaleinsicht. Keine Änderung der Interessengruppen-Zustimmung."
 ve_idea_evt.41.t:0 "Das Petitionsnetzwerk"
 ve_idea_evt.41.d:0 "Lokale Petitionen haben sich zu einem koordiniertem nationalen Netzwerk entwickelt, das in der Lage ist, Missstände zu sortieren und Reformen vorzuschlagen. Die Regierung kann es als Konsultationskanal anerkennen oder seine Methoden für die spätere Verwendung bewahren."
 ve_idea_evt.41.a:0 "Das Netzwerk in eine formelle Konsultation umwandeln."
 ve_idea_evt.41.a.tt:0 "Verbraucht #N 40#! Nationaleinsicht und gewährt #P +5%#! Loyalisten durch Protestbewegungen für 36 Monate."
 ve_idea_evt.41.b:0 "Die Forderungen im Prüfarchiv ablegen."
 ve_idea_evt.41.b.tt:0 "Gewährt #P 15#! Nationaleinsicht."
 ve_idea_evt.41.c:0 "Die bereits etablierten Reformorganisationen nutzen."
 ve_idea_evt.41.c.tt:0 "Verbraucht #N 20#! Nationaleinsicht und gewährt #P +5%#! Loyalisten durch Protestbewegungen für 36 Monate."
 ve_idea_evt.42.t:0 "Die Koalition bricht auseinander"
 ve_idea_evt.42.d:0 "Die Reformkoalition spaltet sich über Prioritäten, Zeitplan und Führung. Sofern kein gemeinsames Programm wiederhergestellt wird, verhärtet sich die organisierte politische Energie zu rivalisierenden radikalen Lagern."
 ve_idea_evt.42.a:0 "Das gemeinsame Programm umschreiben."
 ve_idea_evt.42.a.tt:0 "Verbraucht #N 25#! Nationaleinsicht und verhindert den reformistischen Malus."
 ve_idea_evt.42.b:0 "Die Spaltung in die offene Politik tragen."
 ve_idea_evt.42.b.tt:0 "Verursacht #N +5%#! Radikale durch Protestbewegungen für 24 Monate."
 ve_idea_evt.42.c:0 "Den egalitären Rahmen erneut anwenden."
 ve_idea_evt.42.c.tt:0 "Verbraucht #N 10#! Nationaleinsicht und verhindert den reformistischen Malus."

 ve_idea_evt.50.t:0 "Dienstalter oder Leistung"
 ve_idea_evt.50.d:0 "Das Offizierskorps ist in der Frage der Beförderung gespalten. Seniorbefehlshaber verteidigen den Rang nach Dienstzeit und Brauch, während Reformer Prüfungen und Leistungsnachweise fordern, die den Aufstieg nachweislicher Eignung öffnen würden."
 ve_idea_evt.50.a:0 "Leistungsprüfungen einführen."
 ve_idea_evt.50.a.tt:0 "Verbraucht #N 25#! Nationaleinsicht und gewährt #P +5%#! Ausbildungsrate für 24 Monate. Die Streitkräfte verlieren #N 1#! Zustimmung für 24 Monate."
 ve_idea_evt.50.b:0 "Das Dienstaltersystem bewahren."
 ve_idea_evt.50.b.tt:0 "Die Streitkräfte erhalten #P +1#! Zustimmung für 24 Monate, aber die Ausbildungsrate sinkt um #N -5%#! für 12 Monate."
 ve_idea_evt.50.c:0 "Die Personalakten des Generalstabs nutzen."
 ve_idea_evt.50.c.tt:0 "Verbraucht #N 10#! Nationaleinsicht und gewährt #P +5%#! Ausbildungsrate für 24 Monate. Die Interessengruppen-Zustimmung ändert sich nicht."
 ve_idea_evt.51.t:0 "Die große Stabsmöglichung"
 ve_idea_evt.51.d:0 "Eine groß angelegte Stabsübung hat wertvolle Lehren hinsichtlich Mobilisierung, Instruktion und Befehl offengelegt. Eine Ausweitung des Programms könnte diese Lehren in der Armee verbreiten, während die Archivierung der Ergebnisse sie mit geringen Kosten bewahren würde."
 ve_idea_evt.51.a:0 "Die Übung erweitern."
 ve_idea_evt.51.a.tt:0 "Kostet #N 40#! Nationaleinsicht und gewährt #P +5%#! Ausbildungsrate für 36 Monate."
 ve_idea_evt.51.b:0 "Die Ergebnisse im Doktrinenarchiv ablegen."
 ve_idea_evt.51.b.tt:0 "Gewährt #P 15#! Nationaleinsicht."
 ve_idea_evt.51.c:0 "Das professionelle Befehlsnetzwerk nutzen."
 ve_idea_evt.51.c.tt:0 "Kostet #N 20#! Nationaleinsicht und gewährt #P +5%#! Ausbildungsrate für 36 Monate."
 ve_idea_evt.52.t:0 "Engpass im Offizierskorps"
 ve_idea_evt.52.d:0 "Die Armee wächst schneller, als Ausbilder und Stabsoffiziere herangebildet werden können. Die Ausbildungspläne hängen nun von einem schmalen Kreis erschöpfter Kader ab."
 ve_idea_evt.52.a:0 "Den Ausbildungskader erweitern."
 ve_idea_evt.52.a.tt:0 "Kostet #N 25#! Nationaleinsicht und vermeidet den Militärmalus."
 ve_idea_evt.52.b:0 "Die bestehenden Kader stärker beanspruchen."
 ve_idea_evt.52.b.tt:0 "Verursacht #N -5%#! Ausbildungsrate für 24 Monate."
 ve_idea_evt.52.c:0 "Die logistische Stabreserve abordnen."
 ve_idea_evt.52.c.tt:0 "Kostet #N 10#! Nationaleinsicht und vermeidet den Militärmalus."
