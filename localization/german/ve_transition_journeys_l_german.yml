l_german:
 ve_je_religious_settlement_transition:0 "Übergang des religiösen Ausgleichs"
 ve_je_religious_settlement_transition_reason:0 "Der rechtliche Ausgleich von Kirche und Staat hat sich verändert. Institutionen, Gemeinden und Beamte müssen sich anpassen, solange die Übergangskrise in Kraft ist. Der Krisenmodifikator – nicht der Kalender dieses Journaleintrags – ist maßgeblich."
 ve_je_religious_settlement_transition_complete_tt:0 "Die Übergangskrise des religiösen Ausgleichs ist beendet."
 ve_je_religious_settlement_transition_status_confessional:0 "Zielausgleich: #Y Konfessioneller Staat#!\nReligiöser Ausgleich: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nUngefähre verbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] Monate#!\nAbgeschlossene Meilensteine: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nErgebnis bei Ende der Krise: #Y 60+#! Ausgleich stabilisiert sich frühzeitig, #Y 26-59#! verläuft neutral, #Y 25 oder weniger#! mündet in einer Krise. Jeder verbleibende Meilenstein bietet eine Wahlmöglichkeit, die den religiösen Ausgleich beeinflusst."
 ve_je_religious_settlement_transition_status_freedom:0 "Zielausgleich: #Y Gewissensfreiheit#!\nReligiöser Ausgleich: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nUngefähre verbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] Monate#!\nAbgeschlossene Meilensteine: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nErgebnis bei Ende der Krise: #Y 60+#! Ausgleich stabilisiert sich frühzeitig, #Y 26-59#! verläuft neutral, #Y 25 oder weniger#! mündet in einer Krise. Jeder verbleibende Meilenstein bietet eine Wahlmöglichkeit, die den religiösen Ausgleich beeinflusst."
 ve_je_religious_settlement_transition_status_separation:0 "Zielausgleich: #Y Vollständige Trennung#!\nReligiöser Ausgleich: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nUngefähre verbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] Monate#!\nAbgeschlossene Meilensteine: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nErgebnis bei Ende der Krise: #Y 60+#! Ausgleich stabilisiert sich frühzeitig, #Y 26-59#! verläuft neutral, #Y 25 oder weniger#! mündet in einer Krise. Jeder verbleibende Meilenstein bietet eine Wahlmöglichkeit, die den religiösen Ausgleich beeinflusst."
 ve_je_religious_settlement_transition_status_atheism:0 "Zielausgleich: #Y Staatsatheismus#!\nReligiöser Ausgleich: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nUngefähre verbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] Monate#!\nAbgeschlossene Meilensteine: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nErgebnis bei Ende der Krise: #Y 60+#! Ausgleich stabilisiert sich frühzeitig, #Y 26-59#! verläuft neutral, #Y 25 oder weniger#! mündet in einer Krise. Jeder verbleibende Meilenstein bietet eine Wahlmöglichkeit, die den religiösen Ausgleich beeinflusst."

 ve_je_national_compact_transition:0 "Übergang des nationalen Pakts"
 ve_je_national_compact_transition_reason:0 "Der Staat hat eine neue Definition nationaler Zugehörigkeit angenommen. Administratoren, Eliten und Gemeinschaften müssen über den Pakt verhandeln, solange der Übergangsrückschlag in Kraft ist. Der Rückschlagmodifikator – nicht der Kalender dieses Journaleintrags – ist maßgeblich."
 ve_je_national_compact_transition_complete_tt:0 "Der Übergangsrückschlag des nationalen Pakts ist beendet."
 ve_je_national_compact_transition_status_ethnic:0 "Zielidentität: #Y Ethnische Identität#!\nNationaler Zusammenhalt: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nUngefähre verbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] Monate#!\nAbgeschlossene Meilensteine: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nErgebnis bei Ende des Rückschlags: #Y 60+#! Zusammenhalt stabilisiert sich frühzeitig, #Y 26-59#! verläuft neutral, #Y 25 oder weniger#! mündet in einer Krise. Jeder verbleibende Meilenstein bietet eine Wahlmöglichkeit, die den nationalen Zusammenhalt beeinflusst."
 ve_je_national_compact_transition_status_civic:0 "Zielidentität: #Y Zivile Identität#!\nNationaler Zusammenhalt: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nUngefähre verbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] Monate#!\nAbgeschlossene Meilensteine: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nErgebnis bei Ende des Rückschlags: #Y 60+#! Zusammenhalt stabilisiert sich frühzeitig, #Y 26-59#! verläuft neutral, #Y 25 oder weniger#! mündet in einer Krise. Jeder verbleibende Meilenstein bietet eine Wahlmöglichkeit, die den nationalen Zusammenhalt beeinflusst."
 ve_je_national_compact_transition_status_composite:0 "Zielidentität: #Y Komposite Identität#!\nNationaler Zusammenhalt: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nUngefähre verbleibende Zeit: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] Monate#!\nAbgeschlossene Meilensteine: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nErgebnis bei Ende des Rückschlags: #Y 60+#! Zusammenhalt stabilisiert sich frühzeitig, #Y 26-59#! verläuft neutral, #Y 25 oder weniger#! mündet in einer Krise. Jeder verbleibende Meilenstein bietet eine Wahlmöglichkeit, die den nationalen Zusammenhalt beeinflusst."
 ve_je_transition_resolving_status:0 "Die Übergangsakte wird mit dem gegenwärtigen nationalen Ausgleich in Einklang gebracht."

 ve_rel_transition_conciliatory_tt:0 "Wendet #N 10#! Frömmigkeitsfonds auf und erhaltet #P 3#! religiösen Ausgleich."
 ve_rel_transition_central_tt:0 "Erhartet #P 5#! Frömmigkeitsfonds und verliert #N 3#! religiösen Ausgleich."
 ve_rel_transition_doctrine_tt:0 "Wendet #N 5#! Frömmigkeitsfonds auf und erhaltet #P 2#! religiösen Ausgleich."

 ve_rel_evt.210.t:0 "Die Grenzen klerikaler Ernennungen"
 ve_rel_evt.210.d:0 "Religiöse Behörden haben Kandidatenlisten für öffentliche Ämter eingereicht, während hohe Verwaltungsbeamte darauf bestehen, dass der Staatsdienst weiterhin Eignung belohnen muss. Die ersten Ernennungen im Rahmen der neuen Regelung werden definieren, wo klerikaler Rat endet und die staatliche Autorität beginnt."
 ve_rel_evt.210.a:0 "Einberufung eines gemischten Ernennungsausschusses."
 ve_rel_evt.210.b:0 "Die klerikalen Listen annehmen."
 ve_rel_evt.210.c:0 "Standardprüfungen mit religiösem Rat verbinden."

 ve_rel_evt.211.t:0 "Schulen und Treueeide"
 ve_rel_evt.211.d:0 "Pfarrschulen streben einen anerkannten Platz im öffentlichen System an. Ihre Förderer fordern Schutz für den Religionsunterricht, während Beamte befürchten, dass konkurrierende Lehrpläne und Eide die nächste Generation spalten werden."
 ve_rel_evt.211.a:0 "Einen gemeinsamen Kernlehrplan garantieren."
 ve_rel_evt.211.b:0 "Einen einheitlichen Treueeid auferlegen."
 ve_rel_evt.211.c:0 "Den Kompromiss unter bürokratische Inspektion stellen."

 ve_rel_evt.220.t:0 "Die Sprache der Minderheitengarantien"
 ve_rel_evt.220.d:0 "Minderheitengemeinschaften wollen ihren Schutz ausdrücklich in der neuen Regelung verankert sehen. Regierungsjuristen bevorzugen stattdessen eine einzige allgemeine Klausel und warnen davor, dass gemeinschaftsspezifische Versprechen alte Spaltungen verhärten könnten."
 ve_rel_evt.220.a:0 "Die Garantien klar verfassen."
 ve_rel_evt.220.b:0 "Eine einheitliche Staatsbürgerschaftsklausel verwenden."
 ve_rel_evt.220.c:0 "Die Reformkoalition den Wortlaut vermitteln lassen."

 ve_rel_evt.221.t:0 "Vertretung in gemeinsamen Institutionen"
 ve_rel_evt.221.d:0 "Schulen, Krankenhäuser und lokale Gremien müssen Bürgern verschiedener Konfessionen nun gleichberechtigt dienen. Die Frage ist, ob die Vertretung den lokalen Gegebenheiten oder einer vom Zentrum auferlegten Formel folgen soll."
 ve_rel_evt.221.a:0 "Vertretung lokal ausgleichen."
 ve_rel_evt.221.b:0 "Eine zentrale Quote festlegen."
 ve_rel_evt.221.c:0 "Eine diplomatische Vertretungsformel verhandeln."

 ve_rel_evt.230.t:0 "Das neutrale Register"
 ve_rel_evt.230.d:0 "Geburten, Eheschließungen und Eigentumsansprüche gehen von religiösen Verwaltern an staatliche Standesbeamte über. Beamte können während des Übergangs doppelte Aufzeichnungen beibehalten, aber Reformer fordern einen sauberen und sofortigen Schnitt."
 ve_rel_evt.230.a:0 "Doppelte Aufzeichnungen für eine Übergangszeit beibehalten."
 ve_rel_evt.230.b:0 "Die religiösen Register unverzüglich schließen."
 ve_rel_evt.230.c:0 "Ein ausgebildetes Beamtennetzwerk einsetzen."

 ve_rel_evt.231.t:0 "Schule und öffentliche Zeremonie"
 ve_rel_evt.231.d:0 "Das Prinzip der staatlichen Neutralität hat Schulversammlungen und öffentliche Zeremonien erreicht. Lokale Gemeinschaften wollen Raum für übererbte Bräuche; zentrale Beamte wollen ein einziges säkulares Protokoll, das keine Mehrdeutigkeit zulässt."
 ve_rel_evt.231.a:0 "Raum für lokale Zeremonien lassen."
 ve_rel_evt.231.b:0 "Ein säkulares Protokoll vorschreiben."
 ve_rel_evt.231.c:0 "Einen gemeinsamen bürgerlichen zeremoniellen Standard schaffen."

 ve_rel_evt.240.t:0 "Ein Mangel an säkularen Kadern"
 ve_rel_evt.240.d:0 "Die neue Verwaltung benötigt Lehrer, Standesbeamte und Inspektoren, die ohne klerikale Institutionen arbeiten können. Es gibt zu wenige ausgebildete Kandidaten, und das bestehende Personal zu zwingen, seine Praxis umzustellen, könnte Widerstand hervorrufen."
 ve_rel_evt.240.a:0 "Ein neues Kaderausbildungsprogramm finanzieren."
 ve_rel_evt.240.b:0 "Das bestehende Personal zur Anpassung zwingen."
 ve_rel_evt.240.c:0 "Ein akademisches Ausbildungsnetzwerk aufbauen."

 ve_rel_evt.241.t:0 "Eigentum und Untergrundgottesdienste"
 ve_rel_evt.241.d:0 "Die Übertragung religiösen Eigentums hat einige Gemeinden in den Untergrund getrieben. Eine sofortige Enteignung würde den neuen Staat schnell ausstatten, aber eine übereilte Regelung riskiert, private Gottesdienste in organisierte Auflehnung zu verwandeln."
 ve_rel_evt.241.a:0 "Das Eigentum schrittweise übertragen."
 ve_rel_evt.241.b:0 "Es sofort verstaatlichen."
 ve_rel_evt.241.c:0 "Die Vermögenswerte in beaufsichtigte Wohlfahrtsinstitutionen leiten."

 ve_rel_evt.290.t:0 "Ein Ausgleich schlägt Wurzel"
 ve_rel_evt.290.d:0 "Die Übergangskrise ist vorüber, ohne den religiösen Ausgleich des Landes zu zerstören. Die Verwaltungsbeamten arbeiten nun nach den neuen Regeln, Gemeinschaften wissen, woran sie sind, und die Regierung kann die Erfahrung entweder in Reformkapazität oder tieferes öffentliches Selbstbewusstsein ummünzen."
 ve_rel_evt.290.a:0 "Die Lehren in die nächste Reform mitnehmen."
 ve_rel_evt.290.a.tt:0 "Erhalte #P 10#! Frömmigkeitsfonds."
 ve_rel_evt.290.b:0 "Den Ausgleich öffentlich bekräftigen."
 ve_rel_evt.290.b.tt:0 "Erhalte #P 3#! Religiöser Ausgleich."

 ve_rel_evt.291.t:0 "Ein zerbrechliches Gleichgewicht"
 ve_rel_evt.291.d:0 "Der formelle Übergang ist abgeschlossen, doch der neue Ausgleich bleibt eher ein Zweckbündnis der Vorsicht als der Überzeugung. Er kann sich selbst überlassen werden, durch ein weiteres begrenztes Zugeständnis gestärkt oder durch zum angenommenen Religionsmodell passende Institutionen stabilisiert werden."
 ve_rel_evt.291.a:0 "Den Kompromiss bestehen lassen."
 ve_rel_evt.291.a.tt:0 "Der Übergang endet ohne zusätzlichen mechanischen Effekt."
 ve_rel_evt.291.b:0 "Eine letzte Unterredung finanzieren."
 ve_rel_evt.291.b.tt:0 "Verbrauche #N 10#! Frömmigkeitsfonds und erhalte #P 3#! Religiöser Ausgleich."
 ve_rel_evt.291.c:0 "Den Ausgleich modellgerechten Institutionen anvertrauen."
 ve_rel_evt.291.c.tt:0 "Verbrauche #N 5#! Frömmigkeitsfonds und erhalte #P 2#! Religiöser Ausgleich. Erfordert eine Doktrin, die zum angenommenen Religionsmodell passt."

 ve_rel_evt.292.t:0 "Eine Krise des Ausgleichs"
 ve_rel_evt.292.d:0 "Der Übergangsmodifikator ist abgelaufen, doch das Land hat die neue religiöse Ordnung nicht akzeptiert. Die Regierung kann knappe Reformkapazität für eine Notunterkunft aufwenden, für einen schmaleren Eingriff auf modellgerechte Institutionen vertrauen oder zulassen, dass der ungelöste Konflikt Teile der Bevölkerung radikalisiert."
 ve_rel_evt.292.a:0 "Den Preis einer Notunterkunft zahlen."
 ve_rel_evt.292.a.tt:0 "Verbrauche #N 15#! Frömmigkeitsfonds und erhalte #P 5#! Religiöser Ausgleich."
 ve_rel_evt.292.b:0 "Der Staat hat keine Zugeständnisse mehr zu machen."
 ve_rel_evt.292.b.tt:0 "#N 0.25%#! der Bevölkerung des Landes werden Radikal."
 ve_rel_evt.292.c:0 "Die für diesen Ausgleich erbauten Institutionen nutzen."
 ve_rel_evt.292.c.tt:0 "Verbrauche #N 5#! Frömmigkeitsfonds und erhalte #P 2#! Religiöser Ausgleich. Erfordert eine Doktrin, die zum angenommenen Religionsmodell passt."

 ve_identity_transition_conciliatory_tt:0 "Verbrauche #N 10#! Kulturmandat und erhalte #P 3#! Nationaler Zusammenhalt."
 ve_identity_transition_central_tt:0 "Erhalte #P 5#! Kulturmandat und verliere #N 3#! Nationaler Zusammenhalt."
 ve_identity_transition_doctrine_tt:0 "Verbrauche #N 5#! Kulturmandat und erhalte #P 2#! Nationaler Zusammenhalt."

 ve_cul_evt.210.t:0 "Die Amtssprache des Staates"
 ve_cul_evt.210.d:0 "Der neue nationale Pakt erfordert eine gemeinsame Sprache für Gerichte, Schulen und öffentlichen Dienst. Sofortige Einheitlichkeit wäre leicht zu verwalten, doch viele erfahrene Beamte und Bürger können den vorgeschlagenen Standard noch nicht erfüllen."
 ve_cul_evt.210.a:0 "Die Sprache durch gestaffelten Unterricht einführen."
 ve_cul_evt.210.b:0 "Einen einsprachigen Erlass herausgeben."
 ve_cul_evt.210.c:0 "Die nationalistische Verwaltung mobilisieren."

 ve_cul_evt.211.t:0 "Dienst und Zugehörigkeit"
 ve_cul_evt.211.d:0 "Militärdienst und Veteranenstatus werden zu Nachweisen nationaler Zugehörigkeit. Unter den neuen Pakt gebrachte Gemeinschaften fordern Zeit zur Anpassung, während das Zentrum darauf beharrt, dass Zugehörigkeit eine einheitliche Verpflichtung nach sich ziehen muss."
 ve_cul_evt.211.a:0 "Übergangsausnahmen gewähren."
 ve_cul_evt.211.b:0 "Eine Dienstverpflichtung anwenden."
 ve_cul_evt.211.c:0 "Ein allgemeines Dienstregister erstellen."

 ve_cul_evt.220.t:0 "Das Register der gleichen Staatsbürgerschaft"
 ve_cul_evt.220.d:0 "Alte ethnische und religiöse Kategorien bleiben in öffentlichen Aufzeichnungen verankert. Sie sofort zu entfernen würde gleiche Staatsbürgerschaft verkünden, doch lokale Ämter warnen, dass eine übereilte Bekehrung Ansprüche auslöschen und den Zugang zu Dienstleistungen stören könnte."
 ve_cul_evt.220.a:0 "Ein gemeinsames bürgerliches Register schrittweise einführen."
 ve_cul_evt.220.b:0 "Die alten Kategorien sofort entfernen."
 ve_cul_evt.220.c:0 "Die Bekehrung einer Reformkommission unterstellen."

 ve_cul_evt.221.t:0 "Gemeinsame Schule, gemeinsamer Dienst"
 ve_cul_evt.221.d:0 "Gleicher Zugang besteht vor dem Gesetz, doch Schulen und öffentliche Ämter entbehren des notwendigen Personals, um diesen zu gewährleisten. Die Regierung muss zwischen geduldiger Investition, einem durchsetzbaren zentralen Standard und einem nationalen Netzwerk akademischer Qualifikationen wählen."
 ve_cul_evt.221.a:0 "In Lehrer und Staatsdiener investieren."
 ve_cul_evt.221.b:0 "Einen zentralen Standard durchsetzen."
 ve_cul_evt.221.c:0 "Ein Netzwerk akademischer Qualifikationen aufbauen."

 ve_cul_evt.230.t:0 "Der Rat der konstituierenden Völker"
 ve_cul_evt.230.d:0 "Die im Gesamtstaat genannten Gemeinschaften fordern Mitsprache bei dessen Verwaltung. Offene Verhandlungen mögen Legitimität hervorbringen, während eine in der Hauptstadt entworfene feste Quote eine schnellere und vorhersehbarere Regelung verspricht."
 ve_cul_evt.230.a:0 "Offene repräsentative Verhandlungen führen."
 ve_cul_evt.230.b:0 "Die feste Quote der Hauptstadt auferlegen."
 ve_cul_evt.230.c:0 "Einen parlamentarischen Kompromiss vermitteln."

 ve_cul_evt.231.t:0 "Mehrschichtige Verwaltung"
 ve_cul_evt.231.d:0 "Lokale Autorität und zentrale Standards überschneiden sich nun im gesamten Gesamtstaat. Ohne ein klares Protokoll wird jedes Amt die Grenze aufs Neue verhandeln; bei einer allzu starren Befehlskette mag der Pakt seine Bedeutung verlieren."
 ve_cul_evt.231.a:0 "Ein Protokoll der Zuständigkeiten verhandeln."
 ve_cul_evt.231.b:0 "Eine zentrale Befehlskette errichten."
 ve_cul_evt.231.c:0 "Ein gemeinsames bürokratisches Register anlegen."

 ve_cul_evt.290.t:0 "Ein neuer nationaler Pakt"
 ve_cul_evt.290.d:0 "Der Rückschlag ist abgeklungen und die neue Definition der nationalen Zugehörigkeit hat Wurzeln geschlagen. Die Regierung kann die administrativen Lehren als Kulturmandat bewahren oder den Augenblick nutzen, um das Selbstbewusstsein im Pakt zu stärken."
 ve_cul_evt.290.a:0 "Die Erfahrung in die künftige Staatskunst tragen."
 ve_cul_evt.290.a.tt:0 "Erhltet #P 10#! Kulturmandat."
 ve_cul_evt.290.b:0 "Den Pakt im ganzen Land feiern."
 ve_cul_evt.290.b.tt:0 "Erhltet #P 3#! Nationaler Zusammenhalt."

 ve_cul_evt.291.t:0 "Ein zerbrechlicher Pakt"
 ve_cul_evt.291.d:0 "Der formelle Übergang ist vorüber, doch die neue nationale Identität bleibt ungleich akzeptiert. Die Regierung kann den Kompromiss reifen lassen, ein begrenztes Mandat für eine weitere Einigung aufwenden oder ihn durch Institutionen stärken, die zum angenommenen Identitätsmodell passen."
 ve_cul_evt.291.a:0 "Den Kompromiss sein eigenes Saldo finden lassen."
 ve_cul_evt.291.a.tt:0 "Der Übergang endet ohne zusätzliche mechanische Auswirkungen."
 ve_cul_evt.291.b:0 "Eine letzte Einigung finanzieren."
 ve_cul_evt.291.b.tt:0 "Verbraucht #N 10#! Kulturmandat und erhaltet #P 3#! Nationaler Zusammenhalt."
 ve_cul_evt.291.c:0 "Den Pakt modellangepassten Institutionen anvertrauen."
 ve_cul_evt.291.c.tt:0 "Verbraucht #N 5#! Kulturmandat und erhaltet #P 2#! Nationaler Zusammenhalt. Erfordert eine Doktrin, die zum angenommenen Identitätsmodell passt."

 ve_cul_evt.292.t:0 "Eine Krise des nationalen Pakts"
 ve_cul_evt.292.d:0 "Der Übergangsrückschlag ist abgelaufen, doch die neue Definition der Zugehörigkeit hat keine breite Loyalität erlangt. Die Regierung kann knappes Mandat für eine Notstiftung aufwenden, auf modellangepasste Institutionen für einen enger gefassten Eingriff bauen oder eine Welle der Radikalisierung hinnehmen."
 ve_cul_evt.292.a:0 "Für eine Notstiftung zahlen."
 ve_cul_evt.292.a.tt:0 "Verbraucht #N 15#! Kulturmandat und erhaltet #P 5#! Nationaler Zusammenhalt."
 ve_cul_evt.292.b:0 "Der Staat wird den Pakt wie geschrieben durchsetzen."
 ve_cul_evt.292.b.tt:0 "#N 0.25%#! der Bevölkerung des Landes werden Radikal."
 ve_cul_evt.292.c:0 "Die für diese Identität erbauten Institutionen nutzen."
 ve_cul_evt.292.c.tt:0 "Verbraucht #N 5#! Kulturmandat und erhaltet #P 2#! Nationaler Zusammenhalt. Erfordert eine Doktrin, die zum angenommenen Identitätsmodell passt."
