 ve_send_missionary_tt:0 "#variable Der Missionar konvertiert jeden Tag die Religion der Einheimischen #gold 6 Monate.\n\n#white Wenn die Staatsbevölkerung weniger als 250.000 beträgt: #darker_white 0 % #white Basisumwandlungs-Basisleistungsabfall\n#white Wenn die Bevölkerung des Bundesstaates unter 500.000 liegt: #negative_value -0,02 % #white Umwandlungsbasisleistungsabfall\n#white Wenn die Bundesstaatsbevölkerung unter 750.000 liegt: #negative_value -0,03 % #white Umwandlungsbasisleistungsabfall\n#white Wenn die Bundesstaatsbevölkerung unter 1 m liegt: #negative_value -0,04 % #white Umwandlungsbasisleistungsabfall\n#white Wenn die Staatsbevölkerung unter liegt 5 m: #negative_value -0,043 % #white Umwandlungs-Basisenergieabfall\n#white Wenn die Staatsbevölkerung weniger als 10 m beträgt: #negative_value -0,045 % #white Umwandlungs-Basisenergieabfall\n#white Wenn die Staatsbevölkerung mehr als 10 m beträgt: #negative_value -0,0475 % #white Umwandlungs-Basisenergieabfall"
