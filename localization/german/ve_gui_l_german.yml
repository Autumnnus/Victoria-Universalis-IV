 ve_targeted_religious_project_state_action:0 "#tooltippable_name Gezieltes religiöses Projekt"
 ve_targeted_religious_project_state_action_tt:0 "#header Gezieltes religiöses Projekt#!\nStartet das mit dem aktuellen Religionsmodell verbundene Projekt gegen die religiöse Zusammensetzung dieses Staates. Total Separation kann keinen starten. Öffnen Sie das Religionsfenster für genaue Kosten, Fortschrittsregeln und Ergebnisse."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Gezieltes Kulturprojekt"
 ve_start_religious_project_button:0 "Projekt starten"
 ve_cancel_religious_project_button:0 "Projekt abbrechen"
 ve_confirm_cancel_button:0 "#N Ja, Abbrechen#!"
 ve_keep_project_button:0 "Projekt behalten"
 ve_targeted_religious_project_state_requirements_tt:0 "Der Staat muss unser Eigentum sein und unsere eigene Religion darf nicht bereits herrschen #Y 90 %#! oder mehr seiner Bevölkerung. Konfessioneller Atheismus, Gewissensfreiheit und staatlicher Atheismus können jeweils einen beginnen; Totale Trennung kann nicht. Die Kosten für die Frömmigkeitsreform des aktiven Religionsmodells müssen ebenfalls beglichen werden."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "Das Religionsmodell erlaubt ein gezieltes Projekt (Total Separation kann eines nicht starten)"
 ve_religious_project_req_no_active:0 "Kein gezieltes religiöses Projekt bereits in Bearbeitung"
 ve_religious_project_req_no_backlash:0 "Nicht in der 24-monatigen Abklingzeit nach dem Abbrechen eines Projekts"
 ve_religious_project_req_reform_point:0 "Genug Frömmigkeitsreform für das aktive Religionsmodell (#Y 125#! Konfessionell / #Y 100#! Gewissensfreiheit / #Y 150#! Staatlicher Atheismus)"
 ve_religious_project_req_target:0 "Unsere eigene Religion hält weniger als #Y 90%#! der Bevölkerung dieses Staates"
 ve_religious_project_cancel_warning:0 "#header Das gezielte religiöse Projekt abbrechen?#!\n\nDer bisher erzielte Fortschritt geht verloren. #N -5 Religiöse Regelung#! und a #N 24 Monate#! Abklingmodifikatoren werden angewendet, bevor ein anderes Projekt gestartet werden kann."
 ve_cultural_project_req_no_active:0 "Es ist noch kein Kulturprojekt im Gange"
 ve_cultural_project_req_no_backlash:0 "Nicht in der 24-monatigen Abklingzeit nach Abbruch eines Projekts"
 ve_cultural_project_req_reform_point:0 "Genug kultureller Auftrag für das aktive Identitätsmodell (#Y 125#! Ethnisch / #Y 100#! Bürgerlich / #Y 150#! Composite, plus #Y 40#! Zusammenhalt für Composite)"
 ve_cultural_project_req_target:0 "Dieser Staat verfügt über eine förderfähige nicht-primäre Kultur mit mindestens #Y 5 %#! seiner Bevölkerung"
 ve_cultural_project_cancel_warning:0 "#header Das Kulturprojekt abbrechen?#!\n\nDer bisher erzielte Fortschritt geht verloren. #N -5 Nationaler Zusammenhalt#! und a #N 24 Monate#! Abklingmodifikatoren werden angewendet, bevor ein anderes Projekt gestartet werden kann."
 alert_can_unlock_ideas_name:0 "Kann eine Idee übernehmen"
 alert_can_unlock_ideas_hint:0 "Wir haben genug nationale Erkenntnisse für mindestens die nächste Idee einer übernommenen Gruppe und kein Zyklus der Doktrinenimplementierung blockiert derzeit den Kauf."
 alert_max_piety_name:0 "Kann ein Religions-Staatsprogramm übernehmen"
 alert_max_piety_hint:0 "Unsere Frömmigkeitsreform ist weit genug fortgeschritten, um ein weiteres religiöses Programm zu verabschieden."
 alert_ve_can_begin_cultural_project_name:0 "Kulturelle Mandate häufen sich"
 alert_ve_can_begin_cultural_project_hint:0 "Wir haben es geschafft #Y 300#! Kulturauftrag und ein Kulturprojekt, das wir starten konnten. Das Mandatseinkommen halbiert sich bei 400 und stoppt bei 500, es lohnt sich also, es auszugeben. Nichts wird erzwungen: Unser Identitätsmodell ist bereits aktiv."
 alert_can_unlock_age_bonus_name:0 "Kann eine Ära-Belohnung freischalten"
 alert_can_unlock_age_bonus_hint:0 "Wir haben genug Era-Momentum, um eine andere Belohnung auszuwählen."
