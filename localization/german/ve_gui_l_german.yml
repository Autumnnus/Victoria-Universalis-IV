 ve_targeted_religious_project_state_action:0 "#tooltippable_name Zielgerichtetes religiöses Projekt"
 ve_targeted_religious_project_state_action_tt:0 "#header Zielgerichtetes religiöses Projekt#!\nStartet das mit dem aktuellen Religionsmodell verbundene Projekt gegen die religiöse Zusammensetzung dieses Staates. Völlige Trennung kann keines starten. Öffnen Sie das Religionsfenster für genaue Kosten, Fortschrittsregeln und Ergebnisse."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Zielgerichtetes Kulturprojekt"
 ve_start_religious_project_button:0 "Projekt starten"
 ve_cancel_religious_project_button:0 "Projekt abbrechen"
 ve_confirm_cancel_button:0 "#N Ja, abbrechen#!"
 ve_keep_project_button:0 "Projekt behalten"
 ve_targeted_religious_project_state_requirements_tt:0 "Das Staatsterritorium muss sich in unserem Besitz befinden und unsere eigene Religion darf noch nicht #Y 90%#! oder mehr seiner Bevölkerung ausmachen. Konfessioneller Staat, Gewissensfreiheit und Staatsatheismus können jeweils eines beginnen; Völlige Trennung kann dies nicht. Die Kosten des aktiven Religionsmodells an Frömmigkeitsfonds müssen ebenfalls gedeckt sein."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "Das Religionsmodell erlaubt ein gezieltes Projekt (Völlige Trennung kann keines beginnen)"
 ve_religious_project_req_no_active:0 "Es ist bereits ein gezieltes religiöses Projekt im Gange"
 ve_religious_project_req_no_backlash:0 "Nicht in der 24-monatigen Abklingzeit nach dem Abbrechen eines Projekts"
 ve_religious_project_req_reform_point:0 "Genug Frömmigkeitsfonds für das aktive Religionsmodell (#Y 125#! Konfessioneller Staat / #Y 100#! Gewissensfreiheit / #Y 150#! Staatsatheismus)"
 ve_religious_project_req_target:0 "Unsere eigene Religion macht weniger als #Y 90%#! der Bevölkerung dieses Staates aus"
 ve_religious_project_cancel_warning:0 "#header Das gezielte religiöse Projekt abbrechen?#!\n\nDer bisher erzielte Fortschritt geht verloren. #N -5 Religiöser Ausgleich#! und ein Modifikator für eine #N 24-monatige#! Abklingzeit werden angewendet, bevor ein weiteres Projekt begonnen werden kann."
 ve_cultural_project_req_no_active:0 "Es ist bereits ein Kulturprojekt im Gange"
 ve_cultural_project_req_no_backlash:0 "Nicht in der 24-monatigen Abklingzeit nach dem Abbrechen eines Projekts"
 ve_cultural_project_req_reform_point:0 "Genug Kulturmandat für das aktive Identitätsmodell (#Y 125#! Ethnische Nation / #Y 100#! Staatsbürgernation / #Y 150#! Gesamtstaat, plus #Y 40#! Zusammenhalt für Gesamtstaat)"
 ve_cultural_project_req_target:0 "Dieser Staat weist eine zulässige nicht-primäre Kultur auf, die mindestens #Y 5%#! seiner Bevölkerung ausmacht"
 ve_cultural_project_cancel_warning:0 "#header Das Kulturprojekt abbrechen?#!\n\nDer bisher erzielte Fortschritt geht verloren. #N -5 Nationaler Zusammenhalt#! und ein Modifikator für eine #N 24-monatige#! Abklingzeit werden angewendet, bevor ein weiteres Projekt begonnen werden kann."
 alert_can_unlock_ideas_name:0 "Kann eine Doktrin annehmen"
 alert_can_unlock_ideas_hint:0 "Wir verfügen über genügend Nationaleinsicht für die nächste Doktrin einer bereits angenommenen Gruppe, und derzeit blockiert kein Doktrinen-Umsetzungszyklus den Kauf."
 alert_max_piety_name:0 "Kann ein religiöses Staatsprogramm annehmen"
 alert_max_piety_hint:0 "Unsere Frömmigkeitsfonds sind hoch genug, um ein weiteres Religiöses Programm anzunehmen."
 alert_ve_can_begin_cultural_project_name:0 "Anhäufung von Kulturmandat"
 alert_ve_can_begin_cultural_project_hint:0 "Wir verfügen über mehr als #Y 300#! Kulturmandat und ein Kulturprojekt, das wir beginnen könnten. Das Mandatseinkommen halbiert sich bei 400 und stoppt bei 500, weshalb sich das Ausgeben lohnt. Nichts ist erzwungen: Unser Identitätsmodell ist bereits aktiv."
 alert_can_unlock_age_bonus_name:0 "Kann eine Zeitalterbelohnung freischalten"
 alert_can_unlock_age_bonus_hint:0 "Wir haben genug Epochenschwung, um eine weitere Belohnung zu wählen."
