 ve_state_religion_tt:0 "#P Ermöglicht die Mechanik des Konfessionsstaates und 3 Missionare.#! Die Religionsbehörde reagiert stark auf die Unterstützung der Gläubigen."
 ve_freedom_of_conscience_tt:0 "#P Ermöglicht die Mechanik „Pluralistischer Staat“ und 1 Missionar.#! Religiöse Harmonie belohnt ein stabiles Zusammenleben."
 ve_total_separation_tt:0 "#P Ermöglicht die Mechanik des pluralistischen Staates.#! Missionare sind behindert."
 ve_ethnostate_tt:0 "#P Stimmt stark mit dem Identitätsmodell der ethnischen Nation überein.#! Es steht im Widerspruch zur Civic Nation und ist für einen Composite State weniger geeignet."
 ve_national_supremacy_tt:0 "#P Entspricht dem ethnischen Nation-Identitätsmodell.#! Es steht im Widerspruch zu Civic Nation."
