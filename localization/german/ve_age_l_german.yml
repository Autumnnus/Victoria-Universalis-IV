l_german:
 ve_splendor:0 "#tooltippable_name Ära-Momentum: "
 ve_age_of_victoria_title:0 "Industrie und Nationen"
 ve_age_of_victoria_desc:0 "Alte Ordnungen stehen Fabriken, Eisenbahnen, gebildeten Öffentlichkeiten und dem modernen Staat gegenüber. Dynamik gehört zu den Ländern, die überkommene Institutionen in dauerhafte nationale Kapazitäten umwandeln."
 ve_imperialism_age_title:0 "Imperium und Massengesellschaft"
 ve_imperialism_age_desc:0 "Die Industrie erstreckt sich über alle Kontinente, während Bildung, öffentliche Institutionen und organisierte Armeen die Massengesellschaft neu gestalten. Großmächte können ins Ausland expandieren; Kleinere Staaten können durch Souveränität und interne Entwicklung gedeihen."
 ve_great_wars_age_title:0 "Massenpolitik und totaler Krieg"
 ve_great_wars_age_desc:0 "Elektrizität, Öl, Massenbeteiligung, Wohlfahrt und industrielle Kriegsführung verändern das Verhältnis zwischen Staat und Gesellschaft. Das Überleben hängt heute ebenso von Institutionen wie von Armeen ab."
 ve_age_notify_option:0 "Ein neues Zeitalter bricht an."
 ve_victorian_age_icon_p_tt:0 "#P Industrie und Nationen (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Industrie und Nationen (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Imperium und Massengesellschaft (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Empire und Massengesellschaft (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Massenpolitik und totaler Krieg (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Massenpolitik und totaler Krieg (1906–1936)"

 ve_golden_age:0 "Goldenes Zeitalter"
 ve_golden_age_industrial:0 "Industrielles Goldenes Zeitalter"
 ve_golden_age_cultural:0 "Kulturelles Goldenes Zeitalter"
 ve_golden_age_strategic:0 "Strategisches Goldenes Zeitalter"
 ve_golden_age_tt:0 "Verfügbar ab #v 1845#! nach Abschluss #v 5 verschiedener Ziele#! im aktuellen Zeitalter. Ein Land darf während des gesamten Spiels nur ein Goldenes Zeitalter wählen; seine Wirkung dauert #v 15 Jahre#!."
 ve_golden_age_requirement_unused:0 "Während dieser Kampagne wurde kein Goldenes Zeitalter ausgewählt."
 ve_golden_age_requirement_year:0 "Erfordert das Jahr #v 1845#! oder später."
 ve_golden_age_requirement_objectives:0 "Erfüllen Sie mindestens #v 5 verschiedene Ziele#! im aktuellen Zeitalter."
 ve_golden_age_industrial_tt:0 "#header Industrielles Goldenes Zeitalter#!\nFür #Y 15 Jahre#!: #P +10 % Produktionsdurchsatz#! und #P +10 % Ressourcenentdeckung Chance#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Kulturelles Goldenes Zeitalter#!\nFür #Y 15 Jahre#!: #P +5 % Zugang zu Bildung#! und #P +10 % Prestige#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Strategisches Goldenes Zeitalter#!\nFür #Y 15 Jahre#!: #P +5 % Armeeoffensive#! und #P -10 % Kriegserschöpfung durch Verluste#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Altersziele"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Industrieller Aufschwung"
 ve_victorian_age_obj_desc_1:0 "Reduzierung des Bauernanteils unter 40 %."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Beendigung der Alten Ordnung"
 ve_victorian_age_obj_desc_2:0 "Verbot der Sklaverei und Abschaffung der Leibeigenschaft."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Funktionszustand"
 ve_victorian_age_obj_desc_3:0 "Behalten Sie mindestens 70 Legitimität und ein nicht negatives Bürokratiegleichgewicht bei, ohne dass ein Mangel droht."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Gebildete Öffentlichkeit"
 ve_victorian_age_obj_desc_4:0 "Erreichen Sie 50 % Alphabetisierung oder Schulen der Stufe 3."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Integrierter Markt"
 ve_victorian_age_obj_desc_5:0 "Besitzen Sie mindestens 3 Eisenbahnebenen, wenn die Bevölkerung weniger als 5 Millionen beträgt, oder 6 Eisenbahnebenen andernfalls."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Nationales Erwachen"
 ve_victorian_age_obj_desc_6:0 "Seien Sie unabhängig mit mindestens 65 Legitimitätswerten und weniger als 5 % Unruhen im Land."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Globale Reichweite"
 ve_victorian_age_obj_desc_7:0 "Seien Sie eine Groß- oder Großmacht oder behalten Sie mindestens 5 erklärte Interessen bei."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Industriemacht"
 ve_imperialism_age_obj_desc_1:0 "Erreichen Sie ein BIP von 100 Millionen Pfund oder senken Sie den Bauernanteil unter 25 %."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Massenbildung"
 ve_imperialism_age_obj_desc_2:0 "Erreichen Sie 65 % Alphabetisierung oder Schulen der Stufe 4."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Imperium oder Souveränität"
 ve_imperialism_age_obj_desc_3:0 "Mindestens 2 Untertanen haben oder unabhängig und anerkannt bleiben."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Globaler Handel"
 ve_imperialism_age_obj_desc_4:0 "Besitzen Sie 2 Hafenebenen, wenn weniger als 10 Millionen Einwohner, besitzen Sie andernfalls 10 Hafenebenen oder behalten Sie 5 erklärte Interessen bei."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Nationsbildung"
 ve_imperialism_age_obj_desc_5:0 "Behalten Sie mindestens 60 Legitimität und weniger als 5 % Unruhen im Land bei."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header Die soziale Frage"
 ve_imperialism_age_obj_desc_6:0 "Heben Sie das Gesundheitssystem, die Sicherheit am Arbeitsplatz oder die soziale Sicherheit auf Stufe 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Moderne Streitkräfte"
 ve_imperialism_age_obj_desc_7:0 "Stellen Sie mindestens 50 % Scharmützel- oder Grabeninfanterie und 10 % mobile Artillerie in der Armee auf."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Massenpolitik"
 ve_great_wars_age_obj_desc_1:0 "Einführung des allgemeinen Wahlrechts oder einer Ratsrepublik oder Aufrechterhaltung der Legitimität als Parlaments- oder Präsidialrepublik."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Sozialstaat"
 ve_great_wars_age_obj_desc_2:0 "Unterhält mindestens zwei Institutionen der Stufe 3: Gesundheit, soziale Sicherheit, Arbeitssicherheit und Schulen."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Elektrifizierte Wirtschaft"
 ve_great_wars_age_obj_desc_3:0 "Besitzen Sie 1 Kraftwerksstufe, wenn Sie weniger als 10 Millionen Einwohner haben, oder 5 Kraftwerksstufen, andernfalls."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Öl und Motoren"
 ve_great_wars_age_obj_desc_4:0 "Besitzen Sie eine Bohrinsel oder mindestens 5 Motorenindustriestufen."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Modernes Militär"
 ve_great_wars_age_obj_desc_5:0 "Stellen Sie in der Armee mindestens 50 % Schützengraben- oder Truppinfanterie und 15 % Schrapnellartillerie auf."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Gesamte Kriegskapazität"
 ve_great_wars_age_obj_desc_6:0 "Unterhalten Sie 40 Armeeeinheiten und mindestens 5 Ebenen der Rüstungsindustrie oder 3 Munitionsfabriken."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Welteinfluss"
 ve_great_wars_age_obj_desc_7:0 "Eine Groß- oder Großmacht sein, einen Machtblock anführen oder mindestens 6 erklärte Interessen beibehalten."

 ve_age_splendor_tt:0 "#title Era Momentum#!\nAktueller Bestand: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nErfüllte Ziele: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nIdeengruppen (aktuelles Alter, max. +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nMonatliche Änderung: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nIn diesem Alter verschiedene Ziele erreicht: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nIn diesem Alter gekaufte Belohnungen: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nNächste Belohnungskosten: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Wie Ideengruppen beitragen#!\nJede passende Gruppe der Stufe IV gibt #P +1#! pro Monat nur, solange das zugewiesene Alter aktuell ist. Die Zeile oben zeigt die aktive Summe, begrenzt auf #Y +2#!.\n#P Alter 1#!: Industrie, Handel, Verwaltung und akademische Gruppen\n#P Alter 2#!: Ressourcen, Gesellschaft, Diplomatie, nationalistische/reformistische und koloniale Gruppen\n#P Alter 3#!: Militär- und Kriegswirtschaftsgruppen\n\nJedes aktuell erfüllte Ziel gewährt auch #P +1#! Era Momentum pro Monat. Ideengruppen haben keinen Einfluss auf den Zielabschluss oder dessen einmaligen #P +50#! Belohnung.\n\nBelohnungskosten eskalieren mit jedem Zeitalter: #Y 200, 300, 400, 500#!, dann #Y 600#! für jede spätere Belohnung. Momentum und die Kostenleiter werden zurückgesetzt, wenn ein neues Zeitalter beginnt."
 ve_age_obj_efct_tt:0 "Bei Zufriedenheit: #P +1 Ära-Momentum pro Monat#!\nErster Abschluss dieses Zeitalters: #P +50 Ära-Momentum#!"
 splendor_default_bonus:0 "Verfügen über mindestens #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Era Momentum"
 ve_age_1_bonus_10_tt:0 "Erfordert eine norditalienische oder süditalienische Primärkultur."
 ve_age_2_bonus_10_tt:0 "Erfordert Österreich."
 ve_age_3_bonus_10_tt:0 "Erfordert Großbritannien."
 ve_age_1_bonus_11_tt:0 "Erfordert eine norddeutsche oder süddeutsche Primärkultur."
 ve_age_2_bonus_11_tt:0 "Erfordert Russland."
 ve_age_3_bonus_11_tt:0 "Erfordert Qing."
 ve_age_1_bonus_12_tt:0 "Erfordert die Niederlande."
 ve_age_2_bonus_12_tt:0 "Erfordert Belgien."
 ve_age_3_bonus_12_tt:0 "Erfordert Frankreich."
 ve_age_1_bonus_13_tt:0 "Erfordert das Osmanische Reich."
 ve_age_2_bonus_13_tt:0 "Erfordert die USA."
 ve_age_3_bonus_13_tt:0 "Erfordert Japan."
