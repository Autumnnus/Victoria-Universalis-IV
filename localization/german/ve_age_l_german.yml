l_german:
 ve_splendor:0 "#tooltippable_name Epochenschwung: "
 ve_age_of_victoria_title:0 "Industrie und Nationen"
 ve_age_of_victoria_desc:0 "Alte Ordnungen sehen sich Fabriken, Eisenbahnen, alphabetisierten Öffentlichkeiten und dem modernen Staat gegenüber. Das Momentum gehört jenen Ländern, die überkommene Institutionen in dauerhafte nationale Kapazität umwandeln."
 ve_imperialism_age_title:0 "Imperium und Massengesellschaft"
 ve_imperialism_age_desc:0 "Die Industrie greift über Kontinente aus, während Bildung, öffentliche Institutionen und organisierte Armeen die Massengesellschaft neu formen. Großmächte können im Ausland expandieren; kleinere Staaten können durch Souveränität und innere Entwicklung gedeihen."
 ve_great_wars_age_title:0 "Massenpolitik und totaler Krieg"
 ve_great_wars_age_desc:0 "Elektrizität, Öl, Massenbeteiligung, Wohlfahrt und industrielle Kriegführung transformieren das Verhältnis zwischen Staat und Gesellschaft. Das Überleben hängt nun ebenso von Institutionen wie von Armeen ab."
 ve_age_notify_option:0 "Ein neues Zeitalter bricht an."
 ve_victorian_age_icon_p_tt:0 "#P Industrie und Nationen (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Industrie und Nationen (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Imperium und Massengesellschaft (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Imperium und Massengesellschaft (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Massenpolitik und totaler Krieg (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Massenpolitik und totaler Krieg (1906–1936)"

 ve_golden_age:0 "Goldenes Zeitalter"
 ve_golden_age_industrial:0 "Industrielles goldenes Zeitalter"
 ve_golden_age_cultural:0 "Kulturelles goldenes Zeitalter"
 ve_golden_age_strategic:0 "Strategisches goldenes Zeitalter"
 ve_golden_age_tt:0 "Verfügbar ab dem Jahr #v 1845#! nach Abschluss von #v 5 verschiedenen Zielen#! im aktuellen Zeitalter. Ein Land kann während des gesamten Spiels nur ein goldenes Zeitalter wählen; dessen Effekte halten #v 15 Jahre#! an."
 ve_golden_age_requirement_unused:0 "In dieser Kampagne wurde noch kein goldenes Zeitalter gewählt."
 ve_golden_age_requirement_year:0 "Erfordert das Jahr #v 1845#! oder später."
 ve_golden_age_requirement_objectives:0 "Schließe mindestens #v 5 verschiedene Ziele#! im aktuellen Zeitalter ab."
 ve_golden_age_industrial_tt:0 "#header Industrielles goldenes Zeitalter#!\nFür #Y 15 Jahre#!: #P +10% Fertigungs-Durchsatz#! und #P +10% Ressourcen-Entdeckungschance#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Kulturelles goldenes Zeitalter#!\nFür #Y 15 Jahre#!: #P +5% Bildungszugang#! und #P +10% Prestige#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Strategisches goldenes Zeitalter#!\nFür #Y 15 Jahre#!: #P +5% Armee-Offensive#! und #P -10% Kriegsmüdigkeit durch Verluste#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Zeitalter-Ziele"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Industrieller Aufschwung"
 ve_victorian_age_obj_desc_1:0 "Senkt den Bauernanteil unter 40%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Alte Ordnung beenden"
 ve_victorian_age_obj_desc_2:0 "Verbietet Sklaverei und schafft die Leibeigenschaft ab."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Funktioneller Staat"
 ve_victorian_age_obj_desc_3:0 "Erhalte mindestens 70 Legitimität und ein nicht-negatives Bürokratiesaldo ohne drohende Knappheit aufrecht."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Gebildete Öffentlichkeit"
 ve_victorian_age_obj_desc_4:0 "Erreicht 50% Alphabetisierung oder Schulen der Stufe 3."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Integrierter Markt"
 ve_victorian_age_obj_desc_5:0 "Besitzt mindestens 3 Eisenbahn-Stufen bei einer Bevölkerung unter 5 Millionen, andernfalls 6 Eisenbahn-Stufen."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Nationales Erwachen"
 ve_victorian_age_obj_desc_6:0 "Seid unabhängig mit mindestens 65 Legitimität und weniger als 5% Aufruhr im Land."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Globale Reichweite"
 ve_victorian_age_obj_desc_7:0 "Seid eine Großmacht oder eine Macht höheren Ranges, oder erhaltet mindestens 5 erklärte Interessen aufrecht."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Industrielle Macht"
 ve_imperialism_age_obj_desc_1:0 "Erreicht ein BIP von £100 Millionen oder senkt den Bauernanteil unter 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Massenbildung"
 ve_imperialism_age_obj_desc_2:0 "Erreicht 65% Alphabetisierung oder Stufe 4 bei Schulen."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Imperium oder Souveränität"
 ve_imperialism_age_obj_desc_3:0 "Besitzt mindestens 2 Klientelländer oder bleibt unabhängig und anerkannt."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Globaler Handel"
 ve_imperialism_age_obj_desc_4:0 "Besitzt bei unter 10 Millionen Bevölkerung 2 Hafen-Stufen, andernfalls 10 Hafen-Stufen, oder haltet 5 erklärte Interessen aufrecht."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Nationsbildung"
 ve_imperialism_age_obj_desc_5:0 "Haltet mindestens 60 Legitimität und weniger als 5% Aufruhr im Staat aufrecht."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header Die soziale Frage"
 ve_imperialism_age_obj_desc_6:0 "Erhöht Gesundheitssystem, Arbeitssicherheit oder Sozialhilfe auf Stufe 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Moderne Streitkräfte"
 ve_imperialism_age_obj_desc_7:0 "Stellt in der Armee mindestens 50% Plänkler- oder Schützeninfanterie und 10% mobile Artillerie auf."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Massenpolitik"
 ve_great_wars_age_obj_desc_1:0 "Beschließt das Allgemeine Wahlrecht oder die Räterepublik, oder haltet als Parlamentarische oder Präsidialrepublik 75 Legitimität aufrecht."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Sozialstaat"
 ve_great_wars_age_obj_desc_2:0 "Haltet unter Gesundheit, Sozialhilfe, Arbeitssicherheit und Schulen mindestens zwei Institutionen auf Stufe 3."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Elektrifizierte Wirtschaft"
 ve_great_wars_age_obj_desc_3:0 "Besitzt bei unter 10 Millionen Bevölkerung 1 Kraftwerk-Stufe oder andernfalls 5 Kraftwerk-Stufen."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Öl und Motoren"
 ve_great_wars_age_obj_desc_4:0 "Besitzt eine Ölförderanlage oder mindestens 5 Motorindustrie-Stufen."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Modernes Militär"
 ve_great_wars_age_obj_desc_5:0 "Stellt in der Armee mindestens 50% Schützen- oder Sturminfanterie und 15% Schrapnellartillerie auf."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Kapazität für totalen Krieg"
 ve_great_wars_age_obj_desc_6:0 "Haltet 40 Armeeeinheiten und mindestens 5 Rüstungsindustrie- oder 3 Munitionsfabriks-Stufen aufrecht."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Welteinfluss"
 ve_great_wars_age_obj_desc_7:0 "Seid eine Großmacht, führt einen Machtblock an oder haltet mindestens 6 erklärte Interessen aufrecht."

 ve_age_splendor_tt:0 "#title Epochenschwung#!\nAktueller Bestand: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nZufriedene Ziele: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nDoktringruppen (aktuelles Zeitalter, max. +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nMonatliche Änderung: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nIn diesem Zeitalter abgeschlossene verschiedene Ziele: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nIn diesem Zeitalter gekaufte Belohnungen: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nKosten der nächsten Belohnung: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Wie Doktringruppen beitragen#!\nJede passende Gruppe der Stufe IV gewährt #P +1#! pro Monat, jedoch nur, solange ihr zugewiesenes Zeitalter aktiv ist. Die Zeile oben zeigt die aktive Summe, gedeckelt auf #Y +2#!.\n#P Zeitalter 1#!: Industrie-, Handels-, Verwaltungs- und akademische Gruppen\n#P Zeitalter 2#!: Ressourcen-, Gesellschafts-, Diplomatie-, nationalistische/reformistische und koloniale Gruppen\n#P Zeitalter 3#!: Militär- und Kriegswirtschaftsgruppen\n\nJedes aktuell zufriedene Ziel gewährt zudem #P +1#! Epochenschwung pro Monat. Doktringruppen verändern weder den Zielabschluss noch dessen einmalige Belohnung von #P +50#!.\n\nDie Belohnungskosten steigen innerhalb jedes Zeitalters an: #Y 200, 300, 400, 500#!, danach #Y 600#! für jede weitere Belohnung. Schwung und Kostenskala werden bei Beginn eines neuen Zeitalters zurückgesetzt."
 ve_age_obj_efct_tt:0 "Solange zufrieden: #P +1 Epochenschwung pro Monat#!\nErster Abschluss in diesem Zeitalter: #P +50 Epochenschwung#!"
 splendor_default_bonus:0 "Habt mindestens #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Epochenschwung"
 ve_age_1_bonus_10_tt:0 "Erfordert eine norditalienische oder süditalienische Hauptkultur."
 ve_age_2_bonus_10_tt:0 "Erfordert Österreich."
 ve_age_3_bonus_10_tt:0 "Erfordert Großbritannien."
 ve_age_1_bonus_11_tt:0 "Erfordert eine norddeutsche oder süddeutsche Hauptkultur."
 ve_age_2_bonus_11_tt:0 "Erfordert Russland."
 ve_age_3_bonus_11_tt:0 "Erfordert Qing."
 ve_age_1_bonus_12_tt:0 "Erfordert die Niederlande."
 ve_age_2_bonus_12_tt:0 "Erfordert Belgien."
 ve_age_3_bonus_12_tt:0 "Erfordert Frankreich."
 ve_age_1_bonus_13_tt:0 "Setzt das Osmanische Reich voraus."
 ve_age_2_bonus_13_tt:0 "Setzt die Vereinigten Staaten voraus."
 ve_age_3_bonus_13_tt:0 "Setzt Japan voraus."
