 ve_era_crossroads.1.t:0 "Steam und der Staat"
 ve_era_crossroads.1.d:0 "Eisenbahnen, Schulen, Reformer und Administratoren bieten konkurrierende Darstellungen der modernen Nation. Die Regierung muss entscheiden, welches Verhältnis zwischen Gesellschaft und Staat das erste Zeitalter gestalten wird."
 ve_era_crossroads.1.a:0 "Binden Sie das Land über ein Steam-Netzwerk zusammen."
 ve_era_crossroads.1.b:0 "Bauen Sie eine gebildete Staatsbürgerschaft auf."
 ve_era_crossroads.1.c:0 "Konsolidieren Sie einen Verwaltungsstaat."
 ve_era_crossroads.1.d.option:0 "Dieses Zeitalter braucht keinen nationalen Scheideweg."
 ve_era_crossroads.1.a.tt:0 "Startet die #Y Steam-Netzwerk#! Route (Schwerpunkt: Industrialisierung, Bauernmigration und Eisenbahnen).\n• Ziel: 60 erreichen Fortschritt zu gewinnen #P +50 Ära-Momentum#!.\n• Fortschrittsgeschwindigkeit: Erhält +1 Basismonatsfortschritt, plus +1 zusätzlich für jeden abgeschlossenen Anker des 1. Zeitalters (Bauernanteil und Eisenbahnziele).\n• Doktrin-Synergie: Mit #Y Industrialist IV#! or #Y Infrastruktur IV#! Schaltet günstigere Meilensteinentscheidungen frei (5 Einblicke statt 10)."
 ve_era_crossroads.1.b.tt:0 "Startet die #Y Gebildete Staatsbürgerschaft#! Route (Schwerpunkt: Bildung, Alphabetisierung und freie Arbeit).\n• Ziel: 60 erreichen Fortschritt zu gewinnen #P +50 Ära-Momentum#!.\n• Fortschrittsgeschwindigkeit: Erhält +1 monatlichen Grundfortschritt, plus +1 zusätzlich für jeden abgeschlossenen Anker des 1. Zeitalters (Ziele „Freie Arbeit“ und „Alphabetisierung/Schulen“).\n• Synergie der Lehre: Haben #Y Akademische IV#! or #Y Reformist IV#! Schaltet günstigere Meilensteinentscheidungen frei (5 Einblicke statt 10)."
 ve_era_crossroads.1.c.tt:0 "Startet die #Y Verwaltungsstaat#! Route (Schwerpunkt: Regierungslegitimität, Bürokratie und Stabilität).\n• Ziel: Erreiche 60 Fortschritt, um #P +50 Ära-Momentum zu erhalten#!.\n• Fortschrittsgeschwindigkeit: Erhält +1 Basismonatsfortschritt, plus +1 zusätzlich für jeden abgeschlossenen Anker des Zeitalters 1 (Legitimität/Bürokratie und unabhängige Stabilitätsziele).\n• Doktrin-Synergie: Haben #Y Bürokratische IV#! or #Y Parlamentarisches IV#! Schaltet günstigere Meilensteinentscheidungen frei (5 Einblicke statt 10)."
 ve_era_crossroads.2.t:0 "Imperium oder Massengesellschaft?"
 ve_era_crossroads.2.d:0 "Der Staat kann die Reichweite im Ausland, das Wohlergehen der Bevölkerung und die nationale Integration nicht länger als getrennte Fragen behandeln. Einer von ihnen wird definieren, wie die anderen verfolgt werden."
 ve_era_crossroads.2.a:0 "Blicken Sie auf den imperialen Horizont."
 ve_era_crossroads.2.b:0 "Errichten Sie ein System der Massenfürsorge."
 ve_era_crossroads.2.c:0 "Schöpfen Sie eine integrierte Nation."
 ve_era_crossroads.2.d.option:0 "Lassen Sie das Zeitalter seine eigene Richtung finden."
 ve_era_crossroads.2.a.tt:0 "Startet die #Y Imperial Horizon#! Route (Fokus: Diplomatische Macht und Überseereichweite).\n• Ziel: Erreiche 60 Fortschritt, um zu gewinnen #P +50 Ära-Momentum#!.\n• Fortschrittsgeschwindigkeit: Erhält +1 Basismonatsfortschritt, plus +1 zusätzlich für jeden abgeschlossenen Anker des Zeitalters 2 (Anerkannte Staatskapazität und Häfen/Interessenziele).\n• Doktrin-Synergie: Haben #Y Diplomatic IV#! oder #Y Colonial IV#! schaltet günstigere Meilensteinentscheidungen frei (5 Einsicht statt 10)."
 ve_era_crossroads.2.b.tt:0 "Startet die #Y Massenfürsorge#! Route (Fokus: Soziale Institutionen, Gesundheitswesen und Bildung).\n• Ziel: 60 erreichen Fortschritt zu gewinnen #P +50 Ära-Momentum#!.\n• Fortschrittsgeschwindigkeit: Erhält +1 monatlichen Grundfortschritt, plus +1 zusätzlich für jeden abgeschlossenen Anker im Alter von 2 (Ziele für Lese- und Schreibkompetenz/Schulen und soziale Einrichtungen).\n• Synergie der Lehre: Haben #Y Wohlfahrt IV#! oder #Y Reformist IV#! schaltet günstigere Meilensteinentscheidungen frei (5 Einsicht statt 10)."
 ve_era_crossroads.2.c.tt:0 "Startet die #Y Integrierte Nation#! Route (Fokus: Wirtschaftstransformation und interne Stabilität).\n• Ziel: 60 erreichen Fortschritt zu gewinnen #P +50 Ära-Momentum#!.\n• Fortschrittsgeschwindigkeit: Erhält +1 monatlichen Basisfortschritt, plus +1 zusätzlich für jeden abgeschlossenen Anker des Zeitalters 2 (Ziele „Wirtschaftliche Transformation“ und „Low-Turmoil-Legitimität“).\n• Doktrin-Synergie: Haben #Y Nationalistischer IV#! oder #Y Labour IV#! schaltet günstigere Meilensteinentscheidungen frei (5 Einsichten statt 10)."
 ve_era_crossroads.3.t:0 "Die mobilisierte Gesellschaft"
 ve_era_crossroads.3.d:0 "Massenpolitik, strategische Führung und industrielle Mobilisierung erreichen jetzt jede Institution. Das letzte Zeitalter erfordert eine Entscheidung darüber, welche Form der Mobilisierung die Nation definieren wird."
 ve_era_crossroads.3.a:0 "Bekennen Sie sich zu einer sozialen Republik."
 ve_era_crossroads.3.b:0 "Stellen Sie die Nation unter strategisches Kommando."
 ve_era_crossroads.3.c:0 "Bauen Sie eine Arsenal-Gesellschaft auf."
 ve_era_crossroads.3.d.option:0 "Lehnen Sie ein dauerhaftes Mobilisierungsprojekt ab."
 ve_era_crossroads.3.a.tt:0 "Startet die #Y Soziale Republik#! Route (Fokus: Massenpolitik und soziale Institutionen).\n• Ziel: 60 erreichen Fortschritt zu gewinnen #P +50 Ära-Momentum#!.\n• Fortschrittsgeschwindigkeit: Erhält +1 Basismonatsfortschritt, plus +1 zusätzlich für jeden abgeschlossenen Anker des Zeitalters 3 (Ziele „Massenpolitik“ und „reife soziale Institutionen“).\n• Doktrin-Synergie: Haben #Y Parlamentarischer IV#! or #Y Wohlfahrt IV#! Schaltet günstigere Meilensteinentscheidungen frei (5 Einblicke statt 10)."
 ve_era_crossroads.3.b.tt:0 "Startet die #Y Strategisches Kommando#! Route (Schwerpunkt: Militärische Modernisierung und globale Machtreichweite).\n• Ziel: Erreiche 60 Fortschritte, um zu gewinnen #P +50 Ära-Momentum#!.\n• Fortschrittsgeschwindigkeit: Erhält +1 monatlichen Grundfortschritt, plus +1 zusätzlich für jeden abgeschlossenen Anker des Zeitalters 3 (Ziele „Modern Force Composition“ und „Great Power Reach“).\n• Doktrin-Synergie: Haben #Y Berufsarmee IV#! or #Y Defensive IV#! Schaltet günstigere Meilensteinentscheidungen frei (5 Einblicke statt 10)."
 ve_era_crossroads.3.c.tt:0 "Startet die #Y Arsenal-Gesellschaft#! Route (Schwerpunkt: Industrielle Kriegswirtschaft und Massenrüstung).\n• Ziel: Erreiche 60 Fortschritt, um zu gewinnen #P +50 Ära-Momentum#!.\n• Fortschrittsgeschwindigkeit: Erhält +1 Basismonatsfortschritt, plus +1 zusätzlich für jeden abgeschlossenen Anker des Zeitalters 3 (Ziele „Elektroindustrie“ und „Massenrüstung“).\n• Doktrin-Synergie: Haben #Y Kriegswirtschaft IV#! or #Y Massenrekrutierung IV#! Schaltet günstigere Meilensteinentscheidungen frei (5 Einblicke statt 10)."

 ve_era_crossroads_decline_tt:0 "Verliert das aktuelle Age's Era Crossroads dauerhaft. Auch Personen ab einem höheren Alter sind weiterhin berechtigt."

 ve_era_crossroads.10.t:0 "Ein nationaler Kalender"
 ve_era_crossroads.10.d:0 "Landesämter, Privatverbände und Ministerien verfolgen die gewählte Transformation in unterschiedlichem Tempo. Ein gemeinsamer Kalender könnte vereinzelte Errungenschaften in ein nationales Programm verwandeln, aber die Koordinierung selbst erfordert kaum administrative Aufmerksamkeit."
 ve_era_crossroads.10.a:0 "Finanzieren Sie eine zentrale Koordinierungskommission."
 ve_era_crossroads.10.b:0 "Lassen Sie die Institutionen ihren eigenen Zeitplan aushandeln."
 ve_era_crossroads.10.c:0 "Nutzen Sie die Netzwerke, die durch unsere etablierten Lehren aufgebaut wurden."
 ve_era_crossroads.10.a.tt:0 "Verbringen #N 10 Nationale Einblicke#! zu gewinnen #P +3 Crossroads-Fortschritt#!."
 ve_era_crossroads.10.b.tt:0 "Gibt keine Ressourcen aus und nimmt keine unmittelbare Änderung am Crossroads-Fortschritt vor."
 ve_era_crossroads.10.c.tt:0 "Erfordert eine Routen-taugliche Ideengruppe der Stufe IV. Gib #N 5 National Insight aus#! um  #P +3 Crossroads-Fortschritt zu erhalten#!."

 ve_era_crossroads.11.t:0 "Wer wird den Fortschritt steuern?"
 ve_era_crossroads.11.d:0 "Das Programm ist zu folgenreich geworden, um eine lockere Vereinbarung zu bleiben. Minister beanspruchen nationale Autorität, Experten fordern Isolation von der Politik und lokale Akteure warnen, dass starre Befehle die Institutionen zerstören werden, die den Fortschritt ermöglicht haben."
 ve_era_crossroads.11.a:0 "Geben Sie dem Zentrum einen klaren Koordinierungsauftrag."
 ve_era_crossroads.11.b:0 "Bewahren Sie das ausgehandelte Gleichgewicht der Autoritäten."
 ve_era_crossroads.11.c:0 "Überlassen Sie die Koordinierung unseren Lehrinstitutionen."
 ve_era_crossroads.11.a.tt:0 "Verbringen #N 10 National Insight#! um #P +3 Crossroads-Fortschritt#!zu erhalten."
 ve_era_crossroads.11.b.tt:0 "Geben Sie keine Ressourcen aus und nehmen Sie keine sofortige Änderung am Crossroads-Fortschritt vor."
 ve_era_crossroads.11.c.tt:0 "Erfordert eine Routen-Fit-Ideengruppe der Stufe IV. Gib #N 5 National Insight aus#! zu gewinnen #P +3 Crossroads-Fortschritt#!."

 ve_era_crossroads.40.t:0 "Dampf und der Staat"
 ve_era_crossroads.40.d:0 "Der gewählte Kurs ist nicht länger eine Aneinanderreihung isolierter Erfolge. Infrastruktur, Staatsbürgerschaft oder Verwaltung bilden nun ein dauerhaftes nationales Programm, durch das der Staat die Veränderungen des Zeitalters verstehen und steuern kann."
 ve_era_crossroads.40.a:0 "Das erste Zeitalter hat seine institutionelle Form gefunden."
 ve_era_crossroads.40.a.tt:0 "Das abgeschlossene Era Crossroads wurde gewährt #P +50 Ära-Momentum#!. Es wurde weder ein Ziel erreicht noch die Teilnahmeberechtigung für das Goldene Zeitalter geändert."

 ve_era_crossroads.20.t:0 "Die Reichweite des Staates"
 ve_era_crossroads.20.d:0 "Das gewählte Programm erstreckt sich nun über die Institutionen hinaus, die es ursprünglich gesponsert haben. Häfen, Schulen, Ämter und lokale Behörden sind sich nicht einig darüber, wo die nationale Koordinierung enden und der lokale Ermessensspielraum beginnen soll."
 ve_era_crossroads.20.a:0 "Legen Sie die Verpflichtungen des Staates durch eine zentrale Kommission fest."
 ve_era_crossroads.20.b:0 "Lassen Sie zu, dass institutionelle Grenzen durch Verhandlungen entstehen."
 ve_era_crossroads.20.c:0 "Koordinieren Sie sich über unsere etablierten Lehrnetzwerke."
 ve_era_crossroads.20.a.tt:0 "Ausgeben #N 10 Nationale Einblicke#! zu gewinnen #P +3 Crossroads-Fortschritt#!."
 ve_era_crossroads.20.b.tt:0 "Gibt keine Ressourcen aus und nimmt keine unmittelbare Änderung am Crossroads-Fortschritt vor."
 ve_era_crossroads.20.c.tt:0 "Erfordert eine Routen-taugliche Ideengruppe der Stufe IV. Gib #N 5 National Insight aus#! um  #P +3 Crossroads-Fortschritt zu erhalten#!."

 ve_era_crossroads.21.t:0 "Der Preis der Integration"
 ve_era_crossroads.21.d:0 "Externe Reichweite, soziale Versorgung und nationale Disziplin schaffen Gewinner, Kosten und neue Erwartungen. Das Programm kann nur Bestand haben, wenn der Staat entscheidet, wie diese Lasten verteilt werden."
 ve_era_crossroads.21.a:0 "Schaffen Sie ein nationales Gremium, um die Anpassung zu verwalten."
 ve_era_crossroads.21.b:0 "Verteilen Sie die Last durch ausgehandelte Kompromisse."
 ve_era_crossroads.21.c:0 "Lassen Sie unsere Lehrinstitutionen die Belastung absorbieren."
 ve_era_crossroads.21.a.tt:0 "Verbringen #N 10 National Insight#! um #P +3 Crossroads-Fortschritt#!zu erhalten."
 ve_era_crossroads.21.b.tt:0 "Geben Sie keine Ressourcen aus und nehmen Sie keine sofortige Änderung am Crossroads-Fortschritt vor."
 ve_era_crossroads.21.c.tt:0 "Erfordert eine Routen-Fit-Ideengruppe der Stufe IV. Gib #N 5 National Insight aus#! zu gewinnen #P +3 Crossroads-Fortschritt#!."

 ve_era_crossroads.41.t:0 "Imperium und Massengesellschaft"
 ve_era_crossroads.41.d:0 "Die gewählte Regelung verbindet nun die Außenwirkung des Staates, gesellschaftliche Verpflichtungen und nationale Institutionen. Was als strategische Ausrichtung begann, hat sich zu einem dauerhaften Rahmen für die Steuerung der Massengesellschaft entwickelt."
 ve_era_crossroads.41.a:0 "Das zweite Zeitalter hat seine Siedlung gefunden."
 ve_era_crossroads.41.a.tt:0 "Die abgeschlossene Ära-Kreuzung wurde gewährt #P +50 Ära-Momentum#!. Es wurde weder ein Ziel erreicht noch die Teilnahmeberechtigung für das Goldene Zeitalter geändert."

 ve_era_crossroads.30.t:0 "Die Nation ist zur Pflicht aufgerufen"
 ve_era_crossroads.30.d:0 "Bürgern, Kommandeuren, Arbeitern und Administratoren werden durch das gewählte Programm neue Pflichten übertragen. Solange diese Pflichten nicht einander lesbar gemacht werden, wird die Mobilisierung eine Ansammlung konkurrierender Forderungen bleiben."
 ve_era_crossroads.30.a:0 "Kodifizieren Sie die nationalen Pflichten durch eine zentrale Kommission."
 ve_era_crossroads.30.b:0 "Lassen Sie die Institutionen ihre Verantwortlichkeiten aushandeln."
 ve_era_crossroads.30.c:0 "Nutzen Sie unsere Lehrorganisationen, um Ihre Aufgaben zu koordinieren."
 ve_era_crossroads.30.a.tt:0 "Ausgeben #N 10 Nationale Einblicke#! zu gewinnen #P +3 Crossroads-Fortschritt#!."
 ve_era_crossroads.30.b.tt:0 "Gibt keine Ressourcen aus und nimmt keine unmittelbare Änderung am Crossroads-Fortschritt vor."
 ve_era_crossroads.30.c.tt:0 "Erfordert eine Routen-taugliche Ideengruppe der Stufe IV. Gib #N 5 National Insight aus#! um  #P +3 Crossroads-Fortschritt zu erhalten#!."

 ve_era_crossroads.31.t:0 "Ein permanenter Notfall"
 ve_era_crossroads.31.d:0 "Die Maschinerie, die für Massenbeteiligung, strategische Bereitschaft oder industrielle Mobilisierung gebaut wurde, wird dauerhaft. Der Staat muss entscheiden, wie er seine Kapazitäten erhalten kann, ohne zuzulassen, dass die Notdisziplin das normale nationale Leben verschlingt."
 ve_era_crossroads.31.a:0 "Definieren Sie dauerhafte Grenzwerte durch eine nationale Überprüfung."
 ve_era_crossroads.31.b:0 "Halten Sie die Abwicklung bewusst flexibel."
 ve_era_crossroads.31.c:0 "Verlassen Sie sich auf Lehrinstitutionen, um die Maschinerie einzudämmen."
 ve_era_crossroads.31.a.tt:0 "Verbringen #N 10 National Insight#! um #P +3 Crossroads-Fortschritt#!zu erhalten."
 ve_era_crossroads.31.b.tt:0 "Geben Sie keine Ressourcen aus und nehmen Sie keine sofortige Änderung am Crossroads-Fortschritt vor."
 ve_era_crossroads.31.c.tt:0 "Erfordert eine Routen-Fit-Ideengruppe der Stufe IV. Gib #N 5 National Insight aus#! zu gewinnen #P +3 Crossroads-Fortschritt#!."

 ve_era_crossroads.42.t:0 "Die mobilisierte Gesellschaft"
 ve_era_crossroads.42.d:0 "Staatsbürgerschaft, Befehlsgewalt und industrielle Kapazität bilden nun eine dauerhafte nationale Regelung. Die Mobilisierungsinstitutionen wurden zu einem Teil der normalen Regierung gemacht und nicht als improvisierte Antworten auf jede neue Krise belassen."
 ve_era_crossroads.42.a:0 "Das letzte Zeitalter hat seine nationale Form gefunden."
 ve_era_crossroads.42.a.tt:0 "Der abgeschlossene Ära-Kreuzungsweg gewährt #P +50 Ära-Momentum#!. Es wurde weder ein Ziel erreicht noch die Teilnahmeberechtigung für das Goldene Zeitalter geändert."
