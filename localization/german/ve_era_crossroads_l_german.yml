 ve_era_crossroads.1.t:0 "Dampf und Staat"
 ve_era_crossroads.1.d:0 "Eisenbahnen, Schulen, Reformer und Administratoren bieten konkurrierende Entwürfe der modernen Nation an. Die Regierung muss entscheiden, welches Verhältnis zwischen Gesellschaft und Staat das erste Zeitalter prägen wird."
 ve_era_crossroads.1.a:0 "Verbindet das Land durch ein Dampfnetz."
 ve_era_crossroads.1.b:0 "Erbaut eine gebildete Bürgerschaft."
 ve_era_crossroads.1.c:0 "Konsolidiert einen Verwaltungsstaat."
 ve_era_crossroads.1.d.option:0 "Dieses Zeitalter benötigt keinen nationalen Scheideweg."
 ve_era_crossroads.1.a.tt:0 "Startet den Kurs #Y Dampfnetz#! (Fokus: Industrialisierung, Bauernmigration & Eisenbahnen).\n• Ziel: Erreiche 60 Fortschritt, um #P +50 Epochenschwung#! zu erhalten.\n• Fortschrittsgeschwindigkeit: Gewährt +1 monatlichen Basisfortschritt sowie +1 extra für jeden abgeschlossenen Zeitalter-1-Anker (Bauernanteil- und Eisenbahnziele).\n• Doktrinsynergie: Der Besitz von #Y Industrielle IV#! oder #Y Infrastruktur IV#! schaltet günstigere Meilensteinentscheidungen frei (5 Einsicht statt 10)."
 ve_era_crossroads.1.b.tt:0 "Startet den Kurs #Y Gebildete Bürgerschaft#! (Fokus: Bildung, Alphabetisierung & freie Arbeit).\n• Ziel: Erreiche 60 Fortschritt, um #P +50 Epochenschwung#! zu erhalten.\n• Fortschrittsgeschwindigkeit: Gewährt +1 monatlichen Basisfortschritt sowie +1 extra für jeden abgeschlossenen Zeitalter-1-Anker (Ziele für freie Arbeit und Alphabetisierung/Schulen).\n• Doktrinsynergie: Der Besitz von #Y Akademisch IV#! oder #Y Reformistisch IV#! schaltet günstigere Meilensteinentscheidungen frei (5 Einsicht statt 10)."
 ve_era_crossroads.1.c.tt:0 "Startet den Kurs #Y Verwaltungsstaat#! (Fokus: Regierungslegitimität, Bürokratie & Stabilität).\n• Ziel: Erreiche 60 Fortschritt, um #P +50 Epochenschwung#! zu erhalten.\n• Fortschrittsgeschwindigkeit: Gewährt +1 monatlichen Basisfortschritt sowie +1 extra für jeden abgeschlossenen Zeitalter-1-Anker (Ziele für Legitimität/Bürokratie und unabhängige Stabilität).\n• Doktrinsynergie: Der Besitz von #Y Bürokratisch IV#! oder #Y Parlamentarisch IV#! schaltet günstigere Meilensteinentscheidungen frei (5 Einsicht statt 10)."
 ve_era_crossroads.2.t:0 "Reich oder Massengesellschaft?"
 ve_era_crossroads.2.d:0 "Der Staat kann überseeische Reichweite, die Wohlfahrt des Volkes und nationale Eingliederung nicht länger als getrennte Fragen betrachten. Eine davon wird bestimmen, wie die anderen verfolgt werden."
 ve_era_crossroads.2.a:0 "Blickt zum imperialen Horizont."
 ve_era_crossroads.2.b:0 "Errichtet ein System der Massenwohlfahrt."
 ve_era_crossroads.2.c:0 "Schmiedet eine eingegliederte Nation."
 ve_era_crossroads.2.d.option:0 "Lasst das Zeitalter seine eigene Richtung finden."
 ve_era_crossroads.2.a.tt:0 "Startet den Kurs #Y Imperialer Horizont#! (Fokus: Diplomatische Macht & überseeische Reichweite).\n• Ziel: Erreiche 60 Fortschritt, um #P +50 Epochenschwung#! zu erhalten.\n• Fortschrittsgeschwindigkeit: Gewährt +1 monatlichen Basisfortschritt sowie +1 extra für jeden abgeschlossenen Zeitalter-2-Anker (Ziele für anerkannte Staatenkapazität und Häfen/Interessen).\n• Doktrinsynergie: Der Besitz von #Y Diplomatisch IV#! oder #Y Kolonial IV#! schaltet günstigere Meilensteinentscheidungen frei (5 Einsicht statt 10)."
 ve_era_crossroads.2.b.tt:0 "Startet den Kurs #Y Massenwohlfahrt#! (Fokus: Soziale Institutionen, Gesundheitswesen & Bildung).\n• Ziel: Erreiche 60 Fortschritt, um #P +50 Epochenschwung#! zu erhalten.\n• Fortschrittsgeschwindigkeit: Gewährt +1 monatlichen Basisfortschritt sowie +1 extra für jeden abgeschlossenen Zeitalter-2-Anker (Ziele für Alphabetisierung/Schulen und soziale Institutionen).\n• Doktrinsynergie: Der Besitz von #Y Wohlfahrt IV#! oder #Y Reformistisch IV#! schaltet günstigere Meilensteinentscheidungen frei (5 Einsicht statt 10)."
 ve_era_crossroads.2.c.tt:0 "Startet den Kurs #Y Eingegliederte Nation#! (Fokus: Wirtschaftliche Transformation & innere Stabilität).\n• Ziel: Erreiche 60 Fortschritt, um #P +50 Epochenschwung#! zu erhalten.\n• Fortschrittsgeschwindigkeit: Gewährt +1 monatlichen Basisfortschritt sowie +1 extra für jeden abgeschlossenen Zeitalter-2-Anker (Ziele für wirtschaftliche Transformation und Legitimität bei geringem Aufruhr).\n• Doktrinsynergie: Der Besitz von #Y Nationalistisch IV#! oder #Y Arbeit IV#! schaltet günstigere Meilensteinentscheidungen frei (5 Einsicht statt 10)."
 ve_era_crossroads.3.t:0 "Die mobilisierte Gesellschaft"
 ve_era_crossroads.3.d:0 "Massenpolitik, strategische Führung und industrielle Mobilisierung greifen nun in jede Institution. Das letzte Zeitalter verlangt eine Entscheidung darüber, welche Form der Mobilisierung die Nation prägen wird."
 ve_era_crossroads.3.a:0 "Einer Sozialrepublik verpflichten."
 ve_era_crossroads.3.b:0 "Die Nation unter strategischen Befehl stellen."
 ve_era_crossroads.3.c:0 "Eine Arsenalgesellschaft errichten."
 ve_era_crossroads.3.d.option:0 "Ein permanentes Mobilisierungsprojekt ablehnen."
 ve_era_crossroads.3.a.tt:0 "Startet den Kurs #Y Sozialrepublik#! (Fokus: Massenpolitik & soziale Institutionen).\n• Ziel: Erreicht 60 Fortschritt, um #P +50 Epochenschwung#! zu erhalten.\n• Fortschrittstempo: Gewährt +1 monatlichen Basisfortschritt sowie +1 extra für jeden abgeschlossenen Anker des Zeitalters 3 (Ziele „Massenpolitik“ und „Reife soziale Institutionen“).\n• Doktrinsynergie: Der Besitz von #Y Parlamentarisch IV#! oder #Y Wohlfahrt IV#! schaltet günstigere Meilenstein-Entscheidungen frei (5 Nationaleinsicht statt 10)."
 ve_era_crossroads.3.b.tt:0 "Startet den Kurs #Y Strategischer Befehl#! (Fokus: Militärische Modernisierung & globale Machtprojektion).\n• Ziel: Erreicht 60 Fortschritt, um #P +50 Epochenschwung#! zu erhalten.\n• Fortschrittstempo: Gewährt +1 monatlichen Basisfortschritt sowie +1 extra für jeden abgeschlossenen Anker des Zeitalters 3 (Ziele „Moderne Streitkräftezusammensetzung“ und „Großmacht-Reichweite“).\n• Doktrinsynergie: Der Besitz von #Y Berufsheer IV#! oder #Y Defensive IV#! schaltet günstigere Meilenstein-Entscheidungen frei (5 Nationaleinsicht statt 10)."
 ve_era_crossroads.3.c.tt:0 "Startet den Kurs #Y Arsenalgesellschaft#! (Fokus: Industrielle Kriegswirtschaft & Massenbewaffnung).\n• Ziel: Erreicht 60 Fortschritt, um #P +50 Epochenschwung#! zu erhalten.\n• Fortschrittstempo: Gewährt +1 monatlichen Basisfortschritt sowie +1 extra für jeden abgeschlossenen Anker des Zeitalters 3 (Ziele „Elektroindustrie“ und „Massenbewaffnung“).\n• Doktrinsynergie: Der Besitz von #Y Kriegswirtschaft IV#! oder #Y Massenaushebung IV#! schaltet günstigere Meilenstein-Entscheidungen frei (5 Nationaleinsicht statt 10)."

 ve_era_crossroads_decline_tt:0 "Lehnt den Epochen-Scheideweg des aktuellen Zeitalters dauerhaft ab. Spätere Zeitalter bleiben zulässig."

 ve_era_crossroads.10.t:0 "Ein nationaler Kalender"
 ve_era_crossroads.10.d:0 "Provinzialämter, private Vereinigungen und Ministerien verfolgen die gewählte Transformation mit unterschiedlicher Geschwindigkeit. Ein gemeinsamer Kalender könnte verstreute Errungenschaften in ein nationales Programm verwandeln, doch die Koordination selbst erfordert knappe administrative Aufmerksamkeit."
 ve_era_crossroads.10.a:0 "Eine zentrale Koordinierungskommission finanzieren."
 ve_era_crossroads.10.b:0 "Die Institutionen ihren Zeitplan selbst verhandeln lassen."
 ve_era_crossroads.10.c:0 "Die von unseren etablierten Doktrinen aufgebauten Netzwerke nutzen."
 ve_era_crossroads.10.a.tt:0 "Verbraucht #N 10 Nationaleinsicht#!, um #P +3 Scheideweg-Fortschritt#! zu erhalten."
 ve_era_crossroads.10.b.tt:0 "Verbraucht keine Ressource und nimmt keine unmittelbare Änderung am Scheideweg-Fortschritt vor."
 ve_era_crossroads.10.c.tt:0 "Erfordert eine kursgerechte Doktrinengruppe der Stufe IV. Verbraucht #N 5 Nationaleinsicht#!, um #P +3 Scheideweg-Fortschritt#! zu erhalten."

 ve_era_crossroads.11.t:0 "Wer wird den Fortschritt lenken?"
 ve_era_crossroads.11.d:0 "Das Programm ist zu bedeutsam geworden, als dass es eine lose Vereinbarung bleiben könnte. Minister beanspruchen nationale Autorität, Experten fordern Unabhängigkeit von der Politik, und lokale Akteure warnen, dass starrer Befehl die Institutionen zerbrechen wird, die den Fortschritt möglich gemacht haben."
 ve_era_crossroads.11.a:0 "Dem Zentrum ein klares Koordinierungsmandat erteilen."
 ve_era_crossroads.11.b:0 "Das verhandelte Gleichgewicht der Autorität bewahren."
 ve_era_crossroads.11.c:0 "Die Koordination unseren doktrinären Institutionen antrauen."
 ve_era_crossroads.11.a.tt:0 "Verbraucht #N 10 Nationaleinsicht#!, um #P +3 Scheideweg-Fortschritt#! zu erhalten."
 ve_era_crossroads.11.b.tt:0 "Verbraucht keine Ressource und nimmt keine unmittelbare Änderung am Scheideweg-Fortschritt vor."
 ve_era_crossroads.11.c.tt:0 "Erfordert eine kursgerechte Doktrinengruppe der Stufe IV. Verbraucht #N 5 Nationaleinsicht#!, um #P +3 Scheideweg-Fortschritt#! zu erhalten."

 ve_era_crossroads.40.t:0 "Dampf und Staat"
 ve_era_crossroads.40.d:0 "Der gewählte Kurs ist keine Reihe isolierter Errungenschaften mehr. Infrastruktur, Staatsbürgerschaft oder Verwaltung bilden nun ein dauerhaftes nationales Programm, durch das der Staat die Transformationen des Zeitalters verstehen und lenken kann."
 ve_era_crossroads.40.a:0 "Das erste Zeitalter hat seine institutionelle Form gefunden."
 ve_era_crossroads.40.a.tt:0 "Der abgeschlossene Epochen-Scheideweg hat #P +50 Epochenschwung#! gewährt. Er hat kein Ziel abgeschlossen und nicht die Berechtigung für ein Goldenes Zeitalter verändert."

 ve_era_crossroads.20.t:0 "Die Reichweite des Staates"
 ve_era_crossroads.20.d:0 "Das gewählte Programm erstreckt sich nun über die Institutionen hinaus, die es zuerst unterstützt haben. Häfen, Schulen, Ämter und lokale Behörden sind sich uneinig darüber, wo die nationale Koordination enden und das lokale Ermessen beginnen soll."
 ve_era_crossroads.20.a:0 "Die Verpflichtungen des Staates durch eine zentrale Kommission kartieren."
 ve_era_crossroads.20.b:0 "Institutionelle Grenzen durch Verhandlung entstehen lassen."
 ve_era_crossroads.20.c:0 "Durch unsere etablierten doktrinären Netzwerke koordinieren."
 ve_era_crossroads.20.a.tt:0 "Verbraucht #N 10 Nationaleinsicht#!, um #P +3 Scheideweg-Fortschritt#! zu erhalten."
 ve_era_crossroads.20.b.tt:0 "Verbraucht keine Ressource und nimmt keine unmittelbare Änderung am Scheideweg-Fortschritt vor."
 ve_era_crossroads.20.c.tt:0 "Erfordert eine kursgerechte Doktrinengruppe der Stufe IV. Verbraucht #N 5 Nationaleinsicht#!, um #P +3 Scheideweg-Fortschritt#! zu erhalten."

 ve_era_crossroads.21.t:0 "Der Preis der Eingliederung"
 ve_era_crossroads.21.d:0 "Äußere Reichweite, soziale Versorgung und nationale Disziplin erzeugen gleichermaßen Gewinner, Kosten und neue Erwartungen. Das Programm kann nur Bestand haben, wenn der Staat entscheidet, wie diese Lasten verteilt werden."
 ve_era_crossroads.21.a:0 "Ein nationales Gremium zur Regelung der Anpassung einrichten."
 ve_era_crossroads.21.b:0 "Die Last durch verhandelte Kompromisse verteilen."
 ve_era_crossroads.21.c:0 "Unsere doktrinären Institutionen die Belastung auffangen lassen."
 ve_era_crossroads.21.a.tt:0 "#N 10#! Nationaleinsicht aufwenden, um #P +3 Epochen-Scheideweg-Fortschritt#! zu erhalten."
 ve_era_crossroads.21.b.tt:0 "Keine Ressource aufwenden und keine unmittelbare Änderung des Epochen-Scheideweg-Fortschritts vornehmen."
 ve_era_crossroads.21.c.tt:0 "Erfordert eine kursgerechte Doktrinengruppe der Stufe IV. #N 5#! Nationaleinsicht aufwenden, um #P +3 Epochen-Scheideweg-Fortschritt#! zu erhalten."

 ve_era_crossroads.41.t:0 "Weltreich und Massengesellschaft"
 ve_era_crossroads.41.d:0 "Die gewählte Übereinkunft verknüpft nun die äußere Reichweite des Staates, seine sozialen Verpflichtungen und seine nationalen Institutionen. Was als strategische Ausrichtung begann, ist zu einem dauerhaften Rahmen für die Lenkung der Massengesellschaft geworden."
 ve_era_crossroads.41.a:0 "Das zweite Zeitalter hat seine Übereinkunft gefunden."
 ve_era_crossroads.41.a.tt:0 "Der abgeschlossene Epochen-Scheideweg hat #P +50 Epochenschwung#! gewährt. Er hat kein Ziel abgeschlossen oder die Berechtigung für ein Goldenes Zeitalter verändert."

 ve_era_crossroads.30.t:0 "Die Nation wird zur Pflicht gerufen"
 ve_era_crossroads.30.d:0 "Bürger, Befehlshaber, Arbeiter und Administratoren erhalten durch das gewählte Programm neue Verpflichtungen. Sofern diese Pflichten nicht aufeinander abgestimmt werden, bleibt die Mobilisierung eine Ansammlung konkurrierender Forderungen."
 ve_era_crossroads.30.a:0 "Nationale Pflichten durch eine zentrale Kommission kodifizieren."
 ve_era_crossroads.30.b:0 "Institutionen ihre Verantwortlichkeiten verhandeln lassen."
 ve_era_crossroads.30.c:0 "Unsere doktrinären Organisationen zur Koordinierung der Pflicht einsetzen."
 ve_era_crossroads.30.a.tt:0 "#N 10#! Nationaleinsicht aufwenden, um #P +3 Epochen-Scheideweg-Fortschritt#! zu erhalten."
 ve_era_crossroads.30.b.tt:0 "Keine Ressource aufwenden und keine unmittelbare Änderung des Epochen-Scheideweg-Fortschritts vornehmen."
 ve_era_crossroads.30.c.tt:0 "Erfordert eine kursgerechte Doktrinengruppe der Stufe IV. #N 5#! Nationaleinsicht aufwenden, um #P +3 Epochen-Scheideweg-Fortschritt#! zu erhalten."

 ve_era_crossroads.31.t:0 "Ein permanentem Ausnahmezustand"
 ve_era_crossroads.31.d:0 "Das für Massenbeteiligung, strategische Bereitschaft oder industrielle Mobilisierung geschaffene Maschinerie wird dauerhaft. Der Staat muss entscheiden, wie er die Kapazität wahrt, ohne dass die Notstandsdisziplin das gewöhnliche nationale Leben aufzehrt."
 ve_era_crossroads.31.a:0 "Permanente Grenzen durch eine nationale Überprüfung definieren."
 ve_era_crossroads.31.b:0 "Die Übereinkunft bewusst flexibel halten."
 ve_era_crossroads.31.c:0 "Auf doktrinäre Institutionen vertrauen, um die Maschinerie zu einzuhegen."
 ve_era_crossroads.31.a.tt:0 "#N 10#! Nationaleinsicht aufwenden, um #P +3 Epochen-Scheideweg-Fortschritt#! zu erhalten."
 ve_era_crossroads.31.b.tt:0 "Keine Ressource aufwenden und keine unmittelbare Änderung des Epochen-Scheideweg-Fortschritts vornehmen."
 ve_era_crossroads.31.c.tt:0 "Erfordert eine kursgerechte Doktrinengruppe der Stufe IV. #N 5#! Nationaleinsicht aufwenden, um #P +3 Epochen-Scheideweg-Fortschritt#! zu erhalten."

 ve_era_crossroads.42.t:0 "Die mobilisierte Gesellschaft"
 ve_era_crossroads.42.d:0 "Bürgertum, Befehl und industrielle Kapazität bilden nun eine dauerhafte nationale Übereinkunft. Die Institutionen der Mobilisierung sind Teil der gewöhnlichen Regierung geworden, anstatt improvisierte Antworten auf jede neue Krise zu bleiben."
 ve_era_crossroads.42.a:0 "Das letzte Zeitalter hat seine nationale Form gefunden."
 ve_era_crossroads.42.a.tt:0 "Der abgeschlossene Epochen-Scheideweg hat #P +50 Epochenschwung#! gewährt. Er hat kein Ziel abgeschlossen oder die Berechtigung für ein Goldenes Zeitalter verändert."
