l_german:
 ve_je_religious_project:0 "Religiöses Projekt"
 ve_je_religious_project_reason:0 "Die Regierung leitet ein langfristiges religiöses Projekt. Dessen Fortschritt wird von Verwaltungskapazität, politischer Legitimität, religiösen Bedingungen und Ereignissen im Zielstaat bestimmt."
 ve_je_religious_project_progress:0 "Fortschritt des religiösen Projekts bis zum Abschluss"
 ve_je_religious_project_status_confessional:0 "Die konfessionelle Bekehrung in [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] trachtet danach, den Staatsglauben durch eine organisierte Kampagne auszuweiten.\n\nAbschluss bei #Y 125#! Fortschritt: bekehrt 5% der Bevölkerung des Zielstaats zur Staatsreligion, erstattet #P 20#! Frömmigkeitsfonds und fügt #P 5#! Religiöser Ausgleich hinzu."
 ve_je_religious_project_status_freedom:0 "Die Öffentlichkeitsarbeit für Gewissensfreiheit in [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] errichtet eine auf Gewissen und freiwilliger Vereinigung beruhende Siedlung.\n\nAbschluss bei #Y 100#! Fortschritt: fügt staatliche Loyalisten ohne Zwangsdienste hinzu, erstattet #P 20#! Frömmigkeitsfonds und fügt #P 7#! Religiöser Ausgleich hinzu."
 ve_je_religious_project_status_secularization:0 "Die Säkularisierungskampagne in [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] verringert den öffentlichen Einfluss der organisierten Religion.\n\nAbschluss bei #Y 150#! Fortschritt: bekehrt 5% der Bevölkerung des Zielstaats zum Atheismus, erstattet #P 25#! Frömmigkeitsfonds und fügt #P 8#! Religiöser Ausgleich hinzu."
 ve_je_religious_project_complete_tt:0 "Das religiöse Projekt hat sein Ziel erreicht."
 ve_je_religious_project_fail_tt:0 "Das religiöse Projekt wurde abgebrochen."

 ve_je_cultural_project:0 "Kulturprojekt"
 ve_je_cultural_project_reason:0 "Die Regierung leitet ein langfristiges Kulturprojekt. Verwaltungskapazität, Legitimität, Bildung, nationaler Zusammenhalt und örtliche Bedingungen bestimmen sein Tempo."
 ve_je_cultural_project_progress:0 "Fortschritt des Kulturprojekts bis zum Abschluss"
 ve_je_cultural_project_status_curriculum:0 "Ein nationaler Lehrplan wird für die Schulen und Institutionen des Landes vorbereitet.\n\nAbschluss bei #Y 100#! Fortschritt: #P +20#! Kulturmandat, #P +5#! Nationaler Zusammenhalt und ein auf 10 Jahre angelegtes Ergebnis von +2% Bildungszugang, +5% Qualifikationen, -25 Bürokratie."
 ve_je_cultural_project_status_symbols:0 "Ein Programm gemeinsamer Symbole schmiedet ein allgemeines staatsbürgerliches Vokabular.\n\nAbschluss bei #Y 75#! Fortschritt: #P +20#! Kulturmandat, #P +7#! Nationaler Zusammenhalt und ein auf 8 Jahre angelegtes Ergebnis von +10% Loyalisten aus vollständig akzeptierten Pops und +25 Autorität."
 ve_je_cultural_project_status_ethnic:0 "Die Eingliederungskampagne in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] drängt eine Minderheitenbevölkerung an die Hauptkultur heran.\n\nAbschluss bei #Y 125#! Fortschritt: bekehrt 5% der Pops der Zielkultur zur Hauptkultur (7% bei Nationalismus VII), #P +25#! Kulturmandat, #P +8#! Nationaler Zusammenhalt und ein auf 10 Jahre angelegtes Assimilierungsergebnis."
 ve_je_cultural_project_status_civic:0 "Die Gleichberechtigungsinitiative in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] dehnt einen gemeinsamen staatsbürgerlichen Status über Kulturgrenzen hinweg aus.\n\nAbschluss bei #Y 100#! Fortschritt: +15% Akzeptanz für 10 Jahre, staatliche Loyalisten, #P +25#! Kulturmandat, #P +10#! Nationaler Zusammenhalt und ein auf 10 Jahre angelegtes Qualifikations-/Migrationsergebnis."
 ve_je_cultural_project_status_composite:0 "Der Staatspakt in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] verhandelt dauerhafte Anerkennung innerhalb eines Gesamtstaats.\n\nAbschluss bei #Y 150#! Fortschritt (erfordert 40+ nationaler Zusammenhalt): dauerhaft +15% Akzeptanz, fügt die Kultur der Liste der Konstituenten hinzu, staatliche Loyalisten, #P +30#! Kulturmandat, #P +12#! Nationaler Zusammenhalt."
 ve_je_cultural_project_complete_tt:0 "Das Kulturprojekt hat sein Ziel erreicht."
 ve_je_cultural_project_fail_tt:0 "Das Kulturprojekt wurde abgebrochen."
 ve_je_project_resolving_status:0 "Die Projektverwaltung reicht ihren Abschlussbericht ein."

 ve_evt_religious_incident_cooldown_mdf:0 "Abklingzeit von Vorfällen beim religiösen Projekt"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "Die Projektverwaltung verarbeitet die Folgen eines jüngsten Vorfalls."
 ve_evt_cultural_incident_cooldown_mdf:0 "Abklingzeit von Vorfällen beim Kulturprojekt"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "Die Projektverwaltung verarbeitet die Folgen eines jüngsten Vorfalls."
 ve_evt_central_clergy_supported_mdf:0 "Unterstützter Klerus im Zentrum"
 ve_evt_central_clergy_supported_mdf_desc:0 "Die Regierung hat die Autorität der zentralen religiösen Hierarchie gestärkt."
 ve_evt_central_clergy_slighted_mdf:0 "Übergangener Klerus im Zentrum"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Die Regierung hat die lokale Praxis den Präferenzen der zentralen religiösen Hierarchie vorgezogen."
 ve_evt_municipal_patronage_mdf:0 "Kommunale Patronagenetzwerke"
 ve_evt_municipal_patronage_mdf_desc:0 "Lokale Honoratioren treiben das Projekt durch Regelungen voran, welche die Steuereintreibung schwächen."

 ve_rel_evt.1.t:0 "Die Petition der Ortsvorsteher"
 ve_rel_evt.1.d:0 "Eine Delegation von Geistlichen, Gemeindevertretern und Ältesten aus [SCOPE.sState('ve_evt_target_state').GetName] hat bei der Regierung eine Eingabe zur Verlangsamung der Konfessionellen Bekehrung eingereicht. Sie warnen, dass ein starrer Zeitplan bloße Befolgung in dauerhaften Groll verwandeln wird."
 ve_rel_evt.1.f:0 "\"Ein ungefragter Glaube füllt die Register, während er die Kirchenbänke leert.\""
 ve_rel_evt.1.a:0 "Ihre Petition anhören."
 ve_rel_evt.1.a.tt:0 "Fortschritt des religiösen Projekts verringert sich um #N 4#!.\nReligiöse Beilegung erhöht sich um #P 3#!."
 ve_rel_evt.1.b:0 "Der Zeitplan bleibt unverändert."
 ve_rel_evt.1.b.tt:0 "Fortschritt des religiösen Projekts verringert sich um #P 5#!.\nReligiöse Beilegung verringert sich um #N 2#!.\n#N 0.5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_rel_evt.1.c:0 "Vertrauenswürdige Vermittler beauftragen."
 ve_rel_evt.1.c.tt:0 "Verbraucht #N 10#! Frömmigkeitsfonds.\nFortschritt des religiösen Projekts erhöht sich um #P 3#!.\nReligiöse Beilegung erhöht sich um #P 1#!."

 ve_rel_evt.2.t:0 "Mangel an Inspektoren"
 ve_rel_evt.2.d:0 "Berichte aus [SCOPE.sState('ve_evt_target_state').GetName] melden unbeantwortete Gesuche, widersprüchliche Anweisungen und Bezirke, die seit Wochen keinen Projektbeamten gesehen haben. Die Konfessionelle Bekehrung wächst schneller als die zu ihrer Durchführung eingeteilte Verwaltung."
 ve_rel_evt.2.f:0 "\"Ein Erlass durchquert das Land an einem Tag. Ein fähiger Schreiber vermag dies nicht.\""
 ve_rel_evt.2.a:0 "Vorläufige Inspektoren anheuern."
 ve_rel_evt.2.a.tt:0 "Verbraucht #N 15#! Frömmigkeitsfonds.\nFortschritt des religiösen Projekts erhöht sich um #P 4#!."
 ve_rel_evt.2.b:0 "Das Programm verlangsamen."
 ve_rel_evt.2.b.tt:0 "Fortschritt des religiösen Projekts verringert sich um #N 6#!.\nReligiöse Beilegung erhöht sich um #P 2#!."
 ve_rel_evt.2.c:0 "Kader der Zentralmeldeämter einsetzen."
 ve_rel_evt.2.c.tt:0 "Verbraucht #N 10#! Frömmigkeitsfonds.\nFortschritt des religiösen Projekts erhöht sich um #P 5#!."

 ve_cul_evt.1.t:0 "Die Übersetzungsbüros"
 ve_cul_evt.1.d:0 "Beamte in [SCOPE.sState('ve_evt_target_state').GetName] sind uneins darüber, wie die Gleichberechtigungsinitiative der Sprache der [SCOPE.sCulture('ve_evt_target_culture').GetName] gerecht werden soll. Lokale Verwaltungen fordern zweisprachige Behörden; die Zentralministerien verlangen einen einheitlichen Verwaltungsstandard."
 ve_cul_evt.1.f:0 "\"Ein Bürger sollte keinen Dolmetscher benötigen, um die auf seinen Namen verliehenen Rechte zu verstehen.\""
 ve_cul_evt.1.a:0 "Lokale Sprachen in öffentlichen Institutionen zulassen."
 ve_cul_evt.1.a.tt:0 "Fortschritt des Kulturprojekts verringert sich um #N 4#!.\nNationaler Zusammenhalt erhöht sich um #P 3#!."
 ve_cul_evt.1.b:0 "Einen einheitlichen Verwaltungsstandard durchsetzen."
 ve_cul_evt.1.b.tt:0 "Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nNationaler Zusammenhalt verringert sich um #N 2#!.\n#N 0.5%#! der Bevölkerung der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.1.c:0 "Eine akademische Übersetzungskommission einrichten."
 ve_cul_evt.1.c.tt:0 "Verbraucht #N 10#! Kulturmandat.\nFortschritt des Kulturprojekts erhöht sich um #P 3#!.\nNationaler Zusammenhalt erhöht sich um #P 1#!."

 ve_cul_evt.2.t:0 "Mangel an einheimischen Lehrkräften"
 ve_cul_evt.2.d:0 "Den Schulen in [SCOPE.sState('ve_evt_target_state').GetName] fehlen Lehrkräfte, die sowohl den staatlichen Lehrplan als auch die Gemeinden der [SCOPE.sCulture('ve_evt_target_culture').GetName] unterrichten können. Ohne geschultes lokales Personal läuft die Gleichberechtigung Gefahr, ein reines Lippenbekenntnis auf offiziellem Papier zu bleiben."
 ve_cul_evt.2.f:0 "\"Das Gesetz verkündet Gleichheit an einem Nachmittag; das Klassenzimmer muss sie eine Generation lang lehren.\""
 ve_cul_evt.2.a:0 "Neue Lehrerseminare finanzieren."
 ve_cul_evt.2.a.tt:0 "Verbraucht #N 15#! Kulturmandat.\nFortschritt des Kulturprojekts erhöht sich um #P 4#!."
 ve_cul_evt.2.b:0 "Umsetzung verlangsamen."
 ve_cul_evt.2.b.tt:0 "Fortschritt des Kulturprojekts verringert sich um #N 6#!.\nNationaler Zusammenhalt erhöht sich um #P 2#!."
 ve_cul_evt.2.c:0 "Bereits bestehende Institutionen nutzen."
 ve_cul_evt.2.c.tt:0 "Verbraucht #N 10#! Kulturmandat.\nFortschritt des Kulturprojekts erhöht sich um #P 5#!.\nNationaler Zusammenhalt erhöht sich um #P 1#!."

 ve_rel_evt.3.t:0 "Widersprüchliche Register"
 ve_rel_evt.3.d:0 "Gemeinderegister, städtische Bücher und die Berichte der Projektbeauftragten liefern unvereinbare Angaben über die religiöse Bindung in [SCOPE.sState('ve_evt_target_state').GetName]. Die Verwaltung muss entscheiden, ob sie Zeit darauf verwenden will, die Wahrheit zu ermitteln, oder ob sie mit Zahlen fortfährt, von denen sie weiß, dass sie unsicher sind."
 ve_rel_evt.3.f:0 "\"Jedes Amt verfügt über eine genaue Gesamtsumme. Keine zwei Summen stimmen überein.\""
 ve_rel_evt.3.a:0 "Eine vollständige Prüfung durchführen."
 ve_rel_evt.3.a.tt:0 "Ihr erhaltet #P 8#! Frömmigkeitsfonds.\nDer Fortschritt des religiösen Projekts sinkt um #N 6#!."
 ve_rel_evt.3.b:0 "Mit vernünftigen Schätzungen fortfahren."
 ve_rel_evt.3.b.tt:0 "Ihr verbraucht #N 8#! Frömmigkeitsfonds.\nDer Fortschritt des religiösen Projekts steigt um #P 5#!."
 ve_rel_evt.3.c:0 "Die Register der sakralen Verwaltung verwenden."
 ve_rel_evt.3.c.tt:0 "Der Fortschritt des religiösen Projekts steigt um #P 3#!."

 ve_rel_evt.4.t:0 "Gerüchte und Gegenpredigten"
 ve_rel_evt.4.d:0 "Flugblätter, Straßenpredigten und bange Gerüchte beschreiben die konfessionelle Bekehrung in [SCOPE.sState('ve_evt_target_state').GetName] nun als Angriff auf das lokale Leben. Beamte warnen, dass Schweigen den Gegnern erlauben wird, das Projekt zu definieren, während Repression deren finsterste Ansprüche bestätigen könnte."
 ve_rel_evt.4.f:0 "\"Ein Gerücht bedarf keines Amtes, keines Siegels und keines Budgets.\""
 ve_rel_evt.4.a:0 "Öffentliche Anhörungen abhalten."
 ve_rel_evt.4.a.tt:0 "Der Fortschritt des religiösen Projekts sinkt um #N 3#!.\nDie religiöse Siedlung steigt um #P 3#!.\n#P 0,5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] werden zu Loyalisten."
 ve_rel_evt.4.b:0 "Die Agitatoren bestrafen."
 ve_rel_evt.4.b.tt:0 "Der Fortschritt des religiösen Projekts steigt um #P 4#!.\nDie religiöse Siedlung sinkt um #N 3#!.\n#N 1%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] werden zu Radikalen."
 ve_rel_evt.4.c:0 "Die Aufzeichnungen und Ergebnisse veröffentlichen."
 ve_rel_evt.4.c.tt:0 "Ihr verbraucht #N 10#! Frömmigkeitsfonds.\nDer Fortschritt des religiösen Projekts steigt um #P 2#!.\nDie religiöse Siedlung steigt um #P 1#!."

 ve_rel_evt.5.t:0 "Die Sprache der Predigt"
 ve_rel_evt.5.d:0 "Projektkleriker in [SCOPE.sState('ve_evt_target_state').GetName] berichten, dass formelle Predigten die doktrinäre Einheit wahren, aber viele Gemeindemitglieder nicht erreichen. Predigten in Landessprache würden die Kampagne weiter tragen, obwohl die zentrale Hierarchie befürchtet, dass Anpassung zu Unabhängigkeit wird."
 ve_rel_evt.5.f:0 "\"Ein heiliges Wort, das ungehört bleibt, ist vollkommen bewahrt – und wird von niemandem empfangen.\""
 ve_rel_evt.5.a:0 "In Landessprachen predigen."
 ve_rel_evt.5.a.tt:0 "Der Fortschritt des religiösen Projekts steigt um #P 6#!.\nDie Frommen verlieren für #Y 2,5 Jahre#! #N 1#! Zustimmung."
 ve_rel_evt.5.b:0 "Die liturgische Einheit wahren."
 ve_rel_evt.5.b.tt:0 "Der Fortschritt des religiösen Projekts sinkt um #N 3#!.\nDie religiöse Siedlung steigt um #P 3#!.\nDie Frommen erhalten für #Y 2,5 Jahre#! #P 1#! Zustimmung."
 ve_rel_evt.5.c:0 "Gebildete Dolmetscher ausbilden."
 ve_rel_evt.5.c.tt:0 "Ihr verbraucht #N 10#! Frömmigkeitsfonds.\nDer Fortschritt des religiösen Projekts steigt um #P 4#!.\nDie religiöse Siedlung steigt um #P 1#!."

 ve_rel_evt.6.t:0 "Rivalisierende kirchliche Autoritäten"
 ve_rel_evt.6.d:0 "Zentral ernannte Amtsträger und der etablierte Ortsklerus in [SCOPE.sState('ve_evt_target_state').GetName] beanspruchen jeweils das Recht, die konfessionelle Bekehrung zu leiten. Die Unterstützung einer Seite mag den Befehl schnell wiederherstellen, doch der Streit ist bereits zu einer Probe geworden, wer für den Glauben spricht."
 ve_rel_evt.6.f:0 "\"Der Streit betrifft die Gerichtsbarkeit, was die Art ist, wie Institutionen Macht beschreiben.\""
 ve_rel_evt.6.a:0 "Den Zentralklerus unterstützen."
 ve_rel_evt.6.a.tt:0 "Der Fortschritt des religiösen Projekts steigt um #P 5#!.\nDie Frommen erhalten für #Y 2,5 Jahre#! #P 1#! Zustimmung.\nDie religiöse Siedlung sinkt um #N 3#!.\n#N 0,5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] werden zu Radikalen."
 ve_rel_evt.6.b:0 "Den Ortsklerus besänftigen."
 ve_rel_evt.6.b.tt:0 "Der Fortschritt des religiösen Projekts sinkt um #N 4#!.\nDie Frommen verlieren für #Y 2,5 Jahre#! #N 1#! Zustimmung.\nDie religiöse Siedlung steigt um #P 3#!."
 ve_rel_evt.6.c:0 "Ihre Befugnisse schriftlich festlegen."
 ve_rel_evt.6.c.tt:0 "Ihr verbraucht #N 10#! Frömmigkeitsfonds.\nDer Fortschritt des religiösen Projekts steigt um #P 3#!.\nDie religiöse Siedlung steigt um #P 1#!."

 ve_cul_evt.3.t:0 "Die Kategorien der Volkszählung"
 ve_cul_evt.3.d:0 "Die Volkszählungsbeamten in [SCOPE.sState('ve_evt_target_state').GetName] können sich nicht darauf einigen, wie Bürger der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] erfasst werden sollen. Die lokale Bevölkerung verwendet sich überschneidende Identitäten, während die zentralen Formulare eine Antwort in einem Kästchen verlangen."
 ve_cul_evt.3.f:0 "\"Eine Kategorie vereinfacht das Hauptbuch lange bevor sie das Land vereinfacht.\""
 ve_cul_evt.3.a:0 "Selbstidentifikation erlauben."
 ve_cul_evt.3.a.tt:0 "Kulturprojekt-Fortschritt verringert sich um #N 4#!.\nNationaler Zusammenhalt erhöht sich um #P 4#!."
 ve_cul_evt.3.b:0 "Die Kategorien werden zentral festgelegt."
 ve_cul_evt.3.b.tt:0 "Kulturprojekt-Fortschritt erhöht sich um #P 6#!.\nNationaler Zusammenhalt verringert sich um #N 4#!.\n#N 0,5%#! der Bevölkerung der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] werden Radikal."
 ve_cul_evt.3.c:0 "Das moderne Registersystem verwenden."
 ve_cul_evt.3.c.tt:0 "Verbraucht #N 10#! Kulturmandat.\nKulturprojekt-Fortschritt erhöht sich um #P 5#!.\nNationaler Zusammenhalt erhöht sich um #P 1#!."

 ve_cul_evt.4.t:0 "Die städtischen Notabeln"
 ve_cul_evt.4.d:0 "Städtische Mäzene in [SCOPE.sState('ve_evt_target_state').GetName] bieten ihre Ämter, Klienten und ihren Einfluss an, um die Gleichberechtigungsinitiative für die Bevölkerung der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] voranzutreiben. Ihre Kooperation würde rasch erfolgen, doch ihr Preis ist die fortwährende Kontrolle über die lokalen Einnahmen."
 ve_cul_evt.4.f:0 "\"Der kürzeste Weg zum Rathaus führt durch mehrere private Salons.\""
 ve_cul_evt.4.a:0 "Die lokalen Netzwerke nutzen."
 ve_cul_evt.4.a.tt:0 "Kulturprojekt-Fortschritt erhöht sich um #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] verliert für #Y 2 Jahre#! #N 5%#! Steuer-Kapazität."
 ve_cul_evt.4.b:0 "Offene Räte schaffen."
 ve_cul_evt.4.b.tt:0 "Kulturprojekt-Fortschritt verringert sich um #N 3#!.\nNationaler Zusammenhalt erhöht sich um #P 3#!."
 ve_cul_evt.4.c:0 "Eine regelbasierte Einigung aushandeln."
 ve_cul_evt.4.c.tt:0 "Verbraucht #N 10#! Kulturmandat.\nKulturprojekt-Fortschritt erhöht sich um #P 3#!.\nNationaler Zusammenhalt erhöht sich um #P 1#!."

 ve_cul_evt.5.t:0 "Die Staatsdienstprüfungen"
 ve_cul_evt.5.d:0 "Die Öffnung der Staatsdienstprüfungen für Kandidaten der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] hat eine Kluft zwischen rechtlicher Gleichheit und praktischer Vorbereitung offengelegt. Ein sofortiger Zugang wäre symbolisch wirkungsvoll, aber jahrelange ungleiche Schulbildung kann nicht per Erlass ausgelöscht werden."
 ve_cul_evt.5.f:0 "\"Dieselbe Prüfung ist nicht dieselbe Gelegenheit, wenn nur einem Kandidaten ihre Sprache beigebracht wurde.\""
 ve_cul_evt.5.a:0 "Vorbereitungskurse finanzieren."
 ve_cul_evt.5.a.tt:0 "Verbraucht #N 15#! Kulturmandat.\nKulturprojekt-Fortschritt erhöht sich um #P 5#!.\nNationaler Zusammenhalt erhöht sich um #P 2#!."
 ve_cul_evt.5.b:0 "Gleicher Zugang beginnt sofort."
 ve_cul_evt.5.b.tt:0 "Kulturprojekt-Fortschritt erhöht sich um #P 7#!.\nNationaler Zusammenhalt verringert sich um #N 4#!.\n#N 0,5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] werden Radikal."
 ve_cul_evt.5.c:0 "Die Schul- und Wohlfahrtsnetzwerke mobilisieren."
 ve_cul_evt.5.c.tt:0 "Verbraucht #N 10#! Kulturmandat.\nKulturprojekt-Fortschritt erhöht sich um #P 5#!.\nNationaler Zusammenhalt erhöht sich um #P 2#!."
 ve_cul_evt.5.e:0 "Das Prüfungssystem zuerst reformieren."
 ve_cul_evt.5.e.tt:0 "Kulturprojekt-Fortschritt verringert sich um #N 4#!.\nNationaler Zusammenhalt erhöht sich um #P 3#!."

 ve_cul_evt.6.t:0 "Die Mehrheit wehrt sich"
 ve_cul_evt.6.d:0 "Gegner der Gleichberechtigungsinitiative behaupten, dass die Ausweitung allgemeiner Rechte auf die Bevölkerung der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] das Ansehen aller anderen schmälert. Demonstrationen in [SCOPE.sState('ve_evt_target_state').GetName] verwandeln eine Verwaltungsreform in eine nationale politische Probe."
 ve_cul_evt.6.f:0 "\"Ein geteiltes Recht wird als ein gestohlenes Privileg dargestellt.\""
 ve_cul_evt.6.a:0 "Die Initiative offen verteidigen."
 ve_cul_evt.6.a.tt:0 "Kulturprojekt-Fortschritt erhöht sich um #P 4#!.\nNationaler Zusammenhalt verringert sich um #N 4#!.\n#N 1%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] werden Radikal."
 ve_cul_evt.6.b:0 "Das Tempo der Umsetzung verringern."
 ve_cul_evt.6.b.tt:0 "Kulturprojekt-Fortschritt verringert sich um #N 5#!.\nNationaler Zusammenhalt erhöht sich um #P 3#!."
 ve_cul_evt.6.c:0 "Die Reformkoalition mobilisieren."
 ve_cul_evt.6.c.tt:0 "Verbraucht #N 10#! Kulturmandat.\nKulturprojekt-Fortschritt erhöht sich um #P 3#!.\nNationaler Zusammenhalt erhöht sich um #P 2#!.\n#P 0,5%#! der Bevölkerung der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] werden Loyalisten."

 ve_rel_evt.7.t:0 "Die Mission am Wendepunkt"
 ve_rel_evt.7.d:0 "Die Bekehrung in [SCOPE.sState('ve_evt_target_state').GetName] steht kurz vor dem administrativen und politischen Kollaps. Die Ämter haben aufgefordert, einander zu antworten, der öffentliche Widerstand verhärtet sich, und die Geistlichen vor Ort warnen, dass die Mission unter den gegenwärtigen Bedingungen nicht fortgesetzt werden kann."
 ve_rel_evt.7.f:0 "\"Die Berichte nennen es nach wie vor eine vorübergehende Schwierigkeit. Die Straßen haben einen härteren Namen gewählt.\""
 ve_rel_evt.7.a:0 "Die Verluste hinnehmen und abziehen."
 ve_rel_evt.7.a.tt:0 "Bricht das Religiöse Projekt ohne Rückerstattung von Frömmigkeitsfonds ab.\nDer Religiöse Ausgleich sinkt um #N 5#!.\nFür #Y 2 Jahre#!: #N -50#! Bürokratie, #N -50#! Autorität und #N -3%#! Beschlusserfolg."
 ve_rel_evt.7.b:0 "Notfallressourcen bereitstellen."
 ve_rel_evt.7.b.tt:0 "Kostet #N 25#! Frömmigkeitsfonds.\nDer Fortschritt des Religiösen Projekts sinkt um #N 5#!.\n#N 1%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."
 ve_rel_evt.7.c:0 "Mit Rumpfpersonal fortfahren."
 ve_rel_evt.7.c.tt:0 "Der Fortschritt des Religiösen Projekts sinkt um #N 10#!.\nDer Religiöse Ausgleich sinkt um #N 2#!.\nDas Projekt wird fortgesetzt."
 ve_rel_evt.7.e:0 "Die Methode neu verhandeln."
 ve_rel_evt.7.e.tt:0 "Kostet #N 15#! Frömmigkeitsfonds.\nDer Fortschritt des Religiösen Projekts sinkt um #N 3#!.\nDer Religiöse Ausgleich steigt um #P 2#!.\n#N 0.5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."

 ve_cul_evt.7.t:0 "Die Initiative verliert an Legitimität"
 ve_cul_evt.7.d:0 "Die Gleichberechtigungsinitiative in [SCOPE.sState('ve_evt_target_state').GetName] verliert die Unterstützung sowohl etablierter Institutionen als auch der Gemeinschaften der [SCOPE.sCulture('ve_evt_target_culture').GetName], denen sie dienen sollte. Radikale Bewegungen stellen nun jeden Kompromiss als Beweis dafür dar, dass die Regierung keine Gleichberechtigung liefern kann."
 ve_cul_evt.7.f:0 "\"Eine Reform mag Opposition überstehen. Sie kann es nicht überstehen, unglaubwürdig zu werden.\""
 ve_cul_evt.7.a:0 "Die Initiative beenden."
 ve_cul_evt.7.a.tt:0 "Bricht das Kulturprojekt ohne Rückerstattung von Kulturmandaten ab.\nDer Nationale Zusammenhalt sinkt um #N 5#!.\nFür #Y 2 Jahre#!: #N -50#! Bürokratie, #N -25#! Autorität und #N -3%#! Beschlusserfolg."
 ve_cul_evt.7.b:0 "Lokale Notzuschüsse gewähren."
 ve_cul_evt.7.b.tt:0 "Kostet #N 25#! Kulturmandate.\nDer Fortschritt des Kulturprojekts sinkt um #N 5#!.\n#N 1%#! der Bevölkerung der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."
 ve_cul_evt.7.c:0 "Mit minimalem Programm fortfahren."
 ve_cul_evt.7.c.tt:0 "Der Fortschritt des Kulturprojekts sinkt um #N 10#!.\nDer Nationale Zusammenhalt sinkt um #N 2#!.\nDas Projekt wird fortgesetzt."
 ve_cul_evt.7.e:0 "Die Koalition wiederaufbauen."
 ve_cul_evt.7.e.tt:0 "Kostet #N 15#! Kulturmandate.\nDer Fortschritt des Kulturprojekts sinkt um #N 3#!.\nDer Nationale Zusammenhalt steigt um #P 2#!.\n#N 0.5%#! der Bevölkerung der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."

 ve_rel_evt.8.t:0 "Ein unerwarteter lokaler Konkordat"
 ve_rel_evt.8.d:0 "Geistliche, Gemeindebeamte und Gemeindevorsteher in [SCOPE.sState('ve_evt_target_state').GetName] haben eine Vereinbarung erzielt, die keine zentrale Anweisung hätte hervorbringen können. Der Widerstand vor Ort lässt nach, die Gemeinden koordinieren die Mission selbst, und die Bekehrung hat unerwartetes Momentum erlangt."
 ve_rel_evt.8.f:0 "\"Was als Befehl aus der Hauptstadt begann, ist zu einem Pakt geworden, der auf dem Marktplatz geschlossen wurde.\""
 ve_rel_evt.8.a:0 "Dieses Momentum voll ausschöpfen."
 ve_rel_evt.8.a.tt:0 "Der Religiöse Ausgleich steigt um #P 1#!.\nDer Fortschritt des Religiösen Projekts steigt um #P 25#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."
 ve_rel_evt.8.b:0 "Dauerhaftigkeit vor Schnelligkeit."
 ve_rel_evt.8.b.tt:0 "Der Religiöse Ausgleich steigt um #P 4#!.\nDer Fortschritt des Religiösen Projekts steigt um #P 10#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."

 ve_cul_evt.8.t:0 "Eine lokale Bürgerkoalition"
 ve_cul_evt.8.d:0 "Lehrer, Gemeindebeamte, Handelsverbände und Vertreter der Gemeinschaft der [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] haben ein gemeinsames Komitee gegründet. Indem diese Koalition Streitigkeiten schlichtete, bevor sie die Hauptstadt erreichten, hat sie der Gleichberechtigungsinitiative ein Momentum verlieh, das die Verwaltung nicht hätte erzeugen können."
 ve_cul_evt.8.f:0 "\"Staatsbürgerschaft wurde real, als Institutionen, die selten einen Tisch teilten, begannen, Verantwortung zu teilen.\""
 ve_cul_evt.8.a:0 "Das Momentum der Koalition nutzen."
 ve_cul_evt.8.a.tt:0 "Der Nationale Zusammenhalt steigt um #P 1#!.\nDer Fortschritt des Kulturprojekts steigt um #P 25#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."
 ve_cul_evt.8.b:0 "Die Institutionen permanent machen."
 ve_cul_evt.8.b.tt:0 "Der Nationale Zusammenhalt steigt um #P 4#!.\nDer Fortschritt des Kulturprojekts steigt um #P 10#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."

 ve_rel_evt.40.t:0 "Widersprüchliche Akten"
 ve_rel_evt.40.d:0 "Die Provinzialregister in [SCOPE.sState('ve_evt_target_state').GetName] verwenden inkompatible Kategorien für Gemeinden, Bürgervereinigungen und öffentliche Institutionen. Berichte, die die Hauptstadt erreichen, widersprechen einander nun, weshalb das Projekt nicht mehr zwischen Befolgung und Widerstand unterscheiden kann."
 ve_rel_evt.40.f:0 "\"Eine Politik, die über drei Bücher geführt wird, nimmt bald drei verschiedene Realitäten an.\""
 ve_rel_evt.40.a:0 "Eine zentrale Prüfung entsenden."
 ve_rel_evt.40.a.tt:0 "Kostet #N 10#! Frömmigkeitsfonds.\nDer Fortschritt des Religiösen Projekts steigt um #P 5#!.\nReligiöse Beilegung steigt um #P 1#!."
 ve_rel_evt.40.b:0 "Die Akten vor Ort abgleichen."
 ve_rel_evt.40.b.tt:0 "Der Fortschritt des Religiösen Projekts sinkt um #N 3#!.\nReligiöse Beilegung steigt um #P 2#!."
 ve_rel_evt.40.c:0 "Das Standardregisterverfahren anwenden."
 ve_rel_evt.40.c.tt:0 "Kostet #N 5#! Frömmigkeitsfonds.\nDer Fortschritt des Religiösen Projekts steigt um #P 4#!.\nReligiöse Beilegung steigt um #P 1#!."

 ve_rel_evt.41.t:0 "Mangel an Provinzialpersonal"
 ve_rel_evt.41.d:0 "Die Büros, die das Projekt in [SCOPE.sState('ve_evt_target_state').GetName] leiten, finden nicht genügend ausgebildete Büroangestellte, Lehrer und Inspektoren. Anweisungen häufen sich schneller, als lokale Beamte sie auslegen können, und überstürzte Ernennungen drohen jeden Streit zu verschärfen."
 ve_rel_evt.41.f:0 "\"Der Erlass kam an einem Tag. Die Menschen, die ihn umsetzen können, brauchen vielleicht eine Generation.\""
 ve_rel_evt.41.a:0 "Einen neuen Stamm von Beamten finanzieren."
 ve_rel_evt.41.a.tt:0 "Kostet #N 15#! Frömmigkeitsfonds.\nDer Fortschritt des Religiösen Projekts steigt um #P 6#!."
 ve_rel_evt.41.b:0 "Die Umsetzung verlangsamen."
 ve_rel_evt.41.b.tt:0 "Der Fortschritt des Religiösen Projekts sinkt um #N 6#!.\nReligiöse Beilegung steigt um #P 2#!."
 ve_rel_evt.41.c:0 "Das bestehende Bildungsnetzwerk nutzen."
 ve_rel_evt.41.c.tt:0 "Kostet #N 10#! Frömmigkeitsfonds.\nDer Fortschritt des Religiösen Projekts steigt um #P 5#!.\nReligiöse Beilegung steigt um #P 1#!."

 ve_rel_evt.42.t:0 "Gerüchte im Distrikt"
 ve_rel_evt.42.d:0 "Gerüchten in [SCOPE.sState('ve_evt_target_state').GetName] zufolge verbirgt das Projekt Maßnahmen, die weit härter sind als die von der Regierung verkündeten. Religiöse Organisatoren und lokale Agitatoren wiederholen widersprüchliche Geschichten, während offizielles Schweigen jeder neuen Version Raum zur Ausbreitung gibt."
 ve_rel_evt.42.f:0 "\"Ein Gerücht benötigt kein Amt, kein Budget und keine Unterschrift.\""
 ve_rel_evt.42.a:0 "Die Berichte veröffentlichen."
 ve_rel_evt.42.a.tt:0 "Der Fortschritt des Religiösen Projekts sinkt um #N 3#!.\nReligiöse Beilegung steigt um #P 4#!."
 ve_rel_evt.42.b:0 "Die Agitation abtun."
 ve_rel_evt.42.b.tt:0 "Der Fortschritt des Religiösen Projekts steigt um #P 5#!.\nReligiöse Beilegung sinkt um #N 3#!.\n#N 1%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird zu Radikalen."
 ve_rel_evt.42.c:0 "Lokale Mediatoren beauftragen."
 ve_rel_evt.42.c.tt:0 "Kostet #N 10#! Frömmigkeitsfonds.\nDer Fortschritt des Religiösen Projekts steigt um #P 4#!.\nReligiöse Beilegung steigt um #P 2#!.\n#P 0.5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird zu Loyalisten."

 ve_rel_evt.43.t:0 "Die Verwaltung am Bruchpunkt"
 ve_rel_evt.43.d:0 "Das Projekt in [SCOPE.sState('ve_evt_target_state').GetName] nähert sich dem administrativen Kollaps. Provinzialämter sind überlastet, das Selbstbewusstsein der Öffentlichkeit ist zusammengebrochen, und die organisierte Opposition betrachtet jede neue Anweisung nun als Beweis dafür, dass die Regierung die Kontrolle verloren hat."
 ve_rel_evt.43.f:0 "\"Wenn die Akten sich nicht mehr bewegen, zieht die Krise auf die Straßen.\""
 ve_rel_evt.43.a:0 "Das Programm beenden."
 ve_rel_evt.43.a.tt:0 "Das Religiöse Projekt wird ohne Rückzahlung von Frömmigkeitsfonds abgebrochen.\nReligiöse Beilegung sinkt um #N 5#!.\nFür #Y 2 Jahre#!: #N -50#! Bürokratie, #N -50#! Autorität und #N -3%#! Beschlusserfolg."
 ve_rel_evt.43.b:0 "Notfallressourcen übertragen."
 ve_rel_evt.43.b.tt:0 "Kostet #N 25#! Frömmigkeitsfonds.\nDer Fortschritt des Religiösen Projekts sinkt um #N 5#!.\n#N 1%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird zu Radikalen.\nDas Projekt wird fortgesetzt."
 ve_rel_evt.43.c:0 "Mit Rumpfbesatzung fortfahren."
 ve_rel_evt.43.c.tt:0 "Der Fortschritt des Religiösen Projekts sinkt um #N 10#!.\nReligiöse Beilegung sinkt um #N 2#!.\nDas Projekt wird fortgesetzt."
 ve_rel_evt.43.e:0 "Die lokale Partnerschaft wiederaufbauen."
 ve_rel_evt.43.e.tt:0 "Kostet #N 15#! Frömmigkeitsfonds.\nDer Fortschritt des Religiösen Projekts sinkt um #N 3#!.\nReligiöse Beilegung steigt um #P 2#!.\n#N 0.5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird zu Radikalen.\nDas Projekt wird fortgesetzt."

 ve_rel_evt.100.t:0 "Sitze im interreligiösen Rat"
 ve_rel_evt.100.d:0 "Delegierte in [SCOPE.sState('ve_evt_target_state').GetName] sind sich einig, dass ein interreligiöser Rat notwendig ist, jedoch nicht darüber, wer einen Sitz verdient. Proportionale Repräsentation würde kleinere Gemeinschaften beruhigen, während ein in der Hauptstadt entworfenes festes Arrangement die Arbeit sofort aufnehmen könnte."
 ve_rel_evt.100.f:0 "\"Jeder unterstützt einen gemeinsamen Tisch, bis die Stühle gezählt werden.\""
 ve_rel_evt.100.a:0 "Repräsentation nach Bevölkerung verteilen."
 ve_rel_evt.100.a.tt:0 "Fortschritt des religiösen Projekts verringert sich um #N 3#!.\nReligiöser Ausgleich erhöht sich um #P 4#!."
 ve_rel_evt.100.b:0 "Einen festen zentralen Kompromiss auferlegen."
 ve_rel_evt.100.b.tt:0 "Fortschritt des religiösen Projekts erhöht sich um #P 5#!.\nReligiöser Ausgleich verringert sich um #N 2#!.\n#N 0.5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_rel_evt.100.c:0 "Die interreligiösen Räte stärken."
 ve_rel_evt.100.c.tt:0 "#N 10#! Frömmigkeitsfonds ausgeben.\nFortschritt des religiösen Projekts erhöht sich um #P 5#!.\nReligiöser Ausgleich erhöht sich um #P 2#!."

 ve_rel_evt.101.t:0 "Ein geteilter Schullehrplan"
 ve_rel_evt.101.d:0 "Schulen in [SCOPE.sState('ve_evt_target_state').GetName] benötigen gemeinsame Staatsbürgerkundeunterrichtseinheiten, ohne die Öffentlichkeitsarbeit für Gewissensfreiheit in eine Kampagne gegen den lokalen Glauben zu verwandeln. Lehrkräfte fordern klare Materialien und gemeinsame Schulungen, während Gemeindevorsteher darauf bestehen, dass der lokale Unterricht Raum für ihre Traditionen behält."
 ve_rel_evt.101.f:0 "\"Eine geteilte Unterrichtsstunde gelingt nur, wenn jede Familie das Klassenzimmer als das ihre erkennt.\""
 ve_rel_evt.101.a:0 "Ein gemeinsames Lehrerkollegium finanzieren."
 ve_rel_evt.101.a.tt:0 "#N 15#! Frömmigkeitsfonds ausgeben.\nFortschritt des religiösen Projekts erhöht sich um #P 6#!.\nReligiöser Ausgleich erhöht sich um #P 1#!."
 ve_rel_evt.101.b:0 "Raum für lokale Lehrpläne lassen."
 ve_rel_evt.101.b.tt:0 "Fortschritt des religiösen Projekts verringert sich um #N 4#!.\nReligiöser Ausgleich erhöht sich um #P 3#!."
 ve_rel_evt.101.c:0 "Die Reformkoalition in die Schulen bringen."
 ve_rel_evt.101.c.tt:0 "#N 10#! Frömmigkeitsfonds ausgeben.\nFortschritt des religiösen Projekts erhöht sich um #P 5#!.\nReligiöser Ausgleich erhöht sich um #P 2#!.\n#P 0.5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird loyalistisch."

 ve_rel_evt.102.t:0 "Eine Charta gegenseitiger Garantien"
 ve_rel_evt.102.d:0 "Religiöse Gemeinschaften, Kommunalbeamte und Reformvereinigungen in [SCOPE.sState('ve_evt_target_state').GetName] haben eine gemeinsame Charta ausgearbeitet. Jeder Unterzeichner akzeptiert dieselben staatsbürgerlichen Verpflichtungen im Austausch für öffentliche Garantien, dass keine Gemeinschaft von lokalen Institutionen ausgeschlossen wird."
 ve_rel_evt.102.f:0 "\"Vertrauen wurde möglich, als jedes Versprechen als das Recht einer anderen Partei niedergeschrieben wurde.\""
 ve_rel_evt.102.a:0 "Das Momentum des Pakts nutzen."
 ve_rel_evt.102.a.tt:0 "Religiöser Ausgleich erhöht sich um #P 2#!.\nFortschritt des religiösen Projekts erhöht sich um #P 20#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlussbußeffekt des Projekts angewendet."
 ve_rel_evt.102.b:0 "Die Garantien dauerhaft machen."
 ve_rel_evt.102.b.tt:0 "Religiöser Ausgleich erhöht sich um #P 4#!.\n#P 0.5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird loyalistisch.\nFortschritt des religiösen Projekts erhöht sich um #P 10#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlussbußeffekt des Projekts angewendet."

 ve_rel_evt.150.t:0 "Lehrkräfte oder Inspektoren?"
 ve_rel_evt.150.d:0 "Die Säkularisierungskampagne in [SCOPE.sState('ve_evt_target_state').GetName] hat eine Knappheit an alphabetisiertem Personal offengelegt. Die Verwaltung kann das Lehrerkollegium erweitern, welches langfristige institutionelle Kapazität aufbaut, oder sich auf Inspektoren verlassen, die die neuen Regeln mit dem bereits verfügbaren Personal durchsetzen können."
 ve_rel_evt.150.f:0 "\"Ein Inspektor kann eine Schule an einem Nachmittag schließen. Eine Lehrkraft mag Jahre brauchen, um zu ersetzen, was dort gelehrt wurde.\""
 ve_rel_evt.150.a:0 "Das Lehrerkollegium erweitern."
 ve_rel_evt.150.a.tt:0 "#N 15#! Frömmigkeitsfonds ausgeben.\nFortschritt des religiösen Projekts erhöht sich um #P 6#!."
 ve_rel_evt.150.b:0 "Das Programm verlangsamen, um es an das bestehende Personal anzupassen."
 ve_rel_evt.150.b.tt:0 "Fortschritt des religiösen Projekts verringert sich um #N 5#!.\nReligiöser Ausgleich erhöht sich um #P 2#!."
 ve_rel_evt.150.c:0 "Das öffentliche Bildungsnetzwerk beauftragen."
 ve_rel_evt.150.c.tt:0 "#N 10#! Frömmigkeitsfonds ausgeben.\nFortschritt des religiösen Projekts erhöht sich um #P 5#!.\nReligiöser Ausgleich erhöht sich um #P 1#!."

 ve_rel_evt.151.t:0 "Die beschlagnahmten Besitztümer"
 ve_rel_evt.151.d:0 "Ehemalige religiöse Besitztümer in [SCOPE.sState('ve_evt_target_state').GetName] stehen zur Umwandlung in Schulen, Kliniken und Amtsstuben bereit. Eine sofortige Übertragung würde der Kampagne wertvolle Infrastruktur verschaffen, doch das Ausbleiben einer Entschädigung entwickelt sich zum Sammelpunkt für die Frommen."
 ve_rel_evt.151.f:0 "\"Die Schlüssel wechselten innerhalb eines Morgens den Besitzer. Der Streit um das Eigentum wird die Schlösser überdauern.\""
 ve_rel_evt.151.a:0 "Entschädigung in Raten zahlen."
 ve_rel_evt.151.a.tt:0 "Kostet #N 15#! Frömmigkeitsfonds.\nFortschritt des religiösen Projekts steigt um #P 3#!.\nReligiöser Ausgleich steigt um #P 3#!."
 ve_rel_evt.151.b:0 "Die Besitztümer unverzüglich dem öffentlichen Dienst übergeben."
 ve_rel_evt.151.b.tt:0 "Fortschritt des religiösen Projekts steigt um #P 7#!.\nReligiöser Ausgleich sinkt um #N 4#!.\n#N 1%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDie Frommen verlieren für #Y 2,5 Jahre#! #N 1#! Zustimmung."
 ve_rel_evt.151.c:0 "Sie an säkulare Wohlfahrtseinrichtungen übertragen."
 ve_rel_evt.151.c.tt:0 "Kostet #N 10#! Frömmigkeitsfonds.\nFortschritt des religiösen Projekts steigt um #P 5#!.\nReligiöser Ausgleich steigt um #P 2#!.\n#P 0,5%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird loyalistisch."

 ve_rel_evt.152.t:0 "Bürgervereinigungen schlagen Wurzeln"
 ve_rel_evt.152.d:0 "Lehrerzirkel, gegenseitige Hilfsvereine und städtische Verbände in [SCOPE.sState('ve_evt_target_state').GetName] haben begonnen, Dienstleistungen zu erbringen, die einst über religiöse Institutionen organisiert wurden. Ihre Zusammenarbeit hat der Säkularisierungskampagne ein lokales bürgerliches Fundament anstelle einer rein administrativen Präsenz verliehen."
 ve_rel_evt.152.f:0 "\"Die neue Ordnung bestand fort, als die Bürger begannen, sie aufrechtzuerhalten, ohne auf einen Inspektor zu warten.\""
 ve_rel_evt.152.a:0 "Das lokale Momentum nutzen."
 ve_rel_evt.152.a.tt:0 "Religiöser Ausgleich steigt um #P 2#!.\nFortschritt des religiösen Projekts steigt um #P 20#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."
 ve_rel_evt.152.b:0 "Die Vereinigungen in dauerhafte Institutionen umwandeln."
 ve_rel_evt.152.b.tt:0 "Religiöser Ausgleich steigt um #P 4#!.\nFortschritt des religiösen Projekts steigt um #P 10#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."

 ve_cul_evt.40.t:0 "Örtliche Schulbehörden"
 ve_cul_evt.40.d:0 "Schulbehörden in [SCOPE.sState('ve_evt_target_state').GetName] uneinig über den Platz der Sprache [SCOPE.sCulture('ve_evt_target_culture').GetName] im öffentlichen Unterricht. Der Unterricht in der Lokalsprache würde das Vertrauen wahren, während eine einzige Verwaltungssprache die Lenkung des nationalen Projekts erleichtern würde."
 ve_cul_evt.40.f:0 "\"Die für die erste Unterrichtsstunde gewählte Sprache entscheidet oft darüber, wer glaubt, dass die Schule ihm gehört.\""
 ve_cul_evt.40.a:0 "Die Lokalsprache schützen."
 ve_cul_evt.40.a.tt:0 "Fortschritt des Kulturprojekts sinkt um #N 4#!.\nNationale Kohäsion steigt um #P 3#!."
 ve_cul_evt.40.b:0 "Eine einheitliche Verwaltungssprache durchsetzen."
 ve_cul_evt.40.b.tt:0 "Fortschritt des Kulturprojekts steigt um #P 5#!.\nNationale Kohäsion sinkt um #N 2#!.\n#N 0,5%#! der Bevölkerung der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.40.c:0 "Das Lehrernetzwerk erweitern."
 ve_cul_evt.40.c.tt:0 "Kostet #N 10#! Kulturmandat.\nFortschritt des Kulturprojekts steigt um #P 4#!.\nNationale Kohäsion steigt um #P 2#!."

 ve_cul_evt.41.t:0 "Statistische Grenzen"
 ve_cul_evt.41.d:0 "Beamte bei der Vermessung von [SCOPE.sState('ve_evt_target_state').GetName] können sich nicht darauf einigen, wo die Gemeinschaft [SCOPE.sCulture('ve_evt_target_culture').GetName] beginnt und endet. Lokale Identitäten überschneiden sich über Sprache, Bezirk und Brauch hinweg, aber das nationale Projekt erfordert Kategorien, die gezählt und verwaltet werden können."
 ve_cul_evt.41.f:0 "\"Eine für die Volkszählung gezogene Grenze erhält bald Beamte, Budgets und Verteidiger.\""
 ve_cul_evt.41.a:0 "Freiraum für Selbstbestimmung lassen."
 ve_cul_evt.41.a.tt:0 "Fortschritt des Kulturprojekts sinkt um #N 3#!.\nNationale Kohäsion steigt um #P 3#!."
 ve_cul_evt.41.b:0 "Das Zentrum die Grenzen definieren lassen."
 ve_cul_evt.41.b.tt:0 "Fortschritt des Kulturprojekts steigt um #P 6#!.\nNationale Kohäsion sinkt um #N 3#!.\n#N 0,5%#! der Bevölkerung der Kultur [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.41.c:0 "Das Standardregistersystem verwenden."
 ve_cul_evt.41.c.tt:0 "Kostet #N 10#! Kulturmandat.\nFortschritt des Kulturprojekts steigt um #P 5#!.\nNationale Kohäsion steigt um #P 1#!."

 ve_cul_evt.42.t:0 "Das nationale Projekt am Scheideweg"
 ve_cul_evt.42.d:0 "Das nationale Projekt in [SCOPE.sState('ve_evt_target_state').GetName] steht vor dem Zusammenbruch. Radikale Bewegungen behaupten, die Regierung habe die Gemeinschaft der [SCOPE.sCulture('ve_evt_target_culture').GetName] entweder verraten oder sich ihr ergeben, während lokale Dienststellen nicht länger das Selbstbewusstsein besitzen, einen weiteren Kompromiss durchzusetzen."
 ve_cul_evt.42.f:0 "\"Eine Regelung, die sowohl als Nötigung als auch als Kapitulation angegriffen wird, hört womöglich bald gänzlich auf, eine Regelung zu sein.\""
 ve_cul_evt.42.a:0 "Das Projekt beenden."
 ve_cul_evt.42.a.tt:0 "Das Kulturprojekt wird ohne Rückerstattung des Kulturmandats abgebrochen.\nDer nationale Zusammenhalt sinkt um #N 5#!.\nFür #Y 2 Jahre#!: #N -50#! Bürokratie, #N -25#! Autorität und #N -3%#! Beschlusserfolg."
 ve_cul_evt.42.b:0 "Lokale Notfallressourcen bereitstellen."
 ve_cul_evt.42.b.tt:0 "Ihr gebt #N 25#! Kulturmandat aus.\nDer Fortschritt des Kulturprojekt sinkt um #N 5#!.\n#N 1%#! der Bevölkerung der [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."
 ve_cul_evt.42.c:0 "Mit einem Minimalprogramm fortfahren."
 ve_cul_evt.42.c.tt:0 "Der Fortschritt des Kulturprojekt sinkt um #N 10#!.\nDer nationale Zusammenhalt sinkt um #N 2#!.\nDas Projekt wird fortgesetzt."
 ve_cul_evt.42.e:0 "Den verhandelnd Rahmen wiederherstellen."
 ve_cul_evt.42.e.tt:0 "Ihr gebt #N 15#! Kulturmandat aus.\nDer Fortschritt des Kulturprojekt sinkt um #N 3#!.\nDer nationale Zusammenhalt steigt um #P 2#!.\n#N 0.5%#! der Bevölkerung der [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."

 ve_cul_evt.50.t:0 "Die Richtlinie für Nachnamen und Sprache"
 ve_cul_evt.50.d:0 "Beamte in [SCOPE.sState('ve_evt_target_state').GetName] schlagen vor, Nachnamen und öffentliche Register in der Nationalsprache zu vereinheitlichen. Die Richtlinie würde es der Zentralverwaltung erleichtern, die Bevölkerung der [SCOPE.sCulture('ve_evt_target_culture').GetName] zu klassifizieren, doch Familien fürchten, dass die private Identität zum Gegenstand staatlicher Befehl wird."
 ve_cul_evt.50.f:0 "\"Ein im Register anders geschriebener Name kann nach wie vor jener sein, mit dem sich eine Familie erinnert.\""
 ve_cul_evt.50.a:0 "Eine schrittweise Registrierungskampagne finanzieren."
 ve_cul_evt.50.a.tt:0 "Ihr gebt #N 10#! Kulturmandat aus.\nDer Fortschritt des Kulturprojekt steigt um #P 4#!.\nDer nationale Zusammenhalt steigt um #P 1#!.\n#N 0.5%#! der Bevölkerung der [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.50.b:0 "Einen nationalen Standard durchsetzen."
 ve_cul_evt.50.b.tt:0 "Der Fortschritt des Kulturprojekt steigt um #P 7#!.\nDer nationale Zusammenhalt sinkt um #N 4#!.\n#N 1%#! der Bevölkerung der [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.50.c:0 "Die Richtlinie zur Überarbeitung zurückziehen."
 ve_cul_evt.50.c.tt:0 "Der Fortschritt des Kulturprojekt sinkt um #N 5#!.\nDer nationale Zusammenhalt steigt um #P 3#!."

 ve_cul_evt.51.t:0 "Die Einberufungsregister"
 ve_cul_evt.51.d:0 "Militärbeamte in [SCOPE.sState('ve_evt_target_state').GetName] fordern ein einziges Register für Dienstverpflichtungen, Nachnamen und Befehle. Seine Anwendung auf die Bevölkerung der [SCOPE.sCulture('ve_evt_target_culture').GetName] würde das Bestreben zur ethnischen Eingliederung stärken, doch der Widerstand wächst in Gemeinschaften, die die Armee als ein weiteres Instrument der kulturellen Auslöschung betrachten."
 ve_cul_evt.51.f:0 "\"Der Staat lernt die Namen eines Dorfs erst kennen, wenn er seine Steuern eintreiben oder seine Söhne einberufen möchte.\""
 ve_cul_evt.51.a:0 "Die nationalen Register anwenden."
 ve_cul_evt.51.a.tt:0 "Der Fortschritt des Kulturprojekt steigt um #P 5#!.\nDer nationale Zusammenhalt sinkt um #N 2#!.\n#N 0.5%#! der Bevölkerung der [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.51.b:0 "Lokale Registrierungspraktiken beibehalten."
 ve_cul_evt.51.b.tt:0 "Der Fortschritt des Kulturprojekt sinkt um #N 3#!.\nDer nationale Zusammenhalt steigt um #P 3#!."
 ve_cul_evt.51.c:0 "Die Register durch Militärdienst eingliedern."
 ve_cul_evt.51.c.tt:0 "Ihr gebt #N 10#! Kulturmandat aus.\nDer Fortschritt des Kulturprojekt steigt um #P 6#!.\nDer nationale Zusammenhalt steigt um #P 1#!.\n#N 0.5%#! der Bevölkerung der [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."

 ve_cul_evt.100.t:0 "Die konstituierende Delegation"
 ve_cul_evt.100.d:0 "Eine Delegation der Gemeinschaft der [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] ist mit Forderungen nach Repräsentation in den Institutionen des Staatspakts eingetroffen. Verhandlungen würden das Projekt verlangsamen, aber seine Legitimität stärken; eine aus der Hauptstadt diktierte Einigung könnte rascher voranschreiten, jedoch auf Kosten des Vertrauens."
 ve_cul_evt.100.f:0 "\"Ein Pakt wird erst dann allgemein, wenn jeder Beteiligte auf eine Klausel verweisen kann, an deren Verfassung er mitgewirkt hat.\""
 ve_cul_evt.100.a:0 "Über ihren Platz im Pakt verhandeln."
 ve_cul_evt.100.a.tt:0 "Der Fortschritt des Kulturprojekts verringert sich um #N 4#!.\nDer nationale Zusammenhalt erhöht sich um #P 4#!."
 ve_cul_evt.100.b:0 "Die zentrale Einigung durchsetzen."
 ve_cul_evt.100.b.tt:0 "Der Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nDer nationale Zusammenhalt verringert sich um #N 2#!.\n#N 0.5%#! der Bevölkerung der [SCOPE.sCulture('ve_evt_target_culture').GetName] in [SCOPE.sState('ve_evt_target_state').GetName] werden zu Radikalen."
 ve_cul_evt.100.c:0 "Die parlamentarische Koalition in die Gespräche einbeziehen."
 ve_cul_evt.100.c.tt:0 "Es werden #N 10#! Kulturmandat ausgegeben.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 4#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."

 ve_cul_evt.101.t:0 "Doppelte Verwaltung"
 ve_cul_evt.101.d:0 "Der Staatspakt in [SCOPE.sState('ve_evt_target_state').GetName] stützt sich nun auf zwei einander überschneidende Verwaltungen. Zentrale Beamte und Vertreter der Gemeinschaft der [SCOPE.sCulture('ve_evt_target_culture').GetName] führen doppelte Register, streiten über Ernennungen und erlassen widersprüchliche Anweisungen, während die Bürokratie des Landes sich der Erschöpfung nähert."
 ve_cul_evt.101.f:0 "\"Zwei Ämter können Autorität leichter teilen als einen Aktenschrank.\""
 ve_cul_evt.101.a:0 "Ein gemeinsames Verwaltungspersonal finanzieren."
 ve_cul_evt.101.a.tt:0 "Es werden #N 15#! Kulturmandat ausgegeben.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 6#!."
 ve_cul_evt.101.b:0 "Den Pakt verlangsamen, bis die Ämter sich einigen."
 ve_cul_evt.101.b.tt:0 "Der Fortschritt des Kulturprojekts verringert sich um #N 6#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."
 ve_cul_evt.101.c:0 "Die Ämter unter dem Staatsdienst vereinen."
 ve_cul_evt.101.c.tt:0 "Es werden #N 10#! Kulturmandat ausgegeben.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."

 ve_cul_evt.150.t:0 "Umsetzung in den Provinzen"
 ve_cul_evt.150.d:0 "Die Provinzialverwaltungen berichten, dass das landesweite Kulturprojekt mit radikal unterschiedlichen Geschwindigkeiten voranschreitet. Einige Ämter fordern finanzierte Umsetzungskommissionen, während andere davor warnen, dass das Aufzwingen eines einheitlichen Zeitplans auf jede Region knappes Personal beanspruchen und das Selbstbewusstsein der Öffentlichkeit schwächen werde."
 ve_cul_evt.150.f:0 "\"Ein nationaler Erlass ist schnell geschrieben, aber er muss in jedem Amt des Landes umgesetzt werden.\""
 ve_cul_evt.150.a:0 "Die Umsetzungskommissionen finanzieren."
 ve_cul_evt.150.a.tt:0 "Es werden #N 10#! Kulturmandat ausgegeben.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 5#!."
 ve_cul_evt.150.b:0 "Einen schrittweisen Zeitplan anwenden."
 ve_cul_evt.150.b.tt:0 "Der Fortschritt des Kulturprojekts verringert sich um #N 4#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."
 ve_cul_evt.150.c:0 "Die bestehende Verwaltung vereinheitlichen."
 ve_cul_evt.150.c.tt:0 "Es werden #N 5#! Kulturmandat ausgegeben.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 3#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."

 ve_cul_evt.151.t:0 "Die Unterrichtssprache"
 ve_cul_evt.151.d:0 "Der nationale Lehrplan erfordert eine gemeinsame Unterrichtssprache, doch Schulen im ganzen Land bedienen Gemeinschaften mit sehr unterschiedlichen sprachlichen Traditionen. Mehrsprachige Materialien würden das Selbstbewusstsein wahren, aber die Verteilung verzögern, während ein einheitlicher Lehrplan die Klassenzimmer rasch erreichen könnte, auf die Gefahr hin, die Bildung zu einem kulturellen Wettstreit zu machen."
 ve_cul_evt.151.f:0 "\"Eine Lektion, die in einer Sprache gelehrt wird, der der Schüler misstraut, wird womöglich für alles andere als ihren Gegenstand in Erinnerung bleiben.\""
 ve_cul_evt.151.a:0 "Mehrsprachige Materialien finanzieren."
 ve_cul_evt.151.a.tt:0 "Es werden #N 10#! Kulturmandat ausgegeben.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 3#!.\nDer nationale Zusammenhalt erhöht sich um #P 3#!."
 ve_cul_evt.151.b:0 "Einen nationalen Lehrplan anwenden."
 ve_cul_evt.151.b.tt:0 "Der Fortschritt des Kulturprojekts erhöht sich um #P 6#!.\nDer nationale Zusammenhalt verringert sich um #N 3#!."
 ve_cul_evt.151.c:0 "Die Bildungs- und Wohlfahrtsnetze vereinigen."
 ve_cul_evt.151.c.tt:0 "Es werden #N 10#! Kulturmandat ausgegeben.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."

 ve_cul_evt.160.t:0 "Wer repräsentiert die Nation?"
 ve_cul_evt.160.d:0 "Das Projekt der Gemeinsamen Symbole hat die Frage neu entfacht, wessen Geschichte, Uniformen, Monumente und Zeremonien für das gesamte Land stehen können. Wechselnde Traditionen würden die Anerkennung verbreitern, aber Einigungen verlangsamen; die Auswahl einer offiziellen Erzählung würde Klarheit schaffen, während viele Bürger ausgeschlossen blieben."
 ve_cul_evt.160.f:0 "\"Ein Symbol wird erst dann national, wenn die Bürger sich darin wiedererkennen, ohne einer Erklärung zu bedürfen.\""
 ve_cul_evt.160.a:0 "Die Symbole im öffentlichen Gebrauch rotieren lassen."
 ve_cul_evt.160.a.tt:0 "Fortschritt des Kulturprojekts verringert sich um #N 3#!.\nNationaler Zusammenhalt erhöht sich um #P 4#!."
 ve_cul_evt.160.b:0 "Eine offizielle Erzählung auswählen."
 ve_cul_evt.160.b.tt:0 "Fortschritt des Kulturprojekts erhöht sich um #P 6#!.\nNationaler Zusammenhalt verringert sich um #N 3#!."
 ve_cul_evt.160.c:0 "Eine gemeinsame öffentliche Zeremonie entwerfen."
 ve_cul_evt.160.c.tt:0 "Es werden #N 10#! Kulturmandat aufgewendet.\nFortschritt des Kulturprojekts erhöht sich um #P 4#!.\nNationaler Zusammenhalt erhöht sich um #P 2#!."
