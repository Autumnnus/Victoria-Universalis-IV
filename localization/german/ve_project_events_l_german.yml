l_german:
 ve_je_religious_project:0 "Religiöses Projekt"
 ve_je_religious_project_reason:0 "Die Regierung leitet ein langfristiges religiöses Projekt. Sein Fortschritt wird von der Verwaltungskapazität, der politischen Legitimität, den religiösen Bedingungen und den Ereignissen im Zielstaat bestimmt."
 ve_je_religious_project_progress:0 "Der Fortschritt des religiösen Projekts nähert sich dem Abschluss"
 ve_je_religious_project_status_confessional:0 "Die konfessionelle Bekehrung in [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] versucht, den Glauben des Staates durch eine organisierte Kampagne zu erweitern.\n\nFertigstellung um #Y 125#! Fortschritt: Konvertiert 5 % der Bevölkerung des Zielstaats zur Staatsreligion, Rückerstattungen #P 20#! Frömmigkeitsreform und fügt #P 5 hinzu#! Religiöse Siedlung."
 ve_je_religious_project_status_freedom:0 "Der Freedom Outreach in [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] ist der Aufbau einer Siedlung, die auf Gewissen und freiwilliger Vereinigung basiert.\n\nAbschluss bei #Y 100#! Fortschritt: Fügt staatliche Loyalisten ohne erzwungene Konvertierung hinzu, erstattet #P 20#! Frömmigkeitsreform und fügt #P 7#! religiöse Siedlung hinzu."
 ve_je_religious_project_status_secularization:0 "Die Säkularisierungskampagne in [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] verringert die öffentliche Autorität der organisierten Religion.\n\nAbschluss bei #Y 150#! Fortschritt: Bekehrt 5 % der Bevölkerung des Zielstaats zum Atheismus, erstattet #P 25#! Frömmigkeitsreform und fügt hinzu #P 8#! Religiöse Siedlung."
 ve_je_religious_project_complete_tt:0 "Das religiöse Projekt hat sein Ziel erreicht."
 ve_je_religious_project_fail_tt:0 "Das religiöse Projekt wurde abgesagt."

 ve_je_cultural_project:0 "Kulturprojekt"
 ve_je_cultural_project_reason:0 "Die Regierung leitet ein langfristiges Kulturprojekt. Verwaltungskapazität, Legitimität, Bildung, nationaler Zusammenhalt und lokale Bedingungen bestimmen das Tempo."
 ve_je_cultural_project_progress:0 "Fortschritt des Kulturprojekts steht vor dem Abschluss"
 ve_je_cultural_project_status_curriculum:0 "Ein nationaler Lehrplan für die Schulen und Institutionen des Landes wird vorbereitet.\n\nFertigstellung bei #Y 100#! Fortschritt: #P +20#! Kulturauftrag, #P +5#! Nationaler Zusammenhalt und ein 10-Jahres-Ergebnis von +2 % Bildungszugang, +5 % Qualifikationen, -25 Bürokratie."
 ve_je_cultural_project_status_symbols:0 "Ein Programm gemeinsamer Symbole schmiedet ein gemeinsames bürgerliches Vokabular.\n\nAbschluss bei #Y 75#! Fortschritt: #P +20#! Kulturauftrag, #P +7#! Nationaler Zusammenhalt und ein 8-Jahres-Ergebnis von +10 % Loyalisten aus voll akzeptierten Pops und +25 Autorität."
 ve_je_cultural_project_status_ethnic:0 "Die ethnische Integrationskampagne in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] drängt eine Minderheitsbevölkerung zur Primärkultur.\n\nFertigstellung um #Y 125#! Fortschritt: Wandelt 5 % der Pops der Zielkultur in die Primärkultur um (7 % mit Nationalist VII), #P +25#! Kultureller Auftrag, #P +8#! nationaler Zusammenhalt und ein 10-jähriges Assimilationsergebnis."
 ve_je_cultural_project_status_civic:0 "Die Equal Citizenship Initiative in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] ausdehnt einen gemeinsamen Bürgerstatus über kulturelle Grenzen hinweg.\n\nFertigstellung am #Y 100#! Fortschritt: +15 % Akzeptanz für 10 Jahre, Staatstreue, #P +25#! Kulturauftrag, #P +10#! Nationaler Zusammenhalt und ein 10-jähriges Qualifikations-/Migrationsergebnis."
 ve_je_cultural_project_status_composite:0 "Der Verfassungspakt in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] verhandelt über die dauerhafte Anerkennung innerhalb eines zusammengesetzten Staates.\n\nAbschluss am #Y 150#! Fortschritt (erfordert 40+ Nationaler Zusammenhalt): dauerhaft +15 % Akzeptanz, fügt die Kultur der Wählerliste hinzu, Staatstreue, #P +30#! Kulturauftrag, #P +12#! Nationaler Zusammenhalt."
 ve_je_cultural_project_complete_tt:0 "Das Kulturprojekt hat sein Ziel erreicht."
 ve_je_cultural_project_fail_tt:0 "Das Kulturprojekt wurde abgesagt."
 ve_je_project_resolving_status:0 "Die Projektverwaltung reicht ihren Abschlussbericht ein."

 ve_evt_religious_incident_cooldown_mdf:0 "Abklingzeit des religiösen Projektvorfalls"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "Die Projektverwaltung absorbiert die Folgen eines kürzlichen Vorfalls."
 ve_evt_cultural_incident_cooldown_mdf:0 "Abklingzeit des Kulturprojektvorfalls"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "Die Projektverwaltung absorbiert die Folgen eines kürzlichen Vorfalls."
 ve_evt_central_clergy_supported_mdf:0 "Unterstützung des Zentralklerus."
 ve_evt_central_clergy_supported_mdf_desc:0 "Die Regierung hat die Autorität der zentralen religiösen Hierarchie gewahrt."
 ve_evt_central_clergy_slighted_mdf:0 "Zentralklerus Geringfügig"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Die Regierung hat die lokale Praxis gegenüber den Präferenzen der zentralen religiösen Hierarchie bevorzugt."
 ve_evt_municipal_patronage_mdf:0 "Kommunale Fördernetzwerke"
 ve_evt_municipal_patronage_mdf_desc:0 "Lokale Honoratioren treiben das Projekt durch Vereinbarungen voran, die die Steuererhebung schwächen."

 ve_rel_evt.1.t:0 "Die Petition der lokalen Honoratioren"
 ve_rel_evt.1.d:0 "Eine Delegation von Geistlichen, Gemeindevertretern und Nachbarschaftsältesten aus [SCOPE.sState('ve_evt_target_state').GetName] hat die Regierung gebeten, die Konfessionsumwandlung zu verlangsamen. Sie warnen davor, dass ein unflexibler Zeitplan die Einhaltung in dauerhaften Groll verwandeln wird."
 ve_rel_evt.1.f:0 "\„Glaube, der ohne Rat aufgezwungen wird, kann die Kassen füllen, während die Kirchenbänke leer werden.“"
 ve_rel_evt.1.a:0 "Hören Sie ihre Petition."
 ve_rel_evt.1.a.tt:0 "Der Fortschritt des Religiösen Projekts verringert sich um #N 4#!.\nDie Religiöse Siedlung erhöht sich um #P 3#!."
 ve_rel_evt.1.b:0 "Der Zeitplan ändert sich nicht."
 ve_rel_evt.1.b.tt:0 "Der Fortschritt des Religiösen Projekts erhöht sich um #P 5#!.\nDie religiöse Ansiedlung nimmt um #N 2#! ab.\n#N 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_rel_evt.1.c:0 "Beauftragen Sie vertrauenswürdige Vermittler."
 ve_rel_evt.1.c.tt:0 "Geben Sie #N 10#! Frömmigkeitsreform aus.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 3#!.\nDie religiöse Siedlung erhöht sich um #P 1#!."

 ve_rel_evt.2.t:0 "Ein Mangel an Außendienstmitarbeitern"
 ve_rel_evt.2.d:0 "Berichte von [SCOPE.sState('ve_evt_target_state').GetName] beschreiben unbeantwortete Petitionen, widersprüchliche Anweisungen und Bezirke, die seit Wochen keinen Projektleiter gesehen haben. Die Konfessionskonvertierung überholt die Verwaltung, die damit beauftragt ist."
 ve_rel_evt.2.f:0 "\„Ein Dekret kann das ganze Land an einem Tag erreichen. Ein kompetenter Angestellter kann das nicht.\“"
 ve_rel_evt.2.a:0 "Stellen Sie temporäre Außendienstmitarbeiter ein."
 ve_rel_evt.2.a.tt:0 "Geben Sie #N 15#! Frömmigkeitsreform aus.\nDer Fortschritt des Religiösen Projekts erhöht sich um #P 4#!."
 ve_rel_evt.2.b:0 "Verlangsamt das Programm."
 ve_rel_evt.2.b.tt:0 "Der Fortschritt des Religiösen Projekts nimmt ab um #N 6#!.\nReligiöse Siedlung erhöht sich um #P 2#!."
 ve_rel_evt.2.c:0 "Verwenden Sie die zentralen Registerkader."
 ve_rel_evt.2.c.tt:0 "Verbringen Sie #N 10#! Frömmigkeitsreform.\nReligiöser Projektfortschritt erhöht sich um #P 5#!."

 ve_cul_evt.1.t:0 "Die Übersetzungsbüros"
 ve_cul_evt.1.d:0 "Beamte in [SCOPE.sState('ve_evt_target_state').GetName] Uneinigkeit darüber, wie die Equal Citizenship Initiative das Problem angehen soll [SCOPE.sCulture('ve_evt_target_culture').GetName] Sprache. Lokale Verwaltungen wollen zweisprachige Büros; Zentrale Ministerien fordern einen einheitlichen Verwaltungsstandard."
 ve_cul_evt.1.f:0 "„Ein Bürger sollte keinen Dolmetscher benötigen, um die in seinem eigenen Namen gewährten Rechte zu verstehen.“"
 ve_cul_evt.1.a:0 "Lassen Sie lokale Sprachen in öffentlichen Einrichtungen leben."
 ve_cul_evt.1.a.tt:0 "Der Fortschritt von Kulturprojekten verringert sich um #N 4#!.\nNationaler Zusammenhalt steigt um #P 3#!."
 ve_cul_evt.1.b:0 "Einen administrativen Standard festlegen."
 ve_cul_evt.1.b.tt:0 "Der Fortschritt von Kulturprojekten steigt um #P 5#!.\nNationaler Zusammenhalt nimmt um ab #N 2#!.\n#N 0,5 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] werden radikal."
 ve_cul_evt.1.c:0 "Gründen Sie eine akademische Übersetzungskommission."
 ve_cul_evt.1.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt von Kulturprojekten erhöht sich um #P 3#!.\nDer nationale Zusammenhalt erhöht sich um #P 1#!."

 ve_cul_evt.2.t:0 "Ein Mangel an örtlichen Lehrern"
 ve_cul_evt.2.d:0 "Die Schulen von [SCOPE.sState('ve_evt_target_state').GetName] Es mangelt an Lehrern, die in der Lage sind, sowohl den staatlichen Lehrplan zu erfüllen als auch [SCOPE.sCulture('ve_evt_target_culture').GetName] Gemeinschaften. Ohne einen ausgebildeten Kader vor Ort besteht die Gefahr, dass die gleiche Staatsbürgerschaft ein Versprechen bleibt, das nur auf offiziellem Papier steht."
 ve_cul_evt.2.f:0 "„Das Gesetz erklärt die Gleichheit an einem Nachmittag; das Klassenzimmer muss sie eine Generation lang lehren.“"
 ve_cul_evt.2.a:0 "Finanzierung neuer Lehrerkollegs."
 ve_cul_evt.2.a.tt:0 "Ausgaben #N 15#! Kulturauftrag.\nDer Fortschritt des Kulturprojekts steigt um #P 4#!."
 ve_cul_evt.2.b:0 "Langsame Umsetzung."
 ve_cul_evt.2.b.tt:0 "Der Fortschritt von Kulturprojekten verringert sich um #N 6#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."
 ve_cul_evt.2.c:0 "Nutzt die bereits vorhandenen Institutionen."
 ve_cul_evt.2.c.tt:0 "Gebt #N 10#! Kulturauftrag aus.\nDer Fortschritt von Kulturprojekten erhöht sich um #P 5#!.\nDer nationale Zusammenhalt erhöht sich um #P 1#!."

 ve_rel_evt.3.t:0 "Widersprüchliche Register"
 ve_rel_evt.3.d:0 "Kirchenbücher, Gemeindebücher und die Berichte von Projektmitarbeitern liefern unvereinbare Berichte über die Religionszugehörigkeit in [SCOPE.sState('ve_evt_target_state').GetName]. Die Verwaltung muss entscheiden, ob sie Zeit verschwendet, um die Wahrheit herauszufinden, oder ob sie mit Zahlen fortfährt, von denen sie weiß, dass sie unsicher sind."
 ve_rel_evt.3.f:0 "\„Jedes Amt verfügt über eine genaue Summe. Keine zwei Summen stimmen überein.“"
 ve_rel_evt.3.a:0 "Führen Sie eine vollständige Prüfung durch."
 ve_rel_evt.3.a.tt:0 "Gewinn #P 8#! Frömmigkeitsreform.\nDer Fortschritt des religiösen Projekts verringert sich um #N 6#!."
 ve_rel_evt.3.b:0 "Fahren Sie mit vernünftigen Schätzungen fort."
 ve_rel_evt.3.b.tt:0 "Geben Sie #N 8#! Frömmigkeit aus Reform.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 5#!."
 ve_rel_evt.3.c:0 "Verwenden Sie die Register der Heiligen Verwaltung."
 ve_rel_evt.3.c.tt:0 "Der Fortschritt des Religiösen Projekts erhöht sich um #P 3#!."

 ve_rel_evt.4.t:0 "Gerüchte und Gegenpredigten"
 ve_rel_evt.4.d:0 "Broschüren, Straßenpredigten und beunruhigende Gerüchte beschreiben nun die Konfessionskonvertierung in [SCOPE.sState('ve_evt_target_state').GetName] als Angriff auf das lokale Leben. Beamte warnen davor, dass Schweigen es den Gegnern ermöglichen wird, das Projekt zu definieren, während die Unterdrückung ihre düstersten Behauptungen bestätigen könnte."
 ve_rel_evt.4.f:0 "\„Ein Gerücht erfordert kein Amt, kein Siegel und kein Budget.“"
 ve_rel_evt.4.a:0 "Halten Sie öffentliche Anhörungen ab."
 ve_rel_evt.4.a.tt:0 "Der Fortschritt des religiösen Projekts nimmt um #N 3#! ab.\nDie religiöse Siedlung erhöht sich um #P 3#!.\n#P 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird loyalistisch."
 ve_rel_evt.4.b:0 "Bestrafen Sie die Agitatoren."
 ve_rel_evt.4.b.tt:0 "Der Fortschritt des religiösen Projekts erhöht sich um #P 4#!.\nDie religiöse Siedlung nimmt um #N 3#! ab.\n#N 1 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_rel_evt.4.c:0 "Veröffentlichen Sie die Aufzeichnungen und Ergebnisse."
 ve_rel_evt.4.c.tt:0 "Geben Sie #N 10#! Frömmigkeitsreform aus.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 2#!.\nDie religiöse Siedlung erhöht sich um #P 1#!."

 ve_rel_evt.5.t:0 "Die Sprache der Predigt"
 ve_rel_evt.5.d:0 "Projekt Geistlicher in [SCOPE.sState('ve_evt_target_state').GetName] berichten, dass formelle Predigten die Einheit der Lehre bewahren, aber viele Gemeindemitglieder nicht erreichen. Das Predigen in der Landessprache würde die Kampagne weiter vorantreiben, obwohl die zentrale Hierarchie befürchtet, dass die Anpassung zur Unabhängigkeit führen wird."
 ve_rel_evt.5.f:0 "„Ein ungehörtes heiliges Wort wird perfekt bewahrt – und von niemandem angenommen.“"
 ve_rel_evt.5.a:0 "Predigen Sie in den lokalen Sprachen."
 ve_rel_evt.5.a.tt:0 "Der Fortschritt des religiösen Projekts erhöht sich um #P 6#!.\nDie Gläubigen verlieren #N 1#! Genehmigung für #Y 2,5 Jahre#!."
 ve_rel_evt.5.b:0 "Bewahren Sie die liturgische Einheit."
 ve_rel_evt.5.b.tt:0 "Der Fortschritt des religiösen Projekts verringert sich um #N 3#!.\nDie religiöse Siedlung erhöht sich um #P 3#!.\nDer Zugewinn an „Frömmigkeit“. #P 1#! Zulassung für #Y 2,5 Jahre#!."
 ve_rel_evt.5.c:0 "Bilden Sie ausgebildete Dolmetscher aus."
 ve_rel_evt.5.c.tt:0 "Geben Sie #N 10#! Frömmigkeitsreform aus.\nReligiöser Projektfortschritt erhöht sich um #P 4#!.\nReligiöse Siedlung erhöht sich um #P 1#!."

 ve_rel_evt.6.t:0 "Konkurrierende kirchliche Autoritäten"
 ve_rel_evt.6.d:0 "Zentrale Ernennungen und etablierte örtliche Geistliche in [SCOPE.sState('ve_evt_target_state').GetName] Jeder beansprucht das Recht, die Konfessionsumwandlung zu leiten. Durch die Unterstützung einer Seite kann das Kommando schnell wiederhergestellt werden, aber der Streit ist bereits zu einem Test dafür geworden, wer für den Glauben spricht."
 ve_rel_evt.6.f:0 "\\"Der Streit betrifft die Gerichtsbarkeit, so beschreiben Institutionen Macht.\\""
 ve_rel_evt.6.a:0 "Unterstützen Sie den zentralen Klerus."
 ve_rel_evt.6.a.tt:0 "Der Fortschritt des Religionsprojekts erhöht sich um #P 5#!.\nDer Gewinn der Gläubigen #P 1#! Zulassung für #Y 2,5 Jahre#!.\nReligiöse Ansiedlung nimmt um #N 3#! ab.\n#N 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_rel_evt.6.b:0 "Besänftigen Sie den örtlichen Klerus."
 ve_rel_evt.6.b.tt:0 "Der Fortschritt des religiösen Projekts verringert sich um #N 4#!.\nDie Gläubigen verlieren #N 1#! Genehmigung für #Y 2,5 Jahre#!.\nDie religiöse Siedlung erhöht sich um #P 3#!."
 ve_rel_evt.6.c:0 "Legen Sie ihre Befugnisse schriftlich fest."
 ve_rel_evt.6.c.tt:0 "Geben Sie #N 10 aus#! Frömmigkeitsreform.\nReligiöser Projektfortschritt erhöht sich um #P 3#!.\nReligiöse Siedlung erhöht sich um #P 1#!."

 ve_cul_evt.3.t:0 "Die Kategorien der Volkszählung"
 ve_cul_evt.3.d:0 "Volkszählungsbeamte in [SCOPE.sState('ve_evt_target_state').GetName] kann nicht zustimmen, wie Bürger von [SCOPE.sCulture('ve_evt_target_culture').GetName] Kultur sollte aufgezeichnet werden. Lokale Befragte verwenden überlappende Identitäten, während die zentralen Formulare eine Antwort in einem Feld erfordern."
 ve_cul_evt.3.f:0 "„Eine Kategorie vereinfacht das Hauptbuch lange bevor sie das Land vereinfacht.“"
 ve_cul_evt.3.a:0 "Selbstidentifikation zulassen."
 ve_cul_evt.3.a.tt:0 "Der Fortschritt eines Kulturprojekts verringert sich um #N 4#!.\nNationaler Zusammenhalt steigt um #P 4#!."
 ve_cul_evt.3.b:0 "Die Kategorien werden zentral festgelegt."
 ve_cul_evt.3.b.tt:0 "Der Fortschritt von Kulturprojekten steigt um #P 6#!.\nNationaler Zusammenhalt nimmt um ab #N 4#!.\n#N 0,5 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] werden radikal."
 ve_cul_evt.3.c:0 "Verwenden Sie das moderne Registrierungssystem."
 ve_cul_evt.3.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nDer nationale Zusammenhalt erhöht sich um #P 1#!."

 ve_cul_evt.4.t:0 "Die städtischen Honoratioren"
 ve_cul_evt.4.d:0 "Kommunale Schirmherren in [SCOPE.sState('ve_evt_target_state').GetName] bieten ihre Ämter, Kunden und ihren Einfluss an, um die gleichberechtigte Staatsbürgerschaft der Menschen zu fördern [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung. Ihre Zusammenarbeit würde schnell erfolgen, aber ihr Preis ist die fortgesetzte Kontrolle über die lokalen Einnahmen."
 ve_cul_evt.4.f:0 "\\"Der kürzeste Weg zum Rathaus führt durch mehrere private Salons.\\""
 ve_cul_evt.4.a:0 "Nutzen Sie die lokalen Netzwerke."
 ve_cul_evt.4.a.tt:0 "Der Fortschritt des Kulturprojekts steigt um #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] verliert #N 5 %#! Steuerkapazität für #Y 2 Jahre#!."
 ve_cul_evt.4.b:0 "Erstellen Sie offene Räte."
 ve_cul_evt.4.b.tt:0 "Der Fortschritt von Kulturprojekten nimmt um #N 3#! ab.\nNationaler Zusammenhalt steigt um #P 3#!."
 ve_cul_evt.4.c:0 "Verhandeln Sie eine regelbasierte Lösung."
 ve_cul_evt.4.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt von Kulturprojekten erhöht sich um #P 3#!.\nDer nationale Zusammenhalt erhöht sich um #P 1#!."

 ve_cul_evt.5.t:0 "Die Prüfungen für den öffentlichen Dienst"
 ve_cul_evt.5.d:0 "Die Öffnung der Prüfungen für den öffentlichen Dienst für [SCOPE.sCulture('ve_evt_target_culture').GetName] Bewerber hat eine Lücke zwischen rechtlicher Gleichheit und praktischer Vorbereitung aufgedeckt. Ein sofortiger Zugang hätte symbolische Kraft, aber jahrelange ungleiche Schulbildung kann nicht per Dekret beseitigt werden."
 ve_cul_evt.5.f:0 "\„Die gleiche Prüfung ist nicht die gleiche Gelegenheit, wenn nur einem Kandidaten seine Sprache beigebracht wurde.“"
 ve_cul_evt.5.a:0 "Finanzieren Sie Vorbereitungskurse."
 ve_cul_evt.5.a.tt:0 "Verbringen Sie #N 15#! Kulturauftrag.\nDer Fortschritt von Kulturprojekten erhöht sich um #P 5#!.\nDer nationale Zusammenhalt nimmt zu um #P 2#!."
 ve_cul_evt.5.b:0 "Gleichberechtigter Zugang beginnt sofort."
 ve_cul_evt.5.b.tt:0 "Der Fortschritt von Kulturprojekten steigt um #P 7#!.\nDer nationale Zusammenhalt nimmt um #N 4#! ab.\n#N 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.5.c:0 "Mobilisieren Sie die Schul- und Wohlfahrtsnetzwerke."
 ve_cul_evt.5.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."
 ve_cul_evt.5.e:0 "Reformieren Sie zuerst das Prüfungssystem."
 ve_cul_evt.5.e.tt:0 "Der Fortschritt des Kulturprojekts verringert sich um #N 4#!.\nDer nationale Zusammenhalt erhöht sich um #P 3#!."

 ve_cul_evt.6.t:0 "Die Mehrheit drängt zurück"
 ve_cul_evt.6.d:0 "Gegner der Equal Citizenship Initiative behaupten, dass die Ausweitung gemeinsamer Rechte auf die [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung mindert das Ansehen aller anderen. Demonstrationen in [SCOPE.sState('ve_evt_target_state').GetName] machen eine Verwaltungsreform zu einem nationalen politischen Test."
 ve_cul_evt.6.f:0 "„Ein geteiltes Recht wird als gestohlenes Privileg beschrieben.“"
 ve_cul_evt.6.a:0 "Verteidigen Sie die Initiative offen."
 ve_cul_evt.6.a.tt:0 "Der Fortschritt des Kulturprojekts steigt um #P 4#!.\nDer nationale Zusammenhalt nimmt um #N 4#! ab.\n#N 1 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.6.b:0 "Reduzieren Sie das Umsetzungstempo."
 ve_cul_evt.6.b.tt:0 "Der Fortschritt von Kulturprojekten nimmt um #N 5#! ab.\nNationaler Zusammenhalt steigt um #P 3#!."
 ve_cul_evt.6.c:0 "Mobilisieren Sie die Reformkoalition."
 ve_cul_evt.6.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nFortschritt von Kulturprojekten steigt um #P 3#!.\nNationaler Zusammenhalt steigt um #P 2#!.\n#P 0,5 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird Loyalist."

 ve_rel_evt.7.t:0 "Die Mission am Bruchpunkt"
 ve_rel_evt.7.d:0 "Die konfessionelle Bekehrung in [SCOPE.sState('ve_evt_target_state').GetName] steht kurz vor dem administrativen und politischen Zusammenbruch. Die Ämter antworten einander nicht mehr, der öffentliche Widerstand verhärtet sich und die Geistlichen vor Ort warnen, dass die Mission nicht zu ihren jetzigen Bedingungen weitergeführt werden könne."
 ve_rel_evt.7.f:0 "\„In den Berichten wird immer noch von einer vorübergehenden Schwierigkeit gesprochen. Die Straßen haben einen härteren Namen gewählt.“"
 ve_rel_evt.7.a:0 "Akzeptieren Sie die Verluste und ziehen Sie sich zurück."
 ve_rel_evt.7.a.tt:0 "Brechen Sie das religiöse Projekt ohne Rückerstattung der Frömmigkeitsreform ab.\nDie religiöse Siedlung verringert sich um #N 5#!.\nFür #Y 2 Jahre#!: #N -50#! Bürokratie, #N -50#! Autorität und #N -3 %#! Erfolg bei der Gesetzesverabschiedung."
 ve_rel_evt.7.b:0 "Notfallressourcen übertragen."
 ve_rel_evt.7.b.tt:0 "Ausgeben #N 25#! Frömmigkeitsreform.\nDer Fortschritt des religiösen Projekts verringert sich um #N 5#!.\n#N 1 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird zu Radical.\nDas Projekt wird fortgesetzt."
 ve_rel_evt.7.c:0 "Fahren Sie mit einem Skelettstab fort."
 ve_rel_evt.7.c.tt:0 "Der Fortschritt des religiösen Projekts verringert sich um #N 10#!.\nDie religiöse Siedlung verringert sich um #N 2#!.\nDas Projekt wird fortgesetzt."
 ve_rel_evt.7.e:0 "Verhandeln Sie die Methode neu."
 ve_rel_evt.7.e.tt:0 "Geben Sie #N 15#! Frömmigkeitsreform aus.\nDer Fortschritt des Religiösen Projekts verringert sich um #N 3#!.\nDie religiöse Siedlung erhöht sich um #P 2#!.\n#N 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird zu Radical.\nDas Projekt wird fortgesetzt."

 ve_cul_evt.7.t:0 "Die Initiative verliert an Legitimität"
 ve_cul_evt.7.d:0 "Die Equal Citizenship Initiative in [SCOPE.sState('ve_evt_target_state').GetName] verliert an Unterstützung sowohl von etablierten Institutionen als auch von der [SCOPE.sCulture('ve_evt_target_culture').GetName] Gemeinden, denen es dienen sollte. Radikale Bewegungen stellen mittlerweile jeden Kompromiss als Beweis dafür dar, dass die Regierung keine Gleichberechtigung gewährleisten kann."
 ve_cul_evt.7.f:0 "„Eine Reform kann den Widerstand überleben. Sie kann es nicht überleben, unglaubwürdig zu werden.“"
 ve_cul_evt.7.a:0 "Beenden Sie die Initiative."
 ve_cul_evt.7.a.tt:0 "Brechen Sie das Kulturprojekt ohne Rückerstattung des Kulturauftrags ab.\nDer nationale Zusammenhalt nimmt ab #N 5#!.\nFür #Y 2 Jahre#!: #N -50#! Bürokratie, #N -25#! Autorität und #N -3%#! Erfolg bei der Gesetzesverabschiedung."
 ve_cul_evt.7.b:0 "Erteilung lokaler Notfallzuschüsse."
 ve_cul_evt.7.b.tt:0 "Ausgabe #N 25#! Kulturauftrag.\nDer Fortschritt von Kulturprojekten verringert sich um #N 5#!.\n#N 1 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."
 ve_cul_evt.7.c:0 "Mit einem Minimalprogramm fortfahren."
 ve_cul_evt.7.c.tt:0 "Der Fortschritt des Kulturprojekts nimmt um #N 10#! ab.\nDer nationale Zusammenhalt nimmt um #N 2#! ab.\nDas Projekt wird fortgesetzt."
 ve_cul_evt.7.e:0 "Die Koalition neu aufbauen."
 ve_cul_evt.7.e.tt:0 "Ausgaben #N 15#! Kulturauftrag.\nDer Fortschritt von Kulturprojekten nimmt um #N 3#! ab.\nNationaler Zusammenhalt steigt um #P 2#!.\n#N 0,5 %#! des [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."

 ve_rel_evt.8.t:0 "Eine unerwartete lokale Eintracht"
 ve_rel_evt.8.d:0 "Geistliche, Gemeindebeamte und Gemeindeälteste in [SCOPE.sState('ve_evt_target_state').GetName] eine Einigung erzielt haben, die keine zentrale Richtlinie hätte hervorbringen können. Der Widerstand vor Ort lässt nach, die Gemeinden koordinieren die Mission selbst und die Konfessionsbekehrung hat eine unerwartete Dynamik erhalten."
 ve_rel_evt.8.f:0 "„Was als Befehl der Hauptstadt begann, ist zu einem Vertrag geworden, der auf dem Stadtplatz geschlossen wurde.“"
 ve_rel_evt.8.a:0 "Nutzen Sie diesen Schwung voll aus."
 ve_rel_evt.8.a.tt:0 "Religiöse Siedlung erhöht sich um #P 1#!.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 25#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."
 ve_rel_evt.8.b:0 "Haltbarkeit vor Geschwindigkeit."
 ve_rel_evt.8.b.tt:0 "Die religiöse Siedlung erhöht sich um #P 4#!.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 10#!.\nWenn der Fortschritt erreicht ist #Y 100#!, wird der normale Abschlusseffekt des Projekts angewendet."

 ve_cul_evt.8.t:0 "Eine lokale Bürgerkoalition"
 ve_cul_evt.8.d:0 "Lehrer, Gemeindebeamte, Handelsverbände und Vertreter der [SCOPE.sCulture('ve_evt_target_culture').GetName] Gemeinschaft in [SCOPE.sState('ve_evt_target_state').GetName] haben einen gemeinsamen Ausschuss gebildet. Durch die Beilegung von Streitigkeiten, bevor sie die Hauptstadt erreichen, hat diese Koalition der Equal Citizenship Initiative einen Schwung verliehen, den die Regierung nicht herbeiführen konnte."
 ve_cul_evt.8.f:0 "\„Staatsbürgerschaft wurde real, als Institutionen, die selten an einem Tisch saßen, begannen, Verantwortung zu teilen.“"
 ve_cul_evt.8.a:0 "Nutzen Sie den Schwung der Koalition."
 ve_cul_evt.8.a.tt:0 "Nationaler Zusammenhalt erhöht sich um #P 1#!.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 25#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."
 ve_cul_evt.8.b:0 "Machen Sie die Institutionen dauerhaft."
 ve_cul_evt.8.b.tt:0 "Der nationale Zusammenhalt erhöht sich um #P 4#!.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 10#!.\nWenn der Fortschritt #Y 100#! erreicht, beträgt der normale Abschlusseffekt des Projekts Angewendet."

 ve_rel_evt.40.t:0 "Datensätze außerhalb des Gleichschritts"
 ve_rel_evt.40.d:0 "Provinzregister verwenden in [SCOPE.sState('ve_evt_target_state').GetName] inkompatible Kategorien für Gemeinden, Bürgervereinigungen und öffentliche Einrichtungen. Berichte, die die Hauptstadt erreichen, widersprechen sich nun, so dass das Projekt nicht mehr in der Lage ist, Einhaltung von Widerstand zu unterscheiden."
 ve_rel_evt.40.f:0 "\„Eine über drei Hauptbücher verwaltete Richtlinie erhält bald drei unterschiedliche Realitäten.\“"
 ve_rel_evt.40.a:0 "Senden Sie eine zentrale Prüfung."
 ve_rel_evt.40.a.tt:0 "Geben Sie #N 10#! Frömmigkeitsreform aus.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 5#!.\nDie religiöse Siedlung erhöht sich um #P 1#!."
 ve_rel_evt.40.b:0 "Gleichen Sie die Datensätze lokal ab."
 ve_rel_evt.40.b.tt:0 "Der Fortschritt des Religiösen Projekts verringert sich um #N 3#!.\nDer Fortschritt der Religiösen Siedlung erhöht sich um #P 2#!."
 ve_rel_evt.40.c:0 "Wenden Sie das Standardregistrierungsverfahren an."
 ve_rel_evt.40.c.tt:0 "Geben Sie #N 5#! Frömmigkeitsreform aus.\nDer Fortschritt des Religiösen Projekts erhöht sich um #P 4#!.\nReligiöse Siedlung erhöht sich um #P 1#!."

 ve_rel_evt.41.t:0 "Ein Mangel an Provinzpersonal"
 ve_rel_evt.41.d:0 "Die Büros, die das Projekt leiten [SCOPE.sState('ve_evt_target_state').GetName] Es kann nicht genügend ausgebildete Angestellte, Lehrer und Inspektoren finden. Anweisungen häufen sich schneller, als lokale Beamte sie interpretieren können, und übereilte Ernennungen drohen, jeden Streit noch schlimmer zu machen."
 ve_rel_evt.41.f:0 "„Das Dekret kam an einem Tag an. Es kann eine Generation dauern, bis die Leute in der Lage sind, es umzusetzen.“"
 ve_rel_evt.41.a:0 "Finanzieren Sie einen neuen Kader von Beamten."
 ve_rel_evt.41.a.tt:0 "Ausgaben #N 15#! Frömmigkeitsreform.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 6#!."
 ve_rel_evt.41.b:0 "Verlangsamen Sie die Umsetzung."
 ve_rel_evt.41.b.tt:0 "Der Fortschritt des Religiösen Projekts verringert sich um #N 6#!.\nDie Religiöse Siedlung erhöht sich um #P 2#!."
 ve_rel_evt.41.c:0 "Nutzt das bestehende Bildungsnetzwerk."
 ve_rel_evt.41.c.tt:0 "Geben Sie #N 10#! Frömmigkeitsreform aus.\nDer Fortschritt des Religiösen Projekts erhöht sich um #P 5#!.\nReligiöse Siedlung erhöht sich um #P 1#!."

 ve_rel_evt.42.t:0 "Gerüchte im ganzen Bezirk"
 ve_rel_evt.42.d:0 "Gerüchte in [SCOPE.sState('ve_evt_target_state').GetName] Sie behaupten, hinter dem Projekt stecken weitaus härtere Maßnahmen als die von der Regierung angekündigten. Religiöse Organisatoren und lokale Agitatoren wiederholen widersprüchliche Geschichten, während das offizielle Schweigen jeder neuen Version Raum für die Verbreitung gibt."
 ve_rel_evt.42.f:0 "\\"Ein Gerücht erfordert kein Büro, kein Budget und keine Unterschrift.\\""
 ve_rel_evt.42.a:0 "Veröffentlichen Sie die Berichte."
 ve_rel_evt.42.a.tt:0 "Der Fortschritt des religiösen Projekts verringert sich um #N 3#!.\nDie religiöse Siedlung erhöht sich um #P 4#!."
 ve_rel_evt.42.b:0 "Entfernen Sie die Aufregung."
 ve_rel_evt.42.b.tt:0 "Der Fortschritt des religiösen Projekts erhöht sich um #P 5#!.\nDie religiöse Siedlung verringert sich um #N 3#!.\n#N 1 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_rel_evt.42.c:0 "Beauftragen Sie lokale Mediatoren."
 ve_rel_evt.42.c.tt:0 "Geben Sie #N 10 aus#! Frömmigkeitsreform.\nDer Fortschritt religiöser Projekte erhöht sich um #P 4#!.\nDie religiöse Siedlung erhöht sich um #P 2#!.\n#P 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird loyal."

 ve_rel_evt.43.t:0 "Die Regierung am Bruchpunkt"
 ve_rel_evt.43.d:0 "Das Projekt in [SCOPE.sState('ve_evt_target_state').GetName] steht kurz vor dem Verwaltungskollaps. Die Provinzämter sind überlastet, das Vertrauen der Öffentlichkeit ist zusammengebrochen und die organisierte Opposition betrachtet nun jede neue Richtlinie als Beweis dafür, dass die Regierung die Kontrolle verloren hat."
 ve_rel_evt.43.f:0 "\„Wenn die Akten aufhören, sich zu bewegen, breitet sich die Krise auf der Straße aus.“"
 ve_rel_evt.43.a:0 "Beenden Sie das Programm."
 ve_rel_evt.43.a.tt:0 "Brechen Sie das religiöse Projekt ohne Rückerstattung der Frömmigkeitsreform ab.\nDie religiöse Siedlung verringert sich um #N 5#!.\nFür #Y 2 Jahre#!: #N -50#! Bürokratie, #N -50#! Autorität und #N -3 %#! Erfolg bei der Gesetzesverabschiedung."
 ve_rel_evt.43.b:0 "Übertragen Sie Notfallressourcen."
 ve_rel_evt.43.b.tt:0 "Geben Sie #N 25#! Frömmigkeitsreform aus.\nDer Fortschritt des Religiösen Projekts verringert sich um #N 5#!.\n#N 1%#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."
 ve_rel_evt.43.c:0 "Mit einem Restpersonal fortfahren."
 ve_rel_evt.43.c.tt:0 "Der Fortschritt des religiösen Projekts verringert sich um #N 10#!.\nReligiöse Siedlung verringert sich um #N 2#!.\nDas Projekt wird fortgesetzt."
 ve_rel_evt.43.e:0 "Bauen Sie die lokale Partnerschaft wieder auf."
 ve_rel_evt.43.e.tt:0 "Geben Sie #N 15 aus#! Frömmigkeitsreform.\nDer Fortschritt des Religionsprojekts nimmt um #N 3#! ab.\nDie Zahl der religiösen Siedlungen nimmt um #P 2#! zu.\n#N 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."

 ve_rel_evt.100.t:0 "Sitze im Interfaith Council"
 ve_rel_evt.100.d:0 "Delegierte in [SCOPE.sState('ve_evt_target_state').GetName] Ich bin mir einig, dass ein interreligiöser Rat notwendig ist, aber nicht darüber, wer einen Sitz verdient. Eine proportionale Vertretung würde kleinere Gemeinden beruhigen, während eine in der Hauptstadt geplante feste Siedlung sofort mit der Arbeit beginnen könnte."
 ve_rel_evt.100.f:0 "„Jeder unterstützt einen gemeinsamen Tisch, bis die Stühle gezählt sind.“"
 ve_rel_evt.100.a:0 "Verteilen Sie die Repräsentation nach Bevölkerung."
 ve_rel_evt.100.a.tt:0 "Der Fortschritt des religiösen Projekts verringert sich um #N 3#!.\nReligiöse Siedlung erhöht sich um #P 4#!."
 ve_rel_evt.100.b:0 "Legen Sie einen festen zentralen Kompromiss fest."
 ve_rel_evt.100.b.tt:0 "Religiöser Projektfortschritt erhöht sich um #P 5#!.\nDie religiöse Siedlung verringert sich um #N 2#!.\n#N 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_rel_evt.100.c:0 "Stärkt die interreligiösen Räte."
 ve_rel_evt.100.c.tt:0 "Geben Sie #N 10#! Frömmigkeitsreform aus.\nDer Fortschritt bei religiösen Projekten erhöht sich um #P 5#!.\nDer Fortschritt bei religiösen Siedlungen erhöht sich um #P 2#!."

 ve_rel_evt.101.t:0 "Ein gemeinsamer Schullehrplan"
 ve_rel_evt.101.d:0 "Schulen in [SCOPE.sState('ve_evt_target_state').GetName] brauchen gemeinsamen Staatsbürgerunterricht, ohne den Freedom Outreach in eine Kampagne gegen den lokalen Glauben zu verwandeln. Lehrer fordern klare Materialien und gemeinsame Ausbildung, während Gemeindevorsteher darauf bestehen, dass der örtliche Unterricht Raum für ihre Traditionen lässt."
 ve_rel_evt.101.f:0 "\„Eine gemeinsame Unterrichtsstunde gelingt nur, wenn jede Familie das Klassenzimmer als ihr eigenes anerkennt.“"
 ve_rel_evt.101.a:0 "Finanzieren Sie einen gemeinsamen Lehrkader."
 ve_rel_evt.101.a.tt:0 "Geben Sie #N 15#! Frömmigkeitsreform aus.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 6#!.\nDer Fortschritt der religiösen Siedlung erhöht sich um #P 1#!."
 ve_rel_evt.101.b:0 "Lassen Sie Raum für lokale Lehrpläne."
 ve_rel_evt.101.b.tt:0 "Religiöser Projektfortschritt verringert sich um #N 4#!.\nReligiöse Siedlung erhöht sich um #P 3#!."
 ve_rel_evt.101.c:0 "Bringen Sie die Reformkoalition in die Schulen."
 ve_rel_evt.101.c.tt:0 "Geben Sie #N 10 aus#! Frömmigkeitsreform.\nReligiöser Projektfortschritt erhöht sich um #P 5#!.\nReligiöse Siedlung erhöht sich um #P 2#!.\n#P 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird loyal."

 ve_rel_evt.102.t:0 "Eine Charta der gegenseitigen Garantien"
 ve_rel_evt.102.d:0 "Religionsgemeinschaften, Kommunalbeamte und Reformvereine in [SCOPE.sState('ve_evt_target_state').GetName] haben eine gemeinsame Charta entworfen. Jeder Unterzeichner übernimmt die gleichen bürgerschaftlichen Verpflichtungen im Gegenzug für öffentliche Garantien, dass keine Gemeinde von lokalen Institutionen ausgeschlossen wird."
 ve_rel_evt.102.f:0 "„Vertrauen wurde möglich, als jedes Versprechen als das Recht einer anderen Partei niedergeschrieben wurde.“"
 ve_rel_evt.102.a:0 "Nutzen Sie die Dynamik des Pakts."
 ve_rel_evt.102.a.tt:0 "Die religiöse Siedlung erhöht sich um #P 2#!.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 20#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."
 ve_rel_evt.102.b:0 "Machen Sie die Garantien dauerhaft."
 ve_rel_evt.102.b.tt:0 "Die religiöse Siedlung erhöht sich um #P 4#!.\n#P 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird Loyalist.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 10#!.\nWenn der Fortschritt erreicht ist #Y 100#!, wird der normale Abschlusseffekt des Projekts angewendet."

 ve_rel_evt.150.t:0 "Lehrer oder Inspektoren?"
 ve_rel_evt.150.d:0 "Die Säkularisierungskampagne in [SCOPE.sState('ve_evt_target_state').GetName] hat einen Mangel an gebildetem Personal aufgedeckt. Die Verwaltung kann das Lehrkorps erweitern, um langfristig bürgerschaftliche Kapazitäten aufzubauen, oder sich auf Inspektoren verlassen, die die neuen Regeln mit dem bereits verfügbaren Personal durchsetzen können."
 ve_rel_evt.150.f:0 "„Ein Inspektor kann eine Schule an einem Nachmittag schließen. Ein Lehrer kann Jahre brauchen, um das zu ersetzen, was dort gelehrt wurde.“"
 ve_rel_evt.150.a:0 "Erweitern Sie das Lehrerkorps."
 ve_rel_evt.150.a.tt:0 "Geben Sie #N 15#! Frömmigkeitsreform aus.\nDer Fortschritt des Religiösen Projekts erhöht sich um #P 6#!."
 ve_rel_evt.150.b:0 "Verlangsamen Sie das Programm, um es an das vorhandene Personal anzupassen."
 ve_rel_evt.150.b.tt:0 "Der Fortschritt des Religiösen Projekts verringert sich um #N 5#!.\nDie Religiöse Siedlung erhöht sich um #P 2#!."
 ve_rel_evt.150.c:0 "Beauftragen Sie das öffentliche Bildungsnetzwerk."
 ve_rel_evt.150.c.tt:0 "Geben Sie #N 10#! Frömmigkeitsreform aus.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 5#!.\nDie religiöse Siedlung erhöht sich um #P 1#!."

 ve_rel_evt.151.t:0 "Die beschlagnahmten Besitztümer"
 ve_rel_evt.151.d:0 "Ehemalige religiöse Besitztümer in [SCOPE.sState('ve_evt_target_state').GetName] stehen für die Umwandlung in Schulen, Kliniken und Bürgerämter bereit. Eine sofortige Übertragung würde der Kampagne wertvolle Infrastruktur verschaffen, aber das Fehlen einer Entschädigung wird zum Sammelpunkt für die Gläubigen."
 ve_rel_evt.151.f:0 "\„Die Schlüssel wechselten an einem Morgen den Besitzer. Der Streit um das Eigentum wird die Schlösser überdauern.\“"
 ve_rel_evt.151.a:0 "Zahlen Sie die Entschädigung in Etappen."
 ve_rel_evt.151.a.tt:0 "Geben Sie #N 15#! Frömmigkeitsreform aus.\nDer Fortschritt des Religiösen Projekts erhöht sich um #P 3#!.\nDer Fortschritt der Religiösen Siedlung erhöht sich um #P 3#!."
 ve_rel_evt.151.b:0 "Stellen Sie die Grundstücke sofort in den öffentlichen Dienst."
 ve_rel_evt.151.b.tt:0 "Der Fortschritt des Religiösen Projekts erhöht sich um #P 7#!.\nDer Fortschritt der Religiösen Siedlung verringert sich um #N 4#!.\n#N 1 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDie Gläubigen verlieren #N 1#! Anerkennung für #Y 2,5 Jahre#!."
 ve_rel_evt.151.c:0 "Übertragen Sie sie in säkulare Wohlfahrtseinrichtungen."
 ve_rel_evt.151.c.tt:0 "Verbringen Sie #N 10#! Frömmigkeitsreform.\nDer Fortschritt des religiösen Projekts steigt um #P 5#!.\nReligiöse Siedlung erhöht sich um #P 2#!.\n#P 0,5 %#! der Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird loyal."

 ve_rel_evt.152.t:0 "Bürgervereine gründen sich"
 ve_rel_evt.152.d:0 "Lehrerkreise, Hilfsvereine und Kommunalverbände in [SCOPE.sState('ve_evt_target_state').GetName] haben begonnen, Dienstleistungen anzubieten, die einst von religiösen Institutionen organisiert wurden. Ihre Zusammenarbeit hat der Säkularisierungskampagne eine lokale bürgerschaftliche Grundlage statt nur einer Verwaltungspräsenz gegeben."
 ve_rel_evt.152.f:0 "\„Die neue Ordnung hielt Bestand, als die Bürger begannen, sie aufrechtzuerhalten, ohne auf einen Inspektor zu warten.“"
 ve_rel_evt.152.a:0 "Nutzen Sie die lokale Dynamik."
 ve_rel_evt.152.a.tt:0 "Die religiöse Siedlung erhöht sich um #P 2#!.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 20#!.\nWenn der Fortschritt #Y 100#! erreicht, wird der normale Abschlusseffekt des Projekts angewendet."
 ve_rel_evt.152.b:0 "Verwandle die Verbände in permanente Institutionen."
 ve_rel_evt.152.b.tt:0 "Die religiöse Siedlung erhöht sich um #P 4#!.\nDer Fortschritt des religiösen Projekts erhöht sich um #P 10#!.\nWenn der Fortschritt erreicht #Y 100#!, der normale Abschlusseffekt des Projekts wird angewendet."

 ve_cul_evt.40.t:0 "Örtliche Schulbehörden"
 ve_cul_evt.40.d:0 "Schulbehörden in [SCOPE.sState('ve_evt_target_state').GetName] Uneinigkeit über den Ort des [SCOPE.sCulture('ve_evt_target_culture').GetName] Sprache im öffentlichen Unterricht. Der Unterricht in der Landessprache würde das Vertrauen wahren, während eine einzige Verwaltungssprache die Steuerung des nationalen Projekts erleichtern würde."
 ve_cul_evt.40.f:0 "\\"Die für die erste Unterrichtsstunde gewählte Sprache entscheidet oft darüber, wer glaubt, dass die Schule ihm gehört.\\""
 ve_cul_evt.40.a:0 "Schützen Sie die lokale Sprache."
 ve_cul_evt.40.a.tt:0 "Der Fortschritt des Kulturprojekts verringert sich um #N 4#!.\nDer nationale Zusammenhalt steigt um #P 3#!."
 ve_cul_evt.40.b:0 "Eine Verwaltungssprache wird eingeführt."
 ve_cul_evt.40.b.tt:0 "Der Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nDer nationale Zusammenhalt nimmt um #N 2#! ab.\n#N 0,5 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.40.c:0 "Erweitern Sie das Lehrernetzwerk."
 ve_cul_evt.40.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 4#!.\nNationaler Zusammenhalt steigt um #P 2#!."

 ve_cul_evt.41.t:0 "Statistische Grenzen"
 ve_cul_evt.41.d:0 "Behördenvermessung [SCOPE.sState('ve_evt_target_state').GetName] Ich kann mich nicht einigen, wo die [SCOPE.sCulture('ve_evt_target_culture').GetName] Gemeinschaft beginnt und endet. Lokale Identitäten überschneiden sich je nach Sprache, Bezirk und Brauchtum, aber das nationale Projekt erfordert Kategorien, die gezählt und verwaltet werden können."
 ve_cul_evt.41.f:0 "„Eine für die Volkszählung gezogene Grenze gewinnt bald Beamte, Budgets und Verteidiger.“"
 ve_cul_evt.41.a:0 "Lassen Sie Raum für Selbstidentifikation."
 ve_cul_evt.41.a.tt:0 "Der Fortschritt des Kulturprojekts verringert sich um #N 3#!.\nNationaler Zusammenhalt steigt um #P 3#!."
 ve_cul_evt.41.b:0 "Lassen Sie die Mitte die Grenzen definieren."
 ve_cul_evt.41.b.tt:0 "Der Fortschritt des Kulturprojekts erhöht sich um #P 6#!.\nNationaler Zusammenhalt sinkt um #N 3#!.\n#N 0,5 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.41.c:0 "Verwenden Sie das Standard-Registrierungssystem."
 ve_cul_evt.41.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nNationaler Zusammenhalt steigt um #P 1#!."

 ve_cul_evt.42.t:0 "Das nationale Projekt am Bruchpunkt"
 ve_cul_evt.42.d:0 "Das nationale Projekt in [SCOPE.sState('ve_evt_target_state').GetName] steht kurz vor dem Zusammenbruch. Radikale Bewegungen behaupten, die Regierung habe entweder die Regierung verraten [SCOPE.sCulture('ve_evt_target_culture').GetName] Gemeinschaft oder sich ihr ergeben, während die örtlichen Behörden nicht mehr das Selbstvertrauen haben, einen weiteren Kompromiss durchzusetzen."
 ve_cul_evt.42.f:0 "\\"Eine Siedlung, die sowohl durch Zwang als auch durch Kapitulation angegriffen wird, kann bald überhaupt keine Siedlung mehr sein.\\""
 ve_cul_evt.42.a:0 "Beenden Sie das Projekt."
 ve_cul_evt.42.a.tt:0 "Abbruch des Kulturprojekts ohne Rückerstattung des Kulturauftrags.\nDer nationale Zusammenhalt nimmt um #N 5#! ab.\nFür #Y 2 Jahre#!: #N -50#! Bürokratie, #N -25#! Autorität und #N -3 %#! Erfolg bei der Verabschiedung von Gesetzen."
 ve_cul_evt.42.b:0 "Übertragung lokaler Notfallressourcen."
 ve_cul_evt.42.b.tt:0 "Geben Sie #N 25#! Kulturauftrag aus.\nDer Fortschritt des Kulturprojekts verringert sich um #N 5#!.\n#N 1%#! des [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."
 ve_cul_evt.42.c:0 "Fahren Sie mit einem Minimalprogramm fort."
 ve_cul_evt.42.c.tt:0 "Der Fortschritt des Kulturprojekts nimmt um #N 10#! ab.\nDer nationale Zusammenhalt nimmt um ab #N 2#!.\nDas Projekt wird fortgesetzt."
 ve_cul_evt.42.e:0 "Neuaufbau des Verhandlungsrahmens."
 ve_cul_evt.42.e.tt:0 "Geben Sie #N 15#! Kulturauftrag aus.\nDer Fortschritt des Kulturprojekts verringert sich um #N 3#!.\nDer nationale Zusammenhalt steigt um #P 2#!.\n#N 0,5%#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal.\nDas Projekt wird fortgesetzt."

 ve_cul_evt.50.t:0 "Die Nachnamen- und Sprachenrichtlinie"
 ve_cul_evt.50.d:0 "Beamte in [SCOPE.sState('ve_evt_target_state').GetName] schlagen Sie vor, Nachnamen und öffentliche Aufzeichnungen in der Landessprache zu standardisieren. Die Richtlinie würde die [SCOPE.sCulture('ve_evt_target_culture').GetName] Die Bevölkerung ist für die Zentralverwaltung leichter zu klassifizieren, aber Familien befürchten, dass ihre private Identität zum Gegenstand staatlicher Befehlsgewalt wird."
 ve_cul_evt.50.f:0 "„Ein anders geschriebener Name im Register kann immer noch der Name sein, mit dem sich eine Familie an sich selbst erinnert.“"
 ve_cul_evt.50.a:0 "Finanzieren Sie eine schrittweise Registrierungskampagne."
 ve_cul_evt.50.a.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt von Kulturprojekten erhöht sich um #P 4#!.\nDer nationale Zusammenhalt erhöht sich um #P 1#!.\n#N 0,5 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] werden radikal."
 ve_cul_evt.50.b:0 "Erzwingen Sie einen nationalen Standard."
 ve_cul_evt.50.b.tt:0 "Der Fortschritt von Kulturprojekten erhöht sich um #P 7#!.\nNationaler Zusammenhalt nimmt um #N 4#!.\n#N 1%#! der ab [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.50.c:0 "Entfernen Sie die Richtlinie zur Überarbeitung."
 ve_cul_evt.50.c.tt:0 "Der Fortschritt des Kulturprojekts nimmt um #N 5#! ab.\nDer nationale Zusammenhalt nimmt um #P 3 zu#!."

 ve_cul_evt.51.t:0 "Die Wehrpflichtregister"
 ve_cul_evt.51.d:0 "Militärbeamte in [SCOPE.sState('ve_evt_target_state').GetName] fordern ein einheitliches Register für Dienstverpflichtungen, Nachnamen und Befehle. Anwenden auf die [SCOPE.sCulture('ve_evt_target_culture').GetName] Die Bevölkerung würde die Bemühungen zur ethnischen Integration stärken, doch der Widerstand wächst unter Gemeinschaften, die die Armee als ein weiteres Instrument der kulturellen Auslöschung betrachten."
 ve_cul_evt.51.f:0 "„Der Staat erfährt zuerst die Namen eines Dorfes, wenn er seine Steuern eintreiben oder seine Söhne herbeirufen möchte.“"
 ve_cul_evt.51.a:0 "Wenden Sie die nationalen Register an."
 ve_cul_evt.51.a.tt:0 "Der Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nNationaler Zusammenhalt sinkt um #N 2#!.\n#N 0,5 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.51.b:0 "Bewahren Sie lokale Registrierungspraktiken."
 ve_cul_evt.51.b.tt:0 "Der Fortschritt von Kulturprojekten nimmt um #N 3#! ab.\nDer nationale Zusammenhalt nimmt um #P 3#! zu."
 ve_cul_evt.51.c:0 "Integration der Register durch Militärdienst."
 ve_cul_evt.51.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt von Kulturprojekten steigt um #P 6#!.\nNationaler Zusammenhalt steigt um #P 1#!.\n#N 0,5 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Die Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."

 ve_cul_evt.100.t:0 "Die verfassungsgebende Delegation"
 ve_cul_evt.100.d:0 "Eine Delegation der [SCOPE.sCulture('ve_evt_target_culture').GetName] Gemeinschaft in [SCOPE.sState('ve_evt_target_state').GetName] ist mit Forderungen nach Vertretung in den Institutionen des verfassungsgebenden Paktes eingetroffen. Verhandlungen würden das Projekt verlangsamen, aber seine Legitimität stärken; Eine von der Hauptstadt auferlegte Einigung könnte auf Kosten des Vertrauens schneller vorankommen."
 ve_cul_evt.100.f:0 "\\"Ein Pakt wird nur dann üblich, wenn jeder Wähler auf eine Klausel verweisen kann, die er mitgeschrieben hat.\\""
 ve_cul_evt.100.a:0 "Verhandeln Sie über ihren Platz im Pakt."
 ve_cul_evt.100.a.tt:0 "Der Fortschritt des Kulturprojekts nimmt um #N 4#! ab.\nDer nationale Zusammenhalt nimmt um #P 4#! zu."
 ve_cul_evt.100.b:0 "Setzen Sie die Zentralregelung durch."
 ve_cul_evt.100.b.tt:0 "Der Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nDer nationale Zusammenhalt nimmt um #N 2#! ab.\n#N 0,5 %#! der [SCOPE.sCulture('ve_evt_target_culture').GetName] Bevölkerung in [SCOPE.sState('ve_evt_target_state').GetName] wird radikal."
 ve_cul_evt.100.c:0 "Bringen Sie die parlamentarische Koalition in die Gespräche ein."
 ve_cul_evt.100.c.tt:0 "Geben Sie #N 10#! Kulturmandat aus.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 4#!.\nDer nationale Zusammenhalt steigt um #P 2#!."

 ve_cul_evt.101.t:0 "Doppelte Verwaltung"
 ve_cul_evt.101.d:0 "Der Verfassungspakt in [SCOPE.sState('ve_evt_target_state').GetName] hängt nun von zwei sich überschneidenden Verwaltungen ab. Zentrale Beamte und Vertreter der [SCOPE.sCulture('ve_evt_target_culture').GetName] Gemeinschaft dupliziert Register, streitet um Ernennungen und erlässt widersprüchliche Anweisungen, während die Bürokratie des Landes erschöpft ist."
 ve_cul_evt.101.f:0 "\„Zwei Ämter können ihre Autorität einfacher teilen als sie sich einen Aktenschrank teilen können.\“"
 ve_cul_evt.101.a:0 "Finanzieren Sie einen gemeinsamen Verwaltungsstab."
 ve_cul_evt.101.a.tt:0 "Geben Sie #N 15#! Kulturauftrag aus.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 6#!."
 ve_cul_evt.101.b:0 "Verlangsamen Sie den Pakt, bis die Ämter zustimmen."
 ve_cul_evt.101.b.tt:0 "Fortschritt des Kulturprojekts verringert sich um #N 6#!.\nNationaler Zusammenhalt erhöht sich um #P 2#!."
 ve_cul_evt.101.c:0 "Vereinheitlichung der Ämter unter dem öffentlichen Dienst."
 ve_cul_evt.101.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt von Kulturprojekten erhöht sich um #P 5#!.\nNationaler Zusammenhalt erhöht sich um #P 2#!."

 ve_cul_evt.150.t:0 "Umsetzung in den Provinzen"
 ve_cul_evt.150.d:0 "Die Provinzverwaltungen berichten, dass das bundesweite Kulturprojekt mit völlig unterschiedlichen Geschwindigkeiten voranschreitet. Einige Ämter fordern finanzierte Umsetzungskommissionen, während andere warnen, dass die Aufzwingung eines einheitlichen Zeitplans für jede Region knappes Personal verbrauchen und das Vertrauen der Öffentlichkeit schwächen würde."
 ve_cul_evt.150.f:0 "„Ein nationaler Erlass wird einmal verfasst, muss aber in jedem Amt des Landes umgesetzt werden.“"
 ve_cul_evt.150.a:0 "Finanzieren Sie die Umsetzungsprovisionen."
 ve_cul_evt.150.a.tt:0 "Geben Sie #N 10 aus#! Kulturauftrag.\nDer Fortschritt von Kulturprojekten erhöht sich um #P 5#!."
 ve_cul_evt.150.b:0 "Verwenden Sie einen schrittweisen Zeitplan."
 ve_cul_evt.150.b.tt:0 "Der Fortschritt von Kulturprojekten verringert sich um #N 4#!.\nNationaler Zusammenhalt erhöht sich um #P 2#!."
 ve_cul_evt.150.c:0 "Standardisieren Sie die bestehende Verwaltung."
 ve_cul_evt.150.c.tt:0 "Geben Sie #N 5#! Kulturauftrag aus.\nDer Fortschritt von Kulturprojekten erhöht sich um #P 3#!.\nNationaler Zusammenhalt erhöht sich um #P 2#!."

 ve_cul_evt.151.t:0 "Die Sprache des Unterrichts"
 ve_cul_evt.151.d:0 "Der nationale Lehrplan erfordert eine gemeinsame Unterrichtssprache, dennoch bedienen Schulen im ganzen Land Gemeinschaften mit sehr unterschiedlichen Sprachtraditionen. Mehrsprachige Materialien würden das Vertrauen bewahren, aber die Verbreitung verzögern, während ein einziger Lehrplan die Klassenzimmer schnell erreichen könnte, auf die Gefahr hin, dass Bildung zu einem kulturellen Wettbewerb wird."
 ve_cul_evt.151.f:0 "\„Eine Lektion, die in einer Sprache erteilt wird, der der Schüler misstraut, kann für alles außer dem Fach im Gedächtnis bleiben.“"
 ve_cul_evt.151.a:0 "Finanzieren Sie mehrsprachige Materialien."
 ve_cul_evt.151.a.tt:0 "Geben Sie #N 10 aus#! Kulturauftrag.\nDer Fortschritt von Kulturprojekten erhöht sich um #P 3#!.\nDer nationale Zusammenhalt erhöht sich um #P 3#!."
 ve_cul_evt.151.b:0 "Wenden Sie einen nationalen Lehrplan an."
 ve_cul_evt.151.b.tt:0 "Der Fortschritt des Kulturprojekts steigt um #P 6#!.\nDer nationale Zusammenhalt nimmt um ab #N 3#!."
 ve_cul_evt.151.c:0 "Zusammenführung der Bildungs- und Wohlfahrtsnetzwerke."
 ve_cul_evt.151.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 5#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."

 ve_cul_evt.160.t:0 "Wer repräsentiert die Nation?"
 ve_cul_evt.160.d:0 "Das Shared Symbols-Projekt hat die Frage erneut aufgeworfen, wessen Geschichte, Uniformen, Denkmäler und Zeremonien für das gesamte Land stehen können. Rotierende Traditionen würden die Anerkennung erweitern, aber die Einigung verlangsamen; Die Auswahl eines offiziellen Narrativs würde Klarheit schaffen und gleichzeitig viele Bürger außen vor lassen."
 ve_cul_evt.160.f:0 "\\"Ein Symbol wird nur dann national, wenn Bürger sich darin sehen, ohne dass es einer Erklärung bedarf.\\""
 ve_cul_evt.160.a:0 "Rotieren Sie die Symbole im öffentlichen Gebrauch."
 ve_cul_evt.160.a.tt:0 "Der Fortschritt des Kulturprojekts nimmt um #N 3#! ab.\nDer nationale Zusammenhalt nimmt um #P 4#! zu."
 ve_cul_evt.160.b:0 "Wählen Sie ein offizielles Narrativ aus."
 ve_cul_evt.160.b.tt:0 "Der Fortschritt des Kulturprojekts erhöht sich um #P 6#!.\nNationaler Zusammenhalt verringert sich um #N 3#!."
 ve_cul_evt.160.c:0 "Entwerfen Sie eine gemeinsame öffentliche Zeremonie."
 ve_cul_evt.160.c.tt:0 "Geben Sie #N 10#! Kulturauftrag aus.\nDer Fortschritt des Kulturprojekts erhöht sich um #P 4#!.\nDer nationale Zusammenhalt erhöht sich um #P 2#!."
