 ve_idea_mass_conscription_technology_locked_tt:0 "#N Erfordert [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Erfordert [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Erfordert [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Boost-Idee"
 ve_boost_idea_tt:0 "#header Übernehmen Sie die Nächste Idee#!\nNational Insight: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nKaufstatus: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Kosten des nächsten Levels#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nVerwenden Sie die Kosten, die dem nächsten nicht gefüllten Level in dieser Gruppe entsprechen.\n\n#title Was passiert beim Kauf?#!\n#P Der nächste Modifikator in dieser Gruppe wird aktiv.#!\n#P Investitionen in die Doktrin und der Fortschritt der nationalen Idee erhöhen sich jeweils um 1.#!\n#N Ein 24-monatiger Zyklus zur Umsetzung der Doktrin beginnt. Währenddessen kann keine andere Gruppenidee gekauft werden.#!\n\n#title Warum kann die Schaltfläche deaktiviert werden?#!\nEinblick liegt unter den Kosten der nächsten Stufe; Doctrine Implementation ist aktiv; die Gruppe ist vollständig; oder die nächste Stufe erfordert eine nicht erforschte Technologie.\n\nDurch das Auflösen dieser Gruppe werden ihre Ideenmodifikatoren und der aktuelle Fortschritt entfernt. Aufgegebene Einblicke werden niemals zurückerstattet, aber ein durch einen Meilenstein bereits erworbener Gruppenplatz wird niemals widerrufen."
