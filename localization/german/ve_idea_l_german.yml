 ve_national_ideas:0 " Nationalideen"
 ve_idea_points:0 "#tooltippable_name Nationaler Einblick"
 ve_national_insight_tt:0 "#header National Insight#!\nLagerbestand: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nDiesen Monat: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nKaufstatus: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Was es tut#!\nNational Insight kauft einzelne Ideen innerhalb einer umfassenden Ideengruppe. Jeder aktive Kauf bringt National Ideas voran und erhöht die aktuelle Doctrine-Investition; Das Erreichen eines Investitionsmeilensteins gewährt dauerhaft Gruppenkapazität.\n\n#title Warum sich das monatliche Einkommen ändert#!\nBasis: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nAlphabetisierung: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nSchulen: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniversitäten: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nVerwaltung: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLegitimität: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nIntelligenz: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nSchulden, Aufruhr und Umsetzung: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Aktiendruck#!\nEinkommensmultiplikator: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nDas Einkommen wird halbiert bei #Y 750#! fällt auf ein Viertel bei #Y 900#! und stoppt bei #Y 1000#!. Ausgaben vor der Aktienobergrenze verhindern Einkommensverschwendung."
 ve_national_insight_implementation_strain:0 "Belastung durch Doktrinumsetzung"
 ve_national_insight_implementation_strain_desc:0 "Die Verwaltung passt Institutionen und Verfahren an eine neu verabschiedete nationale Doktrin an. Eine weitere Gruppenidee kann erst nach Ablauf dieses 24-monatigen Umsetzungszyklus übernommen werden."
 ve_total_ideas:0 "Ideengruppen"
 ve_traditions:0 "#tooltippable_concept Traditionen: "
 ve_bonus:0 "#tooltippable_concept Bonus: "
 ve_ambition:0 "Ehrgeiz"
 ve_ambition_tooltip:0 "#Y Ehrgeiz#!\n#P Permanente Abschlussbelohnung#!\nWird automatisch freigeschaltet, wenn alle sieben Ideen in dieser Gruppe angenommen wurden."
 ve_idea_cancel_warning:0 "#header Abbrechen [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Jeder aktive Ideenmodifikator in dieser Gruppe wird entfernt.#!\n#N Der Ambition-Modifikator wird ebenfalls entfernt, wenn er freigeschaltet wurde.#!\n\nVerbrauchte nationale Einsicht wird nicht zurückerstattet.\nNationale Einsicht zurückgegeben: #Y 0#!\n\n#title Effekte, die entfernt werden#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Bestätigen: Diese Idee abbrechen Gruppe.#! Fortschritte und Modifikatoren gehen verloren, National Insight wird nicht zurückerstattet."
 ve_idea_cancel_keep_tt:0 "Diese Ideengruppe behalten – nicht abbrechen."
 ve_embrace:0 "Umarmen"
 ve_idea_locked:0 "Pfad geschlossen"
 ve_idea_locked_tt:0 "#N Diese Ideengruppe schließt sich gegenseitig aus mit der, die Sie bereits angenommen haben. Brechen Sie diese Gruppe ab, um diesen Pfad zu öffnen."
 ve_idea_age_locked:0 "Technologie erforderlich"
 ve_idea_age_locked_tt:0 "#N Diese Ideengruppe erfordert eine Technologie, die noch nicht erforscht wurde."
 ve_idea_labour_technology_locked_tt:0 "#N Erfordert [GetTechnology('labor_movement').GetName].#!"
