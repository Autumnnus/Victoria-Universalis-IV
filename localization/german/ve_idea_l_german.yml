 ve_national_ideas:0 " Nationale Doktrinen"
 ve_idea_points:0 "#tooltippable_name Nationaleinsicht"
 ve_national_insight_tt:0 "#header Nationaleinsicht#!\nBestand: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nDiesen Monat: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nKaufstatus: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Wirkung#!\nNationaleinsicht kauft einzelne Doktrinen innerhalb einer angenommenen Doktrinengruppe. Jeder aktive Kauf treibt Nationale Doktrinen voran und erhöht die aktuelle Doktrineninvestition; das Erreichen eines Investitionsmeilensteins gewährt dauerhaft Gruppenkapazität.\n\n#title Warum sich das monatliche Einkommen ändert#!\nBasis: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nAlphabetisierung: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nSchulen: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniversitäten: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nVerwaltung: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLegitimität: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nIntelligenzija: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nSchulden, Aufruhr und Umsetzung: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Bestandsdruck#!\nEinkommensmultiplikator: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nDas Einkommen wird bei #Y 750#! halbiert, fällt bei #Y 900#! auf ein Viertel und stoppt bei #Y 1000#!. Ausgaben vor Erreichen der Bestandsobergrenze verhindern verschwendetes Einkommen."
 ve_national_insight_implementation_strain:0 "Doktrinenumsetzungslast"
 ve_national_insight_implementation_strain_desc:0 "Die Verwaltung passt Institutionen und Verfahren an eine neu angenommene nationale Doktrin an. Bis zum Ende dieses 24-monatigen Umsetzungszyklus kann keine weitere Gruppendoktrin angenommen werden."
 ve_total_ideas:0 "Doktrinengruppen"
 ve_traditions:0 "#tooltippable_concept Traditionen: "
 ve_bonus:0 "#tooltippable_concept Bonus: "
 ve_ambition:0 "Krönung"
 ve_ambition_tooltip:0 "#Y Krönung#!\n#P Dauerhafte Abschlussbelohnung#!\nWird automatisch freigeschaltet, sobald alle sieben Doktrinen in dieser Gruppe angenommen wurden."
 ve_idea_cancel_warning:0 "#header [StateRegion.MakeScope.Var('idea_group')] abbrechen?#!\n\n#N Jeder aktive Doktrinenmodifikator in dieser Gruppe wird entfernt.#!\n#N Ihr Krönungsmodifikator wird ebenfalls entfernt, falls er freigeschaltet wurde.#!\n\nAusgegebene Nationaleinsicht wird nicht erstattet.\nZurückgegebene Nationaleinsicht: #Y 0#!\n\n#title Effekte, die entfernt werden#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Bestätigen: Diese Doktrinengruppe abbrechen.#! Fortschritt und Modifikatoren gehen verloren, Nationaleinsicht wird nicht erstattet."
 ve_idea_cancel_keep_tt:0 "Diese Doktrinengruppe behalten – nicht abbrechen."
 ve_embrace:0 "Annehmen"
 ve_idea_locked:0 "Pfad verschlossen"
 ve_idea_locked_tt:0 "#N Diese Doktrinengruppe schließt sich mit der von Ihnen bereits angenommenen gegenseitig aus. Brechen Sie jene Gruppe ab, um diesen Pfad zu öffnen."
 ve_idea_age_locked:0 "Technik erforderlich"
 ve_idea_age_locked_tt:0 "#N Diese Doktrinengruppe erfordert eine Technik, die noch nicht erforscht wurde."
 ve_idea_labour_technology_locked_tt:0 "#N Erfordert [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Erfordert [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Erfordert [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Erfordert [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Erfordert [GetTechnology('enlistment_offices').GetName].#!}"
 ve_idea_colonial_technology_locked_tt:0 "#N Erfordert [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Erfordert [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Doktrin verbessern"
 ve_boost_idea_tt:0 "#header Nächste Doktrin annehmen#!\nNationaleinsicht: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nKaufstatus: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Kosten der nächsten Stufe#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nVerwenden Sie die Kosten, die der nächsten unbesetzten Stufe in dieser Gruppe entsprechen.\n\n#title Was beim Kauf geschieht#!\n#P Der nächste Modifikator in dieser Gruppe wird aktiv.#!\n#P Doktrineninvestition und Fortschritt der nationalen Doktrinen steigen jeweils um 1.#!\n#N Ein 24-monatiger Doktrinenumsetzungszyklus beginnt. Währenddessen kann keine andere Gruppendoktrin gekauft werden.#!\n\n#title Warum die Schaltfläche deaktiviert sein kann#!\nDie Einsicht liegt unter den Kosten der nächsten Stufe; die Doktrinenumsetzung ist aktiv; die Gruppe ist vollständig; oder die nächste Stufe erfordert eine unerforschte Technik.\n\nDas Abbrechen dieser Gruppe entfernt ihre Doktrinenmodifikatoren und den aktuellen Fortschritt. Ausgegebene Einsicht wird niemals erstattet, aber ein durch einen Meilenstein bereits verdienter Gruppenplatz wird niemals entzogen."
