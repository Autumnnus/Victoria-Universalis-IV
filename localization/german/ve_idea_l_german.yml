 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Frömmigkeitsreform/Monat#! bei konfessionellem oder staatlichem Atheismus und #P +1 kultureller Auftrag/Monat#! bei ethnischer Nation."
 nationalist_idea_7_tt:0 "#P +1 religiöser Projektfortschritt/Monat#! bei konfessionellem oder staatlichem Atheismus; #P +1 kultureller Projektfortschritt/Monat#! bei ethnischer Nation; Die Ergebnisse der erzwungenen religiösen und ethnischen Integration verbessern sich von #Y 5 %#! auf #Y 7 %#!."
 embrace_idea_tt:0 "#header Ideengruppenkapazität#!\nBenutzte Plätze: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nJetzt freie Slots: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nAktuelle Doktrin-Investition: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktiv gekaufte Ideen\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title So funktioniert die Kapazität#!\nJede aktiv gekaufte Gruppenidee liefert #P +1#! Doktrin der Investition. Erreichen #Y 4, 8, 13, 19, 26#! oder #Y 34#! fügt dauerhaft einen Gruppenslot hinzu. Für die Plätze 5–6 ist ebenfalls Alter 2 erforderlich; Für Slot 7 ist das 3. Lebensjahr erforderlich.\n\n#title Umarmen und absagen#!\nDas Umarmen einer Gruppe kostet keine Einsicht, belegt aber einen freien Platz. Durch das Abbrechen wird dieser Platz frei, die Modifikatoren der Gruppe werden entfernt und die aktuelle Investition in die Doktrin wird verringert. ausgegebene Insights werden nicht erstattet. Bereits erworbene Kapazitätsslots bleiben dauerhaft verfügbar."
 ve_idea_capacity_player_progress:0 "#title Nächster permanenter Slot#!\nSlot: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nFortschritt: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! gekaufte Ideen\nNoch benötigt: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Nächster permanenter Slot#!\nSlot: #Y 5#!\nFortschritt: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! gekaufte Ideen\nNoch benötigt: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nAltersvoraussetzung: #N Warten auf Alter 2#!"
 ve_idea_capacity_player_age_3:0 "#title Nächster permanenter Slot#!\nSlot: #Y 7#!\nFortschritt: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! gekaufte Ideen\nNoch benötigt: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nAltersvoraussetzung: #N Warten auf Alter 3#!"
