 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Frömmigkeitsfonds/Monat#! in Konfessionell oder Staatsatheismus und #P +1 Kulturmandat/Monat#! in Ethnische Nation."
 nationalist_idea_7_tt:0 "#P +1 Fortschritt religiöser Projekte/Monat#! in Konfessionell oder Staatsatheismus; #P +1 Fortschritt von Kulturprojekten/Monat#! in Ethnische Nation; Zwangsergebnisse der religiösen und ethnischen Eingliederung verbessern sich von #Y 5%#! auf #Y 7%#!."
 embrace_idea_tt:0 "#header Doktrinengruppenkapazität#!\nGenutzte Plätze: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nFreie Plätze jetzt: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nAktuelle Doktrininvestition: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktive gekaufte Doktrinen\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Funktionsweise der Kapazität#!\nJede aktive gekaufte Gruppendoktrin liefert #P +1#! Doktrininvestition. Das Erreichen von #Y 4, 8, 13, 19, 26#! oder #Y 34#! fügt dauerhaft einen Gruppenplatz hinzu. Plätze 5–6 erfordern zudem Zeitalter 2; Platz 7 erfordert Zeitalter 3.\n\n#title Annehmen und Abbrechen#!\nDas Annehmen einer Gruppe kostet keine Einsicht, belegt jedoch einen freien Platz. Das Abbrechen gibt diesen Platz frei, entfernt die Modifikatoren der Gruppe und senkt die aktuelle Doktrininvestition; ausgegebene Einsicht wird nicht erstattet. Bereits erworbene Kapazitätsplätze bleiben dauerhaft verfügbar."
 ve_idea_capacity_player_progress:0 "#title Nächster dauerhafter Platz#!\nPlatz: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nFortschritt: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! gekaufte Doktrinen\nNoch benötigt: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Nächster dauerhafter Platz#!\nPlatz: #Y 5#!\nFortschritt: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! gekaufte Doktrinen\nNoch benötigt: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nZeitaltervoraussetzung: #N Warten auf Zeitalter 2#!"
 ve_idea_capacity_player_age_3:0 "#title Nächster dauerhafter Platz#!\nPlatz: #Y 7#!\nFortschritt: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! gekaufte Doktrinen\nNoch benötigt: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nZeitaltervoraussetzung: #N Warten auf Zeitalter 3#!"
 ve_idea_capacity_player_max:0 "#P Maximale Kapazität erreicht: Alle 7 dauerhaften Gruppenplätze sind verfügbar.#!"
