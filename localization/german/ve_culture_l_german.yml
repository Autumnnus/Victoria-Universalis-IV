l_german:
 ve_national_identity:0 "Nationale Identität"
 ve_primary_cultures_label:0 "Hauptkulturen"
 ve_identity_models:0 "Identitätsmodelle"
 ve_identity_model_active_footer:0 "Bereits aktiv"
 ve_switch_identity_button:0 "Wechseln"
 ve_switch_identity_cost_label:0 "Kostet #Y 200 Kulturmandat#!"
 ve_begin_project_button:0 "Projekt beginnen"
 ve_identity_models_help:0 "Eure Nation hat stets genau ein Identitätsmodell, das #P bereits aktiv#! ist – Ihr müsst hier nichts auswählen. Das Modell bestimmt lediglich, wie #Y Nationaler Zusammenhalt#! aufgebaut wird und welches Kulturprojekt Ihr durchführen könnt.\n#Y Der Wechsel ist optional:#! Er kostet #Y 200 Kulturmandat#!, setzt den Zusammenhalt auf #Y 35#! zurück, bricht alle laufenden Kulturprojekte ab und sperrt einen erneuten Wechsel für 5 Jahre.\n#Y Bewegt den Mauszeiger über eine Karte oder einen Messbalken, um die vollständigen Effekte zu sehen.#!"
 ve_ethnic_identity_name:0 "Ethnische Nation"
 ve_civic_identity_name:0 "Staatsbürgernation"
 ve_composite_identity_name:0 "Gesamtstaat"
 ve_ethnic_identity_short:0 "Die Nation definiert sich über ihre Hauptkulturen.\nZusammenhalt entsteht durch #Y demografische Dominanz#!."
 ve_civic_identity_short:0 "Eine durch Schulbildung geschaffene politische Nation.\nZusammenhalt entsteht durch #Y Alphabetisierung und akzeptierte Minderheiten#!."
 ve_composite_identity_short:0 "Mehrere Völker unter verhandelten Institutionen.\nZusammenhalt entsteht durch #Y eine wahrhaft plurale Bevölkerung#!."
 ve_ethnic_identity_unlocks:0 "Schaltet das Projekt #Y Eingliederungskampagne#! frei"
 ve_civic_identity_unlocks:0 "Schaltet das Projekt #Y Gleichberechtigungsinitiative#! frei"
 ve_composite_identity_unlocks:0 "Schaltet das Projekt #Y Staatspakt#! frei"
 ve_ethnic_identity_desc:0 "#header Ethnische Nation#!\nDie Nation definiert sich über ihre Hauptkulturen.\n\n#Y Solange aktiv#!\n#P +15% Assimilierung, +5% Autorität#!\n#N -5% Migrationsanziehung, +5% Radikale durch offene Vorurteile#!\n\n#Y Zusammenhalt#!\nSteigt, wenn Hauptkulturen mindestens 60–75% der Bevölkerung ausmachen, und sinkt stark unter 40%.\n\n#Y Bei 75 Zusammenhalt#!\n#P +5% Einberufungsrate, +3 Legitimität#!\n\n#Y Kulturprojekt#!\nEingliederungskampagne"
 ve_civic_identity_desc:0 "#header Staatsbürgernation#!\nEine gemeinsame politische Nation wird durch Bildung und Teilhabe aufgebaut.\n\n#Y Solange aktiv#!\n#P +7% Migrationsanziehung, +1% Bildungszugang#!\n#N -10% Assimilierung, -5% Autorität, -50 Bürokratie#!\n\n#Y Zusammenhalt#!\nAlphabetisierung erhöht ihn, aber jede nicht zur Hauptkultur gehörende Bevölkerungsgruppe über 10% bei sehr geringer Akzeptanz senkt ihn.\n\n#Y Bei 75 Zusammenhalt#!\n#P +5% Qualifikationen, +3 Legitimität#!\n\n#Y Kulturprojekt#!\nGleichberechtigungsinitiative"
 ve_composite_identity_desc:0 "#header Gesamtstaat#!\nMehrere Völker werden durch verhandelte Institutionen regiert.\n\n#Y Solange aktiv#!\n#P -10% Radikale durch kulturelle Auslöschung und Bürger zweiter Klasse, +5% Einfluss#!\n#N -15% Assimilierung, -5% Autorität, -75 Bürokratie#!\n\n#Y Zusammenhalt#!\nEine wahrhaft plurale Bevölkerung erhöht ihn; eine Bevölkerung mit über 90% Hauptkulturen schwächt dieses Modell.\n\n#Y Bei 75 Zusammenhalt#!\n#P +5% Einfluss, +3 Legitimität#!\n\n#Y Kulturprojekt#!\nStaatspakt"
 ve_identity_change_cost_tt:0 "Das Ändern des Identitätsmodells erfordert #Y 200 Kulturmandat#! und keinen aktiven Identitätswechsel-Rückschlag. Die Änderung setzt den Zusammenhalt auf #Y 35#! zurück, verursacht einen #Y 5-jährigen Wechsel-Rückschlag#! und bricht laufende Kulturprojekte ohne zusätzliche Abbruchstrafe ab."
 ve_cultural_mandate:0 "Kulturmandat"
 ve_culture_reform_point:0 "Kulturmandat"
 ve_cultural_mandate_hint:0 "Wird für Kulturprojekte ausgegeben. Es zu sparen ist sicher, aber der Ertrag halbiert sich bei 400 und stoppt bei 500."
 ve_culture_reform_point_tt:0 "#header Kulturmandat#!\nAktuell: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nMonatliche Änderung: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Wofür es ausgegeben wird#!\nKulturprojekte (75–150) und Identitätsmodellwechsel (200). Keines davon ist zwingend erforderlich: Das Sparen von Mandat ist sicher, der Ertrag halbiert sich erst bei 400 und stoppt bei 500.\n\n#Y Monatliche Aufschlüsselung#!\nBasis: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLegitimität: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nVerwaltung: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nModellgesellschaft: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nStabilität und Kulturbewegungen: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nGesetzesausrichtung: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nDoktrin: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nObergrenzen-Multiplikator: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Doktrin – nur Euer aktuelles Identitätsmodell zählt#!\n#P Ethnische Nation#!: Nationalist V #P +1#!\n#P Staatsbürgernation#!: Reformistisch V #P +1#!; Akademisch V #P +1#!\n#P Gesamtstaat#!: Reformistisch V #P +1#!\nDie oben genannte aktive Gesamtsumme ist auf #Y +2#! begrenzt.\n\nDie Staatsbürgernation bezieht ihre Modellgesellschaftskomponente aus der Alphabetisierung, der Gesamtstaat aus der Alphabetisierung in einer pluralen Gesellschaft und die ethnische Nation aus der demografischen Stärke der Hauptkultur.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Nationaler Zusammenhalt"
 ve_national_cohesion_hint:0 "Driftet auf das Gleichgewicht zu, das Euer Identitätsmodell erzeugt. Bei 75+ erhaltet Ihr einen Bonus, bei 25 oder weniger Instabilität."
 ve_national_cohesion_tt:0 "#header Nationaler Zusammenhalt#!\nCurrent: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nEquilibrium: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMonthly movement: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nCommon conditions: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nIdentity-model conditions: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nCohesion moves 20% of the distance toward equilibrium each month, up to 5 points. Radical cultural movements reduce equilibrium by 10. At 75 or more the current model grants an additional benefit; at 25 or less national instability applies.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Kein Effekt"
 ve_cultural_projects:0 "Kulturprojekte"
 ve_cultural_projects_intro:0 "Kulturprojekte sind #Y optional#!. Es kann jeweils nur eines gleichzeitig laufen: Seine Kosten an Mandat werden sofort bezahlt und #N -75 Bürokratie und -25 Autorität#! gelten, solange es aktiv ist. Der Abschluss eines Projekts erstattet einen Teil des Mandats und erhöht den Zusammenhalt. Landesweite Projekte können erst nach Ablauf ihres Abschlussvorteils wiederholt werden; ein abgeschlossenes Ziel (Staat/Kultur) kann nicht erneut ausgewählt werden.\n#Y Fahren Sie mit der Maus über eine Karte oder Leiste, um deren vollständige Effekte anzuzeigen.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Laufendes Projekt"
 ve_cultural_project_progress:0 "Projektfortschritt"
 ve_cultural_project_progress_tt:0 "#header Monatlicher Projektfortschritt#!\nCurrent: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nRemaining: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nMonthly total: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (minimum 1, maximum 7)\n\n#Y Monthly breakdown#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministration: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nModel Society: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nCohesion: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nCultural Movements: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nTarget-State Turmoil: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nIdea Groups: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Doktrinengruppen — nur Boni, die zu Ihrem aktuellen Identitätsmodell passen, sind aktiv#!\n#P Ethnische Nation#!: Nationalist VII #P +1#!\n#P Staatsbürgernation#!: Reformist VII, Akademisch VII oder Wohlfahrt VI — je #P +1#!\n#P Gesamtstaat#!: Reformist VII oder Diplomatisch VI — je #P +1#!\nDie Summe der aktiven Doktrinengruppen ist oben auf #Y +2#! begrenzt; weitere passende Boni erhöhen den Fortschritt nicht.\n\nModellgesellschaft belohnt bürgerliche Alphabetisierung, ethnische demografische Konzentration oder Gesamtstaatsvielfalt gemäß dem aktiven Identitätsmodell. Der Abschluss wird beim nächsten monatlichen Update aufgelöst, nachdem der Fortschritt #Y 100#! erreicht hat."
 ve_cancel_cultural_project_button:0 "Projekt abbrechen"
 ve_cancel_cultural_project_tt:0 "#header Kulturprojekt abbrechen#!\nDas investierte Kulturmandat wird #N nicht erstattet#!. Der nationale Zusammenhalt sinkt um #N 5#! und ein #N 2-jähriger Rückschlag#! verhindert ein weiteres Projekt."
 ve_start_cultural_project_button:0 "Projekt starten"
 ve_national_curriculum_name:0 "Nationaler Lehrplan"
 ve_national_curriculum_cost:0 "Kosten: #Y 100 Kulturmandat#!"
 ve_national_curriculum_short:0 "Eine landesweite Schulreform.\n#P +20 Mandat, +5 Zusammenhalt#!, danach bessere Bildung."
 ve_national_curriculum_desc:0 "#header Nationaler Lehrplan#!\nEine im ganzen Land durchgeführte Schulreform.\n\n#Y Kosten#!\n#Y 100 Kulturmandat#!, sofort bezahlt\n\n#Y Bei Abschluss#!\n#P +20 Kulturmandat, +5 nationaler Zusammenhalt#!\n\n#Y Für die folgenden 10 Jahre#!\n#P +2% Bildungszugang, +5% Qualifikationen#!\n#N -25 Bürokratie#!"
 ve_national_curriculum_requirements_tt:0 "Erfordert #Y 100 Kulturmandat#!, kein aktives Kulturprojekt und keinen Projektrückschlag. Es kann zudem nicht begonnen werden, während der vorherige Vorteil des #Y Nationalen Lehrplans#! aktiv ist."
 ve_shared_symbols_name:0 "Gemeinsame Symbole"
 ve_shared_symbols_cost:0 "Kosten: #Y 75 Kulturmandat#!"
 ve_shared_symbols_short:0 "Flaggen, Hymnen und öffentliche Zeremonien.\n#P +20 Mandat, +7 Zusammenhalt#!, danach Loyalisten und Autorität."
 ve_shared_symbols_desc:0 "#header Gemeinsame Symbole#!\nFlaggen, Hymnen und öffentliche Zeremonien, im ganzen Land gefördert.\n\n#Y Kosten#!\n#Y 75 Kulturmandat#!, sofort bezahlt\n\n#Y Bei Abschluss#!\n#P +20 Kulturmandat, +7 nationaler Zusammenhalt#!\n\n#Y Für die folgenden 8 Jahre#!\n#P +10% Loyalisten durch voll akzeptierte Pops, +25 Autorität#!"
 ve_shared_symbols_requirements_tt:0 "Erfordert #Y 75 Kulturmandat#!, kein aktives Kulturprojekt und keinen Projektrückschlag. Es kann zudem nicht begonnen werden, während der vorherige Vorteil der #Y Gemeinsamen Symbole#! aktiv ist."
 ve_ethnic_campaign_name:0 "Eingliederungskampagne"
 ve_ethnic_campaign_cost:0 "Kosten: #Y 125 Kulturmandat#!"
 ve_ethnic_campaign_short:0 "Eine große Minderheit in einem Staat eingliedern.\n#P +25 Mandat, +8 Zusammenhalt#!, erzeugt jedoch Radikale."
 ve_ethnic_campaign_desc:0 "#header Eingliederungskampagne#!\nWird in einem einzelnen Staat gegen dessen größte nicht-Hauptkultur durchgeführt, welche mindestens #Y 5%#! der Bevölkerung dieses Staates ausmachen muss.\n\n#Y Kosten#!\n#Y 125 Kulturmandat#!, sofort fällig\n\n#Y Bei Abschluss#!\nAssimiliert #Y 5%#! der Zielkultur in eine Hauptkultur oder #Y 7%#! mit Nationalistisch VII\n#P +25 Kulturmandat, +8 Nationaler Zusammenhalt#!\nHinterlässt ein #Y 10-jähriges#! Assimilierungsprogramm im Staat\n\n#Y Warnung#!\n#N Sowohl der Beginn als auch der Abschluss des Projekts erzeugen Radikale in der Zielkultur.#!"
 ve_civic_initiative_name:0 "Gleichberechtigungsinitiative"
 ve_civic_initiative_cost:0 "Kosten: #Y 100 Kulturmandat#!"
 ve_civic_initiative_short:0 "Erhöht die Akzeptanz einer Minderheit in einem Staat.\n#P +25 Mandat, +10 Zusammenhalt#! sowie Loyalisten."
 ve_civic_initiative_desc:0 "#header Gleichberechtigungsinitiative#!\nWird in einem einzelnen Staat gegen dessen größte nicht-Hauptkultur durchgeführt, welche mindestens #Y 5%#! der Bevölkerung dieses Staates ausmachen muss.\n\n#Y Kosten#!\n#Y 100 Kulturmandat#!, sofort fällig\n\n#Y Bei Abschluss#!\n#P +15 Akzeptanz für diese Kultur für 10 Jahre#!\nLoyalisten im Zielstaat\n#P +25 Kulturmandat, +10 Nationaler Zusammenhalt#!\nZehn Jahre verbesserte Qualifikationen und Migrationsanziehung"
 ve_composite_compact_name:0 "Staatspakt"
 ve_composite_compact_cost:0 "Kosten: #Y 150 Kulturmandat#! und #Y 40 Zusammenhalt#!"
 ve_composite_compact_short:0 "Erkennt eine Minderheit als konstituierende Kultur an.\n#P +30 Mandat, +12 Zusammenhalt#!, dauerhaft."
 ve_composite_compact_desc:0 "#header Staatspakt#!\nWird in einem einzelnen Staat auf eine nicht anerkannte nicht-Hauptkultur angewendet, die mindestens #Y 5%#! der Bevölkerung dieses Staates ausmacht.\n\n#Y Kosten#!\n#Y 150 Kulturmandat#!, sofort fällig, und mindestens #Y 40 Nationaler Zusammenhalt#!\n\n#Y Bei Abschluss#!\n#P +15 Akzeptanz für diese Kultur, dauerhaft#!\nErkennt sie als konstituierende Kultur an\nLoyalisten im Zielstaat\n#P +30 Kulturmandat, +12 Nationaler Zusammenhalt#!"
 ve_targeted_project_start_instruction:0 "#Y Wie es zu starten ist#!\n1. Öffnen Sie einen Ihrer eigenen Staaten.\n2. Drücken Sie #Y Projekt starten#! im Bedienfeld dieses Staates.\nDie Zielkultur und eventuell noch fehlende Voraussetzungen werden im Tooltip dieses Buttons aufgelistet."
 ve_targeted_project_state_requirements_tt:0 "Der Staat muss sich in unserem Besitz befinden und eine zulässige nicht-Hauptkultur enthalten, die mindestens #Y 5%#! seiner Bevölkerung ausmacht. Die größte zulässige Kultur wird zum Ziel. Eine in diesem Staat bereits vollendete Kultur kann nicht erneut als Ziel gewählt werden, ist jedoch in einem anderen Staat möglich. Die Kosten und Anforderungen des aktuellen Identitätsmodells müssen ebenfalls erfüllt sein."
 ve_targeted_cultural_project_target:0 "Ziel: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! in #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Geltungsbereich: #Y Gesamtes Land#!"
 ve_no_cultural_project_target:0 "Kein Projektziel"
 ve_no_active_cultural_project:0 "Kein aktives Kulturprojekt"

