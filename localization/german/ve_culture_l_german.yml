 ve_cohesion_tier_high:0 "KOHÄRENT – [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "FRAGMENTIERT – #N nationale Instabilität wirkt#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% Einberufungsrate und +3 Legitimität#!."
 ve_civic_high_cohesion_effect:0 "#P +5% Qualifikationen und +3 Legitimität#!."
 ve_composite_high_cohesion_effect:0 "#P +5% Einfluss und +3 Legitimität#!."
 ve_identity_transition_backlash_notice:0 "Ein Identitätsübergangs-Rückschlag ist noch aktiv – das Modell kann erst gewechselt werden, wenn dieser abläuft."
 ve_cultural_project_backlash_notice:0 "Ein abgebrochenes Projekt blockiert weiterhin ein neues – der 2-jährige Rückschlag muss erst ablaufen."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Übergangs-Rückschlag aktiv"
