l_german:
 ve_national_identity:0 "Nationale Identität"
 ve_primary_cultures_label:0 "Primäre Kulturen"
 ve_identity_models:0 "Identitätsmodelle"
 ve_identity_model_active_footer:0 "Bereits aktiv"
 ve_switch_identity_button:0 "Wechseln"
 ve_switch_identity_cost_label:0 "Kosten #Y 200 Kulturauftrag#!"
 ve_begin_project_button:0 "Projekt starten"
 ve_identity_models_help:0 "Ihre Nation hat immer genau ein Identitätsmodell und es ist #P bereits aktiv#!  – Sie müssen hier nichts auswählen. Das Modell entscheidet nur, wie #Y Nationaler Zusammenhalt#! erreicht wird und welches Kulturprojekt Sie durchführen dürfen.\n#Y Der Wechsel ist optional:#! Es kostet #Y 200 Kulturauftrag#!, setzt den Zusammenhalt auf #Y 35#! zurück, bricht jedes laufende Kulturprojekt ab und blockiert einen weiteren Wechsel für 5 Jahre.\n#Y Halten Sie den Mauszeiger über eine beliebige Karte oder Anzeige, um die volle Wirkung zu erzielen.#!"
 ve_ethnic_identity_name:0 "Ethnische Nation"
 ve_civic_identity_name:0 "Bürgerlich Nation"
 ve_composite_identity_name:0 "Zusammengesetzter Staat"
 ve_ethnic_identity_short:0 "Die Nation wird anhand ihrer Primärkulturen definiert.\nZusammenhalt entsteht durch #Y demografische Dominanz#!."
 ve_civic_identity_short:0 "Eine politische Nation, die durch Bildung aufgebaut wurde.\nZusammenhalt kommt von #Y Alphabetisierung und akzeptierte Minderheiten#!."
 ve_composite_identity_short:0 "Mehrere Völker unter ausgehandelten Institutionen.\nZusammenhalt kommt von #Y eine wirklich pluralistische Bevölkerung#!."
 ve_ethnic_identity_unlocks:0 "Entsperrt die #Y Ethnische Integrationskampagne#! Projekt"
 ve_civic_identity_unlocks:0 "Entsperrt die #Y Initiative für gleiche Staatsbürgerschaft#! Projekt"
 ve_composite_identity_unlocks:0 "Entsperrt die #Y Constituent Compact#! Projekt"
 ve_ethnic_identity_desc:0 "#header Ethnische Nation#!\nDie Nation wird um ihre Primärkulturen herum definiert.\n\n#Y Während sie aktiv ist#!\n#P +15 % Assimilation, +5 % Autorität#!\n#N -5 % Migrationsanziehung, +5 % Radikale durch offene Vorurteile#!\n\n#Y Zusammenhalt#!\nSteht, wenn Primärkulturen mindestens ausmachen 60–75 % der Bevölkerung und fällt deutlich unter 40 %.\n\n#Y Bei 75 Kohäsion#!\n#P +5 % Wehrpflichtquote, +3 Legitimität#!\n\n#Y Kulturprojekt#!\nEthnische Integrationskampagne"
 ve_civic_identity_desc:0 "#header Bürgernation#!\nEine gemeinsame politische Nation wird durch Bildung und Beteiligung aufgebaut.\n\n#Y Im aktiven Zustand#!\n#P +7 % Migrationsanziehung, +1 % Bildungszugang#!\n#N -10 % Assimilation, -5 % Autorität, -50 Bürokratie#!\n\n#Y Zusammenhalt#!\nAlphabetisierung erhöht es, aber jede nicht-primäre Kultur über 10 % der Bevölkerung mit sehr geringer Akzeptanz senkt es.\n\n#Y Bei 75 Zusammenhalt#!\n#P +5 % Qualifikationen, +3 Legitimität#!\n\n#Y Kulturprojekt#!\nGleiche Staatsbürgerschaft Initiative"
 ve_composite_identity_desc:0 "#header Verbundstaat#!\nMehrere Völker werden durch ausgehandelte Institutionen regiert.\n\n#Y Während aktiv#!\n#P -10 % Radikale aus kultureller Auslöschung und zweitklassiger Staatsbürgerschaft, +5 % Einfluss#!\n#N -15 % Assimilation, -5 % Autorität, -75 Bürokratie#!\n\n#Y Zusammenhalt#!\nEine wirklich pluralistische Bevölkerung erhöht sie; Eine Bevölkerung, die zu über 90 % aus Primärkulturen besteht, schwächt dieses Modell.\n\n#Y Bei 75 Kohäsion#!\n#P +5 % Einfluss, +3 Legitimität#!\n\n#Y Kulturprojekt#!\nKonstituierender Pakt"
 ve_identity_change_cost_tt:0 "Eine Änderung des Identitätsmodells erfordert #Y 200 Kulturauftrag#! und kein aktiver Identitätsübergangs-Backlash. Die Änderung setzt den Zusammenhalt auf  #Y 35#! zurück und verursacht a #Y 5-jähriges Übergangsspielraum#! und storniert jedes aktive Kulturprojekt ohne zusätzliche Stornierungsgebühr."
 ve_cultural_mandate:0 "Kulturauftrag"
 ve_culture_reform_point:0 "Kulturauftrag"
 ve_cultural_mandate_hint:0 "Für kulturelle Projekte ausgegeben. Das Sparen ist sicher, aber das Einkommen halbiert sich bei 400 und stoppt bei 500."
 ve_culture_reform_point_tt:0 "#header Kulturauftrag#!\nAktuell: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nMonatliche Änderung: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Wofür es ausgegeben wird#!\nKulturprojekte (75–150) und Änderungen des Identitätsmodells (200). Beides ist nicht erforderlich: Sparmandat ist sicher, das Einkommen wird nur bei 400 halbiert und stoppt bei 500.\n\n#Y Monatliche Aufschlüsselung#!\nBasis: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLegitimität: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nVerwaltung: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nModellgesellschaft: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nStabilität und kulturelle Bewegungen: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nRechtsangleichung: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nIdeendoktrin: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nCap Multiplikator: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Ideenlehre – nur Ihr aktuelles Identitätsmodell zählt#!\n#P Ethnische Nation#!: Nationalist V #P +1#!\n#P Bürgernation#!: Reformist V #P +1#!; Akademischer V #P +1#!\n#P Zusammengesetzter Staat#!: Reformistischer V #P +1#!\nDie oben genannte aktive Gesamtzahl ist auf #Y +2#! begrenzt.\n\nCivic Nation bezieht die Komponente „Model Society“ aus der Alphabetisierung, Composite State aus der Alphabetisierung in einer pluralistischen Gesellschaft und Ethnic Nation aus der demografischen Stärke der Primärkultur.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Nationaler Zusammenhalt"
 ve_national_cohesion_hint:0 "Driftet in Richtung des Gleichgewichts, das Ihr Identitätsmodell erzeugt. Bei 75+ erhält man einen Bonus, bei 25 oder weniger Instabilität."
 ve_national_cohesion_tt:0 "#header Nationaler Zusammenhalt#!\nAktuell: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nGleichgewicht: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMonatliche Bewegung: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nGemeinsame Bedingungen: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nIdentitätsmodellbedingungen: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nDer Zusammenhalt bewegt sich jeden Monat um 20 % der Distanz in Richtung Gleichgewicht, bis zu 5 Punkte. Radikale kulturelle Bewegungen verringern das Gleichgewicht um 10. Bei 75 oder mehr gewährt das aktuelle Modell einen zusätzlichen Vorteil; bei 25 oder weniger liegt nationale Instabilität vor.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Keine Wirkung"
 ve_cultural_projects:0 "Kulturprojekte"
 ve_cultural_projects_intro:0 "Kulturprojekte sind #Y optional#!. Es kann jeweils nur einer laufen: Die Mandatskosten werden sofort bezahlt #N -75 Bürokratie und -25 Autorität#! bewerben, solange es läuft. Durch den Abschluss eines Projekts wird ein Teil des Mandats zurückerstattet und der Zusammenhalt erhöht. Landesweite Projekte können erst nach Ablauf ihrer Abschlussvergütung wiederholt werden; Ein abgeschlossenes Staats-/Kulturziel kann nicht erneut ausgewählt werden.\n#Y Bewegen Sie den Mauszeiger über eine beliebige Karte oder Anzeige, um die volle Wirkung zu erzielen.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Projekt in Bearbeitung"
 ve_cultural_project_progress:0 "Projektfortschritt"
 ve_cultural_project_progress_tt:0 "#header Monatlicher Projektfortschritt#!\nAktuell: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nVerbleibend: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nMonatliche Gesamtsumme: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (Minimum 1, Maximum 7)\n\n#Y Monatliche Aufschlüsselung#!\nBasis: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nVerwaltung: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLegitimität: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nVorbildliche Gesellschaft: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nZusammenhalt: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nKulturelle Bewegungen: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nZielstaat Aufruhr: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nIdeengruppen: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Ideengruppen – nur Boni, die Ihrem aktuellen Identitätsmodell entsprechen, sind aktiv#!\n#P Ethnische Nation#!: Nationalist VII #P +1#!\n#P Bürgerliche Nation#!: Reformist VII, Akademiker VII oder Wohlfahrtsstaat VI — #P +1#! jeweils\n#P Zusammengesetzter Staat#!: Reformist VII oder Diplomatischer VI — #P +1#! jeweils\nDie Gesamtzahl der oben genannten aktiven Ideengruppen ist auf #Y +2 begrenzt#!; weitere Matching-Boni steigern den Fortschritt nicht.\n\nModel Society belohnt Staatsbürgerkunde, ethnische Bevölkerungskonzentration oder zusammengesetzte Vielfalt gemäß dem aktiven Identitätsmodell. Der Abschluss wird bei der nächsten monatlichen Aktualisierung nach Erreichen des Fortschritts behoben #Y 100#!."
 ve_cancel_cultural_project_button:0 "Projekt abbrechen"
 ve_cancel_cultural_project_tt:0 "#header Kulturprojekt abbrechen#!\nDer investierte Kulturauftrag beträgt #N nicht erstattet#!. Der nationale Zusammenhalt bricht zusammen #N 5#! und a #N 2 Jahre Spielzeit#! verhindert ein anderes Projekt."
 ve_start_cultural_project_button:0 "Projekt starten"
 ve_national_curriculum_name:0 "Nationaler Lehrplan"
 ve_national_curriculum_cost:0 "Kosten: #Y 100 Kulturauftrag#!"
 ve_national_curriculum_short:0 "Eine landesweite Schulreform.\n#P +20 Mandat, +5 Zusammenhalt#!, dann bessere Bildung."
 ve_national_curriculum_desc:0 "#header Nationaler Lehrplan#!\nEine Schulreform im ganzen Land.\n\n#Y Kosten#!\n#Y 100 Kulturauftrag#!, sofort bezahlt\n\n#Y Bei Abschluss#!\n#P +20 Kulturauftrag, +5 Nationaler Zusammenhalt#!\n\n#Y Für 10 Jahre danach#!\n#P +2 % Bildungszugang, +5 % Qualifikationen#!\n#N -25 Bürokratie#!"
 ve_national_curriculum_requirements_tt:0 "Erfordert #Y 100 Kulturauftrag#!, kein aktives Kulturprojekt und Keine Projekt-Gegenreaktion. Es kann auch nicht während des vorherigen beginnen #Y Nationaler Lehrplan#! Vorteil ist aktiv."
 ve_shared_symbols_name:0 "Gemeinsame Symbole"
 ve_shared_symbols_cost:0 "Kosten: #Y 75 Kulturmandat#!"
 ve_shared_symbols_short:0 "Flaggen, Hymnen und öffentliche Zeremonie.\n#P +20 Mandat, +7 Zusammenhalt#!, dann Loyalisten und Autorität."
 ve_shared_symbols_desc:0 "#header Gemeinsame Symbole#!\nFlaggen, Hymnen und öffentliche Zeremonien, Werbung im ganzen Land.\n\n#Y Kosten#!\n#Y 75 Kulturauftrag#!, sofort bezahlt\n\n#Y Bei Abschluss#!\n#P +20 Kulturauftrag, +7 Nationaler Zusammenhalt#!\n\n#Y Für 8 Jahre danach#!\n#P +10 % Loyalisten von vollständig akzeptierten Pops, +25 Autorität#!"
 ve_shared_symbols_requirements_tt:0 "Erfordert #Y 75 Kulturauftrag#!, kein aktives Kulturprojekt und keine Projekt-Gegenreaktion. Es kann auch nicht während des vorherigen beginnen #Y Gemeinsame Symbole#! Vorteil ist aktiv."
 ve_ethnic_campaign_name:0 "Ethnische Integrationskampagne"
 ve_ethnic_campaign_cost:0 "Kosten: #Y 125 Kulturelles Mandat#!"
 ve_ethnic_campaign_short:0 "Eine große Minderheit in einem Staat assimilieren.\n#P +25 Mandat, +8 Zusammenhalt#!, aber es schafft Radikale."
 ve_ethnic_campaign_desc:0 "#header Ethnische Integrationskampagne#!\nWird in einem einzelnen Staat gegen seine größte nichtprimäre Kultur durchgeführt, die mindestens #Y 5 %#! der Bevölkerung dieses Staates umfassen muss.\n\n#Y Kosten#!\n#Y 125 Kulturell Mandat#!, sofort bezahlt\n\n#Y Nach Abschluss#!\nAssimiliert #Y 5 %#! der Zielkultur in eine Primärkultur oder #Y 7 %#! mit Nationalist VII\n#P +25 Kulturauftrag, +8 Nationaler Zusammenhalt#!\nHinterlässt ein #Y 10-jähriges#! Assimilationsprogramm im Staat\n\n#Y Warnung#!\n#N Sowohl der Beginn als auch der Abschluss des Projekts führen zu Radikalen in der Zielkultur.#!"
 ve_civic_initiative_name:0 "Gleiche Staatsbürgerschaft Initiative"
 ve_civic_initiative_cost:0 "Kosten: #Y 100 Kulturauftrag#!"
 ve_civic_initiative_short:0 "Erhöhen Sie die Akzeptanz einer Minderheit in einem Staat.\n#P +25 Mandat, +10 Zusammenhalt#!, plus Loyalisten."
 ve_civic_initiative_desc:0 "#header Equal Citizenship Initiative#!\nWird in einem einzelnen Staat auf dessen größter nichtprimärer Kultur durchgeführt, die mindestens #Y 5 %#! der Bevölkerung dieses Staates umfassen muss.\n\n#Y Kosten#!\n#Y 100 Kulturmandat#!, bezahlt sofort\n\n#Y Nach Abschluss#!\n#P +15 Akzeptanz für diese Kultur für 10 Jahre#!\nLoyalisten im Zielstaat\n#P +25 Kulturauftrag, +10 Nationaler Zusammenhalt#!\nZehn Jahre verbesserte Qualifikationen und Migrationsanziehung"
 ve_composite_compact_name:0 "Konstituierender Pakt"
 ve_composite_compact_cost:0 "Kosten: #Y 150 Kulturauftrag#! und #Y 40 Zusammenhalt#!"
 ve_composite_compact_short:0 "Erkennen Sie eine Minderheit als konstituierende Kultur an.\n#P +30 Mandat, +12 Zusammenhalt#!, dauerhaft."
 ve_composite_compact_desc:0 "#header Konstituierender Pakt#!\nIn einem einzigen Staat auf einer nicht anerkannten nicht-primären Kultur mit mindestens  #Y 5 % laufen#! der Bevölkerung dieses Staates.\n\n#Y Kosten#!\n#Y 150 Kulturauftrag#!, sofort bezahlt, und mindestens #Y 40 Nationaler Zusammenhalt#!\n\n#Y Bei Abschluss#!\n#P +15 Akzeptanz für diese Kultur, dauerhaft#!\nErkennt sie als konstituierende Kultur an\nLoyalisten im Zielstaat\n#P +30 Kulturauftrag, +12 Nationaler Zusammenhalt#!"
 ve_targeted_project_start_instruction:0 "#Y Wie man damit anfängt#!\n1. Öffnen Sie einen Ihrer eigenen Staaten.\n2. Drücken #Y Projekt starten#! im Bedienfeld dieses Staates.\nDie Zielkultur und alles, was noch fehlt, werden im Tooltip dieser Schaltfläche aufgeführt."
 ve_targeted_project_state_requirements_tt:0 "Der Staat muss unser Eigentum sein und eine berechtigte nicht-primäre Kultur enthalten, die mindestens  #Y 5 % ausmacht.#! seiner Bevölkerung. Die größte infrage kommende Kultur wird zum Ziel. Eine in diesem Staat bereits abgeschlossene Kultur kann nicht erneut ins Visier genommen werden, kann aber in einem anderen Staat ins Visier genommen werden. Die Kosten und Anforderungen des aktuellen Identitätsmodells müssen ebenfalls erfüllt werden."
 ve_targeted_cultural_project_target:0 "Ziel: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! in #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Geltungsbereich: #Y Gesamtes Land#!"
 ve_no_cultural_project_target:0 "Kein Projektziel"
 ve_no_active_cultural_project:0 "Kein aktives Kulturprojekt"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "COHESIVE – [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "FRAGMENTIERT - #N Es herrscht nationale Instabilität#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5 % Wehrpflichtquote und +3 Legitimität#!."
 ve_civic_high_cohesion_effect:0 "#P +5 % Qualifikationen und +3 Legitimität#!."
 ve_composite_high_cohesion_effect:0 "#P +5 % Einfluss und +3 Legitimität#!."
 ve_identity_transition_backlash_notice:0 "Ein Identitätsübergangs-Backlash ist noch aktiv – das Modell kann nicht erneut gewechselt werden, bis es abläuft."
 ve_cultural_project_backlash_notice:0 "Ein abgebrochenes Projekt blockiert immer noch ein neues – der 2-Jahres-Backlash muss zuerst ablaufen."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Übergangs-Backlash aktiv"
 ve_cultural_project_backlash_notice_short:0 "Stornierungsrückstoß aktiv"
 ve_targeted_project_start_instruction_short:0 "Starten Sie es in einem Ihrer eigenen Staaten: Öffnen Sie den Staat und drücken Sie #Y Projekt starten#!."
