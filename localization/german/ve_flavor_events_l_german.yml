 # events/Economic_Idea.txt and events/InnovativeIdeaGroupEvents.txt reference
 # only this one key set for all of their events, so the text is deliberately
 # neutral: an event in either file may grant a positive or a negative modifier.
 # Give each event its own keys when they are wired to an on_action.
 economic_flavor.1.t:0 "Wirtschaftliche Entwicklungen"
 economic_flavor.1.desc:0 "Unsere wirtschaftliche Doktrin trägt Früchte auf Weisen, die die Ministerien nicht vorgesehen hatten. Was auch immer folgen mag, die Auswirkungen werden in der gesamten Wirtschaft jahrelang spürbar sein."
 economic_flavor.1.a:0 "So sei es"
 innovative_flavor.1.t:0 "Ein Wandel der Doktrin"
 innovative_flavor.1.desc:0 "Die Ideen, die wir uns zu eigen gemacht haben, formen um, wie unsere Institutionen arbeiten und wie der Rest der Welt uns beurteilt."
 innovative_flavor.1.a:0 "Sehr wohl"

