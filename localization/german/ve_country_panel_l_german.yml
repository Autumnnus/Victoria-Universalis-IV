l_german:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Nationale Doktrin"
 VE_CP_COLLAPSE_TT:0 "Die Victoria-Universalis-Übersicht für dieses Land ausblenden"
 VE_CP_EXPAND_TT:0 "Die Victoria-Universalis-Übersicht für dieses Land anzeigen"

 VE_CP_INSIGHT_LABEL:0 "Nationaleinsicht"
 VE_CP_INSIGHT_TT:0 "#header Nationaleinsicht#!\nBestand: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nWird für einzelne Doktrinen innerhalb einer angenommenen Doktrinengruppe ausgegeben."
 VE_CP_PIETY_LABEL:0 "Frömmigkeitsfonds"
 VE_CP_PIETY_TT:0 "#header Frömmigkeitsfonds#!\nBestand: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nWird für religiöse Programme und das gezielte religiöse Projekt ausgegeben."
 VE_CP_MANDATE_LABEL:0 "Kulturmandat"
 VE_CP_MANDATE_TT:0 "#header Kulturmandat#!\nBestand: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nWird für Änderungen des Identitätsmodells und für Kulturprojekte ausgegeben."
 VE_CP_MOMENTUM_LABEL:0 "Epochenschwung"
 VE_CP_MOMENTUM_TT:0 "#header Epochenschwung#!\nBestand: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nWird durch zufriedene Epochenziele verdient und für Epochenbelohnungen ausgegeben. Der Schwung wird bei Beginn eines neuen Zeitalters zurückgesetzt."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Doktrinen"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Doktrinengruppen#!\nGenutzte Plätze: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nFreie Plätze: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nAktuelle Doktrininvestition: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktive gekaufte Doktrinen\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nAktive Gruppendoktrinen gewähren dauerhafte Kapazität bei #Y 4, 8, 13, 19, 26#! und #Y 34#!. Plätze 5–6 erfordern zudem Zeitalter 2 und Platz 7 erfordert Zeitalter 3. Das Abbrechen einer Gruppe senkt die aktuelle Investition und erstattet niemals Einsicht, aber bereits verdiente Kapazität bleibt erhalten."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Nationale Doktrinen"
 VE_CP_PROGRESS_LABEL:0 "Doktrinenfortschritt"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Fortschritt nationaler Doktrinen#!\nGekaufte Gruppendoktrinen: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nJede dritte gekaufte Gruppendoktrin schaltet die nächste nationale Doktrin frei. Die einfundzwanzigste gewährt zudem den nationalen Bonus."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Noch keine Doktrinengruppe angenommen.#!"
 VE_CP_PROGRAMS_LABEL:0 "Religiöse Programme"
 VE_CP_NONE_YET:0 "#lore Noch keine#!"
 VE_CP_PROJECT_LABEL:0 "Projekt"
 VE_CP_COHESION_LABEL:0 "Nationaler Zusammenhalt"
 VE_CP_OBJECTIVES_LABEL:0 "Epochenziele"
 VE_CP_OBJECTIVES_TT:0 "#header Epochenziele#!\nIn diesem Zeitalter abgeschlossen: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nJedes zufriedenstellende Ziel wirft monatlich Epochenschwung ab. Vier abgeschlossene Ziele schalten ein goldenes Zeitalter frei."
 VE_CP_REWARDS_LABEL:0 "Epochenbelohnungen"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] in diesem Zeitalter gekauft"
 VE_CP_REWARDS_TT:0 "#header Epochenbelohnungen#!\nIn diesem Zeitalter gekauft: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nJede Belohnung kostet mehr als die vorherige, und die Effekte der Belohnungen enden mit dem Zeitalter. Die Plätze 10-13 sind länderspezifisch."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Unbekanntes Zeitalter"
 ve_cp_golden_age_industrial_active:0 "#P Industrielles goldenes Zeitalter#!"
 ve_cp_golden_age_cultural_active:0 "#P Kulturelles goldenes Zeitalter#!"
 ve_cp_golden_age_strategic_active:0 "#P Strategisches goldenes Zeitalter#!"
 ve_cp_golden_age_spent:0 "#lore Goldenes Zeitalter genutzt#!"
 ve_cp_golden_age_ready:0 "#Y Goldenes Zeitalter verfügbar#!"
 ve_cp_golden_age_locked:0 "#lore Goldenes Zeitalter gesperrt#!"
 ve_cp_tier_high:0 "#P Blühend#!"
 ve_cp_tier_stable:0 "#lore Stabil#!"
 ve_cp_tier_low:0 "#N Strapaziert#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Angenommen, aber in dieser Gruppe wurde noch keine Doktrin gekauft.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Religiöser Ausgleich#!\nAktuell: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nGleichgewicht: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMonatliche Veränderung: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nDer Wert bewegt sich jeden Monat um 20% auf das Gleichgewicht zu, begrenzt auf #Y 5#! Punkte. Bei #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\nBei #N 25#! oder weniger: #N -5 Legitimität und -5% Beschlusserfolg#!"
 VE_CP_COHESION_TT:0 "#header Nationaler Zusammenhalt#!\nAktuell: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nGleichgewicht: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMonatliche Veränderung: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nDer Zusammenhalt bewegt sich jeden Monat um 20% auf das Gleichgewicht zu, begrenzt auf #Y 5#! Punkte. Bei #P 75#! gewährt das Identitätsmodell einen zusätzlichen Vorteil; bei #N 25#! oder weniger tritt nationale Instabilität ein."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Gezieltes religiöses Projekt#!\nStatus: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Kulturprojekt#!\nStatus: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nZiel: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "Fortschritt: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nMonatlicher Fortschritt: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Es läuft kein Projekt. Ein Projekt wird über das Menü eines eigenen Staates gestartet, und Völlige Trennung kann keines durchführen.#!"
 ve_cp_cultural_project_detail_active:0 "Fortschritt: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nMonatlicher Fortschritt: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Es läuft kein Projekt. Landeshweite Projekte werden im Menü der nationalen Identität gestartet, zielgerichtete über das Menü eines eigenen Staates.#!"
