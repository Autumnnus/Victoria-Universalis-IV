l_german:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Nationale Doktrin"
 VE_CP_COLLAPSE_TT:0 "Übersicht über Victoria Universalis für dieses Land ausblenden"
 VE_CP_EXPAND_TT:0 "Übersicht über Victoria Universalis für dieses Land anzeigen"

 VE_CP_INSIGHT_LABEL:0 "Nationaler Einblick"
 VE_CP_INSIGHT_TT:0 "#header Nationaler Einblick#!\nBestand: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nFür einzelne Ideen innerhalb einer angenommenen Ideengruppe ausgegeben."
 VE_CP_PIETY_LABEL:0 "Frömmigkeitsreform"
 VE_CP_PIETY_TT:0 "#header Frömmigkeitsreform#!\nVorrat: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nFür religiöse Programme und das gezielte religiöse Projekt ausgegeben."
 VE_CP_MANDATE_LABEL:0 "Kulturauftrag"
 VE_CP_MANDATE_TT:0 "#header Kulturauftrag#!\nVorrat: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nWird für die Änderung des Identitätsmodells und für Kulturprojekte ausgegeben."
 VE_CP_MOMENTUM_LABEL:0 "Era-Momentum"
 VE_CP_MOMENTUM_TT:0 "#header Era-Momentum#!\nVorrat: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nVerdient durch erfüllte Era-Ziele und wird für Era-Belohnungen ausgegeben. Die Dynamik wird zurückgesetzt, wenn ein neues Zeitalter beginnt."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Ideen"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Ideengruppen#!\nBenutzte Slots: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nFreie Slots: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nAktuelle Doktrin-Investition: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktive gekaufte Ideen\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nAktive Gruppenideen erhalten dauerhafte Kapazität bei #Y 4, 8, 13, 19, 26#! und #Y 34#!. Für die Slots 5–6 ist ebenfalls Alter 2 und für Slot 7 Alter 3 erforderlich. Durch die Stornierung einer Gruppe wird die aktuelle Investition verringert und Insight wird nie zurückerstattet, die bereits erworbene Kapazität bleibt jedoch erhalten."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Nationale Ideen"
 VE_CP_PROGRESS_LABEL:0 "Ideenfortschritt"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Nationaler Ideenfortschritt#!\nGekaufte Gruppenideen: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nJede dritte gekaufte Gruppenidee schaltet die nächste nationale Idee frei. Der einundzwanzigste gewährt auch den Nationalbonus."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Noch keine Ideengruppe angenommen.#!"
 VE_CP_PROGRAMS_LABEL:0 "Religiöse Programme"
 VE_CP_NONE_YET:0 "#lore Noch keine#!"
 VE_CP_PROJECT_LABEL:0 "Projekt"
 VE_CP_COHESION_LABEL:0 "Nationaler Zusammenhalt"
 VE_CP_OBJECTIVES_LABEL:0 "Ziele der Ära"
 VE_CP_OBJECTIVES_TT:0 "#header Ziele der Ära#!\nIn diesem Zeitalter abgeschlossen: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nJedes erfüllte Ziel zahlt jeden Monat Era Momentum aus. Vier abgeschlossene Ziele schalten ein Goldenes Zeitalter frei."
 VE_CP_REWARDS_LABEL:0 "Ära-Belohnungen"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] in diesem Zeitalter gekauft"
 VE_CP_REWARDS_TT:0 "#header Era Rewards#!\nIn diesem Zeitalter gekauft: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nJede Belohnung kostet mehr als die letzte und die Belohnungseffekte enden mit dem Zeitalter. Die Plätze 10–13 sind länderspezifisch."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Unbekanntes Zeitalter"
 ve_cp_golden_age_industrial_active:0 "#P Industrielles Goldenes Zeitalter#!"
 ve_cp_golden_age_cultural_active:0 "#P Kulturelles Goldenes Zeitalter#!"
 ve_cp_golden_age_strategic_active:0 "#P Strategisches Goldenes Zeitalter#!"
 ve_cp_golden_age_spent:0 "#lore Goldenes Zeitalter verwendet#!"
 ve_cp_golden_age_ready:0 "#Y Goldenes Zeitalter verfügbar#!"
 ve_cp_golden_age_locked:0 "#lore Goldenes Zeitalter gesperrt#!"
 ve_cp_tier_high:0 "#P Gedeihend#!"
 ve_cp_tier_stable:0 "#lore Stabil#!"
 ve_cp_tier_low:0 "#N Angespannt#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Umarmt, aber noch keine Idee, in dieser Gruppe gekauft zu werden.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Religiös Abrechnung#!\nAktuell: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nGleichgewicht: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMonatliche Bewegung: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nDer Zähler bewegt sich jeden Monat um 20 % in Richtung Gleichgewicht, begrenzt auf #Y 5#! Punkte. Bei #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\nBei #N 25#! oder darunter: #N -5 Legitimität und -5 % Gesetzeserlasserfolg#!."
 VE_CP_COHESION_TT:0 "#header Nationaler Zusammenhalt#!\nAktuell: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nGleichgewicht: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMonatliche Bewegung: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nDer Zusammenhalt bewegt sich jeden Monat um 20 % in Richtung Gleichgewicht, begrenzt auf #Y 5#! Punkte. Bei #P 75#! gewährt das Identitätsmodell einen zusätzlichen Vorteil; Bei #N 25#! oder darunter gilt nationale Instabilität."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Gezieltes religiöses Projekt#!\nStatus: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Kulturprojekt#!\nStatus: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nZiel: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "Fortschritt: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nMonatlicher Fortschritt: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Es läuft kein Projekt. Ein Projekt wird über das Panel eines eigenen Staates gestartet und Total Separation kann eines nicht ausführen.#!"
 ve_cp_cultural_project_detail_active:0 "Fortschritt: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nMonatlicher Fortschritt: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Es läuft kein Projekt. Landesweite Projekte beginnen beim National Identity Panel, gezielte Projekte beim Panel eines eigenen Staates.#!"
