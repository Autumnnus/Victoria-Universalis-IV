l_german:
 ve_tag_flavor_delayed_result_tt:0 "Die Konsequenzen dieser institutionellen Entscheidung werden sich in etwa einem Jahr zeigen."
 ve_tag_flavor_free_route_tt:0 "Dieser Weg erfordert keine nationale Einsicht, keinen kulturellen Auftrag oder keine Frömmigkeitsreform."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Ein gemeinsames Bürgerlexikon"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Ein gemeinsames offizielles Vokabular führt zu Reformen in Schulen und Provinzämtern, aber ständige Erklärungen verbrauchen zentrale Autorität."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Heilige Kontinuität"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "Die Reform wurde durch überkommene religiöse Institutionen gestaltet, die die Befehlsgewalt stärkten und gleichzeitig die Kanäle verengten, über die ausländische Methoden zirkulieren."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Verwaltungsübersetzung"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "Die Bürokratie übersetzt Reformen in vertraute Verfahren. Die Verwaltung wird stabiler, aber Gesetzesänderungen verlieren etwas an Geschwindigkeit."
 ve_tag_flavor.1.t:0 "Die Sprache der Reform"
 ve_tag_flavor.1.d:0 "Ein Dekret kann die Hauptstadt in tadelloser Prosa verlassen und dennoch in einer Schule, einem Gericht, einem Provinzamt oder einer religiösen Stiftung als vier verschiedene Anweisungen eintreffen. Reformer fordern nun ein gemeinsames Vokabular. Die Frage ist, welche Institutionen diesem Vokabular seine Bedeutung verleihen werden."
 ve_tag_flavor.1.a:0 "Entwerfen Sie ein gemeinsames Bürgerlexikon."
 ve_tag_flavor.1.a.tt:0 "Erfordert Civic Nation oder Composite State.\nAusgeben #N 20 Kulturauftrag#! jetzt.\nNach ungefähr einem Jahr: Gewinn #P 8 Nationaler Einblick#! und #P 3 Nationaler Zusammenhalt#!, dann gewinnen #P +1 % Bildungszugang#! und #N -25 Autorität#! für 24 Monate."
 ve_tag_flavor.1.b:0 "Bodenreform in heiliger Kontinuität."
 ve_tag_flavor.1.b.tt:0 "Erfordert das konfessionelle Religionsmodell.\nAusgeben #N 20 Frömmigkeitsreform#! jetzt.\nNach ungefähr einem Jahr: Erhalten Sie #P 8 National Insight#! und #P 3 Religiöse Siedlung#!, dann gewinnen #P +25 Autorität#! und #N -2,5 % Technologieverbreitung#! für 24 Monate."
 ve_tag_flavor.1.c:0 "Lassen Sie jedes Büro die Bestellung übersetzen."
 ve_tag_flavor.1.c.tt:0 "Nach etwa einem Jahr: Gewinn #P 4 Nationale Einsicht#!, dann gewinnen #P +25 Bürokratie#! und #N -2,5 % Gesetzesumsetzungsgeschwindigkeit#! für 24 Monate."
 ve_tag_flavor.2.t:0 "Worte werden zum Verfahren"
 ve_tag_flavor.2.d:0 "Ein Jahr voller Rundschreiben, Kommentare, Schulbücher, Predigten und Provinzkorrespondenz hat dem Reformprogramm eine Arbeitssprache verliehen. Es ist nicht ganz einheitlich, aber die Beamten wissen jetzt, welche Formulierungen Zustimmung hervorrufen – und welche immer noch Unstimmigkeiten verbergen."
 ve_tag_flavor.2.a:0 "Das Vokabular gelangt in die Staatsmaschinerie."
 ve_tag_flavor.2.a.tt:0 "Das vor einem Jahr beschlossene Ergebnis tritt nun in Kraft. Seine Ressourcenänderungen sind auf ihre normalen Grenzen begrenzt und sein institutioneller Modifikator dauert 24 Monate."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Übersetzungsbüros"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Spezialbüros beschleunigen die Verbreitung ausländischer Methoden, ihre Autonomie schwächt jedoch die unmittelbare Befehlsgewalt des Zentrums."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Gezielte Kreditaufnahme"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Importierte Institutionen werden unter zentraler Leitung neu organisiert. Die Autorität bleibt erhalten, aber es dauert länger, bis jede Reform den offiziellen Weg durchläuft."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Selektive Übernahme"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "Der Staat lässt nur Methoden zu, die mit der etablierten Autorität in Einklang gebracht werden können, und tauscht die Geschwindigkeit der Verbreitung gegen politische Kontrolle ein."
 ve_tag_flavor.10.t:0 "Geliehene Methoden, einheimische Autorität"
 ve_tag_flavor.10.d:0 "Ausländische Handbücher, Maschinen, Schulpläne und Verwaltungstabellen treffen schneller ein, als jedes Ministerium sie beurteilen kann. Einige Beamte fordern ständige Übersetzungsbüros; andere bestehen darauf, dass jede geliehene Institution unter zentraler Leitung neu gestaltet werden muss. Eine dritte Fraktion würde nur das zulassen, was absorbiert werden kann, ohne die bestehende Ordnung zu stören."
 ve_tag_flavor.10.a:0 "Richten Sie Übersetzungsbüros ein."
 ve_tag_flavor.10.a.tt:0 "Erfordert akademische Idee IV oder Infrastrukturidee IV.\nAusgeben #N 15 National Insight#! jetzt.\nNach etwa einem Jahr: Gewinn #P 10 Era Momentum#!, dann gewinne #P +2,5 % Technologieverbreitung#! und #N -25 Autorität#! für 24 Monate."
 ve_tag_flavor.10.b:0 "Ausleihe nur unter zentraler Leitung."
 ve_tag_flavor.10.b.tt:0 "Erfordert japanische Nationalidee IV.\nAusgeben #N 10 Nationale Einblicke#! jetzt.\nNach etwa einem Jahr: Erhalte #P 7 Era-Momentum#!, erhalte dann #P +25 Autorität#! und #N -2,5 % Gesetzeserlass-Geschwindigkeit#! für 24 Monate."
 ve_tag_flavor.10.c:0 "Selektive Übernahme und Behalten der Befehlsgewalt."
 ve_tag_flavor.10.c.tt:0 "Nach etwa einem Jahr: Erhalten Sie #P 3 Era-Momentum#! und anschließend #P +25 Autorität#! und #N -2,5 % Technologieverbreitung#! für 24 Monate."
 ve_tag_flavor.11.t:0 "Methoden, die wir selbst gemacht haben"
 ve_tag_flavor.11.d:0 "Ein Jahr voller Übersetzungen, Tests, Umformulierungen und offizieller Argumente hat Neuheit vom Nutzen getrennt. Die übernommenen Methoden erscheinen nicht mehr als Fremdanweisungen; Sie sind in das staatliche Befehlsvokabular eingeflossen."
 ve_tag_flavor.11.a:0 "Verwenden Sie, was die Prüfung überstanden hat."
 ve_tag_flavor.11.a.tt:0 "Das vor einem Jahr gewählte Ergebnis tritt nun in Kraft. Era Momentum behält seine normale Nulluntergrenze und der institutionelle Modifikator bleibt 24 Monate bestehen."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Staatsbürgerschaftspakt"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Eine gemeinsame Sprache der Staatsbürgerschaft erleichtert das Eintreffen und die Teilnahme, aber die Erklärung des Pakts in allen Gerichtsbarkeiten verbraucht zentrale Autorität."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Zusammengesetzter Handel"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "Die Bundesverwaltung lernt, zwischen Mitgliedsgemeinschaften zu verhandeln, stärkt Ämter und verringert gleichzeitig den Druck hin zu einer einzigen Kulturform."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Föderale Mehrdeutigkeit"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Bewusste Mehrdeutigkeit erweitert die diplomatische Stimme der Union, senkt jedoch zeitweise das Gleichgewicht des nationalen Zusammenhalts um 2."
 ve_tag_flavor.20.t:0 "Die Bedeutung der Union"
 ve_tag_flavor.20.d:0 "Neuankömmlinge, etablierte Staaten und Gemeinschaften mit unterschiedlichen öffentlichen Bräuchen berufen sich alle auf ihre eigene Weise auf die Union. Die Gesetzgeber sind sich darin einig, dass eine gemeinsame Formel erforderlich ist, aber nicht, ob sie die individuelle Staatsbürgerschaft definieren, eine Vereinbarung zwischen den Mitgliedsgemeinschaften wahren oder weit genug bleiben soll, damit jede Gerichtsbarkeit sie interpretieren kann."
 ve_tag_flavor.20.a:0 "Schreiben Sie einen Staatsbürgerschaftsvertrag."
 ve_tag_flavor.20.a.tt:0 "Erfordert Civic Nation.\nAusgeben #N 20 Kulturauftrag#! jetzt.\nNach ungefähr einem Jahr: Gewinn #P 8 Nationaler Einblick#! und #P 3 Nationaler Zusammenhalt#!, dann gewinnen #P +2,5 % Migrationsattraktivität#! und #N -25 Autorität#! für 24 Monate."
 ve_tag_flavor.20.b:0 "Handeln Sie ein zusammengesetztes Geschäft aus."
 ve_tag_flavor.20.b.tt:0 "Erfordert zusammengesetzten Staat.\nAusgeben #N 20 Kulturelles Mandat#! jetzt.\nNach etwa einem Jahr: Erhalten Sie #P 8 nationale Einblicke#! und #P 3 Nationaler Zusammenhalt#!, dann gewinnen #P +25 Bürokratie#! und #N -2,5 % Assimilation#! für 24 Monate."
 ve_tag_flavor.20.c:0 "Lassen Sie die Bundesformel bewusst weit gefasst."
 ve_tag_flavor.20.c.tt:0 "Nach etwa einem Jahr: Gewinnen Sie #P 4 National Insight#! und #P +25 Einfluss#! für 24 Monate. Während der Modifikator aktiv ist, bleibt das Gleichgewicht des nationalen Zusammenhalts bestehen #N 2 niedriger#!."
 ve_tag_flavor.21.t:0 "Eine Formel für die Union"
 ve_tag_flavor.21.d:0 "Ein Jahr voller Kongresse, Ausschussberichte, staatlicher Resolutionen und öffentlicher Auseinandersetzungen hat eine Sprache hervorgebracht, die Institutionen verwenden können. Ihr Schweigen ist ebenso folgenreich wie ihre Erklärungen, in denen festgelegt wird, welche Streitigkeiten die Union beilegt und welche sie der Verhandlung überlässt."
 ve_tag_flavor.21.a:0 "Lassen Sie die Formel Einzug ins öffentliche Leben halten."
 ve_tag_flavor.21.a.tt:0 "Das vor einem Jahr beschlossene Ergebnis tritt nun in Kraft. Ressourcenänderungen werden auf ihre normalen Grenzen begrenzt und der institutionelle Modifikator dauert 24 Monate."
