l_german:
 ve_tag_flavor_delayed_result_tt:0 "Die Folgen dieser institutionellen Wahl treten in ungefähr einem Jahr ein."
 ve_tag_flavor_free_route_tt:0 "Dieser Kurs verbraucht keine Nationaleinsicht, kein Kulturmandat und keinen Frömmigkeitsfonds."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Ein gemeinverständliches staatsbürgerliches Vokabular"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Ein geteiltes offizielles Vokabular trägt Reformen in Schulen und Ämter der Provinzen, doch ständige Erklärungen verbrauchen zentrale Autorität."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Geregelte Kontinuität"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "Reformen wurden durch überkommene religiöse Institutionen gestaltet, was den Befehl stärkt und zugleich die Kanäle verengt, über die fremde Methoden zirkulieren."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Administrative Übersetzung"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "Die Bürokratie übersetzt Reformen in vertraute Verfahren. Die Verwaltung wird beständiger, doch gesetzgeberische Änderungen verlieren an Tempo."
 ve_tag_flavor.1.t:0 "Die Sprache der Reform"
 ve_tag_flavor.1.d:0 "Ein Erlass kann die Hauptstadt in makelloser Prosa verlassen und dennoch in einer Schule, einem Gericht, einem Amt der Provinz oder einer religiösen Stiftung als vier verschiedene Anweisungen ankommen. Reformer fordern nun ein gemeinsames Vokabular. Die Frage ist, wessen Institutionen diesem Vokabular seine Bedeutung verleihen."
 ve_tag_flavor.1.a:0 "Ein gemeinsames staatsbürgerliches Vokabular entwerfen."
 ve_tag_flavor.1.a.tt:0 "Setzt Staatsbürgernation oder Gesamtstaat voraus.\nVerbraucht #N 20 Kulturmandat#! jetzt.\nNach ungefähr einem Jahr: erhalte #P 8 Nationaleinsicht#! und #P 3 Nationaler Zusammenhalt#!, erhalte dann #P +1% Bildungszugang#! und #N -25 Autorität#! für 24 Monate."
 ve_tag_flavor.1.b:0 "Reformen in geregelter Kontinuität verankern."
 ve_tag_flavor.1.b.tt:0 "Setzt das konfessionelle Religionsmodell voraus.\nVerbraucht #N 20 Frömmigkeitsfonds#! jetzt.\nNach ungefähr einem Jahr: erhalte #P 8 Nationaleinsicht#! und #P 3 Religiöser Ausgleich#!, erhalte dann #P +25 Autorität#! und #N -2,5% Technikverbreitung#! für 24 Monate."
 ve_tag_flavor.1.c:0 "Jedes Amt die Anweisung übersetzen lassen."
 ve_tag_flavor.1.c.tt:0 "Nach ungefähr einem Jahr: erhalte #P 4 Nationaleinsicht#!, erhalte dann #P +25 Bürokratie#! und #N -2,5% Beschlusstempo#! für 24 Monate."
 ve_tag_flavor.2.t:0 "Worte werden zu Verfahren"
 ve_tag_flavor.2.d:0 "Ein Jahr voller Rundschreiben, Kommentare, Schulbücher, Predigten und Provinzkorrespondenz hat dem Reformprogramm eine Arbeitssprache verliehen. Sie ist nicht vollkommen einheitlich, doch Beamte wissen nun, welche Phrasen Zustimmung befehlen – und welche noch Uneinigkeit verbergen."
 ve_tag_flavor.2.a:0 "Das Vokabular geht in den Staatsapparat über."
 ve_tag_flavor.2.a.tt:0 "Das vor einem Jahr gewählte Ergebnis tritt nun in Kraft. Seine Ressourcenänderungen werden auf ihre normalen Grenzen beschränkt und sein institutioneller Modifikator hält 24 Monate an."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Übersetzungsbüros"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Fachstellen beschleunigen den Umlauf fremder Methoden, obwohl deren Autonomie den unmittelbaren Befehl der Zentrale schwächt."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Gelenkte Entlehnung"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Importierte Institutionen werden unter zentraler Führung reorganisiert. Die Autorität bleibt gewahrt, doch jede Reform benötigt mehr Zeit, um amtliche Kanäle zu durchlaufen."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Selektive Annahme"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "Der Staat lässt nur Methoden zu, die mit der etablierten Autorität in Einklang gebracht werden können, und tauscht das Tempo der Diffusion gegen politische Kontrolle ein."
 ve_tag_flavor.10.t:0 "Entlehnte Methoden, einheimische Autorität"
 ve_tag_flavor.10.d:0 "Ausländische Handbücher, Maschinen, Schulpläne und Verwaltungstabellen treffen schneller ein, als jedes Ministerium sie beurteilen kann. Einige Beamte fordern ständige Übersetzungsbüros; andere bestehen darauf, dass jede entlehnte Institution unter zentraler Führung neu geschaffen wird. Eine dritte Fraktion würde nur zulassen, was ohne Störung der etablierten Ordnung aufgenommen werden kann."
 ve_tag_flavor.10.a:0 "Übersetzungsbüros einrichten."
 ve_tag_flavor.10.a.tt:0 "Setzt Akademisch IV oder Infrastruktur IV voraus.\nVerbraucht #N 15 Nationaleinsicht#! jetzt.\nNach ungefähr einem Jahr: erhalte #P 10 Epochenschwung#!, erhalte dann #P +2,5% Technikverbreitung#! und #N -25 Autorität#! für 24 Monate."
 ve_tag_flavor.10.b:0 "Nur unter zentraler Führung entlehnen."
 ve_tag_flavor.10.b.tt:0 "Setzt japanische Nationale Doktrin IV voraus.\nVerbraucht #N 10 Nationaleinsicht#! jetzt.\nNach ungefähr einem Jahr: erhalte #P 7 Epochenschwung#!, erhalte dann #P +25 Autorität#! und #N -2,5% Beschlusstempo#! für 24 Monate."
 ve_tag_flavor.10.c:0 "Selektiv annehmen und Befehl wahren."
 ve_tag_flavor.10.c.tt:0 "Nach ungefähr einem Jahr: erhalte #P 3 Epochenschwung#!, erhalte dann #P +25 Autorität#! und #N -2,5% Technikverbreitung#! für 24 Monate."
 ve_tag_flavor.11.t:0 "Zu eigen gemachte Methoden"
 ve_tag_flavor.11.d:0 "Ein Jahr voller Übersetzung, Erprobung, Neufassung und amtlicher Debatten hat die Neuerung vom Nutzen getrennt. Die angenommenen Methoden erscheinen nicht länger als fremde Anweisungen; sie sind in das staatseigene Vokabular des Befehls eingegangen."
 ve_tag_flavor.11.a:0 "Nutzen, was die Prüfung überstanden hat."
 ve_tag_flavor.11.a.tt:0 "Das vor einem Jahr gewählte Ergebnis tritt nun in Kraft. Der Epochenschwung behält seine normale Untergrenze von null bei und der institutionelle Modifikator hält 24 Monate an."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Staatsbürgerschaftspakt"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Eine gemeinsame Sprache der Staatsbürgerschaft erleichtert das Ankommen und die Teilhabe, doch das Erklären des Pakts über jede Gerichtsbarkeit hinweg verbraucht zentrale Autorität."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Gesamtstaatsverhandlung"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "Die Bundesverwaltung lernt, zwischen den konstitutiven Gemeinschaften zu verhandeln, wodurch Ämter gestärkt und gleichzeitig der Druck hin zu einer einzigen kulturellen Form verringert wird."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Föderale Ambiguität"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Bewusste Ambiguität verbreitert die diplomatische Stimme der Union, senkt jedoch vorübergehend das Gleichgewicht des Nationalen Zusammenhalts um 2."
 ve_tag_flavor.20.t:0 "Die Bedeutung der Union"
 ve_tag_flavor.20.d:0 "Neuzugezogene, etablierte Staaten und Gemeinschaften mit unterschiedlichen Sitten berufen sich jeweils auf ihre eigene Art auf die Union. Gesetzgeber sind sich einig, dass eine gemeinsame Formel vonnöten ist, jedoch nicht darüber, ob diese die individuelle Staatsbürgerschaft definieren, einen Kompromiss unter konstitutiven Gemeinschaften wahren oder breit genug bleiben soll, um von jeder Jurisdiktion unterschiedlich ausgelegt zu werden."
 ve_tag_flavor.20.a:0 "Einen Pakt der Staatsbürgerschaft verfassen."
 ve_tag_flavor.20.a.tt:0 "Setzt Staatsbürgernation voraus.\nVerbraucht jetzt #N 20 Kulturmandat#!.\nNach etwa einem Jahr: Erhalt von #P 8 Nationaleinsicht#! und #P 3 Nationaler Zusammenhalt#!, danach für 24 Monate #P +2,5% Migrationsanziehung#! und #N -25 Autorität#!."
 ve_tag_flavor.20.b:0 "Einen Gesamtstaatskompromiss verhandeln."
 ve_tag_flavor.20.b.tt:0 "Setzt Gesamtstaat voraus.\nVerbraucht jetzt #N 20 Kulturmandat#!.\nNach etwa einem Jahr: Erhalt von #P 8 Nationaleinsicht#! und #P 3 Nationaler Zusammenhalt#!, danach für 24 Monate #P +25 Bürokratie#! und #N -2,5% Assimilierung#!."
 ve_tag_flavor.20.c:0 "Die föderale Formel bewusst vage lassen."
 ve_tag_flavor.20.c.tt:0 "Nach etwa einem Jahr: Erhalt von #P 4 Nationaleinsicht#! und für 24 Monate #P +25 Einfluss#!. Solange der Modifikator aktiv ist, ist das Gleichgewicht des Nationalen Zusammenhalts #N 2 niedriger#!."
 ve_tag_flavor.21.t:0 "Eine Formel für die Union"
 ve_tag_flavor.21.d:0 "Ein Jahr voller Konventen, Ausschussberichten, staatlichen Resolutionen und öffentlicher Debatten hat Sprache hervorgebracht, die Institutionen verwenden können. Ihre Auslassungen sind von ebenso großer Tragweite wie ihre Erklärungen, da sie festlegen, welche Streitigkeiten die Union beilegt und welche sie den Verhandlungen überlässt."
 ve_tag_flavor.21.a:0 "Die Formel in das öffentliche Leben einfließen lassen."
 ve_tag_flavor.21.a.tt:0 "Das vor einem Jahr gewählte Ergebnis tritt nun in Kraft. Ressourcenänderungen werden auf ihre normalen Grenzen beschränkt und der institutionelle Modifikator hält 24 Monate an."
