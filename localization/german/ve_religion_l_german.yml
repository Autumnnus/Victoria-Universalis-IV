 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Staatsreligion"
 ve_settlement_tier_high:0 "GEFESTIGT - [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "ANGEFOCHTEN - #N -5 Legitimität und -5% Beschlusserfolg#!."
 ve_settlement_hint:0 "Driftet auf das Gleichgewicht zu, das Euer Religionsmodell produziert. Bei 75+ erhaltet Ihr einen Bonus, bei 25 oder weniger Instabilität."
 ve_piety_reform_hint:0 "Wird für Programme (je 25) und für religiöse Projekte aufgewendet. Sie zu sparen ist sicher, doch das Einkommen halbiert sich bei 400 und stoppt bei 500."
 ve_religious_project_hint:0 "Optional. Wird in einem Eurer eigenen Staaten begonnen, sofern Euer Religionsmodell dies erlaubt."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Religionsmodelle"
 ve_religious_models_help:0 "Euer Religionsmodell wird durch das Gesetz #Y Kirche und Staat#! bestimmt und ist #P bereits aktiv#! – hier gibt es nichts zu wählen. Das Modell bestimmt lediglich, wie der #Y Religiöse Ausgleich#! erzielt wird, welche acht Programme Ihr annehmen könnt und welches religiöse Projekt Ihr durchführen dürft.\n#Y Das Gesetz zu ändern ist optional:#! es setzt den Ausgleich auf #Y 35#! zurück, entfernt jedes von Euch angenommene Programm, bricht ein laufendes religiöses Projekt ab und ruft eine #Y 3-5-jährige#! Ausgleichskrise hervor.\n#Y Fahrt mit der Maus über eine Karte oder Leiste, um deren vollständige Effekte zu sehen.#!"
 ve_religious_model_active_footer:0 "Aktuelles Modell"
 ve_confessional_state_short:0 "Kirche und Staat regieren gemeinsam.\nDer Ausgleich stammt aus #Y Zustimmung und Politischem Druck der Frommen#!."
 ve_freedom_state_short:0 "Jeder Glaube wird unter einem Staat toleriert.\nDer Ausgleich stammt aus #Y einem ruhigen, gut geführten Land#!."
 ve_separation_state_short:0 "Der Staat nimmt keinerlei religiöse Position ein.\nDer religiöse Ausgleich beginnt auf dem Höchstwert und belohnt #Y geringen Aufruhr#!."
 ve_atheism_state_short:0 "Aktive, staatlich gelenkte Säkularisierung.\nDer religiöse Ausgleich speist sich aus #Y Alphabetisierung und den Intellektuellen#!."
 ve_confessional_state_unlocks:0 "Schaltet das Projekt #Y Konfessionelle Bekehrung#! frei"
 ve_freedom_state_unlocks:0 "Schaltet das Projekt #Y Öffentlichkeitsarbeit für Gewissensfreiheit#! frei"
 ve_separation_state_unlocks:0 "#N Kann kein Religiöses Projekt durchführen#!"
 ve_atheism_state_unlocks:0 "Schaltet das Projekt #Y Säkularisierungskampagne#! frei"
 ve_confessional_state_desc:0 "#header Konfessioneller Staat#!\nKirche und Staat regieren gemeinsam.\n\n#Y Während der Aktivität#!\n#P +5% Autorität, +10% Bekehrung, +10% Politischer Druck der Frommen#!\n#N -3% Migrationsanziehung, +5% Radikale durch offene Vorurteile#!\nPlus ein kleiner Zuschuss für die Glaubensfamilie Ihrer Staatsreligion (christlich, islamisch, jüdisch, dharmisch, gelehrte oder animistisch).\n\n#Y Religiöser Ausgleich#!\nBasisequilibrium #Y 55#!. Zustimmung und Politischer Druck der Frommen beeinflussen ihn am stärksten.\n\n#Y Bei 75 religiösem Ausgleich#!\n#P +5% Autorität, +5 Legitimität#!\n\n#Y Religiöses Projekt#!\nKonfessionelle Bekehrung"
 ve_freedom_state_desc:0 "#header Gewissensfreiheit#!\nJeder Glaube wird unter einem Staat toleriert.\n\n#Y Während der Aktivität#!\n#P +5% Migrationsanziehung, -5% Radikale durch offene Vorurteile#!\n#N -15% Bekehrung, -25 Bürokratie#!\n\n#Y Religiöser Ausgleich#!\nBasisequilibrium #Y 55#!. Geringer Aufruhr, Legitimität und eine gesunde Verwaltung steigern ihn.\n\n#Y Bei 75 Religiöser Ausgleich#!\n#P +5% Migrationsanziehung, +5 Legitimität#!\n\n#Y Religiöses Projekt#!\nÖffentlichkeitsarbeit für Gewissensfreiheit"
 ve_separation_state_desc:0 "#header Völlige Trennung#!\nDas neutrale Modell: Der Staat nimmt keine religiöse Position ein.\n\n#Y Während der Aktivität#!\n#P +8% Migrationsanziehung, -10% Radikale durch offene Vorurteile, -5% Radikale durch gewaltsame Feindseligkeit#!\n#N -30% Bekehrung#!\n\n#Y Religiöser Ausgleich#!\nBasisequilibrium #Y 60#!, das höchste der vier. Geringer Aufruhr steigert ihn weiter.\n\n#Y Bei 75 Religiöser Ausgleich#!\n#P +5% Beschlusserfolg, +5 Legitimität#!\n\n#Y Religiöses Projekt#!\n#N Keines. Dieses Modell besitzt absichtlich keine religiöse Kampagne.#!"
 ve_atheism_state_desc:0 "#header Staatsatheismus#!\nEin aggressives Säkularisierungsmodell, kein tolerantes.\n\n#Y Während der Aktivität#!\n#P +5% Technikverbreitung, +2% Bildungszugang, +20% Bekehrung#!\n#N -5% Autorität, -10% Politischer Druck der Frommen, +5% Radikale durch offene Vorurteile#!\n\n#Y Religiöser Ausgleich#!\nBasisequilibrium #Y 45#!, das niedrigste der vier. Alphabetisierung und Zustimmung der Intellektuellen steigern ihn; starker Politischer Druck der Frommen senkt ihn.\n\n#Y Bei 75 religiösem Ausgleich#!\n#P +5% Technikverbreitung, +5% Bürokratie#!\n\n#Y Religiöses Projekt#!\nSäkularisierungskampagne\n\n#Y Hinweis#!\nDer Wechsel zu diesem Modell verursacht eine #N 5-jährige#! Krise anstelle von 3, wenn die Alphabetisierung unter 50% liegt oder der politische Druck der Frommen 20% oder mehr beträgt."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Programme sind #Y optional#! und permanent. Jedes kostet #Y 25 Frömmigkeitsfonds#! und löst eine #Y 24-monatige#! Belastung aus, während der kein weiteres Programm übernommen werden kann. Alle acht gehören zu Ihrem aktuellen Religionsmodell und gehen verloren, wenn sich dieses Modell ändert.\n#Y Fahren Sie mit der Maus über eine Karte oder einen Messwert, um die vollständigen Effekte anzuzeigen.#!"
 ve_religious_program_strain_notice:0 "Ein Programm wird noch umgesetzt – es kann erst dann ein weiteres Programm übernommen werden, wenn diese Belastung abgelaufen ist."
 ve_religious_program_adopted_badge:0 "ÜBERNOMMEN"
 ve_adopt_program_button:0 "Übernehmen"
 ve_religious_program_cost_label:0 "Kostet #Y 25 Frömmigkeitsfonds#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Gezieltes Religiöses Projekt"
 ve_religious_projects_intro:0 "Ein Religiöses Projekt ist #Y optional#! und es kann jeweils nur eines aktiv sein. Seine Kosten in Frömmigkeitsfonds werden sofort bezahlt und #N -50 Bürokratie und -25 Autorität#! gelten für die Dauer seiner Laufzeit. Bei Abschluss wird ein Teil des Frömmigkeitsfonds erstattet und der religiöse Ausgleich erhöht.\n#Y Fahren Sie mit der Maus über eine Karte oder einen Messwert, um die vollständigen Effekte anzuzeigen.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Projekt in Bearbeitung"
 ve_religious_project_backlash_notice:0 "Ein abgebrochenes Projekt blockiert weiterhin ein neues – der 24-monatige Rückschlag muss zuerst ablaufen."
 ve_religious_project_start_instruction:0 "#Y Wie man es startet#!\n1. Öffnen Sie einen Ihrer eigenen Staaten.\n2. Drücken Sie #Y Projekt starten#! im Panel dieses Staates.\nAlles, was noch fehlt, wird im Tooltip dieses Buttons aufgelistet."
 ve_targeted_religious_project_target:0 "Ziel: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Kein Projektziel"
 ve_no_active_religious_project:0 "Kein aktives Religiöses Projekt"
 ve_confessional_conversion_name:0 "Konfessionelle Bekehrung"
 ve_confessional_conversion_cost:0 "Kosten: #Y 125 Frömmigkeitsfonds#!"
 ve_confessional_conversion_short:0 "Bekehrt einen Staat zur Staatsreligion.\n#P +20 Frömmigkeitsfonds, +5 Ausgleich#! bei Abschluss – erzeugt jedoch Radikale."
 ve_confessional_conversion_desc:0 "#header Konfessionelle Bekehrung#!\nWird in einem einzelnen Staat durchgeführt, dessen Anteil Ihrer eigenen Religion unter #Y 90%#! liegt.\n\n#Y Kosten#!\n#Y 125 Frömmigkeitsfonds#!, sofort bezahlt\n\n#Y Während der Laufzeit#!\n#N -50 Bürokratie, -25 Autorität#! für das Land\n#N +20% Bekehrung und +20% Radikalismuskanäle#! im Zielstaat\n\n#Y Bei Abschluss#!\nBekehrt #Y 5%#! der Bevölkerung des Staates zu Ihrer Staatsreligion oder #Y 7%#! mit Nationalistisch VII\n#P +20 Frömmigkeitsfonds, +5 Religiöser Ausgleich#!\n\n#Y Warnung#!\n#N Die Bekehrung erzeugt Radikale im Zielstaat.#!"
 ve_freedom_outreach_name:0 "Öffentlichkeitsarbeit für Gewissensfreiheit"
 ve_freedom_outreach_cost:0 "Kosten: #Y 100 Frömmigkeitsfonds#!"
 ve_freedom_outreach_short:0 "Gewinnen Sie einen Staat für sich, ohne eine Bekehrung zu erzwingen.\n#P +20 Frömmigkeitsfonds, +7 Ausgleich#! bei Abschluss sowie Loyalisten."
 ve_freedom_outreach_desc:0 "#header Öffentlichkeitsarbeit für Gewissensfreiheit#!\nAusführen in einem einzelnen Staat, dessen Anteil Eurer eigenen Religion unter #Y 90%#! liegt.\n\n#Y Kosten#!\n#Y 100 Frömmigkeitsfonds#!, sofort bezahlt\n\n#Y Während der Laufzeit#!\n#N -50 Bürokratie, -25 Autorität#! für das Land\n\n#Y Bei Abschluss#!\n#P Keine erzwungene Bekehrung#! – stattdessen Loyalisten im Ziel-Staat\n#P +20 Frömmigkeitsfonds, +7 Religiöser Ausgleich#!"
