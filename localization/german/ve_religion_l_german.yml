 ve_secularization_campaign_desc:0 "#header Säkularisierungskampagne#!\nWird in einem einzelnen Staat durchgeführt, dessen Anteil Ihrer eigenen Religion unter #Y 90%#! liegt.\n\n#Y Kosten#!\n#Y 150 Frömmigkeitsfonds#!, sofort fällig\n\n#Y Während der Laufzeit#!\n#N -50 Bürokratie, -25 Autorität#! für das Land\n#N +20% Bekehrung und +20% Radikalitätskanäle#! im Ziel-Staat\n\n#Y Bei Abschluss#!\nBekehrt #Y 5%#! der Bevölkerung des Staates zum Atheismus, oder #Y 7%#! mit Nationalistisch VII\n#P +25 Frömmigkeitsfonds, +8 Religiöser Ausgleich#!\n\n#Y Warnung#!\n#N Die Bekehrung erzeugt Radikale im Ziel-Staat.#!"
