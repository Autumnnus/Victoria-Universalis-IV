 ve_religious_project_unavailable_short:0 "Das neutrale Modell hat absichtlich keine religiöse Kampagne. Beschließt ein anderes Gesetz für Kirche und Staat, falls Ihr eine wünscht."
 ve_religious_project_unavailable_desc:0 "#header Kein Projekt verfügbar#!\nVöllige Trennung ist das vollständig neutrale Modell und kann kein zielgerichtetes Religiöses Projekt beginnen.\n\nBekenntnisstaat, Glaubensfreiheit und Staatsatheismus führen jeweils ihr eigenes Projekt aus. Beschließt das entsprechende Gesetz für Kirche und Staat, um eines zu erhalten."

