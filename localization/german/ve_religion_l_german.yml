l_german:
 ve_piety:0 "Frömmigkeit"
 ve_piety_reform:0 "Frömmigkeitsreform"
 ve_piety_reform_tt:0 "#header Frömmigkeitsreform#!\nAktuell: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nMonatliches Einkommen: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Monatliche Aufschlüsselung#!\nBasis: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLegitimität: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nVerwaltung: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nGläubige Unterstützung: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nIdee Lehre: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Ideale Lehre – nur Ihr aktuelles religiöses Modell zählt#!\n#P Konfessionsstaat/Staatsatheismus#!: Nationalist V #P +1#!\n#P Gewissensfreiheit/völlige Trennung#!: Reformist V #P +1#!\nDie oben genannte aktive Gesamtsumme ist begrenzt auf #Y +1#!, daher können die beiden Pfade nicht gestapelt werden.\n\nFür Doktrinen und Programme ausgegeben (#Y 25#! jeweils) und zum Targeted Religious Project (#Y 100-150#!, modellabhängig). Das Einkommen verlangsamt sich #Y 400#! und stoppt bei #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doktrinen und Programme"
 ve_piety_tt:0 "#header Religiöse Siedlung#!\nAktueller Zustand: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nSoziales Gleichgewicht: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMonatliche Bewegung: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Gleichgewichtszusammenbruch#!\nAbwicklungsmodell: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nModellunterstützung: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitimität, Verwaltung und Stabilität: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nDer Zähler bewegt sich #Y 20 %#! jeden Monat in Richtung Gleichgewicht, begrenzt auf #Y ±5#!.\nBei #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nBei #N 25#! oder darunter: #N -5 Legitimität und -5 % Gesetzeserlasserfolg#!.\n\nDieser Zähler zahlt nicht mehr für Programme – siehe Piety Reform. Programme erfordern mindestens  #Y 25#! Frömmigkeitsreform, Kosten  #Y 25#! und verhängen eine #Y 24 Monate#! Umsetzungsbelastung.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Religiöses Projekt"
 ve_religious_project_progress_tt:0 "#header Gezieltes religiöses Projekt#!\nFortschritt: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nMonatlicher Fortschritt: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (mindestens 1, maximal 7)\n\n#Y Monatliche Aufschlüsselung#!\nBasis: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nVerwaltung: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLegitimität: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nModellunterstützung: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nSiedlung: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nReligiöse Bewegungen: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nZielstaat Aufruhr: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nIdeengruppen: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Ideengruppen – nur Boni, die Ihrem aktuellen religiösen Modell entsprechen, sind aktiv#!\n#P Konfessionsstaat#!: Nationalist VII #P +1#!\n#P Gewissensfreiheit#!: Reformist VII #P +1#!\n#P Staatsatheismus#!: Nationalistischer VII #P +1#! und Akademischer VII #P +1#!\nDie Gesamtzahl der oben genannten aktiven Ideengruppen ist auf begrenzt #Y +2#!.\n\nStarten Sie einen über das Bedienfeld eines eigenen Staates. Konfessioneller und staatlicher Atheismus konvertieren #Y 5 %#! der Bevölkerung des Zielstaates bei Fertigstellung, oder #Y 7 %#! mit Nationalist VII und fügen Sie Radikale hinzu. Stattdessen fügt die Gewissensfreiheit Loyalisten hinzu, ohne eine Konvertierung zu erzwingen. Total Separation kann kein Projekt starten – es ist das völlig neutrale Modell.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "In Bearbeitung"
 ve_religious_project_none:0 "Keine aktiv"

