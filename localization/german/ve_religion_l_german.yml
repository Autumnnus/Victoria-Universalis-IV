 ve_settlement_tier_low:0 "UMFRIEDEN – #N -5 Legitimität und -5 % Erfolg bei der Gesetzesverabschiedung#!."
 ve_settlement_hint:0 "Strömt sich in Richtung des Gleichgewichts, das Ihr religiöses Modell hervorbringt. Bei 75+ erhalten Sie einen Bonus, bei 25 oder weniger Instabilität."
 ve_piety_reform_hint:0 "Für Programme (jeweils 25) und religiöse Projekte ausgegeben. Das Sparen ist sicher, aber das Einkommen halbiert sich bei 400 und stoppt bei 500."
 ve_religious_project_hint:0 "Optional. Gestartet in einem Ihrer eigenen Staaten, sofern Ihr Religionsmodell dies zulässt."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Religionsmodelle"
 ve_religious_models_help:0 "Ihr Religionsmodell wird von Ihnen bestimmt #Y Kirche und Staat#! Gesetz und ist #P bereits aktiv#! - Hier gibt es nichts zur Auswahl. Das Modell entscheidet nur wie #Y Religiöse Siedlung#! erworben wurde, welche acht Programme Sie übernehmen und welches religiöse Projekt Sie durchführen dürfen.\n#Y Eine Gesetzesänderung ist optional:#! Es setzt die Siedlung auf  #Y 35#! zurück, entfernt jedes Programm, das Sie übernommen haben, bricht ein laufendes religiöses Projekt ab und wendet a an #Y 3-5 Jahre#! Siedlungskrise.\n#Y Bewegen Sie den Mauszeiger über eine beliebige Karte oder Anzeige, um die volle Wirkung zu erzielen.#!"
 ve_religious_model_active_footer:0 "Aktuelles Modell"
 ve_confessional_state_short:0 "Kirche und Staat regieren gemeinsam.\nSiedlung kommt von #Y Gläubige Zustimmung und Einfluss#!."
 ve_freedom_state_short:0 "Jeder Glaube wird unter einem Staat toleriert.\nDie Siedlung kommt von #Y ein ruhiges, gut geführtes Land#!."
 ve_separation_state_short:0 "Der Staat nimmt überhaupt keine religiöse Position ein.\nDie Besiedlung beginnt am höchsten und wird belohnt #Y geringe Unruhe#!."
 ve_atheism_state_short:0 "Aktive, staatlich gesteuerte Säkularisierung.\nSiedlung kommt von #Y Alphabetisierung und die Intelligenz#!."
 ve_confessional_state_unlocks:0 "Führt die aus #Y Confessional Conversion#! Projekt"
 ve_freedom_state_unlocks:0 "Läuft die #Y Freiheitsoffensive#! Projekt"
 ve_separation_state_unlocks:0 "#N Ein religiöses Projekt kann nicht ausgeführt werden#!"
 ve_atheism_state_unlocks:0 "Läuft die #Y Säkularisierungskampagne#! Projekt"
 ve_confessional_state_desc:0 "#header Konfessioneller Staat#!\nKirche und Staat regieren gemeinsam.\n\n#Y Während aktiv#!\n#P +5 % Autorität, +10 % Bekehrung, +10 % fromme politische Stärke#!\n#N -3 % Migrationsanziehung, +5 % Radikale durch offene Vorurteile#!\nPlus ein kleines Paket für die Glaubensfamilie Ihrer Staatsreligion (christlich, islamisch, jüdisch, dharmisch, gelehrt oder animistisch).\n\n#Y Setzung#!\nGrundgleichgewicht #Y 55#!. Frömmige Zustimmung und Einfluss bewegen es am meisten.\n\n#Y Bei 75 Siedlung#!\n#P +5 % Autorität, +5 Legitimität#!\n\n#Y Religiöses Projekt#!\nKonfessionelle Konvertierung"
 ve_freedom_state_desc:0 "#header Gewissensfreiheit#!\nJeder Glaube wird unter einem Staat toleriert.\n\n#Y Im aktiven Zustand#!\n#P +5 % Migrationsanziehung, -5 % Radikale durch offene Vorurteile#!\n#N -15 % Konvertierung, -25 Bürokratie#!\n\n#Y Siedlung#!\nGrundgleichgewicht #Y 55#!. Geringe Unruhen, Legitimität und eine gesunde Verwaltung erhöhen es.\n\n#Y Bei 75 Settlement#!\n#P +5 % Migrationsanziehung, +5 Legitimität#!\n\n#Y Religiöses Projekt#!\nFreedom Outreach"
 ve_separation_state_desc:0 "#header Totale Trennung#!\nDas neutrale Modell: Der Staat nimmt keine religiöse Position ein.\n\n#Y Im aktiven Zustand#!\n#P +8 % Migrationsanziehung, -10 % Radikale durch offene Vorurteile, -5 % Radikale durch Gewalt Feindseligkeit#!\n#N -30 % Umwandlung#!\n\n#Y Abrechnung#!\nBasisgleichgewicht #Y 60#!, das höchste der vier. Geringe Turbulenzen erhöhen es weiter.\n\n#Y Bei 75 Siedlung#!\n#P +5 % Gesetzeserlasserfolg, +5 Legitimität#!\n\n#Y Religiöses Projekt#!\n#N Keine. Dieses Modell hat bewusst keine religiöse Kampagne.#!"
 ve_atheism_state_desc:0 "#header Staatsatheismus#!\nEin aggressives Säkularisierungsmodell, kein tolerantes.\n\n#Y Während aktiv#!\n#P +5 % Technologieverbreitung, +2 % Zugang zu Bildung, +20 % Konvertierung#!\n#N -5 % Autorität, -10 % gläubige politische Stärke, +5 % Radikale durch offene Vorurteile#!\n\n#Y Siedlung#!\nBasisgleichgewicht #Y 45#!, das niedrigste der vier. Alphabetisierung und Anerkennung der Intelligenz erhöhen es; starker frommer Einfluss senkt es.\n\n#Y Bei 75 Siedlung#!\n#P +5 % Technologieverbreitung, +5 % Bürokratie#!\n\n#Y Religiöses Projekt#!\nSäkularisierungskampagne\n\n#Y Hinweis#!\nDer Wechsel zu diesem Modell kostet a #N 5 Jahre#! Krise statt 3, wenn die Alphabetisierung unter 50 % liegt oder der Einfluss der Gläubigen 20 % oder mehr beträgt."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Programme sind #Y optional#! und dauerhaft. Jeder kostet #Y 25 Frömmigkeitsreform#! und beginnt a #Y 24 Monate#! Umsetzungsstress, bei dem kein weiteres Programm verabschiedet werden kann. Alle acht gehören zu Ihrem aktuellen religiösen Modell und gehen verloren, wenn sich dieses Modell ändert.\n#Y Bewegen Sie den Mauszeiger über eine beliebige Karte oder Anzeige, um die volle Wirkung zu erzielen.#!"
 ve_religious_program_strain_notice:0 "Ein Programm wird noch umgesetzt. Es kann kein weiteres Programm übernommen werden, bis dieser Zeitraum abläuft."
 ve_religious_program_adopted_badge:0 "ANGENOMMEN"
 ve_adopt_program_button:0 "Annehmen"
 ve_religious_program_cost_label:0 "Kosten #Y 25 Frömmigkeitsreform#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Gezieltes religiöses Projekt"
 ve_religious_projects_intro:0 "Ein religiöses Projekt ist #Y optional#! und es kann jeweils nur einer ausgeführt werden. Die Kosten für die Frömmigkeitsreform werden sofort bezahlt #N -50 Bürokratie und -25 Autorität#! bewerben, solange es läuft. Durch den Abschluss werden einige Frömmigkeitsreformen zurückerstattet und die religiöse Siedlung erhöht.\n#Y Bewegen Sie den Mauszeiger über eine beliebige Karte oder Anzeige, um die volle Wirkung zu erzielen.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Projekt in Bearbeitung"
 ve_religious_project_backlash_notice:0 "Ein abgebrochenes Projekt blockiert immer noch ein neues – die 24-monatige Rücklaufzeit muss zuerst ablaufen."
 ve_religious_project_start_instruction:0 "#Y So starten Sie es#!\n1. Öffnen Sie einen Ihrer eigenen Staaten.\n2. Drücken #Y Projekt starten#! im Bedienfeld dieses Staates.\nAlles, was noch fehlt, wird im Tooltip dieser Schaltfläche aufgeführt."
 ve_targeted_religious_project_target:0 "Ziel: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Kein Projektziel"
 ve_no_active_religious_project:0 "Kein aktives religiöses Projekt"
 ve_confessional_conversion_name:0 "Konfessionelle Konvertierung"
 ve_confessional_conversion_cost:0 "Kosten: #Y 125 Frömmigkeitsreform#!"
 ve_confessional_conversion_short:0 "Konvertieren Sie einen Staat zur Staatsreligion.\n#P +20 Frömmigkeitsreform, +5 Siedlung#! am Ende - aber es schafft Radikale."
 ve_confessional_conversion_desc:0 "#header Konfessionelle Bekehrung#!\nLaufen Sie in einem einzigen Staat, dessen Anteil Ihrer eigenen Religion unter #Y 90 %#! liegt.\n\n#Y Kosten#!\n#Y 125 Frömmigkeitsreform#!, sofort bezahlt\n\n#Y Solange es läuft#!\n#N -50 Bürokratie, -25 Autorität#! für das Land\n#N +20 % Conversion- und +20 % Radikalismus-Kanäle#! im Zielstaat\n\n#Y Bei Abschluss#!\nKonvertiert #Y 5 %#! der Bevölkerung des Staates zu Ihrer Staatsreligion, oder #Y 7 %#! mit Nationalist VII\n#P +20 Frömmigkeitsreform, +5 religiöse Siedlung#!\n\n#Y Warnung#!\n#N Die Konvertierung erzeugt Radikale im Zielstaat.#!"
 ve_freedom_outreach_name:0 "Freiheitsoffensive"
 ve_freedom_outreach_cost:0 "Kosten: #Y 100 Frömmigkeitsreform#!"
 ve_freedom_outreach_short:0 "Erobern Sie einen Staat, ohne eine Konvertierung zu erzwingen.\n#P +20 Frömmigkeitsreform, +7 Siedlung#! bei Abschluss, plus Loyalisten."
