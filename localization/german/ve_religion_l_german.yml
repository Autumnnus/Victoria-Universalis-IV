l_german:
 ve_piety:0 "Frömmigkeit"
 ve_piety_reform:0 "Frömmigkeitsfonds"
 ve_piety_reform_tt:0 "#header Frömmigkeitsfonds#!\nAktuell: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nMonatliches Einkommen: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Monatliche Aufschlüsselung#!\nBasis: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLegitimität: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nVerwaltung: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nUnterstützung der Geistlichen: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nDoktrin: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Doktrin – nur Euer aktuelles Religionsmodell zählt#!\n#P Konfessioneller Staat / Staatsatheismus#!: Nationalistisch V #P +1#!\n#P Gewissensfreiheit / Vollständige Trennung#!: Reformistisch V #P +1#!\nDie aktive Gesamtsumme oben ist auf #Y +1#! begrenzt, weshalb sich beide Pfade nicht addieren lassen.\n\nWird für Doktrinen und Programme (#Y 25#! je) sowie für das zielgerichtete Religiöse Projekt (#Y 100-150#!, modellabhängig) ausgegeben. Das Einkommen verlangsamt sich nach #Y 400#! und stoppt bei #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doktrinen und Programme"
 ve_piety_tt:0 "#header Religiöser Ausgleich#!\nAktueller Zustand: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nSoziales Gleichgewicht: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMonatliche Bewegung: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Gleichgewichtsaufschlüsselung#!\nAusgleichsmodell: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nModellunterstützung: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitimität, Verwaltung und Stabilität: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nDer Wert bewegt sich jeden Monat um #Y 20%#! auf das Gleichgewicht zu, begrenzt auf #Y ±5#!.\nBei #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nBei #N 25#! oder darunter: #N -5 Legitimität und -5% Beschlusserfolg#!.\n\nDieser Wert bezahlt nicht länger Programme – siehe Frömmigkeitsfonds. Programme erfordern mindestens #Y 25#! Frömmigkeitsfonds, kosten #Y 25#! und verursachen eine #Y 24-monatige#! Belastung.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Religiöses Projekt"
 ve_religious_project_progress_tt:0 "#header Zielgerichtetes Religiöses Projekt#!\nFortschritt: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nMonatlicher Fortschritt: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (Minimum 1, Maximum 7)\n\n#Y Monatliche Aufschlüsselung#!\nBasis: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nVerwaltung: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLegitimität: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nModellunterstützung: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nAusgleich: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nReligiöse Bewegungen: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nAufruhr im Zielstaat: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nDoktrinengruppen: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Doktrinengruppen – nur Boni passend zu Eurem aktuellen Religionsmodell sind aktiv#!\n#P Konfessioneller Staat#!: Nationalistisch VII #P +1#!\n#P Gewissensfreiheit#!: Reformistisch VII #P +1#!\n#P Staatsatheismus#!: Nationalistisch VII #P +1#! und Akademisch VII #P +1#!\nDie Summe der aktiven Doktrinengruppen oben ist auf #Y +2#! begrenzt.\n\nStarten Sie eines über das Panel eines besessenen Staates. Der Konfessionelle Staat und der Staatsatheismus bekehren bei Abschluss #Y 5%#! der Bevölkerung des Zielstaates oder #Y 7%#! mit Nationalistisch VII und erzeugen Radikale. Die Gewissensfreiheit fügt stattdessen Loyalisten hinzu, ohne eine Bekehrung zu erzwingen. Die Vollständige Trennung kann kein Projekt starten – sie ist das völlig neutrale Modell.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "In Durchführung"
 ve_religious_project_none:0 "Keines aktiv"

