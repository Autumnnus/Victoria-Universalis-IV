l_german:
 # Doctrine Ledger - gui/ve_panel_ledger.gui
 VE_LEDGER:0 "Hauptbuch"
 VE_LEDGER_SELECTED:0 "#bold Hauptbuch#!"
 VE_LG_TITLE:0 "Lehrbuch"
 VE_LG_HINT:0 "Der Stand der Doktrin jedes Landes. Klicken Sie auf eine Spaltenüberschrift, um zu sortieren, auf einen Filter, um die Liste einzugrenzen, und auf ein Land, um dessen Panel für die vollständigen Details pro Gruppe zu öffnen."

 # Columns
 VE_LG_COL_RANK:0 "#"
 VE_LG_COL_COUNTRY:0 "Land"
 VE_LG_COL_INSIGHT:0 "Einblick"
 VE_LG_COL_GROUPS:0 "Gruppen"
 VE_LG_COL_IDEAS:0 "Gruppenideen"
 VE_LG_COL_NATIONAL_IDEAS:0 "Nationale Ideen"
 VE_LG_COL_NATIONAL_IDEAS_TT:0 "#header Nationale Ideen#!\nEin Marker pro Feld „Nationale Idee“, plus der Nationale Bonus auf der rechten Seite. Ein Land schaltet für jede dritte Gruppenidee, die es kauft, den nächsten Platz frei."
 VE_LG_COL_RELIGION:0 "Religiöses Modell"
 VE_LG_COL_IDENTITY:0 "Identitätsmodell"
 VE_LG_COL_ERA:0 "Ära"

 # Cell values
 VE_LG_GROUPS_VALUE:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_LG_IDEAS_VALUE:0 "[Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21"
 VE_LG_REWARDS_VALUE:0 "R [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]"
 VE_LG_ERA_TT:0 "#header [Country.GetCustom('ve_cp_age_name')]#!\nEra Momentum: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\nEra Rewards hat dieses Zeitalter gekauft: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nDerzeit erreichte Ziele: #Y [Country.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0] / 7#!\nZiele wurden in diesem Zeitalter gesichert: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\nGoldenes Zeitalter: [Country.GetCustom('ve_cp_golden_age_status')]"
 VE_LG_OPEN_COUNTRY_TT:0 "Öffnen Sie das Panel dieses Landes. Die Details zu Ideen, Religion, Identität und Ära finden Sie im #Y Nationale Doktrin#! Abschnitt dort."

 # Sort tooltips
 VE_LG_SORT_PRESTIGE_TT:0 "Sortieren nach #Y Prestige#!  – die Standardreihenfolge, das Höchste zuerst."
 VE_LG_SORT_INSIGHT_TT:0 "Sortieren nach Lagerbestand #Y National Insight#!, das Höchste zuerst."
 VE_LG_SORT_GROUPS_TT:0 "Sortieren nach #Y begrüßte Ideengruppen#!, die meisten zuerst."
 VE_LG_SORT_IDEAS_TT:0 "Sortieren nach #Y gekaufte Gruppenideen#! (Nationaler Ideenfortschritt), die meisten zuerst."
 VE_LG_SORT_SETTLEMENT_TT:0 "Sortieren nach #Y Religiöse Siedlung#!, höchste zuerst."
 VE_LG_SORT_COHESION_TT:0 "Sortieren nach #Y Nationaler Zusammenhalt#!, höchste zuerst."
 VE_LG_SORT_MOMENTUM_TT:0 "Sortieren nach #Y Ära-Momentum#!, höchste zuerst."

 # Filters
 VE_LG_F_ALL:0 "Alle"
 VE_LG_F_GREAT_POWERS:0 "Großmächte"
 VE_LG_F_MAJOR_POWERS:0 "Großmächte+"
 VE_LG_F_RECOGNIZED:0 "Anerkannt"
 VE_LG_F_RELEVANT:0 "Für mich relevant"
 VE_LG_F_WITH_GROUPS:0 "Hat Ideengruppen"

 # Paging
 VE_LG_PAGE_INFO:0 "Seite [GetGlobalVariable('ve_ledger_page_number').GetValue|0] / [GetGlobalVariable('ve_ledger_page_count').GetValue|0]  ([GetGlobalVariable('ve_ledger_total').GetValue|0])"
 VE_LG_REFRESH:0 "Aktualisieren"
 VE_LG_REFRESH_TT:0 "Erstellen Sie die Liste neu. Zeilenwerte sind immer aktiv; Beim Erstellen der Liste werden nur die Reihenfolge und die Mitgliedschaft der Seite festgelegt."
 VE_LG_FIRST_TT:0 "Erste Seite"
 VE_LG_PREV_TT:0 "Vorherige Seite"
 VE_LG_NEXT_TT:0 "Nächste Seite"
 VE_LG_YOU:0 "#lore Ihr Land#!"
 VE_LG_EMPTY:0 "#lore Kein Land entspricht diesem Filter. Drücken Sie auf „Aktualisieren“ oder wählen Sie einen breiteren Filter.#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_ledger.txt
 ve_ledger_groups_tt_header:0 "#header Angenommene Ideengruppen#!"
 ve_ledger_groups_tt_none:0 "#lore Noch keine Ideengruppe angenommen.#!"
