l_german:
 # Doctrine Ledger - gui/ve_panel_ledger.gui
 VE_LEDGER:0 "Übersicht"
 VE_LEDGER_SELECTED:0 "#bold Übersicht#!"
 VE_LG_TITLE:0 "Doktrinenübersicht"
 VE_LG_HINT:0 "Der Doktrinenstand aller Länder. Klicken Sie auf eine Spaltenüberschrift zum Sortieren, auf einen Filter zum Einschränken der Liste und auf ein Land, um dessen Ansicht für die genauen Details pro Gruppe zu öffnen."

 # Columns
 VE_LG_COL_RANK:0 "#"
 VE_LG_COL_COUNTRY:0 "Land"
 VE_LG_COL_INSIGHT:0 "Nationaleinsicht"
 VE_LG_COL_GROUPS:0 "Gruppen"
 VE_LG_COL_IDEAS:0 "Gruppendoktrinen"
 VE_LG_COL_NATIONAL_IDEAS:0 "Nationale Doktrinen"
 VE_LG_COL_NATIONAL_IDEAS_TT:0 "#header Nationale Doktrinen#!\nEine Markierung je Slot für Nationale Doktrinen sowie der Nationale Bonus rechts. Ein Land schaltet für jede dritte gekaufte Gruppendoktrin den nächsten Slot frei."
 VE_LG_COL_RELIGION:0 "Religionsmodell"
 VE_LG_COL_IDENTITY:0 "Identitätsmodell"
 VE_LG_COL_ERA:0 "Zeitalter"

 # Cell values
 VE_LG_GROUPS_VALUE:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_LG_IDEAS_VALUE:0 "[Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21"
 VE_LG_REWARDS_VALUE:0 "R [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]"
 VE_LG_ERA_TT:0 "#header [Country.GetCustom('ve_cp_age_name')]#!\nEpochenschwung: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\nIn diesem Zeitalter gekaufte Zeitalterbelohnungen: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nDerzeit erfüllte Ziele: #Y [Country.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0] / 7#!\nIn diesem Zeitalter gesicherte Ziele: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\nGoldenes Zeitalter: [Country.GetCustom('ve_cp_golden_age_status')]"
 VE_LG_OPEN_COUNTRY_TT:0 "Öffnet die Ansicht dieses Landes. Details zu Doktrinen, Religion, Identität und Zeitalter befinden sich dort im Abschnitt #Y Nationale Doktrin#!."

 # Sort tooltips
 VE_LG_SORT_PRESTIGE_TT:0 "Nach #Y Prestige#! sortieren – Standardreihenfolge, Höchste zuerst."
 VE_LG_SORT_INSIGHT_TT:0 "Nach angesammelter #Y Nationaleinsicht#! sortieren, Höchste zuerst."
 VE_LG_SORT_GROUPS_TT:0 "Nach #Y angenommenen Doktrinengruppen#! sortieren, Meiste zuerst."
 VE_LG_SORT_IDEAS_TT:0 "Nach #Y gekauften Gruppendoktrinen#! (Fortschritt der Nationalen Doktrinen) sortieren, Meiste zuerst."
 VE_LG_SORT_SETTLEMENT_TT:0 "Nach #Y Religiösem Ausgleich#! sortieren, Höchster zuerst."
 VE_LG_SORT_COHESION_TT:0 "Nach #Y Nationalem Zusammenhalt#! sortieren, Höchster zuerst."
 VE_LG_SORT_MOMENTUM_TT:0 "Nach #Y Epochenschwung#! sortieren, Höchster zuerst."

 # Filters
 VE_LG_F_ALL:0 "Alle"
 VE_LG_F_GREAT_POWERS:0 "Großmächte"
 VE_LG_F_MAJOR_POWERS:0 "Mittelmächte+"
 VE_LG_F_RECOGNIZED:0 "Anerkannt"
 VE_LG_F_RELEVANT:0 "Für mich relevant"
 VE_LG_F_WITH_GROUPS:0 "Hat Doktrinengruppen"

 # Paging
 VE_LG_PAGE_INFO:0 "Seite [GetGlobalVariable('ve_ledger_page_number').GetValue|0] / [GetGlobalVariable('ve_ledger_page_count').GetValue|0]  ([GetGlobalVariable('ve_ledger_total').GetValue|0])"
 VE_LG_REFRESH:0 "Aktualisieren"
 VE_LG_REFRESH_TT:0 "Die Liste neu erstellen. Zeilenwerte sind stets aktuell; nur Reihenfolge und Zusammensetzung der Seite werden beim Erstellen der Liste festgelegt."
 VE_LG_FIRST_TT:0 "Erste Seite"
 VE_LG_PREV_TT:0 "Vorherige Seite"
 VE_LG_NEXT_TT:0 "Nächste Seite"
 VE_LG_YOU:0 "#lore Euer Land#!"
 VE_LG_EMPTY:0 "#lore Kein Land entspricht diesem Filter. Aktualisieren drücken oder einen breiteren Filter wählen.#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_ledger.txt
 ve_ledger_groups_tt_header:0 "#header Angenommene Doktrinengruppen#!"
 ve_ledger_groups_tt_none:0 "#lore Bisher keine Doktrinengruppe angenommen.#!"
