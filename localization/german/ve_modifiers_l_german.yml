 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "Ethnische Nation"
 ve_ethnic_identity_mdf_desc:0 "Der Staat definiert die politische Mitgliedschaft anhand seiner Primärkulturen."
 ve_civic_identity_mdf:0 "Bürgernation"
 ve_civic_identity_mdf_desc:0 "Der Staat definiert die politische Mitgliedschaft durch gemeinsame Institutionen und Staatsbürgerschaft."
 ve_composite_identity_mdf:0 "Zusammengesetzter Staat"
 ve_composite_identity_mdf_desc:0 "Der Staat gleicht mehrere Völker durch ausgehandelte und administrative Institutionen aus."
 ve_ethnic_high_cohesion_mdf:0 "Mobilisierte Nationalgemeinschaft"
 ve_ethnic_high_cohesion_mdf_desc:0 "Eine zusammenhängende ethnische Nation kann ihre Bevölkerung mobilisieren und den Staat legitimieren."
 ve_civic_high_cohesion_mdf:0 "Selbstbewusste Bürgergesellschaft"
 ve_civic_high_cohesion_mdf_desc:0 "Gemeinsame bürgerliche Institutionen schaffen Legitimität und soziale Mobilität."
 ve_composite_high_cohesion_mdf:0 "Stabiler imperialer Pakt"
 ve_composite_high_cohesion_mdf_desc:0 "Ein stabiler Pakt zwischen den Völkern des Staates stärkt Legitimität und Diplomatie."
 ve_low_national_cohesion_mdf:0 "Niedriger nationaler Zusammenhalt"
 ve_low_national_cohesion_mdf_desc:0 "Die staatliche Definition der Nation verliert ihre Legitimität."
 ve_identity_transition_backlash_mdf:0 "Gegenreaktion beim Identitätsübergang"
 ve_identity_transition_backlash_mdf_desc:0 "Institutionen und Gemeinschaften widersetzen sich der Neudefinition der Nation."
 ve_cultural_project_administration_mdf:0 "Kulturprojektverwaltung"
 ve_cultural_project_administration_mdf_desc:0 "Beamte und politisches Kapital engagieren sich für das aktive Kulturprojekt."
 ve_cultural_project_backlash_mdf:0 "Aufgegebenes Kulturprojekt"
 ve_cultural_project_backlash_mdf_desc:0 "Die plötzliche Aufgabe eines Kulturprogramms hat das öffentliche Vertrauen und die Verwaltungskoordination beschädigt."
 ve_national_curriculum_result_mdf:0 "Nationaler Lehrplan"
 ve_national_curriculum_result_mdf_desc:0 "Ein gemeinsamer Lehrplan erweitert Bildung und Qualifikationen, behält aber gleichzeitig bei es verbraucht Bürokratie."
 ve_shared_symbols_result_mdf:0 "Gemeinsame nationale Symbole"
 ve_shared_symbols_result_mdf_desc:0 "Gemeinsame bürgerliche Rituale und Symbole stärken Loyalität und staatliche Autorität."
 ve_ethnic_campaign_active_mdf:0 "Ethnische Integrationskampagne"
 ve_ethnic_campaign_active_mdf_desc:0 "Der Staat beschleunigt aktiv die Assimilation und provoziert Widerstand gegen die kulturelle Auslöschung."
 ve_ethnic_campaign_result_mdf:0 "Assimilationsprogramm"
 ve_ethnic_campaign_result_mdf_desc:0 "Eine abgeschlossene Integrationskampagne beschleunigt weiterhin die Assimilation und erzeugt gleichzeitig Spannungen in Bezug auf die kulturelle Auslöschung."
 ve_civic_initiative_active_mdf:0 "Initiative für gleiche Staatsbürgerschaft"
 ve_civic_initiative_active_mdf_desc:0 "Schulen und öffentliche Einrichtungen werden neu organisiert, um Chancen zu erweitern und offene Vorurteile abzubauen."
 ve_civic_initiative_result_mdf:0 "Programm für gleiche Staatsbürgerschaft"
 ve_civic_initiative_result_mdf_desc:0 "Die Initiative verbessert Qualifikationen, Migrationsanziehung und Widerstand gegen Öffnung Vorurteile."
 ve_composite_compact_active_mdf:0 "Verhandlungen zum Konstituierenden Pakt"
 ve_composite_compact_active_mdf_desc:0 "Verhandlungen reduzieren Beschwerden über die Staatsbürgerschaft zweiter Klasse, belasten aber vorübergehend die Steuerverwaltung."
 ve_composite_compact_result_mdf:0 "Verfassungspakt"
 ve_composite_compact_result_mdf_desc:0 "Der Pakt stärkt die Loyalität und verringert die durch die Staatsbürgerschaft zweiter Klasse verursachten Beschwerden."
