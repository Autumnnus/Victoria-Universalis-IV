 ve_ethnic_identity_mdf:0 "Ethnische Nation"
 ve_ethnic_identity_mdf_desc:0 "Der Staat definiert die politische Zugehörigkeit über seine Hauptkulturen."
 ve_civic_identity_mdf:0 "Staatsbürgernation"
 ve_civic_identity_mdf_desc:0 "Der Staat definiert die politische Zugehörigkeit durch gemeinsame Institutionen und Staatsbürgerschaft."
 ve_composite_identity_mdf:0 "Gesamtstaat"
 ve_composite_identity_mdf_desc:0 "Der Staat gleicht verschiedene Völker durch verhandelte und administrative Institutionen aus."
 ve_ethnic_high_cohesion_mdf:0 "Mobilisierte nationale Gemeinschaft"
 ve_ethnic_high_cohesion_mdf_desc:0 "Eine kohärente ethnische Nation kann ihre Bevölkerung mobilisieren und den Staat legitimieren."
 ve_civic_high_cohesion_mdf:0 "Selbstbewusste Staatsbürgergesellschaft"
 ve_civic_high_cohesion_mdf_desc:0 "Gemeinsame staatsbürgerliche Institutionen schaffen Legitimität und soziale Mobilität."
 ve_composite_high_cohesion_mdf:0 "Stabiler Staatspakt"
 ve_composite_high_cohesion_mdf_desc:0 "Ein stabiler Staatspakt zwischen den Völkern des Staates stärkt Legitimität und Diplomatie."
 ve_low_national_cohesion_mdf:0 "Geringer Nationaler Zusammenhalt"
 ve_low_national_cohesion_mdf_desc:0 "Die Definition der Nation durch den Staat verliert an Legitimität."
