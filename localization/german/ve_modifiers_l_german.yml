 ve_cultural_project_administration_mdf:0 "Verwaltung des Kulturprojekts"
 ve_cultural_project_administration_mdf_desc:0 "Beamte und politisches Kapital sind dem aktiven Kulturprojekt verpflichtet."
 ve_cultural_project_backlash_mdf:0 "Abgebrochenes Kulturprojekt"
 ve_cultural_project_backlash_mdf_desc:0 "Der abrupte Abbruch eines Kulturprogramms hat das öffentliche Vertrauen und die administrative Koordination geschädigt."
