l_german:
 SULIUS_LEGITIMACY_LEVEL_ACTIVE_TOOLTIP:0 "#tooltip_header [concept_legitimacy] \n[LegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\n$LEGITIMACY_LEVEL_BOUNDS_DESC$\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\nEffekte:#indent_newline:2 \n[LegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\nDies liegt an:#indent_newline:2 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 SULIUS_CAPITAL_MONEY:0 "#tooltip_header [concept_money]#!\nSaldo: #variable @money![AccessPlayer.PredictWeeklyBalance|D=+]#![GetPlayer.GetPowerDeltaIcon('money')]\n[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.GetPrincipal, '(CFixedPoint)0'), 'CREDIT_DESC', 'GOLD_RESERVES_DESC')]\nGoldreservenlimit: @money![GetPlayer.GetGoldReserveLimit|Dv]#!#![SelectLocalization(GetMetaPlayer.GetPlayedOrObservedCountry.IsValid, 'CAPITAL_MONEY_DELAYED', 'OBSERVER_NO_COUNTRY_SELECTED') ]"
 
 SULIUS_RESEARCH:0 "#tooltip_header [concept_technology]#!\n[SelectLocalization( GetPlayer.GetCurrentlyResearchedTechnology.IsValid, 'SULIUS_RESEARCHING', 'SULIUS_NOT_RESEARCHING' )]\n$TOOLTIP_DELIMITER$\n#V Technologiefortschritt#!\n#help Durch [concept_innovation]: @innovation![GetPlayer.GetWeeklyInnovation|+0]\nDurch [concept_technology_spread]: [GetPlayer.GetWeeklyTechnologySpreadForTechDesc(GetPlayer.GetCurrentlyResearchedTechnology.Self)]\n$TOOLTIP_DELIMITER$\n#V [concept_innovation]#!\nWir generieren jede Woche #v @innovation![GetPlayer.GetWeeklyInnovation|+2]#! [concept_innovation]:\n[GetPlayer.GetWeeklyInnovationDesc]\n\nEs können maximal @innovation![GetPlayer.GetWeeklyMaxInnovation|v2] [concept_innovation] pro Woche in die aktive Forschung investiert werden:\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\nJede [concept_innovation], die aufgrund von Investitionsgrenzen oder fehlender aktiver Forschung nicht ausgegeben wird, erhöht die Rate der [concept_technology_spread] für unser Land"
 SULIUS_RESEARCHING:0 "[GetPlayer.GetName] erforscht derzeit [GetPlayer.GetCurrentlyResearchedTechnology.GetName]#!\nFortschritt: #v @innovation! [GetPlayer.GetCurrentlyResearchedTechnology.GetProgress(GetPlayer.Self)|D]#! / #maximum [GetPlayer.GetCurrentlyResearchedTechnology.GetCost(GetPlayer.Self)|D]#! ([GetPlayer.GetCurrentlyResearchedTechnology.GetTimeLeftDesc( GetPlayer.Self )] verbleibend)"
 SULIUS_NOT_RESEARCHING:0 "[GetPlayer.GetName] erforscht derzeit nichts."
