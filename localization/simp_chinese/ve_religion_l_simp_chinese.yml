 ve_religious_program_cost_label:0 "成本 #Y 25 虔诚改革#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "有针对性的宗教项目"
 ve_religious_projects_intro:0 "一个宗教项目是 #Y 选修的#! 并且一次只能运行一个。其虔诚改革成本立即支付，并且 #N -50 官僚机构和 -25 权威#! 只要其运行就适用。完成它会退还一些虔诚改革并提高宗教结算。\n#Y 将鼠标悬停在任何卡片或仪表上以获得其全部效果。#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "进行中的项目"
 ve_religious_project_backlash_notice:0 "一个被取消的项目仍然会阻碍一个新的项目——24个月的强烈反对必须首先到期。"
 ve_religious_project_start_instruction:0 "#Y 如何开始它#!\n1.打开您自己的州之一。\n2.按 #Y 启动项目#! 在该状态的面板中。\n仍然缺少的内容会在该按钮的工具提示中列出。"
 ve_targeted_religious_project_target:0 "目标： #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "无项目目标"
 ve_no_active_religious_project:0 "无活跃的宗教项目"
 ve_confessional_conversion_name:0 "忏悔皈依"
 ve_confessional_conversion_cost:0 "成本： #Y 125虔诚改革#!"
