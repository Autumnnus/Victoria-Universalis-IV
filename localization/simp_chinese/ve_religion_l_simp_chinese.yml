 ve_piety:0 "虔诚"
 ve_piety_reform:0 "虔诚改革"
 ve_piety_reform_tt:0 "#header 虔诚改革#!\n当前： #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n月收入： [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y 月明细#!\n基数： [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\n合法性： [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\n行政： [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\n虔诚支持： [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\n理念主义： [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y 理念主义 —只有您当前的宗教模式才算数#!\n#P 信仰国家 / 国家无神论#!：民族主义者 V #P +1#!\n#P 良心自由 / 彻底分离#!：改良主义者 V #P +1#!\n以上有效总数上限为 #Y +1#!，因此两条路径不能叠加。\n\n花费在教义和程序上（#Y 25#! 每个）和目标宗教项目（#Y 100-150#!，取决于型号）。收入放缓 #Y 400#! 并停在 #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "教义与纲领"
 ve_piety_tt:0 "#header 宗教聚居#!\n现状： #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n社会均衡： #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n月度迁移： [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y 均衡崩溃#!\n聚居模式： [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\n模式支撑： [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\n合法性、管理和合法性稳定性： [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\n仪表每月向平衡方向移动 #Y 20%#! ，仅限于 #Y ±5#!.\n在 #P 75#!时： [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\n在 #N 25#! 或以下时： #N -5合法性和-5%法律颁布成功#!.\n\n此仪表不再支付计划费用 - 请参阅虔诚改革。项目至少需要 #Y 25#! 虔诚改革，成本 #Y 25#! 并施加一个 #Y 24个月#! 实施压力。\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "宗教项目"
 ve_religious_project_progress_tt:0 "#header 针对性宗教项目#!\n进度： #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n每月进度： [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] （最少1，最多7）\n\n#Y 每月细分#!\n基础： [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\n行政： [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\n合法性： [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\n模式支持： [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\n解决： [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\n宗教运动： [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\n目标国家混乱： [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\n理念组： [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y 理念组 — 只有与您当前宗教模式匹配的奖励才有效#!\n#P 忏悔国家#!：民族主义VII #P +1#!\n#P 良心自由#!：改革派VII #P +1#!\n#P 国家无神论#!：民族主义VII #P +1#!  和学术 VII #P +1#!\n上述活跃理念组总数上限为 #Y +2#!。\n\n从拥有的州面板开始一个。忏悔和国家无神论皈依 #Y 5%#! 完成后目标州的人口数量，或 #Y 7%#! 与国民党VII，并添加偏旁部首。相反，良心自由增加了忠诚者，而不强迫皈依。 Total Separation 无法启动项目 - 它是完全中立的模型。\n\n$ve_religious_project_hint$"
