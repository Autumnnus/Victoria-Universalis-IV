 ve_piety:0 "虔诚"
 ve_piety_reform:0 "虔修点"
 ve_piety_reform_tt:0 "#header 虔修点#!\n当前：#Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n每月收入：[GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y 每月明细#!\n基础：[GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\n合法性：[GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\n行政力：[GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\n虔诚派支持：[GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\n理念学说：[GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y 理念学说 — 仅计算您当前的宗教体制#!\n#P 确信国教制 / 国家无神论#!：民族主义 V #P +1#!\n#P 良心自由 / 完全分离#!：改良主义 V #P +1#!\n上述生效总额上限为 #Y +1#!，因此两条路径无法叠加。\n\n用于学说和计划（各 #Y 25#!）以及目标宗教工程（#Y 100-150#!，取决于体制）。超过 #Y 400#! 后收入放缓，并在 #Y 500#! 时停止。\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "学说与计划"
 ve_piety_tt:0 "#header 宗教协定#!\n当前状态：#Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n社会平衡点：#Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n每月变动：[GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y 平衡点明细#!\n协定体制：[GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\n体制支持：[GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\n合法性、行政力与稳定度：[GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\n进度条每月向平衡点移动 #Y 20%#!，受限于 #Y ±5#!。\n达到 #P 75#! 时：[GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\n达到 #N 25#! 或以下时：#N -5 合法性且 -5% 法律制定成功#!。\n\n此进度条不再用于支付计划 - 参见虔修点。计划需要至少 #Y 25#! 虔修点，花费 #Y 25#! 并施加 #Y 24个月#! 的实施阵痛。\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "宗教工程"
 ve_religious_project_progress_tt:0 "#header 目标宗教工程#!\n进度：#Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n每月进度：[GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]（最小 1，最大 7）\n\n#Y 每月明细#!\n基础：[GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\n行政力：[GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\n合法性：[GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\n体制支持：[GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\n协定：[GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\n宗教运动：[GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\n目标地区动乱：[GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\n理念群：[GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y 理念群 — 仅与您当前宗教体制相匹配的加成生效#!\n#P 确信国教制#!：民族主义 VII #P +1#!\n#P 良心自由#!：改良主义 VII #P +1#!\n#P 国家无神论#!：民族主义 VII #P +1#! 且 学术 VII #P +1#!\n上述生效的理念群总额上限为 #Y +2#!。\n\n从已拥有的地区面板中启动一个。确信国教制和国家无神论在完成后会皈依目标地区 #Y 5%#! 的人口，若有民族主义 VII 则为 #Y 7%#!，并增加激进派。良心自由则会增加效忠派而不强迫皈依。完全分离无法启动工程 - 它是完全中立的体制。\n\n$ve_religious_project_hint$"
