 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "宗教体制"
 ve_religious_models_help:0 "您的宗教体制由您的 #Y 教会与国家#! 法律决定且#P 已处于激活状态#!——此处无可供选择的内容。该体制仅决定如何获得 #Y 宗教协定#!、您可以采纳哪八项计划以及您可以运行哪项宗教工程。\n#Y 更改法律是可选的：#!它会将协定重置为 #Y 35#!，移除您已采纳的所有计划，取消正在运行的宗教工程并引发持续 #Y 3-5 年#! 的协定危机。\n#Y 悬停于任意卡片或进度条上以查看其完整效果。#!"
 ve_religious_model_active_footer:0 "当前体制"
 ve_confessional_state_short:0 "教会与国家共同治理。\n协定来源于 #Y 虔信者支持度与势力#!。"
 ve_freedom_state_short:0 "在同一国家下容纳所有信仰。\n协定来源于 #Y 平静且运转良好的国家#!。"
 ve_separation_state_short:0 "国家不持任何宗教立场。\n协定起始于最高点，并对#Y 低动乱#!予以奖励。"
 ve_atheism_state_short:0 "积极的、由国家主导的世俗化。\n协定取决于#Y 识字率和知识分子#!。"
 ve_confessional_state_unlocks:0 "运行#Y 国教化运动#!项目"
 ve_freedom_state_unlocks:0 "运行#Y 自由宣抚#!项目"
 ve_separation_state_unlocks:0 "#N 无法运行宗教工程#!"
 ve_atheism_state_unlocks:0 "运行#Y 世俗化运动#!项目"
 ve_confessional_state_desc:0 "#header 确信国教制#!\n教会与国家共同治理。\n\n#Y 生效中#!\n#P +5% 权威力，+10% 皈依，+10% 虔信者政治力量#!\n#N -3% 移民吸引力，+5% 来自公开偏见的激进派#!\n并为您的国教所属信仰家族（基督教、伊斯兰教、犹太教、印度宗教、学术宗教或万物有灵论）提供一小包加成。\n\n#Y 宗教协定#!\n基础平衡点 #Y 55#!。虔信者支持度和势力对其变动影响最大。\n\n#Y 宗教协定达 75 时#!\n#P +5% 权威力，+5 合法性#!\n\n#Y 宗教工程#!\n国教化运动"
 ve_freedom_state_desc:0 "#header 良心自由#!\n在同一个国家下宽容所有信仰。\n\n#Y 生效中#!\n#P +5% 移民吸引力，-5% 来自公开偏见的激进派#!\n#N -15% 皈依，-25 行政力#!\n\n#Y 宗教协定#!\n基础平衡点 #Y 55#!。低动乱、合法性和健全的行政能提升它。\n\n#Y 宗教协定达 75 时#!\n#P +5% 移民吸引力，+5 合法性#!\n\n#Y 宗教工程#!\n自由宣抚"
 ve_separation_state_desc:0 "#header 完全分离#!\n中立体制：国家不持任何宗教立场。\n\n#Y 生效中#!\n#P +8% 移民吸引力，-10% 来自公开偏见的激进派，-5% 来自暴力敌意的激进派#!\n#N -30% 皈依#!\n\n#Y 宗教协定#!\n基础平衡点 #Y 60#!，为四者中最高。低动乱会进一步提升它。\n\n#Y 宗教协定达 75 时#!\n#P +5% 立法成功，+5 合法性#!\n\n#Y 宗教工程#!\n#N 无。此体制刻意不设任何宗教运动。#!"
 ve_atheism_state_desc:0 "#header 国家无神论#!\n激进的世俗化体制，而非宽容体制。\n\n#Y 生效中#!\n#P +5% 科技扩散，+2% 受教育机会，+20% 皈依#!\n#N -5% 权威力，-10% 虔信者政治力量，+5% 来自公开偏见的激进派#!\n\n#Y 宗教协定#!\n基础平衡点 #Y 45#!，为四者中最低。识字率和知识分子支持度会提升它；强烈的虔信者势力会降低它。\n\n#Y 宗教协定达 75 时#!\n#P +5% 科技扩散，+5% 行政力#!\n\n#Y 宗教工程#!\n世俗化运动\n\n#Y 注意#!\n若识字率低于 50% 或虔信者势力达到 20% 及以上，转为该体制将付出一个持续 #N 5 年#!而非 3 年的危机代价。"

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "计划是#Y 可选的#!且永久生效。每个计划消耗 #Y 25 虔修点#!并开始一段 #Y 24 个月#!的实施阵痛，在此期间无法采纳进一步的计划。全部八个计划均归属于您当前的宗教体制，若该体制发生变更则会全部丢失。\n#Y 将鼠标悬停在任意卡片或条目上以查看其完整效果。#!"
 ve_religious_program_strain_notice:0 "某项计划仍在实施中——在阵痛期结束之前无法采纳更多计划。"
 ve_religious_program_adopted_badge:0 "已采纳"
 ve_adopt_program_button:0 "采纳"
 ve_religious_program_cost_label:0 "消耗 #Y 25 虔修点#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "定向宗教工程"
 ve_religious_projects_intro:0 "宗教工程是#Y 可选的#!且同时只能进行一个。其虔修点消耗将立即支付，并且只要其在运行，就会产生 #N -50 行政力与 -25 权威力#!的惩罚。完成工程将退还部分虔修点并提升宗教协定。\n#Y 将鼠标悬停在任意卡片或条目上以查看其完整效果。#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "工程进行中"
 ve_religious_project_backlash_notice:0 "被取消的工程仍会阻碍新工程的开启——为期 24 个月的强烈反弹必须先期结束。"
 ve_religious_project_start_instruction:0 "#Y 如何启动#!\n1. 打开您自己的一处地区。\n2. 点击该地区面板中的#Y 启动工程#!。\n任何仍未满足的条件都会在该按钮的工具提示中列出。"
