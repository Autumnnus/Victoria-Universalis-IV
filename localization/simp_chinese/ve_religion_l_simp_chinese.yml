 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "宗教模式"
 ve_religious_models_help:0 "您的宗教模式由您的宗教模式决定 #Y 教会与国家#! 法并且是 #P 已经活跃#! - 这里没有什么可以选择的。模型只决定如何 #Y 宗教聚落#! 是获得的，您可以采用哪八个计划，以及您可以运行哪个宗教项目。\n#Y 更改法律是可选的：#! 它将结算重置为 #Y 35#!，删除您已采用的每个计划，取消正在运行的宗教项目并应用 #Y 3-5年#! 解决危机。\n#Y 将鼠标悬停在任意卡片或仪表上即可获得全部效果。#!"
 ve_religious_model_active_footer:0 "当前模型"
 ve_confessional_state_short:0 "教会和国家共同治理。\n解决办法来自 #Y 虔诚的认可和影响力#!。"
 ve_freedom_state_short:0 "每一种信仰在一种状态下都是被容忍的。\n安定来自于 #Y 一个平静、管理良好的国家#!。"
 ve_separation_state_short:0 "国家根本不持有任何宗教立场。\n定居起点最高，奖励也最高 #Y 低动荡#!。"
 ve_atheism_state_short:0 "积极的、国家主导的世俗化。\n解决来自 #Y 识字和知识分子#!。"
 ve_confessional_state_unlocks:0 "运行 #Y 忏悔皈依#! 项目"
 ve_freedom_state_unlocks:0 "运行 #Y 自由外展#! 项目"
 ve_separation_state_unlocks:0 "#N 无法运行宗教项目#!"
 ve_atheism_state_unlocks:0 "运行 #Y 世俗化运动#! 项目"
 ve_confessional_state_desc:0 "#header Confessional State#!\nChurch and state govern together.\n\n#Y While active#!\n#P +5% Authority, +10% Conversion, +10% Devout Political Strength#!\n#N -3% Migration Attraction, +5% Radicals from Open Prejudice#!\nPlus one small package for your state religion's faith family (Christian, Islamic, Jewish, Dharmic, Scholarly or Animist).\n\n#Y Settlement#!\nBase平衡 #Y 55#!。虔诚的认可和影响力最能推动它。\n\n#Y 在 75 定居点#!\n#P +5% 权威，+5 合法性#!\n\n#Y 宗教项目#!\n忏悔皈依"
 ve_freedom_state_desc:0 "#header 良心自由#!\n每一种信仰在一个国家下都是被容忍的。\n\n#Y 活跃时#!\n#P +5% 迁移吸引力，-5%来自公开偏见的激进分子#!\n#N -15%转变，-25官僚主义#!\n\n#Y 和解#!\n基本均衡 #Y 55#!。低动荡、合法性和健康的管理提高了这一点。\n\n#Y 在 75 解决#!\n#P +5% 移民吸引力，+5 合法性#!\n\n#Y 宗教项目#!\n自由延伸"
 ve_separation_state_desc:0 "#header 完全分离#!\n中立模式：国家不采取宗教立场。\n\n#Y 活动期间#!\n#P +8% 移民吸引力，-10% 来自公开偏见的激进分子，-5% 来自暴力的激进分子敌意#!\n#N -30% 转化#!\n\n#Y 和解#!\n基础平衡 #Y 60#!，四者中最高。低混乱度会进一步提高。\n\n#Y 在 75 结算时#!\n#P +5% 法律颁布成功，+5 合法性#!\n\n#Y 宗教项目#!\n#N 无。这种模式故意不进行宗教运动。#!"
 ve_atheism_state_desc:0 "#header 国家无神论#!\n一种激进的世俗化模式，而不是一种宽容的模式。\n\n#Y 虽然活跃#!\n#P +5%技术传播，+2%教育机会，+20%转化#!\n#N -5%权威，-10%虔诚政治力量，+5%来自公开偏见的激进分子#!\n\n#Y 解决#!\n基础均衡 #Y 45#!，四者中最低。识字率和知识分子认可度提高；强大的虔诚影响力会降低它。\n\n#Y 在 75 定居点#!\n#P +5% 技术传播，+5% 官僚主义#!\n\n#Y 宗教项目#!\n世俗化运动\n\n#Y 注#!\n切换到此模型需要花费 #N 5年#! 如果识字率低于 50% 或虔诚影响力达到 20% 或以上，则危机而不是 3。"

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "节目有 #Y 选修的#! 和永久的。每项费用 #Y 25 虔诚改革#! 并开始一个 #Y 24个月#! 实施紧张，在此期间无法通过进一步的计划。所有八个都属于您当前的宗教模型，如果该模型发生变化，它们就会丢失。\n#Y 将鼠标悬停在任何卡牌或仪表上即可查看其全部效果。#!"
