 ve_doctrine_nationalist_positive_mdf:0 "国家协会网络"
 ve_doctrine_nationalist_positive_mdf_desc:0 "国家协会正在将合法政府转化为更广泛的忠诚度。"
 ve_doctrine_nationalist_negative_mdf:0 "相互竞争的国家红会"
 ve_doctrine_nationalist_negative_mdf_desc:0 "竞争的国家组织正在将政治合法性转变为政治合法性。 "
 ve_doctrine_reformist_positive_mdf:0 "有组织的改革网络"
 ve_doctrine_reformist_positive_mdf_desc:0 "政治运动获得了有序参与和妥协的渠道。"
 ve_doctrine_reformist_negative_mdf:0 "断裂的改革联盟"
 ve_doctrine_reformist_negative_mdf_desc:0 "相互竞争的改革组织正在将政治动员转变为激进主义。"
 ve_doctrine_professional_army_positive_mdf:0 "参谋培训周期"
 ve_doctrine_professional_army_positive_mdf_desc:0 "协调的参谋计划正在改善军队的培训体系。"
 ve_doctrine_professional_army_negative_mdf:0 "军官团瓶颈"
 ve_doctrine_professional_army_negative_mdf_desc:0 "晋升和人员争议正在减缓军事训练。"
 ve_doctrine_agrarian_positive_mdf:0 "协调的农业实践"
 ve_doctrine_agrarian_positive_mdf_desc:0 "农村机构在整个农业经济中传播可靠的方法。"
 ve_doctrine_agrarian_negative_mdf:0 "农业供应短缺"
 ve_doctrine_agrarian_negative_mdf_desc:0 "种子、信贷和协调的短缺正在减少农业产量。"

 ve_idea_evt.10.t:0 "安全守则全力输出"
 ve_idea_evt.10.d:0 "一系列工厂事故迫使工业检查问题公开化。独立检查员承诺提供可信的标准，而制造商坚持自愿规则将保留产量和主动性。"
 ve_idea_evt.10.a:0 "任命独立检查员。"
 ve_idea_evt.10.a.tt:0 "花费 #N 25#! 国家洞察力。工会获得 #P +1#! 认可度，实业家失 #N 1#! 认可度24个月。"
 ve_idea_evt.10.b:0 "让行业自行编写规范。"
 ve_idea_evt.10.b.tt:0 "实业家获得 #P +1#! 认可度，工会失 #N 1#! 认可度24个月。"
 ve_idea_evt.10.c:0 "分阶段规范规则。"
 ve_idea_evt.10.c.tt:0 "花费 #N 10#! 全国洞察力。利益集团批准无变化。"

 ve_idea_evt.11.t:0 "标准化机器零件"
 ve_idea_evt.11.d:0 "来自多个工业区的工程师已经制作了仪表、配件和机器零件的通用目录。为国家标准提供资金成本高昂，但可以消除整个制造网络中的摩擦。"
 ve_idea_evt.11.a:0 "在全国范围内采用标准。"
 ve_idea_evt.11.a.tt:0 "花费 #N 40#! 国家洞察力并获得 #P +5%#! 36个月的制造吞吐量。"
 ve_idea_evt.11.b:0 "将结果存档以供日后使用。"
 ve_idea_evt.11.b.tt:0 "获得 #P 15#! 国家洞察力。"
 ve_idea_evt.11.c:0 "我们的生产网络已经"
 ve_idea_evt.11.c.tt:0 "花费 #N 20#! 国家洞察力和收益 #P +5%#! 36个月的制造吞吐量。"

 ve_idea_evt.12.t:0 "工厂的瓶颈"
 ve_idea_evt.12.d:0 "订单不断积累，而不兼容的程序、延迟的组件和混乱的时间表使该国的工厂陷入窒息。政府可以派专家，把问题留给企业，或者利用已建立的建设办公室来协调应对。"
 ve_idea_evt.12.a:0 "派出专家组。"
 ve_idea_evt.12.a.tt:0 "花费 #N 25#! 国家洞察力，避免行业处罚。"
 ve_idea_evt.12.b:0 "工厂必须自己解决。"
 ve_idea_evt.12.b.tt:0 "遭受 #N -5%#! 24个月的生产能力。"
 ve_idea_evt.12.c:0 "启动建设局。"
 ve_idea_evt.12.c.tt:0 "花费 #N 10#! 国家洞察力，避免工业处罚。"

 ve_idea_evt.60.t:0 "机械化和保有权"
 ve_idea_evt.60.d:0 "新机械可以提高农业产量，但租户和小农担心快速转型会破坏农村生计。政府必须决定是加速机械化、首先保护土地使用权，还是协调地方逐步转型。"
 ve_idea_evt.60.a:0 "设立机械化基金。"
 ve_idea_evt.60.a.tt:0 "支出 #N 25#! 全国洞察力和收益 #P +5%#! 24个月农业生产量。实业家获得 #P +1#! 认可度，而农民则失败 #N 1#! 24个月批准。"
 ve_idea_evt.60.b:0 "在更换农场之前先确保佃户。"
 ve_idea_evt.60.b.tt:0 "农村民众获得 #P +1#! 批准，土地所有者失去 #N 1#! 24个月批准。"
 ve_idea_evt.60.c:0 "利用当地生产网络逐步过渡。"
 ve_idea_evt.60.c.tt:0 "花费 #N 10#! 国家洞察力和收益 #P +5%#! 24 个月的农业吞吐量。利益集团批准没有变化。"

 ve_idea_evt.61.t:0 "合作粮仓"
 ve_idea_evt.61.d:0 "农村代表展示了一个能够共享储备、记录和运输的合作粮仓网络。国家计划可以加强农业协调，而仅仅保留这些计划仍然可以丰富政府的机构知识。"
 ve_idea_evt.61.a:0 "为合作网络提供资金。"
 ve_idea_evt.61.a.tt:0 "花费 #N 40#! 国家洞察力和增益 #P +5%#! 36个月的农业吞吐量。"
 ve_idea_evt.61.b:0 "将记录分发给农业办公室。"
 ve_idea_evt.61.b.tt:0 "获得 #P 15#! 国家洞察力。"
 ve_idea_evt.61.c:0 "利用现有的农村机构。"
 ve_idea_evt.61.c.tt:0 "花费 #N 20#! 国家洞察力并获得 #P +5%#! 36个月的农业产出。"

 ve_idea_evt.62.t:0 "种子和信贷短缺"
 ve_idea_evt.62.d:0 "种子库存不足和农村信贷紧缩威胁着即将到来的农业周期。专家可以组织紧急响应，当地网络可以临时搭建，或者建立的生存机构可以暂时承担负担。"
 ve_idea_evt.62.a:0 "组织紧急专业知识计划。"
 ve_idea_evt.62.a.tt:0 "花费 #N 25#! 国家洞察力，避免农业处罚。"
 ve_idea_evt.62.b:0 "让地方网络找到自己的解决方案。"
 ve_idea_evt.62.b.tt:0 "遭受 #N -5%#! 24个月的农业吞吐量。"
 ve_idea_evt.62.c:0 "使用自给网络作为临时支柱。"
 ve_idea_evt.62.c.tt:0 "花费 #N 10#! 国家洞察力，避免农业处罚。"

 ve_idea_evt.20.t:0 "赞助或同行评审"
 ve_idea_evt.20.d:0 "政府期望从研究中获得实际成果资助，而学者们则警告说，赞助将用政治便利取代证据。持久的解决方案必须明确由谁来评判国家的学习。"
 ve_idea_evt.20.a:0 "建立独立审查委员会。"
 ve_idea_evt.20.a.tt:0 "花费 #N 25#! 国家洞察力。知识分子获得 #P +1#! 支持，小资产阶级失去 #N 1#! 支持24个月。"
 ve_idea_evt.20.b:0 "让国家确定研究重点。"
 ve_idea_evt.20.b.tt:0 "小资产阶级获得 #P +1#! 认可度，知识分子失去 #N 1#! 认可度24个月。"
 ve_idea_evt.20.c:0 "将共同的学术标准制度化。"
 ve_idea_evt.20.c.tt:0 "花费 #N 10#! 国家洞察力。利益集团批准没有变化。"
 ve_idea_evt.21.t:0 "省级研究网络"
 ve_idea_evt.21.d:0 "省级院校已开始在没有中央指导的情况下交流讲师、仪器和研究成果。正式支持可以将这种临时合作转变为一个国家研究网络。"
 ve_idea_evt.21.a:0 "为该网络提供资金。"
 ve_idea_evt.21.a.tt:0 "花费 #N 40#! 国家洞察力并获得 #P +5%#! 36个月的大学吞吐量。"
 ve_idea_evt.21.b:0 "将报告放入中央档案。"
 ve_idea_evt.21.b.tt:0 "获得 #P 15#! 国家洞察力。"
 ve_idea_evt.21.c:0 "将其连接到国家学院。"
 ve_idea_evt.21.c.tt:0 "花费 #N 20#! 国家洞察力和增益 #P +5%#! 36个月的大学吞吐量。"
 ve_idea_evt.22.t:0 "证书瓶颈"
 ve_idea_evt.22.d:0 "大学无法足够快地评估不断增长的学生、教师和新学科数量。延迟颁发证书现在威胁到更广泛的研究体系。"
 ve_idea_evt.22.a:0 "扩大评估能力。"
 ve_idea_evt.22.a.tt:0 "花费 #N 25#! 国家洞察力并避免学术处罚。"
 ve_idea_evt.22.b:0 "现有机构必须应对。"
 ve_idea_evt.22.b.tt:0 "遭受损失 #N -5%#! 24个月的大学吞吐量。"
 ve_idea_evt.22.c:0 "通过学校网络进行标准化。"
 ve_idea_evt.22.c.tt:0 "花费 #N 10#! 国家洞察力，避免学术处罚。"

 ve_idea_evt.30.t:0 "一典，多种传统"
 ve_idea_evt.30.d:0 "准备国家典籍的官员对省俗的位置存在分歧。单一的叙述保证了清晰度，但排除当地传统可能会削弱它想要定义的国家。"
 ve_idea_evt.30.a:0 "将当地传统编织到共同的故事中。"
 ve_idea_evt.30.a.tt:0 "花费 #N 25#! 国家洞察力。农村群众获益 #P +1#! 支持，小资产阶级失去 #N 1#! 支持24个月。"
 ve_idea_evt.30.b:0 "颁布一部正典。"
 ve_idea_evt.30.b.tt:0 "小资产阶级获得 #P +1#! 支持，农村民众失去 #N 1#! 支持24个月。"
 ve_idea_evt.30.c:0 "委托给经过培训的文化干部。"
 ve_idea_evt.30.c.tt:0 "花费 #N 10#! 国家洞察力。利益集团批准没有变化。"
 ve_idea_evt.31.t:0 "全国退伍军人协会"
 ve_idea_evt.31.d:0 "退伍军人组织了将仪式、互助和对国家的忠诚联系起来的协会。他们的网络可以在全国范围内扩展，也可以在不授予其官方角色的情况下进行研究。"
 ve_idea_evt.31.a:0 "支持全国范围内的协会。"
 ve_idea_evt.31.a.tt:0 "花费 #N 40#! 国家洞察力和增益 #P +5%#! 合法性忠诚者36个月。"
 ve_idea_evt.31.b:0 "将他们的经验记录在国家档案中。"
 ve_idea_evt.31.b.tt:0 "增益 #P 15#! 国家洞察力。"
 ve_idea_evt.31.c:0 "利用已经建立的国家网络。"
 ve_idea_evt.31.c.tt:0 "花费 #N 20#! 国家洞察力并获得 #P +5%#! 合法性的效忠者，持续36个月。"
 ve_idea_evt.32.t:0 "竞争国家红会"
 ve_idea_evt.32.d:0 "竞争的红会现在声称拥有代表国家发言的权利。他们相互竞争的仪式和出版物正在将共同的政治语言变成不满的根源。"
 ve_idea_evt.32.a:0 "起草一份共同宪章。"
 ve_idea_evt.32.a.tt:0 "花费 #N 25#! 国家洞察力并避免民族主义惩罚。"
 ve_idea_evt.32.b:0 "竞争会找到自己的极限。"
 ve_idea_evt.32.b.tt:0 "遭受 #N +5%#! 激进分子的合法性持续24个月。"
 ve_idea_evt.32.c:0 "让国家机构仲裁。"
 ve_idea_evt.32.c.tt:0 "花费 #N 10#! 国家洞察力，避免民族主义惩罚。"

 ve_idea_evt.40.t:0 "委员会或街道"
 ve_idea_evt.40.d:0 "改革者分为专家委员会和大众压力。委员会承诺连贯的立法，而有组织的运动坚持认为，没有公共力量的改革将无限期推迟。"
 ve_idea_evt.40.a:0 "建立一个独立的改革委员会。"
 ve_idea_evt.40.a.tt:0 "花费 #N 25#! 国家洞察力。知识分子获得 #P +1#! 支持度，工会失去 #N 1#! 支持度，持续24个月。"
 ve_idea_evt.40.b:0 "给运动行动空间。"
 ve_idea_evt.40.b.tt:0 "工会获得 #P +1#! 批准，工业家失去 #N 1#! 批准24个月。"
 ve_idea_evt.40.c:0 "应用既定的权利和程序框架。"
 ve_idea_evt.40.c.tt:0 "花费 #N 10#! 国家洞察力。利益集团批准没有变化。"
 ve_idea_evt.41.t:0 "信访网络"
 ve_idea_evt.41.d:0 "地方信访已成为一个协调一致的全国网络，能够处理申诉和提出改革建议。政府可以将其视为一种协商渠道或保留其方法以供以后使用。"
 ve_idea_evt.41.a:0 "把网络变成正式咨询。"
 ve_idea_evt.41.a.tt:0 "花费 #N 40#! 国家洞察力和增益 #P +5%#! 政治运动中的效忠者36个月。"
 ve_idea_evt.41.b:0 "在审查档案中提出要求。"
 ve_idea_evt.41.b.tt:0 "增益 #P 15#! 国家洞察力。"
 ve_idea_evt.41.c:0 "使用已经建立的改革组织。"
 ve_idea_evt.41.c.tt:0 "花费 #N 20#! 国家洞察力和增益 #P +5%#! 政治运动中的效忠者持续36个月。"
 ve_idea_evt.42.t:0 "联盟破裂"
 ve_idea_evt.42.d:0 "改革联盟在优先事项、时机和领导力方面存在分歧。除非恢复共同纲领，否则有组织的政治能量将强化为敌对的激进阵营。"
 ve_idea_evt.42.a:0 "重写共同纲领。"
 ve_idea_evt.42.a.tt:0 "花费 #N 25#! 国家洞察力并避免改革派的惩罚。"
 ve_idea_evt.42.b:0 "让分裂进入公开政治。"
 ve_idea_evt.42.b.tt:0 "遭受 #N +5%#! 政治运动中的激进分子持续24个月。"
 ve_idea_evt.42.c:0 "重新应用平等主义框架。"
 ve_idea_evt.42.c.tt:0 "花费 #N 10#! 国家洞察力并避免改革派的惩罚。"

 ve_idea_evt.50.t:0 "资历或功绩"
 ve_idea_evt.50.d:0 "军官队伍因晋升而划分。高级指挥官通过服役和习惯来捍卫军衔，而改革者则要求考试和绩效记录，以证明能力的提升。"
 ve_idea_evt.50.a:0 "引入功绩考试。"
