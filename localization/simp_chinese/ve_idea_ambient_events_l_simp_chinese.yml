 ve_idea_evt.51.d:0 "大型参谋演习暴露了动员、指导和指挥方面的宝贵经验教训。扩大计划可以在整个军队中传播这些教训，而将调查结果存档可以以很少的成本保存它们。"
 ve_idea_evt.51.a:0 "扩大演习。"
