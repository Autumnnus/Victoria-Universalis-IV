 ve_doctrine_ambient_ig_slighted_mdf:0 "制度轻微"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "政府已将该利益集团排除在最近的学说解决方案之外。"

 ve_doctrine_industrialist_positive_mdf:0 "标准化工业实践"
 ve_doctrine_industrialist_positive_mdf_desc:0 "制造商正在从协调的工业实践中受益。"
 ve_doctrine_industrialist_negative_mdf:0 "工业瓶颈"
 ve_doctrine_industrialist_negative_mdf_desc:0 "未解决的协调失败正在限制制造业。"
 ve_doctrine_academic_positive_mdf:0 "协调研究网络"
 ve_doctrine_academic_positive_mdf_desc:0 "大学通过协调网络共享方法、人员和结果。"
 ve_doctrine_academic_negative_mdf:0 "学术瓶颈"
