l_simp_chinese:
 ve_doctrine_ambient_cooldown_mdf:0 "学说辩论冷却"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "国家的机构正在消化近期学说辩论的后果。"
 ve_doctrine_ambient_ig_supported_mdf:0 "机构支持"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "政府已赋予该利益集团在解决学说辩论中显著的职责。"
 ve_doctrine_ambient_ig_slighted_mdf:0 "机构怠慢"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "政府在近期的学说裁定中排除了该利益集团。"

 ve_doctrine_industrialist_positive_mdf:0 "标准化工业实践"
 ve_doctrine_industrialist_positive_mdf_desc:0 "制造商正受益于一套协调的工业实践体系。"
 ve_doctrine_industrialist_negative_mdf:0 "工业瓶颈"
 ve_doctrine_industrialist_negative_mdf_desc:0 "未解决的协调失效正在制约制造业。"
 ve_doctrine_academic_positive_mdf:0 "协调研究网络"
 ve_doctrine_academic_positive_mdf_desc:0 "大学正通过协调网络共享方法、人员与成果。"
 ve_doctrine_academic_negative_mdf:0 "学术瓶颈"
 ve_doctrine_academic_negative_mdf_desc:0 "资质与协调方面的争议正在扰乱大学。"
 ve_doctrine_nationalist_positive_mdf:0 "国民联合网络"
 ve_doctrine_nationalist_positive_mdf_desc:0 "国民协会正将合法的政府转化为更广泛的忠诚。"
 ve_doctrine_nationalist_negative_mdf:0 "竞争中的民族社团"
 ve_doctrine_nationalist_negative_mdf_desc:0 "互为宿敌的国家组织正将政治合法性转化为新的不满。"
 ve_doctrine_reformist_positive_mdf:0 "有组织的改革网络"
 ve_doctrine_reformist_positive_mdf_desc:0 "政治运动已获得参与和妥协的有序渠道。"
 ve_doctrine_reformist_negative_mdf:0 "分裂的改革同盟"
 ve_doctrine_reformist_negative_mdf_desc:0 "相互竞争的改革组织正将政治动员转化为激进度。"
 ve_doctrine_professional_army_positive_mdf:0 "参谋训练周期"
 ve_doctrine_professional_army_positive_mdf_desc:0 "一项协调的参谋项目正在改善陆军的训练系统。"
 ve_doctrine_professional_army_negative_mdf:0 "军官团瓶颈"
 ve_doctrine_professional_army_negative_mdf_desc:0 "晋升与人事争议正在放缓军事训练。"
 ve_doctrine_agrarian_positive_mdf:0 "协调农业实践"
 ve_doctrine_agrarian_positive_mdf_desc:0 "乡村机构正在农业经济中传播可靠的方法。"
 ve_doctrine_agrarian_negative_mdf:0 "农业供给短缺"
 ve_doctrine_agrarian_negative_mdf_desc:0 "种子、信贷与协调的短缺正在降低农业吞吐量。"

 ve_idea_evt.10.t:0 "满负荷产出下的安全法典"
 ve_idea_evt.10.d:0 "一系列工厂事故使工业视察的问题浮出水面。独立视察员承诺提供可靠的标准，而制造商则坚持认为自愿守则将维护产出与积极性。"
 ve_idea_evt.10.a:0 "任命独立视察员。"
 ve_idea_evt.10.a.tt:0 "花费 #N 25#! 国策力。工会获得 #P +1#! 支持度，实业家失去 #N 1#! 支持度，持续 24 个月。"
 ve_idea_evt.10.b:0 "交由各产业编写自愿守则。"
 ve_idea_evt.10.b.tt:0 "实业家获得 #P +1#! 支持度，工会失去 #N 1#! 支持度，持续 24 个月。"
 ve_idea_evt.10.c:0 "分阶段推进规则标准化。"
 ve_idea_evt.10.c.tt:0 "花费 #N 10#! 国策力。无利益集团支持度变化。"

 ve_idea_evt.11.t:0 "标准化机械零件"
 ve_idea_evt.11.d:0 "来自数个工业区地带的工程师们已拟定了一份包含各种量规、配件和机械零件的通用目录。资助一项国家标准将耗资巨大，但却能够消除整个制造网络中的摩擦。"
 ve_idea_evt.11.a:0 "在全国范围内推行这些标准。"
 ve_idea_evt.11.a.tt:0 "消耗 #N 40#! 国策力并获得 #P +5%#! 制造业吞吐量，持续 36 个月。"
 ve_idea_evt.11.b:0 "将这些研究成果存档以备后用。"
 ve_idea_evt.11.b.tt:0 "获得 #P 15#! 国策力。"
 ve_idea_evt.11.c:0 "我们的生产网络已经做好了准备。"
 ve_idea_evt.11.c.tt:0 "消耗 #N 20#! 国策力并获得 #P +5%#! 制造业吞吐量，持续 36 个月。"

 ve_idea_evt.12.t:0 "工厂的瓶颈"
 ve_idea_evt.12.d:0 "订单堆积如山，而不兼容的程序、延迟交付的组件以及混乱的日程安排正扼杀着国家的各大工厂。政府可以派遣专家，将问题留给各企业自行解决，或是利用既有的建造办公室来协调应对措施。"
 ve_idea_evt.12.a:0 "派遣专家团队。"
 ve_idea_evt.12.a.tt:0 "消耗 #N 25#! 国策力并避免工业惩罚。"
 ve_idea_evt.12.b:0 "工厂必须自行解决此事。"
 ve_idea_evt.12.b.tt:0 "承受 #N -5%#! 制造业吞吐量，持续 24 个月。"
 ve_idea_evt.12.c:0 "启动建造局。"
 ve_idea_evt.12.c.tt:0 "消耗 #N 10#! 国策力并避免工业惩罚。"

 ve_idea_evt.60.t:0 "机械化与土地所有权"
 ve_idea_evt.60.d:0 "新机械能够提高农业产出，但佃农和小农们担心快速的转型会动摇农村生计。政府必须决定是加速机械化、优先保护土地所有权，还是协调一个渐进的本地转型过程。"
 ve_idea_evt.60.a:0 "建立机械化基金。"
 ve_idea_evt.60.a.tt:0 "消耗 #N 25#! 国策力并获得 #P +5%#! 农业吞吐量，持续 24 个月。实业家获得 #P +1#! 支持度，乡村民众失去 #N 1#! 支持度，持续 24 个月。"
 ve_idea_evt.60.b:0 "在改造农场前先保障佃农的利益。"
 ve_idea_evt.60.b.tt:0 "乡村民众获得 #P +1#! 支持度，地主失去 #N 1#! 支持度，持续 24 个月。"
 ve_idea_evt.60.c:0 "利用本地生产网络进行渐进式转型。"
 ve_idea_evt.60.c.tt:0 "消耗 #N 10#! 国策力并获得 #P +5%#! 农业吞吐量，持续 24 个月。无利益集团支持度变化。"

 ve_idea_evt.61.t:0 "合作社粮仓"
 ve_idea_evt.61.d:0 "农村代表们展示了一个能够共享储备、记录与运输的合作社粮仓网络。国家级计划可以加强农业协调，而仅仅保存这些方案也能丰富政府的制度知识。"
 ve_idea_evt.61.a:0 "资助合作社网络。"
 ve_idea_evt.61.a.tt:0 "消耗 #N 40#! 国策力并获得 #P +5%#! 农业吞吐量，持续 36 个月。"
 ve_idea_evt.61.b:0 "将记录分发给各农业办公室。"
 ve_idea_evt.61.b.tt:0 "获得 #P 15#! 国策力。"
 ve_idea_evt.61.c:0 "利用现有的农村机构。"
 ve_idea_evt.61.c.tt:0 "消耗 #N 20#! 国策力并获得 #P +5%#! 农业吞吐量，持续 36 个月。"

 ve_idea_evt.62.t:0 "种子与信贷短缺"
 ve_idea_evt.62.d:0 "贫乏的种子储备与日益收紧的农村信贷威胁着即将到来的农业周期。专家可以组织紧急应对，本土网络可以自行随机应变，或是让既有的自给自足机构暂时挑起重担。"
 ve_idea_evt.62.a:0 "组织紧急专业技术计划。"
 ve_idea_evt.62.a.tt:0 "消耗 #N 25#! 国策力并避免农业惩罚。"
 ve_idea_evt.62.b:0 "让本地网络自行寻求解决办法。"
 ve_idea_evt.62.b.tt:0 "承受 #N -5%#! 农业吞吐量，持续 24 个月。"
 ve_idea_evt.62.c:0 "将自给自足网络用作临时顶梁柱。"
 ve_idea_evt.62.c.tt:0 "消耗 #N 10#! 国策力并避免农业惩罚。"

 ve_idea_evt.20.t:0 "资助抑或同行评议"
 ve_idea_evt.20.d:0 "政府期望研究资助能带来实际成果，学者们则警告称，资助将用政治便利取代证据。持久的解决方案必须界定究竟由谁来评判国家的学术。"
 ve_idea_evt.20.a:0 "建立独立的评审委员会。"
 ve_idea_evt.20.a.tt:0 "花费 #N 25#! 国策力。在 24 个月内，知识分子获得 #P +1#! 支持度，小市民失去 #N 1#! 支持度。"
 ve_idea_evt.20.b:0 "由国家来规定研究优先级。"
 ve_idea_evt.20.b.tt:0 "在 24 个月内，小市民获得 #P +1#! 支持度，知识分子失去 #N 1#! 支持度。"
 ve_idea_evt.20.c:0 "将通用的学术标准制度化。"
 ve_idea_evt.20.c.tt:0 "花费 #N 10#! 国策力。无利益集团支持度变化。"
 ve_idea_evt.21.t:0 "地方研究网络"
 ve_idea_evt.21.d:0 "地方学院已开始在没有中央指挥的情况下交流讲师、仪器与研究成果。官方支持可以将这种即兴的合作转化为国家研究网络。"
 ve_idea_evt.21.a:0 "资助该网络。"
 ve_idea_evt.21.a.tt:0 "花费 #N 40#! 国策力，并在 36 个月内获得 #P +5%#! 大学吞吐量。"
 ve_idea_evt.21.b:0 "将报告存入中央档案馆。"
 ve_idea_evt.21.b.tt:0 "获得 #P 15#! 国策力。"
 ve_idea_evt.21.c:0 "将其接入国家科学院。"
 ve_idea_evt.21.c.tt:0 "花费 #N 20#! 国策力，并在 36 个月内获得 #P +5%#! 大学吞吐量。"
 ve_idea_evt.22.t:0 "资历瓶颈"
 ve_idea_evt.22.d:0 "大学已无法足够迅速地评估日益增加的学生、教员和新兴学科。延误的资历如今威胁到了更广泛的研究系统。"
 ve_idea_evt.22.a:0 "扩建评估能力。"
 ve_idea_evt.22.a.tt:0 "花费 #N 25#! 国策力并避免学术惩罚。"
 ve_idea_evt.22.b:0 "现有的机构必须设法应付。"
 ve_idea_evt.22.b.tt:0 "在 24 个月内承受 #N -5%#! 大学吞吐量。"
 ve_idea_evt.22.c:0 "通过学校网络实现标准化。"
 ve_idea_evt.22.c.tt:0 "花费 #N 10#! 国策力并避免学术惩罚。"

 ve_idea_evt.30.t:0 "单一正典，多种传统"
 ve_idea_evt.30.d:0 "筹备国家正典的官员们对地方习俗的地位意见不一。单一的叙事许诺了清晰性，但排挤地方传统可能会削弱其旨在定义的民族本身。"
 ve_idea_evt.30.a:0 "将地方传统编织进共同的故事中。"
 ve_idea_evt.30.a.tt:0 "花费 #N 25#! 国策力。在 24 个月内，乡村民众获得 #P +1#! 支持度，小市民失去 #N 1#! 支持度。"
 ve_idea_evt.30.b:0 "宣告一部官方正典。"
 ve_idea_evt.30.b.tt:0 "在 24 个月内，小市民获得 #P +1#! 支持度，乡村民众失去 #N 1#! 支持度。"
 ve_idea_evt.30.c:0 "将这项工作委托给受过训练的文化骨干。"
 ve_idea_evt.30.c.tt:0 "花费 #N 10#! 国策力。无利益集团支持度变化。"
 ve_idea_evt.31.t:0 "退伍军人全国协会"
 ve_idea_evt.31.d:0 "退伍军人已组建了将仪式、互助和对国家的忠诚联系在一起的协会。其网络可以向全国扩展，或在不赋予官方职责的情况下对其进行研究。"
 ve_idea_evt.31.a:0 "在全国范围内支持这些协会。"
 ve_idea_evt.31.a.tt:0 "花费 #N 40#! 国策力，并在 36 个月内获得来自合法性的 #P +5%#! 效忠派。"
 ve_idea_evt.31.b:0 "将其经验记录在国家档案馆中。"
 ve_idea_evt.31.b.tt:0 "获得 #P 15#! 国策力。"
 ve_idea_evt.31.c:0 "利用已经建立的国家网络。"
 ve_idea_evt.31.c.tt:0 "花费 #N 20#! 国策力，并在 36 个月内获得来自合法性的 #P +5%#! 效忠派。"
 ve_idea_evt.32.t:0 "竞争中的民族社会"
 ve_idea_evt.32.d:0 "敌对的社会现在宣称拥有代表民族的权力。他们针锋相对的庆典与出版物正在将共同的政治语言转变为不满的根源。"
 ve_idea_evt.32.a:0 "起草一份共同宪章。"
 ve_idea_evt.32.a.tt:0 "花费 #N 25#! 国策力并避免民族主义惩罚。"
 ve_idea_evt.32.b:0 "竞争自有其限度。"
 ve_idea_evt.32.b.tt:0 "遭受来自合法性的 #N +5%#! 激进派，持续 24 个月。"
 ve_idea_evt.32.c:0 "交由国家机构进行仲裁。"
 ve_idea_evt.32.c.tt:0 "花费 #N 10#! 国策力并避免民族主义惩罚。"

 ve_idea_evt.40.t:0 "委员会还是街头"
 ve_idea_evt.40.d:0 "改革派在专家委员会与群众施压之间产生分歧。委员会承诺制定连贯的立法，而有组织的运动则坚称，没有公众力量的改革将被无限期拖延。"
 ve_idea_evt.40.a:0 "组建一个独立的改革委员会。"
 ve_idea_evt.40.a.tt:0 "花费 #N 25#! 国策力。知识分子获得 #P +1#! 支持度，且工会失去 #N 1#! 支持度，持续 24 个月。"
 ve_idea_evt.40.b:0 "给予各运动行动的空间。"
 ve_idea_evt.40.b.tt:0 "工会获得 #P +1#! 支持度，且实业家失去 #N 1#! 支持度，持续 24 个月。"
 ve_idea_evt.40.c:0 "适用既定的权利与程序框架。"
 ve_idea_evt.40.c.tt:0 "花费 #N 10#! 国策力。利益集团支持度无变化。"
 ve_idea_evt.41.t:0 "请愿网络"
 ve_idea_evt.41.d:0 "地方请愿已演变为一个协调的全国网络，能够梳理不满并提出改革建议。政府可以将其确认为协商渠道，或将其方法保留以备后用。"
 ve_idea_evt.41.a:0 "将该网络转化为正式协商。"
 ve_idea_evt.41.a.tt:0 "花费 #N 40#! 国策力并获得来自政治运动的 #P +5%#! 效忠派，持续 36 个月。"
 ve_idea_evt.41.b:0 "将诉求归档入审阅案卷。"
 ve_idea_evt.41.b.tt:0 "获得 #P 15#! 国策力。"
 ve_idea_evt.41.c:0 "利用既已建立的改革组织。"
 ve_idea_evt.41.c.tt:0 "花费 #N 20#! 国策力并获得来自政治运动的 #P +5%#! 效忠派，持续 36 个月。"
 ve_idea_evt.42.t:0 "联盟破裂"
 ve_idea_evt.42.d:0 "改革派联盟因优先事项、时间表和领导权问题而分崩离析。除非恢复共同纲领，否则有组织的政治能量将硬化为敌对的激进派阵营。"
 ve_idea_evt.42.a:0 "重写共同纲领。"
 ve_idea_evt.42.a.tt:0 "花费 #N 25#! 国策力并避免改良主义惩罚。"
 ve_idea_evt.42.b:0 "任由分歧进入公开政治。"
 ve_idea_evt.42.b.tt:0 "遭受来自政治运动的 #N +5%#! 激进派，持续 24 个月。"
 ve_idea_evt.42.c:0 "重新应用平等主义框架。"
 ve_idea_evt.42.c.tt:0 "花费 #N 10#! 国策力并避免改良主义惩罚。"

 ve_idea_evt.50.t:0 "资历或才干"
 ve_idea_evt.50.d:0 "军官团在晋升问题上产生分歧。资深指挥官捍卫基于服役年限与惯例的军阶，而改革派则要求实行考试与业绩记录，向经证明的能力开放晋升通道。"
 ve_idea_evt.50.a:0 "引入才干考试。"
 ve_idea_evt.50.a.tt:0 "花费 #N 25#! 国策力并获得 #P +5%#! 训练率，持续 24 个月。军队失去 #N 1#! 支持度，持续 24 个月。"
 ve_idea_evt.50.b:0 "保留资历体制。"
 ve_idea_evt.50.b.tt:0 "军队获得 #P +1#! 支持度，持续 24 个月，但训练率下降 #N -5%#!，持续 12 个月。"
 ve_idea_evt.50.c:0 "利用总参谋部的服役记录。"
 ve_idea_evt.50.c.tt:0 "花费 #N 10#! 国策力并获得 #P +5%#! 训练率，持续 24 个月。利益集团支持度无变化。"
 ve_idea_evt.51.t:0 "宏大总参演习"
 ve_idea_evt.51.d:0 "一场大规模的总参演习暴露出动员、条令与指挥方面的宝贵经验。扩建该计划可将这些经验推广至全军，而将成果归档则能以微小的代价将其保存。"
 ve_idea_evt.51.a:0 "扩建演习。"
 ve_idea_evt.51.a.tt:0 "花费 #N 40#! 国策力并在 36 个月内获得 #P +5%#! 训练率。"
 ve_idea_evt.51.b:0 "将研究成果存入学说档案库。"
 ve_idea_evt.51.b.tt:0 "获得 #P 15#! 国策力。"
 ve_idea_evt.51.c:0 "利用专业指挥网络。"
 ve_idea_evt.51.c.tt:0 "花费 #N 20#! 国策力并在 36 个月内获得 #P +5%#! 训练率。"
 ve_idea_evt.52.t:0 "军官团瓶颈"
 ve_idea_evt.52.d:0 "陆军的扩张速度超越了教官与参演军官的培养速度。目前的训练日程正高度依赖一小批精疲力竭的骨干。"
 ve_idea_evt.52.a:0 "扩建训练骨干。"
 ve_idea_evt.52.a.tt:0 "花费 #N 25#! 国策力并避免军事惩罚。"
