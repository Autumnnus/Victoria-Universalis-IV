 ve_idea_evt.50.b:0 "保留资历制度。"
 ve_idea_evt.50.b.tt:0 "武装部队获得 #P +1#! 批准24个月，但培训率下降 #N -5%#! 12个月。"
 ve_idea_evt.50.c:0 "使用普通员工的服务记录。"
 ve_idea_evt.50.c.tt:0 "花费 #N 10#! 国家洞察力获得 #P +5%#! 24个月培训率。利益集团的批准不会改变。"
