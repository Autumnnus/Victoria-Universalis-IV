l_simp_chinese:
 ve_national_identity:0 "国家认同"
 ve_primary_cultures_label:0 "主要文化"
 ve_identity_models:0 "身份模式"
 ve_identity_model_active_footer:0 "已经激活"
 ve_switch_identity_button:0 "转换"
 ve_switch_identity_cost_label:0 "成本 #Y 200 文化指令#!"
 ve_begin_project_button:0 "开始项目"
 ve_identity_models_help:0 "你的国家总是只有一种身份模型，它是 #P 已经处于活动状态#!  — 您无需在此处选择任何内容。模型只决定如何 #Y 民族凝聚力#! 获得的收入以及您可以运行哪个文化项目。\n#Y 切换是可选的：#! 花费 #Y 200 文化授权#!，将内聚力重置为 #Y 35#!，取消任何正在运行的文化项目并阻止另一次切换 5 年。\n#Y 将鼠标悬停在任何卡片或仪表上即可获得完整效果。#!"
 ve_ethnic_identity_name:0 "民族国家"
 ve_civic_identity_name:0 "公民国家"
 ve_composite_identity_name:0 "复合国家"
 ve_ethnic_identity_short:0 "国家是围绕其主要文化来定义的。\n凝聚力来自于 #Y 人口优势#!。"
 ve_civic_identity_short:0 "一个通过学校教育建立起来的政治国家。\n凝聚力来自于 #Y 识字率和接受的少数群体#!。"
 ve_composite_identity_short:0 "几个民族在协商建立的制度下。\n凝聚力来自于 #Y 真正多元化的人口#!。"
 ve_ethnic_identity_unlocks:0 "解锁 #Y 民族融合运动#! 项目"
 ve_civic_identity_unlocks:0 "解锁 #Y 平等公民倡议#! 项目"
 ve_composite_identity_unlocks:0 "解锁 #Y 组成契约#! 项目"
 ve_ethnic_identity_desc:0 "#header 民族#!\n国家是围绕其主要文化来定义的。\n\n#Y 活跃时#!\n#P +15% 同化，+5% 权威#!\n#N -5% 移民吸引力，+5% 来自公开偏见的激进#!\n\n#Y 凝聚力#!\n当主流文化占人口的至少 60-75% 时上升，并急剧下降到 40% 以下。\n\n#Y 凝聚力 75 时#!\n#P +5% 征兵率，+3 合法性#!\n\n#Y 文化工程#!\n民族融合运动"
 ve_civic_identity_desc:0 "#header 公民国家#!\n通过教育和参与建立一个共同的政治国家。\n\n#Y 活跃期间#!\n#P +7% 移民吸引力，+1% 教育机会#!\n#N -10% 同化， -5%权威，-50官僚主义#!\n\n#Y 凝聚力#!\n识字率会提高它，但任何超过10%人口且接受度很低的非主流文化会降低它。\n\n#Y 在75凝聚力#!\n#P +5%资格，+3合法性#!\n\n#Y 文化项目#!\n相等公民倡议"
 ve_composite_identity_desc:0 "#header 复合国家#!\n多个民族通过协商机构进行统治。\n\n#Y 活跃期间#!\n#P -10%来自文化抹杀和二流公民的激进分子，+5%影响力#!\n#N -15% 同化，-5% 权威，-75 官僚主义#!\n\n#Y 凝聚力#!\n真正多元化的人口会提高它；人口超过 90% 的原住民文化会削弱这种模式。\n\n#Y 在 75 凝聚力#!\n#P +5% 影响力，+3 合法性#!\n\n#Y 文化项目#!\n宪法契约"
 ve_identity_change_cost_tt:0 "改变身份模型需要 #Y 200 文化授权#! 并且没有积极的身份转变强烈反对。此更改将凝聚力重置为 #Y 35#!，导致 #Y 5年过渡期的强烈反对#! 并取消任何正在进行的文化项目，无需支付额外的取消罚款。"
 ve_cultural_mandate:0 "文化使命"
 ve_culture_reform_point:0 "文化使命"
 ve_cultural_mandate_hint:0 "花在文化项目上。存起来是安全的，但收入到400就减半，到500就停止。"
 ve_culture_reform_point_tt:0 "#header 文化使命#!\n当前： #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n每月变化： [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y 花在什么地方#!\n文化项目 (75–150) 和身份模型变更 (200)。两者都不需要：储蓄任务是安全的，收入只减半到 400，到 500 就停止。\n\n#Y 每月细分#!\n基础： [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\n合法性： [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\n管理： [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\n模范社会： [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\n稳定和文化运动： [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\n法律对齐： [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\n思想主义： [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\n上限乘数： #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y 理念主义——只有你当前的身份模型才算#!\n#P 民族国家#!：民族主义V #P +1#!\n#P 公民国家#!：改良主义者V #P +1#!；学术V #P +1#!\n#P 复合状态#!：改良主义V #P +1#!\n上述活跃总数的上限为 #Y +2#!。\n\n公民国家从读写能力中提取模型社会成分，复合国家从多元社会的读写能力中提取，民族国家从主流文化人口实力中提取。\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "民族凝聚力"
 ve_national_cohesion_hint:0 "朝着你的身份模型产生的平衡漂移。 75 以上时，您会获得加值，不稳定度为 25 或更低。"
 ve_national_cohesion_tt:0 "#header 国家凝聚力#!\n当前： #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n平衡： #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n每月变动： [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n常见条件： [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\n恒等模型条件： [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\n凝聚力每月向平衡移动 20% 的距离，最多 5 点。激进的文化运动将均衡降低了 10。在 75 或更高时，当前模型会提供额外的好处；国家不稳定度不超过 25 时适用。\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "无影响"
 ve_cultural_projects:0 "文化项目"
 ve_cultural_projects_intro:0 "文化项目有 #Y 可选#!。一次只能运行一个：其授权成本立即支付，并且 #N -75 官僚机构和 -25 权威#! 只要它运行就可以申请。完成一个项目会返还一些授权并提高凝聚力。全国项目只有在竣工效益到期后才能重复；已完成的国家/文化目标无法再次选择。\n#Y 将鼠标悬停在任何卡片或仪表上以查看其完整效果。#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "项目正在进行"
 ve_cultural_project_progress:0 "项目进度"
 ve_cultural_project_progress_tt:0 "#header 每月项目进度#!\n当前： #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n剩余： #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\n每月总数： [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] （最少1，最多7）\n\n#Y 每月细分#!\n基础： [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\n行政： [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\n合法性： [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\n模范社会： [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\n凝聚力： [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\n文化运动： [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\n目标国家混乱： [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\n理念组： [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y 理念组 — 仅与您当前身份模型匹配的奖励有效#!\n#P 民族国家#!：民族主义 VII #P +1#!\n#P 公民国家#!：改革主义者 VII、学术 VII 或福利 VI — #P +1#! 各\n#P 综合国家#!：改革派 VII 或外交派 VI — #P +1#! 每个\n以上活跃创意组总数上限为 #Y +2#!;任何进一步的匹配奖金都不会增加进度。\n\n模型社会根据主动身份模型奖励公民素养、种族人口集中度或复合多样性。进度达到后，将在下个月更新时解决完成情况 #Y 100#!。"
 ve_cancel_cultural_project_button:0 "取消项目"
 ve_cancel_cultural_project_tt:0 "#header 取消文化项目#!\n投资的文化任务为 #N 不予退款#!。民族凝聚力下降 #N 5#! 和一个 #N 两年的反弹#! 阻止了另一个项目。"
 ve_start_cultural_project_button:0 "启动项目"
 ve_national_curriculum_name:0 "国家课程"
 ve_national_curriculum_cost:0 "成本： #Y 100文化使命#!"
 ve_national_curriculum_short:0 "全国性的教育改革。\n#P +20使命，+5凝聚力#!，然后更好的教育。"
 ve_national_curriculum_desc:0 "#header 国家课程#!\n全国范围内的学校改革。\n\n#Y 成本#!\n#Y 100文化任务#!，立即支付\n\n#Y 完成后#!\n#P +20文化任务，+5民族凝聚力#!\n\n#Y 之后10年#!\n#P +2%教育机会，+5%资格#!\n#N -25官僚机构#!"
 ve_national_curriculum_requirements_tt:0 "需要 #Y 100文化任务#!，没有活跃的文化项目和没有项目的强烈反对。当之前的操作完成时，它也无法开始 #Y 国家课程#! 福利已激活。"
 ve_shared_symbols_name:0 "共享符号"
 ve_shared_symbols_cost:0 "成本： #Y 75文化指令#!"
 ve_shared_symbols_short:0 "旗帜、国歌和公共仪式。\n#P +20指令，+7凝聚力#!，然后是忠诚者和权威。"
 ve_shared_symbols_desc:0 "#header 共享符号#!\n旗帜、国歌和公共仪式，在整个国家推广\n\n#Y 费用#!\n#Y 75文化授权#!，立即支付\n\n#Y 完成后#!\n#P +20文化使命，+7国家凝聚力#!\n\n#Y 之后8年#!\n#P +10%来自完全接受的民众的忠诚者，+25权威#!"
 ve_shared_symbols_requirements_tt:0 "需要 #Y 75 文化指令#!，没有活跃的文化项目，也没有项目反弹。当之前的操作完成时，它也无法开始 #Y 共享符号#! 效益是活跃的。"
 ve_ethnic_campaign_name:0 "民族融合运动"
 ve_ethnic_campaign_cost:0 "费用： #Y 125 文化使命#!"
 ve_ethnic_campaign_short:0 "在一个州同化大量少数群体。\n#P +25 使命，+8 凝聚力#!，但它会产生激进分子。"
 ve_ethnic_campaign_desc:0 "#header 种族融合运动#!\n在一个州针对其最大的非主要文化进行竞选，该文化必须至少占 #Y 5%#! \n\n#Y 费用#!\n#Y 125文化委托#!，立即支付\n\n#Y 完成后#!\n同化 #Y 5%#! 目标文化转化为原代文化，或 #Y 7%#! 与国民党VII\n#P +25文化使命，+8民族凝聚力#!\n离开 #Y 10年#! 国家同化计划\n\n#Y 警告#!\n#N 项目的开始和结束都会在目标文化中产生激进分子。#!"
 ve_civic_initiative_name:0 "平等公民倡议"
 ve_civic_initiative_cost:0 "成本： #Y 100文化授权#!"
 ve_civic_initiative_short:0 "提高一个州少数人的接受度。\n#P +25 授权，+10 凝聚力#!，加上忠诚者。"
 ve_civic_initiative_desc:0 "#header 平等公民倡议#!\n在一个州内以其最大的非主要文化运行，该文化必须至少拥有 #Y 5%#! 该州的人口。\n\n#Y 成本#!\n#Y 100文化授权#!，立即支付\n\n#Y 完成后#!\n#P +15接受该文化10年#!\n目标国家的效忠者\n#P +25文化使命，+10民族凝聚力#!\n十年来提高资格和移民吸引力"
 ve_composite_compact_name:0 "成分契约"
 ve_composite_compact_cost:0 "成本： #Y 150文化使命#! 和 #Y 40凝聚力#!"
 ve_composite_compact_short:0 "承认少数民族为组成文化。\n#P +30使命，+12凝聚力#!，永久。"
 ve_composite_compact_desc:0 "#header 构成紧凑#!\n在单一状态下运行在未识别的非主要文化上，持有至少 #Y 5%#! \n\n#Y 成本#!\n#Y 150 文化使命#!，立即支付，以及至少 #Y 40 民族凝聚力#!\n\n#Y 完成后#!\n#P +15 接受该文化，永久#!\n承认其为构成文化\n目标国家的效忠者\n#P +30 文化使命， +12民族凝聚力#!"
 ve_targeted_project_start_instruction:0 "#Y 如何开始#!\n1.打开您自己的州之一。\n2.按 #Y 启动项目#! 在该状态的面板中。\n目标区域性和仍然缺少的任何内容都列在该按钮的工具提示中。"
 ve_targeted_project_state_requirements_tt:0 "国家必须归我们所有，并包含合格的非主要文化，至少包括 #Y 5%#! 其人口。最大的合格文化成为目标。已在该州完成的文化不能再次成为目标，但可以在另一个州成为目标。还必须满足当前身份模型的成本和要求。"
 ve_targeted_cultural_project_target:0 "目标： #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#!  #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "范围： #Y 整个国家#!"
 ve_no_cultural_project_target:0 "无项目目标"
 ve_no_active_cultural_project:0 "无活跃的文化项目"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "凝聚- [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "碎片- #N 国家不稳定#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% 征兵率和+3 合法性#!."
 ve_civic_high_cohesion_effect:0 "#P +5% 资格和+3 合法性#!."
 ve_composite_high_cohesion_effect:0 "#P +5% 影响力和+3 合法性#!."
 ve_identity_transition_backlash_notice:0 "身份转换反弹仍然有效 - 模型在到期之前无法再次切换。"
 ve_cultural_project_backlash_notice:0 "取消的项目仍然会阻止新项目 - 2 年的反弹必须首先到期。"

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "转换反弹激活"
 ve_cultural_project_backlash_notice_short:0 "取消反向间隙 激活"
 ve_targeted_project_start_instruction_short:0 "从您自己的状态之一启动它：打开状态并按 #Y 启动项目#!。"
