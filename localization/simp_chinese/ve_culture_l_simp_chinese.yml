 ve_identity_transition_backlash_notice_short:0 "体制转变反弹生效中"
 ve_cultural_project_backlash_notice_short:0 "取消反弹生效中"
 ve_targeted_project_start_instruction_short:0 "从你自己的某个地区启动：打开该地区并点击 #Y 启动项目#!。"
