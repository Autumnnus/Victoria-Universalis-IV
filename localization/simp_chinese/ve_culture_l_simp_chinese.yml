l_simp_chinese:
 ve_national_identity:0 "民族认同"
 ve_primary_cultures_label:0 "主流文化"
 ve_identity_models:0 "认同体制"
 ve_identity_model_active_footer:0 "已激活"
 ve_switch_identity_button:0 "切换"
 ve_switch_identity_cost_label:0 "花费 #Y 200 文化赋权#!"
 ve_begin_project_button:0 "开始工程"
 ve_identity_models_help:0 "你的民族始终拥有且仅拥有一个#P已激活#!的认同体制——你无需在此进行选择。该体制仅决定如何获得#Y民族凝聚力#!以及你可以进行哪种文化工程。\n#Y切换是可选的：#!它花费 #Y 200 文化赋权#!，将凝聚力重置为 #Y 35#!，取消所有进行中的文化工程并阻断下一次切换 5 年。\n#Y将鼠标悬停在任意卡片或计量条上以查看其完整效果。#!"
 ve_ethnic_identity_name:0 "族群国家"
 ve_civic_identity_name:0 "公民国家"
 ve_composite_identity_name:0 "复合国家"
 ve_ethnic_identity_short:0 "本民族围绕其主流文化进行构建。\n凝聚力来源于#Y人口主导地位#!。"
 ve_civic_identity_short:0 "通过学校教育构建的政治民族。\n凝聚力来源于#Y识字率与被接纳的少数群体#!。"
 ve_composite_identity_short:0 "在谈判达成的机构下联合的数个族群。\n凝聚力来源于#Y真正多元的人口结构#!。"
 ve_ethnic_identity_unlocks:0 "解锁#Y族群一体化运动#!工程"
 ve_civic_identity_unlocks:0 "解锁#Y平等公民倡议#!工程"
 ve_composite_identity_unlocks:0 "解锁#Y立宪协定#!工程"
 ve_ethnic_identity_desc:0 "#header 族群国家#!\n本民族围绕其主流文化进行构建。\n\n#Y 激活时 #!\n#P +15% 同化，+5% 权威力 #!\n#N -5% 移民吸引力，公开偏见产生的激进派 +5% #!\n\n#Y 凝聚力 #!\n当主流文化占人口的 60% 至 75% 时上升，低于 40% 时急剧下降。\n\n#Y 凝聚力达到 75 时 #!\n#P +5% 征兵率，+3 合法性 #!\n\n#Y 文化工程 #!\n族群一体化运动"
 ve_civic_identity_desc:0 "#header 公民国家#!\n通过教育和参与构建的共享政治民族。\n\n#Y 激活时 #!\n#P +7% 移民吸引力，+1% 受教育机会 #!\n#N -10% 同化，-5% 权威力，-50 行政力 #!\n\n#Y 凝聚力 #!\n识字率会提升它，但任何非主流文化人口比例超过 10% 且接纳度极低时会降低它。\n\n#Y 凝聚力达到 75 时 #!\n#P +5% 资质，+3 合法性 #!\n\n#Y 文化工程 #!\n平等公民倡议"
 ve_composite_identity_desc:0 "#header 复合国家#!\n通过谈判达成的机构来统治数个族群。\n\n#Y 激活时 #!\n#P 文化泯灭与次等公民产生的激进派 -10%，+5% 影响力 #!\n#N -15% 同化，-5% 权威力，-75 行政力 #!\n\n#Y 凝聚力 #!\n真正多元的人口结构会提升它；人口中主流文化超过 90% 会削弱这一体制。\n\n#Y 凝聚力达到 75 时 #!\n#P +5% 影响力，+3 合法性 #!\n\n#Y 文化工程 #!\n立宪协定"
 ve_identity_change_cost_tt:0 "改变认同体制需要 #Y 200 文化赋权#!且不存在活跃的认同转变强烈反弹。该改变会将凝聚力重置为 #Y 35#!，引发 #Y 5 年的转变强烈反弹#!，并取消所有活跃的文化工程且不产生额外的取消惩罚。"
 ve_cultural_mandate:0 "文化赋权"
 ve_culture_reform_point:0 "文化赋权"
 ve_cultural_mandate_hint:0 "用于文化工程。保留它是安全的，但产出在达到 400 时减半，并在达到 500 时停止。"
 ve_culture_reform_point_tt:0 "#header 文化赋权#!\nCurrent: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nMonthly change: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y What it is spent on#!\n文化工程（75–150）与认同体制变更（200）。两者皆非强制：保留赋权是安全的，产出仅在 400 时减半并在 500 时停止。\n\n#Y Monthly breakdown#!\n基础：[GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\n合法性：[GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\n行政：[GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\n体制社会：[GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\n稳定度与文化运动：[GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\n法律契合度：[GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\n理念学说：[GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\n上限乘数：#Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Idea doctrine — only your current Identity Model counts#!\n#P 族群国家#!：民族主义 V #P +1#!\n#P 公民国家#!：改良主义 V #P +1#!；学术 V #P +1#!\n#P 复合国家#!：改良主义 V #P +1#!\n上方激活的总计上限为 #Y +2#!。\n\n公民国家的体制社会分项来源于识字率，复合国家来源于多元社会中的识字率，族群国家来源于主流文化的人口实力。\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "民族凝聚力"
 ve_national_cohesion_hint:0 "向你的认同体制所产生的平衡点漂移。在 75 及以上时你将获得加成，在 25 或以下时则会产生不稳定。"
 ve_national_cohesion_tt:0 "#header 民族凝聚力#!\n当前: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n平衡点: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n每月变动: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n常见条件: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\n认同体制条件: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\n凝聚力每月朝平衡点移动剩余距离的 20%，最高 5 点。激进的文化运动会使平衡点降低 10。在 75 或更高时，当前的体制会提供额外增益；在 25 或更低时，将施加国家动荡。\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "无效果"
 ve_cultural_projects:0 "文化工程"
 ve_cultural_projects_intro:0 "文化工程是 #Y 可选的#!。同时只能进行一项：其授权费用将立即支付，并且只要其在进行中，就会施加 #N -75 行政力与 -25 权威力#!。完成工程会返还部分授权并提高凝聚力。全国性工程只有在其完成增益到期后才能重复进行；而已完成的地区/文化目标无法再次选择。\n#Y 悬停在任意卡片或进度条上以查看其完整效果。#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "进行中的工程"
 ve_cultural_project_progress:0 "工程进度"
 ve_cultural_project_progress_tt:0 "#header 每月工程进度#!\n当前: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n剩余: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\n每月总计: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (最低 1，最高 7)\n\n#Y 每月明细#!\n基础: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\n行政: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\n合法性: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\n体制社会: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\n凝聚力: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\n文化运动: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\n目标地区动乱: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\n理念群: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y 理念群 — 只有与你当前的认同体制相匹配的加成才有效#!\n#P 族群国家#!: 民族主义 VII #P +1#!\n#P 公民国家#!: 改良主义 VII、学术 VII 或福利 VI — #P +1#! 各项\n#P 复合国家#!: 改良主义 VII 或外交 VI — #P +1#! 各项\n上方生效的理念群总计上限为 #Y +2#!；任何进一步的匹配加成都不会增加进度。\n\n体制社会根据生效的认同体制奖励公民识字率、族群人口集中度或复合多样性。工程在进度达到 #Y 100#! 后的下一次月度更新时结算。"
 ve_cancel_cultural_project_button:0 "取消工程"
 ve_cancel_cultural_project_tt:0 "#header 取消文化工程#!\n投入的文化赋权 #N 不予退还#!。民族凝聚力下降 #N 5#!，并且 #N 2 年的强烈反弹#!将阻止另一项工程。"
 ve_start_cultural_project_button:0 "开始工程"
 ve_national_curriculum_name:0 "国民教育大纲"
 ve_national_curriculum_cost:0 "花费：#Y 100 文化赋权#!"
 ve_national_curriculum_short:0 "一场全国范围内的学校教育改革。\n#P +20 文化赋权，+5 凝聚力#!，随后获得更好的教育。"
 ve_national_curriculum_desc:0 "#header 国民教育大纲#!\n在全国范围内推行的学校教育改革。\n\n#Y 花费#!\n#Y 100 文化赋权#!，立即支付\n\n#Y 完成时#!\n#P +20 文化赋权，+5 民族凝聚力#!\n\n#Y 随后持续 10 年#!\n#P +2% 受教育机会，+5% 资质#!\n#N -25 行政力#!"
 ve_national_curriculum_requirements_tt:0 "需要 #Y 100 文化赋权#!、没有进行中的文化工程且没有工程强烈反弹。在先前的 #Y 国民教育大纲#! 增益生效期间也无法开始。"
 ve_shared_symbols_name:0 "共同象征"
 ve_shared_symbols_cost:0 "花费：#Y 75 文化赋权#!"
 ve_shared_symbols_short:0 "国旗、国歌与公共庆典。\n#P +20 文化赋权，+7 凝聚力#!，随后获得效忠派与权威力。"
 ve_shared_symbols_desc:0 "#header 共同象征#!\n在全国范围内推广的国旗、国歌与公共庆典。\n\n#Y 花费#!\n#Y 75 文化赋权#!，立即支付\n\n#Y 完成时#!\n#P +20 文化赋权，+7 民族凝聚力#!\n\n#Y 随后持续 8 年#!\n#P +10% 完全接纳人群产生的效忠派，+25 权威力#!"
 ve_shared_symbols_requirements_tt:0 "需要 #Y 75 文化赋权#!、没有进行中的文化工程且没有工程强烈反弹。在先前的 #Y 共同象征#! 增益生效期间也无法开始。"
 ve_ethnic_campaign_name:0 "族群一体化运动"
 ve_ethnic_campaign_cost:0 "花费：#Y 125 文化赋权#!"
 ve_ethnic_campaign_short:0 "同化某地区内的大型少数群体。\n#P +25 文化赋权，+8 凝聚力#!，但会产生激进派。"
 ve_ethnic_campaign_desc:0 "#header 族群一体化运动#!\n在单个地区内对占该地区人口至少 #Y 5%#! 的最大非主流文化实施。\n\n#Y 费用#!\n#Y 125 文化赋权#!，立即支付\n\n#Y 完成时#!\n将目标文化的 #Y 5%#! 同化为主流文化，若拥有民族主义 VII 则为 #Y 7%#!\n#P +25 文化赋权，+8 民族凝聚力#!\n在该地区留下持续 #Y 10年#! 的同化计划\n\n#Y 警告#!\n#N 启动和结束该项目都会在目标文化中产生激进派。#!"
 ve_civic_initiative_name:0 "平等公民倡议"
 ve_civic_initiative_cost:0 "费用：#Y 100 文化赋权#!"
 ve_civic_initiative_short:0 "提升一个地区内某个少数群体的接纳度。\n#P +25 授权，+10 凝聚力#!，以及效忠派。"
 ve_civic_initiative_desc:0 "#header 平等公民倡议#!\n在单个地区内对占该地区人口至少 #Y 5%#! 的最大非主流文化实施。\n\n#Y 费用#!\n#Y 100 文化赋权#!，立即支付\n\n#Y 完成时#!\n#P 该文化的接纳度 +15，持续 10 年#!\n目标地区内产生效忠派\n#P +25 文化赋权，+10 民族凝聚力#!\n十年内改善资质与移民吸引力"
 ve_composite_compact_name:0 "立宪协定"
 ve_composite_compact_cost:0 "费用：#Y 150 文化赋权#!以及 #Y 40 凝聚力#!"
 ve_composite_compact_short:0 "承认某个少数群体为立宪文化。\n#P +30 授权，+12 凝聚力#!，永久生效。"
 ve_composite_compact_desc:0 "#header 立宪协定#!\n在单个地区内对占该地区人口至少 #Y 5%#! 的未承认非主流文化实施。\n\n#Y 费用#!\n#Y 150 文化赋权#!，立即支付，且至少需要 #Y 40 民族凝聚力#!\n\n#Y 完成时#!\n#P 该文化的接纳度 +15，永久生效#!\n将其识别为立宪文化\n目标地区内产生效忠派\n#P +30 文化赋权，+12 民族凝聚力#!"
 ve_targeted_project_start_instruction:0 "#Y 如何启动#!\n1. 打开你自己的一个地区。\n2. 在该地区的面板中点击 #Y 启动项目#!。\n目标文化及任何尚缺的条件都会列在该按钮的工具提示中。"
 ve_targeted_project_state_requirements_tt:0 "该地区必须由我方所有，且包含一个符合条件的非主流文化，该文化需占其人口的至少 #Y 5%#!。其中符合条件的最大文化将成为目标。本地区已完成的文化无法再次被设为目标，但在其他地区可以。同时必须满足当前认同体制的费用与需求。"
 ve_targeted_cultural_project_target:0 "目标：在 #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#! 的 #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#!"
 ve_countrywide_cultural_project_target:0 "范围：#Y 整个国家#!"
 ve_no_cultural_project_target:0 "无项目目标"
 ve_no_active_cultural_project:0 "无进行中的文化工程"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "凝聚紧密 - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "四分五裂 - #N 产生国家不稳定度#!。"
 ve_ethnic_high_cohesion_effect:0 "#P 征兵率 +5%，合法性 +3#!。"
 ve_civic_high_cohesion_effect:0 "#P 资质 +5%，合法性 +3#!。"
 ve_composite_high_cohesion_effect:0 "#P 影响力 +5%，合法性 +3#!。"
 ve_identity_transition_backlash_notice:0 "认同体制转变的强烈反弹仍在持续 - 在其过期之前无法再次切换体制。"
 ve_cultural_project_backlash_notice:0 "已取消的项目仍在阻止新项目 - 为期 2 年的强烈反弹必须先期满。"

