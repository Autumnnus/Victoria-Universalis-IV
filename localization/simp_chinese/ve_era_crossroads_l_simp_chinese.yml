 ve_era_crossroads.31.t:0 "永久紧急状态"
 ve_era_crossroads.31.d:0 "为大众参与、战略就绪性或工业动员而建立的机器正在变得永久化。国家必须决定如何在不让紧急状态下的纪律吞噬日常民族生活的前提下保持能力。"
 ve_era_crossroads.31.a:0 "通过国家审查界定永久的界限。"
 ve_era_crossroads.31.b:0 "刻意保持该契约的灵活性。"
 ve_era_crossroads.31.c:0 "依靠教义机构来遏制这台机器。"
 ve_era_crossroads.31.a.tt:0 "花费 #N 10 国策力#! 以获得 #P +3 十字路口进度#!。"
 ve_era_crossroads.31.b.tt:0 "不消耗资源，且不对十字路口进度产生即时改变。"
