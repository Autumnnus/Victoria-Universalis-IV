 ve_je_era_crossroads_age_3_reason:0 "大众政治与总体战使公民权、产业与战略就绪性成为了同一项国家契约的组成部分。"
 ve_je_era_crossroads_age_3_status:0 "进度：#Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间：#Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]个月#!\n每月进度：#P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n目标：达到60进度以获得#P +50时代势头#!。进度达20和40时可提供由国策力资助的提升。"
 ve_je_era_crossroads_age_3_route_1_status:0 "#Y 社会共和国#!\n进度：#Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间：#Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 个月#!\n每月进度：#P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：在此时代期间达成的大众政治目标与成熟社会机构目标。\n\n目标：进度达到 60 以获得 #P +50 时代势头#!。进度达 20 和 40 时的里程碑可提供消耗国策力的增益。"
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y 战略指挥#!\n进度：#Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间：#Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 个月#!\n每月进度：#P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：在此时代期间达成的现代部队构成目标与大国触及范围目标。\n\n目标：进度达到 60 以获得 #P +50 时代势头#!。进度达 20 和 40 时的里程碑可提供消耗国策力的增益。"
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y 兵工厂社会#!\n进度：#Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间：#Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 个月#!\n每月进度：#P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：在此时代期间达成的电气产业目标与大规模军备目标。\n\n目标：进度达到 60 以获得 #P +50 时代势头#!。进度达 20 和 40 时的里程碑可提供消耗国策力的增益。"

 ve_era_crossroads.1.t:0 "蒸汽与国家"
 ve_era_crossroads.1.d:0 "铁路、学校、改革者与行政官对现代民族有着截然不同的解释。政府必须决定社会与国家之间的何种关系将奠定第一时代的基础。"
 ve_era_crossroads.1.a:0 "通过蒸汽网络将国家紧密相连。"
 ve_era_crossroads.1.b:0 "构建受过教育的公民群体。"
 ve_era_crossroads.1.c:0 "巩固行政国家。"
 ve_era_crossroads.1.d.option:0 "此时代无需国家十字路口。"
 ve_era_crossroads.1.a.tt:0 "开启 #Y 蒸汽网络#! 路线（聚焦：工业化、农民移民与铁路）。\n• 目标：进度达到 60 以获得 #P +50 时代势头#!。\n• 进度速度：获得 +1 基础每月进度，每个已完成的时代 1 锚点（农民比重与铁路目标）额外提供 +1。\n• 学说协同：拥有 #Y 实业派 IV#! 或 #Y 基础设施 IV#! 可解锁更廉价的里程碑决议（消耗 5 点国策力而非 10 点）。"
 ve_era_crossroads.1.b.tt:0 "开启 #Y 受过教育的公民#! 路线（聚焦：教育、识字率与自由劳工）。\n• 目标：进度达到 60 以获得 #P +50 时代势头#!。\n• 进度速度：获得 +1 基础每月进度，每个已完成的时代 1 锚点（自由劳工与识字率/学校目标）额外提供 +1。\n• 学说协同：拥有 #Y 学术 IV#! 或 #Y 改良主义 IV#! 可解锁更廉价的里程碑决议（消耗 5 点国策力而非 10 点）。"
 ve_era_crossroads.1.c.tt:0 "开启 #Y 行政国家#! 路线（聚焦：政府合法性、行政力与稳定性）。\n• 目标：进度达到 60 以获得 #P +50 时代势头#!。\n• 进度速度：获得 +1 基础每月进度，每个已完成的时代 1 锚点（合法性/行政力与独立稳定目标）额外提供 +1。\n• 学说协同：拥有 #Y 官僚 IV#! 或 #Y 议会 IV#! 可解锁更廉价的里程碑决议（消耗 5 点国策力而非 10 点）。"
 ve_era_crossroads.2.t:0 "帝国还是大众社会？"
 ve_era_crossroads.2.d:0 "国家已不能再将海外扩张、大众福利与民族整合视为互不相干的问题。其中之一将决定其余问题的追求方式。"
 ve_era_crossroads.2.a:0 "放眼帝国地平线。"
 ve_era_crossroads.2.b:0 "建立大众福利体系。"
 ve_era_crossroads.2.c:0 "锻造整合的民族。"
 ve_era_crossroads.2.d.option:0 "让时代寻找自己的方向。"
 ve_era_crossroads.2.a.tt:0 "开启 #Y 帝国地平线#! 路线（聚焦：外交力量与海外触及范围）。\n• 目标：进度达到 60 以获得 #P +50 时代势头#!。\n• 进度速度：获得 +1 基础每月进度，每个已完成的时代 2 锚点（获承认的国家能力与港口/利益目标）额外提供 +1。\n• 学说协同：拥有 #Y 外交 IV#! 或 #Y 殖民 IV#! 可解锁更廉价的里程碑决议（消耗 5 点国策力而非 10 点）。"
 ve_era_crossroads.2.b.tt:0 "开启 #Y 大众福利#! 路线（聚焦：社会机构、医疗保健与教育）。\n• 目标：进度达到 60 以获得 #P +50 时代势头#!。\n• 进度速度：获得 +1 基础每月进度，每个已完成的时代 2 锚点（识字率/学校与社会机构目标）额外提供 +1。\n• 学说协同：拥有 #Y 福利 IV#! 或 #Y 改良主义 IV#! 可解锁更廉价的里程碑决议（消耗 5 点国策力而非 10 点）。"
 ve_era_crossroads.2.c.tt:0 "开启 #Y 整合的民族#! 路线（聚焦：经济转型与内部稳定）。\n• 目标：进度达到 60 以获得 #P +50 时代势头#!。\n• 进度速度：获得 +1 基础每月进度，每个已完成的时代 2 锚点（经济转型与低动乱合法性目标）额外提供 +1。\n• 学说协同：拥有 #Y 民族主义 IV#! 或 #Y 劳工 IV#! 可解锁更廉价的里程碑决议（消耗 5 点国策力而非 10 点）。"
 ve_era_crossroads.3.t:0 "动员社会"
 ve_era_crossroads.3.d:0 "大众政治、战略指挥与工业动员现已渗透至各个机构。最后一个时代要求抉择何种动员形式将定义这个民族。"
 ve_era_crossroads.3.a:0 "致力于社会共和国。"
 ve_era_crossroads.3.b:0 "将民族置于战略指挥之下。"
 ve_era_crossroads.3.c:0 "建立军械库社会。"
 ve_era_crossroads.3.d.option:0 "拒绝长期的动员计划。"
 ve_era_crossroads.3.a.tt:0 "开启 #Y 社会共和国#! 路线（焦点：大众政治与社会机构）。\n• 目标：达成 60 进度以获得 #P +50 时代势头#!。\n• 进度速度：获得 +1 基础月度进度，每完成一个时代 3 锚点（大众政治与成熟社会机构目标）额外获得 +1。\n• 学说协同：拥有 #Y 议会 IV#! 或 #Y 福利 IV#! 可解锁更便宜的里程碑决议（花费 5 国策力，而非 10）。"
 ve_era_crossroads.3.b.tt:0 "开启 #Y 战略指挥#! 路线（焦点：军事现代化与全球力量触及）。\n• 目标：达成 60 进度以获得 #P +50 时代势头#!。\n• 进度速度：获得 +1 基础月度进度，每完成一个时代 3 锚点（现代军队构成与列强触及目标）额外获得 +1。\n• 学说协同：拥有 #Y 职业军队 IV#! 或 #Y 防御 IV#! 可解锁更便宜的里程碑决议（花费 5 国策力，而非 10）。"
 ve_era_crossroads.3.c.tt:0 "开启 #Y 军械库社会#! 路线（焦点：工业战时经济与大规模军备）。\n• 目标：达成 60 进度以获得 #P +50 时代势头#!。\n• 进度速度：获得 +1 基础月度进度，每完成一个时代 3 锚点（电气产业与大规模军备目标）额外获得 +1。\n• 学说协同：拥有 #Y 战时经济 IV#! 或 #Y 普遍征兵 IV#! 可解锁更便宜的里程碑决议（花费 5 国策力，而非 10）。"

 ve_era_crossroads_decline_tt:0 "永久放弃当前时代的时代十字路口。后续时代仍符合条件。"

 ve_era_crossroads.10.t:0 "国家日历"
 ve_era_crossroads.10.d:0 "省级办事处、私人协会和各部委正以不同的速度推进选定的变革。共同的日历可以将零散的成就转化为国家规划，但协调本身需要消耗稀缺的行政注意力。"
 ve_era_crossroads.10.a:0 "资助中央协调委员会。"
 ve_era_crossroads.10.b:0 "任由各机构通过谈判决定自己的时间表。"
 ve_era_crossroads.10.c:0 "利用我们既定学说建立的网络。"
 ve_era_crossroads.10.a.tt:0 "花费 #N 10 国策力#! 以获得 #P +3 十字路口进度#!。"
 ve_era_crossroads.10.b.tt:0 "不消耗资源，也不对十字路口进度产生直接改变。"
 ve_era_crossroads.10.c.tt:0 "需要一条符合路线的 IV 级理念群。花费 #N 5 国策力#! 以获得 #P +3 十字路口进度#!。"

 ve_era_crossroads.11.t:0 "谁来指导进度？"
 ve_era_crossroads.11.d:0 "该计划的意义已过于重大，不能再维持松散的协议。大臣们要求国家授权，专家们要求脱离政治影响，而地方行动者则警告称，僵硬的指挥将摧毁使进度成为可能的机构。"
 ve_era_crossroads.11.a:0 "赋予中央明确的协调授权。"
 ve_era_crossroads.11.b:0 "维护经过谈判达成的权威力平衡。"
 ve_era_crossroads.11.c:0 "将协调工作委托给我们的学说机构。"
 ve_era_crossroads.11.a.tt:0 "花费 #N 10 国策力#! 以获得 #P +3 十字路口进度#!。"
 ve_era_crossroads.11.b.tt:0 "不消耗资源，也不对十字路口进度产生直接改变。"
 ve_era_crossroads.11.c.tt:0 "需要一条符合路线的 IV 级理念群。花费 #N 5 国策力#! 以获得 #P +3 十字路口进度#!。"

 ve_era_crossroads.40.t:0 "蒸汽与国家"
 ve_era_crossroads.40.d:0 "所选的道路不再是一系列孤立的成就。基础设施、公民权或行政机构现在形成了一项持久的国家规划，国家可以通过它理解并指导这个时代的变革。"
 ve_era_crossroads.40.a:0 "第一个时代已找到了它的体制形式。"
 ve_era_crossroads.40.a.tt:0 "已完成的时代十字路口赋予了 #P +50 时代势头#!。它并未完成目标或改变黄金时代符合条件状态。"

 ve_era_crossroads.20.t:0 "国家的触及范围"
 ve_era_crossroads.20.d:0 "所选的规划现已延伸至最初资助它的机构之外。港口、学校、办公室和地方当局对于国家协调应在哪里结束、地方自主权应在哪里开始产生了分歧。"
 ve_era_crossroads.20.a:0 "通过中央委员会规划国家的义务。"
 ve_era_crossroads.20.b:0 "允许通过谈判来确立机构边界。"
 ve_era_crossroads.20.c:0 "通过我们既定的学说网络进行协调。"
 ve_era_crossroads.20.a.tt:0 "花费 #N 10 国策力#! 以获得 #P +3 十字路口进度#!。"
 ve_era_crossroads.20.b.tt:0 "不消耗资源，也不对十字路口进度产生直接改变。"
 ve_era_crossroads.20.c.tt:0 "需要一条符合路线的 IV 级理念群。花费 #N 5 国策力#! 以获得 #P +3 十字路口进度#!。"

 ve_era_crossroads.21.t:0 "整合的代价"
 ve_era_crossroads.21.d:0 "外部扩张、社会供给与国家纪律，各自创造了受益者、成本与新的期望。唯有当国家决定如何分配这些负担时，纲领方能存续。"
 ve_era_crossroads.21.a:0 "成立国家委员会以管理调整。"
 ve_era_crossroads.21.b:0 "通过谈判妥协来分摊负担。"
 ve_era_crossroads.21.c:0 "让我们的教义机构承接阵痛。"
 ve_era_crossroads.21.a.tt:0 "花费 #N 10 国策力#! 以获得 #P +3 十字路口进度#!。"
 ve_era_crossroads.21.b.tt:0 "不消耗资源，且不对十字路口进度产生即时改变。"
 ve_era_crossroads.21.c.tt:0 "需要一个契合路线的 IV 级理念群。花费 #N 5 国策力#! 以获得 #P +3 十字路口进度#!。"

 ve_era_crossroads.41.t:0 "帝国与大众社会"
 ve_era_crossroads.41.d:0 "所选定的社会契约现已将国家的外部扩张、社会义务与国家机构紧密相连。曾经的战略方向，已转化为治理大众社会的持久框架。"
 ve_era_crossroads.41.a:0 "第二个时代已找到了它的社会契约。"
 ve_era_crossroads.41.a.tt:0 "已完成的时代十字路口提供了 #P +50 时代势头#!。它并未完成一项目标，亦未改变黄金时代资格。"

 ve_era_crossroads.30.t:0 "民族听从召唤"
 ve_era_crossroads.30.d:0 "公民、指挥官、工人和行政人员皆被所选定的纲领赋予了新的义务。除非这些职责能彼此明晰，否则动员将只是一盘散沙般相互冲突的诉求。"
 ve_era_crossroads.30.a:0 "通过中央委员会将民族义务法典化。"
 ve_era_crossroads.30.b:0 "让机构通过谈判明确各自的责任。"
 ve_era_crossroads.30.c:0 "利用我们的教义组织来协调职责。"
