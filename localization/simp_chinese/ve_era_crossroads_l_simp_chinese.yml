 ve_je_era_crossroads_age_2_route_1_status:0 "#Y 帝国视野#!\n进度：#Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间：#Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]个月#!\n每月进度：#P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：在此时代内确保的列强国家能力目标以及港口或利益目标。\n\n目标：达到60进度以获得#P +50时代势头#!。进度达20和40时可提供由国策力资助的提升。"
 ve_je_era_crossroads_age_2_route_2_status:0 "#Y 大众福利#!\n进度：#Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间：#Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]个月#!\n每月进度：#P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：在此时代内确保的识字率或学校目标以及社会机构目标。\n\n目标：达到60进度以获得#P +50时代势头#!。进度达20和40时可提供由国策力资助的提升。"
 ve_je_era_crossroads_age_2_route_3_status:0 "#Y 整合民族#!\n进度：#Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间：#Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]个月#!\n每月进度：#P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：在此时代内确保的经济转型目标以及低动乱合法性目标。\n\n目标：达到60进度以获得#P +50时代势头#!。进度达20和40时可提供由国策力资助的提升。"
