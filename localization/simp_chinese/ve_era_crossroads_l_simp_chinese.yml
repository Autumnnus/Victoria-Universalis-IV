 ve_je_era_crossroads_age_3_reason:0 "大众政治和全面战争使公民、工业和战略战备成为同一个国家解决方案的一部分。"
 ve_je_era_crossroads_age_3_status:0 "进度： #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间： #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 月#!\n每月进度： #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n目标：达到 60 进度，并达到 #P +50时代动力#!。 20 岁和 40 岁的里程碑进度提供了国家洞察力资助的推动力。"
 ve_je_era_crossroads_age_3_route_1_status:0 "#Y 社会共和国#!\n进度： #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间： #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 月#!\n每月进度： #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：这个时代确保的大众政治目标和成熟的社会制度目标。\n\n目标：达到 60 进度 #P +50 时代势头#!。 20 岁和 40 岁的里程碑进展提供了国家洞察力资助的推动力。"
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y 战略指挥#!\n进展： #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间： #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 月#!\n每月进度： #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：本时代确保的现代兵力构成目标和大国达成目标。\n\n目标：达到60进度，实现 #P +50时代动力#!。 20 和 40 的里程碑进度提供国家洞察力资助的推动。"
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y 阿森纳协会#!\n进度： #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间： #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 月#!\n每月进度： #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：在这个时代实现的电气工业目标和大规模军备目标。\n\n目标：达到 60 进度，实现 #P +50 时代动力#!。 20 岁和 40 岁进步的里程碑提供了国家洞察力资助的推动力。"

 ve_era_crossroads.1.t:0 "Steam 和国家"
 ve_era_crossroads.1.d:0 "铁路、学校、改革者和管理者对现代国家提供了相互竞争的描述。政府必须决定第一个时代将组织社会与国家之间的哪种关系。"
 ve_era_crossroads.1.a:0 "通过 Steam 网络将国家联系在一起。"
 ve_era_crossroads.1.b:0 "建立受过教育的公民。"
 ve_era_crossroads.1.c:0 "巩固行政国家。"
 ve_era_crossroads.1.d.option:0 "这个时代不需要国家十字路口。"
 ve_era_crossroads.1.a.tt:0 "开始 #Y 蒸汽网络#! 路线（重点：工业化、农民移民和铁路）。\n• 目标：达到 60 进度，获得  #P +50 时代动力#!.\n• 进度速度：每月获得 +1 基础进度，每个完成的第 1 代锚点再加上 +1 额外进度（农民份额和铁路目标）。\n• 学说协同作用：具有 #Y 实业家四世#! 或者 #Y 基础设施四#! 解锁更便宜的里程碑决策（5 个洞察力而不是 10 个）。"
 ve_era_crossroads.1.b.tt:0 "开始 #Y 受过教育的公民#! 路线（重点：教育、扫盲和免费劳动力）。\n• 目标：达到 60 进度即可获得 #P +50 时代势头#!.\n• 进步速度：每月获得 +1 基础进步，每个完成的 1 岁锚点再加上 +1 额外进步（自由劳动力和扫盲/学校目标）。\n• 教义协同作用：具有 #Y 学术四#! 或者 #Y 改革派四世#! 解锁更便宜的里程碑决策（5 个洞察力而不是 10 个）。"
 ve_era_crossroads.1.c.tt:0 "开始 #Y 行政国家#! 路线（重点：政府合法性、官僚主义和稳定性）。\n• 目标：达到 60 进度，获得  #P +50 时代动力#!.\n• 进展速度：每月获得 +1 基础进度，每个完成的第 1 代锚点再加上 +1 额外进度（合法性/官僚主义和独立稳定目标）。\n• 学说协同作用：具有 #Y 官僚主义四#! 或者 #Y 第四届议会#! 解锁更便宜的里程碑决策（5 个洞察力而不是 10 个）。"
 ve_era_crossroads.2.t:0 "帝国还是大众社会？"
 ve_era_crossroads.2.d:0 "国家不能再将海外影响力、民众福利和民族融合视为单独的问题。其中之一将定义如何追求其他目标。"
 ve_era_crossroads.2.a:0 "望向帝国地平线。"
 ve_era_crossroads.2.b:0 "构建群众福利体系。"
 ve_era_crossroads.2.c:0 "打造一体化国家。"
 ve_era_crossroads.2.d.option:0 "让时代找到自己的方向。"
 ve_era_crossroads.2.a.tt:0 "启动 #Y 帝国地平线#! 路线（重点：外交力量和海外影响力）。\n• 目标：达到 60 进度以获得 #P +50 时代动量#!。\n• 进度速度：每月获得 +1 基础进度，每个完成的第 2 代锚点额外增加 +1（公认的国家能力和港口/利益目标）。\n• 学说协同作用：具有 #Y 外交四#! 或者 #Y Colonial IV#! 解锁更便宜的里程碑决策（5个洞察力而不是10个）。"
 ve_era_crossroads.2.b.tt:0 "开始 #Y 群众福利#! 路线（重点：社会机构、医疗保健和教育）。\n• 目标：达到 60 进度以获得 #P +50 时代动量#!。\n• 进步速度：每月获得 +1 基础进步，每个完成的 2 岁锚点额外获得 +1 进步（扫盲/学校和社会机构目标）。\n• 教义协同作用：拥有 #Y 福利 IV#! 或者 #Y 改革派四世#! 解锁更便宜的里程碑决策（5 个洞察力而不是 10 个）。"
 ve_era_crossroads.2.c.tt:0 "启动 #Y 一体化国家#! 路线（重点：经济转型和内部稳定）。\n• 目标：达到 60 进度，获得 #P +50 时代动力#!。\n• 进度速度：每月获得 +1 基础进度，每个完成的第 2 阶段锚点再加上 +1 额外进度（经济转型和低动荡合法性目标）。\n• 学说协同作用：拥有 #Y 民族主义 IV#! 或者 #Y 劳工四#! 解锁更便宜的里程碑决策（5 个洞察力而不是 10 个）。"
 ve_era_crossroads.3.t:0 "动员的社会"
 ve_era_crossroads.3.d:0 "群众政治、战略指挥和工业动员现在已深入到每个机构。最后的时代需要选择哪种动员形式将定义国家。"
 ve_era_crossroads.3.a:0 "致力于建立一个社会共和国。"
 ve_era_crossroads.3.b:0 "将国家置于战略指挥之下。"
 ve_era_crossroads.3.c:0 "建立一个兵工厂社会。"
 ve_era_crossroads.3.d.option:0 "拒绝永久动员计划。"
 ve_era_crossroads.3.a.tt:0 "开始 #Y 社会共和国#! 路线（重点：大众政治和社会机构）。\n• 目标：达到 60 进度，获得 #P +50 时代动量#!。\n• 进度速度：每月获得 +1 基础进度，每个完成的 3 岁锚点再加上 +1 额外进度（大众政治和成熟社会机构目标）。\n• 教义协同作用：拥有 #Y 第四届议会#! 或者 #Y 福利四#! 解锁更便宜的里程碑决策（5 个洞察力而不是 10 个）。"
 ve_era_crossroads.3.b.tt:0 "开始 #Y 战略指挥#! 路线（重点：军事现代化和全球实力影响力）。\n• 目标：达到 60 进度，获得 #P +50 时代动力#!。\n• 进度速度：每月获得 +1 基础进度，每个完成的第 3 阶段锚点再加上 +1 额外进度（现代部队构成和大国影响力目标）。\n• 条令协同：拥有 #Y 职业陆军IV#! 或者 #Y 防御四#! 解锁更便宜的里程碑决策（5 个洞察力而不是 10 个）。"
 ve_era_crossroads.3.c.tt:0 "开始 #Y 阿森纳协会#! 路线（重点：工业战争经济和大规模军备）。\n• 目标：达到 60 进度，获得  #P +50 纪元动量#!。\n• 进度速度：每月获得 +1 基础进度，每个完成的第 3 时代锚点再加上 +1 额外进度（电气工业和大规模军备目标）。\n• 学说协同作用：拥有 #Y 战争经济IV#! 或者 #Y 大规模征兵 IV#! 解锁更便宜的里程碑决策（5 个洞察力而不是 10 个）。"

 ve_era_crossroads_decline_tt:0 "永久衰落当前时代的时代十字路口。较晚的年龄仍然符合资格。"

 ve_era_crossroads.10.t:0 "国家日历"
 ve_era_crossroads.10.d:0 "省级办公室、私人协会和部委正在以不同的速度推进所选择的转型。共同的日历可以将分散的成就转化为国家计划，但协调本身需要很少的行政关注。"
 ve_era_crossroads.10.a:0 "为中央协调委员会提供资金。"
 ve_era_crossroads.10.b:0 "让各机构协商自己的时间表。"
 ve_era_crossroads.10.c:0 "利用我们既定原则建立的网络。"
 ve_era_crossroads.10.a.tt:0 "花费 #N 10国家洞察力#! 获得 #P +3十字路口进度#!。"
 ve_era_crossroads.10.b.tt:0 "不花费任何资源，也不立即改变十字路口进度。"
 ve_era_crossroads.10.c.tt:0 "需要一个适合路线的IV级理念组。花费 #N 5 国家洞察力#! 获得 #P +3十字路口进度#!。"

 ve_era_crossroads.11.t:0 "谁将指导进度？"
 ve_era_crossroads.11.d:0 "该计划已经变得过于重要，无法保持松散的协议。部长们声称国家权威，专家要求与政治隔离，地方行为者警告说，严格的指挥将破坏使进步成为可能的机构。"
 ve_era_crossroads.11.a:0 "赋予中心明确的协调授权。"
 ve_era_crossroads.11.b:0 "维护谈判达成的权力平衡。"
 ve_era_crossroads.11.c:0 "将协调委托给我们的理论机构。"
 ve_era_crossroads.11.a.tt:0 "花费 #N 10 国家洞察力#! 获得 #P +3 十字路口进度#!。"
 ve_era_crossroads.11.b.tt:0 "不花费任何资源，也不立即改变十字路口进度。"
 ve_era_crossroads.11.c.tt:0 "需要路线适合 IV 级理念组。花费 #N 5国家洞察力#! 获得 #P +3十字路口进度#!。"

 ve_era_crossroads.40.t:0 "蒸汽与国家"
 ve_era_crossroads.40.d:0 "所选择的课程不再是一系列孤立的成就。基础设施、公民身份或行政管理现在形成了一项持久的国家计划，国家可以通过它来理解和指导时代的变革。"
 ve_era_crossroads.40.a:0 "第一个时代已经找到了它的制度形式。"
 ve_era_crossroads.40.a.tt:0 "完成的时代十字路口已经授予 #P +50 时代动力#!。它尚未完成目标或改变黄金时代的资格。"

 ve_era_crossroads.20.t:0 "国家的影响力"
 ve_era_crossroads.20.d:0 "所选择的项目现在已经超出了最初赞助该项目的机构范围。港口、学校、办公室和地方当局对于国家协调应在何处结束、地方自行决定应从何处开始存在分歧。"
 ve_era_crossroads.20.a:0 "通过中央委员会制定国家义务。"
 ve_era_crossroads.20.b:0 "通过谈判允许机构边界出现。"
 ve_era_crossroads.20.c:0 "通过我们已建立的理论网络进行协调。"
 ve_era_crossroads.20.a.tt:0 "花费 #N 10国家洞察力#! 获得 #P +3十字路口进展#!。"
 ve_era_crossroads.20.b.tt:0 "不花费任何资源，也不立即改变十字路口进展。"
 ve_era_crossroads.20.c.tt:0 "需要一个适合路线的IV级理念组。花费 #N 5 国家洞察力#! 获得 #P +3十字路口进度#!."

 ve_era_crossroads.21.t:0 "整合的代价"
 ve_era_crossroads.21.d:0 "外部影响力、社会供给和国家纪律都会创造赢家、成本和新的期望。只有国家决定如何分配这些负担，该计划才能持续下去。"
 ve_era_crossroads.21.a:0 "建立一个国家委员会来管理调整。"
 ve_era_crossroads.21.b:0 "通过谈判妥协来分配负担。"
 ve_era_crossroads.21.c:0 "让我们的教义机构吸收压力。"
 ve_era_crossroads.21.a.tt:0 "支出 #N 10 国家洞察力#! 获得 #P +3 十字路口进度#!。"
 ve_era_crossroads.21.b.tt:0 "不花费任何资源，也不立即改变十字路口进度。"
 ve_era_crossroads.21.c.tt:0 "需要路线适合 IV 级理念组。花费 #N 5国家洞察力#! 获得 #P +3十字路口进度#!。"

 ve_era_crossroads.41.t:0 "帝国与大众社会"
 ve_era_crossroads.41.d:0 "所选择的解决方案现在将国家的外部影响力、社会义务和国家机构联系起来。最初的战略方向已成为治理大众社会的持久框架。"
 ve_era_crossroads.41.a:0 "第二个时代已经找到了解决方案。"
 ve_era_crossroads.41.a.tt:0 "已完成的时代十字路口已授予 #P +50 时代动力#!。它尚未完成目标或改变黄金时代的资格。"

 ve_era_crossroads.30.t:0 "国家肩负使命"
 ve_era_crossroads.30.d:0 "公民、指挥官、工人和行政人员都被选定的计划赋予了新的义务。除非这些职责彼此明确，否则动员仍将是一系列相互竞争的要求。"
 ve_era_crossroads.30.a:0 "通过中央委员会将国家职责编纂成法。"
 ve_era_crossroads.30.b:0 "让机构协商其职责。"
 ve_era_crossroads.30.c:0 "利用我们的教义组织来协调职责。"
 ve_era_crossroads.30.a.tt:0 "花费 #N 10国家洞察力#! 获得 #P +3十字路口进度#!。"
 ve_era_crossroads.30.b.tt:0 "不花费任何资源，也不立即改变十字路口进度。"
 ve_era_crossroads.30.c.tt:0 "需要一个适合路线的IV级理念组。花费 #N 5 国家洞察力#! 获得 #P +3十字路口进度#!."

 ve_era_crossroads.31.t:0 "永久紧急状态"
 ve_era_crossroads.31.d:0 "为大众参与、战略准备或工业动员而建立的机制正在变得永久性。国家必须决定如何在不让紧急纪律消耗普通国民生活的情况下保持能力。"
 ve_era_crossroads.31.a:0 "通过国家审查确定永久限制。"
 ve_era_crossroads.31.b:0 "刻意保持解决方案的灵活性。"
 ve_era_crossroads.31.c:0 "依靠教义机构来遏制机器。"
 ve_era_crossroads.31.a.tt:0 "花费 #N 10 国家洞察力#! 获得 #P +3 十字路口进度#!。"
 ve_era_crossroads.31.b.tt:0 "不花费任何资源，也不立即改变十字路口进度。"
 ve_era_crossroads.31.c.tt:0 "需要路线适合 IV 级理念组。花费 #N 5国家洞察力#! 获得 #P +3十字路口进度#!。"

 ve_era_crossroads.42.t:0 "动员的社会"
 ve_era_crossroads.42.d:0 "公民权、指挥权和工业能力现在构成了持久的国家解决方案。动员机构已成为普通政府的一部分，而不是作为应对每一次新危机的临时解决方案。"
 ve_era_crossroads.42.a:0 "最后的时代已经找到了它的全国形式。"
 ve_era_crossroads.42.a.tt:0 "已完成的时代十字路口已授予 #P +50 时代动力#!。它尚未完成目标或改变黄金时代的资格。"
