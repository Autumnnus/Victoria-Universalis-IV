 ve_je_era_crossroads_age_2_route_2_status:0 "#Y 大众福利#!\n进展： #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间： #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 月#!\n每月进度： #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：本时代实现的识字或学校目标和社会机构目标。\n\n目标：达到 60 进度，实现 #P +50 时代动量#!。 20 岁和 40 岁的里程碑进展提供国家洞察力资助的推动。"
 ve_je_era_crossroads_age_2_route_3_status:0 "#Y 一体化国家#!\n进展： #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n剩余时间： #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 月#!\n每月进展： #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n锚点：这个时代确保的经济转型目标和低动荡合法性目标。\n\n目标：达到 60 进度 #P +50 时代势头#!。 20 岁和 40 岁进步的里程碑提供了国家洞察力资助的推动力。"
