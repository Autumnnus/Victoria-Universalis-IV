 ve_era_crossroads.42.t:0 "动员社会"
 ve_era_crossroads.42.d:0 "公民身份、指挥权与工业能力现已构成了持久的民族契约。动员机构已被纳入常规政府的一部分，而不再是应对每次新危机的权宜之计。"
 ve_era_crossroads.42.a:0 "最终的时代已找到了其民族形式。"
 ve_era_crossroads.42.a.tt:0 "已完成的时代十字路口提供了 #P +50 时代势头#!。它并未完成一项目标，亦未改变黄金时代资格。"
