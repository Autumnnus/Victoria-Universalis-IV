 ve_je_national_compact_transition: "National Compact Transition"
 ve_je_national_compact_transition_reason: "The state has adopted a new definition of national belonging. Administrators, elites, and communities must negotiate the compact while the transition backlash remains in force. The backlash modifier—not this Journal Entry's calendar—is authoritative."
 ve_je_national_compact_transition_complete_tt: "The National Compact transition backlash has ended."
 ve_je_national_compact_transition_status_ethnic: "Target identity: #Y Ethnic Identity#!\nNational Cohesion: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nApproximate time remaining: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] months#!\nMilestones completed: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nOutcome when the backlash ends: #Y 60+#! cohesion stabilizes early, #Y 26-59#! resolves neutrally, #Y 25 or below#! turns into a crisis. Each remaining milestone offers a choice affecting National Cohesion."
