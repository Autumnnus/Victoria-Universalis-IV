 ve_je_religious_settlement_transition: "Religious Settlement Transition"
 ve_je_religious_settlement_transition_reason: "The legal settlement of church and state has changed. Institutions, communities, and officials must adapt while the transition crisis remains in force. The crisis modifier—not this Journal Entry's calendar—is authoritative."
 ve_je_religious_settlement_transition_complete_tt: "The Religious Settlement transition crisis has ended."
 ve_je_religious_settlement_transition_status_confessional: "Target settlement: #Y Confessional State#!\nReligious Settlement: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nApproximate time remaining: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] months#!\nMilestones completed: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nOutcome when the crisis ends: #Y 60+#! settlement stabilizes early, #Y 26-59#! resolves neutrally, #Y 25 or below#! turns into a crisis. Each remaining milestone offers a choice affecting Religious Settlement."
