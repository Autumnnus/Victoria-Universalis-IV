 ve_je_transition_resolving_status: "The transition record is being reconciled with the current national settlement."

 ve_rel_transition_conciliatory_tt: "Spend #N 10#! Piety Reform and gain #P 3#! Religious Settlement."
 ve_rel_transition_central_tt: "Gain #P 5#! Piety Reform and lose #N 3#! Religious Settlement."
 ve_rel_transition_doctrine_tt: "Spend #N 5#! Piety Reform and gain #P 2#! Religious Settlement."

 ve_rel_evt.210.t: "The Bounds of Clerical Appointment"
 ve_rel_evt.210.d: "Religious authorities have submitted lists of candidates for public office, while senior administrators insist that state service must still reward competence. The first appointments under the new settlement will define where clerical counsel ends and civil authority begins."
 ve_rel_evt.210.a: "Convene a mixed appointments board."
 ve_rel_evt.210.b: "Accept the clerical lists."
 ve_rel_evt.210.c: "Pair standard examinations with religious counsel."

 ve_rel_evt.211.t: "Schools and Oaths of Loyalty"
 ve_rel_evt.211.d: "Parish schools seek a recognized place in the public system. Their patrons demand protection for religious instruction, while officials fear that competing curricula and oaths will divide the next generation."
 ve_rel_evt.211.a: "Guarantee a shared core curriculum."
 ve_rel_evt.211.b: "Impose one uniform oath of loyalty."
 ve_rel_evt.211.c: "Place the compromise under bureaucratic inspection."

 ve_rel_evt.220.t: "The Language of Minority Guarantees"
 ve_rel_evt.220.d: "Minority communities want their protections written explicitly into the new settlement. Government jurists instead favor a single general clause, warning that community-specific promises may harden old divisions."
 ve_rel_evt.220.a: "Write the guarantees plainly."
 ve_rel_evt.220.b: "Use one uniform citizenship clause."
 ve_rel_evt.220.c: "Let the reform coalition mediate the wording."

 ve_rel_evt.221.t: "Representation in Common Institutions"
 ve_rel_evt.221.d: "Schools, hospitals, and local boards must now serve citizens of several confessions on equal terms. The question is whether representation should follow local realities or a formula imposed from the center."
 ve_rel_evt.221.a: "Balance representation locally."
 ve_rel_evt.221.b: "Set a central quota."
 ve_rel_evt.221.c: "Negotiate a diplomatic representation formula."

 ve_rel_evt.230.t: "The Neutral Register"
 ve_rel_evt.230.d: "Births, marriages, and property claims are passing from religious custodians to civil registrars. Officials can preserve duplicate records during the transition, but reformers demand a clean and immediate break."
 ve_rel_evt.230.a: "Maintain dual records for a transition period."
 ve_rel_evt.230.b: "Close the religious registers at once."
 ve_rel_evt.230.c: "Deploy a trained civil-service network."

 ve_rel_evt.231.t: "School and Public Ceremony"
 ve_rel_evt.231.d: "The principle of state neutrality has reached school assemblies and public ceremonies. Local communities want room for inherited customs; central officials want one secular protocol that leaves no ambiguity."
 ve_rel_evt.231.a: "Leave room for local ceremonies."
 ve_rel_evt.231.b: "Mandate one secular protocol."
 ve_rel_evt.231.c: "Create a shared civic ceremonial standard."

 ve_rel_evt.240.t: "A Shortage of Secular Cadres"
 ve_rel_evt.240.d: "The new administration needs teachers, registrars, and inspectors able to operate without clerical institutions. There are too few trained candidates, and forcing the existing staff to convert their practice may provoke resistance."
 ve_rel_evt.240.a: "Fund a new cadre-training program."
 ve_rel_evt.240.b: "Compel the existing staff to adapt."
 ve_rel_evt.240.c: "Build an academic training network."

 ve_rel_evt.241.t: "Property and Underground Worship"
 ve_rel_evt.241.d: "The transfer of religious property has driven some congregations out of sight. Immediate confiscation would equip the new state quickly, but a rushed settlement risks turning private worship into organized defiance."
 ve_rel_evt.241.a: "Transfer the property gradually."
 ve_rel_evt.241.b: "Nationalize it immediately."
 ve_rel_evt.241.c: "Route the assets into supervised welfare institutions."

 ve_rel_evt.290.t: "A Settlement Takes Root"
 ve_rel_evt.290.d: "The transition crisis has passed without breaking the country's religious settlement. Administrators now work within the new rules, communities know where they stand, and the government can turn the experience into either reform capacity or deeper public confidence."
 ve_rel_evt.290.a: "Carry the lessons into the next reform."
 ve_rel_evt.290.a.tt: "Gain #P 10#! Piety Reform."
 ve_rel_evt.290.b: "Reaffirm the settlement in public."
 ve_rel_evt.290.b.tt: "Gain #P 3#! Religious Settlement."

 ve_rel_evt.291.t: "A Fragile Equilibrium"
 ve_rel_evt.291.d: "The formal transition is complete, but the new settlement remains a bargain of caution rather than conviction. It may be left to mature on its own, strengthened through another limited concession, or stabilized through institutions suited to the adopted model."
 ve_rel_evt.291.a: "Let the compromise stand."
 ve_rel_evt.291.a.tt: "The transition ends without an additional mechanical effect."
 ve_rel_evt.291.b: "Finance one final accommodation."
 ve_rel_evt.291.b.tt: "Spend #N 10#! Piety Reform and gain #P 3#! Religious Settlement."
 ve_rel_evt.291.c: "Entrust the settlement to model-fit institutions."
 ve_rel_evt.291.c.tt: "Spend #N 5#! Piety Reform and gain #P 2#! Religious Settlement. Requires an Idea suited to the adopted Religious Model."

 ve_rel_evt.292.t: "A Crisis of Settlement"
 ve_rel_evt.292.d: "The transition modifier has expired, yet the country has not accepted the new religious order. The government can spend scarce reform capacity on an emergency accommodation, rely on model-fit institutions for a narrower intervention, or allow the unresolved conflict to radicalize part of the population."
 ve_rel_evt.292.a: "Pay the price of an emergency accommodation."
 ve_rel_evt.292.a.tt: "Spend #N 15#! Piety Reform and gain #P 5#! Religious Settlement."
 ve_rel_evt.292.b: "The state has no concessions left to offer."
 ve_rel_evt.292.b.tt: "#N 0.25%#! of the country's population becomes Radical."
 ve_rel_evt.292.c: "Use the institutions built for this settlement."
 ve_rel_evt.292.c.tt: "Spend #N 5#! Piety Reform and gain #P 2#! Religious Settlement. Requires an Idea suited to the adopted Religious Model."

 ve_identity_transition_conciliatory_tt: "Spend #N 10#! Cultural Mandate and gain #P 3#! National Cohesion."
 ve_identity_transition_central_tt: "Gain #P 5#! Cultural Mandate and lose #N 3#! National Cohesion."
 ve_identity_transition_doctrine_tt: "Spend #N 5#! Cultural Mandate and gain #P 2#! National Cohesion."

 ve_cul_evt.210.t: "The Official Language of the State"
 ve_cul_evt.210.d: "The new national compact requires a common language for courts, schools, and public service. Immediate uniformity would be easy to administer, but many experienced officials and citizens cannot yet meet the proposed standard."
 ve_cul_evt.210.a: "Introduce the language through staged instruction."
 ve_cul_evt.210.b: "Issue a single-language order."
 ve_cul_evt.210.c: "Mobilize the nationalist administration."

 ve_cul_evt.211.t: "Service and Membership"
 ve_cul_evt.211.d: "Military service and veteran status are becoming proofs of national membership. Communities brought under the new compact demand time to adapt, while the center insists that belonging must carry one uniform obligation."
 ve_cul_evt.211.a: "Grant transitional exemptions."
 ve_cul_evt.211.b: "Apply one service obligation."
 ve_cul_evt.211.c: "Create a universal service register."

 ve_cul_evt.220.t: "The Register of Equal Citizenship"
 ve_cul_evt.220.d: "Old ethnic and religious categories remain embedded in public records. Removing them immediately would proclaim equal citizenship, but local offices warn that a rushed conversion could erase claims and disrupt access to services."
 ve_cul_evt.220.a: "Phase in a common civic register."
 ve_cul_evt.220.b: "Remove the old categories immediately."
 ve_cul_evt.220.c: "Place the conversion under a reform commission."

 ve_cul_evt.221.t: "Common School, Common Service"
 ve_cul_evt.221.d: "Equal access exists in law, yet schools and public offices lack the staff needed to deliver it. The government must choose between patient investment, one enforceable central standard, and a national network of academic qualifications."
 ve_cul_evt.221.a: "Invest in teachers and civil servants."
 ve_cul_evt.221.b: "Enforce one central standard."
 ve_cul_evt.221.c: "Build an academic qualification network."

 ve_cul_evt.230.t: "The Council of Constituent Peoples"
 ve_cul_evt.230.d: "The communities named in the composite compact demand a voice in its administration. Open negotiations may produce legitimacy, while a fixed quota designed in the capital promises a faster and more predictable settlement."
 ve_cul_evt.230.a: "Open representative negotiations."
 ve_cul_evt.230.b: "Impose the capital's fixed quota."
 ve_cul_evt.230.c: "Broker a parliamentary compromise."

 ve_cul_evt.231.t: "Layered Administration"
 ve_cul_evt.231.d: "Local authority and central standards now overlap across the composite state. Without a clear protocol, every office will negotiate the boundary anew; with too rigid a chain of command, the compact may lose its meaning."
 ve_cul_evt.231.a: "Negotiate a protocol of competences."
 ve_cul_evt.231.b: "Establish a central chain of command."
 ve_cul_evt.231.c: "Create a shared bureaucratic register."

 ve_cul_evt.290.t: "A New National Compact"
 ve_cul_evt.290.d: "The backlash has subsided and the new definition of national membership has taken root. The government can preserve the administrative lessons as Cultural Mandate or use the moment to reinforce confidence in the compact."
 ve_cul_evt.290.a: "Carry the experience into future statecraft."
 ve_cul_evt.290.a.tt: "Gain #P 10#! Cultural Mandate."
 ve_cul_evt.290.b: "Celebrate the compact across the country."
 ve_cul_evt.290.b.tt: "Gain #P 3#! National Cohesion."

 ve_cul_evt.291.t: "A Fragile Compact"
 ve_cul_evt.291.d: "The formal transition is over, but the new national identity remains unevenly accepted. The government may allow the compromise to mature, spend limited mandate on another accommodation, or reinforce it through institutions suited to the adopted model."
 ve_cul_evt.291.a: "Let the compromise find its own balance."
 ve_cul_evt.291.a.tt: "The transition ends without an additional mechanical effect."
 ve_cul_evt.291.b: "Fund one final accommodation."
 ve_cul_evt.291.b.tt: "Spend #N 10#! Cultural Mandate and gain #P 3#! National Cohesion."
 ve_cul_evt.291.c: "Entrust the compact to model-fit institutions."
 ve_cul_evt.291.c.tt: "Spend #N 5#! Cultural Mandate and gain #P 2#! National Cohesion. Requires an Idea suited to the adopted Identity Model."

 ve_cul_evt.292.t: "A Crisis of National Compact"
 ve_cul_evt.292.d: "The transition backlash has expired, yet the new definition of belonging has failed to command broad loyalty. The government can spend scarce mandate on an emergency accommodation, rely on model-fit institutions for a narrower intervention, or accept a wave of radicalization."
 ve_cul_evt.292.a: "Pay for an emergency accommodation."
 ve_cul_evt.292.a.tt: "Spend #N 15#! Cultural Mandate and gain #P 5#! National Cohesion."
 ve_cul_evt.292.b: "The state will enforce the compact as written."
 ve_cul_evt.292.b.tt: "#N 0.25%#! of the country's population becomes Radical."
 ve_cul_evt.292.c: "Use the institutions built for this identity."
 ve_cul_evt.292.c.tt: "Spend #N 5#! Cultural Mandate and gain #P 2#! National Cohesion. Requires an Idea suited to the adopted Identity Model."
