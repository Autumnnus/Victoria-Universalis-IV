l_simp_chinese:
 ve_je_religious_settlement_transition:0 "宗教协定过渡"
 ve_je_religious_settlement_transition_reason:0 "教会与国家的法律协定已发生变化。在过渡危机持续期间，各机构、社群与官员必须适应此变动。危机修正——而非本日志条目的时间表——具有决定性效力。"
 ve_je_religious_settlement_transition_complete_tt:0 "宗教协定过渡危机已结束。"
 ve_je_religious_settlement_transition_status_confessional:0 "目标协定：#Y 确信国教制#!\n宗教协定：#Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\n大约剩余时间：#Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] 个月#!\n已完成里程碑：#Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n危机结束时的结果：#Y 60+#! 协定提前稳定，#Y 26-59#! 中立解决，#Y 25 或以下#! 转化为危机。每个剩余的里程碑都提供一项影响宗教协定的选择。"
 ve_je_religious_settlement_transition_status_freedom:0 "目标协定：#Y 良心自由#!\n宗教协定：#Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\n大约剩余时间：#Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] 个月#!\n已完成里程碑：#Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n危机结束时的结果：#Y 60+#! 协定提前稳定，#Y 26-59#! 中立解决，#Y 25 或以下#! 转化为危机。每个剩余的里程碑都提供一项影响宗教协定的选择。"
 ve_je_religious_settlement_transition_status_separation:0 "目标协定：#Y 完全分离#!\n宗教协定：#Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\n大约剩余时间：#Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] 个月#!\n已完成里程碑：#Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n危机结束时的结果：#Y 60+#! 协定提前稳定，#Y 26-59#! 中立解决，#Y 25 或以下#! 转化为危机。每个剩余的里程碑都提供一项影响宗教协定的选择。"
 ve_je_religious_settlement_transition_status_atheism:0 "目标协定：#Y 国家无神论#!\n宗教协定：#Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\n大约剩余时间：#Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] 个月#!\n已完成里程碑：#Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n危机结束时的结果：#Y 60+#! 协定提前稳定，#Y 26-59#! 中立解决，#Y 25 或以下#! 转化为危机。每个剩余的里程碑都提供一项影响宗教协定的选择。"

 ve_je_national_compact_transition:0 "民族契约过渡"
 ve_je_national_compact_transition_reason:0 "国家已采纳对民族归属的新定义。在过渡强烈反弹持续期间，行政官员、精英与社群必须就契约展开谈判。强烈反弹修正——而非本日志条目的时间表——具有决定性效力。"
 ve_je_national_compact_transition_complete_tt:0 "民族契约过渡强烈反弹已结束。"
 ve_je_national_compact_transition_status_ethnic:0 "目标认同：#Y 族群认同#!\n民族凝聚力：#Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\n大约剩余时间：#Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] 个月#!\n已完成里程碑：#Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\n强烈反弹结束时的结果：#Y 60+#! 凝聚力提前稳定，#Y 26-59#! 中立解决，#Y 25 或以下#! 转化为危机。每个剩余的里程碑都提供一项影响民族凝聚力的选择。"
 ve_je_national_compact_transition_status_civic:0 "目标认同：#Y 公民认同#!\n民族凝聚力：#Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\n大约剩余时间：#Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] 个月#!\n已完成里程碑：#Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\n强烈反弹结束时的结果：#Y 60+#! 凝聚力提前稳定，#Y 26-59#! 中立解决，#Y 25 或以下#! 转化为危机。每个剩余的里程碑都提供一项影响民族凝聚力的选择。"
 ve_je_national_compact_transition_status_composite:0 "目标认同：#Y 复合认同#!\n民族凝聚力：#Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\n大约剩余时间：#Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] 个月#!\n已完成里程碑：#Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\n强烈反弹结束时的结果：#Y 60+#! 凝聚力提前稳定，#Y 26-59#! 中立解决，#Y 25 或以下#! 转化为危机。每个剩余的里程碑都提供一项影响民族凝聚力的选择。"
 ve_je_transition_resolving_status:0 "过渡记录正与当前的国家协定进行调和。"

 ve_rel_transition_conciliatory_tt:0 "花费 #N 10#! 虔修点并获得 #P 3#! 宗教协定。"
 ve_rel_transition_central_tt:0 "获得 #P 5#! 虔修点并失去 #N 3#! 宗教协定。"
 ve_rel_transition_doctrine_tt:0 "花费 #N 5#! 虔修点并获得 #P 2#! 宗教协定。"

 ve_rel_evt.210.t:0 "神职任免之界限"
 ve_rel_evt.210.d:0 "宗教当局已提交公职候选人名单，而高级行政官员则坚持国家服务必须始终褒奖才能。新和解方案下的第一批任命将明确神职建言的终点与民政权威的起点。"
 ve_rel_evt.210.a:0 "组建混合任命委员会。"
 ve_rel_evt.210.b:0 "接受神职人员名单。"
 ve_rel_evt.210.c:0 "将标准考试与宗教建言相结合。"

 ve_rel_evt.211.t:0 "学校与忠诚誓词"
 ve_rel_evt.211.d:0 "教区学校寻求在公共体系中获得认可的地位。其资助者要求对宗教教育予以保护，而官员则担心相互竞争的课程体系与誓词会使下一代走向分裂。"
 ve_rel_evt.211.a:0 "确保一个共同的核心课程标准。"
 ve_rel_evt.211.b:0 "强行推行单一的统一忠诚誓词。"
 ve_rel_evt.211.c:0 "将妥协方案置于官僚监察之下。"

 ve_rel_evt.220.t:0 "少数群体保障之措词"
 ve_rel_evt.220.d:0 "少数群体社区希望将其保护条款明确写入新的和解方案中。而政府法学家则倾向于使用单一的通用条款，并警告针对特定社区的承诺可能会固化既有的分裂。"
 ve_rel_evt.220.a:0 "清晰地写明保障条款。"
 ve_rel_evt.220.b:0 "采用单一的统一公民权条款。"
 ve_rel_evt.220.c:0 "交由改革派联盟来协商措辞。"

 ve_rel_evt.221.t:0 "共同机构中的代表权"
 ve_rel_evt.221.d:0 "学校、医院以及地方委员会现在必须平等地服务于属于不同宗教教派的公民。问题在于，代表权应当遵循地方实际情况，还是采用自中央强加的公式。"
 ve_rel_evt.221.a:0 "在地方上平衡代表权。"
 ve_rel_evt.221.b:0 "设定中央配额。"
 ve_rel_evt.221.c:0 "谈判外交代表权公式。"

 ve_rel_evt.230.t:0 "中立登记册"
 ve_rel_evt.230.d:0 "出生、婚姻以及财产宣称正从宗教监护人手中移交给民政注册官。官员们可以在过渡期间保留重复记录，但改革者要求进行彻底且立即的切割。"
 ve_rel_evt.230.a:0 "在过渡时期维持双重记录。"
 ve_rel_evt.230.b:0 "立即关闭宗教登记册。"
 ve_rel_evt.230.c:0 "部署训练有素的公务员网络。"

 ve_rel_evt.231.t:0 "学校与公共庆典"
 ve_rel_evt.231.d:0 "国家中立原则已延伸至学校集会和公共庆典。地方社区希望为代代相传的习俗保留空间；中央官员则希望建立一种不留任何歧义的世俗礼仪规程。"
 ve_rel_evt.231.a:0 "为地方庆典留出空间。"
 ve_rel_evt.231.b:0 "授权推行单一世俗礼仪规程。"
 ve_rel_evt.231.c:0 "建立共同的公民庆典标准。"

 ve_rel_evt.240.t:0 "世俗骨干之短缺"
 ve_rel_evt.240.d:0 "新政府需要能够脱离宗教机构独立运作的教师、注册官以及督学。受过培训的候选人寥寥无几，而强迫现有员工转变其执业方式可能会引发抵抗。"
 ve_rel_evt.240.a:0 "资助一项新的骨干培训计划。"
 ve_rel_evt.240.b:0 "强迫现有员工进行适应。"
 ve_rel_evt.240.c:0 "建立学术培训网络。"

 ve_rel_evt.241.t:0 "财产与地下礼拜"
 ve_rel_evt.241.d:0 "宗教财产的移交迫使一些教会转入地下。立即没收可以迅速充实新国家的实力，但仓促达成和解有将私人礼拜演变为有组织抗命的风险。"
 ve_rel_evt.241.a:0 "逐步移交财产。"
 ve_rel_evt.241.b:0 "立即将其国有化。"
 ve_rel_evt.241.c:0 "将资产划入受监督的福利机构。"

 ve_rel_evt.290.t:0 "协定扎根"
 ve_rel_evt.290.d:0 "转型危机在没有打破国家宗教协定的情况下平息了。行政官员们如今开始在新的规则下运转，各社群也明确了自身的定位，而政府则可以将这段经验转化为改革能力或更深厚的公众信心。"
 ve_rel_evt.290.a:0 "将这些教训带入下一次改革。"
 ve_rel_evt.290.a.tt:0 "获得 #P 10#! 虔修点。"
 ve_rel_evt.290.b:0 "公开重申该协定。"
 ve_rel_evt.290.b.tt:0 "获得 #P 3#! 宗教协定。"

 ve_rel_evt.291.t:0 "脆弱的平衡"
 ve_rel_evt.291.d:0 "正式转型已经完成，但新的协定与其说出于信念，不如说是一种出于谨慎的权宜之计。我们可以任由其自行成熟，通过另一项有限的妥协予以巩固，或者借助契合所采纳体制的机构来稳定局面。"
 ve_rel_evt.291.a:0 "维持这一妥协。"
 ve_rel_evt.291.a.tt:0 "转型结束，不会产生额外的机制效果。"
 ve_rel_evt.291.b:0 "资助最后一次通融。"
 ve_rel_evt.291.b.tt:0 "花费 #N 10#! 虔修点并获得 #P 3#! 宗教协定。"
 ve_rel_evt.291.c:0 "将协定托付给契合体制的机构。"
 ve_rel_evt.291.c.tt:0 "花费 #N 5#! 虔修点并获得 #P 2#! 宗教协定。需要一项契合所采纳宗教体制的理念。"

 ve_rel_evt.292.t:0 "协定危机"
 ve_rel_evt.292.d:0 "转型修正已告失效，然而国家仍未接纳新的宗教秩序。政府可以把本就稀缺的改革能力花在紧急通融上，依赖契合体制的机构来进行更为局限的干涉，或是任由未决的冲突使部分人口激进化。"
 ve_rel_evt.292.a:0 "付出紧急通融的代价。"
 ve_rel_evt.292.a.tt:0 "花费 #N 15#! 虔修点并获得 #P 5#! 宗教协定。"
 ve_rel_evt.292.b:0 "国家已无任何让步空间可言。"
 ve_rel_evt.292.b.tt:0 "国家 #N 0.25%#! 的人口成为激进派。"
 ve_rel_evt.292.c:0 "动用为这一协定建立的机构。"
 ve_rel_evt.292.c.tt:0 "花费 #N 5#! 虔修点并获得 #P 2#! 宗教协定。需要一项契合所采纳宗教体制的理念。"

 ve_identity_transition_conciliatory_tt:0 "花费 #N 10#! 文化赋权并获得 #P 3#! 民族凝聚力。"
 ve_identity_transition_central_tt:0 "获得 #P 5#! 文化赋权并失去 #N 3#! 民族凝聚力。"
 ve_identity_transition_doctrine_tt:0 "花费 #N 5#! 文化赋权并获得 #P 2#! 民族凝聚力。"

 ve_cul_evt.210.t:0 "国家的官方语言"
 ve_cul_evt.210.d:0 "新的国民公约要求在法庭、学校和公共服务中使用共同的语言。若立即实现整齐划一固然便于管理，但许多经验丰富的官员和公民尚无法达到拟定的标准。"
 ve_cul_evt.210.a:0 "通过分阶段教学引入该语言。"
 ve_cul_evt.210.b:0 "颁布单一语言令。"
 ve_cul_evt.210.c:0 "动员民族主义行政机构。"

 ve_cul_evt.211.t:0 "服役与成员资格"
 ve_cul_evt.211.d:0 "兵役与退伍军人身份正逐渐成为国民身份的证明。新公约涵盖的社群要求给予适应的时间，而中央则坚持认为归属感必须承载统一的义务。"
 ve_cul_evt.211.a:0 "给予过渡期豁免。"
 ve_cul_evt.211.b:0 "执行单一的服役义务。"
 ve_cul_evt.211.c:0 "建立全民兵役名册。"

 ve_cul_evt.220.t:0 "平等公民权名册"
 ve_cul_evt.220.d:0 "旧有的部族与宗教分类依然根植于公共记录之中。立即将其废除虽能昭示平等的公民权，但地方官员警告称，仓促的皈依可能会抹去宣称并打乱对服务的获取。"
 ve_cul_evt.220.a:0 "分阶段引入普通公民名册。"
 ve_cul_evt.220.b:0 "立即废除旧分类。"
 ve_cul_evt.220.c:0 "将皈依交由改革委员会负责。"

 ve_cul_evt.221.t:0 "公立学校，公共服务"
 ve_cul_evt.221.d:0 "法律上已实现平等准入，然而学校和公共部门仍缺乏落实所需的员工。政府必须在耐心投资、强制推行单一中央标准以及建立全国性的学术资质网络之间做出抉择。"
 ve_cul_evt.221.a:0 "投资于教师与公务员。"
 ve_cul_evt.221.b:0 "推行单一中央标准。"
 ve_cul_evt.221.c:0 "构建学术资质网络。"

 ve_cul_evt.230.t:0 "各构成民族委员会"
 ve_cul_evt.230.d:0 "复合国家契约中所列出的各社群要求在其行政管理中拥有发言权。开启谈判可能会产生合法性，而首都制定的固定配额则承诺带来更快、更可预测的解决方案。"
 ve_cul_evt.230.a:0 "开启代表性谈判。"
 ve_cul_evt.230.b:0 "强加首都的固定配额。"
 ve_cul_evt.230.c:0 "斡旋达成一项议会妥协。"

 ve_cul_evt.231.t:0 "分层行政管理"
 ve_cul_evt.231.d:0 "地方权威力和中央标准如今在复合国家中相互重叠。若无清晰的规程，每个办公机构都将重新谈判边界；若指挥链过于死板，契约可能会失去其意义。"
 ve_cul_evt.231.a:0 "谈判达成权限规程。"
 ve_cul_evt.231.b:0 "建立中央指挥链。"
 ve_cul_evt.231.c:0 "创立共享的官僚名册。"

 ve_cul_evt.290.t:0 "崭新的民族契约"
 ve_cul_evt.290.d:0 "强烈反弹已经平息，对民族成员身份的新定义已然扎根。政府可以保留这些行政经验转化为文化赋权，或利用此契机来巩固对契约的信心。"
 ve_cul_evt.290.a:0 "将经验带入未来的治国理政之中。"
 ve_cul_evt.290.a.tt:0 "获得 #P 10#! 文化赋权。"
 ve_cul_evt.290.b:0 "在全国范围内庆贺该契约。"
 ve_cul_evt.290.b.tt:0 "获得 #P 3#! 民族凝聚力。"

 ve_cul_evt.291.t:0 "脆弱的契约"
 ve_cul_evt.291.d:0 "正式过渡已经结束，但新的民族认同尚未得到普遍接纳。政府可以任由妥协自然成熟，在另一项妥协上消耗有限的赋权，或通过适合已采纳体制的机构来加以巩固。"
 ve_cul_evt.291.a:0 "任由妥协自行寻找平衡。"
 ve_cul_evt.291.a.tt:0 "过渡结束，没有额外的机制效果。"
 ve_cul_evt.291.b:0 "资助最后一次妥协。"
 ve_cul_evt.291.b.tt:0 "花费 #N 10#! 文化赋权并获得 #P 3#! 民族凝聚力。"
 ve_cul_evt.291.c:0 "将契约托付给契合体制的机构。"
 ve_cul_evt.291.c.tt:0 "花费 #N 5#! 文化赋权并获得 #P 2#! 民族凝聚力。需要一个契合所采纳认同体制的理念。"

 ve_cul_evt.292.t:0 "民族契约危机"
 ve_cul_evt.292.d:0 "过渡期的强烈反弹已经失效，然而对归属感的新定义却未能赢得广泛忠诚。政府可以在紧急妥协上消耗稀缺的赋权，依赖契合体制的机构进行更狭隘的干预，或接受一波激进化浪潮。"
 ve_cul_evt.292.a:0 "为紧急妥协支付代价。"
 ve_cul_evt.292.a.tt:0 "花费 #N 15#! 文化赋权并获得 #P 5#! 民族凝聚力。"
 ve_cul_evt.292.b:0 "国家将按原样强制执行该契约。"
 ve_cul_evt.292.b.tt:0 "国家 #N 0.25%#! 的人口变为激进派。"
 ve_cul_evt.292.c:0 "使用为这种认同建立的机构。"
 ve_cul_evt.292.c.tt:0 "花费 #N 5#! 文化赋权并获得 #P 2#! 民族凝聚力。需要一个契合所采纳认同体制的理念。"
