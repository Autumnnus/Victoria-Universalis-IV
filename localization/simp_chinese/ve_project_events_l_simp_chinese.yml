l_simp_chinese:
 ve_je_religious_project:0 "宗教项目"
 ve_je_religious_project_reason:0 "政府正在指导一项长期宗教项目。其进展取决于目标国家的行政能力、政治合法性、宗教状况和事件。"
 ve_je_religious_project_progress:0 "宗教项目完成进度"
 ve_je_religious_project_status_confessional:0 "忏悔的转变 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 力求通过有组织的活动来扩展国家信仰。\n\n完成于 #Y 125#! 进度：目标国家5%人口皈依国教，退还 #P 20#! 虔诚改革，并增加 #P 5#! 宗教定居点。"
 ve_je_religious_project_status_freedom:0 "自由拓展 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 正在建立一个基于良知和自愿联合的解决方案。\n\n完成于 #Y 100#! 进度：增加国家忠诚者，无需强制转换、退款 #P 20#! 宗教改革，并增加 #P 7#! 宗教解决。"
 ve_je_religious_project_status_secularization:0 "世俗化运动 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 正在削弱有组织宗教的公共权威。\n\n完成时间为 #Y 150#! 进度：使目标国家5%的人口皈依无神论，退还 #P 25#! 虔诚改革，并添加 #P 8#! 宗教安置。"
 ve_je_religious_project_complete_tt:0 "宗教工程已达到目标。"
 ve_je_religious_project_fail_tt:0 "宗教工程已取消。"

 ve_je_cultural_project:0 "文化工程"
 ve_je_cultural_project_reason:0 "政府正在指导一项长期文化项目。行政能力、合法性、教育、民族凝聚力和当地条件决定了其步伐。"
 ve_je_cultural_project_progress:0 "文化项目完成进度"
 ve_je_cultural_project_status_curriculum:0 "正在为该国的学校和机构制定国家课程。\n\n进度达到 #Y 100#! 时完成： #P +20#! 文化使命， #P +5#! 民族凝聚力，以及+2%教育机会的10年结果， +5% 资格，-25 官僚机构。"
 ve_je_cultural_project_status_symbols:0 "共享符号计划正在打造共同的公民词汇。\n\n完成于 #Y 75#! 进展： #P +20#! 文化使命， #P +7#! 民族凝聚力，以及完全接受的人口中+10%的忠诚者和+25权威的8年结果。"
 ve_je_cultural_project_status_ethnic:0 "民族融合运动 [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 正在将少数群体推向主流文化。\n\n完成于 #Y 125#! 进度：将5%的目标文化流行转变为主流文化（民族主义VII为7%）， #P +25#! 文化使命， #P +8#! 民族凝聚力，以及十年同化的结果。"
 ve_je_cultural_project_status_civic:0 "平等公民倡议 [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 正在跨越文化界限扩展共同的公民地位。\n\n完成于 #Y 100#! 进步：+15%接受10年，国家忠诚者， #P +25#! 文化使命， #P +10#! 民族凝聚力，以及十年资格/移民结果。"
 ve_je_cultural_project_status_composite:0 "宪法契约 [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 正在复合状态内协商永久识别。\n\n完成于 #Y 150#! 进步（需要40+国家凝聚力）：永久+15%接受度，将文化添加到组成列表中，国家忠诚者， #P +30#! 文化使命， #P +12#! 民族凝聚力。"
 ve_je_cultural_project_complete_tt:0 "文化工程已达到目标。"
 ve_je_cultural_project_fail_tt:0 "文化项目已取消。"
 ve_je_project_resolving_status:0 "项目管理部门正在提交最终报告。"

 ve_evt_religious_incident_cooldown_mdf:0 "宗教项目事件冷却"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "项目管理部门正在吸收最近发生的事件的后果。"
 ve_evt_cultural_incident_cooldown_mdf:0 "文化项目事件冷却"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "项目管理部门正在吸收最近发生的事件的后果。"
 ve_evt_central_clergy_supported_mdf:0 "中央神职人员支持"
 ve_evt_central_clergy_supported_mdf_desc:0 "政府维护了中央宗教体系的权威。"
 ve_evt_central_clergy_slighted_mdf:0 "中央神职人员轻蔑"
 ve_evt_central_clergy_slighted_mdf_desc:0 "政府支持地方实践凌驾于中央宗教等级制度的偏好之上。"
 ve_evt_municipal_patronage_mdf:0 "市政赞助网络"
 ve_evt_municipal_patronage_mdf_desc:0 "当地名人正在通过削弱税收的安排来推进该项目。当地名人的请愿书由神职人员、市政官员和社区长老组成的代表团已请愿政府减缓忏悔转变。他们警告说，僵化的时间表将使服从变成持久的怨恨。"

 ve_rel_evt.1.t:0 "“未经律师强加的信仰可能会填满登记簿，同时清空座位。”"
 ve_rel_evt.1.d:0 "听听他们的请愿书。 [SCOPE.sState('ve_evt_target_state').GetName] 宗教项目进度减少"
 ve_rel_evt.1.f:0 "4"
 ve_rel_evt.1.a:0 "。\n宗教定居点增加"
 ve_rel_evt.1.a.tt:0 "3 #N 。#!时间表不会改变。 #P 宗教项目进度增加#!宗教项目进度增加"
 ve_rel_evt.1.b:0 "4"
 ve_rel_evt.1.b.tt:0 "。 #P 5#!.\n宗教聚居地减少 #N 2#!。\n#N 0.5%的人口变得激进。#! 委员会信任的中介机构。 [SCOPE.sState('ve_evt_target_state').GetName] 花费"
 ve_rel_evt.1.c:0 "10"
 ve_rel_evt.1.c.tt:0 "宗教改革。\n宗教项目进度增加 #N 3#! 。\n宗教聚居地增加 #P 3#!。 #P 1#!."

 ve_rel_evt.2.t:0 "现场人员短缺"
 ve_rel_evt.2.d:0 "报告来自 [SCOPE.sState('ve_evt_target_state').GetName] 描述未答复的请愿书、相互矛盾的指示以及数周没有见到项目官员的地区。忏悔改信活动的进展超出了指定执行该活动的政府的进度。"
 ve_rel_evt.2.f:0 "“一条法令可以在一天之内传遍整个国家。一个称职的书记员却做不到。”"
 ve_rel_evt.2.a:0 "雇用临时现场官员。"
 ve_rel_evt.2.a.tt:0 "花费 #N 15#! 虔诚改革。\n宗教项目进度增加 #P 4#!。"
 ve_rel_evt.2.b:0 "减缓计划。"
 ve_rel_evt.2.b.tt:0 "宗教工程进度减少 #N 6#!。\n宗教安置增加 #P 2#!。"
 ve_rel_evt.2.c:0 "使用中央登记干部。"
 ve_rel_evt.2.c.tt:0 "花费 #N 10#! 虔诚改革。\n宗教项目进度增加 #P 5#!。"

 ve_cul_evt.1.t:0 "翻译局"
 ve_cul_evt.1.d:0 "官员 [SCOPE.sState('ve_evt_target_state').GetName] 对于平等公民倡议应如何解决这一问题存在分歧 [SCOPE.sCulture('ve_evt_target_culture').GetName] 语言。地方管理者希望有双语办公室；中央部委要求统一的行政标准。"
 ve_cul_evt.1.f:0 "“公民不需要翻译来理解以自己名义授予的权利。”"
 ve_cul_evt.1.a:0 "让当地语言走进公共机构。"
 ve_cul_evt.1.a.tt:0 "文化工程进度减少 #N 4#!.\n国家凝聚力增加 #P 3#!。"
 ve_cul_evt.1.b:0 "实行一项管理标准。"
 ve_cul_evt.1.b.tt:0 "文化工程进度增加 #P 5#!.\n国家凝聚力下降 #N 2#!.\n#N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_cul_evt.1.c:0 "成立学术翻译委员会。"
 ve_cul_evt.1.c.tt:0 "花费 #N 10#! 文化任务。\n文化工程进度增加 #P 3#!。\n民族凝聚力增加 #P 1#!."

 ve_cul_evt.2.t:0 "本土师资短缺"
 ve_cul_evt.2.d:0 "学校 [SCOPE.sState('ve_evt_target_state').GetName] 缺乏能够同时服务于国家课程和 [SCOPE.sCulture('ve_evt_target_culture').GetName] 社区。如果没有训练有素的地方干部，平等公民权就有可能成为只写在官方文件上的承诺。"
 ve_cul_evt.2.f:0 "“法律在一个下午就宣布了平等；课堂上必须向一代人传授它。”"
 ve_cul_evt.2.a:0 "资助新建师范学院。"
 ve_cul_evt.2.a.tt:0 "花费 #N 15#! 文化任务。\n文化项目进度增加 #P 4#!。"
 ve_cul_evt.2.b:0 "实施缓慢。"
 ve_cul_evt.2.b.tt:0 "文化项目进度减少 #N 6#!。\n民族凝聚力增加 #P 2#!。"
 ve_cul_evt.2.c:0 "利用现有机构。"
 ve_cul_evt.2.c.tt:0 "花费 #N 10#! 文化指令。\n文化项目进度增加 #P 5#!。\n国家凝聚力增加 #P 1#!。"

 ve_rel_evt.3.t:0 "冲突登记册"
 ve_rel_evt.3.d:0 "教区名册、市政分类账和项目官员的报告对宗教信仰的描述不一致。 [SCOPE.sState('ve_evt_target_state').GetName]。政府必须决定是否要浪费时间查明真相，还是继续处理已知不确定的数据。"
 ve_rel_evt.3.f:0 "“每个办公室都有一个精确的总数。没有两个总数是一致的。”"
 ve_rel_evt.3.a:0 "进行全面审核。"
 ve_rel_evt.3.a.tt:0 "增益 #P 8#! 虔诚改革。\n宗教项目进度减少 #N 6#!。合理估计继续进行。"
 ve_rel_evt.3.b:0 "花费"
 ve_rel_evt.3.b.tt:0 "8 #N 虔诚改革。\n宗教项目进度增加#!  #P 5#!."
 ve_rel_evt.3.c:0 "使用神圣管理登记册。"
 ve_rel_evt.3.c.tt:0 "宗教项目进度增加 #P 3#!."

 ve_rel_evt.4.t:0 "谣言与反传教"
 ve_rel_evt.4.d:0 "小册子、街头布道和焦虑的谣言现在描述了忏悔的转变 [SCOPE.sState('ve_evt_target_state').GetName] 作为对当地生活的攻击。官员们警告说，沉默会让反对者定义该项目，而镇压可能会证实他们最黑暗的主张。"
 ve_rel_evt.4.f:0 "“谣言不需要办公室，不需要印章，也不需要预算。”"
 ve_rel_evt.4.a:0 "举行公开听证会。"
 ve_rel_evt.4.a.tt:0 "宗教项目进度减少 #N 3#!.\n宗教聚落增加 #P 3#!.\n#P 0.5%#! 的人口中 [SCOPE.sState('ve_evt_target_state').GetName] 成为效忠者。"
 ve_rel_evt.4.b:0 "惩罚煽动者。"
 ve_rel_evt.4.b.tt:0 "宗教项目进度增加 #P 4#!.\n宗教聚落减少 #N 3#!.\n#N 1%#! 人口 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_rel_evt.4.c:0 "公布记录和结果。"
 ve_rel_evt.4.c.tt:0 "花费 #N 10#! 虔诚改革。\n宗教项目进度增加 #P 2#!.\n宗教聚落增加 #P 1#!."

 ve_rel_evt.5.t:0 "讲道的语言"
 ve_rel_evt.5.d:0 "项目神职人员 [SCOPE.sState('ve_evt_target_state').GetName] 报告称，正式的布道保持了教义的统一，但未能传达到许多会众。尽管中央领导层担心适应会变成独立，但当地语言的讲道将使这场运动走得更远。"
 ve_rel_evt.5.f:0 "“一个闻所未闻的神圣话语被完美地保存下来——并且没有人接受。”"
 ve_rel_evt.5.a:0 "用当地语言宣讲。"
 ve_rel_evt.5.a.tt:0 "宗教项目进度增加 #P 6#!。\n虔诚者失去 #N 1#! 批准时间 #Y 2.5年#!."
 ve_rel_evt.5.b:0 "维护礼拜仪式的统一。"
 ve_rel_evt.5.b.tt:0 "宗教项目进度减少 #N 3#!。\n宗教聚落增加 #P 3#!。\n虔诚增益 #P 1#! 批准 #Y 2.5年#!。"
 ve_rel_evt.5.c:0 "培训受过教育的口译员。"
 ve_rel_evt.5.c.tt:0 "花费 #N 10#! 宗教改革。\n宗教项目进度增加 #P 4#!。\n宗教定居点增加 #P 1#!。"

 ve_rel_evt.6.t:0 "敌对教会当局"
 ve_rel_evt.6.d:0 "中央任命的人员和建立地方神职人员 [SCOPE.sState('ve_evt_target_state').GetName] 每个人都声称有权指导忏悔皈依。支持一方可能会很快恢复指挥权，但这场争端已经成为考验谁为信仰说话的考验。"
 ve_rel_evt.6.f:0 "“争端涉及管辖权，这是机构对权力的描述。”"
 ve_rel_evt.6.a:0 "支持中央神职人员。"
 ve_rel_evt.6.a.tt:0 "宗教工程进度增加 #P 5#!。\n虔诚增益 #P 1#! 批准 #Y 2.5年#!。\n宗教聚居地减少 #N 3#!。\n#N 占人口的0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_rel_evt.6.b:0 "安抚当地神职人员。"
 ve_rel_evt.6.b.tt:0 "宗教工程进度减少 #N 4#!。\n虔诚者失去 #N 1#! 批准 #Y 2.5年#!。\n宗教聚落增加 #P 3#!。"
 ve_rel_evt.6.c:0 "以书面形式界定他们的权力。"
 ve_rel_evt.6.c.tt:0 "花费 #N 10#! 虔诚改革。\n宗教项目进度增加 #P 3#!.\n宗教聚落增加 #P 1#!."

 ve_cul_evt.3.t:0 "普查的类别"
 ve_cul_evt.3.d:0 "人口普查官员在 [SCOPE.sState('ve_evt_target_state').GetName] 不能同意公民如何 [SCOPE.sCulture('ve_evt_target_culture').GetName] 文化应该被记录下来。本地受访者使用重叠的身份，而中央表格则要求在一个框中提供一个答案。"
 ve_cul_evt.3.f:0 "“分类早在简化国家之前就简化了账本。”"
 ve_cul_evt.3.a:0 "允许自我识别。"
 ve_cul_evt.3.a.tt:0 "文化项目进度减少 #N 4#!.\n民族凝聚力提升 #P 4#!类别集中设置。"
 ve_cul_evt.3.b:0 "文化工程进度提升"
 ve_cul_evt.3.b.tt:0 "6 #P 。\n民族凝聚力下降#! #N 4#!.\n#N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_cul_evt.3.c:0 "使用现代注册系统。"
 ve_cul_evt.3.c.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 5#!。\n民族凝聚力增加 #P 1#!。"

 ve_cul_evt.4.t:0 "市政名人"
 ve_cul_evt.4.d:0 "市政赞助人在 [SCOPE.sState('ve_evt_target_state').GetName] 提供办公室、客户和影响力，以促进平等公民权 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口。他们的合作会很快，但他们的代价是继续控制地方收入。"
 ve_cul_evt.4.f:0 "“通往市政厅的最短路线要经过几个私人客厅。”"
 ve_cul_evt.4.a:0 "利用当地网络。"
 ve_cul_evt.4.a.tt:0 "文化项目进度增加 #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] 损失 #N 5%#! 税收能力 #Y 2年#!."
 ve_cul_evt.4.b:0 "创建开放理事会。"
 ve_cul_evt.4.b.tt:0 "文化项目进度减少 #N 3#!。\n国家凝聚力增加 #P 3#!。"
 ve_cul_evt.4.c:0 "谈判基于规则的解决方案。"
 ve_cul_evt.4.c.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 3#!。\n民族凝聚力增加 #P 1#!"

 ve_cul_evt.5.t:0 "公务员考试"
 ve_cul_evt.5.d:0 "开放公务员考试 [SCOPE.sCulture('ve_evt_target_culture').GetName] 候选人暴露了法律平等与实际准备之间的差距。立即获得入学机会具有象征意义，但多年的不平等教育无法通过法令消除。"
 ve_cul_evt.5.f:0 "“如果只向一名考生教授其语言，那么同一次考试就不再是同一个机会。”"
 ve_cul_evt.5.a:0 "金融预备课程。"
 ve_cul_evt.5.a.tt:0 "花费 #N 15#! 文化使命。\n文化项目进度增加 #P 5#!。\n民族凝聚力增加 #P 2#!。"
 ve_cul_evt.5.b:0 "平等机会立即开始。"
 ve_cul_evt.5.b.tt:0 "文化工程进度增加 #P 7#!。\n民族凝聚力下降 #N 4#!。\n#N 0.5%#! 人口 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_cul_evt.5.c:0 "动员学校和福利网络。"
 ve_cul_evt.5.c.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 5#!。\n民族凝聚力增加 #P 2#!."
 ve_cul_evt.5.e:0 "先改革考试制度。"
 ve_cul_evt.5.e.tt:0 "文化工程进度减少 #N 4#!\n民族凝聚力提高 #P 3#!."

 ve_cul_evt.6.t:0 "多数人反对"
 ve_cul_evt.6.d:0 "平等公民倡议的反对者声称，将共同权利扩展到 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口减少了其他所有人的地位。示威活动于 [SCOPE.sState('ve_evt_target_state').GetName] 正在将行政改革转变为国家政治考验。"
 ve_cul_evt.6.f:0 "“共享权利被描述为被盗的特权。”"
 ve_cul_evt.6.a:0 "公开捍卫这一倡议。"
 ve_cul_evt.6.a.tt:0 "文化工程进度增加 #P 4#!。\n民族凝聚力下降 #N 4#!。\n#N 1%#! 人口 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_cul_evt.6.b:0 "降低实施速度。"
 ve_cul_evt.6.b.tt:0 "文化工程进度减少 #N 5#!。\n民族凝聚力提高 #P 3#!."
 ve_cul_evt.6.c:0 "动员改革联盟。"
 ve_cul_evt.6.c.tt:0 "支出 #N 10#! 文化任务。\n文化项目进度增加 #P 3#!。\n民族凝聚力增加 #P 2#!.\n#P 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 成为效忠者。"

 ve_rel_evt.7.t:0 "断裂点的使命"
 ve_rel_evt.7.d:0 "忏悔的转变 [SCOPE.sState('ve_evt_target_state').GetName] 行政和政治接近崩溃。各办公室已经停止相互答复，公众的抵制正在加强，现场神职人员警告说，这项任务无法按照目前的条件继续进行。"
 ve_rel_evt.7.f:0 "“报告仍然称其为暂时的困难。街道选择了一个更严厉的名称。”"
 ve_rel_evt.7.a:0 "接受损失并退出。"
 ve_rel_evt.7.a.tt:0 "取消宗教项目，没有虔诚改革退款。\n宗教定居点减少 #N 5#!。\n对于 #Y 2年#!： #N -50#! 官僚、 #N -50#! 权威、 #N -3%#! 法律制定成功。"
 ve_rel_evt.7.b:0 "转移应急资源。"
 ve_rel_evt.7.b.tt:0 "花费 #N 25#! 虔诚改革。\n宗教项目进度减少 #N 5#!。\n#N 1%#! 的人口中 [SCOPE.sState('ve_evt_target_state').GetName] 变为 Radical。\n项目继续。"
 ve_rel_evt.7.c:0 "继续保留骨干人员。"
 ve_rel_evt.7.c.tt:0 "宗教项目进度减少 #N 10#!.\n宗教聚落减少 #N 2#!.\n项目继续。"
 ve_rel_evt.7.e:0 "重新协商方法。"
 ve_rel_evt.7.e.tt:0 "花费 #N 15#! 虔诚改革。\n宗教项目进度减少 #N 3#!.\n宗教聚落增加 #P 2#!。\n#N 0.5%#! 的人口中 [SCOPE.sState('ve_evt_target_state').GetName] 变为 Radical。\n项目继续。"

 ve_cul_evt.7.t:0 "该倡议失去合法性"
 ve_cul_evt.7.d:0 "平等公民倡议 [SCOPE.sState('ve_evt_target_state').GetName] 正在失去既定机构和政府的支持 [SCOPE.sCulture('ve_evt_target_culture').GetName] 它旨在服务的社区。激进运动现在将每一次妥协都视为政府无法实现平等的证据。"
 ve_cul_evt.7.f:0 "“改革可能会经受住反对。它无法继续变得令人难以置信。”"
 ve_cul_evt.7.a:0 "结束倡议。"
 ve_cul_evt.7.a.tt:0 "取消文化项目，不退还文化授权。\n民族凝聚力下降 #N 5#!.\n #Y 2年#!： #N -50#! 官僚、 #N -25#! 权威和 #N -3%#! 法律颁布成功。"
 ve_cul_evt.7.b:0 "发放紧急地方拨款。"
 ve_cul_evt.7.b.tt:0 "花费 #N 25#! 文化任务。\n文化项目进度减少 #N 5#!.\n#N 1%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变为激进。\n项目继续。"
 ve_cul_evt.7.c:0 "继续执行最小程序。"
 ve_cul_evt.7.c.tt:0 "文化项目进度减少 #N 10#!。\n国家凝聚力减少 #N 2#!。\n项目继续。"
 ve_cul_evt.7.e:0 "重建联盟。"
 ve_cul_evt.7.e.tt:0 "花费 #N 15#! 文化使命。\n文化工程进度减少 #N 3#!。\n民族凝聚力增加 #P 2#!。\n#N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变为 Radical。\n项目继续。"

 ve_rel_evt.8.t:0 "意想不到的当地和谐"
 ve_rel_evt.8.d:0 "神职人员、市政官员和社区长老 [SCOPE.sState('ve_evt_target_state').GetName] 达成了任何中央指令都无法达成的协议。当地的抵抗正在消退，会众正在协调自己的使命，忏悔皈依获得了意想不到的势头。"
 ve_rel_evt.8.f:0 "“一开始是来自首都的命令，现在已经成为在城镇广场制定的契约。”"
 ve_rel_evt.8.a:0 "充分利用这一势头。"
 ve_rel_evt.8.a.tt:0 "宗教聚落增加 #P 1#!。\n宗教项目进度增加 #P 25#!。\n如果进度达到 #Y 100#!，采用工程正常竣工效果。"
 ve_rel_evt.8.b:0 "耐久性优先于速度。"
 ve_rel_evt.8.b.tt:0 "宗教聚居地增加 #P 4#!.\n宗教项目进度增加 #P 10#!.\n如果进度达到 #Y 100#!，则应用项目的正常完成效果。"

 ve_cul_evt.8.t:0 "地方公民联盟"
 ve_cul_evt.8.d:0 "教师、市政官员、行业协会和社区代表 [SCOPE.sCulture('ve_evt_target_culture').GetName] 社区在 [SCOPE.sState('ve_evt_target_state').GetName] 成立了一个共同委员会。通过在争端到达首都之前解决争端，这个联盟为平等公民倡议提供了政府无法制造的动力。"
 ve_cul_evt.8.f:0 "“当很少共享餐桌的机构开始分担责任时，公民身份就成为了现实。”"
 ve_cul_evt.8.a:0 "利用联盟的动力。"
 ve_cul_evt.8.a.tt:0 "国家凝聚力增加 #P 1#!.\n文化项目进度增加 #P 25#!。\n如果进度达到 #Y 100#!，则应用项目正常完成效果。"
 ve_cul_evt.8.b:0 "使机构永久化。"
 ve_cul_evt.8.b.tt:0 "民族凝聚力增加 #P 4#!。\n文化项目进度增加 #P 10#!。\n如果进度达到 #Y 100#!，采用工程正常竣工效果。"

 ve_rel_evt.40.t:0 "失步记录"
 ve_rel_evt.40.d:0 "省级登记 [SCOPE.sState('ve_evt_target_state').GetName] 对集会、公民协会和公共机构使用不兼容的类别。目前，到达首都的报告相互矛盾，导致该项目无法区分合规与抵制。"
 ve_rel_evt.40.f:0 "“通过三个分类账管理的政策很快就会出现三种不同的现实。”"
 ve_rel_evt.40.a:0 "发送中央审计。"
 ve_rel_evt.40.a.tt:0 "花费 #N 10#! 虔诚改革。\n宗教工程进度增加 #P 5#!。\n宗教聚落增加 #P 1#!."
 ve_rel_evt.40.b:0 "本地核对记录。"
 ve_rel_evt.40.b.tt:0 "宗教工程进度减少 #N 3#!。\n宗教聚落增加 #P 2#!."
 ve_rel_evt.40.c:0 "采用标准登记程序。"
 ve_rel_evt.40.c.tt:0 "花费 #N 5#! 虔诚改革。\n宗教项目进度增加 #P 4#!.\n宗教聚落增加 #P 1#!。"

 ve_rel_evt.41.t:0 "省级工作人员短缺"
 ve_rel_evt.41.d:0 "指导该项目的办公室 [SCOPE.sState('ve_evt_target_state').GetName] 找不到足够的训练有素的职员、教师和检查员。指示的积累速度快于地方官员的解释速度，仓促的任命可能会使每一次争端变得更糟。"
 ve_rel_evt.41.f:0 "“法令一天之内就到了。能够执行的人可能需要一代人的时间。”"
 ve_rel_evt.41.a:0 "资助新的官员干部。"
 ve_rel_evt.41.a.tt:0 "花费 #N 15#! 宗教改革。\n宗教项目进度增加 #P 6#!."
 ve_rel_evt.41.b:0 "实施缓慢。"
 ve_rel_evt.41.b.tt:0 "宗教工程进度减少 #N 6#!。\n宗教聚落增加 #P 2#!."
 ve_rel_evt.41.c:0 "利用现有的教育网络。"
 ve_rel_evt.41.c.tt:0 "花费 #N 10#! 虔诚改革。\n宗教项目进度增加 #P 5#!.\n宗教聚落增加 #P 1#!。"

 ve_rel_evt.42.t:0 "谣言传遍全区"
 ve_rel_evt.42.d:0 "谣言在 [SCOPE.sState('ve_evt_target_state').GetName] 声称该项目隐瞒的措施远比政府宣布的严厉。宗教组织者和当地煽动者重复着相互矛盾的故事，而官方的沉默则为每个新版本提供了传播的空间。"
 ve_rel_evt.42.f:0 "“谣言不需要办公室、不需要预算、不需要签名。”"
 ve_rel_evt.42.a:0 "发布报告。"
 ve_rel_evt.42.a.tt:0 "宗教工程进度减少 #N 3#!。\n宗教聚落增加 #P 4#!."
 ve_rel_evt.42.b:0 "平息骚动。"
 ve_rel_evt.42.b.tt:0 "宗教工程进度增加 #P 5#!。\n宗教聚落减少 #N 3#!.\n#N 1%#! 的人口 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_rel_evt.42.c:0 "委托当地调解员。"
 ve_rel_evt.42.c.tt:0 "花费 #N 10#! 虔诚改革。\n宗教项目进度增加 #P 4#!.\n宗教聚落增加 #P 2#!.\n#P 0.5%#! 人口 [SCOPE.sState('ve_evt_target_state').GetName] 成为效忠者。"

 ve_rel_evt.43.t:0 "处于崩溃点的政府"
 ve_rel_evt.43.d:0 "该项目 [SCOPE.sState('ve_evt_target_state').GetName] 正接近行政崩溃。省级办公室不堪重负，公众信心崩溃，有组织的反对派现在将每一项新指令都视为政府失去控制的证据。"
 ve_rel_evt.43.f:0 "“当文件停止移动时，危机就会蔓延到街头。”"
 ve_rel_evt.43.a:0 "结束该计划。"
 ve_rel_evt.43.a.tt:0 "取消宗教项目，没有虔诚改革退款。\n宗教安置减少了 #N 5#!.\n #Y 2年#!： #N -50#! 官僚、 #N -50#! 权威、 #N -3%#! 法律制定成功。"
 ve_rel_evt.43.b:0 "转移应急资源。"
 ve_rel_evt.43.b.tt:0 "花费 #N 25#! 宗教改革。\n宗教项目进度减少 #N 5#!.\n#N 1%#! 的人口中 [SCOPE.sState('ve_evt_target_state').GetName] 变为 Radical。\n项目继续。"
 ve_rel_evt.43.c:0 "继续保留骨干人员。"
 ve_rel_evt.43.c.tt:0 "宗教项目进度减少 #N 10#!.\n宗教聚居地减少 #N 2#!。\n项目继续进行。"
 ve_rel_evt.43.e:0 "重建当地合作伙伴关系。"
 ve_rel_evt.43.e.tt:0 "支出 #N 15#! 虔诚改革。\n宗教项目进度减少 #N 3#!.\n宗教聚落增加 #P 2#!.\n#N 0.5%#! 人口 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。\n该项目仍在继续。"

 ve_rel_evt.100.t:0 "跨宗教委员会的席位"
 ve_rel_evt.100.d:0 "代表 [SCOPE.sState('ve_evt_target_state').GetName] 同意宗教间理事会是必要的，但不是讨论谁应该获得席位。比例代表制将使较小的社区放心，而在首都设计的固定定居点可以立即开始工作。"
 ve_rel_evt.100.f:0 "“每个人都支持一张共同的桌子，直到椅子被清点。”"
 ve_rel_evt.100.a:0 "按人口分配代表权。"
 ve_rel_evt.100.a.tt:0 "宗教项目进度减少 #N 3#!.\n宗教聚居地增加 #P 4#!."
 ve_rel_evt.100.b:0 "实行固定的中央妥协。"
 ve_rel_evt.100.b.tt:0 "宗教项目进度增加 #P 5#!.\n宗教聚落减少 #N 2#!。\n#N 0.5%#! 的人口中 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_rel_evt.100.c:0 "赋予跨宗教委员会权力。"
 ve_rel_evt.100.c.tt:0 "花费 #N 10#! 虔诚改革。\n宗教工程进度增加 #P 5#!。\n宗教聚落增加 #P 2#!。"

 ve_rel_evt.101.t:0 "共享学校课程"
 ve_rel_evt.101.d:0 "学校位于 [SCOPE.sState('ve_evt_target_state').GetName] 需要共同的公民教训，而不是将自由外展变成一场反对当地信仰的运动。教师要求提供明确的材料和联合培训，而社区领袖则坚持要求当地教学为他们的传统保留空间。"
 ve_rel_evt.101.f:0 "“只有每个家庭都承认教室是他们的，共享课才能成功。”"
 ve_rel_evt.101.a:0 "资助一支共同的教学干部。"
 ve_rel_evt.101.a.tt:0 "花费 #N 15#! 虔诚改革。\n宗教项目进度增加 #P 6#!.\n宗教聚落增加 #P 1#!."
 ve_rel_evt.101.b:0 "为当地课程留出空间。"
 ve_rel_evt.101.b.tt:0 "宗教项目进度减少 #N 4#!.\n宗教安置增加 #P 3#!。"
 ve_rel_evt.101.c:0 "将改革联盟引入学校。"
 ve_rel_evt.101.c.tt:0 "支出 #N 10#! 虔诚改革。\n宗教工程进度增加 #P 5#!。\n宗教聚落增加 #P 2#!。\n#P 0.5%#! 的人口中 [SCOPE.sState('ve_evt_target_state').GetName] 成为忠诚者。"

 ve_rel_evt.102.t:0 "相互保证宪章"
 ve_rel_evt.102.d:0 "宗教团体、市政官员和改革协会 [SCOPE.sState('ve_evt_target_state').GetName] 起草了共同章程。每个签署方都接受相同的公民义务，以换取任何社区都不会被排除在当地机构之外的公共保证。"
 ve_rel_evt.102.f:0 "“当每一个承诺都被写成另一方的权利时，信任就成为可能。”"
 ve_rel_evt.102.a:0 "利用契约动力。"
 ve_rel_evt.102.a.tt:0 "宗教聚落增加 #P 2#!。\n宗教项目进度增加 #P 20#!。\n如果进度达到 #Y 100#!，则应用项目正常完成效果。"
 ve_rel_evt.102.b:0 "使保障永久化。"
 ve_rel_evt.102.b.tt:0 "宗教聚居增加 #P 4#!。\n#P 0.5%#! 的人口中 [SCOPE.sState('ve_evt_target_state').GetName] 成为忠诚者。\n宗教项目进度增加 #P 10#!.\n如果进度达到 #Y 100#!，应用项目的正常完成效果。"

 ve_rel_evt.150.t:0 "教师还是督察？"
 ve_rel_evt.150.d:0 "世俗化运动 [SCOPE.sState('ve_evt_target_state').GetName] 暴露了识字人才的短缺。政府可以扩大培养长期公民能力的教学队伍，或者依靠能够利用现有人员执行新规则的检查员。"
 ve_rel_evt.150.f:0 "“一名督察可以在一个下午关闭一所学校。一名教师可能需要数年时间才能取代那里的教学人员。”"
 ve_rel_evt.150.a:0 "扩大教学队伍。"
 ve_rel_evt.150.a.tt:0 "花费 #N 15#! 虔诚改革。\n宗教项目进度增加 #P 6#!。"
 ve_rel_evt.150.b:0 "放慢计划以匹配现有人员。"
 ve_rel_evt.150.b.tt:0 "宗教项目进度减少 #N 5#!。\n宗教定居点增加 #P 2#!。"
 ve_rel_evt.150.c:0 "委托公共教育网络。"
 ve_rel_evt.150.c.tt:0 "花费 #N 10#! 虔诚改革。\n宗教工程进度增加 #P 5#!。\n宗教聚落增加 #P 1#!."

 ve_rel_evt.151.t:0 "被扣押的财产"
 ve_rel_evt.151.d:0 "前宗教财产 [SCOPE.sState('ve_evt_target_state').GetName] 准备好改建为学校、诊所和市政办公室。立即转移将为竞选活动提供宝贵的基础设施，但缺乏补偿正在成为虔诚者的一个集结点。"
 ve_rel_evt.151.f:0 "“钥匙在一个早上就易手了。关于所有权的争论将比锁的寿命更长。”"
 ve_rel_evt.151.a:0 "分阶段支付赔偿金。"
 ve_rel_evt.151.a.tt:0 "花费 #N 15#! 虔诚改革。\n宗教工程进度增加 #P 3#!。\n宗教聚落增加 #P 3#!"
 ve_rel_evt.151.b:0 "立即将房产投入公共服务。"
 ve_rel_evt.151.b.tt:0 "宗教工程进度增加 #P 7#!。\n宗教聚落减少 #N 4#!.\n#N 1%#! 的人口 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。\n虔诚者失去 #N 1#! 认可 #Y 2.5年#!。"
 ve_rel_evt.151.c:0 "转移到世俗福利机构。"
 ve_rel_evt.151.c.tt:0 "花费 #N 10#! 虔诚改革。\n宗教项目进度增加 #P 5#!.\n宗教聚居地增加 #P 2#!。\n#P 占人口的0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 成为效忠者。"

 ve_rel_evt.152.t:0 "民间社团扎根"
 ve_rel_evt.152.d:0 "教师界、互助会、市政协会 [SCOPE.sState('ve_evt_target_state').GetName] 一旦通过宗教机构组织，就开始提供服务。他们的合作为世俗化运动提供了当地的公民基础，而不仅仅是行政存在。"
 ve_rel_evt.152.f:0 "“当公民不等待检查员就开始维护新秩序时，新秩序就得以持续。”"
 ve_rel_evt.152.a:0 "利用当地的势头。"
 ve_rel_evt.152.a.tt:0 "宗教聚落增加 #P 2#!。\n宗教项目进度增加 #P 20#!。\n如果进度达到 #Y 100#!，则应用项目正常完成效果。"
 ve_rel_evt.152.b:0 "将社团转为常设机构。"
 ve_rel_evt.152.b.tt:0 "宗教聚居增加 #P 4#!。\n宗教项目进度增加 #P 10#!。\n如果进度达到 #Y 100#!，采用项目正常竣工效果。"

 ve_cul_evt.40.t:0 "地方学校董事会"
 ve_cul_evt.40.d:0 "学校董事会在 [SCOPE.sState('ve_evt_target_state').GetName] 对地点有不同意见 [SCOPE.sCulture('ve_evt_target_culture').GetName] 公共教学中的语言。当地语言教学将保持信任，而单一的管理语言将使国家项目更容易指导。"
 ve_cul_evt.40.f:0 "“第一节课选择的语言通常决定了谁相信学校属于他们。”"
 ve_cul_evt.40.a:0 "保护当地语言。"
 ve_cul_evt.40.a.tt:0 "文化工程进度减少 #N 4#!。\n民族凝聚力增加 #P 3#!。"
 ve_cul_evt.40.b:0 "实行一种行政语言。"
 ve_cul_evt.40.b.tt:0 "文化工程进度增加 #P 5#!。\n民族凝聚力下降 #N 2#!。\n#N 0.5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_cul_evt.40.c:0 "扩大教师网络。"
 ve_cul_evt.40.c.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 4#!.\n国家凝聚力增加 #P 2#!。"

 ve_cul_evt.41.t:0 "统计界限"
 ve_cul_evt.41.d:0 "官员调查 [SCOPE.sState('ve_evt_target_state').GetName] 无法达成一致的地方 [SCOPE.sCulture('ve_evt_target_culture').GetName] 社区开始和结束。地方身份在语言、地区和习俗方面都有重叠，但国家项目需要可以计算和管理的类别。"
 ve_cul_evt.41.f:0 "“为人口普查划定的边界很快就会获得官员、预算和捍卫者。”"
 ve_cul_evt.41.a:0 "留出自我认同的空间。"
 ve_cul_evt.41.a.tt:0 "文化工程进度减少 #N 3#!。\n民族凝聚力增加 #P 3#!。"
 ve_cul_evt.41.b:0 "让中心划定界限。"
 ve_cul_evt.41.b.tt:0 "文化工程进度增加 #P 6#!。\n民族凝聚力下降 #N 3#!。\n#N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_cul_evt.41.c:0 "使用标准登记系统。"
 ve_cul_evt.41.c.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 5#!.\n国家凝聚力增加 #P 1#!."

 ve_cul_evt.42.t:0 "处于临界点的国家项目"
 ve_cul_evt.42.d:0 "国家项目于 [SCOPE.sState('ve_evt_target_state').GetName] 正在接近崩溃。激进运动声称政府要么背叛了 [SCOPE.sCulture('ve_evt_target_culture').GetName] 社区或向其投降，而地方办事处不再有信心执行另一项妥协。"
 ve_cul_evt.42.f:0 "“既受到胁迫又投降的解决方案可能很快就不再是解决方案了。”"
 ve_cul_evt.42.a:0 "结束项目。"
 ve_cul_evt.42.a.tt:0 "取消文化项目，不退还文化授权。\n民族凝聚力下降 #N 5#!。\n持续 #Y 2年#!： #N -50#! 官僚、 #N -25#! 权威、 #N -3%#! 法律制定成功。"
 ve_cul_evt.42.b:0 "转移紧急地方资源。"
 ve_cul_evt.42.b.tt:0 "花费 #N 25#! 文化任务。\n文化工程进度减少 #N 5#!。\n#N 1%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变为 Radical。\n项目继续。"
 ve_cul_evt.42.c:0 "继续执行最小计划。"
 ve_cul_evt.42.c.tt:0 "文化项目进度减少 #N 10#!.\n国家凝聚力下降 #N 2#!.\n项目继续。"
 ve_cul_evt.42.e:0 "重建谈判框架。"
 ve_cul_evt.42.e.tt:0 "花费 #N 15#! 文化任务。\n文化项目进度减少 #N 3#!.\n国家凝聚力增加 #P 2#!。\n#N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。\n该项目仍在继续。"

 ve_cul_evt.50.t:0 "姓氏和语言指令"
 ve_cul_evt.50.d:0 "官员 [SCOPE.sState('ve_evt_target_state').GetName] 提议以民族语言标准化姓氏和公共记录。该指令将使 [SCOPE.sCulture('ve_evt_target_culture').GetName] 中央政府更容易对人口进行分类，但家庭担心私人身份正在成为国家指挥的对象。"
 ve_cul_evt.50.f:0 "“登记册上不同的名字可能仍然是一个家庭记忆中的名字。”"
 ve_cul_evt.50.a:0 "资助逐步的登记活动。"
 ve_cul_evt.50.a.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 4#!。\n民族凝聚力增加 #P 1#!.\n#N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_cul_evt.50.b:0 "执行一项国家标准。"
 ve_cul_evt.50.b.tt:0 "文化工程进度增加 #P 7#!.\n国民凝聚力下降 #N 4#!。\n#N 1%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_cul_evt.50.c:0 "撤回修订指令。"
 ve_cul_evt.50.c.tt:0 "文化工程进度减少 #N 5#!。\n民族凝聚力增加 #P 3#!"

 ve_cul_evt.51.t:0 "征兵登记"
 ve_cul_evt.51.d:0 "军队官员 [SCOPE.sState('ve_evt_target_state').GetName] 要求对服务义务、姓氏和命令进行单一登记。将其应用到 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口将加强种族融合的动力，但社区中的抵制正在增加，他们将军队视为另一种文化抹杀工具。"
 ve_cul_evt.51.f:0 "“当国家想要征收税收或召唤其儿子时，它首先会知道一个村庄的名称。”"
 ve_cul_evt.51.a:0 "申请国家名录。"
 ve_cul_evt.51.a.tt:0 "文化工程进度增加 #P 5#!。\n民族凝聚力下降 #N 2#!。\n#N 0.5%#! 的人口变得激进。 [SCOPE.sCulture('ve_evt_target_culture').GetName] 保留地方登记做法。 [SCOPE.sState('ve_evt_target_state').GetName] 文化项目进度减少"
 ve_cul_evt.51.b:0 "3"
 ve_cul_evt.51.b.tt:0 "。\n民族凝聚力增加 #N 3#!。 #P 通过服兵役整合登记。#!花费"
 ve_cul_evt.51.c:0 "10"
 ve_cul_evt.51.c.tt:0 "文化任务。\n文化项目进度增加 #N 3#! 。 #P 6#!.\n国家凝聚力增加 #P 1#!。\n#N 0.5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"

 ve_cul_evt.100.t:0 "选民代表团"
 ve_cul_evt.100.d:0 "代表团来自 [SCOPE.sCulture('ve_evt_target_culture').GetName] 社区在 [SCOPE.sState('ve_evt_target_state').GetName] 已经到来，要求在制宪契约的机构中拥有代表权。谈判将减缓该项目的进程，但会增强其合法性；资本强加的解决方案可能会以信任为代价而更快地推进。"
 ve_cul_evt.100.f:0 "“只有当每个选民都能指出他们帮助制定的条款时，契约才会变得普遍。”"
 ve_cul_evt.100.a:0 "协商其在契约中的位置。"
 ve_cul_evt.100.a.tt:0 "文化工程进度减少 #N 4#!。\n民族凝聚力增加 #P 4#!。"
 ve_cul_evt.100.b:0 "实行中央定居点。"
 ve_cul_evt.100.b.tt:0 "文化工程进度增加 #P 5#!。\n民族凝聚力减少 #N 2#!。\n#N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口在 [SCOPE.sState('ve_evt_target_state').GetName] 变得激进。"
 ve_cul_evt.100.c:0 "让议会联盟参与谈判。"
 ve_cul_evt.100.c.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 4#!.\n国家凝聚力提高 #P 2#!."

 ve_cul_evt.101.t:0 "双重管理"
 ve_cul_evt.101.d:0 "的成分契约 [SCOPE.sState('ve_evt_target_state').GetName] 现在取决于两个重叠的政府。中央官员和代表 [SCOPE.sCulture('ve_evt_target_culture').GetName] 社区重复登记、争议任命并发布相互矛盾的指令，而国家的官僚机构已接近精疲力尽。"
 ve_cul_evt.101.f:0 "“两个办公室共享权力比共享文件柜更容易。”"
 ve_cul_evt.101.a:0 "为联合行政人员提供资金。"
 ve_cul_evt.101.a.tt:0 "花费 #N 15#! 文化任务。\n文化项目进度增加 #P 6#!。"
 ve_cul_evt.101.b:0 "放慢契约，直到办公室达成一致。"
 ve_cul_evt.101.b.tt:0 "文化项目进度减少通过 #N 6#!.\n国家凝聚力增加 #P 2#!。"
 ve_cul_evt.101.c:0 "统一公务员制度下的办公室。"
 ve_cul_evt.101.c.tt:0 "支出 #N 10#! 文化任务。\n文化项目进度增加 #P 5#!。\n民族凝聚力增加 #P 2#!。"

 ve_cul_evt.150.t:0 "各省实施情况"
 ve_cul_evt.150.d:0 "省级政府报告称，全国文化工程的推进速度截然不同。一些办公室要求为实施委员会提供资金，而另一些办公室则警告说，对每个地区强制执行单一时间表将消耗稀缺的人员并削弱公众信心。"
 ve_cul_evt.150.f:0 "“国家法令一次制定，但必须在全国每个办公室实施。”"
 ve_cul_evt.150.a:0 "为实施委员会提供资金。"
 ve_cul_evt.150.a.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 5#!。"
 ve_cul_evt.150.b:0 "采用渐进式"
 ve_cul_evt.150.b.tt:0 "文化项目进度减少 #N 4#!.\n国家凝聚力提高 #P 2#!。"
 ve_cul_evt.150.c:0 "规范现有行政管理。"
 ve_cul_evt.150.c.tt:0 "支出 #N 5#! 文化任务。\n文化项目进度增加 #P 3#!.\n国家凝聚力增加 #P 2#!."

 ve_cul_evt.151.t:0 "教学语言"
 ve_cul_evt.151.d:0 "国家课程要求使用共同的教学语言，但全国各地的学校为语言传统截然不同的社区提供服务。多语言材料可以保持信心，但会延迟分发，而单一课程可以快速进入课堂，但存在将教育变成文化竞赛的风险。"
 ve_cul_evt.151.f:0 "“用学生不信任的语言教授的课程可能会记住除其主题之外的所有内容。”"
 ve_cul_evt.151.a:0 "为多语言材料提供资金。"
 ve_cul_evt.151.a.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 3#!。\n民族凝聚力增强 #P 3#!。"
 ve_cul_evt.151.b:0 "应用一门国家课程。"
 ve_cul_evt.151.b.tt:0 "文化项目进度增加 #P 6#!。\n国家凝聚力减少 #N 3#!。"
 ve_cul_evt.151.c:0 "团结教学和福利网络。"
 ve_cul_evt.151.c.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 5#!。\n国家凝聚力增加by #P 2#!."

 ve_cul_evt.160.t:0 "谁代表国家？"
 ve_cul_evt.160.d:0 "共享符号项目重新提出了谁的历史、制服、纪念碑和仪式可以代表整个国家的问题。轮换传统会扩大认可范围，但会减缓达成一致的速度；选择一种官方叙述会产生清晰度，同时将许多公民排除在外。"
 ve_cul_evt.160.f:0 "\“只有当公民在其中看到自己而不需要解释时，一个符号才成为国家标志。”"
 ve_cul_evt.160.a:0 "在公共使用中轮换符号。"
 ve_cul_evt.160.a.tt:0 "文化项目进度减少 #N 3#!。\n国家凝聚力增加 #P 4#!。"
 ve_cul_evt.160.b:0 "选择一种官方叙述。"
 ve_cul_evt.160.b.tt:0 "文化项目进度增加 #P 6#!。\n国家凝聚力减少到 #N 3#!。"
 ve_cul_evt.160.c:0 "设计一个共享的公共仪式。"
 ve_cul_evt.160.c.tt:0 "花费 #N 10#! 文化任务。\n文化项目进度增加 #P 4#!。\n民族凝聚力增加 #P 2#!。"
