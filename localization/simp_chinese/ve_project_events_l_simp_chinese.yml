l_simp_chinese:
 ve_je_religious_project:0 "宗教工程"
 ve_je_religious_project_reason:0 "政府正在指导一项长期的宗教工程。其进度受行政力、政治合法性、宗教状况以及目标地区中发生的事情所制约。"
 ve_je_religious_project_progress:0 "宗教工程完成进度"
 ve_je_religious_project_status_confessional:0 "在 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 的国教化运动正试图通过一场有组织的运动来扩展国家宗教。\n\n在 #Y 125#! 进度时完成：将目标地区 5% 的人口皈依为国教，退还 #P 20#! 虔修点，并增加 #P 5#! 宗教协定。"
 ve_je_religious_project_status_freedom:0 "在 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 的自由宣抚正在建立一个基于良知与志愿结社的协定。\n\n在 #Y 100#! 进度时完成：在不进行强制皈依的情况下增加地区效忠派，退还 #P 20#! 虔修点，并增加 #P 7#! 宗教协定。"
 ve_je_religious_project_status_secularization:0 "在 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 的世俗化运动正在削弱有组织宗教的公共权威。\n\n在 #Y 150#! 进度时完成：将目标地区 5% 的人口皈依为无神论，退还 #P 25#! 虔修点，并增加 #P 8#! 宗教协定。"
 ve_je_religious_project_complete_tt:0 "宗教工程已达成其目标。"
 ve_je_religious_project_fail_tt:0 "宗教工程已被取消。"

 ve_je_cultural_project:0 "文化工程"
 ve_je_cultural_project_reason:0 "政府正在指导一项长期的文化工程。行政力、合法性、教育、民族凝聚力以及地方状况决定了其推进速度。"
 ve_je_cultural_project_progress:0 "文化工程完成进度"
 ve_je_cultural_project_status_curriculum:0 "正在为国家的学校和机构筹备国民教育大纲。\n\n在 #Y 100#! 进度时完成：#P +20#! 文化赋权，#P +5#! 民族凝聚力，并获得持续 10 年的效果：+2% 受教育机会，+5% 资质，-25 行政力。"
 ve_je_cultural_project_status_symbols:0 "共同象征项目正在锻造共同的公民话语。\n\n在 #Y 75#! 进度时完成：#P +20#! 文化赋权，#P +7#! 民族凝聚力，并获得持续 8 年的效果：来自完全接纳人群的效忠派 +10% 以及 +25 权威力。"
 ve_je_cultural_project_status_ethnic:0 "在 [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 的族群一体化运动正推动少数族裔人口趋同于主流文化。\n\n在 #Y 125#! 进度时完成：将目标文化 5% 的人群同化为主流文化（若拥有民族主义 VII 则为 7%），#P +25#! 文化赋权，#P +8#! 民族凝聚力，以及一项为期 10 年的同化效果。"
 ve_je_cultural_project_status_civic:0 "在 [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 的平等公民倡议正在跨越文化界限推广共同的公民身份。\n\n在 #Y 100#! 进度时完成：获得持续 10 年的 +15% 接纳度、地区效忠派、#P +25#! 文化赋权、#P +10#! 民族凝聚力，以及一项为期 10 年的资质与移民效果。"
 ve_je_cultural_project_status_composite:0 "在 [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 的立宪协定正在复合国家内部就永久认可进行谈判。\n\n在 #Y 150#! 进度时完成（需要 40+ 民族凝聚力）：永久 +15% 接纳度，将该文化加入构成民族列表，地区效忠派，#P +30#! 文化赋权，#P +12#! 民族凝聚力。"
 ve_je_cultural_project_complete_tt:0 "文化工程已达成其目标。"
 ve_je_cultural_project_fail_tt:0 "文化工程已被取消。"
 ve_je_project_resolving_status:0 "工程管理部门正在提交其最终报告。"

 ve_evt_religious_incident_cooldown_mdf:0 "宗教工程事件冷却"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "工程管理部门正在消化近期事件带来的后果。"
 ve_evt_cultural_incident_cooldown_mdf:0 "文化工程事件冷却"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "工程管理部门正在消化近期事件带来的后果。"
 ve_evt_central_clergy_supported_mdf:0 "中央神职人员受支持"
 ve_evt_central_clergy_supported_mdf_desc:0 "政府维护了中央宗教等级制度的权威。"
 ve_evt_central_clergy_slighted_mdf:0 "中央神职人员遭怠慢"
 ve_evt_central_clergy_slighted_mdf_desc:0 "政府青睐地方习俗，而非中央宗教等级制度的偏好。"
 ve_evt_municipal_patronage_mdf:0 "市镇赞助网络"
 ve_evt_municipal_patronage_mdf_desc:0 "地方名流正通过削弱税收的安排来推进该工程。"

 ve_rel_evt.1.t:0 "地方名流的请愿"
 ve_rel_evt.1.d:0 "来自 [SCOPE.sState('ve_evt_target_state').GetName] 的神职人员、市政代表与街区长老组成的代表团向政府请愿，要求放缓国教化运动。他们警告称，缺乏弹性的时间表只会将依从变成持久的怨恨。"
 ve_rel_evt.1.f:0 "\"未经协商而强加的信仰，或许能填满名册，却会空置长椅。\""
 ve_rel_evt.1.a:0 "倾听他们的请愿。"
 ve_rel_evt.1.a.tt:0 "宗教工程进度减少 #N 4#!。\n宗教定居增加 #P 3#!。"
 ve_rel_evt.1.b:0 "时间表绝不更改。"
 ve_rel_evt.1.b.tt:0 "宗教工程进度增加 #P 5#!。\n宗教定居点减少 #N 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName] 中 #N 0.5%#! 的人口成为激进派。"
 ve_rel_evt.1.c:0 "委派值得信赖的调解人。"
 ve_rel_evt.1.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 3#!。\n宗教定居增加 #P 1#!。"

 ve_rel_evt.2.t:0 "外勤军官短缺"
 ve_rel_evt.2.d:0 "来自 [SCOPE.sState('ve_evt_target_state').GetName] 的报告指出，堆积如山的请愿无人回应、互相矛盾的指示层出不穷，各区甚至数周未见一名项目军官。国教化运动的推进速度已超出了负责执行的行政机构。"
 ve_rel_evt.2.f:0 "\"一道法令可以在一天内传遍全国，但合格的文吏却不能。\""
 ve_rel_evt.2.a:0 "雇佣临时外勤军官。"
 ve_rel_evt.2.a.tt:0 "花费 #N 15#! 虔修点。\n宗教工程进度增加 #P 4#!。"
 ve_rel_evt.2.b:0 "放缓计划。"
 ve_rel_evt.2.b.tt:0 "宗教工程进度减少 #N 6#!。\n宗教定居增加 #P 2#!。"
 ve_rel_evt.2.c:0 "动员中央登记骨干。"
 ve_rel_evt.2.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 5#!。"

 ve_cul_evt.1.t:0 "翻译局"
 ve_cul_evt.1.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] 的官员们对平等公民倡议应如何处理 [SCOPE.sCulture('ve_evt_target_culture').GetName] 语言各执己见。地方管理者希望设立双语办公室；中央各部则要求推行单一的行政标准。"
 ve_cul_evt.1.f:0 "\"公民不应当需要翻译，才能理解以自身名义赋予的权利。\""
 ve_cul_evt.1.a:0 "允许地方语言在公共机构中生存。"
 ve_cul_evt.1.a.tt:0 "文化工程进度减少 #N 4#!。\n国家凝聚力增加 #P 3#!。"
 ve_cul_evt.1.b:0 "强行推行单一的行政标准。"
 ve_cul_evt.1.b.tt:0 "文化工程进度增加 #P 5#!。\n国家凝聚力减少 #N 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName] 内的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口中有 #N 0.5%#! 变为激进派。"
 ve_cul_evt.1.c:0 "设立学术翻译委员会。"
 ve_cul_evt.1.c.tt:0 "花费 #N 10#! 文化赋权。\n文化工程进度增加 #P 3#!。\n国家凝聚力增加 #P 1#!。"

 ve_cul_evt.2.t:0 "地方教师短缺"
 ve_cul_evt.2.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] 的学校缺乏既能胜任国家课程、又能服务 [SCOPE.sCulture('ve_evt_target_culture').GetName] 社群的教师。若无训练有素的地方骨干，平等公民权恐将沦为仅存于官方文书上的空头承诺。"
 ve_cul_evt.2.f:0 "\"法律在下午宣布平等；而教室则必须用整整一代人的时间来教授它。\""
 ve_cul_evt.2.a:0 "资助新型师范学院。"
 ve_cul_evt.2.a.tt:0 "花费 #N 15#! 文化赋权。\n文化工程进度增加 #P 4#!。"
 ve_cul_evt.2.b:0 "放缓实施。"
 ve_cul_evt.2.b.tt:0 "文化工程进度减少 #N 6#!。\n国家凝聚力增加 #P 2#!。"
 ve_cul_evt.2.c:0 "利用现有的既有机构。"
 ve_cul_evt.2.c.tt:0 "花费 #N 10#! 文化赋权。\n文化工程进度增加 #P 5#!。\n国家凝聚力增加 #P 1#!。"

 ve_rel_evt.3.t:0 "冲突的登记册"
 ve_rel_evt.3.d:0 "教区名册、市政账簿以及工程官员的报告对[SCOPE.sState('ve_evt_target_state').GetName]的宗教信奉情况给出了截然不同的记载。行政部门必须决定是花时间查明真相，还是采用明知不确切的数据继续推进。"
 ve_rel_evt.3.f:0 "\"每个衙门都有一份确凿的总数。但没有哪两份总数是对得上的。\""
 ve_rel_evt.3.a:0 "进行全面审计。"
 ve_rel_evt.3.a.tt:0 "获得 #P 8#! 虔修点。\n宗教工程进度减少 #N 6#!。"
 ve_rel_evt.3.b:0 "以合理的估算继续推进。"
 ve_rel_evt.3.b.tt:0 "花费 #N 8#! 虔修点。\n宗教工程进度增加 #P 5#!。"
 ve_rel_evt.3.c:0 "使用神圣行政登记册。"
 ve_rel_evt.3.c.tt:0 "宗教工程进度增加 #P 3#!。"

 ve_rel_evt.4.t:0 "谣言与针锋相对的布道"
 ve_rel_evt.4.d:0 "小册子、街头布道和焦虑的流言如今将[SCOPE.sState('ve_evt_target_state').GetName]的国教化运动描述为对地方生活的侵犯。官员们警告称，保持沉默将使反对者定义该工程，而打压则可能坐实他们最恶毒的宣称。"
 ve_rel_evt.4.f:0 "\"流言不需要衙门、印信或预算。\""
 ve_rel_evt.4.a:0 "举行公开听证会。"
 ve_rel_evt.4.a.tt:0 "宗教工程进度减少 #N 3#!。\n宗教定居增加 #P 3#!。\n[SCOPE.sState('ve_evt_target_state').GetName] #P 0.5%#! 的人口成为效忠派。"
 ve_rel_evt.4.b:0 "惩治鼓动者。"
 ve_rel_evt.4.b.tt:0 "宗教工程进度增加 #P 4#!。\n宗教定居减少 #N 3#!。\n[SCOPE.sState('ve_evt_target_state').GetName] #N 1%#! 的人口成为激进派。"
 ve_rel_evt.4.c:0 "公布记录与成果。"
 ve_rel_evt.4.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 2#!。\n宗教定居增加 #P 1#!。"

 ve_rel_evt.5.t:0 "布道的语言"
 ve_rel_evt.5.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的工程神职人员报告称，正式的布道维持了教义的统一，却未能触及广大信众。使用地方语言布道将使运动推得更远，尽管中央高层担心这种适应会演变成独立。"
 ve_rel_evt.5.f:0 "\"未被听闻的神圣话语被完美地保存了——却无人接收。\""
 ve_rel_evt.5.a:0 "使用地方语言布道。"
 ve_rel_evt.5.a.tt:0 "宗教工程进度增加 #P 6#!。\n虔信者支持度减少 #N 1#!，持续 #Y 2.5年#!。"
 ve_rel_evt.5.b:0 "维护礼仪的统一。"
 ve_rel_evt.5.b.tt:0 "宗教工程进度减少 #N 3#!。\n宗教定居增加 #P 3#!。\n虔信者支持度增加 #P 1#!，持续 #Y 2.5年#!。"
 ve_rel_evt.5.c:0 "培训受过教育的译介人员。"
 ve_rel_evt.5.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 4#!。\n宗教定居增加 #P 1#!。"

 ve_rel_evt.6.t:0 "互为宿敌的教会当局"
 ve_rel_evt.6.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的中央委派官员与本土既有神职人员各自宣称拥有领导国教化运动的权力。支持某一方或许能迅速恢复指挥，但这场争端已演变为究竟谁能代表信仰的考验。"
 ve_rel_evt.6.f:0 "\"这场争吵关乎管辖权，而机构正是以此来描述权力的。\""
 ve_rel_evt.6.a:0 "支持中央神职人员。"
 ve_rel_evt.6.a.tt:0 "宗教工程进度增加 #P 5#!。\n虔信者支持度增加 #P 1#!，持续 #Y 2.5年#!。\n宗教定居减少 #N 3#!。\n[SCOPE.sState('ve_evt_target_state').GetName] #N 0.5%#! 的人口成为激进派。"
 ve_rel_evt.6.b:0 "安抚地方神职人员。"
 ve_rel_evt.6.b.tt:0 "宗教工程进度减少 #N 4#!。\n虔信者支持度减少 #N 1#!，持续 #Y 2.5年#!。\n宗教定居增加 #P 3#!。"
 ve_rel_evt.6.c:0 "以文字明确他们的权力。"
 ve_rel_evt.6.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 3#!。\n宗教定居增加 #P 1#!。"

 ve_cul_evt.3.t:0 "人口普查的分类"
 ve_cul_evt.3.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的普查官员无法就如何记录[SCOPE.sCulture('ve_evt_target_culture').GetName]文化的公民达成一致。当地受访者使用的是重叠的身份认同，而中央表格则要求在一个格子中填入一个答案。"
 ve_cul_evt.3.f:0 "\"分类简化了账本，远早于它简化国家。\""
 ve_cul_evt.3.a:0 "允许自主申报身份。"
 ve_cul_evt.3.a.tt:0 "文化工程进度减少 #N 4#!。\n国家凝聚力增加 #P 4#!。"
 ve_cul_evt.3.b:0 "分类将由中央统一设定。"
 ve_cul_evt.3.b.tt:0 "文化工程进度增加 #P 6#!。\n国家凝聚力减少 #N 4#!。\n[SCOPE.sState('ve_evt_target_state').GetName]中 #N 0.5%#! 的[SCOPE.sCulture('ve_evt_target_culture').GetName]人口变为激进派。"
 ve_cul_evt.3.c:0 "使用现代户籍制度。"
 ve_cul_evt.3.c.tt:0 "花费 #N 10#! 文化授权。\n文化工程进度增加 #P 5#!。\n国家凝聚力增加 #P 1#!。"

 ve_cul_evt.4.t:0 "市镇显贵"
 ve_cul_evt.4.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的市镇赞助人愿意提供他们的办事处、门客和影响力，以推进[SCOPE.sCulture('ve_evt_target_culture').GetName]人口的平等公民权。他们的合作本会很迅速，但其代价是继续保持对地方赋税的控制。"
 ve_cul_evt.4.f:0 "\"通往市政厅的最短道路要穿过好几间私人客厅。\""
 ve_cul_evt.4.a:0 "利用地方网络。"
 ve_cul_evt.4.a.tt:0 "文化工程进度增加 #P 5#!。\n[SCOPE.sState('ve_evt_target_state').GetName]失去 #N 5%#! 赋税能力，持续 #Y 2年#!。"
 ve_cul_evt.4.b:0 "建立公开委员会。"
 ve_cul_evt.4.b.tt:0 "文化工程进度减少 #N 3#!。\n国家凝聚力增加 #P 3#!。"
 ve_cul_evt.4.c:0 "谈判达成一项基于规则的协议。"
 ve_cul_evt.4.c.tt:0 "花费 #N 10#! 文化授权。\n文化工程进度增加 #P 3#!。\n国家凝聚力增加 #P 1#!。"

 ve_cul_evt.5.t:0 "公务员考试"
 ve_cul_evt.5.d:0 "向[SCOPE.sCulture('ve_evt_target_culture').GetName]考生开放公务员体系考试，暴露出法律上的平等与实际准备之间的差距。立即准入在象征意义上举足轻重，但多年的教育不平等无法凭法令一笔勾销。"
 ve_cul_evt.5.f:0 "\"当只有唯一一位候选人被教授其语言时，同样的考试便不再意味着同样的机会。\""
 ve_cul_evt.5.a:0 "资助预备课程。"
 ve_cul_evt.5.a.tt:0 "花费 #N 15#! 文化授权。\n文化工程进度增加 #P 5#!。\n国家凝聚力增加 #P 2#!。"
 ve_cul_evt.5.b:0 "立即开始同等准入。"
 ve_cul_evt.5.b.tt:0 "文化工程进度增加 #P 7#!。\n国家凝聚力减少 #N 4#!。\n[SCOPE.sState('ve_evt_target_state').GetName]中 #N 0.5%#! 的人口变为激进派。"
 ve_cul_evt.5.c:0 "动员学校与福利网络。"
 ve_cul_evt.5.c.tt:0 "花费 #N 10#! 文化授权。\n文化工程进度增加 #P 5#!。\n国家凝聚力增加 #P 2#!。"
 ve_cul_evt.5.e:0 "首先改革考试制度。"
 ve_cul_evt.5.e.tt:0 "文化工程进度减少 #N 4#!。\n国家凝聚力增加 #P 3#!。"

 ve_cul_evt.6.t:0 "多数派的阻力"
 ve_cul_evt.6.d:0 "平等公民倡议的反对者声称，将共同权利扩大到[SCOPE.sCulture('ve_evt_target_culture').GetName]人口会降低其他所有人的地位。[SCOPE.sState('ve_evt_target_state').GetName]的示威活动正将一项行政改革演变为一场国家政治考验。"
 ve_cul_evt.6.f:0 "\"被共享的权利正在被斥为被窃取的特权。\""
 ve_cul_evt.6.a:0 "公开捍卫该倡议。"
 ve_cul_evt.6.a.tt:0 "文化工程进度增加 #P 4#!。\n国家凝聚力减少 #N 4#!。\n[SCOPE.sState('ve_evt_target_state').GetName]中 #N 1%#! 的人口变为激进派。"
 ve_cul_evt.6.b:0 "放慢推行步伐。"
 ve_cul_evt.6.b.tt:0 "文化工程进度减少 #N 5#!。\n国家凝聚力增加 #P 3#!。"
 ve_cul_evt.6.c:0 "动员改革派联盟。"
 ve_cul_evt.6.c.tt:0 "花费 #N 10#! 文化授权。\n文化工程进度增加 #P 3#!。\n国家凝聚力增加 #P 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName]中 #P 0.5%#! 的[SCOPE.sCulture('ve_evt_target_culture').GetName]人口变为效忠派。"

 ve_rel_evt.7.t:0 "濒临崩溃的布道"
 ve_rel_evt.7.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的国教化运动已濒临行政与政治崩溃。各部门已停止相互应答，公众抵制情绪日益顽固，实地神职人员也警告称，目前的状况已无法让布道继续下去。"
 ve_rel_evt.7.f:0 "\"报告依然称之为临时的困难。而街头却为其选择了更严厉的称呼。\""
 ve_rel_evt.7.a:0 "接受损失并撤回。"
 ve_rel_evt.7.a.tt:0 "取消该宗教工程，且不退还虔修点。\n宗教协定减少 #N 5#!。\n持续 #Y 2 年#!：#N -50#! 行政力、#N -50#! 权威力，以及 #N -3%#! 立法成功。"
 ve_rel_evt.7.b:0 "调拨紧急资源。"
 ve_rel_evt.7.b.tt:0 "花费 #N 25#! 虔修点。\n宗教工程进度减少 #N 5#!。\n[SCOPE.sState('ve_evt_target_state').GetName]有 #N 1%#! 的人口变为激进派。\n工程将继续推进。"
 ve_rel_evt.7.c:0 "以精简人员继续推进。"
 ve_rel_evt.7.c.tt:0 "宗教工程进度减少 #N 10#!。\n宗教协定减少 #N 2#!。\n工程将继续推进。"
 ve_rel_evt.7.e:0 "重新协商方法。"
 ve_rel_evt.7.e.tt:0 "花费 #N 15#! 虔修点。\n宗教工程进度减少 #N 3#!。\n宗教协定增加 #P 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName]有 #N 0.5%#! 的人口变为激进派。\n工程将继续推进。"

 ve_cul_evt.7.t:0 "倡议失去合法性"
 ve_cul_evt.7.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的平等公民倡议正失去来自既有机构以及本应为其服务的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 社区的支持。激进派运动现在将每一项妥协都描绘成政府无法兑现平等的证明。"
 ve_cul_evt.7.f:0 "\"一场改革或许能在反对中存活。但它无法在变得不可信时存活。\""
 ve_cul_evt.7.a:0 "终止该倡议。"
 ve_cul_evt.7.a.tt:0 "取消该文化工程，且不退还文化赋权。\n民族凝聚力减少 #N 5#!。\n持续 #Y 2 年#!：#N -50#! 行政力、#N -25#! 权威力，以及 #N -3%#! 立法成功。"
 ve_cul_evt.7.b:0 "发放地方紧急津贴。"
 ve_cul_evt.7.b.tt:0 "花费 #N 25#! 文化赋权。\n文化工程进度减少 #N 5#!。\n[SCOPE.sState('ve_evt_target_state').GetName]有 #N 1%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口变为激进派。\n工程将继续推进。"
 ve_cul_evt.7.c:0 "以最低限度的方案继续推进。"
 ve_cul_evt.7.c.tt:0 "文化工程进度减少 #N 10#!。\n民族凝聚力减少 #N 2#!。\n工程将继续推进。"
 ve_cul_evt.7.e:0 "重建政治联盟。"
 ve_cul_evt.7.e.tt:0 "花费 #N 15#! 文化赋权。\n文化工程进度减少 #N 3#!。\n民族凝聚力增加 #P 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName]有 #N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口变为激进派。\n工程将继续推进。"

 ve_rel_evt.8.t:0 "意料之外的地方和解"
 ve_rel_evt.8.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的神职人员、市政官员和社区长老达成了一项任何中央指令都无法达成的协议。地方反抗正在消退，会众们正亲自协调布道工作，国教化运动获得了意料之外的声势。"
 ve_rel_evt.8.f:0 "\"最初来自首都的命令，已化作在城镇广场上达成的契约。\""
 ve_rel_evt.8.a:0 "全力利用这一声势。"
 ve_rel_evt.8.a.tt:0 "宗教协定增加 #P 1#!。\n宗教工程进度增加 #P 25#!。\n若进度达到 #Y 100#!，将应用该工程的常规完成效果。"
 ve_rel_evt.8.b:0 "持久优先于速度。"
 ve_rel_evt.8.b.tt:0 "宗教协定增加 #P 4#!。\n宗教工程进度增加 #P 10#!。\n若进度达到 #Y 100#!，将应用该工程的常规完成效果。"

 ve_cul_evt.8.t:0 "地方公民联盟"
 ve_cul_evt.8.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的教师、市政官员、贸易协会以及 [SCOPE.sCulture('ve_evt_target_culture').GetName] 社区代表已成立了一个共同委员会。通过在争议抵达首都之前将其解决，该联盟为平等公民倡议赋予了行政机构所无法营造的声势。"
 ve_cul_evt.8.f:0 "\"当鲜少共聚一堂的机构开始分担责任时，公民身份便成为了现实。\""
 ve_cul_evt.8.a:0 "利用该联盟的声势。"
 ve_cul_evt.8.a.tt:0 "民族凝聚力增加 #P 1#!。\n文化工程进度增加 #P 25#!。\n若进度达到 #Y 100#!，将应用该工程的常规完成效果。"
 ve_cul_evt.8.b:0 "将这些机构常态化。"
 ve_cul_evt.8.b.tt:0 "民族凝聚力增加 #P 4#!。\n文化工程进度增加 #P 10#!。\n若进度达到 #Y 100#!，将应用该工程的常规完成效果。"

 ve_rel_evt.40.t:0 "脱节的记录"
 ve_rel_evt.40.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的省级名册在统计会众、公民协会以及公共机构时使用了不相容的分类。送抵首都的报告如今互相矛盾，致使该工程无法辨别究竟是顺从还是抵抗。"
 ve_rel_evt.40.f:0 "\"通过三本帐册管理的政策，很快就会衍生出三种不同的现实。\""
 ve_rel_evt.40.a:0 "派遣中央审计组。"
 ve_rel_evt.40.a.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 5#!。\n宗教定居增加 #P 1#!。"
 ve_rel_evt.40.b:0 "在地方上调和记录。"
 ve_rel_evt.40.b.tt:0 "宗教工程进度减少 #N 3#!。\n宗教定居增加 #P 2#!。"
 ve_rel_evt.40.c:0 "应用标准登记程序。"
 ve_rel_evt.40.c.tt:0 "花费 #N 5#! 虔修点。\n宗教工程进度增加 #P 4#!。\n宗教定居增加 #P 1#!。"

 ve_rel_evt.41.t:0 "地方人员短缺"
 ve_rel_evt.41.d:0 "在[SCOPE.sState('ve_evt_target_state').GetName]指导该工程的办事处无法找到足够受过训练的职员、教师和视察员。指令积压的速度超出了地方官员解读的速度，仓促的任命恐将使每一场争端雪上加霜。"
 ve_rel_evt.41.f:0 "\"法令一日便可下达，而能够执行它的人或许需要一代人的时间。\""
 ve_rel_evt.41.a:0 "资助一支新的官员骨干队伍。"
 ve_rel_evt.41.a.tt:0 "花费 #N 15#! 虔修点。\n宗教工程进度增加 #P 6#!。"
 ve_rel_evt.41.b:0 "放缓推行步伐。"
 ve_rel_evt.41.b.tt:0 "宗教工程进度减少 #N 6#!。\n宗教定居增加 #P 2#!。"
 ve_rel_evt.41.c:0 "利用现有的教育网络。"
 ve_rel_evt.41.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 5#!。\n宗教定居增加 #P 1#!。"

 ve_rel_evt.42.t:0 "全区流言四起"
 ve_rel_evt.42.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的流言声称，该工程隐藏着比政府所公布的更为严厉的举措。宗教组织者和地方鼓动者反复传播着相互矛盾的说法，而官方的沉默则给每一个新版本的流言留下了蔓延的空间。"
 ve_rel_evt.42.f:0 "\"流言不需要办公室、预算，也不需要署名。\""
 ve_rel_evt.42.a:0 "公布报告。"
 ve_rel_evt.42.a.tt:0 "宗教工程进度减少 #N 3#!。\n宗教定居增加 #P 4#!。"
 ve_rel_evt.42.b:0 "驳斥煽动。"
 ve_rel_evt.42.b.tt:0 "宗教工程进度增加 #P 5#!。\n宗教定居减少 #N 3#!。\n[SCOPE.sState('ve_evt_target_state').GetName] #N 1%#! 的人口成为激进派。"
 ve_rel_evt.42.c:0 "委任地方调解人。"
 ve_rel_evt.42.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 4#!。\n宗教定居增加 #P 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName] #P 0.5%#! 的人口成为效忠派。"

 ve_rel_evt.43.t:0 "行政体系濒临崩溃"
 ve_rel_evt.43.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的工程正濒临行政崩溃。省级办事处不堪重负，公众信心已经破裂，有组织的反对势力如今将每一项新指令都视作政府已然失控的证据。"
 ve_rel_evt.43.f:0 "\"当文件停止流转时，危机便流转到了街头。\""
 ve_rel_evt.43.a:0 "终止计划。"
 ve_rel_evt.43.a.tt:0 "取消该宗教工程，且不退还虔修点。\n宗教定居减少 #N 5#!。\n在 #Y 2 年#! 内： #N -50#! 行政力，#N -50#! 权威力，且 #N -3%#! 立法成功。"
 ve_rel_evt.43.b:0 "调拨紧急资源。"
 ve_rel_evt.43.b.tt:0 "花费 #N 25#! 虔修点。\n宗教工程进度减少 #N 5#!。\n[SCOPE.sState('ve_evt_target_state').GetName] #N 1%#! 的人口成为激进派。\n工程继续进行。"
 ve_rel_evt.43.c:0 "以精简人员继续推进。"
 ve_rel_evt.43.c.tt:0 "宗教工程进度减少 #N 10#!。\n宗教定居减少 #N 2#!。\n工程继续进行。"
 ve_rel_evt.43.e:0 "重建地方合作关系。"
 ve_rel_evt.43.e.tt:0 "花费 #N 15#! 虔修点。\n宗教工程进度减少 #N 3#!。\n宗教定居增加 #P 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName] #N 0.5%#! 的人口成为激进派。\n工程继续进行。"

 ve_rel_evt.100.t:0 "跨宗教委员会的席位"
 ve_rel_evt.100.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的代表们一致认为设立跨宗教委员会确有必要，但在谁有资格获得席位上未能达成共识。比例代表制将令小型社群感到安心，而由首都拟定的固定宗教协定则能立即开始运作。"
 ve_rel_evt.100.f:0 "\"在数清椅子之前，人人都支持一张公共餐桌。\""
 ve_rel_evt.100.a:0 "按人口分配代表权。"
 ve_rel_evt.100.a.tt:0 "宗教工程进度减少 #N 3#!。\n宗教协定增加 #P 4#!。"
 ve_rel_evt.100.b:0 "强行推行固定的中央妥协方案。"
 ve_rel_evt.100.b.tt:0 "宗教工程进度增加 #P 5#!。\n宗教协定减少 #N 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName]中 #N 0.5%#! 的人口成为激进派。"
 ve_rel_evt.100.c:0 "赋权跨宗教委员会。"
 ve_rel_evt.100.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 5#!。\n宗教协定增加 #P 2#!。"

 ve_rel_evt.101.t:0 "共同学校课程"
 ve_rel_evt.101.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的学校需要共同的公民课，同时又不能将自由宣抚变成一场反对地方信仰的运动。教师们要求提供清晰的教材与联合培训，而社群领袖则坚持本土教学必须为他们的传统保留空间。"
 ve_rel_evt.101.f:0 "\"共同的课程唯有在每个家庭都将教室视作自己人时才能成功。\""
 ve_rel_evt.101.a:0 "资助一支共同的教学骨干队伍。"
 ve_rel_evt.101.a.tt:0 "花费 #N 15#! 虔修点。\n宗教工程进度增加 #P 6#!。\n宗教协定增加 #P 1#!。"
 ve_rel_evt.101.b:0 "为地方课程留出空间。"
 ve_rel_evt.101.b.tt:0 "宗教工程进度减少 #N 4#!。\n宗教协定增加 #P 3#!。"
 ve_rel_evt.101.c:0 "将改革联盟引入学校。"
 ve_rel_evt.101.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 5#!。\n宗教协定增加 #P 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName]中 #P 0.5%#! 的人口成为效忠派。"

 ve_rel_evt.102.t:0 "相互保证宪章"
 ve_rel_evt.102.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的宗教社群、市政官员与改革协会起草了一份共同宪章。每一位签署方都接受相同的公民义务，以换取公共保证：没有任何社群会被排除在地方机构之外。"
 ve_rel_evt.102.f:0 "\"当每一项承诺都被写成另一方的权利时，信任便成为了可能。\""
 ve_rel_evt.102.a:0 "利用契约的声势。"
 ve_rel_evt.102.a.tt:0 "宗教协定增加 #P 2#!。\n宗教工程进度增加 #P 20#!。\n若进度达到 #Y 100#!，将应用该工程的常规完成效果。"
 ve_rel_evt.102.b:0 "使各项保证永久化。"
 ve_rel_evt.102.b.tt:0 "宗教协定增加 #P 4#!。\n[SCOPE.sState('ve_evt_target_state').GetName]中 #P 0.5%#! 的人口成为效忠派。\n宗教工程进度增加 #P 10#!。\n若进度达到 #Y 100#!，将应用该工程的常规完成效果。"

 ve_rel_evt.150.t:0 "教师还是视察员？"
 ve_rel_evt.150.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的世俗化运动暴露出了识字人员的短缺。行政部门可以扩建能够构建长期公民能力的教学队伍，或是依靠能够用现有人员执行新规则的视察员。"
 ve_rel_evt.150.f:0 "\"视察员可以在一个下午关闭一所学校。而教师可能需要数年才能取代那里曾被教导的东西。\""
 ve_rel_evt.150.a:0 "扩建教学队伍。"
 ve_rel_evt.150.a.tt:0 "花费 #N 15#! 虔修点。\n宗教工程进度增加 #P 6#!。"
 ve_rel_evt.150.b:0 "放慢计划以匹配现有人员。"
 ve_rel_evt.150.b.tt:0 "宗教工程进度减少 #N 5#!。\n宗教协定增加 #P 2#!。"
 ve_rel_evt.150.c:0 "委任公共教育网络。"
 ve_rel_evt.150.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 5#!。\n宗教协定增加 #P 1#!。"

 ve_rel_evt.151.t:0 "被没收的财产"
 ve_rel_evt.151.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的前宗教财产已准备好改建为学校、诊所和市政办公处。立即移交将为这项运动提供宝贵的基础设施，但缺乏补偿正成为虔信者集会的焦点。"
 ve_rel_evt.151.f:0 "\"钥匙在一个早晨易手。关于所有权的争论将比门锁更持久。\""
 ve_rel_evt.151.a:0 "分阶段支付补偿。"
 ve_rel_evt.151.a.tt:0 "花费 #N 15#! 虔修点。\n宗教工程进度增加 #P 3#!。\n宗教协定增加 #P 3#!。"
 ve_rel_evt.151.b:0 "立即将财产投入公共服务。"
 ve_rel_evt.151.b.tt:0 "宗教工程进度增加 #P 7#!。\n宗教协定减少 #N 4#!。\n[SCOPE.sState('ve_evt_target_state').GetName] #N 1%#! 的人口成为激进派。\n虔信者失去 #N 1#! 支持度，持续 #Y 2.5 年#!。"
 ve_rel_evt.151.c:0 "将其移交给世俗福利机构。"
 ve_rel_evt.151.c.tt:0 "花费 #N 10#! 虔修点。\n宗教工程进度增加 #P 5#!。\n宗教协定增加 #P 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName] #P 0.5%#! 的人口成为效忠派。"

 ve_rel_evt.152.t:0 "公民协会扎根"
 ve_rel_evt.152.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的教师圈子、互助社和市政协会已经开始提供曾经通过宗教机构组织的各项服务。它们的合作赋予了世俗化运动一个地方公民基础，而不仅仅是一个行政存在。"
 ve_rel_evt.152.f:0 "\"当公民开始自行维护新秩序而不等待视察员时，新秩序便得以延续。\""
 ve_rel_evt.152.a:0 "利用地方声势。"
 ve_rel_evt.152.a.tt:0 "宗教协定增加 #P 2#!。\n宗教工程进度增加 #P 20#!。\n若进度达到 #Y 100#!，则应用该工程的常规完成效果。"
 ve_rel_evt.152.b:0 "将协会转变为常设机构。"
 ve_rel_evt.152.b.tt:0 "宗教协定增加 #P 4#!。\n宗教工程进度增加 #P 10#!。\n若进度达到 #Y 100#!，则应用该工程的常规完成效果。"

 ve_cul_evt.40.t:0 "地方学校理事会"
 ve_cul_evt.40.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的学校理事会就[SCOPE.sCulture('ve_evt_target_culture').GetName]语言在公共教育中的地位产生分歧。本地语言教学将保持信任，而单一的行政语言将使国家工程更易于指导。"
 ve_cul_evt.40.f:0 "\"为第一堂课选择的语言往往决定了谁相信学校属于他们。\""
 ve_cul_evt.40.a:0 "保护本地语言。"
 ve_cul_evt.40.a.tt:0 "文化工程进度减少 #N 4#!。\n凝聚力增加 #P 3#!。"
 ve_cul_evt.40.b:0 "强加单一行政语言。"
 ve_cul_evt.40.b.tt:0 "文化工程进度增加 #P 5#!。\n凝聚力减少 #N 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName]的[SCOPE.sCulture('ve_evt_target_culture').GetName]人口中 #N 0.5%#! 成为激进派。"
 ve_cul_evt.40.c:0 "扩大教师网络。"
 ve_cul_evt.40.c.tt:0 "花费 #N 10#! 文化赋权。\n文化工程进度增加 #P 4#!。\n凝聚力增加 #P 2#!。"

 ve_cul_evt.41.t:0 "统计边界"
 ve_cul_evt.41.d:0 "调查[SCOPE.sState('ve_evt_target_state').GetName]的官员无法就[SCOPE.sCulture('ve_evt_target_culture').GetName]社群的起止范围达成一致。地方身份在语言、区域和习俗上相互重叠，但国家工程需要能够被统计和管理的分类。"
 ve_cul_evt.41.f:0 "\"为人口普查划定的边界很快就会获得官员、预算和捍卫者。\""
 ve_cul_evt.41.a:0 "为自我认同留出空间。"
 ve_cul_evt.41.a.tt:0 "文化工程进度减少 #N 3#!。\n凝聚力增加 #P 3#!。"
 ve_cul_evt.41.b:0 "由中央定义边界。"
 ve_cul_evt.41.b.tt:0 "文化工程进度增加 #P 6#!。\n凝聚力减少 #N 3#!。\n[SCOPE.sState('ve_evt_target_state').GetName]的[SCOPE.sCulture('ve_evt_target_culture').GetName]人口中 #N 0.5%#! 成为激进派。"
 ve_cul_evt.41.c:0 "使用标准注册系统。"
 ve_cul_evt.41.c.tt:0 "花费 #N 10#! 文化赋权。\n文化工程进度增加 #P 5#!。\n凝聚力增加 #P 1#!."

 ve_cul_evt.42.t:0 "濒临崩溃的国家工程"
 ve_cul_evt.42.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的国家工程正接近崩溃。激进派运动声称政府要么背叛了[SCOPE.sCulture('ve_evt_target_culture').GetName]社群，要么向其妥协投降，而地方办公机构已不再具备强行推行又一次妥协的信心。"
 ve_cul_evt.42.f:0 "\"一项既被指责为强迫、又被指责为投降的调解，或许很快便不再成其为调解了。\""
 ve_cul_evt.42.a:0 "终止工程。"
 ve_cul_evt.42.a.tt:0 "取消文化工程且不退还文化赋权。\n国家凝聚力减少 #N 5#!。\n持续 #Y 2 年#!：行政力 #N -50#!，权威力 #N -25#!，且法律立法成功 #N -3%#!。"
 ve_cul_evt.42.b:0 "调配紧急地方资源。"
 ve_cul_evt.42.b.tt:0 "花费 #N 25#! 文化赋权。\n文化工程进度减少 #N 5#!。\n[SCOPE.sState('ve_evt_target_state').GetName]内 #N 1%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口变为激进派。\n工程得以继续。"
 ve_cul_evt.42.c:0 "以最低限度方案继续。"
 ve_cul_evt.42.c.tt:0 "文化工程进度减少 #N 10#!。\n国家凝聚力减少 #N 2#!。\n工程得以继续。"
 ve_cul_evt.42.e:0 "重建谈判框架。"
 ve_cul_evt.42.e.tt:0 "花费 #N 15#! 文化赋权。\n文化工程进度减少 #N 3#!。\n国家凝聚力增加 #P 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName]内 #N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口变为激进派。\n工程得以继续。"

 ve_cul_evt.50.t:0 "姓氏与语言指令"
 ve_cul_evt.50.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的官员提议在国家语言中统一姓氏与公共档案。该指令将使中央行政部门更易于对[SCOPE.sCulture('ve_evt_target_culture').GetName]人口进行归类，但各家庭却担忧私人身份正沦为国家指挥的对象。"
 ve_cul_evt.50.f:0 "\"登记册中书写方式不同的姓名，或许依然是一个家庭铭记自身的方式。\""
 ve_cul_evt.50.a:0 "资助一项逐步推进的注册运动。"
 ve_cul_evt.50.a.tt:0 "花费 #N 10#! 文化赋权。\n文化工程进度增加 #P 4#!。\n国家凝聚力增加 #P 1#!。\n[SCOPE.sState('ve_evt_target_state').GetName]内 #N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口变为激进派。"
 ve_cul_evt.50.b:0 "强行推行单一国家标准。"
 ve_cul_evt.50.b.tt:0 "文化工程进度增加 #P 7#!。\n国家凝聚力减少 #N 4#!。\n[SCOPE.sState('ve_evt_target_state').GetName]内 #N 1%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口变为激进派。"
 ve_cul_evt.50.c:0 "撤回该指令以作修改。"
 ve_cul_evt.50.c.tt:0 "文化工程进度减少 #N 5#!。\n国家凝聚力增加 #P 3#!。"

 ve_cul_evt.51.t:0 "征兵登记册"
 ve_cul_evt.51.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]的军事官员要求建立一份统一的服务义务、姓氏与指挥登记册。将其应用于[SCOPE.sCulture('ve_evt_target_culture').GetName]人口将巩固族群整合进程，然而各社群的抵触情绪正在加剧，他们将陆军视为文化清洗的又一工具。"
 ve_cul_evt.51.f:0 "\"当国家想要征收赋税或召唤其子弟时，它才会第一次知晓村庄各人的姓名。\""
 ve_cul_evt.51.a:0 "应用国家登记册。"
 ve_cul_evt.51.a.tt:0 "文化工程进度增加 #P 5#!。\n国家凝聚力减少 #N 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName]内 #N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口变为激进派。"
 ve_cul_evt.51.b:0 "保留地方登记惯例。"
 ve_cul_evt.51.b.tt:0 "文化工程进度减少 #N 3#!。\n国家凝聚力增加 #P 3#!。"
 ve_cul_evt.51.c:0 "通过兵役整合登记册。"
 ve_cul_evt.51.c.tt:0 "花费 #N 10#! 文化赋权。\n文化工程进度增加 #P 6#!。\n国家凝聚力增加 #P 1#!。\n[SCOPE.sState('ve_evt_target_state').GetName]内 #N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口变为激进派。"

 ve_cul_evt.100.t:0 "立宪代表团"
 ve_cul_evt.100.d:0 "来自 [SCOPE.sState('ve_evt_target_state').GetName] 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 族群代表团已经抵达，要求在立宪协定的机构中获得代表权。通过谈判解决可以放慢项目进度但能增强其合法性；而自首都强加解决方案则能加快推进，但代价是失去信任。"
 ve_cul_evt.100.f:0 "\"只有当每一位立宪成员都能指出一条他们参与撰写的条款时，一份协定才能真正为大众所共有。\""
 ve_cul_evt.100.a:0 "通过谈判决定他们在协定中的地位。"
 ve_cul_evt.100.a.tt:0 "文化工程进度减少 #N 4#!。\n国家凝聚力增加 #P 4#!。"
 ve_cul_evt.100.b:0 "强行推行中央解决方案。"
 ve_cul_evt.100.b.tt:0 "文化工程进度增加 #P 5#!。\n国家凝聚力减少 #N 2#!。\n[SCOPE.sState('ve_evt_target_state').GetName] 中 #N 0.5%#! 的 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口变为激进派。"
 ve_cul_evt.100.c:0 "将议会联盟纳入谈判。"
 ve_cul_evt.100.c.tt:0 "消耗 #N 10#! 文化赋权。\n文化工程进度增加 #P 4#!。\n国家凝聚力增加 #P 2#!。"

 ve_cul_evt.101.t:0 "双重行政体系"
 ve_cul_evt.101.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] 的立宪协定现正依赖于两套重叠的行政体系。中央官员与 [SCOPE.sCulture('ve_evt_target_culture').GetName] 族群代表重复登记、争夺任命并发布相互矛盾的指示，而国家的行政力已近枯竭。"
 ve_cul_evt.101.f:0 "\"两个办公室分享权威力，比分享一个文件柜要容易得多。\""
 ve_cul_evt.101.a:0 "资助联合行政人员队伍。"
 ve_cul_evt.101.a.tt:0 "消耗 #N 15#! 文化赋权。\n文化工程进度增加 #P 6#!。"
 ve_cul_evt.101.b:0 "暂缓协定，直至各部门达成一致。"
 ve_cul_evt.101.b.tt:0 "文化工程进度减少 #N 6#!。\n国家凝聚力增加 #P 2#!。"
 ve_cul_evt.101.c:0 "将各部门统一于公务员体系之下。"
 ve_cul_evt.101.c.tt:0 "消耗 #N 10#! 文化赋权。\n文化工程进度增加 #P 5#!。\n国家凝聚力增加 #P 2#!。"

 ve_cul_evt.150.t:0 "在各省推行"
 ve_cul_evt.150.d:0 "各省行政部门报告称，全国范围内的文化工程正以截然不同的速度推进。一些办公室要求提供资金支持以组建执行委员会，而另一些则警告称，将单一的时间表强加于每个地区将耗尽稀缺的人员并削弱公众的信心。"
 ve_cul_evt.150.f:0 "\"一项国家法令只需书写一次，但必须在国家的每一个办公机构中付诸实施。\""
 ve_cul_evt.150.a:0 "资助执行委员会。"
 ve_cul_evt.150.a.tt:0 "消耗 #N 10#! 文化赋权。\n文化工程进度增加 #P 5#!。"
 ve_cul_evt.150.b:0 "采用渐进的时间表。"
 ve_cul_evt.150.b.tt:0 "文化工程进度减少 #N 4#!。\n国家凝聚力增加 #P 2#!。"
 ve_cul_evt.150.c:0 "标准化现有行政体系。"
 ve_cul_evt.150.c.tt:0 "消耗 #N 5#! 文化赋权。\n文化工程进度增加 #P 3#!。\n国家凝聚力增加 #P 2#!。"

 ve_cul_evt.151.t:0 "教学语言"
 ve_cul_evt.151.d:0 "国民教育大纲要求统一教学语言，然而全国各地的学校所服务的族群却拥有截然不同的语言传统。多语种教材将能维护信心但会延迟发放，而单一课程则能迅速进入教室，但这会将教育演变为文化竞争的风险。"
 ve_cul_evt.151.f:0 "\"一堂用学生所不信任的语言教授的课程，其内容可能会被忘得精光，唯独不信任除外。\""
 ve_cul_evt.151.a:0 "资助多语种教材。"
 ve_cul_evt.151.a.tt:0 "消耗 #N 10#! 文化赋权。\n文化工程进度增加 #P 3#!。\n国家凝聚力增加 #P 3#!。"
 ve_cul_evt.151.b:0 "应用单一的国民教育大纲。"
 ve_cul_evt.151.b.tt:0 "文化工程进度增加 #P 6#!。\n国家凝聚力减少 #N 3#!。"
 ve_cul_evt.151.c:0 "联合教学与福利网络。"
 ve_cul_evt.151.c.tt:0 "消耗 #N 10#! 文化赋权。\n文化工程进度增加 #P 5#!。\n国家凝聚力增加 #P 2#!。"

 ve_cul_evt.160.t:0 "谁来代表民族？"
 ve_cul_evt.160.d:0 "共同象征工程重新引发了关于谁的历史、军服、奇观与典礼能够代表整个国家的争论。轮换传统将扩大认可，但会延缓共识的达成；确立单一的官方叙事将带来清晰度，却会使许多公民被排除在外。"
 ve_cul_evt.160.f:0 "\"一个象征唯有当公民无需解释便能在其中看到自身时，方能成为民族的象征。\""
 ve_cul_evt.160.a:0 "在公共使用中轮换象征。"
 ve_cul_evt.160.a.tt:0 "文化工程进度减少 #N 3#!。\n国家凝聚力增加 #P 4#!。"
 ve_cul_evt.160.b:0 "确立单一的官方叙事。"
 ve_cul_evt.160.b.tt:0 "文化工程进度增加 #P 6#!。\n国家凝聚力减少 #N 3#!。"
 ve_cul_evt.160.c:0 "设计共同的公众典礼。"
 ve_cul_evt.160.c.tt:0 "花费 #N 10#! 文化赋权。\n文化工程进度增加 #P 4#!。\n国家凝聚力增加 #P 2#!。"
