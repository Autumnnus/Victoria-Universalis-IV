 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header 宗教协定#!\n当前：#Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n平衡点：#Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n每月变动：[Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n各项指标每月向平衡点移动 20%，上限为 #Y 5#! 点。在 #P 75#! 时：[Country.GetCustom('ve_religious_high_settlement_effect')]\n在 #N 25#! 或以下时：#N -5 合法性且 -5% 法律立法成功#!。"
 VE_CP_COHESION_TT:0 "#header 民族凝聚力#!\n当前: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n平衡点: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n每月变动: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n凝聚力每月向平衡点移动剩余差距的 20%，每月变动上限为 #Y 5#! 点。在 #P 75#! 时，认同体制将提供额外加成；在 #N 25#! 或以下时，国家将陷入动荡。"
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header 定向宗教工程#!\n状态: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header 文化工程#!\n状态: #Y [Country.GetCustom('ve_cultural_project_name')]#!\n目标: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "进度: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n每月进度: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore 当前没有正在进行的工程。工程可在自有地区面板中启动，完全分离无法进行此项工程。#!"
 ve_cp_cultural_project_detail_active:0 "进度: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n每月进度: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore 当前没有正在进行的工程。全国性工程可在国家认同面板中启动，定向工程可在自有地区面板中启动。#!"
