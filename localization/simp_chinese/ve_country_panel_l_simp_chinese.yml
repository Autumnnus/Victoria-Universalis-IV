l_simp_chinese:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "国家主义"
 VE_CP_COLLAPSE_TT:0 "隐藏该国的普遍维多利亚概述"
 VE_CP_EXPAND_TT:0 "显示该国家的普遍维多利亚概述"

 VE_CP_INSIGHT_LABEL:0 "国家洞察力"
 VE_CP_INSIGHT_TT:0 "#header 国家洞察力#!\n库存： #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\n花费在所接受的理念组内的个人想法上。"
 VE_CP_PIETY_LABEL:0 "虔诚改革"
 VE_CP_PIETY_TT:0 "#header 虔诚改革#!\n库存： #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\n花费在宗教计划和目标宗教项目。"
 VE_CP_MANDATE_LABEL:0 "文化使命"
 VE_CP_MANDATE_TT:0 "#header 文化使命#!\n库存： #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\n用于改变身份模型和文化项目。"
 VE_CP_MOMENTUM_LABEL:0 "时代动力"
 VE_CP_MOMENTUM_TT:0 "#header 时代动力#!\n库存： #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\n从满足的时代目标中获得并花费在时代奖励上。当新时代开始时，动力会重置。"
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "想法"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header 想法组#!\n已用槽位： #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\n空闲槽位： #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n当前学说投资： #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! 活跃购买的想法\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\n活跃的组想法可在 #Y 4、8、13、19、 26#! 和 #Y 34#!。插槽 5-6 还需要年龄 2，插槽 7 需要年龄 3。取消小组会降低当前投资，并且不会退还洞察力，但已获得的容量会保留。"
 VE_CP_NATIONAL_IDEAS_LABEL:0 "国家创意"
 VE_CP_PROGRESS_LABEL:0 "创意进度"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header 国家创意进度#!\n购买的团体创意： #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\n每购买三个团体创意就会解锁下一个国家创意。第二十一条还授予国家奖金。"
 VE_CP_NO_IDEA_GROUPS:0 "#lore 尚未接受理念组。#!"
 VE_CP_PROGRAMS_LABEL:0 "宗教项目"
 VE_CP_NONE_YET:0 "#lore 还没有#!"
 VE_CP_PROJECT_LABEL:0 "项目"
 VE_CP_COHESION_LABEL:0 "民族凝聚力"
 VE_CP_OBJECTIVES_LABEL:0 "时代目标"
 VE_CP_OBJECTIVES_TT:0 "#header 时代目标#!\n本时代完成： #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\n每个满足的目标每月都会支付时代动力。四个已完成的目标可解锁黄金时代。"
 VE_CP_REWARDS_LABEL:0 "时代奖励"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] 购买此时代"
 VE_CP_REWARDS_TT:0 "#header 时代奖励#!\n购买此时代： #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\n每个奖励的成本都比前一个更高，并且奖励效果随着年龄而结束。插槽10-13是针对特定国家的。"

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "未知时代"
 ve_cp_golden_age_industrial_active:0 "#P 工业黄金时代#!"
 ve_cp_golden_age_cultural_active:0 "#P 文化黄金时代#!"
 ve_cp_golden_age_strategic_active:0 "#P 战略黄金时代#!"
 ve_cp_golden_age_spent:0 "#lore 使用黄金时代#!"
 ve_cp_golden_age_ready:0 "#Y 可用黄金时代#!"
 ve_cp_golden_age_locked:0 "#lore 锁定黄金时代#!"
 ve_cp_tier_high:0 "#P 繁荣#!"
 ve_cp_tier_stable:0 "#lore 稳定#!"
 ve_cp_tier_low:0 "#N 紧张#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore 拥抱，但还没有在该组中购买的想法。#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header 宗教结算#!\n当前： #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n平衡： #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n每月变动： [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n仪表每月向平衡移动20%，限制为 #Y 5#! 点。在 #P 75#!时： [Country.GetCustom('ve_religious_high_settlement_effect')]\n在 #N 25#! 或以下时： #N -5合法性和-5%法律颁布成功#!。"
 VE_CP_COHESION_TT:0 "#header 国家凝聚力#!\n当前： #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n平衡： #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n每月变动： [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n凝聚力每月向平衡移动20%，限制为 #Y 5#! 点。在 #P 75#! 身份模型赋予额外的好处；在 #N 25#! 或低于国家不稳定适用。"
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header 目标宗教项目#!\n状态： #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header 文化项目#!\n状态： #Y [Country.GetCustom('ve_cultural_project_name')]#!\n目标： [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "进度： #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n每月进度： [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore 无项目运行。项目从国有面板启动，Total Separation 无法运行该项目。#!"
 ve_cp_cultural_project_detail_active:0 "进度： #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n每月进度： [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore 没有项目正在运行。全国范围的项目从国家身份小组开始，目标项目则来自国有小组。#!"
