l_simp_chinese:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "国家主义"
 VE_CP_COLLAPSE_TT:0 "隐藏该国的维多利亚环球全景总览"
 VE_CP_EXPAND_TT:0 "显示该国的维多利亚环球全景总览"

 VE_CP_INSIGHT_LABEL:0 "国策力"
 VE_CP_INSIGHT_TT:0 "#header 国策力#!\n储量：#Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\n用于已采纳理念群内的个体理念。"
 VE_CP_PIETY_LABEL:0 "虔修点"
 VE_CP_PIETY_TT:0 "#header 虔修点#!\n储量：#Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\n用于宗教项目与定向宗教工程。"
 VE_CP_MANDATE_LABEL:0 "文化赋权"
 VE_CP_MANDATE_TT:0 "#header 文化赋权#!\n储量：#Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\n用于更改认同体制与文化工程。"
 VE_CP_MOMENTUM_LABEL:0 "时代势头"
 VE_CP_MOMENTUM_TT:0 "#header 时代势头#!\n储量：#Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\n通过完成时代目标获得，用于换取时代奖励。新时代开始时势头将会重置。"
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "理念"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header 理念群#!\n已用槽位：#Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\n空闲槽位：#Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n当前学说投入：#Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! 个已激活并购买的理念\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\n处于激活状态的群理念会在达到 #Y 4、8、13、19、26#! 以及 #Y 34#! 时获得永久能力。第 5 至 6 个槽位还需达到时代 II，第 7 个槽位需达到时代 III。取消理念群会降低当前的投入且绝不退还国策力，但已获得的能力将会保留。"
 VE_CP_NATIONAL_IDEAS_LABEL:0 "国家理念"
 VE_CP_PROGRESS_LABEL:0 "理念进度"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header 国家理念进度#!\n已购买的群理念：#Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\n每购买三个群理念便会解锁下一项国家理念。第二十一个理念还将授予国家加成。"
 VE_CP_NO_IDEA_GROUPS:0 "#lore 尚未采纳理念群。#!"
 VE_CP_PROGRAMS_LABEL:0 "宗教项目"
 VE_CP_NONE_YET:0 "#lore 尚无#!"
 VE_CP_PROJECT_LABEL:0 "工程"
 VE_CP_COHESION_LABEL:0 "民族凝聚力"
 VE_CP_OBJECTIVES_LABEL:0 "时代目标"
 VE_CP_OBJECTIVES_TT:0 "#header 时代目标#!\n本时代已完成：#Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\n每个已满意的目标每月提供时代势头。完成四个目标即可解锁黄金时代。"
 VE_CP_REWARDS_LABEL:0 "时代奖励"
 VE_CP_REWARDS_VALUE:0 "本时代已购 [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] 项"
 VE_CP_REWARDS_TT:0 "#header 时代奖励#!\n本时代已购：#Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\n每项奖励的价格均高于上一项，且奖励效果随时代结束而失效。第 10 至 13 个槽位为国家专属。"

