l_simp_chinese:
 ve_tag_flavor_delayed_result_tt:0 "这种制度选择的后果将在大约一年内显现。"
 ve_tag_flavor_free_route_tt:0 "这条路线不花费任何国家洞察力、文化使命或虔诚改革。"
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "共同的公民词典"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "共享的官方词汇将改革带入学校和省级办公室，但不断的解释消耗了中央权威。"
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "神圣的连续性"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "改革是通过继承的宗教机构来构建的，加强了指挥，同时缩小了外国方法传播的渠道。"
 ve_tag_flavor_tur_administrative_translation_mdf:0 "行政翻译"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "官僚机构将改革转化为熟悉的程序。行政管理变得更加稳定，但立法变革速度有所下降。"
 ve_tag_flavor.1.t:0 "改革的语言"
 ve_tag_flavor.1.d:0 "一项法令可能以无可挑剔的散文形式离开首都，但仍然以四种不同的指令形式到达学校、法院、省级办公室或宗教基金会。改革者现在需要一个共同的词汇。问题是谁的机构将赋予这些词汇以意义。"
 ve_tag_flavor.1.a:0 "起草一个共同的公民词典。"
 ve_tag_flavor.1.a.tt:0 "需要公民国家或复合国家。\n花费 #N 20文化使命#! 现在。\n大约一年后：获得 #P 8国家洞察力#! 和 #P 3国家凝聚力#!，然后获得 #P +1% 教育机会#! 和 #N -25 权限#! 24 个月。"
 ve_tag_flavor.1.b:0 "神圣连续性的基础改革。"
 ve_tag_flavor.1.b.tt:0 "需要忏悔的宗教模式。\n花费 #N 20 虔诚改革#! 现在。\n大约一年后：增益 #P 8 国家洞察力#! 和 #P 3宗教聚落#!，然后获得 #P +25权威#! 和 #N -2.5%技术传播#! 持续24个月。"
 ve_tag_flavor.1.c:0 "让各局翻译命令。"
 ve_tag_flavor.1.c.tt:0 "大约一年后：获得 #P 4国家洞察力#!，然后获得 #P +25官僚主义#! 和 #N -2.5% 法律颁布速度#! 24 个月。"
 ve_tag_flavor.2.t:0 "言语成为程序"
 ve_tag_flavor.2.d:0 "一年来的通知、评论、教科书、布道和省级信件为改革计划提供了工作语言。虽然并不完全统一，但官员们现在知道哪些措辞代表一致，哪些措辞仍然掩盖分歧。"
 ve_tag_flavor.2.a:0 "词汇进入国家机器。"
 ve_tag_flavor.2.a.tt:0 "一年前选定的结果现已生效。它的资源变化被限制在正常限度内，其制度调整持续24个月。"
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "翻译局"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "专家办公室加速了外国方法的流通，尽管它们的自治削弱了中心的直接指挥。"
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "定向借款"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "引进机构在中央指导下进行重组。权威得以保留，但每次改革都需要更长的时间才能通过官方渠道。"
 ve_tag_flavor_jap_selective_adoption_mdf:0 "选择性采用"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "国家只承认能够与既定权威相协调的方法，以扩散速度换取政治控制。"
 ve_tag_flavor.10.t:0 "借用方法、本土权威"
 ve_tag_flavor.10.d:0 "外国手册、机器、学校计划和行政表格到达的速度比任何部门都能判断的要快。一些官员要求设立永久性的翻译办公室；其他人坚持认为每个借来的机构都应在中央指导下进行重组。第三个派系只接受那些能够在不扰乱既定秩序的情况下被吸收的派别。"
 ve_tag_flavor.10.a:0 "建立翻译局。"
 ve_tag_flavor.10.a.tt:0 "需要学术理念 IV 或基础设施理念 IV。\n花费 #N 15 国家洞察力#! 现在。\n大约一年后：增益 #P 10时代气势#!，则获得 #P +2.5%科技传播#! 和 #N -25权威#! 24 个月。"
 ve_tag_flavor.10.b:0 "仅在中央指导下借款。"
 ve_tag_flavor.10.b.tt:0 "需要日本国家理念 IV。\n花费 #N 10 国家洞察力#! 现在。\n大约一年后：获得 #P 7纪元动量#!，然后获得 #P +25权威#! 并且 #N -2.5%法律制定速度#! 持续24个月。"
 ve_tag_flavor.10.c:0 "选择性采用并保留指挥权。"
 ve_tag_flavor.10.c.tt:0 "大约一年后：获得 #P 3时代动力#!，然后获得 #P +25权威#! 和 #N -2.5% 技术传播#! 持续 24 个月。"
 ve_tag_flavor.11.t:0 "我们自己的方法"
 ve_tag_flavor.11.d:0 "经过一年的翻译、测试、重新起草和官方论证，新颖性与实用性分离。所采用的方法不再以国外指令的形式出现；他们已经进入了国家自己的指挥词汇中。"
 ve_tag_flavor.11.a:0 "使用通过检查的内容。"
 ve_tag_flavor.11.a.tt:0 "一年前选定的结果现已生效。时代动量保持正常的零下限，制度修正持续 24 个月。"
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "公民契约"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "公民的共同语言使到达和参与变得更容易，但解释每个管辖区的契约会消耗中央权力。"
 ve_tag_flavor_usa_composite_bargain_mdf:0 "综合讨价还价"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "联邦行政机构学会在组成社区之间进行谈判，加强办公室，同时减少对单一文化形式的压力。"
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "联邦模糊性"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "故意模糊扩大了联盟的外交声音，但在一段时间内将国家凝聚力平衡降低了2。"
 ve_tag_flavor.20.t:0 "联盟的含义"
 ve_tag_flavor.20.d:0 "新来者、已建立的国家以及具有不同公共习俗的社区都以自己的方式援引联盟。立法者同意需要一个共同的公式，但不知道它是否应该定义个人公民身份，在组成社区之间保持讨价还价，或者保持足够广泛以供每个司法管辖区解释。"
 ve_tag_flavor.20.a:0 "写一份公民契约。"
 ve_tag_flavor.20.a.tt:0 "需要公民国家。\n花费 #N 20文化使命#! 现在。\n大约一年后：增益 #P 8 国家洞察力#! 和 #P 3 民族凝聚力#!，则获得 #P +2.5% 移民吸引力#! 和 #N -25 权限#! 持续 24 个月。"
 ve_tag_flavor.20.b:0 "协商综合交易。"
 ve_tag_flavor.20.b.tt:0 "需要综合状态。\n花费 #N 20 文化使命#! 现在。\n大约一年后：增益 #P 8 国家洞察力#! 和 #P 3民族凝聚力#!，则获得 #P +25官僚主义#!  #N -2.5%同化#! 持续24个月。"
 ve_tag_flavor.20.c:0 "故意宽泛联邦公式。"
 ve_tag_flavor.20.c.tt:0 "大约一年后：获得 #P 4国家洞察力#! 并且 #P +25 影响力#! 持续 24 个月。当修正有效时，国家凝聚力平衡为 #N 2 降低#!。"
 ve_tag_flavor.21.t:0 "联盟的公式"
 ve_tag_flavor.21.d:0 "一年的会议、委员会报告、国家决议和公众争论已经产生了各机构可以使用的语言。它的沉默和它的声明一样重要，决定了欧盟解决哪些争端以及留待谈判。"
 ve_tag_flavor.21.a:0 "让公式走进大众生活。"
 ve_tag_flavor.21.a.tt:0 "一年前选定的结果现已生效。资源变化被限制在正常限度内，制度调整持续 24 个月。"
