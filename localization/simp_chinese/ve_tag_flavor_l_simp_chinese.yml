l_simp_chinese:
 ve_tag_flavor_delayed_result_tt:0 "这项制度抉择的后果将在约一年后显现。"
 ve_tag_flavor_free_route_tt:0 "此路线不消耗任何国策力、文化赋权或虔修点。"
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "共同公民词汇"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "一套共享的官方词汇将改革引入学校与地方官署，但源源不断的解释工作消耗了中央的权威力。"
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "神圣延续"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "改革经由既有的宗教机构进行构建，在巩固指挥的同时，也缩窄了外来方法流通的渠道。"
 ve_tag_flavor_tur_administrative_translation_mdf:0 "行政转化"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "官僚机构将改革转化为熟悉的程序。行政变得更加稳定，但立法变更的速度有所损失。"
 ve_tag_flavor.1.t:0 "改革的语言"
 ve_tag_flavor.1.d:0 "一道法令可能带着无可挑剔的辞藻离开首都，而当它抵达学校、法庭、地方官署或宗教基金会时，却变成了四种不同的指示。改革者如今要求一种统一的词汇。问题在于，究竟谁的机构能赋予这套词汇真正的含义。"
 ve_tag_flavor.1.a:0 "起草一份共同的公民词汇。"
 ve_tag_flavor.1.a.tt:0 "需要公民国家或复合国家。\n立即消耗 #N 20 文化赋权#!。\n约一年后：获得 #P 8 国策力#! 与 #P 3 民族凝聚力#!，随后获得 #P +1% 受教育机会#! 与 #N -25 权威力#!，持续 24 个月。"
 ve_tag_flavor.1.b:0 "将改革立基于神圣的延续。"
 ve_tag_flavor.1.b.tt:0 "需要国教制宗教体制。\n立即消耗 #N 20 虔修点#!。\n约一年后：获得 #P 8 国策力#! 与 #P 3 宗教协定#!，随后获得 #P +25 权威力#! 与 #N -2.5% 科技扩散#!，持续 24 个月。"
 ve_tag_flavor.1.c:0 "任由各个官署自行转化政令。"
 ve_tag_flavor.1.c.tt:0 "约一年后：获得 #P 4 国策力#!，随后获得 #P +25 行政力#! 与 #N -2.5% 法律制定速度#!，持续 24 个月。"
 ve_tag_flavor.2.t:0 "化言辞为程序"
 ve_tag_flavor.2.d:0 "历经一年的通告、评注、教材、布道与地方信函，改革计划已拥有了一门工作语言。它或许并非绝对整齐划一，但官员们如今已清楚哪些词句能够号令一致——而哪些词句仍在掩盖分歧。"
 ve_tag_flavor.2.a:0 "词汇已融入国家机器。"
 ve_tag_flavor.2.a.tt:0 "一年前选定的结果现已生效。其资源变动将受到正常上限的限制，其机构修正将持续 24 个月。"
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "翻译局"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "专业机构加速了外来方法的流通，尽管其自治权削弱了中央直接发号施令的能力。"
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "定向引鉴"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "引进的机构在中央的领导下进行重组。权威力得以保存，但每一项改革通过官方渠道所需的时间都更久了。"
 ve_tag_flavor_jap_selective_adoption_mdf:0 "选择性采纳"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "国家仅接纳那些能够与既定权威相调和的方法，以此牺牲扩散速度来换取政治控制。"
 ve_tag_flavor.10.t:0 "引鉴之法，本土之权"
 ve_tag_flavor.10.d:0 "外来的手册、机器、学校规划与行政图表涌入的速度，远超任何内阁所能甄别的极限。一些官员要求设立常设的翻译机构；另一些则坚称所有借鉴的机构都必须在中央的直接领导下重塑。第三派则主张仅采纳那些在不扰乱既有秩序的前提下便能吸收的内容。"
 ve_tag_flavor.10.a:0 "建立翻译局。"
 ve_tag_flavor.10.a.tt:0 "需要学术理念 IV 或基础设施理念 IV。\n立即消耗 #N 15 国策力#!。\n约一年后：获得 #P 10 时代势头#!，随后获得 #P +2.5% 科技扩散#! 与 #N -25 权威力#!，持续 24 个月。"
 ve_tag_flavor.10.b:0 "仅在中央领导下进行引鉴。"
 ve_tag_flavor.10.b.tt:0 "需要日本国家理念 IV。\n立即消耗 #N 10 国策力#!。\n约一年后：获得 #P 7 时代势头#!，随后获得 #P +25 权威力#! 与 #N -2.5% 法律制定速度#!，持续 24 个月。"
 ve_tag_flavor.10.c:0 "选择性采纳并维护指挥。"
 ve_tag_flavor.10.c.tt:0 "约一年后：获得 #P 3 时代势头#!，随后获得 #P +25 权威力#! 与 #N -2.5% 科技扩散#!，持续 24 个月。"
 ve_tag_flavor.11.t:0 "融汇之法"
 ve_tag_flavor.11.d:0 "历经一年的翻译、测试、重拟与官方争论，新颖与实用已然厘清。采纳的方法不再显得像是外来的指示；它们已然融入了国家自身的号令词汇之中。"
 ve_tag_flavor.11.a:0 "采纳经受住考验的事物。"
 ve_tag_flavor.11.a.tt:0 "一年前选定的结果现已生效。时代势头保留其正常的零下限，且机构修正将持续 24 个月。"
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "公民权契约"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "一套通用的公民权语言使得迁入与参与变得更为便捷，但在各个司法管辖区内解释这一契约的工作消耗了中央的权威力。"
 ve_tag_flavor_usa_composite_bargain_mdf:0 "复合协定"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "联邦行政机构学会了在各组成社群之间进行谈判，在强化官僚机构的同时减弱了朝向单一文化形式演变的压力。"
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "联邦模糊性"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "刻意的模糊拓宽了联邦的外交声音，但在一段时间内使民族凝聚力平衡点降低了 2。"
 ve_tag_flavor.20.t:0 "联邦的含义"
 ve_tag_flavor.20.d:0 "新来者、老牌地区以及拥有不同公共习俗的社群都在用各自的方式引证联邦。立法者们一致认为需要一个共同的公式，但对于它是应当定义个体公民身份、维护各组成社群之间的协定，还是保持足够广泛以供各个司法管辖区自行解读，尚未达成一致。"
 ve_tag_flavor.20.a:0 "撰写一份公民契约。"
 ve_tag_flavor.20.a.tt:0 "需要公民国家。\n立即消耗 #N 20 文化授权#!。\n大约一年后：获得 #P 8 国策力#!和 #P 3 民族凝聚力#!，随后获得 #P +2.5% 移民吸引力#!和 #N -25 权威力#!，持续 24 个月。"
 ve_tag_flavor.20.b:0 "谈判达成一项复合协定。"
 ve_tag_flavor.20.b.tt:0 "需要复合国家。\n立即消耗 #N 20 文化授权#!。\n大约一年后：获得 #P 8 国策力#!和 #P 3 民族凝聚力#!，随后获得 #P +25 行政力#!和 #N -2.5% 同化#!，持续 24 个月。"
 ve_tag_flavor.20.c:0 "刻意让联邦公式保持广泛。"
 ve_tag_flavor.20.c.tt:0 "大约一年后：获得 #P 4 国策力#!和 #P +25 影响力#!，持续 24 个月。当该修正生效时，民族凝聚力平衡点 #N 降低 2#!。"
 ve_tag_flavor.21.t:0 "联邦的公式"
 ve_tag_flavor.21.d:0 "一年的会议、委员会报告、地区决议以及公众争论已经产出了可供机构使用的文告。其中的默许与声明同样重要，它界定了哪些争端由联邦解决，哪些留给谈判处理。"
 ve_tag_flavor.21.a:0 "让该公式进入公共生活。"
 ve_tag_flavor.21.a.tt:0 "一年前选定的结果现已生效。资源变动被限制在正常限度内，且机构修正将持续 24 个月。"
