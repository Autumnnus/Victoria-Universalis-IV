 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] /7"
 nationalist_idea_5_tt:0 "#P +1 虔诚改革/月#! 信仰或国家无神论，并且 #P +1 文化使命/月#! 民族国家。"
 nationalist_idea_7_tt:0 "#P +1 宗教项目进度/月#! 信仰或国家无神论； #P +1 文化项目进度/月#! 在民族国家；强制宗教和种族融合的成果可以从以下方面得到改善： #Y 5%#! 至 #Y 7%#!."
 embrace_idea_tt:0 "#header 创意组容量#!\n已用插槽： #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\n现在可用槽位： #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n当前学说投资： #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! 主动购买的创意\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title 容量如何运作#!\n每个主动购买的团体创意供应 #P +1#! 学说投资。达到 #Y 4, 8, 13, 19, 26#! 或 #Y 34#! 永久添加一组槽位。插槽 5-6 也需要年龄 2；插槽 7 需要年龄 3。\n\n#title 拥抱和取消#!\n拥抱一个群体不需要洞察力，但会占用一个空闲位置。取消会释放该插槽，删除该组的修饰符，并降低当前的教义投资；花费的洞察力不予退还。已获得的任何容量插槽将永久可用。"
 ve_idea_capacity_player_progress:0 "#title 下一个永久插槽#!\n插槽： #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n进度： #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 已购买创意\n仍需要： #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title 下一个永久插槽#!\n插槽： #Y 5#!\n进度： #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 已购买创意\n仍需要： #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n年龄要求： #N 等待年龄2#!"
 ve_idea_capacity_player_age_3:0 "#title 下一个永久插槽#!\n槽位： #Y 7#!\n进度： #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 已购买创意\n仍需要： #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n年龄要求： #N 等待3岁#!"
 ve_idea_capacity_player_max:0 "#P 达到最大容量：所有7个永久组槽位均可用。#!"
 ve_idea_capacity_country_progress:0 "#title 下一个永久槽位#!\n槽位： #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n进度： #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 已购买创意\n仍然需要： #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title 下一个永久槽位#!\n槽位： #Y 5#!\n进度： #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 已购买创意\n仍需要： #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n年龄要求： #N 等待2岁#!"
 ve_idea_capacity_country_age_3:0 "#title 下一个永久槽位#!\n槽位： #Y 7#!\n进度： #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 已购买创意\n仍然需要： #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n年龄要求： #N 等待3岁#!"
 ve_idea_capacity_country_max:0 "#P 达到最大容量：所有 7 个永久组槽位均可用。#!"
