 colonial_idea_name:0 "#b 殖民理念"


 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P 在确立宗教或国家无神论下每月 +1 虔修点#!，且在族群国家下每月 #P +1 文化赋权#!"
 nationalist_idea_7_tt:0 "#P 在确立宗教或国家无神论下每月 +1 宗教工程进度#!；在族群国家下每月 #P +1 文化工程进度#!；强制性宗教与民族整合成果从 #Y 5%#! 提升至 #Y 7%#!"
 embrace_idea_tt:0 "#header 理念群容量#!\n已用槽位：#Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\n当前空闲槽位：#Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n当前学说投资：#Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! 个已激活并购买的理念\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title 容量运作方式#!\n每个已激活并购买的群理念提供 #P +1#! 学说投资。达到 #Y 4、8、13、19、26#! 或 #Y 34#! 个时将永久增加一个群槽位。第 5–6 个槽位还需达到时代 2；第 7 个槽位需达到时代 3。\n\n#title 采纳与取消#!\n采纳一个理念群不消耗洞察，但会占用一个空闲槽位。取消会释放该槽位、移除该理念群的修正并降低当前学说投资；已消耗的洞察不予退还。任何已获得的容量槽位将永久保持可用。"
 ve_idea_capacity_player_progress:0 "#title 下一个永久槽位#!\n槽位：#Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n进度：#Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 已购买理念\n还需：#Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title 下一个永久槽位#!\n槽位：#Y 5#!\n进度：#Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 已购买理念\n还需：#Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n时代要求：#N 等待时代 2#!"
 ve_idea_capacity_player_age_3:0 "#title 下一个永久槽位#!\n槽位：#Y 7#!\n进度：#Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 已购买理念\n还需：#Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n时代要求：#N 等待时代 3#!"
 ve_idea_capacity_player_max:0 "#P 已达最大容量：所有 7 个永久群槽位均已可用。#!"
 ve_idea_capacity_country_progress:0 "#title 下一个永久槽位#!\n槽位：#Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n进度：#Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 已购买理念\n还需：#Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title 下一个永久槽位#!\n槽位：#Y 5#!\n进度：#Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 已购买理念\n还需：#Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n时代要求：#N 等待时代 2#!"
 ve_idea_capacity_country_age_3:0 "#title 下一个永久槽位#!\n槽位：#Y 7#!\n进度：#Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 已购买理念\n还需：#Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n时代要求：#N 等待时代 3#!"
 ve_idea_capacity_country_max:0 "#P 已达最大容量：所有 7 个永久群槽位均已可用。#!"
 ve_idea_implementation_player_ready:0 "#P 就绪 — 当拥有足够的洞察时，可以采纳另一个理念。#!"
 ve_idea_implementation_player_locked:0 "#N 正在实施 — 距离采纳另一个理念还有 [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] 剩余。#!"
 ve_idea_era_momentum_age_1_tt:0 "#P 在第 1 时代期间：#!来自此 IV 级理念群的 +1 时代势头/月。理念群贡献上限为 #Y +2#!"
 ve_idea_era_momentum_age_2_tt:0 "#P 在第 2 时代期间：#!来自此 IV 级理念群的 +1 时代势头/月。理念群贡献上限为 #Y +2#!"
 ve_idea_era_momentum_age_3_tt:0 "#P 在第 3 时代期间：#!来自此 IV 级理念群的 +1 时代势头/月。理念群贡献上限为 #Y +2#!"
 reformist_idea_5_system_tt:0 "#P 在良心自由或完全分离下每月 +1 虔修点#!，且在公民国家或复合国家下每月 #P +1 文化赋权#!"
 reformist_idea_7_system_tt:0 "#P 在良心自由下每月 +1 宗教工程进度#!，且在公民国家或复合国家下每月 #P +1 文化工程进度#!"
 academic_idea_5_system_tt:0 "#P 在公民国家下每月 +1 文化赋权#!"
 academic_idea_7_system_tt:0 "#P 在国家无神论下每月 +1 宗教工程进度#!，且在公民国家下每月 #P +1 文化工程进度#!"
 welfare_idea_6_system_tt:0 "#P +1 文化项目进度/月#! 公民国家。"
