l_simp_chinese:
 SOC_HEADER:0 "社会理念"
 PROD_HEADER:0 "生产理念"
 MIL_HEADER:0 "军事理念"
 ve_national_ideas:0 " 国家理念"
 ve_idea_points:0 "#tooltippable_name 国策力"
 ve_national_insight_tt:0 "#header 国策力#!\n库存：#Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n本月：[GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\n购买状态：[GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 作用#!\n国策力用于购买已采纳理念群内的各个理念。每次进行的购买都会推进国家理念并增加当前学说投资；达到投资里程碑将永久授予理念群容量。\n\n#title 每月收入为何变化#!\n基础值：[GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\n识字率：[GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\n学校：[GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\n大学：[GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\n行政：[GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\n合法性：[GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\n知识分子：[GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\n债务、动乱与推行情况：[GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title 库存压力#!\n收入乘数：#Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\n库存达 #Y 750#! 时收入减半，达 #Y 900#! 时降至四分之一，达 #Y 1000#! 时停止增长。在库存上限前进行消耗可防止收入浪费。"
 ve_national_insight_implementation_strain:0 "学说推行压力"
 ve_national_insight_implementation_strain_desc:0 "行政部门正在调整各项机构与流程，以适应新采纳的国家学说。在此项为期 24 个月的推行周期结束前，无法采纳其他理念群中的理念。"
 ve_total_ideas:0 "理念群"
 ve_traditions:0 "#tooltippable_concept 传统： "
 ve_bonus:0 "#tooltippable_concept 奖励： "
 ve_ambition:0 "宏愿"
 ve_ambition_tooltip:0 "#Y 宏愿#!\n#P 永久终极奖励#!\n当该理念群内的全部七个理念均已采纳时自动解锁。"
 ve_idea_cancel_warning:0 "#header 取消 [StateRegion.MakeScope.Var('idea_group')]？#!\n\n#N 该理念群内的所有活跃理念修正均将被移除。#!\n#N 若其宏愿修正此前已被解锁，亦将被移除。#!\n\n已消耗的国策力不予退还。\n返还国策力：#Y 0#!\n\n#title 将被移除的效果#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N确认：取消此理念群。#!进度与修正将会损失，国策力不予退还。"
 ve_idea_cancel_keep_tt:0 "保留该理念群——不予取消。"
 ve_embrace:0 "采纳"
 ve_idea_locked:0 "路径关闭"
 ve_idea_locked_tt:0 "#N 此理念群与你已采纳的理念群互斥。请取消该理念群以开启此路径。"
 ve_idea_age_locked:0 "需要科技"
 ve_idea_age_locked_tt:0 "#N 该理念群需要一项尚未被研究的科技。"
 ve_idea_labour_technology_locked_tt:0 "#N 需要 [GetTechnology('labor_movement').GetName]。#!"
 ve_idea_welfare_technology_locked_tt:0 "#N 需要 [GetTechnology('human_rights').GetName]。#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N 需要 [GetTechnology('nationalism').GetName]。#!"
 ve_idea_reformist_technology_locked_tt:0 "#N 需要 [GetTechnology('egalitarianism').GetName]。#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N 需要 [GetTechnology('enlistment_offices').GetName]。#!"
 ve_idea_colonial_technology_locked_tt:0 "#N 需要 [GetTechnology('quinine').GetName]。#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N 需要 [GetTechnology('war_propaganda').GetName]。#!"
 ve_boost_idea:0 "推进理念"
 ve_boost_idea_tt:0 "#header 采纳下一个理念#!\n国策力：#Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\n购买状态：[GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 下一级所需费用#!\n#Y I：200#!  •  #Y II：250#!  •  #Y III：300#!  •  #Y IV：375#!\n#Y V：450#!  •  #Y VI：550#!  •  #Y VII：675#!\n请使用与该理念群中下一个未填满层级相匹配的费用。\n\n#title 购买后的效果#!\n#P 该理念群中的下一个修正将生效。#!\n#P 学说投资与国家理念进度各增加 1。#!\n#N 将开始一个为期 24 个月的学说推行周期。在此期间无法购买其他理念群的理念。#!\n\n#title 按钮为何可能禁用？#!\n国策力低于下一级费用；学说推行处于生效中；该理念群已完成；或下一级需要尚未研究的科技。\n\n取消该理念群将移除其理念修正与当前进度。已消耗的国策力绝不退还，但通过里程碑已获得的理念群容量绝不会被撤销。"
 academic_idea_name:0 "#b 学术理念"
 agrarian_idea_name:0 "#b 农业理念"
 financial_idea_name:0 "#b 金融主义理念"
 infrastructure_idea_name:0 "#b 基础设施理念"
 extraction_idea_name:0 "#b 开采业理念"
 mass_conscription_idea_name:0 "#b 大规模征兵理念"
 war_economy_idea_name:0 "#b 战时经济理念"
 diplomatic_idea_name:0 "#b 外交理念"
 offensive_idea_name:0 "#b 进攻理念"
 industrialist_idea_name:0 "#b 实业派理念"
 mercantile_idea_name:0 "#b 重商主义理念"
 defensive_idea_name:0 "#b 防御理念"
 bureaucratic_idea_name:0 "#b 官僚理念"
 welfare_idea_name:0 "#b 福利理念"
 naval_idea_name:0 "#b 海军理念"
 nationalist_idea_name:0 "#b 民族主义理念"
 reformist_idea_name:0 "#b 改良主义理念"
 professional_army_idea_name:0 "#b 职业军队理念"
 parliamentary_idea_name:0 "#b 议会理念"
