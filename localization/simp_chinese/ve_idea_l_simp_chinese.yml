 ve_national_ideas:0 " 国家理念"
 ve_idea_points:0 "#tooltippable_name 国家洞察力"
 ve_national_insight_tt:0 "#header 国家洞察力#!\n库存： #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n本月： [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\n购买状态： [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 它的作用#!\n国家洞察力在一个共同的理念组中购买个人想法。每一次积极的购买都会推进国家理念并增加当前的学说投资；达到投资里程碑永久奖励团体能力。\n\n#title 每月收入变化的原因#!\n基础： [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\n文化程度： [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\n学校： [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\n大学： [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\n行政管理： [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\n合法性： [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\n知识分子： [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\n债务、动荡和实施： [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title 股票压力#!\n收入乘数： #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\n收入减半为 #Y 750#!，降至四分之一 #Y 900#! 并停在 #Y 1000#!。在股票上限之前进行支出可以防止收入浪费。"
 ve_national_insight_implementation_strain:0 "执行条令的压力"
 ve_national_insight_implementation_strain_desc:0 "政府正在调整机构和程序以适应新通过的国家原则。在这个 24 个月的实施周期结束之前，不能采用另一个小组想法。"
 ve_total_ideas:0 "想法小组"
 ve_traditions:0 "#tooltippable_concept 传统： "
 ve_bonus:0 "#tooltippable_concept 奖励： "
 ve_ambition:0 "野心"
 ve_ambition_tooltip:0 "#Y 野心#!\n#P 永久顶点奖励#!\n当该组中的所有七个想法都被接受时自动解锁。"
 ve_idea_cancel_warning:0 "#header 取消 [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N 该组中所有活跃的创意修改器都将被删除。#!\n#N 如果已解锁，其野心修改器也将被删除。#!\n\n花费的国家洞察力不会退还。\n返回的国家洞察力： #Y 0#!\n\n#title 将被删除的效果#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N 确认：取消此创意#! 进度和修正值丢失，国家洞察力不予退还。"
 ve_idea_cancel_keep_tt:0 "保留此想法组 - 不要取消。"
 ve_embrace:0 "拥抱"
 ve_idea_locked:0 "路径封闭"
 ve_idea_locked_tt:0 "#N 这个想法组与你已经接受的想法组是相互排斥的。取消该组以打开此路径。"
 ve_idea_age_locked:0 "需要技术"
 ve_idea_age_locked_tt:0 "#N 该创意组需要尚未研究的技术。"
 ve_idea_labour_technology_locked_tt:0 "#N 需要 [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N 需要 [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N 需要 [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N 需要 [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N 需要 [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N 需要 [GetTechnology('quinine').GetName]需要#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N 需要 [GetTechnology('war_propaganda').GetName]想法。#!"
 ve_boost_idea:0 "提升"
 ve_boost_idea_tt:0 "#header 采用下一个想法#!\n全国见解： #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\n购买状态： [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 下一级费用#!\n#Y I：200#!  •  #Y II：250#!  •  #Y III：300#!  •  #Y IV：375#!\n#Y V：450#!  •  #Y VI： 550#!  •  #Y VII: 675#!\n使用与该组中下一个未填充级别相匹配的成本。\n\n#title 购买时会发生什么#!\n#P 该组中的下一个修改器将被激活。#!\n#P 条令投资和国家理念进度各增加1。#!\n#N 24个月的条令实施周期开始。期间不能购买其他团体创意。#!\n\n#title 为什么可以禁用该按钮？#!\n洞察力低于下一级成本；条令实施正在积极进行；该组已完成；或下一个级别需要未研究的技术。\n\n取消该组将删除其创意修改器和当前进度。花费的洞察力永远不会退还，但从里程碑中获得的团体名额永远不会被撤销。"
