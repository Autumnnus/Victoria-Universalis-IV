 ve_je_doctrine_journey_professional_army:0 "改革总参谋部"
 ve_je_doctrine_journey_professional_army_reason:0 "一支专业军官队伍需要的不仅仅是军营和佣金。培训、计划和动员必须组织成一个持久的参谋系统。"
 ve_je_doctrine_journey_professional_army_status_both:0 "进度： #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n剩余时间： #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 月#!\n每月进度： #P +2#!\n\n#P 满足兵营规模#!：至少 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 兵营建筑级别。\n#P 满足专业条令#!：专业陆军法或总参谋部技术。\n\n成功奖励： #Y 事业单位普通人员#! （+7.5%培训率，36个月）。如果60个月内进度未达到60，旅程结束且没有奖励。"
