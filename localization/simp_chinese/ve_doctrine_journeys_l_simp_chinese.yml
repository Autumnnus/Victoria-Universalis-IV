 ve_doctrine_journey_general_staff_reform_mdf:0 "机构总参谋部"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "参谋学院、动员表和共同训练标准已成为武装部队的持久组成部分。"

 ve_doctrine_journey.1.t:0 "标准化工厂系统"
 ve_doctrine_journey.1.d:0 "工业协会提出在全国范围内努力协调机械、检查和制造实践。这项工作将持续五年，需要持续的产业规模和管理稳定性。"
 ve_doctrine_journey.1.a:0 "开始标准化工作。"
 ve_doctrine_journey.1.b:0 "在五年内重新考虑该提案。"
 ve_doctrine_journey.1.c:0 "我们的工厂不需要民族主义。"
 ve_doctrine_journey.2.t:0 "学者共和国"
 ve_doctrine_journey.2.d:0 "校长和学术团体提出五年的努力，将大学连接成一个持久的国家研究社区。它的成功将取决于学术能力和读写能力的传播。"
 ve_doctrine_journey.2.a:0 "赞助学者共和国。"
 ve_doctrine_journey.2.b:0 "五年后返回提案。"
 ve_doctrine_journey.2.c:0 "学习应保持地方组织性。"
 ve_doctrine_journey.3.t:0 "总参谋部改革"
 ve_doctrine_journey.3.d:0 "高级军官提出为期五年的培训、规划和动员改革。总参谋部必须证明专业条令能够在不受青睐的指挥官圈子之外继续存在。"
 ve_doctrine_journey.3.a:0 "进行总参谋部改革。"
 ve_doctrine_journey.3.b:0 "五年后再次审查计划。"
 ve_doctrine_journey.3.c:0 "现有的指挥体系已经足够。"

 ve_doctrine_journey_start_tt:0 "开始为期五年的教义之旅。一次只能激活一个教义之旅。"
 ve_doctrine_journey_defer_tt:0 "将该团体的提议推迟 #Y 5年#!。之后可能会再次提供。"
 ve_doctrine_journey_decline_tt:0 "永久拒绝该小组的学说之旅。"

 ve_doctrine_journey.10.t:0 "测量和公差"
 ve_doctrine_journey.10.d:0 "工厂使用不兼容的仪表、配件和公差。工程师敦促国家实施一个目录，而省级制造商则警告说，严格的标准可能会冻结有用的地方实践。"
 ve_doctrine_journey.10.a:0 "资助国家标准目录。"
 ve_doctrine_journey.10.a.tt:0 "花费 #N 15#! 国家洞察力。\n旅程进度增加 #P 4#!。"
 ve_doctrine_journey.10.b:0 "允许兼容的地区标准。"
 ve_doctrine_journey.10.b.tt:0 "旅程继续，没有立即的资源或进度变化。"
 ve_doctrine_journey.10.c:0 "使用建设办公室来协调采用。"
 ve_doctrine_journey.10.c.tt:0 "需要工业家理念V.\n花费 #N 10#! 国家洞察力。\n旅程进度增加 #P 4#!。"
 ve_doctrine_journey.11.t:0 "国家监察局"
 ve_doctrine_journey.11.d:0 "第一个通用标准现在需要执行。官员提议建立中央检查机构，制造商更喜欢自我认证，经验丰富的工业规划者主张对两者进行审计。"
 ve_doctrine_journey.11.a:0 "建立中央工业检查机构。"
 ve_doctrine_journey.11.a.tt:0 "花费 #N 15#! 国家洞察力。\n旅程进度增加 #P 4#!。"
 ve_doctrine_journey.11.b:0 "认可行业自我认证。"
 ve_doctrine_journey.11.b.tt:0 "旅程将继续，无需立即提供资源或进度变化。"
 ve_doctrine_journey.11.c:0 "通过一个审计检查员和制造商系统。"
 ve_doctrine_journey.11.c.tt:0 "需要实业家理念VII。\n花费 #N 10#! 国家洞察力。\n旅程进度增加 #P 4#!。"

 ve_doctrine_journey.20.t:0 "开放主席"
 ve_doctrine_journey.20.d:0 "大学对于新主席是否应该响应当地院系、国家优先事项或公共教学任务存在分歧。首批任命将确定学术网络如何自由地交流人员和思想。"
 ve_doctrine_journey.20.a:0 "资助协调的国家主席计划。"
 ve_doctrine_journey.20.a.tt:0 "花费 #N 15#! 国家洞察力。\n旅程进度增加 #P 4#!."
 ve_doctrine_journey.20.b:0 "让每个教师定义自己的椅子。"
 ve_doctrine_journey.20.b.tt:0 "旅程继续，无需立即资源或进度变化。"
 ve_doctrine_journey.20.c:0 "将椅子连接到公共讲座网络。"
 ve_doctrine_journey.20.c.tt:0 "需要学术理念 V。\n花费 #N 10#! 国家洞察力。\n旅程进度增加 #P 4#!。"
 ve_doctrine_journey.21.t:0 "裁判共和国"
 ve_doctrine_journey.21.d:0 "现在，研究在机构之间的流动速度比过去的赞助人所能判断的要快。学者们提议进行国家同行评审，而知名学院则捍卫选择性邀请和学科独立性。"
 ve_doctrine_journey.21.a:0 "资助国家同行评审服务。"
 ve_doctrine_journey.21.a.tt:0 "支出 #N 15#! 国家洞察力。\n旅程进度增加 #P 4#!。"
 ve_doctrine_journey.21.b:0 "将审查留给学术团体。"
 ve_doctrine_journey.21.b.tt:0 "在没有立即资源或进度变化的情况下，旅程将继续。"
 ve_doctrine_journey.21.c:0 "召集跨学科审查委员会。"
 ve_doctrine_journey.21.c.tt:0 "需要学术理念七。\n花费 #N 10#! 国家洞察力。\n旅程进度增加 #P 4#!。"

 ve_doctrine_journey.30.t:0 "参谋学院"
 ve_doctrine_journey.30.d:0 "新参谋学院必须决定军官适合指挥的要素。改革者要求考试和共同指导，而老牌指挥官则捍卫资历和在战地服役中获得的判断力。"
 ve_doctrine_journey.30.a:0 "资助国家考试和共同课程。"
 ve_doctrine_journey.30.a.tt:0 "花费 #N 15#! 国家洞察力。\n旅程进度增加 #P 4#!."
 ve_doctrine_journey.30.b:0 "平衡资历与学院的建议。"
 ve_doctrine_journey.30.b.tt:0 "旅程继续，无需立即资源或进度变化。"
 ve_doctrine_journey.30.c:0 "在参谋教室轮换战地军官。"
 ve_doctrine_journey.30.c.tt:0 "需要职业陆军理念 V。\n花费 #N 10#! 国家洞察力。\n旅程进度增加 #P 4#!。"
 ve_doctrine_journey.31.t:0 "动员表"
 ve_doctrine_journey.31.d:0 "规划者为人员、物资和铁路运输制定了相互竞争的时间表。单一的国家表格承诺协调，但地区指挥部警告说，严格的时间表将忽视当地的能力。"
 ve_doctrine_journey.31.a:0 "为中央动员局提供资金。"
 ve_doctrine_journey.31.a.tt:0 "花费 #N 15#! 国家洞察力。\n旅程进度增加 #P 4#!。"
 ve_doctrine_journey.31.b:0 "让地区司令部保持兼容的时间表。"
 ve_doctrine_journey.31.b.tt:0 "旅程继续，无需立即资源或进度更改。"
 ve_doctrine_journey.31.c:0 "整合铁路、仓库和指挥规划。"
 ve_doctrine_journey.31.c.tt:0 "需要专业陆军理念 VII。\n花费 #N 10#! 国家洞察力。\n旅程进度增加 #P 4#!。"
