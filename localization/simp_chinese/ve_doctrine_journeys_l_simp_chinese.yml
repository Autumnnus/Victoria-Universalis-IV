 ve_doctrine_journey_general_staff_reform_mdf:0 "建制化总参谋部"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "参谋学校、动员表册与统一的训练标准已成为武装力量不可分割的持久部分。"

 ve_doctrine_journey.1.t:0 "工厂制度标准化"
 ve_doctrine_journey.1.d:0 "工业协会提议开展一项国家级行动，以统一机械、视察及制造实务。该项事业将持续五年，并需要持续的工业规模与行政稳定性。"
 ve_doctrine_journey.1.a:0 "开始标准化行动。"
 ve_doctrine_journey.1.b:0 "五年后再重新考虑此提议。"
 ve_doctrine_journey.1.c:0 "我们的工厂不需要国家主义。"
 ve_doctrine_journey.2.t:0 "学者共和国"
 ve_doctrine_journey.2.d:0 "大学校长与学会提议开展一项为期五年的行动，将大学连结为一个持久的国家级研究社群。其成功将取决于学术能力与识字率的普及。"
 ve_doctrine_journey.2.a:0 "资助学者共和国。"
 ve_doctrine_journey.2.b:0 "五年后再回归此提议。"
 ve_doctrine_journey.2.c:0 "学术应当维持地方化组织。"
 ve_doctrine_journey.3.t:0 "总参谋部改革"
 ve_doctrine_journey.3.d:0 "高级军官提议对训练、规划与动员进行为期五年的改革。总参谋部必须证明，职业学说能够在一个受宠将领的圈子之外延续下去。"
 ve_doctrine_journey.3.a:0 "委托总参谋部改革。"
 ve_doctrine_journey.3.b:0 "五年后再审阅计划。"
 ve_doctrine_journey.3.c:0 "现有的指挥系统已足够完善。"

 ve_doctrine_journey_start_tt:0 "开始这项为期五年的主义历程。同时只能激活一个主义历程。"
 ve_doctrine_journey_defer_tt:0 "将该集团的提议推迟 #Y 5 年#!。此后可能会再次提出。"
 ve_doctrine_journey_decline_tt:0 "永久拒绝该集团的主义历程。"

 ve_doctrine_journey.10.t:0 "度量与公差"
 ve_doctrine_journey.10.d:0 "各工厂使用的度量衡、配件和公差互不兼容。工程师敦促国家颁布统一目录，而地方制造商则警告称，刻板的标准可能会扼杀有用的小区惯例。"
 ve_doctrine_journey.10.a:0 "资助一份国家标准目录。"
 ve_doctrine_journey.10.a.tt:0 "消耗 #N 15#! 国策力。\n历程进度增加 #P 4#!。"
 ve_doctrine_journey.10.b:0 "允许兼容的区域标准。"
 ve_doctrine_journey.10.b.tt:0 "历程继续，资源或进度没有即时变化。"
 ve_doctrine_journey.10.c:0 "利用建造部门来协调推广。"
 ve_doctrine_journey.10.c.tt:0 "需要实业派理念 V。\n消耗 #N 10#! 国策力。\n历程进度增加 #P 4#!。"
 ve_doctrine_journey.11.t:0 "国家监察署"
 ve_doctrine_journey.11.d:0 "最初的通用标准现已需要强制执行。官员们提议设立一个中央监察署，制造商倾向于自我认证，而经验丰富的产业规划者则主张对两者进行审计。"
 ve_doctrine_journey.11.a:0 "建立中央产业监察署。"
 ve_doctrine_journey.11.a.tt:0 "消耗 #N 15#! 国策力。\n历程进度增加 #P 4#!。"
 ve_doctrine_journey.11.b:0 "认可产业自我认证。"
 ve_doctrine_journey.11.b.tt:0 "历程继续，资源或进度没有即时变化。"
 ve_doctrine_journey.11.c:0 "通过单一系统审计监察员与制造商。"
 ve_doctrine_journey.11.c.tt:0 "需要实业派理念 VII。\n消耗 #N 10#! 国策力。\n历程进度增加 #P 4#!。"

 ve_doctrine_journey.20.t:0 "开放教席"
 ve_doctrine_journey.20.d:0 "各大学对于新教席应听命于地方学院、国家优先事项还是公共教学授权意见不一。最初的任命将决定学术网络在人员与理念交流上的自由度。"
 ve_doctrine_journey.20.a:0 "资助协调的国家教席计划。"
 ve_doctrine_journey.20.a.tt:0 "消耗 #N 15#! 国策力。\n历程进度增加 #P 4#!。"
 ve_doctrine_journey.20.b:0 "让各学院自行定义其教席。"
 ve_doctrine_journey.20.b.tt:0 "历程继续，资源或进度没有即时变化。"
 ve_doctrine_journey.20.c:0 "将教席与公共演讲网络挂钩。"
 ve_doctrine_journey.20.c.tt:0 "需要学术理念 V。\n消耗 #N 10#! 国策力。\n历程进度增加 #P 4#!。"
 ve_doctrine_journey.21.t:0 "裁判共和国"
 ve_doctrine_journey.21.d:0 "如今研究在机构间的流转速度，已超出了旧式赞助所能评判的范畴。学者们提议建立国家同行评议制度，而老牌科学院则在捍卫选择性邀请和学科独立性。"
 ve_doctrine_journey.21.a:0 "资助国家同行评议服务。"
 ve_doctrine_journey.21.a.tt:0 "消耗 #N 15#! 国策力。\n历程进度增加 #P 4#!。"
 ve_doctrine_journey.21.b:0 "将评议交由学术社团处理。"
 ve_doctrine_journey.21.b.tt:0 "历程继续，资源或进度没有即时变化。"
 ve_doctrine_journey.21.c:0 "召集跨学科评议委员会。"
 ve_doctrine_journey.21.c.tt:0 "需要学术理念 VII。\n消耗 #N 10#! 国策力。\n历程进度增加 #P 4#!。"

 ve_doctrine_journey.30.t:0 "参谋学院"
 ve_doctrine_journey.30.d:0 "新参谋学院必须决定是什么令一名军官具备指挥资格。改革派要求考试和共同教育，而老牌指挥官则捍卫资历和在实地服役中获得的判断力。"
 ve_doctrine_journey.30.a:0 "资助国家考试与共同课程。"
 ve_doctrine_journey.30.a.tt:0 "消耗 #N 15#! 国策力。\n历程进度增加 #P 4#!。"
 ve_doctrine_journey.30.b:0 "平衡资历与学院的建议。"
 ve_doctrine_journey.30.b.tt:0 "历程继续，资源或进度没有即时变化。"
 ve_doctrine_journey.30.c:0 "轮派野战军官进入参谋课堂。"
 ve_doctrine_journey.30.c.tt:0 "需要职业军队理念 V。\n消耗 #N 10#! 国策力。\n历程进度增加 #P 4#!。"
 ve_doctrine_journey.31.t:0 "动员时刻表"
 ve_doctrine_journey.31.d:0 "规划人员为人员、补给和铁路运输制定了相互竞争的时刻表。单一的国家时刻表有望实现协调，但区域指挥部门警告称，死板的时间表将忽视地方能力。"
 ve_doctrine_journey.31.a:0 "资助一个中央动员局。"
 ve_doctrine_journey.31.a.tt:0 "花费 #N 15#! 国策力。\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.31.b:0 "让区域指挥部门维持兼容的时刻表。"
 ve_doctrine_journey.31.b.tt:0 "Journey 继续进行，资源或进度没有立即变化。"
 ve_doctrine_journey.31.c:0 "整合铁路、仓库和指挥规划。"
 ve_doctrine_journey.31.c.tt:0 "需要职业军队理念 VII。\n消耗 #N 10#! 国策力。\nJourney progress increases by #P 4#!."
