 ve_je_doctrine_journey_industrialist:0 "标准化工厂系统"
 ve_je_doctrine_journey_industrialist_reason:0 "工业主义已经蔓延到各个工厂之外。制造商、检查员和管理人员现在必须将地方实践转变为持久的国家体系。"
 ve_je_doctrine_journey_industrialist_status_both:0 "进展： #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n剩余时间： #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 月#!\n每月进度： #P +2#!\n\n#P 满足生产规模#!：至少 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! 生产建筑层数。\n#P 满足稳定的管理#!：非负官僚机构，没有即将到来的短缺，以及低于15%的国家动乱。\n\n成功奖励： #P +40国家洞察力#!。如果60个月内进度未达到60，旅程结束且没有奖励。"
