 ve_je_doctrine_journey_professional_army_status_support:0 "进度： #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n剩余时间： #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 月#!\n每月进度： #P +1#!\n\n#N 未满足兵营规模#!：至少需要 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 兵营建筑等级。\n#P 满足专业条令#!：职业军法或总参技术。\n\n成功奖励： #Y 建制总参谋部#! （+7.5%训练率，36个月）。如果60个月内进度未达到60，旅程结束且没有奖励。"
