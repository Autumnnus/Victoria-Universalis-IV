l_simp_chinese:
 ve_splendor:0 "#tooltippable_name 时代动力： "
 ve_age_of_victoria_title:0 "产业与国家"
 ve_age_of_victoria_desc:0 "旧秩序面临着工厂、铁路、有文化的公众和现代国家。动力属于那些将继承的机构转变为持久的国家能力的国家。"
 ve_imperialism_age_title:0 "帝国与大众社会"
 ve_imperialism_age_desc:0 "工业遍及各大洲，而教育、公共机构和有组织的军队则重塑大众社会。大国可能向海外扩张；小国可以通过主权和内部发展实现繁荣。"
 ve_great_wars_age_title:0 "大众政治与全面战争"
 ve_great_wars_age_desc:0 "电力、石油、大众参与、福利和工业战改变了国家与社会之间的关系。现在，生存不仅取决于军队，还取决于机构。"
 ve_age_notify_option:0 "新时代即将来临。"
 ve_victorian_age_icon_p_tt:0 "#P 工业与国家（1836-1870）"
 ve_victorian_age_icon_n_tt:0 "#N 工业与国家（1836-1870）"
 ve_imperialism_age_icon_p_tt:0 "#P 帝国与大众社会（1871-1905）"
 ve_imperialism_age_icon_n_tt:0 "#N 帝国与大众社会（1871-1905）"
 ve_great_war_age_icon_p_tt:0 "#P 大众政治与全面战争（1906-1936）"
 ve_great_war_age_icon_n_tt:0 "#N 大众政治与全面战争（1906-1936）"

 ve_golden_age:0 "黄金时代"
 ve_golden_age_industrial:0 "工业黄金时代"
 ve_golden_age_cultural:0 "文化黄金时代"
 ve_golden_age_strategic:0 "战略黄金时代"
 ve_golden_age_tt:0 "可从 #v 1845年#! 完成后 #v 5 个不同的目标#! 在当今时代。整个游戏过程中，一个国家只能选择一个黄金时代；其影响持续 #v 15年#!。"
 ve_golden_age_requirement_unused:0 "本次活动期间未选择黄金时代。"
 ve_golden_age_requirement_year:0 "需要年份 #v 1845年#! 或更晚。"
 ve_golden_age_requirement_objectives:0 "至少完成 #v 5 个不同的目标#! 当今时代。"
 ve_golden_age_industrial_tt:0 "#header 工业黄金时代#!\n #Y 15年#!： #P +10%制造吞吐量#! 和 #P +10%资源发现机会#!。\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header 文化黄金时代#!\n #Y 15年#!： #P +5%教育机会#! 和 #P +10%声望#!。\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header 战略黄金时代#!\n对于 #Y 15年#!： #P +5%陆军进攻#! 和 #P -10%伤亡疲劳感#!。\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "时代目标"

 ve_victorian_age_obj_title_1:0 "#tooltip_header 工业腾飞"
 ve_victorian_age_obj_desc_1:0 "将农民比重降至40%以下。"
 ve_victorian_age_obj_title_2:0 "#tooltip_header 结束旧秩序"
 ve_victorian_age_obj_desc_2:0 "禁止奴隶制并废除农奴制。"
 ve_victorian_age_obj_title_3:0 "#tooltip_header 功能国家"
 ve_victorian_age_obj_desc_3:0 "保持至少70的合法性和非负官僚制平衡，不接近短缺。"
 ve_victorian_age_obj_title_4:0 "#tooltip_header 受过教育的公众"
 ve_victorian_age_obj_desc_4:0 "达到50%识字率或三级学校。"
 ve_victorian_age_obj_title_5:0 "#tooltip_header 综合市场"
 ve_victorian_age_obj_desc_5:0 "如果人口低于500万，则至少拥有3级铁路，否则拥有6级铁路。"
 ve_victorian_age_obj_title_6:0 "#tooltip_header 国家觉醒"
 ve_victorian_age_obj_desc_6:0 "独立，合法性至少65，国家动乱率低于5%。"
 ve_victorian_age_obj_title_7:0 "#tooltip_header 全球影响力"
 ve_victorian_age_obj_desc_7:0 "成为大国，或维持至少5个公开利益。"

 ve_imperialism_age_obj_title_1:0 "#tooltip_header 工业强国"
 ve_imperialism_age_obj_desc_1:0 "GDP达到1亿英镑或将农民份额减少到25%以下。"
 ve_imperialism_age_obj_title_2:0 "#tooltip_header 大众教育"
 ve_imperialism_age_obj_desc_2:0 "达到65%识字率或4级学校。"
 ve_imperialism_age_obj_title_3:0 "#tooltip_header 帝国或主权"
 ve_imperialism_age_obj_desc_3:0 "拥有至少2个主体，或保持独立并得到认可。"
 ve_imperialism_age_obj_title_4:0 "#tooltip_header 全球商业"
 ve_imperialism_age_obj_desc_4:0 "如果人口低于1000万，则拥有2个港口级别，否则拥有10个港口级别，或维持5个公开利益。"
 ve_imperialism_age_obj_title_5:0 "#tooltip_header 国家建设"
 ve_imperialism_age_obj_desc_5:0 "保持至少60个合法性和低于5%的国家动乱。"
 ve_imperialism_age_obj_title_6:0 "#tooltip_header 社会问题"
 ve_imperialism_age_obj_desc_6:0 "将卫生系统、工作场所安全或社会保障提高到水平2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header 现代武装部队"
 ve_imperialism_age_obj_desc_7:0 "在军队中部署至少50%的小规模战斗或战壕步兵以及10%的机动炮兵。"

 ve_great_wars_age_obj_title_1:0 "#tooltip_header 大众政治"
 ve_great_wars_age_obj_desc_1:0 "制定普选权或议会共和制，或维持75个议会制或总统制共和国的合法性。"
 ve_great_wars_age_obj_title_2:0 "#tooltip_header 社会国家"
 ve_great_wars_age_obj_desc_2:0 "在卫生、社会保障、工作场所安全和卫生等领域维持至少两个3级机构学校."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header 电气化经济"
 ve_great_wars_age_obj_desc_3:0 "如果人口低于1000万，则拥有1个发电厂级别，否则拥有5个发电厂级别。"
 ve_great_wars_age_obj_title_4:0 "#tooltip_header 石油和发动机"
 ve_great_wars_age_obj_desc_4:0 "拥有一个石油钻井平台或至少5个汽车工业级别。"
 ve_great_wars_age_obj_title_5:0 "#tooltip_header 现代军事"
 ve_great_wars_age_obj_desc_5:0 "在军队中部署至少50%的战壕或班组步兵和15%的弹片炮兵。"
 ve_great_wars_age_obj_title_6:0 "#tooltip_header 总战争能力"
 ve_great_wars_age_obj_desc_6:0 "维持40个陆军单位和至少5个军工工业或 3 个军工厂级别。"
 ve_great_wars_age_obj_title_7:0 "#tooltip_header 世界影响力"
 ve_great_wars_age_obj_desc_7:0 "成为主要或大国，领导一个权力集团，或维持至少 6 个公开的利益。"

 ve_age_splendor_tt:0 "#title 时代动力#!\n当前存量： #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\n已满足的目标： #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\n理念组（当前年龄，最大+2）： #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\n每月变化： #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\n今年完成的不同目标年龄： #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\n该年龄购买的奖励： #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n下次奖励成本： #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y 创意组如何贡献#!\n任何匹配的 IV 级组仅在其指定年龄为当前时每月提供 #P +1#! 。上面的行显示了活跃总数，上限为  #Y +2#!。\n#P 年龄 1#!：工业、贸易、行政和学术团体\n#P 年龄 2#!：资源、社会、外交、民族主义/改良主义和殖民主义团体\n#P 年龄 3#!：军事和战争经济群体\n\n当前满足的每个目标还授予 #P +1#! 每月的时代势头。想法组不会改变目标完成情况或其一次性  #P +50#!  奖励。\n\n奖励成本在每个年龄段内逐步增加： #Y 200、300、400、500#!， 然后 #Y 以后每奖励600#! 。当新时代开始时，动力和成本阶梯就会重置。"
 ve_age_obj_efct_tt:0 "满意时： #P 每月+1纪元动量#!\n本年龄首次完成： #P +50纪元动量#!"
 splendor_default_bonus:0 "至少有 #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! 时代动力"
