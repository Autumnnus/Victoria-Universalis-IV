l_simp_chinese:
 ve_splendor:0 "#tooltippable_name 时代势头： "
 ve_age_of_victoria_title:0 "工业与民族"
 ve_age_of_victoria_desc:0 "旧秩序正面临工厂、铁路、识字公众与现代国家的交锋。势头属于那些能将继承的机构转化为持久国家能力的国家。"
 ve_imperialism_age_title:0 "帝国与大众社会"
 ve_imperialism_age_desc:0 "工业跨越各大洲，而教育、公共机构与有组织的陆军重塑了大众社会。列强可在海外扩张；小国则可通过主权与内部发展繁荣。"
 ve_great_wars_age_title:0 "大众政治与总体战"
 ve_great_wars_age_desc:0 "电力、石油、大众参与、福利与产业战争改变了国家与社会之间的关系。生存如今既取决于机构，也取决于陆军。"
 ve_age_notify_option:0 "新时代已然拂晓。"
 ve_victorian_age_icon_p_tt:0 "#P 工业与民族（1836–1870）"
 ve_victorian_age_icon_n_tt:0 "#N 工业与民族（1836–1870）"
 ve_imperialism_age_icon_p_tt:0 "#P 帝国与大众社会（1871–1905）"
 ve_imperialism_age_icon_n_tt:0 "#N 帝国与大众社会（1871–1905）"
 ve_great_war_age_icon_p_tt:0 "#P 大众政治与总体战（1906–1936）"
 ve_great_war_age_icon_n_tt:0 "#N 大众政治与总体战（1906–1936）"

 ve_golden_age:0 "黄金时代"
 ve_golden_age_industrial:0 "工业黄金时代"
 ve_golden_age_cultural:0 "文化黄金时代"
 ve_golden_age_strategic:0 "战略黄金时代"
 ve_golden_age_tt:0 "在当前时代完成 #v 5 个不同的目标#!后，于 #v 1845#! 年起解锁。每个游戏全局中一个国家仅可选择一个黄金时代；其效果持续 #v 15 年#!。"
 ve_golden_age_requirement_unused:0 "此战局中尚未选择过黄金时代。"
 ve_golden_age_requirement_year:0 "需要达到 #v 1845#! 年或之后。"
 ve_golden_age_requirement_objectives:0 "在当前时代中完成至少 #v 5 个不同的目标#!。"
 ve_golden_age_industrial_tt:0 "#header 工业黄金时代#!\n持续 #Y 15 年#!：#P +10% 制造业吞吐量#!且 #P +10% 资源发现几率#!。\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header 文化黄金时代#!\n持续 #Y 15 年#!：#P +5% 受教育机会#!且 #P +10% 威望#!。\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header 战略黄金时代#!\n持续 #Y 15 年#!：#P +5% 陆军进攻#!且 #P -10% 伤亡产生的厌战度#!。\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "时代目标"

 ve_victorian_age_obj_title_1:0 "#tooltip_header 工业起飞"
 ve_victorian_age_obj_desc_1:0 "将农夫占比降至 40% 以下。"
 ve_victorian_age_obj_title_2:0 "#tooltip_header 终结旧秩序"
 ve_victorian_age_obj_desc_2:0 "禁止奴隶制并废除农奴制。"
 ve_victorian_age_obj_title_3:0 "#tooltip_header 职能国家"
 ve_victorian_age_obj_desc_3:0 "维持至少 70 合法性以及非负的行政力结余，且没有即将面临的短缺。"
 ve_victorian_age_obj_title_4:0 "#tooltip_header 受教育公众"
 ve_victorian_age_obj_desc_4:0 "达到 50% 识字率或 3 级学校。"
 ve_victorian_age_obj_title_5:0 "#tooltip_header 统一市场"
 ve_victorian_age_obj_desc_5:0 "若人口低于 500 万，则拥有至少 3 级铁路，否则拥有 6 级铁路。"
 ve_victorian_age_obj_title_6:0 "#tooltip_header 民族觉醒"
 ve_victorian_age_obj_desc_6:0 "保持独立，合法性至少为 65，且国家动乱低于 5%。"
 ve_victorian_age_obj_title_7:0 "#tooltip_header 全球触角"
 ve_victorian_age_obj_desc_7:0 "成为主要国家或列强，或维持至少 5 个已宣布利益。"

 ve_imperialism_age_obj_title_1:0 "#tooltip_header 工业力量"
 ve_imperialism_age_obj_desc_1:0 "国内生产总值（GDP）达到 £100 million，或将农民比例降至 25% 以下。"
 ve_imperialism_age_obj_title_2:0 "#tooltip_header 大众教育"
 ve_imperialism_age_obj_desc_2:0 "识字率达到 65% 或学校达到 4 级。"
 ve_imperialism_age_obj_title_3:0 "#tooltip_header 帝国或主权"
 ve_imperialism_age_obj_desc_3:0 "拥有至少 2 个附属国，或保持独立且获得承认。"
 ve_imperialism_age_obj_title_4:0 "#tooltip_header 全球商业"
 ve_imperialism_age_obj_desc_4:0 "若人口低于 10 million 则拥有 2 级港口，否则拥有 10 级港口，或者维持 5 个已声明利益。"
 ve_imperialism_age_obj_title_5:0 "#tooltip_header 民族国家建设"
 ve_imperialism_age_obj_desc_5:0 "维持至少 60 合法性且国家动乱低于 5%。"
 ve_imperialism_age_obj_title_6:0 "#tooltip_header 社会问题"
 ve_imperialism_age_obj_desc_6:0 "将卫生系统、工作场所安全或社会保障提升至 2 级。"
 ve_imperialism_age_obj_title_7:0 "#tooltip_header 现代化陆军"
 ve_imperialism_age_obj_desc_7:0 "在陆军中部署至少 50% 的散兵或战壕步兵以及 10% 的机动炮兵。"

 ve_great_wars_age_obj_title_1:0 "#tooltip_header 大众政治"
 ve_great_wars_age_obj_desc_1:0 "制定普选制或委员会共和制，或作为议会共和制或总统共和制维持 75 合法性。"
 ve_great_wars_age_obj_title_2:0 "#tooltip_header 社会国家"
 ve_great_wars_age_obj_desc_2:0 "在卫生、社会保障、工作场所安全和学校中维持至少两项 3 级机构。"
 ve_great_wars_age_obj_title_3:0 "#tooltip_header 电气化经济"
 ve_great_wars_age_obj_desc_3:0 "若人口低于 10 million 则拥有 1 座发电厂，否则拥有 5 座发电厂。"
 ve_great_wars_age_obj_title_4:0 "#tooltip_header 石油与引擎"
 ve_great_wars_age_obj_desc_4:0 "拥有采油厂或至少 5 级汽车产业。"
 ve_great_wars_age_obj_title_5:0 "#tooltip_header 现代化军事"
 ve_great_wars_age_obj_desc_5:0 "在陆军中部署至少 50% 的战壕或班组步兵以及 15% 的榴散弹炮兵。"
 ve_great_wars_age_obj_title_6:0 "#tooltip_header 全面战争能力"
 ve_great_wars_age_obj_desc_6:0 "维持 40 个陆军单位以及至少 5 级武器产业或 3 级弹药厂。"
 ve_great_wars_age_obj_title_7:0 "#tooltip_header 世界影响力"
 ve_great_wars_age_obj_desc_7:0 "成为主要国家或列强，领导国家集团，或维持至少 6 个已声明利益。"

 ve_age_splendor_tt:0 "#title 时代势头#!\n当前库存：#v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\n满意目标：#P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\n理念群（当前时代，最高 +2）：#P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\n每月变动：#P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\n本时代已完成的不同目标：#v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\n本时代已购奖励：#v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n下一奖励花费：#v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y 理念群如何贡献#!\n任何匹配的 IV 级群在其指定的当前时代内每月提供 #P +1#!。上方显示的行激活了总计，上限为 #Y +2#!。\n#P 时代 1#!：产业、贸易、行政和学术群\n#P 时代 2#!：资源、社会、外交、民族主义/改良主义和殖民群\n#P 时代 3#!：军事和战时经济群\n\n每个当前满意的目标每月还额外提供 #P +1#! 时代势头。理念群不会改变目标完成情况或其一次性 #P +50#! 奖励。\n\n每个时代内的奖励花费会逐渐上升：#Y 200, 300, 400, 500#!，随后所有之后的奖励均为 #Y 600#!。当新时代开始时，势头与花费阶梯将重置。"
 ve_age_obj_efct_tt:0 "当满意时：每月 #P +1 时代势头#!\n本时代首次完成：#P +50 时代势头#!"
 splendor_default_bonus:0 "拥有至少 #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! 时代势头"
 ve_age_1_bonus_10_tt:0 "需要北意大利或南意大利主流文化。"
 ve_age_2_bonus_10_tt:0 "需要奥地利。"
 ve_age_3_bonus_10_tt:0 "需要大不列颠。"
 ve_age_1_bonus_11_tt:0 "需要北德意志或南德意志主流文化。"
 ve_age_2_bonus_11_tt:0 "需要俄罗斯。"
 ve_age_3_bonus_11_tt:0 "需要大清。"
 ve_age_1_bonus_12_tt:0 "需要尼德兰。"
 ve_age_2_bonus_12_tt:0 "需要比利时。"
 ve_age_3_bonus_12_tt:0 "需要法国。"
 ve_age_1_bonus_13_tt:0 "需要奥斯曼帝国。"
 ve_age_2_bonus_13_tt:0 "需要美国。"
 ve_age_3_bonus_13_tt:0 "需要日本。"
