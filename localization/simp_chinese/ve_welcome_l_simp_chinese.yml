l_simp_chinese:
 # Victoria Universalis IV 2.0 开局事件 - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "本次战役运行的是重制后的 Victoria Universalis IV。要点如下：\n\n#Y 宗教#! - 你的教会与国家法律现在决定四种宗教模型之一。你拥有 0-100 的宗教安定度，用虔诚改革购买每个模型的八项永久计划，并可在任选的一个州推行一项宗教项目。\n\n#Y 国家认同#! - 民族国家、公民国家或复合国家三种模型；花费文化使命，保持民族凝聚力，并推行五种文化工程。\n\n#Y 想法小组#! - 生产、社会与军事三大类共 21 个组，包括新增的农业组。组位现在通过主义投入获得，而不再按年份发放，且每次购买都需要 24 个月的实施期。\n\n#Y 国家创意#! - 新增十二个国家专属方案，进度现在来自你购买的每一个想法等级。\n\n#Y 时代#! - 三个带目标的时代、十三个时代奖励栏位与三种黄金时代，每个时代还有一次战略性的时代抉择旅程。\n\n#Y 新内容#! - 超过一百个新事件：主义抉择、历时数年的主义旅程、工程事件与危机，以及奥斯曼、日本和美国的专属事件链。\n\n#Y 界面#! - 新的顶栏一行、重制的宗教与国家认同页面、每个国家面板中的主义摘要，以及覆盖全世界的教义台账。"
 ve_welcome.1.f:0 "每一种主义都会在采纳它的国家留下痕迹。"
 ve_welcome.1.a:0 "详情请见模组说明。祝你玩得愉快 ^_^"
