 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "维多利亚环球 IV 2.0"
 ve_welcome.1.d:0 "本局游戏运行于重构后的维多利亚环球 IV。简而言之：\n\n#Y 宗教#! - 您的教会与国家法律现已确立四种宗教模型之一。您拥有一个 0-100 的宗教协定计量表，可为每个模型消耗虔修点来推进八项永久性计划，并能在您选择的一个地区中推进一项有针对性的宗教工程。\n\n#Y 民族认同#! - 涵盖族群、公民或复合型国族认同，可消耗文化赋权，维持高水平的民族凝聚力，并拥有五项文化工程。\n\n#Y 理念群#! - 跨越生产、社会和军事的 21 个群组，包含全新的农业群组。群组槽位通过学说投入而非时间进程来解锁，且每项购买均需经历 24 个月的实施期。\n\n#Y 国家理念#! - 十二个全新的国家侧写，且进度现来源于您购买的每一个理念等级。\n\n#Y 时代#! - 包含目标、十三个时代奖励槽位和三个黄金时代的三个时代，外加每个时代一项战略性的时代十字路口旅程。\n\n#Y 全新内容#! - 一百多个全新事件：学说两难抉择、多年期学说旅程、工程突发事件与危机，以及针对奥斯曼帝国、日本和美国的特色事件链。\n\n#Y 界面#! - 全新的顶栏行、重构后的宗教与民族认同页面、显示在每个国家面板上的学说简报，以及世界范围的主义总表。"
 ve_welcome.1.f:0 "每一项学说都会在采纳它的国家身上留下烙印。"
 ve_welcome.1.a:0 "详情请参阅模组说明。祝您游玩愉快 ^_^"
