l_spanish:
 ve_je_doctrine_journey_industrialist:0 "Estandarizando el sistema de fábrica"
 ve_je_doctrine_journey_industrialist_reason:0 "La doctrina industrial se ha extendido más allá de las fábricas individuales. Los fabricantes, inspectores y administradores deben ahora convertir las prácticas locales en un sistema nacional duradero."
 ve_je_doctrine_journey_industrialist_status_both:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +2#!\n\n#P Escala de fabricación cumplida#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! niveles de edificio de fabricación.\n#P Administración estable cumplida#!: Burocracia no negativa, ausencia de escasez inminente y menos del 15 % de agitación en el país.\n\nRecompensa del éxito: #P +40 National Insight#!. Si el Progreso no llega a 60 en 60 meses, el Viaje finaliza sin recompensa."
 ve_je_doctrine_journey_industrialist_status_core:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +1#!\n\n#P Escala de fabricación cumplida#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! niveles de edificio de fabricación.\n#N Administración estable no cumplida#!: requiere burocracia no negativa, que no haya escasez inminente y menos del 15 % de agitación en el país.\n\nRecompensa del éxito: #P +40 de conocimiento nacional#!. Si el Progreso no llega a 60 dentro de 60 meses, el Viaje termina sin recompensa."
 ve_je_doctrine_journey_industrialist_status_support:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +1#!\n\n#N Escala de fabricación no cumplida#!: requiere al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! niveles de edificio de fabricación.\n#P Administración estable cumplida#!: burocracia no negativa, no acercarse escasez y menos del 15 % de agitación en el país.\n\nRecompensa del éxito: #P +40 National Insight#!. Si el Progreso no llega a 60 dentro de 60 meses, el Viaje finaliza sin recompensa."
 ve_je_doctrine_journey_industrialist_status_neither:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #N 0#!\n\n#N Escala de fabricación no cumplida#!: requiere al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! niveles de construcción de fabricación.\n#N Administración estable no cumplida#!: requiere burocracia no negativa, que no haya escasez inminente y menos del 15 % de agitación en el país.\n\nRecompensa por éxito: #P +40 de conocimiento nacional#!. Si el Progreso no llega a 60 en 60 meses, el Viaje termina sin recompensa."
 ve_je_doctrine_journey_academic:0 "Una República de Académicos"
 ve_je_doctrine_journey_academic_reason:0 "Las universidades y las sociedades científicas están listas para convertirse en una comunidad nacional de investigación, siempre que sus instituciones y fundaciones sociales puedan sostenerla."
 ve_je_doctrine_journey_academic_status_both:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +2#!\n\n#P Escala universitaria cumplida#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! niveles de construcción de la universidad.\n#P Base de alfabetización cumplida#!: al menos 50% de alfabetización o 5 puntos porcentuales por encima del valor inicial del viaje.\n\nRecompensa por éxito: #P +15 Era Momentum#!. Si el Progreso no llega a 60 dentro de los 60 meses, el Viaje finaliza sin recompensa."
 ve_je_doctrine_journey_academic_status_core:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +1#!\n\n#P Escala universitaria cumplida#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! niveles de construcción de la universidad.\n#N Base de alfabetización no cumplida#!: requiere al menos 50 % de alfabetización o 5 puntos porcentuales por encima del valor inicial del viaje.\n\nRecompensa por éxito: #P +15 Era Momentum#!. Si el Progreso no llega a 60 dentro de los 60 meses, el Viaje finaliza sin recompensa."
