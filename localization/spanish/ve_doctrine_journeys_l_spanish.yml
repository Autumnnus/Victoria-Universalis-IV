 ve_je_doctrine_journey_academic_status_neither:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #N 0#!\n\n#N No se cumple la escala de la Universidad#!: requiere al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! niveles de Edificio de Universidad.\n#N No se cumple la base de alfabetización#!: requiere al menos un 50% de Alfabetización o 5 puntos porcentuales por encima del valor inicial del Proceso de doctrina.\n\nRecompensa por éxito: #P +15 Ímpetu de era#!. Si el Progreso no alcanza 60 en un plazo de 60 meses, el Proceso de doctrina finalizará sin recompensa."
 ve_je_doctrine_journey_professional_army:0 "Reforma del Estado Mayor"
 ve_je_doctrine_journey_professional_army_reason:0 "Un cuerpo de oficiales profesional requiere algo más que barracones y nombramientos. El adiestramiento, la planificación y la movilización deben organizarse en un sistema de Estado Mayor duradero."
 ve_je_doctrine_journey_professional_army_status_both:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +2#!\n\n#P Escala de Barracones cumplida#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveles de Edificio de Barracones.\n#P Doctrina profesional cumplida#!: ley de Ejército profesional o tecnología de Estado Mayor.\n\nRecompensa por éxito: #Y Estado Mayor institucional#! (+7.5% de Tasa de adiestramiento, 36 meses). Si el Progreso no alcanza 60 en un plazo de 60 meses, el Proceso de doctrina finalizará sin recompensa."
 ve_je_doctrine_journey_professional_army_status_core:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +1#!\n\n#P Escala de Barracones cumplida#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveles de Edificio de Barracones.\n#N Doctrina profesional no cumplida#!: requiere la ley de Ejército profesional o la tecnología de Estado Mayor.\n\nRecompensa por éxito: #Y Estado Mayor institucional#! (+7.5% de Tasa de adiestramiento, 36 meses). Si el Progreso no alcanza 60 en un plazo de 60 meses, el Proceso de doctrina finalizará sin recompensa."
 ve_je_doctrine_journey_professional_army_status_support:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +1#!\n\n#N No se cumple la escala de Barracones#!: requiere al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveles de Edificio de Barracones.\n#P Doctrina profesional cumplida#!: ley de Ejército profesional o tecnología de Estado Mayor.\n\nRecompensa por éxito: #Y Estado Mayor institucional#! (+7.5% de Tasa de adiestramiento, 36 meses). Si el Progreso no alcanza 60 en un plazo de 60 meses, el Proceso de doctrina finalizará sin recompensa."
 ve_je_doctrine_journey_professional_army_status_neither:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #N 0#!\n\n#N No se cumple la escala de Barracones#!: requiere al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveles de Edificio de Barracones.\n#N Doctrina profesional no cumplida#!: requiere la ley de Ejército profesional o la tecnología de Estado Mayor.\n\nRecompensa por éxito: #Y Estado Mayor institucional#! (+7.5% de Tasa de adiestramiento, 36 meses). Si el Progreso no alcanza 60 en un plazo de 60 meses, el Proceso de doctrina finalizará sin recompensa."
 ve_doctrine_journey_general_staff_reform_mdf:0 "Estado Mayor institucional"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Las escuelas de Estado Mayor, las tablas de movilización y las normas de adiestramiento comunes se han convertido en una parte duradera de las fuerzas armadas."

 ve_doctrine_journey.1.t:0 "Estandarización del sistema fabril"
 ve_doctrine_journey.1.d:0 "Las asociaciones industriales proponen un esfuerzo nacional para alinear la maquinaria, las inspecciones y las prácticas de fabricación. La empresa duraría cinco años y exigiría una escala industrial sostenida y estabilidad administrativa."
 ve_doctrine_journey.1.a:0 "Iniciar el esfuerzo de estandarización."
 ve_doctrine_journey.1.b:0 "Reconsiderar la propuesta en cinco años."
 ve_doctrine_journey.1.c:0 "Nuestras fábricas no necesitan ninguna doctrina nacional."
 ve_doctrine_journey.2.t:0 "Una república de letrados"
 ve_doctrine_journey.2.d:0 "Rectores y sociedades eruditas proponen un esfuerzo de cinco años para conectar las universidades en una comunidad nacional de investigación duradera. Su éxito dependerá tanto de la capacidad académica como de la difusión de la alfabetización."
 ve_doctrine_journey.2.a:0 "Patrocinar la república de letrados."
 ve_doctrine_journey.2.b:0 "Volver a la propuesta en cinco años."
 ve_doctrine_journey.2.c:0 "El aprendizaje debe seguir organizándose a nivel local."
 ve_doctrine_journey.3.t:0 "Reforma del Estado Mayor"
 ve_doctrine_journey.3.d:0 "Los oficiales superiores proponen una reforma quinquenal del adiestramiento, la planificación y la movilización. El Estado Mayor tendrá que demostrar que la doctrina profesional puede perdurar más allá de un círculo de comandantes favorecidos."
 ve_doctrine_journey.3.a:0 "Encargar la reforma del Estado Mayor."
 ve_doctrine_journey.3.b:0 "Revisar los planes de nuevo en cinco años."
 ve_doctrine_journey.3.c:0 "El sistema de mandos existente es suficiente."

 ve_doctrine_journey_start_tt:0 "Inicia este Proceso de doctrina de cinco años. Solo puede haber un Proceso de doctrina activo a la vez."
 ve_doctrine_journey_defer_tt:0 "Aplaza la oferta de este grupo durante #Y 5 años#!. Es posible que se vuelva a ofrecer más adelante."
 ve_doctrine_journey_decline_tt:0 "Rechaza permanentemente el Proceso de doctrina de este grupo."

 ve_doctrine_journey.10.t:0 "Medidas y tolerancias"
 ve_doctrine_journey.10.d:0 "Las fábricas emplean calibres, ajustes y tolerancias incompatibles. Los ingenieros instan al Estado a imponer un catálogo único, mientras que los fabricantes provinciales advierten que un estándar rígido puede congelar prácticas locales útiles."
 ve_doctrine_journey.10.a:0 "Financiar un catálogo nacional de estándares."
 ve_doctrine_journey.10.a.tt:0 "Gasta #N 15#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.10.b:0 "Permitir estándares regionales compatibles."
 ve_doctrine_journey.10.b.tt:0 "El viaje continúa sin un cambio inmediato de recursos o progreso."
 ve_doctrine_journey.10.c:0 "Utilizar las oficinas de Construcción para coordinar la adopción."
 ve_doctrine_journey.10.c.tt:0 "Requiere la doctrina Industrial Idea V.\nGasta #N 10#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.11.t:0 "La Inspección Nacional"
 ve_doctrine_journey.11.d:0 "Los primeros estándares comunes exigen ahora su cumplimiento. Los funcionarios proponen una inspectoría central, los fabricantes prefieren la autocertificación y los planificadores industriales experimentados abogan por auditar ambas."
 ve_doctrine_journey.11.a:0 "Establecer una inspección industrial central."
 ve_doctrine_journey.11.a.tt:0 "Gasta #N 15#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.11.b:0 "Reconocer la autocertificación de la industria."
 ve_doctrine_journey.11.b.tt:0 "El viaje continúa sin un cambio inmediato de recursos o progreso."
 ve_doctrine_journey.11.c:0 "Auditar a inspectores y fabricantes mediante un sistema unificado."
 ve_doctrine_journey.11.c.tt:0 "Requiere la doctrina Industrial Idea VII.\nGasta #N 10#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."

 ve_doctrine_journey.20.t:0 "Cátedras vacantes"
 ve_doctrine_journey.20.d:0 "Las universidades discrepan sobre si las nuevas cátedras deben responder ante las facultades locales, las prioridades nacionales o un mandato de enseñanza pública. Los primeros nombramientos definirán con qué libertad la red académica intercambia personas e ideas."
 ve_doctrine_journey.20.a:0 "Financiar un programa coordinado de cátedras nacionales."
 ve_doctrine_journey.20.a.tt:0 "Gasta #N 15#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.20.b:0 "Permitir que cada facultad defina sus propias cátedras."
 ve_doctrine_journey.20.b.tt:0 "El viaje continúa sin un cambio inmediato de recursos o progreso."
 ve_doctrine_journey.20.c:0 "Vincular las cátedras a una red de conferencias públicas."
 ve_doctrine_journey.20.c.tt:0 "Requiere la doctrina Académica Idea V.\nGasta #N 10#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.21.t:0 "Una república de árbitros"
 ve_doctrine_journey.21.d:0 "La investigación fluye ahora entre instituciones más de prisa de lo que el antiguo mecenazgo puede juzgarla. Los académicos proponen la revisión por pares a nivel nacional, mientras que las academias establecidas defienden la invitación selectiva y la independencia disciplinaria."
 ve_doctrine_journey.21.a:0 "Financiar un servicio nacional de revisión por pares."
 ve_doctrine_journey.21.a.tt:0 "Gasta #N 15#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.21.b:0 "Dejar la revisión en manos de las sociedades eruditas."
 ve_doctrine_journey.21.b.tt:0 "El viaje continúa sin un cambio inmediato de recursos o progreso."
 ve_doctrine_journey.21.c:0 "Convocar consejos de revisión interdisciplinarios."
 ve_doctrine_journey.21.c.tt:0 "Requiere la doctrina Académica Idea VII.\nGasta #N 10#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."

 ve_doctrine_journey.30.t:0 "La Escuela de Estado Mayor"
 ve_doctrine_journey.30.d:0 "La nueva escuela de Estado Mayor debe decidir qué hace a un oficial apto para el mando. Los reformistas exigen exámenes e instrucción común, mientras que los comandantes establecidos defienden la antigüedad y el criterio ganado en el servicio de campaña."
 ve_doctrine_journey.30.a:0 "Financiar exámenes nacionales y un currículo común."
 ve_doctrine_journey.30.a.tt:0 "Gasta #N 15#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.30.b:0 "Equilibrar la antigüedad con las recomendaciones de la escuela."
 ve_doctrine_journey.30.b.tt:0 "El viaje continúa sin un cambio inmediato de recursos o progreso."
 ve_doctrine_journey.30.c:0 "Rotar a los oficiales de campaña por las aulas de Estado Mayor."
 ve_doctrine_journey.30.c.tt:0 "Requiere la doctrina Ejército profesional Idea V.\nGasta #N 10#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.31.t:0 "Las tablas de movilización"
 ve_doctrine_journey.31.d:0 "Los planificadores han producido calendarios rivales para hombres, suministros y transporte ferroviario. Una tabla nacional única promete coordinación, pero los mandos regionales advierten que los horarios rígidos ignorarán la capacidad local."
 ve_doctrine_journey.31.a:0 "Financiar una oficina central de movilización."
 ve_doctrine_journey.31.a.tt:0 "Gasta #N 15#! de Perspicacia nacional.\nEl progreso de la travesía aumenta en #P 4#!."
 ve_doctrine_journey.31.b:0 "Permitir que los mandos regionales mantengan calendarios compatibles."
 ve_doctrine_journey.31.b.tt:0 "La travesía continúa sin un cambio inmediato de recursos o progreso."
 ve_doctrine_journey.31.c:0 "Integrar la planificación de ferrocarriles, depósitos y mandos."
 ve_doctrine_journey.31.c.tt:0 "Requiere la Doctrina de Ejército profesional VII.\nGasta #N 10#! de Perspicacia nacional.\nEl progreso de la travesía aumenta en #P 4#!."
