 ve_je_doctrine_journey_academic:0 "Una república de letrados"
 ve_je_doctrine_journey_academic_reason:0 "Las universidades y sociedades eruditas están preparadas para convertirse en una comunidad nacional de investigación, siempre que sus instituciones y cimientos sociales puedan sostenerla."
 ve_je_doctrine_journey_academic_status_both:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +2#!\n\n#P Escala universitaria alcanzada#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! niveles de Universidad.\n#P Cimientos de alfabetización alcanzados#!: al menos 50% de Alfabetización o 5 puntos porcentuales por encima del valor inicial del viaje.\n\nRecompensa de éxito: #P +15 Ímpetu de era#!. Si el Progreso no alcanza 60 en un plazo de 60 meses, el viaje finaliza sin recompensa."
