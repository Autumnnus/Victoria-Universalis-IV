 ve_je_doctrine_journey_academic_status_neither:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #N 0#!\n\n#N Escala universitaria no cumplida#!: requiere al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! niveles de construcción universitaria.\n#N Base de alfabetización no cumplida#!: requiere al menos un 50 % de alfabetización o 5 puntos porcentuales por encima del valor inicial del viaje.\n\nRecompensa por éxito: #P +15 Era Momentum#!. Si el Progreso no llega a 60 en 60 meses, el Viaje termina sin recompensa."
 ve_je_doctrine_journey_professional_army:0 "Reforma del Estado Mayor"
 ve_je_doctrine_journey_professional_army_reason:0 "Un cuerpo de oficiales profesionales requiere más que cuarteles y comisiones. La capacitación, la planificación y la movilización deben organizarse en un sistema de personal duradero."
 ve_je_doctrine_journey_professional_army_status_both:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +2#!\n\n#P Escala de cuarteles cumplida#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveles de construcción de cuarteles.\n#P Doctrina profesional cumplida#!: Ley profesional del ejército o tecnología del Estado Mayor.\n\nRecompensa por éxito: #Y Estado Mayor institucional#!  (+7,5% de tasa de entrenamiento, 36 meses). Si el Progreso no llega a 60 en 60 meses, el Viaje finaliza sin recompensa."
 ve_je_doctrine_journey_professional_army_status_core:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +1#!\n\n#P Escala de cuarteles cumplida#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveles de construcción de cuarteles.\n#N Doctrina profesional no cumplida#!: requiere la ley del Ejército Profesional o el Estado Mayor General tecnología.\n\nRecompensa por éxito: #Y Personal General Institucional#! (+7.5% Tasa de Capacitación, 36 meses). Si el Progreso no llega a 60 dentro de los 60 meses, el Viaje finaliza sin recompensa."
 ve_je_doctrine_journey_professional_army_status_support:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +1#!\n\n#N Escala de cuartel no cumplida#!: requiere al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveles de construcción de cuarteles.\n#P Doctrina profesional cumplida#!: Ley profesional del ejército o tecnología del Estado mayor general.\n\nRecompensa por éxito: #Y Estado mayor institucional#!  (+7,5% de tasa de entrenamiento, 36 meses). Si el progreso no llega a 60 en 60 meses, el viaje termina sin recompensa."
 ve_je_doctrine_journey_professional_army_status_neither:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #N 0#!\n\n#N Escala de cuarteles no cumplida#!: requiere al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveles de construcción de cuarteles.\n#N Doctrina profesional no cumplida#!: requiere la ley del Ejército Profesional o la tecnología del Estado Mayor.\n\nRecompensa por éxito: #Y Estado Mayor Institucional#! (+7.5% Tasa de Entrenamiento, 36 meses). Si el Progreso no llega a 60 dentro de 60 meses, el Viaje termina sin recompensa."
 ve_doctrine_journey_general_staff_reform_mdf:0 "Personal General Institucional"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Las escuelas superiores, las mesas de movilización y los estándares comunes de capacitación se han convertido en una parte duradera de las fuerzas armadas."

 ve_doctrine_journey.1.t:0 "Estandarizando el sistema de fábrica"
 ve_doctrine_journey.1.d:0 "Las asociaciones industriales proponen un esfuerzo nacional para alinear maquinaria, inspecciones y prácticas de fabricación. La empresa duraría cinco años y exigiría una escala industrial sostenida y estabilidad administrativa."
 ve_doctrine_journey.1.a:0 "Comenzar el esfuerzo de estandarización."
 ve_doctrine_journey.1.b:0 "Reconsiderar la propuesta en cinco años."
 ve_doctrine_journey.1.c:0 "Nuestras fábricas no necesitan ninguna doctrina nacional."
 ve_doctrine_journey.2.t:0 "Una República de Académicos"
 ve_doctrine_journey.2.d:0 "Los rectores y las sociedades científicas proponen un esfuerzo de cinco años para conectar las universidades en una comunidad nacional de investigación duradera. Su éxito dependería tanto de la capacidad académica como de la difusión de la alfabetización."
 ve_doctrine_journey.2.a:0 "Patrocinar la república de los eruditos."
 ve_doctrine_journey.2.b:0 "Volver a la propuesta dentro de cinco años."
 ve_doctrine_journey.2.c:0 "El aprendizaje debe permanecer organizado localmente."
 ve_doctrine_journey.3.t:0 "Reforma del Estado Mayor"
 ve_doctrine_journey.3.d:0 "Los altos oficiales proponen una reforma quinquenal de formación, planificación y movilización. El Estado Mayor tendría que demostrar que la doctrina profesional puede sobrevivir más allá de un círculo de comandantes favorecidos."
 ve_doctrine_journey.3.a:0 "Encargar la reforma del Estado Mayor."
 ve_doctrine_journey.3.b:0 "Revisar los planes nuevamente dentro de cinco años."
 ve_doctrine_journey.3.c:0 "El sistema de mando existente es suficiente."

 ve_doctrine_journey_start_tt:0 "Comienza este viaje doctrinal de cinco años. Solo un Doctrine Journey puede estar activo a la vez."
 ve_doctrine_journey_defer_tt:0 "Difiere la oferta de este grupo por #Y 5 años#!. Es posible que se ofrezca nuevamente después."
 ve_doctrine_journey_decline_tt:0 "Rechaza permanentemente el Viaje de Doctrina de este grupo."

 ve_doctrine_journey.10.t:0 "Medidas y Tolerancias"
 ve_doctrine_journey.10.d:0 "Las fábricas utilizan calibres, accesorios y tolerancias incompatibles. Los ingenieros instan al estado a imponer un catálogo, mientras que los fabricantes provinciales advierten que una norma rígida puede congelar prácticas locales útiles."
 ve_doctrine_journey.10.a:0 "Financiar un catálogo nacional de normas."
 ve_doctrine_journey.10.a.tt:0 "Gastar #N 15#! Perspectiva nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.10.b:0 "Permitir estándares regionales compatibles."
 ve_doctrine_journey.10.b.tt:0 "El viaje continúa sin un recurso inmediato o cambio de progreso."
 ve_doctrine_journey.10.c:0 "Utilice las oficinas de construcción para coordinar la adopción."
 ve_doctrine_journey.10.c.tt:0 "Requiere Idea industrial V.\nGastar #N 10#! Perspectiva nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.11.t:0 "La Inspección Nacional"
 ve_doctrine_journey.11.d:0 "Las primeras normas comunes ahora requieren su aplicación. Los funcionarios proponen una inspección central, los fabricantes prefieren la autocertificación y los planificadores industriales experimentados abogan por auditar ambas cosas."
 ve_doctrine_journey.11.a:0 "Establecer una inspección industrial central."
 ve_doctrine_journey.11.a.tt:0 "Gastar #N 15#! National Insight.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.11.b:0 "Reconocer la autocertificación de la industria."
 ve_doctrine_journey.11.b.tt:0 "El viaje continúa sin un recurso inmediato o cambio de progreso."
 ve_doctrine_journey.11.c:0 "Auditar a inspectores y fabricantes a través de un solo sistema."
 ve_doctrine_journey.11.c.tt:0 "Requiere idea industrial VII.\nGastar #N 10#! conocimiento nacional.\nEl progreso del viaje aumenta en #P 4#!."

 ve_doctrine_journey.20.t:0 "Sillas abiertas"
 ve_doctrine_journey.20.d:0 "Las universidades no están de acuerdo sobre si las nuevas cátedras deben responder a las facultades locales, a las prioridades nacionales o a un mandato de enseñanza pública. Los primeros nombramientos definirán la libertad con la que la red académica intercambia personas e ideas."
 ve_doctrine_journey.20.a:0 "Financiar un programa coordinado de cátedras nacionales."
 ve_doctrine_journey.20.a.tt:0 "Gastar #N 15#! National Insight.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.20.b:0 "Deje que cada facultad defina sus propias cátedras."
 ve_doctrine_journey.20.b.tt:0 "El viaje continúa sin un recurso inmediato o cambio de progreso."
 ve_doctrine_journey.20.c:0 "Ate las cátedras a una red de conferencias públicas."
 ve_doctrine_journey.20.c.tt:0 "Requiere la Idea Académica V.\nGastar #N 10#! Perspectivas Nacionales.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.21.t:0 "Una República de Árbitros"
 ve_doctrine_journey.21.d:0 "de Investigación ahora se mueve entre instituciones más rápido de lo que el antiguo patrocinio puede juzgar. Los académicos proponen una revisión nacional por pares, mientras que las academias establecidas defienden la invitación selectiva y la independencia disciplinaria."
 ve_doctrine_journey.21.a:0 "Financiar un servicio nacional de revisión por pares."
 ve_doctrine_journey.21.a.tt:0 "Gastar #N 15#! National Insight.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.21.b:0 "Dejar la revisión a las sociedades científicas."
 ve_doctrine_journey.21.b.tt:0 "El viaje continúa sin un recurso inmediato ni un cambio de progreso."
 ve_doctrine_journey.21.c:0 "Convocar consejos de revisión interdisciplinarios."
 ve_doctrine_journey.21.c.tt:0 "Requiere Idea Académica VII.\nGastar #N 10#! Información Nacional.\nEl progreso del viaje aumenta en #P 4#!."

 ve_doctrine_journey.30.t:0 "La escuela de personal"
 ve_doctrine_journey.30.d:0 "La nueva escuela de personal debe decidir qué hace que un oficial sea apto para el mando. Los reformadores exigen exámenes e instrucción común, mientras que los comandantes establecidos defienden la antigüedad y el juicio adquirido en el servicio de campo."
 ve_doctrine_journey.30.a:0 "Financiar exámenes nacionales y un plan de estudios común."
 ve_doctrine_journey.30.a.tt:0 "Gastar #N 15#! National Insight.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.30.b:0 "Equilibre la antigüedad con las recomendaciones de la universidad."
 ve_doctrine_journey.30.b.tt:0 "El viaje continúa sin un recurso inmediato o cambio de progreso."
 ve_doctrine_journey.30.c:0 "Rote a los oficiales de campo a través de las aulas del personal."
 ve_doctrine_journey.30.c.tt:0 "Requiere la Idea V del ejército profesional.\nGaste #N 10#! Perspicacia nacional.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.31.t:0 "Las tablas de movilización"
 ve_doctrine_journey.31.d:0 "Los planificadores han elaborado horarios competitivos para hombres, suministros y transporte ferroviario. Una mesa nacional única promete coordinación, pero los comandos regionales advierten que los calendarios rígidos ignorarán la capacidad local."
 ve_doctrine_journey.31.a:0 "Financiar una oficina central de movilización."
 ve_doctrine_journey.31.a.tt:0 "Gastar #N 15#! National Insight.\nEl progreso del viaje aumenta en #P 4#!."
 ve_doctrine_journey.31.b:0 "Deje que los comandos regionales mantengan cronogramas compatibles."
 ve_doctrine_journey.31.b.tt:0 "El viaje continúa sin un cambio inmediato de recursos o progreso."
 ve_doctrine_journey.31.c:0 "Integre la planificación del ferrocarril, el depósito y el comando."
 ve_doctrine_journey.31.c.tt:0 "Requiere la Idea VII del ejército profesional.\nGaste #N 10#! Información nacional.\nEl progreso del viaje aumenta en #P 4#!."
