 ve_je_doctrine_journey_industrialist:0 "Estandarización del sistema fabril"
 ve_je_doctrine_journey_industrialist_reason:0 "La doctrina industrial se ha extendido más allá de cada fábrica de forma individual. Los fabricantes, inspectores y administradores deben convertir ahora la práctica local en un sistema nacional duradero."
 ve_je_doctrine_journey_industrialist_status_both:0 "Progreso: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTiempo restante: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] meses#!\nProgreso mensual: #P +2#!\n\n#P Escala manufacturera alcanzada#!: al menos #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! niveles de Edificio manufacturero.\n#P Administración estable alcanzada#!: Burocracia no negativa, sin escasez inminente y una Agitación en el país inferior al 15%.\n\nRecompensa de éxito: #P +40 Perspicacia nacional#!. Si el Progreso no alcanza 60 en un plazo de 60 meses, el viaje finaliza sin recompensa."
