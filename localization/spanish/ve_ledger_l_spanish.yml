l_spanish:
 # Doctrine Ledger - gui/ve_panel_ledger.gui
 VE_LEDGER:0 "Registro"
 VE_LEDGER_SELECTED:0 "#bold Registro#!"
 VE_LG_TITLE:0 "Registro de doctrinas"
 VE_LG_HINT:0 "Situación doctrinal de cada país. Haga clic en la cabecera de una columna para ordenar, en un filtro para acotar la lista y en un país para abrir su panel con el detalle completo por grupo."

 # Columns
 VE_LG_COL_RANK:0 "#"
 VE_LG_COL_COUNTRY:0 "País"
 VE_LG_COL_INSIGHT:0 "Perspicacia"
 VE_LG_COL_GROUPS:0 "Grupos"
 VE_LG_COL_IDEAS:0 "Doctrinas de grupo"
 VE_LG_COL_NATIONAL_IDEAS:0 "Ideas nacionales"
 VE_LG_COL_NATIONAL_IDEAS_TT:0 "#header Ideas nacionales#!\nUn marcador por cada espacio de idea nacional, más la bonificación nacional a la derecha. Un país desbloquea el siguiente espacio por cada tres doctrinas de grupo que adquiere."
 VE_LG_COL_RELIGION:0 "Modelo religioso"
 VE_LG_COL_IDENTITY:0 "Modelo de identidad"
 VE_LG_COL_ERA:0 "Era"

 # Cell values
 VE_LG_GROUPS_VALUE:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_LG_IDEAS_VALUE:0 "[Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21"
 VE_LG_REWARDS_VALUE:0 "R [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]"
 VE_LG_ERA_TT:0 "#header [Country.GetCustom('ve_cp_age_name')]#!\nÍmpetu de era: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\nRecompensas de era compradas en esta Era: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nObjetivos cumplidos actualmente: #Y [Country.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0] / 7#!\nObjetivos asegurados en esta Era: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\nEdad de oro: [Country.GetCustom('ve_cp_golden_age_status')]"
 VE_LG_OPEN_COUNTRY_TT:0 "Abrir el panel de este país. Sus detalles de doctrinas, religión, identidad y era se encuentran en la sección #Y Doctrina nacional#! de dicho panel."

 # Sort tooltips
 VE_LG_SORT_PRESTIGE_TT:0 "Ordenar por #Y Prestigio#! (orden predeterminado, el mayor primero)."
 VE_LG_SORT_INSIGHT_TT:0 "Ordenar por #Y Perspicacia nacional#! almacenada, la mayor primero."
 VE_LG_SORT_GROUPS_TT:0 "Ordenar por #Y grupos de doctrinas#! adoptados, el mayor primero."
 VE_LG_SORT_IDEAS_TT:0 "Ordenar por #Y doctrinas de grupo#! adquiridas (progreso de idea nacional), la mayor primero."
 VE_LG_SORT_SETTLEMENT_TT:0 "Ordenar por #Y Arreglo religioso#!, el mayor primero."
 VE_LG_SORT_COHESION_TT:0 "Ordenar por #Y Cohesión nacional#!, la mayor primero."
 VE_LG_SORT_MOMENTUM_TT:0 "Ordenar por #Y Ímpetu de era#!, el mayor primero."

 # Filters
 VE_LG_F_ALL:0 "Todos"
 VE_LG_F_GREAT_POWERS:0 "Grandes potencias"
 VE_LG_F_MAJOR_POWERS:0 "Potencias importantes+"
 VE_LG_F_RECOGNIZED:0 "Reconocidas"
 VE_LG_F_RELEVANT:0 "Relevantes para mí"
 VE_LG_F_WITH_GROUPS:0 "Con grupos de doctrinas"

 # Paging
 VE_LG_PAGE_INFO:0 "Página [GetGlobalVariable('ve_ledger_page_number').GetValue|0] / [GetGlobalVariable('ve_ledger_page_count').GetValue|0]  ([GetGlobalVariable('ve_ledger_total').GetValue|0])"
 VE_LG_REFRESH:0 "Actualizar"
 VE_LG_REFRESH_TT:0 "Reconstruir la lista. Los valores de las filas son siempre en tiempo real; solo el orden y los miembros de la página se establecen al crear la lista."
 VE_LG_FIRST_TT:0 "Primera página"
 VE_LG_PREV_TT:0 "Página anterior"
 VE_LG_NEXT_TT:0 "Página siguiente"
 VE_LG_YOU:0 "#lore Tu país#!"
 VE_LG_EMPTY:0 "#lore Ningún país coincide con este filtro. Pulse Actualizar o elija un filtro más amplio.#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_ledger.txt
 ve_ledger_groups_tt_header:0 "#header Grupos de doctrinas adoptados#!"
 ve_ledger_groups_tt_none:0 "#lore Ningún grupo de doctrinas adoptado aún.#!"
