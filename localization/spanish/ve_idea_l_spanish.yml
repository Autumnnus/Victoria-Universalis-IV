 ve_national_ideas:0 " Ideas nacionales"
 ve_idea_points:0 "#tooltippable_name Perspicacia nacional"
 ve_national_insight_tt:0 "#header Perspicacia nacional#!\nReserva: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nEste mes: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nEstado de adquisición: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Qué hace#!\nLa Perspicacia nacional compra doctrinas individuales dentro de un grupo de doctrinas adoptado. Cada compra activa hace avanzar las Ideas nacionales y se suma a la inversión doctrinal actual; alcanzar un hito de inversión otorga permanentemente capacidad de grupo.\n\n#title Por qué cambian los ingresos mensuales#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nAlfabetización: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nEscuelas: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniversidades: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nAdministración: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLegitimidad: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nIntelligentsia: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nDeuda, agitación e implantación: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Presión de la reserva#!\nMultiplicador de ingresos: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nLos ingresos se reducen a la mitad a los #Y 750#!, caen a una cuarta parte a los #Y 900#! y se detienen a los #Y 1000#!. Gastar antes del límite de la reserva evita desperdiciar ingresos."
 ve_national_insight_implementation_strain:0 "Tensión de implantación doctrinal"
 ve_national_insight_implementation_strain_desc:0 "La administración está adaptando las instituciones y los procedimientos a una doctrina nacional recién adoptada. No se puede adoptar otra doctrina de grupo hasta que finalice este ciclo de implantación de 24 meses."
 ve_total_ideas:0 "Grupos de doctrinas"
 ve_traditions:0 "#tooltippable_concept Tradiciones: "
 ve_bonus:0 "#tooltippable_concept Bonus: "
 ve_ambition:0 "Aspiración"
 ve_ambition_tooltip:0 "#Y Aspiración#!\n#P Recompensa cumbre permanente#!\nSe desbloquea automáticamente cuando las siete doctrinas de este grupo han sido adoptadas."
 ve_idea_cancel_warning:0 "#header ¿Cancelar [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Todos los modificadores de doctrina activos en este grupo serán eliminados.#!\n#N Su modificador de Aspiración también será eliminado si ha sido desbloqueado.#!\n\nLa Perspicacia nacional gastada no se reembolsa.\nPerspicacia nacional devuelta: #Y 0#!\n\n#title Efectos que serán eliminados#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Confirmar: cancelar este grupo de doctrinas.#! El progreso y los modificadores se pierden, la Perspicacia nacional no se reembolsa."
 ve_idea_cancel_keep_tt:0 "Mantener este grupo de doctrinas; no cancelar."
 ve_embrace:0 "Adoptar"
 ve_idea_locked:0 "Camino cerrado"
 ve_idea_locked_tt:0 "#N Este grupo de doctrinas es mutuamente excluyente con el que ya ha adoptado. Cancele ese grupo para abrir este camino."
 ve_idea_age_locked:0 "Tecnología requerida"
 ve_idea_age_locked_tt:0 "#N Este grupo de doctrinas requiere una tecnología que aún no ha sido investigada."
 ve_idea_labour_technology_locked_tt:0 "#N Requiere [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Requiere [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Requiere [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Requiere [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Requiere [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Requiere [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Requiere [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Impulsar doctrina"
 ve_boost_idea_tt:0 "#header Adoptar la siguiente doctrina#!\nPerspicacia nacional: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nEstado de adquisición: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Costo del siguiente nivel#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nUse el costo correspondiente al siguiente nivel sin completar en este grupo.\n\n#title Qué ocurre al comprar#!\n#P El siguiente modificador de este grupo se vuelve activo.#!\n#P La inversión doctrinal y el progreso de la Idea nacional aumentan en 1 cada uno.#!\n#N Comienza un ciclo de Implantación doctrinal de 24 meses. Ninguna otra doctrina de grupo puede ser comprada durante este tiempo.#!\n\n#title ¿Por qué puede estar deshabilitado el botón?#!\nLa Perspicacia es inferior al costo del siguiente nivel; la implantación doctrinal está activa; el grupo está completo; o el siguiente nivel requiere una tecnología no investigada.\n\nCancelar este grupo elimina sus modificadores de doctrina y el progreso actual. La Perspicacia gastada nunca se reembolsa, pero una ranura de grupo ya obtenida a partir de un hito nunca se revoca."
 academic_idea_name:0 "#b Doctrina académica"
