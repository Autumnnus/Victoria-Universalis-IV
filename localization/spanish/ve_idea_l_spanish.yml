 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Reforma de Piedad/mes#! en Ateísmo Confesional o Estatal, y #P +1 Mandato Cultural/mes#! en Nación Étnica."
 nationalist_idea_7_tt:0 "#P +1 Progreso de Proyecto Religioso/mes#! en Ateísmo Confesional o Estatal; #P +1 Progreso de Proyecto Cultural/mes#! en Nación Étnica; Los resultados de la integración étnica y religiosa coercitiva mejoran del #Y 5%#! al #Y 7%#!."
 embrace_idea_tt:0 "#header Capacidad del grupo de ideas#!\nRanuras utilizadas: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nEspacios gratis ahora: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInversión actual en Doctrine: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! ideas compradas activas\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Cómo funciona la capacidad#!\nCada suministro de ideas de grupo comprado activo #P +1#! Doctrina Inversión. Alcanzando #Y 4, 8, 13, 19, 26#! o #Y 34#! añade permanentemente un espacio de grupo. Los espacios 5 a 6 también requieren Edad 2; el espacio 7 requiere Edad 3.\n\n#title Aceptar y cancelar#!\nAbrazar un grupo no cuesta Insight pero ocupa un espacio libre. La cancelación libera ese espacio, elimina los modificadores del grupo y reduce la inversión actual en Doctrina; Insight gastado no se reembolsa. Cualquier espacio de capacidad ya obtenido permanece disponible permanentemente."
 ve_idea_capacity_player_progress:0 "#title Siguiente espacio permanente#!\nEspacio: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgreso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! ideas compradas\nAún es necesario: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Siguiente espacio permanente#!\nEspacio: #Y 5#!\nProgreso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! ideas compradas\nAún es necesario: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nRequisito de edad: #N Esperando edad 2#!"
 ve_idea_capacity_player_age_3:0 "#title Siguiente ranura permanente#!\nEspacio: #Y 7#!\nProgreso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! ideas compradas\nAún es necesario: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nRequisito de edad: #N En espera de cumplir 3 años#!"
 ve_idea_capacity_player_max:0 "#P Capacidad máxima alcanzada: los 7 espacios para grupos permanentes están disponibles.#!"
 ve_idea_capacity_country_progress:0 "#title Próximo espacio permanente#!\nEspacio: #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgreso: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! ideas compradas\nAún necesario: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
