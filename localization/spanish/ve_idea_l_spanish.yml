 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Reforma piadosa/mes#! con Confesional o Ateísmo de Estado, y #P +1 Mandato cultural/mes#! con Nación étnica."
 nationalist_idea_7_tt:0 "#P +1 progreso de Proyecto religioso/mes#! con Confesional o Ateísmo de Estado; #P +1 progreso de Proyecto cultural/mes#! con Nación étnica; los resultados coercitivos de Integración religiosa y cultural mejoran del #Y 5%#! al #Y 7%#!."
 embrace_idea_tt:0 "#header Capacidad de grupos de doctrinas#!\nEspacios usados: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nEspacios libres actuales: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInversión en doctrina actual: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! doctrinas activas adquiridas\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Cómo funciona la capacidad#!\nCada grupo de doctrinas activo adquirido aporta #P +1#! a la Inversión en doctrina. Alcanzar #Y 4, 8, 13, 19, 26#! o #Y 34#! añade permanentemente un espacio de grupo. Los espacios 5 y 6 también requieren la Era 2; el espacio 7 requiere la Era 3.\n\n#title Adopción y cancelación#!\nAdoptar un grupo no cuesta Perspicacia, pero ocupa un espacio libre. Cancelarlo libera dicho espacio, elimina los modificadores del grupo y reduce la Inversión en doctrina actual; la Perspicacia gastada no se reembolsa. Cualquier espacio de capacidad ya obtenido permanece disponible permanentemente."
 ve_idea_capacity_player_progress:0 "#title Siguiente espacio permanente#!\nEspacio: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgreso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! doctrinas adquiridas\nAún necesario: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Siguiente espacio permanente#!\nEspacio: #Y 5#!\nProgreso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! doctrinas adquiridas\nAún necesario: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nRequisito de Era: #N Esperando a la Era 2#!"
 ve_idea_capacity_player_age_3:0 "#title Siguiente espacio permanente#!\nEspacio: #Y 7#!\nProgreso: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! doctrinas adquiridas\nAún necesario: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nRequisito de Era: #N Esperando a la Era 3#!"
 ve_idea_capacity_player_max:0 "#P Capacidad máxima alcanzada: los 7 espacios de grupo permanentes están disponibles.#!"
