 ve_national_ideas:0 " Ideas nacionales"
 ve_idea_points:0 "#tooltippable_name Perspectiva nacional"
 ve_national_insight_tt:0 "#header National Insight#!\nStock: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nEste mes: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nEstado de compra: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Qué hace#!\nNational Insight compra ideas individuales dentro de un grupo de ideas aceptado. Cada compra activa promueve Ideas Nacionales y se suma a la Inversión Doctrina actual; alcanzar un hito de inversión premia permanentemente la capacidad del grupo.\n\n#title Por qué cambian los ingresos mensuales#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nAlfabetización: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nEscuelas: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniversidades: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nAdministración: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLegitimidad: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nInteligencia: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nDeuda, agitación e implementación: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Acciones presión#!\nMultiplicador de ingresos: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nLos ingresos se reducen a la mitad en #Y 750#!, caen a una cuarta parte en #Y 900#! y se detiene en #Y 1000#!. Gastar antes del límite de acciones evita el desperdicio de ingresos."
 ve_national_insight_implementation_strain:0 "Tensión en la implementación de la doctrina"
 ve_national_insight_implementation_strain_desc:0 "La administración está adaptando instituciones y procedimientos a una doctrina nacional recientemente adoptada. No se puede adoptar otra idea de grupo hasta que finalice este ciclo de implementación de 24 meses."
 ve_total_ideas:0 "Grupos de ideas"
 ve_traditions:0 "#tooltippable_concept Tradiciones: "
 ve_bonus:0 "#tooltippable_concept Bonificación: "
 ve_ambition:0 "Ambición"
 ve_ambition_tooltip:0 "#Y Ambición#!\n#P Recompensa final permanente#!\nSe desbloquea automáticamente cuando se han adoptado las siete ideas de este grupo."
 ve_idea_cancel_warning:0 "#header ¿Cancelar [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Se eliminarán todos los modificadores de ideas activos en este grupo.#!\n#N Su modificador de Ambición también se eliminará si se ha desbloqueado.#!\n\nEl National Insight gastado no se reembolsa.\nNational Insight devuelto: #Y 0#!\n\n#title Efectos que se eliminarán#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Confirmar: cancelar este grupo de ideas.#! El progreso y los modificadores se pierden, National Insight no se reembolsa."
 ve_idea_cancel_keep_tt:0 "Conservar este grupo de ideas, no cancelarlo."
 ve_embrace:0 "Aceptar"
 ve_idea_locked:0 "Camino cerrado"
 ve_idea_locked_tt:0 "#N Este grupo de ideas es mutuamente excluyente con el que ya has adoptado. Cancele ese grupo para abrir este camino."
 ve_idea_age_locked:0 "Tecnología Requerida"
 ve_idea_age_locked_tt:0 "#N Este grupo de ideas requiere una tecnología que aún no ha sido investigada."
 ve_idea_labour_technology_locked_tt:0 "#N Requiere [GetTechnology('labor_movement').GetName].#!"
