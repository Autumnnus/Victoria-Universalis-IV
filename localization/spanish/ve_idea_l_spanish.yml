 ve_idea_mass_conscription_technology_locked_tt:0 "#N Requiere [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Requiere [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Requiere [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Impulsar la idea"
 ve_boost_idea_tt:0 "#header Adoptar la siguiente idea#!\nPerspectiva nacional: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nEstado de compra: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Costo del siguiente nivel#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nUtilice el costo que coincida con el siguiente nivel sin completar en este grupo.\n\n#title Qué sucede cuando se compra#!\n#P El siguiente modificador en este grupo se convierte en activo.#!\n#P El progreso de la Inversión en Doctrina y la Idea Nacional aumenta cada uno en 1.#!\n#N Comienza un ciclo de Implementación de Doctrina de 24 meses. No se puede comprar ninguna otra idea grupal durante el mismo.#!\n\n#title ¿Por qué se puede desactivar el botón?#!\nLa información está por debajo del costo del siguiente nivel; La implementación de la doctrina está activa; el grupo está completo; o el siguiente nivel requiere una tecnología no investigada.\n\nCancelar este grupo elimina sus modificadores de idea y su progreso actual. La información gastada nunca se reembolsa, pero un espacio de grupo ya obtenido a partir de un hito nunca se revoca."
