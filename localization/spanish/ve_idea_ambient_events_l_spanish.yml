l_spanish:
 ve_doctrine_ambient_cooldown_mdf:0 "Enfriamiento del debate sobre doctrinas"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Las instituciones del país están absorbiendo las consecuencias de un reciente debate doctrinal."
 ve_doctrine_ambient_ig_supported_mdf:0 "Apoyo institucional"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "El gobierno ha otorgado a este grupo de interés un papel visible en la solución de un debate doctrinal."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Leve institucional"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "El gobierno ha excluido a este grupo de interés de un acuerdo doctrinal reciente."

 ve_doctrine_industrialist_positive_mdf:0 "Práctica industrial estandarizada"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Los fabricantes se están beneficiando de un cuerpo coordinado de prácticas industriales."
 ve_doctrine_industrialist_negative_mdf:0 "Cuellos de botella industriales"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Las fallas de coordinación no resueltas están limitando la fabricación."
 ve_doctrine_academic_positive_mdf:0 "Red de investigación coordinada"
 ve_doctrine_academic_positive_mdf_desc:0 "Las universidades comparten métodos, personal y resultados a través de una red coordinada."
 ve_doctrine_academic_negative_mdf:0 "Cuellos de botella académicos"
 ve_doctrine_academic_negative_mdf_desc:0 "Las disputas de credenciales y coordinación están perturbando a las universidades."
 ve_doctrine_nationalist_positive_mdf:0 "Red de asociaciones nacionales"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Las asociaciones nacionales están traduciendo el gobierno legítimo en una lealtad más amplia."
 ve_doctrine_nationalist_negative_mdf:0 "Sociedades Nacionales en competencia"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Las organizaciones nacionales rivales están convirtiendo la legitimidad política en nuevos agravios."
 ve_doctrine_reformist_positive_mdf:0 "Red de reforma organizada"
 ve_doctrine_reformist_positive_mdf_desc:0 "Los movimientos políticos han ganado canales ordenados de participación y compromiso."
 ve_doctrine_reformist_negative_mdf:0 "Coalición de reforma fracturada"
 ve_doctrine_reformist_negative_mdf_desc:0 "Las organizaciones reformistas en competencia están convirtiendo la movilización política en radicalismo."
 ve_doctrine_professional_army_positive_mdf:0 "Ciclo de capacitación del personal"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Un programa coordinado de personal está mejorando el sistema de capacitación del ejército."
 ve_doctrine_professional_army_negative_mdf:0 "Cuerpo de oficiales cuellos de botella"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Las disputas sobre ascensos y personal están frenando el entrenamiento militar."
 ve_doctrine_agrarian_positive_mdf:0 "Prácticas agrícolas coordinadas"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Las instituciones rurales están difundiendo métodos confiables en toda la economía agrícola."
 ve_doctrine_agrarian_negative_mdf:0 "Escasez de suministro agrícola"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Escasez de semillas, crédito y coordinación están reduciendo el rendimiento agrícola."

 ve_idea_evt.10.t:0 "Códigos de seguridad a plena potencia"
 ve_idea_evt.10.d:0 "Una serie de accidentes en fábricas han dejado abierta la cuestión de la inspección industrial. Los inspectores independientes prometen estándares creíbles, mientras que los fabricantes insisten en que las reglas voluntarias preservarán la producción y la iniciativa."
 ve_idea_evt.10.a:0 "Designar inspectores independientes."
 ve_idea_evt.10.a.tt:0 "Gastar #N 25#! Perspectiva nacional. Los sindicatos ganan #P +1#! Aprobación y los industriales pierden #N 1#! Aprobación por 24 meses."
 ve_idea_evt.10.b:0 "Dejemos que las industrias escriban códigos voluntarios."
 ve_idea_evt.10.b.tt:0 "Los industriales ganan #P +1#! Aprobación y los sindicatos pierden #N 1#! Aprobación por 24 meses."
 ve_idea_evt.10.c:0 "Estandarizar las normas por etapas."
 ve_idea_evt.10.c.tt:0 "Gaste #N 10#! Información Nacional. No hay cambios en la aprobación del grupo de interés."

 ve_idea_evt.11.t:0 "Piezas de máquinas estandarizadas"
 ve_idea_evt.11.d:0 "Ingenieros de varios distritos industriales han producido un catálogo común de calibres, accesorios y piezas de máquinas. Financiar una norma nacional sería costoso, pero podría eliminar fricciones en toda la red de fabricación."
 ve_idea_evt.11.a:0 "Adoptar los estándares a nivel nacional."
 ve_idea_evt.11.a.tt:0 "Gastar #N 40#! Insight nacional y ganancia #P +5%#! Rendimiento de fabricación durante 36 meses."
 ve_idea_evt.11.b:0 "Archive los hallazgos para más tarde."
 ve_idea_evt.11.b.tt:0 "Obtener #P 15#! National Insight."
 ve_idea_evt.11.c:0 "Nuestras redes de producción ya están preparadas."
 ve_idea_evt.11.c.tt:0 "Gaste #N 20#! National Insight y obtenga #P +5%#! de rendimiento de fabricación durante 36 meses."

 ve_idea_evt.12.t:0 "El cuello de botella en las fábricas"
 ve_idea_evt.12.d:0 "Los pedidos se están acumulando mientras procedimientos incompatibles, componentes retrasados ​​y cronogramas confusos ahogan las fábricas del país. El gobierno puede enviar especialistas, dejar el problema en manos de las empresas o utilizar oficinas de construcción establecidas para coordinar una respuesta."
 ve_idea_evt.12.a:0 "Envíe un equipo de especialistas."
 ve_idea_evt.12.a.tt:0 "Gastar #N 25#! National Insight y evitar la penalización industrial."
 ve_idea_evt.12.b:0 "Las fábricas deben resolver esto por sí mismas."
 ve_idea_evt.12.b.tt:0 "Sufrir #N -5%#! Rendimiento de fabricación durante 24 meses."
 ve_idea_evt.12.c:0 "Activar las oficinas de construcción."
 ve_idea_evt.12.c.tt:0 "Gastar #N 10#! Nacional y evitar la penalización industrial."

 ve_idea_evt.60.t:0 "Mecanización y tenencia"
 ve_idea_evt.60.d:0 "La nueva maquinaria podría aumentar la producción agrícola, pero los arrendatarios y pequeños agricultores temen que una transición rápida desarraigue los medios de vida rurales. El gobierno debe decidir si acelerar la mecanización, proteger primero la tenencia o coordinar una transición local gradual."
 ve_idea_evt.60.a:0 "Crear un fondo de mecanización."
 ve_idea_evt.60.a.tt:0 "Gastar #N 25#! Información Nacional y ganancia #P +5%#! Rendimiento agrícola durante 24 meses. Los industriales ganan #P +1#! Aprobación y la gente rural pierde #N 1#! Aprobación por 24 meses."
 ve_idea_evt.60.b:0 "Asegurar a los inquilinos antes de cambiar las granjas."
 ve_idea_evt.60.b.tt:0 "La gente rural gana #P +1#! Aprobación y los propietarios pierden #N 1#! Aprobación por 24 meses."
 ve_idea_evt.60.c:0 "Utilizar las redes de producción locales para una transición gradual."
 ve_idea_evt.60.c.tt:0 "Gastar #N 10#! Información nacional y ganar #P +5%#! Rendimiento Agrícola durante 24 meses. Sin cambios en la aprobación del grupo de interés."

 ve_idea_evt.61.t:0 "Graneros cooperativos"
 ve_idea_evt.61.d:0 "Los delegados rurales han demostrado una red de graneros cooperativos capaces de compartir reservas, registros y transporte. Un programa nacional podría fortalecer la coordinación agrícola, mientras que simplemente preservar los planes seguiría enriqueciendo el conocimiento institucional del gobierno."
 ve_idea_evt.61.a:0 " Financiar la red cooperativa."
 ve_idea_evt.61.a.tt:0 "Gaste #N 40#! Información Nacional y obtenga #P +5%#! de Rendimiento Agrícola durante 36 meses."
 ve_idea_evt.61.b:0 "Distribuya los registros a las oficinas agrícolas."
 ve_idea_evt.61.b.tt:0 "Obtener #P 15#! conocimiento nacional."
 ve_idea_evt.61.c:0 "Utilizar las instituciones rurales que ya existen."
 ve_idea_evt.61.c.tt:0 "Gastar #N 20.#! Conocimiento y ganancia nacional #P +5%#! Rendimiento Agrícola durante 36 meses."

 ve_idea_evt.62.t:0 "Escasez de semillas y crédito"
 ve_idea_evt.62.d:0 "Las escasas existencias de semillas y la restricción del crédito rural amenazan el próximo ciclo agrícola. Los especialistas pueden organizar una respuesta de emergencia, se puede dejar que las redes locales improvisen o las instituciones de subsistencia establecidas pueden soportar temporalmente la carga."
 ve_idea_evt.62.a:0 "Organizar un programa de experiencia en emergencias."
 ve_idea_evt.62.a.tt:0 "Gaste #N 25#! National Insight y evite la penalización agrícola."
 ve_idea_evt.62.b:0 "Deje que las redes locales encuentren su propia solución."
 ve_idea_evt.62.b.tt:0 "Sufra #N -5%#! Rendimiento agrícola durante 24 meses."
 ve_idea_evt.62.c:0 "Usar redes de subsistencia como columna vertebral temporal."
 ve_idea_evt.62.c.tt:0 "Gastar #N 10#! National Insight y evitar la penalización agrícola."

 ve_idea_evt.20.t:0 "Patrocinio o revisión por pares"
 ve_idea_evt.20.d:0 "El gobierno espera resultados prácticos de sus subvenciones para investigación, mientras que los académicos advierten que el clientelismo reemplazará la evidencia por conveniencia política. Un acuerdo duradero debe definir quién juzga el aprendizaje del país."
 ve_idea_evt.20.a:0 "Establecer juntas de revisión independientes."
 ve_idea_evt.20.a.tt:0 "Gastar #N 25#! Perspectiva Nacional. La intelectualidad gana #P +1#! Aprobación y la Pequeña Burguesía pierde #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.20.b:0 "Dejemos que el Estado defina las prioridades de investigación."
 ve_idea_evt.20.b.tt:0 "La Pequeña Burguesía gana #P +1#! Aprobación y la Intelectualidad pierde #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.20.c:0 "Institucionalizar estándares académicos comunes."
 ve_idea_evt.20.c.tt:0 "Gaste #N 10#! Información Nacional. No hay cambios en la aprobación del grupo de interés."
 ve_idea_evt.21.t:0 "Una red provincial de investigación"
 ve_idea_evt.21.d:0 "Los colegios provinciales han comenzado a intercambiar profesores, instrumentos y hallazgos sin una dirección central. El apoyo formal podría convertir esta cooperación improvisada en una red nacional de investigación."
 ve_idea_evt.21.a:0 "Financiar la red."
 ve_idea_evt.21.a.tt:0 "Gaste #N 40#! National Insight y obtenga #P +5%#! de rendimiento universitario durante 36 meses."
 ve_idea_evt.21.b:0 "Coloque los informes en el archivo central."
 ve_idea_evt.21.b.tt:0 "Obtenga #P 15#! National Insight."
 ve_idea_evt.21.c:0 "Conéctelo a la academia nacional."
 ve_idea_evt.21.c.tt:0 "Gaste #N 20#! Insight nacional y ganancia #P +5%#! Rendimiento Universitario durante 36 meses."
 ve_idea_evt.22.t:0 "El cuello de botella de las credenciales"
 ve_idea_evt.22.d:0 "Las universidades no pueden evaluar el creciente número de estudiantes, profesores y nuevas disciplinas con la suficiente rapidez. Las credenciales retrasadas ahora amenazan al sistema de investigación en general."
 ve_idea_evt.22.a:0 "Ampliar la capacidad de evaluación."
 ve_idea_evt.22.a.tt:0 "Gasto #N 25#! National Insight y evitar la penalización académica."
 ve_idea_evt.22.b:0 "Las instituciones existentes deben hacer frente."
 ve_idea_evt.22.b.tt:0 "Sufrir #N -5%#! Rendimiento Universitario durante 24 meses."
 ve_idea_evt.22.c:0 "Estandarizar a través de la red escolar."
 ve_idea_evt.22.c.tt:0 "Gastar #N 10#! National Insight y evitar la penalización académica."

 ve_idea_evt.30.t:0 "Un canon, muchas tradiciones"
 ve_idea_evt.30.d:0 "Los funcionarios que preparan un canon nacional no están de acuerdo sobre el lugar de las costumbres provinciales. Una cuenta única promete claridad, pero excluir las tradiciones locales puede debilitar a la propia nación que pretende definir."
 ve_idea_evt.30.a:0 "Entretejer las tradiciones locales en la historia común."
 ve_idea_evt.30.a.tt:0 "Gastar #N 25#! Perspectiva Nacional. La gente rural gana #P +1#! Aprobación y la Pequeña Burguesía pierde #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.30.b:0 "Proclama un canon oficial."
 ve_idea_evt.30.b.tt:0 "La Pequeña Burguesía gana #P +1#! Aprobación y la gente rural pierde #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.30.c:0 "Confía el trabajo a cuadros culturales capacitados."
 ve_idea_evt.30.c.tt:0 "Gasta #N 10#! Información Nacional. No hay cambios en la aprobación de grupos de interés."
 ve_idea_evt.31.t:0 "Asociaciones nacionales de veteranos"
 ve_idea_evt.31.d:0 "Los veteranos han organizado asociaciones que vinculan la ceremonia, la ayuda mutua y la lealtad al estado. Su red podría expandirse a nivel nacional o estudiarse sin otorgarle un papel oficial."
 ve_idea_evt.31.a:0 "Apoyar a las asociaciones en todo el país."
 ve_idea_evt.31.a.tt:0 "Gastar #N 40#! Información Nacional y ganar #P +5%#! Lealistas de Legitimidad durante 36 meses."
 ve_idea_evt.31.b:0 "Registrar su experiencia en los archivos estatales."
 ve_idea_evt.31.b.tt:0 "Obtener #P 15#! National Insight."
 ve_idea_evt.31.c:0 "Utilizar las redes nacionales ya establecidas."
 ve_idea_evt.31.c.tt:0 "Gastar #N 20#! Conocimiento y ganancia nacional #P +5%#! Leales a Legitimidad durante 36 meses."
 ve_idea_evt.32.t:0 "Sociedades Nacionales en competencia"
 ve_idea_evt.32.d:0 "Las sociedades rivales ahora reclaman el derecho de hablar en nombre de la nación. Sus ceremonias y publicaciones en competencia están convirtiendo un lenguaje político compartido en una fuente de agravios."
 ve_idea_evt.32.a:0 "Redactar una carta común."
 ve_idea_evt.32.a.tt:0 "Gaste #N 25#! Información Nacional y evite la penalización nacionalista."
 ve_idea_evt.32.b:0 "La competencia encontrará sus propios límites."
 ve_idea_evt.32.b.tt:0 "Sufrirá #N +5%#! Radicales de Legitimidad por 24 meses."
 ve_idea_evt.32.c:0 "Dejemos que las instituciones nacionales arbitren."
 ve_idea_evt.32.c.tt:0 "Gastar #N 10#! Visión Nacional y evitar la pena nacionalista."

 ve_idea_evt.40.t:0 "Comité o Calle"
 ve_idea_evt.40.d:0 "Los reformadores están divididos entre comisiones de expertos y presión de masas. Los comités prometen una legislación coherente, mientras que los movimientos organizados insisten en que la reforma sin la fuerza pública se retrasará indefinidamente."
 ve_idea_evt.40.a:0 "Crear una comisión de reforma independiente."
 ve_idea_evt.40.a.tt:0 "Gastar #N 25#! Perspectiva Nacional. La intelectualidad gana #P +1#! Aprobación y los sindicatos pierden #N 1#! aprobación durante 24 meses."
 ve_idea_evt.40.b:0 "Dar a los movimientos espacio para actuar."
 ve_idea_evt.40.b.tt:0 "Los sindicatos ganan #P +1#! Aprobación y los Industriales pierden #N 1#! Aprobación por 24 meses."
 ve_idea_evt.40.c:0 "Aplicar el marco de derechos y procedimiento establecido."
 ve_idea_evt.40.c.tt:0 "Gastar #N 10#! Perspectiva nacional. No hay cambios en la aprobación de grupos de interés."
 ve_idea_evt.41.t:0 "La Red de Peticiones"
 ve_idea_evt.41.d:0 "Las peticiones locales se han convertido en una red nacional coordinada capaz de clasificar quejas y proponer reformas. El gobierno puede reconocerlo como un canal de consulta o preservar sus métodos para su uso posterior."
 ve_idea_evt.41.a:0 "Convertir la red en una consulta formal."
 ve_idea_evt.41.a.tt:0 "Gastar #N 40#! Perspectiva nacional y gane #P +5%#! Leales de movimientos políticos durante 36 meses."
 ve_idea_evt.41.b:0 "Archive las demandas en el archivo de revisión."
 ve_idea_evt.41.b.tt:0 "Gane #P 15#! Perspectiva Nacional."
 ve_idea_evt.41.c:0 "Usar las organizaciones de reforma ya establecidas."
 ve_idea_evt.41.c.tt:0 "Gastar #N 20#! Insight nacional y ganancia #P +5%#! Leales de Movimientos Políticos durante 36 meses."
 ve_idea_evt.42.t:0 "Las fracturas de la coalición"
 ve_idea_evt.42.d:0 "La coalición reformista está dividida en cuanto a prioridades, calendario y liderazgo. A menos que se restablezca un programa común, la energía política organizada se endurecerá en campos radicales rivales."
 ve_idea_evt.42.a:0 "Reescribir el programa común."
 ve_idea_evt.42.a.tt:0 "Gastar #N 25#! National Insight y evitar la pena reformista."
 ve_idea_evt.42.b:0 "Dejemos que la división entre en la política abierta."
 ve_idea_evt.42.b.tt:0 "Sufrir #N +5%#! radicales de movimientos políticos durante 24 meses."
 ve_idea_evt.42.c:0 "Reaplicar el marco igualitario."
 ve_idea_evt.42.c.tt:0 "Gastar #N 10#! Información Nacional y evitar la penalización reformista."

 ve_idea_evt.50.t:0 "Antigüedad o Mérito"
 ve_idea_evt.50.d:0 "El cuerpo de oficiales está dividido en torno a los ascensos. Los comandantes superiores defienden el rango por servicio y costumbre, mientras que los reformadores exigen exámenes y registros de desempeño que abrirían el avance a la capacidad demostrada."
 ve_idea_evt.50.a:0 "Introducir exámenes de mérito."
 ve_idea_evt.50.a.tt:0 "Gastar #N 25#! Conocimiento y ganancia nacional #P +5%#! Tasa de Capacitación durante 24 meses. Las Fuerzas Armadas pierden #N 1#! Aprobación por 24 meses."
 ve_idea_evt.50.b:0 "Preservar el sistema de antigüedad."
 ve_idea_evt.50.b.tt:0 "Las Fuerzas Armadas ganan #P +1#! Aprobación por 24 meses, pero la tasa de capacitación cae #N -5%#! durante 12 meses."
 ve_idea_evt.50.c:0 "Utilice los registros de servicio del personal general."
 ve_idea_evt.50.c.tt:0 "Gasto #N 10#! Información Nacional y ganancia #P +5%#! Tasa de Capacitación durante 24 meses. La aprobación del grupo de interés no cambia."
 ve_idea_evt.51.t:0 "El gran ejercicio del personal"
 ve_idea_evt.51.d:0 "Un gran ejercicio de personal ha dejado al descubierto valiosas lecciones de movilización, instrucción y mando. Ampliar el programa podría difundir esas lecciones a través del ejército, mientras que archivar los hallazgos los preservaría a bajo costo."
 ve_idea_evt.51.a:0 "Ampliar el ejercicio."
 ve_idea_evt.51.a.tt:0 "Gastar #N 40#! Perspectiva y ganancia nacional #P +5%#! Tasa de entrenamiento durante 36 meses."
 ve_idea_evt.51.b:0 "Coloque los hallazgos en el archivo de doctrina."
 ve_idea_evt.51.b.tt:0 "Ganancia #P 15#! National Insight."
 ve_idea_evt.51.c:0 "Utilice la red de comando profesional."
 ve_idea_evt.51.c.tt:0 "Gaste #N 20#! National Insight y obtenga #P +5%#! Tasa de Capacitación durante 36 meses."
 ve_idea_evt.52.t:0 "Un cuello de botella en el cuerpo de oficiales"
 ve_idea_evt.52.d:0 "El ejército se está expandiendo más rápido de lo que sus instructores y oficiales pueden estar preparados. Los programas de formación dependen ahora de un grupo reducido de cuadros exhaustos."
 ve_idea_evt.52.a:0 "Ampliar el cuadro de formación."
 ve_idea_evt.52.a.tt:0 "Gastar #N 25#! National Insight y evitar la sanción militar."
 ve_idea_evt.52.b:0 "Presionar más a los cuadros existentes."
 ve_idea_evt.52.b.tt:0 "Sufrir #N -5%#! Tasa de entrenamiento durante 24 meses."
 ve_idea_evt.52.c:0 "Transferir la reserva del personal logístico."
 ve_idea_evt.52.c.tt:0 "Gastar #N 10#! Información Nacional y evitar la penalización militar."
