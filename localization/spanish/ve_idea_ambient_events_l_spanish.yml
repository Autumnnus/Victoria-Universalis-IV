l_spanish:
 ve_doctrine_ambient_cooldown_mdf:0 "Periodo de enfriamiento del debate doctrinal"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Las instituciones del país están absorbiendo las consecuencias de un debate doctrinal reciente."
 ve_doctrine_ambient_ig_supported_mdf:0 "Apoyo institucional"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "El Gobierno ha otorgado a este Grupo de interés una Función visible en la resolución de un debate doctrinal."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Desaire institucional"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "El Gobierno ha excluido a este Grupo de interés de un acuerdo doctrinal reciente."

 ve_doctrine_industrialist_positive_mdf:0 "Práctica industrial estandarizada"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Los fabricantes se están beneficiando de un conjunto coordinado de prácticas industriales."
 ve_doctrine_industrialist_negative_mdf:0 "Cuellos de botella industriales"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Los fallos de coordinación sin resolver están limitando la manufactura."
 ve_doctrine_academic_positive_mdf:0 "Red de investigación coordinada"
 ve_doctrine_academic_positive_mdf_desc:0 "Las universidades comparten métodos, personal y resultados a través de una red coordinada."
 ve_doctrine_academic_negative_mdf:0 "Cuellos de botella académicos"
 ve_doctrine_academic_negative_mdf_desc:0 "Las disputas sobre credenciales y coordinación están perturbando las universidades."
 ve_doctrine_nationalist_positive_mdf:0 "Red de asociaciones nacionales"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Las asociaciones nacionales están convirtiendo un Gobierno Legítimo en una Lealtad más amplia."
 ve_doctrine_nationalist_negative_mdf:0 "Sociedades nacionales competidoras"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Las organizaciones nacionales Rival están transformando la legitimidad política en nuevos agravios."
 ve_doctrine_reformist_positive_mdf:0 "Red de reforma organizada"
 ve_doctrine_reformist_positive_mdf_desc:0 "Los Movimientos políticos han obtenido cauces ordenados para la participación y el compromiso."
 ve_doctrine_reformist_negative_mdf:0 "Coalición reformista fracturada"
 ve_doctrine_reformist_negative_mdf_desc:0 "Las organizaciones reformistas competidoras están convertir la Movilización política en radicalismo."
 ve_doctrine_professional_army_positive_mdf:0 "Ciclo de formación de Estado Mayor"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Un programa coordinado de Estado Mayor está mejorando el sistema de entrenamiento del Ejército."
 ve_doctrine_professional_army_negative_mdf:0 "Cuello de botella en el cuerpo de oficiales"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Las disputas de ascenso y dotación de personal están ralentizando el entrenamiento militar."
 ve_doctrine_agrarian_positive_mdf:0 "Práctica agrícola coordinada"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Las instituciones rurales están difundiendo métodos fiables en toda la economía agrícola."
 ve_doctrine_agrarian_negative_mdf:0 "Escasez de suministros agrícolas"
 ve_doctrine_agrarian_negative_mdf_desc:0 "La escasez de semillas, Crédito y coordinación está reduciendo el Rendimiento agrícola."

 ve_idea_evt.10.t:0 "Códigos de seguridad a pleno Rendimiento"
 ve_idea_evt.10.d:0 "Una serie de accidentes en fábricas ha planteado abiertamente la cuestión de la inspección industrial. Los inspectores independientes prometen normas creíbles, mientras que los fabricantes insisten en que las normas voluntarias preservarán la producción y la iniciativa."
 ve_idea_evt.10.a:0 "Designar inspectores independientes."
 ve_idea_evt.10.a.tt:0 "Gastar #N 25#! Perspicacia nacional. Los Sindicatos ganan #P +1#! Aprobación y los Industrialistas pierden #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.10.b:0 "Permitir que las Industrias redacten códigos voluntarios."
 ve_idea_evt.10.b.tt:0 "Los Industrialistas ganan #P +1#! Aprobación y los Sindicatos pierden #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.10.c:0 "Estandarizar las normas por etapas."
 ve_idea_evt.10.c.tt:0 "Gastar #N 10#! Perspicacia nacional. No hay cambios en la Aprobación de grupo de interés."

 ve_idea_evt.11.t:0 "Piezas de máquina estandarizadas"
 ve_idea_evt.11.d:0 "Ingenieros de varios distritos industriales han elaborado un catálogo común de calibres, accesorios y piezas de máquina. Financiar un estándar nacional sería costoso, pero podría eliminar fricciones en toda la red de manufactura."
 ve_idea_evt.11.a:0 "Adoptar los estándares en todo el país."
 ve_idea_evt.11.a.tt:0 "Gastas #N 40#! de Perspicacia nacional y obtienes #P +5%#! de Rendimiento de manufactura durante 36 meses."
 ve_idea_evt.11.b:0 "Archivar los hallazgos para más adelante."
 ve_idea_evt.11.b.tt:0 "Obtienes #P 15#! de Perspicacia nacional."
 ve_idea_evt.11.c:0 "Nuestras redes de producción ya están preparadas."
 ve_idea_evt.11.c.tt:0 "Gastas #N 20#! de Perspicacia nacional y obtienes #P +5%#! de Rendimiento de manufactura durante 36 meses."

 ve_idea_evt.12.t:0 "El cuello de botella en los talleres"
 ve_idea_evt.12.d:0 "Los pedidos se acumulan mientras los procedimientos incompatibles, los componentes retrasados y los calendarios confusos ahogan las fábricas del país. El Gobierno puede enviar especialistas, dejar el problema en manos de las empresas o utilizar oficinas de construcción establecidas para coordinar una respuesta."
 ve_idea_evt.12.a:0 "Destacar a un equipo de especialistas."
 ve_idea_evt.12.a.tt:0 "Gastas #N 25#! de Perspicacia nacional y evitas la penalización industrial."
 ve_idea_evt.12.b:0 "Las fábricas deben resolver esto por sí mismas."
 ve_idea_evt.12.b.tt:0 "Sufres #N -5%#! de Rendimiento de manufactura durante 24 meses."
 ve_idea_evt.12.c:0 "Activar las oficinas de Construcción."
 ve_idea_evt.12.c.tt:0 "Gastas #N 10#! de Perspicacia nacional y evitas la penalización industrial."

 ve_idea_evt.60.t:0 "Mecanización y tenencia"
 ve_idea_evt.60.d:0 "La nueva maquinaria podría elevar la producción agrícola, pero los arrendatarios y los pequeños propietarios temen que una transición rápida desarraigue los medios de vida rurales. El Gobierno debe decidir si acelera la mecanización, protege primero la tenencia o coordina una transición local gradual."
 ve_idea_evt.60.a:0 "Crear un fondo de mecanización."
 ve_idea_evt.60.a.tt:0 "Gastas #N 25#! de Perspicacia nacional y obtienes #P +5%#! de Rendimiento de Agricultura durante 24 meses. Los Industrialistas obtienen #P +1#! de Aprobación y la Población rural pierde #N 1#! de Aprobación durante 24 meses."
 ve_idea_evt.60.b:0 "Asegurar a los arrendatarios antes de cambiar las explotaciones."
 ve_idea_evt.60.b.tt:0 "La Población rural gana #P +1#! de Aprobación y los Terratenientes pierden #N 1#! de Aprobación durante 24 meses."
 ve_idea_evt.60.c:0 "Utilizar redes de producción locales para una transición gradual."
 ve_idea_evt.60.c.tt:0 "Gastas #N 10#! de Perspicacia nacional y obtienes #P +5%#! de Rendimiento de Agricultura durante 24 meses. No hay cambios en la Aprobación de grupo de interés."

 ve_idea_evt.61.t:0 "Graneros cooperativos"
 ve_idea_evt.61.d:0 "Delegados rurales han demostrado una red de graneros cooperativos capaces de compartir reservas, registros y transporte. Un programa nacional podría fortalecer la coordinación agrícola, mientras que el mero hecho de preservar los planes seguiría enriqueciendo el conocimiento institucional del Gobierno."
 ve_idea_evt.61.a:0 "Financiar la red cooperativa."
 ve_idea_evt.61.a.tt:0 "Gastas #N 40#! de Perspicacia nacional y obtienes #P +5%#! de Rendimiento de Agricultura durante 36 meses."
 ve_idea_evt.61.b:0 "Distribuir los registros a las oficinas agrícolas."
 ve_idea_evt.61.b.tt:0 "Obtienes #P 15#! de Perspicacia nacional."
 ve_idea_evt.61.c:0 "Utilizar las instituciones rurales ya existentes."
 ve_idea_evt.61.c.tt:0 "Gastas #N 20#! de Perspicacia nacional y obtienes #P +5%#! de Rendimiento de Agricultura durante 36 meses."

 ve_idea_evt.62.t:0 "Escasez de semillas y Crédito"
 ve_idea_evt.62.d:0 "Las reservas de semillas deficientes y el endurecimiento del crédito rural amenazan el próximo ciclo agrícola. Los especialistas pueden organizar una respuesta de emergencia, se puede dejar que las redes locales improvisen o las instituciones de subsistencia establecidas pueden asumir temporalmente la carga."
 ve_idea_evt.62.a:0 "Organizar un programa de peritaje de emergencia."
 ve_idea_evt.62.a.tt:0 "Gastas #N 25#! de Perspicacia nacional y evitas la penalización agrícola."
 ve_idea_evt.62.b:0 "Dejar que las redes locales encuentren su propia solución."
 ve_idea_evt.62.b.tt:0 "Sufres #N -5%#! de Rendimiento de Agricultura durante 24 meses."
 ve_idea_evt.62.c:0 "Utilizar las redes de subsistencia como columna vertebral temporal."
 ve_idea_evt.62.c.tt:0 "Gastas #N 10#! de Perspicacia nacional y evitas la penalización agrícola."

 ve_idea_evt.20.t:0 "Patrocinio o revisión por pares"
 ve_idea_evt.20.d:0 "El Gobierno espera resultados prácticos de sus subvenciones a la investigación, mientras que los académicos advierten que el patrocinio sustituirá la evidencia por conveniencia política. Un acuerdo duradero debe definir quién juzga el saber del país."
 ve_idea_evt.20.a:0 "Establecer juntas de revisión independientes."
 ve_idea_evt.20.a.tt:0 "Gastas #N 25#! Perspicacia nacional. La Élite intelectual gana #P +1#! Aprobación y la Pequeña burguesía pierde #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.20.b:0 "Dejar que el Estado defina las prioridades de investigación."
 ve_idea_evt.20.b.tt:0 "La Pequeña burguesía gana #P +1#! Aprobación y la Élite intelectual pierde #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.20.c:0 "Institucionalizar normas académicas comunes."
 ve_idea_evt.20.c.tt:0 "Gastas #N 10#! Perspicacia nacional. No hay cambios en la Aprobación de grupo de interés."
 ve_idea_evt.21.t:0 "Una red de investigación provincial"
 ve_idea_evt.21.d:0 "Los colegios provinciales han comenzado a intercambiar profesores, instrumentos y descubrimientos sin una dirección central. Un apoyo formal podría convertir esta cooperación improvisada en una red de investigación nacional."
 ve_idea_evt.21.a:0 "Financiar la red."
 ve_idea_evt.21.a.tt:0 "Gastas #N 40#! Perspicacia nacional y ganas #P +5%#! Rendimiento de Universidad durante 36 meses."
 ve_idea_evt.21.b:0 "Archivar los informes en el archivo central."
 ve_idea_evt.21.b.tt:0 "Ganas #P 15#! Perspicacia nacional."
 ve_idea_evt.21.c:0 "Conectarla con la academia nacional."
 ve_idea_evt.21.c.tt:0 "Gastas #N 20#! Perspicacia nacional y ganas #P +5%#! Rendimiento de Universidad durante 36 meses."
 ve_idea_evt.22.t:0 "El cuello de botella de las credenciales"
 ve_idea_evt.22.d:0 "Las universidades no pueden evaluar con la suficiente rapidez el creciente número de estudiantes, instructores y nuevas disciplinas. El retraso en las credenciales amenaza ahora a todo el sistema de investigación."
 ve_idea_evt.22.a:0 "Ampliar la capacidad de evaluación."
 ve_idea_evt.22.a.tt:0 "Gastas #N 25#! Perspicacia nacional y evitas la penalización académica."
 ve_idea_evt.22.b:0 "Las instituciones existentes deben apañárselas."
 ve_idea_evt.22.b.tt:0 "Sufres #N -5%#! Rendimiento de Universidad durante 24 meses."
 ve_idea_evt.22.c:0 "Estandarizar a través de la red escolar."
 ve_idea_evt.22.c.tt:0 "Gastas #N 10#! Perspicacia nacional y evitas la penalización académica."

 ve_idea_evt.30.t:0 "Un canon, muchas tradiciones"
 ve_idea_evt.30.d:0 "Los funcionarios que preparan un canon nacional discrepan sobre el lugar de las costumbres provinciales. Un relato único promete claridad, pero excluir las tradiciones locales puede debilitar a la propia nación que pretende definir."
 ve_idea_evt.30.a:0 "Entrelazar las tradiciones locales en la historia común."
 ve_idea_evt.30.a.tt:0 "Gastas #N 25#! Perspicacia nacional. La Población rural gana #P +1#! Aprobación y la Pequeña burguesía pierde #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.30.b:0 "Proclamar un canon oficial."
 ve_idea_evt.30.b.tt:0 "La Pequeña burguesía gana #P +1#! Aprobación y la Población rural pierde #N 1#! Aprobación durante 24 meses."
 ve_idea_evt.30.c:0 "Confiar la labor a cuadros cultural capacitados."
 ve_idea_evt.30.c.tt:0 "Gastas #N 10#! Perspicacia nacional. No hay cambios en la Aprobación de grupo de interés."
 ve_idea_evt.31.t:0 "Asociaciones nacionales de veteranos"
 ve_idea_evt.31.d:0 "Los veteranos han organizado asociaciones que vinculan la ceremonia, la ayuda mutua y la lealtad al Estado. Su red podría ampliarse a nivel nacional o estudiarse sin concederle una función oficial."
 ve_idea_evt.31.a:0 "Apoyar las asociaciones a nivel nacional."
 ve_idea_evt.31.a.tt:0 "Gastas #N 40#! Perspicacia nacional y ganas #P +5%#! Lealistas de Legitimacy durante 36 meses."
 ve_idea_evt.31.b:0 "Registrar su experiencia en los archivos del Estado."
 ve_idea_evt.31.b.tt:0 "Ganas #P 15#! Perspicacia nacional."
 ve_idea_evt.31.c:0 "Utilizar las redes nacionales ya establecidas."
 ve_idea_evt.31.c.tt:0 "Gastas #N 20#! Perspicacia nacional y ganas #P +5%#! Lealistas de Legitimacy durante 36 meses."
 ve_idea_evt.32.t:0 "Sociedades nacionales competidoras"
 ve_idea_evt.32.d:0 "Sociedades rivales reclaman ahora el derecho a hablar en nombre de la nación. Sus ceremonias y publicaciones concurrentes están convirtiendo un lenguaje político compartido en un motivo de agravio."
 ve_idea_evt.32.a:0 "Redactar una carta común."
 ve_idea_evt.32.a.tt:0 "Gastas #N 25#! de Perspicacia nacional y evitas la penalización nacionalista."
 ve_idea_evt.32.b:0 "La competencia encontrará sus propios límites."
 ve_idea_evt.32.b.tt:0 "Sufres #N +5%#! de Radicales por Legitimacy durante 24 meses."
 ve_idea_evt.32.c:0 "Dejar que las instituciones nacionales arbitren."
 ve_idea_evt.32.c.tt:0 "Gastas #N 10#! de Perspicacia nacional y evitas la penalización nacionalista."

 ve_idea_evt.40.t:0 "Comité o calle"
 ve_idea_evt.40.d:0 "Los reformistas se dividen entre las comisiones de expertos y la presión de masas. Los comités prometen una legislación coherente, mientras que los movimientos organizados insisten en que la reforma sin la fuerza pública se retrasará indefinidamente."
 ve_idea_evt.40.a:0 "Crear una comisión de reforma independiente."
 ve_idea_evt.40.a.tt:0 "Gastas #N 25#! de Perspicacia nacional. La Élite intelectual gana #P +1#! de Aprobación y los Sindicatos pierden #N 1#! de Aprobación durante 24 meses."
 ve_idea_evt.40.b:0 "Dar margen de actuación a los movimientos."
 ve_idea_evt.40.b.tt:0 "Los Sindicatos ganan #P +1#! de Aprobación y los Industrialistas pierden #N 1#! de Aprobación durante 24 meses."
 ve_idea_evt.40.c:0 "Aplicar el marco establecido de derechos y procedimientos."
 ve_idea_evt.40.c.tt:0 "Gastas #N 10#! de Perspicacia nacional. No hay cambios en la Aprobación de grupo de interés."
 ve_idea_evt.41.t:0 "La red de peticiones"
 ve_idea_evt.41.d:0 "Las peticiones locales se han convertido en una red nacional coordinada capaz de ordenar agravios y proponer reformas. El Gobierno puede reconocerla como un canal consultivo o preservar sus métodos para su uso posterior."
 ve_idea_evt.41.a:0 "Convertir la red en consulta formal."
 ve_idea_evt.41.a.tt:0 "Gastas #N 40#! de Perspicacia nacional y ganas #P +5%#! de Lealistas por Movimientos políticos durante 36 meses."
 ve_idea_evt.41.b:0 "Archivar las demandas en el registro de revisión."
 ve_idea_evt.41.b.tt:0 "Ganas #P 15#! de Perspicacia nacional."
 ve_idea_evt.41.c:0 "Utilizar las organizaciones de reforma ya establecidas."
 ve_idea_evt.41.c.tt:0 "Gastas #N 20#! de Perspicacia nacional y ganas #P +5%#! de Lealistas por Movimientos políticos durante 36 meses."
 ve_idea_evt.42.t:0 "La coalición se fractura"
 ve_idea_evt.42.d:0 "La coalición reformista se divide por las prioridades, el calendario y el liderazgo. A menos que se restablezca un programa común, la energía política organizada se endurecerá en bandos radicales rivales."
 ve_idea_evt.42.a:0 "Reescribir el programa común."
 ve_idea_evt.42.a.tt:0 "Gastas #N 25#! de Perspicacia nacional y evitas la penalización reformista."
 ve_idea_evt.42.b:0 "Permitir que la división entre en la política abierta."
 ve_idea_evt.42.b.tt:0 "Sufres #N +5%#! de Radicales por Movimientos políticos durante 24 meses."
 ve_idea_evt.42.c:0 "Reaplicar el marco igualitario."
 ve_idea_evt.42.c.tt:0 "Gastas #N 10#! de Perspicacia nacional y evitas la penalización reformista."

 ve_idea_evt.50.t:0 "¿Antigüedad o mérito?"
 ve_idea_evt.50.d:0 "El cuerpo de oficiales está dividido respecto a los ascensos. Los comandantes superiores defienden el Rango por servicio y costumbre, mientras que los reformistas exigen exámenes y expedientes de rendimiento que abran el ascenso a la capacidad demostrada."
 ve_idea_evt.50.a:0 "Introducir exámenes de mérito."
 ve_idea_evt.50.a.tt:0 "Gastas #N 25#! de Perspicacia nacional y ganas #P +5%#! de Tasa de adiestramiento durante 24 meses. Las Fuerzas armadas pierden #N 1#! de Aprobación durante 24 meses."
 ve_idea_evt.50.b:0 "Preservar el sistema de antigüedad."
 ve_idea_evt.50.b.tt:0 "Las Fuerzas armadas ganan #P +1#! de Aprobación durante 24 meses, pero la Tasa de adiestramiento se reduce en un #N -5%#! durante 12 meses."
 ve_idea_evt.50.c:0 "Utilizar los expedientes de servicio del estado mayor."
 ve_idea_evt.50.c.tt:0 "Gastas #N 10#! de Perspicacia nacional y ganas #P +5%#! de Tasa de adiestramiento durante 24 meses. La Aprobación de grupo de interés no cambia."
 ve_idea_evt.51.t:0 "El gran ejercicio de estado mayor"
 ve_idea_evt.51.d:0 "Un gran ejercicio de estado mayor ha dejado al descubierto valiosas lecciones sobre movilización, instrucción y comando. Ampliar el programa podría difundir dichas lecciones por todo el ejército, mientras que archivar las conclusiones permitiría preservarlas con un coste mínimo."
 ve_idea_evt.51.a:0 "Ampliar el ejercicio."
 ve_idea_evt.51.a.tt:0 "Gastas #N 40#! de Perspicacia nacional y obtienes #P +5%#! de Tasa de adiestramiento durante 36 meses."
 ve_idea_evt.51.b:0 "Guardar las conclusiones en el archivo de la doctrina."
 ve_idea_evt.51.b.tt:0 "Obtienes #P 15#! de Perspicacia nacional."
 ve_idea_evt.51.c:0 "Utilizar la red de mando profesional."
 ve_idea_evt.51.c.tt:0 "Gastas #N 20#! de Perspicacia nacional y obtienes #P +5%#! de Tasa de adiestramiento durante 36 meses."
 ve_idea_evt.52.t:0 "Un cuello de botella en el cuerpo de oficiales"
 ve_idea_evt.52.d:0 "El ejército está creciendo a un ritmo superior al que sus instructores y oficiales de estado mayor pueden asimilar. Los calendarios de adiestramiento dependen ahora de un reducido grupo de cuadros fatigados."
 ve_idea_evt.52.a:0 "Ampliar el cuadro de adiestramiento."
 ve_idea_evt.52.a.tt:0 "Gastas #N 25#! de Perspicacia nacional y evitas la penalización militar."
 ve_idea_evt.52.b:0 "Exigir más a los cuadros existentes."
 ve_idea_evt.52.b.tt:0 "Sufres #N -5%#! de Tasa de adiestramiento durante 24 meses."
 ve_idea_evt.52.c:0 "Destinar la reserva de personal logístico."
 ve_idea_evt.52.c.tt:0 "Gastas #N 10#! de Perspicacia nacional y evitas la penalización militar."
