l_spanish:
 ve_je_religious_project:0 "Proyecto Religioso"
 ve_je_religious_project_reason:0 "El gobierno está dirigiendo un proyecto religioso a largo plazo. Su progreso se rige por la capacidad administrativa, la legitimidad política, las condiciones religiosas y los acontecimientos en el estado objetivo."
 ve_je_religious_project_progress:0 "Progreso del proyecto religioso hacia su finalización"
 ve_je_religious_project_status_confessional:0 "La conversión confesional en [JournalEntry.GetTarget.GetState.GetName] busca extender la fe estatal a través de una campaña organizada.\n\nFinalización en #Y 125#! progreso: convierte el 5% de la población del estado objetivo a la religión estatal, reembolsa #P 20#! la reforma de la piedad y agrega #P 5#! Asentamiento religioso."
 ve_je_religious_project_status_freedom:0 "El alcance de la libertad en [JournalEntry.GetTarget.GetState.GetName] está construyendo un acuerdo basado en la conciencia y la asociación voluntaria.\n\nFinalización en #Y 100#! progreso: agrega leales al estado sin conversión forzada, reembolsos #P 20#! Reforma de la piedad y agrega #P 7#! Asentamiento religioso."
 ve_je_religious_project_status_secularization:0 "La campaña de secularización en [JournalEntry.GetTarget.GetState.GetName] está reduciendo la autoridad pública de la religión organizada.\n\nFinalización en #Y 150#! progreso: convierte al 5% de la población del estado objetivo al ateísmo, reembolsa #P 25#! Reforma de la Piedad y agrega #P 8#! Asentamientos Religiosos."
 ve_je_religious_project_complete_tt:0 "El Proyecto Religioso ha alcanzado su objetivo."
 ve_je_religious_project_fail_tt:0 "El Proyecto Religioso ha sido cancelado."

 ve_je_cultural_project:0 "Proyecto Cultural"
 ve_je_cultural_project_reason:0 "El gobierno está dirigiendo un proyecto cultural a largo plazo. La capacidad administrativa, la legitimidad, la educación, la cohesión nacional y las condiciones locales determinan su ritmo."
 ve_je_cultural_project_progress:0 "Progreso del proyecto cultural hacia su finalización"
 ve_je_cultural_project_status_curriculum:0 "Se está preparando un plan de estudios nacional para las escuelas e instituciones del país.\n\nFinalización en #Y 100#! avance: #P +20#! Mandato cultural, #P +5#! Cohesión nacional y un resultado de 10 años de +2% en educación Acceso, +5% Calificaciones, -25 Burocracia."
 ve_je_cultural_project_status_symbols:0 "Un programa de Símbolos Compartidos está forjando un vocabulario cívico común.\n\nFinalización en #Y 75#! Progreso:  #P +20#! Mandato Cultural, #P +7#! Cohesión Nacional y un resultado de 8 años de +10% de leales de poblaciones totalmente aceptadas y +25 Autoridad."
 ve_je_cultural_project_status_ethnic:0 "La Campaña de Integración Étnica en [JournalEntry.GetTarget.GetState.GetName] está presionando a una población minoritaria hacia la cultura primaria.\n\nFinalización en #Y 125#! progreso: convierte el 5% de los pops de la cultura objetivo a la cultura primaria (7% con Nacionalista VII), #P +25#! Mandato Cultural, #P +8#! Cohesión Nacional y un resultado de asimilación de 10 años."
 ve_je_cultural_project_status_civic:0 "La Iniciativa de Ciudadanía Igualitaria en [JournalEntry.GetTarget.GetState.GetName] está extendiendo un estatus cívico común a través de líneas culturales.\n\nFinalización en #Y 100#! progreso: +15% Aceptación por 10 años, leales al estado, #P +25#! Mandato Cultural, #P +10#! Cohesión Nacional y un resultado de calificaciones/migración a 10 años."
 ve_je_cultural_project_status_composite:0 "El Pacto Constituyente en [JournalEntry.GetTarget.GetState.GetName] está negociando el reconocimiento permanente dentro de un estado compuesto.\n\nFinalización en #Y 150#! progreso (requiere 40+ Cohesión Nacional): permanente +15% de Aceptación, agrega la cultura a la lista constituyente, leales al estado, #P +30#! Mandato Cultural, #P +12#! Cohesión Nacional."
 ve_je_cultural_project_complete_tt:0 "El Proyecto Cultural ha alcanzado su objetivo."
 ve_je_cultural_project_fail_tt:0 "El Proyecto Cultural ha sido cancelado."
 ve_je_project_resolving_status:0 "La administración del proyecto está presentando su informe final."

 ve_evt_religious_incident_cooldown_mdf:0 "Enfriamiento del incidente del proyecto religioso"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "La administración del proyecto está absorbiendo las consecuencias de un incidente reciente."
 ve_evt_cultural_incident_cooldown_mdf:0 "Enfriamiento del incidente del proyecto cultural"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "La administración del proyecto está absorbiendo las consecuencias de un incidente reciente."
 ve_evt_central_clergy_supported_mdf:0 "Clero central apoyado"
 ve_evt_central_clergy_supported_mdf_desc:0 "El gobierno ha mantenido la autoridad de la jerarquía religiosa central."
 ve_evt_central_clergy_slighted_mdf:0 "Clero central despreciado"
 ve_evt_central_clergy_slighted_mdf_desc:0 "El gobierno ha favorecido las prácticas locales sobre las preferencias de la jerarquía religiosa central."
 ve_evt_municipal_patronage_mdf:0 "Redes de patrocinio municipal"
 ve_evt_municipal_patronage_mdf_desc:0 "Los notables locales están impulsando el proyecto a través de acuerdos que debilitan la recaudación de impuestos."

 ve_rel_evt.1.t:0 "La Petición de los Notables Locales"
 ve_rel_evt.1.d:0 "Una delegación de clérigos, figuras municipales y ancianos del vecindario de [SCOPE.sState('ve_evt_target_state').GetName] ha solicitado al gobierno que frene la conversión confesional. Advierten que un calendario inflexible convertirá el cumplimiento en un resentimiento duradero."
 ve_rel_evt.1.f:0 "\\"La fe impuesta sin consejo puede llenar las cajas registradoras mientras se vacían los bancos.\\""
 ve_rel_evt.1.a:0 "Escuche su petición."
 ve_rel_evt.1.a.tt:0 "El progreso del Proyecto Religioso disminuye en #N 4#!.\nEl Asentamiento Religioso aumenta en #P 3#!."
 ve_rel_evt.1.b:0 "El cronograma no cambiará."
 ve_rel_evt.1.b.tt:0 "El progreso del Proyecto Religioso aumenta en #P 5#!.\nEl asentamiento religioso disminuye en #N 2#!.\n#N 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_rel_evt.1.c:0 "Encarga intermediarios confiables."
 ve_rel_evt.1.c.tt:0 "Gasta #N 10#! Reforma de la Piedad.\nEl progreso del Proyecto Religioso aumenta en #P 3#!.\nEl Asentamiento Religioso aumenta en #P 1#!."

 ve_rel_evt.2.t:0 "Escasez de oficiales de campo"
 ve_rel_evt.2.d:0 "Los informes [SCOPE.sState('ve_evt_target_state').GetName] describen peticiones sin respuesta, instrucciones contradictorias y distritos que no han visto a un oficial de proyecto en semanas. La Conversión Confesional está superando a la administración asignada para llevarla a cabo."
 ve_rel_evt.2.f:0 "\\"Un decreto puede cruzar el país en un día. Un funcionario competente no puede.\\""
 ve_rel_evt.2.a:0 "Contratar oficiales de campo temporales."
 ve_rel_evt.2.a.tt:0 "Gastar #N 15#! Reforma de la Piedad.\nEl progreso del Proyecto Religioso aumenta en #P 4#!."
 ve_rel_evt.2.b:0 "Ralentiza el programa."
 ve_rel_evt.2.b.tt:0 "El progreso del Proyecto Religioso disminuye en #N 6#!.\nEl Asentamiento Religioso aumenta en #P 2#!."
 ve_rel_evt.2.c:0 "Usa los cuadros del registro central."
 ve_rel_evt.2.c.tt:0 "Gasta #N 10#! Reforma de la Piedad.\nEl progreso del Proyecto Religioso aumenta en #P 5#!."

 ve_cul_evt.1.t:0 "Las Oficinas de Traducción"
 ve_cul_evt.1.d:0 "Funcionarios en [SCOPE.sState('ve_evt_target_state').GetName] no están de acuerdo sobre cómo la Iniciativa de Ciudadanía Igual debería abordar la [SCOPE.sCulture('ve_evt_target_culture').GetName] idioma. Los administradores locales quieren oficinas bilingües; Los ministerios centrales exigen una norma administrativa única."
 ve_cul_evt.1.f:0 "\\"Un ciudadano no debería necesitar un intérprete para comprender los derechos otorgados en su propio nombre.\\""
 ve_cul_evt.1.a:0 "Dejar que las lenguas locales vivan en las instituciones públicas."
 ve_cul_evt.1.a.tt:0 "El avance del Proyecto Cultural disminuye en #N 4#!.\nLa cohesión nacional aumenta en #P 3#!."
 ve_cul_evt.1.b:0 "Imponer una norma administrativa."
 ve_cul_evt.1.b.tt:0 "El progreso del proyecto cultural aumenta en #P 5#!.\nLa cohesión nacional disminuye en #N 2#!.\n#N 0,5%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población [SCOPE.sState('ve_evt_target_state').GetName] se vuelve radical."
 ve_cul_evt.1.c:0 "Establecer una comisión de traducción académica."
 ve_cul_evt.1.c.tt:0 "Gastar #N 10#! Mandato cultural.\nEl progreso del proyecto cultural aumenta en #P 3#!.\nLa cohesión nacional aumenta en #P 1#!."

 ve_cul_evt.2.t:0 "Escasez de docentes locales"
 ve_cul_evt.2.d:0 "Las escuelas de [SCOPE.sState('ve_evt_target_state').GetName] Faltan maestros capaces de atender tanto el plan de estudios estatal como [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidades. Sin un cuadro local capacitado, la igualdad de ciudadanía corre el riesgo de seguir siendo una promesa escrita sólo en papel oficial."
 ve_cul_evt.2.f:0 "\\"La ley declara la igualdad en una tarde; el aula debe enseñarla durante una generación.\\""
 ve_cul_evt.2.a:0 "Financiar nuevas escuelas de profesores."
 ve_cul_evt.2.a.tt:0 "Gastar #N 15#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 4#!."
 ve_cul_evt.2.b:0 "Lenta implementación."
 ve_cul_evt.2.b.tt:0 "El progreso del Proyecto Cultural disminuye en #N 6#!.\nLa Cohesión Nacional aumenta en #P 2#!."
 ve_cul_evt.2.c:0 "Usa las instituciones que ya existen."
 ve_cul_evt.2.c.tt:0 "Gasta #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 5#!.\nLa Cohesión Nacional aumenta en #P 1#!."

 ve_rel_evt.3.t:0 "Registros en conflicto"
 ve_rel_evt.3.d:0 "Las listas parroquiales, los libros de contabilidad municipales y los informes de los funcionarios del proyecto dan relatos incompatibles sobre la adhesión religiosa en [SCOPE.sState('ve_evt_target_state').GetName]. La administración debe decidir si pierde tiempo en establecer la verdad o procede con cifras que sabe que son inciertas."
 ve_rel_evt.3.f:0 "\\"Cada oficina posee un total exacto. No hay dos totales que coincidan.\\""
 ve_rel_evt.3.a:0 "Realizar una auditoría completa."
 ve_rel_evt.3.a.tt:0 "Gain #P 8#! Reforma de la piedad.\nEl progreso del proyecto religioso disminuye en #N 6#!."
 ve_rel_evt.3.b:0 "Continuar con estimaciones razonables."
 ve_rel_evt.3.b.tt:0 "Gastar #N 8#! Reforma de la piedad.\nEl progreso del proyecto religioso aumenta en #P 5#!."
 ve_rel_evt.3.c:0 "Usa los registros de la Administración Sagrada."
 ve_rel_evt.3.c.tt:0 "El progreso del Proyecto Religioso aumenta en #P 3#!."

 ve_rel_evt.4.t:0 "Rumores y contrapredicaciones"
 ve_rel_evt.4.d:0 "Folletos, sermones callejeros y rumores ansiosos describen ahora la conversión confesional en [SCOPE.sState('ve_evt_target_state').GetName] como un asalto a la vida local. Los funcionarios advierten que el silencio permitirá a los opositores definir el proyecto, mientras que la represión puede confirmar sus afirmaciones más oscuras."
 ve_rel_evt.4.f:0 "\\"Un rumor no requiere oficina, ni sello, ni presupuesto\\"."
 ve_rel_evt.4.a:0 "Celebrar audiencias públicas."
 ve_rel_evt.4.a.tt:0 "El progreso del Proyecto Religioso disminuye en #N 3#!.\nEl Asentamiento Religioso aumenta en #P 3#!.\n#P 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Leal."
 ve_rel_evt.4.b:0 "Castiga a los agitadores."
 ve_rel_evt.4.b.tt:0 "El progreso del Proyecto Religioso aumenta en #P 4#!.\nEl Asentamiento Religioso disminuye en #N 3#!.\n#N 1%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_rel_evt.4.c:0 "Publica los registros y resultados."
 ve_rel_evt.4.c.tt:0 "Gasta #N 10#! Reforma de la Piedad.\nEl progreso del Proyecto Religioso aumenta en #P 2#!.\nEl Asentamiento Religioso aumenta en #P 1#!."

 ve_rel_evt.5.t:0 "El lenguaje del sermón"
 ve_rel_evt.5.d:0 "Proyecto clero en [SCOPE.sState('ve_evt_target_state').GetName] informan que los sermones formales preservan la unidad doctrinal pero no logran llegar a muchos feligreses. La predicación en el idioma local llevaría la campaña más lejos, aunque la jerarquía central teme que la adaptación se convierta en independencia."
 ve_rel_evt.5.f:0 "\\"Una palabra sagrada que no se escucha se conserva perfectamente y nadie la recibe.\\""
 ve_rel_evt.5.a:0 "Predica en los idiomas locales."
 ve_rel_evt.5.a.tt:0 "El progreso del Proyecto Religioso aumenta en #P 6#!.\nLos Devotos pierden #N 1#! Aprobación durante #Y 2,5 años#!."
 ve_rel_evt.5.b:0 "Preservar la unidad litúrgica."
 ve_rel_evt.5.b.tt:0 "El progreso del Proyecto Religioso disminuye en #N 3#!.\nEl Asentamiento Religioso aumenta en #P 3#!.\nLos Devotos ganan #P 1#! Aprobación durante #Y 2,5 años#!."
 ve_rel_evt.5.c:0 "Capacitar intérpretes educados."
 ve_rel_evt.5.c.tt:0 "Gastar #N 10#! Reforma de la piedad.\nEl progreso del proyecto religioso aumenta en #P 4#!.\nLos asentamientos religiosos aumentan en #P 1#!."

 ve_rel_evt.6.t:0 "Autoridades eclesiásticas rivales"
 ve_rel_evt.6.d:0 "Nombramientos centrales y clero local establecido en [SCOPE.sState('ve_evt_target_state').GetName] cada uno reclama el derecho de dirigir la Conversión Confesional. Apoyar a un bando puede restablecer el mando rápidamente, pero la disputa ya se ha convertido en una prueba para saber quién habla en nombre de la fe."
 ve_rel_evt.6.f:0 "\\"La disputa tiene que ver con la jurisdicción, que es como las instituciones describen el poder.\\""
 ve_rel_evt.6.a:0 "Apoyar al clero central."
 ve_rel_evt.6.a.tt:0 "El progreso del Proyecto Religioso aumenta en #P 5#!.\nLa ganancia devota #P 1#! Aprobación por #Y 2,5 años#!.\nEl asentamiento religioso disminuye en #N 3#!.\n#N 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_rel_evt.6.b:0 "Apaciguar al clero local."
 ve_rel_evt.6.b.tt:0 "El progreso del Proyecto Religioso disminuye en #N 4#!.\nLos Devotos pierden #N 1#! Aprobación por #Y 2,5 años#!.\nEl Asentamiento Religioso aumenta en #P 3#!."
 ve_rel_evt.6.c:0 "Define sus poderes por escrito."
 ve_rel_evt.6.c.tt:0 "Gasta #N 10#! Reforma de la Piedad.\nEl progreso del Proyecto Religioso aumenta en #P 3#!.\nEl Asentamiento Religioso aumenta en #P 1#!."

 ve_cul_evt.3.t:0 "Las Categorías del Censo"
 ve_cul_evt.3.d:0 "Los funcionarios del censo en [SCOPE.sState('ve_evt_target_state').GetName] no podemos ponernos de acuerdo sobre cómo los ciudadanos de [SCOPE.sCulture('ve_evt_target_culture').GetName] Se debe registrar la cultura. Los encuestados locales utilizan identidades superpuestas, mientras que los formularios centrales exigen una respuesta en un cuadro."
 ve_cul_evt.3.f:0 "\\"Una categoría simplifica el libro mayor mucho antes de que simplifique el país\\"."
 ve_cul_evt.3.a:0 "Permitir la autoidentificación."
 ve_cul_evt.3.a.tt:0 "El progreso del Proyecto Cultural disminuye en #N 4#!.\nLa Cohesión Nacional aumenta en #P 4#!."
 ve_cul_evt.3.b:0 "Las categorías se establecerán centralmente."
 ve_cul_evt.3.b.tt:0 "El progreso del Proyecto Cultural aumenta en #P 6#!.\nLa Cohesión Nacional disminuye en #N 4#!.\n#N 0,5%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.3.c:0 "Utilice el moderno sistema de registro."
 ve_cul_evt.3.c.tt:0 "Gastar #N 10#! mandato cultural.\nEl progreso del proyecto cultural aumenta en #P 5#!.\nLa cohesión nacional aumenta en #P 1#!."

 ve_cul_evt.4.t:0 "Los notables municipales"
 ve_cul_evt.4.d:0 "Patronos municipales en [SCOPE.sState('ve_evt_target_state').GetName] ofrecen sus oficinas, clientes e influencia para promover la igualdad de ciudadanía para el [SCOPE.sCulture('ve_evt_target_culture').GetName] población. Su cooperación sería rápida, pero el precio es seguir controlando los ingresos locales."
 ve_cul_evt.4.f:0 "\\"El camino más corto hasta el ayuntamiento pasa por varios salones privados.\\""
 ve_cul_evt.4.a:0 "Utilice las redes locales."
 ve_cul_evt.4.a.tt:0 "El progreso del proyecto cultural aumenta en #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] pierde #N 5%#! Capacidad Fiscal durante #Y 2 años#!."
 ve_cul_evt.4.b:0 "Crear consejos abiertos."
 ve_cul_evt.4.b.tt:0 "El progreso del Proyecto Cultural disminuye en #N 3#!.\nLa Cohesión Nacional aumenta en #P 3#!."
 ve_cul_evt.4.c:0 "Negociar un acuerdo basado en reglas."
 ve_cul_evt.4.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 3#!.\nLa Cohesión Nacional aumenta en #P 1#!."

 ve_cul_evt.5.t:0 "Los Exámenes de Servicio Civil"
 ve_cul_evt.5.d:0 "Abrir los exámenes de servicio civil a [SCOPE.sCulture('ve_evt_target_culture').GetName] candidatos ha puesto de manifiesto una brecha entre la igualdad jurídica y la preparación práctica. El acceso inmediato sería simbólicamente poderoso, pero años de escolarización desigual no pueden borrarse por decreto."
 ve_cul_evt.5.f:0 "\\"El mismo examen no es la misma oportunidad cuando sólo un candidato aprendió su idioma\\"."
 ve_cul_evt.5.a:0 "Cursos preparatorios de finanzas."
 ve_cul_evt.5.a.tt:0 "Gasto #N 15#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 5#!.\nLa Cohesión Nacional aumenta en #P 2#!."
 ve_cul_evt.5.b:0 "El acceso igualitario comienza inmediatamente."
 ve_cul_evt.5.b.tt:0 "El progreso del Proyecto Cultural aumenta en #P 7#!.\nLa Cohesión Nacional disminuye en #N 4#!.\n#N 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.5.c:0 "Movilizar las redes escolares y de bienestar."
 ve_cul_evt.5.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 5#!.\nLa Cohesión Nacional aumenta en #P 2#!."
 ve_cul_evt.5.e:0 "Reforma primero el sistema de exámenes."
 ve_cul_evt.5.e.tt:0 "El progreso del Proyecto Cultural disminuye en #N 4#!.\nLa Cohesión Nacional aumenta en #P 3#!."

 ve_cul_evt.6.t:0 "La mayoría rechaza"
 ve_cul_evt.6.d:0 "Los oponentes a la Iniciativa de Ciudadanía Igualitaria afirman que extender los derechos comunes a los [SCOPE.sCulture('ve_evt_target_culture').GetName] población disminuye la posición de todos los demás. Las manifestaciones en [SCOPE.sState('ve_evt_target_state').GetName]  están convirtiendo una reforma administrativa en una prueba política nacional."
 ve_cul_evt.6.f:0 "\\"Un derecho compartido se describe como un privilegio robado.\\""
 ve_cul_evt.6.a:0 "Defender la iniciativa abiertamente."
 ve_cul_evt.6.a.tt:0 "El avance del Proyecto Cultural aumenta en un #P 4#!.\nLa Cohesión Nacional disminuye en #N 4#!.\n#N 1%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.6.b:0 "Reducir el ritmo de implementación."
 ve_cul_evt.6.b.tt:0 "El progreso del Proyecto Cultural disminuye en #N 5#!.\nLa Cohesión Nacional aumenta en #P 3#!."
 ve_cul_evt.6.c:0 "Movilizar la coalición de reforma."
 ve_cul_evt.6.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 3#!.\nLa Cohesión Nacional aumenta en #P 2#!.\n#P 0,5%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población [SCOPE.sState('ve_evt_target_state').GetName] se vuelve leal."

 ve_rel_evt.7.t:0 "La misión en el punto de ruptura"
 ve_rel_evt.7.d:0 "La conversión confesional en  [SCOPE.sState('ve_evt_target_state').GetName] está cerca del colapso administrativo y político. Las oficinas han dejado de responderse entre sí, la resistencia pública se está endureciendo y el clero de campo advierte que la misión no puede continuar en los términos actuales."
 ve_rel_evt.7.f:0 "\\"Los informes todavía lo llaman una dificultad temporal. Las calles han elegido un nombre más duro.\\""
 ve_rel_evt.7.a:0 "Acepte las pérdidas y retírese."
 ve_rel_evt.7.a.tt:0 "Cancele el Proyecto Religioso sin reembolso por la Reforma de la Piedad.\nEl Acuerdo Religioso disminuye en #N 5#!.\nPara #Y 2 años#!: #N -50#! Burocracia, #N -50#! Autoridad y #N -3%#! Éxito en la promulgación de leyes."
 ve_rel_evt.7.b:0 "Transferir recursos de emergencia."
 ve_rel_evt.7.b.tt:0 "Gastar #N 25#! Reforma de la piedad.\nEl progreso del proyecto religioso disminuye en #N 5#!.\n#N 1%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se convierte en Radical.\nEl proyecto continúa."
 ve_rel_evt.7.c:0 "Continúe con un bastón esqueleto."
 ve_rel_evt.7.c.tt:0 "El progreso del Proyecto Religioso disminuye en #N 10#!.\nEl asentamiento religioso disminuye en #N 2#!.\nEl proyecto continúa."
 ve_rel_evt.7.e:0 "Renegociar el método."
 ve_rel_evt.7.e.tt:0 "Gastar #N 15#! Reforma de la piedad.\nEl progreso del proyecto religioso disminuye en #N 3#!.\nEl asentamiento religioso aumenta en #P 2#!.\n#N 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se convierte en Radical.\nEl proyecto continúa."

 ve_cul_evt.7.t:0 "La iniciativa pierde legitimidad"
 ve_cul_evt.7.d:0 "La Iniciativa de Igualdad de Ciudadanía en [SCOPE.sState('ve_evt_target_state').GetName] está perdiendo apoyo tanto de las instituciones establecidas como de la [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidades a las que debía servir. Los movimientos radicales ahora presentan cada compromiso como una prueba de que el gobierno no puede lograr la igualdad."
 ve_cul_evt.7.f:0 "\\"Una reforma puede sobrevivir a la oposición. No puede sobrevivir a volverse increíble.\\""
 ve_cul_evt.7.a:0 "Finalizar la iniciativa."
 ve_cul_evt.7.a.tt:0 "Cancelar el Proyecto Cultural sin devolución del Mandato Cultural.\nLa Cohesión Nacional disminuye en #N 5#!.\nDurante #Y 2 años#!: #N -50#! burocracia, #N -25#! autoridad y #N -3%#! éxito en la promulgación de leyes."
 ve_cul_evt.7.b:0 "Emitir subvenciones locales de emergencia."
 ve_cul_evt.7.b.tt:0 "Gastar #N 25#! mandato cultural.\nEl progreso del proyecto cultural disminuye en #N 5#!.\n#N 1%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."
 ve_cul_evt.7.c:0 "Continuar con un programa mínimo."
 ve_cul_evt.7.c.tt:0 "El progreso del Proyecto Cultural disminuye en #N 10#!.\nLa Cohesión Nacional disminuye en #N 2#!.\nEl proyecto continúa."
 ve_cul_evt.7.e:0 "Reconstruir la coalición."
 ve_cul_evt.7.e.tt:0 "Gastar #N 15#! Mandato Cultural.\nEl avance del Proyecto Cultural disminuye en #N 3#!.\nLa Cohesión Nacional aumenta en #P 2#!.\n#N 0,5%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."

 ve_rel_evt.8.t:0 "Una Concordia Local Inesperada"
 ve_rel_evt.8.d:0 "El clero, los funcionarios municipales y los ancianos de la comunidad en [SCOPE.sState('ve_evt_target_state').GetName] han llegado a un acuerdo no directiva central podría haber producido. La resistencia local está retrocediendo, las congregaciones están coordinando la misión por sí mismas y la conversión confesional ha adquirido un impulso inesperado."
 ve_rel_evt.8.f:0 "\\"Lo que comenzó como una orden de la capital se ha convertido en un pacto hecho en la plaza del pueblo.\\""
 ve_rel_evt.8.a:0 "Utilice este impulso al máximo."
 ve_rel_evt.8.a.tt:0 "El Asentamiento Religioso aumenta en #P 1#!.\nEl progreso del Proyecto Religioso aumenta en #P 25#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."
 ve_rel_evt.8.b:0 "Durabilidad antes que la velocidad."
 ve_rel_evt.8.b.tt:0 "El Asentamiento Religioso aumenta en #P 4#!.\nEl progreso del Proyecto Religioso aumenta en #P 10#!.\nSi el progreso llega a #Y 100#!, se aplica el efecto de finalización normal del proyecto."

 ve_cul_evt.8.t:0 "Una Coalición Cívica Local"
 ve_cul_evt.8.d:0 "Maestros, funcionarios municipales, asociaciones comerciales y representantes de la comunidad [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidad en [SCOPE.sState('ve_evt_target_state').GetName] han formado un comité común. Al resolver las disputas antes de que lleguen a la capital, esta coalición le ha dado a la Iniciativa de Ciudadanía Igualitaria un impulso que la administración no pudo generar."
 ve_cul_evt.8.f:0 "\\"La ciudadanía se hizo real cuando instituciones que rara vez compartían una mesa comenzaron a compartir responsabilidades\\"."
 ve_cul_evt.8.a:0 "Aprovechar el impulso de la coalición."
 ve_cul_evt.8.a.tt:0 "La cohesión nacional aumenta en #P 1#!.\nEl progreso del Proyecto Cultural aumenta en #P 25#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."
 ve_cul_evt.8.b:0 "Haga que las instituciones sean permanentes."
 ve_cul_evt.8.b.tt:0 "La Cohesión Nacional aumenta en #P 4#!.\nEl progreso del Proyecto Cultural aumenta en #P 10#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."

 ve_rel_evt.40.t:0 "Registros Fuera de Paso"
 ve_rel_evt.40.d:0 "Registros provinciales en [SCOPE.sState('ve_evt_target_state').GetName] Utilice categorías incompatibles para congregaciones, asociaciones cívicas e instituciones públicas. Los informes que llegan a la capital ahora se contradicen entre sí, dejando al proyecto incapaz de distinguir el cumplimiento de la resistencia."
 ve_rel_evt.40.f:0 "\\"Una política administrada a través de tres libros de contabilidad pronto adquiere tres realidades diferentes.\\""
 ve_rel_evt.40.a:0 "Envíe una auditoría central."
 ve_rel_evt.40.a.tt:0 "Gaste #N 10#! reforma de la piedad.\nEl progreso del proyecto religioso aumenta en #P 5#!.\nEl asentamiento religioso aumenta en #P 1#!."
 ve_rel_evt.40.b:0 "Conciliar los registros localmente."
 ve_rel_evt.40.b.tt:0 "El progreso del Proyecto Religioso disminuye en #N 3#!.\nEl Asentamiento Religioso aumenta en #P 2#!."
 ve_rel_evt.40.c:0 "Aplicar el procedimiento de registro estándar."
 ve_rel_evt.40.c.tt:0 "Gastar #N 5#! Reforma de la Piedad.\nEl progreso del Proyecto Religioso aumenta en #P 4#!.\nLos asentamientos religiosos aumentan en #P 1#!."

 ve_rel_evt.41.t:0 "Escasez de personal provincial"
 ve_rel_evt.41.d:0 "Las oficinas que dirigen el proyecto [SCOPE.sState('ve_evt_target_state').GetName] no pueden encontrar suficientes empleados, maestros e inspectores capacitados. Las directivas se están acumulando más rápido de lo que los funcionarios locales pueden interpretarlas, y los nombramientos apresurados amenazan con empeorar cada disputa."
 ve_rel_evt.41.f:0 "\\"El decreto llegó en un día. Las personas capaces de implementarlo pueden tardar una generación.\\""
 ve_rel_evt.41.a:0 "Financiar un nuevo cuadro de funcionarios."
 ve_rel_evt.41.a.tt:0 "Gastar #N 15#! reforma de la piedad.\nEl progreso del proyecto religioso aumenta en #P 6#!."
 ve_rel_evt.41.b:0 "Ralentiza la implementación."
 ve_rel_evt.41.b.tt:0 "El progreso del Proyecto Religioso disminuye en #N 6#!.\nEl Asentamiento Religioso aumenta en #P 2#!."
 ve_rel_evt.41.c:0 "Usa la red educativa existente."
 ve_rel_evt.41.c.tt:0 "Gasta #N 10#! Reforma de la Piedad.\nEl progreso del Proyecto Religioso aumenta en #P 5#!.\nEl asentamiento religioso aumenta en #P 1#!."

 ve_rel_evt.42.t:0 "Rumores en todo el distrito"
 ve_rel_evt.42.d:0 "Los rumores in [SCOPE.sState('ve_evt_target_state').GetName] agan que el proyecto esconde medidas mucho más duras que las anunciadas por el gobierno. Los organizadores religiosos y los agitadores locales repiten historias contradictorias, mientras que el silencio oficial deja espacio para que se difunda cada nueva versión."
 ve_rel_evt.42.f:0 "\\"Un rumor no requiere oficina, ni presupuesto, ni firma.\\""
 ve_rel_evt.42.a:0 "Publique los informes."
 ve_rel_evt.42.a.tt:0 "El progreso del Proyecto Religioso disminuye en #N 3#!.\nEl Asentamiento Religioso aumenta en #P 4#!."
 ve_rel_evt.42.b:0 "Descartar la agitación."
 ve_rel_evt.42.b.tt:0 "El progreso del Proyecto Religioso aumenta en #P 5#!.\nEl Asentamiento Religioso disminuye en #N 3#!.\n#N 1%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_rel_evt.42.c:0 "Encarga mediadores locales."
 ve_rel_evt.42.c.tt:0 "Gasta #N 10#! Reforma de la piedad.\nEl progreso del Proyecto Religioso aumenta en #P 4#!.\nEl Asentamiento Religioso aumenta en #P 2#!.\n#P 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Leal."

 ve_rel_evt.43.t:0 "La Administración en el Punto de Ruptura"
 ve_rel_evt.43.d:0 "El proyecto en [SCOPE.sState('ve_evt_target_state').GetName] se acerca al colapso administrativo. Las oficinas provinciales están abrumadas, la confianza pública se ha desmoronado y la oposición organizada ahora trata cada nueva directiva como prueba de que el gobierno ha perdido el control."
 ve_rel_evt.43.f:0 "\\"Cuando los expedientes dejan de moverse, la crisis llega a las calles\"."
 ve_rel_evt.43.a:0 "Finalizar el programa."
 ve_rel_evt.43.a.tt:0 "Cancelar el Proyecto Religioso sin reembolso por la Reforma de la Piedad.\nEl Asentamiento Religioso disminuye en #N 5#!.\nDurante #Y 2 años#!: #N -50#! burocracia, #N -50#! autoridad y #N -3%#! éxito en la promulgación de leyes."
 ve_rel_evt.43.b:0 "Transferir recursos de emergencia."
 ve_rel_evt.43.b.tt:0 "Gastar #N 25#! reforma de la piedad.\nEl progreso del proyecto religioso disminuye en #N 5#!.\n#N 1%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se convierte en Radical.\nEl proyecto continúa."
 ve_rel_evt.43.c:0 "Continúe con un bastón esqueleto."
 ve_rel_evt.43.c.tt:0 "El progreso del Proyecto Religioso disminuye en #N 10#!.\nLos asentamientos religiosos disminuyen en #N 2#!.\nEl proyecto continúa."
 ve_rel_evt.43.e:0 "Reconstruir la asociación local."
 ve_rel_evt.43.e.tt:0 "Gastar #N 15#! Reforma de la piedad.\nEl progreso del Proyecto Religioso disminuye en #N 3#!.\nLos Asentamientos Religiosos aumentan en #P 2#!.\n#N 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve radical.\nEl proyecto continúa."

 ve_rel_evt.100.t:0 "Asientos en el Consejo Interreligioso"
 ve_rel_evt.100.d:0 "Delegados en [SCOPE.sState('ve_evt_target_state').GetName] están de acuerdo en que es necesario un consejo interreligioso, pero no sobre quién merece un asiento. La representación proporcional tranquilizaría a las comunidades más pequeñas, mientras que un asentamiento fijo diseñado en la capital podría comenzar a funcionar de inmediato."
 ve_rel_evt.100.f:0 "\\"Todos apoyan una mesa común hasta que se cuenten las sillas.\\""
 ve_rel_evt.100.a:0 "Distribuir la representación por población."
 ve_rel_evt.100.a.tt:0 "El progreso del proyecto religioso disminuye en #N 3#!.\nEl asentamiento religioso aumenta en #P 4#!."
 ve_rel_evt.100.b:0 "Imponer un compromiso central fijo."
 ve_rel_evt.100.b.tt:0 "El progreso del proyecto religioso aumenta en #P 5#!.\nEl asentamiento religioso disminuye en #N 2#!.\n#N 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve radical."
 ve_rel_evt.100.c:0 "Fortalecer a los consejos interreligiosos."
 ve_rel_evt.100.c.tt:0 "Gasta #N 10#! reforma de la piedad.\nEl progreso del proyecto religioso aumenta en #P 5#!.\nEl asentamiento religioso aumenta en #P 2#!."

 ve_rel_evt.101.t:0 "Un plan de estudios escolar compartido"
 ve_rel_evt.101.d:0 "Escuelas en [SCOPE.sState('ve_evt_target_state').GetName] Necesitamos lecciones cívicas comunes sin convertir Freedom Outreach en una campaña contra las creencias locales. Los maestros solicitan materiales claros y capacitación conjunta, mientras que los líderes comunitarios insisten en que la instrucción local deje espacio para sus tradiciones."
 ve_rel_evt.101.f:0 "\\"Una lección compartida sólo tiene éxito si cada familia reconoce el aula como suya.\\""
 ve_rel_evt.101.a:0 "Financiar un equipo docente común."
 ve_rel_evt.101.a.tt:0 "Gastar #N 15#! Reforma de la piedad.\nEl progreso del Proyecto Religioso aumenta en #P 6#!.\nEl Asentamiento Religioso aumenta en #P 1#!."
 ve_rel_evt.101.b:0 "Dejar espacio para los planes de estudios locales."
 ve_rel_evt.101.b.tt:0 "El progreso del Proyecto Religioso disminuye en #N 4#!.\nEl Asentamiento Religioso aumenta en #P 3#!."
 ve_rel_evt.101.c:0 "Trae la coalición de reforma a las escuelas."
 ve_rel_evt.101.c.tt:0 "Gasta #N 10#! Reforma de la piedad.\nEl progreso del proyecto religioso aumenta en #P 5#!.\nEl asentamiento religioso aumenta en #P 2#!.\n#P 0,5 %#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve leal."

 ve_rel_evt.102.t:0 "Una Carta de Garantías Mutuas"
 ve_rel_evt.102.d:0 "Comunidades religiosas, funcionarios municipales y asociaciones reformistas en [SCOPE.sState('ve_evt_target_state').GetName] han redactado una carta común. Cada signatario acepta las mismas obligaciones cívicas a cambio de garantías públicas de que ninguna comunidad será excluida de las instituciones locales."
 ve_rel_evt.102.f:0 "\\"La confianza se hizo posible cuando cada promesa fue escrita como un derecho de otra parte\\"."
 ve_rel_evt.102.a:0 "Utilice el impulso del pacto."
 ve_rel_evt.102.a.tt:0 "El Asentamiento Religioso aumenta en #P 2#!.\nEl progreso del Proyecto Religioso aumenta en #P 20#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."
 ve_rel_evt.102.b:0 "Haga que las garantías sean permanentes."
 ve_rel_evt.102.b.tt:0 "El Asentamiento Religioso aumenta en #P 4#!.\n#P 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se convierte en Leal.\nEl progreso del proyecto religioso aumenta en #P 10#!.\nSi el progreso llega a #Y 100#!, se aplica el efecto de finalización normal del proyecto."

 ve_rel_evt.150.t:0 "¿Profesores o inspectores?"
 ve_rel_evt.150.d:0 "La Campaña de Secularización en [SCOPE.sState('ve_evt_target_state').GetName] ha expuesto una escasez de personal alfabetizado. La administración puede ampliar el cuerpo docente que desarrolla la capacidad cívica a largo plazo, o confiar en inspectores que puedan hacer cumplir las nuevas reglas con el personal ya disponible."
 ve_rel_evt.150.f:0 "\\"Un inspector puede cerrar una escuela en una tarde. Un maestro puede necesitar años para reemplazar lo que se enseñó allí.\\""
 ve_rel_evt.150.a:0 "Ampliar el cuerpo docente."
 ve_rel_evt.150.a.tt:0 "Gastar #N 15#! Reforma de la Piedad.\nEl progreso del Proyecto Religioso aumenta en #P 6#!."
 ve_rel_evt.150.b:0 "Ralentiza el programa para que coincida con el personal existente."
 ve_rel_evt.150.b.tt:0 "El progreso del Proyecto Religioso disminuye en #N 5#!.\nEl Asentamiento Religioso aumenta en #P 2#!."
 ve_rel_evt.150.c:0 "Encargar la red de educación pública."
 ve_rel_evt.150.c.tt:0 "Gaste #N 10#! reforma de la piedad.\nEl progreso del proyecto religioso aumenta en #P 5#!.\nEl asentamiento religioso aumenta en #P 1#!."

 ve_rel_evt.151.t:0 "Las Propiedades Incautadas"
 ve_rel_evt.151.d:0 "Antiguas propiedades religiosas en [SCOPE.sState('ve_evt_target_state').GetName] están listos para su conversión en escuelas, clínicas y oficinas cívicas. La transferencia inmediata daría a la campaña una infraestructura valiosa, pero la ausencia de compensación se está convirtiendo en un punto de reunión para los Devotos."
 ve_rel_evt.151.f:0 "\\"Las llaves cambiaron de manos en una mañana. La discusión sobre la propiedad sobrevivirá a las cerraduras.\\""
 ve_rel_evt.151.a:0 "Pague la compensación por etapas."
 ve_rel_evt.151.a.tt:0 "Gastar #N 15#! Reforma de la Piedad.\nEl progreso del Proyecto Religioso aumenta en #P 3#!.\nEl Asentamiento Religioso aumenta en #P 3#!."
 ve_rel_evt.151.b:0 "Pone las propiedades en servicio público inmediatamente."
 ve_rel_evt.151.b.tt:0 "El progreso del Proyecto Religioso aumenta en #P 7#!.\nEl Asentamiento Religioso disminuye en #N 4#!.\n#N 1%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve radical.\nLos devotos pierden #N 1#! aprobación para #Y 2,5 años#!."
 ve_rel_evt.151.c:0 "Transferirlos a instituciones de bienestar seculares."
 ve_rel_evt.151.c.tt:0 "Gastar #N 10#! Reforma de la piedad.\nEl progreso del proyecto religioso aumenta en #P 5#!.\nLos asentamientos religiosos aumentan en #P 2#!.\n#P 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve leal."

 ve_rel_evt.152.t:0 "Asociaciones cívicas se arraigan"
 ve_rel_evt.152.d:0 "Círculos de docentes, sociedades de ayuda mutua y asociaciones municipales en [SCOPE.sState('ve_evt_target_state').GetName] han comenzado a brindar servicios que alguna vez estuvieron organizados a través de instituciones religiosas. Su cooperación le ha dado a la Campaña de Secularización una fundación cívica local en lugar de una mera presencia administrativa."
 ve_rel_evt.152.f:0 "\\"El nuevo orden perduró cuando los ciudadanos comenzaron a mantenerlo sin esperar a un inspector.\\""
 ve_rel_evt.152.a:0 "Aproveche el impulso local."
 ve_rel_evt.152.a.tt:0 "El Asentamiento Religioso aumenta en #P 2#!.\nEl progreso del Proyecto Religioso aumenta en #P 20#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."
 ve_rel_evt.152.b:0 "Convierte las asociaciones en instituciones permanentes."
 ve_rel_evt.152.b.tt:0 "El Asentamiento Religioso aumenta en #P 4#!.\nEl progreso del Proyecto Religioso aumenta en #P 10#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."

 ve_cul_evt.40.t:0 "Juntas Escolares Locales"
 ve_cul_evt.40.d:0 "juntas escolares en [SCOPE.sState('ve_evt_target_state').GetName] no están de acuerdo sobre el lugar del [SCOPE.sCulture('ve_evt_target_culture').GetName] El lenguaje en la enseñanza pública. La enseñanza en el idioma local preservaría la confianza, mientras que un idioma administrativo único haría que el proyecto nacional fuera más fácil de dirigir."
 ve_cul_evt.40.f:0 "\\"El idioma elegido para la primera lección a menudo decide quién cree que la escuela les pertenece.\\""
 ve_cul_evt.40.a:0 "Proteger la lengua local."
 ve_cul_evt.40.a.tt:0 "El avance del Proyecto Cultural disminuye en #N 4#!.\nLa Cohesión Nacional aumenta en #P 3#!."
 ve_cul_evt.40.b:0 "Imponer una lengua administrativa."
 ve_cul_evt.40.b.tt:0 "El avance del Proyecto Cultural aumenta un #P 5#!.\nLa Cohesión Nacional disminuye un #N 2#!.\n#N 0,5%#! del [SCOPE.sCulture('ve_evt_target_culture').GetName] población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.40.c:0 "Ampliar la red de docentes."
 ve_cul_evt.40.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 4#!.\nLa cohesión nacional aumenta en #P 2#!."

 ve_cul_evt.41.t:0 "Límites estadísticos"
 ve_cul_evt.41.d:0 "Oficiales encuestando [SCOPE.sState('ve_evt_target_state').GetName] No podemos ponernos de acuerdo sobre dónde [SCOPE.sCulture('ve_evt_target_culture').GetName] La comunidad comienza y termina. Las identidades locales se superponen en términos de idioma, distrito y costumbres, pero el proyecto nacional exige categorías que puedan contarse y administrarse."
 ve_cul_evt.41.f:0 "\\"Un límite trazado para el censo pronto adquiere funcionarios, presupuestos y defensores.\\""
 ve_cul_evt.41.a:0 "Deja espacio para la autoidentificación."
 ve_cul_evt.41.a.tt:0 "El progreso del Proyecto Cultural disminuye en #N 3#!.\nLa Cohesión Nacional aumenta en #P 3#!."
 ve_cul_evt.41.b:0 "Deje que el centro defina los límites."
 ve_cul_evt.41.b.tt:0 "El progreso del Proyecto Cultural aumenta en #P 6#!.\nLa Cohesión Nacional disminuye en #N 3#!.\n#N 0,5%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.41.c:0 "Utilice el sistema de registro estándar."
 ve_cul_evt.41.c.tt:0 "Gasta #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 5#!.\nLa cohesión nacional aumenta en #P 1#!."

 ve_cul_evt.42.t:0 "El proyecto nacional en el punto de ruptura"
 ve_cul_evt.42.d:0 "El proyecto nacional en [SCOPE.sState('ve_evt_target_state').GetName] se acerca al colapso. Los movimientos radicales afirman que el gobierno ha traicionado a la [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidad o se han rendido a ella, mientras que las oficinas locales ya no tienen la confianza para hacer cumplir otro compromiso."
 ve_cul_evt.42.f:0 "\\"Un acuerdo atacado como coerción y rendición pronto puede dejar de ser un acuerdo.\\""
 ve_cul_evt.42.a:0 "Poner fin al proyecto."
 ve_cul_evt.42.a.tt:0 "Cancelar el Proyecto Cultural sin devolución del Mandato Cultural.\nLa Cohesión Nacional disminuye en #N 5#!.\nDurante #Y 2 años#!: #N -50#! burocracia, #N -25#! autoridad y #N -3%#! éxito en la promulgación de leyes."
 ve_cul_evt.42.b:0 "Transferir recursos locales de emergencia."
 ve_cul_evt.42.b.tt:0 "Gastar #N 25#! mandato cultural.\nEl progreso del proyecto cultural disminuye en #N 5#!.\n#N 1%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población [SCOPE.sState('ve_evt_target_state').GetName] se convierte Radical.\nEl proyecto continúa."
 ve_cul_evt.42.c:0 "Continuar con un programa mínimo."
 ve_cul_evt.42.c.tt:0 "El avance del Proyecto Cultural disminuye en #N 10#!.\nLa Cohesión Nacional disminuye en #N 2#!.\nEl proyecto continúa."
 ve_cul_evt.42.e:0 "Reconstruir el marco de negociación."
 ve_cul_evt.42.e.tt:0 "Gastar #N 15#! Mandato Cultural.\nEl avance del Proyecto Cultural disminuye en #N 3#!.\nLa cohesión nacional aumenta en un #P 2#!.\n#N 0,5%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."

 ve_cul_evt.50.t:0 "La Directiva de Apellidos e Idioma"
 ve_cul_evt.50.d:0 "Funcionarios en [SCOPE.sState('ve_evt_target_state').GetName] proponer estandarizar apellidos y registros públicos en el idioma nacional. La directiva haría que [SCOPE.sCulture('ve_evt_target_culture').GetName] Es más fácil para la administración central clasificar a la población, pero las familias temen que la identidad privada se esté convirtiendo en un objeto de mando estatal."
 ve_cul_evt.50.f:0 "\\"Un nombre escrito de manera diferente en el registro aún puede ser el nombre por el cual una familia se recuerda a sí misma.\\""
 ve_cul_evt.50.a:0 "Financiar una campaña de registro gradual."
 ve_cul_evt.50.a.tt:0 "Gastar #N 10#! mandato cultural.\nEl progreso del proyecto cultural aumenta en #P 4#!.\nLa cohesión nacional aumenta en #P 1#!.\n#N 0,5%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población [SCOPE.sState('ve_evt_target_state').GetName] se vuelve radical."
 ve_cul_evt.50.b:0 "Aplicar un estándar nacional."
 ve_cul_evt.50.b.tt:0 "El progreso del proyecto cultural aumenta en #P 7#!.\nLa cohesión nacional disminuye en #N 4#!.\n#N 1%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve radical."
 ve_cul_evt.50.c:0 "Retirar la directiva para su revisión."
 ve_cul_evt.50.c.tt:0 "El progreso del proyecto cultural disminuye en #N 5#!.\nLa cohesión nacional aumenta en #P 3#!."

 ve_cul_evt.51.t:0 "Los Registros de Conscripción"
 ve_cul_evt.51.d:0 "Oficiales militares en [SCOPE.sState('ve_evt_target_state').GetName] Exigir un registro único de obligaciones de servicio, apellidos y mandos. Aplicándolo a la [SCOPE.sCulture('ve_evt_target_culture').GetName] La población fortalecería la campaña de integración étnica, pero la resistencia está creciendo entre las comunidades que ven al ejército como otro instrumento de eliminación cultural."
 ve_cul_evt.51.f:0 "\\"El estado aprende primero los nombres de una aldea cuando desea recaudar sus impuestos o convocar a sus hijos.\\""
 ve_cul_evt.51.a:0 "Aplicar los registros nacionales."
 ve_cul_evt.51.a.tt:0 "El avance del Proyecto Cultural aumenta en #P 5#!.\nCohesión Nacional disminuye en #N 2#!.\n#N 0,5%#! del [SCOPE.sCulture('ve_evt_target_culture').GetName] población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve radical."
 ve_cul_evt.51.b:0 "Preservar las prácticas de registro local."
 ve_cul_evt.51.b.tt:0 "El avance del Proyecto Cultural disminuye en #N 3#!.\nLa Cohesión Nacional aumenta en #P 3#!."
 ve_cul_evt.51.c:0 "Integrar los registros a través del servicio militar."
 ve_cul_evt.51.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nEl avance del Proyecto Cultural aumenta en #P 6#!.\nLa Cohesión Nacional aumenta en #P 1#!.\n#N 0,5%#! la [SCOPE.sCulture('ve_evt_target_culture').GetName] población [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."

 ve_cul_evt.100.t:0 "La Delegación Constituyente"
 ve_cul_evt.100.d:0 "Una delegación de la [SCOPE.sCulture('ve_evt_target_culture').GetName] comunidad [SCOPE.sState('ve_evt_target_state').GetName] ha llegado con demandas de representación en las instituciones del Pacto Constituyente. La negociación ralentizaría el proyecto pero fortalecería su legitimidad; un acuerdo impuesto desde la capital podría avanzar más rápido a costa de la confianza."
 ve_cul_evt.100.f:0 "\\"Un pacto se vuelve común sólo cuando cada elector puede señalar una cláusula que ayudó a redactar\\"."
 ve_cul_evt.100.a:0 "Negociar su lugar en el pacto."
 ve_cul_evt.100.a.tt:0 "El progreso del Proyecto Cultural disminuye en #N 4#!.\nLa Cohesión Nacional aumenta en #P 4#!."
 ve_cul_evt.100.b:0 "Imponer el acuerdo central."
 ve_cul_evt.100.b.tt:0 "El progreso del Proyecto Cultural aumenta en #P 5#!.\nLa Cohesión Nacional disminuye en #N 2#!.\n#N 0,5%#! del [SCOPE.sCulture('ve_evt_target_culture').GetName] población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve radical."
 ve_cul_evt.100.c:0 "Involucrar a la coalición parlamentaria en las conversaciones."
 ve_cul_evt.100.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 4#!.\nLa cohesión nacional aumenta en #P 2#!."

 ve_cul_evt.101.t:0 "Administración dual"
 ve_cul_evt.101.d:0 "El Pacto Constituyente en [SCOPE.sState('ve_evt_target_state').GetName] ahora depende de dos administraciones superpuestas. Funcionarios centrales y representantes de la [SCOPE.sCulture('ve_evt_target_culture').GetName] La comunidad duplica registros, disputa nombramientos y emite instrucciones contradictorias mientras la burocracia del país se acerca al agotamiento."
 ve_cul_evt.101.f:0 "\\"Dos oficinas pueden compartir la autoridad más fácilmente que un archivador\"."
 ve_cul_evt.101.a:0 "Financiar un personal administrativo conjunto."
 ve_cul_evt.101.a.tt:0 "Gasto #N 15#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 6#!."
 ve_cul_evt.101.b:0 "Ralentiza el pacto hasta que las oficinas estén de acuerdo."
 ve_cul_evt.101.b.tt:0 "El progreso del Proyecto Cultural disminuye en #N 6#!.\nLa Cohesión Nacional aumenta en #P 2#!."
 ve_cul_evt.101.c:0 "Unificar las oficinas bajo la función pública."
 ve_cul_evt.101.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nEl avance del Proyecto Cultural aumenta en #P 5#!.\nLa Cohesión Nacional aumenta en #P 2#!."

 ve_cul_evt.150.t:0 "Implementación en las Provincias"
 ve_cul_evt.150.d:0 "Las administraciones provinciales informan que el proyecto cultural a nivel nacional avanza a velocidades radicalmente diferentes. Algunas oficinas exigen comisiones de implementación financiadas, mientras que otras advierten que imponer un calendario único a cada región consumirá personal escaso y debilitará la confianza del público."
 ve_cul_evt.150.f:0 "\\"Un decreto nacional se redacta una vez, pero debe implementarse en todas las oficinas del país\\"."
 ve_cul_evt.150.a:0 "Financiar las comisiones de implementación."
 ve_cul_evt.150.a.tt:0 "Gasto #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 5#!."
 ve_cul_evt.150.b:0 "Utilice un cronograma gradual."
 ve_cul_evt.150.b.tt:0 "El progreso del Proyecto Cultural disminuye en #N 4#!.\nLa cohesión nacional aumenta en #P 2#!."
 ve_cul_evt.150.c:0 "Estandarizar la administración existente."
 ve_cul_evt.150.c.tt:0 "Gastar #N 5#! Mandato cultural.\nEl progreso del proyecto cultural aumenta en #P 3#!.\nLa cohesión nacional aumenta en #P 2#!."

 ve_cul_evt.151.t:0 "La lengua de instrucción"
 ve_cul_evt.151.d:0 "El Plan de Estudios Nacional requiere un idioma de instrucción común, sin embargo, las escuelas de todo el país atienden a comunidades con tradiciones lingüísticas muy diferentes. Los materiales multilingües preservarían la confianza pero retrasarían la distribución, mientras que un plan de estudios único podría llegar rápidamente a las aulas a riesgo de convertir la educación en un concurso cultural."
 ve_cul_evt.151.f:0 "\"Una lección impartida en un idioma en el que el alumno desconfía puede ser recordada por todo menos por el tema\"."
 ve_cul_evt.151.a:0 "Financiar materiales multilingües."
 ve_cul_evt.151.a.tt:0 "Gastar #N 10#! Mandato Cultural.\nEl avance del Proyecto Cultural aumenta en #P 3#!.\nLa Cohesión Nacional aumenta en #P 3#!."
 ve_cul_evt.151.b:0 "Aplicar un currículo nacional."
 ve_cul_evt.151.b.tt:0 "El progreso del Proyecto Cultural aumenta en #P 6#!.\nLa Cohesión Nacional disminuye en #N 3#!."
 ve_cul_evt.151.c:0 "Unir las redes de enseñanza y bienestar."
 ve_cul_evt.151.c.tt:0 "Gasta #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 5#!.\nLa Cohesión Nacional aumenta en #P 2#!."

 ve_cul_evt.160.t:0 "¿Quién representa a la nación?"
 ve_cul_evt.160.d:0 "El proyecto Símbolos Compartidos ha reabierto la cuestión de qué historia, uniformes, monumentos y ceremonias pueden representar a todo el país. Las tradiciones rotativas ampliarían el reconocimiento pero retrasarían el acuerdo; Seleccionar una narrativa oficial crearía claridad y dejaría a muchos ciudadanos fuera de ella."
 ve_cul_evt.160.f:0 "\\"Un símbolo se vuelve nacional sólo cuando los ciudadanos se ven a sí mismos en él sin necesidad de explicación.\\""
 ve_cul_evt.160.a:0 "Rotar los símbolos en uso público."
 ve_cul_evt.160.a.tt:0 "El progreso del Proyecto Cultural disminuye en #N 3#!.\nLa cohesión nacional aumenta en #P 4#!."
 ve_cul_evt.160.b:0 "Seleccione una narrativa oficial."
 ve_cul_evt.160.b.tt:0 "El progreso del Proyecto Cultural aumenta en #P 6#!.\nLa Cohesión Nacional disminuye en #N 3#!."
 ve_cul_evt.160.c:0 "Diseñar una ceremonia pública compartida."
 ve_cul_evt.160.c.tt:0 "Gastar #N 10#! Mandato Cultural.\nEl progreso del Proyecto Cultural aumenta en #P 4#!.\nLa Cohesión Nacional aumenta en #P 2#!."
