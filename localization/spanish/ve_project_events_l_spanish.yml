l_spanish:
 ve_je_religious_project:0 "Proyecto religioso"
 ve_je_religious_project_reason:0 "El Gobierno dirige un proyecto religioso a largo plazo. Su progreso está determinado por la capacidad administrativa, la legitimidad política, las condiciones religiosas y los acontecimientos en el Estado objetivo."
 ve_je_religious_project_progress:0 "Progreso hacia la culminación del Proyecto religioso"
 ve_je_religious_project_status_confessional:0 "La Conversión confesional en [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] busca extender la fe del Estado a través de una campaña organizada.\n\nCulminación con #Y 125#! de progreso: convierte al 5% de la población del Estado objetivo a la Religión del Estado, reembolsa #P 20#! de Reforma piadosa y otorga #P 5#! de Arreglo religioso."
 ve_je_religious_project_status_freedom:0 "La Labor de acercamiento en [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] está construyendo un arreglo basado en la conciencia y la asociación voluntaria.\n\nCulminación con #Y 100#! de progreso: añade lealistas al Estado sin conversión forzosa, reembolsa #P 20#! de Reforma piadosa y otorga #P 7#! de Arreglo religioso."
 ve_je_religious_project_status_secularization:0 "La Campaña de secularización en [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] está reduciendo la autoridad pública de la religión organizada.\n\nCulminación con #Y 150#! de progreso: convierte al 5% de la población del Estado objetivo al ateísmo, reembolsa #P 25#! de Reforma piadosa y otorga #P 8#! de Arreglo religioso."
 ve_je_religious_project_complete_tt:0 "El Proyecto religioso ha alcanzado su objetivo."
 ve_je_religious_project_fail_tt:0 "El Proyecto religioso ha sido cancelado."

 ve_je_cultural_project:0 "Proyecto cultural"
 ve_je_cultural_project_reason:0 "El Gobierno dirige un proyecto cultural a largo plazo. La capacidad administrativa, la legitimidad, la educación, la cohesión nacional y las condiciones locales determinan su ritmo."
 ve_je_cultural_project_progress:0 "Progreso hacia la culminación del Proyecto cultural"
 ve_je_cultural_project_status_curriculum:0 "Se está preparando un Plan de estudios nacional para las escuelas e Instituciones del país.\n\nCulminación con #Y 100#! de progreso: #P +20#! de Mandato cultural, #P +5#! de Cohesión nacional y un resultado a 10 años de +2% de Acceso a la educación, +5% de Cualificaciones y -25 de Burocracia."
 ve_je_cultural_project_status_symbols:0 "Un programa de Símbolos compartidos está forjando un vocabulario cívico común.\n\nCulminación con #Y 75#! de progreso: #P +20#! de Mandato cultural, #P +7#! de Cohesión nacional y un resultado a 8 años de +10% de lealistas procedentes de Colectivos plenamente aceptados y +25 de Autoridad."
 ve_je_cultural_project_status_ethnic:0 "La Campaña de integración étnica en [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] está impulsando a una población minoritaria hacia la Cultura principal.\n\nCulminación con #Y 125#! de progreso: convierte al 5% de los Colectivos de la Cultura objetivo a la Cultura principal (7% con Nacionalista VII), #P +25#! de Mandato cultural, #P +8#! de Cohesión nacional y un resultado de Asimilación a 10 años."
 ve_je_cultural_project_status_civic:0 "La Iniciativa de igualdad ciudadana en [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] está ampliando un estatus cívico común a través de las líneas culturales.\n\nCulminación con #Y 100#! de progreso: +15% de Aceptación durante 10 años, lealistas al Estado, #P +25#! de Mandato cultural, #P +10#! de Cohesión nacional y un resultado de cualificaciones/migración a 10 años."
 ve_je_cultural_project_status_composite:0 "El Pacto constituyente en [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] está negociando un Reconocimiento permanente dentro de un Estado compuesto.\n\nCulminación con #Y 150#! de progreso (requiere 40+ de Cohesión nacional): +15% de Aceptación permanente, añade la Cultura a la lista constituyente, lealistas al Estado, #P +30#! de Mandato cultural, #P +12#! de Cohesión nacional."
 ve_je_cultural_project_complete_tt:0 "El Proyecto cultural ha alcanzado su objetivo."
 ve_je_cultural_project_fail_tt:0 "El Proyecto cultural ha sido cancelado."
 ve_je_project_resolving_status:0 "La administración del proyecto está archivando su informe final."

 ve_evt_religious_incident_cooldown_mdf:0 "Recuperación de incidente del Proyecto religioso"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "La administración del proyecto está asimilando las consecuencias de un incidente reciente."
 ve_evt_cultural_incident_cooldown_mdf:0 "Recuperación de incidente del Proyecto cultural"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "La administración del proyecto está asimilando las consecuencias de un incidente reciente."
 ve_evt_central_clergy_supported_mdf:0 "Clero central respaldado"
 ve_evt_central_clergy_supported_mdf_desc:0 "El Gobierno ha refrendado la autoridad de la jerarquía religiosa central."
 ve_evt_central_clergy_slighted_mdf:0 "Clero central desairado"
 ve_evt_central_clergy_slighted_mdf_desc:0 "El Gobierno ha preferido la práctica local a las preferencias de la jerarquía religiosa central."
 ve_evt_municipal_patronage_mdf:0 "Redes de mecenazgo municipal"
 ve_evt_municipal_patronage_mdf_desc:0 "Los notables locales están impulsando el proyecto mediante arreglos que debilitan la Recaudación de impuestos."

 ve_rel_evt.1.t:0 "La petición de los notables locales"
 ve_rel_evt.1.d:0 "Una delegación de clérigos, figuras municipales y ancianos de los barrios de [SCOPE.sState('ve_evt_target_state').GetName] ha solicitado al Gobierno que ralentice la Conversión confesional. Advierten de que un calendario inflexible transformará la conformidad en un resentimiento duradero."
 ve_rel_evt.1.f:0 "\"La fe impuesta sin consejo puede llenar los registros mientras vacía los bancos.\""
 ve_rel_evt.1.a:0 "Atender su petición."
 ve_rel_evt.1.a.tt:0 "El progreso del Proyecto religioso disminuye en #N 4#!.\nEl Asentamiento religioso aumenta en #P 3#!."
 ve_rel_evt.1.b:0 "El calendario no cambiará."
 ve_rel_evt.1.b.tt:0 "El progreso del Proyecto religioso aumenta en #P 5#!.\nEl Asentamiento religioso disminuye en #N 2#!.\nEl #N 0.5%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_rel_evt.1.c:0 "Encargar la mediación a intermediarios de confianza."
 ve_rel_evt.1.c.tt:0 "Gastas #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 3#!.\nEl Asentamiento religioso aumenta en #P 1#!."

 ve_rel_evt.2.t:0 "Escasez de oficiales sobre el terreno"
 ve_rel_evt.2.d:0 "Los informes procedentes de [SCOPE.sState('ve_evt_target_state').GetName] describen peticiones sin responder, instrucciones contradictorias y distritos que no han visto a un oficial de proyectos en semanas. La Conversión confesional supera a la administración asignada para llevarla a cabo."
 ve_rel_evt.2.f:0 "\"Un Decreto puede cruzar el país en un día. Un funcionario competente no.\""
 ve_rel_evt.2.a:0 "Contratar oficiales temporales sobre el terreno."
 ve_rel_evt.2.a.tt:0 "Gastas #N 15#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 4#!."
 ve_rel_evt.2.b:0 "Ralentizar el programa."
 ve_rel_evt.2.b.tt:0 "El progreso del Proyecto religioso disminuye en #N 6#!.\nEl Asentamiento religioso aumenta en #P 2#!."
 ve_rel_evt.2.c:0 "Emplear a los cuadros del registro central."
 ve_rel_evt.2.c.tt:0 "Gastas #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 5#!."

 ve_cul_evt.1.t:0 "Las oficinas de traducción"
 ve_cul_evt.1.d:0 "Los funcionarios en [SCOPE.sState('ve_evt_target_state').GetName] discrepan sobre cómo la Iniciativa de igualdad ciudadana debe abordar el idioma de [SCOPE.sCulture('ve_evt_target_culture').GetName]. Los administradores locales desean oficinas bilingües; los ministerios centrales exigen un único estándar administrativo."
 ve_cul_evt.1.f:0 "\"Un ciudadano no debería necesitar un intérprete para comprender los derechos concedidos en su propio nombre.\""
 ve_cul_evt.1.a:0 "Permitir que las lenguas locales pervivan en las instituciones públicas."
 ve_cul_evt.1.a.tt:0 "El progreso del Proyecto cultural disminuye en #N 4#!.\nLa Cohesión nacional aumenta en #P 3#!."
 ve_cul_evt.1.b:0 "Imponer un estándar administrativo."
 ve_cul_evt.1.b.tt:0 "El progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional disminuye en #N 2#!.\nEl #N 0.5%#! de la Población de [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.1.c:0 "Establecer una comisión académica de traducción."
 ve_cul_evt.1.c.tt:0 "Gastas #N 10#! de Mandato cultural.\nEl progreso del Proyecto cultural aumenta en #P 3#!.\nLa Cohesión nacional aumenta en #P 1#!."

 ve_cul_evt.2.t:0 "Escasez de profesores locales"
 ve_cul_evt.2.d:0 "Las escuelas de [SCOPE.sState('ve_evt_target_state').GetName] carecen de profesores capaces de servir tanto al plan de estudios del Estado como a las comunidades de [SCOPE.sCulture('ve_evt_target_culture').GetName]. Sin un cuadro local formado, la igualdad ciudadana corre el riesgo de seguir siendo una promesa escrita únicamente en papel oficial."
 ve_cul_evt.2.f:0 "\"La Ley declara la igualdad en una tarde; el aula debe enseñarla durante una generación.\""
 ve_cul_evt.2.a:0 "Financiar nuevas escuelas normales de magisterio."
 ve_cul_evt.2.a.tt:0 "Gastas #N 15#! de Mandato cultural.\nEl progreso del Proyecto cultural aumenta en #P 4#!."
 ve_cul_evt.2.b:0 "Ralentizar la aplicación."
 ve_cul_evt.2.b.tt:0 "El progreso del Proyecto cultural disminuye en #N 6#!.\nLa Cohesión nacional aumenta en #P 2#!."
 ve_cul_evt.2.c:0 "Utilizar las Instituciones ya existentes."
 ve_cul_evt.2.c.tt:0 "Gastas #N 10#! de Mandato cultural.\nEl progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional aumenta en #P 1#!."

 ve_rel_evt.3.t:0 "Registros en conflicto"
 ve_rel_evt.3.d:0 "Los padrones parroquiales, los libros municipales y los informes de los oficiales del proyecto ofrecen cuentas incompatibles de la adscripción religiosa en [SCOPE.sState('ve_evt_target_state').GetName]. La administración debe decidir si pierde tiempo estableciendo la verdad o procede con cifras que sabe inciertas."
 ve_rel_evt.3.f:0 "\"Toda oficina posee un total exacto. Ningún total coincide.\""
 ve_rel_evt.3.a:0 "Llevar a cabo una auditoría completa."
 ve_rel_evt.3.a.tt:0 "Ganas #P 8#! de Reforma piadosa.\nEl progreso del Proyecto religioso disminuye en #N 6#!."
 ve_rel_evt.3.b:0 "Proceder con estimaciones razonables."
 ve_rel_evt.3.b.tt:0 "Gastas #N 8#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 5#!."
 ve_rel_evt.3.c:0 "Utilizar los registros de la Administración Sagrada."
 ve_rel_evt.3.c.tt:0 "El progreso del Proyecto religioso aumenta en #P 3#!."

 ve_rel_evt.4.t:0 "Rumores y contraprédica"
 ve_rel_evt.4.d:0 "Panfletos, sermones callejeros y rumores inquietantes describen ahora la Conversión confesional en [SCOPE.sState('ve_evt_target_state').GetName] como un asalto a la vida local. Los funcionarios advierten que el silencio permitirá a los opositores definir el proyecto, mientras que la represión puede confirmar sus afirmaciones más oscuras."
 ve_rel_evt.4.f:0 "\"Un rumor no requiere oficina, sello ni presupuesto.\""
 ve_rel_evt.4.a:0 "Celebrar audiencias públicas."
 ve_rel_evt.4.a.tt:0 "El progreso del Proyecto religioso disminuye en #N 3#!.\nEl Asentamiento religioso aumenta en #P 3#!.\nEl #P 0.5%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Lealista."
 ve_rel_evt.4.b:0 "Castigar a los Agitadores."
 ve_rel_evt.4.b.tt:0 "El progreso del Proyecto religioso aumenta en #P 4#!.\nEl Asentamiento religioso disminuye en #N 3#!.\nEl #N 1%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_rel_evt.4.c:0 "Publicar los registros y los resultados."
 ve_rel_evt.4.c.tt:0 "Gastas #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 2#!.\nEl Asentamiento religioso aumenta en #P 1#!."

 ve_rel_evt.5.t:0 "El idioma del sermón"
 ve_rel_evt.5.d:0 "El clero del proyecto en [SCOPE.sState('ve_evt_target_state').GetName] informa que los sermones formales preservan la unidad doctrinal pero no logran llegar a muchos feligreses. La prédica en lenguas locales impulsaría más la campaña, aunque la jerarquía central teme que la adaptación se convierta en independencia."
 ve_rel_evt.5.f:0 "\"Una palabra sagrada no escuchada se conserva a la perfección, y nadie la recibe.\""
 ve_rel_evt.5.a:0 "Predicar en lenguas locales."
 ve_rel_evt.5.a.tt:0 "El progreso del Proyecto religioso aumenta en #P 6#!.\nLos Devotos pierden #N 1#! de Aprobación durante #Y 2.5 años#!."
 ve_rel_evt.5.b:0 "Preservar la unidad litúrgica."
 ve_rel_evt.5.b.tt:0 "El progreso del Proyecto religioso disminuye en #N 3#!.\nEl Asentamiento religioso aumenta en #P 3#!.\nLos Devotos ganan #P 1#! de Aprobación durante #Y 2.5 años#!."
 ve_rel_evt.5.c:0 "Formar a intérpretes instruidos."
 ve_rel_evt.5.c.tt:0 "Gastas #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 4#!.\nEl Asentamiento religioso aumenta en #P 1#!."

 ve_rel_evt.6.t:0 "Autoridades eclesiásticas rivales"
 ve_rel_evt.6.d:0 "Los designados por el centro y el clero local establecido en [SCOPE.sState('ve_evt_target_state').GetName] reclaman cada uno el derecho a dirigir la Conversión confesional. Apoyar a un bando puede restablecer el Comandar rápidamente, pero la disputa ya se ha convertido en una prueba de quién habla en nombre de la fe."
 ve_rel_evt.6.f:0 "\"La disputa concierne a la jurisdicción, que es como las Instituciones describen el poder.\""
 ve_rel_evt.6.a:0 "Apoyar al clero central."
 ve_rel_evt.6.a.tt:0 "El progreso del Proyecto religioso aumenta en #P 5#!.\nLos Devotos ganan #P 1#! de Aprobación durante #Y 2.5 años#!.\nEl Asentamiento religioso disminuye en #N 3#!.\nEl #N 0.5%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_rel_evt.6.b:0 "Placar al clero local."
 ve_rel_evt.6.b.tt:0 "El progreso del Proyecto religioso disminuye en #N 4#!.\nLos Devotos pierden #N 1#! de Aprobación durante #Y 2.5 años#!.\nEl Asentamiento religioso aumenta en #P 3#!."
 ve_rel_evt.6.c:0 "Definir sus poderes por escrito."
 ve_rel_evt.6.c.tt:0 "Gastas #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 3#!.\nEl Asentamiento religioso aumenta en #P 1#!."

 ve_cul_evt.3.t:0 "Las categorías del censo"
 ve_cul_evt.3.d:0 "Los funcionarios del censo en [SCOPE.sState('ve_evt_target_state').GetName] no logran ponerse de acuerdo sobre cómo se debe registrar a los ciudadanos de la cultura [SCOPE.sCulture('ve_evt_target_culture').GetName]. Los encuestados locales emplean identidades superpuestas, mientras que los formularios centrales exigen una única respuesta en una sola casilla."
 ve_cul_evt.3.f:0 "\"Una categoría simplifica el registro mucho antes de simplificar el país.\""
 ve_cul_evt.3.a:0 "Permitir la autoidentificación."
 ve_cul_evt.3.a.tt:0 "El Progreso del Proyecto cultural disminuye en #N 4#!.\nLa Cohesión nacional aumenta en #P 4#!."
 ve_cul_evt.3.b:0 "Las categorías se establecerán de forma centralizada."
 ve_cul_evt.3.b.tt:0 "El Progreso del Proyecto cultural aumenta en #P 6#!.\nLa Cohesión nacional disminuye en #N 4#!.\nEl #N 0.5%#! de la Población de cultura [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.3.c:0 "Utilizar el sistema de registro moderno."
 ve_cul_evt.3.c.tt:0 "Gastar #N 10#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional aumenta en #P 1#!."

 ve_cul_evt.4.t:0 "Los notables municipales"
 ve_cul_evt.4.d:0 "Los mecenas municipales en [SCOPE.sState('ve_evt_target_state').GetName] ofrecen sus despachos, clientes e Influencia para promover la igualdad ciudadana de la Población [SCOPE.sCulture('ve_evt_target_culture').GetName]. Su cooperación sería rápida, pero su precio es mantener el control sobre los ingresos locales."
 ve_cul_evt.4.f:0 "\"El camino más corto al ayuntamiento pasa por varios salones Privados.\""
 ve_cul_evt.4.a:0 "Utilizar las redes locales."
 ve_cul_evt.4.a.tt:0 "El Progreso del Proyecto cultural aumenta en #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] pierde un #N 5%#! de Capacidad de Impuesto durante #Y 2 años#!."
 ve_cul_evt.4.b:0 "Crear consejos abiertos."
 ve_cul_evt.4.b.tt:0 "El Progreso del Proyecto cultural disminuye en #N 3#!.\nLa Cohesión nacional aumenta en #P 3#!."
 ve_cul_evt.4.c:0 "Negociar un acuerdo basado en reglas."
 ve_cul_evt.4.c.tt:0 "Gastar #N 10#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 3#!.\nLa Cohesión nacional aumenta en #P 1#!."

 ve_cul_evt.5.t:0 "Los exámenes de Funcionariado"
 ve_cul_evt.5.d:0 "Abrir los exámenes de Funcionariado a los candidatos de cultura [SCOPE.sCulture('ve_evt_target_culture').GetName] ha dejado al descubierto una brecha entre la igualdad legal y la preparación práctica. El acceso inmediato tendría un gran peso simbólico, pero años de escolarización desigual no se pueden borrar por Decreto."
 ve_cul_evt.5.f:0 "\"Un mismo examen no supone la misma oportunidad cuando a un solo candidato se le ha enseñado su idioma.\""
 ve_cul_evt.5.a:0 "Financiar cursos preparatorios."
 ve_cul_evt.5.a.tt:0 "Gastar #N 15#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional aumenta en #P 2#!."
 ve_cul_evt.5.b:0 "El acceso igualitario comienza de inmediato."
 ve_cul_evt.5.b.tt:0 "El Progreso del Proyecto cultural aumenta en #P 7#!.\nLa Cohesión nacional disminuye en #N 4#!.\nEl #N 0.5%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.5.c:0 "movilizar las redes escolares y de Asistencial."
 ve_cul_evt.5.c.tt:0 "Gastar #N 10#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional aumenta en #P 2#!."
 ve_cul_evt.5.e:0 "Reformar primero el sistema de exámenes."
 ve_cul_evt.5.e.tt:0 "El Progreso del Proyecto cultural disminuye en #N 4#!.\nLa Cohesión nacional aumenta en #P 3#!."

 ve_cul_evt.6.t:0 "La reacción de la mayoría"
 ve_cul_evt.6.d:0 "Los opositores a la Iniciativa de igualdad ciudadana Demand que extender los derechos comunes a la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] merma la posición de los demás. Las manifestaciones en [SCOPE.sState('ve_evt_target_state').GetName] están convirtiendo una reforma administrativa en una prueba política nacional."
 ve_cul_evt.6.f:0 "\"Un derecho compartido se presenta como un privilegio usurpado.\""
 ve_cul_evt.6.a:0 "Defender la iniciativa abiertamente."
 ve_cul_evt.6.a.tt:0 "El Progreso del Proyecto cultural aumenta en #P 4#!.\nLa Cohesión nacional disminuye en #N 4#!.\nEl #N 1%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.6.b:0 "Reducir el ritmo de aplicación."
 ve_cul_evt.6.b.tt:0 "El Progreso del Proyecto cultural disminuye en #N 5#!.\nLa Cohesión nacional aumenta en #P 3#!."
 ve_cul_evt.6.c:0 "movilizar a la coalición reformista."
 ve_cul_evt.6.c.tt:0 "Gastar #N 10#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 3#!.\nLa Cohesión nacional aumenta en #P 2#!.\nEl #P 0.5%#! de la Población de cultura [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Lealista."

 ve_rel_evt.7.t:0 "La misión en su punto de ruptura"
 ve_rel_evt.7.d:0 "La Conversión confesional en [SCOPE.sState('ve_evt_target_state').GetName] está al borde del colapso administrativo y político. Las oficinas han dejado de responderse entre sí, la resistencia pública se endurece y el clero local advierte que la misión no puede continuar en los términos actuales."
 ve_rel_evt.7.f:0 "\"Los informes aún lo llaman una dificultad temporal. Las calles han elegido un nombre más duro.\""
 ve_rel_evt.7.a:0 "Asumir las pérdidas y retirarse."
 ve_rel_evt.7.a.tt:0 "Cancela el Proyecto religioso sin reembolso de Reforma piadosa.\nEl Arreglo religioso disminuye en #N 5#!.\nDurante #Y 2 años#!: #N -50#! Burocracia, #N -50#! Autoridad y #N -3%#! de Éxito de promulgación de leyes."
 ve_rel_evt.7.b:0 "Transferir recursos de emergencia."
 ve_rel_evt.7.b.tt:0 "Gasta #N 25#! de Reforma piadosa.\nEl Progreso del Proyecto religioso disminuye en #N 5#!.\nEl #N 1%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."
 ve_rel_evt.7.c:0 "Continuar con personal mínimo."
 ve_rel_evt.7.c.tt:0 "El Progreso del Proyecto religioso disminuye en #N 10#!.\nEl Arreglo religioso disminuye en #N 2#!.\nEl proyecto continúa."
 ve_rel_evt.7.e:0 "Renegociar el método."
 ve_rel_evt.7.e.tt:0 "Gasta #N 15#! de Reforma piadosa.\nEl Progreso del Proyecto religioso disminuye en #N 3#!.\nEl Arreglo religioso aumenta en #P 2#!.\nEl #N 0.5%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."

 ve_cul_evt.7.t:0 "La iniciativa pierde legitimidad"
 ve_cul_evt.7.d:0 "La Iniciativa de igualdad ciudadana en [SCOPE.sState('ve_evt_target_state').GetName] está perdiendo el apoyo tanto de las Instituciones establecidas como de las comunidades culturales de [SCOPE.sCulture('ve_evt_target_culture').GetName] a las que debía servir. Los movimientos radicales presentan ahora cada compromiso como prueba de que el Gobierno no puede ofrecer igualdad."
 ve_cul_evt.7.f:0 "\"Una reforma puede sobrevivir a la Oposición. No puede sobrevivir a volverse increíble.\""
 ve_cul_evt.7.a:0 "Poner fin a la iniciativa."
 ve_cul_evt.7.a.tt:0 "Cancela el Proyecto cultural sin reembolso de Mandato cultural.\nLa Cohesión nacional disminuye en #N 5#!.\nDurante #Y 2 años#!: #N -50#! Burocracia, #N -25#! Autoridad y #N -3%#! de Éxito de promulgación de leyes."
 ve_cul_evt.7.b:0 "Emitir subvenciones locales de emergencia."
 ve_cul_evt.7.b.tt:0 "Gasta #N 25#! de Mandato cultural.\nEl Progreso del Proyecto cultural disminuye en #N 5#!.\nEl #N 1%#! de la Población cultural de [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."
 ve_cul_evt.7.c:0 "Continuar con un programa mínimo."
 ve_cul_evt.7.c.tt:0 "El Progreso del Proyecto cultural disminuye en #N 10#!.\nLa Cohesión nacional disminuye en #N 2#!.\nEl proyecto continúa."
 ve_cul_evt.7.e:0 "Reconstruir la coalición."
 ve_cul_evt.7.e.tt:0 "Gasta #N 15#! de Mandato cultural.\nEl Progreso del Proyecto cultural disminuye en #N 3#!.\nLa Cohesión nacional aumenta en #P 2#!.\nEl #N 0.5%#! de la Población cultural de [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."

 ve_rel_evt.8.t:0 "Una concordia local inesperada"
 ve_rel_evt.8.d:0 "Clérigos, funcionarios municipales y ancianos de la comunidad en [SCOPE.sState('ve_evt_target_state').GetName] han alcanzado un acuerdo que ninguna directiva central habría producido. La resistencia local disminuye, las congregaciones coordinan la misión por sí mismas y la Conversión confesional ha adquirido un Dinamismo inesperado."
 ve_rel_evt.8.f:0 "\"Lo que comenzó como una orden de la capital se ha convertido en un pacto hecho en la plaza del pueblo.\""
 ve_rel_evt.8.a:0 "Aprovechar al máximo este Dinamismo."
 ve_rel_evt.8.a.tt:0 "El Arreglo religioso aumenta en #P 1#!.\nEl Progreso del Proyecto religioso aumenta en #P 25#!.\nSi el Progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."
 ve_rel_evt.8.b:0 "La durabilidad antes que la velocidad."
 ve_rel_evt.8.b.tt:0 "El Arreglo religioso aumenta en #P 4#!.\nEl Progreso del Proyecto religioso aumenta en #P 10#!.\nSi el Progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."

 ve_cul_evt.8.t:0 "Una coalición cívica local"
 ve_cul_evt.8.d:0 "Profesores, funcionarios municipales, asociaciones de Comercio y representantes de la comunidad cultural de [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] han Formado un comité común. Al resolver las disputas antes de que lleguen a la capital, esta coalición ha dado a la Iniciativa de igualdad ciudadana un Dinamismo que la administración no pudo fabricar."
 ve_cul_evt.8.f:0 "\"La ciudadanía se hizo real cuando las Instituciones que rara vez compartían mesa comenzaron a compartir la responsabilidad.\""
 ve_cul_evt.8.a:0 "Aprovechar el Dinamismo de la coalición."
 ve_cul_evt.8.a.tt:0 "La Cohesión nacional aumenta en #P 1#!.\nEl Progreso del Proyecto cultural aumenta en #P 25#!.\nSi el Progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."
 ve_cul_evt.8.b:0 "Hacer permanentes las Instituciones."
 ve_cul_evt.8.b.tt:0 "La Cohesión nacional aumenta en #P 4#!.\nEl Progreso del Proyecto cultural aumenta en #P 10#!.\nSi el Progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."

 ve_rel_evt.40.t:0 "Registros desincronizados"
 ve_rel_evt.40.d:0 "Los registros provinciales en [SCOPE.sState('ve_evt_target_state').GetName] emplean categorías incompatibles para congregaciones, asociaciones cívicas e instituciones públicas. Los informes que llegan a la capital se contradicen ahora entre sí, dejando al proyecto incapaz de distinguir el cumplimiento de la resistencia."
 ve_rel_evt.40.f:0 "\"Una política administrada a través de tres libros de contabilidad adquiere pronto tres realidades distintas.\""
 ve_rel_evt.40.a:0 "Enviar una auditoría central."
 ve_rel_evt.40.a.tt:0 "Gastas #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 5#!.\nEl Asentamiento religioso aumenta en #P 1#!."
 ve_rel_evt.40.b:0 "Reconciliar los registros localmente."
 ve_rel_evt.40.b.tt:0 "El progreso del Proyecto religioso disminuye en #N 3#!.\nEl Asentamiento religioso aumenta en #P 2#!."
 ve_rel_evt.40.c:0 "Aplicar el procedimiento de registro estándar."
 ve_rel_evt.40.c.tt:0 "Gastas #N 5#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 4#!.\nEl Asentamiento religioso aumenta en #P 1#!."

 ve_rel_evt.41.t:0 "Escasez de personal provincial"
 ve_rel_evt.41.d:0 "Las oficinas que dirigen el proyecto en [SCOPE.sState('ve_evt_target_state').GetName] no encuentran suficientes oficinistas, profesores e inspectores formados. Las directrices se acumulan más rápido de lo que los funcionarios locales pueden interpretarlas, y los nombramientos apresurados amenazan con empeorar cada disputa."
 ve_rel_evt.41.f:0 "\"El decreto llegó en un día. Las personas capaces de llevarlo a cabo pueden tardar una generación.\""
 ve_rel_evt.41.a:0 "Financiar un nuevo cuadro de funcionarios."
 ve_rel_evt.41.a.tt:0 "Gastas #N 15#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 6#!."
 ve_rel_evt.41.b:0 "Ralentizar la aplicación."
 ve_rel_evt.41.b.tt:0 "El progreso del Proyecto religioso disminuye en #N 6#!.\nEl Asentamiento religioso aumenta en #P 2#!."
 ve_rel_evt.41.c:0 "Utilizar la red de Educación existente."
 ve_rel_evt.41.c.tt:0 "Gastas #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 5#!.\nEl Asentamiento religioso aumenta en #P 1#!."

 ve_rel_evt.42.t:0 "Rumores en todo el distrito"
 ve_rel_evt.42.d:0 "Los rumores en [SCOPE.sState('ve_evt_target_state').GetName] afirman que el proyecto oculta medidas mucho más duras que las anunciadas por el Gobierno. Los organizadores religiosos y los Agitadores locales repiten historias contradictorias, mientras que el silencio oficial da margen para que cada nueva versión se propague."
 ve_rel_evt.42.f:0 "\"Un rumor no requiere oficina, presupuesto ni firma.\""
 ve_rel_evt.42.a:0 "Publicar los informes."
 ve_rel_evt.42.a.tt:0 "El progreso del Proyecto religioso disminuye en #N 3#!.\nEl Asentamiento religioso aumenta en #P 4#!."
 ve_rel_evt.42.b:0 "Descartar la agitación."
 ve_rel_evt.42.b.tt:0 "El progreso del Proyecto religioso aumenta en #P 5#!.\nEl Asentamiento religioso disminuye en #N 3#!.\nEl #N 1%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_rel_evt.42.c:0 "Encargar la mediación a nivel local."
 ve_rel_evt.42.c.tt:0 "Gastas #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 4#!.\nEl Asentamiento religioso aumenta en #P 2#!.\nEl #P 0.5%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Lealista."

 ve_rel_evt.43.t:0 "La administración al borde del colapso"
 ve_rel_evt.43.d:0 "El proyecto en [SCOPE.sState('ve_evt_target_state').GetName] se acerca al colapso administrativo. Las oficinas provinciales están desbordadas, la Confianza pública se ha venido abajo y la Oposición Organizada trata ahora cada nueva directriz como prueba de que el Gobierno ha perdido el control."
 ve_rel_evt.43.f:0 "\"Cuando los expedientes dejan de moverse, la crisis se traslada a las calles.\""
 ve_rel_evt.43.a:0 "Poner fin al programa."
 ve_rel_evt.43.a.tt:0 "Cancelar el Proyecto religioso sin reembolso de Reforma piadosa.\nEl Asentamiento religioso disminuye en #N 5#!.\nDurante #Y 2 años#!: #N -50#! de Burocracia, #N -50#! de Autoridad y #N -3%#! de Éxito de promulgación de Ley."
 ve_rel_evt.43.b:0 "Transferir recursos de emergencia."
 ve_rel_evt.43.b.tt:0 "Gastas #N 25#! de Reforma piadosa.\nEl progreso del Proyecto religioso disminuye en #N 5#!.\nEl #N 1%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."
 ve_rel_evt.43.c:0 "Continuar con una plantilla mínima."
 ve_rel_evt.43.c.tt:0 "El progreso del Proyecto religioso disminuye en #N 10#!.\nEl Asentamiento religioso disminuye en #N 2#!.\nEl proyecto continúa."
 ve_rel_evt.43.e:0 "Reconstruir la colaboración local."
 ve_rel_evt.43.e.tt:0 "Gastas #N 15#! de Reforma piadosa.\nEl progreso del Proyecto religioso disminuye en #N 3#!.\nEl Asentamiento religioso aumenta en #P 2#!.\nEl #N 0.5%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."

 ve_rel_evt.100.t:0 "Escaños en el Consejo Interconfesional"
 ve_rel_evt.100.d:0 "Los delegados en [SCOPE.sState('ve_evt_target_state').GetName] coinciden en que un consejo interconfesional es necesario, pero no en quién merece un escaño. La representación proporcional tranquilizaría a las comunidades más pequeñas, mientras que un arreglo fijo diseñado en la capital podría comenzar a trabajar de inmediato."
 ve_rel_evt.100.f:0 "\"Todo el mundo apoya una mesa común hasta que se cuentan las sillas.\""
 ve_rel_evt.100.a:0 "Distribuir la representación por población."
 ve_rel_evt.100.a.tt:0 "El progreso del Proyecto religioso disminuye en #N 3#!.\nEl Arreglo religioso aumenta en #P 4#!."
 ve_rel_evt.100.b:0 "Imponer un compromiso central fijo."
 ve_rel_evt.100.b.tt:0 "El progreso del Proyecto religioso aumenta en #P 5#!.\nEl Arreglo religioso disminuye en #N 2#!.\nEl #N 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_rel_evt.100.c:0 "Potenciar los consejos interconfesionales."
 ve_rel_evt.100.c.tt:0 "Gastar #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 5#!.\nEl Arreglo religioso aumenta en #P 2#!."

 ve_rel_evt.101.t:0 "Un plan de estudios escolar compartido"
 ve_rel_evt.101.d:0 "Las escuelas en [SCOPE.sState('ve_evt_target_state').GetName] necesitan lecciones cívicas comunes sin convertir la Labor de acercamiento en una campaña contra las creencias locales. Los profesores solicitan materiales claros y formación conjunta, mientras que los líderes comunitarios insisten en que la instrucción local mantenga espacio para sus tradiciones."
 ve_rel_evt.101.f:0 "\"Una lección compartida solo triunfa si cada familia reconoce el aula como suya.\""
 ve_rel_evt.101.a:0 "Financiar un cuadro docente común."
 ve_rel_evt.101.a.tt:0 "Gastar #N 15#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 6#!.\nEl Arreglo religioso aumenta en #P 1#!."
 ve_rel_evt.101.b:0 "Dejar espacio para los planes de estudio locales."
 ve_rel_evt.101.b.tt:0 "El progreso del Proyecto religioso disminuye en #N 4#!.\nEl Arreglo religioso aumenta en #P 3#!."
 ve_rel_evt.101.c:0 "Integrar a la coalición de reforma en las escuelas."
 ve_rel_evt.101.c.tt:0 "Gastar #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 5#!.\nEl Arreglo religioso aumenta en #P 2#!.\nEl #P 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Lealista."

 ve_rel_evt.102.t:0 "Una carta de garantías mutuas"
 ve_rel_evt.102.d:0 "Las comunidades religiosas, los funcionarios municipales y las asociaciones de reforma en [SCOPE.sState('ve_evt_target_state').GetName] han redactado una carta común. Cada firmante acepta las mismas obligaciones cívicas a cambio de garantías públicas de que ninguna comunidad será excluida de las instituciones locales."
 ve_rel_evt.102.f:0 "\"La confianza se hizo posible cuando cada promesa fue redactada como un derecho de la otra parte.\""
 ve_rel_evt.102.a:0 "Aprovechar el Dinamismo del pacto."
 ve_rel_evt.102.a.tt:0 "El Arreglo religioso aumenta en #P 2#!.\nEl progreso del Proyecto religioso aumenta en #P 20#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."
 ve_rel_evt.102.b:0 "Hacer permanentes las garantías."
 ve_rel_evt.102.b.tt:0 "El Arreglo religioso aumenta en #P 4#!.\nEl #P 0,5%#! de la población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Lealista.\nEl progreso del Proyecto religioso aumenta en #P 10#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."

 ve_rel_evt.150.t:0 "¿Profesores o inspectores?"
 ve_rel_evt.150.d:0 "La Campaña de secularización en [SCOPE.sState('ve_evt_target_state').GetName] ha dejado al descubierto una Escasez de Alfabetizados. La administración puede ampliar el cuerpo docente que construye Capacidad cívica a largo plazo, o confiar en inspectores capaces de hacer cumplir las nuevas normas con el personal ya disponible."
 ve_rel_evt.150.f:0 "\"Un inspector puede cerrar una escuela en una tarde. A un profesor le pueden hacer falta años para reemplazar lo que allí se enseñaba.\""
 ve_rel_evt.150.a:0 "Ampliar el cuerpo docente."
 ve_rel_evt.150.a.tt:0 "Gastar #N 15#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 6#!."
 ve_rel_evt.150.b:0 "Ralentizar el programa para ajustarlo al personal existente."
 ve_rel_evt.150.b.tt:0 "El progreso del Proyecto religioso disminuye en #N 5#!.\nEl Arreglo religioso aumenta en #P 2#!."
 ve_rel_evt.150.c:0 "Poner en marcha la red de Educación pública."
 ve_rel_evt.150.c.tt:0 "Gastar #N 10#! de Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 5#!.\nEl Arreglo religioso aumenta en #P 1#!."

 ve_rel_evt.151.t:0 "Las propiedades incautadas"
 ve_rel_evt.151.d:0 "Las antiguas propiedades religiosas en [SCOPE.sState('ve_evt_target_state').GetName] están listas para su conversión en escuelas, clínicas y oficinas cívicas. Su transferencia inmediata dotaría a la campaña de valiosa infraestructura, pero la ausencia de indemnización se está convirtiendo en un punto de reunión para los Devotos."
 ve_rel_evt.151.f:0 "\"Las llaves cambiaron de manos en una mañana. La disputa por la propiedad sobrevivirá a las cerraduras.\""
 ve_rel_evt.151.a:0 "Pagar una indemnización por etapas."
 ve_rel_evt.151.a.tt:0 "Gasta #N 15#! Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 3#!.\nEl Arreglo religioso aumenta en #P 3#!."
 ve_rel_evt.151.b:0 "Destinar las propiedades al servicio público de inmediato."
 ve_rel_evt.151.b.tt:0 "El progreso del Proyecto religioso aumenta en #P 7#!.\nEl Arreglo religioso disminuye en #N 4#!.\nEl #N 1%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nLos Devotos pierden #N 1#! Aprobación durante #Y 2.5 años#!."
 ve_rel_evt.151.c:0 "Transferirlas a instituciones de Asistencial secular."
 ve_rel_evt.151.c.tt:0 "Gasta #N 10#! Reforma piadosa.\nEl progreso del Proyecto religioso aumenta en #P 5#!.\nEl Arreglo religioso aumenta en #P 2#!.\nEl #P 0.5%#! de la Población en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Lealista."

 ve_rel_evt.152.t:0 "Las asociaciones cívicas echan raíces"
 ve_rel_evt.152.d:0 "Los círculos de profesores, las sociedades de ayuda mutua y las asociaciones municipales de [SCOPE.sState('ve_evt_target_state').GetName] han comenzado a prestar servicios que antes se organizaban a través de instituciones religiosas. Su cooperación ha dotado a la Campaña de secularización de una base cívica local en lugar de una mera Presencia administrativa."
 ve_rel_evt.152.f:0 "\"El nuevo orden perduró cuando los ciudadanos comenzaron a mantenerlo sin esperar a un inspector.\""
 ve_rel_evt.152.a:0 "Aprovechar el Dinamismo local."
 ve_rel_evt.152.a.tt:0 "El Arreglo religioso aumenta en #P 2#!.\nEl progreso del Proyecto religioso aumenta en #P 20#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."
 ve_rel_evt.152.b:0 "Convertir las asociaciones en instituciones permanentes."
 ve_rel_evt.152.b.tt:0 "El Arreglo religioso aumenta en #P 4#!.\nEl progreso del Proyecto religioso aumenta en #P 10#!.\nSi el progreso alcanza #Y 100#!, se aplica el efecto de finalización normal del proyecto."

 ve_cul_evt.40.t:0 "Consejos escolares locales"
 ve_cul_evt.40.d:0 "Los consejos escolares de [SCOPE.sState('ve_evt_target_state').GetName] discrepan sobre el lugar que debe ocupar la lengua [SCOPE.sCulture('ve_evt_target_culture').GetName] en la instrucción pública. La enseñanza en la lengua local preservaría la confianza, mientras que una única lengua administrativa facilitaría la dirección del proyecto nacional."
 ve_cul_evt.40.f:0 "\"La lengua elegida para la primera lección suele decidir a quién pertenece la escuela a ojos de sus alumnos.\""
 ve_cul_evt.40.a:0 "Proteger la lengua local."
 ve_cul_evt.40.a.tt:0 "El progreso del Proyecto cultural disminuye en #N 4#!.\nLa Cohesión nacional aumenta en #P 3#!."
 ve_cul_evt.40.b:0 "Imponer una sola lengua administrativa."
 ve_cul_evt.40.b.tt:0 "El progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional disminuye en #N 2#!.\nEl #N 0.5%#! de la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.40.c:0 "Ampliar la red de profesores."
 ve_cul_evt.40.c.tt:0 "Gasta #N 10#! Mandato cultural.\nEl progreso del Proyecto cultural aumenta en #P 4#!.\nLa Cohesión nacional aumenta en #P 2#!."

 ve_cul_evt.41.t:0 "Límites estadísticos"
 ve_cul_evt.41.d:0 "Los funcionarios que inspeccionan [SCOPE.sState('ve_evt_target_state').GetName] no se ponen de acuerdo sobre dónde empieza y dónde termina la comunidad [SCOPE.sCulture('ve_evt_target_culture').GetName]. Las identidades locales se solapan entre lenguas, distritos y costumbres, pero el proyecto nacional exige categorías que puedan ser contadas y administradas."
 ve_cul_evt.41.f:0 "\"Una frontera trazada para el censo no tardará en adquirir funcionarios, presupuestos y defensores.\""
 ve_cul_evt.41.a:0 "Dejar margen para la autoidentificación."
 ve_cul_evt.41.a.tt:0 "El progreso del Proyecto cultural disminuye en #N 3#!.\nLa Cohesión nacional aumenta en #P 3#!."
 ve_cul_evt.41.b:0 "Permitir que el centro defina los límites."
 ve_cul_evt.41.b.tt:0 "El progreso del Proyecto cultural aumenta en #P 6#!.\nLa Cohesión nacional disminuye en #N 3#!.\nEl #N 0.5%#! de la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.41.c:0 "Utilizar el sistema de registro estándar."
 ve_cul_evt.41.c.tt:0 "Gasta #N 10#! Mandato cultural.\nEl progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional aumenta en #P 1#!."

 ve_cul_evt.42.t:0 "El proyecto nacional al borde del colapso"
 ve_cul_evt.42.d:0 "El proyecto nacional en [SCOPE.sState('ve_evt_target_state').GetName] se acerca al colapso. Los movimientos radicales afirman que el Gobierno ha traicionado a la comunidad [SCOPE.sCulture('ve_evt_target_culture').GetName] o se ha rendido ante ella, mientras que las oficinas locales ya no poseen la Confianza para imponer otro compromiso."
 ve_cul_evt.42.f:0 "\"Un acuerdo atacado tanto como coacción como rendición pronto puede dejar de ser un acuerdo por completo.\""
 ve_cul_evt.42.a:0 "Finalizar el proyecto."
 ve_cul_evt.42.a.tt:0 "Cancela el Proyecto cultural sin reembolso de Mandato cultural.\nLa Cohesión nacional disminuye en #N 5#!.\nDurante #Y 2 años#!: #N -50#! de Burocracia, #N -25#! de Autoridad y #N -3%#! de Éxito de promulgación de Ley."
 ve_cul_evt.42.b:0 "Transferir recursos locales de emergencia."
 ve_cul_evt.42.b.tt:0 "Gastas #N 25#! de Mandato cultural.\nEl Progreso del Proyecto cultural disminuye en #N 5#!.\nEl #N 1%#! de la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."
 ve_cul_evt.42.c:0 "Continuar con un programa mínimo."
 ve_cul_evt.42.c.tt:0 "El Progreso del Proyecto cultural disminuye en #N 10#!.\nLa Cohesión nacional disminuye en #N 2#!.\nEl proyecto continúa."
 ve_cul_evt.42.e:0 "Reconstruir el marco de negociación."
 ve_cul_evt.42.e.tt:0 "Gastas #N 15#! de Mandato cultural.\nEl Progreso del Proyecto cultural disminuye en #N 3#!.\nLa Cohesión nacional aumenta en #P 2#!.\nEl #N 0.5%#! de la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical.\nEl proyecto continúa."

 ve_cul_evt.50.t:0 "La directiva de apellidos e idioma"
 ve_cul_evt.50.d:0 "Los funcionarios en [SCOPE.sState('ve_evt_target_state').GetName] proponen estandarizar los apellidos y los registros públicos en el idioma nacional. La directiva facilitaría a la administración central clasificar a la Población [SCOPE.sCulture('ve_evt_target_culture').GetName], pero las familias temen que la identidad Privada se convierta en objeto de mando del Estado."
 ve_cul_evt.50.f:0 "\"Un nombre escrito de otro modo en el registro puede seguir siendo el nombre con el que una familia se recuerda a sí misma.\""
 ve_cul_evt.50.a:0 "Financiar una campaña de registro gradual."
 ve_cul_evt.50.a.tt:0 "Gastas #N 10#! de Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 4#!.\nLa Cohesión nacional aumenta en #P 1#!.\nEl #N 0.5%#! de la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.50.b:0 "Hacer cumplir un estándar nacional."
 ve_cul_evt.50.b.tt:0 "El Progreso del Proyecto cultural aumenta en #P 7#!.\nLa Cohesión nacional disminuye en #N 4#!.\nEl #N 1%#! de la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.50.c:0 "Retirar la directiva para su revisión."
 ve_cul_evt.50.c.tt:0 "El Progreso del Proyecto cultural disminuye en #N 5#!.\nLa Cohesión nacional aumenta en #P 3#!."

 ve_cul_evt.51.t:0 "Los registros de reclutamiento"
 ve_cul_evt.51.d:0 "Los oficiales del Ejército en [SCOPE.sState('ve_evt_target_state').GetName] demandan un registro único para las Obligaciones de servicio, apellidos y mandatos. Aplicarlo a la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] fortalecería el impulso de Integración étnica, pero la resistencia crece entre las comunidades que ven al ejército como otro instrumento de erradicación cultural."
 ve_cul_evt.51.f:0 "\"El Estado solo aprende los nombres de una aldea cuando desea cobrar sus Impuestos o convocar a sus hijos.\""
 ve_cul_evt.51.a:0 "Aplicar los registros nacionales."
 ve_cul_evt.51.a.tt:0 "El Progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional disminuye en #N 2#!.\nEl #N 0.5%#! de la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.51.b:0 "Preservar las prácticas de registro local."
 ve_cul_evt.51.b.tt:0 "El Progreso del Proyecto cultural disminuye en #N 3#!.\nLa Cohesión nacional aumenta en #P 3#!."
 ve_cul_evt.51.c:0 "Integrar los registros mediante el servicio militar."
 ve_cul_evt.51.c.tt:0 "Gastas #N 10#! de Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 6#!.\nLa Cohesión nacional aumenta en #P 1#!.\nEl #N 0.5%#! de la Población [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."

 ve_cul_evt.100.t:0 "La delegación constituyente"
 ve_cul_evt.100.d:0 "Una delegación de la comunidad de [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] ha llegado con demandas de representación en las instituciones del Pacto constituyente. Negociar ralentizaría el proyecto pero fortalecería su legitimidad; un acuerdo impuesto desde la capital podría avanzar más rápido a cambio de perder confianza."
 ve_cul_evt.100.f:0 "\"Un pacto solo se vuelve común cuando cada constituyente puede señalar una cláusula que ayudó a redactar.\""
 ve_cul_evt.100.a:0 "Negociar su lugar en el pacto."
 ve_cul_evt.100.a.tt:0 "El Progreso del Proyecto cultural disminuye en #N 4#!.\nLa Cohesión nacional aumenta en #P 4#!."
 ve_cul_evt.100.b:0 "Imponer el acuerdo central."
 ve_cul_evt.100.b.tt:0 "El Progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional disminuye en #N 2#!.\nEl #N 0,5%#! de la Población de [SCOPE.sCulture('ve_evt_target_culture').GetName] en [SCOPE.sState('ve_evt_target_state').GetName] se vuelve Radical."
 ve_cul_evt.100.c:0 "Incluir a la coalición parlamentaria en las conversaciones."
 ve_cul_evt.100.c.tt:0 "Gastas #N 10#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 4#!.\nLa Cohesión nacional aumenta en #P 2#!."

 ve_cul_evt.101.t:0 "Administración dual"
 ve_cul_evt.101.d:0 "El Pacto constituyente en [SCOPE.sState('ve_evt_target_state').GetName] depende ahora de dos administraciones superpuestas. Los funcionarios centrales y los representantes de la comunidad de [SCOPE.sCulture('ve_evt_target_culture').GetName] duplican registros, disputan nombramientos y emiten instrucciones contradictorias mientras la Burocracia del país roza el agotamiento."
 ve_cul_evt.101.f:0 "\"Dos oficinas pueden compartir Autoridad más fácilmente de lo que pueden compartir un archivador.\""
 ve_cul_evt.101.a:0 "Financiar un personal administrativo conjunto."
 ve_cul_evt.101.a.tt:0 "Gastas #N 15#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 6#!."
 ve_cul_evt.101.b:0 "Ralentizar el pacto hasta que las oficinas se pongan de acuerdo."
 ve_cul_evt.101.b.tt:0 "El Progreso del Proyecto cultural disminuye en #N 6#!.\nLa Cohesión nacional aumenta en #P 2#!."
 ve_cul_evt.101.c:0 "Unificar las oficinas bajo el Funcionariado."
 ve_cul_evt.101.c.tt:0 "Gastas #N 10#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional aumenta en #P 2#!."

 ve_cul_evt.150.t:0 "Implementación en las Provincias"
 ve_cul_evt.150.d:0 "Las administraciones provinciales informan de que el proyecto cultural nacional avanza a velocidades radicalmente distintas. Algunas oficinas exigen comisiones de implementación financiadas, mientras que otras advierten de que imponer un único calendario a cada región consumirá personal escaso y debilitará la Confianza pública."
 ve_cul_evt.150.f:0 "\"Un Decreto nacional se escribe una vez, pero debe implementarse en cada oficina del país.\""
 ve_cul_evt.150.a:0 "Financiar las comisiones de implementación."
 ve_cul_evt.150.a.tt:0 "Gastas #N 10#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 5#!."
 ve_cul_evt.150.b:0 "Utilizar un calendario gradual."
 ve_cul_evt.150.b.tt:0 "El Progreso del Proyecto cultural disminuye en #N 4#!.\nLa Cohesión nacional aumenta en #P 2#!."
 ve_cul_evt.150.c:0 "Estandarizar la administración existente."
 ve_cul_evt.150.c.tt:0 "Gastas #N 5#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 3#!.\nLa Cohesión nacional aumenta en #P 2#!."

 ve_cul_evt.151.t:0 "El idioma de instrucción"
 ve_cul_evt.151.d:0 "El Plan de estudios nacional requiere un idioma de instrucción común, sin embargo, las escuelas de todo el país atienden a comunidades con tradiciones lingüísticas muy diferentes. Los materiales multilingües preservarían la confianza pero retrasarían la distribución, mientras que un plan de estudios único podría llegar rápidamente a las aulas a riesgo de convertir la Educación en una pugna cultural."
 ve_cul_evt.151.f:0 "\"Una lección impartida en un idioma en el que el alumno desconfía puede recordarse por cualquier motivo excepto por su materia.\""
 ve_cul_evt.151.a:0 "Financiar materiales multilingües."
 ve_cul_evt.151.a.tt:0 "Gastas #N 10#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 3#!.\nLa Cohesión nacional aumenta en #P 3#!."
 ve_cul_evt.151.b:0 "Aplicar un plan de estudios nacional."
 ve_cul_evt.151.b.tt:0 "El Progreso del Proyecto cultural aumenta en #P 6#!.\nLa Cohesión nacional disminuye en #N 3#!."
 ve_cul_evt.151.c:0 "Unir las redes de enseñanza y asistencia."
 ve_cul_evt.151.c.tt:0 "Gastas #N 10#! Mandato cultural.\nEl Progreso del Proyecto cultural aumenta en #P 5#!.\nLa Cohesión nacional aumenta en #P 2#!."

 ve_cul_evt.160.t:0 "¿Quién representa a la Nación?"
 ve_cul_evt.160.d:0 "El proyecto de Símbolos compartidos ha reabierto el debate sobre qué historia, uniformes, monumentos y ceremonias pueden representar a todo el país. Rotar las tradiciones ampliaría el Reconocimiento pero ralentizaría el acuerdo; seleccionar una narrativa oficial crearía claridad a la vez que dejaría a muchos ciudadanos al margen."
 ve_cul_evt.160.f:0 "\"Un símbolo se vuelve nacional solo cuando los ciudadanos se ven reflejados en él sin necesidad de explicaciones.\""
 ve_cul_evt.160.a:0 "Rotar los símbolos en el uso público."
 ve_cul_evt.160.a.tt:0 "El progreso del Proyecto cultural disminuye en #N 3#!.\nLa Cohesión nacional aumenta en #P 4#!."
 ve_cul_evt.160.b:0 "Seleccionar una narrativa oficial."
 ve_cul_evt.160.b.tt:0 "El progreso del Proyecto cultural aumenta en #P 6#!.\nLa Cohesión nacional disminuye en #N 3#!."
 ve_cul_evt.160.c:0 "Diseñar una ceremonia pública compartida."
 ve_cul_evt.160.c.tt:0 "Gastas #N 10#! de Mandato cultural.\nEl progreso del Proyecto cultural aumenta en #P 4#!.\nLa Cohesión nacional aumenta en #P 2#!."
