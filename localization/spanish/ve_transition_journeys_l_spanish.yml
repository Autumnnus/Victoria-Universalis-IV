l_spanish:
 ve_je_religious_settlement_transition:0 "Transición del arreglo religioso"
 ve_je_religious_settlement_transition_reason:0 "El arreglo legal entre la Iglesia y el Estado ha cambiado. Las Instituciones, las comunidades y los funcionarios deben adaptarse mientras la crisis de transición siga vigente. El modificador de crisis —y no el calendario de esta Anotación en el diario— es imperativo."
 ve_je_religious_settlement_transition_complete_tt:0 "La crisis de transición del arreglo religioso ha finalizado."
 ve_je_religious_settlement_transition_status_confessional:0 "Arreglo objetivo: #Y Estado confesional#!\nArreglo religioso: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTiempo restante aproximado: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] meses#!\nHitos completados: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nResultado al finalizar la crisis: #Y 60+#! el arreglo se estabiliza pronto, #Y 26-59#! se resuelve neutralmente, #Y 25 o menos#! desencadena una crisis. Cada hito restante ofrece una opción que afecta al arreglo religioso."
 ve_je_religious_settlement_transition_status_freedom:0 "Arreglo objetivo: #Y Libertad de conciencia#!\nArreglo religioso: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTiempo restante aproximado: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] meses#!\nHitos completados: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nResultado al finalizar la crisis: #Y 60+#! el arreglo se estabiliza pronto, #Y 26-59#! se resuelve neutralmente, #Y 25 o menos#! desencadena una crisis. Cada hito restante ofrece una opción que afecta al arreglo religioso."
 ve_je_religious_settlement_transition_status_separation:0 "Arreglo objetivo: #Y Separación total#!\nArreglo religioso: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTiempo restante aproximado: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] meses#!\nHitos completados: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nResultado al finalizar la crisis: #Y 60+#! el arreglo se estabiliza pronto, #Y 26-59#! se resuelve neutralmente, #Y 25 o menos#! desencadena una crisis. Cada hito restante ofrece una opción que afecta al arreglo religioso."
 ve_je_religious_settlement_transition_status_atheism:0 "Arreglo objetivo: #Y Ateísmo de Estado#!\nArreglo religioso: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTiempo restante aproximado: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] meses#!\nHitos completados: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nResultado al finalizar la crisis: #Y 60+#! el arreglo se estabiliza pronto, #Y 26-59#! se resuelve neutralmente, #Y 25 o menos#! desencadena una crisis. Cada hito restante ofrece una opción que afecta al arreglo religioso."

 ve_je_national_compact_transition:0 "Transición del pacto nacional"
 ve_je_national_compact_transition_reason:0 "El Estado ha adoptado una nueva definición de pertenencia nacional. Los administradores, las élites y las comunidades deben negociar el pacto mientras la reacción de transición siga vigente. El modificador de reacción —y no el calendario de esta Anotación en el diario— es imperativo."
 ve_je_national_compact_transition_complete_tt:0 "La reacción de transición del pacto nacional ha finalizado."
 ve_je_national_compact_transition_status_ethnic:0 "Identidad objetivo: #Y Identidad étnica#!\nCohesión nacional: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTiempo restante aproximado: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] meses#!\nHitos completados: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nResultado al finalizar la reacción: #Y 60+#! la cohesión se estabiliza pronto, #Y 26-59#! se resuelve neutralmente, #Y 25 o menos#! desencadena una crisis. Cada hito restante ofrece una opción que afecta a la Cohesión nacional."
 ve_je_national_compact_transition_status_civic:0 "Identidad objetivo: #Y Identidad cívica#!\nCohesión nacional: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTiempo restante aproximado: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] meses#!\nHitos completados: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nResultado al finalizar la reacción: #Y 60+#! la cohesión se estabiliza pronto, #Y 26-59#! se resuelve neutralmente, #Y 25 o menos#! desencadena una crisis. Cada hito restante ofrece una opción que afecta a la Cohesión nacional."
 ve_je_national_compact_transition_status_composite:0 "Identidad objetivo: #Y Identidad compuesta#!\nCohesión nacional: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTiempo restante aproximado: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] meses#!\nHitos completados: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nResultado al finalizar la reacción: #Y 60+#! la cohesión se estabiliza pronto, #Y 26-59#! se resuelve neutralmente, #Y 25 o menos#! desencadena una crisis. Cada hito restante ofrece una opción que afecta a la Cohesión nacional."
 ve_je_transition_resolving_status:0 "El registro de transición se está reconciliando con el arreglo nacional actual."

 ve_rel_transition_conciliatory_tt:0 "Gastas #N 10#! reforma piadosa y obtienes #P 3#! arreglo religioso."
 ve_rel_transition_central_tt:0 "Obtienes #P 5#! reforma piadosa y pierdes #N 3#! arreglo religioso."
 ve_rel_transition_doctrine_tt:0 "Gastas #N 5#! reforma piadosa y obtienes #P 2#! arreglo religioso."

 ve_rel_evt.210.t:0 "Los límites del nombramiento clerical"
 ve_rel_evt.210.d:0 "Las autoridades religiosas han presentado listas de candidatos para cargos públicos, mientras que los administradores superiores insisten en que el servicio del Estado debe seguir premiando la competencia. Los primeros nombramientos bajo el nuevo acuerdo definirán dónde termina el consejo clerical y dónde comienza la Autoridad civil."
 ve_rel_evt.210.a:0 "Convocar una junta de nombramientos mixta."
 ve_rel_evt.210.b:0 "Aceptar las listas clericales."
 ve_rel_evt.210.c:0 "Vincular los exámenes estándar al consejo religioso."

 ve_rel_evt.211.t:0 "Escuelas y juramentos de Lealtad"
 ve_rel_evt.211.d:0 "Las escuelas parroquiales buscan un lugar reconocido en el sistema público. Sus benefactores exigen protección para la instrucción religiosa, mientras que los funcionarios temen que los planes de estudio y los juramentos concurrentes dividan a la próxima generación."
 ve_rel_evt.211.a:0 "Garantizar un plan de estudios central compartido."
 ve_rel_evt.211.b:0 "Imponer un único juramento de Lealtad uniforme."
 ve_rel_evt.211.c:0 "Someter el compromiso a la inspección burocrática."

 ve_rel_evt.220.t:0 "El lenguaje de las garantías para minorías"
 ve_rel_evt.220.d:0 "Las comunidades minoritarias desean que sus protecciones queden escritas explícitamente en el nuevo acuerdo. Los juristas del Gobierno prefieren, en cambio, una única cláusula General, advirtiendo que las promesas específicas para cada comunidad podrían endurecer viejas divisiones."
 ve_rel_evt.220.a:0 "Redactar las garantías con claridad."
 ve_rel_evt.220.b:0 "Utilizar una única cláusula de ciudadanía uniforme."
 ve_rel_evt.220.c:0 "Dejar que la coalición reformista medie en la redacción."

 ve_rel_evt.221.t:0 "La representación en las Instituciones comunes"
 ve_rel_evt.221.d:0 "Las escuelas, los hospitales y las juntas locales deben servir ahora a ciudadanos de diversas confesiones en pie de igualdad. La cuestión es si la representación debe ajustarse a las realidades locales o a una fórmula impuesta desde el centro."
 ve_rel_evt.221.a:0 "Equilibrar la representación a nivel local."
 ve_rel_evt.221.b:0 "Establecer una cuota central."
 ve_rel_evt.221.c:0 "Negociar una fórmula de representación diplomática."

 ve_rel_evt.230.t:0 "El registro neutral"
 ve_rel_evt.230.d:0 "Los nacimientos, matrimonios y Reivindicaciones de propiedad están pasando de los custodios religiosos a los registradores civiles. Los funcionarios pueden preservar registros duplicados durante la transición, pero los reformistas exigen una ruptura nítida e inmediata."
 ve_rel_evt.230.a:0 "Mantener registros duales durante un periodo de transición."
 ve_rel_evt.230.b:0 "Cerrar los registros religiosos de inmediato."
 ve_rel_evt.230.c:0 "Desplegar una red de servicio civil capacitada."

 ve_rel_evt.231.t:0 "Escuela y ceremonia pública"
 ve_rel_evt.231.d:0 "El principio de Neutralidad del Estado ha llegado a las asambleas escolares y ceremonias públicas. Las comunidades locales quieren espacio para las costumbres heredadas; los funcionarios centrales quieren un único protocolo laico que no deje lugar a ambigüedades."
 ve_rel_evt.231.a:0 "Dejar espacio para las ceremonias locales."
 ve_rel_evt.231.b:0 "Imponer un Mandato de protocolo laico."
 ve_rel_evt.231.c:0 "Crear un estándar ceremonial cívico compartido."

 ve_rel_evt.240.t:0 "Una Escasez de cuadros laicos"
 ve_rel_evt.240.d:0 "La nueva administración necesita profesores, registradores e inspectores capaces de operar sin las instituciones clericales. Hay muy pocos candidatos formados, y obligar al personal actual a convertirse en su práctica puede provocar resistencia."
 ve_rel_evt.240.a:0 "Financiar un nuevo programa de formación de cuadros."
 ve_rel_evt.240.b:0 "Obligar al personal existente a adaptarse."
 ve_rel_evt.240.c:0 "Construir una red de formación académica."

 ve_rel_evt.241.t:0 "Propiedad y culto clandestino"
 ve_rel_evt.241.d:0 "La transferencia de bienes religiosos ha llevado a algunas congregaciones a la clandestinidad. La confiscación inmediata dotaría rápidamente al nuevo Estado, pero un acuerdo apresurado corre el riesgo de convertir el culto Privado en un desafío Organizada."
 ve_rel_evt.241.a:0 "Transferir la propiedad de forma gradual."
 ve_rel_evt.241.b:0 "Nacionalizar de inmediato."
 ve_rel_evt.241.c:0 "Canalizar los activos hacia instituciones asistenciales supervisadas."

 ve_rel_evt.290.t:0 "Un arreglo echa raíces"
 ve_rel_evt.290.d:0 "La crisis de transición ha pasado sin romper el arreglo religioso del país. Los administradores ahora trabajan bajo las nuevas reglas, las comunidades saben cuál es su posición y el Gobierno puede convertir la Experiencia en capacidad de reforma o en una mayor confianza pública."
 ve_rel_evt.290.a:0 "Llevar las lecciones a la siguiente reforma."
 ve_rel_evt.290.a.tt:0 "Obtén #P 10#! de Reforma piadosa."
 ve_rel_evt.290.b:0 "Reafirmar el arreglo en público."
 ve_rel_evt.290.b.tt:0 "Obtén #P 3#! de Arreglo religioso."

 ve_rel_evt.291.t:0 "Un equilibrio frágil"
 ve_rel_evt.291.d:0 "La transición formal ha concluido, pero el nuevo arreglo sigue siendo un pacto de cautela más que de convicción. Se puede dejar que madure por sí mismo, fortalecerlo mediante otra concesión limitada o estabilizarlo a través de Instituciones adecuadas al Modelo religioso adoptado."
 ve_rel_evt.291.a:0 "Dejar que el compromiso permanezca."
 ve_rel_evt.291.a.tt:0 "La transición termina sin un efecto mecánico adicional."
 ve_rel_evt.291.b:0 "Financiar una última acomodación."
 ve_rel_evt.291.b.tt:0 "Gasta #N 10#! de Reforma piadosa y obtén #P 3#! de Arreglo religioso."
 ve_rel_evt.291.c:0 "Confiar el arreglo a Instituciones aptas para el modelo."
 ve_rel_evt.291.c.tt:0 "Gasta #N 5#! de Reforma piadosa y obtén #P 2#! de Arreglo religioso. Requiere una Doctrina adecuada al Modelo religioso adoptado."

 ve_rel_evt.292.t:0 "Una crisis de arreglo"
 ve_rel_evt.292.d:0 "El Modificador de transición ha expirado, pero el país no ha aceptado el nuevo orden religioso. El Gobierno puede gastar su escasa capacidad de reforma en una acomodación de emergencia, confiar en Instituciones aptas para el modelo para una intervención más limitada o permitir que el conflicto no resuelto radicalice a parte de la Población."
 ve_rel_evt.292.a:0 "Pagar el precio de una acomodación de emergencia."
 ve_rel_evt.292.a.tt:0 "Gasta #N 15#! de Reforma piadosa y obtén #P 5#! de Arreglo religioso."
 ve_rel_evt.292.b:0 "El Estado ya no tiene concesiones que ofrecer."
 ve_rel_evt.292.b.tt:0 "El #N 0.25%#! de la Población del país se vuelve Radical."
 ve_rel_evt.292.c:0 "Utilizar las Instituciones construidas para este arreglo."
 ve_rel_evt.292.c.tt:0 "Gasta #N 5#! de Reforma piadosa y obtén #P 2#! de Arreglo religioso. Requiere una Doctrina adecuada al Modelo religioso adoptado."

 ve_identity_transition_conciliatory_tt:0 "Gasta #N 10#! de Mandato cultural y obtén #P 3#! de Cohesión nacional."
 ve_identity_transition_central_tt:0 "Obtén #P 5#! de Mandato cultural y pierde #N 3#! de Cohesión nacional."
 ve_identity_transition_doctrine_tt:0 "Gasta #N 5#! de Mandato cultural y obtén #P 2#! de Cohesión nacional."

 ve_cul_evt.210.t:0 "La lengua oficial del Estado"
 ve_cul_evt.210.d:0 "El nuevo pacto nacional exige una lengua común para los tribunales, las escuelas y el servicio público. La uniformidad inmediata sería fácil de administrar, pero muchos funcionarios experimentados y ciudadanos aún no pueden cumplir con el estándar propuesto."
 ve_cul_evt.210.a:0 "Introducir la lengua mediante instrucción gradual."
 ve_cul_evt.210.b:0 "Emitir una orden de lengua única."
 ve_cul_evt.210.c:0 "movilizar la administración nacionalista."

 ve_cul_evt.211.t:0 "Servicio y pertenencia"
 ve_cul_evt.211.d:0 "El servicio militar y el estatus de veterano se están convirtiendo en pruebas de pertenencia nacional. Las comunidades integradas bajo el nuevo pacto demandan tiempo para adaptarse, mientras que el centro insiste en que la pertenencia debe conllevar una Obligación uniforme."
 ve_cul_evt.211.a:0 "Conceder exenciones transitorias."
 ve_cul_evt.211.b:0 "Aplicar una sola Obligación de servicio."
 ve_cul_evt.211.c:0 "Crear un registro de servicio universal."

 ve_cul_evt.220.t:0 "El registro de ciudadanía igualitaria"
 ve_cul_evt.220.d:0 "Las viejas categorías étnicas y religiosas siguen arraigadas en los registros públicos. Eliminarlas de inmediato proclamaría la ciudadanía igualitaria, pero las oficinas locales advierten que una Conversión apresurada podría borrar Reivindicaciones y perturbar el acceso a los servicios."
 ve_cul_evt.220.a:0 "Introducir gradualmente un registro cívico común."
 ve_cul_evt.220.b:0 "Eliminar las viejas categorías de inmediato."
 ve_cul_evt.220.c:0 "Someter la Conversión a una comisión de reforma."

 ve_cul_evt.221.t:0 "Escuela común, servicio común"
 ve_cul_evt.221.d:0 "La igualdad de acceso existe ante la ley, mas las escuelas y oficinas públicas carecen del personal necesario para garantizarla. El Gobierno debe elegir entre una inversión paciente, un estándar central de obligado cumplimiento y una red nacional de cualificaciones académicas."
 ve_cul_evt.221.a:0 "Invertir en profesores y Funcionarios."
 ve_cul_evt.221.b:0 "Aplicar un estándar central."
 ve_cul_evt.221.c:0 "Construir una red de cualificaciones académicas."

 ve_cul_evt.230.t:0 "El Consejo de los Pueblos Constituyentes"
 ve_cul_evt.230.d:0 "Las comunidades mencionadas en el pacto compuesto exigen voz en su administración. Unas negociaciones abiertas pueden Producir Legitimidad, mientras que una cuota fija diseñada en la capital promete un arreglo más rápido y predecible."
 ve_cul_evt.230.a:0 "Abrir Negociaciones representativas."
 ve_cul_evt.230.b:0 "Imponer la cuota fija de la capital."
 ve_cul_evt.230.c:0 "Pactar un compromiso parlamentario."

 ve_cul_evt.231.t:0 "Administración estratificada"
 ve_cul_evt.231.d:0 "La Autoridad local y los estándares centrales se solapan ahora en todo el Estado compuesto. Sin un protocolo claro, cada oficina renegociará los límites; con una cadena de mando demasiado rígida, el pacto podría perder su sentido."
 ve_cul_evt.231.a:0 "Negociar un protocolo de competencias."
 ve_cul_evt.231.b:0 "Establecer una cadena de mando central."
 ve_cul_evt.231.c:0 "Crear un registro burocrático compartido."

 ve_cul_evt.290.t:0 "Un nuevo pacto nacional"
 ve_cul_evt.290.d:0 "La Reacción ha remitido y la nueva definición de pertenencia nacional ha arraigado. El Gobierno puede preservar las lecciones administrativas en forma de Mandato cultural o aprovechar el momento para reforzar la Confianza en el pacto."
 ve_cul_evt.290.a:0 "Llevar la Experiencia al arte de gobernar venidero."
 ve_cul_evt.290.a.tt:0 "Obtienes #P 10#! Mandato cultural."
 ve_cul_evt.290.b:0 "Celebrar el pacto en todo el país."
 ve_cul_evt.290.b.tt:0 "Obtienes #P 3#! Cohesión nacional."

 ve_cul_evt.291.t:0 "Un pacto frágil"
 ve_cul_evt.291.d:0 "La transición formal ha concluido, pero la nueva identidad nacional sigue sin ser Aceptada de manera uniforme. El Gobierno puede permitir que el compromiso madure, gastar un Mandato limitado en otra acomodación o reforzarlo mediante Instituciones adecuadas al modelo adoptado."
 ve_cul_evt.291.a:0 "Permitir que el compromiso encuentre su propio Balance."
 ve_cul_evt.291.a.tt:0 "La transición termina sin ningún efecto mecánico adicional."
 ve_cul_evt.291.b:0 "Financiar una última acomodación."
 ve_cul_evt.291.b.tt:0 "Gastas #N 10#! Mandato cultural y ganas #P 3#! Cohesión nacional."
 ve_cul_evt.291.c:0 "Confiar el pacto a Instituciones adaptadas al modelo."
 ve_cul_evt.291.c.tt:0 "Gastas #N 5#! Mandato cultural y ganas #P 2#! Cohesión nacional. Requiere una Doctrina adecuada al Modelo de identidad adoptado."

 ve_cul_evt.292.t:0 "Una crisis del pacto nacional"
 ve_cul_evt.292.d:0 "La Reacción de la transición ha expirado, pero la nueva definición de pertenencia no ha logrado Comandar una amplia Lealtad. El Gobierno puede gastar un escaso Mandato en una acomodación de emergencia, confiar en Instituciones adaptadas al modelo para una intervención más limitada o aceptar una ola de Radicalización."
 ve_cul_evt.292.a:0 "Pagar por una acomodación de emergencia."
 ve_cul_evt.292.a.tt:0 "Gastas #N 15#! Mandato cultural y ganas #P 5#! Cohesión nacional."
 ve_cul_evt.292.b:0 "El Estado hará cumplir el pacto tal como está escrito."
 ve_cul_evt.292.b.tt:0 "El #N 0.25%#! de la Población del país se vuelve Radical."
 ve_cul_evt.292.c:0 "Utilizar las Instituciones creadas para esta identidad."
 ve_cul_evt.292.c.tt:0 "Gastas #N 5#! Mandato cultural y ganas #P 2#! Cohesión nacional. Requiere una Doctrina adecuada al Modelo de identidad adoptado."
