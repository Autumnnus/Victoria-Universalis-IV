l_spanish:
 ve_tag_flavor_delayed_result_tt:0 "Las consecuencias de esta elección institucional aparecerán en aproximadamente un año."
 ve_tag_flavor_free_route_tt:0 "Esta ruta no pasa por ninguna perspectiva nacional, mandato cultural o reforma de la piedad."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Un léxico cívico común"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Un vocabulario oficial compartido lleva la reforma a las escuelas y oficinas provinciales, pero la explicación constante consume la autoridad central."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Continuidad Sagrada"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "La reforma se ha enmarcado a través de instituciones religiosas heredadas, reforzando el mando y al mismo tiempo estrechando los canales a través de los cuales circulan los métodos extranjeros."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Traducción Administrativa"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "La burocracia traduce la reforma en un procedimiento familiar. La administración se vuelve más estable, pero el cambio legislativo pierde algo de velocidad."
 ve_tag_flavor.1.t:0 "El lenguaje de la reforma"
 ve_tag_flavor.1.d:0 "Un decreto puede salir de la capital en una prosa impecable y aún así llegar a una escuela, tribunal, oficina provincial o fundación religiosa como cuatro instrucciones diferentes. Los reformadores exigen ahora un vocabulario común. La pregunta es qué instituciones darán significado a ese vocabulario."
 ve_tag_flavor.1.a:0 "Redactar un léxico cívico común."
 ve_tag_flavor.1.a.tt:0 "Requiere Nación Cívica o Estado Compuesto.\nGastar #N 20 Mandato Cultural#! ahora.\nDespués de aproximadamente un año: gane  #P 8 conocimiento nacional#!  y  #P 3 cohesión nacional#!, luego gane #P +1% Acceso a la Educación#! y #N -25 Autoridad#! durante 24 meses."
 ve_tag_flavor.1.b:0 "Reforma del terreno en continuidad sagrada."
 ve_tag_flavor.1.b.tt:0 "Requiere el modelo religioso confesional.\nGastar #N 20 Reforma de la piedad#! ahora.\nDespués de aproximadamente un año: obtenga #P 8 National Insight#! y #P 3 Asentamiento Religioso#!, luego obtenga #P +25 Autoridad#! y #N -2.5% de Distribución Tecnológica#! durante 24 meses."
 ve_tag_flavor.1.c:0 "Deje que cada oficina traduzca la orden."
 ve_tag_flavor.1.c.tt:0 "Después de aproximadamente un año: gane #P 4 Conocimiento Nacional#!, luego gana #P +25 Burocracia#! y #N -2,5% Velocidad de Sanción de Ley#! durante 24 meses."
 ve_tag_flavor.2.t:0 "Las palabras se convierten en procedimiento"
 ve_tag_flavor.2.d:0 "Un año de circulares, comentarios, libros escolares, sermones y correspondencia provincial ha dado al programa de reforma un lenguaje de trabajo. No es perfectamente uniforme, pero los funcionarios ahora saben qué frases exigen acuerdo y cuáles aún ocultan desacuerdo."
 ve_tag_flavor.2.a:0 "El vocabulario entra en la maquinaria del Estado."
 ve_tag_flavor.2.a.tt:0 "El resultado elegido hace un año entra ahora en vigor. Sus cambios de recursos están limitados a sus límites normales y su modificador institucional dura 24 meses."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Oficinas de traducción"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Las oficinas especializadas aceleran la circulación de métodos extranjeros, aunque su autonomía debilita el mando inmediato del centro."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Préstamo dirigido"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Las instituciones importadas se reorganizan bajo dirección central. Se preserva la autoridad, pero cada reforma tarda más en pasar por los canales oficiales."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Adopción selectiva"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "El Estado sólo admite métodos que puedan conciliarse con la autoridad establecida, cambiando la velocidad de difusión por el control político."
 ve_tag_flavor.10.t:0 "Métodos prestados, autoridad nativa"
 ve_tag_flavor.10.d:0 "Los manuales, máquinas, planes escolares y tablas administrativas extranjeros llegan más rápido de lo que cualquier ministerio puede juzgarlos. Algunos funcionarios exigen oficinas de traducción permanentes; otros insisten en que todas las instituciones prestadas se rehagan bajo dirección central. Una tercera facción admitiría sólo lo que pueda ser absorbido sin perturbar el orden establecido."
 ve_tag_flavor.10.a:0 "Establecer oficinas de traducción."
 ve_tag_flavor.10.a.tt:0 "Requiere Idea Académica IV o Idea de Infraestructura IV.\nGastar #N 15 Conocimientos Nacionales#! ahora.\nDespués de aproximadamente un año: ganar #P 10 Era Momentum#!, luego ganar #P +2.5% de Difusión Tecnológica#! y #N -25 Autoridad#! durante 24 meses."
 ve_tag_flavor.10.b:0 "Pedir prestado solo bajo dirección central."
 ve_tag_flavor.10.b.tt:0 "Requiere Idea Nacional Japonesa IV.\nGasta #N 10 Perspectivas Nacionales#! ahora.\nDespués de aproximadamente un año: gana #P 7 Era Momentum#!, luego gana #P +25 Autoridad#! y #N -2,5% Velocidad de promulgación de leyes#! durante 24 meses."
 ve_tag_flavor.10.c:0 "Adoptar selectivamente y conservar el mando."
 ve_tag_flavor.10.c.tt:0 "Después de aproximadamente un año: ganar #P 3 Era Momentum#!, luego ganar #P +25 Autoridad#! y #N -2.5% Spread Tecnológico#! por 24 meses."
 ve_tag_flavor.11.t:0 "Métodos hechos nuestros"
 ve_tag_flavor.11.d:0 "Un año de traducción, pruebas, reelaboración y argumentos oficiales ha separado la novedad de la utilidad. Los métodos adoptados ya no aparecen como instrucciones extranjeras; han entrado en el propio vocabulario de mando del Estado."
 ve_tag_flavor.11.a:0 "Utilice lo que haya sobrevivido al examen."
 ve_tag_flavor.11.a.tt:0 "El resultado elegido hace un año entra ahora en vigor. Era Momentum conserva su piso cero normal y el modificador institucional tiene una duración de 24 meses."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Pacto de ciudadanía"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Un lenguaje común de ciudadanía facilita la llegada y la participación, pero explicar el pacto en todas las jurisdicciones consume autoridad central."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Acuerdo compuesto"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "La administración federal aprende a negociar entre las comunidades constituyentes, fortaleciendo las oficinas y al mismo tiempo reduciendo la presión hacia una única forma cultural."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Ambigüedad federal"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "La ambigüedad deliberada amplía la voz diplomática de la Unión, pero por un tiempo reduce el equilibrio de la cohesión nacional en 2."
 ve_tag_flavor.20.t:0 "El significado de la unión"
 ve_tag_flavor.20.d:0 "Los recién llegados, los estados establecidos y las comunidades con diferentes costumbres públicas invocan la Unión en sus propios términos. Los legisladores están de acuerdo en que se necesita una fórmula común, pero no en si debe definir la ciudadanía individual, preservar un acuerdo entre las comunidades constituyentes o seguir siendo lo suficientemente amplia para que cada jurisdicción la interprete."
 ve_tag_flavor.20.a:0 "Escribir un pacto de ciudadanía."
 ve_tag_flavor.20.a.tt:0 "Requiere Nación Cívica.\nGastar #N 20 Mandato Cultural#! ahora.\nDespués de aproximadamente un año: obtenga #P 8 conocimiento nacional#! y #P 3 cohesión nacional#!, luego ganar #P +2.5% Atracción Migratoria#! y #N -25 Autoridad#! durante 24 meses."
 ve_tag_flavor.20.b:0 "Negociar un trato compuesto."
 ve_tag_flavor.20.b.tt:0 "Requiere Estado compuesto.\nGastar #N 20 Mandato Cultural#! ahora.\nDespués de aproximadamente un año: gana #P 8 de Perspicacia Nacional#!  y #P 3 de Cohesión Nacional#!, luego gana #P +25 de Burocracia.#! y #N -2,5% Asimilación#! durante 24 meses."
 ve_tag_flavor.20.c:0 "Dejar la fórmula federal deliberadamente amplia."
 ve_tag_flavor.20.c.tt:0 "Después de aproximadamente un año: ganar #P 4 Perspectiva nacional#! y #P +25 Influencia#! durante 24 meses. Mientras el modificador esté activo, el equilibrio de Cohesión Nacional es #N 2 inferiores#!."
 ve_tag_flavor.21.t:0 "Una fórmula para la Unión"
 ve_tag_flavor.21.d:0 "Un año de convenciones, informes de comités, resoluciones estatales y debates públicos ha producido un lenguaje que las instituciones pueden utilizar. Sus silencios tienen tantas consecuencias como sus declaraciones, al definir qué disputas resuelve la Unión y cuáles deja a la negociación."
 ve_tag_flavor.21.a:0 "Dejemos que la fórmula entre en la vida pública."
 ve_tag_flavor.21.a.tt:0 "El resultado elegido hace un año entra ahora en vigor. Los cambios de recursos se limitan a sus límites normales y el modificador institucional dura 24 meses."
