l_spanish:
 ve_tag_flavor_delayed_result_tt:0 "Las consecuencias de esta elección institucional se manifestarán en aproximadamente un año."
 ve_tag_flavor_free_route_tt:0 "Esta vía no consume Perspicacia nacional, Mandato cultural ni Reforma piadosa."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Un léxico cívico común"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Un vocabulario oficial compartido lleva la reforma a las escuelas y oficinas provinciales, pero la explicación constante consume Autoridad central."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Continuidad sagrada"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "La reforma se ha enmarcado a través de instituciones religiosas heredadas, reforzando el Comandar a la vez que se estrechan los canales por los que circulan los métodos extranjeros."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Traducción administrativa"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "La burocracia traduce la reforma en procedimientos familiares. La administración se vuelve más firme, pero el cambio legislativo pierde cierta velocidad."
 ve_tag_flavor.1.t:0 "El lenguaje de la reforma"
 ve_tag_flavor.1.d:0 "Un decreto puede salir de la capital en una prosa impecable y aun así llegar a una escuela, tribunal, oficina provincial o fundación religiosa como cuatro instrucciones distintas. Los reformistas exigen ahora un vocabulario común. La cuestión es qué instituciones darán significado a ese vocabulario."
 ve_tag_flavor.1.a:0 "Redactar un léxico cívico común."
 ve_tag_flavor.1.a.tt:0 "Requiere Nación cívica o Estado compuesto.\nConsume #N 20 Mandato cultural#! ahora.\nTras aproximadamente un año: gana #P 8 Perspicacia nacional#! y #P 3 Cohesión nacional#!, luego otorga #P +1% Acceso a la educación#! y #N -25 Autoridad#! durante 24 meses."
 ve_tag_flavor.1.b:0 "Basar la reforma en la continuidad sagrada."
 ve_tag_flavor.1.b.tt:0 "Requiere el Modelo religioso confesional.\nConsume #N 20 Reforma piadosa#! ahora.\nTras aproximadamente un año: gana #P 8 Perspicacia nacional#! y #P 3 Arreglo religioso#!, luego otorga #P +25 Autoridad#! y #N -2.5% Difusión tecnológica#! durante 24 meses."
 ve_tag_flavor.1.c:0 "Dejar que cada negociado traduzca la orden."
 ve_tag_flavor.1.c.tt:0 "Tras aproximadamente un año: gana #P 4 Perspicacia nacional#!, luego otorga #P +25 Burocracia#! y #N -2.5% Velocidad de promulgación#! durante 24 meses."
 ve_tag_flavor.2.t:0 "Las palabras se vuelven procedimiento"
 ve_tag_flavor.2.d:0 "Un año de circulares, comentarios, libros escolares, sermones y correspondencia provincial ha dotado al programa de reformas de un lenguaje de trabajo. No es perfectamente uniforme, pero los funcionarios ya saben qué frases imponen acuerdo y cuáles aún ocultan desacuerdo."
 ve_tag_flavor.2.a:0 "El vocabulario entra en la maquinaria del Estado."
 ve_tag_flavor.2.a.tt:0 "El resultado seleccionado hace un año surte efecto ahora. Sus cambios de recursos se limitan a sus topes normales y su modificador institucional dura 24 meses."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Oficinas de traducción"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Las oficinas especializadas aceleran la circulación de métodos extranjeros, aunque su Autonomía debilita el Comandar inmediato del centro."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Préstamo dirigido"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Las instituciones importadas se reorganizan bajo dirección central. La Autoridad se preserva, pero cada reforma tarda más en atravesar los canales oficiales."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Adopción selectiva"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "El Estado admite únicamente aquellos métodos que pueden conciliarse con la Autoridad establecida, cambiando la velocidad de difusión por el control político."
 ve_tag_flavor.10.t:0 "Métodos tomados prestados, Autoridad nativa"
 ve_tag_flavor.10.d:0 "Manuales extranjeros, máquinas, planes escolares y cuadros administrativos llegan más rápido de lo que cualquier ministerio puede juzgar. Algunos funcionarios exigen oficinas de traducción permanentes; otros insisten en que cada institución adoptada sea rehecha bajo dirección central. Una tercera facción admitiría solo lo que pueda absorberse sin perturbar el orden establecido."
 ve_tag_flavor.10.a:0 "Establecer oficinas de traducción."
 ve_tag_flavor.10.a.tt:0 "Requiere Académica Doctrina IV o Infraestructuras Doctrina IV.\nConsume #N 15 Perspicacia nacional#! ahora.\nTras aproximadamente un año: gana #P 10 Ímpetu de era#!, luego otorga #P +2.5% Difusión tecnológica#! y #N -25 Autoridad#! durante 24 meses."
 ve_tag_flavor.10.b:0 "Tomar prestado únicamente bajo dirección central."
 ve_tag_flavor.10.b.tt:0 "Requiere Idea nacional IV japonesa.\nConsume #N 10 Perspicacia nacional#! ahora.\nTras aproximadamente un año: gana #P 7 Ímpetu de era#!, luego otorga #P +25 Autoridad#! y #N -2.5% Velocidad de promulgación#! durante 24 meses."
 ve_tag_flavor.10.c:0 "Adoptar selectivamente y preservar el mando."
 ve_tag_flavor.10.c.tt:0 "Tras aproximadamente un año: gana #P 3 Ímpetu de era#!, luego otorga #P +25 Autoridad#! y #N -2.5% Difusión tecnológica#! durante 24 meses."
 ve_tag_flavor.11.t:0 "Métodos hechos propios"
 ve_tag_flavor.11.d:0 "Un año de traducción, pruebas, redacción y debate oficial ha separado la novedad de la utilidad. Los métodos adoptados ya no parecen instrucciones extranjeras; han entrado en el vocabulario de mando propio del Estado."
 ve_tag_flavor.11.a:0 "Utilizar lo que ha sobrevivido al examen."
 ve_tag_flavor.11.a.tt:0 "El resultado seleccionado hace un año surte efecto ahora. El Ímpetu de era conserva su suelo normal de cero, y el modificador institucional dura 24 meses."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Pacto de ciudadanía"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Un lenguaje común de ciudadanía facilita la llegada y la participación, pero explicar el pacto en cada jurisdicción consume Autoridad central."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Pacto compuesto"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "La administración federal aprende a negociar entre las comunidades constituyentes, fortaleciendo las oficinas a la vez que reduce la presión hacia una forma cultural única."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Ambigüedad federal"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "La ambigüedad deliberada amplía la voz diplomática de la Unión, pero durante un tiempo reduce el equilibrio de Cohesión nacional en 2."
 ve_tag_flavor.20.t:0 "El significado de la Unión"
 ve_tag_flavor.20.d:0 "Los recién llegados, los estados establecidos y las comunidades con diferentes costumbres públicas invocan la Unión en sus propios términos. Los legisladores coinciden en que se necesita una fórmula común, pero no en si esta debe definir la ciudadanía individual, preservar un pacto entre las comunidades constituyentes o mantenerse lo suficientemente amplia como para que cada jurisdicción la interprete."
 ve_tag_flavor.20.a:0 "Redactar un pacto de ciudadanía."
 ve_tag_flavor.20.a.tt:0 "Requiere Nación cívica.\nGasta #N 20 Mandato cultural#! ahora.\nTras aproximadamente un año: se obtienen #P 8 Perspicacia nacional#! y #P 3 Cohesión nacional#!, y luego se obtienen #P +2.5% Atracción migratoria#! y #N -25 Autoridad#! durante 24 meses."
 ve_tag_flavor.20.b:0 "Negociar un pacto compuesto."
 ve_tag_flavor.20.b.tt:0 "Requiere Estado compuesto.\nGasta #N 20 Mandato cultural#! ahora.\nTras aproximadamente un año: se obtienen #P 8 Perspicacia nacional#! y #P 3 Cohesión nacional#!, y luego se obtienen #P +25 Burocracia#! y #N -2.5% Asimilación#! durante 24 meses."
 ve_tag_flavor.20.c:0 "Dejar la fórmula federal deliberadamente amplia."
 ve_tag_flavor.20.c.tt:0 "Tras aproximadamente un año: obtén #P 4 Perspicacia nacional#! y #P +25 Influencia#! durante 24 meses. Mientras el modificador esté activo, el equilibrio de Cohesión nacional será #N 2 menor#!."
 ve_tag_flavor.21.t:0 "Una fórmula para la Unión"
 ve_tag_flavor.21.d:0 "Un año de convenciones, informes de comités, resoluciones estatales y debates públicos ha producido un lenguaje que las instituciones pueden utilizar. Sus silencios son tan trascendentales como sus declaraciones, al definir qué disputas zanja la Unión y cuáles deja a la negociación."
 ve_tag_flavor.21.a:0 "Permitir que la fórmula entre en la vida pública."
 ve_tag_flavor.21.a.tt:0 "El resultado seleccionado hace un año surte efecto ahora. Los cambios de recursos se limitan a sus umbrales normales y el modificador institucional dura 24 meses."
