 alert_ve_can_begin_targeted_religious_project_hint:0 "Tenemos la Reforma de la Piedad y un estado elegible para el proyecto del Modelo Religioso activo."
 ve_culture_reform_cost_tt:0 "Requisito de reforma de la cultura heredada."
 ve_state_religion_tt:0 "#P Habilita la mecánica del Estado confesional y 3 Misioneros.#! La Autoridad Religiosa responde fuertemente al apoyo de los Devotos."
 ve_freedom_of_conscience_tt:0 "#P Habilita la mecánica del Estado Pluralista y 1 Misionero.#! La Armonía Religiosa recompensa la convivencia estable."
 ve_total_separation_tt:0 "#P Permite la mecánica del Estado Pluralista.#! Los Misioneros son discapacitados."
 ve_ethnostate_tt:0 "#P Se alinea fuertemente con el Modelo de Identidad de Nación Étnica.#! Entra en conflicto con la Nación Cívica y es menos adecuado para un Estado Compuesto."
 ve_national_supremacy_tt:0 "#P Se alinea con el Modelo de Identidad de Nación Étnica.#! Entra en conflicto con la Nación Cívica."
 ve_racial_segregation_tt:0 "#P Se alinea con el Modelo de Identidad Estatal Compuesto.#! Proporciona sólo un apoyo parcial a una Nación Étnica."
