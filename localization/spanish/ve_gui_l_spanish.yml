 ve_tb_momentum_tt:0 "$ve_age_splendor_tt$$ve_tb_click_era$"
 ve_targeted_religious_project_state_action:0 "#tooltippable_name Proyecto religioso dirigido"
 ve_targeted_religious_project_state_action_tt:0 "#header Proyecto religioso dirigido#!\nInicia el proyecto asociado al modelo religioso actual contra la composición religiosa de este estado. La Separación total no puede iniciar uno. Abre el panel de Religión para ver los costes exactos, las reglas de progreso y los resultados."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Proyecto cultural dirigido"
 ve_start_religious_project_button:0 "Iniciar proyecto"
 ve_cancel_religious_project_button:0 "Cancelar proyecto"
 ve_confirm_cancel_button:0 "#N Sí, cancelar#!"
 ve_keep_project_button:0 "Mantener proyecto"
 ve_targeted_religious_project_state_requirements_tt:0 "El Estado debe ser de nuestra propiedad, y nuestra propia religión no debe ostentar ya el #Y 90%#! o más de su población. Estado confesional, Libertad de conciencia y Ateísmo de Estado pueden iniciar uno cada uno; Separación total no puede. También debe satisfacerse el coste de Reforma piadosa del Modelo religioso activo."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "El Modelo religioso permite un Proyecto dirigido (Separación total no puede iniciar uno)"
 ve_religious_project_req_no_active:0 "Ningún Proyecto religioso dirigido en curso"
 ve_religious_project_req_no_backlash:0 "No encontrarse en el período de recuperación de 24 meses tras cancelar un proyecto"
 ve_religious_project_req_reform_point:0 "Suficiente Reforma piadosa para el Modelo religioso activo (#Y 125#! Estado confesional / #Y 100#! Libertad de conciencia / #Y 150#! Ateísmo de Estado)"
 ve_religious_project_req_target:0 "Nuestra propia religión ostenta menos del #Y 90%#! de la población de este estado"
 ve_religious_project_cancel_warning:0 "#header ¿Cancelar el Proyecto religioso dirigido?#!\n\nEl progreso alcanzado hasta ahora se pierde. Se aplican #N -5 Arreglo religioso#! y un modificador de período de recuperación de #N 24 meses#! antes de poder iniciar otro proyecto."
 ve_cultural_project_req_no_active:0 "Ningún Proyecto cultural en curso"
 ve_cultural_project_req_no_backlash:0 "No encontrarse en el período de recuperación de 24 meses tras cancelar un proyecto"
 ve_cultural_project_req_reform_point:0 "Suficiente Mandato cultural para el Modelo de identidad activo (#Y 125#! Nación étnica / #Y 100#! Nación cívica / #Y 150#! Estado compuesto, más #Y 40#! Cohesión para Estado compuesto)"
 ve_cultural_project_req_target:0 "Este estado tiene una cultura no principal elegible con al menos el #Y 5%#! de su población"
 ve_cultural_project_cancel_warning:0 "#header ¿Cancelar el Proyecto cultural?#!\n\nEl progreso alcanzado hasta ahora se pierde. Se aplican #N -5 Cohesión nacional#! y un modificador de período de recuperación de #N 24 meses#! antes de poder iniciar otro proyecto."
 alert_can_unlock_ideas_name:0 "Puede adoptar una doctrina"
 alert_can_unlock_ideas_hint:0 "Tenemos suficiente Perspicacia nacional para la siguiente doctrina de al menos un grupo adoptado, y ningún ciclo de implementación de doctrinas está bloqueando la compra en este momento."
 alert_max_piety_name:0 "Puede adoptar un programa religioso-estatal"
 alert_max_piety_hint:0 "Nuestra Reforma piadosa es lo suficientemente alta como para adoptar otro Programa religioso."
 alert_ve_can_begin_cultural_project_name:0 "Acumulación de Mandato cultural"
 alert_ve_can_begin_cultural_project_hint:0 "Tenemos más de #Y 300#! de Mandato cultural y un Proyecto cultural que podríamos iniciar. Los ingresos por mandato se reducen a la mitad a los 400 y se detienen a los 500, por lo que vale la pena gastarlos. No se fuerza nada: nuestro Modelo de identidad ya está activo."
 alert_can_unlock_age_bonus_name:0 "Puede desbloquear una Recompensa de era"
 alert_can_unlock_age_bonus_hint:0 "Tenemos suficiente Ímpetu de era para elegir otra recompensa."
 ag_ve_missionary_group_name:0 "Acciones religiosas y culturales"
 alert_can_use_missionary_name:0 "Puede enviar misioneros"
 alert_can_use_missionary_hint:0 "Nuestros misioneros esperan una misión activa. Haga clic en un estado propio y convierta a la población local."
 ag_ve_state_project_group_name:0 "Proyectos estatales dirigidos"
 alert_ve_can_begin_targeted_cultural_project_name:0 "Puede iniciar un Proyecto cultural dirigido"
 alert_ve_can_begin_targeted_cultural_project_hint:0 "Disponemos de los recursos y de un estado elegible para el Proyecto cultural dirigido de nuestro Modelo de identidad."
 alert_ve_can_begin_targeted_religious_project_name:0 "Puede iniciar un Proyecto religioso dirigido"
 alert_ve_can_begin_targeted_religious_project_hint:0 "Disponemos de la Reforma piadosa y de un estado elegible para el proyecto del Modelo religioso activo."
 ve_culture_reform_cost_tt:0 "Requisito de reforma de cultura de legado."
 ve_state_religion_tt:0 "#P Habilita las mecánicas de Estado confesional y 3 misioneros.#! La Autoridad religiosa responde enérgicamente al apoyo de los Devotos."
 ve_freedom_of_conscience_tt:0 "#P Habilita las mecánicas de Estado pluralista y 1 misionero.#! La Concordia religiosa recompensa la coexistencia estable."
 ve_total_separation_tt:0 "#P Habilita las mecánicas de Estado pluralista.#! Los misioneros están deshabilitados."
 ve_ethnostate_tt:0 "#P Se alinea firmemente con el Modelo de identidad de Nación étnica.#! Entra en conflicto con la Nación cívica y es menos adecuado para un Estado compuesto."
 ve_national_supremacy_tt:0 "#P Se alinea con el Modelo de identidad de Nación étnica.#! Entra en conflicto con la Nación cívica."
 ve_racial_segregation_tt:0 "#P Se alinea con el Modelo de identidad de Estado compuesto.#! Proporciona un apoyo meramente parcial para una Nación étnica."
 ve_cultural_exclusion_tt:0 "#P Se alinea con el Modelo de identidad de Estado compuesto y respalda parcialmente a la Nación cívica.#!"
 ve_multicultural_tt:0 "#P Se alinea firmemente con el Modelo de identidad de Nación cívica.#! Entra en conflicto con la Nación étnica."
 ve_send_missionary_tt:0 "#variable El misionero convierte la religión de la población local cada #gold 6 meses.\n\n#white Si la población del estado es inferior a 250 mil: #darker_white 0% #white Deterioro del poder base de conversión\n#white Si la población del estado es inferior a 500 mil: #negative_value -0,02% #white Deterioro del poder base de conversión\n#white Si la población del estado es inferior a 750 mil: #negative_value -0,03% #white Deterioro del poder base de conversión\n#white Si la población del estado es inferior a 1 mill.: #negative_value -0,04% #white Deterioro del poder base de conversión\n#white Si la población del estado es inferior a 5 mill.: #negative_value -0,043% #white Deterioro del poder base de conversión\n#white Si la población del estado es inferior a 10 mill.: #negative_value -0,045% #white Deterioro del poder base de conversión\n#white Si la población del estado supera los 10 mill.+: #negative_value -0,0475% #white Deterioro del poder base de conversión"
 ve_targeted_cultural_project_state_action_tt:0 "#header Proyecto cultural dirigido#!\nInicia el proyecto asociado al Modelo de identidad actual. La cultura no principal elegible más grande con al menos el #Y 5%#! de la población de este estado se convierte en el objetivo. Abra el panel de Identidad nacional para consultar los costes exactos, las reglas de progreso y los resultados."
