 ve_multicultural_tt:0 "#P Fuertemente se alinea con el Modelo de Identidad de Nación Cívica.#! Entra en conflicto con la Nación Étnica."
 ve_send_missionary_tt:0 "#variable El Misionero convierte la religión de la población local cada #gold 6 meses.\n\n#white Si la población del estado es inferior a 250.000: #darker_white 0% #white Conversión de base Caída de energía base\n#white Si la población del estado es inferior a 500 000 k: #negative_value -0,02 % #white Conversión Decaimiento de energía base\n#white Si la población del estado es inferior a 750 000: #negative_value -0,03 % #white Conversión Decaimiento de energía base\n#white Si la población del estado es inferior a 1 m: #negative_value -0,04 % #white Conversión Decaimiento de energía base\n#white Si es estado Población inferior a 5 millones: #negative_value -0,043% #white Conversión de disminución del poder base\n#white Si la población del estado es inferior a 10 millones: #negative_value -0,045% #white Conversión de deterioro del poder base\n#white Si la población del estado es superior a 10 millones: #negative_value -0,0475% #white Conversión Decaimiento del poder base"
 ve_targeted_cultural_project_state_action_tt:0 "#header Proyecto cultural objetivo#!\nInicia el proyecto asociado con el Modelo de Identidad actual. La cultura no primaria elegible más grande con al menos #Y El 5%#! de la población de este estado se convierte en el objetivo. Abra el panel de Identidad Nacional para conocer los costos exactos, las reglas de progreso y los resultados."
