 ve_targeted_religious_project_state_action:0 "#tooltippable_name Proyecto religioso específico"
 ve_targeted_religious_project_state_action_tt:0 "#header Proyecto religioso específico#!\nInicia el proyecto asociado al Modelo Religioso vigente frente a la composición religiosa de este estado. La Separación Total no puede iniciar uno. Abra el panel Religión para conocer los costos exactos, las reglas de progreso y los resultados."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Proyecto cultural objetivo"
 ve_start_religious_project_button:0 "Iniciar proyecto"
 ve_cancel_religious_project_button:0 "Cancelar proyecto"
 ve_confirm_cancel_button:0 "#N Sí, cancelar#!"
 ve_keep_project_button:0 "Mantener proyecto"
 ve_targeted_religious_project_state_requirements_tt:0 "El Estado debe ser propiedad nuestra y nuestra propia religión no debe ya ser propiedad nuestra. #Y 90%#! o más de su población. El confesionario, la libertad de conciencia y el ateísmo estatal pueden iniciar uno; La Separación Total no puede. También se debe cubrir el costo de la Reforma de la Piedad del Modelo Religioso activo."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "El modelo religioso permite un proyecto específico (Total Separation no puede iniciar uno)"
 ve_religious_project_req_no_active:0 "No hay ningún proyecto religioso específico en progreso"
 ve_religious_project_req_no_backlash:0 "No está en el tiempo de recuperación de 24 meses después de cancelar un proyecto"
 ve_religious_project_req_reform_point:0 "Suficiente reforma de piedad para el modelo religioso activo (#Y 125#! Confesional / #Y 100#! Libertad de conciencia / #Y 150#! Ateísmo estatal)"
 ve_religious_project_req_target:0 "Nuestra propia religión representa menos del #Y 90%#! de la población de este estado"
 ve_religious_project_cancel_warning:0 "#header ¿Cancelar el proyecto religioso específico?#!\n\nEl progreso logrado hasta ahora se ha perdido. #N -5 Acuerdo religioso#! y un #N 24 meses#! El modificador de tiempo de reutilización se aplica antes de que se pueda iniciar otro proyecto."
 ve_cultural_project_req_no_active:0 "No hay ningún proyecto cultural en curso"
 ve_cultural_project_req_no_backlash:0 "No está en el período de recuperación de 24 meses después de cancelar un proyecto"
 ve_cultural_project_req_reform_point:0 "Suficiente mandato cultural para el modelo de identidad activo (#Y 125#! Étnico/ #Y 100#! Cívico/ #Y 150#! Compuesto, más #Y 40#! Cohesión para Compuesto)"
 ve_cultural_project_req_target:0 "Este estado tiene una cultura no primaria elegible con al menos #Y 5%#! de su población"
 ve_cultural_project_cancel_warning:0 "#header ¿Cancelar el Proyecto Cultural?#!\n\nEl progreso logrado hasta ahora se pierde. #N -5 Cohesión Nacional#! y un #N 24 meses#! El modificador de tiempo de reutilización se aplica antes de que se pueda iniciar otro proyecto."
 alert_can_unlock_ideas_name:0 "Podemos adoptar una idea"
 alert_can_unlock_ideas_hint:0 "Tenemos suficiente conocimiento nacional para al menos la siguiente idea de un grupo adoptado, y ningún ciclo de implementación de doctrina está bloqueando actualmente la compra."
 alert_max_piety_name:0 "Podemos adoptar un programa estatal-religioso"
 alert_max_piety_hint:0 "Nuestra Reforma de Piedad es lo suficientemente alta como para adoptar otro Programa Religioso."
 alert_ve_can_begin_cultural_project_name:0 "El mandato cultural se acumula"
 alert_ve_can_begin_cultural_project_hint:0 "hemos terminado #Y 300#! Mandato Cultural y un Proyecto Cultural que podríamos iniciar. El ingreso obligatorio se reduce a la mitad en 400 y se detiene en 500, por lo que vale la pena gastarlo. Nada es forzado: nuestro Modelo de Identidad ya está activo."
 alert_can_unlock_age_bonus_name:0 "Puede desbloquear una recompensa de Era"
 alert_can_unlock_age_bonus_hint:0 "Tenemos suficiente Era Momentum para elegir otra recompensa."
 ag_ve_missionary_group_name:0 "Acciones religiosas y culturales"
 alert_can_use_missionary_name:0 "Puede enviar misioneros"
 alert_can_use_missionary_hint:0 "Nuestros misioneros están esperando una misión activa. Haga clic en un estado de propiedad y convierta a la población local."
 ag_ve_state_project_group_name:0 "Proyectos Estatales Dirigidos"
 alert_ve_can_begin_targeted_cultural_project_name:0 "Puede comenzar un proyecto cultural específico"
 alert_ve_can_begin_targeted_cultural_project_hint:0 "Tenemos los recursos y un estado elegible para el proyecto cultural específico de nuestro modelo de identidad."
