l_spanish:
 # Evento de bienvenida de Victoria Universalis IV 2.0 - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Esta campaña usa la Victoria Universalis IV reconstruida. En resumen:\n\n#Y Religión#! - Tu ley de Iglesia y Estado ahora fija uno de los cuatro Modelos religiosos. Tienes un medidor de Acuerdo religioso de 0 a 100, gastas Reforma de la piedad en ocho programas permanentes por modelo y puedes llevar un Proyecto Religioso dirigido en el estado que elijas.\n\n#Y Identidad nacional#! - Nación étnica, cívica o compuesta, con Mandato cultural para gastar, un medidor de Cohesión Nacional que conviene mantener alto y cinco Proyectos Culturales.\n\n#Y Grupos de ideas#! - 21 grupos entre Producción, Sociedad y Militar, incluido el nuevo grupo Agrario. Las plazas de grupo ahora se ganan invirtiendo en doctrina y no por calendario, y cada compra cuesta un periodo de implementación de 24 meses.\n\n#Y Ideas nacionales#! - Doce nuevos perfiles de país, y el progreso ahora viene de cada nivel de idea que compras.\n\n#Y Eras#! - Tres eras con objetivos, trece recompensas de era y tres Edades de Oro, además de un viaje estratégico de Cruce de la Era en cada era.\n\n#Y Contenido nuevo#! - Más de cien eventos nuevos: dilemas de doctrina, Viajes de Doctrina de varios años, incidentes y crisis de proyecto, y cadenas temáticas para los otomanos, Japón y Estados Unidos.\n\n#Y Interfaz#! - Una nueva fila en la barra superior, páginas de Religión e Identidad nacional rehechas, un resumen de doctrina en el panel de cada país y un Doctrina Libro mayor mundial."
 ve_welcome.1.f:0 "Toda doctrina deja su huella en la nación que la adopta."
 ve_welcome.1.a:0 "Para los detalles, consulta la descripción del mod. ¡Que lo disfrutes! ^_^"
