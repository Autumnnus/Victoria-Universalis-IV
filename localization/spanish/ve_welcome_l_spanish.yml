l_spanish:
 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Esta campaña se ejecuta con el sistema reconstruido de Victoria Universalis IV. En resumen:\n\n#Y Religión#!: su ley de Iglesia y Estado establece ahora uno de cuatro modelos religiosos. Posee un medidor de 0-100 de Arreglo religioso, gasta Reforma piadosa en ocho programas permanentes por modelo y puede llevar a cabo un Proyecto religioso específico en un Estado de su elección.\n\n#Y Identidad nacional#!: condición de Nación étnica, cívica o mixta, con Mandato cultural para gastar, un medidor de Cohesión nacional que mantener alto y cinco proyectos culturales.\n\n#Y Grupos de doctrinas#!: 21 grupos repartidos entre Producción, Sociedad y Militar, incluido el nuevo grupo Agraria. Las ranuras de los grupos se obtienen mediante la inversión en doctrinas en lugar del calendario, y cada adquisición le cuesta un periodo de implementación de 24 meses.\n\n#Y Doctrinas nacionales#!: doce nuevos perfiles de países, y el progreso proviene ahora de cada nivel de doctrina que adquiera.\n\n#Y Eras#!: tres Eras con objetivos, trece ranuras de Recompensa de era y tres Edades de Oro, además de una Encrucijada de era estratégica por Era.\n\n#Y Nuevo contenido#!: más de cien nuevos eventos: dilemas de doctrinas, Viajes de doctrinas plurianuales, incidentes y crisis de proyectos, y cadenas de ambientación para los otomanos, Japón y los Estados Unidos.\n\n#Y Interfaz#!: una nueva fila en la barra superior, páginas de Religión e Identidad nacional reconstruidas, información sobre doctrinas en el panel de cada país y un Registro de doctrinas mundial."
 ve_welcome.1.f:0 "Cada doctrina deja su impronta en la Nación que la adopta."
 ve_welcome.1.a:0 "Para más detalles, consulte la descripción del mod. Que se divierta ^_^"
