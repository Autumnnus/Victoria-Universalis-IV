l_spanish:
 ve_piety:0 "Piedad"
 ve_piety_reform:0 "Reforma de la piedad"
 ve_piety_reform_tt:0 "#header Reforma de la piedad#!\nActual: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nIngreso mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Desglose mensual#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLegitimidad: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nAdministración: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nApoyo devoto: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nDoctrina de la idea: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Doctrina de la idea — sólo cuenta tu modelo religioso actual#!\n#P Estado confesional / Ateísmo de Estado#!: Nacionalista V #P +1#!\n#P Libertad de conciencia / Separación total#!: Reformista V #P +1#!\nEl total activo anterior tiene un límite de #Y +1#!, por lo que los dos caminos no se pueden acumular.\n\nGastado en Doctrinas y Programas (#Y 25#! cada uno) y en el Proyecto Religioso Dirigido (#Y 100-150#!, según el modelo). Los ingresos se desaceleran #Y 400#! y se detiene en #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doctrinas y Programas"
 ve_piety_tt:0 "#header Asentamiento Religioso#!\nEstado actual: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nEquilibrio social: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMovimiento mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Ruptura del equilibrio#!\nModelo de asentamiento: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nModelo de soporte: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitimidad, administración y Estabilidad: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nEl medidor se mueve #Y 20%#! hacia el equilibrio cada mes, limitado a #Y ±5#!.\nEn #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nEn #N 25#! o menos: #N -5 Legitimidad y -5% de éxito en la promulgación de leyes#!.\n\nEste medidor ya no paga por los programas; consulte Reforma de la piedad. Los programas requieren al menos #Y 25#! reforma de la piedad, costo #Y 25#! e imponer un #Y 24 meses#! tensión de implementación.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Proyecto Religioso"
 ve_religious_project_progress_tt:0 "#header Proyecto Religioso Dirigido#!\nProgreso: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nProgreso mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (mínimo 1, máximo 7)\n\n#Y Desglose mensual#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nAdministración: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLegitimidad: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nSoporte de modelo: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nAsentamiento: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nMovimientos religiosos: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nEstado-objetivo Turbulencia: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nGrupos de ideas: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Grupos de ideas: solo están activas las bonificaciones que coincidan con tu modelo religioso actual#!\n#P Estado confesional#!: Nacionalista VII #P +1#!\n#P Libertad de conciencia#!: Reformista VII #P +1#!\n#P Ateísmo de Estado#!: Nacionalista VII #P +1#! y Académico VII #P +1#!\nEl total del grupo de ideas activo anterior tiene un límite de #Y +2#!.\n\nInicie uno desde el panel de un estado propio. El ateísmo confesional y estatal convierte #Y 5%#! de la población del estado objetivo al finalizar, o  #Y 7%#! con Nacionalista VII, y añadir radicales. En cambio, la Libertad de Conciencia añade leales sin forzar la conversión. Total Separation no puede iniciar un proyecto: es el modelo totalmente neutral.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "En progreso"
 ve_religious_project_none:0 "Ninguno activo"

