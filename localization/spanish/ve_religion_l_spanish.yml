 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Estado Religión"
 ve_settlement_tier_high:0 "RESUELTA - [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "IMPETADA - #N -5 Legitimación y -5% Éxito en la promulgación de leyes#!."
 ve_settlement_hint:0 "Derivaciones hacia el equilibrio que produce tu Modelo Religioso. Con 75+ obtienes una bonificación, con 25 o menos inestabilidad."
 ve_piety_reform_hint:0 "Gastado en programas (25 cada uno) y en proyectos religiosos. Guardarlo es seguro, pero el ingreso se reduce a la mitad en 400 y se detiene en 500."
 ve_religious_project_hint:0 "Opcional. Comenzó desde uno de sus propios estados, si su modelo religioso lo permite."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Modelos religiosos"
 ve_religious_models_help:0 "Su modelo religioso lo decide su #Y Iglesia y Estado#! ley y es #P ya activo#! - Aquí no hay nada que elegir. El modelo sólo decide cómo #Y Asentamiento religioso#! se obtiene, qué ocho programas puede adoptar y qué proyecto religioso puede ejecutar.\n#Y Cambiar la ley es opcional:#! restablece el Acuerdo a #Y 35#!, elimina todos los Programas que haya adoptado, cancela un Proyecto Religioso en ejecución y aplica un #Y 3-5 años#! Crisis de asentamientos.\n#Y Coloca el cursor sobre cualquier carta o medidor para ver todos sus efectos.#!"
 ve_religious_model_active_footer:0 "Modelo actual"
 ve_confessional_state_short:0 "La Iglesia y el Estado gobiernan juntos.\nEl acuerdo proviene de #Y la aprobación y la influencia devotas#!."
 ve_freedom_state_short:0 "Todas las religiones son toleradas bajo un solo Estado.\nEl acuerdo proviene de #Y un país tranquilo y bien administrado#!."
 ve_separation_state_short:0 "El estado no tiene ninguna posición religiosa.\nEl acuerdo comienza con lo más alto y las recompensas #Y baja agitación#!."
 ve_atheism_state_short:0 "Secularización activa liderada por el Estado.\nLa solución proviene de #Y La alfabetización y la intelectualidad.#!."
 ve_confessional_state_unlocks:0 "Ejecuta el #Y Conversión confesional#! proyecto"
 ve_freedom_state_unlocks:0 "Ejecuta el #Y Alcance de la libertad#! proyecto"
 ve_separation_state_unlocks:0 "#N No se puede ejecutar un proyecto religioso#!"
 ve_atheism_state_unlocks:0 "Ejecuta el #Y Campaña de secularización#! proyecto"
 ve_confessional_state_desc:0 "#header Estado confesional#!\nLa Iglesia y el Estado gobiernan juntos.\n\n#Y Mientras están activos#!\n#P +5 % de autoridad, +10 % de conversión, +10 % de fuerza política devota#!\n#N -3% de atracción migratoria, +5% de radicales por prejuicio abierto#!\nMás un pequeño paquete para la familia de fe de la religión de su estado (cristiana, islámica, judía, dhármica, académica o animista).\n\n#Y Asentamiento#!\nEquilibrio de base #Y 55#!. La aprobación y la influencia devotas son los que más lo mueven.\n\n#Y En 75 Asentamiento#!\n#P +5% de autoridad, +5 de legitimidad#!\n\n#Y Proyecto religioso#!\nConversión confesional"
 ve_freedom_state_desc:0 "#header Libertad de conciencia#!\nCada fe es tolerada bajo un solo estado.\n\n#Y Mientras está activo#!\n#P +5% de migración Atracción, -5% Radicales por prejuicio abierto#!\n#N -15% Conversión, -25 Burocracia#!\n\n#Y Asentamiento#!\nEquilibrio de base #Y 55#!. La poca agitación, la legitimidad y una administración sana lo aumentan.\n\n#Y En 75 Settlement#!\n#P +5% Atracción migratoria, +5 Legitimidad#!\n\n#Y Proyecto religioso#!\nAlcance de la libertad"
 ve_separation_state_desc:0 "#header Separación total#!\nEl modelo neutral: el Estado no adopta ninguna posición religiosa.\n\n#Y Mientras está activo#!\n#P +8% Atracción migratoria, -10% Radicales por prejuicio abierto, -5% Radicales por violencia Hostilidad#!\n#N -30% Conversión#!\n\n#Y Asentamiento#!\nEquilibrio base #Y 60#!, el más alto de los cuatro. La baja agitación lo eleva aún más.\n\n#Y A 75 Acuerdo#!\n#P +5% de éxito en la promulgación de la ley, +5 de legitimidad#!\n\n#Y Proyecto religioso#!\n#N Ninguno. Este modelo no tiene deliberadamente ninguna campaña religiosa.#!"
 ve_atheism_state_desc:0 "#header Ateísmo de Estado#!\nUn modelo de secularización agresivo, no tolerante.\n\n#Y Mientras está activo#!\n#P +5% de difusión tecnológica, +2% de acceso a la educación, +20% de conversión#!\n#N -5% de autoridad, -10% de fuerza política devota, +5% de radicales por prejuicio abierto#!\n\n#Y Asentamiento#!\nEquilibrio de base #Y 45#!, el más bajo de los cuatro. La aprobación de la alfabetización y la intelectualidad lo eleva; una fuerte influencia devota lo reduce.\n\n#Y En 75 Asentamiento#!\n#P +5% de difusión tecnológica, +5% de burocracia#!\n\n#Y Proyecto Religioso#!\nCampaña de Secularización\n\n#Y Nota#!\nCambiar a este modelo cuesta  #N 5 años#! crisis en lugar de 3 si la alfabetización es inferior al 50% o la influencia devota es del 20% o más."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Los programas son #Y opcional#! y permanente. Cada uno cuesta  #Y 25 Reforma de la Piedad#! y comienza a #Y 24 meses#! tensión en la implementación durante la cual no se puede adoptar ningún otro programa. Los ocho pertenecen a tu modelo religioso actual y se pierden si ese modelo cambia.\n#Y Pasa el cursor sobre cualquier carta o medidor para ver todos sus efectos.#!"
 ve_religious_program_strain_notice:0 "Todavía se está implementando un programa; no se puede adoptar ningún otro programa hasta que expire esa cepa."
 ve_religious_program_adopted_badge:0 "ADOPTADO"
 ve_adopt_program_button:0 "Adoptar"
 ve_religious_program_cost_label:0 "Costos #Y 25 Reforma de la piedad#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Proyecto religioso dirigido"
 ve_religious_projects_intro:0 "Un proyecto religioso es #Y opcional#! y sólo uno puede ejecutarse a la vez. Su costo de Reforma de la Piedad se paga inmediatamente y #N -50 Burocracia y -25 Autoridad#! se aplican mientras esté en funcionamiento. Completarlo reembolsa parte de la reforma de la piedad y aumenta el asentamiento religioso.\n#Y Pase el cursor sobre cualquier carta o medidor para ver todos sus efectos.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Proyecto en progreso"
 ve_religious_project_backlash_notice:0 "Un proyecto cancelado aún bloquea uno nuevo; la reacción de 24 meses debe expirar primero."
 ve_religious_project_start_instruction:0 "#Y Cómo iniciarlo#!\n1. Abra uno de sus propios estados.\n2. Presione #Y Iniciar proyecto#! en el panel de ese estado.\nTodo lo que aún falta aparece en la información sobre herramientas de ese botón."
 ve_targeted_religious_project_target:0 "Objetivo: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Sin objetivo de proyecto"
 ve_no_active_religious_project:0 "Ningún proyecto religioso activo"
 ve_confessional_conversion_name:0 "Conversión confesional"
 ve_confessional_conversion_cost:0 "Costo: #Y 125 Reforma de la piedad#!"
 ve_confessional_conversion_short:0 "Convertir un estado hacia la religión estatal.\n#P +20 Reforma de la piedad, +5 Acuerdo#! al finalizar, pero crea radicales."
 ve_confessional_conversion_desc:0 "#header Conversión confesional#!\nEjecutar en un solo estado cuya proporción de su propia religión sea inferior al #Y 90%#!.\n\n#Y Costo#!\n#Y 125 Reforma de la piedad#!, se paga inmediatamente\n\n#Y Mientras se ejecuta#!\n#N -50 Burocracia, -25 Autoridad#! para el país\n#N +20% Conversión y +20% canales de radicalismo#! en el Estado objetivo\n\n#Y Al finalizar#!\nConvierte #Y 5%#! de la población del estado a la religión de su estado, o #Y 7%#! con Nacionalista VII\n#P +20 Reforma de piedad, +5 Religioso Asentamiento#!\n\n#Y Advertencia#!\n#N La conversión crea radicales en el Estado objetivo.#!"
 ve_freedom_outreach_name:0 "Alcance de la libertad"
 ve_freedom_outreach_cost:0 "Costo: #Y 100 Reforma de la piedad#!"
 ve_freedom_outreach_short:0 "Gana un Estado sin forzar la conversión.\n#P +20 Reforma de piedad, +7 Acuerdo#! al finalizar, más leales."
 ve_freedom_outreach_desc:0 "#header Freedom Outreach#!\nSe ejecuta en un solo estado cuya proporción de su propia religión es inferior al #Y 90%#!.\n\n#Y Costo#!\n#Y 100 Piety Reform#!, pagado inmediatamente\n\n#Y Mientras esté en funcionamiento#!\n#N -50 Burocracia, -25 Autoridad#! para el país\n\n#Y Al finalizar#!\n#P Sin conversión forzada#! ; en su lugar, leales en el Estado objetivo\n#P +20 Reforma de piedad, +7 Asentamiento religioso#!"
 ve_secularization_campaign_name:0 "Campaña de secularización"
 ve_secularization_campaign_cost:0 "Costo: #Y 150 Reforma de piedad#!"
 ve_secularization_campaign_short:0 "Convierte un estado al ateísmo.\n#P +25 Reforma de piedad, +8 Acuerdo#! al finalizar, pero crea radicales."
 ve_secularization_campaign_desc:0 "#header Campaña de secularización#!\nEjecutar en un solo estado cuya proporción de su propia religión sea inferior al #Y 90%#!.\n\n#Y Costo#!\n#Y 150 Reforma de piedad#!, pagado inmediatamente\n\n#Y Mientras ejecuta#!\n#N -50 Burocracia, -25 Autoridad#! para el país\n#N +20% Conversión y +20% canales de radicalismo#!  en el Estado objetivo\n\n#Y Al finalizar#!\nConvierte #Y 5%#! de la población del Estado al ateísmo, o #Y 7%#! con Nacionalista VII\n#P +25 Reforma de la Piedad, +8 Asentamiento Religioso#!\n\n#Y Advertencia#!\n#N La conversión crea radicales en el Estado objetivo.#!"
 ve_religious_project_unavailable_name:0 "No hay ningún proyecto disponible"
 ve_religious_project_unavailable_cost:0 "#N La Separación Total no puede ejecutar un Proyecto Religioso#!"
