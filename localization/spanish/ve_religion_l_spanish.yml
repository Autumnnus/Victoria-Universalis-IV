 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Religión del Estado"
 ve_settlement_tier_high:0 "ESTABLECIDO - [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "DISPUTADO - #N -5 Legitimidad y -5% Éxito de promulgación#!."
 ve_settlement_hint:0 "Deriva hacia el equilibrio que produce su Modelo religioso. A 75 o más obtiene una bonificación, a 25 o menos inestabilidad."
 ve_piety_reform_hint:0 "Gastado en Programas (25 cada uno) y en Proyectos religiosos. Ahorrarlo es seguro, pero los ingresos se reducen a la mitad a 400 y se detienen a 500."
 ve_religious_project_hint:0 "Opcional. Iniciado desde uno de sus propios Estados, si su Modelo religioso lo permite."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Modelos religiosos"
 ve_religious_models_help:0 "Su Modelo religioso está decidido por su ley de #Y Iglesia y Estado#! y #P ya está activo#!; no hay nada que elegir aquí. El modelo solo decide cómo se gana el #Y Arreglo religioso#!, qué ocho Programas puede adoptar y qué Proyecto religioso puede ejecutar.\n#Y Cambiar la ley es opcional:#! reinicia el Arreglo a #Y 35#!, elimina cada Programa que haya adoptado, cancela un Proyecto religioso en curso y aplica una Crisis de Arreglo de #Y 3-5 años#!.\n#Y Pase el cursor sobre cualquier tarjeta o medidor para ver todos sus efectos.#!"
 ve_religious_model_active_footer:0 "Modelo actual"
 ve_confessional_state_short:0 "La iglesia y el Estado gobiernan juntos.\nEl Arreglo proviene de la #Y Aprobación de los Devotos y Peso#!."
 ve_freedom_state_short:0 "Cada fe es tolerada bajo un solo Estado.\nEl Arreglo proviene de #Y un país tranquilo y bien administrado#!."
 ve_separation_state_short:0 "El Estado no mantiene ninguna posición religiosa.\nEl arreglo religioso comienza en su valor más alto y premia con #Y baja agitación#!."
 ve_atheism_state_short:0 "Secularización activa dirigida por el Estado.\nEl arreglo religioso proviene de #Y la alfabetización y la Élite intelectual#!."
 ve_confessional_state_unlocks:0 "Ejecuta el proyecto de #Y Conversión confesional#!"
 ve_freedom_state_unlocks:0 "Ejecuta el proyecto de #Y Labor de acercamiento#!"
 ve_separation_state_unlocks:0 "#N No se puede ejecutar ningún Proyecto religioso#!"
 ve_atheism_state_unlocks:0 "Ejecuta el proyecto de #Y Campaña de secularización#!"
 ve_confessional_state_desc:0 "#header Estado confesional#!\nLa Iglesia y el Estado gobiernan conjuntamente.\n\n#Y Mientras esté activo#!\n#P +5% Autoridad, +10% Conversión, +10% Fuerza política de los Devotos#!\n#N -3% Atracción migratoria, +5% Radicales por prejuicio abierto#!\nAdemás de un pequeño paquete para la familia de fe de tu Religión del Estado (cristiana, islámica, judía, dhármica, erudita o animista).\n\n#Y Arreglo religioso#!\nEquilibrio base #Y 55#!. La aprobación y el peso de los Devotos son los que más lo desplazan.\n\n#Y A 75 de Arreglo religioso#!\n#P +5% Autoridad, +5 Legitimidad#!\n\n#Y Proyecto religioso#!\nConversión confesional"
 ve_freedom_state_desc:0 "#header Libertad de conciencia#!\nCada fe es tolerada bajo un mismo Estado.\n\n#Y Mientras esté activo#!\n#P +5% Atracción migratoria, -5% Radicales por prejuicio abierto#!\n#N -15% Conversión, -25 Burocracia#!\n\n#Y Arreglo religioso#!\nEquilibrio base #Y 55#!. La baja agitación, la legitimidad y una administración saneada lo elevan.\n\n#Y A 75 de Arreglo religioso#!\n#P +5% Atracción migratoria, +5 Legitimidad#!\n\n#Y Proyecto religioso#!\nLabor de acercamiento"
 ve_separation_state_desc:0 "#header Separación total#!\nEl modelo neutral: el Estado no adopta ninguna postura religiosa.\n\n#Y Mientras esté activo#!\n#P +8% Atracción migratoria, -10% Radicales por prejuicio abierto, -5% Radicales por hostilidad violenta#!\n#N -30% Conversión#!\n\n#Y Arreglo religioso#!\nEquilibrio base #Y 60#!, el más alto de los cuatro. Una baja agitación lo eleva aún más.\n\n#Y A 75 de Arreglo religioso#!\n#P +5% Éxito de promulgación de leyes, +5 Legitimidad#!\n\n#Y Proyecto religioso#!\n#N Ninguno. Este modelo carece deliberadamente de campaña religiosa.#!"
 ve_atheism_state_desc:0 "#header Ateísmo de Estado#!\nUn modelo de secularización agresivo, no tolerante.\n\n#Y Mientras esté activo#!\n#P +5% Difusión tecnológica, +2% Acceso a la educación, +20% Conversión#!\n#N -5% Autoridad, -10% Fuerza política de los Devotos, +5% Radicales por prejuicio abierto#!\n\n#Y Arreglo religioso#!\nEquilibrio base #Y 45#!, el más bajo de los cuatro. La alfabetización y la aprobación de la Élite intelectual lo elevan; un fuerte peso de los Devotos lo reduce.\n\n#Y A 75 de Arreglo religioso#!\n#P +5% Difusión tecnológica, +5% Burocracia#!\n\n#Y Proyecto religioso#!\nCampaña de secularización\n\n#Y Nota#!\nCambiar a este modelo provoca una crisis de #N 5 años#! en lugar de 3 si la alfabetización es inferior al 50% o el peso de los Devotos es del 20% o más."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Los programas son #Y opcionales#! y permanentes. Cada uno cuesta #Y 25 de Reforma piadosa#! e inicia una tensión de implementación de #Y 24 meses#! durante la cual no se puede adoptar ningún otro programa. Los ocho pertenecen a tu Modelo religioso actual y se pierden si dicho modelo cambia.\n#Y Pasa el cursor sobre cualquier tarjeta o medidor para ver todos sus efectos.#!"
 ve_religious_program_strain_notice:0 "Aún se está implementando un programa; no se puede adoptar ningún otro programa hasta que expire dicha tensión."
 ve_religious_program_adopted_badge:0 "ADOPTADO"
 ve_adopt_program_button:0 "Adoptar"
 ve_religious_program_cost_label:0 "Cuesta #Y 25 de Reforma piadosa#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Proyecto religioso dirigido"
 ve_religious_projects_intro:0 "Un Proyecto religioso es #Y opcional#! y solo uno puede estar activo a la vez. Su coste en Reforma piadosa se paga de inmediato y se aplican #N -50 de Burocracia y -25 de Autoridad#! mientras esté en curso. Completarlo reembolsa parte de la Reforma piadosa y eleva el Arreglo religioso.\n#Y Pasa el cursor sobre cualquier tarjeta o medidor para ver todos sus efectos.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Proyecto en curso"
 ve_religious_project_backlash_notice:0 "Un proyecto cancelado sigue bloqueando uno nuevo: la reacción de 24 meses debe expirar primero."
 ve_religious_project_start_instruction:0 "#Y Cómo iniciarlo#!\n1. Abre uno de tus propios Estados.\n2. Pulsa #Y Iniciar proyecto#! en el panel de ese Estado.\nCualquier requisito faltante se detalla en la información sobre herramientas de ese botón."
 ve_targeted_religious_project_target:0 "Objetivo: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Sin objetivo de proyecto"
 ve_no_active_religious_project:0 "Ningún Proyecto religioso activo"
 ve_confessional_conversion_name:0 "Conversión confesional"
 ve_confessional_conversion_cost:0 "Coste: #Y 125 de Reforma piadosa#!"
 ve_confessional_conversion_short:0 "Convierte un Estado hacia la religión del Estado.\n#P +20 de Reforma piadosa, +5 de Arreglo#! al completarlo, pero genera radicales."
 ve_confessional_conversion_desc:0 "#header Conversión confesional#!\nSe ejecuta en un solo Estado cuya proporción de tu propia religión sea inferior al #Y 90%#!.\n\n#Y Coste#!\n#Y 125 de Reforma piadosa#!, pagados de inmediato\n\n#Y Mientras esté en curso#!\n#N -50 de Burocracia, -25 de Autoridad#! para el país\n#N +20% de conversión y +20% de canalización de radicalismo#! en el Estado objetivo\n\n#Y Al completarlo#!\nConvierte al #Y 5%#! de la población del Estado a tu Religión del Estado, o al #Y 7%#! con Nacionalista VII\n#P +20 de Reforma piadosa, +5 de Arreglo religioso#!\n\n#Y Advertencia#!\n#N La conversión genera radicales en el Estado objetivo.#!"
 ve_freedom_outreach_name:0 "Labor de acercamiento"
 ve_freedom_outreach_cost:0 "Coste: #Y 100 de Reforma piadosa#!"
 ve_freedom_outreach_short:0 "Gánate el favor de un Estado sin forzar la conversión.\n#P +20 de Reforma piadosa, +7 de Arreglo#! al completarlo, además de lealistas."
 ve_freedom_outreach_desc:0 "#header Labor de acercamiento#!\nLlévese a cabo en un solo Estado cuya proporción de su propia religión sea inferior al #Y 90%#!.\n\n#Y Coste#!\n#Y 100 de Reforma piadosa#!, pagados de inmediato\n\n#Y Mientras esté activo#!\n#N -50 Burocracia, -25 Autoridad#! para el país\n\n#Y Al completarse#!\n#P Sin conversión forzosa#!: en su lugar, los lealistas en el Estado objetivo\n#P +20 de Reforma piadosa, +7 de Arreglo religioso#!"
 ve_secularization_campaign_name:0 "Campaña de secularización"
 ve_secularization_campaign_cost:0 "Coste: #Y 150 de Reforma piadosa#!"
 ve_secularization_campaign_short:0 "Convertir un Estado al ateísmo.\n#P +25 de Reforma piadosa, +8 de Arreglo#! al completarse, pero genera radicales."
 ve_secularization_campaign_desc:0 "#header Campaña de secularización#!\nLlévese a cabo en un único Estado cuya proporción de su propia religión esté por debajo de #Y 90%#!.\n\n#Y Coste#!\n#Y 150 Reforma piadosa#!, pagados inmediatamente\n\n#Y Mientras esté en curso#!\n#N -50 Burocracia, -25 Autoridad#! para el país\n#N +20% Conversión y +20% canales de radicalismo#! en el Estado objetivo\n\n#Y Al completarse#!\nConvierte al #Y 5%#! de la Población del Estado al ateísmo, o al #Y 7%#! con Nacionalista VII\n#P +25 Reforma piadosa, +8 Arreglo religioso#!\n\n#Y Advertencia#!\n#N La conversión genera radicales en el Estado objetivo.#!"
 ve_religious_project_unavailable_name:0 "Ningún proyecto disponible"
 ve_religious_project_unavailable_cost:0 "#N Separación total no puede llevar a cabo un Proyecto religioso#!"
 ve_religious_project_unavailable_short:0 "El modelo neutral carece deliberadamente de campaña religiosa. Promulgue una Ley de Iglesia y Estado diferente si desea una."
 ve_religious_project_unavailable_desc:0 "#header Ningún proyecto disponible#!\nSeparación total es el modelo plenamente neutral y no puede iniciar un Proyecto religioso objetivo.\n\nEstado confesional, Libertad de conciencia y Ateísmo de Estado ejecutan su propio proyecto. Promulgue la Ley de Iglesia y Estado correspondiente para obtener uno."

