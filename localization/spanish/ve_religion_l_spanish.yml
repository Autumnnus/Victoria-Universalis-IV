l_spanish:
 ve_piety:0 "Piedad"
 ve_piety_reform:0 "Reforma piadosa"
 ve_piety_reform_tt:0 "#header Reforma piadosa#!\nActual: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nIngreso mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Desglose mensual#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLegitimidad: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nAdministración: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nApoyo devoto: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nDoctrina de doctrina: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Doctrina de doctrina: solo cuenta su Modelo religioso actual#!\n#P Estado confesional / Ateísmo de Estado#!: Nacionalista V #P +1#!\n#P Libertad de conciencia / Separación total#!: Reformista V #P +1#!\nEl total activo anterior tiene un límite de #Y +1#!, por lo que ambas rutas no pueden acumularse.\n\nSe gasta en Doctrinas y Programas (#Y 25#! cada uno) y en el Proyecto religioso objetivo (#Y 100-150#!, según el modelo). El ingreso se ralentiza pasado #Y 400#! y se detiene en #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doctrinas y Programas"
 ve_piety_tt:0 "#header Arreglo religioso#!\nEstado actual: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nEquilibrio social: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMovimiento mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Desglose de equilibrio#!\nModelo de arreglo: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nApoyo al modelo: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitimidad, administración y estabilidad: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nEl indicador se desplaza un #Y 20%#! hacia el equilibrio cada mes, con un límite de #Y ±5#!.\nA #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nA #N 25#! o menos: #N -5 de Legitimidad y -5% de Éxito de promulgación#!.\n\nEste indicador ya no financia programas; consulte Reforma piadosa. Los programas requieren al menos #Y 25#! de Reforma piadosa, cuestan #Y 25#! e imponen una tensión de implementación de #Y 24 meses#!.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Proyecto religioso"
 ve_religious_project_progress_tt:0 "#header Proyecto religioso objetivo#!\nProgreso: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nProgreso mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (mínimo 1, máximo 7)\n\n#Y Desglose mensual#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nAdministración: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLegitimidad: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nApoyo al modelo: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nArreglo: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nMovimientos religiosos: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nAgitación en el Estado objetivo: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nGrupos de doctrinas: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Grupos de doctrinas: solo están activos los bonos que coinciden con su Modelo religioso actual#!\n#P Estado confesional#!: Nacionalista VII #P +1#!\n#P Libertad de conciencia#!: Reformista VII #P +1#!\n#P Ateísmo de Estado#!: Nacionalista VII #P +1#! y Académica VII #P +1#!\nEl total activo de Grupos de doctrinas anterior tiene un límite de #Y +2#!.\n\nInicie uno desde el panel de un Estado propio. Estado confesional y Ateísmo de Estado convierten al finalizar un #Y 5%#! de la Población del Estado objetivo, o un #Y 7%#! con Nacionalista VII, y añaden Radicales. En su lugar, Libertad de conciencia añade Lealistas sin forzar la Conversión. Separación total no puede iniciar un proyecto; es el modelo totalmente neutral.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "En curso"
 ve_religious_project_none:0 "Ninguno activo"

