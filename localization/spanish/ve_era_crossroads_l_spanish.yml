 ve_era_crossroads.1.t:0 "Vapor y Estado"
 ve_era_crossroads.1.d:0 "Ferrocarriles, escuelas, reformistas y administradores ofrecen versiones contrapuestas de la nación moderna. El Gobierno debe decidir qué relación entre la sociedad y el Estado organizará la primera era."
 ve_era_crossroads.1.a:0 "Vincular el país a través de una red de vapor."
 ve_era_crossroads.1.b:0 "Construir una ciudadanía educada."
 ve_era_crossroads.1.c:0 "Consolidar un Estado administrativo."
 ve_era_crossroads.1.d.option:0 "Esta era no necesita encrucijadas nacionales."
 ve_era_crossroads.1.a.tt:0 "Inicia la vía de la #Y red de vapor#! (Enfoque: industrialización, migración de campesinos y Ferrocarril).\n• Objetivo: alcanzar 60 de Progreso para obtener #P +50 de Ímpetu de era#!.\n• Velocidad de progreso: otorga +1 de progreso mensual base, más +1 adicional por cada anclaje de la Era 1 completado (metas de proporción de campesinos y Ferrocarril).\n• Sinergia de doctrina: tener #Y Industrial IV#! o #Y Infraestructura IV#! desbloquea decisiones de hito más baratas (5 de Perspicacia en lugar de 10)."
 ve_era_crossroads.1.b.tt:0 "Inicia la vía de la #Y ciudadanía educada#! (Enfoque: Educación, Alfabetización y Laborista libre).\n• Objetivo: alcanzar 60 de Progreso para obtener #P +50 de Ímpetu de era#!.\n• Velocidad de progreso: otorga +1 de progreso mensual base, más +1 adicional por cada anclaje de la Era 1 completado (metas de Laborista libre y Alfabetización/Educación).\n• Sinergia de doctrina: tener #Y Académica IV#! o #Y Reformista IV#! desbloquea decisiones de hito más baratas (5 de Perspicacia en lugar de 10)."
 ve_era_crossroads.1.c.tt:0 "Inicia la vía del #Y Estado administrativo#! (Enfoque: Legitimidad del Gobierno, Burocracia y estabilidad).\n• Objetivo: alcanzar 60 de Progreso para obtener #P +50 de Ímpetu de era#!.\n• Velocidad de progreso: otorga +1 de progreso mensual base, más +1 adicional por cada anclaje de la Era 1 completado (metas de Legitimidad/Burocracia y estabilidad independiente).\n• Sinergia de doctrina: tener #Y Burocrática IV#! o #Y Parlamentaria IV#! desbloquea decisiones de hito más baratas (5 de Perspicacia en lugar de 10)."
 ve_era_crossroads.2.t:0 "¿Imperio o sociedad de masas?"
 ve_era_crossroads.2.d:0 "El Estado ya no puede tratar el alcance ultramarino, el bienestar Popular y la Integración nacional como cuestiones separadas. Una de ellas definirá cómo se persiguen las demás."
 ve_era_crossroads.2.a:0 "Mirar hacia el horizonte imperial."
 ve_era_crossroads.2.b:0 "Construir un sistema de bienestar de masas."
 ve_era_crossroads.2.c:0 "Forjar una Nación integrada."
 ve_era_crossroads.2.d.option:0 "Dejar que la era encuentre su propia dirección."
 ve_era_crossroads.2.a.tt:0 "Inicia la vía del #Y horizonte imperial#! (Enfoque: poder Diplomática y alcance ultramarino).\n• Objetivo: alcanzar 60 de Progreso para obtener #P +50 de Ímpetu de era#!.\n• Velocidad de progreso: otorga +1 de progreso mensual base, más +1 adicional por cada anclaje de la Era 2 completado (metas de Capacidad de Estado reconocido y Puertos/Intereses).\n• Sinergia de doctrina: tener #Y Diplomática IV#! o #Y Colonial IV#! desbloquea decisiones de hito más baratas (5 de Perspicacia en lugar de 10)."
 ve_era_crossroads.2.b.tt:0 "Inicia la vía del #Y bienestar de masas#! (Enfoque: Instituciones sociales, sanidad y Educación).\n• Objetivo: alcanzar 60 de Progreso para obtener #P +50 de Ímpetu de era#!.\n• Velocidad de progreso: otorga +1 de progreso mensual base, más +1 adicional por cada anclaje de la Era 2 completado (metas de Alfabetización/Educación e Instituciones sociales).\n• Sinergia de doctrina: tener #Y Asistencial IV#! o #Y Reformista IV#! desbloquea decisiones de hito más baratas (5 de Perspicacia en lugar de 10)."
 ve_era_crossroads.2.c.tt:0 "Inicia la vía de la #Y Nación integrada#! (Enfoque: transformación económica y estabilidad interna).\n• Objetivo: alcanzar 60 de Progreso para obtener #P +50 de Ímpetu de era#!.\n• Velocidad de progreso: otorga +1 de progreso mensual base, más +1 adicional por cada anclaje de la Era 2 completado (metas de transformación económica y Legitimidad con baja Agitación).\n• Sinergia de doctrina: tener #Y Nacionalista IV#! o #Y Laborista IV#! desbloquea decisiones de hito más baratas (5 de Perspicacia en lugar de 10)."
 ve_era_crossroads.3.t:0 "La sociedad movilizada"
 ve_era_crossroads.3.d:0 "La política de masas, el mando estratégico y la movilización industrial alcanzan ya a todas las instituciones. La última era exige una decisión sobre qué forma de movilización definirá a la nación."
 ve_era_crossroads.3.a:0 "Comprometerse con una república social."
 ve_era_crossroads.3.b:0 "Poner a la nación bajo un mando estratégico."
 ve_era_crossroads.3.c:0 "Construir una sociedad de arsenales."
 ve_era_crossroads.3.d.option:0 "Rechazar un proyecto de movilización permanente."
 ve_era_crossroads.3.a.tt:0 "Inicia la vía de #Y República Social#! (Enfoque: Política de masas e instituciones sociales).\n• Meta: Alcanzar 60 de Progreso para obtener #P +50 de Ímpetu de era#!.\n• Velocidad de progreso: Otorga +1 de progreso mensual base, más +1 adicional por cada ancla de la Era 3 completada (metas de Política de masas e Instituciones sociales maduras).\n• Sinergia de doctrinas: Tener #Y Parlamentaria IV#! o #Y Asistencial IV#! desbloquea decisiones de hito más baratas (5 de Perspicacia nacional en lugar de 10)."
 ve_era_crossroads.3.b.tt:0 "Inicia la vía de #Y Mando Estratégico#! (Enfoque: Modernización militar y alcance de Gran potencia).\n• Meta: Alcanzar 60 de Progreso para obtener #P +50 de Ímpetu de era#!.\n• Velocidad de progreso: Otorga +1 de progreso mensual base, más +1 adicional por cada ancla de la Era 3 completada (metas de Composición de fuerza moderna y Alcance de Gran potencia).\n• Sinergia de doctrinas: Tener #Y Ejército profesional IV#! o #Y Defensiva IV#! desbloquea decisiones de hito más baratas (5 de Perspicacia nacional en lugar de 10)."
 ve_era_crossroads.3.c.tt:0 "Inicia la vía de #Y Sociedad de Arsenales#! (Enfoque: Economía de guerra industrial y armamento masivo).\n• Meta: Alcanzar 60 de Progreso para obtener #P +50 de Ímpetu de era#!.\n• Velocidad de progreso: Otorga +1 de progreso mensual base, más +1 adicional por cada ancla de la Era 3 completada (metas de Industria eléctrica y Armamento masivo).\n• Sinergia de doctrinas: Tener #Y Economía de guerra IV#! o #Y Reclutamiento en masa IV#! desbloquea decisiones de hito más baratas (5 de Perspicacia nacional en lugar de 10)."

 ve_era_crossroads_decline_tt:0 "Rechaza permanentemente la Encrucijada de era de la era actual. Las eras posteriores siguen siendo elegibles."

 ve_era_crossroads.10.t:0 "Un calendario nacional"
 ve_era_crossroads.10.d:0 "Las oficinas provinciales, las asociaciones privadas y los ministerios persiguen la transformación elegida a distintos ritmos. Un calendario común podría convertir los logros dispersos en un programa nacional, pero la coordinación en sí misma exige una escasa atención administrativa."
 ve_era_crossroads.10.a:0 "Financiar una comisión de coordinación central."
 ve_era_crossroads.10.b:0 "Permitir que las instituciones negocien su propio calendario."
 ve_era_crossroads.10.c:0 "Utilizar las redes construidas por nuestras doctrinas establecidas."
 ve_era_crossroads.10.a.tt:0 "Gasta #N 10 de Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada#!."
 ve_era_crossroads.10.b.tt:0 "No gasta ningún recurso ni realiza ningún cambio inmediato en el progreso de la Encrucijada."
 ve_era_crossroads.10.c.tt:0 "Requiere un Grupo de doctrinas de nivel IV adecuado para la vía. Gasta #N 5 de Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada#!."

 ve_era_crossroads.11.t:0 "¿Quién dirigirá el Progreso?"
 ve_era_crossroads.11.d:0 "El programa ha adquirido demasiada importancia como para seguir siendo un acuerdo laxo. Los ministros reclaman la autoridad de la nación, los expertos exigen aislamiento frente a la política y los actores locales advierten que un mando rígido quebrará las instituciones que hicieron posible el progreso."
 ve_era_crossroads.11.a:0 "Otorgar al centro un mandato de coordinación claro."
 ve_era_crossroads.11.b:0 "Preservar el balance de autoridad negociado."
 ve_era_crossroads.11.c:0 "Confiar la coordinación a nuestras instituciones doctrinales."
 ve_era_crossroads.11.a.tt:0 "Gasta #N 10 de Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada#!."
 ve_era_crossroads.11.b.tt:0 "No gasta ningún recurso ni realiza ningún cambio inmediato en el progreso de la Encrucijada."
 ve_era_crossroads.11.c.tt:0 "Requiere un Grupo de doctrinas de nivel IV adecuado para la vía. Gasta #N 5 de Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada#!."

 ve_era_crossroads.40.t:0 "Vapor y Estado"
 ve_era_crossroads.40.d:0 "El rumbo elegido ya no es una serie de logros aislados. Las infraestructuras, la ciudadanía o la administración forman ahora un programa nacional duradero a través del cual el estado puede comprender y dirigir las transformaciones de la era."
 ve_era_crossroads.40.a:0 "La primera era ha encontrado su forma institucional."
 ve_era_crossroads.40.a.tt:0 "La Encrucijada de era completada ha otorgado #P +50 de Ímpetu de era#!. No ha completado una meta ni ha alterado la elegibilidad para la Edad de oro."

 ve_era_crossroads.20.t:0 "El alcance del Estado"
 ve_era_crossroads.20.d:0 "El programa elegido se extiende ahora más allá de las instituciones que lo patrocinaron inicialmente. Puertos, escuelas, oficinas y autoridades locales discrepan sobre dónde debe terminar la coordinación de la nación y dónde debe empezar la discreción local."
 ve_era_crossroads.20.a:0 "Mapear las obligaciones del estado mediante una comisión central."
 ve_era_crossroads.20.b:0 "Permitir que los límites institucionales surjan por negociación."
 ve_era_crossroads.20.c:0 "Coordinar a través de nuestras redes doctrinales establecidas."
 ve_era_crossroads.20.a.tt:0 "Gasta #N 10 de Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada#!."
 ve_era_crossroads.20.b.tt:0 "No gasta ningún recurso ni realiza ningún cambio inmediato en el progreso de la Encrucijada."
 ve_era_crossroads.20.c.tt:0 "Requiere un Grupo de doctrinas de nivel IV adecuado para la vía. Gasta #N 5 de Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada#!."

 ve_era_crossroads.21.t:0 "El precio de la Integración"
 ve_era_crossroads.21.d:0 "El alcance exterior, la provisión social y la disciplina nacional generan ganadores, costes y nuevas expectativas. El programa solo puede perdurar si el Estado decide cómo se distribuirán dichas cargas."
 ve_era_crossroads.21.a:0 "Crear una junta nacional para gestionar el ajuste."
 ve_era_crossroads.21.b:0 "Distribuir la carga mediante compromisos negociados."
 ve_era_crossroads.21.c:0 "Permitir que nuestras Instituciones doctrinales absorban la tensión."
 ve_era_crossroads.21.a.tt:0 "Gastas #N 10 Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada de era#!."
 ve_era_crossroads.21.b.tt:0 "No gastas ningún recurso ni alteras de inmediato el progreso de la Encrucijada de era."
 ve_era_crossroads.21.c.tt:0 "Requiere un Grupo de doctrinas de nivel IV afín a la vía. Gastas #N 5 Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada de era#!."

 ve_era_crossroads.41.t:0 "Imperio y sociedad de masas"
 ve_era_crossroads.41.d:0 "El acuerdo elegido vincula ahora el alcance exterior, las Obligaciones sociales y las Instituciones nacionales del Estado. Lo que comenzó como una dirección estratégica se ha convertido en un marco duradero para gobernar la sociedad de masas."
 ve_era_crossroads.41.a:0 "La segunda era ha hallado su acuerdo."
 ve_era_crossroads.41.a.tt:0 "La Encrucijada de era completada ha otorgado #P +50 de Ímpetu de era#!. No ha completado una meta ni ha alterado los requisitos para la Edad de oro."

 ve_era_crossroads.30.t:0 "La Nación es llamada al servicio"
 ve_era_crossroads.30.d:0 "Ciudadanos, Comandantes, trabajadores y administradores reciben nuevas Obligaciones por parte del programa elegido. A menos que dichos deberes sean inteligibles entre sí, la Movilización seguirá siendo un conjunto de demandas en competencia."
 ve_era_crossroads.30.a:0 "Codificar los deberes nacionales mediante una comisión central."
 ve_era_crossroads.30.b:0 "Permitir que las Instituciones negocien sus responsabilidades."
 ve_era_crossroads.30.c:0 "Emplear nuestras organizaciones doctrinales para coordinar el deber."
 ve_era_crossroads.30.a.tt:0 "Gastas #N 10 Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada de era#!."
 ve_era_crossroads.30.b.tt:0 "No gastas ningún recurso ni alteras de inmediato el progreso de la Encrucijada de era."
 ve_era_crossroads.30.c.tt:0 "Requiere un Grupo de doctrinas de nivel IV afín a la vía. Gastas #N 5 Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada de era#!."

 ve_era_crossroads.31.t:0 "Una emergencia permanente"
 ve_era_crossroads.31.d:0 "La maquinaria construida para la participación masiva, la Preparación estratégica o la Movilización industrial se está volviendo permanente. El Estado debe decidir cómo preservar la Capacidad sin permitir que la disciplina de emergencia consuma la vida nacional ordinaria."
 ve_era_crossroads.31.a:0 "Definir límites permanentes mediante una revisión nacional."
 ve_era_crossroads.31.b:0 "Mantener el acuerdo deliberadamente flexible."
 ve_era_crossroads.31.c:0 "Confiar en las Instituciones doctrinales para contener la maquinaria."
 ve_era_crossroads.31.a.tt:0 "Gastas #N 10 Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada de era#!."
 ve_era_crossroads.31.b.tt:0 "No gastas ningún recurso ni alteras de inmediato el progreso de la Encrucijada de era."
 ve_era_crossroads.31.c.tt:0 "Requiere un Grupo de doctrinas de nivel IV afín a la vía. Gastas #N 5 Perspicacia nacional#! para obtener #P +3 de progreso de la Encrucijada de era#!."

 ve_era_crossroads.42.t:0 "La sociedad movilizada"
 ve_era_crossroads.42.d:0 "La ciudadanía, el mando y la Capacidad industrial Forman ahora un acuerdo nacional duradero. Las Instituciones de la Movilización han pasado a formar parte del Gobierno ordinario en lugar de quedar como respuestas improvisadas ante cada nueva crisis."
 ve_era_crossroads.42.a:0 "La era final ha hallado su forma nacional."
 ve_era_crossroads.42.a.tt:0 "La Encrucijada de era completada ha otorgado #P +50 de Ímpetu de era#!. No ha completado una meta ni ha alterado los requisitos para la Edad de oro."
