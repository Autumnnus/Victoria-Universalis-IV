 ve_era_crossroads.1.t:0 "El vapor y el Estado"
 ve_era_crossroads.1.d:0 "Los ferrocarriles, las escuelas, los reformadores y los administradores ofrecen versiones rivales de la nación moderna. El gobierno debe decidir qué relación entre sociedad y Estado organizará la primera era."
 ve_era_crossroads.1.a:0 "Unir al país a través de Steam Network."
 ve_era_crossroads.1.b:0 "Construir una ciudadanía educada."
 ve_era_crossroads.1.c:0 "Consolidar un Estado Administrativo."
 ve_era_crossroads.1.d.option:0 "Esta era no necesita encrucijadas nacionales."
 ve_era_crossroads.1.a.tt:0 "Inicia la #Y Steam Network#! ruta (Enfoque: Industrialización, Migración Campesina y Ferrocarriles).\n• Meta: Alcanzar 60 de Progreso para ganar #P +50 Era Momentum#!.\n• Velocidad de Progreso: Obtiene +1 de progreso base mensual, más +1 extra por cada ancla de Edad 1 completada (objetivos de Participación Campesina y Ferrocarril).\n• Sinergia de Doctrina: Tener #Y Industrialista IV#! or #Y Infraestructura IV#! desbloquea decisiones de hitos más económicas (5 Insight en lugar de 10)."
 ve_era_crossroads.1.b.tt:0 "Comienza el #Y Ciudadanía educada#! ruta (Enfoque: Educación, Alfabetización y Trabajo Gratuito).\n• Meta: Alcanzar 60 de Progreso para ganar #P +50 Era Momentum#!.\n• Velocidad de Progreso: Obtiene +1 de progreso mensual base, más +1 adicional por cada ancla de Edad 1 completada (objetivos de Trabajo Libre y Alfabetización/Escuelas).\n• Sinergia de Doctrina: Tener #Y Académico IV#! or #Y Reformista IV#! desbloquea decisiones de hitos más baratas (5 Insight en lugar de 10)."
 ve_era_crossroads.1.c.tt:0 "Inicia la #Y ruta#! del Estado Administrativo (Enfoque: Legitimidad, Burocracia y Estabilidad del Gobierno).\n• Meta: Alcanzar 60 de Progreso para ganar #P +50 Era Momentum#!.\n• Velocidad de Progreso: Obtiene +1 de progreso base mensual, más +1 adicional por cada ancla de Edad 1 completada. (Objetivos de legitimidad/burocracia y estabilidad independiente).\n• Sinergia doctrinal: Tener #Y IV#! burocráticas para #Y Parlamentario IV#! desbloquea decisiones de hitos más económicas (5 Insight en lugar de 10)."
 ve_era_crossroads.2.t:0 "¿Imperio o sociedad de masas?"
 ve_era_crossroads.2.d:0 "El Estado ya no puede tratar el alcance en el exterior, el bienestar popular y la integración nacional como cuestiones separadas. Uno de ellos definirá cómo se persiguen los demás."
 ve_era_crossroads.2.a:0 "Mira hacia el Horizonte Imperial."
 ve_era_crossroads.2.b:0 "Construir un sistema de bienestar masivo."
 ve_era_crossroads.2.c:0 "Forjar una nación integrada."
 ve_era_crossroads.2.d.option:0 "Dejemos que la época encuentre su propia dirección."
 ve_era_crossroads.2.a.tt:0 "Comienza la #Y Horizonte imperial#! ruta (Enfoque: poder diplomático y alcance en el extranjero).\n• Objetivo: llegar a 60 Progreso para ganar #P +50 Era Momentum#!.\n• Velocidad de progreso: obtiene +1 de progreso base mensual, más +1 adicional por cada ancla de Era 2 completada (objetivos de capacidad estatal reconocida y puertos/intereses).\n• Sinergia de doctrina: tener #Y Diplomática IV#! por #Y Colonial IV#! desbloquea decisiones de hitos más baratas (5 Insight en lugar de 10)."
 ve_era_crossroads.2.b.tt:0 "Inicia el #Y Bienestar masivo#! ruta (Enfoque: Instituciones sociales, atención médica y educación).\n• Objetivo: llegar a 60 Progreso para ganar #P +50 Era Momentum#!.\n• Velocidad de progreso: obtiene +1 de progreso base mensual, más +1 adicional por cada ancla de Edad 2 completada (objetivos de alfabetización/escuelas e instituciones sociales).\n• Sinergia de doctrina: Tener #Y Bienestar IV#! o #Y Reformista IV#! desbloquea decisiones de hitos más económicas (5 Insight en lugar de 10)."
 ve_era_crossroads.2.c.tt:0 "Comienza el #Y Nación integrada#! ruta (Enfoque: Transformación económica y estabilidad interna).\n• Objetivo: alcanzar 60 de progreso para obtener #P +50 de impulso de era#!.\n• Velocidad de progreso: obtiene +1 de progreso mensual base, más +1 adicional por cada ancla de Era 2 completada (objetivos de transformación económica y legitimidad de baja agitación).\n• Sinergia de doctrina: Tener #Y Nacionalista IV#! o #Y Parto IV#! desbloquea decisiones de hitos más económicas (5 Insight en lugar de 10)."
 ve_era_crossroads.3.t:0 "La sociedad movilizada"
 ve_era_crossroads.3.d:0 "La política de masas, el mando estratégico y la movilización industrial llegan ahora a todas las instituciones. La era final exige una elección sobre qué forma de movilización definirá a la nación."
 ve_era_crossroads.3.a:0 "Comprometerse con una República Social."
 ve_era_crossroads.3.b:0 "Colocar a la nación bajo Comando Estratégico."
 ve_era_crossroads.3.c:0 "Construir una Sociedad Arsenal."
 ve_era_crossroads.3.d.option:0 "Rechazar un proyecto de movilización permanente."
 ve_era_crossroads.3.a.tt:0 "Comienza el #Y República Social#! ruta (Enfoque: Política de masas e instituciones sociales).\n• Meta: alcanzar 60 de progreso para ganar #P +50 Era Momentum#!.\n• Velocidad de progreso: obtiene +1 de progreso mensual base, más +1 extra por cada ancla de Era 3 completada (objetivos de Política de masas e instituciones sociales maduras).\n• Sinergia de doctrina: Tener #Y Parlamentario IV#! or #Y Bienestar IV#! desbloquea decisiones de hitos más económicas (5 Insight en lugar de 10)."
 ve_era_crossroads.3.b.tt:0 "Comienza el #Y Comando Estratégico#! ruta (Enfoque: modernización militar y alcance de poder global).\n• Objetivo: alcanzar 60 de progreso para ganar #P +50 de impulso de era#!.\n• Velocidad de progreso: obtiene +1 de progreso mensual base, más +1 extra por cada ancla de Era 3 completada (objetivos de composición de fuerza moderna y alcance de gran poder).\n• Sinergia de doctrina: tener #Y Ejército Profesional IV#! or #Y Defensivo IV#! desbloquea decisiones de hitos más económicas (5 Insight en lugar de 10)."
 ve_era_crossroads.3.c.tt:0 "Comienza el #Y Sociedad del Arsenal#! ruta (Enfoque: Economía de guerra industrial y armamentos masivos).\n• Objetivo: alcanzar 60 de progreso para ganar #P +50 de impulso de era#!.\n• Velocidad de progreso: obtiene +1 de progreso mensual base, más +1 extra por cada ancla de Era 3 completada (objetivos de industria eléctrica y armamentos masivos).\n• Sinergia de doctrina: tener #Y Economía de guerra IV#! or #Y Servicio militar obligatorio IV#! desbloquea decisiones de hitos más económicas (5 Insight en lugar de 10)."

 ve_era_crossroads_decline_tt:0 "Declina permanentemente la Encrucijada de Era de la Era actual. Las edades posteriores siguen siendo elegibles."

 ve_era_crossroads.10.t:0 "Un calendario nacional"
 ve_era_crossroads.10.d:0 "Las oficinas provinciales, las asociaciones privadas y los ministerios están llevando a cabo la transformación elegida a diferentes velocidades. Un calendario común podría convertir logros dispersos en un programa nacional, pero la coordinación en sí exige escasa atención administrativa."
 ve_era_crossroads.10.a:0 "Financiar una comisión central de coordinación."
 ve_era_crossroads.10.b:0 "Dejemos que las instituciones negocien su propio calendario."
 ve_era_crossroads.10.c:0 "Utilice las redes construidas por nuestras doctrinas establecidas."
 ve_era_crossroads.10.a.tt:0 "Gastar #N 10 Perspectiva nacional#! ganar #P +3 Progreso de Encrucijada#!."
 ve_era_crossroads.10.b.tt:0 "No gastes recursos ni realices cambios inmediatos en el progreso de Crossroads."
 ve_era_crossroads.10.c.tt:0 "Requiere un grupo de ideas de nivel IV con ajuste de ruta. Gastar #N 5 Perspectiva nacional#! para obtener #P +3 progreso en Crossroads#!."

 ve_era_crossroads.11.t:0 "¿Quién dirigirá el progreso?"
 ve_era_crossroads.11.d:0 "El programa se ha vuelto demasiado trascendental para seguir siendo un acuerdo flexible. Los ministros reclaman autoridad nacional, los expertos exigen aislamiento de la política y los actores locales advierten que un mando rígido quebrará las instituciones que hicieron posible el progreso."
 ve_era_crossroads.11.a:0 "Dar al centro un mandato claro de coordinación."
 ve_era_crossroads.11.b:0 "Preservar el equilibrio de autoridad negociado."
 ve_era_crossroads.11.c:0 "Encomendar la coordinación a nuestras instituciones doctrinales."
 ve_era_crossroads.11.a.tt:0 "Gastar #N 10 National Insight#! para obtener #P +3 de progreso en Crossroads#!."
 ve_era_crossroads.11.b.tt:0 "No gaste recursos ni realice cambios inmediatos en el progreso de Crossroads."
 ve_era_crossroads.11.c.tt:0 "Requiere un grupo de ideas de nivel IV con ajuste de ruta. Gastar #N 5 Perspectiva nacional#! para ganar #P +3 de progreso en Encrucijada#!."

 ve_era_crossroads.40.t:0 "Steam y el Estado"
 ve_era_crossroads.40.d:0 "El rumbo elegido ya no es una serie de logros aislados. La infraestructura, la ciudadanía o la administración forman ahora un programa nacional duradero a través del cual el Estado puede comprender y dirigir las transformaciones de la época."
 ve_era_crossroads.40.a:0 "La primera época ha encontrado su forma institucional."
 ve_era_crossroads.40.a.tt:0 "La Era Crossroads completada ha otorgado #P +50 Era Momentum#!. No ha completado un objetivo ni ha alterado la elegibilidad para la Edad de Oro."

 ve_era_crossroads.20.t:0 "El alcance del Estado"
 ve_era_crossroads.20.d:0 "El programa elegido ahora se extiende más allá de las instituciones que lo patrocinaron inicialmente. Los puertos, escuelas, oficinas y autoridades locales no están de acuerdo sobre dónde debería terminar la coordinación nacional y comenzar la discreción local."
 ve_era_crossroads.20.a:0 " Mapear las obligaciones del estado a través de una comisión central."
 ve_era_crossroads.20.b:0 "Permitir que surjan límites institucionales mediante la negociación."
 ve_era_crossroads.20.c:0 "Coordinar a través de nuestras redes doctrinales establecidas."
 ve_era_crossroads.20.a.tt:0 "Gaste #N 10 National Insight#! para ganar #P +3 Progreso de Encrucijada#!."
 ve_era_crossroads.20.b.tt:0 "No gastes recursos ni realices cambios inmediatos en el progreso de Crossroads."
 ve_era_crossroads.20.c.tt:0 "Requiere un grupo de ideas de nivel IV con ajuste de ruta. Gastar #N 5 Perspectiva nacional#! para lograr #P +3 avances en Encrucijada#!."

 ve_era_crossroads.21.t:0 "El Precio de la Integración"
 ve_era_crossroads.21.d:0 "El alcance externo, la provisión social y la disciplina nacional crean ganadores, costos y nuevas expectativas. El programa sólo puede perdurar si el Estado decide cómo se distribuirán esas cargas."
 ve_era_crossroads.21.a:0 "Crear una junta nacional para gestionar el ajuste."
 ve_era_crossroads.21.b:0 "Distribuir la carga mediante compromisos negociados."
 ve_era_crossroads.21.c:0 "Dejemos que nuestras instituciones doctrinales absorban la tensión."
 ve_era_crossroads.21.a.tt:0 "Gastar #N 10 National Insight#! para obtener #P +3 de progreso en Crossroads#!."
 ve_era_crossroads.21.b.tt:0 "No gaste recursos ni realice cambios inmediatos en el progreso de Crossroads."
 ve_era_crossroads.21.c.tt:0 "Requiere un grupo de ideas de nivel IV con ajuste de ruta. Gastar #N 5 Perspectiva nacional#! para ganar #P +3 de progreso en Encrucijada#!."

 ve_era_crossroads.41.t:0 "Imperio y sociedad de masas"
 ve_era_crossroads.41.d:0 "El acuerdo elegido ahora conecta el alcance externo del Estado, las obligaciones sociales y las instituciones nacionales. Lo que comenzó como una dirección estratégica se ha convertido en un marco duradero para gobernar la sociedad de masas."
 ve_era_crossroads.41.a:0 "La segunda era ha encontrado su asentamiento."
 ve_era_crossroads.41.a.tt:0 "La Era Crossroads completada ha otorgado #P +50 Era Momentum#!. No ha completado un objetivo ni ha alterado la elegibilidad para la Edad de Oro."

 ve_era_crossroads.30.t:0 "La nación está llamada al deber"
 ve_era_crossroads.30.d:0 "El programa elegido asigna nuevas obligaciones a ciudadanos, comandantes, trabajadores y administradores. A menos que esos deberes sean legibles entre sí, la movilización seguirá siendo un conjunto de demandas en competencia."
 ve_era_crossroads.30.a:0 "Codificar los deberes nacionales a través de una comisión central."
 ve_era_crossroads.30.b:0 "Dejemos que las instituciones negocien sus responsabilidades."
 ve_era_crossroads.30.c:0 "Utilice nuestras organizaciones doctrinales para coordinar el deber."
 ve_era_crossroads.30.a.tt:0 "Gaste #N 10 National Insight#! para ganar #P +3 Progreso de Encrucijada#!."
 ve_era_crossroads.30.b.tt:0 "No gastes recursos ni realices cambios inmediatos en el progreso de Crossroads."
 ve_era_crossroads.30.c.tt:0 "Requiere un grupo de ideas de nivel IV con ajuste de ruta. Gastar #N 5 Perspectiva nacional#! para obtener #P +3 de progreso en Encrucijada#!."

 ve_era_crossroads.31.t:0 "Una Emergencia Permanente"
 ve_era_crossroads.31.d:0 "La maquinaria construida para la participación masiva, la preparación estratégica o la movilización industrial se está volviendo permanente. El Estado debe decidir cómo preservar la capacidad sin permitir que la disciplina de emergencia consuma la vida nacional ordinaria."
 ve_era_crossroads.31.a:0 "Definir límites permanentes a través de una revisión nacional."
 ve_era_crossroads.31.b:0 "Mantener el acuerdo deliberadamente flexible."
 ve_era_crossroads.31.c:0 "Confiar en instituciones doctrinales para contener la maquinaria."
 ve_era_crossroads.31.a.tt:0 "Gastar #N 10 National Insight#! para obtener #P +3 de progreso en Crossroads#!."
 ve_era_crossroads.31.b.tt:0 "No gaste recursos ni realice cambios inmediatos en el progreso de Crossroads."
 ve_era_crossroads.31.c.tt:0 "Requiere un grupo de ideas de nivel IV con ajuste de ruta. Gastar #N 5 Perspectiva nacional#! para ganar #P +3 de progreso en Encrucijada#!."

 ve_era_crossroads.42.t:0 "La sociedad movilizada"
 ve_era_crossroads.42.d:0 "La ciudadanía, el mando y la capacidad industrial forman ahora un acuerdo nacional duradero. Las instituciones de movilización se han convertido en parte del gobierno ordinario en lugar de dejarlas como respuestas improvisadas a cada nueva crisis."
 ve_era_crossroads.42.a:0 "La era final ha encontrado su forma nacional."
 ve_era_crossroads.42.a.tt:0 "La Era Crossroads completada ha otorgado #P +50 Era Momentum#!. No ha completado un objetivo ni ha alterado la elegibilidad para la Edad de Oro."
