l_spanish:
 ve_splendor:0 "#tooltippable_name Ímpetu de era: "
 ve_age_of_victoria_title:0 "Industria y Naciones"
 ve_age_of_victoria_desc:0 "Los viejos órdenes se enfrentan a las fábricas, los ferrocarriles, los públicos alfabetizados y el Estado moderno. El ímpetu pertenece a los países que convierten las instituciones heredadas en una capacidad nacional duradera."
 ve_imperialism_age_title:0 "Imperio y Sociedad de Masas"
 ve_imperialism_age_desc:0 "La industria se extiende por los continentes mientras la educación, las instituciones públicas y los ejércitos organizados remodelan la sociedad de masas. Las grandes potencias pueden expandirse en el extranjero; los Estados más pequeños pueden prosperar mediante la soberanía y el desarrollo interno."
 ve_great_wars_age_title:0 "Política de Masas y Guerra Total"
 ve_great_wars_age_desc:0 "La electricidad, el petróleo, la participación de masas, el asistencialismo y la guerra industrial transforman la relación entre el Estado y la sociedad. La supervivencia depende ahora tanto de las instituciones como de los ejércitos."
 ve_age_notify_option:0 "Amanece una nueva era."
 ve_victorian_age_icon_p_tt:0 "#P Industria y Naciones (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Industria y Naciones (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Imperio y Sociedad de Masas (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Imperio y Sociedad de Masas (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Política de Masas y Guerra Total (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Política de Masas y Guerra Total (1906–1936)"

 ve_golden_age:0 "Edad de oro"
 ve_golden_age_industrial:0 "Edad de oro industrial"
 ve_golden_age_cultural:0 "Edad de oro cultural"
 ve_golden_age_strategic:0 "Edad de oro estratégica"
 ve_golden_age_tt:0 "Disponible a partir de #v 1845#! tras completar #v 5 objetivos distintos#! en la era actual. Un país solo puede elegir una Edad de oro durante toda la partida; sus efectos duran #v 15 años#!."
 ve_golden_age_requirement_unused:0 "No se ha elegido ninguna Edad de oro durante esta campaña."
 ve_golden_age_requirement_year:0 "Requiere el año #v 1845#! o posterior."
 ve_golden_age_requirement_objectives:0 "Completa al menos #v 5 objetivos distintos#! en la era actual."
 ve_golden_age_industrial_tt:0 "#header Edad de oro industrial#!\nDurante #Y 15 años#!: #P +10% Rendimiento de manufacturas#! y #P +10% Probabilidad de descubrimiento de recursos#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Edad de oro cultural#!\nDurante #Y 15 años#!: #P +5% Acceso a la educación#! y #P +10% Prestigio#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Edad de oro estratégica#!\nDurante #Y 15 años#!: #P +5% Ataque de ejército#! y #P -10% Fatiga por la guerra por bajas#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Objetivos de era"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Despegue industrial"
 ve_victorian_age_obj_desc_1:0 "Reduce la proporción de campesinos por debajo del 40%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Fin del viejo orden"
 ve_victorian_age_obj_desc_2:0 "Prohíbe la esclavitud y abole la servidumbre."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Estado funcional"
 ve_victorian_age_obj_desc_3:0 "Mantén al menos 70 de legitimidad y un balance de burocracia no negativo sin escasez próxima."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Público alfabetizado"
 ve_victorian_age_obj_desc_4:0 "Alcanza un 50% de alfabetización o el nivel 3 de escuelas."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Mercado integrado"
 ve_victorian_age_obj_desc_5:0 "Posee al menos 3 niveles de ferrocarril si la población es inferior a 5 millones, o 6 niveles de ferrocarril en caso contrario."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Despertar nacional"
 ve_victorian_age_obj_desc_6:0 "Sé independiente con al menos 65 de legitimidad y menos de un 5% de agitación en el país."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Alcance global"
 ve_victorian_age_obj_desc_7:0 "Sé una potencia mayor o una Gran potencia, o mantén al menos 5 intereses declarados."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Poder industrial"
 ve_imperialism_age_obj_desc_1:0 "Alcanzar £100 millones de PIB o reducir la participación campesina por debajo del 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Educación de masas"
 ve_imperialism_age_obj_desc_2:0 "Alcanzar un 65% de Alfabetización o Educación de nivel 4."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Imperio o Soberanía"
 ve_imperialism_age_obj_desc_3:0 "Tener al menos 2 súbditos, o permanecer independiente y reconocido."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Comercio global"
 ve_imperialism_age_obj_desc_4:0 "Poseer 2 niveles de Puerto si se tienen menos de 10 millones de Población, poseer 10 niveles de Puerto en caso contrario, o mantener 5 Intereses declarados."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Construcción nacional"
 ve_imperialism_age_obj_desc_5:0 "Mantener al menos 60 de Legitimidad y menos del 5% de Agitación en el país."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header La cuestión social"
 ve_imperialism_age_obj_desc_6:0 "Elevar el Sistema sanitario, la Seguridad en el trabajo o la Seguridad Social al nivel 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Fuerzas armadas modernas"
 ve_imperialism_age_obj_desc_7:0 "Desplegar al menos un 50% de Infantería de escaramuza o de trinchera y un 10% de Artillería móvil en el Ejército."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Política de masas"
 ve_great_wars_age_obj_desc_1:0 "Promulgar el Sufragio universal o la República de consejos, o mantener 75 de Legitimidad como República parlamentaria o presidencial."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Estado del bienestar"
 ve_great_wars_age_obj_desc_2:0 "Mantener al menos dos Instituciones de nivel 3 entre Sanidad, Seguridad Social, Seguridad en el trabajo y Educación."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Economía electrificada"
 ve_great_wars_age_obj_desc_3:0 "Poseer 1 nivel de Central eléctrica si se tienen menos de 10 millones de Población, o 5 niveles de Central eléctrica en caso contrario."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Petróleo y motores"
 ve_great_wars_age_obj_desc_4:0 "Poseer una torre de extracción de Petróleo o al menos 5 niveles de Industria de motores."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Militares modernos"
 ve_great_wars_age_obj_desc_5:0 "Desplegar al menos un 50% de Infantería de trinchera o de asalto y un 15% de Artillería de metralla en el Ejército."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Capacidad de guerra total"
 ve_great_wars_age_obj_desc_6:0 "Mantener 40 unidades militares y al menos 5 niveles de Industria armamentística o 3 niveles de Fábrica de munición."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Influencia mundial"
 ve_great_wars_age_obj_desc_7:0 "Ser una Gran potencia o potencia menor, liderar un Bloque de poder, o mantener al menos 6 Intereses declarados."

 ve_age_splendor_tt:0 "#title Ímpetu de era#!\nReserva actual: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nMetas satisfechas: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nGrupos de doctrinas (Era actual, máx. +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nCambio mensual: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nMetas distintas completadas esta era: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nRecompensas compradas esta era: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nCoste de la próxima recompensa: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Cómo contribuyen los grupos de doctrinas#!\nCualquier grupo de nivel IV coincidente otorga #P +1#! al mes solo mientras su Era asignada esté activa. La línea superior muestra el total activo, limitado a #Y +2#!.\n#P Era 1#!: grupos industriales, comerciales, administrativos y académicos\n#P Era 2#!: grupos de recursos, de sociedad, diplomáticos, nacionalistas/reformistas y coloniales\n#P Era 3#!: grupos militares y de economía de guerra\n\nCada meta satisfecha actualmente también otorga #P +1#! de Ímpetu de era al mes. Los grupos de doctrinas no alteran el cumplimiento de las metas ni su recompensa única de #P +50#!.\n\nLos costes de las recompensas escalan en cada era: #Y 200, 300, 400, 500#!, y después #Y 600#! para cada recompensa posterior. El ímpetu y la escala de costes se reinician al comenzar una nueva era."
 ve_age_obj_efct_tt:0 "Mientras esté satisfecha: #P +1 de Ímpetu de era al mes#!\nPrimer cumplimiento en esta era: #P +50 de Ímpetu de era#!"
 splendor_default_bonus:0 "Tener al menos #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! de Ímpetu de era"
 ve_age_1_bonus_10_tt:0 "Requiere una Cultura principal italiana septentrional o italiana meridional."
 ve_age_2_bonus_10_tt:0 "Requiere Austria."
 ve_age_3_bonus_10_tt:0 "Requiere Gran Bretaña."
 ve_age_1_bonus_11_tt:0 "Requiere una Cultura principal alemana septentrional o alemana meridional."
 ve_age_2_bonus_11_tt:0 "Requiere Rusia."
 ve_age_3_bonus_11_tt:0 "Requiere Qing."
 ve_age_1_bonus_12_tt:0 "Requiere los Países Bajos."
 ve_age_2_bonus_12_tt:0 "Requiere Bélgica."
 ve_age_3_bonus_12_tt:0 "Requiere Francia."
 ve_age_1_bonus_13_tt:0 "Requiere el Imperio otomano."
 ve_age_2_bonus_13_tt:0 "Requiere los Estados Unidos."
 ve_age_3_bonus_13_tt:0 "Requiere Japón."
