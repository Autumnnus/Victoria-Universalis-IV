l_spanish:
 ve_splendor:0 "#tooltippable_name Momento de la era: "
 ve_age_of_victoria_title:0 "La industria y las naciones"
 ve_age_of_victoria_desc:0 "Los viejos órdenes se enfrentan a las fábricas, los ferrocarriles, al público alfabetizado y al Estado moderno. El impulso pertenece a los países que convierten las instituciones heredadas en capacidad nacional duradera."
 ve_imperialism_age_title:0 "Imperio y sociedad de masas"
 ve_imperialism_age_desc:0 "La industria llega a todos los continentes, mientras que la educación, las instituciones públicas y los ejércitos organizados remodelan la sociedad de masas. Las grandes potencias pueden expandirse al exterior; Los estados más pequeños pueden prosperar a través de la soberanía y el desarrollo interno."
 ve_great_wars_age_title:0 "Política de masas y guerra total"
 ve_great_wars_age_desc:0 "La electricidad, el petróleo, la participación masiva, el bienestar y la guerra industrial transforman la relación entre Estado y sociedad. La supervivencia ahora depende tanto de las instituciones como de los ejércitos."
 ve_age_notify_option:0 "Amanece una nueva era."
 ve_victorian_age_icon_p_tt:0 "#P Industria y naciones (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Industria y naciones (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Imperio y sociedad de masas (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Imperio y sociedad de masas (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Política de masas y guerra total (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Política de masas y guerra total (1906–1936)"

 ve_golden_age:0 "Edad de Oro"
 ve_golden_age_industrial:0 "Edad de Oro industrial"
 ve_golden_age_cultural:0 "Edad de Oro cultural"
 ve_golden_age_strategic:0 "Edad de Oro estratégica"
 ve_golden_age_tt:0 "Disponible desde #v 1845#! después de completar #v 5 objetivos distintos#! en la época actual. Un país sólo podrá elegir una Edad de Oro durante todo el juego; sus efectos duran #v 15 años#!."
 ve_golden_age_requirement_unused:0 "No se ha elegido ninguna Edad de Oro durante esta campaña."
 ve_golden_age_requirement_year:0 "Requiere el año #v 1845#! o posterior."
 ve_golden_age_requirement_objectives:0 "Completar al menos #v 5 objetivos distintos#! en la era actual."
 ve_golden_age_industrial_tt:0 "#header Edad de Oro Industrial#!\nDurante #Y 15 años#!: #P +10 % de rendimiento de fabricación#!  y #P +10 % de probabilidad de descubrimiento de recursos#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Edad de oro cultural#!\nDurante #Y 15 años#!: #P +5 % de acceso a la educación#! y #P +10% de prestigio#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Edad de oro estratégica#!\nDurante #Y 15 años#!: #P +5% de ataque del ejército#!  y #P -10% de agotamiento de guerra por las bajas#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Objetivos de edad"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Despegue industrial"
 ve_victorian_age_obj_desc_1:0 "Reducir la proporción de campesinos por debajo del 40%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Acabar con lo antiguo Orden"
 ve_victorian_age_obj_desc_2:0 "Prohibir la esclavitud y abolir la servidumbre."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Estado funcional"
 ve_victorian_age_obj_desc_3:0 "Mantener al menos 70 de legitimidad y un equilibrio burocrático no negativo sin que se acerque una escasez."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Público educado"
 ve_victorian_age_obj_desc_4:0 "Alcanzar el 50% de alfabetización o escuelas de nivel 3."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Mercado integrado"
 ve_victorian_age_obj_desc_5:0 "Poseer al menos 3 niveles ferroviarios si tiene menos de 5 millones de habitantes, o 6 niveles ferroviarios en caso contrario."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Despertar Nacional"
 ve_victorian_age_obj_desc_6:0 "Ser independiente con al menos un 65% de legitimidad y menos de un 5% de agitación nacional."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Alcance Global"
 ve_victorian_age_obj_desc_7:0 "Ser una Gran Potencia o mantener al menos 5 intereses declarados."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Poder Industrial"
 ve_imperialism_age_obj_desc_1:0 "Alcanzar £100 millones de PIB o reducir la participación campesina por debajo del 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Educación de masas"
 ve_imperialism_age_obj_desc_2:0 "Alcanzar un 65% de alfabetización o nivel 4 Escuelas."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Imperio o Soberanía"
 ve_imperialism_age_obj_desc_3:0 "Tener al menos 2 sujetos, o permanecer independientes y reconocidos."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Comercio Global"
 ve_imperialism_age_obj_desc_4:0 "Poseer 2 niveles de puerto si tiene menos de 10 millones de habitantes, poseer 10 niveles de puerto en caso contrario, o mantener 5 intereses declarados."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Construcción de la nación"
 ve_imperialism_age_obj_desc_5:0 "Mantener al menos un 60% de legitimidad y menos del 5% de agitación en el país."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header La cuestión social"
 ve_imperialism_age_obj_desc_6:0 "Elevar el sistema de salud, la seguridad en el lugar de trabajo o la seguridad social al nivel 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Las Fuerzas Armadas Modernas"
 ve_imperialism_age_obj_desc_7:0 "despliegan al menos un 50% de infantería de escaramuza o trinchera y 10% Artillería Móvil en el ejército."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Política de Masas"
 ve_great_wars_age_obj_desc_1:0 "Promulgar Sufragio Universal o República de Consejo, o mantener 75 legitimidad como República Parlamentaria o Presidencial."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Estado Social"
 ve_great_wars_age_obj_desc_2:0 "Mantener al menos dos instituciones de nivel 3 entre Salud, Seguridad Social, Seguridad en el Trabajo y Escuelas."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Economía electrificada"
 ve_great_wars_age_obj_desc_3:0 "Poseer 1 nivel de Planta de Energía si tiene menos de 10 millones de habitantes, o 5 niveles de Planta de Energía en caso contrario."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Petróleo y Motores"
 ve_great_wars_age_obj_desc_4:0 "Tener una Plataforma Petrolera o al menos 5 niveles de Industria del Motor."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Militar moderno"
 ve_great_wars_age_obj_desc_5:0 "Utiliza al menos un 50% de infantería de trinchera o escuadrón y un 15% de artillería de metralla en el ejército."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Capacidad de guerra total"
 ve_great_wars_age_obj_desc_6:0 "Mantén 40 unidades del ejército y al menos 5 niveles de industria armamentista o 3 plantas de municiones."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Influencia mundial"
 ve_great_wars_age_obj_desc_7:0 "Ser una gran potencia, liderar un bloque de poder o mantener al menos 6 intereses declarados."

 ve_age_splendor_tt:0 "#title Era Momentum#!\nStock actual: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nObjetivos satisfechos: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nGrupos de ideas (Edad actual, máx. +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nCambio mensual: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nObjetivos distintos completados para esta edad: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nRecompensas compradas para esta edad: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nCosto de la próxima recompensa: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Cómo contribuyen los grupos de ideas#!\nCualquier grupo de nivel IV coincidente otorga #P +1#! por mes solo mientras su edad asignada esté vigente. La línea de arriba muestra el total activo, limitado a #Y +2#!.\n#P Edad 1#!: industria, comercio, administración y grupos académicos\n#P Edad 2#!: recursos, sociedad, diplomacia, grupos nacionalistas/reformistas y coloniales\n#P Edad 3#!: grupos militares y de economía de guerra\n\nCada objetivo actualmente satisfecho también otorga #P +1#! Era Momentum por mes. Los grupos de ideas no alteran la consecución del objetivo ni su cumplimiento único #P +50#! recompensa.\n\nLos costos de las recompensas aumentan dentro de cada edad: #Y 200, 300, 400, 500#!, entonces #Y 600#! por cada recompensa posterior. El impulso y la escala de costos se reinician cuando comienza una nueva era."
 ve_age_obj_efct_tt:0 "Mientras esté satisfecho: #P +1 Era Momentum por mes#!\nPrimera finalización esta edad: #P +50 Era Momentum#!"
 splendor_default_bonus:0 "Tener al menos #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Era Momentum"
 ve_age_1_bonus_10_tt:0 "Requiere una cultura primaria del norte de Italia o del sur de Italia."
 ve_age_2_bonus_10_tt:0 "Requiere Austria."
 ve_age_3_bonus_10_tt:0 "Requiere Gran Bretaña."
 ve_age_1_bonus_11_tt:0 "Requiere una cultura primaria del norte de Alemania o del sur de Alemania."
 ve_age_2_bonus_11_tt:0 "Requiere Rusia."
 ve_age_3_bonus_11_tt:0 "Requiere Qing."
 ve_age_1_bonus_12_tt:0 "Requiere los Países Bajos."
 ve_age_2_bonus_12_tt:0 "Requiere Bélgica."
 ve_age_3_bonus_12_tt:0 "Requiere Francia."
 ve_age_1_bonus_13_tt:0 "Requiere el Imperio Otomano."
 ve_age_2_bonus_13_tt:0 "Requiere los Estados Unidos."
 ve_age_3_bonus_13_tt:0 "Requiere Japón."
