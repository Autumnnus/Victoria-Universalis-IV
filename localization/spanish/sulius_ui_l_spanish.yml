l_spanish:
 SULIUS_LEGITIMACY_LEVEL_ACTIVE_TOOLTIP:0 "#tooltip_header [concept_legitimacy] \n[LegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\n$LEGITIMACY_LEVEL_BOUNDS_DESC$\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\nEfectos:#indent_newline:2 \n[LegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\nEsto se debe a:#indent_newline:2 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 SULIUS_CAPITAL_MONEY:0 "#tooltip_header [concept_money]#!\nBalance: #variable @money![AccessPlayer.PredictWeeklyBalance|D=+]#![GetPlayer.GetPowerDeltaIcon('money')]\n[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.GetPrincipal, '(CFixedPoint)0'), 'CREDIT_DESC', 'GOLD_RESERVES_DESC')]\nLímite de reservas de oro: @money![GetPlayer.GetGoldReserveLimit|Dv]#!#![SelectLocalization(GetMetaPlayer.GetPlayedOrObservedCountry.IsValid, 'CAPITAL_MONEY_DELAYED', 'OBSERVER_NO_COUNTRY_SELECTED') ]"
 
 SULIUS_RESEARCH:0 "#tooltip_header [concept_technology]#!\n[SelectLocalization( GetPlayer.GetCurrentlyResearchedTechnology.IsValid, 'SULIUS_RESEARCHING', 'SULIUS_NOT_RESEARCHING' )]\n$TOOLTIP_DELIMITER$\n#V Progreso de tecnología#!\n#help De [concept_innovation]: @innovation![GetPlayer.GetWeeklyInnovation|+0]\nDe [concept_technology_spread]: [GetPlayer.GetWeeklyTechnologySpreadForTechDesc(GetPlayer.GetCurrentlyResearchedTechnology.Self)]\n$TOOLTIP_DELIMITER$\n#V [concept_innovation]#!\nGeneramos #v @innovation![GetPlayer.GetWeeklyInnovation|+2]#! de [concept_innovation] cada semana:\n[GetPlayer.GetWeeklyInnovationDesc]\n\nSe puede invertir un máximo de @innovation![GetPlayer.GetWeeklyMaxInnovation|v2] de [concept_innovation] en la investigación activa cada semana:\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\nToda [concept_innovation] que no se gaste debido a los límites de inversión o a la falta de investigación activa aumentará la tasa de [concept_technology_spread] de nuestro país"
 SULIUS_RESEARCHING:0 "[GetPlayer.GetName] está investigando actualmente [GetPlayer.GetCurrentlyResearchedTechnology.GetName]#!\nProgreso: #v @innovation! [GetPlayer.GetCurrentlyResearchedTechnology.GetProgress(GetPlayer.Self)|D]#! / #maximum [GetPlayer.GetCurrentlyResearchedTechnology.GetCost(GetPlayer.Self)|D]#! (faltan [GetPlayer.GetCurrentlyResearchedTechnology.GetTimeLeftDesc( GetPlayer.Self )])"
 SULIUS_NOT_RESEARCHING:0 "[GetPlayer.GetName] no está investigando nada de forma activa."
