l_spanish:
 ve_national_identity:0 "Identidad nacional"
 ve_primary_cultures_label:0 "Culturas primarias"
 ve_identity_models:0 "Modelos de identidad"
 ve_identity_model_active_footer:0 "Ya activo"
 ve_switch_identity_button:0 "Cambiar"
 ve_switch_identity_cost_label:0 "Costos #Y 200 Mandato Cultural#!"
 ve_begin_project_button:0 "Comenzar Proyecto"
 ve_identity_models_help:0 "Su nación siempre tiene exactamente un Modelo de Identidad y es #P ya activo#! —no tienes que elegir nada aquí. El modelo sólo decide cómo #Y Cohesión Nacional#! se gana y qué proyecto cultural puedes ejecutar.\n#Y El cambio es opcional:#! cuesta #Y 200 Mandato Cultural#!, restablece la Cohesión a #Y 35#!, cancela cualquier proyecto cultural en ejecución y bloquea otro cambio durante 5 años.\n#Y Pase el cursor sobre cualquier carta o medidor para ver todos sus efectos.#!"
 ve_ethnic_identity_name:0 "Nación étnica"
 ve_civic_identity_name:0 "Nación cívica"
 ve_composite_identity_name:0 "Estado compuesto"
 ve_ethnic_identity_short:0 "La nación se define en torno a sus culturas primarias.\nLa cohesión proviene del #Y dominio demográfico#!."
 ve_civic_identity_short:0 "Una nación política construida a través de la escolarización.\nLa cohesión proviene de #Y alfabetización y minorías aceptadas#!."
 ve_composite_identity_short:0 "Varios pueblos bajo instituciones negociadas.\nLa cohesión proviene de #Y una población genuinamente plural#!."
 ve_ethnic_identity_unlocks:0 "Desbloquea el #Y Campaña de integración étnica#! proyecto"
 ve_civic_identity_unlocks:0 "Desbloquea el #Y Iniciativa de ciudadanía igualitaria#! proyecto"
 ve_composite_identity_unlocks:0 "Desbloquea el #Y Proyecto#! Pacto Constituyente"
 ve_ethnic_identity_desc:0 "#header Nación Étnica#!\nLa nación se define en torno a sus culturas primarias.\n\n#Y Mientras está activa#!\n#P +15% Asimilación, +5% Autoridad#!\n#N -5% Atracción migratoria, +5% Radicales por prejuicio abierto#!\n\n#Y Cohesión#!\nAumenta cuando las culturas primarias constituyen al menos entre el 60% y el 75% de la población, y cae bruscamente por debajo del 40%.\n\n#Y En 75 de cohesión#!\n#P +5% Tasa de reclutamiento, +3 Legitimidad#!\n\n#Y Proyecto cultural#!\nCampaña de integración étnica"
 ve_civic_identity_desc:0 "#header Nación cívica#!\nUna nación política compartida se construye a través de la educación y la participación.\n\n#Y Mientras está activo#!\n#P +7% Atracción de migración, +1% Acceso a la educación#!\n#N -10% Asimilación, -5% Autoridad, -50 Burocracia#!\n\n#Y Cohesión#!\nLa alfabetización la eleva, pero cualquier cultura no primaria por encima del 10% de la población con muy baja Aceptación la reduce.\n\n#Y A 75 Cohesión#!\n#P +5% Cualificaciones, +3 Legitimidad#!\n\n#Y Proyecto Cultural#!\nCiudadanía igual Iniciativa"
 ve_composite_identity_desc:0 "#header Estado Compuesto#!\nVarios pueblos son gobernados a través de instituciones negociadas.\n\n#Y Mientras están activos#!\n#P -10% Radicales de Borrado Cultural y Ciudadanía de Segunda Categoría, +5% Influencia#!\n#N -15% Asimilación, -5% Autoridad, -75 Burocracia#!\n\n#Y Cohesión#!\nUna población genuinamente plural lo levanta; una población con más del 90% de culturas primarias debilita este modelo.\n\n#Y Con 75 de cohesión#!\n#P +5% de influencia, +3 de legitimidad#!\n\n#Y Proyecto cultural#!\nPacto constituyente"
 ve_identity_change_cost_tt:0 "Cambiar el modelo de identidad requiere #Y 200 Mandato cultural#! y ninguna reacción activa de transición de identidad. El cambio restablece la Cohesión a #Y 35#!, provoca una #Y reacción de transición de 5 años#! y cancela cualquier Proyecto Cultural activo sin una penalización adicional por cancelación."
 ve_cultural_mandate:0 "Mandato Cultural"
 ve_culture_reform_point:0 "Mandato Cultural"
 ve_cultural_mandate_hint:0 "Gastado en Proyectos Culturales. Ahorrarlo es seguro, pero el ingreso se reduce a la mitad en 400 y se detiene en 500."
 ve_culture_reform_point_tt:0 "#header Mandato Cultural#!\nActual: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nCambio mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y En qué se gasta#!\nProyectos Culturales (75-150) y cambios de Modelo de Identidad (200). Ninguno de los dos es necesario: el mandato de ahorro es seguro, los ingresos solo se reducen a la mitad en 400 y se detienen en 500.\n\n#Y Desglose mensual#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLegitimidad: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministración: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nSociedad modelo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nEstabilidad y movimientos culturales: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nAlineación de leyes: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nDoctrina de ideas: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nCap multiplicador: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Doctrina de ideas: solo cuenta su modelo de identidad actual#!\n#P Nación étnica#!: Nacionalista V #P +1#!\n#P Nación cívica#!: Reformista V #P +1#!; V #P +1#!\n#P Estado compuesto#!: V #P +1 reformista#!\nEl total activo anterior tiene un límite de #Y +2#!.\n\nLa Nación Cívica extrae el componente de Sociedad Modelo de la alfabetización, el Estado Compuesto de la alfabetización en una sociedad plural y la Nación Étnica de la fortaleza demográfica de la cultura primaria.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "La Cohesión Nacional"
 ve_national_cohesion_hint:0 "se deriva hacia el equilibrio que produce su Modelo de Identidad. Con 75+ obtienes una bonificación, con 25 o menos de inestabilidad."
 ve_national_cohesion_tt:0 "#header Cohesión nacional#!\nActual: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nEquilibrio: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMovimiento mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nCondiciones comunes: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nCondiciones del modelo de identidad: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nLa cohesión avanza un 20% de la distancia hacia el equilibrio cada mes, hasta 5 puntos. Los movimientos culturales radicales reducen el equilibrio en 10. A los 75 años o más, el modelo actual otorga un beneficio adicional; a los 25 años o menos se aplica la inestabilidad nacional.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Sin efecto"
 ve_cultural_projects:0 "Proyectos Culturales"
 ve_cultural_projects_intro:0 "Los Proyectos Culturales son #Y opcional#!. Sólo se puede ejecutar uno a la vez: su costo de Mandato se paga inmediatamente y #N -75 Burocracia y -25 Autoridad#! aplicar mientras esté en funcionamiento. Completar un proyecto devuelve algo de Mandato y aumenta la Cohesión. Los proyectos a nivel nacional sólo pueden repetirse después de que expire su beneficio de finalización; un objetivo de Estado/Cultura completado no se puede volver a seleccionar.\n#Y Pase el cursor sobre cualquier tarjeta o medidor para ver sus efectos completos.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Proyecto en progreso"
 ve_cultural_project_progress:0 "Progreso del proyecto"
 ve_cultural_project_progress_tt:0 "#header Progreso mensual del proyecto#!\nActual: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nRestante: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nTotal mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (mínimo 1, máximo 7)\n\n#Y Desglose mensual#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministración: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLegitimidad: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nSociedad modelo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nCohesión: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nMovimientos culturales: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nEstado-objetivo Turbulencia: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nGrupos de ideas: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Grupos de ideas: solo están activas las bonificaciones que coinciden con su modelo de identidad actual#!\n#P Nación étnica#!: Nacionalista VII #P +1#!\n#P Nación cívica#!: Reformista VII, Académica VII o Bienestar VI — #P +1#! cada uno\n#P Estado compuesto#!: Reformista VII o Diplomático VI — #P +1#! cada uno\nEl total del grupo de ideas activo anterior tiene un límite de #Y +2#!; cualquier bonificación adicional no aumenta el progreso.\n\nLa sociedad modelo recompensa la alfabetización cívica, la concentración demográfica étnica o la diversidad compuesta según el modelo de identidad activo. La finalización se resuelve en la próxima actualización mensual después de que se alcance el progreso. #Y 100#!."
 ve_cancel_cultural_project_button:0 "Cancelar Proyecto"
 ve_cancel_cultural_project_tt:0 "#header Cancelar Proyecto Cultural#!\nEl Mandato Cultural invertido es #N no reembolsado#!. La cohesión nacional cae #N 5#! y un #N Reacción de 2 años#! impide otro proyecto."
 ve_start_cultural_project_button:0 "Iniciar proyecto"
 ve_national_curriculum_name:0 "Plan de Estudios Nacional"
 ve_national_curriculum_cost:0 "Costo: #Y 100 Mandato Cultural#!"
 ve_national_curriculum_short:0 "Una reforma escolar a nivel nacional.\n#P Mandato +20, cohesión +5#!, luego mejor educación."
 ve_national_curriculum_desc:0 "#header Plan de estudios nacional#!\nUna reforma escolar ejecutada en todo el país.\n\n#Y Costo#!\n#Y 100 Mandato Cultural#!, pagado inmediatamente\n\n#Y Al finalizar#!\n#P +20 Mandato Cultural, +5 Cohesión Nacional#!\n\n#Y Durante 10 años después#!\n#P +2% Acceso a la Educación, +5% Calificaciones#!\n#N -25 Burocracia#!"
 ve_national_curriculum_requirements_tt:0 "Requiere #Y 100 Mandato Cultural#!, ningún proyecto cultural activo y no Contragolpe del proyecto. Tampoco puede comenzar mientras el anterior #Y Plan de estudios nacional#! el beneficio está activo."
 ve_shared_symbols_name:0 "Símbolos compartidos"
 ve_shared_symbols_cost:0 "Costo: #Y 75 Mandato Cultural#!"
 ve_shared_symbols_short:0 "Banderas, himnos y ceremonia pública.\n#P +20 Mandato, +7 Cohesión#!, luego leales y Autoridad."
 ve_shared_symbols_desc:0 "#header Símbolos compartidos#!\nBanderas, himnos y ceremonia pública, promovidos en todo el país.\n\n#Y Costo#!\n#Y 75 Mandato Cultural#!, pagado inmediatamente\n\n#Y Al finalizar#!\n#P +20 Mandato Cultural, +7 Cohesión Nacional#!\n\n#Y Durante 8 años después#!\n#P +10% Leales de Pops Totalmente Aceptados, +25 Autoridad#!"
 ve_shared_symbols_requirements_tt:0 "Requiere #Y 75 Mandato Cultural#!, ningún Proyecto Cultural activo y ningún Proyecto Contragolpe. Tampoco puede comenzar mientras el anterior #Y Símbolos compartidos#! el beneficio está activo."
 ve_ethnic_campaign_name:0 "Campaña de Integración Étnica"
 ve_ethnic_campaign_cost:0 "Costo: #Y 125 Mandato Cultural#!"
 ve_ethnic_campaign_short:0 "Asimilar una gran minoría en un Estado.\n#P +25 Mandato, +8 Cohesión#!, pero crea radicales."
 ve_ethnic_campaign_desc:0 "#header Campaña de Integración Étnica#!\nSe lleva a cabo en un solo Estado contra su mayor cultura no primaria, que debe contener al menos #Y 5%#! de la población de ese Estado.\n\n#Y Costo#!\n#Y 125 Cultural Mandato#!, pagado inmediatamente\n\n#Y Al finalizar#!\nAsimila #Y 5%#! de la cultura objetivo en una cultura primaria, o #Y 7%#! con Nacionalista VII\n#P +25 Mandato Cultural, +8 Cohesión Nacional#!\nDeja un #Y 10 años#! programa de asimilación en el Estado\n\n#Y Advertencia#!\n#N Tanto iniciar como finalizar el proyecto crean radicales entre la cultura objetivo.#!"
 ve_civic_initiative_name:0 "Iniciativa de Ciudadanía Igualitaria"
 ve_civic_initiative_cost:0 "Costo: #Y 100 Mandato Cultural#!"
 ve_civic_initiative_short:0 "Aumentar la aceptación de una minoría en un estado.\n#P +25 Mandato, +10 Cohesión#!, más leales."
 ve_civic_initiative_desc:0 "#header Iniciativa de ciudadanía igualitaria#!\nEjecutar en un solo estado en su cultura no primaria más grande, que debe albergar al menos #Y 5%#! de la población de ese estado.\n\n#Y Costo#!\n#Y 100 Mandato cultural#!, pagado inmediatamente\n\n#Y Al finalizar#!\n#P +15 Aceptación de esa cultura durante 10 años#!\nLeales en el Estado objetivo\n#P +25 Mandato Cultural, +10 Cohesión Nacional#!\nDiez años de mejora de las Cualificaciones y Atracción de Migraciones"
 ve_composite_compact_name:0 "Pacto Constituyente"
 ve_composite_compact_cost:0 "Costo: #Y 150 Mandato Cultural#! y #Y 40 Cohesión#!"
 ve_composite_compact_short:0 "Reconocer a una minoría como cultura constituyente.\n#P +30 Mandato, +12 Cohesión#!, permanentemente."
 ve_composite_compact_desc:0 "#header Pacto Constituyente#!\nEjecutado en un solo Estado en una cultura no primaria no reconocida que posea al menos #Y 5%#! de la población de ese Estado.\n\n#Y Costo#!\n#Y 150 Mandato Cultural#!, pagado inmediatamente, y al menos #Y 40 Cohesión Nacional#!\n\n#Y Al finalizar#!\n#P +15 Aceptación para esa cultura, permanentemente#!\nLa reconoce como cultura constituyente\nLeales en el Estado objetivo\n#P +30 Mandato Cultural, +12 Cohesión Nacional#!"
 ve_targeted_project_start_instruction:0 "#Y Cómo iniciarlo#!\n1. Abra uno de sus propios estados.\n2. Presione #Y Iniciar proyecto#! en el panel de ese estado.\nLa cultura de destino y todo lo que aún falta se enumeran en la información sobre herramientas de ese botón."
 ve_targeted_project_state_requirements_tt:0 "El estado debe ser de nuestra propiedad y contener una cultura no primaria elegible que comprenda al menos el #Y 5%#! de su población. La cultura elegible más grande se convierte en el objetivo. Un cultivo ya completado en este Estado no puede ser objeto de nuevo ataque, pero sí puede serlo en otro Estado. También se deben cumplir los costos y requisitos del Modelo de Identidad actual."
 ve_targeted_cultural_project_target:0 "Objetivo: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! en #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Alcance: #Y Todo el país#!"
 ve_no_cultural_project_target:0 "Sin objetivo de proyecto"
 ve_no_active_cultural_project:0 "Sin proyecto cultural activo"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "COHESIVO - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "FRAGMENTADO - #N Aplica inestabilidad nacional#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% Tasa de reclutamiento y +3 Legitimidad#!."
 ve_civic_high_cohesion_effect:0 "#P +5% Calificaciones y +3 Legitimidad#!."
 ve_composite_high_cohesion_effect:0 "#P +5% de influencia y +3 de legitimidad#!."
 ve_identity_transition_backlash_notice:0 "Una reacción de transición de identidad aún está activa: el modelo no se puede cambiar nuevamente hasta que expire."
 ve_cultural_project_backlash_notice:0 "Un proyecto cancelado aún bloquea uno nuevo; la reacción de 2 años debe expirar primero."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Reacción de transición activa"
 ve_cultural_project_backlash_notice_short:0 "Reacción de cancelación activa"
 ve_targeted_project_start_instruction_short:0 "Inícielo desde uno de sus propios estados: abra el estado y presione #Y Iniciar Proyecto#!."
