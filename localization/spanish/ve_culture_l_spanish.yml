l_spanish:
 ve_national_identity:0 "Identidad nacional"
 ve_primary_cultures_label:0 "Culturas principales"
 ve_identity_models:0 "Modelos de identidad"
 ve_identity_model_active_footer:0 "Ya activo"
 ve_switch_identity_button:0 "Cambiar"
 ve_switch_identity_cost_label:0 "Cuesta #Y 200 Mandato cultural#!"
 ve_begin_project_button:0 "Iniciar proyecto"
 ve_identity_models_help:0 "Su nación siempre tiene exactamente un Modelo de identidad y #P ya está activo#!; no tiene que elegir nada aquí. El modelo solo decide cómo se obtiene la #Y Cohesión nacional#! y qué Proyecto cultural puede llevar a cabo.\n#Y El cambio es opcional:#! cuesta #Y 200 Mandato cultural#!, restablece la Cohesión a #Y 35#!, cancela cualquier Proyecto cultural en curso y bloquea otro cambio durante 5 años.\n#Y Pase el cursor sobre cualquier tarjeta o medidor para ver todos sus efectos.#!"
 ve_ethnic_identity_name:0 "Nación étnica"
 ve_civic_identity_name:0 "Nación cívica"
 ve_composite_identity_name:0 "Estado compuesto"
 ve_ethnic_identity_short:0 "La nación se define en torno a sus culturas principales.\nLa cohesión proviene del #Y dominio demográfico#!."
 ve_civic_identity_short:0 "Una nación política construida mediante la escolarización.\nLa cohesión proviene de la #Y alfabetización y las minorías aceptadas#!."
 ve_composite_identity_short:0 "Varios pueblos bajo instituciones negociadas.\nLa cohesión proviene de #Y una población genuinamente plural#!."
 ve_ethnic_identity_unlocks:0 "Desbloquea el proyecto #Y Campaña de integración étnica#!"
 ve_civic_identity_unlocks:0 "Desbloquea el proyecto #Y Iniciativa de igualdad ciudadana#!"
 ve_composite_identity_unlocks:0 "Desbloquea el proyecto #Y Pacto constituyente#!"
 ve_ethnic_identity_desc:0 "#header Nación étnica#!\nLa nación se define en torno a sus culturas principales.\n\n#Y Mientras esté activo#!\n#P +15% Asimilación, +5% Autoridad#!\n#N -5% Atracción migratoria, +5% Radicales por prejuicios abiertos#!\n\n#Y Cohesión#!\nAumenta cuando las culturas principales representan entre el 60 y el 75% de la población, y cae drásticamente por debajo del 40%.\n\n#Y A 75 de Cohesión#!\n#P +5% Tasa de reclutamiento, +3 Legitimidad#!\n\n#Y Proyecto cultural#!\nCampaña de integración étnica"
 ve_civic_identity_desc:0 "#header Nación cívica#!\nSe construye una nación política compartida mediante la educación y la participación.\n\n#Y Mientras esté activo#!\n#P +7% Atracción migratoria, +1% Acceso a la educación#!\n#N -10% Asimilación, -5% Autoridad, -50 Burocracia#!\n\n#Y Cohesión#!\nLa alfabetización la aumenta, pero cualquier cultura no principal que supere el 10% de la población con una Aceptación muy baja la reduce.\n\n#Y A 75 de Cohesión#!\n#P +5% Cualificaciones, +3 Legitimidad#!\n\n#Y Proyecto cultural#!\nIniciativa de igualdad ciudadana"
 ve_composite_identity_desc:0 "#header Estado compuesto#!\nVarios pueblos se gobiernan a través de instituciones negociadas.\n\n#Y Mientras esté activo#!\n#P -10% Radicales por borrado cultural y ciudadanía de segunda clase, +5% Influencia#!\n#N -15% Asimilación, -5% Autoridad, -75 Burocracia#!\n\n#Y Cohesión#!\nUna población genuinamente plural la aumenta; una población con más del 90% de culturas principales debilita este modelo.\n\n#Y A 75 de Cohesión#!\n#P +5% Influencia, +3 Legitimidad#!\n\n#Y Proyecto cultural#!\nPacto constituyente"
 ve_identity_change_cost_tt:0 "Cambiar el Modelo de identidad requiere #Y 200 Mandato cultural#! y ninguna Reacción por transición de identidad activa. El cambio restablece la Cohesión a #Y 35#!, provoca una #Y Reacción por transición de 5 años#! y cancela cualquier Proyecto cultural activo sin penalización adicional por cancelación."
 ve_cultural_mandate:0 "Mandato cultural"
 ve_culture_reform_point:0 "Mandato cultural"
 ve_cultural_mandate_hint:0 "Se gasta en Proyectos culturales. Ahorrarlo es seguro, pero los ingresos se reducen a la mitad a 400 y se detienen a 500."
 ve_culture_reform_point_tt:0 "#header Mandato cultural#!\nActual: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nCambio mensual: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y En qué se gasta#!\nProyectos culturales (75-150) y cambios de Modelo de identidad (200). Ninguno es obligatorio: ahorrar Mandato es seguro, los ingresos solo se reducen a la mitad a 400 y se detienen a 500.\n\n#Y Desglose mensual#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLegitimidad: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministración: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nSociedad del modelo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nEstabilidad y Movimientos culturales: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nAlineación de leyes: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nDoctrina de doctrina: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nMultiplicador de límite: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Doctrina — solo cuenta su Modelo de identidad actual#!\n#P Nación étnica#!: Nacionalista V #P +1#!\n#P Nación cívica#!: Reformista V #P +1#!; Académica V #P +1#!\n#P Estado compuesto#!: Reformista V #P +1#!\nEl total activo anterior tiene un límite de #Y +2#!.\n\nLa Nación cívica extrae el componente de la sociedad del modelo de la alfabetización, el Estado compuesto de la alfabetización en una sociedad plural y la Nación étnica de la fuerza demográfica de la cultura principal.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Cohesión nacional"
 ve_national_cohesion_hint:0 "Deriva hacia el equilibrio que produce su Modelo de identidad. A partir de 75 obtienes una bonificación, y con 25 o menos, inestabilidad."
 ve_national_cohesion_tt:0 "#header Cohesión nacional#!\nCurrent: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nEquilibrium: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMonthly movement: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nCommon conditions: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nIdentity-model conditions: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nCohesion moves 20% of the distance toward equilibrium each month, up to 5 points. Radical cultural movements reduce equilibrium by 10. At 75 or more the current model grants an additional benefit; at 25 or less national instability applies.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Sin efecto"
 ve_cultural_projects:0 "Proyectos culturales"
 ve_cultural_projects_intro:0 "Los Proyectos culturales son #Y opcionales#!. Solo uno puede estar activo a la vez: su costo en Mandato se paga de inmediato y se aplican #N -75 de Burocracia y -25 de Autoridad#! mientras dure. Completar un proyecto reembolsa parte del Mandato y aumenta la Cohesión. Los proyectos a escala nacional solo pueden repetirse una vez que expire su beneficio de finalización; un objetivo de Estado/Cultura completado no puede volver a seleccionarse.\n#Y Pasa el ratón por cualquier tarjeta o medidor para ver sus efectos completos.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Proyecto en curso"
 ve_cultural_project_progress:0 "Progreso del proyecto"
 ve_cultural_project_progress_tt:0 "#header Monthly Project Progress#!\nCurrent: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nRemaining: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nMonthly total: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (minimum 1, maximum 7)\n\n#Y Monthly breakdown#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministration: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nModel Society: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nCohesion: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nCultural Movements: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nTarget-State Turmoil: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nIdea Groups: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Idea Groups — only bonuses matching your current Identity Model are active#!\n#P Nación étnica#!: Nationalist VII #P +1#!\n#P Nación cívica#!: Reformist VII, Academic VII, or Welfare VI — #P +1#! each\n#P Estado compuesto#!: Reformist VII or Diplomatic VI — #P +1#! each\nThe active Idea Group total above is capped at #Y +2#!; any further matching bonuses do not increase progress.\n\nModel Society rewards civic literacy, ethnic demographic concentration, or composite diversity according to the active Identity Model. Completion is resolved on the next monthly update after progress reaches #Y 100#!."
 ve_cancel_cultural_project_button:0 "Cancelar proyecto"
 ve_cancel_cultural_project_tt:0 "#header Cancelar proyecto cultural#!\nEl Mandato cultural invertido #N no se reembolsa#!. La Cohesión nacional se reduce en #N 5#! y una #N reacción de 2 años#! impide iniciar otro proyecto."
 ve_start_cultural_project_button:0 "Iniciar proyecto"
 ve_national_curriculum_name:0 "Plan de estudios nacional"
 ve_national_curriculum_cost:0 "Costo: #Y 100 Mandato cultural#!"
 ve_national_curriculum_short:0 "Una reforma escolar en todo el país.\n#P +20 Mandato, +5 Cohesión#!, seguido de una mejor educación."
 ve_national_curriculum_desc:0 "#header Plan de estudios nacional#!\nUna reforma escolar llevada a cabo en todo el país.\n\n#Y Costo#!\n#Y 100 Mandato cultural#!, pagado de inmediato\n\n#Y Al completarse#!\n#P +20 Mandato cultural, +5 Cohesión nacional#!\n\n#Y Durante los 10 años siguientes#!\n#P +2% Acceso a la educación, +5% Cualificaciones#!\n#N -25 Burocracia#!"
 ve_national_curriculum_requirements_tt:0 "Requiere #Y 100 Mandato cultural#!, ningún Proyecto cultural activo y ninguna Reacción de proyecto. Tampoco puede iniciarse mientras el beneficio del anterior #Y Plan de estudios nacional#! esté activo."
 ve_shared_symbols_name:0 "Símbolos compartidos"
 ve_shared_symbols_cost:0 "Costo: #Y 75 Mandato cultural#!"
 ve_shared_symbols_short:0 "Banderas, himnos y ceremonias públicas.\n#P +20 Mandato, +7 Cohesión#!, seguido de lealistas y Autoridad."
 ve_shared_symbols_desc:0 "#header Símbolos compartidos#!\nBanderas, himnos y ceremonias públicas promovidas en todo el país.\n\n#Y Costo#!\n#Y 75 Mandato cultural#!, pagado de inmediato\n\n#Y Al completarse#!\n#P +20 Mandato cultural, +7 Cohesión nacional#!\n\n#Y Durante los 8 años siguientes#!\n#P +10% Lealistas de Colectivos plenamente Aceptados, +25 Autoridad#!"
 ve_shared_symbols_requirements_tt:0 "Requiere #Y 75 Mandato cultural#!, ningún Proyecto cultural activo y ninguna Reacción de proyecto. Tampoco puede iniciarse mientras el beneficio de los anteriores #Y Símbolos compartidos#! esté activo."
 ve_ethnic_campaign_name:0 "Campaña de integración étnica"
 ve_ethnic_campaign_cost:0 "Costo: #Y 125 Mandato cultural#!"
 ve_ethnic_campaign_short:0 "Asimilar a una gran minoría en un Estado.\n#P +25 Mandato, +8 Cohesión#!, pero genera radicales."
 ve_ethnic_campaign_desc:0 "#header Campaña de integración étnica#!\nLlévese a cabo en un solo Estado contra su cultura no principal más grande, la cual debe constituir al menos el #Y 5%#! de la población de dicho Estado.\n\n#Y Coste#!\n#Y 125 Mandato cultural#!, pagado de inmediato\n\n#Y Al completarse#!\nAsimila el #Y 5%#! de la cultura objetivo en una cultura principal, o el #Y 7%#! con Nacionalista VII\n#P +25 Mandato cultural, +8 Cohesión nacional#!\nDeja un programa de asimilación de #Y 10 años#! en el Estado\n\n#Y Advertencia#!\n#N Tanto iniciar como finalizar el proyecto genera radicales entre la cultura objetivo.#!"
 ve_civic_initiative_name:0 "Iniciativa de igualdad ciudadana"
 ve_civic_initiative_cost:0 "Coste: #Y 100 Mandato cultural#!"
 ve_civic_initiative_short:0 "Eleva la Aceptación de una minoría en un Estado.\n#P +25 Mandato, +10 Cohesión#!, además de lealistas."
 ve_civic_initiative_desc:0 "#header Iniciativa de igualdad ciudadana#!\nLlévese a cabo en un solo Estado sobre su cultura no principal más grande, la cual debe constituir al menos el #Y 5%#! de la población de dicho Estado.\n\n#Y Coste#!\n#Y 100 Mandato cultural#!, pagado de inmediato\n\n#Y Al completarse#!\n#P +15 Aceptación para dicha cultura durante 10 años#!\nLealistas en el Estado objetivo\n#P +25 Mandato cultural, +10 Cohesión nacional#!\nDiez años de Cualificaciones y Atracción migratoria mejoradas"
 ve_composite_compact_name:0 "Pacto constituyente"
 ve_composite_compact_cost:0 "Coste: #Y 150 Mandato cultural#! y #Y 40 Cohesión#!"
 ve_composite_compact_short:0 "Reconoce a una minoría como una cultura constituyente.\n#P +30 Mandato, +12 Cohesión#!, de forma permanente."
 ve_composite_compact_desc:0 "#header Pacto constituyente#!\nLlévese a cabo en un solo Estado sobre una cultura no principal no reconocida que constituya al menos el #Y 5%#! de la población de dicho Estado.\n\n#Y Coste#!\n#Y 150 Mandato cultural#!, pagado de inmediato, y al menos #Y 40 Cohesión nacional#!\n\n#Y Al completarse#!\n#P +15 Aceptación para dicha cultura, de forma permanente#!\nLa reconoce como una cultura constituyente\nLealistas en el Estado objetivo\n#P +30 Mandato cultural, +12 Cohesión nacional#!"
 ve_targeted_project_start_instruction:0 "#Y Cómo iniciarlo#!\n1. Abra uno de sus propios Estados.\n2. Pulse #Y Iniciar proyecto#! en el panel de dicho Estado.\nLa cultura objetivo y cualquier requisito restante se detallan en la información sobre herramientas de dicho botón."
 ve_targeted_project_state_requirements_tt:0 "El estado debe ser de nuestra propiedad y contener una cultura no principal elegible que comprenda al menos el #Y 5%#! de su población. La cultura elegible más grande se convierte en el objetivo. Una cultura que ya se haya completado en este Estado no puede ser objetivo de nuevo, pero sí puede serlo en otro Estado. También deben cumplirse el coste y los requisitos del Modelo de identidad actual."
 ve_targeted_cultural_project_target:0 "Objetivo: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! en #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Alcance: #Y Todo el país#!"
 ve_no_cultural_project_target:0 "Sin objetivo de proyecto"
 ve_no_active_cultural_project:0 "Sin proyecto cultural activo"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "COHESIVO - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "FRAGMENTADO - #N se aplica inestabilidad nacional#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% Tasa de reclutamiento y +3 Legitimidad#!."
 ve_civic_high_cohesion_effect:0 "#P +5% Cualificaciones y +3 Legitimidad#!."
 ve_composite_high_cohesion_effect:0 "#P +5% Influencia y +3 Legitimidad#!."
 ve_identity_transition_backlash_notice:0 "Una reacción a la transición de identidad sigue activa; el modelo no se puede volver a cambiar hasta que expire."
 ve_cultural_project_backlash_notice:0 "Un proyecto cancelado sigue bloqueando uno nuevo; la reacción de 2 años debe expirar primero."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Reacción de transición activa"
 ve_cultural_project_backlash_notice_short:0 "Reacción de cancelación activa"
 ve_targeted_project_start_instruction_short:0 "Inícielo desde uno de sus propios Estados: abra el Estado y pulse #Y Iniciar proyecto#!."
