l_polish:
 ve_tag_flavor_delayed_result_tt:0 "Konsekwencje tego wyboru instytucjonalnego będą widoczne za około rok."
 ve_tag_flavor_free_route_tt:0 "Ta trasa nie wymaga Wglądu Narodowego, Mandatu Kulturalnego ani Reformy Pobożności."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Wspólny leksykon obywatelski"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Wspólne słownictwo oficjalne wprowadza reformy do szkół i urzędów prowincji, ale ciągłe wyjaśnienia pochłaniają władzę centralną."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Święta ciągłość"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "Reformę przeprowadzono w oparciu o odziedziczone instytucje religijne, wzmacniając dowództwo, jednocześnie zawężając kanały, którymi krążą obce metody."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Tłumaczenia administracyjne"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "Biurokracja przekłada reformę na znaną procedurę. Administracja staje się bardziej stabilna, ale zmiany legislacyjne tracą pewną prędkość."
 ve_tag_flavor.1.t:0 "Język reformy"
 ve_tag_flavor.1.d:0 "Dekret może opuścić stolicę w nienagannej prozie, a mimo to dotrzeć do szkoły, sądu, urzędu wojewódzkiego lub fundacji religijnej jako cztery różne instrukcje. Reformatorzy domagają się obecnie wspólnego słownictwa. Pytanie brzmi, czyje instytucje nadadzą temu słownictwu znaczenie."
 ve_tag_flavor.1.a:0 "Narysuj wspólny leksykon obywatelski."
 ve_tag_flavor.1.a.tt:0 "Wymaga narodu obywatelskiego lub państwa złożonego.\nWydaj #N 20 mandatów kulturowych#! teraz.\nPo około roku: zyskaj #P 8 Wnikliwości Krajowej#! i #P 3 Spójność narodowa#!, a następnie zyskać #P +1% Dostęp do edukacji#! I #N -25 Uprawnienia#! na 24 miesiące."
 ve_tag_flavor.1.b:0 "Ugruntuj reformę w świętej ciągłości."
 ve_tag_flavor.1.b.tt:0 "Wymaga konfesyjnego modelu religijnego.\nWydaj #N 20 Reformy pobożności#! teraz.\nPo około roku: zyskaj #P 8 Wnikliwości narodowej#! i #P 3 Osada Religijna#!, następnie zyskaj #P +25 Autorytetu#! i #N -2,5% Rozprzestrzeniania Technologii#! na 24 miesiące."
 ve_tag_flavor.1.c:0 "Niech każde biuro przetłumaczy rozkaz."
 ve_tag_flavor.1.c.tt:0 "Po około roku: zyskaj #P 4 Wgląd narodowy#!, następnie zyskaj #P +25 Biurokracji#! i #N -2,5% Szybkość uchwalania prawa#! przez 24 miesiące."
 ve_tag_flavor.2.t:0 "Słowa stają się procedurą"
 ve_tag_flavor.2.d:0 "Rok okólników, komentarzy, podręczników szkolnych, kazań i korespondencji prowincjonalnej nadał programowi reform język roboczy. Nie jest to idealnie jednolite, ale urzędnicy wiedzą już, które sformułowania budzą zgodę, a które nadal ukrywają różnicę zdań."
 ve_tag_flavor.2.a:0 "Słownictwo wchodzi do machiny państwowej."
 ve_tag_flavor.2.a.tt:0 "Wynik wybrany rok temu teraz obowiązuje. Zmiany zasobów są ograniczone do normalnych limitów, a modyfikator instytucjonalny trwa 24 miesiące. "
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Biura tłumaczeń"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Urzędy specjalistyczne przyspieszają obieg obcych metod, choć ich autonomia osłabia bezpośrednie dowództwo ośrodka."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Pożyczka kierowana"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Instytucje importowane są reorganizowane pod kierownictwem centralnym. Władza zostaje zachowana, ale każda reforma przechodzi oficjalnymi kanałami dłużej."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Adopcja selektywna"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "Państwo dopuszcza jedynie metody, które można pogodzić z ustaloną władzą, zamieniając prędkość rozprzestrzeniania się na kontrolę polityczną."
 ve_tag_flavor.10.t:0 "Metody zapożyczone, rodzimy autorytet"
 ve_tag_flavor.10.d:0 "Zagraniczne podręczniki, maszyny, plany szkolne i tablice administracyjne docierają szybciej, niż jakiekolwiek ministerstwo jest w stanie je ocenić. Niektórzy urzędnicy żądają stałych biur tłumaczeń; inni nalegają, aby każda pożyczona instytucja została przebudowana pod kierownictwem centralnym. Trzecia frakcja przyznałaby tylko to, co można wchłonąć bez zakłócania ustalonego porządku."
 ve_tag_flavor.10.a:0 "Załóż biura tłumaczeń."
 ve_tag_flavor.10.a.tt:0 "Wymaga pomysłu akademickiego IV lub pomysłu na infrastrukturę IV.\nWydaj #N 15 National Insight#! teraz.\nPo około roku: zyskaj #P 10 Era Momentum#!, następnie zyskaj #P +2,5% rozprzestrzenienia technologii#! i #N -25 autorytetu#! na 24 miesiące."
 ve_tag_flavor.10.b:0 "Pożyczaj tylko pod kierownictwem centralnym."
 ve_tag_flavor.10.b.tt:0 "Wymaga Japońskiej Idei Narodowej IV.\nWydaj #N 10 Wnikliwości Narodowej#! teraz.\nPo około roku: zyskaj #P 7 Era Momentum#!, następnie zyskaj #P +25 Autorytetu#! i #N -2,5% Szybkość uchwalania prawa#! na 24 miesiące."
 ve_tag_flavor.10.c:0 "Przyjmij selektywnie i zachowaj polecenie."
 ve_tag_flavor.10.c.tt:0 "Po około roku: zyskaj #P 3 Era Momentum#!, następnie zyskaj #P +25 Autorytetu#! i #N -2,5% Spreadu Technologicznego#! na 24 miesiące."
 ve_tag_flavor.11.t:0 "Metody stworzone przez nas"
 ve_tag_flavor.11.d:0 "Rok tłumaczenia, testowania, przeredagowania i oficjalnych argumentów oddzielił nowość od użyteczności. Przyjęte metody nie pojawiają się już jako instrukcje obce; weszli do słownika poleceń państwa."
 ve_tag_flavor.11.a:0 "Użyj tego, co przetrwało badanie."
 ve_tag_flavor.11.a.tt:0 "Wynik wybrany rok temu teraz obowiązuje. Era Momentum zachowuje swój normalny poziom zerowy, a modyfikator instytucjonalny trwa 24 miesiące."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Porozumienie obywatelskie"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Wspólny język obywatelstwa ułatwia przybycie i uczestnictwo, ale wyjaśnianie porozumienia w każdej jurysdykcji pochłania władzę centralną."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Okazja złożona"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "Administracja federalna uczy się negocjować między społecznościami składowymi, wzmacniając urzędy, jednocześnie zmniejszając presję na jedną formę kulturową."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Federalna niejednoznaczność"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Celowa dwuznaczność poszerza głos dyplomatyczny Unii, ale na pewien czas obniża równowagę spójności narodowej o 2."
 ve_tag_flavor.20.t:0 "Znaczenie Unii"
 ve_tag_flavor.20.d:0 "Nowo przybyli, uznane państwa i społeczności o różnych zwyczajach publicznych odwołują się do Unii na swój własny sposób. Ustawodawcy zgadzają się, że potrzebna jest wspólna formuła, ale nie zastanawiają się, czy powinna ona definiować indywidualne obywatelstwo, chronić umowę między społecznościami składowymi, czy też powinna pozostać na tyle szeroka, aby każda jurysdykcja mogła ją interpretować."
 ve_tag_flavor.20.a:0 "Napisz pakt obywatelski."
 ve_tag_flavor.20.a.tt:0 "Wymaga Narodu Obywatelskiego.\nWydaj #N 20 Mandatów Kulturalnych#! teraz.\nPo około roku: zyskaj #P 8 Wnikliwości Krajowej#! oraz #P 3 Spójność narodowa#!, następnie zyskaj #P +2,5% atrakcyjności migracyjnej#! i #N -25 uprawnień#! na 24 miesiące."
 ve_tag_flavor.20.b:0 "Negocjuj umowę złożoną."
 ve_tag_flavor.20.b.tt:0 "Wymaga stanu złożonego.\nWydaj #N 20 Mandat kulturalny#! teraz.\nPo około roku: zyskaj #P 8 Wglądu Narodowego#! i #P 3 Spójność narodową#!, następnie zyskaj #P +25 Biurokracji#! i #N 2,5% Asymilacji#! na 24 miesiące."
 ve_tag_flavor.20.c:0 "Pozostaw celowo szeroką formułę federalną."
 ve_tag_flavor.20.c.tt:0 "Po około roku: zyskaj #P 4 National Insight#! i #P +25 Wpływów#! przez 24 miesiące. Gdy modyfikator jest aktywny, równowaga spójności narodowej jest #N 2 niższe#!."
 ve_tag_flavor.21.t:0 "Formuła na Unię"
 ve_tag_flavor.21.d:0 "Rok konwencji, raportów komisji, uchwał państw i publicznych argumentów stworzył język, którym mogą posługiwać się instytucje. Jej milczenie jest równie istotne jak deklaracje, określające, które spory rozstrzyga Unia, a które pozostawia negocjacjom."
 ve_tag_flavor.21.a:0 "Niech formuła wejdzie do życia publicznego."
 ve_tag_flavor.21.a.tt:0 "Wynik wybrany rok temu teraz obowiązuje. Zmiany zasobów są ograniczone do normalnych limitów, a modyfikator instytucjonalny trwa 24 miesiące."
