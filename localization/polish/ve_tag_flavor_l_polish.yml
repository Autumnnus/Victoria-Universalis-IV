l_polish:
 ve_tag_flavor_delayed_result_tt:0 "Konsekwencje tego wyboru instytucjonalnego ujawnią się za około rok."
 ve_tag_flavor_free_route_tt:0 "Ta ścieżka nie zużywa Rozpoznania narodowego, Mandatu kulturowego ani Funduszu religijnego."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Wspólny leksykon obywatelski"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Wspólne słownictwo urzędowe niesie reformę do szkół i urzędów prowincjonalnych, lecz ciągłe wyjaśnianie zużywa centralne Zwierzchnictwo."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Uświęcona ciągłość"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "Reformę ujęto w ramy odziedziczonych instytucji religijnych, co wzmacnia Dowództwo, jednocześnie zwężając kanały, którymi krążą obcy metody."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Przekład administracyjny"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "Biurokracja przekłada reformę na znajomą procedurę. Administracja staje się stabilniejsza, ale zmiany legislacyjne tracą na tempie."
 ve_tag_flavor.1.t:0 "Język reform"
 ve_tag_flavor.1.d:0 "Dekret może opuścić stolicę w nienagannej prozie, a mimo to dotrzeć do szkoły, sądu, urzędu prowincjonalnego czy fundacji religijnej jako cztery różne polecenia. Reformatorzy żądają obecnie wspólnego słownictwa. Pytanie brzmi, czyje instytucje nadadzą temu słownictwu znaczenie."
 ve_tag_flavor.1.a:0 "Sporządzić wspólny leksykon obywatelski."
 ve_tag_flavor.1.a.tt:0 "Wymaga Państwa obywatelskiego lub Państwa złożonego.\nZużywa #N 20 Mandat kulturowy#! obecnie.\nPo około roku: zyskaj #P 8 Rozpoznanie narodowe#! oraz #P 3 Spójność narodowa#!, a następnie zyskaj #P +1% Dostęp do edukacji#! i #N -25 Zwierzchnictwo#! na 24 miesiące."
 ve_tag_flavor.1.b:0 "Orzeć reformę w uświęconej ciągłości."
 ve_tag_flavor.1.b.tt:0 "Wymaga modelu wyznaniowego: Wyznaniowy.\nZużywa #N 20 Fundusz religijny#! obecnie.\nPo około roku: zyskaj #P 8 Rozpoznanie narodowe#! oraz #P 3 Ugoda wyznaniowa#!, a następnie zyskaj #P +25 Zwierzchnictwo#! i #N -2,5% Rozpowszechnianie technologii#! na 24 miesiące."
 ve_tag_flavor.1.c:0 "Pozwolić każdemu urzędowi przetłumaczyć rozkaz."
 ve_tag_flavor.1.c.tt:0 "Po około roku: zyskaj #P 4 Rozpoznanie narodowe#!, a następnie zyskaj #P +25 Biurokracja#! i #N -2,5% Tempo ustanawiania prawa#! na 24 miesiące."
 ve_tag_flavor.2.t:0 "Słowa stają się procedurą"
 ve_tag_flavor.2.d:0 "Rok okólników, komentarzy, podręczników szkolnych, kaznań i korespondencji prowincjonalnej dał programowi reform język roboczy. Nie jest on idealnie jednolity, ale urzędnicy wiedzą już, które sformułowania nakazują zgodę – a które nadal skrywają nieporozumienie."
 ve_tag_flavor.2.a:0 "Słownictwo wstępuje w machinę państwa."
 ve_tag_flavor.2.a.tt:0 "Skutek wybrany rok temu wchodzi w życie. Zmiany zasobów zostają ograniczone do normalnych limitów, a modyfikator instytucjonalny utrzymuje się przez 24 miesiące."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Biura tłumaczeń"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Wydziały specjalistyczne przyspieszają obieg obcych metod, choć ich autonomia osłabia bezpośrednie Dowództwo centrum."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Kierowane zapożyczanie"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Importowane instytucje są reorganizowane pod kierunkiem centralnym. Zwierzchnictwo zostaje zachowane, ale każda reforma potrzebuje więcej czasu na przejście przez kanały urzędowe."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Wybiórcze przyjmowanie"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "Państwo dopuszcza jedynie metody, które można pogodzić z ugruntowanym zwierzchnictwem, wymieniając szybkość dyfuzji na kontrolę polityczną."
 ve_tag_flavor.10.t:0 "Zapożyczone metody, rodzime zwierzchnictwo"
 ve_tag_flavor.10.d:0 "Obce podręczniki, maszyny, plany szkół i tablice administracyjne docierają szybciej, niż jakiekolwiek ministerstwo może je ocenić. Niektórzy urzędnicy domagają się stałych urzędów tłumaczeń; inni upierają się, aby każdą zapożyczoną instytucję przekształcić pod centralnym kierunkiem. Trzecia frakcja dopuszczałaby jedynie to, co można przyswoić bez naruszania ugruntowanego porządku."
 ve_tag_flavor.10.a:0 "Utworzyć biura tłumaczeń."
 ve_tag_flavor.10.a.tt:0 "Wymaga doktryny Akademizm IV lub Doktryny infrastrukturalne IV.\nZużywa #N 15 Rozpoznanie narodowe#! obecnie.\nPo około roku: zyskaj #P 10 Rozpęd epoki#!, a następnie zyskaj #P +2,5% Rozpowszechnianie technologii#! i #N -25 Zwierzchnictwo#! na 24 miesiące."
 ve_tag_flavor.10.b:0 "Zapożyczać wyłącznie pod centralnym kierunkiem."
 ve_tag_flavor.10.b.tt:0 "Wymaga japońskiej doktryny narodowej IV.\nZużywa #N 10 Rozpoznanie narodowe#! obecnie.\nPo około roku: zyskaj #P 7 Rozpęd epoki#!, a następnie zyskaj #P +25 Zwierzchnictwo#! i #N -2,5% Tempo ustanawiania prawa#! na 24 miesiące."
 ve_tag_flavor.10.c:0 "Przyjmować wybiórczo i zachować dowództwo."
 ve_tag_flavor.10.c.tt:0 "Po około roku: zyskaj #P 3 Rozpęd epoki#!, a następnie zyskaj #P +25 Zwierzchnictwo#! i #N -2,5% Rozpowszechnianie technologii#! na 24 miesiące."
 ve_tag_flavor.11.t:0 "Metody uczynione naszymi własnymi"
 ve_tag_flavor.11.d:0 "Rok tłumaczeń, testów, redagowania i oficjalnych sporów oddzielił nowość od użyteczności. Przyjęte metody nie wydają się już obcymi instrukcjami; wszły do własnego słownictwa Dowództwa państwa."
 ve_tag_flavor.11.a:0 "Użyć tego, co przetrwało badanie."
 ve_tag_flavor.11.a.tt:0 "Skutek wybrany rok temu wchodzi w życie. Rozpęd epoki zachowuje swoje zwykłe zerowe minimum, a modyfikator instytucjonalny trwa 24 miesiące."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Pakt o obywatelstwie"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Wspólny język obywatelstwa ułatwia przybycie i uczestnictwo, lecz wyjaśnianie paktu w każdym okręgu jurysdykcyjnym zużywa centralne Zwierzchnictwo."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Kompromis państwa złożonego"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "Administracja federalna uczy się negocjować pomiędzy społecznościami konstytuującymi państwo, wzmacniając urzędy i zmniejszając jednocześnie presję w stronę jednolitej formy kulturowej."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Ambiwalencja federalna"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Celowa ambiwalencja poszerza głos dyplomatyczny Unii, lecz przez pewien czas obniża równowagę spójności narodowej o 2."
 ve_tag_flavor.20.t:0 "Znaczenie Unii"
 ve_tag_flavor.20.d:0 "Nowi przybysze, ugruntowane obszary administracyjne oraz społeczności o odmiennych zwyczajach publicznych odwołują się do Unii na własnych warunkach. Ustawodawcy zgadzają się, że potrzebna jest wspólna formuła, lecz nie co do tego, czy powinna ona definiować obywatelstwo, zachować kompromis pomiędzy społecznościami konstytuującymi państwo, czy też pozostać na tyle szeroką, by każda jurysdykcja mogła ją interpretować."
 ve_tag_flavor.20.a:0 "Spisać pakt o obywatelstwie."
 ve_tag_flavor.20.a.tt:0 "Wymaga państwa obywatelskiego.\nWydaj #N 20 Mandatu kulturowego#! teraz.\nPo około roku: zyskaj #P 8 Rozpoznania narodowego#! oraz #P 3 Spójności narodowej#!, a następnie zyskaj #P +2,5% Atrakcyjności migracji#! oraz #N -25 Zwierzchnictwa#! na 24 miesiące."
 ve_tag_flavor.20.b:0 "Wynegocjować kompromis państwa złożonego."
 ve_tag_flavor.20.b.tt:0 "Wymaga państwa złożonego.\nWydaj #N 20 Mandatu kulturowego#! teraz.\nPo około roku: zyskaj #P 8 Rozpoznania narodowego#! oraz #P 3 Spójności narodowej#!, a następnie zyskaj #P +25 Biurokracji#! oraz #N -2,5% Asymilacji#! na 24 miesiące."
 ve_tag_flavor.20.c:0 "Pozostawić formułę federalną celowo szeroką."
 ve_tag_flavor.20.c.tt:0 "Po około roku: zyskaj #P 4 Rozpoznania narodowego#! oraz #P +25 Wpływu#! na 24 miesiące. Gdy modyfikator jest aktywny, równowaga spójności narodowej jest #N o 2 niższa#!."
 ve_tag_flavor.21.t:0 "Formuła dla Unii"
 ve_tag_flavor.21.d:0 "Rok konwencji, raportów komitetów, rezolucji obszarów administracyjnych oraz publicznych sporów przyniósł sformułowania, z których mogą korzystać instytucje. Ich przemilczenia mają równie doniosłe znaczenie co deklaracje, określając, które spory Unia rozstrzyga, a które pozostawia do negocjacji."
 ve_tag_flavor.21.a:0 "Pozwolić, aby formuła wszła w życie publiczne."
 ve_tag_flavor.21.a.tt:0 "Wybrany rok temu rezultat wchodzi teraz w życie. Zmiany zasobów zostają ograniczone do normalnych limitów, a modyfikator instytucjonalny trwa 24 miesiące."
