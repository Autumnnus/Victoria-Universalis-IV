 ve_je_era_crossroads_age_2_route_3_status:0 "#Y Integrated Nation#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesiące#!\nPostęp miesięczny: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel transformacji gospodarczej i cel legitymizacji charakteryzujący się niskim poziomem zamieszania, zapewniony w tej Erze.\n\nCel: ​​osiągnięcie 60 Postępu dla #P +50 Pęd Ery#!. Kamienie milowe na poziomie 20 i 40 postępów zapewniają wsparcie finansowane przez National Insight."
 ve_je_era_crossroads_age_3:0 "Zmobilizowane społeczeństwo"
 ve_je_era_crossroads_age_3_reason:0 "Polityka masowa i wojna totalna sprawiają, że obywatelstwo, przemysł i gotowość strategiczna są częścią tego samego narodowego porozumienia."
