 ve_je_era_crossroads_age_1_route_3_status:0 "#Y Stan administracyjny#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesiące#!\nPostęp miesięczny: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel legitymizacji i biurokracji oraz niezależny cel stabilności zapewniony w tej Erze.\n\nCel: osiągnięcie 60 postępu dla #P +50 Pędów Ery#!. Kamienie milowe na poziomie 20 i 40 lat Postęp zapewniają wsparcie finansowane przez National Insight."
