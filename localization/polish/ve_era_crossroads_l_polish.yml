 ve_je_era_crossroads_age_3_route_2_status:0 "#Y Dowództwo strategiczne#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesiące#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: nowoczesny cel w zakresie składu sił i cel osiągnięcia wielkiej mocy zabezpieczony w tej Epoce.\n\nCel: ​​osiągnięcie 60 Postępu dla #P +50 Pędu Ery#!. Kamienie milowe w wieku 20 i 40 lat zapewniają wsparcie finansowane przez National Insight."
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y Arsenal Society#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesiące#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel przemysłu elektrycznego i cel masowego zbrojenia zabezpieczony w tej Epoce.\n\nCel: ​​osiągnięcie 60 Postępu dla #P +50 Tempa Ery#!. Kamienie milowe na poziomie 20 i 40 postępów zapewniają wsparcie finansowane przez National Insight."

 ve_era_crossroads.1.t:0 "Steam i państwo"
 ve_era_crossroads.1.d:0 "Koleje, szkoły, reformatorzy i administratorzy oferują konkurencyjne wersje współczesnego narodu. Rząd musi zdecydować, jakie relacje między społeczeństwem a państwem zorganizują pierwszą erę."
 ve_era_crossroads.1.a:0 "Połącz kraj poprzez sieć Steam."
 ve_era_crossroads.1.b:0 "Buduj wykształcone obywatelstwo."
 ve_era_crossroads.1.c:0 "Skonsolidować państwo administracyjne."
 ve_era_crossroads.1.d.option:0 "W tej epoce nie potrzeba krajowych skrzyżowań."
 ve_era_crossroads.1.a.tt:0 "Uruchamia #Y Sieć Steam#! trasa (Fokus: Industrializacja, migracja chłopów i koleje).\n • Cel: Osiągnij 60 postępów do zdobycia #P +50 Pęd Ery#!.\n • Szybkość postępu: Zyskuje +1 podstawowy miesięczny postęp plus +1 dodatkowy za każdą ukończoną kotwicę Ery 1 (cele Udział Chłopski i Kolej).\n • Synergia Doktryny: Posiadanie #Y Przemysłowiec IV#! or #Y Infrastruktura IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Insight zamiast 10)."
 ve_era_crossroads.1.b.tt:0 "Rozpoczyna się #Y Wykształcone obywatelstwo#! trasy (Fokus: edukacja, umiejętność czytania i pisania i darmowa praca).\n • Cel: Osiągnij 60. Postęp do zdobycia #P +50 Pęd Ery#!.\n • Szybkość postępu: Zyskuje +1 podstawowy miesięczny postęp plus +1 dodatkowy za każdą ukończoną kotwicę Ery 1 (cele Bezpłatna praca i umiejętność czytania i pisania/Szkoły).\n • Synergia doktryn: Posiadanie #Y Akademicki IV#! or #Y Reformist IV#! odblokowuje tańsze decyzje związane z kamieniami milowymi (5 Insight zamiast 10)."
 ve_era_crossroads.1.c.tt:0 "Uruchamia #Y Państwo administracyjne#! trasy (Fokus: legitymizacja rządu, biurokracja i stabilność).\n • Cel: osiągnąć 60. Postęp do zdobycia #P +50 Pęd Ery#!.\n • Szybkość postępu: Zyskuje +1 podstawowy miesięczny postęp plus +1 dodatkowy za każdą ukończoną kotwicę Epoki 1 (cele Legitymacja/Biurokracja i Niezależna stabilność).\n • Synergia doktryn: Posiadanie #Y Biurokratyczny IV#! or #Y Parlamentarny IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Insight zamiast 10)."
 ve_era_crossroads.2.t:0 "Imperium czy społeczeństwo masowe?"
 ve_era_crossroads.2.d:0 "Państwo nie może już traktować zasięgu zagranicznego, dobrobytu społecznego i integracji narodowej jako odrębnych kwestii. Jeden z nich określi sposób realizacji pozostałych."
 ve_era_crossroads.2.a:0 "Spójrz w stronę imperialnego horyzontu."
 ve_era_crossroads.2.b:0 "Skonstruuj system powszechnego dobrobytu."
 ve_era_crossroads.2.c:0 "Utwórz zintegrowany naród."
 ve_era_crossroads.2.d.option:0 "Niech epoka znajdzie swój własny kierunek."
 ve_era_crossroads.2.a.tt:0 "Rozpoczyna się #Y Horyzont Imperialny#! trasy (Fokus: władza dyplomatyczna i zasięg zamorski).\n • Cel: osiągnąć 60 postępów do zdobycia #P +50 Pęd Ery#!.\n • Szybkość postępu: Zyskuje +1 podstawowy miesięczny postęp plus +1 dodatkowy za każdą ukończoną kotwicę Ery 2 (cele uznanej pojemności państwa i portów/zainteresowań).\n • Synergia doktryn: posiadanie #Y Dyplomatyczny IV#! or #Y Kolonialny IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Insight zamiast 10)."
 ve_era_crossroads.2.b.tt:0 "Rozpoczyna się #Y Dobrobyt masowy#! trasy (Fokus: instytucje społeczne, opieka zdrowotna i edukacja).\n • Cel: osiągnąć 60. Postęp do zdobycia #P +50 Pęd Ery#!.\n • Szybkość postępu: Zyskuje +1 podstawowy miesięczny postęp plus +1 dodatkowy za każdą ukończoną kotwicę Ery 2 (cele Umiejętność czytania i pisania/Szkoły i instytucje społeczne).\n• Synergia doktryn: Posiadanie #Y Dobrobytu IV#! lub #Y Reformist IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Insight zamiast 10)."
 ve_era_crossroads.2.c.tt:0 "Uruchamia #Y Zintegrowany Naród#! trasy (Fokus: Transformacja Gospodarcza i Stabilność Wewnętrzna).\n • Cel: Osiągnij 60 postępów do zdobycia #P +50 Pęd Ery#!.\n • Szybkość postępu: Zyskuje +1 podstawowy miesięczny postęp plus +1 dodatkowy za każdą ukończoną kotwicę Ery 2 (cele Transformacja gospodarcza i Legitymacja przy niskim poziomie zamieszania).\n • Synergia doktryn: Posiadanie #Y Nacjonalista IV#! lub #Y Praca IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Insight zamiast 10)."
 ve_era_crossroads.3.t:0 "Zmobilizowane społeczeństwo"
 ve_era_crossroads.3.d:0 "Polityka masowa, dowodzenie strategiczne i mobilizacja przemysłu docierają teraz do każdej instytucji. Ostatni wiek wymaga wyboru, która forma mobilizacji zdefiniuje naród."
 ve_era_crossroads.3.a:0 "Zaangażuj się w Republikę Socjalną."
 ve_era_crossroads.3.b:0 "Umieść naród pod dowództwem strategicznym."
 ve_era_crossroads.3.c:0 "Zbuduj społeczeństwo Arsenał."
 ve_era_crossroads.3.d.option:0 "Odrzuć trwały projekt mobilizujący."
 ve_era_crossroads.3.a.tt:0 "Rozpoczyna się #Y Republika Socjalna#! trasy (Fokus: Polityka masowa i instytucje społeczne).\n • Cel: Osiągnij 60. Postęp do zdobycia #P +50 Pęd Ery#!.\n • Szybkość postępu: Zyskuje +1 podstawowy miesięczny postęp plus +1 dodatkowy za każdą ukończoną kotwicę Ery 3 (cele Polityka masowa i Dojrzałe instytucje społeczne).\n • Synergia doktryn: Posiadanie #Y Parlamentarny IV#! lub #Y Dobrobyt IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Insight zamiast 10)."
 ve_era_crossroads.3.b.tt:0 "Rozpoczyna się #Y Dowództwo strategiczne#! trasy (Fokus: modernizacja wojskowa i globalny zasięg władzy).\n • Cel: osiągnięcie 60 postępów do zdobycia #P +50 Pęd Ery#!.\n • Szybkość postępu: Zyskuje +1 podstawowy miesięczny postęp plus +1 dodatkowy za każdą ukończoną kotwicę Ery 3 (cele Nowoczesny skład sił i Wielki zasięg mocy).\n • Synergia doktryn: Posiadanie #Y Professional Army IV#! lub #Y Defensive IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Wnikliwości zamiast 10)."
 ve_era_crossroads.3.c.tt:0 "Rozpoczyna się #Y Towarzystwo Arsenał#! trasy (Fokus: Gospodarka wojny przemysłowej i uzbrojenie masowe).\n • Cel: Osiągnij 60 postępów do zdobycia #P +50 Pęd Ery#!.\n • Szybkość postępu: Zyskuje +1 podstawowy miesięczny postęp plus +1 dodatkowy za każdą ukończoną kotwicę Ery 3 (cele Przemysł elektryczny i Uzbrojenie masowe).\n • Synergia doktryn: Posiadanie #Y Gospodarka wojenna IV#! or #Y Masowy pobór IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Wnikliwości zamiast 10)."

 ve_era_crossroads_decline_tt:0 "Trwale zmniejsza rozdroża obecnej ery. Późniejsze Wieki nadal kwalifikują się."

 ve_era_crossroads.10.t:0 "Kalendarz narodowy"
 ve_era_crossroads.10.d:0 "Urzędy wojewódzkie, stowarzyszenia prywatne i ministerstwa realizują wybraną transformację w różnym tempie. Wspólny kalendarz mógłby przekształcić rozproszone osiągnięcia w program krajowy, ale sama koordynacja wymaga niewielkiej uwagi administracyjnej."
 ve_era_crossroads.10.a:0 "Ufundować centralną komisję koordynacyjną."
 ve_era_crossroads.10.b:0 "Niech instytucje negocjują swój własny harmonogram."
 ve_era_crossroads.10.c:0 "Skorzystaj z sieci zbudowanych na podstawie naszych ustalonych doktryn."
 ve_era_crossroads.10.a.tt:0 "Wydawać #N 10 National Insight#! do zdobycia #P +3 Postęp na skrzyżowaniu#!."
 ve_era_crossroads.10.b.tt:0 "Nie wydawaj żadnych zasobów i nie wprowadzaj natychmiastowych zmian w postępie Rozdroży."
 ve_era_crossroads.10.c.tt:0 "Wymaga grupy pomysłów na poziomie IV dopasowanej do trasy. Wydawać #N 5 Spostrzeżenie narodowe#! aby zyskać #P +3 postępy na Rozdrożu#!."

 ve_era_crossroads.11.t:0 "Kto będzie kierował postępem?"
 ve_era_crossroads.11.d:0 "Program stał się zbyt konsekwentny, aby pozostać luźną umową. Ministrowie domagają się władzy krajowej, eksperci żądają izolacji od polityki, a lokalni aktorzy ostrzegają, że sztywne polecenie rozbije instytucje, które umożliwiły postęp."
 ve_era_crossroads.11.a:0 "Daj centrum jasny mandat koordynacyjny."
 ve_era_crossroads.11.b:0 "Zachowaj wynegocjowaną równowagę sił."
 ve_era_crossroads.11.c:0 "Powierz koordynację naszym instytucjom doktrynalnym."
 ve_era_crossroads.11.a.tt:0 "Wydawać #N 10 National Insight#! do zdobycia #P +3 do postępu na Rozdrożu#!."
 ve_era_crossroads.11.b.tt:0 "Nie wydawaj zasobów i nie wprowadzaj natychmiastowych zmian w postępie na Rozdrożu."
 ve_era_crossroads.11.c.tt:0 "Wymaga grupy pomysłów na poziomie IV dopasowanej do trasy. Wydawać #N 5 Spostrzeżenie narodowe#! aby zyskać #P +3 postępy na Rozdrożu#!."

 ve_era_crossroads.40.t:0 "Steam i państwo"
 ve_era_crossroads.40.d:0 "Obrany kurs nie jest już serią odosobnionych osiągnięć. Infrastruktura, obywatelstwo czy administracja tworzą obecnie trwały program narodowy, dzięki któremu państwo może zrozumieć przemiany epoki i kierować nimi."
 ve_era_crossroads.40.a:0 "Pierwszy wiek znalazł swoją formę instytucjonalną."
 ve_era_crossroads.40.a.tt:0 "Ukończono Erę Crossroads #P +50 Pęd Ery#!. Nie zrealizował celu ani nie zmienił uprawnień do Złotego Wieku."

 ve_era_crossroads.20.t:0 "Zasięg państwa"
 ve_era_crossroads.20.d:0 "Wybrany program wykracza obecnie poza instytucje, które jako pierwsze go sponsorowały. Porty, szkoły, urzędy i władze lokalne nie zgadzają się co do tego, gdzie powinna zakończyć się koordynacja krajowa, a zacząć lokalna swoboda."
 ve_era_crossroads.20.a:0 "Mapuj obowiązki państwa za pośrednictwem centralnej komisji."
 ve_era_crossroads.20.b:0 "Pozwól, aby granice instytucjonalne wyłoniły się w drodze negocjacji."
 ve_era_crossroads.20.c:0 "Koordynuj działania za pośrednictwem naszych ustalonych sieci doktrynalnych."
 ve_era_crossroads.20.a.tt:0 "Wydawać #N 10 National Insight#! do zdobycia #P +3 Postęp na skrzyżowaniu#!."
 ve_era_crossroads.20.b.tt:0 "Nie wydawaj żadnych zasobów i nie wprowadzaj natychmiastowych zmian w postępie Rozdroży."
 ve_era_crossroads.20.c.tt:0 "Wymaga grupy pomysłów na poziomie IV dopasowanej do trasy. Wydawać #N 5 Spostrzeżenie narodowe#! aby zyskać #P +3 postępy na Rozstajach#!."

 ve_era_crossroads.21.t:0 "Cena integracji"
 ve_era_crossroads.21.d:0 "Zasięg zewnętrzny, świadczenia socjalne i dyscyplina krajowa – wszystko to tworzy zwycięzców, koszty i nowe oczekiwania. Program może przetrwać tylko wtedy, gdy państwo zdecyduje, w jaki sposób te obciążenia zostaną rozłożone."
 ve_era_crossroads.21.a:0 "Utworzenie rady krajowej w celu zarządzania dostosowaniami."
 ve_era_crossroads.21.b:0 "Rozłóż ciężar w drodze wynegocjowanych kompromisów."
 ve_era_crossroads.21.c:0 "Niech nasze instytucje doktrynalne wytrzymają to napięcie."
 ve_era_crossroads.21.a.tt:0 "Wydawać #N 10 National Insight#! do zdobycia #P +3 do postępu na Rozdrożu#!."
 ve_era_crossroads.21.b.tt:0 "Nie wydawaj zasobów i nie wprowadzaj natychmiastowych zmian w postępie na Rozdrożu."
 ve_era_crossroads.21.c.tt:0 "Wymaga grupy pomysłów na poziomie IV dopasowanej do trasy. Wydawać #N 5 Spostrzeżenie narodowe#! aby zyskać #P +3 postępy na Rozdrożu#!."

 ve_era_crossroads.41.t:0 "Imperium i społeczeństwo masowe"
 ve_era_crossroads.41.d:0 "Wybrane porozumienie łączy obecnie zewnętrzny zasięg państwa, zobowiązania społeczne i instytucje narodowe. To, co zaczęło się jako kierunek strategiczny, stało się trwałymi ramami zarządzania społeczeństwem masowym."
 ve_era_crossroads.41.a:0 "Drugi wiek znalazł swoje rozstrzygnięcie."
 ve_era_crossroads.41.a.tt:0 "Ukończono Erę Crossroads #P +50 Pęd Ery#!. Nie zrealizował celu ani nie zmienił uprawnień do Złotego Wieku."

 ve_era_crossroads.30.t:0 "Naród jest powołany do obowiązków"
 ve_era_crossroads.30.d:0 "Wybrany program nakłada nowe obowiązki na obywateli, dowódców, pracowników i administratorów. Jeśli te obowiązki nie zostaną wzajemnie zrozumiałe, mobilizacja pozostanie zbiorem konkurencyjnych żądań."
 ve_era_crossroads.30.a:0 "Kodyfikuj obowiązki krajowe za pośrednictwem centralnej komisji."
 ve_era_crossroads.30.b:0 "Pozwól instytucjom negocjować swoje obowiązki."
 ve_era_crossroads.30.c:0 "Wykorzystaj nasze organizacje doktrynalne do koordynowania obowiązków."
 ve_era_crossroads.30.a.tt:0 "Wydawać #N 10 National Insight#! do zdobycia #P +3 Postęp na skrzyżowaniu#!."
 ve_era_crossroads.30.b.tt:0 "Nie wydawaj żadnych zasobów i nie wprowadzaj natychmiastowych zmian w postępie Rozdroży."
 ve_era_crossroads.30.c.tt:0 "Wymaga grupy pomysłów na poziomie IV dopasowanej do trasy. Wydawać #N 5 Spostrzeżenie narodowe#! aby zyskać #P +3 postępy na Rozdrożu#!."

 ve_era_crossroads.31.t:0 "Stała sytuacja awaryjna"
 ve_era_crossroads.31.d:0 "Maszyny zbudowane z myślą o masowym udziale, gotowości strategicznej lub mobilizacji przemysłu stają się trwałe. Państwo musi zdecydować, jak zachować wydajność, nie pozwalając, aby nadzwyczajna dyscyplina pochłonęła zwykłe życie narodowe."
 ve_era_crossroads.31.a:0 "Zdefiniuj stałe limity w drodze przeglądu krajowego."
 ve_era_crossroads.31.b:0 "Staraj się, aby rozliczenie było celowo elastyczne."
 ve_era_crossroads.31.c:0 "Polegaj na instytucjach doktrynalnych, jeśli chodzi o powstrzymanie maszynerii."
 ve_era_crossroads.31.a.tt:0 "Wydawać #N 10 National Insight#! do zdobycia #P +3 do postępu na Rozdrożu#!."
 ve_era_crossroads.31.b.tt:0 "Nie wydawaj zasobów i nie wprowadzaj natychmiastowych zmian w postępie na Rozdrożu."
 ve_era_crossroads.31.c.tt:0 "Wymaga grupy pomysłów na poziomie IV dopasowanej do trasy. Wydawać #N 5 Spostrzeżenie narodowe#! aby zyskać #P +3 postępy na Rozdrożu#!."

 ve_era_crossroads.42.t:0 "Zmobilizowane społeczeństwo"
 ve_era_crossroads.42.d:0 "Obywatelstwo, dowództwo i potencjał przemysłowy tworzą obecnie trwałe porozumienie narodowe. Instytucje mobilizacyjne stały się częścią zwykłego rządu, a nie pozostawione jako improwizowana odpowiedź na każdy nowy kryzys."
 ve_era_crossroads.42.a:0 "Wiek ostateczny znalazł swą narodową formę."
 ve_era_crossroads.42.a.tt:0 "Ukończono Erę Crossroads #P +50 Pęd Ery#!. Nie zrealizował celu ani nie zmienił uprawnień do Złotego Wieku."
