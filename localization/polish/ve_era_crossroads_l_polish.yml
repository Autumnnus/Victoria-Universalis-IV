 ve_je_era_crossroads_age_1:0 "Steam i państwo"
 ve_je_era_crossroads_age_1_reason:0 "Przemysł i Narody otworzyły kilka ścieżek do nowoczesnej państwowości. Wybrany kurs musi stać się czymś więcej niż zbiorem pojedynczych osiągnięć."
 ve_je_era_crossroads_age_1_status:0 "Postęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesiące#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nCel: ​​osiągnąć 60 postępów za #P +50 pędów ery#!. Kamienie milowe na 20. i 40. poziomie postępu zapewniają wsparcie finansowane przez National Insight."
 ve_je_era_crossroads_age_1_route_1_status:0 "#Y Sieć Steam#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesiące#!\nPostęp miesięczny: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel podziału chłopskiego i cel kolei zabezpieczony w tej Epoce.\n\nCel: ​​osiągnięcie 60 Postępu za #P +50 Tempa Ery#!. Kamienie milowe w wieku 20 i 40 lat zapewniają impuls finansowany przez National Insight."
