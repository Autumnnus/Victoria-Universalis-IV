l_polish:
 ve_je_era_crossroads_age_1:0 "Para i państwo"
 ve_je_era_crossroads_age_1_reason:0 "Przemysł i narody otworzyły kilka ścieżek ku nowoczesnej państwowości. Wybrany kurs musi stać się czymś więcej niż tylko zbiorem odizolowanych osiągnięć."
 ve_je_era_crossroads_age_1_status:0 "Postęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nCel: osiągnąć 60 Postęp dla #P +50 Rozpęd epoki#!. Kamienie milowe przy 20 i 40 Postęp oferują premię finansowaną z Rozpoznanie narodowe."
 ve_je_era_crossroads_age_1_route_1_status:0 "#Y Sieć kolejowa#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel udziału chłopów oraz cel kolei zabezpieczone w tej epoki.\n\nCel: osiągnąć 60 Postęp dla #P +50 Rozpęd epoki#!. Kamienie milowe przy 20 i 40 Postęp oferują premię finansowaną z Rozpoznanie narodowe."
 ve_je_era_crossroads_age_1_route_2_status:0 "#Y Wykształcone społeczeństwo#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel wolnej pracy oraz cel piśmienności lub szkoły zabezpieczone w tej epoki.\n\nCel: osiągnąć 60 Postęp dla #P +50 Rozpęd epoki#!. Kamienie milowe przy 20 i 40 Postęp oferują premię finansowaną z Rozpoznanie narodowe."
 ve_je_era_crossroads_age_1_route_3_status:0 "#Y Państwo administracyjne#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel prawomocności i biurokracji oraz cel niezależnej stabilności zabezpieczone w tej epoki.\n\nCel: osiągnąć 60 Postęp dla #P +50 Rozpęd epoki#!. Kamienie milowe przy 20 i 40 Postęp oferują premię finansowaną z Rozpoznanie narodowe."
 ve_je_era_crossroads_age_2:0 "Imperium czy społeczeństwo masowe?"
 ve_je_era_crossroads_age_2_reason:0 "Imperium i społeczeństwo masowe zmusza państwo do wyboru, w jaki sposób zasięg zewnętrzny, opieka społeczna i wcielanie narodu będą się wzajemnie definiować."
 ve_je_era_crossroads_age_2_status:0 "Postęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nCel: osiągnąć 60 Postęp dla #P +50 Rozpęd epoki#!. Kamienie milowe przy 20 i 40 Postęp oferują premię finansowaną z Rozpoznanie narodowe."
 ve_je_era_crossroads_age_2_route_1_status:0 "#Y Horyzont imperialny#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel zdolności uznanego państwa oraz cel portów lub interesy zabezpieczone w tej epoki.\n\nCel: osiągnąć 60 Postęp dla #P +50 Rozpęd epoki#!. Kamienie milowe przy 20 i 40 Postęp oferują premię finansowaną z Rozpoznanie narodowe."
 ve_je_era_crossroads_age_2_route_2_status:0 "#Y Masowa opieka społeczna#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel piśmienności lub szkoły oraz cel instytucji społecznej zabezpieczone w tej epoki.\n\nCel: osiągnąć 60 Postęp dla #P +50 Rozpęd epoki#!. Kamienie milowe przy 20 i 40 Postęp oferują premię finansowaną z Rozpoznanie narodowe."
 ve_je_era_crossroads_age_2_route_3_status:0 "#Y Zintegrowany naród#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel transformacji gospodarczej oraz cel prawomocności przy niskim zamęcie zabezpieczone w tej epoki.\n\nCel: osiągnąć 60 Postęp dla #P +50 Rozpęd epoki#!. Kamienie milowe przy 20 i 40 Postęp oferują premię finansowaną z Rozpoznanie narodowe."
 ve_je_era_crossroads_age_3:0 "Społeczeństwo zmobilizowane"
 ve_je_era_crossroads_age_3_reason:0 "Polityka masowa i wojna totalna sprawiają, że obywatelstwo, przemysł i gotowość strategiczna stają się częściami tego samego porozumienia narodowego."
 ve_je_era_crossroads_age_3_status:0 "Postęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nCel: osiągnąć 60 Postęp dla #P +50 Rozpęd epoki#!. Kamienie milowe przy 20 i 40 Postęp oferują premię finansowaną z Rozpoznanie narodowe."
 ve_je_era_crossroads_age_3_route_1_status:0 "#Y Republika społeczna#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel polityki masowej oraz cel dojrzałych instytucji społecznych zabezpieczone w tej epoce.\n\nCel: osiągnąć 60 postępu, aby zdobyć #P +50 rozpędu epoki#!. Kamienie milowe przy 20 i 40 postępie oferują premię finansowaną za rozpoznanie narodowe."
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y Dowództwo strategiczne#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel nowoczesnego składu sił oraz cel zasięgu mocarstwowego zabezpieczone w tej epoce.\n\nCel: osiągnąć 60 postępu, aby zdobyć #P +50 rozpędu epoki#!. Kamienie milowe przy 20 i 40 postępie oferują premię finansowaną za rozpoznanie narodowe."
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y Społeczeństwo arsenału#!\nPostęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] miesięcy#!\nMiesięczny postęp: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nKotwice: cel przemysłu elektrycznego oraz cel masowych zbrojeń zabezpieczone w tej epoce.\n\nCel: osiągnąć 60 postępu, aby zdobyć #P +50 rozpędu epoki#!. Kamienie milowe przy 20 i 40 postępie oferują premię finansowaną za rozpoznanie narodowe."

 ve_era_crossroads.1.t:0 "Para i państwo"
 ve_era_crossroads.1.d:0 "Koleje, szkoły, reformatorzy i urzędnicy przedstawiają odmienne wizje nowoczesnego narodu. Rząd musi zdecydować, która relacja między społeczeństwem a państwem ukształtuje pierwszą epokę."
 ve_era_crossroads.1.a:0 "Połączyć kraj za pomocą sieci parowej."
 ve_era_crossroads.1.b:0 "Zbudować wykształcone obywatelstvo."
 ve_era_crossroads.1.c:0 "Skonsolidować państwo administracyjne."
 ve_era_crossroads.1.d.option:0 "Ta epoka nie potrzebuje narodowych rozdroży."
 ve_era_crossroads.1.a.tt:0 "Rozpoczyna kierunek #Y Sieć parowa#! (Skupienie: uprzemysłowienie, migracja chłopów i koleje).\n• Cel: Osiągnąć 60 postępu, aby zyskać #P +50 rozpędu epoki#!.\n• Szybkość postępu: Zyskuje +1 bazowego miesięcznego postępu oraz dodatkowo +1 za każdą ukończoną kotwicę Epoki 1 (cele udziału chłopów i kolei).\n• Synergia doktryn: Posiadanie doktryny #Y Doktryny industrialistów IV#! lub #Y Doktryny infrastrukturalne IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 rozpoznania narodowego zamiast 10)."
 ve_era_crossroads.1.b.tt:0 "Rozpoczyna kierunek #Y Wykształcone obywatelstwo#! (Skupienie: edukacja, piśmienność i wolna praca).\n• Cel: Osiągnąć 60 postępu, aby zyskać #P +50 rozpędu epoki#!.\n• Szybkość postępu: Zyskuje +1 bazowego miesięcznego postępu oraz dodatkowo +1 za każdą ukończoną kotwicę Epoki 1 (cele wolnej pracy i piśmienności / szkół).\n• Synergia doktryn: Posiadanie doktryny #Y Akademizm IV#! lub #Y Reformizm IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 rozpoznania narodowego zamiast 10)."
 ve_era_crossroads.1.c.tt:0 "Rozpoczyna kierunek #Y Państwo administracyjne#! (Skupienie: prawomocność rządu, biurokracja i stabilność).\n• Cel: Osiągnąć 60 postępu, aby zyskać #P +50 rozpędu epoki#!.\n• Szybkość postępu: Zyskuje +1 bazowego miesięcznego postępu oraz dodatkowo +1 za każdą ukończoną kotwicę Epoki 1 (cele prawomocności / biurokracji oraz niezależnej stabilności).\n• Synergia doktryn: Posiadanie doktryny #Y Biurokracja IV#! lub #Y Parlamentaryzm IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 rozpoznania narodowego zamiast 10)."
 ve_era_crossroads.2.t:0 "Imperium czy społeczeństwo masowe?"
 ve_era_crossroads.2.d:0 "Państwo nie może już traktować zamorskich zasięgów, dobrobytu powszechnego i integracji narodowej jako oddzielnych kwestii. Jedna z nich zdefiniuje sposób, w jaki realizowane będą pozostałe."
 ve_era_crossroads.2.a:0 "Spojrzeć ku imperialnemu horyzontowi."
 ve_era_crossroads.2.b:0 "Zbudować system opieki społecznej mas."
 ve_era_crossroads.2.c:0 "Ukuć zintegrowany naród."
 ve_era_crossroads.2.d.option:0 "Pozwolić epoce odnaleźć własny kierunek."
 ve_era_crossroads.2.a.tt:0 "Rozpoczyna kierunek #Y Imperialny horyzont#! (Skupienie: potęga dyplomatyczna i zamorski zasięg).\n• Cel: Osiągnąć 60 postępu, aby zyskać #P +50 rozpędu epoki#!.\n• Szybkość postępu: Zyskuje +1 bazowego miesięcznego postępu oraz dodatkowo +1 za każdą ukończoną kotwicę Epoki 2 (cele uznanych zdolności państwa oraz portów/interesów).\n• Synergia doktryn: Posiadanie doktryny #Y Dyplomacja IV#! lub #Y Kolonializm IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 rozpoznania narodowego zamiast 10)."
 ve_era_crossroads.2.b.tt:0 "Rozpoczyna kierunek #Y Opieka społeczna#! (Skupienie: instytucje społeczne, opieka zdrowotna i edukacja).\n• Cel: Osiągnąć 60 postępu, aby zyskać #P +50 rozpędu epoki#!.\n• Szybkość postępu: Zyskuje +1 bazowego miesięcznego postępu oraz dodatkowo +1 za każdą ukończoną kotwicę Epoki 2 (cele piśmienności/szkół oraz instytucji społecznych).\n• Synergia doktryn: Posiadanie doktryny #Y Opieka społeczna IV#! lub #Y Reformizm IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 rozpoznania narodowego zamiast 10)."
 ve_era_crossroads.2.c.tt:0 "Rozpoczyna kierunek #Y Zintegrowany naród#! (Skupienie: transformacja gospodarcza i stabilność wewnętrzna).\n• Cel: Osiągnąć 60 postępu, aby zyskać #P +50 rozpędu epoki#!.\n• Szybkość postępu: Zyskuje +1 bazowego miesięcznego postępu oraz dodatkowo +1 za każdą ukończoną kotwicę Epoki 2 (cele transformacji gospodarczej oraz niskiego zamętu i prawomocności).\n• Synergia doktryn: Posiadanie doktryny #Y Nacjonalizm IV#! lub #Y Praca IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 rozpoznania narodowego zamiast 10)."
 ve_era_crossroads.3.t:0 "Społeczeństwo zmobilizowane"
 ve_era_crossroads.3.d:0 "Polityka masowa, dowództwo strategiczne i mobilizacja przemysłowa docierają obecnie do każdej instytucji. Ostatnia epoka wymaga wyboru, jaka forma mobilizacji zdefiniuje naród."
 ve_era_crossroads.3.a:0 "Zaangażować się w republikę społeczną."
 ve_era_crossroads.3.b:0 "Poddać naród dowództwu strategicznemu."
 ve_era_crossroads.3.c:0 "Zbudować społeczeństwo arsenałowe."
 ve_era_crossroads.3.d.option:0 "Odrzucić projekt trwałego zorganizowania."
 ve_era_crossroads.3.a.tt:0 "Rozpoczyna kierunek #Y Republika społeczna#! (Skupienie: Polityka masowa i instytucje społeczne).\n• Cel: Osiągnąć 60 Postęp, aby zyskać #P +50 Rozpęd epoki#!.\n• Szybkość postępu: Zyskuje +1 bazowego miesięcznego postępu oraz dodatkowo +1 za każdy ukończony kotwiczący cel Epoki 3 (Polityka masowa i Dojrzałe instytucje społeczne).\n• Synergia doktryn: Posiadanie doktryny #Y Parlamentaryzm IV#! lub #Y Opieka społeczna IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Rozpoznanie narodowe zamiast 10)."
 ve_era_crossroads.3.b.tt:0 "Rozpoczyna kierunek #Y Dowództwo strategiczne#! (Skupienie: Modernizacja wojskowa i globalny zasięg potęgi).\n• Cel: Osiągnąć 60 Postęp, aby zyskać #P +50 Rozpęd epoki#!.\n• Szybkość postępu: Zyskuje +1 bazowego miesięcznego postępu oraz dodatkowo +1 za każdy ukończony kotwiczący cel Epoki 3 (Nowoczesny skład sił i Zasięg wielkiego mocarstwa).\n• Synergia doktryn: Posiadanie doktryny #Y Armia zawodowa IV#! lub #Y Defensywa IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Rozpoznanie narodowe zamiast 10)."
 ve_era_crossroads.3.c.tt:0 "Rozpoczyna kierunek #Y Społeczeństwo arsenałowe#! (Skupienie: Przemysłowa gospodarka wojenna i masowe uzbrojenie).\n• Cel: Osiągnąć 60 Postęp, aby zyskać #P +50 Rozpęd epoki#!.\n• Szybkość postępu: Zyskuje +1 bazowego miesięcznego postępu oraz dodatkowo +1 za każdy ukończony kotwiczący cel Epoki 3 (Przemysł elektryczny i Masowe uzbrojenie).\n• Synergia doktryn: Posiadanie doktryny #Y Gospodarka wojenna IV#! lub #Y Pobór powszechny IV#! odblokowuje tańsze decyzje dotyczące kamieni milowych (5 Rozpoznanie narodowe zamiast 10)."

 ve_era_crossroads_decline_tt:0 "Odrzuca bezpowrotnie rozdroże epoki dla bieżącej epoki. Późniejsze epoki pozostaną odpowiednie."

 ve_era_crossroads.10.t:0 "Kalendarz narodowy"
 ve_era_crossroads.10.d:0 "Urzędy prowincjonalne, prywatne stowarzyszenia i ministerstwa realizują wybraną transformację w różnym tempie. Wspólny kalendarz mógłby przekształcić rozproszone osiągnięcia w program narodowy, lecz sama koordynacja wymaga skąpych zasobów uwagi administracyjnej."
 ve_era_crossroads.10.a:0 "Sfinansować centralną komisję koordynacyjną."
 ve_era_crossroads.10.b:0 "Pozwolić instytucjom na wynegocjowanie własnego harmonogramu."
 ve_era_crossroads.10.c:0 "Wykorzystać sieci zbudowane przez nasze utrwalone doktryny."
 ve_era_crossroads.10.a.tt:0 "Wydaj #N 10 Rozpoznanie narodowe#!, aby zyskać #P +3 Postęp rozdroża#!."
 ve_era_crossroads.10.b.tt:0 "Nie wydawaj zasobów i nie wprowadzaj natychmiastowych zmian w postępie rozdroża."
 ve_era_crossroads.10.c.tt:0 "Wymaga katalogu doktryn poziomu IV pasującego do kierunku. Wydaj #N 5 Rozpoznanie narodowe#!, aby zyskać #P +3 Postęp rozdroża#!."

 ve_era_crossroads.11.t:0 "Kto pokieruje postępem?"
 ve_era_crossroads.11.d:0 "Program stał się zbyt brzemienny w skutki, by pozostać luźnym porozumieniem. Ministrerowie roszczą sobie zwierzchnictwo narodowe, ekspertom zależy na odizolowaniu od polityki, a lokalni działacze ostrzegają, że sztywne dowództwo rozbije instytucje, które umożliwiły postęp."
 ve_era_crossroads.11.a:0 "Dać centrum jasną dyrektywę koordynacyjną."
 ve_era_crossroads.11.b:0 "Zachować wynegocjowane saldo zwierzchnictwa."
 ve_era_crossroads.11.c:0 "Powierzyć koordynację naszym instytucjom doktrynalnym."
 ve_era_crossroads.11.a.tt:0 "Wydaj #N 10 Rozpoznanie narodowe#!, aby zyskać #P +3 Postęp rozdroża#!."
 ve_era_crossroads.11.b.tt:0 "Nie wydawaj zasobów i nie wprowadzaj natychmiastowych zmian w postępie rozdroża."
 ve_era_crossroads.11.c.tt:0 "Wymaga katalogu doktryn poziomu IV pasującego do kierunku. Wydaj #N 5 Rozpoznanie narodowe#!, aby zyskać #P +3 Postęp rozdroża#!."

 ve_era_crossroads.40.t:0 "Para i państwo"
 ve_era_crossroads.40.d:0 "Wybrany kierunek nie jest już serią odosobnionych osiągnięć. Infrastruktura, obywatelstwo czy administracja tworzą obecnie trwała program narodowy, dzięki któremu państwo może rozumieć i ukierunkowywać przemiany epoki."
 ve_era_crossroads.40.a:0 "Pierwsza epoka odnalazła swoją formę instytucjonalną."
 ve_era_crossroads.40.a.tt:0 "Ukończone rozdroże epoki przyznało #P +50 Rozpęd epoki#!. Nie ukończyło ono celu ani nie zmieniło kwalifikowalności do złotego wieku."

 ve_era_crossroads.20.t:0 "Zasięg państwa"
 ve_era_crossroads.20.d:0 "Wybrany program wykracza obecnie poza instytucje, które pierwotnie go sponsorowały. Porty, szkoły, urzędy i władze lokalne nie zgadzają się co do tego, gdzie powinna kończyć się koordynacja narodowa, a zaczynać uznaniowość lokalna."
 ve_era_crossroads.20.a:0 "Określić zobowiązania państwa za pomocą centralnej komisji."
 ve_era_crossroads.20.b:0 "Pozwolić granicom instytucjonalnym wyłonić się w drodze negocjacji."
 ve_era_crossroads.20.c:0 "Koordynować poprzez nasze ustalone sieci doktrynalne."
 ve_era_crossroads.20.a.tt:0 "Wydaj #N 10 Rozpoznanie narodowe#!, aby zyskać #P +3 Postęp rozdroża#!."
 ve_era_crossroads.20.b.tt:0 "Nie wydawaj zasobów i nie wprowadzaj natychmiastowych zmian w postępie rozdroża."
 ve_era_crossroads.20.c.tt:0 "Wymaga katalogu doktryn poziomu IV pasującego do kierunku. Wydaj #N 5 Rozpoznanie narodowe#!, aby zyskać #P +3 Postęp rozdroża#!."

 ve_era_crossroads.21.t:0 "Cena wcięcia"
 ve_era_crossroads.21.d:0 "Zewnętrzne zasięgi, zabezpieczenia społeczne oraz dyscyplina narodowa przynoszą zarówno zwycięzców, koszty, jak i nowe oczekiwania. Program ten przetrwa tylko wtedy, gdy rząd zdecyduje, jak zostaną rozłożone te ciężary."
 ve_era_crossroads.21.a:0 "Powołać krajową komisję do spraw zarządzania dostosowaniem."
 ve_era_crossroads.21.b:0 "Rozłożyć ciężar poprzez wynegocjowane kompromisy."
 ve_era_crossroads.21.c:0 "Pozwolić naszym instytucjom doktrynalnym absorbować obciążenie."
 ve_era_crossroads.21.a.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe, aby zyskać #P +3 Postęp rozdroża#!."
 ve_era_crossroads.21.b.tt:0 "Nie wydatkuje żadnych zasobów i nie wprowadza natychmiastowych zmian w postępie rozdroża."
 ve_era_crossroads.21.c.tt:0 "Wymaga katalogu doktryn stopnia IV odpowiadającego kierunkowi. Wydaj #N 5#! Rozpoznanie narodowe, aby zyskać #P +3 postępy rozdroża#!."

 ve_era_crossroads.41.t:0 "Imperium i społeczeństwo masowe"
 ve_era_crossroads.41.d:0 "Wybrane porozumienie łączy obecnie zewnętrzne zasięgi państwa, obowiązki społeczne oraz instytucje narodowe. To, co zaczęło się jako kierunek strategiczny, stało się trwałą strukturą rządzenia społeczeństwem masowym."
 ve_era_crossroads.41.a:0 "Druga epoka znalazła swoje porozumienie."
 ve_era_crossroads.41.a.tt:0 "Ukończone rozdroże epoki przyznało #P +50 rozpęd epoki#!. Nie ukończyło ono celu ani nie zmieniło kwalifikowalności do złotego wieku."

 ve_era_crossroads.30.t:0 "Naród wzywa do służby"
 ve_era_crossroads.30.d:0 "Obywatele, dowódcy, robotnicy i administratorze otrzymują nowe obowiązki w ramach wybranego programu. O ile obowiązki te nie zostaną ujednolicone, mobilizacja pozostanie zbiorem konkurujących ze sobą żądań."
 ve_era_crossroads.30.a:0 "Skodyfikować obowiązki narodowe poprzez centralną komisję."
 ve_era_crossroads.30.b:0 "Pozwolić instytucjom negocjować ich odpowiedzialność."
 ve_era_crossroads.30.c:0 "Wykorzystać nasze organizacje doktrynalne do koordynacji służby."
 ve_era_crossroads.30.a.tt:0 "Wydawać #N 10 National Insight#! do zdobycia #P +3 Postęp na skrzyżowaniu#!."
 ve_era_crossroads.30.b.tt:0 "Nie wydatkuje żadnych zasobów i nie wprowadza natychmiastowych zmian w postępie rozdroża."
 ve_era_crossroads.30.c.tt:0 "Wymaga katalogu doktryn na poziomie IV zgodnego z kierunkiem. Wydaj #N 5#! Rozpoznanie narodowe, aby zyskać #P +3 postęp na rozdrożu#!."

 ve_era_crossroads.31.t:0 "Wieczny stan wyjątkowy"
 ve_era_crossroads.31.d:0 "Machina zbudowana z myślą o masowym udziale, gotowości strategicznej lub mobilizacji przemysłowej staje się trwałą strukturą. Rząd musi zdecydować, jak zachować kompetencję, nie pozwalając, aby dyscyplina stanów wyjątkowych pochłonęła zwykłe życie narodowe."
 ve_era_crossroads.31.a:0 "Określić stałe granice poprzez przegląd narodowy."
 ve_era_crossroads.31.b:0 "Zachować celową elastyczność porozumienia."
 ve_era_crossroads.31.c:0 "Polegać na instytucjach doktrynalnych w powściąganiu machiny."
 ve_era_crossroads.31.a.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe, aby zyskać #P +3 Postęp rozdroża#!."
 ve_era_crossroads.31.b.tt:0 "Nie wydatkuje żadnych zasobów i nie wprowadza natychmiastowych zmian w postępie rozdroża."
 ve_era_crossroads.31.c.tt:0 "Wymaga grupy pomysłów na poziomie IV dopasowanej do trasy. Wydawać #N 5 Spostrzeżenie narodowe#! aby zyskać #P +3 postępy na Rozdrożu#!."

 ve_era_crossroads.42.t:0 "Społeczeństwo zmobilizowane"
 ve_era_crossroads.42.d:0 "Obywatelstwo, dowództwo i zdolności przemysłowe tworzą obecnie trwałe porozumienie narodowe. Instytucje mobilizacji stały się częścią zwykłego rządu, a nie improwizowaną odpowiedzią na każdy nowy kryzys."
 ve_era_crossroads.42.a:0 "Ostatnia epoka znalazła swoją formę narodową."
 ve_era_crossroads.42.a.tt:0 "Ukończone rozdroże epoki przyznało #P +50 rozpęd epoki#!. Nie ukończyło ono celu ani nie zmieniło kwalifikowalności do złotego wieku."
