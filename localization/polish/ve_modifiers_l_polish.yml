 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "Państwo etniczne"
 ve_ethnic_identity_mdf_desc:0 "Państwo definiuje przynależność polityczną w oparciu o swoje kultury dominujące."
 ve_civic_identity_mdf:0 "Państwo obywatelskie"
 ve_civic_identity_mdf_desc:0 "Państwo definiuje przynależność polityczną poprzez wspólne instytucje i obywatelstwo."
 ve_composite_identity_mdf:0 "Państwo złożone"
 ve_composite_identity_mdf_desc:0 "Państwo równoważy wiele ludów poprzez wynegocjowane i administracyjne instytucje."
 ve_ethnic_high_cohesion_mdf:0 "Zmobilizowana wspólnota narodowa"
 ve_ethnic_high_cohesion_mdf_desc:0 "Spójne państwo etniczne potrafi zmobilizować swoją populację i legitymizować władzę."
 ve_civic_high_cohesion_mdf:0 "Pewne społeczeństwo obywatelskie"
 ve_civic_high_cohesion_mdf_desc:0 "Wspólne instytucje obywatelskie budują prawomocność i mobilność społeczną."
 ve_composite_high_cohesion_mdf:0 "Stabilny pakt imperialny"
 ve_composite_high_cohesion_mdf_desc:0 "Stabilny pakt między ludami państwa wzmacnia prawomocność i dyplomację."
 ve_low_national_cohesion_mdf:0 "Niska spójność narodowa"
 ve_low_national_cohesion_mdf_desc:0 "Definicja narodu przyjęta przez państwo traci na prawomocności."
 ve_identity_transition_backlash_mdf:0 "Reakcja zwrotna transformacji tożsamości"
 ve_identity_transition_backlash_mdf_desc:0 "Instytucje i społeczności opierają się redefinicji narodu."
 ve_cultural_project_administration_mdf:0 "Administracja projektu kulturowego"
 ve_cultural_project_administration_mdf_desc:0 "Urzędnicy i kapitał polityczny są zaangażowani w aktywny Projekt kulturowy."
 ve_cultural_project_backlash_mdf:0 "Porzucony projekt kulturowy"
 ve_cultural_project_backlash_mdf_desc:0 "Nagłe porzucenie programu kulturowego zaszkodziło zaufaniu publicznemu i koordynacji administracyjnej."
 ve_national_curriculum_result_mdf:0 "Program szkolny"
 ve_national_curriculum_result_mdf_desc:0 "Wspólny program szkolny rozszerza edukację i kwalifikacje, choć jego utrzymanie zużywa biurokrację."
 ve_shared_symbols_result_mdf:0 "Wspólne symbole narodowe"
 ve_shared_symbols_result_mdf_desc:0 "Wspólne rytuały i symbole obywatelskie wzmacniają lojalność oraz zwierzchnictwo państwa."
 ve_ethnic_campaign_active_mdf:0 "Kampania integracji etnicznej"
 ve_ethnic_campaign_active_mdf_desc:0 "Państwo aktywnie przyspiesza asymilację, prowokując opór wobec wymazywania kultury."
 ve_ethnic_campaign_result_mdf:0 "Program asymilacji"
 ve_ethnic_campaign_result_mdf_desc:0 "Ukończona kampania integracji wciąż przyspiesza asymilację, generując jednocześnie napięcia związane z wymazywaniem kultury."
 ve_civic_initiative_active_mdf:0 "Inicjatywa równego obywatelstwa"
 ve_civic_initiative_active_mdf_desc:0 "Szkoły i instytucje publiczne są reorganizowane w celu zwiększenia szans i ograniczenia otwartych uprzedzeń."
 ve_civic_initiative_result_mdf:0 "Program równego obywatelstwa"
 ve_civic_initiative_result_mdf_desc:0 "Inicjatywa poprawia kwalifikacje, atrakcyjność migracji oraz opór wobec otwartych uprzedzeń."
 ve_composite_compact_active_mdf:0 "Negocjacje paktu założycielskiego"
 ve_composite_compact_active_mdf_desc:0 "Negocjacje zmniejszają żale wynikające z obywatelstwa drugiej kategorii, ale tymczasowo stanowią obciążenie dla administracji podatkowej."
 ve_composite_compact_result_mdf:0 "Pakt założycielski"
 ve_composite_compact_result_mdf_desc:0 "Pakt wzmacnia lojalność i zmniejsza żale spowodowane obywatelstwem drugiej kategorii."
