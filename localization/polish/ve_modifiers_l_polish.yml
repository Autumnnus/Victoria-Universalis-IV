 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "Naród etniczny"
 ve_ethnic_identity_mdf_desc:0 "Państwo definiuje przynależność polityczną wokół swoich kultur pierwotnych."
 ve_civic_identity_mdf:0 "Naród obywatelski"
 ve_civic_identity_mdf_desc:0 "Państwo definiuje przynależność polityczną poprzez wspólne instytucje i obywatelstwo."
 ve_composite_identity_mdf:0 "Państwo złożone"
 ve_composite_identity_mdf_desc:0 "Państwo równoważy kilka narodów poprzez instytucje negocjacyjne i administracyjne."
 ve_ethnic_high_cohesion_mdf:0 "Zmobilizowana Wspólnota Narodowa"
 ve_ethnic_high_cohesion_mdf_desc:0 "Spójny naród etniczny może zmobilizować swoją populację i legitymizować państwo."
 ve_civic_high_cohesion_mdf:0 "Pewne społeczeństwo obywatelskie"
 ve_civic_high_cohesion_mdf_desc:0 "Wspólne instytucje obywatelskie tworzą legitymizację i mobilność społeczną."
 ve_composite_high_cohesion_mdf:0 "Stabilny pakt imperialny"
 ve_composite_high_cohesion_mdf_desc:0 "Stabilny pakt między narodami państwa wzmacnia legitymizację i dyplomację."
 ve_low_national_cohesion_mdf:0 "Niska spójność narodowa"
 ve_low_national_cohesion_mdf_desc:0 "Państwowa definicja narodu traci legitymację."
 ve_identity_transition_backlash_mdf:0 "Reakcja na zmianę tożsamości"
 ve_identity_transition_backlash_mdf_desc:0 "Instytucje i społeczności sprzeciwiają się redefinicji narodu."
 ve_cultural_project_administration_mdf:0 "Administracja Projektu Kulturalnego"
 ve_cultural_project_administration_mdf_desc:0 "W aktywny Projekt Kulturalny zaangażowani są urzędnicy i kapitał polityczny."
 ve_cultural_project_backlash_mdf:0 "Opuszczony projekt kulturalny"
 ve_cultural_project_backlash_mdf_desc:0 "Nagłe porzucenie programu kulturalnego nadszarpnęło zaufanie publiczne i koordynację administracyjną."
