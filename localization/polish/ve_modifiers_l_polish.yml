 ve_national_curriculum_result_mdf_desc:0 "Wspólny program poszerza edukację i kwalifikacje, choć jego utrzymanie pochłania biurokrację."
 ve_shared_symbols_result_mdf:0 "Wspólne symbole narodowe"
