 ve_ethnic_campaign_active_mdf:0 "Kampania Integracji Etnicznej"
 ve_ethnic_campaign_active_mdf_desc:0 "Państwo aktywnie przyspiesza asymilację, wywołując opór wobec wymazania kulturowego."
 ve_ethnic_campaign_result_mdf:0 "Program Asymilacji"
 ve_ethnic_campaign_result_mdf_desc:0 "Zakończona kampania integracyjna w dalszym ciągu przyspiesza asymilację, generując jednocześnie napięcia mające na celu wymazanie kulturowe."
 ve_civic_initiative_active_mdf:0 "Inicjatywa na rzecz Równego Obywatelstwa"
 ve_civic_initiative_active_mdf_desc:0 "Szkoły i instytucje publiczne przechodzą reorganizację w celu poszerzenia możliwości i ograniczenia otwartych uprzedzeń."
 ve_civic_initiative_result_mdf:0 "Program Równego Obywatelstwa"
 ve_civic_initiative_result_mdf_desc:0 "Inicjatywa podnosi kwalifikacje, atrakcyjność migracyjną i odporność na otwarte uprzedzenia."
