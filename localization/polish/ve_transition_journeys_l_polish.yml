l_polish:
 ve_je_religious_settlement_transition:0 "Przejściowa ugoda wyznaniowa"
 ve_je_religious_settlement_transition_reason:0 "Uregulowanie prawne stosunków między kościołem a państwem uległo zmianie. Instytucje, społeczności i urzędnicy muszą się dostosować, dopóki obowiązuje kryzys okresu przejściowego. Modyfikator kryzysu – a nie kalendarz tego wpisu w dzienniku – ma charakter nadrzędny."
 ve_je_religious_settlement_transition_complete_tt:0 "Kryzys przejściowy ugody wyznaniowej dobiegł końca."
 ve_je_religious_settlement_transition_status_confessional:0 "Docelowa ugoda: #Y Państwo wyznaniowe#!\nUgoda wyznaniowa: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nSzacowany pozostały czas: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] miesięcy#!\nUkończone kamienie milowe: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nRezultat po zakończeniu kryzysu: #Y 60+#! – ugoda stabilizuje się wcześniej, #Y 26-59#! – rozstrzygnięcie neutralne, #Y 25 lub mniej#! – przeradza się w kryzys. Każdy pozostały kamień milowy oferuje wybór wpływający na ugody wyznaniowe."
 ve_je_religious_settlement_transition_status_freedom:0 "Docelowa ugoda: #Y Wolność sumienia#!\nUgoda wyznaniowa: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nSzacowany pozostały czas: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] miesięcy#!\nUkończone kamienie milowe: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nRezultat po zakończeniu kryzysu: #Y 60+#! – ugoda stabilizuje się wcześniej, #Y 26-59#! – rozstrzygnięcie neutralne, #Y 25 lub mniej#! – przeradza się w kryzys. Każdy pozostały kamień milowy oferuje wybór wpływający na ugody wyznaniowe."
 ve_je_religious_settlement_transition_status_separation:0 "Docelowa ugoda: #Y Całkowity rozdział#!\nUgoda wyznaniowa: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nSzacowany pozostały czas: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] miesięcy#!\nUkończone kamienie milowe: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nRezultat po zakończeniu kryzysu: #Y 60+#! – ugoda stabilizuje się wcześniej, #Y 26-59#! – rozstrzygnięcie neutralne, #Y 25 lub mniej#! – przeradza się w kryzys. Każdy pozostały kamień milowy oferuje wybór wpływający na ugody wyznaniowe."
 ve_je_religious_settlement_transition_status_atheism:0 "Docelowa ugoda: #Y Ateizm państwowy#!\nUgoda wyznaniowa: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nSzacowany pozostały czas: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] miesięcy#!\nUkończone kamienie milowe: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nRezultat po zakończeniu kryzysu: #Y 60+#! – ugoda stabilizuje się wcześniej, #Y 26-59#! – rozstrzygnięcie neutralne, #Y 25 lub mniej#! – przeradza się w kryzys. Każdy pozostały kamień milowy oferuje wybór wpływający na ugody wyznaniowe."

 ve_je_national_compact_transition:0 "Przejściowy pakt narodowy"
 ve_je_national_compact_transition_reason:0 "Państwo przyjęło nową definicję przynależności narodowej. Administratorzy, elity i społeczności muszą wynegocjować pakt, dopóki obowiązuje reakcja zwrotna okresu przejściowego. Modyfikator reakcji zwrotnej – a nie kalendarz tego wpisu w dzienniku – ma charakter nadrzędny."
 ve_je_national_compact_transition_complete_tt:0 "Reakcja zwrotna przejścia na pakt narodowy dobiegła końca."
 ve_je_national_compact_transition_status_ethnic:0 "Docelowa tożsamość: #Y Tożsamość etniczna#!\nSpójność narodowa: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nSzacowany pozostały czas: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] miesięcy#!\nUkończone kamienie milowe: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nRezultat po zakończeniu reakcji zwrotnej: #Y 60+#! – spójność stabilizuje się wcześniej, #Y 26-59#! – rozstrzygnięcie neutralne, #Y 25 lub mniej#! – przeradza się w kryzys. Każdy pozostały kamień milowy oferuje wybór wpływający na spójność narodową."
 ve_je_national_compact_transition_status_civic:0 "Docelowa tożsamość: #Y Tożsamość obywatelska#!\nSpójność narodowa: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nSzacowany pozostały czas: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] miesięcy#!\nUkończone kamienie milowe: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nRezultat po zakończeniu reakcji zwrotnej: #Y 60+#! – spójność stabilizuje się wcześniej, #Y 26-59#! – rozstrzygnięcie neutralne, #Y 25 lub mniej#! – przeradza się w kryzys. Każdy pozostały kamień milowy oferuje wybór wpływający na spójność narodową."
 ve_je_national_compact_transition_status_composite:0 "Docelowa tożsamość: #Y Tożsamość złożona#!\nSpójność narodowa: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nSzacowany pozostały czas: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] miesięcy#!\nUkończone kamienie milowe: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nRezultat po zakończeniu reakcji zwrotnej: #Y 60+#! – spójność stabilizuje się wcześniej, #Y 26-59#! – rozstrzygnięcie neutralne, #Y 25 lub mniej#! – przeradza się w kryzys. Każdy pozostały kamień milowy oferuje wybór wpływający na spójność narodową."
 ve_je_transition_resolving_status:0 "Zapis okresu przejściowego jest uzgadniany z obecną ugodą narodową."

 ve_rel_transition_conciliatory_tt:0 "Wydaj #N 10#! funduszu religijnego i zyskaj #P 3#! ugody wyznaniowej."
 ve_rel_transition_central_tt:0 "Zyskaj #P 5#! funduszu religijnego i utratź #N 3#! ugody wyznaniowej."
 ve_rel_transition_doctrine_tt:0 "Wydaj #N 5#! funduszu religijnego i zyskaj #P 2#! ugody wyznaniowej."

 ve_rel_evt.210.t:0 "Granice nominacji duchownych"
 ve_rel_evt.210.d:0 "Władze religijne przedstawiły listy kandydatów na urzędy państwowe, podczas gdy starsi urzędnicy upierają się, że służba państwowa musi nadal nagradzać kompetencje. Pierwsze nominacje w ramach nowego porozumienia zdefiniują, gdzie kończy się rada kleru, a zaczyna zwierzchnictwo cywilne."
 ve_rel_evt.210.a:0 "Zwołać mieszaną komisję ds. nominacji."
 ve_rel_evt.210.b:0 "Przyjąć listy duchowieństwa."
 ve_rel_evt.210.c:0 "Połączyć standardowe egzaminy z radą religijną."

 ve_rel_evt.211.t:0 "Szkoły i przysięgi Lojalność"
 ve_rel_evt.211.d:0 "Szkoły parafialne zabiegają o uznane miejsce w systemie publicznym. Ich patroni żądają ochrony nauczania religijnego, podczas gdy urzędnicy obawiają się, że konkurencyjne programy nauczania i przysięgi podzielą następne pokolenie."
 ve_rel_evt.211.a:0 "Zagwarantować wspólny kanon programowy."
 ve_rel_evt.211.b:0 "Narzucić jedną jednolitą przysięgę lojalności."
 ve_rel_evt.211.c:0 "Poddać kompromis inspekcji biurokratycznej."

 ve_rel_evt.220.t:0 "Język gwarancji mniejszościowych"
 ve_rel_evt.220.d:0 "Społeczności mniejszościowe chcą, aby ich ochrona została zapisana wprost w nowym porozumieniu. Prawnicy rządowi opowiadają się natomiast za pojedynczą klauzulą ogólną, ostrzegając, że obietnice specyficzne dla danej społeczności mogą utrwalić dawne podział."
 ve_rel_evt.220.a:0 "Napisać gwarancje w sposób jasny."
 ve_rel_evt.220.b:0 "Zastosować jedną jednolitą klauzulę o obywatelstwie."
 ve_rel_evt.220.c:0 "Pozwolić koalicji reformatorskiej wynegocjować brzmienie."

 ve_rel_evt.221.t:0 "Reprezentacja we wspólnych Instytucje"
 ve_rel_evt.221.d:0 "Szkoły, szpitale i rady lokalne muszą odtąd służyć obywatelom różnych wyznań na równych warunkach. Pytanie brzmi, czy reprezentacja powinna opierać się na lokalnych realiach, czy na formule narzuconej z centrum."
 ve_rel_evt.221.a:0 "Zbilansować reprezentację lokalnie."
 ve_rel_evt.221.b:0 "Ustanowić centralną kwotę."
 ve_rel_evt.221.c:0 "Negocjować dyplomatyczną formułę reprezentacji."

 ve_rel_evt.230.t:0 "Neutralny rejestr"
 ve_rel_evt.230.d:0 "Narodziny, małżeństwa i Roszczenia majątkowe przechodzą z rąk zarządców religijnych w ręce urzędników stanu cywilnego. Urzędnicy mogą zachować prowadzenie podwójnych rejestrów w okresie przejścia, lecz reformatorzy domagają się czystego i natychmiastowego odcięcia."
 ve_rel_evt.230.a:0 "Utrzymać prowadzenie podwójnych ksiąg przez okres przejściowy."
 ve_rel_evt.230.b:0 "Zamknąć rejestry religijne natychmiast."
 ve_rel_evt.230.c:0 "Rozmieścić przeszkoloną sieć służby cywilnej."

 ve_rel_evt.231.t:0 "Szkoła a ceremonie publiczne"
 ve_rel_evt.231.d:0 "Zasada neutralności państwa dotarła do zgromadzeń szkolnych i ceremonii publicznych. Społeczności lokalne chcą miejsca na odziedziczone zwyczaje; urzędnicy centralni chcą jednego protokołu świeckiego, który nie pozostawia dwuznaczności."
 ve_rel_evt.231.a:0 "Pozostawić miejsce na lokalne ceremonie."
 ve_rel_evt.231.b:0 "Wprowadzić nakaz stosowania jednego protokołu świeckiego."
 ve_rel_evt.231.c:0 "Stworzyć wspólny obywatelski standard ceremonialny."

 ve_rel_evt.240.t:0 "Niedobór kadr świeckich"
 ve_rel_evt.240.d:0 "Nowa administracja potrzebuje nauczycieli, rejestratorów i inspektorów zdolnych do działania bez instytucji klerykalnych. Zbyt mało jest przeszkolonych kandydatów, a zmuszanie obecnego personelu do zmiany praktyki może wywołać opór."
 ve_rel_evt.240.a:0 "Sfinansować nowy program szkolenia kadr."
 ve_rel_evt.240.b:0 "Zobligować obecny personel do adaptacji."
 ve_rel_evt.240.c:0 "Zbudować akademiczną sieć szkoleniową."

 ve_rel_evt.241.t:0 "Własność i podziemne nabożeństwa"
 ve_rel_evt.241.d:0 "Transfer własności religijnej wypchnął niektóre zgromadzenia w podziemie. Natychmiastowa konfiskata szybko wyposażyłaby nowe państwo, lecz pospieszne porozumienie grozi zamianą prywatnego kultu w zorganizowany bunt."
 ve_rel_evt.241.a:0 "Przekazać własność stopniowo."
 ve_rel_evt.241.b:0 "Nacjonalizuj ją natychmiast."
 ve_rel_evt.241.c:0 "Kierować aktywa do nadzorowanych instytucji opieki społecznej."

 ve_rel_evt.290.t:0 "Ugoda zapuszcza korzenie"
 ve_rel_evt.290.d:0 "Kryzys transformacyjny minął bez nadszarpnięcia ugody wyznaniowej kraju. Administratorzy działają obecnie według nowych zasad, społeczności wiedzą, na czym stoją, a rząd może przekuć to doświadczenie w kompetencję reformatorską bądź głębsze przeświadczenie publiczne."
 ve_rel_evt.290.a:0 "Przenieść te lekcje do kolejnej reformy."
 ve_rel_evt.290.a.tt:0 "Zyskaj #P 10#! Fundusz religijny."
 ve_rel_evt.290.b:0 "Publicznie potwierdzić ugodę."
 ve_rel_evt.290.b.tt:0 "Zyskaj #P 3#! Ugoda wyznaniowa."

 ve_rel_evt.291.t:0 "Krucha równowaga"
 ve_rel_evt.291.d:0 "Oficjalna transformacja dobiegła końca, lecz nowa ugoda pozostaje raczej owocem ostrożności niż głębokiego przekonania. Można pozwolić jej dojrzeć samorzutnie, wzmocnić ją kolejnym ograniczonym ustępstwem bądź ustabilizować za pomocą instytucji odpowiadających przyjętemu modelowi."
 ve_rel_evt.291.a:0 "Pozostawić kompromis bez zmian."
 ve_rel_evt.291.a.tt:0 "Transformacja dobiega końca bez dodatkowych efektów mechanicznych."
 ve_rel_evt.291.b:0 "Sfinansować ostatnie ustępstwo."
 ve_rel_evt.291.b.tt:0 "Wydaj #N 10#! Fundusz religijny i zyskaj #P 3#! Ugoda wyznaniowa."
 ve_rel_evt.291.c:0 "Powierzyć ugodę instytucjom dopasowanym do modelu."
 ve_rel_evt.291.c.tt:0 "Wydaj #N 5#! Fundusz religijny i zyskaj #P 2#! Ugoda wyznaniowa. Wymaga doktryny odpowiadającej przyjętemu Modelowi wyznaniowemu."

 ve_rel_evt.292.t:0 "Kryzys ugody"
 ve_rel_evt.292.d:0 "Modyfikator transformacyjny wygasł, a kraj wciąż nie zaakceptował nowego porządku religijnego. Rząd może przeznaczyć skąpą kompetencję reformatorską na doraźne ustępstwo, zdać się na instytucje dopasowane do modelu w celu przeprowadzenia węższej interwencji lub pozwolić nierozwiązanemu konfliktowi Zradykalizuj część populacji."
 ve_rel_evt.292.a:0 "Poniesiono cenę doraźnego ustępstwa."
 ve_rel_evt.292.a.tt:0 "Wydaj #N 15#! Fundusz religijny i zyskaj #P 5#! Ugoda wyznaniowa."
 ve_rel_evt.292.b:0 "Rząd nie ma już żadnych ustępstw do zaoferowania."
 ve_rel_evt.292.b.tt:0 "#N 0.25%#! populacji kraju staje się radykalne."
 ve_rel_evt.292.c:0 "Skorzystać z instytucji zbudowanych dla tej ugody."
 ve_rel_evt.292.c.tt:0 "Wydaj #N 5#! Fundusz religijny i zyskaj #P 2#! Ugoda wyznaniowa. Wymaga doktryny odpowiadającej przyjętemu Modelowi wyznaniowemu."

 ve_identity_transition_conciliatory_tt:0 "Wydaj #N 10#! Mandat kulturowy i zyskaj #P 3#! Spójność narodowa."
 ve_identity_transition_central_tt:0 "Zyskaj #P 5#! Mandat kulturowy i utratć #N 3#! Spójność narodowa."
 ve_identity_transition_doctrine_tt:0 "Wydaj #N 5#! Mandat kulturowy i zyskaj #P 2#! Spójność narodowa."

 ve_cul_evt.210.t:0 "Język urzędowy państwa"
 ve_cul_evt.210.d:0 "Nowy pakt narodowy wymaga wspólnego języka w sądach, szkołach i służbie publicznej. Natychmiastowe ujednolicenie byłoby łatwe w administracji, lecz wielu doświadczonych urzędników i obywateli nie spełnia jeszcze zaproponowanego standardu."
 ve_cul_evt.210.a:0 "Wprowadzić język poprzez stopniowe nauczanie."
 ve_cul_evt.210.b:0 "Wydać nakaz jednojęzyczności."
 ve_cul_evt.210.c:0 "Mobilizuj nacjonalistyczną administrację."

 ve_cul_evt.211.t:0 "Służba i przynależność"
 ve_cul_evt.211.d:0 "Służba wojskowa i status weterana stają się dowodami przynależności narodowej. Społeczności objęte nowym paktem domagają się czasu na adaptację, podczas gdy centrum upiera się, że przynależność musi wiązać się z jednym, jednolitym obowiązkiem."
 ve_cul_evt.211.a:0 "Przyznać zwolnienia przejściowe."
 ve_cul_evt.211.b:0 "Zastosować jeden obowiązek służby."
 ve_cul_evt.211.c:0 "Utworzyć uniwersalny rejestr służby."

 ve_cul_evt.220.t:0 "Rejestr równego obywatelstwa"
 ve_cul_evt.220.d:0 "Dawne kategorie etniczne i religijne pozostają zakorzenione w dokumentacji publicznej. Ich natychmiastowe usunięcie proklamowałoby równe obywatelstwo, lecz urzędy lokalne ostrzegają, że pochopne Nawrócenie mogłoby wymazać Roszczenia i zakłócić dostęp do usług."
 ve_cul_evt.220.a:0 "Wprowadzić etapowo wspólny rejestr obywatelski."
 ve_cul_evt.220.b:0 "Natychmiast usunąć dawne kategorie."
 ve_cul_evt.220.c:0 "Poddać Nawrócenie nadzorowi komisji ds. reform."

 ve_cul_evt.221.t:0 "Powszechna szkoła, powszechna służba"
 ve_cul_evt.221.d:0 "Równy dostęp istnieje w świetle prawa, lecz szkołom i urzędom publicznym brakuje personelu niezbędnego do jego zapewnienia. Rząd musi wybrać pomiędzy cierpliwymi inwestycjami, jednym egzekwowanym standardem centralnym a krajową siecią kwalifikacji akademickich."
 ve_cul_evt.221.a:0 "Zainwestować w nauczycieli i urzędników służby cywilnej."
 ve_cul_evt.221.b:0 "Egzekwować jeden centralny standard."
 ve_cul_evt.221.c:0 "Zbudować sieć kwalifikacji akademickich."

 ve_cul_evt.230.t:0 "Rada Ludów Składowych"
 ve_cul_evt.230.d:0 "Społeczności wymienione w pakcie państwa złożonego domagają się głosu w jego administracji. Otworzenie negocjacji może przynieść prawomocność, podczas gdy stała kwota zaprojektowana w stolicy obiecuje szybsze i bardziej przewidywalne uregulowanie sprawy."
 ve_cul_evt.230.a:0 "Podjąć otwarte negocjacje przedstawicielskie."
 ve_cul_evt.230.b:0 "Narzucić sztywną kwotę narzuconą przez stolicę."
 ve_cul_evt.230.c:0 "Doprowadzić do kompromisu parlamentarnego."

 ve_cul_evt.231.t:0 "Warstwowa administracja"
 ve_cul_evt.231.d:0 "Zwierzchnictwo lokalne i standardy centralne nakładają się obecnie w całym państwie złożonym. Bez jasnego protokołu każdy urząd będzie na nowo negocjować granice swoich kompetencji; przy zbyt sztywnym dowództwie pakt może utracić swoje znaczenie."
 ve_cul_evt.231.a:0 "Wynegocjować protokół kompetencji."
 ve_cul_evt.231.b:0 "Ustanowić centralne dowództwo."
 ve_cul_evt.231.c:0 "Utworzyć wspólny rejestr biurokratyczny."

 ve_cul_evt.290.t:0 "Nowy pakt narodowy"
 ve_cul_evt.290.d:0 "Reakcja zwrotna opadła, a nowa definicja przynależności narodowej zapuściła korzenie. Rząd może zachować lekcje administracyjne jako mandat kulturowy lub wykorzystać ten moment, aby wzmocnić przeświadczenie o słuszności paktu."
 ve_cul_evt.290.a:0 "Przenieść to doświadczenie do przyszłej sztuki rządzenia."
 ve_cul_evt.290.a.tt:0 "Zyskaj #P 10#! mandat kulturowy."
 ve_cul_evt.290.b:0 "Celebrować pakt w całym kraju."
 ve_cul_evt.290.b.tt:0 "Zyskaj #P 3#! spójność narodowa."

 ve_cul_evt.291.t:0 "Kruchy pakt"
 ve_cul_evt.291.d:0 "Oficjalna transformacja dobiegła końca, lecz nowa tożsamość narodowa wciąż spotyka się z nierówną akceptacją. Rząd może pozwolić kompromisowi dojrzeć, wydać ograniczony mandat na kolejne dostosowanie lub wzmocnić go poprzez instytucje odpowiadające przyjętemu modelowi."
 ve_cul_evt.291.a:0 "Pozwolić kompromisowi odnaleźć własne saldo."
 ve_cul_evt.291.a.tt:0 "Transformacja kończy się bez dodatkowego efektu mechanicznego."
 ve_cul_evt.291.b:0 "Sfinansować jedno ostateczne dostosowanie."
 ve_cul_evt.291.b.tt:0 "Wydaj #N 10#! mandat kulturowy i zyskaj #P 3#! spójność narodowa."
 ve_cul_evt.291.c:0 "Powierzyć pakt instytucjom dopasowanym do modelu."
 ve_cul_evt.291.c.tt:0 "Wydaj #N 5#! mandat kulturowy i zyskaj #P 2#! spójność narodowa. Wymaga doktryny odpowiadającej przyjętemu modelowi tożsamościowemu."

 ve_cul_evt.292.t:0 "Kryzys paktu narodowego"
 ve_cul_evt.292.d:0 "Reakcja zwrotna transformacji wygasła, lecz nowa definicja przynależności nie zdołała zyskać szerokiej lojalności. Rząd może przeznaczyć skromny mandat na nadzwyczajne dostosowanie, polegać na instytucjach dopasowanych do modelu w celu podjęcia węższej interwencji lub zaakceptować falę radykalizacji."
