l_polish:
 ve_national_identity:0 "Tożsamość narodowa"
 ve_primary_cultures_label:0 "Kultury dominujące"
 ve_identity_models:0 "Modele tożsamościowe"
 ve_identity_model_active_footer:0 "Już aktywny"
 ve_switch_identity_button:0 "Zmień"
 ve_switch_identity_cost_label:0 "Koszt: #Y 200 Mandat kulturowy#!"
 ve_begin_project_button:0 "Rozpocznij projekt"
 ve_identity_models_help:0 "Twój naród ma zawsze dokładnie jeden Model tożsamościowy i jest on #P już aktywny#! — nie musisz tutaj nic wybierać. Model decyduje jedynie o tym, jak zdobywana jest #Y Spójność narodowa#! oraz jaki Projekt kulturowy możesz prowadzić.\n#Y Zmiana jest opcjonalna:#! kosztuje #Y 200 Mandat kulturowy#!, resetuje Spójność do wartości #Y 35#!, anuluje wszelkie trwające Projekty kulturowe i blokuje kolejną zmianę na 5 lat.\n#Y Najedź kursorem na dowolną kartę lub wskaźnik, aby zobaczyć pełne efekty.#!"
 ve_ethnic_identity_name:0 "Państwo etniczne"
 ve_civic_identity_name:0 "Państwo obywatelskie"
 ve_composite_identity_name:0 "Państwo złożone"
 ve_ethnic_identity_short:0 "Naród definiowany wokół swoich kultur dominujących.\nSpójność wynika z #Y dominacji demograficznej#!."
 ve_civic_identity_short:0 "Naród polityczny budowany poprzez szkolnictwo.\nSpójność wynika z #Y piśmienności i zaakceptowanych mniejszości#!."
 ve_composite_identity_short:0 "Wiele ludów pod wynegocjowanymi instytucjami.\nSpójność wynika z #Y autentycznie pluralistycznej populacji#!."
 ve_ethnic_identity_unlocks:0 "Odblokowuje projekt #Y Kampania integracji etnicznej#!"
 ve_civic_identity_unlocks:0 "Odblokowuje projekt #Y Inicjatywa równego obywatelstwa#!"
 ve_composite_identity_unlocks:0 "Odblokowuje projekt #Y Pakt założycielski#!"
 ve_ethnic_identity_desc:0 "#header Państwo etniczne#!\nNaród jest definiowany wokół swoich kultur dominujących.\n\n#Y Pod tym wpływem#!\n#P +15% Asymilacja, +5% Zwierzchnictwo#!\n#N -5% Atrakcyjność migracji, +5% Radykałowie z otwartego uprzedzenia#!\n\n#Y Spójność#!\nRośnie, gdy kultury dominujące stanowią co najmniej 60–75% populacji, a spada gwałtownie poniżej 40%.\n\n#Y Przy 75 Spójność#!\n#P +5% Współczynnik poboru wojskowego, +3 Prawomocność#!\n\n#Y Projekt kulturowy#!\nKampania integracji etnicznej"
 ve_civic_identity_desc:0 "#header Państwo obywatelskie#!\nWspólny naród polityczny budowany jest poprzez edukację i partycypację.\n\n#Y Pod tym wpływem#!\n#P +7% Atrakcyjność migracji, +1% Dostęp do edukacji#!\n#N -10% Asymilacja, -5% Zwierzchnictwo, -50 Biurokracja#!\n\n#Y Spójność#!\nPiśmienność ją zwiększa, lecz każda kultura niebędąca dominującą, przekraczająca 10% populacji przy bardzo niskiej Akceptacji, ją obniża.\n\n#Y Przy 75 Spójność#!\n#P +5% Kwalifikacje, +3 Prawomocność#!\n\n#Y Projekt kulturowy#!\nInicjatywa równego obywatelstwa"
 ve_composite_identity_desc:0 "#header Państwo złożone#!\nWiele ludów rządzonych jest poprzez wynegocjowane instytucje.\n\n#Y Pod tym wpływem#!\n#P -10% Radykałowie z wymazywania kulturowego i obywatelstwa drugiej kategorii, +5% Wpływ#!\n#N -15% Asymilacja, -5% Zwierzchnictwo, -75 Biurokracja#!\n\n#Y Spójność#!\nAutentycznie pluralistyczna populacja ją zwiększa; populacja w ponad 90% złożona z kultur dominujących osłabia ten model.\n\n#Y Przy 75 Spójność#!\n#P +5% Wpływ, +3 Prawomocność#!\n\n#Y Projekt kulturowy#!\nPakt założycielski"
 ve_identity_change_cost_tt:0 "Zmiana Modelu tożsamościowego wymaga #Y 200 Mandat kulturowy#! oraz braku aktywnej reakcji zwrotnej po zmianie tożsamości. Zmiana resetuje Spójność do wartości #Y 35#!, wywołuje #Y 5-letnią reakcję zwrotną okresu przejściowego#! oraz anuluje każdy aktywny Projekt kulturowy bez dodatkowej kary za anulowanie."
 ve_cultural_mandate:0 "Mandat kulturowy"
 ve_culture_reform_point:0 "Mandat kulturowy"
 ve_cultural_mandate_hint:0 "Wydawany na Projekty kulturowe. Oszczędzanie go jest bezpieczne, lecz przychód spada o połowę po osiągnięciu 400 i zatrzymuje się na 500."
 ve_culture_reform_point_tt:0 "#header Mandat kulturowy#!\nAktualnie: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nMiesięczna zmiana: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Na co jest wydawany#!\nProjekty kulturowe (75–150) oraz zmiany Modelu tożsamościowego (200). Żadne z nich nie jest obowiązkowe: oszczędzanie Mandatu jest bezpieczne, przychód maleje o połowę dopiero przy 400 i ustaje przy 500.\n\n#Y Rozbicie miesięczne#!\nBaza: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nPrawomocność: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nSpołeczeństwo modelu: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nStabilność i Ruchy kulturowe: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nDopasowanie prawne: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nDoktryna ideowa: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nMnożnik limitu: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Doktryna ideowa – liczy się tylko Twój aktualny Model tożsamościowy#!\n#P Państwo etniczne#!: Nacjonalizm V #P +1#!\n#P Państwo obywatelskie#!: Reformizm V #P +1#!; Akademizm V #P +1#!\n#P Państwo złożone#!: Reformizm V #P +1#!\nPowyższa suma aktywna jest ograniczona do #Y +2#!.\n\nPaństwo obywatelskie czerpie składnik Społeczeństwo modelu z piśmienności, Państwo złożone z piśmienności w społeczeństwie pluralistycznym, a Państwo etniczne z siły demograficznej kultur dominujących.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Spójność narodowa"
 ve_national_cohesion_hint:0 "Zmierza w stronę równowagi generowanej przez Twój Model tożsamościowy. Przy wartości 75+ zyskujesz premię, przy 25 lub mniej – niestabilność."
 ve_national_cohesion_tt:0 "#header Spójność narodowa#!\nObecnie: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nRównowaga: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMiesięczna zmiana: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nTypowe warunki: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nWarunki modelu tożsamościowego: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nSpójność przesuwa się każdego miesiąca o 20% odległości w stronę równowagi, maksymalnie o 5 punktów. Radykalne ruchy kulturowe zmniejszają równowagę o 10. Przy wartości 75 lub wyższej obecny model zapewnia dodatkową korzyść; przy 25 lub niższej występuje niestabilność narodowa.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Brak efektu"
 ve_cultural_projects:0 "Projekty kulturowe"
 ve_cultural_projects_intro:0 "Projekty kulturowe są #Y opcjonalne#!. W tym samym czasie może być aktywny tylko jeden: koszt w Mandacie kulturowym jest opłacany natychmiast, a przez cały czas jego trwania obowiązują #N -75 Biurokracja i -25 Zwierzchnictwo#!. Ukończenie projektu zwraca część Mandatu kulturowego i zwiększa Spójność narodową. Projekty ogólnokrajowe mogą zostać powtórzone dopiero po wygaśnięciu ich premii za ukończenie; ukończonego celu w obszarze administracyjnym / kulturze nie można wybrać ponownie.\n#Y Najedź kursorem na dowolną kartę lub wskaźnik, aby poznać ich pełne efekty.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Projekt w toku"
 ve_cultural_project_progress:0 "Postęp projektu"
 ve_cultural_project_progress_tt:0 "#header Miesięczny postęp projektu#!\nObecnie: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nPozostało: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nMiesięczna suma: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (minimum 1, maksimum 7)\n\n#Y Miesięczne rozbicie#!\nBaza: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLegitymizacja: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nModel Społeczeństwo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nSpójność: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nRuchy kulturowe: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nZamęt w docelowym obszarze administracyjnym: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nKatalogi doktryn: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Katalogi doktryn — aktywne są wyłącznie bonusy pasujące do Twojego obecnego Model tożsamościowy#!\n#P Państwo etniczne#!: Nacjonalizm VII #P +1#!\n#P Państwo obywatelskie#!: Reformizm VII, Akademizm VII lub Opieka społeczna VI – #P +1#! każde\n#P Państwo złożone#!: Reformizm VII lub Dyplomacja VI – #P +1#! każde\nPowyższa suma aktywnych katalogów doktryn jest ograniczona do #Y +2#!; wszelkie kolejne pasujące bonusy nie zwiększają postępu.\n\nModel Społeczeństwo nagradza piśmienność obywatelską, koncentrację demograficzną etniczności lub różnorodność złożoną zgodnie z aktywnym Model tożsamościowy. Ukończenie następuje podczas kolejnej miesięcznej aktualizacji po osiągnięciu wartości #Y 100#! postępu."
 ve_cancel_cultural_project_button:0 "Anuluj projekt"
 ve_cancel_cultural_project_tt:0 "#header Anuluj projekt kulturowy#!\nZainwestowany Mandat kulturowy #N nie jest zwracany#!. Spójność narodowa spada o #N 5#!, a #N 2-letnia reakcja zwrotna#! uniemożliwia rozpoczęcie kolejnego projektu."
 ve_start_cultural_project_button:0 "Rozpocznij projekt"
 ve_national_curriculum_name:0 "Program szkolny"
 ve_national_curriculum_cost:0 "Koszt: #Y 100 Mandat kulturowy#!"
 ve_national_curriculum_short:0 "Ogólnokrajowa reforma szkolnictwa.\n#P +20 Mandat, +5 Spójność#!, a następnie lepsza edukacja."
 ve_national_curriculum_desc:0 "#header Program szkolny#!\nReforma szkolnictwa przeprowadzona w całym kraju.\n\n#Y Koszt#!\n#Y 100 Mandat kulturowy#!, płatne natychmiast\n\n#Y Po ukończeniu#!\n#P +20 Mandat kulturowy, +5 Spójność narodowa#!\n\n#Y Przez następne 10 lat#!\n#P +2% Dostęp do edukacji, +5% Kwalifikacje#!\n#N -25 Biurokracja#!"
 ve_national_curriculum_requirements_tt:0 "Wymaga #Y 100 Mandat kulturowy#!, braku aktywnego projektu kulturowego oraz braku reakcji zwrotnej po projekcie. Nie można go również rozpocząć, gdy aktywna jest poprzednia premia z tytułu #Y Program szkolny#!."
 ve_shared_symbols_name:0 "Wspólne symbole"
 ve_shared_symbols_cost:0 "Koszt: #Y 75 Mandat kulturowy#!"
 ve_shared_symbols_short:0 "Flagi, hymny i uroczystości publiczne.\n#P +20 Mandat, +7 Spójność#!, a następnie lojaliści i Zwierzchnictwo."
 ve_shared_symbols_desc:0 "#header Wspólne symbole#!\nFlagi, hymny i uroczystości publiczne promowane w całym kraju.\n\n#Y Koszt#!\n#Y 75 Mandat kulturowy#!, płatne natychmiast\n\n#Y Po ukończeniu#!\n#P +20 Mandat kulturowy, +7 Spójność narodowa#!\n\n#Y Przez następne 8 lat#!\n#P +10% Lojaliści spośród w pełni zaakceptowanych zbiorowości, +25 Zwierzchnictwo#!"
 ve_shared_symbols_requirements_tt:0 "Wymaga #Y 75 Mandat kulturowy#!, braku aktywnego projektu kulturowego oraz braku reakcji zwrotnej po projekcie. Nie można go również rozpocząć, gdy aktywna jest poprzednia premia z tytułu #Y Wspólne symbole#!."
 ve_ethnic_campaign_name:0 "Kampania integracji etnicznej"
 ve_ethnic_campaign_cost:0 "Koszt: #Y 125 Mandat kulturowy#!"
 ve_ethnic_campaign_short:0 "Asymiluje dużą mniejszość w jednym obszarze administracyjnym.\n#P +25 Mandat, +8 Spójność#!, lecz tworzy radykałów."
 ve_ethnic_campaign_desc:0 "#header Kampania integracji etnicznej#!\nPrzeprowadzana w pojedynczym obszarze administracyjnym przeciwko jego największej kulturze niebędącej kulturą dominującą, która musi stanowić co najmniej #Y 5%#! populacji tego obszaru administracyjnego.\n\n#Y Koszt#!\n#Y 125 mandat kulturowy#!, płatne natychmiast\n\n#Y Po ukończeniu#!\nAsymiluje #Y 5%#! kultury docelowej w kulturę dominującą lub #Y 7%#! z nacjonalizmem VII\n#P +25 mandat kulturowy, +8 spójność narodowa#!\nPozostawia w obszarze administracyjnym #Y 10-letni#! program asymilacji\n\n#Y Ostrzeżenie#!\n#N Zarówno rozpoczęcie, jak i ukończenie projektu wywołuje radykałów wśród kultury docelowej.#!"
 ve_civic_initiative_name:0 "Inicjatywa równego obywatelstwa"
 ve_civic_initiative_cost:0 "Koszt: #Y 100 mandat kulturowy#!"
 ve_civic_initiative_short:0 "Podnieś akceptację mniejszości w jednym obszarze administracyjnym.\n#P +25 mandat, +10 spójność#! oraz lojaliści."
 ve_civic_initiative_desc:0 "#header Inicjatywa równego obywatelstwa#!\nPrzeprowadzana w pojedynczym obszarze administracyjnym wobec jego największej kultury niebędącej kulturą dominującą, która musi stanowić co najmniej #Y 5%#! populacji tego obszaru administracyjnego.\n\n#Y Koszt#!\n#Y 100 mandat kulturowy#!, płatne natychmiast\n\n#Y Po ukończeniu#!\n#P +15 akceptacja dla tej kultury na 10 lat#!\nLojaliści w docelowym obszarze administracyjnym\n#P +25 mandat kulturowy, +10 spójność narodowa#!\nDziesięć lat usprawnionych kwalifikacji i atrakcyjności migracji"
 ve_composite_compact_name:0 "Pakt założycielski"
 ve_composite_compact_cost:0 "Koszt: #Y 150 mandat kulturowy#! i #Y 40 spójność#!"
 ve_composite_compact_short:0 "Uznaj mniejszość za kulturę założycielską.\n#P +30 mandat, +12 spójność#!, na stałe."
 ve_composite_compact_desc:0 "#header Pakt założycielski#!\nPrzeprowadzany w pojedynczym obszarze administracyjnym wobec nieuznanej kultury niebędącej kulturą dominującą, stanowiącej co najmniej #Y 5%#! populacji tego obszaru administracyjnego.\n\n#Y Koszt#!\n#Y 150 mandat kulturowy#!, płatne natychmiast, oraz co najmniej #Y 40 spójność narodowa#!\n\n#Y Po ukończeniu#!\n#P +15 akceptacja dla tej kultury, na stałe#!\nUznaje ją za kulturę założycielską\nLojaliści w docelowym obszarze administracyjnym\n#P +30 mandat kulturowy, +12 spójność narodowa#!"
 ve_targeted_project_start_instruction:0 "#Y Jak to rozpocząć#!\n1. Otwórz jeden ze swoich obszarów administracyjnych.\n2. Naciśnij #Y Rozpocznij projekt#! w panelu tego obszaru administracyjnego.\nKultura docelowa oraz wszystkie brakujące elementy zostaną wymienione w podpowiedzi tego przycisku."
 ve_targeted_project_state_requirements_tt:0 "Obszar administracyjny musi należeć do nas i zawierać odpowiednią kulturę niebędącą kulturą dominującą, stanowiącą co najmniej #Y 5%#! jego populacji. Największa odpowiednia kultura staje się celem. Kultura, której projekt w tym obszarze administracyjnym został już ukończony, nie może być ponownie celem, ale może nim zostać w innym obszarze administracyjnym. Muszą również zostać spełnione koszt i wymagania obecnego modelu tożsamościowego."
 ve_targeted_cultural_project_target:0 "Cel: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! w #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Zakres: #Y Cały kraj#!"
 ve_no_cultural_project_target:0 "Brak celu projektu"
 ve_no_active_cultural_project:0 "Brak aktywnego projektu kulturowego"

