 ve_cohesion_tier_high:0 "SPÓJNY – [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "FRAGMENTOWANY – #N występuje niestabilność narodowa#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% współczynnika poboru i +3 legitymizacji#!."
 ve_civic_high_cohesion_effect:0 "#P +5% kwalifikacji i +3 legitymizacji#!."
 ve_composite_high_cohesion_effect:0 "#P +5% wpływu i +3 legitymizacji#!."
 ve_identity_transition_backlash_notice:0 "Reakcja na przeniesienie tożsamości jest nadal aktywna – modelu nie można ponownie przełączyć, dopóki nie wygaśnie."
 ve_cultural_project_backlash_notice:0 "Anulowany projekt nadal blokuje nowy – najpierw musi wygasnąć 2-letni backlash."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Bluz przejściowy aktywny"
 ve_cultural_project_backlash_notice_short:0 "Brak anulowania aktywny"
 ve_targeted_project_start_instruction_short:0 "Uruchom go z jednego ze swoich stanów: otwórz stan i naciśnij przycisk #Y Start projektu#!."
