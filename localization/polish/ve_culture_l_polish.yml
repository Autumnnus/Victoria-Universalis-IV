l_polish:
 ve_national_identity:0 "Tożsamość narodowa"
 ve_primary_cultures_label:0 "Kultury pierwotne"
 ve_identity_models:0 "Modele tożsamości"
 ve_identity_model_active_footer:0 "Już aktywne"
 ve_switch_identity_button:0 "Koszty"
 ve_switch_identity_cost_label:0 "zmiany #Y 200 Mandat kulturowy#!"
 ve_begin_project_button:0 "Rozpocznij projekt"
 ve_identity_models_help:0 "Twój naród zawsze ma dokładnie jeden Model Tożsamości i jest nim #P już aktywne#!  — nie musisz tutaj niczego wybierać. Model decyduje tylko w jaki sposób #Y Spójność narodowa#! zarabiasz i jaki projekt kulturalny możesz uruchomić.\n#Y Zmiana jest opcjonalna:#! kosztuje #Y 200 Mandatów Kulturalnych#!, resetuje Spójność do #Y 35#!, anuluje wszystkie trwające Projekty Kulturalne i blokuje kolejną zmianę na 5 lat.\n#Y Najedź kursorem na dowolną kartę lub licznik, aby uzyskać pełne efekty.#!"
 ve_ethnic_identity_name:0 "Naród etniczny"
 ve_civic_identity_name:0 "Naród obywatelski"
 ve_composite_identity_name:0 "Państwo złożone"
 ve_ethnic_identity_short:0 "Naród jest zdefiniowany wokół swoich podstawowych kultur.\nSpójność pochodzi z #Y demografii dominacja#!."
 ve_civic_identity_short:0 "Naród polityczny zbudowany poprzez edukację.\nSpojność pochodzi #Y umiejętności czytania i pisania oraz akceptowane mniejszości#!."
 ve_composite_identity_short:0 "Kilka narodów objętych wynegocjowanymi instytucjami.\nSpójność pochodzi z #Y prawdziwie mnogą populację#!."
 ve_ethnic_identity_unlocks:0 "Odblokowuje #Y Kampania Integracji Etnicznej#! projekt"
 ve_civic_identity_unlocks:0 "Odblokowuje #Y Inicjatywa na rzecz Równego Obywatelstwa#! projekt"
 ve_composite_identity_unlocks:0 "Odblokowuje #Y Kompakt składowy#! projekt"
 ve_ethnic_identity_desc:0 "#header Naród etniczny#!\nNaród jest zdefiniowany wokół jego podstawowych kultur.\n\n#Y Podczas aktywności#!\n#P +15% Asymilacja, +5% Władza#!\n#N -5% Przyciąganie do migracji, +5% Radykałowie z otwartych uprzedzeń#!\n\n#Y Spójność#!\nRośnie, gdy kultury pierwotne stanowią co najmniej 60–75% populacji i spada gwałtownie poniżej 40%.\n\n#Y Przy 75 Spójności#!\n#P +5% wskaźnika poboru do wojska, +3 legitymizacji#!\n\n#Y Projekt kulturalny#!\nKampania integracji etnicznej"
 ve_civic_identity_desc:0 "#header Naród obywatelski#!\nWspólny naród polityczny buduje się poprzez edukację i uczestnictwo.\n\n#Y Podczas aktywności#!\n#P +7% Przyciąganie migracyjne, +1% Dostęp do edukacji#!\n#N -10% asymilacja, -5% Autorytetu, -50 Biurokracja#!\n\n#Y Spójność#!\nUmiejętność czytania i pisania podnosi go, ale każda kultura inna niż podstawowa powyżej 10% populacji z bardzo niską akceptacją obniża ją.\n\n#Y Przy 75 Spójności#!\n#P +5% Kwalifikacji, +3 Legitymizacji#!\n\n#Y Kultura Projekt#!\nInicjatywa na rzecz Równego Obywatelstwa"
 ve_composite_identity_desc:0 "#header Państwo złożone#!\nKilka narodów rządzonych jest przez wynegocjowane instytucje.\n\n#Y Podczas aktywności#!\n#P -10% radykałów pochodzących z wymazania kulturowego i obywatelstwa drugiej kategorii, +5% wpływu#!\n#N -15% Asymilacja, -5% Władza, -75 Biurokracja#!\n\n#Y Spójność#!\nPodnosi ją prawdziwie pluralistyczna populacja; populacja powyżej 90% kultur pierwotnych osłabia ten model.\n\n#Y Przy 75 Spójności#!\n#P +5% wpływów, +3 legitymizacji#!\n\n#Y Projekt kulturalny#!\nUmowa konstytucyjna"
 ve_identity_change_cost_tt:0 "Zmiana modelu tożsamości wymaga #Y 200 mandatów kulturowych#! i brak aktywnych reakcji na zmianę tożsamości. Zmiana resetuje Spójność do #Y 35#!, powoduje: #Y 5-letni sprzeciw przejściowy#! i anuluje każdy aktywny projekt kulturalny bez dodatkowej kary za anulowanie."
 ve_cultural_mandate:0 "Mandat kulturalny"
 ve_culture_reform_point:0 " Mandat kulturalny"
 ve_cultural_mandate_hint:0 "Wydane na projekty kulturalne. Oszczędzanie jest bezpieczne, ale dochody zmniejszają się o połowę na 400 i zatrzymują się na 500."
 ve_culture_reform_point_tt:0 "#header  Mandat Kulturalny#!\nBieżące: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nZmiana miesięczna: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Na co są wydawane#!\nProjekty kulturalne (75–150) i zmiany modelu tożsamości (200). Żadne z nich nie jest wymagane: oszczędzanie Mandatu jest bezpieczne, dochód zmniejsza się tylko o połowę przy 400 i kończy na 500.\n\n#Y Podział miesięczny#!\nPodstawa: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLegitymizacja: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nModelowe społeczeństwo: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nStabilność i ruchy kulturalne: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nDopasowanie prawa: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nDoktryna idei: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nCap mnożnik: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Doktryna idei — liczy się tylko Twój aktualny Model Tożsamości#!\n#P Naród etniczny#!: Nacjonalista V #P +1#!\n#P Naród obywatelski#!: Reformista V #P +1#!; Akademickie V #P +1#!\n#P Państwo złożone#!: Reformatorskie V #P +1#!\nPowyższa aktywna suma jest ograniczona do #Y +2#!.\n\nNaród Obywatelski czerpie komponent Modelowego Społeczeństwa z umiejętności czytania i pisania, Państwo Złożone z umiejętności czytania i pisania w społeczeństwie pluralistycznym, a Naród Etniczny z siły demograficznej kultury pierwotnej.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Spójność narodowa"
 ve_national_cohesion_hint:0 " dryfuje w kierunku równowagi, którą wytwarza Twój Model Tożsamości. Przy wieku 75+ zyskujesz premię, przy niestabilności na poziomie 25 lub mniej."
 ve_national_cohesion_tt:0 "#header Spójność narodowa#!\nObecna: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nRównowaga: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nRuch miesięczny: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nWarunki typowe: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nWarunki modelu tożsamości: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nSpójność przesuwa się o 20% dystansu w kierunku równowagi co miesiąc, do 5 punkty. Radykalne ruchy kulturalne zmniejszają równowagę o 10. W wieku 75 lat lub więcej obecny model zapewnia dodatkową korzyść; w wieku 25 lub mniej obowiązuje niestabilność narodowa.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Brak efektu"
 ve_cultural_projects:0 "Projekty kulturalne"
 ve_cultural_projects_intro:0 "Projekty kulturalne są #Y fakultatywny#!. W danym momencie może działać tylko jeden: jego koszt Mandatu jest płacony natychmiast i #N -75 Biurokracja i -25 Władza#! aplikuj tak długo, jak działa. Ukończenie projektu zwraca część Mandatu i zwiększa Spójność. Projekty o zasięgu ogólnopolskim można powtarzać dopiero po wygaśnięciu świadczenia za ich zakończenie; ukończony cel Stan/Kultura nie może zostać wybrany ponownie.\n#Y Najedź kursorem na dowolną kartę lub licznik, aby zobaczyć pełne efekty.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Projekt w toku"
 ve_cultural_project_progress:0 "Postęp projektu"
 ve_cultural_project_progress_tt:0 "#header Miesięczny postęp projektu#!\nAktualne: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nPozostałe: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nSuma miesięczna: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (minimum 1, maksymalnie 7)\n\n#Y Podział miesięczny#!\nPodstawa: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nUprawnienie: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nModel społeczeństwa: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nSpójność: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nKulturowy Ruchy: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nZamęt w państwie docelowym: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nGrupy idei: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Grupy idei — aktywne są tylko bonusy odpowiadające Twojemu aktualnemu modelowi tożsamości#!\n#P Naród etniczny#!: Nacjonalista VII #P +1#!\n#P Naród obywatelski#!: Reformista VII, Akademik VII lub Opieka socjalna VI — #P +1#! każde\n#P Państwo złożone#!: Reformatorskie VII lub Dyplomatyczne VI — #P +1#! każdy\nPowyższa suma aktywnych grup pomysłów jest ograniczona do #Y +2#!; wszelkie dodatkowe premie nie zwiększają postępu.\n\nTowarzystwo Modelowe nagradza umiejętność korzystania z obywatelstwa, koncentrację etniczno-demograficzną lub złożoną różnorodność zgodnie z aktywnym Modelem Tożsamości. Ukończenie zostanie rozpatrzone podczas następnej comiesięcznej aktualizacji po osiągnięciu postępu #Y 100#!."
 ve_cancel_cultural_project_button:0 "Anuluj projekt"
 ve_cancel_cultural_project_tt:0 "#header Anuluj projekt kulturalny#!\nZainwestowany Mandat kulturalny wynosi #N nie zwrócone#!. Spada spójność narodowa #N 5#! i a #N 2-letni sprzeciw#! uniemożliwia kolejny projekt."
 ve_start_cultural_project_button:0 "Rozpoczęcie projektu"
 ve_national_curriculum_name:0 "Krajowy program nauczania"
 ve_national_curriculum_cost:0 "Koszt: #Y 100 mandatów kulturowych#!"
 ve_national_curriculum_short:0 "Ogólnokrajowa reforma szkolnictwa.\n#P +20 mandatów, +5 spójność#!, potem lepsza edukacja."
 ve_national_curriculum_desc:0 "#header Narodowy program nauczania#!\nReforma oświaty obejmująca cały kraj.\n\n#Y Koszt#!\n#Y 100 Mandatów Kulturalnych#!, płatne natychmiast\n\n#Y Po ukończeniu#!\n#P +20 Mandatów Kulturalnych, +5 Spójności Narodowej#!\n\n#Y Przez 10 lat#!\n#P +2% Dostępu do Edukacji, +5% Kwalifikacji#!\n#N -25 Biurokracja#!"
 ve_national_curriculum_requirements_tt:0 "Wymaga #Y 100 Mandatów Kulturalnych#!, brak aktywnego projektu kulturalnego i brak sprzeciwu wobec projektu. Nie może również rozpocząć się w trakcie poprzedniego #Y Krajowy program nauczania#! korzyść jest aktywna."
 ve_shared_symbols_name:0 "Wspólne symbole"
 ve_shared_symbols_cost:0 "Koszt: #Y 75 Mandatu Kulturalnego#!"
 ve_shared_symbols_short:0 "Flagi, hymny i ceremonia publiczna.\n#P +20 Mandatu, +7 Spójności#!, następnie lojaliści i Władza."
 ve_shared_symbols_desc:0 "#header Wspólne symbole#!\nFlagi, hymny i ceremonie publiczne promowane w całym kraju.\n\n#Y Koszt#!\n#Y 75 Mandat kulturalny#! płatne natychmiast\n\n#Y Po ukończeniu#!\n#P +20 mandatu kulturalnego, +7 spójności narodowej#!\n\n#Y Przez 8 lat później#!\n#P +10% lojalistów z w pełni akceptowanych popów, +25 autorytetów#!"
 ve_shared_symbols_requirements_tt:0 "Wymaga #Y 75 Mandat kulturalny#!, brak aktywnego projektu kulturalnego i brak reakcji na projekt. Nie może również rozpocząć się w trakcie poprzedniego #Y Wspólne symbole#! korzyść jest aktywna."
 ve_ethnic_campaign_name:0 "Kampania na rzecz integracji etnicznej"
 ve_ethnic_campaign_cost:0 "Koszt: #Y 125 Mandat kulturowy#!"
 ve_ethnic_campaign_short:0 "Asymiluj dużą mniejszość w jednym państwie.\n#P +25 Mandat, +8 Spójność#!, ale tworzy radykały."
 ve_ethnic_campaign_desc:0 "#header Kampania integracji etnicznej#!\nProwadź w jednym państwie przeciwko jego największej kulturze innej niż pierwotna, która musi obejmować co najmniej #Y 5%#! populacji tego stanu.\n\n#Y Koszt#!\n#Y 125 Mandat kulturalny#!, płatny natychmiast\n\n#Y Po ukończeniu#!\nAsymiluje #Y 5%#! kultury docelowej w kulturę pierwotną lub #Y 7%#! z nacjonalistycznym VII\n#P +25 Mandatem kulturowym, +8 Spójności narodowej#!\nPozostawia #Y 10-letni#! program asymilacji w państwie\n\n#Y Ostrzeżenie#!\n#N Zarówno rozpoczęcie, jak i zakończenie projektu tworzą radykały wśród kultury docelowej.#!"
 ve_civic_initiative_name:0 "Równe obywatelstwo Inicjatywa"
 ve_civic_initiative_cost:0 "Koszt: #Y 100 Mandatów Kulturalnych#!"
 ve_civic_initiative_short:0 "Zwiększ akceptację mniejszości w jednym stanie.\n#P +25 mandatu, +10 spójności#! plus lojaliści."
 ve_civic_initiative_desc:0 "#header Inicjatywa na rzecz równości obywatelstwa#!\nProwadź w jednym stanie w oparciu o jego największą kulturę inną niż podstawowa, która musi obejmować co najmniej #Y 5%#! populacji tego stanu.\n\n#Y Koszt#!\n#Y 100 Mandatu kulturalnego#!, opłacone natychmiast\n\n#Y Po ukończeniu#!\n#P +15 Akceptacja dla tej kultury na 10 lat#!\nLojaliści w państwie docelowym\n#P +25 mandatu kulturalnego, +10 spójności narodowej#!\nDziesięć lat poprawy kwalifikacji i atrakcyjności migracyjnej"
 ve_composite_compact_name:0 "Porozumienie konstytucyjne"
 ve_composite_compact_cost:0 "Koszt: #Y 150 mandatu kulturalnego#! i #Y 40 spójności#!"
 ve_composite_compact_short:0 "uznanie mniejszości jako kultury składowej.\n#P +30 mandatu, +12 Spójność#!, na stałe."
 ve_composite_compact_desc:0 "#header Umowa składowa#!\nDziała w jednym stanie na nierozpoznanej, innej niż podstawowa kulturze, posiadającej co najmniej #Y 5%#! populacji tego stanu.\n\n#Y Koszt#!\n#Y 150 Mandatu Kulturalnego#!, płatne natychmiast i co najmniej #Y 40 Spójności Narodowej#!\n\n#Y Po ukończeniu#!\n#P +15 Akceptacja dla tej kultury, na stałe#!\nUznaje ją jako kulturę składową\nLojaliści w państwie docelowym\n#P +30 Mandatu Kulturalnego, +12 Spójność narodowa#!"
 ve_targeted_project_start_instruction:0 "#Y Jak zacząć#!\n1. Otwórz jeden ze swoich stanów.\n2. Naciśnij #Y Rozpocznij projekt#! w panelu tego stanu.\nDocelowa kultura i wszystko, czego jeszcze brakuje, są wymienione w podpowiedzi tego przycisku."
 ve_targeted_project_state_requirements_tt:0 "Państwo musi być naszą własnością i zawierać kwalifikującą się kulturę pozapodstawową obejmującą co najmniej #Y 5%#! swojej populacji. Celem staje się największa kwalifikująca się kultura. Kultura już ukończona w tym Stanie nie może być celem ponownie, ale może być celem w innym Stanie. Należy również spełnić koszt i wymagania obecnego modelu tożsamości."
 ve_targeted_cultural_project_target:0 "Cel: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! W #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Zakres: #Y Cały kraj#!"
 ve_no_cultural_project_target:0 "Brak celu projektu"
 ve_no_active_cultural_project:0 "Brak aktywnego projektu kulturalnego"

