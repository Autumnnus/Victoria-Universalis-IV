 ve_cohesion_tier_high:0 "SPÓJNY – [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "ZROZBITY – #N stosuje się niestabilność narodową#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% współczynnik poboru wojskowego i +3 prawomocność#!."
 ve_civic_high_cohesion_effect:0 "#P +5% kwalifikacje i +3 prawomocność#!."
 ve_composite_high_cohesion_effect:0 "#P +5% wpływ i +3 prawomocność#!."
 ve_identity_transition_backlash_notice:0 "Reakcja zwrotna przejścia tożsamości jest nadal aktywna – modelu nie można ponownie zmienić, dopóki nie wygaśnie."
 ve_cultural_project_backlash_notice:0 "Anulowany projekt nadal blokuje nowy – 2-letnia reakcja zwrotna musi najpierw wygasnąć."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Aktywna reakcja zwrotna przejścia"
 ve_cultural_project_backlash_notice_short:0 "Aktywna reakcja zwrotna anulowania"
 ve_targeted_project_start_instruction_short:0 "Rozpocznij z jednego ze swoich obszarów administracyjnych: otwórz obszar administracyjny i naciśnij #Y Rozpocznij projekt#!."
