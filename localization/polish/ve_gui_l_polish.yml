 ve_tb_insight_tt:0 "$ve_national_insight_tt$$ve_tb_click_ideas$"
 ve_tb_idea_groups_tt:0 "$embrace_idea_tt$\n\n#title Postęp doktryny narodowej#!\n#Y [GetPlayer.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\nDoktryny narodowe odblokowują się przy #Y 3, 6, 9, 12, 15, 18#! oraz #Y 21#! aktywnych zakupionych doktrynach grup.$ve_tb_click_ideas$"
