 ve_send_missionary_tt:0 "#variable Misjonarz nawraca religię miejscowej ludności co #gold 6 miesięcy.\n\n#white Jeśli populacja stanu jest mniejsza niż 250 tys.: #darker_white 0% #white Podstawowa moc konwersji Zanik\n#white Jeśli populacja stanu jest mniejsza niż 500 tys.: #negative_value -0,02% #white Spadek mocy podstawowej konwersji\n#white Jeśli populacja stanu jest mniejsza niż 750 tys.: #negative_value -0,03% #white Spadek mocy podstawowej konwersji\n#white Jeśli populacja stanu jest mniejsza niż 1 m: #negative_value -0,04% #white Zanik mocy podstawowej konwersji\n#white Jeśli populacja stanu jest poniżej 5 m: #negative_value -0,043% #white Spadek mocy podstawowej konwersji\n#white Jeśli populacja stanu jest mniejsza niż 10 m: #negative_value -0,045% #white Spadek mocy podstawowej konwersji\n#white Jeśli populacja stanu przekracza 10m+: #negative_value -0,0475% #white Spadek mocy podstawowej konwersji"
