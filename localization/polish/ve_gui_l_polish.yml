 ve_targeted_religious_project_state_action:0 "#tooltippable_name Ukierunkowany projekt religijny"
 ve_targeted_religious_project_state_action_tt:0 "#header Ukierunkowany projekt religijny#!\nRozpoczyna projekt związany z obecnym modelem religijnym przeciwko strukturze religijnej tego stanu. Totalnej separacji nie można rozpocząć. Otwórz panel Religia, aby zobaczyć dokładne koszty, zasady postępu i wyniki."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Ukierunkowany projekt kulturalny"
 ve_start_religious_project_button:0 "Rozpocznij projekt"
 ve_cancel_religious_project_button:0 "Anuluj projekt"
 ve_confirm_cancel_button:0 "#N Tak, anuluj#!"
 ve_keep_project_button:0 "Zachowaj projekt"
 ve_targeted_religious_project_state_requirements_tt:0 "Państwo musi być naszą własnością, a nasza religia nie może już istnieć #Y 90%#! lub więcej jego populacji. Konfesjonał, Wolność Sumienia i Ateizm Państwowy mogą rozpocząć jedno; Całkowita separacja nie jest możliwa. Należy także pokryć koszt Reformy Pobożności aktywnego Modelu Religijnego."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "Model religijny pozwala na projekt celowy (całkowita separacja nie może go rozpocząć)"
 ve_religious_project_req_no_active:0 "Żaden ukierunkowany projekt religijny już nie jest w toku"
 ve_religious_project_req_no_backlash:0 "Nie w trakcie 24-miesięcznego okresu odnowienia po anulowaniu projektu"
 ve_religious_project_req_reform_point:0 "Wystarczająca reforma pobożności dla aktywnego modelu religijnego (#Y 125#! Konfesjonał / #Y 100#! Wolność sumienia / #Y 150#! Ateizm państwowy)"
 ve_religious_project_req_target:0 "Nasza religia wyznaje mniej niż #Y 90%#! populacji tego stanu"
 ve_religious_project_cancel_warning:0 "#header Anulować ukierunkowany projekt religijny?#!\n\nPoczyniony dotychczas postęp został utracony. #N -5 Osadnictwo religijne#! i przed rozpoczęciem kolejnego projektu stosuje się #N 24-miesięczny#! modyfikator przestoju."
 ve_cultural_project_req_no_active:0 "Żaden projekt kulturalny już w toku"
 ve_cultural_project_req_no_backlash:0 "Nie w trakcie 24-miesięcznego przestoju po anulowaniu projektu"
 ve_cultural_project_req_reform_point:0 "Wystarczający Mandat Kulturowy dla aktywnego Modelu Tożsamości (#Y 125#! Etniczny / #Y 100#! Obywatelski / #Y 150#! Złożony plus #Y 40#! Cohesion for Composite)"
 ve_cultural_project_req_target:0 "W tym stanie znajduje się kwalifikująca się kultura inna niż podstawowa, w której znajduje się co najmniej #Y 5%#! populacji."
 ve_cultural_project_cancel_warning:0 "#header Anulować projekt kulturalny?#!\n\nPoczyniony dotychczas postęp został utracony. #N -5 Spójność narodowa#! i #N 24-miesięczny#! modyfikator czasu odnowienia są stosowane przed rozpoczęciem kolejnego projektu."
 alert_can_unlock_ideas_name:0 "Może przyjąć pomysł"
 alert_can_unlock_ideas_hint:0 "Mamy wystarczającą wiedzę narodową na kolejny pomysł co najmniej jednej przyjętej grupy i żaden cykl wdrażania doktryny nie blokuje obecnie zakupu."
 alert_max_piety_name:0 "Może przyjąć program państwa religijnego"
 alert_max_piety_hint:0 "Nasza reforma pobożności jest na tyle wysoka, że ​​można przyjąć inny program religijny."
 alert_ve_can_begin_cultural_project_name:0 "Nawarstwianie się mandatów kulturowych"
 alert_ve_can_begin_cultural_project_hint:0 "To już koniec #Y 300#! Mandat kulturalny i projekt kulturalny, moglibyśmy rozpocząć. Dochód mandatowy zmniejsza się o połowę przy 400 i zatrzymuje się przy 500, więc warto wydać. Nic nie jest wymuszone: nasz Model Tożsamości jest już aktywny."
 alert_can_unlock_age_bonus_name:0 "Może odblokować nagrodę epoki"
 alert_can_unlock_age_bonus_hint:0 "Mamy wystarczająco dużo Impetu Ery, aby wybrać inną nagrodę."
