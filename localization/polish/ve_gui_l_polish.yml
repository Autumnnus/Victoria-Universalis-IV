 ve_targeted_religious_project_state_action:0 "#tooltippable_name Celowy projekt wyznaniowy"
 ve_targeted_religious_project_state_action_tt:0 "#header Celowy projekt wyznaniowy#!\nRozpoczyna projekt powiązany z obecnym modelem wyznaniowym wymierzony w strukturę religijną tego obszaru administracyjnego. Całkowity rozdział uniemożliwia jego rozpoczęcie. Otwórz panel religii, aby poznać dokładne koszty, zasady postępu i skutki."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Celowy projekt kulturowy"
 ve_start_religious_project_button:0 "Rozpocznij projekt"
 ve_cancel_religious_project_button:0 "Anuluj projekt"
 ve_confirm_cancel_button:0 "#N Tak, anuluj#!"
 ve_keep_project_button:0 "Zachowaj projekt"
 ve_targeted_religious_project_state_requirements_tt:0 "Obszar administracyjny musi należeć do nas, a nasza własna religia nie może już obejmować #Y 90%#! lub więcej jego populacji. Państwo wyznaniowe, Wolność sumienia i Ateizm państwowy mogą rozpocząć po jednym; Całkowity podział nie może. Należy również spełnić koszt funduszu religijnego aktywnego modelu wyznaniowego."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "Model wyznaniowy zezwala na projekt celowy (Całkowity podział nie może go rozpocząć)"
 ve_religious_project_req_no_active:0 "Brak trwającego celowego projektu wyznaniowego"
 ve_religious_project_req_no_backlash:0 "Poza 24-miesięcznym okresem odnowienia po anulowaniu projektu"
 ve_religious_project_req_reform_point:0 "Wystarczający fundusz religijny dla aktywnego modelu wyznaniowego (#Y 125#! Państwo wyznaniowe / #Y 100#! Wolność sumienia / #Y 150#! Ateizm państwowy)"
 ve_religious_project_req_target:0 "Nasza własna religia obejmuje mniej niż #Y 90%#! populacji tego obszaru administracyjnego"
 ve_religious_project_cancel_warning:0 "#header Anulować celowy projekt wyznaniowy?#!\n\nDotychczasowy postęp zostanie utracony. Nałożony zostanie modyfikator #N -5 ugoda wyznaniowa#! oraz #N 24-miesięczny#! okres odnowienia, zanim będzie można rozpocząć kolejny projekt."
 ve_cultural_project_req_no_active:0 "Brak trwającego projektu kulturowego"
 ve_cultural_project_req_no_backlash:0 "Poza 24-miesięcznym okresem odnowienia po anulowaniu projektu"
 ve_cultural_project_req_reform_point:0 "Wystarczający mandat kulturowy dla aktywnego modelu tożsamościowego (#Y 125#! Państwo etniczne / #Y 100#! Państwo obywatelskie / #Y 150#! Państwo złożone plus #Y 40#! spójność dla państwa złożonego)"
 ve_cultural_project_req_target:0 "Ten obszar administracyjny posiada odpowiednią kulturę inną niż kultura dominująca stanowiącą co najmniej #Y 5%#! jego populacji"
 ve_cultural_project_cancel_warning:0 "#header Anulować projekt kulturowy?#!\n\nDotychczasowy postęp zostanie utracony. Nałożony zostanie modyfikator #N -5 spójność narodowa#! oraz #N 24-miesięczny#! okres odnowienia, zanim będzie można rozpocząć kolejny projekt."
 alert_can_unlock_ideas_name:0 "Można przyjąć doktrynę"
 alert_can_unlock_ideas_hint:0 "Dysponujemy wystarczającym rozpoznaniem narodowym na kolejną doktrynę co najmniej jednej przyjętej grupy, a żaden cykl wdrażania doktryn nie blokuje obecnie zakupu."
 alert_max_piety_name:0 "Można przyjąć program wyznaniowy"
 alert_max_piety_hint:0 "Nasz fundusz religijny jest wystarczająco wysoki, aby przyjąć kolejny program wyznaniowy."
 alert_ve_can_begin_cultural_project_name:0 "Gromadzący się mandat kulturowy"
 alert_ve_can_begin_cultural_project_hint:0 "Posiadamy ponad #Y 300#! punktów mandatu kulturowego oraz projekt kulturowy, który możemy rozpocząć. Przychód mandatu spada o połowę przy 400 i zatrzymuje się przy 500, więc warto go wydać. Nic nie jest narzucane: nasz model tożsamościowy jest już aktywny."
 alert_can_unlock_age_bonus_name:0 "Można odblokować premię epoki"
 alert_can_unlock_age_bonus_hint:0 "Dysponujemy wystarczającą estymą, aby wybrać kolejną nagrodę."
 ag_ve_missionary_group_name:0 "Działania religijne i kulturowe"
 alert_can_use_missionary_name:0 "Można wysłać misjonarzy"
 alert_can_use_missionary_hint:0 "Nasi misjonarze oczekują na aktywną misję. Kliknij posiadany obszar administracyjny i nawróć tutejszą ludność."
 ag_ve_state_project_group_name:0 "Celowe projekty państwowe"
 alert_ve_can_begin_targeted_cultural_project_name:0 "Można rozpocząć celowy projekt kulturowy"
 alert_ve_can_begin_targeted_cultural_project_hint:0 "Posiadamy zasoby oraz odpowiedni obszar administracyjny dla celowego projektu kulturowego naszego modelu tożsamościowego."
 alert_ve_can_begin_targeted_religious_project_name:0 "Można rozpocząć celowy projekt wyznaniowy"
 alert_ve_can_begin_targeted_religious_project_hint:0 "Posiadamy fundusz religijny oraz odpowiedni obszar administracyjny dla projektu aktywnego modelu wyznaniowego."
 ve_culture_reform_cost_tt:0 "Wymóg dziedzicznej reformy kulturowej."
 ve_state_religion_tt:0 "#P Włącza mechanikę państwa wyznaniowego oraz 3 misjonarzy.#! Zwierzchnictwo religijne silnie reaguje na poparcie wiernych."
 ve_freedom_of_conscience_tt:0 "#P Włącza mechanikę państwa pluralistycznego oraz 1 misjonarza.#! Harmonijne relacje religijne nagradzają stabilną egzystencję."
 ve_total_separation_tt:0 "#P Włącza mechanikę państwa pluralistycznego.#! Misjonarze są wyłączeni."
 ve_ethnostate_tt:0 "#P Silnie współgra z modelem tożsamościowym państwa etnicznego.#! Jest sprzeczny z państwem obywatelskim i mniej odpowiedni dla państwa złożonego."
 ve_national_supremacy_tt:0 "#P Współgra z modelem tożsamościowym państwa etnicznego.#! Jest sprzeczny z państwem obywatelskim."
 ve_racial_segregation_tt:0 "#P Współgra z modelem tożsamościowym państwa złożonego.#! Zapewnia jedynie częściowe wsparcie dla państwa etnicznego."
 ve_cultural_exclusion_tt:0 "#P Współgra z modelem tożsamościowym państwa złożonego i częściowo wspiera państwo obywatelskie.#!"
 ve_multicultural_tt:0 "#P Silnie współgra z modelem tożsamościowym państwa obywatelskiego.#! Jest sprzeczny z państwem etnicznym."
 ve_send_missionary_tt:0 "#variable Misjonarz nawraca religię tutejszej ludności co #gold 6 miesięcy.\n\n#white Jeśli populacja obszaru administracyjnego wynosi poniżej 250 tys.: #darker_white 0% #white Bazowe przemijanie siły nawróceń\n#white Jeśli populacja obszaru administracyjnego wynosi poniżej 500 tys.: #negative_value -0.02% #white Przemijanie bazowej siły nawróceń\n#white Jeśli populacja obszaru administracyjnego wynosi poniżej 750 tys.: #negative_value -0.03% #white Przemijanie bazowej siły nawróceń\n#white Jeśli populacja obszaru administracyjnego wynosi poniżej 1 mln: #negative_value -0.04% #white Przemijanie bazowej siły nawróceń\n#white Jeśli populacja obszaru administracyjnego wynosi poniżej 5 mln: #negative_value -0.043% #white Przemijanie bazowej siły nawróceń\n#white Jeśli populacja obszaru administracyjnego wynosi poniżej 10 mln: #negative_value -0.045% #white Przemijanie bazowej siły nawróceń\n#white Jeśli populacja obszaru administracyjnego wynosi powyżej 10 mln+: #negative_value -0.0475% #white Przemijanie bazowej siły nawróceń"
 ve_targeted_cultural_project_state_action_tt:0 "#header Celowy projekt kulturowy#!\nRozpocznij projekt powiązany z obecnym modelem tożsamościowym. Największa odpowiednia kultura inna niż kultura dominująca stanowiąca co najmniej #Y 5%#! populacji tego obszaru administracyjnego staje się celem. Otwórz panel tożsamości narodowej, aby poznać dokładne koszty, zasady postępu i wyniki."
