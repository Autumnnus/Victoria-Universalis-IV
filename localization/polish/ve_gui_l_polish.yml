 ve_culture_reform_cost_tt:0 "Wymóg reformy dotychczasowej kultury."
 ve_state_religion_tt:0 "#P Uruchamia mechanikę państwa wyznaniowego i 3 misjonarzy.#! Władza religijna silnie reaguje na wsparcie pobożne."
 ve_freedom_of_conscience_tt:0 "#P Umożliwia mechanikę państwa pluralistycznego i 1 misjonarza.#! Harmonia religijna nagradza stabilne współistnienie."
 ve_total_separation_tt:0 "#P Umożliwia państwo pluralistyczne mechaniki.#! Misjonarze są niepełnosprawni."
 ve_ethnostate_tt:0 "#P Silnie pokrywa się z Modelem Tożsamości Narodu Etnicznego.#! Jest sprzeczny z Modelem Tożsamości Państwa Obywatelskiego i jest mniej odpowiedni dla Państwa Złożonego."
 ve_national_supremacy_tt:0 "#P Jest zgodny z Modelem Tożsamości Narodu Etnicznego.#! Jest sprzeczny z Narodem Obywatelskim."
 ve_racial_segregation_tt:0 "#P Dopasowuje się do Modelu Tożsamości Państwa Złożonego.#!  Zapewnia tylko częściowe wsparcie dla etnicznego Naród."
