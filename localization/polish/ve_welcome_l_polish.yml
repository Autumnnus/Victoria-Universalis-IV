 # Wydarzenie powitalne Victoria Universalis IV 2.0 - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Ta kampania korzysta z przebudowanego Victoria Universalis IV. W skrócie:\n\n#Y Religia#! - Twoje prawo Kościoła i państwa wyznacza teraz jeden z czterech Modeli Religijnych. Masz wskaźnik Ugody religijnej od 0 do 100, wydajesz Reformę pobożności na osiem stałych programów w każdym modelu i możesz prowadzić jeden ukierunkowany Projekt religijny w wybranym stanie.\n\n#Y Tożsamość narodowa#! - Naród etniczny, obywatelski albo złożony, z Mandatem kulturowym do wydania, wskaźnikiem Spójności narodowej, który warto trzymać wysoko, i pięcioma Projektami Kulturalnymi.\n\n#Y Grupy Pomysłów#! - 21 grup w kategoriach Produkcja, Społeczeństwo i Wojsko, w tym nowa grupa Agrarna. Miejsca na grupy zdobywa się teraz przez inwestycję w doktrynę, a nie z kalendarza, a każdy zakup oznacza 24 miesiące wdrażania.\n\n#Y Idee Narodowe#! - Dwanaście nowych profili państw, a postęp pochodzi teraz z każdego kupionego poziomu pomysłu.\n\n#Y Epoki#! - Trzy epoki z celami, trzynaście nagród epoki i trzy Złote wieki, a do tego jedna strategiczna wyprawa Skrzyżowania epoki w każdej epoce.\n\n#Y Nowa treść#! - Ponad sto nowych wydarzeń: dylematy doktrynalne, wieloletnie Wyprawy doktrynalne, incydenty i kryzysy projektów oraz łańcuchy klimatyczne dla Osmanów, Japonii i Stanów Zjednoczonych.\n\n#Y Interfejs#! - Nowy rząd na górnym pasku, przebudowane strony Religii i Tożsamości narodowej, podsumowanie doktryny w panelu każdego państwa oraz światowa Doktryna Księga."
 ve_welcome.1.f:0 "Każda doktryna zostawia ślad na narodzie, który ją przyjmuje."
 ve_welcome.1.a:0 "Szczegóły znajdziesz w opisie moda. Dobrej zabawy ^_^"
