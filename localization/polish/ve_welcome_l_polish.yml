 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Ta kampania działa w oparciu o przebudowany mod Victoria Universalis IV. W skrócie:\n\n#Y Religia#! – Twoje prawa dotyczące Kościoła i państwa ustalają teraz jeden z czterech modeli religijnych. Zarządzasz wskaźnikiem Ugoda wyznaniowa (0-100), wydajesz Fundusz religijny na osiem stałych programów dla każdego modelu i możesz prowadzić jeden ukierunkowany Projekt wyznaniowy w wybranym przez siebie obszarze administracyjnym.\n\n#Y Tożsamość narodowa#! – Etniczna, obywatelska lub złożona państwowość narodowa, z Mandatem kulturowym do wydania, wskaźnikiem Spójność narodowa, który należy utrzymywać na wysokim poziomie, oraz pięcioma projektami kulturowymi.\n\n#Y Grupy doktryn#! – 21 grup w obszarach Produkcja, Społeczeństwo i Wojskowość, w tym nowa grupa Agraryzm. Miejsca na grupy zdobywa się poprzez inwestowanie w doktryny zamiast upływu czasu, a każdy zakup kosztuje Cię 24-miesięczny okres wdrażania.\n\n#Y Doktryny narodowe#! – Dwanaście nowych profili krajów, a postęp wynika obecnie z każdego zakupionego poziomu doktryny.\n\n#Y Epoki#! – Trzy epoki z celami, trzynaście miejsc na premię epoki i trzy złote wieki, a także jedna strategiczna podróż Rozdroże epoki na każdą epokę.\n\n#Y Nowa zawartość#! – Ponad sto nowych wydarzeń: dylematy doktrynalne, wieloletnie podróże doktrynalne, incydenty i kryzysy projektowe oraz wątki fabularne dla Imperium Osmańskiego, Japonii i Stanów Zjednoczonych.\n\n#Y Interfejs#! – Nowy wiersz górnego paska, przebudowane strony religii i tożsamości narodowej, podgląd doktryn w panelu każdego kraju oraz ogólnoświatowa Księga doktryn."
 ve_welcome.1.f:0 "Każda doktryna odciska swoje piętno na narodzie, który ją przyjmuje."
 ve_welcome.1.a:0 "Szczegółowe informacje znajdują się w opisie modyfikacji. Życzymy udanej gry ^_^"
