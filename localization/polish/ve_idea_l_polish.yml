 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Fundusz religijny na miesiąc#! w modelu konfesyjnym lub ateizmie państwowym oraz #P +1 Mandat kulturowy na miesiąc#! w państwie etnicznym."
 nationalist_idea_7_tt:0 "#P +1 postęp Projektu wyznaniowego na miesiąc#! w modelu konfesyjnym lub ateizmie państwowym; #P +1 postęp Projektu kulturowego na miesiąc#! w państwie etnicznym; skuteczność przymusowej integracji religijnej i etnicznej wzrasta z #Y 5%#! do #Y 7%#!."
 embrace_idea_tt:0 "#header Pojemność katalogu doktryn#!\nWykorzystane miejsca: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nWolne miejsca obecnie: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nBieżąca inwestycja w doktryny: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktywnych, zakupionych doktryn\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Jak działa pojemność#!\nKażda aktywna zakupiona doktryna katalogu zapewnia #P +1#! inwestycji w doktryny. Osiągnięcie #Y 4, 8, 13, 19, 26#! lub #Y 34#! trwale dodaje jedno miejsce katalogu. Miejsca 5–6 wymagają również epoki 2; miejsce 7 wymaga epoki 3.\n\n#title Przyjmowanie i anulowanie#!\nPrzyjęcie katalogu nie kosztuje wglądu, ale zajmuje jedno wolne miejsce. Anulowanie zwalnia to miejsce, usuwa modyfikatory katalogu i obniża bieżącą inwestycję w doktryny; wydany wgląd nie podlega zwrotowi. Każde raz zdobyte miejsce pojemności pozostaje stale dostępne."
 ve_idea_capacity_player_progress:0 "#title Następne trwałe miejsce#!\nMiejsce: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nPostęp: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! zakupionych doktryn\nNadal potrzeba: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Następne trwałe miejsce#!\nMiejsce: #Y 5#!\nPostęp: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! zakupionych doktryn\nNadal potrzeba: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nWymaganie epoki: #N Oczekiwanie na epokę 2#!"
 ve_idea_capacity_player_age_3:0 "#title Następne trwałe miejsce#!\nMiejsce: #Y 7#!\nPostęp: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! zakupionych doktryn\nNadal potrzeba: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nWymaganie epoki: #N Oczekiwanie na epokę 3#!"
 ve_idea_capacity_player_max:0 "#P Osiągnięto maksymalną pojemność: dostępne jest wszystkich 7 trwałych miejsc katalogu.#!"
 ve_idea_capacity_country_progress:0 "#title Następne trwałe miejsce#!\nMiejsce: #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nPostęp: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! zakupionych doktryn\nNadal potrzeba: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title Następne trwałe miejsce#!\nMiejsce: #Y 5#!\nPostęp: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! zakupionych doktryn\nNadal potrzeba: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nWymaganie epoki: #N Oczekiwanie na epokę 2#!"
 ve_idea_capacity_country_age_3:0 "#title Następne trwałe miejsce#!\nMiejsce: #Y 7#!\nPostęp: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! zakupionych doktryn\nNadal potrzeba: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nWymaganie epoki: #N Oczekiwanie na epokę 3#!"
 ve_idea_capacity_country_max:0 "#P Osiągnięto maksymalną pojemność: dostępne jest wszystkich 7 trwałych miejsc katalogu.#!"
 ve_idea_implementation_player_ready:0 "#P Gotowość — kolejna doktryna może zostać przyjęta, gdy dostępna będzie odpowiednia ilość wglądu.#!"
 ve_idea_implementation_player_locked:0 "#N Wdrażanie w toku — pozostało [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] przed możliwością przyjęcia kolejnej doktryny.#!"
 ve_idea_era_momentum_age_1_tt:0 "#P Podczas epoki 1: +1 rozpęd epoki na miesiąc#! z tego katalogu doktryn na poziomie IV. Wkład katalogu doktryn jest ograniczony do #Y +2#!."
 ve_idea_era_momentum_age_2_tt:0 "#P Podczas epoki 2: +1 rozpęd epoki na miesiąc#! z tego katalogu doktryn na poziomie IV. Wkład katalogu doktryn jest ograniczony do #Y +2#!."
 ve_idea_era_momentum_age_3_tt:0 "#P Podczas epoki 3: +1 rozpęd epoki na miesiąc#! z tego katalogu doktryn na poziomie IV. Wkład katalogu doktryn jest ograniczony do #Y +2#!."
 reformist_idea_5_system_tt:0 "#P +1 Fundusz religijny na miesiąc#! w wolności sumienia lub całkowitym rozdziale oraz #P +1 Mandat kulturowy na miesiąc#! w państwie obywatelskim lub państwie złożonym."
 reformist_idea_7_system_tt:0 "#P +1 postęp Projektu wyznaniowego na miesiąc#! w wolności sumienia oraz #P +1 postęp Projektu kulturowego na miesiąc#! w państwie obywatelskim lub państwie złożonym."
 academic_idea_5_system_tt:0 "#P +1 Mandat kulturowy na miesiąc#! w państwie obywatelskim."
 academic_idea_7_system_tt:0 "#P +1 postęp Projektu wyznaniowego na miesiąc#! w ateizmie państwowym i #P +1 postęp Projektu kulturowego na miesiąc#! w państwie obywatelskim."
