 ve_national_ideas:0 " Idee narodowe"
 ve_idea_points:0 "#tooltippable_name Wgląd narodowy"
 ve_national_insight_tt:0 "#header National Insight#!\nZapas: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nW tym miesiącu: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nStan zakupów: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Co robi#!\nNational Insight kupuje indywidualne pomysły w ramach objętej Grupy Pomysłów. Każdy aktywny zakup wspiera Idee Narodowe i dodaje do bieżących Inwestycji Doktryny; osiągnięcie kamienia milowego w inwestycji trwale nagradza zdolność grupy.\n\n#title Dlaczego miesięczne zmiany dochodów#!\nPodstawa: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nUmiejętność czytania i pisania: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nSzkoły: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniwersytety: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLegitymizacja: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nInteligencja: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nDług, zamieszanie i wdrożenie: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Presja na zapasy#!\nMnożnik dochodu: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nDochód zmniejsza się o połowę przy #Y 750#!, spada do jednej czwartej przy #Y 900#! i zatrzymuje się na #Y 1000#!. Wydatki przed osiągnięciem limitu akcji zapobiegają marnowaniu dochodów."
 ve_national_insight_implementation_strain:0 "Napięcie związane z wdrażaniem doktryny"
 ve_national_insight_implementation_strain_desc:0 "Administracja dostosowuje instytucje i procedury do nowo przyjętej doktryny narodowej. Kolejny pomysł grupy nie może zostać przyjęty przed zakończeniem 24-miesięcznego cyklu wdrożeniowego."
 ve_total_ideas:0 "Grupy Pomysłów"
 ve_traditions:0 "#tooltippable_concept Tradycja: "
 ve_bonus:0 "#tooltippable_concept Premia: "
 ve_ambition:0 "Ambicja"
 ve_ambition_tooltip:0 "#Y Ambicja#!\n#P Stała nagroda zwieńczająca#!\nOdblokowuje się automatycznie, gdy wszystkie siedem pomysłów w tej grupie zostanie zrealizowanych."
 ve_idea_cancel_warning:0 "#header Anulować [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Każdy aktywny modyfikator pomysłu w tej grupie zostanie usunięty.#!\n#N Jego modyfikator Ambicji również zostanie usunięty, jeśli został odblokowany.#!\n\nWydany National Insight nie zostanie zwrócony.\nZwrócony National Insight: #Y 0#!\n\n#title Efekty, które zostaną usunięte#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Potwierdź: anuluj ten pomysł grupy.#! Postęp i modyfikatory zostaną utracone, National Insight nie zostanie zwrócony."
 ve_idea_cancel_keep_tt:0 "Zachowaj tę grupę pomysłów – nie anuluj."
 ve_embrace:0 "Uścisk"
 ve_idea_locked:0 "Ścieżka zamknięta"
 ve_idea_locked_tt:0 "#N Ta grupa pomysłów wyklucza się wzajemnie z tą, którą już przyjąłeś. Anuluj tę grupę, aby otworzyć tę ścieżkę."
 ve_idea_age_locked:0 "Wymagana technologia"
 ve_idea_age_locked_tt:0 "#N Ta grupa pomysłów wymaga technologii, która nie została jeszcze zbadana."
 ve_idea_labour_technology_locked_tt:0 "#N Wymaga [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Wymaga [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Wymaga [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Wymaga [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Wymaga [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Wymaga [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Wymaga [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Wzmocnij pomysł"
 ve_boost_idea_tt:0 "#header Przyjmij następny pomysł#!\nNational Insight: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nStan zakupu: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Koszt następnego poziomu#!\n#Y I: 200#!  ·  #Y II: 250#!  •  #Y III: 300#!  ·  #Y IV: 375#!\n#Y V: 450#!  ·  #Y VI: 550#!  ·  #Y VII: 675#!\nUżyj kosztu odpowiadającego kolejnemu niewypełnionemu poziomowi w tej grupie.\n\n#title Co się stanie przy zakupie#!\n#P Następny modyfikator w tej grupie staje się aktywny.#!\n#P Postęp inwestycji w doktrynę i idei narodowej wzrasta o 1.#!\n#N Rozpoczyna się 24-miesięczny cykl wdrażania doktryny. W jego trakcie nie można kupić żadnego innego pomysłu na grupę.#!\n\n#title Dlaczego przycisk może być wyłączony?#!\nWgląd jest niższy niż koszt następnego poziomu; Implementacja Doktryny jest aktywna; grupa jest kompletna; lub następny poziom wymaga nieprzebadanej technologii.\n\nAnulowanie tej grupy usuwa jej modyfikatory pomysłów i bieżący postęp. Wydany Wgląd nigdy nie zostanie zwrócony, ale miejsce grupowe zdobyte już za kamień milowy nigdy nie zostanie cofnięte."
