 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Reforma Pobożności/miesiąc#! w ateizmie wyznaniowym lub państwowym oraz #P +1 Mandat Kulturalny/miesiąc#! w narodzie etnicznym."
 nationalist_idea_7_tt:0 "#P +1 postęp w projekcie religijnym/miesiąc#! w ateizmie wyznaniowym lub państwowym; #P +1 postęp w projekcie kulturalnym/miesiąc#! w narodzie etnicznym; przymusowe wyniki w zakresie integracji religijnej i etnicznej poprawiają się z #Y 5%#! do #Y 7%#!."
 embrace_idea_tt:0 "#header Pojemność grupy pomysłów#!\nWykorzystane miejsca: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nWolne miejsca teraz: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nAktualna inwestycja w doktrynę: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktywne zakupione pomysły\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Jak działa pojemność#!\nKażdy aktywny zakupiony pomysł grupowy zapewnia #P +1#! Inwestycję w doktrynę. Osiągnięcie #Y 4, 8, 13, 19, 26#! lub #Y 34#! na stałe dodaje jedno miejsce w grupie. Miejsca 5–6 również wymagają Wiek 2; miejsce 7 wymaga Wiek 3.\n\n#title Obejmowanie i anulowanie#!\nObejmowanie grupy nie kosztuje Wnikliwości, ale zajmuje jedno wolne miejsce. Anulowanie zwalnia to miejsce, usuwa modyfikatory grupy i obniża bieżącą Inwestycję w Doktrynę; wydane Insight nie podlega zwrotowi. Wszelkie zdobyte już sloty pojemności pozostają stale dostępne."
 ve_idea_capacity_player_progress:0 "#title Następny stały slot#!\nSlot: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nPostęp: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! zakupione pomysły\nNadal potrzebne: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Następny stały slot#!\nSlot: #Y 5#!\nPostęp: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! zakupionych pomysłów\nNadal potrzebne: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nWiek wymagania: #N Oczekiwanie na wiek 2#!"
 ve_idea_capacity_player_age_3:0 "#title Następny stały slot#!\nSlot: #Y 7#!\nPostęp: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! zakupionych pomysłów\nNadal potrzebne: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nWymóg wieku: #N Oczekiwanie na wiek 3#!"
 ve_idea_capacity_player_max:0 "#P Osiągnięto maksymalną pojemność: wszystkie 7 stałych miejsc w grupie są dostępne.#!"
 ve_idea_capacity_country_progress:0 "#title Następny stały slot#!\nSlot: #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nPostęp: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! zakupiony pomysły\nNadal potrzebne: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title Następny stały slot#!\nSlot: #Y 5#!\nPostęp: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! zakupionych pomysłów\nNadal potrzebny: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nWymagania wiekowe: #N Oczekiwanie na wiek 2#!"
 ve_idea_capacity_country_age_3:0 "#title Następny stały slot#!\nSlot: #Y 7#!\nPostęp: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! zakupione pomysły\nNadal potrzebne: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nWymóg wieku: #N Oczekiwanie na wiek 3 lat#!"
 ve_idea_capacity_country_max:0 "#P Osiągnięto maksymalną pojemność: dostępnych jest wszystkie 7 stałych miejsc grupowych.#!"
 ve_idea_implementation_player_ready:0 "#P Gotowe — można przyjąć kolejny pomysł, gdy będzie dostępna wystarczająca ilość Insight.#!"
 ve_idea_implementation_player_locked:0 "#N Wdrażanie w toku — [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] pozostały, zanim będzie można przyjąć inny pomysł.#!"
 ve_idea_era_momentum_age_1_tt:0 "#P Podczas Epoki 1: +1 Pęd Ery/miesiąc#! z tej Grupy Pomysłów poziomu IV. Wkład Grupy Idea jest ograniczony do #Y +2#!."
 ve_idea_era_momentum_age_2_tt:0 "#P W Epoce 2: +1 Pęd Ery/miesiąc#! od tej Grupy Pomysłów poziomu IV. Wkład Grupy Pomysłów jest ograniczony do #Y +2#!."
 ve_idea_era_momentum_age_3_tt:0 "#P W Wieku 3: +1 Dynamika Ery/miesiąc#! z tej Grupy Pomysłów poziomu IV. Wkład Grupy Idea jest ograniczony do #Y +2#!."
 reformist_idea_5_system_tt:0 "#P +1 Reforma pobożności/miesiąc#! w wolności sumienia lub całkowitej separacji oraz #P +1 mandat kulturowy/miesiąc#! w narodzie obywatelskim lub państwie złożonym."
 reformist_idea_7_system_tt:0 "#P +1 postęp projektu religijnego/miesiąc#! w Wolności Sumienia i #P +1 postęp Projektu Kulturalnego/miesiąc#! w Narodzie Obywatelskim lub Państwie Złożonym."
 academic_idea_5_system_tt:0 "#P +1 Mandat Kulturalny/miesiąc#! w Narodzie Obywatelskim."
 academic_idea_7_system_tt:0 "#P +1 postęp w projekcie religijnym/miesiąc#! w ateizmie państwowym i #P +1 postęp w projekcie kulturalnym/miesiąc#! w Civic Nation."
 welfare_idea_6_system_tt:0 "#P +1 postęp projektu kulturalnego/miesiąc#! w Civic Nation."
