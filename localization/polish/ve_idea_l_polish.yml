 ve_national_ideas:0 " Doktryny narodowe"
 ve_idea_points:0 "#tooltippable_name Rozpoznanie narodowe"
 ve_national_insight_tt:0 "#header Rozpoznanie narodowe#!\nZasoby: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nW tym miesiącu: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nStatus zakupu: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Działanie#!\nRozpoznanie narodowe służy do zakupu poszczególnych doktryn w obrębie przyjętego katalogu doktryn. Każdy aktywny zakup rozwija doktryny narodowe i zwiększa bieżącą inwestycję w doktryny; osiągnięcie kamienia milowego inwestycji trwale zwiększa kompetencję katalogu.\n\n#title Zmiany miesięcznego dochodu#!\nBaza: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nUmiejętność czytania i pisania: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nSzkoły: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniwersytety: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLegitymizacja: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nInteligencja: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nDług, zamęt i wdrażanie: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Presja zapasów#!\nMnożnik dochodu: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nDochód zostaje zmniejszony o połowę przy #Y 750#!, spada do jednej czwartej przy #Y 900#! i zatrzymuje się przy #Y 1000#!. Wydawanie punktów przed osiągnięciem limitu zapobiega marnowaniu dochodu."
 ve_national_insight_implementation_strain:0 "Napięcie wdrażania doktryny"
 ve_national_insight_implementation_strain_desc:0 "Administracja dostosowuje instytucje oraz procedury do nowo przyjętej doktryny narodowej. Kolejna doktryna z katalogu nie może zostać przyjęta, dopóki nie zakończy się ten 24-miesięczny cykl wdrażania."
 ve_total_ideas:0 "Katalogi doktryn"
 ve_traditions:0 "#tooltippable_concept Tradycje: "
 ve_bonus:0 "#tooltippable_concept Premia: "
 ve_ambition:0 "Wieńcząca doktryna"
 ve_ambition_tooltip:0 "#Y Wieńcząca doktryna#!\n#P Trwała nagroda zwieńczająca#!\nOdblokowuje się automatycznie po przyjęciu wszystkich siedmiu doktryn w tym katalogu."
 ve_idea_cancel_warning:0 "#header Anulować [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Wszystkie aktywne modyfikatory doktryn w tym katalogu zostaną usunięte.#!\n#N Jego modyfikator wieńczącej doktryny również zostanie usunięty, jeśli został odblokowany.#!\n\nWydane rozpoznanie narodowe nie podlega zwrotowi.\nZwrócone rozpoznanie narodowe: #Y 0#!\n\n#title Efekty, które zostaną usunięte#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Potwierdź: anuluj ten katalog doktryn.#! Postęp i modyfikatory zostaną utracone, a rozpoznanie narodowe nie zostanie zwrócone."
 ve_idea_cancel_keep_tt:0 "Zachowaj ten katalog doktryn – nie anuluj."
 ve_embrace:0 "Przyjmij"
 ve_idea_locked:0 "Ścieżka zamknięta"
 ve_idea_locked_tt:0 "#N Ten katalog doktryn wyklucza się wzajemnie z tym, który został już przyjęty. Anuluj tamten katalog, aby otworzyć tę ścieżkę."
 ve_idea_age_locked:0 "Wymagana technologia"
 ve_idea_age_locked_tt:0 "#N Ten katalog doktryn wymaga technologii, która nie została jeszcze zbadana."
 ve_idea_labour_technology_locked_tt:0 "#N Wymaga [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Wymaga [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Wymaga [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Wymaga [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Wymaga [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Wymaga [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Wymaga [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Wzmocnij doktrynę"
 ve_boost_idea_tt:0 "#header Przyjmij kolejną doktrynę#!\nRozpoznanie narodowe: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nStan zakupu: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Koszt kolejnego poziomu#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nUżyj kosztu odpowiadającego kolejnemu niewypełnionemu poziomowi w tym katalogu.\n\n#title Co się stanie po zakupie#!\n#P Kolejny modyfikator w tym katalogu stanie się aktywny.#!\n#P Inwestycja w doktryny i postęp doktryn narodowych wzrosną o 1.#!\n#N Rozpocznie się 24-miesięczny cykl wdrażania doktryny. W tym czasie nie można kupić żadnej innej doktryny z katalogu.#!\n\n#title Dlaczego przycisk może być wyłączony?#!\nRozpoznanie jest niższe niż koszt kolejnego poziomu; wdrażanie doktryny jest aktywne; katalog jest kompletny; lub kolejny poziom wymaga niezbadanej technologii.\n\nAnulowanie tego katalogu usuwa jego modyfikatory doktryn oraz bieżący postęp. Wydane rozpoznanie nigdy nie podlega zwrotowi, lecz slot katalogu zdobyty dzięki kamieniowi milowemu nie zostanie cofnięty."
