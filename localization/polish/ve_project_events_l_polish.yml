l_polish:
 ve_je_religious_project:0 "Projekt wyznaniowy"
 ve_je_religious_project_reason:0 "Rząd kieruje długoterminowym projektem wyznaniowym. Jego postęp zależy od zdolności administracyjnych, prawomocności politycznej, warunków religijnych oraz wydarzeń w docelowym obszarze administracyjnym."
 ve_je_religious_project_progress:0 "Postęp projektu wyznaniowego w drodze do ukończenia"
 ve_je_religious_project_status_confessional:0 "Konwersja konfesyjna w [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] ma na celu rozszerzenie religii państwowej poprzez zorganizowaną kampanię.\n\nUkończenie przy #Y 125#! postępu: nawraca 5% populacji docelowego obszaru administracyjnego na religię państwową, zwraca #P 20#! funduszu religijnego i dodaje #P 5#! ugody wyznaniowej."
 ve_je_religious_project_status_freedom:0 "Działalność misyjna w [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] buduje ugodę opartą na wolności sumienia i dobrowolnym stowarzyszaniu się.\n\nUkończenie przy #Y 100#! postępu: dodaje lojalistów w państwie bez przymusowego nawracania, zwraca #P 20#! funduszu religijnego i dodaje #P 7#! ugody wyznaniowej."
 ve_je_religious_project_status_secularization:0 "Kampania sekularyzacyjna w [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] ogranicza publiczne zwierzchnictwo zorganizowanej religii.\n\nUkończenie przy #Y 150#! postępu: nawraca 5% populacji docelowego obszaru administracyjnego na ateizm, zwraca #P 25#! funduszu religijnego i dodaje #P 8#! ugody wyznaniowej."
 ve_je_religious_project_complete_tt:0 "Projekt wyznaniowy osiągnął swój cel."
 ve_je_religious_project_fail_tt:0 "Projekt wyznaniowy został anulowany."

 ve_je_cultural_project:0 "Projekt kulturowy"
 ve_je_cultural_project_reason:0 "Rząd kieruje długoterminowym projektem kulturowym. Zdolności administracyjne, prawomocność, kolegium oświaty, spójność narodowa i warunki lokalne decydują o jego tempie."
 ve_je_cultural_project_progress:0 "Postęp projektu kulturowego w drodze do ukończenia"
 ve_je_cultural_project_status_curriculum:0 "Program szkolny jest przygotowywany dla szkół i instytucji w kraju.\n\nUkończenie przy #Y 100#! postępu: #P +20#! mandat kulturowy, #P +5#! spójność narodowa oraz 10-letni rezultat w postaci +2% dostępu do edukacji, +5% kwalifikacji i -25 biurokracji."
 ve_je_cultural_project_status_symbols:0 "Program wspólnych symboli tworzy wspólny słownik obywatelski.\n\nUkończenie przy #Y 75#! postępu: #P +20#! mandat kulturowy, #P +7#! spójność narodowa oraz 8-letni rezultat w postaci +10% lojalistów spośród w pełni zaakceptowanych zbiorowości i +25 zwierzchnictwa."
 ve_je_cultural_project_status_ethnic:0 "Kampania integracji etnicznej w [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] dąży do zbliżenia populacji mniejszościowej do kultury dominującej.\n\nUkończenie przy #Y 125#! postępu: nawraca 5% zbiorowości docelowej kultury na kulturę dominującą (7% z nacjonalizmem VII), #P +25#! mandat kulturowy, #P +8#! spójność narodowa oraz 10-letni rezultat asymilacji."
 ve_je_cultural_project_status_civic:0 "Inicjatywa równego obywatelstwa w [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] rozszerza powszechny status obywatelski ponad podziałami kulturowymi.\n\nUkończenie przy #Y 100#! postępu: +15% akceptacji na 10 lat, lojaliści w państwie, #P +25#! mandat kulturowy, #P +10#! spójność narodowa oraz 10-letni rezultat kwalifikacji i migracji."
 ve_je_cultural_project_status_composite:0 "Pakt założycielski w [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] negocjuje trwałe uznanie w ramach państwa złożonego.\n\nUkończenie przy #Y 150#! postępu (wymaga co najmniej 40 spójności narodowej): stałe +15% akceptacji, dodaje kulturę do listy konstytucyjnej, lojaliści w państwie, #P +30#! mandat kulturowy, #P +12#! spójność narodowa."
 ve_je_cultural_project_complete_tt:0 "Projekt kulturowy osiągnął swój cel."
 ve_je_cultural_project_fail_tt:0 "Projekt kulturowy został anulowany."
 ve_je_project_resolving_status:0 "Administracja projektu składa swój końcowy raport."

 ve_evt_religious_incident_cooldown_mdf:0 "Czas odnowienia incydentu projektu wyznaniowego"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "Administracja projektu radzi sobie z konsekwencjami niedawnego incydentu."
 ve_evt_cultural_incident_cooldown_mdf:0 "Czas odnowienia incydentu projektu kulturowego"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "Administracja projektu radzi sobie z konsekwencjami niedawnego incydentu."
 ve_evt_central_clergy_supported_mdf:0 "Wsparcie dla centralnego duchowieństwa"
 ve_evt_central_clergy_supported_mdf_desc:0 "Rząd podtrzymał zwierzchnictwo centralnej hierarchii religijnej."
 ve_evt_central_clergy_slighted_mdf:0 "Umniejszenie znaczenia centralnego duchowieństwa"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Rząd przedłożył praktyki lokalne nad preferencje centralnej hierarchii religijnej."
 ve_evt_municipal_patronage_mdf:0 "Miejskie sieci patronatu"
 ve_evt_municipal_patronage_mdf_desc:0 "Lokalni notable popierają projekt poprzez układy, które osłabiają pobór podatków."

 ve_rel_evt.1.t:0 "Petycja lokalnych dostojników"
 ve_rel_evt.1.d:0 "Delegacja duchownych, postaci miejskich i starszych dzielnicowych z obszaru administracyjnego [SCOPE.sState('ve_evt_target_state').GetName] złożyła do rządu petycję o spowolnienie konwersji konfesyjnej. Ostrzegają, że nieelastyczny harmonogram zamieni przestrzeganie przepisów w trwała niechęć."
 ve_rel_evt.1.f:0 "\"Wiara narzucona bez narady może wypełnić rejestry, pustosząc jednocześnie ławki.\""
 ve_rel_evt.1.a:0 "Wysłuchać ich petycji."
 ve_rel_evt.1.a.tt:0 "Postęp projektu wyznaniowego spada o #N 4#!.\nUgodowość religijna rośnie o #P 3#!."
 ve_rel_evt.1.b:0 "Harmonogram nie ulegnie zmianie."
 ve_rel_evt.1.b.tt:0 "Postęp projektu wyznaniowego rośnie o #P 5#!.\nUgodowość religijna spada o #N 2#!.\n#N 0.5%#! populacji w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalna."
 ve_rel_evt.1.c:0 "Zaangażować zaufanych pośredników."
 ve_rel_evt.1.c.tt:0 "Wydatkuje się #N 10#! funduszu religijnego.\nPostęp projektu wyznaniowego rośnie o #P 3#!.\nUgodowość religijna rośnie o #P 1#!."

 ve_rel_evt.2.t:0 "Niedobór oficerów – terenowych"
 ve_rel_evt.2.d:0 "Doniesienia z obszaru administracyjnego [SCOPE.sState('ve_evt_target_state').GetName] opisują bez odpowiedzi petycje, sprzeczne instrukcje oraz okręgi, w których od tygodni nie widziano urzędnika projektowego. Konwersja konfesyjna wyprzedza administrację powołaną do jej przeprowadzenia."
 ve_rel_evt.2.f:0 "\"Rozporządzenie może przemierzyć kraj w jeden dzień. Kompetentny urzędnik nie.\""
 ve_rel_evt.2.a:0 "Zatrudnić tymczasowych oficerów terenowych."
 ve_rel_evt.2.a.tt:0 "Wydatkuje się #N 15#! funduszu religijnego.\nPostęp projektu wyznaniowego rośnie o #P 4#!."
 ve_rel_evt.2.b:0 "Spowolnić program."
 ve_rel_evt.2.b.tt:0 "Postęp projektu wyznaniowego spada o #N 6#!.\nUgodowość religijna rośnie o #P 2#!."
 ve_rel_evt.2.c:0 "Wykorzystać kadry centralnego rejestru."
 ve_rel_evt.2.c.tt:0 "Wydatkuje się #N 10#! funduszu religijnego.\nPostęp projektu wyznaniowego rośnie o #P 5#!."

 ve_cul_evt.1.t:0 "Biura tłumaczeń"
 ve_cul_evt.1.d:0 "Urzędnicy w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] spierają się co do tego, w jaki sposób inicjatywa równego obywatelstwa powinna traktować język kultury [SCOPE.sCulture('ve_evt_target_culture').GetName]. Lokalna administracja pragnie dwujęzycznych urzędów; ministerstwa centralne żądają jednego standardu administracyjnego."
 ve_cul_evt.1.f:0 "\"Obywatel nie powinien potrzebować tłumacza, aby zrozumieć prawa przyznane w jego własnym imieniu.\""
 ve_cul_evt.1.a:0 "Pozwolić językom lokalnym funkcjonować w instytucjach publicznych."
 ve_cul_evt.1.a.tt:0 "Postęp projektu kulturowego spada o #N 4#!.\nSpójność narodowa rośnie o #P 3#!."
 ve_cul_evt.1.b:0 "Narzucić jeden standard administracyjny."
 ve_cul_evt.1.b.tt:0 "Postęp projektu kulturowego rośnie o #P 5#!.\nSpójność narodowa spada o #N 2#!.\n#N 0.5%#! populacji kultury [SCOPE.sCulture('ve_evt_target_culture').GetName] w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalna."
 ve_cul_evt.1.c:0 "Powołać akademicką komisję tłumaczeniową."
 ve_cul_evt.1.c.tt:0 "Wydatkuje się #N 10#! dyrektywy kulturowej.\nPostęp projektu kulturowego rośnie o #P 3#!.\nSpójność narodowa rośnie o #P 1#!."

 ve_cul_evt.2.t:0 "Niedobór nauczycieli lokalnych"
 ve_cul_evt.2.d:0 "Szkoły w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] cierpią na brak nauczycieli zdolnych sprostać zarówno programowi państwowemu, jak i społecznościom kultury [SCOPE.sCulture('ve_evt_target_culture').GetName]. Bez wyszkolonej lokalnej kadry równe obywatelstwo ryzykuje pozostanie obietnicą napisaną jedynie na urzędowym papierze."
 ve_cul_evt.2.f:0 "\"Prawo ogłasza równość w jedno popołudnie; sala lekcyjna musi jej uczyć przez pokolenie.\""
 ve_cul_evt.2.a:0 "Sfinansować nowe seminaria nauczycielskie."
 ve_cul_evt.2.a.tt:0 "Wydatkuje się #N 15#! dyrektywy kulturowej.\nPostęp projektu kulturowego rośnie o #P 4#!."
 ve_cul_evt.2.b:0 "Spowolnić wdrażanie."
 ve_cul_evt.2.b.tt:0 "Postęp projektu kulturowego spada o #N 6#!.\nSpójność narodowa rośnie o #P 2#!."
 ve_cul_evt.2.c:0 "Wykorzystać instytucje już istniejące."
 ve_cul_evt.2.c.tt:0 "Wydatkuje się #N 10#! dyrektywy kulturowej.\nPostęp projektu kulturowego rośnie o #P 5#!.\nSpójność narodowa rośnie o #P 1#!."

 ve_rel_evt.3.t:0 "Sprzeczne rejestry"
 ve_rel_evt.3.d:0 "Listy parafialne, księgi miejskie oraz raporty oficerów projektu przedstawiają niezgodne dane na temat przynależności religijnej w [SCOPE.sState('ve_evt_target_state').GetName]. Administracja musi zdecydować, czy straci czas na ustalenie prawdy, czy też będzie kontynuować prace w oparciu o dane, co do których ma pewność, że są niepewne."
 ve_rel_evt.3.f:0 "\"Każdy urząd posiada dokładną sumę. Żadne dwie sumy się nie zgadzają.\""
 ve_rel_evt.3.a:0 "Przeprowadzić pełny audyt."
 ve_rel_evt.3.a.tt:0 "Zyskujesz #P 8#! fundusz religijny.\nPostęp projektu wyznaniowego spada o #N 6#!."
 ve_rel_evt.3.b:0 "Postępować w oparciu o rozsądne szacunki."
 ve_rel_evt.3.b.tt:0 "Wydajesz #N 8#! fundusz religijny.\nPostęp projektu wyznaniowego rośnie o #P 5#!."
 ve_rel_evt.3.c:0 "Skorzystać z rejestrów Administracji Świętej."
 ve_rel_evt.3.c.tt:0 "Postęp projektu wyznaniowego rośnie o #P 3#!."

 ve_rel_evt.4.t:0 "Plotki i kontrkazania"
 ve_rel_evt.4.d:0 "Pfalsze, kazania uliczne oraz niepokojące plotki przedstawiają teraz konwersję konfesyjną w [SCOPE.sState('ve_evt_target_state').GetName] jako zamach na lokalne życie. Urzędnicy ostrzegają, że milczenie pozwoli przeciwnikom zdefiniować projekt, podczas gdy represje mogą potwierdzić ich najmroczniejsze oskarżenia."
 ve_rel_evt.4.f:0 "\"Plotka nie potrzebuje urzędu, pieczęti ani budżetu.\""
 ve_rel_evt.4.a:0 "Zorganizować wysłuchania publiczne."
 ve_rel_evt.4.a.tt:0 "Postęp projektu wyznaniowego spada o #N 3#!.\nOsadnictwo religijne rośnie o #P 3#!.\n#P 0.5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się lojalistami."
 ve_rel_evt.4.b:0 "Ukarać agitatorów."
 ve_rel_evt.4.b.tt:0 "Postęp projektu wyznaniowego rośnie o #P 4#!.\nOsadnictwo religijne spada o #N 3#!.\n#N 1%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalna."
 ve_rel_evt.4.c:0 "Opublikować zapisy i wyniki."
 ve_rel_evt.4.c.tt:0 "Wydajesz #N 10#! fundusz religijny.\nPostęp projektu wyznaniowego rośnie o #P 2#!.\nOsadnictwo religijne rośnie o #P 1#!."

 ve_rel_evt.5.t:0 "Język kazania"
 ve_rel_evt.5.d:0 "Duchowni zaangażowani w projekt w [SCOPE.sState('ve_evt_target_state').GetName] zgłaszają, że formalne kazania zachowują jedność doktrynalną, ale nie docierają do wielu wiernych. Kaznodziejstwo w językach lokalnych pomogłoby w dalszym prowadzeniu kampanii, choć centralna hierarchia obawia się, że adaptacja przerodzi się w niezależność."
 ve_rel_evt.5.f:0 "\"Święte słowo, którego nikt nie usłyszał, zostaje zachowane w nienaruszonym stanie – lecz nie dociera do nikogo.\""
 ve_rel_evt.5.a:0 "Głosić kazania w językach lokalnych."
 ve_rel_evt.5.a.tt:0 "Postęp projektu wyznaniowego rośnie o #P 6#!.\nWierni tracą #N 1#! aprobaty na #Y 2.5 roku#!."
 ve_rel_evt.5.b:0 "Zachować jedność liturgiczną."
 ve_rel_evt.5.b.tt:0 "Postęp projektu wyznaniowego spada o #N 3#!.\nOsadnictwo religijne rośnie o #P 3#!.\nWierni zyskują #P 1#! aprobaty na #Y 2.5 roku#!."
 ve_rel_evt.5.c:0 "Wyszkolić wykształconych tłumaczy."
 ve_rel_evt.5.c.tt:0 "Wydajesz #N 10#! fundusz religijny.\nPostęp projektu wyznaniowego rośnie o #P 4#!.\nOsadnictwo religijne rośnie o #P 1#!."

 ve_rel_evt.6.t:0 "Rywale w hierarchii kościelnej"
 ve_rel_evt.6.d:0 "Wyznaczeni przez centrum urzędnicy oraz osadzone lokalne duchowieństwo w [SCOPE.sState('ve_evt_target_state').GetName] roszczą sobie prawo do kierowania konwersją konfesyjną. Poparcie jednej ze stron może szybko przywrócić dowództwo, ale spór ten stał się już sprawą rozstrzygającą, kto mówi w imieniu wiary."
 ve_rel_evt.6.f:0 "\"Spór dotyczy jurysdykcji, czyli sposobu, w jaki instytucje opisują władzę.\""
 ve_rel_evt.6.a:0 "Poprzeć centralne duchowieństwo."
 ve_rel_evt.6.a.tt:0 "Postęp projektu wyznaniowego rośnie o #P 5#!.\nWierni zyskują #P 1#! aprobaty na #Y 2.5 roku#!.\nOsadnictwo religijne spada o #N 3#!.\n#N 0.5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalna."
 ve_rel_evt.6.b:0 "Uspokoić lokalne duchowieństwo."
 ve_rel_evt.6.b.tt:0 "Postęp projektu wyznaniowego spada o #N 4#!.\nWierni tracą #N 1#! aprobaty na #Y 2.5 roku#!.\nOsadnictwo religijne rośnie o #P 3#!."
 ve_rel_evt.6.c:0 "Określić ich uprawnienia na piśmie."
 ve_rel_evt.6.c.tt:0 "Wydajesz #N 10#! fundusz religijny.\nPostęp projektu wyznaniowego rośnie o #P 3#!.\nOsadnictwo religijne rośnie o #P 1#!."

 ve_cul_evt.3.t:0 "Kategorie spisu powszechnego"
 ve_cul_evt.3.d:0 "Urzędnicy spisowi w [SCOPE.sState('ve_evt_target_state').GetName] nie mogą dojść do porozumienia co do sposobu rejestracji obywateli kultury [SCOPE.sCulture('ve_evt_target_culture').GetName]. Miejscowi respondent używają nakładających się tożsamości, podczas gdy centralne formularze wymagają jednej odpowiedzi w jednej rubryce."
 ve_cul_evt.3.f:0 "\"Kategoria upraszcza rejestr na długo przed tym, jak upraszcza kraj.\""
 ve_cul_evt.3.a:0 "Zezwól na samookreślenie."
 ve_cul_evt.3.a.tt:0 "Postęp projektu kulturowego spada o #N 4#!.\nSpójność narodowa rośnie o #P 4#!."
 ve_cul_evt.3.b:0 "Kategorie zostaną ustalone centralnie."
 ve_cul_evt.3.b.tt:0 "Postęp projektu kulturowego rośnie o #P 6#!.\nSpójność narodowa spada o #N 4#!.\n#N 0,5%#! populacji kultury [SCOPE.sCulture('ve_evt_target_culture').GetName] w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał."
 ve_cul_evt.3.c:0 "Użyj nowoczesnego systemu rejestrów."
 ve_cul_evt.3.c.tt:0 "Wydaj #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego rośnie o #P 5#!.\nSpójność narodowa rośnie o #P 1#!."

 ve_cul_evt.4.t:0 "Miejscowe wybitne osobowości"
 ve_cul_evt.4.d:0 "Miejscowi protektorzy w [SCOPE.sState('ve_evt_target_state').GetName] oferują swoje urzędy, klientów i Wpływ, aby wspierać równe obywatelstwo dla populacji kultury [SCOPE.sCulture('ve_evt_target_culture').GetName]. Ich współpraca byłaby szybka, lecz ich ceną jest dalsza kontrola nad lokalnymi dochodami."
 ve_cul_evt.4.f:0 "\"Najkrótsza droga do ratusza prowadzi przez kilka prywatnych salonów.\""
 ve_cul_evt.4.a:0 "Wykorzystaj lokalne sieci."
 ve_cul_evt.4.a.tt:0 "Postęp projektu kulturowego rośnie o #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] traci #N 5%#! Kompetencja podatkowa przez #Y 2 lata#!."
 ve_cul_evt.4.b:0 "Utwórz otwarte rady."
 ve_cul_evt.4.b.tt:0 "Postęp projektu kulturowego spada o #N 3#!.\nSpójność narodowa rośnie o #P 3#!."
 ve_cul_evt.4.c:0 "Negocjować ugodę opartą na zasadach."
 ve_cul_evt.4.c.tt:0 "Wydaj #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego rośnie o #P 3#!.\nSpójność narodowa rośnie o #P 1#!."

 ve_cul_evt.5.t:0 "Egzaminy do służby cywilnej"
 ve_cul_evt.5.d:0 "Otwarcie egzaminów do Służba cywilna dla kandydatów kultury [SCOPE.sCulture('ve_evt_target_culture').GetName] ujawniło przepaść między równością prawną a praktycznym przygotowaniem. Natychmiastowy dostęp byłby potężny symbolicznie, ale lata nierównej edukacji nie mogą zostać wymazane przez Rozporządzenie."
 ve_cul_evt.5.f:0 "\"Ten sam egzamin nie jest tą samą szansą, gdy tylko jeden kandydat został nauczony jego języka.\""
 ve_cul_evt.5.a:0 "Sfinansuj kursy przygotowawcze."
 ve_cul_evt.5.a.tt:0 "Wydaj #N 15#! Mandat kulturowy.\nPostęp projektu kulturowego rośnie o #P 5#!.\nSpójność narodowa rośnie o #P 2#!."
 ve_cul_evt.5.b:0 "Równy dostęp zaczyna się natychmiast."
 ve_cul_evt.5.b.tt:0 "Postęp projektu kulturowego rośnie o #P 7#!.\nSpójność narodowa spada o #N 4#!.\n#N 0,5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał."
 ve_cul_evt.5.c:0 "Mobilizuj sieci szkolne i opieki społecznej."
 ve_cul_evt.5.c.tt:0 "Wydaj #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego rośnie o #P 5#!.\nSpójność narodowa rośnie o #P 2#!."
 ve_cul_evt.5.e:0 "Najpierw zreformuj system egzaminacyjny."
 ve_cul_evt.5.e.tt:0 "Postęp projektu kulturowego spada o #N 4#!.\nSpójność narodowa rośnie o #P 3#!."

 ve_cul_evt.6.t:0 "Większość stawia opór"
 ve_cul_evt.6.d:0 "Przeciwnicze Inicjatywa równego obywatelstwa twierdzą, że rozszerzenie powszechnych praw na populację kultury [SCOPE.sCulture('ve_evt_target_culture').GetName] pomniejsza pozycję wszystkich pozostałych. Demonstracje w [SCOPE.sState('ve_evt_target_state').GetName] zmieniają reformę administracyjną w krajowy test polityczny."
 ve_cul_evt.6.f:0 "\"Prawo, którym się dzielimy, przedstawiane jest jako skradziony przywilej.\""
 ve_cul_evt.6.a:0 "Bronić inicjatywy otwarcie."
 ve_cul_evt.6.a.tt:0 "Postęp projektu kulturowego rośnie o #P 4#!.\nSpójność narodowa spada o #N 4#!.\n#N 1%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał."
 ve_cul_evt.6.b:0 "Zmniejsz tempo wdrażania."
 ve_cul_evt.6.b.tt:0 "Postęp projektu kulturowego spada o #N 5#!.\nSpójność narodowa rośnie o #P 3#!."
 ve_cul_evt.6.c:0 "Mobilizuj koalicję reformatorską."
 ve_cul_evt.6.c.tt:0 "Wydaj #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego rośnie o #P 3#!.\nSpójność narodowa rośnie o #P 2#!.\n#P 0,5%#! populacji kultury [SCOPE.sCulture('ve_evt_target_culture').GetName] w [SCOPE.sState('ve_evt_target_state').GetName] staje się Lojalista."

 ve_rel_evt.7.t:0 "Misja w punkcie krytycznym"
 ve_rel_evt.7.d:0 "Konwersja konfesyjna w regionie [SCOPE.sState('ve_evt_target_state').GetName] zbliża się do załamania administracyjnego i politycznego. Urzędy przestały odpowiadać na wezwania, opór społeczny tężeje, a duchowieństwo w terenie ostrzega, że misja nie może kontynuować swojej działalności na dotychczasowych zasadach."
 ve_rel_evt.7.f:0 "\"W raportach wciąż nazywa się to tymczasową trudnością. Ulica wybrała surowszą nazwę.\""
 ve_rel_evt.7.a:0 "Zaakceptuj straty i wycofaj się."
 ve_rel_evt.7.a.tt:0 "Anuluje projekt wyznaniowy bez zwrotu funduszu religijnego.\nUgoda wyznaniowa spada o #N 5#!.\nPrzez #Y 2 lata#!: #N -50#! Biurokracja, #N -50#! Zwierzchnictwo oraz #N -3%#! Sukces ustanawiania prawa."
 ve_rel_evt.7.b:0 "Przekaż zasoby ratunkowe."
 ve_rel_evt.7.b.tt:0 "Zużywa #N 25#! fundusz religijny.\nPostęp projektu wyznaniowego spada o #N 5#!.\n#N 1%#! populacji w regionie [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalna.\nProjekt jest kontynuowany."
 ve_rel_evt.7.c:0 "Kontynuuj z okrojonym personelem."
 ve_rel_evt.7.c.tt:0 "Postęp projektu wyznaniowego spada o #N 10#!.\nUgoda wyznaniowa spada o #N 2#!.\nProjekt jest kontynuowany."
 ve_rel_evt.7.e:0 "Przeformułuj metodę działania."
 ve_rel_evt.7.e.tt:0 "Zużywa #N 15#! fundusz religijny.\nPostęp projektu wyznaniowego spada o #N 3#!.\nUgoda wyznaniowa rośnie o #P 2#!.\n#N 0.5%#! populacji w regionie [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalna.\nProjekt jest kontynuowany."

 ve_cul_evt.7.t:0 "Inicjatywa traci prawomocność"
 ve_cul_evt.7.d:0 "Inicjatywa równego obywatelstwa w regionie [SCOPE.sState('ve_evt_target_state').GetName] traci poparcie zarówno ugruntowanych instytucji, jak i społeczności kulturowych [SCOPE.sCulture('ve_evt_target_culture').GetName], którym miała służyć. Ruchy radykalne przedstawiają obecnie każdy kompromis jako dowód na to, że rząd nie potrafi zapewnić równości."
 ve_cul_evt.7.f:0 "\"Reforma może przetrwać sprzeciw. Nie przetrwa jednak utraty wiarygodności.\""
 ve_cul_evt.7.a:0 "Zakończ inicjatywę."
 ve_cul_evt.7.a.tt:0 "Anuluje projekt kulturowy bez zwrotu mandatu kulturowego.\nSpójność narodowa spada o #N 5#!.\nPrzez #Y 2 lata#!: #N -50#! Biurokracja, #N -25#! Zwierzchnictwo oraz #N -3%#! Sukces ustanawiania prawa."
 ve_cul_evt.7.b:0 "Przyznaj doraźne subsydia lokalne."
 ve_cul_evt.7.b.tt:0 "Zużywa #N 25#! mandat kulturowy.\nPostęp projektu kulturowego spada o #N 5#!.\n#N 1%#! populacji kultury [SCOPE.sCulture('ve_evt_target_culture').GetName] w regionie [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalna.\nProjekt jest kontynuowany."
 ve_cul_evt.7.c:0 "Kontynuuj z minimalnym programem."
 ve_cul_evt.7.c.tt:0 "Postęp projektu kulturowego spada o #N 10#!.\nSpójność narodowa spada o #N 2#!.\nProjekt jest kontynuowany."
 ve_cul_evt.7.e:0 "Odbuduj koalicję."
 ve_cul_evt.7.e.tt:0 "Zużywa #N 15#! mandat kulturowy.\nPostęp projektu kulturowego spada o #N 3#!.\nSpójność narodowa rośnie o #P 2#!.\n#N 0.5%#! populacji kultury [SCOPE.sCulture('ve_evt_target_culture').GetName] w regionie [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalna.\nProjekt jest kontynuowany."

 ve_rel_evt.8.t:0 "Nieoczekiwana zgoda lokalna"
 ve_rel_evt.8.d:0 "Duchowieństwo, urzędnicy miejscy oraz starszyzna społeczności w regionie [SCOPE.sState('ve_evt_target_state').GetName] osiągnęli porozumienie, jakiego nie mogłaby wyprodukować żadna centralna dyrektywa. Opór lokalny ustępuje, parafie same koordynują misję, a konwersja konfesyjna nabrała nieoczekiwanej estymy."
 ve_rel_evt.8.f:0 "\"To, co zaczęło się jako rozkaz z stolicy, stało się paktem zawartym na rynku miasteczka.\""
 ve_rel_evt.8.a:0 "Wykorzystaj tę estymę w pełni."
 ve_rel_evt.8.a.tt:0 "Ugoda wyznaniowa rośnie o #P 1#!.\nPostęp projektu wyznaniowego rośnie o #P 25#!.\nJeśli postęp osiągnie #Y 100#!, zastosowany zostanie zwykły efekt ukończenia projektu."
 ve_rel_evt.8.b:0 "Trwałość przed szybkością."
 ve_rel_evt.8.b.tt:0 "Ugoda wyznaniowa rośnie o #P 4#!.\nPostęp projektu wyznaniowego rośnie o #P 10#!.\nJeśli postęp osiągnie #Y 100#!, zastosowany zostanie zwykły efekt ukończenia projektu."

 ve_cul_evt.8.t:0 "Lokalna koalicja obywatelska"
 ve_cul_evt.8.d:0 "Nauczyciele, urzędnicy miejscy, stowarzyszenia handlowe oraz przedstawiciele społeczności [SCOPE.sCulture('ve_evt_target_culture').GetName] w regionie [SCOPE.sState('ve_evt_target_state').GetName] utworzyli wspólny komitet. Rozwiązując spory, zanim dotrą one do stolicy, koalicja ta nadała Inicjatywie równego obywatelstwa estymę, jakiej administracja nie zdołała wytworzyć."
 ve_cul_evt.8.f:0 "\"Obywatelstwo stało się rzeczywistością, gdy instytucje rzadko zasiadające przy jednym stole zaczeły dzielić się odpowiedzialnością.\""
 ve_cul_evt.8.a:0 "Wykorzystaj estymę koalicji."
 ve_cul_evt.8.a.tt:0 "Spójność narodowa rośnie o #P 1#!.\nPostęp projektu kulturowego rośnie o #P 25#!.\nJeśli postęp osiągnie #Y 100#!, zastosowany zostanie zwykły efekt ukończenia projektu."
 ve_cul_evt.8.b:0 "Uczyń instytucje trwałymi."
 ve_cul_evt.8.b.tt:0 "Spójność narodowa rośnie o #P 4#!.\nPostęp projektu kulturowego rośnie o #P 10#!.\nJeśli postęp osiągnie #Y 100#!, zastosowany zostanie zwykły efekt ukończenia projektu."

 ve_rel_evt.40.t:0 "Niezgodność rejestrów"
 ve_rel_evt.40.d:0 "Prowincjonalne rejestry w [SCOPE.sState('ve_evt_target_state').GetName] posługują się niekompatybilnymi kategoriami w odniesieniu do gmin wyznaniowych, stowarzyszeń obywatelskich oraz instytucji publicznych. Docierające do stolicy raporty wzajemnie sobie przeczą, uniemożliwiając rozróżnienie między podporządkowaniem a oporem w ramach projektu."
 ve_rel_evt.40.f:0 "\"Polityka prowadzona w oparciu o trzy księgi szybko rodzi trzy różne rzeczywistości.\""
 ve_rel_evt.40.a:0 "Wysłać centralną inspekcję."
 ve_rel_evt.40.a.tt:0 "Koszt: #N 10#! Fundusz religijny.\nPostęp projektu wyznaniowego wzrasta o #P 5#!.\nUregulowanie religijne wzrasta o #P 1#!."
 ve_rel_evt.40.b:0 "Ujednolicić rejestry na miejscu."
 ve_rel_evt.40.b.tt:0 "Postęp projektu wyznaniowego spada o #N 3#!.\nUregulowanie religijne wzrasta o #P 2#!."
 ve_rel_evt.40.c:0 "Zastosować standardową procedurę rejestracyjną."
 ve_rel_evt.40.c.tt:0 "Koszt: #N 5#! Fundusz religijny.\nPostęp projektu wyznaniowego wzrasta o #P 4#!.\nUregulowanie religijne wzrasta o #P 1#!."

 ve_rel_evt.41.t:0 "Niedobór personelu prowincjonalnego"
 ve_rel_evt.41.d:0 "Urzędy nadzorujące projekt w [SCOPE.sState('ve_evt_target_state').GetName] nie mogą znaleźć wystarczającej liczby przeszkolonych – urzędnicy, nauczycieli i inspektorów. Dyrektywy napływają szybciej, niż urzędnicy lokalni są w stanie je interpretować, a pośpieszne mianowania grożą nasileniem każdego spornego kwestii."
 ve_rel_evt.41.f:0 "\"Rozporządzenie nadeszło w jeden dzień. Wychowanie ludzi zdolnych je wcielić w życie może zająć całe pokolenie.\""
 ve_rel_evt.41.a:0 "Sfinansować nową kadrę urzędników."
 ve_rel_evt.41.a.tt:0 "Koszt: #N 15#! Fundusz religijny.\nPostęp projektu wyznaniowego wzrasta o #P 6#!."
 ve_rel_evt.41.b:0 "Spowolnić wdrażanie."
 ve_rel_evt.41.b.tt:0 "Postęp projektu wyznaniowego spada o #N 6#!.\nUregulowanie religijne wzrasta o #P 2#!."
 ve_rel_evt.41.c:0 "Wykorzystać istniejącą sieć oświatową."
 ve_rel_evt.41.c.tt:0 "Koszt: #N 10#! Fundusz religijny.\nPostęp projektu wyznaniowego wzrasta o #P 5#!.\nUregulowanie religijne wzrasta o #P 1#!."

 ve_rel_evt.42.t:0 "Plotki w całym okręgu"
 ve_rel_evt.42.d:0 "Plotki krążące w [SCOPE.sState('ve_evt_target_state').GetName] głoszą, że projekt skrywa środki znacznie surowsze niż te zapowiadane przez Rząd. Organizatorzy religijni i lokalni Agitatorzy powtarzają sprzeczne opowieści, podczas gdy urzędowe milczenie daje każdej nowej wersji pole do rozprzestrzeniania się."
 ve_rel_evt.42.f:0 "\"Plotka nie potrzebuje urzędu, budżetu ani podpisu.\""
 ve_rel_evt.42.a:0 "Opublikować raporty."
 ve_rel_evt.42.a.tt:0 "Postęp projektu wyznaniowego spada o #N 3#!.\nUregulowanie religijne wzrasta o #P 4#!."
 ve_rel_evt.42.b:0 "Zbyć agitację milczeniem."
 ve_rel_evt.42.b.tt:0 "Postęp projektu wyznaniowego wzrasta o #P 5#!.\nUregulowanie religijne spada o #N 3#!.\n#N 1%#! Populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał."
 ve_rel_evt.42.c:0 "Powołać lokalnych mediatorów."
 ve_rel_evt.42.c.tt:0 "Koszt: #N 10#! Fundusz religijny.\nPostęp projektu wyznaniowego wzrasta o #P 4#!.\nUregulowanie religijne wzrasta o #P 2#!.\n#P 0.5%#! Populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się Lojalista."

 ve_rel_evt.43.t:0 "Administracja na skraju załamania"
 ve_rel_evt.43.d:0 "Projekt w [SCOPE.sState('ve_evt_target_state').GetName] zbliża się ku administracyjnemu upadkowi. Prowincjonalne urzędy są przytłoczone, Przeświadczenie publiczne uległo załamaniu, a Zorganizowana Przeciwstawianie się traktuje obecnie każdą nową dyrektywę jako dowód, że Rząd utracił kontrolę."
 ve_rel_evt.43.f:0 "\"Gdy akta przestają krążyć, kryzys przenosi się na ulice.\""
 ve_rel_evt.43.a:0 "Zakończyć program."
 ve_rel_evt.43.a.tt:0 "Anulować projekt wyznaniowy bez zwrotu środków z Funduszu religijnego.\nUregulowanie religijne spada o #N 5#!.\nPrzez #Y 2 lata#!: #N -50#! Biurokracja, #N -50#! Zwierzchnictwo oraz #N -3%#! Sukces ustanawiania prawa."
 ve_rel_evt.43.b:0 "Przekazać zasoby kryzysowe."
 ve_rel_evt.43.b.tt:0 "Koszt: #N 25#! Fundusz religijny.\nPostęp projektu wyznaniowego spada o #N 5#!.\n#N 1%#! Populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał.\nProjekt jest kontynuowany."
 ve_rel_evt.43.c:0 "Kontynuować w okrojonym składzie."
 ve_rel_evt.43.c.tt:0 "Postęp projektu wyznaniowego spada o #N 10#!.\nUregulowanie religijne spada o #N 2#!.\nProjekt jest kontynuowany."
 ve_rel_evt.43.e:0 "Odbudować lokalne partnerstwo."
 ve_rel_evt.43.e.tt:0 "Koszt: #N 15#! Fundusz religijny.\nPostęp projektu wyznaniowego spada o #N 3#!.\nUregulowanie religijne wzrasta o #P 2#!.\n#N 0.5%#! Populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał.\nProjekt jest kontynuowany."

 ve_rel_evt.100.t:0 "Miejsca w Radzie Międzywyznaniowej"
 ve_rel_evt.100.d:0 "Delegaci w [SCOPE.sState('ve_evt_target_state').GetName] zgadzają się, że rada międzywyznaniowa jest konieczna, ale nie co do tego, komu należy się miejsce w niej. Reprezentacja proporcjonalna uspokoiłaby mniejszości, podczas gdy stała ugoda ułożona w stolicy mogłaby rozpocząć pracę natychmiast."
 ve_rel_evt.100.f:0 "\"Każdy popiera wspólny stół, dopóki nie policzy się krzeseł.\""
 ve_rel_evt.100.a:0 "Rozdziel reprezentację według populacji."
 ve_rel_evt.100.a.tt:0 "Postęp projektu wyznaniowego zmniejsza się o #N 3#!.\nUgoda wyznaniowa zwiększa się o #P 4#!."
 ve_rel_evt.100.b:0 "Narzuć sztywny, centralny kompromis."
 ve_rel_evt.100.b.tt:0 "Postęp projektu wyznaniowego zwiększa się o #P 5#!.\nUgoda wyznaniowa zmniejsza się o #N 2#!.\n#N 0.5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał."
 ve_rel_evt.100.c:0 "Wzmocnij rady międzywyznaniowe."
 ve_rel_evt.100.c.tt:0 "Wydaj #N 10#! Fundusz religijny.\nPostęp projektu wyznaniowego zwiększa się o #P 5#!.\nUgoda wyznaniowa zwiększa się o #P 2#!."

 ve_rel_evt.101.t:0 "Wspólny program szkolny"
 ve_rel_evt.101.d:0 "Szkoły w [SCOPE.sState('ve_evt_target_state').GetName] potrzebują wspólnych lekcji obywatelskich, nie zmieniając działalności misyjnej w kampanię przeciwko lokalnym wierzeniom. Nauczyciele proszą o jasne materiały i wspólne szkolenia, podczas gdy liderzy społeczności upierają się, aby nauczanie lokalne zachowało miejsce dla ich tradycji."
 ve_rel_evt.101.f:0 "\"Wspólna lekcja odnosi sukces tylko wtedy, gdy każda rodzina uznaje salę lekcyjną za swoją.\""
 ve_rel_evt.101.a:0 "Sfinansuj wspólną kadrę nauczycielską."
 ve_rel_evt.101.a.tt:0 "Wydaj #N 15#! Fundusz religijny.\nPostęp projektu wyznaniowego zwiększa się o #P 6#!.\nUgoda wyznaniowa zwiększa się o #P 1#!."
 ve_rel_evt.101.b:0 "Zostaw miejsce na lokalne programy nauczania."
 ve_rel_evt.101.b.tt:0 "Postęp projektu wyznaniowego zmniejsza się o #N 4#!.\nUgoda wyznaniowa zwiększa się o #P 3#!."
 ve_rel_evt.101.c:0 "Wprowadź koalicję reformatorską do szkół."
 ve_rel_evt.101.c.tt:0 "Wydaj #N 10#! Fundusz religijny.\nPostęp projektu wyznaniowego zwiększa się o #P 5#!.\nUgoda wyznaniowa zwiększa się o #P 2#!.\n#P 0.5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Lojalista."

 ve_rel_evt.102.t:0 "Karta wzajemnych gwarancji"
 ve_rel_evt.102.d:0 "Społeczności religijne, urzędnicy mnicypalni i stowarzyszenia reformatorskie w [SCOPE.sState('ve_evt_target_state').GetName] sporządziły wspólną kartę. Każdy sygnatariusz akceptuje te same zobowiązania obywatelskie w zamian za publiczne gwarancje, że żadna społeczność nie zostanie wykluczona z lokalnych instytucji."
 ve_rel_evt.102.f:0 "\"Zaufanie stało się możliwe, gdy każdą obietnicę spisano jako prawo innej partii.\""
 ve_rel_evt.102.a:0 "Wykorzystaj estyma paktu."
 ve_rel_evt.102.a.tt:0 "Ugoda wyznaniowa zwiększa się o #P 2#!.\nPostęp projektu wyznaniowego zwiększa się o #P 20#!.\nJeśli postęp osiągnie #Y 100#!, zastosowany zostanie zwykły efekt ukończenia projektu."
 ve_rel_evt.102.b:0 "Uczyń gwarancje trwałymi."
 ve_rel_evt.102.b.tt:0 "Ugoda wyznaniowa zwiększa się o #P 4#!.\n#P 0.5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Lojalista.\nPostęp projektu wyznaniowego zwiększa się o #P 10#!.\nJeśli postęp osiągnie #Y 100#!, zastosowany zostanie zwykły efekt ukończenia projektu."

 ve_rel_evt.150.t:0 "Nauczyciele czy inspektorzy?"
 ve_rel_evt.150.d:0 "Kampania sekularyzacyjna w [SCOPE.sState('ve_evt_target_state').GetName] obnażyła niedobór personelu, w którym są piśmienni. Administracja może powiększyć korpus nauczycielski, który buduje długoterminowe kompetencja obywatelskie, lub polegać na inspektorach mogących egzekwować nowe zasady przy użyciu już dostępnego personelu."
 ve_rel_evt.150.f:0 "\"Inspektor może zamknąć szkołę w jedno popołudnie. Nauczyciel może potrzebować lat, by zastąpić to, czego tam uczono.\""
 ve_rel_evt.150.a:0 "Rozbuduj korpus nauczycielski."
 ve_rel_evt.150.a.tt:0 "Wydaj #N 15#! Fundusz religijny.\nPostęp projektu wyznaniowego zwiększa się o #P 6#!."
 ve_rel_evt.150.b:0 "Spowolnij program, aby dopasować go do istniejącego personelu."
 ve_rel_evt.150.b.tt:0 "Postęp projektu wyznaniowego zmniejsza się o #N 5#!.\nUgoda wyznaniowa zwiększa się o #P 2#!."
 ve_rel_evt.150.c:0 "Zleć zadanie sieci Kolegium Oświaty."
 ve_rel_evt.150.c.tt:0 "Wydaj #N 10#! Fundusz religijny.\nPostęp projektu wyznaniowego zwiększa się o #P 5#!.\nUgoda wyznaniowa zwiększa się o #P 1#!."

 ve_rel_evt.151.t:0 "Zajęte majątki"
 ve_rel_evt.151.d:0 "Dawne majątki religijne w [SCOPE.sState('ve_evt_target_state').GetName] są gotowe do przekształcenia w szkoły, przychodnie i urzędy cywilne. Natychmiastowe przejęcie dałoby kampanii cenną infrastrukturę, lecz brak rekompensaty staje się punktem zbornym dla Wierni."
 ve_rel_evt.151.f:0 "\"Klucze zmieniły właściciela w jeden poranek. Spór o własność przeżyje zamki w drzwiach.\""
 ve_rel_evt.151.a:0 "Wypłacić rekompensatę w ratach."
 ve_rel_evt.151.a.tt:0 "Wydaj #N 15#! Fundusz religijny.\nPostęp projektu wyznaniowego wzrasta o #P 3#!.\nUgoda wyznaniowa wzrasta o #P 3#!."
 ve_rel_evt.151.b:0 "Przeznaczyć majątki na usługi publiczne natychmiast."
 ve_rel_evt.151.b.tt:0 "Postęp projektu wyznaniowego wzrasta o #P 7#!.\nUgoda wyznaniowa spada o #N 4#!.\n#N 1%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał.\nWierni tracą #N 1#! Aprobata na #Y 2.5 roku#!."
 ve_rel_evt.151.c:0 "Przekazać je świeckim instytucjom opieki społecznej."
 ve_rel_evt.151.c.tt:0 "Wydaj #N 10#! Fundusz religijny.\nPostęp projektu wyznaniowego wzrasta o #P 5#!.\nUgoda wyznaniowa wzrasta o #P 2#!.\n#P 0.5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Lojalista."

 ve_rel_evt.152.t:0 "Stowarzyszenia obywatelskie zapuszczają korzenie"
 ve_rel_evt.152.d:0 "Koła nauczycielskie, towarzystwa wzajemnej pomocy i związki komunalne w [SCOPE.sState('ve_evt_target_state').GetName] zaczęły świadczyć usługi niegdyś organizowane przez instytucje religijne. Ich współpraca dała kampanii sekularyzacyjnej lokalny fundament obywatelski zamiast samej obecności administracyjnej."
 ve_rel_evt.152.f:0 "\"Nowy porządek przetrwał, gdy obywatele zaczęli go utrzymywać bez czakania na inspektora.\""
 ve_rel_evt.152.a:0 "Wykorzystać lokalną estymę."
 ve_rel_evt.152.a.tt:0 "Ugoda wyznaniowa wzrasta o #P 2#!.\nPostęp projektu wyznaniowego wzrasta o #P 20#!.\nJeśli postęp osiągnie #Y 100#!, zastosowany zostanie zwykły efekt ukończenia projektu."
 ve_rel_evt.152.b:0 "Przekształcić stowarzyszenia w stałe instytucje."
 ve_rel_evt.152.b.tt:0 "Ugoda wyznaniowa wzrasta o #P 4#!.\nPostęp projektu wyznaniowego wzrasta o #P 10#!.\nJeśli postęp osiągnie #Y 100#!, zastosowany zostanie zwykły efekt ukończenia projektu."

 ve_cul_evt.40.t:0 "Lokalne rady szkolne"
 ve_cul_evt.40.d:0 "Rady szkolne w [SCOPE.sState('ve_evt_target_state').GetName] spierają się co do miejsca języka [SCOPE.sCulture('ve_evt_target_culture').GetName] w nauczaniu publicznym. Nauczanie w języku lokalnym zachowałoby zaufanie, podczas gdy jeden język administracyjny ułatwiłby kierowanie projektem narodowym."
 ve_cul_evt.40.f:0 "\"Język wybrany do pierwszej lekcji często decyduje o tym, kto wierzy, że szkoła należy do niego.\""
 ve_cul_evt.40.a:0 "Chronić język lokalny."
 ve_cul_evt.40.a.tt:0 "Postęp projektu kulturowego spada o #N 4#!.\nSpójność narodowa wzrasta o #P 3#!."
 ve_cul_evt.40.b:0 "Narzucić jeden język administracyjny."
 ve_cul_evt.40.b.tt:0 "Postęp projektu kulturowego wzrasta o #P 5#!.\nSpójność narodowa spada o #N 2#!.\n#N 0.5%#! populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał."
 ve_cul_evt.40.c:0 "Rozbudować sieć nauczycielską."
 ve_cul_evt.40.c.tt:0 "Wydaj #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego wzrasta o #P 4#!.\nSpójność narodowa wzrasta o #P 2#!."

 ve_cul_evt.41.t:0 "Granice statystyczne"
 ve_cul_evt.41.d:0 "Urzędnicy przeprowadzający spis w [SCOPE.sState('ve_evt_target_state').GetName] nie mogą uzgodnić, gdzie zaczyna się i kończy społeczność [SCOPE.sCulture('ve_evt_target_culture').GetName]. Tożsamości lokalne nakładają się na siebie poprzez język, okręg i obyczaj, lecz projekt narodowy wymaga kategorii, które można policzyć i administrować nimi."
 ve_cul_evt.41.f:0 "\"Granica wykreślona na potrzeby spisu powszechnego wkrótce zyskuje urzędników, budżety i obrońców.\""
 ve_cul_evt.41.a:0 "Pozostawić przestrzeń na samoidentyfikację."
 ve_cul_evt.41.a.tt:0 "Postęp projektu kulturowego spada o #N 3#!.\nSpójność narodowa wzrasta o #P 3#!."
 ve_cul_evt.41.b:0 "Pozwolić centrum wyznaczyć granice."
 ve_cul_evt.41.b.tt:0 "Postęp projektu kulturowego wzrasta o #P 6#!.\nSpójność narodowa spada o #N 3#!.\n#N 0.5%#! populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał."
 ve_cul_evt.41.c:0 "Użyć standardowego systemu rejestrów."
 ve_cul_evt.41.c.tt:0 "Wydaj #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego wzrasta o #P 5#!.\nSpójność narodowa wzrasta o #P 1#!."

 ve_cul_evt.42.t:0 "Projekt narodowy w punkcie krytycznym"
 ve_cul_evt.42.d:0 "Projekt narodowy w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] zbliża się do załamania. Ruchy radykalne utrzymują, że rząd albo zdradził społeczność [SCOPE.sCulture('ve_evt_target_culture').GetName], albo przed nią kapitulował, podczas gdy lokalne urzędy nie posiadają już przeświadczenia pozwalającego na wymuszenie kolejnego kompromisu."
 ve_cul_evt.42.f:0 "\"Porozumienie, które jest atakowane zarówno jako przymus, jak i kapitulacja, wkrótce może przestać być jakimkolwiek porozumieniem.\""
 ve_cul_evt.42.a:0 "Zakończyć projekt."
 ve_cul_evt.42.a.tt:0 "Anuluje projekt kulturowy bez zwrotu punktów mandatu kulturowego.\nSpójność narodowa spada o #N 5#!.\nPrzez #Y 2 lata#!: #N -50#! Biurokracja, #N -25#! Zwierzchnictwo oraz #N -3%#! Sukces ustanawiania prawa."
 ve_cul_evt.42.b:0 "Przeznaczyć zapasowe zasoby lokalne."
 ve_cul_evt.42.b.tt:0 "Wydaje #N 25#! punktów mandatu kulturowego.\nPostęp projektu kulturowego spada o #N 5#!.\n#N 1%#! populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] staje się radykałami.\nProjekt jest kontynuowany."
 ve_cul_evt.42.c:0 "Kontynuować w ramach programu minimalnego."
 ve_cul_evt.42.c.tt:0 "Postęp projektu kulturowego spada o #N 10#!.\nSpójność narodowa spada o #N 2#!.\nProjekt jest kontynuowany."
 ve_cul_evt.42.e:0 "Odbudować ramy negocjacyjne."
 ve_cul_evt.42.e.tt:0 "Wydaje #N 15#! punktów mandatu kulturowego.\nPostęp projektu kulturowego spada o #N 3#!.\nSpójność narodowa wzrasta o #P 2#!.\n#N 0.5%#! populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] staje się radykałami.\nProjekt jest kontynuowany."

 ve_cul_evt.50.t:0 "Dyrektywa dotycząca nazwisk i języka"
 ve_cul_evt.50.d:0 "Urzędnicy w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] proponują standaryzację nazwisk oraz rejestrów publicznych w języku narodowym. Dyrektywa ułatwiłaby administracji centralnej klasyfikację populacji [SCOPE.sCulture('ve_evt_target_culture').GetName], jednak rodziny obawiają się, że prywatna tożsamość staje się przedmiotem rządowego dowództwa."
 ve_cul_evt.50.f:0 "\"Nazwisko zapisane w rejestrze w odmienny sposób wciąż może być tym, pod którym dana rodzina zachowuje pamięć o sobie.\""
 ve_cul_evt.50.a:0 "Sfinansować stopniową kampanię rejestracyjną."
 ve_cul_evt.50.a.tt:0 "Wydaje #N 10#! punktów mandatu kulturowego.\nPostęp projektu kulturowego wzrasta o #P 4#!.\nSpójność narodowa wzrasta o #P 1#!.\n#N 0.5%#! populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] staje się radykałami."
 ve_cul_evt.50.b:0 "Narzucić jeden standard krajowy."
 ve_cul_evt.50.b.tt:0 "Postęp projektu kulturowego wzrasta o #P 7#!.\nSpójność narodowa spada o #N 4#!.\n#N 1%#! populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] staje się radykałami."
 ve_cul_evt.50.c:0 "Wycofać dyrektywę do ponownego rozpatrzenia."
 ve_cul_evt.50.c.tt:0 "Postęp projektu kulturowego spada o #N 5#!.\nSpójność narodowa wzrasta o #P 3#!."

 ve_cul_evt.51.t:0 "Rejestry poborowe"
 ve_cul_evt.51.d:0 "Urzędnicy wojskowi w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] domagają się utworzenia jednolitego rejestru zobowiązań do służby, nazwisk oraz dowództw. Zastosowanie go wobec populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] wzmocniłoby proces wcielania etnicznego, lecz opór narasta wśród społeczności, które postrzegają armię jako kolejne narzędzie zacierania kulturowego."
 ve_cul_evt.51.f:0 "\"Państwo poznaje nazwiska wsi po raz pierwszy, gdy pragnie pobrać swoje podatki lub wezwać pod broń jej synów.\""
 ve_cul_evt.51.a:0 "Zastosować rejestry narodowe."
 ve_cul_evt.51.a.tt:0 "Postęp projektu kulturowego wzrasta o #P 5#!.\nSpójność narodowa spada o #N 2#!.\n#N 0.5%#! populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] staje się radykałami."
 ve_cul_evt.51.b:0 "Zachować lokalne praktyki rejestracyjne."
 ve_cul_evt.51.b.tt:0 "Postęp projektu kulturowego spada o #N 3#!.\nSpójność narodowa wzrasta o #P 3#!."
 ve_cul_evt.51.c:0 "Wcielić rejestry za pośrednictwem służby wojskowej."
 ve_cul_evt.51.c.tt:0 "Wydaje #N 10#! punktów mandatu kulturowego.\nPostęp projektu kulturowego wzrasta o #P 6#!.\nSpójność narodowa wzrasta o #P 1#!.\n#N 0.5%#! populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] w obszarze administracyjnym [SCOPE.sState('ve_evt_target_state').GetName] staje się radykałami."

 ve_cul_evt.100.t:0 "Delegacja paktu założycielskiego"
 ve_cul_evt.100.d:0 "Delegacja społeczności [SCOPE.sCulture('ve_evt_target_culture').GetName] w regionie [SCOPE.sState('ve_evt_target_state').GetName] przybyła z żądaniami reprezentacji w instytucjach paktu założycielskiego. Negocjacje spowolniłyby projekt, lecz wzmocniłyby jego prawomocność; rozstrzygnięcie narzucone ze stolicy mogłoby postępować szybciej kosztem zaufania."
 ve_cul_evt.100.f:0 "\"Pakt staje się powszechny dopiero wtedy, gdy każdy z uczestników może wskazać artykuł, przy którego pisaniu pomógł.\""
 ve_cul_evt.100.a:0 "Negocjować ich miejsce w pakcie."
 ve_cul_evt.100.a.tt:0 "Postęp projektu kulturowego zmniejsza się o #N 4#!.\nSpójność narodowa zwiększa się o #P 4#!."
 ve_cul_evt.100.b:0 "Narzucić centralne rozstrzygnięcie."
 ve_cul_evt.100.b.tt:0 "Postęp projektu kulturowego zwiększa się o #P 5#!.\nSpójność narodowa zmniejsza się o #N 2#!.\n#N 0.5%#! populacji [SCOPE.sCulture('ve_evt_target_culture').GetName] w regionie [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykał."
 ve_cul_evt.100.c:0 "Włączyć koalicję parlamentarną do rozmów."
 ve_cul_evt.100.c.tt:0 "Wydano #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego zwiększa się o #P 4#!.\nSpójność narodowa zwiększa się o #P 2#!."

 ve_cul_evt.101.t:0 "Podwójna administracja"
 ve_cul_evt.101.d:0 "Pakt założycielski w regionie [SCOPE.sState('ve_evt_target_state').GetName] zależy obecnie od dwóch nakładających się na siebie administracji. Centralni urzędnicy i przedstawiciele społeczności [SCOPE.sCulture('ve_evt_target_culture').GetName] dublują rejestry, sporzą o mianowania i wydają sprzeczne instrukcje, podczas gdy biurokracja kraju zbliża się do wyczerpania."
 ve_cul_evt.101.f:0 "\"Dwa urzędy mogą łatwiej dzielić się zwierzchnictwem niż jedną szafą na akta.\""
 ve_cul_evt.101.a:0 "Sfinansować wspólny personel administracyjny."
 ve_cul_evt.101.a.tt:0 "Wydano #N 15#! Mandat kulturowy.\nPostęp projektu kulturowego zwiększa się o #P 6#!."
 ve_cul_evt.101.b:0 "Spowolnić pakt, dopóki urzędy nie dojdą do porozumienia."
 ve_cul_evt.101.b.tt:0 "Postęp projektu kulturowego zmniejsza się o #N 6#!.\nSpójność narodowa zwiększa się o #P 2#!."
 ve_cul_evt.101.c:0 "Zjednocz urzędy pod Służba cywilna."
 ve_cul_evt.101.c.tt:0 "Wydano #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego zwiększa się o #P 5#!.\nSpójność narodowa zwiększa się o #P 2#!."

 ve_cul_evt.150.t:0 "Wprowadzenie w prowincjach"
 ve_cul_evt.150.d:0 "Administracje prowincjonalne zgłaszają, że ogólnokrajowy projekt kulturowy postępuje w radykalnie różnym tempie. Niektóre urzędy domagają się sfinansowania komisji wdrażających, podczas gdy inne ostrzegają, że narzucenie jednego harmonogramu każdemu regionowi pochłonie skąpe zasoby personelu i osłabi Przeświadczenie publiczne."
 ve_cul_evt.150.f:0 "\"Krajowe rozporządzenie pisze się raz, lecz wdrożyć je należy w każdym urzędzie w państwie.\""
 ve_cul_evt.150.a:0 "Sfinansować komisje wdrażające."
 ve_cul_evt.150.a.tt:0 "Wydano #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego zwiększa się o #P 5#!."
 ve_cul_evt.150.b:0 "Zastosować harmonogram stopniowy."
 ve_cul_evt.150.b.tt:0 "Postęp projektu kulturowego zmniejsza się o #N 4#!.\nSpójność narodowa zwiększa się o #P 2#!."
 ve_cul_evt.150.c:0 "Ujednolicić istniejącą administrację."
 ve_cul_evt.150.c.tt:0 "Wydano #N 5#! Mandat kulturowy.\nPostęp projektu kulturowego zwiększa się o #P 3#!.\nSpójność narodowa zwiększa się o #P 2#!."

 ve_cul_evt.151.t:0 "Język nauczania"
 ve_cul_evt.151.d:0 "Program szkolny wymaga wspólnego języka nauczania, a jednak szkoły w całym kraju służą społecznościom o bardzo odmiennych tradycjach językowych. Materiały wielojęzyczne zachowałyby Przeświadczenie, lecz opóźniłyby dystrybucję, podczas gdy jednolity program mógłby szybko dotrzeć do klas z ryzykiem przekształcenia Edukacja w konkurs kulturowy."
 ve_cul_evt.151.f:0 "\"Lekcja udzielona w języku, któremu uczeń nie ufa, może zostać zapamiętana ze względu na wszystko, tylko nie ze względu na swój przedmiot.\""
 ve_cul_evt.151.a:0 "Sfinansować materiały wielojęzyczne."
 ve_cul_evt.151.a.tt:0 "Wydano #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego zwiększa się o #P 3#!.\nSpójność narodowa zwiększa się o #P 3#!."
 ve_cul_evt.151.b:0 "Zastosować jeden Program szkolny."
 ve_cul_evt.151.b.tt:0 "Postęp projektu kulturowego zwiększa się o #P 6#!.\nSpójność narodowa zmniejsza się o #N 3#!."
 ve_cul_evt.151.c:0 "Połączyć sieci nauczania i opieka społeczna."
 ve_cul_evt.151.c.tt:0 "Wydano #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego zwiększa się o #P 5#!.\nSpójność narodowa zwiększa się o #P 2#!."

 ve_cul_evt.160.t:0 "Kto reprezentuje Naród?"
 ve_cul_evt.160.d:0 "Projekt Wspólne symbole na nowo postawił pytanie o to, czyja historia, czyje mundury, monumenty i ceremonie mogą reprezentować cały kraj. Rotacyjne tradycje poszerzyłyby uznanie, lecz spowolniłyby osiągnięcie porozumienia; wybranie jednej oficjalnej narracji zapewniłoby jasność, pozostawiając jednak wielu obywateli poza jej obrębem."
 ve_cul_evt.160.f:0 "\"Symbol staje się narodowy dopiero wtedy, gdy obywatele widzą w nim siebie bez potrzeby wyjaśnień.\""
 ve_cul_evt.160.a:0 "Zmieniać symbole w użytku publicznym rotacyjnie."
 ve_cul_evt.160.a.tt:0 "Postęp projektu kulturowego zmniejsza się o #N 3#!.\nSpójność narodowa rośnie o #P 4#!."
 ve_cul_evt.160.b:0 "Wybrać jedną oficjalną narrację."
 ve_cul_evt.160.b.tt:0 "Postęp projektu kulturowego rośnie o #P 6#!.\nSpójność narodowa spada o #N 3#!."
 ve_cul_evt.160.c:0 "Opracować wspólną ceremonię publiczną."
 ve_cul_evt.160.c.tt:0 "Wydaj #N 10#! Mandat kulturowy.\nPostęp projektu kulturowego rośnie o #P 4#!.\nSpójność narodowa rośnie o #P 2#!."
