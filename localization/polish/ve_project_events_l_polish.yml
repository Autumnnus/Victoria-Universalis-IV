l_polish:
 ve_je_religious_project:0 "Projekt religijny"
 ve_je_religious_project_reason:0 "Rząd kieruje długoterminowym projektem religijnym. Jej postęp zależy od zdolności administracyjnych, legitymacji politycznej, warunków religijnych i wydarzeń w państwie docelowym."
 ve_je_religious_project_progress:0 "Projekt religijny zbliża się do końca"
 ve_je_religious_project_status_confessional:0 "Nawrócenie konfesjonału w [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] stara się szerzyć wiarę państwową poprzez zorganizowaną kampanię.\n\nZakończenie o godz #Y 125#! postęp: nawraca 5% populacji docelowego stanu na religię państwową, zwraca #P 20#! Reforma pobożności i dodaje #P 5#! Osada religijna."
 ve_je_religious_project_status_freedom:0 "Akcja Wolności w [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] buduje osadę opartą na sumieniu i dobrowolnym zrzeszaniu się.\n\nZakończenie o godz #Y 100#! postęp: dodaje lojalistów państwowych bez przymusowej konwersji, zwroty pieniędzy #P 20#! Reformę pobożności i dodaje #P 7#! Osadnictwo religijne."
 ve_je_religious_project_status_secularization:0 "Kampania sekularyzacyjna w [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] ogranicza władzę publiczną zorganizowanej religii.\n\nZakończenie o godz #Y 150#! postęp: nawraca 5% populacji docelowego stanu na ateizm, zwroty #P 25#! Reforma pobożności i dodaje #P 8#! Osadnictwo religijne."
 ve_je_religious_project_complete_tt:0 "Projekt Religijny osiągnął swój cel."
 ve_je_religious_project_fail_tt:0 "Projekt Religijny został odwołany."

 ve_je_cultural_project:0 "Projekt Kulturalny"
 ve_je_cultural_project_reason:0 "Rząd kieruje długoterminowym projektem kulturalnym. Potencjał administracyjny, legitymizacja, edukacja, spójność narodowa i warunki lokalne wyznaczają jego tempo."
 ve_je_cultural_project_progress:0 "Postęp projektu kulturalnego w kierunku ukończenia"
 ve_je_cultural_project_status_curriculum:0 "Opracowywany jest Krajowy Program Programowy dla szkół i instytucji w kraju.\n\nZakończenie o godz #Y 100#! postęp: #P +20#!  Mandat Kulturalny, #P +5#! Spójność narodowa i wynik 10 lat +2% dostępu do edukacji, +5% kwalifikacji, -25 biurokracji."
 ve_je_cultural_project_status_symbols:0 "Program wspólnych symboli tworzy wspólne słownictwo obywatelskie.\n\nZakończenie o godz #Y 75#! postęp: #P +20#! Mandatu Kulturalnego, #P +7#! Spójności Narodowej i 8-letni wynik +10% lojalistów z w pełni akceptowanych popów i +25 Autorytetu."
 ve_je_cultural_project_status_ethnic:0 "Kampania Integracji Etnicznej w [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] naciska populację mniejszości w kierunku kultury pierwotnej.\n\nUkończenie w #Y 125#! postępie: konwertuje 5% popów kultury docelowej na kulturę pierwotną (7% w przypadku Nacjonalistycznego VII), #P +25#! Mandat kulturowy, #P +8#! Spójność narodowa i wynik 10-letniej asymilacji."
 ve_je_cultural_project_status_civic:0 "Inicjatywa na rzecz Równego Obywatelstwa w [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] rozszerzaniu wspólnego statusu obywatelskiego ponad granicami kulturowymi.\n\nZakończenie w #Y 100#! postępie: +15% Akceptacja na 10 lat, lojaliści państwowi, #P +25#! Mandat kulturowy, #P +10#! Spójność narodowa i 10-letni wynik kwalifikacji/migracji."
 ve_je_cultural_project_status_composite:0 "Umowa konstytucyjna w [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] negocjuje trwałe uznanie w państwie złożonym.\n\nZakończenie o godz #Y 150#! postęp (wymaga 40+ Spójności Narodowej): stałe +15% Akceptacji, dodaje kulturę do listy składników, lojaliści państwowi, #P +30#!  Mandat Kulturalny, #P +12#! Spójność narodowa."
 ve_je_cultural_project_complete_tt:0 "Projekt Kulturalny osiągnął swój cel."
 ve_je_cultural_project_fail_tt:0 "Projekt kulturalny został anulowany."
 ve_je_project_resolving_status:0 "Administracja projektu składa raport końcowy."

 ve_evt_religious_incident_cooldown_mdf:0 "Oczekiwanie na incydent związany z projektem religijnym"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "Administracja projektu przyjmuje konsekwencje niedawnego incydentu."
 ve_evt_cultural_incident_cooldown_mdf:0 "Oczekiwanie na incydent w ramach projektu kulturalnego"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "Administracja projektu absorbuje konsekwencje niedawnego incydentu."
 ve_evt_central_clergy_supported_mdf:0 "Wsparcie duchowieństwa centralnego"
 ve_evt_central_clergy_supported_mdf_desc:0 "Rząd podtrzymał władzę centralnej hierarchii religijnej."
 ve_evt_central_clergy_slighted_mdf:0 "Duchowieństwo centralne niewielkie"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Rząd przedłożył lokalną praktykę nad preferencjami centralnej hierarchii religijnej."
 ve_evt_municipal_patronage_mdf:0 "Miejskie Sieci Patronatów"
 ve_evt_municipal_patronage_mdf_desc:0 "Lokalni notabli wspierają projekt poprzez ustalenia osłabiające ściągalność podatków."

 ve_rel_evt.1.t:0 "Petycja miejscowych notabli "
 ve_rel_evt.1.d:0 "Delegacja duchownych, urzędników miejskich i starszych sąsiedzkich z [SCOPE.sState('ve_evt_target_state').GetName] zwrócił się do rządu o spowolnienie konwersji wyznania. Ostrzegają, że sztywny harmonogram zamieni przestrzeganie przepisów w trwałą niechęć."
 ve_rel_evt.1.f:0 "„Wiara narzucona bez rady może zapełnić księgi podczas opróżniania ławek”."
 ve_rel_evt.1.a:0 "Wysłuchaj ich petycji."
 ve_rel_evt.1.a.tt:0 "Postęp Projektu Religijnego zmniejsza się o #N 4#!.\nOsadnictwo Religijne wzrasta o #P 3#!."
 ve_rel_evt.1.b:0 "Harmonogram się nie zmieni."
 ve_rel_evt.1.b.tt:0 "Postęp Projektu Religijnego wzrasta o #P 5#!.\nOsadnictwo religijne zmniejsza się o #N 2#!.\n#N 0,5%#! populacji [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_rel_evt.1.c:0 "Zaufani pośrednicy Komisji."
 ve_rel_evt.1.c.tt:0 "Wydaj #N 10#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 3#!.\nOsadnictwo religijne wzrasta o #P 1#!."

 ve_rel_evt.2.t:0 "Niedobór oficerów terenowych"
 ve_rel_evt.2.d:0 "Raporty z [SCOPE.sState('ve_evt_target_state').GetName] opisz petycje bez odpowiedzi, sprzeczne instrukcje i okręgi, w których od tygodni nie było kontaktu z urzędnikiem odpowiedzialnym za projekt. Nawrócenie wyznania przekracza możliwości administracji wyznaczonej do jego przeprowadzenia."
 ve_rel_evt.2.f:0 "„Dekret może objechać cały kraj w ciągu jednego dnia. Kompetentny urzędnik nie”."
 ve_rel_evt.2.a:0 "Zatrudnij tymczasowych oficerów terenowych."
 ve_rel_evt.2.a.tt:0 "Wydaj #N 15#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 4#!."
 ve_rel_evt.2.b:0 "Zwolnij program."
 ve_rel_evt.2.b.tt:0 "Postęp Projektu Religijnego zmniejsza się o #N 6#!.\nOsadnictwo Religijne wzrasta o #P 2#!."
 ve_rel_evt.2.c:0 "Użyj kadr centralnego rejestru."
 ve_rel_evt.2.c.tt:0 "Wydaj #N 10#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 5#!."

 ve_cul_evt.1.t:0 "Biura Tłumaczeń"
 ve_cul_evt.1.d:0 "Urzędnicy w [SCOPE.sState('ve_evt_target_state').GetName] nie zgadzają się co do tego, w jaki sposób Inicjatywa na rzecz Równego Obywatelstwa powinna zająć się problemem [SCOPE.sCulture('ve_evt_target_culture').GetName] język. Lokalni administratorzy chcą biur dwujęzycznych; ministerstwa centralne żądają jednolitego standardu administracyjnego."
 ve_cul_evt.1.f:0 "„Obywatel nie powinien potrzebować tłumacza, aby zrozumieć prawa przyznane mu w jego własnym imieniu.”"
 ve_cul_evt.1.a:0 "Niech lokalne języki żyją w instytucjach publicznych."
 ve_cul_evt.1.a.tt:0 "Postęp projektu kulturalnego zmniejsza się o #N 4#!.\nSpójność narodowa wzrasta o #P 3#!."
 ve_cul_evt.1.b:0 "Narzucamy jeden standard administracyjny."
 ve_cul_evt.1.b.tt:0 "Postęp Projektu kulturalnego wzrasta o #P 5#!.\nSpójność narodowa spada o #N 2#!.\n#N 0,5%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_cul_evt.1.c:0 "Utworzyć akademicką komisję tłumaczeniową."
 ve_cul_evt.1.c.tt:0 "Wydać #N 10#!  Mandatu Kulturalnego.\nPostęp Projektu Kulturalnego wzrasta o #P 3#!.\nSpójność narodowa wzrasta o #P 1#!."

 ve_cul_evt.2.t:0 "Niedobór lokalnych nauczycieli"
 ve_cul_evt.2.d:0 "Szkoły im [SCOPE.sState('ve_evt_target_state').GetName] brakuje nauczycieli, którzy byliby w stanie obsłużyć zarówno państwowy program nauczania, jak i [SCOPE.sCulture('ve_evt_target_culture').GetName] społeczności. Bez wyszkolonej lokalnej kadry istnieje ryzyko, że równe obywatelstwo pozostanie obietnicą spisaną wyłącznie na oficjalnym papierze."
 ve_cul_evt.2.f:0 "„Prawo ogłasza równość w jedno popołudnie; klasa musi uczyć tego przez całe pokolenie”."
 ve_cul_evt.2.a:0 "Finansowanie nowych kolegiów nauczycielskich."
 ve_cul_evt.2.a.tt:0 "Wydaj #N 15#! Mandatu Kulturalnego.\nPostęp Projektu Kulturalnego wzrasta o #P 4#!."
 ve_cul_evt.2.b:0 "Powolna realizacja."
 ve_cul_evt.2.b.tt:0 "Postęp Projektu Kulturalnego zmniejsza się o #N 6#!.\nSpójność Narodowa wzrasta o #P 2#!."
 ve_cul_evt.2.c:0 "Wykorzystaj istniejące instytucje."
 ve_cul_evt.2.c.tt:0 "Wydaj #N 10#!  Mandat Kulturalny.\nPostęp Projektu Kulturalnego wzrasta o #P 5#!.\nSpójność Narodowa wzrasta o #P 1#!."

 ve_rel_evt.3.t:0 "Sprzeczne rejestry"
 ve_rel_evt.3.d:0 "Księgi parafialne, księgi gminne i raporty urzędników odpowiedzialnych za realizację projektów zawierają niezgodne sprawozdania na temat przynależności religijnej w [SCOPE.sState('ve_evt_target_state').GetName]. Administracja musi zdecydować, czy tracić czas na ustalanie prawdy, czy też opierać się na liczbach, o których wie, że są niepewne."
 ve_rel_evt.3.f:0 "„Każde biuro ma dokładną sumę. Żadne dwie sumy się nie zgadzają.”"
 ve_rel_evt.3.a:0 "Przeprowadź pełny audyt."
 ve_rel_evt.3.a.tt:0 "Zysk #P 8#! Reforma pobożności.\nPostęp projektu religijnego zmniejsza się o #N 6#!."
 ve_rel_evt.3.b:0 "Kontynuuj rozsądne szacunki."
 ve_rel_evt.3.b.tt:0 "Wydaj #N 8#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 5#!."
 ve_rel_evt.3.c:0 "Korzystaj z rejestrów Świętej Administracji."
 ve_rel_evt.3.c.tt:0 "Postęp Projektu Religijnego wzrasta o #P 3#!."

 ve_rel_evt.4.t:0 "Plotki i kontr-przepowiadania"
 ve_rel_evt.4.d:0 "Broszury, kazania uliczne i niepokojące pogłoski opisują obecnie nawrócenie do spowiedzi w [SCOPE.sState('ve_evt_target_state').GetName] jako atak na życie lokalne. Urzędnicy ostrzegają, że milczenie pozwoli przeciwnikom zdefiniować projekt, a represje mogą potwierdzić ich najmroczniejsze twierdzenia."
 ve_rel_evt.4.f:0 "„Plotka nie wymaga urzędu, pieczęci ani budżetu”."
 ve_rel_evt.4.a:0 "Organizuj przesłuchania publiczne."
 ve_rel_evt.4.a.tt:0 "Postęp Projektu Religijnego zmniejsza się o #N 3#!.\nOsadnictwo religijne wzrasta o #P 3#!.\n#P 0,5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] zostaje lojalistą."
 ve_rel_evt.4.b:0 "Ukarać agitatorów."
 ve_rel_evt.4.b.tt:0 "Postęp Projektu Religijnego wzrasta o #P 4#!.\nOsadnictwo religijne zmniejsza się o #N 3#!.\n#N 1%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_rel_evt.4.c:0 "Opublikuj zapisy i wyniki."
 ve_rel_evt.4.c.tt:0 "Wydaj #N 10#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 2#!.\nOsadnictwo religijne wzrasta o #P 1#!."

 ve_rel_evt.5.t:0 "Język kazania"
 ve_rel_evt.5.d:0 "Projekt duchowieństwa w [SCOPE.sState('ve_evt_target_state').GetName] donoszą, że formalne kazania zachowują jedność doktrynalną, ale nie docierają do wielu kongregacji. Głoszenie w języku lokalnym posunęłoby kampanię dalej, chociaż hierarchia centralna obawia się, że adaptacja stanie się niezależnością."
 ve_rel_evt.5.f:0 "„Święte słowo, które nie jest słyszane, zostaje doskonale zachowane i przez nikogo nie przyjęte.”"
 ve_rel_evt.5.a:0 "Głoś w lokalnych językach."
 ve_rel_evt.5.a.tt:0 "Postęp Projektu Religijnego wzrasta o #P 6#!.\nPobożni tracą #N 1#! aprobatę na #Y 2,5 roku#!."
 ve_rel_evt.5.b:0 "Zachowaj jedność liturgiczną."
 ve_rel_evt.5.b.tt:0 "Postęp projektu religijnego zmniejsza się o #N 3#!.\nOsadnictwo religijne wzrasta o #P 3#!.\nZysk pobożności #P 1#! Zatwierdzenie na #Y 2,5 roku#!."
 ve_rel_evt.5.c:0 "Szkolenie wykształconych tłumaczy ustnych."
 ve_rel_evt.5.c.tt:0 "Wydaj #N 10#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 4#!.\nOsadnictwo religijne wzrasta o #P 1#!."

 ve_rel_evt.6.t:0 "Rywalizujące władze kościelne"
 ve_rel_evt.6.d:0 "Nominowani centralnie i uznani lokalni duchowni w [SCOPE.sState('ve_evt_target_state').GetName] każdy rości sobie prawo do kierowania konwersją wyznaniową. Poparcie jednej ze stron może szybko przywrócić dowództwo, ale spór stał się już sprawdzianem tego, kto przemawia w imieniu wiary."
 ve_rel_evt.6.f:0 "„Spór dotyczy jurysdykcji, czyli sposobu, w jaki instytucje opisują władzę”."
 ve_rel_evt.6.a:0 "Wspieraj duchowieństwo centralne."
 ve_rel_evt.6.a.tt:0 "Postęp Projektu Religijnego wzrasta o #P 5#!.\nZyski pobożności #P 1#! Zatwierdzenie na #Y 2,5 roku#!.\nOsadnictwo religijne zmniejsza się o #N 3#!.\n#N 0,5%#! populacji [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_rel_evt.6.b:0 "Ułagodzić miejscowe duchowieństwo."
 ve_rel_evt.6.b.tt:0 "Postęp w projekcie religijnym zmniejsza się o #N 4#!.\nPobożni tracą #N 1#! Aprobatę na #Y 2,5 roku#!.\nOsadnictwo religijne wzrasta o #P 3#!."
 ve_rel_evt.6.c:0 "Określ swoje uprawnienia na piśmie."
 ve_rel_evt.6.c.tt:0 "Wydaj #N 10#! Reforma pobożności.\nPostęp projektu religijnego wzrasta o #P 3#!.\nOsadnictwo religijne wzrasta o #P 1#!."

 ve_cul_evt.3.t:0 "Kategorie spisu ludności"
 ve_cul_evt.3.d:0 "Urzędnicy spisowi w [SCOPE.sState('ve_evt_target_state').GetName] Nie mogę się zgodzić, w jaki sposób obywatele [SCOPE.sCulture('ve_evt_target_culture').GetName] kulturę należy rejestrować. Respondenci lokalni posługują się nakładającymi się tożsamościami, natomiast formularze centralne wymagają jednej odpowiedzi w jednym polu."
 ve_cul_evt.3.f:0 "„Kategoria upraszcza księgę na długo przed uproszczeniem kraju.”"
 ve_cul_evt.3.a:0 "Pozwól na samoidentyfikację."
 ve_cul_evt.3.a.tt:0 "Postęp projektu kulturalnego zmniejsza się o #N 4#!.\nSpójność narodowa wzrasta o #P 4#!."
 ve_cul_evt.3.b:0 "Kategorie zostaną ustawione centralnie."
 ve_cul_evt.3.b.tt:0 "Postęp Projektu Kulturalnego wzrasta o #P 6#!.\nSpójność narodowa spada o #N 4#!.\n#N 0,5%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_cul_evt.3.c:0 "Skorzystaj z nowoczesnego systemu rejestracji."
 ve_cul_evt.3.c.tt:0 "Wydaj #N 10#!  Mandat Kulturalny.\nPostęp Projektu Kulturalnego wzrasta o #P 5#!.\nSpójność Narodowa wzrasta o #P 1#!."

 ve_cul_evt.4.t:0 "Notabli Miejscy"
 ve_cul_evt.4.d:0 "Patroni Miejscy w [SCOPE.sState('ve_evt_target_state').GetName] oferują swoje biura, klientów i wpływy, aby promować równe obywatelstwo dla społeczeństwa [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja. Ich współpraca byłaby szybka, ale ich ceną jest dalsza kontrola nad lokalnymi dochodami."
 ve_cul_evt.4.f:0 "„Najkrótsza droga do ratusza wiedzie przez kilka prywatnych salonów.”"
 ve_cul_evt.4.a:0 "Korzystaj z sieci lokalnych."
 ve_cul_evt.4.a.tt:0 "Postęp Projektu Kulturalnego wzrasta o #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] traci #N 5%#! Zdolność podatkową na #Y 2 lata#!."
 ve_cul_evt.4.b:0 "Utwórz otwarte rady."
 ve_cul_evt.4.b.tt:0 "Postęp projektu kulturalnego spada o #N 3#!.\nSpójność narodowa wzrasta o #P 3#!."
 ve_cul_evt.4.c:0 "Wynegocjuj porozumienie oparte na zasadach."
 ve_cul_evt.4.c.tt:0 "Wydaj #N 10#!  Mandat kulturalny.\nPostęp projektu kulturalnego wzrasta o #P 3#!.\nSpójność narodowa wzrasta o #P 1#!."

 ve_cul_evt.5.t:0 "Egzaminy do służby cywilnej"
 ve_cul_evt.5.d:0 "Otwarcie egzaminów do służby cywilnej [SCOPE.sCulture('ve_evt_target_culture').GetName] kandydatów ujawniło rozbieżność pomiędzy równością prawną a przygotowaniem praktycznym. Natychmiastowy dostęp miałby symboliczną siłę, ale dekretem nie można wymazać lat nierównego uczenia się."
 ve_cul_evt.5.f:0 "„Ten sam egzamin to nie ta sama szansa, gdy tylko jeden kandydat uczył się tego języka”."
 ve_cul_evt.5.a:0 "Kursy przygotowawcze dotyczące finansów."
 ve_cul_evt.5.a.tt:0 "Wydawać #N 15#!  Mandat kulturalny.\nPostęp projektu kulturalnego wzrasta o #P 5#!.\nSpójność narodowa wzrasta o #P 2#!."
 ve_cul_evt.5.b:0 "Równy dostęp rozpoczyna się natychmiast."
 ve_cul_evt.5.b.tt:0 "Postęp projektu kulturalnego wzrasta o #P 7#!.\nSpójność narodowa spada o #N 4#!.\n#N 0,5%#! populacji [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykalny."
 ve_cul_evt.5.c:0 "Zmobilizuj sieci szkół i opieki społecznej."
 ve_cul_evt.5.c.tt:0 "Wydaj #N 10#!  Mandatu Kulturalnego.\nPostęp Projektu Kulturalnego wzrasta o #P 5#!.\nSpójność narodowa wzrasta o #P 2#!."
 ve_cul_evt.5.e:0 "Najpierw zreformuj system egzaminowania."
 ve_cul_evt.5.e.tt:0 "Postęp Projektu Kulturalnego zmniejsza się o #N 4#!.\nSpójność narodowa wzrasta o #P 3#!."

 ve_cul_evt.6.t:0 "Większość odpycha"
 ve_cul_evt.6.d:0 "Przeciwnicy Inicjatywy na rzecz Równego Obywatelstwa twierdzą, że rozszerzenie powszechnych praw na [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja obniża pozycję wszystkich pozostałych. Demonstracje w [SCOPE.sState('ve_evt_target_state').GetName] zamieniają reformę administracyjną w krajowy test polityczny."
 ve_cul_evt.6.f:0 "„Wspólne prawo jest opisywane jako skradziony przywilej”. "
 ve_cul_evt.6.a:0 " Otwarcie brońcie tej inicjatywy."
 ve_cul_evt.6.a.tt:0 "Postęp Projektu Kulturalnego wzrasta o #P 4#!.\nSpójność narodowa spada o #N 4#!.\n#N 1%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykalny."
 ve_cul_evt.6.b:0 "Zmniejszenie tempa realizacji."
 ve_cul_evt.6.b.tt:0 "Postęp Projektu Kulturalnego spada o #N 5#!.\nSpójność Narodowa wzrasta o #P 3#!."
 ve_cul_evt.6.c:0 "Zmobilizuj koalicję reformatorską."
 ve_cul_evt.6.c.tt:0 "Wydaj #N 10#!  Mandatu Kulturalnego.\nPostęp Projektu Kulturalnego wzrasta o #P 3#!.\nSpójność Narodowa wzrasta o #P 2#!.\n#P 0,5%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] zostaje lojalistą."

 ve_rel_evt.7.t:0 "Misja w punkcie krytycznym"
 ve_rel_evt.7.d:0 "Nawrócenie konfesjonału w [SCOPE.sState('ve_evt_target_state').GetName] jest bliski upadku administracyjnego i politycznego. Urzędy przestały odpowiadać sobie nawzajem, opór społeczeństwa nasila się, a duchowni terenowi ostrzegają, że misja nie może być kontynuowana na obecnych warunkach."
 ve_rel_evt.7.f:0 "„W raportach nadal nazywa się to przejściową trudnością. Ulice wybrały ostrzejszą nazwę”."
 ve_rel_evt.7.a:0 "Zaakceptuj straty i wycofaj się."
 ve_rel_evt.7.a.tt:0 "Anuluj projekt religijny bez zwrotu kosztów reformy pobożności.\nOsadnictwo religijne zmniejsza się o #N 5#!.\nDla #Y 2 lata#!: #N -50#! biurokracja, #N -50#! władza i #N -3%#! sukces stanowienia prawa."
 ve_rel_evt.7.b:0 "przeniesienie zasobów awaryjnych."
 ve_rel_evt.7.b.tt:0 "wydanie #N 25#! reformy pobożności.\nPostęp projektu religijnego spada o #N 5#!.\n#N 1%#! populacji in [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny.\nProjekt jest kontynuowany."
 ve_rel_evt.7.c:0 "Kontynuuj ze szkieletowym personelem."
 ve_rel_evt.7.c.tt:0 "Postęp projektu religijnego zmniejsza się o #N 10#!.\nOsadnictwo religijne zmniejsza się o #N 2#!.\nProjekt jest kontynuowany."
 ve_rel_evt.7.e:0 "Renegocjuj metodę."
 ve_rel_evt.7.e.tt:0 "Wydaj #N 15#! Reformę pobożności.\nPostęp projektu religijnego zmniejsza się o #N 3#!.\nOsadnictwo religijne wzrasta o #P 2#!.\n#N 0,5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykalny.\nProjekt jest kontynuowany."

 ve_cul_evt.7.t:0 "Inicjatywa traci legitymację"
 ve_cul_evt.7.d:0 "Inicjatywa na rzecz Równego Obywatelstwa w [SCOPE.sState('ve_evt_target_state').GetName] traci poparcie zarówno ze strony uznanych instytucji, jak i [SCOPE.sCulture('ve_evt_target_culture').GetName] społeczności, którym miała służyć. Radykalne ruchy przedstawiają obecnie każdy kompromis jako dowód na to, że rząd nie jest w stanie zapewnić równości."
 ve_cul_evt.7.f:0 "„Reforma może przetrwać sprzeciw. Nie może przetrwać stania się niewiarygodną”."
 ve_cul_evt.7.a:0 "Zakończ inicjatywę."
 ve_cul_evt.7.a.tt:0 "Anuluj Projekt Kulturalny bez zwrotu Mandatu Kulturalnego.\nSpójność narodowa zmniejsza się o #N 5#!.\nPrzez #Y 2 lata#!: #N -50#! biurokracja, #N -25#! władza i #N -3%#! sukces stanowienia prawa."
 ve_cul_evt.7.b:0 "wydawanie nadzwyczajnych dotacji lokalnych."
 ve_cul_evt.7.b.tt:0 "wydawanie #N 25#! mandatów kulturalnych.\nPostęp projektów kulturalnych spada o #N 5#!.\n#N 1%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykalny.\nProjekt jest kontynuowany."
 ve_cul_evt.7.c:0 "Kontynuuj z minimalnym programem."
 ve_cul_evt.7.c.tt:0 "Postęp Projektu Kulturalnego zmniejsza się o #N 10#!.\nSpójność narodowa spada o #N 2#!.\nProjekt jest kontynuowany."
 ve_cul_evt.7.e:0 "Odbuduj koalicję."
 ve_cul_evt.7.e.tt:0 "Wydawaj #N 15#!  Mandat kulturalny.\nPostęp projektu kulturalnego spada o #N 3#!.\nSpójność narodowa wzrasta o #P 2#!.\n#N 0,5%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykalny.\nProjekt jest kontynuowany."

 ve_rel_evt.8.t:0 "Nieoczekiwane lokalne porozumienie"
 ve_rel_evt.8.d:0 "Duchowni, urzędnicy miejscy i starsi społeczności w [SCOPE.sState('ve_evt_target_state').GetName] osiągnęły porozumienie, którego nie byłaby w stanie osiągnąć żadna centralna dyrektywa. Lokalny opór słabnie, kongregacje same koordynują misję, a nawrócenie wyznaniowe nabrało nieoczekiwanego impetu."
 ve_rel_evt.8.f:0 "„To, co zaczęło się jako rozkaz ze stolicy, stało się umową zawartą na rynku.”"
 ve_rel_evt.8.a:0 "Wykorzystaj w pełni ten impet."
 ve_rel_evt.8.a.tt:0 "Osadnictwo religijne wzrasta o #P 1#!.\nPostęp projektu religijnego wzrasta o #P 25#!.\nJeśli postęp osiągnie #Y 100#!, stosowany jest normalny efekt ukończenia projektu."
 ve_rel_evt.8.b:0 "Trwałość przed szybkością."
 ve_rel_evt.8.b.tt:0 "Osadnictwo religijne wzrasta o #P 4#!.\nPostęp projektu religijnego wzrasta o #P 10#!.\nJeśli postęp osiągnie #Y 100#!, stosowany jest normalny efekt zakończenia projektu."

 ve_cul_evt.8.t:0 "Lokalna Koalicja Obywatelska"
 ve_cul_evt.8.d:0 "Nauczyciele, urzędnicy miejscy, stowarzyszenia branżowe i przedstawiciele samorządu [SCOPE.sCulture('ve_evt_target_culture').GetName] społeczność w [SCOPE.sState('ve_evt_target_state').GetName] utworzyli wspólną komisję. Rozwiązując spory, zanim dotrą one do stolicy, koalicja ta nadała Inicjatywie na rzecz Równego Obywatelstwa impet, którego administracja nie była w stanie wytworzyć."
 ve_cul_evt.8.f:0 "„Obywatelstwo stało się rzeczywistością, gdy instytucje, które rzadko dzieliły wspólny stół, zaczęły dzielić się odpowiedzialnością”."
 ve_cul_evt.8.a:0 "Wykorzystaj impet koalicji."
 ve_cul_evt.8.a.tt:0 "Spójność narodowa wzrasta o #P 1#!.\nPostęp projektu kulturalnego wzrasta o #P 25#!.\nJeśli postęp osiągnie #Y 100#!, stosowany jest normalny efekt ukończenia projektu."
 ve_cul_evt.8.b:0 "Uczyń instytucje trwałymi."
 ve_cul_evt.8.b.tt:0 "Spójność narodowa wzrasta o #P 4#!.\nPostęp projektu kulturalnego wzrasta o #P 10#!.\nJeśli postęp osiąga #Y 100#!, stosowany jest normalny efekt ukończenia projektu."

 ve_rel_evt.40.t:0 "Rejestry Out of Step"
 ve_rel_evt.40.d:0 "Prowincjonalne rejestry w [SCOPE.sState('ve_evt_target_state').GetName] używaj niezgodnych kategorii dla kongregacji, stowarzyszeń obywatelskich i instytucji publicznych. Doniesienia docierające do stolicy są obecnie sprzeczne, przez co projekt nie jest w stanie odróżnić zgodności od oporu."
 ve_rel_evt.40.f:0 "„Polityka zarządzana za pośrednictwem trzech ksiąg wkrótce zyskuje trzy różne rzeczywistości.”"
 ve_rel_evt.40.a:0 "Wyślij centralny audyt."
 ve_rel_evt.40.a.tt:0 "Wydaj #N 10#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 5#!.\nOsadnictwo religijne wzrasta o #P 1#!."
 ve_rel_evt.40.b:0 "Uzgodnij zapisy lokalnie."
 ve_rel_evt.40.b.tt:0 "Postęp Projektu Religijnego zmniejsza się o #N 3#!.\nOsadnictwo Religijne wzrasta o #P 2#!."
 ve_rel_evt.40.c:0 "Zastosuj standardową procedurę rejestracji."
 ve_rel_evt.40.c.tt:0 "Wydaj #N 5#! Reformę Pobożności.\nPostęp Projektu Religijnego wzrasta o #P 4#!.\nOsadnictwo religijne wzrasta o #P 1#!."

 ve_rel_evt.41.t:0 "Niedobory kadr wojewódzkich"
 ve_rel_evt.41.d:0 "Urzędy kierujące projektem w [SCOPE.sState('ve_evt_target_state').GetName] nie mogą znaleźć wystarczającej liczby przeszkolonych urzędników, nauczycieli i inspektorów. Dyrektywy gromadzą się szybciej, niż lokalni urzędnicy są w stanie je zinterpretować, a pośpieszne nominacje grożą zaostrzeniem każdego sporu."
 ve_rel_evt.41.f:0 "„Dekret został wydany w ciągu jednego dnia. Ludziom, którzy będą w stanie go wykonać, może zająć całe pokolenie.”"
 ve_rel_evt.41.a:0 "Sfinansowanie nowej kadry urzędników."
 ve_rel_evt.41.a.tt:0 "Wydaj #N 15#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 6#!."
 ve_rel_evt.41.b:0 "Zwolnij wdrażanie."
 ve_rel_evt.41.b.tt:0 "Postęp w projekcie religijnym zmniejsza się o #N 6#!.\nOsadnictwo religijne wzrasta o #P 2#!."
 ve_rel_evt.41.c:0 "Wykorzystaj istniejącą sieć edukacyjną."
 ve_rel_evt.41.c.tt:0 "Wydaj #N 10#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 5#!.\nOsadnictwo religijne zwiększa się o #P 1#!."

 ve_rel_evt.42.t:0 "Plotki w całym okręgu"
 ve_rel_evt.42.d:0 "Plotki w [SCOPE.sState('ve_evt_target_state').GetName] twierdzą, że pod projektem kryją się środki znacznie surowsze niż te zapowiadane przez rząd. Organizatorzy religijni i lokalni agitatorzy powtarzają sprzeczne historie, a oficjalne milczenie pozwala na rozpowszechnianie się każdej nowej wersji."
 ve_rel_evt.42.f:0 "„Plotka nie wymaga biura, budżetu ani podpisu”."
 ve_rel_evt.42.a:0 "Publikuj raporty."
 ve_rel_evt.42.a.tt:0 "Postęp Projektu Religijnego zmniejsza się o #N 3#!.\nOsadnictwo religijne zwiększa się o #P 4#!."
 ve_rel_evt.42.b:0 "Odrzuć agitację."
 ve_rel_evt.42.b.tt:0 "Postęp projektu religijnego wzrasta o #P 5#!.\nOsadnictwo religijne zmniejsza się o #N 3#!.\n#N 1%#! populacji [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_rel_evt.42.c:0 "Komisja lokalnych mediatorów."
 ve_rel_evt.42.c.tt:0 "Wydaj #N 10#! Reforma pobożności.\nPostęp projektu religijnego wzrasta o #P 4#!.\nOsadnictwo religijne wzrasta o #P 2#!.\n#P 0,5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] zostaje lojalistą."

 ve_rel_evt.43.t:0 "Administracja w Breaking Point"
 ve_rel_evt.43.d:0 "Projekt w [SCOPE.sState('ve_evt_target_state').GetName] zbliża się upadek administracyjny. Urzędy wojewódzkie są przeciążone, zaufanie społeczne zostało zachwiane, a zorganizowana opozycja traktuje każdą nową dyrektywę jako dowód utraty kontroli przez rząd."
 ve_rel_evt.43.f:0 "„Kiedy akta przestają się przenosić, kryzys przenosi się na ulice”."
 ve_rel_evt.43.a:0 "Zakończ program."
 ve_rel_evt.43.a.tt:0 "Anuluj projekt religijny bez zwrotu kosztów reformy pobożności.\nOsadnictwo religijne zmniejsza się o #N 5#!.\nPrzez #Y 2 lata#!: #N -50#! biurokracja, #N -50#! władza i #N -3%#! sukces stanowienia prawa."
 ve_rel_evt.43.b:0 "przeniesienie zasobów awaryjnych."
 ve_rel_evt.43.b.tt:0 "wydanie #N 25#! reformy pobożności.\nPostęp projektu religijnego zmniejsza się o #N 5#!.\n#N 1%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykalny.\nProjekt jest kontynuowany."
 ve_rel_evt.43.c:0 "Kontynuuj z laską szkieletową."
 ve_rel_evt.43.c.tt:0 "Postęp Projektu Religijnego zmniejsza się o #N 10#!.\nOsadnictwo religijne zmniejsza się o #N 2#!.\nProjekt jest kontynuowany."
 ve_rel_evt.43.e:0 "Odbuduj lokalne partnerstwo."
 ve_rel_evt.43.e.tt:0 "Wydaj #N 15#! Reforma pobożności.\nPostęp projektu religijnego zmniejsza się o #N 3#!.\nOsadnictwo religijne wzrasta o #P 2#!.\n#N 0,5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny.\nProjekt trwa."

 ve_rel_evt.100.t:0 "Miejsca w Radzie Międzywyznaniowej"
 ve_rel_evt.100.d:0 "Delegaci w [SCOPE.sState('ve_evt_target_state').GetName] zgadzają się, że rada międzywyznaniowa jest konieczna, ale nie w sprawie tego, kto zasługuje na miejsce. Proporcjonalna reprezentacja uspokoiłaby mniejsze społeczności, a zaprojektowane w stolicy stałe osiedle mogłoby natychmiast zacząć działać."
 ve_rel_evt.100.f:0 "„Wszyscy wspierają wspólny stół, dopóki nie zostaną policzone krzesła”."
 ve_rel_evt.100.a:0 "Rozłóż reprezentację według populacji."
 ve_rel_evt.100.a.tt:0 "Postęp Projektu Religijnego zmniejsza się o #N 3#!.\nOsadnictwo religijne wzrasta o #P 4#!."
 ve_rel_evt.100.b:0 "Narzuć ustalony centralny kompromis."
 ve_rel_evt.100.b.tt:0 "Postęp projektu religijnego wzrasta o #P 5#!.\nOsadnictwo religijne zmniejsza się o #N 2#!.\n#N 0,5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_rel_evt.100.c:0 "Wzmocnij pozycję Rad Międzywyznaniowych."
 ve_rel_evt.100.c.tt:0 "Wydaj #N 10#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 5#!.\nOsadnictwo religijne wzrasta o #P 2#!."

 ve_rel_evt.101.t:0 "Wspólny program nauczania w szkole"
 ve_rel_evt.101.d:0 "Szkoły w [SCOPE.sState('ve_evt_target_state').GetName] potrzebują wspólnych lekcji obywatelskich, bez przekształcania Freedom Outreach w kampanię przeciwko lokalnym przekonaniom. Nauczyciele żądają przejrzystych materiałów i wspólnych szkoleń, podczas gdy przywódcy społeczności nalegają, aby w lokalnym nauczaniu pozostało miejsce na ich tradycje."
 ve_rel_evt.101.f:0 "„Wspólna lekcja zakończy się sukcesem tylko wtedy, gdy każda rodzina uzna klasę za swoją.”"
 ve_rel_evt.101.a:0 "Finansuj wspólną kadrę nauczycielską."
 ve_rel_evt.101.a.tt:0 "Wydaj #N 15#! Reforma pobożności.\nPostęp projektu religijnego wzrasta o #P 6#!.\nOsadnictwo religijne wzrasta o #P 1#!."
 ve_rel_evt.101.b:0 "Zostaw miejsce na lokalne programy nauczania."
 ve_rel_evt.101.b.tt:0 "Postęp projektu religijnego zmniejsza się o #N 4#!.\nOsadnictwo religijne wzrasta o #P 3#!."
 ve_rel_evt.101.c:0 "Wprowadź koalicję reform do szkół."
 ve_rel_evt.101.c.tt:0 "Wydaj #N 10#! Reforma pobożności.\nPostęp projektu religijnego wzrasta o #P 5#!.\nOsadnictwo religijne wzrasta o #P 2#!.\n#P 0.5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] zostaje lojalistą."

 ve_rel_evt.102.t:0 "Karta wzajemnych gwarancji"
 ve_rel_evt.102.d:0 "Wspólnoty religijne, urzędnicy miejscy i stowarzyszenia reformatorskie w [SCOPE.sState('ve_evt_target_state').GetName] opracowały wspólną kartę. Każdy sygnatariusz przyjmuje te same obowiązki obywatelskie w zamian za publiczne gwarancje, że żadna społeczność nie zostanie wykluczona z lokalnych instytucji."
 ve_rel_evt.102.f:0 "„Zaufanie stało się możliwe, gdy każda obietnica została spisana jako prawo drugiej strony.”"
 ve_rel_evt.102.a:0 "Wykorzystaj impet porozumienia."
 ve_rel_evt.102.a.tt:0 "Osadnictwo religijne wzrasta o #P 2#!.\nPostęp projektu religijnego wzrasta o #P 20#!.\nJeśli postęp osiągnie #Y 100#!, stosowany jest normalny efekt ukończenia projektu."
 ve_rel_evt.102.b:0 "Uczyń gwarancje trwałymi."
 ve_rel_evt.102.b.tt:0 "Osadnictwo religijne wzrasta o #P 4#!.\n#P 0,5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] zostaje Lojalistą.\nPostęp w projekcie religijnym wzrasta o #P 10#!.\nJeśli postęp osiągnie #Y 100#!, stosowany jest normalny efekt ukończenia projektu."

 ve_rel_evt.150.t:0 "Nauczyciele czy inspektorzy?"
 ve_rel_evt.150.d:0 "Kampania sekularyzacyjna w [SCOPE.sState('ve_evt_target_state').GetName] ujawniła niedobór wykwalifikowanej kadry. Administracja może rozbudować kadrę nauczycielską, która buduje długoterminowy potencjał obywatelski, lub polegać na inspektorach, którzy przy pomocy już dostępnej kadry będą w stanie egzekwować nowe zasady."
 ve_rel_evt.150.f:0 "„Inspektor może zamknąć szkołę w jedno popołudnie. Nauczyciel może potrzebować lat, aby zastąpić to, czego się tam nauczono”."
 ve_rel_evt.150.a:0 "Poszerzaj korpus nauczycielski."
 ve_rel_evt.150.a.tt:0 "Wydaj #N 15#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 6#!."
 ve_rel_evt.150.b:0 "Zwolnij program, aby dopasować go do istniejącego personelu."
 ve_rel_evt.150.b.tt:0 "Postęp projektu religijnego zmniejsza się o #N 5#!.\nOsadnictwo religijne wzrasta o #P 2#!."
 ve_rel_evt.150.c:0 "Zamów publiczną sieć edukacyjną."
 ve_rel_evt.150.c.tt:0 "Wydaj #N 10#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 5#!.\nOsadnictwo religijne wzrasta o #P 1#!."

 ve_rel_evt.151.t:0 "Zajęte dobra"
 ve_rel_evt.151.d:0 "Dawne dobra sakralne w [SCOPE.sState('ve_evt_target_state').GetName] być gotowe do przekształcenia w szkoły, przychodnie i urzędy miejskie. Natychmiastowy transfer zapewniłby kampanii cenną infrastrukturę, ale brak wynagrodzenia staje się punktem zjednoczenia dla pobożnych."
 ve_rel_evt.151.f:0 "„Klucze zmieniły właściciela rano. Spór o własność przetrwa zamki”."
 ve_rel_evt.151.a:0 "Wypłacaj odszkodowanie etapami."
 ve_rel_evt.151.a.tt:0 "Wydaj #N 15#! Reformę pobożności.\nPostęp projektu religijnego wzrasta o #P 3#!.\nOsada religijna wzrasta o #P 3#!."
 ve_rel_evt.151.b:0 "Natychmiast oddaj nieruchomości do użytku publicznego."
 ve_rel_evt.151.b.tt:0 "Postęp projektu religijnego wzrasta o #P 7#!.\nOsadnictwo religijne zmniejsza się o #N 4#!.\n#N 1%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny.\nPobożni tracą #N 1#! aprobatę dla #Y 2,5 roku#!."
 ve_rel_evt.151.c:0 "Przenieść je do świeckich instytucji opieki społecznej."
 ve_rel_evt.151.c.tt:0 "Wydać #N 10#! Reformę pobożności.\nPostęp w projekcie religijnym wzrasta o #P 5#!.\nOsadnictwo religijne wzrasta o #P 2#!.\n#P 0,5%#! populacji w [SCOPE.sState('ve_evt_target_state').GetName] zostaje lojalistą."

 ve_rel_evt.152.t:0 "Zakorzeniają się stowarzyszenia obywatelskie"
 ve_rel_evt.152.d:0 "Kółka nauczycielskie, towarzystwa wzajemnej pomocy i stowarzyszenia gminne w [SCOPE.sState('ve_evt_target_state').GetName] zaczęły świadczyć usługi zorganizowane za pośrednictwem instytucji religijnych. Ich współpraca dała Kampanii Sekularyzacji lokalny fundament obywatelski, a nie jedynie obecność administracyjną."
 ve_rel_evt.152.f:0 "„Nowy porządek przetrwał, gdy obywatele zaczęli go utrzymywać, nie czekając na inspektora”."
 ve_rel_evt.152.a:0 "Wykorzystaj lokalny pęd."
 ve_rel_evt.152.a.tt:0 "Osadnictwo religijne wzrasta o #P 2#!.\nPostęp projektu religijnego wzrasta o #P 20#!.\nJeśli postęp osiągnie #Y 100#!, stosowany jest normalny efekt ukończenia projektu."
 ve_rel_evt.152.b:0 "Przekształć stowarzyszenia w stałe instytucje."
 ve_rel_evt.152.b.tt:0 "Osadnictwo religijne wzrasta o #P 4#!.\nPostęp projektu religijnego wzrasta o #P 10#!.\nJeśli osiągnie postęp #Y 100#!, stosowany jest normalny efekt ukończenia projektu. "

 ve_cul_evt.40.t:0 "Lokalne Rady Szkolne"
 ve_cul_evt.40.d:0 "Tablice szkolne w [SCOPE.sState('ve_evt_target_state').GetName] nie zgadzają się co do miejsca [SCOPE.sCulture('ve_evt_target_culture').GetName] język w nauczaniu publicznym. Nauczanie języków lokalnych pozwoliłoby zachować zaufanie, a jeden język administracyjny ułatwiłby kierowanie projektem krajowym."
 ve_cul_evt.40.f:0 "„Język wybrany na pierwszą lekcję często decyduje o tym, kto wierzy, że szkoła należy do niego.”"
 ve_cul_evt.40.a:0 "Chroń lokalny język."
 ve_cul_evt.40.a.tt:0 "Postęp projektów kulturalnych zmniejsza się o #N 4#!.\nSpójność narodowa wzrasta o #P 3#!."
 ve_cul_evt.40.b:0 "Narzucanie jednego języka administracyjnego."
 ve_cul_evt.40.b.tt:0 "Postęp Projektu Kulturalnego wzrasta o #P 5#!.\nSpójność narodowa spada o #N 2#!.\n#N 0,5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalna."
 ve_cul_evt.40.c:0 "Rozszerzaj sieć nauczycieli."
 ve_cul_evt.40.c.tt:0 "Wydaj #N 10#!  Mandatu kulturalnego.\nPostęp w projekcie kulturalnym wzrasta o #P 4#!.\nSpójność narodowa wzrasta o #P 2#!."

 ve_cul_evt.41.t:0 "Granice statystyczne"
 ve_cul_evt.41.d:0 "Badanie urzędników [SCOPE.sState('ve_evt_target_state').GetName] nie mogę się zgodzić, gdzie [SCOPE.sCulture('ve_evt_target_culture').GetName] wspólnota zaczyna się i kończy. Tożsamości lokalne nakładają się na język, dzielnicę i zwyczaje, ale projekt narodowy wymaga kategorii, które można policzyć i którymi można zarządzać."
 ve_cul_evt.41.f:0 "„Granica wytyczona dla spisu wkrótce obejmuje urzędników, budżety i obrońców.”"
 ve_cul_evt.41.a:0 "Zostaw miejsce na samoidentyfikację."
 ve_cul_evt.41.a.tt:0 "Postęp Projektu Kulturalnego zmniejsza się o #N 3#!.\nSpójność narodowa wzrasta o #P 3#!."
 ve_cul_evt.41.b:0 "Niech centrum określi granice."
 ve_cul_evt.41.b.tt:0 "Postęp Projektu Kulturalnego wzrasta o #P 6#!.\nSpójność narodowa spada o #N 3#!.\n#N 0,5%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_cul_evt.41.c:0 "Skorzystaj ze standardowego systemu rejestracji."
 ve_cul_evt.41.c.tt:0 "Wydaj #N 10#!  Mandatów Kulturalnych.\nPostęp Projektu Kulturalnego wzrasta o #P 5#!.\nSpójność narodowa wzrasta o #P 1#!."

 ve_cul_evt.42.t:0 "Projekt Narodowy w punkcie krytycznym"
 ve_cul_evt.42.d:0 "Projekt narodowy w [SCOPE.sState('ve_evt_target_state').GetName] bliżej upadku. Radykalne ruchy twierdzą, że rząd albo zdradził [SCOPE.sCulture('ve_evt_target_culture').GetName] społeczności lub poddał się jej, podczas gdy lokalne urzędy nie mają już pewności siebie, aby wymusić kolejny kompromis."
 ve_cul_evt.42.f:0 "„Osiedle zaatakowane zarówno jako przymus, jak i kapitulacja, może wkrótce w ogóle przestać być osadą”."
 ve_cul_evt.42.a:0 "Zakończ projekt."
 ve_cul_evt.42.a.tt:0 "Anuluj Projekt Kulturalny bez zwrotu Mandatu Kulturalnego.\nSpójność narodowa zmniejsza się o #N 5#!.\nNa #Y 2 lata#!: #N -50#! Biurokracja, #N -25#! Władza i #N -3%#! Sukces stanowienia prawa."
 ve_cul_evt.42.b:0 "Przenieś awaryjne zasoby lokalne."
 ve_cul_evt.42.b.tt:0 "Wydaj #N 25#!  Mandatu kulturalnego.\nPostęp projektu kulturalnego zmniejsza się o #N 5#!.\n#N 1%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykalny.\nProjekt jest kontynuowany."
 ve_cul_evt.42.c:0 "Kontynuuj program minimalny."
 ve_cul_evt.42.c.tt:0 "Postęp Projektu Kulturalnego zmniejsza się o #N 10#!.\nSpójność narodowa spada o #N 2#!.\nProjekt jest kontynuowany."
 ve_cul_evt.42.e:0 "Odbuduj ramy negocjacyjne."
 ve_cul_evt.42.e.tt:0 "Wydaj #N 15#! Mandatu Kulturalnego.\nPostęp Projektu Kulturalnego zmniejsza się o #N 3#!.\nSpójność narodowa wzrasta o #P 2#!.\n#N 0,5%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się Radykalny.\nProjekt jest kontynuowany."

 ve_cul_evt.50.t:0 "Dyrektywa w sprawie nazwisk i języków"
 ve_cul_evt.50.d:0 "Urzędnicy ds [SCOPE.sState('ve_evt_target_state').GetName] zaproponować ujednolicenie nazwisk i rejestrów publicznych w języku narodowym. Dyrektywa sprawi, że [SCOPE.sCulture('ve_evt_target_culture').GetName] administracji centralnej łatwiej ją sklasyfikować, ale rodziny obawiają się, że prywatna tożsamość stanie się przedmiotem dowodzenia państwa."
 ve_cul_evt.50.f:0 "„Imię i nazwisko zapisane w rejestrze w inny sposób może nadal być nazwiskiem, pod którym rodzina pamięta siebie.”"
 ve_cul_evt.50.a:0 "Sfinansuj stopniową kampanię rejestracyjną."
 ve_cul_evt.50.a.tt:0 "Wydaj #N 10#!  Mandat kulturalny.\nPostęp projektu kulturalnego wzrasta o #P 4#!.\nSpójność narodowa wzrasta o #P 1#!.\n#N 0,5%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_cul_evt.50.b:0 "Egzekwuj jeden standard krajowy."
 ve_cul_evt.50.b.tt:0 "Postęp projektu kulturalnego wzrasta o #P 7#!.\nSpójność narodowa zmniejsza się o #N 4#!.\n#N 1%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_cul_evt.50.c:0 "Wycofać dyrektywę do rewizji."
 ve_cul_evt.50.c.tt:0 "Postęp Projektu Kulturalnego zmniejsza się o #N 5#!.\nSpójność narodowa wzrasta o #P 3#!."

 ve_cul_evt.51.t:0 "Rejestry poboru"
 ve_cul_evt.51.d:0 "Urzędników wojskowych w [SCOPE.sState('ve_evt_target_state').GetName] żądać jednego rejestru obowiązków służbowych, nazwisk i poleceń. Zastosowanie go do [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja wzmocniłaby dążenie do integracji etnicznej, jednak rośnie opór wśród społeczności, które postrzegają armię jako kolejne narzędzie wymazywania kultury."
 ve_cul_evt.51.f:0 "„Państwo najpierw uczy się nazw wsi, gdy chce zebrać podatki lub wezwać swoich synów”."
 ve_cul_evt.51.a:0 "Zastosuj rejestry krajowe."
 ve_cul_evt.51.a.tt:0 "Postęp Projektu Kulturalnego wzrasta o #P 5#!.\nSpójność narodowa spada o #N 2#!.\n#N 0,5%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_cul_evt.51.b:0 "Zachowaj lokalne praktyki rejestracyjne."
 ve_cul_evt.51.b.tt:0 "Postęp Projektu Kulturalnego zmniejsza się o #N 3#!.\nSpójność narodowa wzrasta o #P 3#!."
 ve_cul_evt.51.c:0 "Integracja rejestrów poprzez służbę wojskową."
 ve_cul_evt.51.c.tt:0 "Wydaj #N 10#!  Mandat Kulturalny.\nPostęp Projektu Kulturalnego wzrasta o #P 6#!.\nSpójność narodowa wzrasta o #P 1#!.\n#N 0,5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."

 ve_cul_evt.100.t:0 "Delegacja Konstytucyjna"
 ve_cul_evt.100.d:0 "Delegacja z [SCOPE.sCulture('ve_evt_target_culture').GetName] społeczność w [SCOPE.sState('ve_evt_target_state').GetName] przybył z żądaniami reprezentacji w instytucjach Porozumienia Ustawodawczego. Negocjacje spowolniłyby projekt, ale wzmocniłyby jego legitymację; ugoda narzucona ze stolicy mogłaby przebiegać szybciej kosztem zaufania."
 ve_cul_evt.100.f:0 "„Umowa staje się powszechna tylko wtedy, gdy każdy ze stron może wskazać klauzulę, którą pomógł napisać”."
 ve_cul_evt.100.a:0 "Wynegocjuj ich miejsce w porozumieniu."
 ve_cul_evt.100.a.tt:0 "Postęp Projektu Kulturalnego zmniejsza się o #N 4#!.\nSpójność narodowa wzrasta o #P 4#!."
 ve_cul_evt.100.b:0 "Narzucaj centralne porozumienie."
 ve_cul_evt.100.b.tt:0 "Postęp Projektu Kulturalnego wzrasta o #P 5#!.\nSpójność narodowa spada o #N 2#!.\n#N 0,5%#! z [SCOPE.sCulture('ve_evt_target_culture').GetName] populacja w [SCOPE.sState('ve_evt_target_state').GetName] staje się radykalny."
 ve_cul_evt.100.c:0 "Wciągnij do rozmów koalicję parlamentarną."
 ve_cul_evt.100.c.tt:0 "Wydaj #N 10#! Mandatu Kulturalnego.\nPostęp Projektu Kulturalnego wzrasta o #P 4#!.\nSpójność narodowa wzrasta o #P 2#!."

 ve_cul_evt.101.t:0 "Podwójna administracja"
 ve_cul_evt.101.d:0 "Umowa konstytucyjna w [SCOPE.sState('ve_evt_target_state').GetName] obecnie zależy od dwóch nakładających się na siebie administracji. Urzędnicy centralni i przedstawiciele [SCOPE.sCulture('ve_evt_target_culture').GetName] społeczności duplikują rejestry, dyskutują o nominacjach i wydają sprzeczne instrukcje, podczas gdy biurokracja w kraju jest bliska wyczerpania."
 ve_cul_evt.101.f:0 "„Dwa biura mogą łatwiej dzielić się uprawnieniami niż wspólną szafkę na dokumenty”."
 ve_cul_evt.101.a:0 "Finansowanie wspólnego personelu administracyjnego."
 ve_cul_evt.101.a.tt:0 "Wydawać #N 15#! Mandat kulturalny.\nPostęp projektu kulturalnego wzrasta o #P 6#!."
 ve_cul_evt.101.b:0 "Zwolnij porozumienie, aż biura się zgodzą."
 ve_cul_evt.101.b.tt:0 "Postęp projektu kulturalnego zmniejsza się o #N 6#!.\nSpójność narodowa wzrasta o #P 2#!."
 ve_cul_evt.101.c:0 "Ujednolicenie urzędów w ramach służby cywilnej."
 ve_cul_evt.101.c.tt:0 "Wydaj #N 10#!  Mandatu Kulturalnego.\nPostęp Projektów Kulturalnych wzrasta o #P 5#!.\nSpójność narodowa wzrasta o #P 2#!."

 ve_cul_evt.150.t:0 "Realizacja w województwach"
 ve_cul_evt.150.d:0 "Władze prowincji donoszą, że ogólnokrajowy projekt kulturalny postępuje w radykalnie różnym tempie. Niektóre urzędy żądają finansowanych komisji wdrożeniowych, inne ostrzegają, że narzucanie jednolitego harmonogramu w każdym regionie pochłonie niedobory personelu i osłabi zaufanie społeczne."
 ve_cul_evt.150.f:0 "„Dekret ogólnokrajowy pisze się raz, ale należy go wdrożyć w każdym urzędzie w kraju”."
 ve_cul_evt.150.a:0 "Finansowanie prowizji wdrożeniowych."
 ve_cul_evt.150.a.tt:0 "Wydaj #N 10#! Mandat kulturalny.\nPostęp projektu kulturalnego wzrasta o #P 5#!."
 ve_cul_evt.150.b:0 "Zastosuj stopniowy harmonogram."
 ve_cul_evt.150.b.tt:0 "Postęp projektu kulturalnego zmniejsza się o #N 4#!.\nSpójność narodowa wzrasta o #P 2#!."
 ve_cul_evt.150.c:0 "Ustandaryzuj istniejącą administrację."
 ve_cul_evt.150.c.tt:0 "Wydaj #N 5#!  Mandat kulturalny.\nPostęp projektów kulturalnych wzrasta o #P 3#!.\nSpójność narodowa wzrasta o #P 2#!."

 ve_cul_evt.151.t:0 "Język wykładowy"
 ve_cul_evt.151.d:0 "Krajowy program nauczania wymaga wspólnego języka wykładowego, jednak szkoły w całym kraju służą społecznościom o bardzo różnych tradycjach językowych. Materiały wielojęzyczne pozwoliłyby zachować zaufanie, ale opóźniłyby dystrybucję, podczas gdy jednolity program nauczania mógłby szybko dotrzeć do klas, ryzykując przekształcenie edukacji w konkurs kulturalny."
 ve_cul_evt.151.f:0 "„Lekcja prowadzona w języku, któremu uczeń nie ufa, może zostać zapamiętana ze wszystkiego z wyjątkiem jej przedmiotu.”"
 ve_cul_evt.151.a:0 "Finansuj materiały wielojęzyczne."
 ve_cul_evt.151.a.tt:0 "Wydaj #N 10#! Mandat kulturalny.\nPostęp projektu kulturalnego wzrasta o #P 3#!.\nSpójność narodowa wzrasta o #P 3#!."
 ve_cul_evt.151.b:0 "Zastosuj jeden ogólnokrajowy program nauczania."
 ve_cul_evt.151.b.tt:0 "Postęp Projektu Kulturalnego wzrasta o #P 6#!.\nSpójność narodowa zmniejsza się o #N 3#!."
 ve_cul_evt.151.c:0 "Zjednocz sieci nauczania i opieki społecznej."
 ve_cul_evt.151.c.tt:0 "Wydaj #N 10#!  Mandat kulturalny.\nPostęp projektu kulturalnego wzrasta o #P 5#!.\nSpójność narodowa wzrasta o #P 2#!."

 ve_cul_evt.160.t:0 "Kto reprezentuje naród?"
 ve_cul_evt.160.d:0 "Projekt „Wspólne symbole” na nowo otworzył pytanie, czyja historia, mundury, pomniki i ceremonie mogą oznaczać cały kraj. Rotacyjne tradycje poszerzyłyby uznanie, ale spowolniłyby porozumienie; wybranie jednej oficjalnej narracji zapewniłoby przejrzystość, pozostawiając wielu obywateli poza nią."
 ve_cul_evt.160.f:0 "„Symbol staje się narodowy tylko wtedy, gdy obywatele widzą w nim siebie bez potrzeby wyjaśnień”."
 ve_cul_evt.160.a:0 "Obróć symbole w użytku publicznym."
 ve_cul_evt.160.a.tt:0 "Postęp projektu kulturalnego zmniejsza się o #N 3#!.\nSpójność narodowa wzrasta o #P 4#!."
 ve_cul_evt.160.b:0 "Wybierz jedną oficjalną narrację."
 ve_cul_evt.160.b.tt:0 "Postęp projektu kulturalnego wzrasta o #P 6#!.\nSpójność narodowa zmniejsza się o #N 3#!."
 ve_cul_evt.160.c:0 "Zaprojektuj wspólną publiczną ceremonię."
 ve_cul_evt.160.c.tt:0 "Wydaj #N 10#!  Mandatu Kulturalnego.\nPostęp projektu kulturalnego wzrasta o #P 4#!.\nSpójność narodowa wzrasta o #P 2#!."
