l_polish:
 ve_je_doctrine_journey_industrialist:0 "Standaryzacja systemu fabrycznego"
 ve_je_doctrine_journey_industrialist_reason:0 "Doktryna przemysłowa wykroczyła poza poszczególne zakłady. Fabrykanci, inspektorzy i administratorzy muszą teraz przekształcić lokalną praktykę w trwały system narodowy."
