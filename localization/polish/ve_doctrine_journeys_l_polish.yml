 ve_je_doctrine_journey_academic:0 "Republika uczonych"
 ve_je_doctrine_journey_academic_reason:0 "Uniwersytety i stowarzyszenia naukowe są gotowe stać się narodową wspólnotą badaczy, pod warunkiem, że ich instytucje i fundacje społeczne będą w stanie to utrzymać."
