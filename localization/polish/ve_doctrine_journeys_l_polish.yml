 ve_je_doctrine_journey_professional_army:0 "Reforma Sztabu Generalnego"
 ve_je_doctrine_journey_professional_army_reason:0 "Zawodowy korpus oficerski wymaga czegoś więcej niż koszar i komisji. Szkolenie, planowanie i mobilizacja muszą zostać zorganizowane w jeden trwały system kadrowy."
