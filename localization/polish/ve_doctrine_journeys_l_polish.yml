 ve_doctrine_journey_general_staff_reform_mdf:0 "Instytucjonalny Sztab Generalny"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Akademie sztabowe, tabele mobilizacyjne i wspólne standardy szkoleniowe stały się trwałą częścią sił zbrojnych."

 ve_doctrine_journey.1.t:0 "Standaryzacja systemu fabrycznego"
 ve_doctrine_journey.1.d:0 "Stowarzyszenia przemysłowe proponują wysiłek narodowy mający na celu dostosowanie maszyn, inspekcji i praktyk produkcyjnych. Przedsięwzięcie to potrwa pięć lat i będzie wymagało utrzymania odpowiedniej skali przemysłowej oraz stabilności administracyjnej."
 ve_doctrine_journey.1.a:0 "Rozpocznij wysiłek standaryzacyjny."
 ve_doctrine_journey.1.b:0 "Rozważ tę propozycję ponownie za pięć lat."
 ve_doctrine_journey.1.c:0 "Nasze fabryki nie potrzebują narodowej doktryny."
 ve_doctrine_journey.2.t:0 "Rzeczpospolita uczonych"
 ve_doctrine_journey.2.d:0 "Rektorzy i towarzystwa naukowe proponują pięcioletnie wysiłki mające na celu połączenie uniwersytetów w trwałą narodową wspólnotę badawczą. Jej sukces zależeć będzie zarówno od kompetencji akademickich, jak i szerzenia się piśmienności."
 ve_doctrine_journey.2.a:0 "Sponsoruj rzeczpospolitą uczonych."
 ve_doctrine_journey.2.b:0 "Powróć do tej propozycji za pięć lat."
 ve_doctrine_journey.2.c:0 "Nauka powinna pozostać zorganizowana lokalnie."
 ve_doctrine_journey.3.t:0 "Reformowanie Sztabu Generalnego"
 ve_doctrine_journey.3.d:0 "Wysocy rangą oficerowie proponują pięcioletnią reformę szkolenia, planowania i mobilizacji. Sztab generalny będzie musiał udowodnić, że doktryna profesjonalna może przetrwać poza kręgiem faworyzowanych dowódców."
 ve_doctrine_journey.3.a:0 "Zleć reformę sztabu generalnego."
 ve_doctrine_journey.3.b:0 "Przeanalizuj plany ponownie za pięć lat."
 ve_doctrine_journey.3.c:0 "Istniejący system dowodzenia jest w zupełności wystarczający."

 ve_doctrine_journey_start_tt:0 "Rozpoczyna ten pięcioletni Pochód doktryny. W tym samym czasie może być aktywny tylko jeden Pochód doktryny."
 ve_doctrine_journey_defer_tt:0 "Odprasza ofertę tej grupy o #Y 5 lat#!. Może ona zostać zaproponowana ponownie w przyszłości."
 ve_doctrine_journey_decline_tt:0 "Odrzuca bezpowrotnie Pochód doktryny tej grupy."

 ve_doctrine_journey.10.t:0 "Miary i tolerancje"
 ve_doctrine_journey.10.d:0 "Fabryki posługują się niekompatybilnymi miarami, złączami i tolerancjami. Inżynierowie nalegają, aby państwo narzuciło jeden katalog, podczas gdy producenci prowincjonalni ostrzegają, że sztywny standard może zablokować pożyteczną lokalną praktykę."
 ve_doctrine_journey.10.a:0 "Sfinansować krajowy katalog standardów."
 ve_doctrine_journey.10.a.tt:0 "Wydajesz #N 15#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."
 ve_doctrine_journey.10.b:0 "Zezwolić na kompatybilne standardy regionalne."
 ve_doctrine_journey.10.b.tt:0 "Wyprawa trwa dalej bez natychmiastowej zmiany zasobów lub postępu."
 ve_doctrine_journey.10.c:0 "Wykorzystać urzędy budowlane do koordynacji wdrażania."
 ve_doctrine_journey.10.c.tt:0 "Wymaga Doktryny industrialistów V.\nWydajesz #N 10#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."
 ve_doctrine_journey.11.t:0 "Krajowy Inspektorat"
 ve_doctrine_journey.11.d:0 "Pierwsze wspólne standardy wymagają obecnie egzekwowania. Urzędnicy proponują centralny inspektorat, producenci wolą samocertyfikację, a doświadczeni planiści przemysłowi argumentują za audytowaniem obu."
 ve_doctrine_journey.11.a:0 "Utworzyć centralny inspektorat przemysłowy."
 ve_doctrine_journey.11.a.tt:0 "Wydajesz #N 15#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."
 ve_doctrine_journey.11.b:0 "Uznać samocertyfikację przemysłu."
 ve_doctrine_journey.11.b.tt:0 "Wyprawa trwa dalej bez natychmiastowej zmiany zasobów lub postępu."
 ve_doctrine_journey.11.c:0 "Przeprowadzać audyty inspektorów i producentów w ramach jednego systemu."
 ve_doctrine_journey.11.c.tt:0 "Wymaga Doktryny industrialistów VII.\nWydajesz #N 10#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."

 ve_doctrine_journey.20.t:0 "Otwarte Katedry"
 ve_doctrine_journey.20.d:0 "Uniwersytety spierają się o to, czy nowe katedry powinny podlegać lokalnym wydziałom, priorytetom krajowym, czy publicznej dyrektywie nauczania. Pierwsze mianowania zdefiniują, jak swobodnie sieć akademicka wymienia ludzi i idee."
 ve_doctrine_journey.20.a:0 "Sfinansować skoordynowany krajowy program katedr."
 ve_doctrine_journey.20.a.tt:0 "Wydajesz #N 15#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."
 ve_doctrine_journey.20.b:0 "Pozwolić każdemu wydziałowi na określenie własnych katedr."
 ve_doctrine_journey.20.b.tt:0 "Wyprawa trwa dalej bez natychmiastowej zmiany zasobów lub postępu."
 ve_doctrine_journey.20.c:0 "Powiązać katedry z publiczną siecią wykładów."
 ve_doctrine_journey.20.c.tt:0 "Wymaga Akademizmu V.\nWydajesz #N 10#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."
 ve_doctrine_journey.21.t:0 "Republika Arbiterów"
 ve_doctrine_journey.21.d:0 "Badania przemieszczają się obecnie między instytucjami szybciej, niż dawny patronat jest w stanie je ocenić. Uczoni proponują krajową recenzję naukową, podczas gdy ugruntowane akademie bronią selektywnych zaproszeń i niezależności dyscyplinarnej."
 ve_doctrine_journey.21.a:0 "Sfinansować krajową usługę recenzji naukowej."
 ve_doctrine_journey.21.a.tt:0 "Wydajesz #N 15#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."
 ve_doctrine_journey.21.b:0 "Pozostawić recenzje towarzystwom naukowym."
 ve_doctrine_journey.21.b.tt:0 "Wyprawa trwa dalej bez natychmiastowej zmiany zasobów lub postępu."
 ve_doctrine_journey.21.c:0 "Zwołać międzydyscyplinarne rady recenzyjne."
 ve_doctrine_journey.21.c.tt:0 "Wymaga Akademizmu VII.\nWydajesz #N 10#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."

 ve_doctrine_journey.30.t:0 "Akademia Sztabowa"
 ve_doctrine_journey.30.d:0 "Nowa akademia sztabowa musi zdecydować, co czyni oficera zdolnym do dowodzenia. Reformator Miejscy domagają się egzaminów i wspólnego nauczania, podczas gdy ugruntowani dowódcy bronić starszeństwa i osądu zdobytego w służbie polowej."
 ve_doctrine_journey.30.a:0 "Sfinansować egzaminy krajowe i wspólny program nauczania."
 ve_doctrine_journey.30.a.tt:0 "Wydajesz #N 15#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."
 ve_doctrine_journey.30.b:0 "Zrównoważyć starszeństwo z rekomendacjami akademii."
 ve_doctrine_journey.30.b.tt:0 "Wyprawa trwa dalej bez natychmiastowej zmiany zasobów lub postępu."
 ve_doctrine_journey.30.c:0 "Rotować oficerów polowych przez sale wykładowe sztabu."
 ve_doctrine_journey.30.c.tt:0 "Wymaga Armii zawodowej V.\nWydajesz #N 10#! Rozpoznanie narodowe.\nPostęp wyprawy rośnie o #P 4#!."
 ve_doctrine_journey.31.t:0 "Tabele mobilizacyjne"
 ve_doctrine_journey.31.d:0 "Planiści sporządzili konkurujące ze sobą harmonogramy dla ludzi, zaopatrzenia i transportu kolejowego. Jedna ogólnokrajowa tabela obiecuje koordynację, lecz dowództwa regionalne ostrzegają, że sztywne rozkłady zignorują lokalną kompetencję."
 ve_doctrine_journey.31.a:0 "Sfinansować centralne biuro mobilizacyjne."
 ve_doctrine_journey.31.a.tt:0 "Wydaj #N 15#! Rozpoznanie narodowe.\nPostęp podróży wzrasta o #P 4#!."
 ve_doctrine_journey.31.b:0 "Pozwolić dowództwom regionalnym utrzymać zgodne harmonogramy."
 ve_doctrine_journey.31.b.tt:0 "Podróż trwa nadal bez natychmiastowej zmiany zasobów lub postępu."
 ve_doctrine_journey.31.c:0 "Wcielić planowanie kolei, składów i dowództwa."
 ve_doctrine_journey.31.c.tt:0 "Wymaga doktryny Armia zawodowa VII.\nWydaj #N 10#! Rozpoznanie narodowe.\nPostęp podróży wzrasta o #P 4#!."
