 ve_je_doctrine_journey_professional_army:0 "Reformowanie Sztabu Generalnego"
 ve_je_doctrine_journey_professional_army_reason:0 "Profesjonalny korpus oficerski wymaga czegoś więcej niż tylko koszar i patentów. Wyszkolenie, planowanie i mobilizacja muszą zostać zorganizowane w jeden trwały system sztabowy."
