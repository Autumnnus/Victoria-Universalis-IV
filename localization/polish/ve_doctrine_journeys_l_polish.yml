 ve_doctrine_journey_general_staff_reform_mdf:0 "Instytucjonalny Sztab Generalny"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Kolegia sztabowe, stoły mobilizacyjne i wspólne standardy szkolenia stały się trwałą częścią sił zbrojnych."

 ve_doctrine_journey.1.t:0 "Standaryzacja systemu fabrycznego"
 ve_doctrine_journey.1.d:0 "Stowarzyszenia przemysłowe proponują podjęcie na szczeblu krajowym wysiłków na rzecz ujednolicenia maszyn, inspekcji i praktyk produkcyjnych. Przedsięwzięcie miało trwać pięć lat i wymagać utrzymania skali przemysłowej i stabilności administracyjnej."
 ve_doctrine_journey.1.a:0 "Rozpocznij wysiłki normalizacyjne."
 ve_doctrine_journey.1.b:0 "Rozważ tę propozycję ponownie za pięć lat."
 ve_doctrine_journey.1.c:0 "Nasze fabryki nie potrzebują doktryny narodowej."
 ve_doctrine_journey.2.t:0 "Republika uczonych"
 ve_doctrine_journey.2.d:0 "Rektorzy i towarzystwa naukowe proponują pięcioletnie wysiłki mające na celu połączenie uniwersytetów w trwałą narodową wspólnotę badawczą. Jego powodzenie będzie zależało zarówno od potencjału akademickiego, jak i od rozpowszechnienia umiejętności czytania i pisania."
 ve_doctrine_journey.2.a:0 "Sponsoruj republikę uczonych."
 ve_doctrine_journey.2.b:0 "Powrót do wniosku za pięć lat."
 ve_doctrine_journey.2.c:0 "Nauka powinna pozostać zorganizowana lokalnie."
 ve_doctrine_journey.3.t:0 "Reforma Sztabu Generalnego"
 ve_doctrine_journey.3.d:0 "Starsi oficerowie proponują pięcioletnią reformę szkolenia, planowania i mobilizacji. Sztab generalny musiałby udowodnić, że profesjonalna doktryna może przetrwać poza kręgiem faworyzowanych dowódców."
 ve_doctrine_journey.3.a:0 "Komisji reformę sztabu generalnego."
 ve_doctrine_journey.3.b:0 "Przejrzyj plany ponownie za pięć lat."
 ve_doctrine_journey.3.c:0 "Istniejący system dowodzenia jest wystarczający."

 ve_doctrine_journey_start_tt:0 "Rozpoczyna pięcioletnią podróż doktrynalną. W danym momencie może być aktywna tylko jedna Podróż Doktryny."
 ve_doctrine_journey_defer_tt:0 "Odracza ofertę tej grupy o #Y 5 lat#!. Może zostać ponownie zaoferowana później."
 ve_doctrine_journey_decline_tt:0 "Trwale odrzuca podróż doktrynalną tej grupy."

 ve_doctrine_journey.10.t:0 "Miary i tolerancje"
 ve_doctrine_journey.10.d:0 "Fabryki stosują niezgodne mierniki, złączki i tolerancje. Inżynierowie wzywają państwo do narzucenia jednego katalogu, natomiast prowincjonalni producenci ostrzegają, że sztywne standardy mogą zamrozić użyteczną lokalną praktykę."
 ve_doctrine_journey.10.a:0 "Ufundować krajowy katalog norm."
 ve_doctrine_journey.10.a.tt:0 "Wydawać #N 15#! National Insight.\nPostęp podróży wzrasta o #P 4#!."
 ve_doctrine_journey.10.b:0 "Pozwól na zgodne standardy regionalne."
 ve_doctrine_journey.10.b.tt:0 "Podróż trwa bez natychmiastowych zmian w zasobach lub postępie."
 ve_doctrine_journey.10.c:0 "Koordynuj przyjęcie za pomocą biur konstrukcyjnych."
 ve_doctrine_journey.10.c.tt:0 "Wymaga Pomysłu Przemysłowca V.\nWydaj #N 10#! Wnikliwości Narodowej.\nPostęp podróży zwiększa się o #P 4#!."
 ve_doctrine_journey.11.t:0 "Krajowy Inspektorat"
 ve_doctrine_journey.11.d:0 "Pierwsze wspólne standardy wymagają obecnie egzekwowania. Urzędnicy proponują utworzenie centralnego inspektoratu, producenci wolą samocertyfikację, a doświadczeni planiści przemysłowi opowiadają się za audytem obu."
 ve_doctrine_journey.11.a:0 "Utworzenie centralnego inspektoratu przemysłowego."
 ve_doctrine_journey.11.a.tt:0 "Wydawać #N 15#! National Insight.\nPostęp podróży wzrasta o #P 4#!."
 ve_doctrine_journey.11.b:0 "Rozpoznawanie samocertyfikacji w branży."
 ve_doctrine_journey.11.b.tt:0 "Podróż trwa bez natychmiastowych zmian w zasobach lub postępie."
 ve_doctrine_journey.11.c:0 "Inspektorzy audytu i producenci za pośrednictwem jednego systemu."
 ve_doctrine_journey.11.c.tt:0 "Wymaga Idei Przemysłowej VII.\nWydaj #N 10#! Wnikliwość narodową.\nPostęp podróży zwiększa się o #P 4#!."

 ve_doctrine_journey.20.t:0 "Otwarte katedry"
 ve_doctrine_journey.20.d:0 "Uniwersytety nie są zgodne co do tego, czy nowe katedry powinny odpowiadać lokalnym wydziałom, priorytetom krajowym czy mandatowi nauczania publicznego. Pierwsze nominacje określą, jak swobodnie sieć naukowa wymienia ludzi i pomysły."
 ve_doctrine_journey.20.a:0 "Ufunduj skoordynowany program krajowych katedr."
 ve_doctrine_journey.20.a.tt:0 "Wydaj #N 15#! National Insight.\nPostęp w podróży wzrasta o #P 4#!."
 ve_doctrine_journey.20.b:0 "Niech każdy wydział zdefiniuje własne katedry."
 ve_doctrine_journey.20.b.tt:0 "Podróż trwa bez natychmiastowych zmian w zasobach lub postępie."
 ve_doctrine_journey.20.c:0 "Połącz krzesła z siecią wykładów publicznych."
 ve_doctrine_journey.20.c.tt:0 "Wymaga pomysłu akademickiego V.\nWydaj #N 10#! Przenikliwości narodowej.\nPostęp podróży wzrasta o #P 4#!."
 ve_doctrine_journey.21.t:0 "Republika sędziów"
 ve_doctrine_journey.21.d:0 "Badania przemieszczają się teraz między instytucjami szybciej, niż może to ocenić stary patronat. Uczeni proponują ogólnokrajową ocenę wzajemną, podczas gdy uznane akademie bronią selektywnego zapraszania i niezależności dyscyplinarnej."
 ve_doctrine_journey.21.a:0 "Finansowanie krajowego serwisu recenzowania."
 ve_doctrine_journey.21.a.tt:0 "Wydawać #N 15#! Spostrzeżenie narodowe.\nPostęp podróży wzrasta o #P 4#!."
 ve_doctrine_journey.21.b:0 "Zostaw ocenę towarzystwom naukowym."
 ve_doctrine_journey.21.b.tt:0 "Podróż trwa bez natychmiastowych zmian w zasobach i postępie."
 ve_doctrine_journey.21.c:0 "Zwołaj interdyscyplinarne rady ds. przeglądu."
 ve_doctrine_journey.21.c.tt:0 "Wymaga VII Pomysłu Akademickiego.\nWydaj #N 10#! Wnikliwości Narodowej.\nPostęp podróży wzrasta o #P 4#!."

 ve_doctrine_journey.30.t:0 "Kolegium Sztabowe"
 ve_doctrine_journey.30.d:0 "Nowe kolegium sztabowe musi zdecydować, co czyni oficera zdolnym do pełnienia dowództwa. Reformatorzy żądają egzaminów i wspólnego nauczania, podczas gdy uznani dowódcy bronią starszeństwa i osądu zdobytego w służbie polowej."
 ve_doctrine_journey.30.a:0 "Finansowanie egzaminów ogólnokrajowych i wspólnego programu nauczania."
 ve_doctrine_journey.30.a.tt:0 "Wydaj #N 15#! National Insight.\nPostęp podróży wzrasta o #P 4#!."
 ve_doctrine_journey.30.b:0 "Zrównoważ staż pracy z zaleceniami uczelni."
 ve_doctrine_journey.30.b.tt:0 "Podróż trwa bez natychmiastowych zmian w zasobach lub postępie."
 ve_doctrine_journey.30.c:0 "Zmieniaj oficerów terenowych w salach personelu."
 ve_doctrine_journey.30.c.tt:0 "Wymaga pomysłu na armię zawodową V.\nWydaj #N 10#! Wnikliwości narodowej.\nPostęp podróży zwiększa się o #P 4#!."
 ve_doctrine_journey.31.t:0 "Tabele mobilizacyjne"
 ve_doctrine_journey.31.d:0 "Planiści przygotowali konkurencyjne harmonogramy dla ludzi, zaopatrzenia i transportu kolejowego. Pojedynczy stół krajowy zapewnia koordynację, ale dowództwa regionalne ostrzegają, że sztywne harmonogramy będą ignorować lokalne możliwości."
 ve_doctrine_journey.31.a:0 "Finansowanie centralnego biura mobilizacji."
 ve_doctrine_journey.31.a.tt:0 "Wydawać #N 15#! National Insight.\nPostęp podróży wzrasta o #P 4#!."
 ve_doctrine_journey.31.b:0 "Niech regionalne dowództwa utrzymują zgodne harmonogramy."
 ve_doctrine_journey.31.b.tt:0 "Podróż trwa bez natychmiastowych zmian w zasobach lub postępie."
 ve_doctrine_journey.31.c:0 "Zintegruj planowanie kolei, zajezdni i dowodzenia."
 ve_doctrine_journey.31.c.tt:0 "Wymaga VII idei armii zawodowej.\nWydaj #N 10#! Przenikliwość narodowa.\nPostęp podróży wzrasta o #P 4#!."
