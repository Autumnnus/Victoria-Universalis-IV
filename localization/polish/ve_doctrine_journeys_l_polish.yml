l_polish:
 ve_je_doctrine_journey_industrialist:0 "Standaryzacja systemu fabrycznego"
 ve_je_doctrine_journey_industrialist_reason:0 "Doktryna przemysłowa rozprzestrzeniła się poza pojedyncze młyny. Producenci, inspektorzy i administratorzy muszą teraz przekształcić lokalną praktykę w trwały system krajowy."
 ve_je_doctrine_journey_industrialist_status_both:0 "Postęp: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nPozostały czas: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] miesiące#!\nMiesięczny postęp: #P +2#!\n\n#P Spełniona skala produkcji#!: co najmniej #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! poziom budynku produkcyjnego.\n#P Spełniona stabilna administracja#!: nieujemna Biurokracja, brak zbliżających się niedoborów i mniej niż 15% zamieszania w kraju.\n\nNagroda za sukces: #P +40 Wnikliwości Krajowej#!. Jeśli Postęp nie osiągnie 60 w ciągu 60 miesięcy, Podróż kończy się bez nagrody."
