 ve_religious_project_unavailable_short:0 "Model neutralny celowo nie posiada kampanii religijnej. Ustanów inne Prawo dotyczące stosunków państwa z kościołem, jeśli jej pragniesz."
 ve_religious_project_unavailable_desc:0 "#header Brak dostępnego projektu#!\nCałkowity podział to w pełni neutralny model i nie może rozpocząć docelowego Projektu wyznaniowego.\n\nPaństwo wyznaniowe, Wolność sumienia i Ateizm państwowy prowadzą własne projekty. Ustanów odpowiadające im Prawo dotyczące stosunków państwa z kościołem, aby je uzyskać."

