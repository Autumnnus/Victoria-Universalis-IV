 ve_confessional_conversion_desc:0 "#header Nawrócenie wyznania#!\nProwadź w jednym stanie, w którym udział twojej religii jest poniżej #Y 90%#!.\n\n#Y Koszt#!\n#Y 125 Reformy pobożności#!, płatne natychmiastowo\n\n#Y Podczas trwania#!\n#N -50 Biurokracja, -25 Władza#! dla kraju\n#N +20% Konwersja i +20% kanały radykalizmu#! w docelowym państwie\n\n#Y Po zakończeniu#!\nNawraca #Y 5%#! populacji stanu na religię państwową lub #Y 7%#! w przypadku nacjonalistycznej VII\n#P +20 Reforma pobożności, +5 religijność Osada#!\n\n#Y Ostrzeżenie#!\n#N Konwersja tworzy rodniki w stanie docelowym.#!"
 ve_freedom_outreach_name:0 "Dotarcie do wolności"
 ve_freedom_outreach_cost:0 "Koszt: #Y 100 Reforma Pobożności#!"
 ve_freedom_outreach_short:0 "Zdobądź jeden stan bez zmuszania do konwersji.\n#P +20 Reformy Pobożności, +7 Osada#! po ukończeniu plus lojaliści."
 ve_freedom_outreach_desc:0 "#header Akcja Freedom Outreach#!\nProwadź w jednym stanie, którego udział w twojej własnej religii jest równy poniżej #Y 90%#!.\n\n#Y Koszt#!\n#Y 100 Reformy Pobożności#!, płatne natychmiast\n\n#Y W trakcie działania#!\n#N -50 Biurokracja, -25 Władza#! dla kraju\n\n#Y Po ukończeniu#!\n#P Brak przymusowej konwersji#!  – zamiast tego lojaliści w państwie docelowym\n#P +20 Reforma pobożności, +7 Osadnictwo religijne#!"
 ve_secularization_campaign_name:0 "Kampania sekularyzacyjna"
 ve_secularization_campaign_cost:0 "Koszt: #Y 150 Reforma pobożności#!"
 ve_secularization_campaign_short:0 "Nawróć jedno państwo na ateizm.\n#P +25 Reforma pobożności, +8 Osadnictwo#! po zakończeniu - ale tworzy radykałów."
 ve_secularization_campaign_desc:0 "#header Kampania sekularyzacyjna#!\nProwadź w jednym stanie, którego udział w twojej własnej religii wynosi poniżej #Y 90%#!.\n\n#Y Koszt#!\n#Y 150 Reformy Pobożności#!, płatne natychmiast\n\n#Y W trakcie działania#!\n#N -50 biurokracji, -25 władz#! dla kraju\n#N +20% konwersji i +20% kanałów radykalizmu#! w państwie docelowym\n\n#Y Wł zakończenie#!\nNawraca #Y 5%#! populacji państwa na ateizm, lub #Y 7%#! z nacjonalistyczną VII\n#P +25 Reformą pobożności, +8 Osadnictwo religijne#!\n\n#Y Ostrzeżenie#!\n#N Nawrócenie tworzy radykałów w państwie docelowym.#!"
