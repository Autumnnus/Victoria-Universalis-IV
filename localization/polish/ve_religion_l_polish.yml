l_polish:
 ve_piety:0 "Pobożność"
 ve_piety_reform:0 "Reforma pobożności"
 ve_piety_reform_tt:0 "#header Reforma pobożności#!\nObecna: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nDochód miesięczny: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Podział miesięczny#!\nPodstawa: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLegitymizacja: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nPobożne wsparcie: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nPomysł doktryna: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Doktryna idei — liczy się tylko Twój aktualny model religijny#!\n#P Państwo wyznaniowe / Ateizm państwowy#!: Nacjonalista V #P +1#!\n#P Wolność sumienia / Całkowita separacja#!: Reformista V #P +1#!\nPowyższa aktywna suma jest ograniczona do #Y +1#!, więc te dwie ścieżki nie mogą się kumulować.\n\nWydawane na Doktryny i programy (#Y 25#! każda) oraz na Celowy projekt religijny (#Y 100-150#!, w zależności od modelu). Dochody spowalniają przeszłość #Y 400#! i zatrzymuje się na #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doktryny i programy"
 ve_piety_tt:0 "#header Osadnictwo religijne#!\nStan obecny: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nRównowaga społeczna: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nRuch miesięczny: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Załamanie równowagi#!\nModel rozliczeniowy: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nWsparcie modelu: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitymizacja, administracja i stabilność: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nLicznik przesuwa się #Y 20%#! w stronę równowagi co miesiąc, ograniczając się do #Y ±5#!.\nPrzy #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nPrzy #N 25#! lub poniżej: #N -5 legitymizacji i -5% sukcesu w zakresie stanowienia prawa#!.\n\nTen licznik nie płaci już za programy – zobacz Reforma pobożności. Programy wymagają co najmniej #Y 25#! Reformy pobożności, koszt #Y 25#! i narzucają #Y 24-miesięczne#! obciążenie wdrożeniowe.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Projekt religijny"
 ve_religious_project_progress_tt:0 "#header Ukierunkowany projekt religijny#!\nPostęp: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nPostęp miesięczny: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (minimum 1, maksymalnie 7)\n\n#Y Podział miesięczny#!\nPodstawa: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLegitymizacja: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nWsparcie modelu: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nRozliczenie: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nReligia Ruchy: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nZamęt w państwie docelowym: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nGrupy idei: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Grupy idei — aktywne są tylko bonusy odpowiadające Twojemu aktualnemu modelowi religijnemu#!\n#P Stan wyznaniowy#!: Nacjonalista VII #P +1#!\n#P Wolność sumienia#!: Reformator VII #P +1#!\n#P Ateizm państwowy#!: nacjonalistyczny VII #P +1#!  i akademicki VII #P +1#!\nPowyższa suma aktywnych grup idei jest ograniczona do #Y +2#!.\n\nRozpocznij jedną z panelu posiadanego stanu. Ateizm wyznaniowy i państwowy konwertuje #Y 5%#! populacji stanu docelowego po ukończeniu, czyli #Y 7%#! z Nacjonalistą VII i dodaj radykałów. Zamiast tego Wolność Sumienia dodaje lojalistów bez zmuszania do konwersji. Total Separation nie może rozpocząć projektu - jest to model w pełni neutralny.\n\n$ve_religious_project_hint$"
