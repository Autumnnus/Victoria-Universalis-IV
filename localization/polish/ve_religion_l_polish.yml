 ve_confessional_conversion_name:0 "Konwersja konfesyjna"
 ve_confessional_conversion_cost:0 "Koszt: #Y 125 Fundusz religijny#!"
 ve_confessional_conversion_short:0 "Nawróć jeden obszar administracyjny na religię państwową.\n#P +20 Fundusz religijny, +5 Ugoda wyznaniowa#! po ukończeniu – ale tworzy to radykałów."
 ve_confessional_conversion_desc:0 "#header Konwersja konfesyjna#!\nProwadzone w pojedynczym obszarze administracyjnym, w którym udział twojej religii wynosi poniżej #Y 90%#!.\n\n#Y Koszt#!\n#Y 125 Fundusz religijny#!, opłacany natychmiastowo\n\n#Y Podczas trwania#!\n#N -50 Biurokracja, -25 Zwierzchnictwo#! dla kraju\n#N +20% Nawrócenie oraz +20% do przyrostu radykalizmu#! w docelowym obszarze administracyjnym\n\n#Y Po ukończeniu#!\nNawraca #Y 5%#! populacji obszaru administracyjnego na twoją religię państwową lub #Y 7%#! z nacjonalizmem VII\n#P +20 Fundusz religijny, +5 Ugoda wyznaniowa#!\n\n#Y Ostrzeżenie#!\n#N Nawrócenie tworzy radykałów w docelowym obszarze administracyjnym.#!"
 ve_freedom_outreach_name:0 "Działalność misyjna"
 ve_freedom_outreach_cost:0 "Koszt: #Y 100 Fundusz religijny#!"
 ve_freedom_outreach_short:0 "Zyskaj przychylność jednego obszaru administracyjnego bez wymuszania nawrócenia.\n#P +20 Fundusz religijny, +7 Ugoda wyznaniowa#! po ukończeniu oraz lojaliści."
 ve_freedom_outreach_desc:0 "#header Działalność misyjna#!\nPrzeprowadź w pojedynczym Obszarze administracyjnym, którego odsetek wyznawców Twojej religii wynosi poniżej #Y 90%#!.\n\n#Y Koszt#!\n#Y 100 Fundusz religijny#!, płatne natychmiast\n\n#Y Podczas działania#!\n#N -50 Biurokracja, -25 Zwierzchnictwo#! dla kraju\n\n#Y Po ukończeniu#!\n#P Brak przymusowego nawrócenia#! – zamiast tego lojaliści w docelowym Obszarze administracyjnym\n#P +20 Fundusz religijny, +7 Ugoda wyznaniowa#!"
 ve_secularization_campaign_name:0 "Kampania sekularyzacyjna"
 ve_secularization_campaign_cost:0 "Koszt: #Y 150 Fundusz religijny#!"
 ve_secularization_campaign_short:0 "Nawróć jeden Obszar administracyjny na ateizm.\n#P +25 Fundusz religijny, +8 Ugoda wyznaniowa#! po ukończeniu – lecz tworzy radykalizację."
 ve_secularization_campaign_desc:0 "#header Kampania sekularyzacyjna#!\nPrzeprowadź w pojedynczym Obszarze administracyjnym, którego odsetek wyznawców Twojej religii wynosi poniżej #Y 90%#!.\n\n#Y Koszt#!\n#Y 150 Fundusz religijny#!, płatne natychmiast\n\n#Y Podczas działania#!\n#N -50 Biurokracja, -25 Zwierzchnictwo#! dla kraju\n#N +20% Nawrócenie i +20% przyrost radykalizmu#! w docelowym Obszarze administracyjnym\n\n#Y Po ukończeniu#!\nNawraca #Y 5%#! populacji Obszaru administracyjnego na ateizm lub #Y 7%#! z Nacjonalizm VII\n#P +25 Fundusz religijny, +8 Ugoda wyznaniowa#!\n\n#Y Ostrzeżenie#!\n#N Nawrócenie tworzy radykałów w docelowym Obszarze administracyjnym.#!"
