 ve_religious_project_unavailable_desc:0 "#header Brak dostępnych projektów#!\nCałkowita separacja jest modelem w pełni neutralnym i nie może rozpoczynać ukierunkowanego projektu religijnego.\n\nPaństwo wyznaniowe, Wolność sumienia i Ateizm państwowy realizują swoje własne projekty. Wprowadź pasujące prawo kościelne i stanowe, aby je uzyskać."

