 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Religia państwowa"
 ve_settlement_tier_high:0 "UZGODNIONA – [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "KONSTRUKOWANA – #N -5 Legitymacja i -5% Sukces w stanowieniu prawa#!."
 ve_settlement_hint:0 "Zmierza w kierunku równowagi, którą wytwarza Twój Model Religijny. Przy 75+ zyskujesz premię, przy 25 lub mniej niestabilności."
 ve_piety_reform_hint:0 "Wydane na programy (po 25 szt.) i projekty religijne. Oszczędzanie jest bezpieczne, ale dochód zmniejsza się o połowę przy 400 i zatrzymuje się na 500."
 ve_religious_project_hint:0 "Fakultatywny. Rozpocząłeś w jednym z twoich własnych stanów, jeśli twój model religijny na to pozwala."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Modele religijne"
 ve_religious_models_help:0 "Twój model religijny jest ustalany przez ciebie #Y Kościół i państwo#! prawo i jest #P już aktywny#! - tu nie ma co wybierać. Model decyduje tylko w jaki sposób #Y Osada religijna#! zarabiasz, które osiem Programów możesz przyjąć i jaki Projekt Religijny możesz prowadzić.\n#Y Zmiana prawa jest opcjonalna:#! resetuje Osadę do #Y 35#!, usuwa każdy przyjęty Program, anuluje działający Projekt Religijny i nakłada #Y 3-5-letni#! Kryzys rozliczeniowy.\n#Y Najedź kursorem na dowolną kartę lub licznik, aby zobaczyć pełne efekty.#!"
 ve_religious_model_active_footer:0 "Aktualny model"
 ve_confessional_state_short:0 "Kościół i państwo rządzą wspólnie.\nPochodzi osadnictwo #Y Pobożna aprobata i wpływ#!."
 ve_freedom_state_short:0 "Każda wiara jest tolerowana w jednym państwie.\nPochodzi osadnictwo #Y spokojny, dobrze zarządzany kraj#!."
 ve_separation_state_short:0 "Państwo nie zajmuje żadnego stanowiska religijnego.\nOsadnictwo zaczyna się od góry i przynosi nagrody #Y niskie zamieszanie#!."
 ve_atheism_state_short:0 "Aktywna, kierowana przez państwo sekularyzacja.\nOsadnictwo wynika z #Y piśmienności i inteligencji#!."
 ve_confessional_state_unlocks:0 "Uruchamia #Y Nawrócenie konfesyjne#! projekt"
 ve_freedom_state_unlocks:0 "Uruchamia #Y Dotarcie do wolności#! projekt"
 ve_separation_state_unlocks:0 "#N Nie można prowadzić projektu religijnego#!"
 ve_atheism_state_unlocks:0 "Uruchamia #Y Kampania sekularyzacyjna#! projekt"
 ve_confessional_state_desc:0 "#header Państwo wyznaniowe#!\nKościół i państwo rządzą razem.\n\n#Y Podczas aktywności#!\n#P +5% władzy, +10% nawrócenia, +10% pobożnej siły politycznej#!\n#N -3% przyciągania migracyjnego, +5% radykałów z otwartych uprzedzeń#!\nPlus jeden mały pakiet dla rodziny wyznającej twoją religię państwową (chrześcijańską, islamską, żydowską, dharmiczną, naukową lub animistyczną).\n\n#Y Osiedlenie#!\nRównowaga podstawowa #Y 55#!. Pobożna aprobata i wpływ poruszają go najbardziej.\n\n#Y Przy 75. Osiedlu#!\n#P +5% Autorytetu, +5 Legitymizacji#!\n\n#Y Projekt religijny#!\nNawrócenie wyznaniowe"
 ve_freedom_state_desc:0 "#header Wolność sumienia#!\nKażda wiara jest tolerowana w jednym państwie.\n\n#Y Podczas aktywności#!\n#P +5% Przyciąganie migracyjne, -5% radykałów z otwartego uprzedzenia#!\n#N -15% konwersji, -25 Biurokracja#!\n\n#Y Osadnictwo#!\nRównowaga podstawowa #Y 55#!. Podnoszą to niewielkie zamieszanie, legitymizacja i zdrowa administracja.\n\n#Y W wieku 75 lat#!\n#P +5% Przyciąganie migracyjne, +5 Legitymacja#!\n\n#Y Projekt religijny#!\nDocieranie do wolności"
 ve_separation_state_desc:0 "#header Całkowita separacja#!\nModel neutralny: państwo nie zajmuje stanowiska religijnego.\n\n#Y Podczas aktywności#!\n#P +8% Przyciąganie migracyjne, -10% radykałów od otwartych uprzedzeń, -5% radykałów od przemocy Wrogość#!\n#N -30% Konwersja#!\n\n#Y Rozliczenie#!\nRównowaga podstawowa #Y 60#!, najwyższa z czterech. Niskie zamieszanie podnosi tę kwestię jeszcze bardziej.\n\n#Y Przy 75. Ugodzie#!\n#P +5% sukcesu w uchwalaniu prawa, +5 legitymizacji#!\n\n#Y Projekt religijny#!\n#N Brak. Model ten celowo nie prowadzi kampanii religijnej.#!"
 ve_atheism_state_desc:0 "#header Ateizm państwowy#!\nAgresywny model sekularyzacji, a nie tolerancyjny.\n\n#Y Podczas aktywności#!\n#P +5% Rozprzestrzenianie się technologii, +2% Dostęp do edukacji, +20% Konwersja#!\n#N -5% Autorytet, -10% Pobożna siła polityczna, +5% Radykałowie z otwartych uprzedzeń#!\n\n#Y Ugoda#!\nRównowaga podstawowa #Y 45#!, najniższa z czterech. Podnosi to akceptacja umiejętności czytania i pisania oraz inteligencji; silna siła pobożna obniża ją.\n\n#Y W osadzie 75#!\n#P +5% rozprzestrzenienia technologii, +5% biurokracji#!\n\n#Y Projekt religijny#!\nKampania sekularyzacyjna\n\n#Y Uwaga#!\nPrzejście na ten model kosztuje: #N 5-letni#! kryzys zamiast 3, jeśli umiejętność czytania i pisania jest poniżej 50% lub siła pobożności wynosi 20% lub więcej."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Programy są #Y fakultatywny#! i trwałe. Każde kosztuje #Y 25 Reforma pobożności#! i zaczyna się #Y 24-miesięczny#! obciążenie wdrożeniowe, podczas którego nie można przyjąć kolejnego Programu. Wszystkie osiem należy do Twojego obecnego Modelu Religijnego i zostaną utracone, jeśli ten model ulegnie zmianie.\n#Y Najedź kursorem na dowolną kartę lub licznik, aby zobaczyć jej pełne efekty.#!"
 ve_religious_program_strain_notice:0 "Program jest nadal wdrażany – żaden kolejny Program nie może zostać przyjęty, dopóki obciążenie to nie wygaśnie."
 ve_religious_program_adopted_badge:0 "PRZYJĘTY"
 ve_adopt_program_button:0 "Przyjąć"
 ve_religious_program_cost_label:0 "Koszty #Y 25 Reforma pobożności#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Ukierunkowany projekt religijny"
 ve_religious_projects_intro:0 "Projekt religijny jest #Y fakultatywny#! i tylko jeden może biec na raz. Koszt Reformy Pobożności jest opłacany natychmiast i #N -50 Biurokracja i -25 Władza#! aplikuje tak długo, jak działa. Ukończenie jej zwraca część Reformy Pobożności i podnosi Osadę Religijną.\n#Y Najedź kursorem na dowolną kartę lub licznik, aby zobaczyć jej pełne efekty.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Projekt w toku"
 ve_religious_project_backlash_notice:0 "Anulowany projekt nadal blokuje nowy – najpierw musi upłynąć 24-miesięczny backlash."
 ve_religious_project_start_instruction:0 "#Y Jak go rozpocząć#!\n1. Otwórz jeden ze swoich stanów.\n2. Naciśnij #Y Rozpocznij projekt#! w panelu tego stanu.\nW podpowiedzi tego przycisku jest wymienione wszystko, czego jeszcze brakuje."
