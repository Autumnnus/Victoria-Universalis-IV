l_polish:
 ve_piety:0 "Pobożność"
 ve_piety_reform:0 "Fundusz religijny"
 ve_piety_reform_tt:0 "#header Fundusz religijny#!\nAktualnie: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nMiesięczny przychód: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Rozbicie miesięczne#!\nBaza: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nPrawomocność: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nPoparcie ludu pobożnego: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nDoktryna katalogu: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Doktryna katalogu — liczy się tylko Twój obecny model wyznaniowy#!\n#P Państwo wyznaniowe / Ateizm państwowy#!: Nacjonalizm V #P +1#!\n#P Wolność sumienia / Całkowity rozdział#!: Reformizm V #P +1#!\nPowyższa suma aktywna jest ograniczona do #Y +1#!, zatem obie ścieżki nie mogą się kumulować.\n\nWydawane na doktryny i programy (po #Y 25#!) oraz na celowy projekt wyznaniowy (#Y 100-150#!, zależnie od modelu). Przychód zwalnia powyżej #Y 400#! i ustaje przy #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doktryny i programy"
 ve_piety_tt:0 "#header Ugoda wyznaniowa#!\nObecny stan: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nRównowaga społeczna: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMiesięczna zmiana: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Rozbicie równowagi#!\nModel ugody: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nPoparcie modelu: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nPrawomocność, administracja i stabilność: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nWskaźnik zmierza co miesiąc o #Y 20%#! w stronę równowagi, z ograniczeniem do #Y ±5#!.\nPrzy #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nPrzy #N 25#! lub mniej: #N -5 Prawomocność i -5% Sukces ustanawiania prawa#!.\n\nTen wskaźnik nie służy już opłacaniu programów – patrz Fundusz religijny. Programy wymagają co najmniej #Y 25#! funduszu religijnego, kosztują #Y 25#! i nakładają #Y 24-miesięczne#! obciążenie wdrażaniem.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Projekt wyznaniowy"
 ve_religious_project_progress_tt:0 "#header Celowy projekt wyznaniowy#!\nPostęp: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nMiesięczny postęp: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (minimum 1, maksimum 7)\n\n#Y Rozbicie miesięczne#!\nBaza: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nAdministracja: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nPrawomocność: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nPoparcie modelu: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nUgoda: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nRuchy religijne: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nZamęt w obszarze docelowym: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nKatalogi doktryn: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Katalogi doktryn — aktywne są wyłącznie bonusy pasujące do Twojego obecnego modelu wyznaniowego#!\n#P Państwo wyznaniowe#!: Nacjonalizm VII #P +1#!\n#P Wolność sumienia#!: Reformizm VII #P +1#!\n#P Ateizm państwowy#!: Nacjonalizm VII #P +1#! oraz Akademizm VII #P +1#!\nSuma aktywnych katalogów doktryn powyżej jest ograniczona do #Y +2#!.\n\nRozpocznij jeden z panelu posiadanego obszaru administracyjnego. Państwo wyznaniowe i ateizm państwowy nawracają #Y 5%#! populacji obszaru docelowego po ukończeniu lub #Y 7%#! z nacjonalizmem VII, a także dodają radykalizujących się. Wolność sumienia zamiast tego dodaje lojalistów bez wymuszania nawrócenia. Całkowity rozdział nie może rozpocząć projektu – jest to model w pełni neutralny.\n\n$ve_religious_project_hint$"
