 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Religia państwowa"
 ve_settlement_tier_high:0 "USTALONA – [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "ZAKWESTIONOWANA – #N -5 Prawomocność i -5% Sukces ustanawiania prawa#!."
 ve_settlement_hint:0 "Zmierza w stronę równowagi, którą wytwarza Twój model wyznaniowy. Przy wartości 75+ zyskujesz premię, a przy 25 lub mniej niestabilność."
 ve_piety_reform_hint:0 "Wydawane na programy (po 25) oraz na projekty wyznaniowe. Oszczędzanie jest bezpieczne, lecz przy 400 dochód spada o połowę, a przy 500 ustaje."
 ve_religious_project_hint:0 "Opcjonalny. Uruchamiany z jednego z Twoich obszarów administracyjnych, jeśli pozwala na to Twój model wyznaniowy."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Modele wyznaniowe"
 ve_religious_models_help:0 "Twój model wyznaniowy jest określany przez prawo #Y Kościół i państwo#! i jest #P już aktywny#! – nie ma tu nic do wyboru. Model decyduje jedynie o tym, jak zdobywana jest #Y ugoda wyznaniowa#!, które osiem programów możesz przyjąć oraz jaki projekt wyznaniowy możesz prowadzić.\n#Y Zmiana prawa jest opcjonalna:#! resetuje ugodę do poziomu #Y 35#!, usuwa wszystkie przyjęte programy, anuluje trwający projekt wyznaniowy oraz nakłada #Y 3–5-letni#! kryzys wyznaniowy.\n#Y Najedź kursorem na dowolną kartę lub wskaźnik, aby poznać jego pełne efekty.#!"
 ve_religious_model_active_footer:0 "Obecny model"
 ve_confessional_state_short:0 "Kościół i państwo rządzą wspólnie.\nUgoda wynika z #Y aprobaty i siły przebicia wiernych#!."
 ve_freedom_state_short:0 "Wszystkie wyznania są tolerowane w ramach jednego państwa.\nUgoda wynika z #Y spokojnego, dobrze funkcjonującego kraju#!."
 ve_separation_state_short:0 "Państwo nie zajmuje żadnego stanowiska religijnego.\nUgoda wyznaniowa zaczyna się od najwyższego poziomu i nagradza #Y niski zamęt#!."
 ve_atheism_state_short:0 "Aktywna, kierowana przez państwo sekularyzacja.\nUgoda wyznaniowa wynika z #Y piśmienności oraz poparcia Inteligencji#!."
 ve_confessional_state_unlocks:0 "Uruchamia projekt #Y Konwersja konfesyjna#!"
 ve_freedom_state_unlocks:0 "Uruchamia projekt #Y Działalność misyjna#!"
 ve_separation_state_unlocks:0 "#N Nie można prowadzić projektu wyznaniowego#!"
 ve_atheism_state_unlocks:0 "Uruchamia projekt #Y Kampania sekularyzacyjna#!"
 ve_confessional_state_desc:0 "#header Państwo wyznaniowe#!\nKościół i państwo rządzą wspólnie.\n\n#Y Podczas aktywności#!\n#P +5% Zwierzchnictwo, +10% Nawrócenie, +10% Siła polityczna Wiernych#!\n#N -3% Atrakcyjność migracji, +5% Radykałowie z otwartych uprzedzeń#!\nPlus jeden mały pakiet dla rodziny wyznaniowej twojej religii państwowej (chrześcijaństwo, islam, judaizm, dharmizm, religie uczone lub animizm).\n\n#Y Ugoda wyznaniowa#!\nPodstawowa równowaga #Y 55#!. Aprobata i siła przebicia Wiernych wpływają na nią najsilniej.\n\n#Y Przy 75 Ugodzie wyznaniowej#!\n#P +5% Zwierzchnictwo, +5 Prawomocność#!\n\n#Y Projekt wyznaniowy#!\nKonwersja konfesyjna"
 ve_freedom_state_desc:0 "#header Wolność sumienia#!\nKażde wyznanie jest tolerowane w ramach jednego państwa.\n\n#Y Podczas aktywności#!\n#P +5% Atrakcyjność migracji, -5% Radykałowie z otwartych uprzedzeń#!\n#N -15% Nawrócenie, -25 Biurokracja#!\n\n#Y Ugoda wyznaniowa#!\nPodstawowa równowaga #Y 55#!. Niski zamęt, prawomocność i sprawna administracja podnoszą ją.\n\n#Y Przy 75 Ugodzie wyznaniowej#!\n#P +5% Atrakcyjność migracji, +5 Prawomocność#!\n\n#Y Projekt wyznaniowy#!\nDziałalność misyjna"
 ve_separation_state_desc:0 "#header Całkowity rozdział#!\nModel neutralny: państwo nie zajmuje żadnego stanowiska religijnego.\n\n#Y Podczas aktywności#!\n#P +8% Atrakcyjność migracji, -10% Radykałowie z otwartych uprzedzeń, -5% Radykałowie z wrogich aktów przemocy#!\n#N -30% Nawrócenie#!\n\n#Y Ugoda wyznaniowa#!\nPodstawowa równowaga #Y 60#!, najwyższa z czterech. Niski zamęt podnosi ją jeszcze bardziej.\n\n#Y Przy 75 Ugodzie wyznaniowej#!\n#P +5% Sukces ustanawiania prawa, +5 Prawomocność#!\n\n#Y Projekt wyznaniowy#!\n#N Brak. Ten model celowo nie posiada kampanii religijnej.#!"
 ve_atheism_state_desc:0 "#header Ateizm państwowy#!\nModel agresywnej sekularyzacji, nie zaś tolerancji.\n\n#Y Podczas aktywności#!\n#P +5% Rozpowszechnianie technologii, +2% Dostęp do edukacji, +20% Nawrócenie#!\n#N -5% Zwierzchnictwo, -10% Siła polityczna Wiernych, +5% Radykałowie z otwartych uprzedzeń#!\n\n#Y Ugoda wyznaniowa#!\nPodstawowa równowaga wynosi #Y 45#!, najmniej z czterech. Piśmienność i aprobata Inteligencji ją podnoszą; silna siła przebicia Wiernych ją obniża.\n\n#Y Przy 75 Ugodzie wyznaniowej#!\n#P +5% Rozpowszechnianie technologii, +5% Biurokracja#!\n\n#Y Projekt wyznaniowy#!\nKampania sekularyzacyjna\n\n#Y Uwaga#!\nPrzejście na ten model wywołuje kryzys trwający #N 5 lat#! zamiast 3, jeśli piśmienność spadnie poniżej 50% lub siła przebicia Wiernych wyniesie 20% lub więcej."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Programy są #Y opcjonalne#! i stałe. Każdy kosztuje #Y 25 Fundusz religijny#! i rozpoczyna #Y 24-miesięczne#! obciążenie wdrażaniem, podczas którego nie można przyjąć żadnego kolejnego programu. Wszystkie osiem należy do twojego obecnego modelu wyznaniowego i zostaje utraconych w przypadku zmiany tego modelu.\n#Y Najeźdź kursorem na dowolną kartę lub wskaźnik, aby poznać jego pełne efekty.#!"
 ve_religious_program_strain_notice:0 "Program jest nadal wdrażany – nie można przyjąć kolejnego programu, dopóki to obciążenie nie wygaśnie."
 ve_religious_program_adopted_badge:0 "PRZYJĘTO"
 ve_adopt_program_button:0 "Przyjmij"
 ve_religious_program_cost_label:0 "Koszt: #Y 25 Fundusz religijny#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Celowy projekt wyznaniowy"
 ve_religious_projects_intro:0 "Projekt wyznaniowy jest #Y opcjonalny#! i naraz może być prowadzony tylko jeden. Jego koszt w funduszu religijnym jest opłacany natychmiastowo, a na czas jego trwania nakładane są kary #N -50 Biurokracja oraz -25 Zwierzchnictwo#!. Ukończenie projektu zwraca część funduszu religijnego i podnosi ugodę wyznaniową.\n#Y Najeźdź kursorem na dowolną kartę lub wskaźnik, aby poznać jego pełne efekty.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Projekt w toku"
 ve_religious_project_backlash_notice:0 "Anulowany projekt nadal blokuje nowy – najpierw musi wygasnąć 24-miesięczna reakcja zwrotna."
