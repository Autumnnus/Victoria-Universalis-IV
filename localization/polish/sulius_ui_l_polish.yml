l_polish:
 SULIUS_LEGITIMACY_LEVEL_ACTIVE_TOOLTIP:0 "#tooltip_header [concept_legitimacy] \n[LegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\n$LEGITIMACY_LEVEL_BOUNDS_DESC$\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\nEfekty:#indent_newline:2 \n[LegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\nWynika to z:#indent_newline:2 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 SULIUS_CAPITAL_MONEY:0 "#tooltip_header [concept_money]#!\nBilans: #variable @money![AccessPlayer.PredictWeeklyBalance|D=+]#![GetPlayer.GetPowerDeltaIcon('money')]\n[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.GetPrincipal, '(CFixedPoint)0'), 'CREDIT_DESC', 'GOLD_RESERVES_DESC')]\nLimit rezerw złota: @money![GetPlayer.GetGoldReserveLimit|Dv]#!#![SelectLocalization(GetMetaPlayer.GetPlayedOrObservedCountry.IsValid, 'CAPITAL_MONEY_DELAYED', 'OBSERVER_NO_COUNTRY_SELECTED') ]"
 
 SULIUS_RESEARCH:0 "#tooltip_header [concept_technology]#!\n[SelectLocalization( GetPlayer.GetCurrentlyResearchedTechnology.IsValid, 'SULIUS_RESEARCHING', 'SULIUS_NOT_RESEARCHING' )]\n$TOOLTIP_DELIMITER$\n#V Postęp technologii#!\n#help Z [concept_innovation]: @innovation![GetPlayer.GetWeeklyInnovation|+0]\nZ [concept_technology_spread]: [GetPlayer.GetWeeklyTechnologySpreadForTechDesc(GetPlayer.GetCurrentlyResearchedTechnology.Self)]\n$TOOLTIP_DELIMITER$\n#V [concept_innovation]#!\nGenerujemy #v @innovation![GetPlayer.GetWeeklyInnovation|+2]#! [concept_innovation] tygodniowo:\n[GetPlayer.GetWeeklyInnovationDesc]\n\nW aktywne badania można co tydzień zainwestować maksymalnie @innovation![GetPlayer.GetWeeklyMaxInnovation|v2] [concept_innovation]:\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\nWszystkie [concept_innovation], które nie zostaną wydane z powodu limitów inwestycyjnych lub braku aktywnych badań, zwiększą szybkość [concept_technology_spread] w naszym kraju"
 SULIUS_RESEARCHING:0 "[GetPlayer.GetName] prowadzi obecnie badania nad technologią: [GetPlayer.GetCurrentlyResearchedTechnology.GetName]#!\nPostęp: #v @innovation! [GetPlayer.GetCurrentlyResearchedTechnology.GetProgress(GetPlayer.Self)|D]#! / #maximum [GetPlayer.GetCurrentlyResearchedTechnology.GetCost(GetPlayer.Self)|D]#! (pozostało: [GetPlayer.GetCurrentlyResearchedTechnology.GetTimeLeftDesc( GetPlayer.Self )])"
 SULIUS_NOT_RESEARCHING:0 "[GetPlayer.GetName] nie prowadzi obecnie żadnych badań."
