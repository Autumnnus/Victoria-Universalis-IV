 ve_age_3_bonus_10_tt:0 "Wymaga Wielkiej Brytanii."
 ve_age_1_bonus_11_tt:0 "Wymaga północnoniemieckiej lub południowoniemieckiej kultury dominującej."
 ve_age_2_bonus_11_tt:0 "Wymaga Rosji."
 ve_age_3_bonus_11_tt:0 "Wymaga Chin."
 ve_age_1_bonus_12_tt:0 "Wymaga Niderlandów."
 ve_age_2_bonus_12_tt:0 "Wymaga Belgii."
 ve_age_3_bonus_12_tt:0 "Wymaga Francji."
 ve_age_1_bonus_13_tt:0 "Wymaga Imperium Osmańskiego."
 ve_age_2_bonus_13_tt:0 "Wymaga Stanów Zjednoczonych."
 ve_age_3_bonus_13_tt:0 "Wymaga Japonii."
