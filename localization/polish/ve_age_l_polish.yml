l_polish:
 ve_splendor:0 "#tooltippable_name Tempo epoki: "
 ve_age_of_victoria_title:0 "Przemysł i narody"
 ve_age_of_victoria_desc:0 "Stare porządki konfrontują fabryki, koleje, wykształcone społeczeństwo i nowoczesne państwo. Impet należy do krajów, które przekształcają odziedziczone instytucje w trwałą zdolność narodową."
 ve_imperialism_age_title:0 "Imperium i społeczeństwo masowe"
 ve_imperialism_age_desc:0 "Przemysł dociera na wszystkie kontynenty, podczas gdy edukacja, instytucje publiczne i zorganizowane armie przekształcają społeczeństwo masowe. Wielkie mocarstwa mogą rozszerzyć się za granicę; mniejsze państwa mogą prosperować dzięki suwerenności i rozwojowi wewnętrznemu."
 ve_great_wars_age_title:0 "Polityka masowa i wojna totalna"
 ve_great_wars_age_desc:0 "Energia elektryczna, ropa naftowa, masowe uczestnictwo, opieka społeczna i wojny przemysłowe zmieniają relacje między państwem a społeczeństwem. Przetrwanie zależy teraz w równym stopniu od instytucji, jak i od armii."
 ve_age_notify_option:0 "Nadchodzi nowy wiek."
 ve_victorian_age_icon_p_tt:0 "#P Przemysł i narody (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Przemysł i narody (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Imperium i społeczeństwo masowe (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Imperium i społeczeństwo masowe (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Polityka masowa i wojna totalna (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Polityka masowa i wojna totalna (1906–1936)"

 ve_golden_age:0 "Złoty wiek"
 ve_golden_age_industrial:0 "Złoty wiek przemysłu"
 ve_golden_age_cultural:0 "Kulturalny złoty wiek"
 ve_golden_age_strategic:0 "Strategiczny złoty wiek"
 ve_golden_age_tt:0 "Dostępne od #v 1845#! po osiągnięciu #v 5 odrębnych celów#! w obecnym wieku. Kraj może wybrać tylko jeden Złoty Wiek podczas całej gry; jego efekty utrzymują się przez #v 15 lat#!."
 ve_golden_age_requirement_unused:0 "Podczas tej kampanii nie wybrano żadnego Złotego Wieku."
 ve_golden_age_requirement_year:0 "Wymagany rok #v 1845#! lub późniejszy."
 ve_golden_age_requirement_objectives:0 "Ukończ co najmniej #v 5 różnych celów#! w obecnej epoce."
 ve_golden_age_industrial_tt:0 "#header Złoty Wiek Przemysłu#!\nPrzez #Y 15 lat#!: #P +10% wydajności produkcyjnej#! i #P +10% szansy na odkrycie zasobów#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Kulturowy złoty wiek#!\nPrzez #Y 15 lat#!: #P +5% dostępu do edukacji#! i #P +10% prestiżu#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Strategiczny złoty wiek#!\nNa #Y 15 lat#!: #P +5% ofensywy armii#! i #P -10% wyczerpania wojennego z powodu ofiar#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Cele wieku"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Rozwój przemysłowy"
 ve_victorian_age_obj_desc_1:0 "Zmniejsz udział chłopów poniżej 40%"
 ve_victorian_age_obj_title_2:0 "#tooltip_header Koniec starego Nakaz"
 ve_victorian_age_obj_desc_2:0 "Zakaz niewolnictwa i zniesienie pańszczyzny."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Państwo funkcjonalne"
 ve_victorian_age_obj_desc_3:0 "Utrzymanie co najmniej 70 legitymacji i nieujemnej równowagi biurokracji bez zbliżania się niedoborów."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Wykształcone społeczeństwo"
 ve_victorian_age_obj_desc_4:0 "Osiągnij 50% umiejętności czytania i pisania lub szkoły na poziomie 3."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Zintegrowany rynek"
 ve_victorian_age_obj_desc_5:0 "Posiadaj co najmniej 3 poziomy kolei, jeśli liczba ludności jest niższa niż 5 milionów, lub 6 poziomów kolei w przeciwnym razie."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Przebudzenie narodowe"
 ve_victorian_age_obj_desc_6:0 "Bądź niezależny z co najmniej 65 legitymacją i mniej niż 5% zawirowań w kraju."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Globalny zasięg"
 ve_victorian_age_obj_desc_7:0 "Bądź głównym lub wielkim mocarstwem lub utrzymuj co najmniej 5 deklarowanych interesów."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Potęga przemysłowa"
 ve_imperialism_age_obj_desc_1:0 "Osiągnij 100 milionów funtów PKB lub zmniejsz udział chłopów poniżej 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Edukacja masowa"
 ve_imperialism_age_obj_desc_2:0 "Osiągnij 65% umiejętności czytania i pisania lub poziom 4 Szkoły."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Imperium czy suwerenność"
 ve_imperialism_age_obj_desc_3:0 "Mieć co najmniej 2 przedmioty lub pozostać niezależnym i uznanym."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Handel globalny"
 ve_imperialism_age_obj_desc_4:0 "Posiadaj 2 poziomy portów, jeśli populacja jest mniejsza niż 10 milionów, w innym przypadku posiadaj 10 poziomów portów lub utrzymuj 5 zadeklarowanych interesów."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Budowanie narodu"
 ve_imperialism_age_obj_desc_5:0 "Utrzymaj co najmniej 60 legitymizacji i mniej niż 5% zamieszania w kraju."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header Kwestia społeczna"
 ve_imperialism_age_obj_desc_6:0 "Podnieść system opieki zdrowotnej, bezpieczeństwo w miejscu pracy lub zabezpieczenie społeczne do poziomu 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Nowoczesne siły zbrojne"
 ve_imperialism_age_obj_desc_7:0 "Wystaw w armii co najmniej 50% piechoty konnej lub okopowej i 10% artylerii mobilnej."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Polityka masowa"
 ve_great_wars_age_obj_desc_1:0 "Wprowadź powszechne prawo wyborcze lub Republikę Rady lub utrzymuj legitymację jako Republika Parlamentarna lub Prezydencka."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Państwo społeczne"
 ve_great_wars_age_obj_desc_2:0 "Utrzymać co najmniej dwie instytucje poziomu 3 obejmujące zdrowie, zabezpieczenie społeczne, bezpieczeństwo w miejscu pracy i szkoły."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Gospodarka zelektryfikowana"
 ve_great_wars_age_obj_desc_3:0 "Posiadaj 1 poziom elektrowni, jeśli populacja jest mniejsza niż 10 milionów, lub 5 poziomów elektrowni, w przeciwnym razie."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Olej i silniki"
 ve_great_wars_age_obj_desc_4:0 "Posiadaj platformę wiertniczą lub co najmniej 5 poziomów przemysłu motoryzacyjnego."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Nowoczesne wojsko"
 ve_great_wars_age_obj_desc_5:0 "Wystaw w armii co najmniej 50% piechoty okopowej lub oddziału i 15% artylerii odłamkowej."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Całkowita pojemność wojenna"
 ve_great_wars_age_obj_desc_6:0 "Utrzymaj 40 jednostek wojskowych i co najmniej 5 poziomów przemysłu zbrojeniowego lub 3 fabryki amunicji."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Wpływy światowe"
 ve_great_wars_age_obj_desc_7:0 "Bądź głównym lub wielkim mocarstwem, poprowadź blok władzy lub utrzymuj co najmniej 6 zadeklarowanych interesów."

 ve_age_splendor_tt:0 "#title Era Momentum#!\nAktualne zasoby: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nOsiągnięte cele: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nGrupy pomysłów (obecny wiek, maks. +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nZmiana miesięczna: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nUkończono różne cele w tym wieku: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nNagrody zakupione w tym wieku: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nKoszt następnej nagrody: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y W jaki sposób grupy pomysłów wnoszą#!\nKażda pasująca grupa na poziomie IV daje #P +1#! miesięcznie tylko wtedy, gdy przypisany jej Wiek jest aktualny. Powyższa linia pokazuje aktywną sumę, ograniczoną do #Y +2#!.\n#P Wiek 1#!: Przemysł, handel, administracja i grupy akademickie\n#P Wiek 2#!: zasoby, społeczeństwo, dyplomacja, grupy nacjonalistyczne/reformistyczne i kolonialne\n#P Wiek 3#!: grupy wojskowe i o gospodarce wojennej\n\nKażdy aktualnie spełniony cel zapewnia również #P +1#! Era Momentum miesięcznie. Grupy pomysłów nie wpływają na realizację celu ani jego jednorazową #P +50#! nagrodę.\n\nKoszty nagród rosną w obrębie każdej epoki: #Y 200, 300, 400, 500#!, Następnie #Y 600#! za każdą późniejszą nagrodę. Dynamika i drabina kosztów resetują się, gdy rozpoczyna się nowa era."
 ve_age_obj_efct_tt:0 "Jeśli jesteś zadowolony: #P +1 Era Momentum na miesiąc#!\nPierwsze ukończenie tej epoki: #P +50 Era Momentum#!"
 splendor_default_bonus:0 "Mają co najmniej #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Era Momentum"
