l_polish:
 ve_splendor:0 "#tooltippable_name Rozpęd epoki: "
 ve_age_of_victoria_title:0 "Przemysł i narody"
 ve_age_of_victoria_desc:0 "Stare porządki stają w obliczu fabryk, kolei, piśmiennych społeczeństw oraz nowoczesnego państwa. Rozpęd należy do państw, które przekształcają odziedziczone instytucje w trwałą zdolność narodową."
 ve_imperialism_age_title:0 "Imperium i społeczeństwo masowe"
 ve_imperialism_age_desc:0 "Przemysł dociera na kontynenty, podczas gdy edukacja, instytucje publiczne i zorganizowane armie przekształcają społeczeństwo masowe. Wielkie mocarstwa mogą ekspandować za granicą; mniejsze państwa mogą prosperować dzięki suwerenności i rozwojowi wewnętrznemu."
 ve_great_wars_age_title:0 "Polityka masowa i wojna totalna"
 ve_great_wars_age_desc:0 "Elektryczność, ropa naftowa, masowy udział, opieka społeczna i wojna przemysłowa przekształcają relacje między państwem a społeczeństwem. Przetrwanie zależy obecnie w równym stopniu od instytucji, co od armii."
 ve_age_notify_option:0 "Świta nowa epoka."
 ve_victorian_age_icon_p_tt:0 "#P Przemysł i narody (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Przemysł i narody (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Imperium i społeczeństwo masowe (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Imperium i społeczeństwo masowe (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Polityka masowa i wojna totalna (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Polityka masowa i wojna totalna (1906–1936)"

 ve_golden_age:0 "Złoty wiek"
 ve_golden_age_industrial:0 "Przemysłowy złoty wiek"
 ve_golden_age_cultural:0 "Kulturowy złoty wiek"
 ve_golden_age_strategic:0 "Strategiczny złoty wiek"
 ve_golden_age_tt:0 "Dostępne od #v 1845#! po ukończeniu #v 5 różnych celów#! w bieżącej epoce. Państwo może wybrać tylko jeden Złoty wiek w trakcie całej gry; jego efekty utrzymują się przez #v 15 lat#!."
 ve_golden_age_requirement_unused:0 "W trakcie tej kampanii nie wybrano żadnego Złotego wieku."
 ve_golden_age_requirement_year:0 "Wymaga roku #v 1845#! lub późniejszego."
 ve_golden_age_requirement_objectives:0 "Ukończ co najmniej #v 5 różnych celów#! w bieżącej epoce."
 ve_golden_age_industrial_tt:0 "#header Przemysłowy złoty wiek#!\nPrzez #Y 15 lat#!: #P +10% przerób w manufakturach#! i #P +10% szansa na odkrycie zasobów#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Kulturowy złoty wiek#!\nPrzez #Y 15 lat#!: #P +5% dostęp do edukacji#! i #P +10% prestiż#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Strategiczny złoty wiek#!\nPrzez #Y 15 lat#!: #P +5% ofensywa armii#! i #P -10% wyczerpanie wojną spowodowane liczbą ofiar#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Cele epoki"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Przemysłowy zryw"
 ve_victorian_age_obj_desc_1:0 "Zredukuj odsetek chłopów poniżej 40%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Położyć kres staremu porządkowi"
 ve_victorian_age_obj_desc_2:0 "Zakazać niewolnictwa i znieść pańszczyznę."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Funkcjonalne państwo"
 ve_victorian_age_obj_desc_3:0 "Utrzymuj co najmniej 70 prawomocności i nieujemne saldo biurokracji bez nadciągającego niedoboru."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Wykształcone społeczeństwo"
 ve_victorian_age_obj_desc_4:0 "Osiągnij 50% piśmienności lub 3. poziom szkoły."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Zintegrowany rynek"
 ve_victorian_age_obj_desc_5:0 "Posiadaj co najmniej 3 poziomy kolei, jeśli populacja wynosi poniżej 5 milionów, lub 6 poziomów kolei w przeciwnym wypadku."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Przebudzenie narodu"
 ve_victorian_age_obj_desc_6:0 "Bądź niezależny, posiadając co najmniej 65 prawomocności i mniej niż 5% zamętu w kraju."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Globalny zasięg"
 ve_victorian_age_obj_desc_7:0 "Bądź wielkim lub głównym mocarstwem bądź utrzymuj co najmniej 5 zadeklarowanych interesów."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Potencjał przemysłowy"
 ve_imperialism_age_obj_desc_1:0 "Osiągnij PKB w wysokości £100 milionów lub zmniejsz odsetek chłopów poniżej 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Edukacja masowa"
 ve_imperialism_age_obj_desc_2:0 "Osiągnij 65% piśmienności lub 4. poziom Kolegium Oświaty."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Imperium lub suwerenność"
 ve_imperialism_age_obj_desc_3:0 "Miej co najmniej 2 państwa poddańcze lub pozostań niezależnym i uznanym Narodem."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Handel światowy"
 ve_imperialism_age_obj_desc_4:0 "Posiadaj 2 poziomy portów, jeśli populacja wynosi poniżej 10 milionów, w przeciwnym razie posiadaj 10 poziomów portów, lub utrzymaj 5 zdeklarowanych interesów."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Budowanie państwa"
 ve_imperialism_age_obj_desc_5:0 "Utrzymuj co najmniej 60 prawomocności i mniej niż 5% zamętu w kraju."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header Kwestia społeczna"
 ve_imperialism_age_obj_desc_6:0 "Podnieś Państwowy Fundusz Zdrowia, Bezpieczeństwo w miejscu pracy lub Urząd Ubezpieczeń Społecznych do 2. poziomu."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Nowoczesne siły zbrojne"
 ve_imperialism_age_obj_desc_7:0 "Wystaw w armii co najmniej 50% piechoty tyradowej lub okopowej oraz 10% artylerii mobilnej."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Polityka masowa"
 ve_great_wars_age_obj_desc_1:0 "Ustanów powszechność wyborów lub republikę samorządową albo utrzymaj 75 prawomocności jako republika parlamentarna lub prezydencka."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Państwo opiekuńcze"
 ve_great_wars_age_obj_desc_2:0 "Utrzymuj co najmniej dwie instytucje na 3. poziomie spośród Państwowego Funduszu Zdrowia, Urzędu Ubezpieczeń Społecznych, Bezpieczeństwa w miejscu pracy i Kolegium Oświaty."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Zelektryfikowana gospodarka"
 ve_great_wars_age_obj_desc_3:0 "Posiadaj 1 poziom elektrowni, jeśli populacja wynosi poniżej 10 milionów, w przeciwnym razie 5 poziomów elektrowni."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Ropa naftowa i silniki"
 ve_great_wars_age_obj_desc_4:0 "Posiadaj platformę wiertniczą lub co najmniej 5 poziomów przemysłu motoryzacyjnego."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Nowoczesna armia"
 ve_great_wars_age_obj_desc_5:0 "Wystaw w armii co najmniej 50% piechoty okopowej lub szturmowej oraz 15% artylerii szrapnelowej."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Zdolność do wojny totalnej"
 ve_great_wars_age_obj_desc_6:0 "Utrzymuj 40 jednostek armii oraz co najmniej 5 poziomów przemysłu zbrojeniowego lub 3 poziomy zakładów amunicyjnych."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Wpływ na świecie"
 ve_great_wars_age_obj_desc_7:0 "Bądź mocarstwem regionalnym lub wielkim mocarstwem, przewodź blokowi mocarstw lub utrzymaj co najmniej 6 zdeklarowanych interesów."

 ve_age_splendor_tt:0 "#title Rozpęd epoki#!\nAktualny zapas: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nSpełnione cele: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nGrupy doktryn (bieżąca epoka, maks. +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nMiesięczna zmiana: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nUkończone unikalne cele w tej epoce: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nZakupione nagrody w tej epoce: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nKoszt następnej nagrody: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y W jaki sposób grupy doktryn przyczyniają się do rozwoju#!\nKażda pasująca grupa na poziomie IV daje #P +1#! miesięcznie tylko wtedy, gdy przypisana do niej epoka jest bieżąca. Powyższa linia pokazuje aktywną sumę, ograniczoną do #Y +2#!.\n#P Epoka I#!: Przemysł, handel, administracja i grupy akademickie\n#P Epoka II#!: zasoby, społeczeństwo, dyplomacja, grupy nacjonalistyczne/reformistyczne i kolonialne\n#P Epoka III#!: grupy wojskowe i gospodarki wojennej\n\nKażdy obecnie spełniony cel zapewnia również #P +1#! rozpędu epoki miesięcznie. Grupy doktryn nie zmieniają stopnia ukończenia celu ani jego jednorazowej nagrody w wysokości #P +50#!.\n\nKoszty nagród rosną w każdej epoce: #Y 200, 300, 400, 500#!, a następnie #Y 600#! dla każdej kolejnej nagrody. Rozpęd i drabina kosztów resetują się wraz z początkiem nowej epoki."
 ve_age_obj_efct_tt:0 "Gdy warunek jest spełniony: #P +1 rozpęd epoki na miesiąc#!\nPierwsze ukończenie w tej epoce: #P +50 rozpęd epoki#!"
 splendor_default_bonus:0 "Miej co najmniej #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! rozpędu epoki"
