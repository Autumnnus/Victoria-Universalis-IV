l_polish:
 ve_doctrine_ambient_cooldown_mdf:0 "Ochłodzenie debaty doktrynalnej"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Instytucje kraju absorbują konsekwencje niedawnej debaty doktrynalnej."
 ve_doctrine_ambient_ig_supported_mdf:0 "Wsparcie instytucjonalne"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Rząd przyznał tej grupie interesu widoczną rolę w rozstrzyganiu debaty doktrynalnej."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Instytucjonalne nieznaczne"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Rząd wykluczył tę grupę interesów z niedawnego porozumienia doktrynalnego."

 ve_doctrine_industrialist_positive_mdf:0 "Znormalizowana praktyka przemysłowa"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Producenci czerpią korzyści ze skoordynowanego zbioru praktyk przemysłowych."
 ve_doctrine_industrialist_negative_mdf:0 "Przemysłowe wąskie gardła"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Nierozwiązane problemy z koordynacją ograniczają produkcję."
 ve_doctrine_academic_positive_mdf:0 "Skoordynowana sieć badawcza"
 ve_doctrine_academic_positive_mdf_desc:0 "Uniwersytety dzielą się metodami, personelem i wynikami za pośrednictwem skoordynowanej sieci."
 ve_doctrine_academic_negative_mdf:0 "Wąskie gardła akademickie"
 ve_doctrine_academic_negative_mdf_desc:0 "Spory dotyczące kwalifikacji i koordynacji utrudniają pracę uniwersytetów."
 ve_doctrine_nationalist_positive_mdf:0 "Krajowa sieć stowarzyszeń"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Stowarzyszenia krajowe przekładają legalny rząd na szerszą lojalność."
 ve_doctrine_nationalist_negative_mdf:0 "Konkurujące stowarzyszenia krajowe"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Konkurencyjne organizacje krajowe zamieniają legitymację polityczną w nowe skargi."
 ve_doctrine_reformist_positive_mdf:0 "Zorganizowana Sieć Reform"
 ve_doctrine_reformist_positive_mdf_desc:0 "Ruchy polityczne zyskały uporządkowane kanały uczestnictwa i kompromisu."
 ve_doctrine_reformist_negative_mdf:0 "Złamana Koalicja Reform"
 ve_doctrine_reformist_negative_mdf_desc:0 "Konkurencyjne organizacje reformatorskie przekształcają mobilizację polityczną w radykalizm."
 ve_doctrine_professional_army_positive_mdf:0 "Cykl ​​szkolenia personelu"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Skoordynowany program kadrowy usprawnia system szkolenia armii."
 ve_doctrine_professional_army_negative_mdf:0 "Wąskie gardło w korpusie oficerskim"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Awanse i spory kadrowe spowalniają szkolenie wojskowe."
 ve_doctrine_agrarian_positive_mdf:0 "Skoordynowana praktyka rolnicza"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Instytucje wiejskie rozpowszechniają niezawodne metody w całej gospodarce rolnej."
 ve_doctrine_agrarian_negative_mdf:0 "Niedobór dostaw produktów rolnych"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Niedobory nasion, kredytów i koordynacji zmniejszają wydajność rolnictwa."

 ve_idea_evt.10.t:0 "Kody bezpieczeństwa przy pełnej wydajności"
 ve_idea_evt.10.d:0 "Seria wypadków w fabrykach wyciągnęła na światło dzienne kwestię inspekcji przemysłowej. Niezależni inspektorzy obiecują wiarygodne standardy, podczas gdy producenci nalegają, aby dobrowolne zasady chroniły wydajność i inicjatywę."
 ve_idea_evt.10.a:0 "Wyznacz niezależnych inspektorów."
 ve_idea_evt.10.a.tt:0 "Wydawać #N 25#! Wgląd narodowy. Związki zawodowe zyskują #P +1#! aprobatę, a przemysłowcy tracą #N 1#! aprobatę na 24 miesiące."
 ve_idea_evt.10.b:0 "Niech przemysł napisze dobrowolne kody."
 ve_idea_evt.10.b.tt:0 "Przemysłowcy zyskują #P +1#! Zgoda i Związki Zawodowe tracą #N 1#! Zatwierdzenie na 24 miesiące."
 ve_idea_evt.10.c:0 "Standaryzuj zasady etapami."
 ve_idea_evt.10.c.tt:0 "Wydaj #N 10#! National Insight. Brak zmian w zatwierdzeniu grupy interesu."

 ve_idea_evt.11.t:0 "Standaryzowane części maszyn"
 ve_idea_evt.11.d:0 "Inżynierowie z kilku okręgów przemysłowych stworzyli wspólny katalog mierników, armatury i części maszyn. Finansowanie normy krajowej byłoby kosztowne, ale mogłoby wyeliminować tarcia w sieci produkcyjnej."
 ve_idea_evt.11.a:0 "Przyjmij standardy w całym kraju."
 ve_idea_evt.11.a.tt:0 "Wydawać #N 40#! Krajowy wgląd i zysk #P +5%#! Przepustowość produkcyjna przez 36 miesięcy."
 ve_idea_evt.11.b:0 "Archiwizuj ustalenia na później."
 ve_idea_evt.11.b.tt:0 "Zyskaj #P 15#! National Insight."
 ve_idea_evt.11.c:0 "Nasze sieci produkcyjne są już przygotowane."
 ve_idea_evt.11.c.tt:0 "Wydaj #N 20#! Krajowy wgląd i zysk #P +5%#! Wydajność produkcyjna przez 36 miesięcy."

 ve_idea_evt.12.t:0 "Wąskie gardło w miejscu pracy"
 ve_idea_evt.12.d:0 "Zamówienia gromadzą się, a niezgodne procedury, opóźnione komponenty i pomieszane harmonogramy dławią krajowe fabryki. Rząd może wysłać specjalistów, pozostawić problem firmom lub wykorzystać uznane biura konstrukcyjne do koordynowania reakcji."
 ve_idea_evt.12.a:0 "Wyślij zespół specjalistów."
 ve_idea_evt.12.a.tt:0 "Wydaj #N 25#! National Insight i uniknij kary przemysłowej."
 ve_idea_evt.12.b:0 "Fabryki muszą same rozwiązać ten problem."
 ve_idea_evt.12.b.tt:0 "Wydajność #N -5%#! Przepustowość produkcyjna przez 24 miesiące."
 ve_idea_evt.12.c:0 "Aktywuj biura konstrukcyjne."
 ve_idea_evt.12.c.tt:0 "Wydaj #N 10#! National Insight i uniknij kary przemysłowej."

 ve_idea_evt.60.t:0 "Mechanizacja i kadencja"
 ve_idea_evt.60.d:0 "Nowe maszyny mogłyby zwiększyć produkcję rolną, ale dzierżawcy i drobni rolnicy obawiają się, że szybka transformacja wykorzeni źródła utrzymania na obszarach wiejskich. Rząd musi zdecydować, czy przyspieszyć mechanizację, chronić przede wszystkim umowę o pracę, czy też koordynować stopniową transformację lokalną."
 ve_idea_evt.60.a:0 "Utwórz fundusz mechanizacyjny."
 ve_idea_evt.60.a.tt:0 "Wydawać #N 25#! Wgląd w kraj i zysk #P +5%#! Przepustowości w rolnictwie przez 24 miesiące. Przemysłowcy zyskują #P +1#! Aprobatę, a Lud Wiejski traci #N 1#! Zezwolenie na 24 miesiące."
 ve_idea_evt.60.b:0 "Zabezpiecz dzierżawców przed zmianą gospodarstwa."
 ve_idea_evt.60.b.tt:0 "Ludność wiejska zyskuje #P +1#! Akceptację, a właściciele gruntów tracą #N 1#! Zezwolenie na 24 miesiące."
 ve_idea_evt.60.c:0 "Wykorzystaj lokalne sieci produkcyjne do stopniowego przejścia."
 ve_idea_evt.60.c.tt:0 "Wydaj #N 10#! National Insight i zyskaj #P +5%#! Przepustowość w rolnictwie przez 24 miesiące. Brak zmian w zatwierdzeniu grupy interesu."

 ve_idea_evt.61.t:0 "Spichlerze Spółdzielcze"
 ve_idea_evt.61.d:0 "Delegaci wiejscy zademonstrowali sieć spółdzielczych spichlerzy, w których można dzielić rezerwy, dokumentację i transport. Program krajowy mógłby wzmocnić koordynację rolnictwa, a samo zachowanie planów nadal wzbogacałoby wiedzę instytucjonalną rządu."
 ve_idea_evt.61.a:0 "Finansowanie sieci kooperacyjnej."
 ve_idea_evt.61.a.tt:0 "Wydaj #N 40#! National Insight i zyskaj #P +5%#! Przepustowości w rolnictwie przez 36 miesięcy."
 ve_idea_evt.61.b:0 "Rozprowadź zapisy do urzędów ds. rolnictwa."
 ve_idea_evt.61.b.tt:0 "Zdobądź #P 15#! National Insight."
 ve_idea_evt.61.c:0 "Wykorzystaj istniejące już instytucje wiejskie."
 ve_idea_evt.61.c.tt:0 "Wydaj #N 20#! Krajowy wgląd i zysk #P +5%#! Przepustowości w rolnictwie przez 36 miesięcy."

 ve_idea_evt.62.t:0 "Niedobór nasion i kredytów"
 ve_idea_evt.62.d:0 "Słabe zapasy nasion i zaostrzające się kredyty dla obszarów wiejskich zagrażają nadchodzącemu cyklowi rolniczemu. Specjaliści mogą zorganizować reakcję w sytuacjach kryzysowych, sieci lokalne można pozostawić improwizacji, a istniejące instytucje pomocy społecznej mogą tymczasowo przejąć ciężar."
 ve_idea_evt.62.a:0 "Zorganizuj program wiedzy specjalistycznej w sytuacjach awaryjnych."
 ve_idea_evt.62.a.tt:0 "Wydaj #N 25#! National Insight i uniknij kary rolnej."
 ve_idea_evt.62.b:0 "Niech sieci lokalne znajdą własne rozwiązanie."
 ve_idea_evt.62.b.tt:0 "Cierpiej #N -5%#! Przepustowość w rolnictwie przez 24 miesiące."
 ve_idea_evt.62.c:0 "Wykorzystaj sieci egzystencji jako tymczasowy szkielet."
 ve_idea_evt.62.c.tt:0 "Wydaj #N 10#! National Insight i uniknij kary rolnej."

 ve_idea_evt.20.t:0 "Patronat lub recenzja partnerska"
 ve_idea_evt.20.d:0 "Rząd oczekuje praktycznych rezultatów od swoich grantów badawczych, a uczeni ostrzegają, że patronat zastąpi dowody wygodą polityczną. Trwałe porozumienie musi określić, kto będzie oceniał poziom nauki kraju."
 ve_idea_evt.20.a:0 "Utworzenie niezależnych komisji rewizyjnych."
 ve_idea_evt.20.a.tt:0 "Wydaj #N 25#! National Insight. Zysk inteligencji #P +1#! Aprobata i Drobna Burżuazja tracą #N 1#! Aprobatę na 24 miesiące."
 ve_idea_evt.20.b:0 "Niech państwo określi priorytety badawcze."
 ve_idea_evt.20.b.tt:0 "Drobna Burżuazja zyskuje #P +1#! Aprobata i inteligencja tracą #N 1#! Aprobatę na 24 miesiące."
 ve_idea_evt.20.c:0 "Instytucjonalizacja wspólnych standardów akademickich."
 ve_idea_evt.20.c.tt:0 "Wydaj #N 10#! National Insight. Brak zmian w zatwierdzeniu grupy interesu."
 ve_idea_evt.21.t:0 "Prowincjonalna Sieć Badawcza"
 ve_idea_evt.21.d:0 "Uczelnie prowincjonalne zaczęły wymieniać wykładowców, instrumenty i ustalenia bez centralnego kierownictwa. Formalne wsparcie mogłoby przekształcić tę improwizowaną współpracę w krajową sieć badawczą."
 ve_idea_evt.21.a:0 "Finansowanie sieci."
 ve_idea_evt.21.a.tt:0 "Wydaj #N 40#! National Insight i zyskaj #P +5%#! Przepustowość uniwersytetu na 36 miesięcy."
 ve_idea_evt.21.b:0 "Umieść raporty w centralnym archiwum."
 ve_idea_evt.21.b.tt:0 "Zdobądź #P 15#! National Insight."
 ve_idea_evt.21.c:0 "Połącz go z akademią narodową."
 ve_idea_evt.21.c.tt:0 "Wydaj #N 20#! Krajowy wgląd i zysk #P +5%#! Wydajność uniwersytecka przez 36 miesięcy."
 ve_idea_evt.22.t:0 "Wąskie gardło poświadczeń"
 ve_idea_evt.22.d:0 "Uczelnie nie są w stanie wystarczająco szybko ocenić rosnącej liczby studentów, wykładowców i nowych dyscyplin. Opóźnione referencje zagrażają obecnie szerszemu systemowi badawczemu."
 ve_idea_evt.22.a:0 "Zwiększaj możliwości ewaluacji."
 ve_idea_evt.22.a.tt:0 "Wydaj #N 25#! National Insight i uniknij kary akademickiej."
 ve_idea_evt.22.b:0 "Istniejące instytucje muszą sobie poradzić."
 ve_idea_evt.22.b.tt:0 "Cierpieć #N -5%#! Przepustowość uniwersytetu przez 24 miesiące."
 ve_idea_evt.22.c:0 "Standaryzuj poprzez sieć szkół."
 ve_idea_evt.22.c.tt:0 "Wydaj #N 10#! National Insight i uniknij kary akademickiej."

 ve_idea_evt.30.t:0 "Jeden kanon, wiele tradycji"
 ve_idea_evt.30.d:0 "Urzędnicy przygotowujący kanon narodowy nie zgadzają się co do miejsca zwyczajów prowincjonalnych. Pojedyncza relacja zapewnia jasność, ale wykluczenie lokalnych tradycji może osłabić sam naród, który ma definiować."
 ve_idea_evt.30.a:0 "Wpleć lokalne tradycje we wspólną historię."
 ve_idea_evt.30.a.tt:0 "Wydaj #N 25#! National Insight. Zysk ludu wiejskiego #P +1#! Aprobata i Drobnomieszczaństwo tracą #N 1#! Aprobatę na 24 miesiące."
 ve_idea_evt.30.b:0 "Ogłosić jeden oficjalny kanon."
 ve_idea_evt.30.b.tt:0 "Drobnomieszczaństwo zyskuje #P +1#! Aprobatę, a Lud Wiejski traci #N 1#! Aprobatę na 24 miesiące."
 ve_idea_evt.30.c:0 "Powierz pracę wyszkolonym kadrom kulturalnym."
 ve_idea_evt.30.c.tt:0 "Wydaj #N 10#! Wgląd narodowy. Brak zmian w zatwierdzeniu grupy interesu."
 ve_idea_evt.31.t:0 "Krajowe Stowarzyszenia Weteranów"
 ve_idea_evt.31.d:0 "Weterani zorganizowali stowarzyszenia łączące ceremonię, wzajemną pomoc i lojalność wobec państwa. Ich sieć mogłaby zostać rozszerzona na cały kraj lub zbadana bez przyznawania jej oficjalnej roli."
 ve_idea_evt.31.a:0 "Wspieraj stowarzyszenia na terenie całego kraju."
 ve_idea_evt.31.a.tt:0 "Wydawać #N 40#! National Insight i zyskaj #P +5%#! Lojaliści z Legitymizacji na 36 miesięcy."
 ve_idea_evt.31.b:0 "Udokumentuj ich doświadczenia w archiwach państwowych."
 ve_idea_evt.31.b.tt:0 "Zyskaj #P 15#! National Insight."
 ve_idea_evt.31.c:0 "Wykorzystaj już utworzone sieci krajowe."
 ve_idea_evt.31.c.tt:0 "Wydaj #N 20#! Narodowy wgląd i zyskaj #P +5%#! lojalistów od legitymizacji na 36 miesięcy."
 ve_idea_evt.32.t:0 "Konkurujące stowarzyszenia krajowe"
 ve_idea_evt.32.d:0 "Rywalizujące społeczeństwa rości sobie obecnie prawo do wypowiadania się w imieniu narodu. Ich konkurencyjne ceremonie i publikacje zmieniają wspólny język polityczny w źródło skarg."
 ve_idea_evt.32.a:0 "Przygotuj projekt wspólnej karty."
 ve_idea_evt.32.a.tt:0 "Wydaj #N 25#! National Insight i uniknij kary nacjonalistycznej."
 ve_idea_evt.32.b:0 "Konkurencja znajdzie swoje własne granice."
 ve_idea_evt.32.b.tt:0 "Cierpiej #N +5%#! Radykałowie z Legitymizacji na 24 miesiące."
 ve_idea_evt.32.c:0 "Niech instytucje krajowe rozstrzygają."
 ve_idea_evt.32.c.tt:0 "Wydaj #N 10#! National Insight i uniknij kary nacjonalistycznej."

 ve_idea_evt.40.t:0 "Komitet lub ulica"
 ve_idea_evt.40.d:0 "Reformatorzy dzielą się na komisje eksperckie i naciski masowe. Komitety obiecują spójne ustawodawstwo, podczas gdy zorganizowane ruchy nalegają, aby reformy bez użycia siły publicznej zostały opóźnione na czas nieokreślony."
 ve_idea_evt.40.a:0 "Utworzyć niezależną komisję ds. reform."
 ve_idea_evt.40.a.tt:0 "Wydawać #N 25#! Wizja narodowa. Inteligencja zyskuje #P +1#! Zgoda i Związki Zawodowe tracą #N 1#! Zgodę na 24 miesiące."
 ve_idea_evt.40.b:0 "Daj ruchom pole do działania."
 ve_idea_evt.40.b.tt:0 "Związki Zawodowe zyskują #P +1#! Zatwierdzenie i przemysłowcy tracą #N 1#! Zatwierdzenie na 24 miesiące."
 ve_idea_evt.40.c:0 "Zastosuj ustalone ramy praw i procedur."
 ve_idea_evt.40.c.tt:0 "Wydaj #N 10#! Wgląd narodowy. Brak zmian w zatwierdzeniu grupy interesu."
 ve_idea_evt.41.t:0 "Sieć Petycji"
 ve_idea_evt.41.d:0 "Lokalne petycje stały się skoordynowaną siecią krajową zdolną do rozpatrywania skarg i proponowania reform. Rząd może uznać go za kanał konsultacyjny lub zachować jego metody do późniejszego wykorzystania."
 ve_idea_evt.41.a:0 "Zmień sieć w formalne konsultacje."
 ve_idea_evt.41.a.tt:0 "Wydawać #N 40#! Narodowy Wgląd i zyskaj #P +5%#! Lojaliści z ruchów politycznych na 36 miesięcy."
 ve_idea_evt.41.b:0 "Złóż żądania w archiwum recenzji."
 ve_idea_evt.41.b.tt:0 "Zyskaj #P 15#! National Insight."
 ve_idea_evt.41.c:0 "Wykorzystaj już utworzone organizacje reformujące."
 ve_idea_evt.41.c.tt:0 "Wydaj #N 20#! Krajowy wgląd i zysk #P +5%#! Lojaliści z ruchów politycznych przez 36 miesięcy."
 ve_idea_evt.42.t:0 "Pęknięcia koalicji"
 ve_idea_evt.42.d:0 "Koalicja reformatorska jest podzielona co do priorytetów, harmonogramu i przywództwa. Jeśli nie zostanie przywrócony wspólny program, zorganizowana energia polityczna stwardnieje i przekształci się w rywalizujące ze sobą radykalne obozy."
 ve_idea_evt.42.a:0 "Przepisz wspólny program."
 ve_idea_evt.42.a.tt:0 "Wydawać #N 25#! Wnikliwość Narodowa i uniknięcie kary reformistycznej."
 ve_idea_evt.42.b:0 "Niech podział wejdzie do otwartej polityki."
 ve_idea_evt.42.b.tt:0 "Cierpiej #N +5%#! Radykały z ruchów politycznych przez 24 miesiące."
 ve_idea_evt.42.c:0 "Zastosuj ponownie egalitarne ramy."
 ve_idea_evt.42.c.tt:0 "Wydaj #N 10#! Wgląd narodowy i uniknięcie kary reformistycznej."

 ve_idea_evt.50.t:0 "Starszeństwo lub zasługi"
 ve_idea_evt.50.d:0 "Korpus oficerski jest podzielony w sprawie awansu. Starsi dowódcy bronią rangi według służby i zwyczajów, podczas gdy reformatorzy żądają egzaminów i zapisów osiągnięć, które umożliwiłyby awans w przypadku udowodnionych umiejętności."
 ve_idea_evt.50.a:0 "Wprowadzić egzaminy merytoryczne."
 ve_idea_evt.50.a.tt:0 "Wydaj #N 25#! National Insight i zyskaj #P +5%#! stawki szkoleniowej przez 24 miesiące. Siły Zbrojne tracą #N 1#! Zatwierdzenie na 24 miesiące."
 ve_idea_evt.50.b:0 "Zachowują system starszeństwa."
 ve_idea_evt.50.b.tt:0 "Siły Zbrojne zyskują #P +1#! Zatwierdzenie na 24 miesiące, ale wskaźnik szkolenia spada o #N -5%#! na 12 miesięcy."
 ve_idea_evt.50.c:0 "Wykorzystaj dokumentację służbową sztabu generalnego."
 ve_idea_evt.50.c.tt:0 "Wydaj #N 10#! Krajowy wgląd i zyski #P +5%#! Stawka za szkolenie na 24 miesiące. Zatwierdzenie grupy interesu nie ulega zmianie."
 ve_idea_evt.51.t:0 "Wielkie ćwiczenie sztabowe"
 ve_idea_evt.51.d:0 "Ćwiczenia dużej kadry ujawniły cenne lekcje mobilizacji, instruktażu i dowodzenia. Rozszerzenie programu mogłoby rozpowszechnić te wnioski w całej armii, a archiwizacja ustaleń pozwoliłaby je zachować niewielkim kosztem."
 ve_idea_evt.51.a:0 "Rozwiń ćwiczenie."
 ve_idea_evt.51.a.tt:0 "Wydawać #N 40#! Krajowy wgląd i zyski #P +5%#! Stawka szkolenia przez 36 miesięcy."
 ve_idea_evt.51.b:0 "Umieść ustalenia w archiwum doktryny."
 ve_idea_evt.51.b.tt:0 "Zysk #P 15#! National Insight."
 ve_idea_evt.51.c:0 "Korzystaj z profesjonalnej sieci dowodzenia."
 ve_idea_evt.51.c.tt:0 "Wydaj #N 20#! National Insight i zyskaj #P +5%#! stawki wyszkolenia przez 36 miesięcy."
