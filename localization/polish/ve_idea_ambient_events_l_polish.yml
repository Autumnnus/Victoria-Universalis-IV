l_polish:
 ve_doctrine_ambient_cooldown_mdf:0 "Czas odnowienia debaty nad doktryną"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Instytucje kraju przyswajają konsekwencje niedawnej debaty nad doktryną."
 ve_doctrine_ambient_ig_supported_mdf:0 "Wsparcie instytucjonalne"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Rząd przyznał tej grupie interesu widoczną rolę w rozstrzygnięciu debaty nad doktryną."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Pominięcie instytucjonalne"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Rząd pominął tę grupę interesu przy niedawnym rozstrzygnięciu doktryny."

 ve_doctrine_industrialist_positive_mdf:0 "Znormalizowane praktyki przemysłowe"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Producenci czerpią korzyści ze skorelowanego zbioru praktyk przemysłowych."
 ve_doctrine_industrialist_negative_mdf:0 "Wąskie gardła przemysłowe"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Nierozwiązane błędy koordynacji ograniczają produkcję."
 ve_doctrine_academic_positive_mdf:0 "Skoordynowana sieć badawcza"
 ve_doctrine_academic_positive_mdf_desc:0 "Uniwersytety wymieniają się metodami, personelem i wynikami za pośrednictwem skoordynowanej sieci."
 ve_doctrine_academic_negative_mdf:0 "Wąskie gardła akademickie"
 ve_doctrine_academic_negative_mdf_desc:0 "Spory o kwalifikacje i koordynację zakłócają pracę uniwersytetów."
 ve_doctrine_nationalist_positive_mdf:0 "Sieć stowarzyszeń narodowych"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Stowarzyszenia narodowe przekładają prawomocny rząd na szerszą lojalność."
 ve_doctrine_nationalist_negative_mdf:0 "Konkurujące towarzystwa narodowe"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Rywalizujące organizacje narodowe zamieniają prawomocność polityczną w nowe żale."
 ve_doctrine_reformist_positive_mdf:0 "Skoordynowana sieć reformatorska"
 ve_doctrine_reformist_positive_mdf_desc:0 "Ruchy polityczne zyskały uporządkowane kanały uczestnictwa i kompromisu."
 ve_doctrine_reformist_negative_mdf:0 "Rozbita koalicja reformatorska"
 ve_doctrine_reformist_negative_mdf_desc:0 "Konkurujące organizacje reformatorskie przekształcają mobilizację polityczną w radykalizm."
 ve_doctrine_professional_army_positive_mdf:0 "Cykl szkolenia kadr"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Skoordynowany program kadrowy usprawnia system szkolenia armii."
 ve_doctrine_professional_army_negative_mdf:0 "Wąskie gardło korpusu oficerskiego"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Spory o awanse i obsadę stanowisk spowalniają szkolenie wojskowe."
 ve_doctrine_agrarian_positive_mdf:0 "Skoordynowane praktyki rolnicze"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Instytucje wiejskie upowszechniają niezawodne metody w całej gospodarce rolnej."
 ve_doctrine_agrarian_negative_mdf:0 "Niedobór zaopatrzenia rolniczego"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Niedobory nasion, kredytów i koordynacji obniżają przerób w rolnictwie."

 ve_idea_evt.10.t:0 "Kody bezpieczeństwa przy pełnej wydajności"
 ve_idea_evt.10.d:0 "Seria wypadków fabrycznych wymusiła podniesienie kwestii inspekcji przemysłowych. Niezależni inspektorzy obiecują wiarygodne standardy, podczas gdy przemysłowcy upierają się, że dobrowolne zasady pozwolą zachować produkcję i inicjatywę."
 ve_idea_evt.10.a:0 "Powołać niezależnych inspektorów."
 ve_idea_evt.10.a.tt:0 "Wydajesz #N 25#! Rozpoznanie narodowe. Związki zawodowe zyskują #P +1#! Aprobata, a Przemysłowcy tracą #N 1#! Aprobata na 24 miesiące."
 ve_idea_evt.10.b:0 "Pozwolić przemysłom na opracowanie dobrowolnych kodeksów."
 ve_idea_evt.10.b.tt:0 "Przemysłowcy zyskują #P +1#! Aprobata, a Związki zawodowe tracą #N 1#! Aprobata na 24 miesiące."
 ve_idea_evt.10.c:0 "Wprowadzić normy etapami."
 ve_idea_evt.10.c.tt:0 "Wydajesz #N 10#! Rozpoznanie narodowe. Brak zmian w Aprobata grupy interesu."

 ve_idea_evt.11.t:0 "Standaryzowane części maszyn"
 ve_idea_evt.11.d:0 "Inżynierowie z kilku okręgów przemysłowych opracowali wspólny katalog miar, złączek i części maszyn. Finansowanie narodowego standardu byłoby kosztowne, lecz mogłoby usunąć tarcia w całej sieci wytwórczej."
 ve_idea_evt.11.a:0 "Przyjąć standardy w całym kraju."
 ve_idea_evt.11.a.tt:0 "Wydaj #N 40#! Rozpoznanie narodowe i zyskaj #P +5%#! Przerób – produkcja przemysłowa na 36 miesięcy."
 ve_idea_evt.11.b:0 "Zarchiwizować znaleziska na później."
 ve_idea_evt.11.b.tt:0 "Zyskaj #P 15#! Rozpoznanie narodowe."
 ve_idea_evt.11.c:0 "Nasze sieci produkcyjne są już przygotowane."
 ve_idea_evt.11.c.tt:0 "Wydaj #N 20#! Rozpoznanie narodowe i zyskaj #P +5%#! Przerób – produkcja przemysłowa na 36 miesięcy."

 ve_idea_evt.12.t:0 "Wąskie gardło w zakładach"
 ve_idea_evt.12.d:0 "Zamówienia się piętrzą, podczas gdy niezgodne procedury, opóźnione komponenty i zagmatwane harmonogramy dławią fabryki kraju. Rząd może wysłać specjalistów, pozostawić problem firmom lub wykorzystać ugruntowane biura budowlane do koordynacji reakcji."
 ve_idea_evt.12.a:0 "Oddelegować zespół specjalistów."
 ve_idea_evt.12.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe i uniknij kary przemysłowej."
 ve_idea_evt.12.b:0 "Fabryki muszą rozwiązać to samorzutnie."
 ve_idea_evt.12.b.tt:0 "Odczuj #N -5%#! Przerób – produkcja przemysłowa przez 24 miesiące."
 ve_idea_evt.12.c:0 "Uruchomić biura budowlane."
 ve_idea_evt.12.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe i uniknij kary przemysłowej."

 ve_idea_evt.60.t:0 "Mechanizacja a prawa własności"
 ve_idea_evt.60.d:0 "Nowe maszyny mogłyby zwiększyć produkcję rolną, lecz dzierżawcy i małorolni obawiają się, że szybka transformacja wyrwie z korzeni wiejskie środki do życia. Rząd musi zdecydować, czy przyspieszyć mechanizację, najpierw zabezpieczyć prawa własności, czy koordynować stopniową, lokalną transformację."
 ve_idea_evt.60.a:0 "Utworzyć fundusz mechanizacji."
 ve_idea_evt.60.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe i zyskaj #P +5%#! Rolnictwo – Przerób na 24 miesiące. Przemysłowcy zyskują #P +1#! Aprobata, a Chłopstwo traci #N 1#! Aprobata na 24 miesiące."
 ve_idea_evt.60.b:0 "Zabezpieczyć dzierżawców przed zmianami w gospodarstwach."
 ve_idea_evt.60.b.tt:0 "Chłopstwo zyskuje #P +1#! Aprobata, a Właściciele ziemscy tracą #N 1#! Aprobata na 24 miesiące."
 ve_idea_evt.60.c:0 "Wykorzystać lokalne sieci produkcyjne do stopniowej transformacji."
 ve_idea_evt.60.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe i zyskaj #P +5%#! Rolnictwo – Przerób na 24 miesiące. Brak zmian w Aprobata grupy interesu."

 ve_idea_evt.61.t:0 "Spółdzielcze spichlerze"
 ve_idea_evt.61.d:0 "Delegaci wiejscy zaprezentowali sieć spółdzielczych spichlerzy zdolnych do dzielenia rezerw, dokumentacji i transportu. Program krajowy mógłby wzmocnić koordynację rolnictwa, podczas gdy samo zachowanie planów wciąż wzbogaci wiedzę instytucjonalną rządu."
 ve_idea_evt.61.a:0 "Sfinansować sieć spółdzielczą."
 ve_idea_evt.61.a.tt:0 "Wydaj #N 40#! Rozpoznanie narodowe i zyskaj #P +5%#! Rolnictwo – Przerób na 36 miesięcy."
 ve_idea_evt.61.b:0 "Rozesłać dokumentację do urzędów rolniczych."
 ve_idea_evt.61.b.tt:0 "Zyskaj #P 15#! Rozpoznanie narodowe."
 ve_idea_evt.61.c:0 "Skorzystać z istniejących już instytucji wiejskich."
 ve_idea_evt.61.c.tt:0 "Wydaj #N 20#! Rozpoznanie narodowe i zyskaj #P +5%#! Rolnictwo – Przerób na 36 miesięcy."

 ve_idea_evt.62.t:0 "Niedobór nasion i kredytów"
 ve_idea_evt.62.d:0 "Słabe zapasy ziarna siewnego i zacieśniający się kredyt wiejski zagrażają nadchodzącemu cyklowi rolniczemu. Specjaliści mogą zorganizować natychmiastową reakcję, lokalne sieci mogą improwizować lub ugruntowane instytucje gospodarki naturalnej mogą tymczasowo udźwignąć ten ciężar."
 ve_idea_evt.62.a:0 "Zorganizować ratunkowy program ekspercki."
 ve_idea_evt.62.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe i uniknij kary rolniczej."
 ve_idea_evt.62.b:0 "Pozwolić lokalnym sieciom znaleźć własne rozwiązania."
 ve_idea_evt.62.b.tt:0 "Odczuj #N -5%#! Rolnictwo – Przerób przez 24 miesiące."
 ve_idea_evt.62.c:0 "Wykorzystać sieci gospodarki naturalnej jako tymczasowy szkielet."
 ve_idea_evt.62.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe i uniknij kary rolniczej."

 ve_idea_evt.20.t:0 "Patronat czy recenzja naukowa"
 ve_idea_evt.20.d:0 "Rząd oczekuje praktycznych wyników od swoich grantów badawczych, podczas gdy uczeni ostrzegają, że patronat zastąpi dowody polityczną wygodą. Trwałe porozumienie musi określić, kto ocenia wiedzę kraju."
 ve_idea_evt.20.a:0 "Utworzyć niezależne komisje weryfikacyjne."
 ve_idea_evt.20.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe. Inteligencja zyskuje #P +1#! Aprobata, a Drobnomieszczaństwo traci #N 1#! Aprobata na 24 miesiące."
 ve_idea_evt.20.b:0 "Pozwolić państwu określić priorytety badawcze."
 ve_idea_evt.20.b.tt:0 "Drobnomieszczaństwo zyskuje #P +1#! Aprobata, a Inteligencja traci #N 1#! Aprobata na 24 miesiące."
 ve_idea_evt.20.c:0 "Instytucjonalizować powszechne standardy akademickie."
 ve_idea_evt.20.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe. Brak zmian w Aprobata grupy interesu."
 ve_idea_evt.21.t:0 "Prowincjonalna sieć badawcza"
 ve_idea_evt.21.d:0 "Uczelnie prowincjonalne zaczęły wymieniać się wykładowcami, instrumentami i odkryciami bez centralnego kierownictwa. Formalne wsparcie mogłoby przekształcić tę improwizowaną współpracę w krajową sieć badawczą."
 ve_idea_evt.21.a:0 "Sfinansować sieć."
 ve_idea_evt.21.a.tt:0 "Wydaj #N 40#! Rozpoznanie narodowe i zyskaj #P +5%#! Przerób Uniwersytet przez 36 miesięcy."
 ve_idea_evt.21.b:0 "Umieścić sprawozdania w centralnym archiwum."
 ve_idea_evt.21.b.tt:0 "Zyskaj #P 15#! Rozpoznanie narodowe."
 ve_idea_evt.21.c:0 "Połączyć ją z akademią krajową."
 ve_idea_evt.21.c.tt:0 "Wydaj #N 20#! Rozpoznanie narodowe i zyskaj #P +5%#! Przerób Uniwersytet przez 36 miesięcy."
 ve_idea_evt.22.t:0 "Wąskie gardło poświadczeń"
 ve_idea_evt.22.d:0 "Uniwersytety nie są w stanie wystarczająco szybko oceniać rosnącej liczby studentów, instruktorów i nowych dyscyplin. Opóźnione poświadczenia zagrażają obecnie szerszemu systemowi badawczemu."
 ve_idea_evt.22.a:0 "Rozbudować zdolność oceny."
 ve_idea_evt.22.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe i unikaj kary akademickiej."
 ve_idea_evt.22.b:0 "Istniejące instytucje muszą sobie poradzić."
 ve_idea_evt.22.b.tt:0 "Odczuj #N -5%#! Przerób Uniwersytet przez 24 miesiące."
 ve_idea_evt.22.c:0 "Standaryzować poprzez sieć szkolną."
 ve_idea_evt.22.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe i unikaj kary akademickiej."

 ve_idea_evt.30.t:0 "Jeden kanon, wiele tradycji"
 ve_idea_evt.30.d:0 "Urzędnicy przygotowujący kanon narodowy spierają się co do miejsca zwyczajów prowincjonalnych. Jednolity opis obiecuje jasność, lecz wykluczenie lokalnych tradycji może osłabić sam naród, który ma on definiować."
 ve_idea_evt.30.a:0 "Wpleść lokalne tradycje we wspólną opowieść."
 ve_idea_evt.30.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe. Chłopstwo zyskuje #P +1#! Aprobata, a Drobnomieszczaństwo traci #N 1#! Aprobata na 24 miesiące."
 ve_idea_evt.30.b:0 "Proklamować jeden oficjalny kanon."
 ve_idea_evt.30.b.tt:0 "Drobnomieszczaństwo zyskuje #P +1#! Aprobata, a Chłopstwo traci #N 1#! Aprobata na 24 miesiące."
 ve_idea_evt.30.c:0 "Powierzyć pracę przeszkolonym kaddrom kulturowym."
 ve_idea_evt.30.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe. Brak zmian w Aprobata grupy interesu."
 ve_idea_evt.31.t:0 "Krajowe stowarzyszenia weteranów"
 ve_idea_evt.31.d:0 "Weterani zorganizowali stowarzyszenia łączące ceremonie, wzajemną pomoc i lojalność wobec państwa. Ich sieć mogłaby zostać rozszerzona na cały kraj lub zbadana bez przyznawania jej oficjalnej Rola."
 ve_idea_evt.31.a:0 "Poprzyj stowarzyszenia w całym kraju."
 ve_idea_evt.31.a.tt:0 "Wydaj #N 40#! Rozpoznanie narodowe i zyskaj #P +5%#! Lojaliści z Prawomocność przez 36 miesięcy."
 ve_idea_evt.31.b:0 "Zapisać ich Doświadczenie w archiwach państwowych."
 ve_idea_evt.31.b.tt:0 "Zyskaj #P 15#! Rozpoznanie narodowe."
 ve_idea_evt.31.c:0 "Skorzystać z już utworzonych sieci krajowych."
 ve_idea_evt.31.c.tt:0 "Wydaj #N 20#! Rozpoznanie narodowe i zyskaj #P +5%#! Lojaliści z Prawomocność przez 36 miesięcy."
 ve_idea_evt.32.t:0 "Konkurrujące towarzystwa narodowe"
 ve_idea_evt.32.d:0 "Rywalizujące towarzystwa roszczą sobie obecnie prawo do wypowiadania się w imieniu narodu. Ich konkurencyjne uroczystości i publikacje zamieniają wspólny język polityczny w źródło żalów."
 ve_idea_evt.32.a:0 "Sporządzić wspólną kartę."
 ve_idea_evt.32.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe i uniknij kary nacjonalistycznej."
 ve_idea_evt.32.b:0 "Konkurencja znajdzie swoje własne granice."
 ve_idea_evt.32.b.tt:0 "Odczuj wzrost wskaźnika: Radykałowie z prawomocności o #N +5%#! przez 24 miesiące."
 ve_idea_evt.32.c:0 "Pozwolić instytucjom narodowym rozstrzygnąć spór."
 ve_idea_evt.32.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe i uniknij kary nacjonalistycznej."

 ve_idea_evt.40.t:0 "Komitet czy ulica"
 ve_idea_evt.40.d:0 "Reformatorzy są podzieleni między komisje ekspertów a nacisk mas. Komitety obiecują spójne ustawodawstwo, podczas gdy zorganizowane ruchy upierają się, że reforma bez siły społecznej zostanie bezterminowo odłożona."
 ve_idea_evt.40.a:0 "Powołać niezależną komisję reform."
 ve_idea_evt.40.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe. Inteligencja zyskuje #P +1#! Aprobataprzez 24 miesiące, a Związki zawodowe tracą #N 1#! Aprobatę przez 24 miesiące."
 ve_idea_evt.40.b:0 "Dać ruchom przestrzeń do działania."
 ve_idea_evt.40.b.tt:0 "Związki zawodowe zyskują #P +1#! Aprobatę, a Przemysłowcy tracą #N 1#! Aprobatę przez 24 miesiące."
 ve_idea_evt.40.c:0 "Zastosować utarte ramy praw i procedur."
 ve_idea_evt.40.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe. Brak zmian w Aprobata grupy interesu."
 ve_idea_evt.41.t:0 "Sieć petycji"
 ve_idea_evt.41.d:0 "Lokalne petycje stały się skoordynowaną siecią narodową zdolną do porządkowania skarg i proponowania reform. Rząd może uznać ją za kanał konsultacyjny lub zachować jej metody do późniejszego użytku."
 ve_idea_evt.41.a:0 "Przekształcić sieć w oficjalne konsultacje."
 ve_idea_evt.41.a.tt:0 "Wydaj #N 40#! Rozpoznanie narodowe i zyskaj #P +5%#! Zmiana liczby lojalistów związana z ruchami politycznymi przez 36 miesięcy."
 ve_idea_evt.41.b:0 "Złożyć żądania w archiwum przeglądów."
 ve_idea_evt.41.b.tt:0 "Zyskaj #P 15#! Rozpoznanie narodowe."
 ve_idea_evt.41.c:0 "Wykorzystać już utworzone organizacje reformatorskie."
 ve_idea_evt.41.c.tt:0 "Wydaj #N 20#! Rozpoznanie narodowe i zyskaj #P +5%#! Zmiana liczby lojalistów związana z ruchami politycznymi przez 36 miesięcy."
 ve_idea_evt.42.t:0 "Rozłam koalicji"
 ve_idea_evt.42.d:0 "Koalicja reformatorska dzieli się w kwestii priorytetów, harmonogramu i przywództwa. O ile nie zostanie przywrócony wspólny program, zorganizowana energia polityczna zatwardzi się w rywalizujące obozy radykalne."
 ve_idea_evt.42.a:0 "Napisać wspólny program na nowo."
 ve_idea_evt.42.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe i uniknij kary reformistycznej."
 ve_idea_evt.42.b:0 "Pozwolić podziałowi wejść do otwartej polityki."
 ve_idea_evt.42.b.tt:0 "Odczuj wzrost wskaźnika: Zmiana liczby radykałów związana z ruchami politycznymi o #N +5%#! przez 24 miesiące."
 ve_idea_evt.42.c:0 "Ponownie zastosować ramy egalitarne."
 ve_idea_evt.42.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe i uniknij kary reformistycznej."

 ve_idea_evt.50.t:0 "Starszeństwo czy merytokracja"
 ve_idea_evt.50.d:0 "Korpus oficerski jest podzielony w kwestii awansów. Starszy dowódcy broną rangi wynikającej ze służby i zwyczaju, podczas gdy reformatorzy domagają się egzaminów i rejestrów wyników, które otworzyłyby drogę do awansu udowodnionym zdolnościom."
 ve_idea_evt.50.a:0 "Wprowadzić egzaminy merytoryczne."
 ve_idea_evt.50.a.tt:0 "Wydaj #N 25#! Rozpoznanie narodowe i zyskaj #P +5%#! Tempo szkolenia przez 24 miesiące. Siły zbrojne tracą #N 1#! Aprobatę przez 24 miesiące."
 ve_idea_evt.50.b:0 "Zachować system starszeństwa."
 ve_idea_evt.50.b.tt:0 "Siły zbrojne zyskują #P +1#! Aprobatę przez 24 miesiące, lecz Tempo szkolenia spada o #N -5%#! przez 12 miesięcy."
 ve_idea_evt.50.c:0 "Wykorzystać rejestry służbowe sztabu generalnego."
 ve_idea_evt.50.c.tt:0 "Wydaj #N 10#! Rozpoznanie narodowe i zyskaj #P +5%#! Tempo szkolenia przez 24 miesiące. Aprobata grupy interesu nie ulega zmianie."
 ve_idea_evt.51.t:0 "Wielkie manewry sztabowe"
 ve_idea_evt.51.d:0 "Przeprowadzenie wielkich manewrów sztabowych dostarczyło cennych wniosków w zakresie mobilizacji, wyszkolenia oraz dowództwa. Rozszerzenie programu mogłoby rozpowszechnić te nauki w całej armii, podczas gdy zarchiwizowanie ustaleń pozwoliłoby je zachować przy niewielkich kosztach."
 ve_idea_evt.51.a:0 "Rozszerzyć manewry."
 ve_idea_evt.51.a.tt:0 "Wydatkuje #N 40#! rozpoznania narodowego i zapewnia #P +5%#! tempo szkolenia na 36 miesięcy."
 ve_idea_evt.51.b:0 "Umieścić ustalenia w archiwum doktryn."
 ve_idea_evt.51.b.tt:0 "Zapewnia #P 15#! rozpoznania narodowego."
 ve_idea_evt.51.c:0 "Wykorzystać profesjonalną sieć dowodzenia."
 ve_idea_evt.51.c.tt:0 "Wydatkuje #N 20#! rozpoznania narodowego i zapewnia #P +5%#! tempo szkolenia na 36 miesięcy."
 ve_idea_evt.52.t:0 "Zator w korpusie oficerskim"
 ve_idea_evt.52.d:0 "Armia rozwija się szybciej, niż można przygotować nowych instruktorów i oficerów sztabowych. Harmonogramy szkoleniowe zależy obecnie od wąskiej grupy wyczerpanych kadr."
 ve_idea_evt.52.a:0 "Rozbudować kadry szkoleniowe."
 ve_idea_evt.52.a.tt:0 "Wydatkuje #N 25#! rozpoznania narodowego i pozwala uniknąć kary do wojskowości."
 ve_idea_evt.52.b:0 "Zwiększyć wymagania wobec obecnych kadr."
 ve_idea_evt.52.b.tt:0 "Nakłada karę #N -5%#! do tempa szkolenia na 24 miesiące."
 ve_idea_evt.52.c:0 "Przenieść rezerwę personelu logistycznego."
 ve_idea_evt.52.c.tt:0 "Wydatkuje #N 10#! rozpoznania narodowego i pozwala uniknąć kary do wojskowości."
