l_polish:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Doktryna narodowa"
 VE_CP_COLLAPSE_TT:0 "Ukryj przegląd Victoria Universalis dla tego kraju"
 VE_CP_EXPAND_TT:0 "Pokaż przegląd Victoria Universalis dla tego kraju"

 VE_CP_INSIGHT_LABEL:0 "Rozpoznanie narodowe"
 VE_CP_INSIGHT_TT:0 "#header Rozpoznanie narodowe#!\nZasoby: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nWydawane na poszczególne doktryny w obrębie przyjętego katalogu doktryn."
 VE_CP_PIETY_LABEL:0 "Fundusz religijny"
 VE_CP_PIETY_TT:0 "#header Fundusz religijny#!\nZasoby: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nWydawane na programy religijne oraz celowy projekt wyznaniowy."
 VE_CP_MANDATE_LABEL:0 "Mandat kulturowy"
 VE_CP_MANDATE_TT:0 "#header Mandat kulturowy#!\nZasoby: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nWydawane na zmianę modelu tożsamościowego oraz projekty kulturowe."
 VE_CP_MOMENTUM_LABEL:0 "Rozpęd epoki"
 VE_CP_MOMENTUM_TT:0 "#header Rozpęd epoki#!\nZasoby: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nZdobywany za zrealizowanie celów epoki i wydawany na nagrody epoki. Rozpęd jest resetowany z początkiem nowej epoki."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Doktryny"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Katalogi doktryn#!\nWykorzystane miejsca: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nWolne miejsca: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nBieżąca inwestycja w doktryny: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktywnych zakupionych doktryn\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nDoktryny w aktywnych katalogach zapewniają stałą kompetencję przy #Y 4, 8, 13, 19, 26#! oraz #Y 34#!. Miejsca 5–6 wymagają również epoki 2, a miejsce 7 wymaga epoki 3. Anulowanie katalogu obniża bieżącą inwestycję i nigdy nie zwraca rozpoznania narodowego, lecz zachowuje już zdobytą kompetencję."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Doktryny narodowe"
 VE_CP_PROGRESS_LABEL:0 "Postęp doktryny"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Postęp doktryny narodowej#!\nZakupione doktryny z katalogów: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nCo trzecia zakupiona doktryna z katalogu odblokowuje kolejną doktrynę narodową. Dwudziesta pierwsza przyznaje także premię narodową."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Nie przyjęto jeszcze żadnego katalogu doktryn.#!"
 VE_CP_PROGRAMS_LABEL:0 "Programy religijne"
 VE_CP_NONE_YET:0 "#lore Brak#!"
 VE_CP_PROJECT_LABEL:0 "Projekt"
 VE_CP_COHESION_LABEL:0 "Spójność narodowa"
 VE_CP_OBJECTIVES_LABEL:0 "Cele epoki"
 VE_CP_OBJECTIVES_TT:0 "#header Cele epoki#!\nUkończone w tej epoce: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nKażdy zrealizowany cel co miesiąc zapewnia rozpęd epoki. Cztery ukończone cele odblokowują złoty wiek."
 VE_CP_REWARDS_LABEL:0 "Nagrody epoki"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] kupiono w tej epoce"
 VE_CP_REWARDS_TT:0 "#header Nagrody epoki#!\nKupiono w tej epoce: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nKażda nagroda kosztuje więcej niż poprzednia, a efekty nagród kończą się wraz z epoką. Miejsca 10-13 są specyficzne dla kraju."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Nieznana epoka"
 ve_cp_golden_age_industrial_active:0 "#P Przemysłowy złoty wiek#!"
 ve_cp_golden_age_cultural_active:0 "#P Kulturowy złoty wiek#!"
 ve_cp_golden_age_strategic_active:0 "#P Strategiczny złoty wiek#!"
 ve_cp_golden_age_spent:0 "#lore Wykorzystano złoty wiek#!"
 ve_cp_golden_age_ready:0 "#Y Dostępny złoty wiek#!"
 ve_cp_golden_age_locked:0 "#lore Złoty wiek zablokowany#!"
 ve_cp_tier_high:0 "#P Rozkwit#!"
 ve_cp_tier_stable:0 "#lore Stabilna#!"
 ve_cp_tier_low:0 "#N Napięta#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Katalog przyjęty, ale nie zakupiono w nim jeszcze żadnej doktryny.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Ugoda wyznaniowa#!\nAktualnie: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nRównowaga: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMiesięczna zmiana: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nWskaźnik zmierza co miesiąc o 20% w stronę równowagi, z ograniczeniem do #Y 5#! punktów. Przy #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\nPrzy #N 25#! lub mniej: #N -5 prawomocności i -5% sukcesu ustanawiania prawa#!."
 VE_CP_COHESION_TT:0 "#header Spójność narodowa#!\nObecnie: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nRównowaga: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMiesięczna zmiana: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nSpójność zmierza co miesiąc o 20% w stronę równowagi, o maksymalnie #Y 5#! pkt. Przy #P 75#! model tożsamościowy zapewnia dodatkową korzyść, natomiast przy #N 25#! lub mniej występuje niestabilność narodowa."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Skierowany projekt wyznaniowy#!\nStatus: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Projekt kulturowy#!\nStatus: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nCel: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "Postęp: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nMiesięczny postęp: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Żaden projekt nie jest aktywny. Projekt uruchamia się z panelu kontrolowanego obszaru administracyjnego, a Całkowity rozdział uniemożliwia jego prowadzenie.#!"
 ve_cp_cultural_project_detail_active:0 "Postęp: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nMiesięczny postęp: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Żaden projekt nie jest aktywny. Projekty ogólnokrajowe rozpoczyna się z panelu tożsamości narodowej, a celowe z panelu kontrolowanego obszaru administracyjnego.#!"
