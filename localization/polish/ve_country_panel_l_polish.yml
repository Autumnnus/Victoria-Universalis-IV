l_polish:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Doktryna narodowa"
 VE_CP_COLLAPSE_TT:0 "Ukryj przegląd Victoria Universalis dla tego kraju"
 VE_CP_EXPAND_TT:0 "Pokaż przegląd Victoria Universalis dla tego kraju"

 VE_CP_INSIGHT_LABEL:0 "Wgląd narodowy"
 VE_CP_INSIGHT_TT:0 "#header National Insight#!\nZapas: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nWydane na indywidualne pomysły w ramach przyjętej grupy pomysłów."
 VE_CP_PIETY_LABEL:0 "Reforma pobożności"
 VE_CP_PIETY_TT:0 "#header Reforma pobożności#!\nZapas: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nWydane na programy religijne i ukierunkowane projekty religijne."
 VE_CP_MANDATE_LABEL:0 "Mandat kulturowy"
 VE_CP_MANDATE_TT:0 "#header Mandat kulturalny#!\nZapasy: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nWydane na zmianę modelu tożsamości i projekty kulturalne."
 VE_CP_MOMENTUM_LABEL:0 "Pęd epoki"
 VE_CP_MOMENTUM_TT:0 "#header Era Momentum#!\nZasoby: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nZarobione z spełnione cele ery i wydane na nagrody ery. Tempo resetuje się, gdy rozpoczyna się nowa Era."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Pomysły"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Grupy pomysłów#!\nWykorzystane miejsca: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nWolne miejsca: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInwestycja w bieżącą doktrynę: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktywne zakupione pomysły\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nAktywne pomysły grupowe zyskują stałą pojemność w #Y 4, 8, 13, 19, 26#! i #Y 34#!. Miejsca 5–6 wymagają również Wiek 2, a miejsce 7 wymaga Wiek 3. Anulowanie grupy obniża bieżącą inwestycję i nigdy nie zwraca Insight, ale już zdobyta pojemność zostaje zachowana."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Idee Narodowe"
 VE_CP_PROGRESS_LABEL:0 "Postęp Pomysłów"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Postęp Pomysłów Narodowych#!\nZakupione pomysły grupowe: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nCo trzeci zakupiony pomysł grupowy odblokowuje kolejny Pomysł Narodowy. Dwudziesty pierwszy przyznaje również Premię Narodową."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Żadna grupa pomysłów nie została jeszcze objęta.#!"
 VE_CP_PROGRAMS_LABEL:0 "Programy religijne"
 VE_CP_NONE_YET:0 "#lore Jeszcze żaden#!"
 VE_CP_PROJECT_LABEL:0 "Projekt"
 VE_CP_COHESION_LABEL:0 "Spójność narodowa"
 VE_CP_OBJECTIVES_LABEL:0 "Cele Ery"
 VE_CP_OBJECTIVES_TT:0 "#header Cele Ery#!\nUkończone w tej Epoce: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nKażdy spełniony cel płaci Era Momentum co miesiąc. Cztery ukończone cele odblokowują Złoty Wiek."
 VE_CP_REWARDS_LABEL:0 "Nagrody Ery"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] kupiły tę Epokę"
 VE_CP_REWARDS_TT:0 "#header Nagrody Ery#!\nKupione w tej Epoce: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nKażda nagroda kosztuje więcej niż poprzednia, a efekty nagród kończą się wraz z Erą. Miejsca 10-13 są zależne od kraju."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Nieznany wiek"
 ve_cp_golden_age_industrial_active:0 "#P Przemysłowy Złoty Wiek#!"
 ve_cp_golden_age_cultural_active:0 "#P Kulturalny Złoty Wiek#!"
 ve_cp_golden_age_strategic_active:0 "#P Strategiczny Złoty Wiek#!"
 ve_cp_golden_age_spent:0 "#lore Wykorzystany Złoty Wiek#!"
 ve_cp_golden_age_ready:0 "#Y Złoty Wiek dostępny#!"
 ve_cp_golden_age_locked:0 "#lore Złoty Wiek zablokowany#!"
 ve_cp_tier_high:0 "#P Rozkwitający#!"
 ve_cp_tier_stable:0 "#lore Stabilny#!"
 ve_cp_tier_low:0 "#N Napięty#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Przyjęty, ale żaden pomysł nie został jeszcze kupiony w tej grupie.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Religijni Rozliczenie#!\nPrąd: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nRównowaga: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nPrzesunięcie miesięczne: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nLicznik co miesiąc przesuwa się o 20% w kierunku równowagi, ograniczonej do #Y 5#! punktów. Przy #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\nPrzy #N 25#! lub poniżej: #N -5 legitymizacji i -5% powodzenia w stanowieniu prawa#!."
 VE_CP_COHESION_TT:0 "#header Spójność narodowa#!\nObecna: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nRównowaga: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nRuch miesięczny: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nSpójność co miesiąc przesuwa się o 20% w kierunku równowagi, ograniczona do #Y 5#! zwrotnica. Na  #P 75#! Model Tożsamości zapewnia dodatkową korzyść; Na #N Obowiązuje poziom niestabilności krajowej wynoszący 25#!  lub mniej."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Ukierunkowany projekt religijny#!\nStan: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Projekt kulturalny#!\nStan: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nCel: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "Postęp: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nPostęp miesięczny: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Żaden projekt nie jest realizowany. Projekt zostaje uruchomiony z panelu należącego do stanu, a Total Separation nie może go uruchomić.#!"
 ve_cp_cultural_project_detail_active:0 "Postęp: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nPostęp miesięczny: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Żaden projekt nie jest uruchomiony. Projekty o zasięgu ogólnokrajowym rozpoczynają się od panelu Tożsamości Narodowej, projekty ukierunkowane – od panelu będącego własnością państwa.#!"
