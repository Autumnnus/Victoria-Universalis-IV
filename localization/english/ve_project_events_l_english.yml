l_english:
 ve_je_religious_project:0 "Religious Project"
 ve_je_religious_project_reason:0 "The government is directing a long-term religious project. Its progress is governed by administrative capacity, political legitimacy, religious conditions, and events in the target state."
 ve_je_religious_project_progress:0 "Religious Project progress toward completion"
 ve_je_religious_project_status_confessional:0 "The Confessional Conversion in [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] seeks to extend the state faith through an organized campaign.\n\nCompletion at #Y 125#! progress: converts 5% of the target state's population to the state religion, refunds #P 20#! Piety Reform, and adds #P 5#! Religious Settlement."
 ve_je_religious_project_status_freedom:0 "The Freedom Outreach in [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] is building a settlement based on conscience and voluntary association.\n\nCompletion at #Y 100#! progress: adds state loyalists without forced conversion, refunds #P 20#! Piety Reform, and adds #P 7#! Religious Settlement."
 ve_je_religious_project_status_secularization:0 "The Secularization Campaign in [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] is reducing the public authority of organized religion.\n\nCompletion at #Y 150#! progress: converts 5% of the target state's population to atheism, refunds #P 25#! Piety Reform, and adds #P 8#! Religious Settlement."
 ve_je_religious_project_complete_tt:0 "The Religious Project has reached its goal."
 ve_je_religious_project_fail_tt:0 "The Religious Project has been cancelled."

 ve_je_cultural_project:0 "Cultural Project"
 ve_je_cultural_project_reason:0 "The government is directing a long-term cultural project. Administrative capacity, legitimacy, education, national cohesion, and local conditions determine its pace."
 ve_je_cultural_project_progress:0 "Cultural Project progress toward completion"
 ve_je_cultural_project_status_curriculum:0 "A National Curriculum is being prepared for the country's schools and institutions.\n\nCompletion at #Y 100#! progress: #P +20#! Cultural Mandate, #P +5#! National Cohesion, and a 10-year result of +2% Education Access, +5% Qualifications, -25 Bureaucracy."
 ve_je_cultural_project_status_symbols:0 "A program of Shared Symbols is forging a common civic vocabulary.\n\nCompletion at #Y 75#! progress: #P +20#! Cultural Mandate, #P +7#! National Cohesion, and an 8-year result of +10% loyalists from fully accepted pops and +25 Authority."
 ve_je_cultural_project_status_ethnic:0 "The Ethnic Integration Campaign in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] is pressing a minority population toward the primary culture.\n\nCompletion at #Y 125#! progress: converts 5% of the target culture's pops to the primary culture (7% with Nationalist VII), #P +25#! Cultural Mandate, #P +8#! National Cohesion, and a 10-year assimilation result."
 ve_je_cultural_project_status_civic:0 "The Equal Citizenship Initiative in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] is extending a common civic status across cultural lines.\n\nCompletion at #Y 100#! progress: +15% Acceptance for 10 years, state loyalists, #P +25#! Cultural Mandate, #P +10#! National Cohesion, and a 10-year qualifications/migration result."
 ve_je_cultural_project_status_composite:0 "The Constituent Compact in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] is negotiating permanent recognition within a composite state.\n\nCompletion at #Y 150#! progress (requires 40+ National Cohesion): permanent +15% Acceptance, adds the culture to the constituent list, state loyalists, #P +30#! Cultural Mandate, #P +12#! National Cohesion."
 ve_je_cultural_project_complete_tt:0 "The Cultural Project has reached its goal."
 ve_je_cultural_project_fail_tt:0 "The Cultural Project has been cancelled."
 ve_je_project_resolving_status:0 "The project administration is filing its final report."

 ve_evt_religious_incident_cooldown_mdf:0 "Religious Project Incident Cooldown"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "The project administration is absorbing the consequences of a recent incident."
 ve_evt_cultural_incident_cooldown_mdf:0 "Cultural Project Incident Cooldown"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "The project administration is absorbing the consequences of a recent incident."
 ve_evt_central_clergy_supported_mdf:0 "Central Clergy Supported"
 ve_evt_central_clergy_supported_mdf_desc:0 "The government has upheld the authority of the central religious hierarchy."
 ve_evt_central_clergy_slighted_mdf:0 "Central Clergy Slighted"
 ve_evt_central_clergy_slighted_mdf_desc:0 "The government has favored local practice over the preferences of the central religious hierarchy."
 ve_evt_municipal_patronage_mdf:0 "Municipal Patronage Networks"
 ve_evt_municipal_patronage_mdf_desc:0 "Local notables are advancing the project through arrangements that weaken tax collection."

 ve_rel_evt.1.t:0 "The Petition of the Local Notables"
 ve_rel_evt.1.d:0 "A delegation of clerics, municipal figures, and neighborhood elders from [SCOPE.sState('ve_evt_target_state').GetName] has petitioned the government to slow the Confessional Conversion. They warn that an inflexible timetable will turn compliance into lasting resentment."
 ve_rel_evt.1.f:0 "\"Faith imposed without counsel may fill the registers while emptying the pews.\""
 ve_rel_evt.1.a:0 "Hear their petition."
 ve_rel_evt.1.a.tt:0 "Religious Project progress decreases by #N 4#!.\nReligious Settlement increases by #P 3#!."
 ve_rel_evt.1.b:0 "The timetable will not change."
 ve_rel_evt.1.b.tt:0 "Religious Project progress increases by #P 5#!.\nReligious Settlement decreases by #N 2#!.\n#N 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_rel_evt.1.c:0 "Commission trusted intermediaries."
 ve_rel_evt.1.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 3#!.\nReligious Settlement increases by #P 1#!."

 ve_rel_evt.2.t:0 "A Shortage of Field Officers"
 ve_rel_evt.2.d:0 "Reports from [SCOPE.sState('ve_evt_target_state').GetName] describe unanswered petitions, contradictory instructions, and districts that have not seen a project officer in weeks. The Confessional Conversion is outrunning the administration assigned to carry it."
 ve_rel_evt.2.f:0 "\"A decree can cross the country in a day. A competent clerk cannot.\""
 ve_rel_evt.2.a:0 "Hire temporary field officers."
 ve_rel_evt.2.a.tt:0 "Spend #N 15#! Piety Reform.\nReligious Project progress increases by #P 4#!."
 ve_rel_evt.2.b:0 "Slow the program."
 ve_rel_evt.2.b.tt:0 "Religious Project progress decreases by #N 6#!.\nReligious Settlement increases by #P 2#!."
 ve_rel_evt.2.c:0 "Use the central registry cadres."
 ve_rel_evt.2.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 5#!."

 ve_cul_evt.1.t:0 "The Translation Bureaus"
 ve_cul_evt.1.d:0 "Officials in [SCOPE.sState('ve_evt_target_state').GetName] disagree over how the Equal Citizenship Initiative should address the [SCOPE.sCulture('ve_evt_target_culture').GetName] language. Local administrators want bilingual offices; central ministries demand a single administrative standard."
 ve_cul_evt.1.f:0 "\"A citizen should not need an interpreter to understand the rights granted in their own name.\""
 ve_cul_evt.1.a:0 "Let local languages live in public institutions."
 ve_cul_evt.1.a.tt:0 "Cultural Project progress decreases by #N 4#!.\nNational Cohesion increases by #P 3#!."
 ve_cul_evt.1.b:0 "Impose one administrative standard."
 ve_cul_evt.1.b.tt:0 "Cultural Project progress increases by #P 5#!.\nNational Cohesion decreases by #N 2#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.1.c:0 "Establish an academic translation commission."
 ve_cul_evt.1.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 3#!.\nNational Cohesion increases by #P 1#!."

 ve_cul_evt.2.t:0 "A Shortage of Local Teachers"
 ve_cul_evt.2.d:0 "The schools of [SCOPE.sState('ve_evt_target_state').GetName] lack teachers able to serve both the state curriculum and [SCOPE.sCulture('ve_evt_target_culture').GetName] communities. Without a trained local cadre, equal citizenship risks remaining a promise written only on official paper."
 ve_cul_evt.2.f:0 "\"The law declares equality in an afternoon; the classroom must teach it for a generation.\""
 ve_cul_evt.2.a:0 "Finance new teacher colleges."
 ve_cul_evt.2.a.tt:0 "Spend #N 15#! Cultural Mandate.\nCultural Project progress increases by #P 4#!."
 ve_cul_evt.2.b:0 "Slow implementation."
 ve_cul_evt.2.b.tt:0 "Cultural Project progress decreases by #N 6#!.\nNational Cohesion increases by #P 2#!."
 ve_cul_evt.2.c:0 "Use the institutions already in place."
 ve_cul_evt.2.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 5#!.\nNational Cohesion increases by #P 1#!."

 ve_rel_evt.3.t:0 "Conflicting Registers"
 ve_rel_evt.3.d:0 "Parish rolls, municipal ledgers, and the reports of project officers give incompatible accounts of religious adherence in [SCOPE.sState('ve_evt_target_state').GetName]. The administration must decide whether to lose time establishing the truth or proceed with figures it knows to be uncertain."
 ve_rel_evt.3.f:0 "\"Every office possesses an exact total. No two totals agree.\""
 ve_rel_evt.3.a:0 "Conduct a complete audit."
 ve_rel_evt.3.a.tt:0 "Gain #P 8#! Piety Reform.\nReligious Project progress decreases by #N 6#!."
 ve_rel_evt.3.b:0 "Proceed with reasonable estimates."
 ve_rel_evt.3.b.tt:0 "Spend #N 8#! Piety Reform.\nReligious Project progress increases by #P 5#!."
 ve_rel_evt.3.c:0 "Use the Sacred Administration registers."
 ve_rel_evt.3.c.tt:0 "Religious Project progress increases by #P 3#!."

 ve_rel_evt.4.t:0 "Rumors and Counter-Preaching"
 ve_rel_evt.4.d:0 "Pamphlets, street sermons, and anxious rumor now describe the Confessional Conversion in [SCOPE.sState('ve_evt_target_state').GetName] as an assault on local life. Officials warn that silence will let opponents define the project, while repression may confirm their darkest claims."
 ve_rel_evt.4.f:0 "\"A rumor requires no office, no seal, and no budget.\""
 ve_rel_evt.4.a:0 "Hold public hearings."
 ve_rel_evt.4.a.tt:0 "Religious Project progress decreases by #N 3#!.\nReligious Settlement increases by #P 3#!.\n#P 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Loyalist."
 ve_rel_evt.4.b:0 "Punish the agitators."
 ve_rel_evt.4.b.tt:0 "Religious Project progress increases by #P 4#!.\nReligious Settlement decreases by #N 3#!.\n#N 1%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_rel_evt.4.c:0 "Publish the records and results."
 ve_rel_evt.4.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 2#!.\nReligious Settlement increases by #P 1#!."

 ve_rel_evt.5.t:0 "The Language of the Sermon"
 ve_rel_evt.5.d:0 "Project clergy in [SCOPE.sState('ve_evt_target_state').GetName] report that formal sermons preserve doctrinal unity but fail to reach many congregants. Local-language preaching would carry the campaign further, though the central hierarchy fears that adaptation will become independence."
 ve_rel_evt.5.f:0 "\"A sacred word unheard is preserved perfectly—and received by no one.\""
 ve_rel_evt.5.a:0 "Preach in local languages."
 ve_rel_evt.5.a.tt:0 "Religious Project progress increases by #P 6#!.\nThe Devout lose #N 1#! Approval for #Y 2.5 years#!."
 ve_rel_evt.5.b:0 "Preserve liturgical unity."
 ve_rel_evt.5.b.tt:0 "Religious Project progress decreases by #N 3#!.\nReligious Settlement increases by #P 3#!.\nThe Devout gain #P 1#! Approval for #Y 2.5 years#!."
 ve_rel_evt.5.c:0 "Train educated interpreters."
 ve_rel_evt.5.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 4#!.\nReligious Settlement increases by #P 1#!."

 ve_rel_evt.6.t:0 "Rival Ecclesiastical Authorities"
 ve_rel_evt.6.d:0 "Central appointees and established local clergy in [SCOPE.sState('ve_evt_target_state').GetName] each claim the right to direct the Confessional Conversion. Supporting one side may restore command quickly, but the dispute has already become a test of who speaks for the faith."
 ve_rel_evt.6.f:0 "\"The quarrel concerns jurisdiction, which is how institutions describe power.\""
 ve_rel_evt.6.a:0 "Support the central clergy."
 ve_rel_evt.6.a.tt:0 "Religious Project progress increases by #P 5#!.\nThe Devout gain #P 1#! Approval for #Y 2.5 years#!.\nReligious Settlement decreases by #N 3#!.\n#N 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_rel_evt.6.b:0 "Placate the local clergy."
 ve_rel_evt.6.b.tt:0 "Religious Project progress decreases by #N 4#!.\nThe Devout lose #N 1#! Approval for #Y 2.5 years#!.\nReligious Settlement increases by #P 3#!."
 ve_rel_evt.6.c:0 "Define their powers in writing."
 ve_rel_evt.6.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 3#!.\nReligious Settlement increases by #P 1#!."

 ve_cul_evt.3.t:0 "The Categories of the Census"
 ve_cul_evt.3.d:0 "Census officials in [SCOPE.sState('ve_evt_target_state').GetName] cannot agree how citizens of [SCOPE.sCulture('ve_evt_target_culture').GetName] culture should be recorded. Local respondents use overlapping identities, while the central forms demand one answer in one box."
 ve_cul_evt.3.f:0 "\"A category simplifies the ledger long before it simplifies the country.\""
 ve_cul_evt.3.a:0 "Allow self-identification."
 ve_cul_evt.3.a.tt:0 "Cultural Project progress decreases by #N 4#!.\nNational Cohesion increases by #P 4#!."
 ve_cul_evt.3.b:0 "The categories will be set centrally."
 ve_cul_evt.3.b.tt:0 "Cultural Project progress increases by #P 6#!.\nNational Cohesion decreases by #N 4#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.3.c:0 "Use the modern registry system."
 ve_cul_evt.3.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 5#!.\nNational Cohesion increases by #P 1#!."

 ve_cul_evt.4.t:0 "The Municipal Notables"
 ve_cul_evt.4.d:0 "Municipal patrons in [SCOPE.sState('ve_evt_target_state').GetName] offer their offices, clients, and influence to advance equal citizenship for the [SCOPE.sCulture('ve_evt_target_culture').GetName] population. Their cooperation would be swift, but their price is continued control over local revenues."
 ve_cul_evt.4.f:0 "\"The shortest road to the town hall passes through several private drawing rooms.\""
 ve_cul_evt.4.a:0 "Use the local networks."
 ve_cul_evt.4.a.tt:0 "Cultural Project progress increases by #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] loses #N 5%#! Tax Capacity for #Y 2 years#!."
 ve_cul_evt.4.b:0 "Create open councils."
 ve_cul_evt.4.b.tt:0 "Cultural Project progress decreases by #N 3#!.\nNational Cohesion increases by #P 3#!."
 ve_cul_evt.4.c:0 "Negotiate a rules-based settlement."
 ve_cul_evt.4.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 3#!.\nNational Cohesion increases by #P 1#!."

 ve_cul_evt.5.t:0 "The Civil Service Examinations"
 ve_cul_evt.5.d:0 "Opening the civil service examinations to [SCOPE.sCulture('ve_evt_target_culture').GetName] candidates has exposed a gap between legal equality and practical preparation. Immediate access would be symbolically powerful, but years of unequal schooling cannot be erased by decree."
 ve_cul_evt.5.f:0 "\"The same examination is not the same opportunity when only one candidate was taught its language.\""
 ve_cul_evt.5.a:0 "Finance preparatory courses."
 ve_cul_evt.5.a.tt:0 "Spend #N 15#! Cultural Mandate.\nCultural Project progress increases by #P 5#!.\nNational Cohesion increases by #P 2#!."
 ve_cul_evt.5.b:0 "Equal access begins immediately."
 ve_cul_evt.5.b.tt:0 "Cultural Project progress increases by #P 7#!.\nNational Cohesion decreases by #N 4#!.\n#N 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.5.c:0 "Mobilize the school and welfare networks."
 ve_cul_evt.5.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 5#!.\nNational Cohesion increases by #P 2#!."
 ve_cul_evt.5.e:0 "Reform the examination system first."
 ve_cul_evt.5.e.tt:0 "Cultural Project progress decreases by #N 4#!.\nNational Cohesion increases by #P 3#!."

 ve_cul_evt.6.t:0 "The Majority Pushes Back"
 ve_cul_evt.6.d:0 "Opponents of the Equal Citizenship Initiative claim that extending common rights to the [SCOPE.sCulture('ve_evt_target_culture').GetName] population diminishes the standing of everyone else. Demonstrations in [SCOPE.sState('ve_evt_target_state').GetName] are turning an administrative reform into a national political test."
 ve_cul_evt.6.f:0 "\"A right shared is being described as a privilege stolen.\""
 ve_cul_evt.6.a:0 "Defend the initiative openly."
 ve_cul_evt.6.a.tt:0 "Cultural Project progress increases by #P 4#!.\nNational Cohesion decreases by #N 4#!.\n#N 1%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.6.b:0 "Reduce the pace of implementation."
 ve_cul_evt.6.b.tt:0 "Cultural Project progress decreases by #N 5#!.\nNational Cohesion increases by #P 3#!."
 ve_cul_evt.6.c:0 "Mobilize the reform coalition."
 ve_cul_evt.6.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 3#!.\nNational Cohesion increases by #P 2#!.\n#P 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Loyalist."

 ve_rel_evt.7.t:0 "The Mission at Breaking Point"
 ve_rel_evt.7.d:0 "The Confessional Conversion in [SCOPE.sState('ve_evt_target_state').GetName] is close to administrative and political collapse. Offices have stopped answering one another, public resistance is hardening, and field clergy warn that the mission cannot continue on its present terms."
 ve_rel_evt.7.f:0 "\"The reports still call it a temporary difficulty. The streets have chosen a harsher name.\""
 ve_rel_evt.7.a:0 "Accept the losses and withdraw."
 ve_rel_evt.7.a.tt:0 "Cancel the Religious Project with no Piety Reform refund.\nReligious Settlement decreases by #N 5#!.\nFor #Y 2 years#!: #N -50#! Bureaucracy, #N -50#! Authority, and #N -3%#! Law Enactment Success."
 ve_rel_evt.7.b:0 "Transfer emergency resources."
 ve_rel_evt.7.b.tt:0 "Spend #N 25#! Piety Reform.\nReligious Project progress decreases by #N 5#!.\n#N 1%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical.\nThe project continues."
 ve_rel_evt.7.c:0 "Continue with a skeleton staff."
 ve_rel_evt.7.c.tt:0 "Religious Project progress decreases by #N 10#!.\nReligious Settlement decreases by #N 2#!.\nThe project continues."
 ve_rel_evt.7.e:0 "Renegotiate the method."
 ve_rel_evt.7.e.tt:0 "Spend #N 15#! Piety Reform.\nReligious Project progress decreases by #N 3#!.\nReligious Settlement increases by #P 2#!.\n#N 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical.\nThe project continues."

 ve_cul_evt.7.t:0 "The Initiative Loses Legitimacy"
 ve_cul_evt.7.d:0 "The Equal Citizenship Initiative in [SCOPE.sState('ve_evt_target_state').GetName] is losing support from both established institutions and the [SCOPE.sCulture('ve_evt_target_culture').GetName] communities it was meant to serve. Radical movements now portray every compromise as proof that the government cannot deliver equality."
 ve_cul_evt.7.f:0 "\"A reform may survive opposition. It cannot survive becoming unbelievable.\""
 ve_cul_evt.7.a:0 "End the initiative."
 ve_cul_evt.7.a.tt:0 "Cancel the Cultural Project with no Cultural Mandate refund.\nNational Cohesion decreases by #N 5#!.\nFor #Y 2 years#!: #N -50#! Bureaucracy, #N -25#! Authority, and #N -3%#! Law Enactment Success."
 ve_cul_evt.7.b:0 "Issue emergency local grants."
 ve_cul_evt.7.b.tt:0 "Spend #N 25#! Cultural Mandate.\nCultural Project progress decreases by #N 5#!.\n#N 1%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical.\nThe project continues."
 ve_cul_evt.7.c:0 "Continue with a minimal program."
 ve_cul_evt.7.c.tt:0 "Cultural Project progress decreases by #N 10#!.\nNational Cohesion decreases by #N 2#!.\nThe project continues."
 ve_cul_evt.7.e:0 "Rebuild the coalition."
 ve_cul_evt.7.e.tt:0 "Spend #N 15#! Cultural Mandate.\nCultural Project progress decreases by #N 3#!.\nNational Cohesion increases by #P 2#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical.\nThe project continues."

 ve_rel_evt.8.t:0 "An Unexpected Local Concord"
 ve_rel_evt.8.d:0 "Clergy, municipal officials, and community elders in [SCOPE.sState('ve_evt_target_state').GetName] have reached an agreement no central directive could have produced. Local resistance is receding, congregations are coordinating the mission themselves, and the Confessional Conversion has acquired an unexpected momentum."
 ve_rel_evt.8.f:0 "\"What began as an order from the capital has become a compact made in the town square.\""
 ve_rel_evt.8.a:0 "Use this momentum to its fullest."
 ve_rel_evt.8.a.tt:0 "Religious Settlement increases by #P 1#!.\nReligious Project progress increases by #P 25#!.\nIf progress reaches #Y 100#!, the project's normal completion effect is applied."
 ve_rel_evt.8.b:0 "Durability before speed."
 ve_rel_evt.8.b.tt:0 "Religious Settlement increases by #P 4#!.\nReligious Project progress increases by #P 10#!.\nIf progress reaches #Y 100#!, the project's normal completion effect is applied."

 ve_cul_evt.8.t:0 "A Local Civic Coalition"
 ve_cul_evt.8.d:0 "Teachers, municipal officials, trade associations, and representatives of the [SCOPE.sCulture('ve_evt_target_culture').GetName] community in [SCOPE.sState('ve_evt_target_state').GetName] have formed a common committee. By resolving disputes before they reach the capital, this coalition has given the Equal Citizenship Initiative a momentum the administration could not manufacture."
 ve_cul_evt.8.f:0 "\"Citizenship became real when institutions that seldom shared a table began sharing responsibility.\""
 ve_cul_evt.8.a:0 "Use the coalition's momentum."
 ve_cul_evt.8.a.tt:0 "National Cohesion increases by #P 1#!.\nCultural Project progress increases by #P 25#!.\nIf progress reaches #Y 100#!, the project's normal completion effect is applied."
 ve_cul_evt.8.b:0 "Make the institutions permanent."
 ve_cul_evt.8.b.tt:0 "National Cohesion increases by #P 4#!.\nCultural Project progress increases by #P 10#!.\nIf progress reaches #Y 100#!, the project's normal completion effect is applied."

 ve_rel_evt.40.t:0 "Records Out of Step"
 ve_rel_evt.40.d:0 "Provincial registers in [SCOPE.sState('ve_evt_target_state').GetName] use incompatible categories for congregations, civic associations, and public institutions. Reports reaching the capital now contradict one another, leaving the project unable to tell compliance from resistance."
 ve_rel_evt.40.f:0 "\"A policy administered through three ledgers soon acquires three different realities.\""
 ve_rel_evt.40.a:0 "Send a central audit."
 ve_rel_evt.40.a.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 5#!.\nReligious Settlement increases by #P 1#!."
 ve_rel_evt.40.b:0 "Reconcile the records locally."
 ve_rel_evt.40.b.tt:0 "Religious Project progress decreases by #N 3#!.\nReligious Settlement increases by #P 2#!."
 ve_rel_evt.40.c:0 "Apply the standard registry procedure."
 ve_rel_evt.40.c.tt:0 "Spend #N 5#! Piety Reform.\nReligious Project progress increases by #P 4#!.\nReligious Settlement increases by #P 1#!."

 ve_rel_evt.41.t:0 "A Shortage of Provincial Staff"
 ve_rel_evt.41.d:0 "The offices directing the project in [SCOPE.sState('ve_evt_target_state').GetName] cannot find enough trained clerks, teachers, and inspectors. Directives are accumulating faster than local officials can interpret them, and hurried appointments threaten to make every dispute worse."
 ve_rel_evt.41.f:0 "\"The decree arrived in a day. The people able to carry it out may take a generation.\""
 ve_rel_evt.41.a:0 "Finance a new cadre of officials."
 ve_rel_evt.41.a.tt:0 "Spend #N 15#! Piety Reform.\nReligious Project progress increases by #P 6#!."
 ve_rel_evt.41.b:0 "Slow the implementation."
 ve_rel_evt.41.b.tt:0 "Religious Project progress decreases by #N 6#!.\nReligious Settlement increases by #P 2#!."
 ve_rel_evt.41.c:0 "Use the existing education network."
 ve_rel_evt.41.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 5#!.\nReligious Settlement increases by #P 1#!."

 ve_rel_evt.42.t:0 "Rumours Across the District"
 ve_rel_evt.42.d:0 "Rumours in [SCOPE.sState('ve_evt_target_state').GetName] claim that the project conceals measures far harsher than those announced by the government. Religious organizers and local agitators repeat contradictory stories, while official silence gives each new version room to spread."
 ve_rel_evt.42.f:0 "\"A rumour requires no office, no budget, and no signature.\""
 ve_rel_evt.42.a:0 "Publish the reports."
 ve_rel_evt.42.a.tt:0 "Religious Project progress decreases by #N 3#!.\nReligious Settlement increases by #P 4#!."
 ve_rel_evt.42.b:0 "Dismiss the agitation."
 ve_rel_evt.42.b.tt:0 "Religious Project progress increases by #P 5#!.\nReligious Settlement decreases by #N 3#!.\n#N 1%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_rel_evt.42.c:0 "Commission local mediators."
 ve_rel_evt.42.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 4#!.\nReligious Settlement increases by #P 2#!.\n#P 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Loyalist."

 ve_rel_evt.43.t:0 "The Administration at Breaking Point"
 ve_rel_evt.43.d:0 "The project in [SCOPE.sState('ve_evt_target_state').GetName] is approaching administrative collapse. Provincial offices are overwhelmed, public confidence has broken down, and organized opposition now treats each new directive as evidence that the government has lost control."
 ve_rel_evt.43.f:0 "\"When the files stop moving, the crisis moves into the streets.\""
 ve_rel_evt.43.a:0 "End the program."
 ve_rel_evt.43.a.tt:0 "Cancel the Religious Project with no Piety Reform refund.\nReligious Settlement decreases by #N 5#!.\nFor #Y 2 years#!: #N -50#! Bureaucracy, #N -50#! Authority, and #N -3%#! Law Enactment Success."
 ve_rel_evt.43.b:0 "Transfer emergency resources."
 ve_rel_evt.43.b.tt:0 "Spend #N 25#! Piety Reform.\nReligious Project progress decreases by #N 5#!.\n#N 1%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical.\nThe project continues."
 ve_rel_evt.43.c:0 "Continue with a skeleton staff."
 ve_rel_evt.43.c.tt:0 "Religious Project progress decreases by #N 10#!.\nReligious Settlement decreases by #N 2#!.\nThe project continues."
 ve_rel_evt.43.e:0 "Rebuild the local partnership."
 ve_rel_evt.43.e.tt:0 "Spend #N 15#! Piety Reform.\nReligious Project progress decreases by #N 3#!.\nReligious Settlement increases by #P 2#!.\n#N 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical.\nThe project continues."

 ve_rel_evt.100.t:0 "Seats on the Interfaith Council"
 ve_rel_evt.100.d:0 "Delegates in [SCOPE.sState('ve_evt_target_state').GetName] agree that an interfaith council is necessary but not on who deserves a seat. Proportional representation would reassure smaller communities, while a fixed settlement designed in the capital could begin work immediately."
 ve_rel_evt.100.f:0 "\"Everyone supports a common table until the chairs are counted.\""
 ve_rel_evt.100.a:0 "Distribute representation by population."
 ve_rel_evt.100.a.tt:0 "Religious Project progress decreases by #N 3#!.\nReligious Settlement increases by #P 4#!."
 ve_rel_evt.100.b:0 "Impose a fixed central compromise."
 ve_rel_evt.100.b.tt:0 "Religious Project progress increases by #P 5#!.\nReligious Settlement decreases by #N 2#!.\n#N 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_rel_evt.100.c:0 "Empower the Interfaith Councils."
 ve_rel_evt.100.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 5#!.\nReligious Settlement increases by #P 2#!."

 ve_rel_evt.101.t:0 "A Shared School Curriculum"
 ve_rel_evt.101.d:0 "Schools in [SCOPE.sState('ve_evt_target_state').GetName] need common civic lessons without turning the Freedom Outreach into a campaign against local belief. Teachers request clear materials and joint training, while community leaders insist that local instruction retain room for their traditions."
 ve_rel_evt.101.f:0 "\"A shared lesson succeeds only if every family recognizes the classroom as theirs.\""
 ve_rel_evt.101.a:0 "Finance a common teaching cadre."
 ve_rel_evt.101.a.tt:0 "Spend #N 15#! Piety Reform.\nReligious Project progress increases by #P 6#!.\nReligious Settlement increases by #P 1#!."
 ve_rel_evt.101.b:0 "Leave room for local curricula."
 ve_rel_evt.101.b.tt:0 "Religious Project progress decreases by #N 4#!.\nReligious Settlement increases by #P 3#!."
 ve_rel_evt.101.c:0 "Bring the reform coalition into the schools."
 ve_rel_evt.101.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 5#!.\nReligious Settlement increases by #P 2#!.\n#P 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Loyalist."

 ve_rel_evt.102.t:0 "A Charter of Mutual Guarantees"
 ve_rel_evt.102.d:0 "Religious communities, municipal officials, and reform associations in [SCOPE.sState('ve_evt_target_state').GetName] have drafted a common charter. Each signatory accepts the same civic obligations in exchange for public guarantees that no community will be excluded from local institutions."
 ve_rel_evt.102.f:0 "\"Trust became possible when every promise was written as another party's right.\""
 ve_rel_evt.102.a:0 "Use the compact's momentum."
 ve_rel_evt.102.a.tt:0 "Religious Settlement increases by #P 2#!.\nReligious Project progress increases by #P 20#!.\nIf progress reaches #Y 100#!, the project's normal completion effect is applied."
 ve_rel_evt.102.b:0 "Make the guarantees permanent."
 ve_rel_evt.102.b.tt:0 "Religious Settlement increases by #P 4#!.\n#P 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Loyalist.\nReligious Project progress increases by #P 10#!.\nIf progress reaches #Y 100#!, the project's normal completion effect is applied."

 ve_rel_evt.150.t:0 "Teachers or Inspectors?"
 ve_rel_evt.150.d:0 "The Secularization Campaign in [SCOPE.sState('ve_evt_target_state').GetName] has exposed a shortage of literate personnel. The administration can expand the teaching corps that builds long-term civic capacity, or rely on inspectors who can enforce the new rules with the staff already available."
 ve_rel_evt.150.f:0 "\"An inspector can close a school in an afternoon. A teacher may need years to replace what was taught there.\""
 ve_rel_evt.150.a:0 "Expand the teaching corps."
 ve_rel_evt.150.a.tt:0 "Spend #N 15#! Piety Reform.\nReligious Project progress increases by #P 6#!."
 ve_rel_evt.150.b:0 "Slow the program to match existing staff."
 ve_rel_evt.150.b.tt:0 "Religious Project progress decreases by #N 5#!.\nReligious Settlement increases by #P 2#!."
 ve_rel_evt.150.c:0 "Commission the public education network."
 ve_rel_evt.150.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 5#!.\nReligious Settlement increases by #P 1#!."

 ve_rel_evt.151.t:0 "The Seized Properties"
 ve_rel_evt.151.d:0 "Former religious properties in [SCOPE.sState('ve_evt_target_state').GetName] stand ready for conversion into schools, clinics, and civic offices. Immediate transfer would give the campaign valuable infrastructure, but the absence of compensation is becoming a rallying point for the Devout."
 ve_rel_evt.151.f:0 "\"The keys changed hands in a morning. The argument over ownership will outlive the locks.\""
 ve_rel_evt.151.a:0 "Pay compensation in stages."
 ve_rel_evt.151.a.tt:0 "Spend #N 15#! Piety Reform.\nReligious Project progress increases by #P 3#!.\nReligious Settlement increases by #P 3#!."
 ve_rel_evt.151.b:0 "Put the properties into public service immediately."
 ve_rel_evt.151.b.tt:0 "Religious Project progress increases by #P 7#!.\nReligious Settlement decreases by #N 4#!.\n#N 1%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical.\nThe Devout lose #N 1#! Approval for #Y 2.5 years#!."
 ve_rel_evt.151.c:0 "Transfer them to secular welfare institutions."
 ve_rel_evt.151.c.tt:0 "Spend #N 10#! Piety Reform.\nReligious Project progress increases by #P 5#!.\nReligious Settlement increases by #P 2#!.\n#P 0.5%#! of the population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Loyalist."

 ve_rel_evt.152.t:0 "Civic Associations Take Root"
 ve_rel_evt.152.d:0 "Teachers' circles, mutual-aid societies, and municipal associations in [SCOPE.sState('ve_evt_target_state').GetName] have begun providing services once organized through religious institutions. Their cooperation has given the Secularization Campaign a local civic foundation instead of merely an administrative presence."
 ve_rel_evt.152.f:0 "\"The new order endured when citizens began maintaining it without waiting for an inspector.\""
 ve_rel_evt.152.a:0 "Use the local momentum."
 ve_rel_evt.152.a.tt:0 "Religious Settlement increases by #P 2#!.\nReligious Project progress increases by #P 20#!.\nIf progress reaches #Y 100#!, the project's normal completion effect is applied."
 ve_rel_evt.152.b:0 "Turn the associations into permanent institutions."
 ve_rel_evt.152.b.tt:0 "Religious Settlement increases by #P 4#!.\nReligious Project progress increases by #P 10#!.\nIf progress reaches #Y 100#!, the project's normal completion effect is applied."

 ve_cul_evt.40.t:0 "Local School Boards"
 ve_cul_evt.40.d:0 "School boards in [SCOPE.sState('ve_evt_target_state').GetName] disagree over the place of the [SCOPE.sCulture('ve_evt_target_culture').GetName] language in public instruction. Local-language teaching would preserve trust, while a single administrative language would make the national project easier to direct."
 ve_cul_evt.40.f:0 "\"The language chosen for the first lesson often decides who believes the school belongs to them.\""
 ve_cul_evt.40.a:0 "Protect the local language."
 ve_cul_evt.40.a.tt:0 "Cultural Project progress decreases by #N 4#!.\nNational Cohesion increases by #P 3#!."
 ve_cul_evt.40.b:0 "Impose one administrative language."
 ve_cul_evt.40.b.tt:0 "Cultural Project progress increases by #P 5#!.\nNational Cohesion decreases by #N 2#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.40.c:0 "Expand the teacher network."
 ve_cul_evt.40.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 4#!.\nNational Cohesion increases by #P 2#!."

 ve_cul_evt.41.t:0 "Statistical Boundaries"
 ve_cul_evt.41.d:0 "Officials surveying [SCOPE.sState('ve_evt_target_state').GetName] cannot agree where the [SCOPE.sCulture('ve_evt_target_culture').GetName] community begins and ends. Local identities overlap across language, district, and custom, but the national project demands categories that can be counted and administered."
 ve_cul_evt.41.f:0 "\"A boundary drawn for the census soon acquires officials, budgets, and defenders.\""
 ve_cul_evt.41.a:0 "Leave room for self-identification."
 ve_cul_evt.41.a.tt:0 "Cultural Project progress decreases by #N 3#!.\nNational Cohesion increases by #P 3#!."
 ve_cul_evt.41.b:0 "Let the center define the boundaries."
 ve_cul_evt.41.b.tt:0 "Cultural Project progress increases by #P 6#!.\nNational Cohesion decreases by #N 3#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.41.c:0 "Use the standard registry system."
 ve_cul_evt.41.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 5#!.\nNational Cohesion increases by #P 1#!."

 ve_cul_evt.42.t:0 "The National Project at Breaking Point"
 ve_cul_evt.42.d:0 "The national project in [SCOPE.sState('ve_evt_target_state').GetName] is approaching collapse. Radical movements claim that the government has either betrayed the [SCOPE.sCulture('ve_evt_target_culture').GetName] community or surrendered to it, while local offices no longer possess the confidence to enforce another compromise."
 ve_cul_evt.42.f:0 "\"A settlement attacked as both coercion and surrender may soon cease to be a settlement at all.\""
 ve_cul_evt.42.a:0 "End the project."
 ve_cul_evt.42.a.tt:0 "Cancel the Cultural Project with no Cultural Mandate refund.\nNational Cohesion decreases by #N 5#!.\nFor #Y 2 years#!: #N -50#! Bureaucracy, #N -25#! Authority, and #N -3%#! Law Enactment Success."
 ve_cul_evt.42.b:0 "Transfer emergency local resources."
 ve_cul_evt.42.b.tt:0 "Spend #N 25#! Cultural Mandate.\nCultural Project progress decreases by #N 5#!.\n#N 1%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical.\nThe project continues."
 ve_cul_evt.42.c:0 "Continue with a minimal program."
 ve_cul_evt.42.c.tt:0 "Cultural Project progress decreases by #N 10#!.\nNational Cohesion decreases by #N 2#!.\nThe project continues."
 ve_cul_evt.42.e:0 "Rebuild the negotiating framework."
 ve_cul_evt.42.e.tt:0 "Spend #N 15#! Cultural Mandate.\nCultural Project progress decreases by #N 3#!.\nNational Cohesion increases by #P 2#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical.\nThe project continues."

 ve_cul_evt.50.t:0 "The Surname and Language Directive"
 ve_cul_evt.50.d:0 "Officials in [SCOPE.sState('ve_evt_target_state').GetName] propose standardizing surnames and public records in the national language. The directive would make the [SCOPE.sCulture('ve_evt_target_culture').GetName] population easier for the central administration to classify, but families fear that private identity is becoming an object of state command."
 ve_cul_evt.50.f:0 "\"A name written differently in the register may still be the name by which a family remembers itself.\""
 ve_cul_evt.50.a:0 "Fund a gradual registration campaign."
 ve_cul_evt.50.a.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 4#!.\nNational Cohesion increases by #P 1#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.50.b:0 "Enforce one national standard."
 ve_cul_evt.50.b.tt:0 "Cultural Project progress increases by #P 7#!.\nNational Cohesion decreases by #N 4#!.\n#N 1%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.50.c:0 "Withdraw the directive for revision."
 ve_cul_evt.50.c.tt:0 "Cultural Project progress decreases by #N 5#!.\nNational Cohesion increases by #P 3#!."

 ve_cul_evt.51.t:0 "The Conscription Registers"
 ve_cul_evt.51.d:0 "Military officials in [SCOPE.sState('ve_evt_target_state').GetName] demand a single register for service obligations, surnames, and commands. Applying it to the [SCOPE.sCulture('ve_evt_target_culture').GetName] population would strengthen the Ethnic Integration drive, yet resistance is growing among communities that see the army as another instrument of cultural erasure."
 ve_cul_evt.51.f:0 "\"The state first learns a village's names when it wishes to collect its taxes or summon its sons.\""
 ve_cul_evt.51.a:0 "Apply the national registers."
 ve_cul_evt.51.a.tt:0 "Cultural Project progress increases by #P 5#!.\nNational Cohesion decreases by #N 2#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.51.b:0 "Preserve local registration practices."
 ve_cul_evt.51.b.tt:0 "Cultural Project progress decreases by #N 3#!.\nNational Cohesion increases by #P 3#!."
 ve_cul_evt.51.c:0 "Integrate the registers through military service."
 ve_cul_evt.51.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 6#!.\nNational Cohesion increases by #P 1#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."

 ve_cul_evt.100.t:0 "The Constituent Delegation"
 ve_cul_evt.100.d:0 "A delegation from the [SCOPE.sCulture('ve_evt_target_culture').GetName] community in [SCOPE.sState('ve_evt_target_state').GetName] has arrived with demands for representation in the institutions of the Constituent Compact. Negotiation would slow the project but strengthen its legitimacy; a settlement imposed from the capital could move faster at the cost of trust."
 ve_cul_evt.100.f:0 "\"A compact becomes common only when every constituent can point to a clause they helped write.\""
 ve_cul_evt.100.a:0 "Negotiate their place in the compact."
 ve_cul_evt.100.a.tt:0 "Cultural Project progress decreases by #N 4#!.\nNational Cohesion increases by #P 4#!."
 ve_cul_evt.100.b:0 "Impose the central settlement."
 ve_cul_evt.100.b.tt:0 "Cultural Project progress increases by #P 5#!.\nNational Cohesion decreases by #N 2#!.\n#N 0.5%#! of the [SCOPE.sCulture('ve_evt_target_culture').GetName] population in [SCOPE.sState('ve_evt_target_state').GetName] becomes Radical."
 ve_cul_evt.100.c:0 "Bring the parliamentary coalition into the talks."
 ve_cul_evt.100.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 4#!.\nNational Cohesion increases by #P 2#!."

 ve_cul_evt.101.t:0 "Dual Administration"
 ve_cul_evt.101.d:0 "The Constituent Compact in [SCOPE.sState('ve_evt_target_state').GetName] now depends on two overlapping administrations. Central officials and representatives of the [SCOPE.sCulture('ve_evt_target_culture').GetName] community duplicate registers, dispute appointments, and issue contradictory instructions while the country's bureaucracy approaches exhaustion."
 ve_cul_evt.101.f:0 "\"Two offices can share authority more easily than they can share a filing cabinet.\""
 ve_cul_evt.101.a:0 "Finance a joint administrative staff."
 ve_cul_evt.101.a.tt:0 "Spend #N 15#! Cultural Mandate.\nCultural Project progress increases by #P 6#!."
 ve_cul_evt.101.b:0 "Slow the compact until the offices agree."
 ve_cul_evt.101.b.tt:0 "Cultural Project progress decreases by #N 6#!.\nNational Cohesion increases by #P 2#!."
 ve_cul_evt.101.c:0 "Unify the offices under the civil service."
 ve_cul_evt.101.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 5#!.\nNational Cohesion increases by #P 2#!."

 ve_cul_evt.150.t:0 "Implementation in the Provinces"
 ve_cul_evt.150.d:0 "Provincial administrations report that the nationwide cultural project is advancing at radically different speeds. Some offices demand funded implementation commissions, while others warn that forcing a single timetable upon every region will consume scarce personnel and weaken public confidence."
 ve_cul_evt.150.f:0 "\"A national decree is written once, but it must be implemented in every office of the country.\""
 ve_cul_evt.150.a:0 "Finance the implementation commissions."
 ve_cul_evt.150.a.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 5#!."
 ve_cul_evt.150.b:0 "Use a gradual timetable."
 ve_cul_evt.150.b.tt:0 "Cultural Project progress decreases by #N 4#!.\nNational Cohesion increases by #P 2#!."
 ve_cul_evt.150.c:0 "Standardize the existing administration."
 ve_cul_evt.150.c.tt:0 "Spend #N 5#! Cultural Mandate.\nCultural Project progress increases by #P 3#!.\nNational Cohesion increases by #P 2#!."

 ve_cul_evt.151.t:0 "The Language of Instruction"
 ve_cul_evt.151.d:0 "The National Curriculum requires a common language of instruction, yet schools across the country serve communities with very different linguistic traditions. Multilingual materials would preserve confidence but delay distribution, while a single curriculum could reach classrooms quickly at the risk of turning education into a cultural contest."
 ve_cul_evt.151.f:0 "\"A lesson taught in a language the pupil distrusts may be remembered for everything except its subject.\""
 ve_cul_evt.151.a:0 "Finance multilingual materials."
 ve_cul_evt.151.a.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 3#!.\nNational Cohesion increases by #P 3#!."
 ve_cul_evt.151.b:0 "Apply one national curriculum."
 ve_cul_evt.151.b.tt:0 "Cultural Project progress increases by #P 6#!.\nNational Cohesion decreases by #N 3#!."
 ve_cul_evt.151.c:0 "Unite the teaching and welfare networks."
 ve_cul_evt.151.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 5#!.\nNational Cohesion increases by #P 2#!."

 ve_cul_evt.160.t:0 "Who Represents the Nation?"
 ve_cul_evt.160.d:0 "The Shared Symbols project has reopened the question of whose history, uniforms, monuments, and ceremonies can stand for the entire country. Rotating traditions would broaden recognition but slow agreement; selecting one official narrative would create clarity while leaving many citizens outside it."
 ve_cul_evt.160.f:0 "\"A symbol becomes national only when citizens see themselves in it without needing an explanation.\""
 ve_cul_evt.160.a:0 "Rotate the symbols in public use."
 ve_cul_evt.160.a.tt:0 "Cultural Project progress decreases by #N 3#!.\nNational Cohesion increases by #P 4#!."
 ve_cul_evt.160.b:0 "Select one official narrative."
 ve_cul_evt.160.b.tt:0 "Cultural Project progress increases by #P 6#!.\nNational Cohesion decreases by #N 3#!."
 ve_cul_evt.160.c:0 "Design a shared public ceremony."
 ve_cul_evt.160.c.tt:0 "Spend #N 10#! Cultural Mandate.\nCultural Project progress increases by #P 4#!.\nNational Cohesion increases by #P 2#!."
