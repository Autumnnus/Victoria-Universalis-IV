 ve_doctrine_journey_general_staff_reform_mdf:0 "Institutional General Staff"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Staff colleges, mobilization tables, and common training standards have become a durable part of the armed forces."

 ve_doctrine_journey.1.t:0 "Standardizing the Factory System"
 ve_doctrine_journey.1.d:0 "Industrial associations propose a national effort to align machinery, inspections, and manufacturing practice. The undertaking would last five years and demand sustained industrial scale and administrative stability."
 ve_doctrine_journey.1.a:0 "Begin the standardization effort."
 ve_doctrine_journey.1.b:0 "Reconsider the proposal in five years."
 ve_doctrine_journey.1.c:0 "Our factories need no national doctrine."
 ve_doctrine_journey.2.t:0 "A Republic of Scholars"
 ve_doctrine_journey.2.d:0 "Rectors and learned societies propose a five-year effort to connect universities into a durable national community of research. Its success would depend on both academic capacity and the spread of literacy."
 ve_doctrine_journey.2.a:0 "Sponsor the republic of scholars."
 ve_doctrine_journey.2.b:0 "Return to the proposal in five years."
 ve_doctrine_journey.2.c:0 "Learning should remain locally organized."
 ve_doctrine_journey.3.t:0 "Reforming the General Staff"
 ve_doctrine_journey.3.d:0 "Senior officers propose a five-year reform of training, planning, and mobilization. The general staff would have to prove that professional doctrine can survive beyond a circle of favored commanders."
 ve_doctrine_journey.3.a:0 "Commission the general staff reform."
 ve_doctrine_journey.3.b:0 "Review the plans again in five years."
 ve_doctrine_journey.3.c:0 "The existing command system is sufficient."

 ve_doctrine_journey_start_tt:0 "Starts this five-year Doctrine Journey. Only one Doctrine Journey can be active at a time."
 ve_doctrine_journey_defer_tt:0 "Defers this group's offer for #Y 5 years#!. It may be offered again afterwards."
 ve_doctrine_journey_decline_tt:0 "Permanently declines this group's Doctrine Journey."

 ve_doctrine_journey.10.t:0 "Measures and Tolerances"
 ve_doctrine_journey.10.d:0 "Factories use incompatible gauges, fittings, and tolerances. Engineers urge the state to impose one catalogue, while provincial manufacturers warn that a rigid standard may freeze useful local practice."
 ve_doctrine_journey.10.a:0 "Fund a national catalogue of standards."
 ve_doctrine_journey.10.a.tt:0 "Spend #N 15#! National Insight.\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.10.b:0 "Allow compatible regional standards."
 ve_doctrine_journey.10.b.tt:0 "The Journey continues without an immediate resource or progress change."
 ve_doctrine_journey.10.c:0 "Use the construction offices to coordinate adoption."
 ve_doctrine_journey.10.c.tt:0 "Requires Industrialist Idea V.\nSpend #N 10#! National Insight.\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.11.t:0 "The National Inspectorate"
 ve_doctrine_journey.11.d:0 "The first common standards now require enforcement. Officials propose a central inspectorate, manufacturers prefer self-certification, and experienced industrial planners argue for auditing both."
 ve_doctrine_journey.11.a:0 "Establish a central industrial inspectorate."
 ve_doctrine_journey.11.a.tt:0 "Spend #N 15#! National Insight.\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.11.b:0 "Recognize industry self-certification."
 ve_doctrine_journey.11.b.tt:0 "The Journey continues without an immediate resource or progress change."
 ve_doctrine_journey.11.c:0 "Audit inspectors and manufacturers through one system."
 ve_doctrine_journey.11.c.tt:0 "Requires Industrialist Idea VII.\nSpend #N 10#! National Insight.\nJourney progress increases by #P 4#!."

 ve_doctrine_journey.20.t:0 "Open Chairs"
 ve_doctrine_journey.20.d:0 "Universities disagree over whether new chairs should answer to local faculties, national priorities, or a public teaching mandate. The first appointments will define how freely the scholarly network exchanges people and ideas."
 ve_doctrine_journey.20.a:0 "Fund a coordinated national chair program."
 ve_doctrine_journey.20.a.tt:0 "Spend #N 15#! National Insight.\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.20.b:0 "Let each faculty define its own chairs."
 ve_doctrine_journey.20.b.tt:0 "The Journey continues without an immediate resource or progress change."
 ve_doctrine_journey.20.c:0 "Tie the chairs to a public lecture network."
 ve_doctrine_journey.20.c.tt:0 "Requires Academic Idea V.\nSpend #N 10#! National Insight.\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.21.t:0 "A Republic of Referees"
 ve_doctrine_journey.21.d:0 "Research now moves between institutions faster than old patronage can judge it. Scholars propose national peer review, while established academies defend selective invitation and disciplinary independence."
 ve_doctrine_journey.21.a:0 "Finance a national peer-review service."
 ve_doctrine_journey.21.a.tt:0 "Spend #N 15#! National Insight.\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.21.b:0 "Leave review to the learned societies."
 ve_doctrine_journey.21.b.tt:0 "The Journey continues without an immediate resource or progress change."
 ve_doctrine_journey.21.c:0 "Convene cross-disciplinary review councils."
 ve_doctrine_journey.21.c.tt:0 "Requires Academic Idea VII.\nSpend #N 10#! National Insight.\nJourney progress increases by #P 4#!."

 ve_doctrine_journey.30.t:0 "The Staff College"
 ve_doctrine_journey.30.d:0 "The new staff college must decide what makes an officer fit for command. Reformers demand examinations and common instruction, while established commanders defend seniority and the judgment earned in field service."
 ve_doctrine_journey.30.a:0 "Fund national examinations and a common curriculum."
 ve_doctrine_journey.30.a.tt:0 "Spend #N 15#! National Insight.\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.30.b:0 "Balance seniority with the college's recommendations."
 ve_doctrine_journey.30.b.tt:0 "The Journey continues without an immediate resource or progress change."
 ve_doctrine_journey.30.c:0 "Rotate field officers through the staff classrooms."
 ve_doctrine_journey.30.c.tt:0 "Requires Professional Army Idea V.\nSpend #N 10#! National Insight.\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.31.t:0 "The Mobilization Tables"
 ve_doctrine_journey.31.d:0 "Planners have produced competing schedules for men, supplies, and rail transport. A single national table promises coordination, but regional commands warn that rigid timetables will ignore local capacity."
 ve_doctrine_journey.31.a:0 "Finance a central mobilization bureau."
 ve_doctrine_journey.31.a.tt:0 "Spend #N 15#! National Insight.\nJourney progress increases by #P 4#!."
 ve_doctrine_journey.31.b:0 "Let regional commands maintain compatible schedules."
 ve_doctrine_journey.31.b.tt:0 "The Journey continues without an immediate resource or progress change."
 ve_doctrine_journey.31.c:0 "Integrate railway, depot, and command planning."
 ve_doctrine_journey.31.c.tt:0 "Requires Professional Army Idea VII.\nSpend #N 10#! National Insight.\nJourney progress increases by #P 4#!."
