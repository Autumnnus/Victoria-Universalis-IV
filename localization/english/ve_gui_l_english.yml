 ve_send_missionary_tt:0 "#variable The Missionary converts the religion of the local people every #gold 6 months.\n\n#white If State Population is under 250k: #darker_white 0% #white Base Conversion Base Power Decay\n#white If State Population is under 500k: #negative_value -0.02% #white Conversion Base Power Decay\n#white If State Population is under 750k: #negative_value -0.03% #white Conversion Base Power Decay\n#white If State Population is under 1m: #negative_value -0.04% #white Conversion Base Power Decay\n#white If State Population is under 5m: #negative_value -0.043% #white Conversion Base Power Decay\n#white If State Population is under 10m: #negative_value -0.045% #white Conversion Base Power Decay\n#white If State Population is over 10m+: #negative_value -0.0475% #white Conversion Base Power Decay"
