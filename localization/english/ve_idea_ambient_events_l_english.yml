l_english:
 ve_doctrine_ambient_cooldown_mdf:0 "Doctrine Debate Cooldown"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "The country's institutions are absorbing the consequences of a recent doctrine debate."
 ve_doctrine_ambient_ig_supported_mdf:0 "Institutional Support"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "The government has given this Interest Group a visible role in settling a doctrine debate."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Institutional Slight"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "The government has excluded this Interest Group from a recent doctrine settlement."

 ve_doctrine_industrialist_positive_mdf:0 "Standardized Industrial Practice"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Manufacturers are benefiting from a coordinated body of industrial practice."
 ve_doctrine_industrialist_negative_mdf:0 "Industrial Bottlenecks"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Unresolved coordination failures are constraining manufacturing."
 ve_doctrine_academic_positive_mdf:0 "Coordinated Research Network"
 ve_doctrine_academic_positive_mdf_desc:0 "Universities are sharing methods, staff, and results through a coordinated network."
 ve_doctrine_academic_negative_mdf:0 "Academic Bottlenecks"
 ve_doctrine_academic_negative_mdf_desc:0 "Credential and coordination disputes are disrupting the universities."
 ve_doctrine_nationalist_positive_mdf:0 "National Association Network"
 ve_doctrine_nationalist_positive_mdf_desc:0 "National associations are translating legitimate government into broader loyalty."
 ve_doctrine_nationalist_negative_mdf:0 "Competing National Societies"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Rival national organizations are turning political legitimacy into new grievances."
 ve_doctrine_reformist_positive_mdf:0 "Organized Reform Network"
 ve_doctrine_reformist_positive_mdf_desc:0 "Political movements have gained orderly channels for participation and compromise."
 ve_doctrine_reformist_negative_mdf:0 "Fractured Reform Coalition"
 ve_doctrine_reformist_negative_mdf_desc:0 "Competing reform organizations are converting political mobilization into radicalism."
 ve_doctrine_professional_army_positive_mdf:0 "Staff Training Cycle"
 ve_doctrine_professional_army_positive_mdf_desc:0 "A coordinated staff program is improving the army's training system."
 ve_doctrine_professional_army_negative_mdf:0 "Officer Corps Bottleneck"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Promotion and staffing disputes are slowing military training."
 ve_doctrine_agrarian_positive_mdf:0 "Coordinated Agricultural Practice"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Rural institutions are spreading reliable methods across the agricultural economy."
 ve_doctrine_agrarian_negative_mdf:0 "Agricultural Supply Shortage"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Shortages of seed, credit, and coordination are reducing agricultural throughput."

 ve_idea_evt.10.t:0 "Safety Codes at Full Output"
 ve_idea_evt.10.d:0 "A series of factory accidents has forced the question of industrial inspection into the open. Independent inspectors promise credible standards, while manufacturers insist that voluntary rules will preserve output and initiative."
 ve_idea_evt.10.a:0 "Appoint independent inspectors."
 ve_idea_evt.10.a.tt:0 "Spend #N 25#! National Insight. The Trade Unions gain #P +1#! Approval and the Industrialists lose #N 1#! Approval for 24 months."
 ve_idea_evt.10.b:0 "Let the industries write voluntary codes."
 ve_idea_evt.10.b.tt:0 "The Industrialists gain #P +1#! Approval and the Trade Unions lose #N 1#! Approval for 24 months."
 ve_idea_evt.10.c:0 "Standardize the rules in stages."
 ve_idea_evt.10.c.tt:0 "Spend #N 10#! National Insight. No Interest Group Approval changes."

 ve_idea_evt.11.t:0 "Standardized Machine Parts"
 ve_idea_evt.11.d:0 "Engineers from several industrial districts have produced a common catalogue of gauges, fittings, and machine parts. Funding a national standard would be costly, but could remove friction across the manufacturing network."
 ve_idea_evt.11.a:0 "Adopt the standards nationwide."
 ve_idea_evt.11.a.tt:0 "Spend #N 40#! National Insight and gain #P +5%#! Manufacturing Throughput for 36 months."
 ve_idea_evt.11.b:0 "Archive the findings for later."
 ve_idea_evt.11.b.tt:0 "Gain #P 15#! National Insight."
 ve_idea_evt.11.c:0 "Our production networks are already prepared."
 ve_idea_evt.11.c.tt:0 "Spend #N 20#! National Insight and gain #P +5%#! Manufacturing Throughput for 36 months."

 ve_idea_evt.12.t:0 "The Bottleneck at the Works"
 ve_idea_evt.12.d:0 "Orders are accumulating while incompatible procedures, delayed components, and confused schedules choke the country's factories. The government can send specialists, leave the problem to the firms, or use established construction offices to coordinate a response."
 ve_idea_evt.12.a:0 "Dispatch a specialist team."
 ve_idea_evt.12.a.tt:0 "Spend #N 25#! National Insight and avoid the industrial penalty."
 ve_idea_evt.12.b:0 "The factories must solve this themselves."
 ve_idea_evt.12.b.tt:0 "Suffer #N -5%#! Manufacturing Throughput for 24 months."
 ve_idea_evt.12.c:0 "Activate the construction bureaux."
 ve_idea_evt.12.c.tt:0 "Spend #N 10#! National Insight and avoid the industrial penalty."

 ve_idea_evt.60.t:0 "Mechanization and Tenure"
 ve_idea_evt.60.d:0 "New machinery could raise agricultural output, but tenants and smallholders fear that a rapid transition will uproot rural livelihoods. The government must decide whether to accelerate mechanization, protect tenure first, or coordinate a gradual local transition."
 ve_idea_evt.60.a:0 "Create a mechanization fund."
 ve_idea_evt.60.a.tt:0 "Spend #N 25#! National Insight and gain #P +5%#! Agriculture Throughput for 24 months. The Industrialists gain #P +1#! Approval and the Rural Folk lose #N 1#! Approval for 24 months."
 ve_idea_evt.60.b:0 "Secure the tenants before changing the farms."
 ve_idea_evt.60.b.tt:0 "The Rural Folk gain #P +1#! Approval and the Landowners lose #N 1#! Approval for 24 months."
 ve_idea_evt.60.c:0 "Use local production networks for a gradual transition."
 ve_idea_evt.60.c.tt:0 "Spend #N 10#! National Insight and gain #P +5%#! Agriculture Throughput for 24 months. No Interest Group Approval changes."

 ve_idea_evt.61.t:0 "Cooperative Granaries"
 ve_idea_evt.61.d:0 "Rural delegates have demonstrated a network of cooperative granaries capable of sharing reserves, records, and transport. A national program could strengthen agricultural coordination, while simply preserving the plans would still enrich the government's institutional knowledge."
 ve_idea_evt.61.a:0 "Finance the cooperative network."
 ve_idea_evt.61.a.tt:0 "Spend #N 40#! National Insight and gain #P +5%#! Agriculture Throughput for 36 months."
 ve_idea_evt.61.b:0 "Distribute the records to the agricultural offices."
 ve_idea_evt.61.b.tt:0 "Gain #P 15#! National Insight."
 ve_idea_evt.61.c:0 "Use the rural institutions already in place."
 ve_idea_evt.61.c.tt:0 "Spend #N 20#! National Insight and gain #P +5%#! Agriculture Throughput for 36 months."

 ve_idea_evt.62.t:0 "Seed and Credit Shortage"
 ve_idea_evt.62.d:0 "Poor seed stocks and tightening rural credit threaten the coming agricultural cycle. Specialists can organize an emergency response, local networks can be left to improvise, or established subsistence institutions can temporarily carry the burden."
 ve_idea_evt.62.a:0 "Organize an emergency expertise program."
 ve_idea_evt.62.a.tt:0 "Spend #N 25#! National Insight and avoid the agricultural penalty."
 ve_idea_evt.62.b:0 "Let local networks find their own solution."
 ve_idea_evt.62.b.tt:0 "Suffer #N -5%#! Agriculture Throughput for 24 months."
 ve_idea_evt.62.c:0 "Use subsistence networks as a temporary backbone."
 ve_idea_evt.62.c.tt:0 "Spend #N 10#! National Insight and avoid the agricultural penalty."

 ve_idea_evt.20.t:0 "Patronage or Peer Review"
 ve_idea_evt.20.d:0 "The government expects practical results from its research grants, while scholars warn that patronage will replace evidence with political convenience. A durable settlement must define who judges the country's learning."
 ve_idea_evt.20.a:0 "Establish independent review boards."
 ve_idea_evt.20.a.tt:0 "Spend #N 25#! National Insight. The Intelligentsia gain #P +1#! Approval and the Petite Bourgeoisie lose #N 1#! Approval for 24 months."
 ve_idea_evt.20.b:0 "Let the state define research priorities."
 ve_idea_evt.20.b.tt:0 "The Petite Bourgeoisie gain #P +1#! Approval and the Intelligentsia lose #N 1#! Approval for 24 months."
 ve_idea_evt.20.c:0 "Institutionalize common academic standards."
 ve_idea_evt.20.c.tt:0 "Spend #N 10#! National Insight. No Interest Group Approval changes."
 ve_idea_evt.21.t:0 "A Provincial Research Network"
 ve_idea_evt.21.d:0 "Provincial colleges have begun exchanging lecturers, instruments, and findings without central direction. Formal support could turn this improvised cooperation into a national research network."
 ve_idea_evt.21.a:0 "Finance the network."
 ve_idea_evt.21.a.tt:0 "Spend #N 40#! National Insight and gain #P +5%#! University Throughput for 36 months."
 ve_idea_evt.21.b:0 "Place the reports in the central archive."
 ve_idea_evt.21.b.tt:0 "Gain #P 15#! National Insight."
 ve_idea_evt.21.c:0 "Connect it to the national academy."
 ve_idea_evt.21.c.tt:0 "Spend #N 20#! National Insight and gain #P +5%#! University Throughput for 36 months."
 ve_idea_evt.22.t:0 "The Credential Bottleneck"
 ve_idea_evt.22.d:0 "Universities cannot evaluate the growing number of students, instructors, and new disciplines quickly enough. Delayed credentials now threaten the wider research system."
 ve_idea_evt.22.a:0 "Expand evaluation capacity."
 ve_idea_evt.22.a.tt:0 "Spend #N 25#! National Insight and avoid the academic penalty."
 ve_idea_evt.22.b:0 "The existing institutions must cope."
 ve_idea_evt.22.b.tt:0 "Suffer #N -5%#! University Throughput for 24 months."
 ve_idea_evt.22.c:0 "Standardize through the school network."
 ve_idea_evt.22.c.tt:0 "Spend #N 10#! National Insight and avoid the academic penalty."

 ve_idea_evt.30.t:0 "One Canon, Many Traditions"
 ve_idea_evt.30.d:0 "Officials preparing a national canon disagree over the place of provincial customs. A single account promises clarity, but excluding local traditions may weaken the very nation it intends to define."
 ve_idea_evt.30.a:0 "Weave local traditions into the common story."
 ve_idea_evt.30.a.tt:0 "Spend #N 25#! National Insight. The Rural Folk gain #P +1#! Approval and the Petite Bourgeoisie lose #N 1#! Approval for 24 months."
 ve_idea_evt.30.b:0 "Proclaim one official canon."
 ve_idea_evt.30.b.tt:0 "The Petite Bourgeoisie gain #P +1#! Approval and the Rural Folk lose #N 1#! Approval for 24 months."
 ve_idea_evt.30.c:0 "Entrust the work to trained cultural cadres."
 ve_idea_evt.30.c.tt:0 "Spend #N 10#! National Insight. No Interest Group Approval changes."
 ve_idea_evt.31.t:0 "Veterans' National Associations"
 ve_idea_evt.31.d:0 "Veterans have organized associations that link ceremony, mutual aid, and loyalty to the state. Their network could be expanded nationwide or studied without granting it an official role."
 ve_idea_evt.31.a:0 "Support the associations nationwide."
 ve_idea_evt.31.a.tt:0 "Spend #N 40#! National Insight and gain #P +5%#! Loyalists from Legitimacy for 36 months."
 ve_idea_evt.31.b:0 "Record their experience in the state archives."
 ve_idea_evt.31.b.tt:0 "Gain #P 15#! National Insight."
 ve_idea_evt.31.c:0 "Use the national networks already established."
 ve_idea_evt.31.c.tt:0 "Spend #N 20#! National Insight and gain #P +5%#! Loyalists from Legitimacy for 36 months."
 ve_idea_evt.32.t:0 "Competing National Societies"
 ve_idea_evt.32.d:0 "Rival societies now claim the right to speak for the nation. Their competing ceremonies and publications are turning a shared political language into a source of grievance."
 ve_idea_evt.32.a:0 "Draft a common charter."
 ve_idea_evt.32.a.tt:0 "Spend #N 25#! National Insight and avoid the nationalist penalty."
 ve_idea_evt.32.b:0 "Competition will find its own limits."
 ve_idea_evt.32.b.tt:0 "Suffer #N +5%#! Radicals from Legitimacy for 24 months."
 ve_idea_evt.32.c:0 "Let the national institutions arbitrate."
 ve_idea_evt.32.c.tt:0 "Spend #N 10#! National Insight and avoid the nationalist penalty."

 ve_idea_evt.40.t:0 "Committee or Street"
 ve_idea_evt.40.d:0 "Reformers are divided between expert commissions and mass pressure. Committees promise coherent legislation, while organized movements insist that reform without public force will be delayed indefinitely."
 ve_idea_evt.40.a:0 "Create an independent reform commission."
 ve_idea_evt.40.a.tt:0 "Spend #N 25#! National Insight. The Intelligentsia gain #P +1#! Approval and the Trade Unions lose #N 1#! Approval for 24 months."
 ve_idea_evt.40.b:0 "Give the movements room to act."
 ve_idea_evt.40.b.tt:0 "The Trade Unions gain #P +1#! Approval and the Industrialists lose #N 1#! Approval for 24 months."
 ve_idea_evt.40.c:0 "Apply the established framework of rights and procedure."
 ve_idea_evt.40.c.tt:0 "Spend #N 10#! National Insight. No Interest Group Approval changes."
 ve_idea_evt.41.t:0 "The Petition Network"
 ve_idea_evt.41.d:0 "Local petitions have become a coordinated national network capable of sorting grievances and proposing reforms. The government can recognize it as a consultative channel or preserve its methods for later use."
 ve_idea_evt.41.a:0 "Turn the network into formal consultation."
 ve_idea_evt.41.a.tt:0 "Spend #N 40#! National Insight and gain #P +5%#! Loyalists from Political Movements for 36 months."
 ve_idea_evt.41.b:0 "File the demands in the review archive."
 ve_idea_evt.41.b.tt:0 "Gain #P 15#! National Insight."
 ve_idea_evt.41.c:0 "Use the reform organizations already established."
 ve_idea_evt.41.c.tt:0 "Spend #N 20#! National Insight and gain #P +5%#! Loyalists from Political Movements for 36 months."
 ve_idea_evt.42.t:0 "The Coalition Fractures"
 ve_idea_evt.42.d:0 "The reform coalition is splitting over priorities, timing, and leadership. Unless a common program is restored, organized political energy will harden into rival radical camps."
 ve_idea_evt.42.a:0 "Rewrite the common program."
 ve_idea_evt.42.a.tt:0 "Spend #N 25#! National Insight and avoid the reformist penalty."
 ve_idea_evt.42.b:0 "Let the division enter open politics."
 ve_idea_evt.42.b.tt:0 "Suffer #N +5%#! Radicals from Political Movements for 24 months."
 ve_idea_evt.42.c:0 "Reapply the egalitarian framework."
 ve_idea_evt.42.c.tt:0 "Spend #N 10#! National Insight and avoid the reformist penalty."

 ve_idea_evt.50.t:0 "Seniority or Merit"
 ve_idea_evt.50.d:0 "The officer corps is divided over promotion. Senior commanders defend rank by service and custom, while reformers demand examinations and performance records that would open advancement to proven ability."
 ve_idea_evt.50.a:0 "Introduce merit examinations."
 ve_idea_evt.50.a.tt:0 "Spend #N 25#! National Insight and gain #P +5%#! Training Rate for 24 months. The Armed Forces lose #N 1#! Approval for 24 months."
 ve_idea_evt.50.b:0 "Preserve the seniority system."
 ve_idea_evt.50.b.tt:0 "The Armed Forces gain #P +1#! Approval for 24 months, but Training Rate falls by #N -5%#! for 12 months."
 ve_idea_evt.50.c:0 "Use the general staff's service records."
 ve_idea_evt.50.c.tt:0 "Spend #N 10#! National Insight and gain #P +5%#! Training Rate for 24 months. Interest Group Approval does not change."
 ve_idea_evt.51.t:0 "The Great Staff Exercise"
 ve_idea_evt.51.d:0 "A large staff exercise has exposed valuable lessons in mobilization, instruction, and command. Expanding the program could spread those lessons through the army, while archiving the findings would preserve them at little cost."
 ve_idea_evt.51.a:0 "Expand the exercise."
 ve_idea_evt.51.a.tt:0 "Spend #N 40#! National Insight and gain #P +5%#! Training Rate for 36 months."
 ve_idea_evt.51.b:0 "Place the findings in the doctrine archive."
 ve_idea_evt.51.b.tt:0 "Gain #P 15#! National Insight."
 ve_idea_evt.51.c:0 "Use the professional command network."
 ve_idea_evt.51.c.tt:0 "Spend #N 20#! National Insight and gain #P +5%#! Training Rate for 36 months."
 ve_idea_evt.52.t:0 "An Officer Corps Bottleneck"
 ve_idea_evt.52.d:0 "The army is expanding faster than its instructors and staff officers can be prepared. Training schedules now depend on a narrow group of exhausted cadres."
 ve_idea_evt.52.a:0 "Expand the training cadre."
 ve_idea_evt.52.a.tt:0 "Spend #N 25#! National Insight and avoid the military penalty."
 ve_idea_evt.52.b:0 "Push the existing cadres harder."
 ve_idea_evt.52.b.tt:0 "Suffer #N -5%#! Training Rate for 24 months."
 ve_idea_evt.52.c:0 "Transfer the logistical staff reserve."
 ve_idea_evt.52.c.tt:0 "Spend #N 10#! National Insight and avoid the military penalty."
