 ve_boost_idea:0 "Boost Idea"
 ve_boost_idea_tt:0 "#header Adopt the Next Idea#!\nNational Insight: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nPurchase status: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Cost of the next level#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nUse the cost matching the next unfilled level in this group.\n\n#title What happens when purchased#!\n#P The next modifier in this group becomes active.#!\n#P Doctrine Investment and National Idea progress each increase by 1.#!\n#N A 24-month Doctrine Implementation cycle begins. No other group idea can be bought during it.#!\n\n#title Why can the button be disabled?#!\nInsight is below the next-level cost; Doctrine Implementation is active; the group is complete; or the next level requires an unresearched technology.\n\nCancelling this group removes its idea modifiers and current progress. Spent Insight is never refunded, but a group slot already earned from a milestone is never revoked."
