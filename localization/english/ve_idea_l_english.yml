 ve_idea_points:0 "#tooltippable_name National Insight"
 ve_national_insight_tt:0 "#header National Insight#!\nStock: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nThis month: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nPurchase status: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title What it does#!\nNational Insight buys individual ideas inside an embraced Idea Group. Each active purchase advances National Ideas and adds to current Doctrine Investment; reaching an investment milestone permanently awards group capacity.\n\n#title Why monthly income changes#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nLiteracy: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nSchools: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniversities: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nAdministration: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nIntelligentsia: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nDebt, turmoil and implementation: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Stock pressure#!\nIncome multiplier: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nIncome is halved at #Y 750#!, falls to one quarter at #Y 900#! and stops at #Y 1000#!. Spending before the stock cap prevents wasted income."
 ve_national_insight_implementation_strain:0 "Doctrine Implementation Strain"
 ve_national_insight_implementation_strain_desc:0 "The administration is adapting institutions and procedures to a newly adopted national doctrine. Another group idea cannot be adopted until this 24-month implementation cycle ends."
 ve_total_ideas:0 "Idea Groups"
 ve_traditions:0 "#tooltippable_concept Traditions: "
 ve_bonus:0 "#tooltippable_concept Bonus: "
 ve_ambition:0 "Ambition"
 ve_ambition_tooltip:0 "#Y Ambition#!\n#P Permanent capstone reward#!\nUnlocks automatically when all seven ideas in this group have been embraced."
 ve_idea_cancel_warning:0 "#header Cancel [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Every active idea modifier in this group will be removed.#!\n#N Its Ambition modifier will also be removed if it has been unlocked.#!\n\nSpent National Insight is not refunded.\nNational Insight returned: #Y 0#!\n\n#title Effects that will be removed#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Confirm: cancel this idea group.#! Progress and modifiers are lost, National Insight is not refunded."
 ve_idea_cancel_keep_tt:0 "Keep this idea group - do not cancel."
 ve_embrace:0 "Embrace"
 ve_idea_locked:0 "Path Closed"
 ve_idea_locked_tt:0 "#N This idea group is mutually exclusive with the one you have already embraced. Cancel that group to open this path."
 ve_idea_age_locked:0 "Technology Required"
 ve_idea_age_locked_tt:0 "#N This idea group requires a technology that has not yet been researched."
