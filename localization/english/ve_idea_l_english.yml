 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Piety Reform/month#! in Confessional or State Atheism, and #P +1 Cultural Mandate/month#! in Ethnic Nation."
 nationalist_idea_7_tt:0 "#P +1 Religious Project progress/month#! in Confessional or State Atheism; #P +1 Cultural Project progress/month#! in Ethnic Nation; coercive Religious and Ethnic Integration outcomes improve from #Y 5%#! to #Y 7%#!."
 embrace_idea_tt:0 "#header Idea Group Capacity#!\nUsed slots: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nFree slots now: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nCurrent Doctrine Investment: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! active purchased ideas\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title How capacity works#!\nEach active purchased group idea supplies #P +1#! Doctrine Investment. Reaching #Y 4, 8, 13, 19, 26#! or #Y 34#! permanently adds one group slot. Slots 5–6 also require Age 2; slot 7 requires Age 3.\n\n#title Embracing and cancelling#!\nEmbracing a group costs no Insight but occupies one free slot. Cancelling frees that slot, removes the group's modifiers, and lowers current Doctrine Investment; spent Insight is not refunded. Any capacity slot already earned remains permanently available."
 ve_idea_capacity_player_progress:0 "#title Next permanent slot#!\nSlot: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgress: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! purchased ideas\nStill needed: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Next permanent slot#!\nSlot: #Y 5#!\nProgress: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! purchased ideas\nStill needed: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nAge requirement: #N Waiting for Age 2#!"
 ve_idea_capacity_player_age_3:0 "#title Next permanent slot#!\nSlot: #Y 7#!\nProgress: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! purchased ideas\nStill needed: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nAge requirement: #N Waiting for Age 3#!"
