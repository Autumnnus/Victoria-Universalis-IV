 ve_piety_tt:0 "#header Religious Settlement#!\nCurrent state: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nSocial equilibrium: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMonthly movement: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Equilibrium breakdown#!\nSettlement model: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nModel support: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitimacy, administration and stability: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nThe meter moves #Y 20%#! toward equilibrium each month, limited to #Y ±5#!.\nAt #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nAt #N 25#! or below: #N -5 Legitimacy and -5% Law Enactment Success#!.\n\nPrograms require at least #Y 50#! strength, cost #Y 25#! and impose a #Y 24-month#! implementation period."
 ve_missionary_tt:0 "#header Missionaries#!\nState Religion provides #Y 3#! Missionaries. Freedom of Conscience provides #Y 1#!. Nationalist Idea VII adds #P 2#!. State Atheism and Total Separation disable Missionaries."
 ve_missionary_power_txt:0 "Missionary Power"
 ve_missionary_power_tt:0 "#header Missionary Conversion Power#!\nCurrent: #Y [GetPlayer.MakeScope.ScriptValue('missionary_power_250k')|%2]#!\n\nBase: #Y 5%#!\nState Religion: #P +0.7%#!\nFreedom of Conscience: #P +0.3%#!\nTheocracy: #P +0.7%#!\nNationalist Idea V: #P +0.7%#!\nReligious Schools: #P +0.7%#!\n\nApplicable conversion modifiers are included in the final value. Population size reduces the effective amount shown here."
 ve_max_missionary_power_tt:0 "#tooltippable_concept Maximum Missionary Power: #Y [GetPlayer.MakeScope.ScriptValue('max_missionary_power_250k')|%2] \n#lore It can be different for each country and religion."


