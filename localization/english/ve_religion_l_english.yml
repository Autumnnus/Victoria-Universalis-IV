l_english:
 ve_piety:0 "Piety"
 ve_piety_reform:0 "Piety Reform"
 ve_piety_reform_tt:0 "#header Piety Reform#!\nCurrent: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nMonthly income: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Monthly breakdown#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nAdministration: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nDevout support: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nIdea doctrine: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Idea doctrine — only your current Religious Model counts#!\n#P Confessional State / State Atheism#!: Nationalist V #P +1#!\n#P Freedom of Conscience / Total Separation#!: Reformist V #P +1#!\nThe active total above is capped at #Y +1#!, so the two paths cannot stack.\n\nSpent on Doctrines and Programs (#Y 25#! each) and on the Targeted Religious Project (#Y 100-150#!, model-dependent). Income slows past #Y 400#! and stops at #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doctrines and Programs"
 ve_piety_tt:0 "#header Religious Settlement#!\nCurrent state: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nSocial equilibrium: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMonthly movement: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Equilibrium breakdown#!\nSettlement model: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nModel support: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitimacy, administration and stability: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nThe meter moves #Y 20%#! toward equilibrium each month, limited to #Y ±5#!.\nAt #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nAt #N 25#! or below: #N -5 Legitimacy and -5% Law Enactment Success#!.\n\nThis meter no longer pays for Programs - see Piety Reform. Programs require at least #Y 25#! Piety Reform, cost #Y 25#! and impose a #Y 24-month#! implementation strain.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Religious Project"
 ve_religious_project_progress_tt:0 "#header Targeted Religious Project#!\nProgress: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nMonthly progress: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (minimum 1, maximum 7)\n\n#Y Monthly breakdown#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nAdministration: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nModel support: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nSettlement: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nReligious Movements: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nTarget-State Turmoil: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nIdea Groups: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Idea Groups — only bonuses matching your current Religious Model are active#!\n#P Confessional State#!: Nationalist VII #P +1#!\n#P Freedom of Conscience#!: Reformist VII #P +1#!\n#P State Atheism#!: Nationalist VII #P +1#! and Academic VII #P +1#!\nThe active Idea Group total above is capped at #Y +2#!.\n\nStart one from an owned state's panel. Confessional and State Atheism convert #Y 5%#! of the target state's population on completion, or #Y 7%#! with Nationalist VII, and add radicals. Freedom of Conscience instead adds loyalists without forcing conversion. Total Separation cannot start a project - it is the fully neutral model.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "In progress"
 ve_religious_project_none:0 "None active"

