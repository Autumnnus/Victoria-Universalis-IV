 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "State Religion"
 ve_settlement_tier_high:0 "SETTLED - [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "CONTESTED - #N -5 Legitimacy and -5% Law Enactment Success#!."
 ve_settlement_hint:0 "Drifts toward the equilibrium your Religious Model produces. At 75+ you gain a bonus, at 25 or less instability."
 ve_piety_reform_hint:0 "Spent on Programs (25 each) and on Religious Projects. Saving it is safe, but income halves at 400 and stops at 500."
 ve_religious_project_hint:0 "Optional. Started from one of your own States, if your Religious Model allows one."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Religious Models"
 ve_religious_models_help:0 "Your Religious Model is decided by your #Y Church and State#! law and is #P already active#! - there is nothing to choose here. The model only decides how #Y Religious Settlement#! is earned, which eight Programs you may adopt, and which Religious Project you may run.\n#Y Changing the law is optional:#! it resets Settlement to #Y 35#!, removes every Program you have adopted, cancels a running Religious Project and applies a #Y 3-5 year#! Settlement Crisis.\n#Y Hover any card or meter for its full effects.#!"
 ve_religious_model_active_footer:0 "Current Model"
 ve_confessional_state_short:0 "Church and state govern together.\nSettlement comes from #Y Devout approval and clout#!."
 ve_freedom_state_short:0 "Every faith is tolerated under one state.\nSettlement comes from #Y a calm, well-run country#!."
 ve_separation_state_short:0 "The state holds no religious position at all.\nSettlement starts highest and rewards #Y low turmoil#!."
 ve_atheism_state_short:0 "Active, state-led secularization.\nSettlement comes from #Y literacy and the Intelligentsia#!."
 ve_confessional_state_unlocks:0 "Runs the #Y Confessional Conversion#! project"
 ve_freedom_state_unlocks:0 "Runs the #Y Freedom Outreach#! project"
 ve_separation_state_unlocks:0 "#N Cannot run a Religious Project#!"
 ve_atheism_state_unlocks:0 "Runs the #Y Secularization Campaign#! project"
 ve_confessional_state_desc:0 "#header Confessional State#!\nChurch and state govern together.\n\n#Y While active#!\n#P +5% Authority, +10% Conversion, +10% Devout Political Strength#!\n#N -3% Migration Attraction, +5% Radicals from Open Prejudice#!\nPlus one small package for your state religion's faith family (Christian, Islamic, Jewish, Dharmic, Scholarly or Animist).\n\n#Y Settlement#!\nBase equilibrium #Y 55#!. Devout approval and clout move it the most.\n\n#Y At 75 Settlement#!\n#P +5% Authority, +5 Legitimacy#!\n\n#Y Religious Project#!\nConfessional Conversion"
 ve_freedom_state_desc:0 "#header Freedom of Conscience#!\nEvery faith is tolerated under one state.\n\n#Y While active#!\n#P +5% Migration Attraction, -5% Radicals from Open Prejudice#!\n#N -15% Conversion, -25 Bureaucracy#!\n\n#Y Settlement#!\nBase equilibrium #Y 55#!. Low turmoil, legitimacy and a healthy administration raise it.\n\n#Y At 75 Settlement#!\n#P +5% Migration Attraction, +5 Legitimacy#!\n\n#Y Religious Project#!\nFreedom Outreach"
 ve_separation_state_desc:0 "#header Total Separation#!\nThe neutral model: the state takes no religious position.\n\n#Y While active#!\n#P +8% Migration Attraction, -10% Radicals from Open Prejudice, -5% Radicals from Violent Hostility#!\n#N -30% Conversion#!\n\n#Y Settlement#!\nBase equilibrium #Y 60#!, the highest of the four. Low turmoil raises it further.\n\n#Y At 75 Settlement#!\n#P +5% Law Enactment Success, +5 Legitimacy#!\n\n#Y Religious Project#!\n#N None. This model deliberately has no religious campaign.#!"
 ve_atheism_state_desc:0 "#header State Atheism#!\nAn aggressive secularization model, not a tolerant one.\n\n#Y While active#!\n#P +5% Technology Spread, +2% Education Access, +20% Conversion#!\n#N -5% Authority, -10% Devout Political Strength, +5% Radicals from Open Prejudice#!\n\n#Y Settlement#!\nBase equilibrium #Y 45#!, the lowest of the four. Literacy and Intelligentsia approval raise it; strong Devout clout lowers it.\n\n#Y At 75 Settlement#!\n#P +5% Technology Spread, +5% Bureaucracy#!\n\n#Y Religious Project#!\nSecularization Campaign\n\n#Y Note#!\nSwitching to this model costs a #N 5-year#! crisis instead of 3 if literacy is below 50% or Devout clout is 20% or more."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Programs are #Y optional#! and permanent. Each costs #Y 25 Piety Reform#! and starts a #Y 24-month#! implementation strain during which no further Program can be adopted. All eight belong to your current Religious Model and are lost if that model changes.\n#Y Hover any card or meter for its full effects.#!"
 ve_religious_program_strain_notice:0 "A Program is still being implemented - no further Program can be adopted until that strain expires."
 ve_religious_program_adopted_badge:0 "ADOPTED"
 ve_adopt_program_button:0 "Adopt"
 ve_religious_program_cost_label:0 "Costs #Y 25 Piety Reform#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Targeted Religious Project"
 ve_religious_projects_intro:0 "A Religious Project is #Y optional#! and only one may run at a time. Its Piety Reform cost is paid immediately and #N -50 Bureaucracy and -25 Authority#! apply for as long as it runs. Completing it refunds some Piety Reform and raises Religious Settlement.\n#Y Hover any card or meter for its full effects.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Project in progress"
 ve_religious_project_backlash_notice:0 "A cancelled project still blocks a new one - the 24-month backlash must expire first."
 ve_religious_project_start_instruction:0 "#Y How to start it#!\n1. Open one of your own States.\n2. Press #Y Start Project#! in that State's panel.\nAnything still missing is listed in that button's tooltip."
 ve_targeted_religious_project_target:0 "Target: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "No project target"
 ve_no_active_religious_project:0 "No Active Religious Project"
 ve_confessional_conversion_name:0 "Confessional Conversion"
 ve_confessional_conversion_cost:0 "Cost: #Y 125 Piety Reform#!"
 ve_confessional_conversion_short:0 "Convert one State toward the state religion.\n#P +20 Piety Reform, +5 Settlement#! on completion - but it creates radicals."
 ve_confessional_conversion_desc:0 "#header Confessional Conversion#!\nRun in a single State whose share of your own religion is below #Y 90%#!.\n\n#Y Cost#!\n#Y 125 Piety Reform#!, paid immediately\n\n#Y While it runs#!\n#N -50 Bureaucracy, -25 Authority#! for the country\n#N +20% Conversion and +20% radicalism channels#! in the target State\n\n#Y On completion#!\nConverts #Y 5%#! of the State's population to your state religion, or #Y 7%#! with Nationalist VII\n#P +20 Piety Reform, +5 Religious Settlement#!\n\n#Y Warning#!\n#N The conversion creates radicals in the target State.#!"
 ve_freedom_outreach_name:0 "Freedom Outreach"
 ve_freedom_outreach_cost:0 "Cost: #Y 100 Piety Reform#!"
 ve_freedom_outreach_short:0 "Win over one State without forcing conversion.\n#P +20 Piety Reform, +7 Settlement#! on completion, plus loyalists."
 ve_freedom_outreach_desc:0 "#header Freedom Outreach#!\nRun in a single State whose share of your own religion is below #Y 90%#!.\n\n#Y Cost#!\n#Y 100 Piety Reform#!, paid immediately\n\n#Y While it runs#!\n#N -50 Bureaucracy, -25 Authority#! for the country\n\n#Y On completion#!\n#P No forced conversion#! - loyalists in the target State instead\n#P +20 Piety Reform, +7 Religious Settlement#!"
 ve_secularization_campaign_name:0 "Secularization Campaign"
 ve_secularization_campaign_cost:0 "Cost: #Y 150 Piety Reform#!"
 ve_secularization_campaign_short:0 "Convert one State to atheism.\n#P +25 Piety Reform, +8 Settlement#! on completion - but it creates radicals."
 ve_secularization_campaign_desc:0 "#header Secularization Campaign#!\nRun in a single State whose share of your own religion is below #Y 90%#!.\n\n#Y Cost#!\n#Y 150 Piety Reform#!, paid immediately\n\n#Y While it runs#!\n#N -50 Bureaucracy, -25 Authority#! for the country\n#N +20% Conversion and +20% radicalism channels#! in the target State\n\n#Y On completion#!\nConverts #Y 5%#! of the State's population to Atheism, or #Y 7%#! with Nationalist VII\n#P +25 Piety Reform, +8 Religious Settlement#!\n\n#Y Warning#!\n#N The conversion creates radicals in the target State.#!"
 ve_religious_project_unavailable_name:0 "No Project Available"
 ve_religious_project_unavailable_cost:0 "#N Total Separation cannot run a Religious Project#!"
 ve_religious_project_unavailable_short:0 "The neutral model deliberately has no religious campaign. Enact a different Church and State law if you want one."
 ve_religious_project_unavailable_desc:0 "#header No Project Available#!\nTotal Separation is the fully neutral model and cannot start a Targeted Religious Project.\n\nConfessional State, Freedom of Conscience and State Atheism each run their own project. Enact the matching Church and State law to gain one."

 #RELIGION PAGE - one-screen layout: short forms used where a row has no room
 ve_religious_program_strain_notice_short:0 "Program strain active"
 ve_religious_project_backlash_notice_short:0 "Cancellation backlash active"
 ve_religious_project_start_instruction_short:0 "Start it from one of your own States: open the State and press #Y Start Project#!."
