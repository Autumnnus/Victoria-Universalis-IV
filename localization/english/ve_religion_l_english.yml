l_english:
 ve_piety:0 "Piety"
 ve_piety_reform:0 "Piety Reform"
 ve_piety_reform_tt:0 "#header Piety Reform#!\nCurrent: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nMonthly income: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\nSpent on Doctrines and Programs (#Y 25#! each) and on the Targeted Religious Project (#Y 100-150#!, model-dependent). Income slows past #Y 400#! and stops at #Y 500#!."
 ve_aspects:0 "Doctrines and Programs"
 ve_piety_tt:0 "#header Religious Settlement#!\nCurrent state: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nSocial equilibrium: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMonthly movement: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Equilibrium breakdown#!\nSettlement model: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nModel support: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLegitimacy, administration and stability: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nThe meter moves #Y 20%#! toward equilibrium each month, limited to #Y ±5#!.\nAt #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nAt #N 25#! or below: #N -5 Legitimacy and -5% Law Enactment Success#!.\n\nThis meter no longer pays for Programs - see Piety Reform. Programs still require at least #Y 50#! effective Piety Reform, cost #Y 25#! and impose a #Y 24-month#! implementation strain."

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Religious Project"
 ve_religious_project_progress_tt:0 "#header Targeted Religious Project#!\nProgress: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nMonthly progress: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]\n\nStart one from an owned state's panel. Confessional and State Atheism convert #Y 5%#! of the target state's population toward the pushed religion on completion (more with Nationalist idea group bonuses) and add radicals; Freedom of Conscience instead adds loyalists without forcing conversion. Total Separation cannot start a project - it is the fully neutral model."
 ve_religious_project_in_progress:0 "In progress"
 ve_religious_project_none:0 "None active"

