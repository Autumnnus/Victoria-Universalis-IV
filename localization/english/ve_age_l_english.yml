l_english:
 ve_splendor:0 "#tooltippable_name Era Momentum: "
 ve_age_of_victoria_title:0 "Industry and Nations"
 ve_age_of_victoria_desc:0 "Old orders confront factories, railways, literate publics, and the modern state. Momentum belongs to countries that turn inherited institutions into durable national capacity."
 ve_imperialism_age_title:0 "Empire and Mass Society"
 ve_imperialism_age_desc:0 "Industry reaches across continents while education, public institutions, and organized armies reshape mass society. Great powers may expand abroad; smaller states can prosper through sovereignty and internal development."
 ve_great_wars_age_title:0 "Mass Politics and Total War"
 ve_great_wars_age_desc:0 "Electricity, oil, mass participation, welfare, and industrial warfare transform the relationship between state and society. Survival now depends on institutions as much as armies."
 ve_age_notify_option:0 "A new age dawns."
 ve_victorian_age_icon_p_tt:0 "#P Industry and Nations (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Industry and Nations (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Empire and Mass Society (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Empire and Mass Society (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Mass Politics and Total War (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Mass Politics and Total War (1906–1936)"

 ve_golden_age:0 "Golden Age"
 ve_golden_age_industrial:0 "Industrial Golden Age"
 ve_golden_age_cultural:0 "Cultural Golden Age"
 ve_golden_age_strategic:0 "Strategic Golden Age"
 ve_golden_age_tt:0 "Complete #v 4 distinct objectives#! in the current age. A country may choose only one Golden Age during the entire game; its effects last #v 15 years#!."
 ve_golden_age_industrial_tt:0 "#header Industrial Golden Age#!\nFor #Y 15 years#!: #P +10% Manufacturing Throughput#! and #P +10% Resource Discovery Chance#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Cultural Golden Age#!\nFor #Y 15 years#!: #P +5% Education Access#! and #P +10% Prestige#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Strategic Golden Age#!\nFor #Y 15 years#!: #P +5% Army Offense#! and #P -10% War Exhaustion from Casualties#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Age Objectives"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Industrial Takeoff"
 ve_victorian_age_obj_desc_1:0 "Reduce the peasant share below 60%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header End the Old Order"
 ve_victorian_age_obj_desc_2:0 "Ban slavery and abolish serfdom."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Functional State"
 ve_victorian_age_obj_desc_3:0 "Maintain at least 60 legitimacy and a non-negative bureaucracy balance without an approaching shortage."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Educated Public"
 ve_victorian_age_obj_desc_4:0 "Reach 40% literacy or level 2 Schools."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Integrated Market"
 ve_victorian_age_obj_desc_5:0 "Own at least 1 Railway level if below 5 million population, or 3 Railway levels otherwise."
 ve_victorian_age_obj_title_6:0 "#tooltip_header National Awakening"
 ve_victorian_age_obj_desc_6:0 "Be independent with at least 50 legitimacy and less than 10% country turmoil."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Diplomatic Recognition"
 ve_victorian_age_obj_desc_7:0 "Be recognized, a Major or Great Power, or maintain at least 3 declared interests."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Industrial Power"
 ve_imperialism_age_obj_desc_1:0 "Reach £100 million GDP or reduce the peasant share below 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Mass Education"
 ve_imperialism_age_obj_desc_2:0 "Reach 65% literacy or level 4 Schools."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Empire or Sovereignty"
 ve_imperialism_age_obj_desc_3:0 "Have at least 2 subjects, or remain independent and recognized."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Global Commerce"
 ve_imperialism_age_obj_desc_4:0 "Own 2 Port levels if below 10 million population, own 10 Port levels otherwise, or maintain 5 declared interests."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Nation Building"
 ve_imperialism_age_obj_desc_5:0 "Maintain at least 60 legitimacy and less than 5% country turmoil."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header The Social Question"
 ve_imperialism_age_obj_desc_6:0 "Raise Health System, Workplace Safety, or Social Security to level 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Modern Armed Forces"
 ve_imperialism_age_obj_desc_7:0 "Field at least 50% Skirmish or Trench Infantry and 10% Mobile Artillery in the army."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Mass Politics"
 ve_great_wars_age_obj_desc_1:0 "Enact Universal Suffrage or Council Republic, or maintain 75 legitimacy as a Parliamentary or Presidential Republic."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Social State"
 ve_great_wars_age_obj_desc_2:0 "Maintain at least two level 3 institutions among Health, Social Security, Workplace Safety, and Schools."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Electrified Economy"
 ve_great_wars_age_obj_desc_3:0 "Own 1 Power Plant level if below 10 million population, or 5 Power Plant levels otherwise."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Oil and Engines"
 ve_great_wars_age_obj_desc_4:0 "Own an Oil Rig or at least 5 Motor Industry levels."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Modern Military"
 ve_great_wars_age_obj_desc_5:0 "Field at least 50% Trench or Squad Infantry and 15% Shrapnel Artillery in the army."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Total War Capacity"
 ve_great_wars_age_obj_desc_6:0 "Maintain 40 army units and at least 5 Arms Industry or 3 Munition Plant levels."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header World Influence"
 ve_great_wars_age_obj_desc_7:0 "Be a Major or Great Power, lead a Power Bloc, or maintain at least 6 declared interests."

 ve_age_splendor_tt:0 "#title Era Momentum#!\nCurrent stock: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nSatisfied objectives: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nMonthly change: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nCompleted distinct objectives this age: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nRewards purchased this age: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nNext reward cost: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\nEach currently satisfied objective grants #P +1#! Era Momentum per month. The first completion of each objective in an age grants #P +50#! once.\n\nReward costs escalate within each age: #Y 200, 300, 400, 500#!, then #Y 600#! for every later reward. Momentum and the cost ladder reset when a new age begins."
 ve_age_obj_efct_tt:0 "While satisfied: #P +1 Era Momentum per month#!\nFirst completion this age: #P +50 Era Momentum#!"
 splendor_default_bonus:0 "Have at least #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Era Momentum"
