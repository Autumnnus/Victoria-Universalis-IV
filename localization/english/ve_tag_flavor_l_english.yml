l_english:
 ve_tag_flavor_delayed_result_tt:0 "The consequences of this institutional choice will emerge in approximately one year."
 ve_tag_flavor_free_route_tt:0 "This route spends no National Insight, Cultural Mandate, or Piety Reform."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "A Common Civic Lexicon"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "A shared official vocabulary carries reform into schools and provincial offices, but constant explanation consumes central authority."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Sacred Continuity"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "Reform has been framed through inherited religious institutions, reinforcing command while narrowing the channels through which foreign methods circulate."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Administrative Translation"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "The bureaucracy translates reform into familiar procedure. Administration becomes steadier, but legislative change loses some speed."
 ve_tag_flavor.1.t:0 "The Language of Reform"
 ve_tag_flavor.1.d:0 "A decree may leave the capital in impeccable prose and still arrive in a school, court, provincial office, or religious foundation as four different instructions. Reformers now demand a common vocabulary. The question is whose institutions will give that vocabulary its meaning."
 ve_tag_flavor.1.a:0 "Draft a common civic lexicon."
 ve_tag_flavor.1.a.tt:0 "Requires Civic Nation or Composite State.\nSpend #N 20 Cultural Mandate#! now.\nAfter approximately one year: gain #P 8 National Insight#! and #P 3 National Cohesion#!, then gain #P +1% Education Access#! and #N -25 Authority#! for 24 months."
 ve_tag_flavor.1.b:0 "Ground reform in sacred continuity."
 ve_tag_flavor.1.b.tt:0 "Requires the Confessional Religious Model.\nSpend #N 20 Piety Reform#! now.\nAfter approximately one year: gain #P 8 National Insight#! and #P 3 Religious Settlement#!, then gain #P +25 Authority#! and #N -2.5% Technology Spread#! for 24 months."
 ve_tag_flavor.1.c:0 "Let each bureau translate the order."
 ve_tag_flavor.1.c.tt:0 "After approximately one year: gain #P 4 National Insight#!, then gain #P +25 Bureaucracy#! and #N -2.5% Law Enactment Speed#! for 24 months."
 ve_tag_flavor.2.t:0 "Words Become Procedure"
 ve_tag_flavor.2.d:0 "A year of circulars, commentaries, schoolbooks, sermons, and provincial correspondence has given the reform program a working language. It is not perfectly uniform, but officials now know which phrases command agreement—and which ones still conceal disagreement."
 ve_tag_flavor.2.a:0 "The vocabulary enters the machinery of state."
 ve_tag_flavor.2.a.tt:0 "The outcome selected one year ago now takes effect. Its resource changes are clamped to their normal limits, and its institutional modifier lasts 24 months."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Translation Bureaus"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Specialist offices accelerate the circulation of foreign methods, though their autonomy weakens the center's immediate command."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Directed Borrowing"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Imported institutions are reorganized under central direction. Authority is preserved, but each reform takes longer to pass through official channels."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Selective Adoption"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "The state admits only methods that can be reconciled with established authority, trading the speed of diffusion for political control."
 ve_tag_flavor.10.t:0 "Borrowed Methods, Native Authority"
 ve_tag_flavor.10.d:0 "Foreign manuals, machines, school plans, and administrative tables arrive faster than any ministry can judge them. Some officials demand permanent translation offices; others insist that every borrowed institution be remade under central direction. A third faction would admit only what can be absorbed without disturbing the established order."
 ve_tag_flavor.10.a:0 "Establish translation bureaus."
 ve_tag_flavor.10.a.tt:0 "Requires Academic Idea IV or Infrastructure Idea IV.\nSpend #N 15 National Insight#! now.\nAfter approximately one year: gain #P 10 Era Momentum#!, then gain #P +2.5% Technology Spread#! and #N -25 Authority#! for 24 months."
 ve_tag_flavor.10.b:0 "Borrow only under central direction."
 ve_tag_flavor.10.b.tt:0 "Requires Japanese National Idea IV.\nSpend #N 10 National Insight#! now.\nAfter approximately one year: gain #P 7 Era Momentum#!, then gain #P +25 Authority#! and #N -2.5% Law Enactment Speed#! for 24 months."
 ve_tag_flavor.10.c:0 "Adopt selectively and preserve command."
 ve_tag_flavor.10.c.tt:0 "After approximately one year: gain #P 3 Era Momentum#!, then gain #P +25 Authority#! and #N -2.5% Technology Spread#! for 24 months."
 ve_tag_flavor.11.t:0 "Methods Made Our Own"
 ve_tag_flavor.11.d:0 "A year of translation, testing, redrafting, and official argument has separated novelty from utility. The adopted methods no longer appear as foreign instructions; they have entered the state's own vocabulary of command."
 ve_tag_flavor.11.a:0 "Use what has survived examination."
 ve_tag_flavor.11.a.tt:0 "The outcome selected one year ago now takes effect. Era Momentum retains its normal zero floor, and the institutional modifier lasts 24 months."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Citizenship Compact"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "A common language of citizenship makes arrival and participation easier, but explaining the compact across every jurisdiction consumes central authority."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Composite Bargain"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "Federal administration learns to negotiate among constituent communities, strengthening offices while reducing pressure toward a single cultural form."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Federal Ambiguity"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Deliberate ambiguity broadens the Union's diplomatic voice, but for a time lowers National Cohesion equilibrium by 2."
 ve_tag_flavor.20.t:0 "The Meaning of the Union"
 ve_tag_flavor.20.d:0 "New arrivals, established states, and communities with different public customs all invoke the Union in their own terms. Legislators agree that a common formula is needed, but not whether it should define individual citizenship, preserve a bargain among constituent communities, or remain broad enough for each jurisdiction to interpret."
 ve_tag_flavor.20.a:0 "Write a compact of citizenship."
 ve_tag_flavor.20.a.tt:0 "Requires Civic Nation.\nSpend #N 20 Cultural Mandate#! now.\nAfter approximately one year: gain #P 8 National Insight#! and #P 3 National Cohesion#!, then gain #P +2.5% Migration Attraction#! and #N -25 Authority#! for 24 months."
 ve_tag_flavor.20.b:0 "Negotiate a composite bargain."
 ve_tag_flavor.20.b.tt:0 "Requires Composite State.\nSpend #N 20 Cultural Mandate#! now.\nAfter approximately one year: gain #P 8 National Insight#! and #P 3 National Cohesion#!, then gain #P +25 Bureaucracy#! and #N -2.5% Assimilation#! for 24 months."
 ve_tag_flavor.20.c:0 "Leave the federal formula deliberately broad."
 ve_tag_flavor.20.c.tt:0 "After approximately one year: gain #P 4 National Insight#! and #P +25 Influence#! for 24 months. While the modifier is active, National Cohesion equilibrium is #N 2 lower#!."
 ve_tag_flavor.21.t:0 "A Formula for the Union"
 ve_tag_flavor.21.d:0 "A year of conventions, committee reports, state resolutions, and public argument has produced language that institutions can use. Its silences are as consequential as its declarations, defining which disputes the Union settles and which it leaves to negotiation."
 ve_tag_flavor.21.a:0 "Let the formula enter public life."
 ve_tag_flavor.21.a.tt:0 "The outcome selected one year ago now takes effect. Resource changes are clamped to their normal limits, and the institutional modifier lasts 24 months."
