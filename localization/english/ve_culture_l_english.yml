l_english:
 ve_national_identity:0 "National Identity"
 ve_primary_cultures_label:0 "Primary Cultures"
 ve_active_identity_model:0 "Active Identity Model"
 ve_identity_models:0 "Identity Models"
 ve_hover_for_details:0 "Hover for full effects"
 ve_identity_model_active_badge:0 "ACTIVE"
 ve_identity_model_active_footer:0 "Already Active"
 ve_switch_identity_button:0 "Switch to This Model (200 Mandate)"
 ve_begin_project_button:0 "Begin Project"
 ve_identity_models_help:0 "Your nation always has exactly one Identity Model and it is #P already active#! — you do not have to choose anything here. The model only decides how #Y National Cohesion#! is earned and which Cultural Project you may run.\n#Y Switching is optional:#! it costs #Y 200 Cultural Mandate#!, resets Cohesion to #Y 35#!, cancels any running Cultural Project and blocks another switch for 5 years."
 ve_ethnic_identity_name:0 "Ethnic Nation"
 ve_civic_identity_name:0 "Civic Nation"
 ve_composite_identity_name:0 "Composite State"
 ve_ethnic_identity_short:0 "The nation is defined around its primary cultures.\nCohesion comes from #Y demographic dominance#!."
 ve_civic_identity_short:0 "A shared political nation built through schooling and participation.\nCohesion comes from #Y literacy and accepted minorities#!."
 ve_composite_identity_short:0 "Several peoples governed through negotiated institutions.\nCohesion comes from #Y a genuinely plural population#!."
 ve_ethnic_identity_unlocks:0 "Unlocks the #Y Ethnic Integration Campaign#! project"
 ve_civic_identity_unlocks:0 "Unlocks the #Y Equal Citizenship Initiative#! project"
 ve_composite_identity_unlocks:0 "Unlocks the #Y Constituent Compact#! project"
 ve_ethnic_identity_desc:0 "#header Ethnic Nation#!\nThe nation is defined around its primary cultures.\n\n#Y While active#!\n#P +15% Assimilation, +5% Authority#!\n#N -5% Migration Attraction, +5% Radicals from Open Prejudice#!\n\n#Y Cohesion#!\nRises when primary cultures make up at least 60–75% of the population, and falls sharply below 40%.\n\n#Y At 75 Cohesion#!\n#P +5% Conscription Rate, +3 Legitimacy#!\n\n#Y Cultural Project#!\nEthnic Integration Campaign"
 ve_civic_identity_desc:0 "#header Civic Nation#!\nA shared political nation is built through education and participation.\n\n#Y While active#!\n#P +7% Migration Attraction, +1% Education Access#!\n#N -10% Assimilation, -5% Authority, -50 Bureaucracy#!\n\n#Y Cohesion#!\nLiteracy raises it, but any non-primary culture above 10% of the population with very low Acceptance lowers it.\n\n#Y At 75 Cohesion#!\n#P +5% Qualifications, +3 Legitimacy#!\n\n#Y Cultural Project#!\nEqual Citizenship Initiative"
 ve_composite_identity_desc:0 "#header Composite State#!\nSeveral peoples are governed through negotiated institutions.\n\n#Y While active#!\n#P -10% Radicals from Cultural Erasure and Second-Rate Citizenship, +5% Influence#!\n#N -15% Assimilation, -5% Authority, -75 Bureaucracy#!\n\n#Y Cohesion#!\nA genuinely plural population raises it; a population over 90% primary cultures weakens this model.\n\n#Y At 75 Cohesion#!\n#P +5% Influence, +3 Legitimacy#!\n\n#Y Cultural Project#!\nConstituent Compact"
 ve_identity_change_cost_tt:0 "Changing the Identity Model requires #Y 200 Cultural Mandate#! and no active Identity Transition Backlash. The change resets Cohesion to #Y 35#!, causes a #Y 5-year transition backlash#! and cancels any active Cultural Project without an additional cancellation penalty."
 ve_cultural_mandate:0 "Cultural Mandate"
 ve_culture_reform_point:0 "Cultural Mandate"
 ve_cultural_mandate_hint:0 "Spent on Cultural Projects. Saving it is safe, but income halves at 400 and stops at 500."
 ve_culture_reform_point_tt:0 "#header Cultural Mandate#!\nCurrent: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nMonthly change: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y What it is spent on#!\nCultural Projects (75–150) and Identity Model changes (200). Neither is required: saving Mandate is safe, income is only halved at 400 and stops at 500.\n\n#Y Monthly breakdown#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministration: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nModel Society: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nStability and Cultural Movements: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nLaw alignment: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nCap multiplier: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\nCivic Nation draws the Model Society component from literacy, Composite State from literacy in a plural society, and Ethnic Nation from primary-culture demographic strength."
 ve_national_cohesion:0 "National Cohesion"
 ve_national_cohesion_hint:0 "Drifts toward the equilibrium your Identity Model produces. At 75+ you gain a bonus, at 25 or less instability."
 ve_national_cohesion_tt:0 "#header National Cohesion#!\nCurrent: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nEquilibrium: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMonthly movement: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nCommon conditions: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nIdentity-model conditions: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nCohesion moves 20% of the distance toward equilibrium each month, up to 5 points. Radical cultural movements reduce equilibrium by 10. At 75 or more the current model grants an additional benefit; at 25 or less national instability applies."
 bar_no_effect:0 "No effect"
 ve_cultural_projects:0 "Cultural Projects"
 ve_cultural_projects_intro:0 "Cultural Projects are #Y optional#!. Only one may run at a time: its Mandate cost is paid immediately and #N -75 Bureaucracy and -25 Authority#! apply for as long as it runs. Completing a project refunds some Mandate and raises Cohesion."
 ve_cultural_project_active_label:0 "Project in progress"
 ve_cultural_project_progress:0 "Project Progress"
 ve_cultural_project_progress_tt:0 "#header Monthly Project Progress#!\nCurrent: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nRemaining: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nMonthly total: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (minimum 1, maximum 7)\n\n#Y Monthly breakdown#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministration: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nModel Society: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nCohesion: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nCultural Movements: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nTarget-State Turmoil: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\n\nModel Society rewards civic literacy, ethnic demographic concentration, or composite diversity according to the active Identity Model. Completion is resolved on the next monthly update after progress reaches #Y 100#!."
 ve_cancel_cultural_project_button:0 "Cancel Project"
 ve_cancel_cultural_project_tt:0 "#header Cancel Cultural Project#!\nThe invested Cultural Mandate is #N not refunded#!. National Cohesion falls by #N 5#! and a #N 2-year backlash#! prevents another project."
 ve_start_cultural_project_button:0 "Start Project"
 ve_national_curriculum_name:0 "National Curriculum"
 ve_national_curriculum_cost:0 "Cost: #Y 100 Cultural Mandate#!"
 ve_national_curriculum_short:0 "A countrywide schooling reform.\n#P +20 Mandate, +5 Cohesion#! on completion, then 10 years of better education."
 ve_national_curriculum_desc:0 "#header National Curriculum#!\nA schooling reform run across the whole country.\n\n#Y Cost#!\n#Y 100 Cultural Mandate#!, paid immediately\n\n#Y On completion#!\n#P +20 Cultural Mandate, +5 National Cohesion#!\n\n#Y For 10 years afterwards#!\n#P +2% Education Access, +5% Qualifications#!\n#N -25 Bureaucracy#!"
 ve_national_curriculum_requirements_tt:0 "Requires #Y 100 Cultural Mandate#!, no active Cultural Project and no Project Backlash."
 ve_shared_symbols_name:0 "Shared Symbols"
 ve_shared_symbols_cost:0 "Cost: #Y 75 Cultural Mandate#!"
 ve_shared_symbols_short:0 "Flags, anthems and public ceremony.\n#P +20 Mandate, +7 Cohesion#! on completion, then 8 years of loyalists and Authority."
 ve_shared_symbols_desc:0 "#header Shared Symbols#!\nFlags, anthems and public ceremony, promoted across the whole country.\n\n#Y Cost#!\n#Y 75 Cultural Mandate#!, paid immediately\n\n#Y On completion#!\n#P +20 Cultural Mandate, +7 National Cohesion#!\n\n#Y For 8 years afterwards#!\n#P +10% Loyalists from Fully Accepted Pops, +25 Authority#!"
 ve_shared_symbols_requirements_tt:0 "Requires #Y 75 Cultural Mandate#!, no active Cultural Project and no Project Backlash."
 ve_ethnic_campaign_name:0 "Ethnic Integration Campaign"
 ve_ethnic_campaign_cost:0 "Cost: #Y 125 Cultural Mandate#!"
 ve_ethnic_campaign_short:0 "Assimilate a large minority in one State.\n#P +25 Mandate, +8 Cohesion#! on completion — but it creates radicals."
 ve_ethnic_campaign_desc:0 "#header Ethnic Integration Campaign#!\nRun in a single State against its largest non-primary culture, which must hold at least #Y 5%#! of that State's population.\n\n#Y Cost#!\n#Y 125 Cultural Mandate#!, paid immediately\n\n#Y On completion#!\nAssimilates #Y 5%#! of the target culture into a primary culture\n#P +25 Cultural Mandate, +8 National Cohesion#!\nLeaves a #Y 10-year#! assimilation program in the State\n\n#Y Warning#!\n#N Both starting and finishing the project create radicals among the target culture.#!"
 ve_civic_initiative_name:0 "Equal Citizenship Initiative"
 ve_civic_initiative_cost:0 "Cost: #Y 100 Cultural Mandate#!"
 ve_civic_initiative_short:0 "Raise a minority's Acceptance in one State.\n#P +25 Mandate, +10 Cohesion#! on completion, plus loyalists."
 ve_civic_initiative_desc:0 "#header Equal Citizenship Initiative#!\nRun in a single State on its largest non-primary culture, which must hold at least #Y 5%#! of that State's population.\n\n#Y Cost#!\n#Y 100 Cultural Mandate#!, paid immediately\n\n#Y On completion#!\n#P +15 Acceptance for that culture for 10 years#!\nLoyalists in the target State\n#P +25 Cultural Mandate, +10 National Cohesion#!\nTen years of improved Qualifications and Migration Attraction"
 ve_composite_compact_name:0 "Constituent Compact"
 ve_composite_compact_cost:0 "Cost: #Y 150 Cultural Mandate#! and #Y 40 Cohesion#!"
 ve_composite_compact_short:0 "Recognise a minority as a constituent culture.\n#P +30 Mandate, +12 Cohesion#! on completion, and the recognition is permanent."
 ve_composite_compact_desc:0 "#header Constituent Compact#!\nRun in a single State on an unrecognized non-primary culture holding at least #Y 5%#! of that State's population.\n\n#Y Cost#!\n#Y 150 Cultural Mandate#!, paid immediately, and at least #Y 40 National Cohesion#!\n\n#Y On completion#!\n#P +15 Acceptance for that culture, permanently#!\nRecognizes it as a constituent culture\nLoyalists in the target State\n#P +30 Cultural Mandate, +12 National Cohesion#!"
 ve_targeted_project_start_instruction:0 "#Y How to start it#!\n1. Open one of your own States.\n2. Press #Y Start Project#! in that State's panel.\nThe target culture and anything still missing are listed in that button's tooltip."
 ve_targeted_project_state_requirements_tt:0 "The state must be owned by us and contain an eligible non-primary culture comprising at least #Y 5%#! of its population. The largest eligible culture becomes the target. The current Identity Model's cost and requirements must also be met."
 ve_targeted_cultural_project_target:0 "Target: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! in #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Scope: #Y Entire Country#!"
 ve_no_cultural_project_target:0 "No project target"
 ve_no_active_cultural_project:0 "No Active Cultural Project"
