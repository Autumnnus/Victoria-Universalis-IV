l_english:
 ve_national_identity:0 "National Identity"
 ve_current_identity_model:0 "Current Identity Model"
 ve_identity_models:0 "Identity Models"
 ve_ethnic_identity_name:0 "Ethnic Nation"
 ve_civic_identity_name:0 "Civic Nation"
 ve_composite_identity_name:0 "Composite State"
 ve_ethnic_identity_desc:0 "The nation is defined around its primary cultures.\n#P +15% Assimilation, +5% Authority#!\n#N -5% Migration Attraction; +5% Radicals from Open Prejudice#!\nCohesion rises when primary cultures form at least 60–75% of the population and falls sharply below 40%.\nAt 75 Cohesion: #P +5% Conscription Rate and +3 Legitimacy#!."
 ve_civic_identity_desc:0 "A shared political nation is built through education and participation.\n#P +7% Migration Attraction, +1% Education Access#!\n#N -10% Assimilation, -5% Authority and -50 Bureaucracy#!\nLiteracy supports Cohesion, but any non-primary culture above 10% population with very low Acceptance reduces it.\nAt 75 Cohesion: #P +5% Qualifications and +3 Legitimacy#!."
 ve_composite_identity_desc:0 "Several peoples are governed through negotiated institutions.\n#P -10% Radicals from Cultural Erasure and Second-Rate Citizenship; +5% Influence#!\n#N -15% Assimilation, -5% Authority and -75 Bureaucracy#!\nA genuinely plural population supports Cohesion; a population over 90% primary cultures weakens this model.\nAt 75 Cohesion: #P +5% Influence and +3 Legitimacy#!."
 ve_adopt_ethnic_identity:0 "Adopt Ethnic Nation"
 ve_adopt_civic_identity:0 "Adopt Civic Nation"
 ve_adopt_composite_identity:0 "Adopt Composite State"
 ve_identity_change_cost_tt:0 "Changing the Identity Model requires #Y 200 Cultural Mandate#! and no active Identity Transition Backlash. The change resets Cohesion to #Y 35#!, causes a #Y 5-year transition backlash#! and cancels any active Cultural Project without an additional cancellation penalty."
 ve_cultural_mandate:0 "Cultural Mandate"
 ve_culture_reform_point:0 "Cultural Mandate"
 ve_culture_reform_point_tt:0 "#header Cultural Mandate#!\nCurrent: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nMonthly change: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Monthly breakdown#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministration: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nModel Society: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nStability and Cultural Movements: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nLaw alignment: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nCap multiplier: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\nCivic Nation draws this component from literacy, Composite State from literacy in a plural society, and Ethnic Nation from primary-culture demographic strength. Mandate funds Cultural Projects and Identity Model changes. Income is halved at 400 and stops at 500."
 ve_national_cohesion:0 "National Cohesion"
 ve_national_cohesion_tt:0 "#header National Cohesion#!\nCurrent: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nEquilibrium: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMonthly movement: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nCommon conditions: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nIdentity-model conditions: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nCohesion moves 20% of the distance toward equilibrium each month, up to 5 points. Radical cultural movements reduce equilibrium by 10. At 75 or more the current model grants an additional benefit; at 25 or less national instability applies."
 bar_no_effect:0 "No effect"
 ve_cultural_projects:0 "Cultural Projects"
 ve_cultural_projects_intro:0 "Only one Cultural Project can operate at a time. Every project consumes Cultural Mandate immediately and imposes #N -75 Bureaucracy and -25 Authority#! while active."
 ve_cultural_project_progress:0 "Project Progress"
 ve_cultural_project_progress_tt:0 "#header Monthly Project Progress#!\nCurrent: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nRemaining: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nMonthly total: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (minimum 1, maximum 7)\n\n#Y Monthly breakdown#!\nBase: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministration: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLegitimacy: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nModel Society: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nCohesion: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nCultural Movements: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nTarget-State Turmoil: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\n\nModel Society rewards civic literacy, ethnic demographic concentration, or composite diversity according to the active Identity Model. Completion is resolved on the next monthly update after progress reaches #Y 100#!."
 ve_cancel_cultural_project_button:0 "Cancel Project"
 ve_cancel_cultural_project_tt:0 "#header Cancel Cultural Project#!\nThe invested Cultural Mandate is #N not refunded#!. National Cohesion falls by #N 5#! and a #N 2-year backlash#! prevents another project."
 ve_start_cultural_project_button:0 "Start Project"
 ve_national_curriculum_name:0 "National Curriculum"
 ve_national_curriculum_desc:0 "Cost: #Y 100 Cultural Mandate#!\nCompletion: #P +20 Mandate and +5 Cohesion#!, then for #Y 10 years#!: +2% Education Access, +5% Qualifications and -25 Bureaucracy."
 ve_begin_national_curriculum:0 "Begin (100 Mandate)"
 ve_national_curriculum_requirements_tt:0 "Requires #Y 100 Cultural Mandate#!, no active Cultural Project and no Project Backlash."
 ve_shared_symbols_name:0 "Shared Symbols"
 ve_shared_symbols_desc:0 "Cost: #Y 75 Cultural Mandate#!\nCompletion: #P +20 Mandate and +7 Cohesion#!, then for #Y 8 years#!: +10% Loyalists from Fully Accepted Pops and +25 Authority."
 ve_begin_shared_symbols:0 "Begin (75 Mandate)"
 ve_shared_symbols_requirements_tt:0 "Requires #Y 75 Cultural Mandate#!, no active Cultural Project and no Project Backlash."
 ve_ethnic_campaign_name:0 "Ethnic Integration Campaign"
 ve_ethnic_campaign_desc:0 "Cost: #Y 125 Cultural Mandate#!. Targets the largest non-primary culture with at least 5% of the selected state's population. Completion assimilates #Y 5%#! of that culture into a primary culture, grants #P +25 Mandate and +8 Cohesion#!, and leaves a #Y 10-year#! assimilation program. Starting and finishing creates radicals among the target culture."
 ve_civic_initiative_name:0 "Equal Citizenship Initiative"
 ve_civic_initiative_desc:0 "Cost: #Y 100 Cultural Mandate#!. Targets the largest non-primary culture with at least 5% of the selected state's population. Completion grants that culture #P +15 Acceptance for 10 years#!, creates loyalists in the target state, grants #P +25 Mandate and +10 Cohesion#!, and leaves 10 years of improved qualifications and migration."
 ve_composite_compact_name:0 "Constituent Compact"
 ve_composite_compact_desc:0 "Cost: #Y 150 Cultural Mandate#! and requires at least #Y 40 Cohesion#!. Targets an unrecognized non-primary culture with at least 5% of the selected state's population. Completion permanently grants that culture #P +15 Acceptance#!, recognizes it as a constituent culture, creates loyalists, and grants #P +30 Mandate and +12 Cohesion#!."
 ve_targeted_project_start_instruction:0 "Open an owned State and press #Y Start Project#!. The eligible target culture and all requirements appear in that button's tooltip."
 ve_targeted_project_state_requirements_tt:0 "The state must be owned by us and contain an eligible non-primary culture comprising at least #Y 5%#! of its population. The largest eligible culture becomes the target. The current Identity Model's cost and requirements must also be met."
 ve_targeted_cultural_project_target:0 "Target: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! in #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Scope: #Y Entire Country#!"
 ve_no_cultural_project_target:0 "No project target"
 ve_no_active_cultural_project:0 "No Active Cultural Project"
