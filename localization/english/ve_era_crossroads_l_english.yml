 ve_era_crossroads.1.t:0 "Steam and the State"
 ve_era_crossroads.1.d:0 "Railways, schools, reformers, and administrators offer rival accounts of the modern nation. The government must decide which relationship between society and the state will organize the first age."
 ve_era_crossroads.1.a:0 "Bind the country together through a Steam Network."
 ve_era_crossroads.1.b:0 "Build an Educated Citizenship."
 ve_era_crossroads.1.c:0 "Consolidate an Administrative State."
 ve_era_crossroads.1.d.option:0 "This age needs no national crossroads."
 ve_era_crossroads.1.a.tt:0 "Starts the #Y Steam Network#! route (Focus: Industrialization, Peasant Migration & Railways).\n• Goal: Reach 60 Progress to gain #P +50 Era Momentum#!.\n• Progress Speed: Gains +1 base monthly progress, plus +1 extra for each completed Age 1 anchor (Peasant Share and Railway objectives).\n• Doctrine Synergy: Having #Y Industrialist IV#! or #Y Infrastructure IV#! unlocks cheaper milestone decisions (5 Insight instead of 10)."
 ve_era_crossroads.1.b.tt:0 "Starts the #Y Educated Citizenship#! route (Focus: Education, Literacy & Free Labour).\n• Goal: Reach 60 Progress to gain #P +50 Era Momentum#!.\n• Progress Speed: Gains +1 base monthly progress, plus +1 extra for each completed Age 1 anchor (Free Labour and Literacy/Schools objectives).\n• Doctrine Synergy: Having #Y Academic IV#! or #Y Reformist IV#! unlocks cheaper milestone decisions (5 Insight instead of 10)."
 ve_era_crossroads.1.c.tt:0 "Starts the #Y Administrative State#! route (Focus: Government Legitimacy, Bureaucracy & Stability).\n• Goal: Reach 60 Progress to gain #P +50 Era Momentum#!.\n• Progress Speed: Gains +1 base monthly progress, plus +1 extra for each completed Age 1 anchor (Legitimacy/Bureaucracy and Independent Stability objectives).\n• Doctrine Synergy: Having #Y Bureaucratic IV#! or #Y Parliamentary IV#! unlocks cheaper milestone decisions (5 Insight instead of 10)."
 ve_era_crossroads.2.t:0 "Empire or Mass Society?"
 ve_era_crossroads.2.d:0 "The state can no longer treat overseas reach, popular welfare, and national integration as separate questions. One of them will define how the others are pursued."
 ve_era_crossroads.2.a:0 "Look toward the Imperial Horizon."
 ve_era_crossroads.2.b:0 "Construct a system of Mass Welfare."
 ve_era_crossroads.2.c:0 "Forge an Integrated Nation."
 ve_era_crossroads.2.d.option:0 "Let the age find its own direction."
 ve_era_crossroads.2.a.tt:0 "Starts the #Y Imperial Horizon#! route (Focus: Diplomatic Power & Overseas Reach).\n• Goal: Reach 60 Progress to gain #P +50 Era Momentum#!.\n• Progress Speed: Gains +1 base monthly progress, plus +1 extra for each completed Age 2 anchor (Recognized State Capacity and Ports/Interests objectives).\n• Doctrine Synergy: Having #Y Diplomatic IV#! or #Y Colonial IV#! unlocks cheaper milestone decisions (5 Insight instead of 10)."
 ve_era_crossroads.2.b.tt:0 "Starts the #Y Mass Welfare#! route (Focus: Social Institutions, Healthcare & Education).\n• Goal: Reach 60 Progress to gain #P +50 Era Momentum#!.\n• Progress Speed: Gains +1 base monthly progress, plus +1 extra for each completed Age 2 anchor (Literacy/Schools and Social Institutions objectives).\n• Doctrine Synergy: Having #Y Welfare IV#! or #Y Reformist IV#! unlocks cheaper milestone decisions (5 Insight instead of 10)."
 ve_era_crossroads.2.c.tt:0 "Starts the #Y Integrated Nation#! route (Focus: Economic Transformation & Internal Stability).\n• Goal: Reach 60 Progress to gain #P +50 Era Momentum#!.\n• Progress Speed: Gains +1 base monthly progress, plus +1 extra for each completed Age 2 anchor (Economic Transformation and Low-Turmoil Legitimacy objectives).\n• Doctrine Synergy: Having #Y Nationalist IV#! or #Y Labour IV#! unlocks cheaper milestone decisions (5 Insight instead of 10)."
 ve_era_crossroads.3.t:0 "The Mobilized Society"
 ve_era_crossroads.3.d:0 "Mass politics, strategic command, and industrial mobilization now reach into every institution. The final age demands a choice about which form of mobilization will define the nation."
 ve_era_crossroads.3.a:0 "Commit to a Social Republic."
 ve_era_crossroads.3.b:0 "Place the nation under Strategic Command."
 ve_era_crossroads.3.c:0 "Build an Arsenal Society."
 ve_era_crossroads.3.d.option:0 "Reject a permanent mobilizing project."
 ve_era_crossroads.3.a.tt:0 "Starts the #Y Social Republic#! route (Focus: Mass Politics & Social Institutions).\n• Goal: Reach 60 Progress to gain #P +50 Era Momentum#!.\n• Progress Speed: Gains +1 base monthly progress, plus +1 extra for each completed Age 3 anchor (Mass Politics and Mature Social Institutions objectives).\n• Doctrine Synergy: Having #Y Parliamentary IV#! or #Y Welfare IV#! unlocks cheaper milestone decisions (5 Insight instead of 10)."
 ve_era_crossroads.3.b.tt:0 "Starts the #Y Strategic Command#! route (Focus: Military Modernization & Global Power Reach).\n• Goal: Reach 60 Progress to gain #P +50 Era Momentum#!.\n• Progress Speed: Gains +1 base monthly progress, plus +1 extra for each completed Age 3 anchor (Modern Force Composition and Great Power Reach objectives).\n• Doctrine Synergy: Having #Y Professional Army IV#! or #Y Defensive IV#! unlocks cheaper milestone decisions (5 Insight instead of 10)."
 ve_era_crossroads.3.c.tt:0 "Starts the #Y Arsenal Society#! route (Focus: Industrial War Economy & Mass Armaments).\n• Goal: Reach 60 Progress to gain #P +50 Era Momentum#!.\n• Progress Speed: Gains +1 base monthly progress, plus +1 extra for each completed Age 3 anchor (Electrical Industry and Mass Armaments objectives).\n• Doctrine Synergy: Having #Y War Economy IV#! or #Y Mass Conscription IV#! unlocks cheaper milestone decisions (5 Insight instead of 10)."

 ve_era_crossroads_decline_tt:0 "Permanently declines the current Age's Era Crossroads. Later Ages remain eligible."

 ve_era_crossroads.10.t:0 "A National Calendar"
 ve_era_crossroads.10.d:0 "Provincial offices, private associations, and ministries are pursuing the chosen transformation at different speeds. A common calendar could turn scattered achievements into a national programme, but coordination itself demands scarce administrative attention."
 ve_era_crossroads.10.a:0 "Fund a central coordination commission."
 ve_era_crossroads.10.b:0 "Let the institutions negotiate their own timetable."
 ve_era_crossroads.10.c:0 "Use the networks built by our established doctrines."
 ve_era_crossroads.10.a.tt:0 "Spend #N 10 National Insight#! to gain #P +3 Crossroads progress#!."
 ve_era_crossroads.10.b.tt:0 "Spend no resource and make no immediate change to Crossroads progress."
 ve_era_crossroads.10.c.tt:0 "Requires a route-fit level-IV Idea Group. Spend #N 5 National Insight#! to gain #P +3 Crossroads progress#!."

 ve_era_crossroads.11.t:0 "Who Will Direct Progress?"
 ve_era_crossroads.11.d:0 "The programme has become too consequential to remain a loose agreement. Ministers claim national authority, experts demand insulation from politics, and local actors warn that rigid command will break the institutions that made progress possible."
 ve_era_crossroads.11.a:0 "Give the centre a clear coordinating mandate."
 ve_era_crossroads.11.b:0 "Preserve the negotiated balance of authority."
 ve_era_crossroads.11.c:0 "Entrust coordination to our doctrinal institutions."
 ve_era_crossroads.11.a.tt:0 "Spend #N 10 National Insight#! to gain #P +3 Crossroads progress#!."
 ve_era_crossroads.11.b.tt:0 "Spend no resource and make no immediate change to Crossroads progress."
 ve_era_crossroads.11.c.tt:0 "Requires a route-fit level-IV Idea Group. Spend #N 5 National Insight#! to gain #P +3 Crossroads progress#!."

 ve_era_crossroads.40.t:0 "Steam and the State"
 ve_era_crossroads.40.d:0 "The chosen course is no longer a series of isolated accomplishments. Infrastructure, citizenship, or administration now forms a durable national programme through which the state can understand and direct the transformations of the age."
 ve_era_crossroads.40.a:0 "The first age has found its institutional form."
 ve_era_crossroads.40.a.tt:0 "The completed Era Crossroads has granted #P +50 Era Momentum#!. It has not completed an objective or altered Golden Age eligibility."

 ve_era_crossroads.20.t:0 "The Reach of the State"
 ve_era_crossroads.20.d:0 "The chosen programme now extends beyond the institutions that first sponsored it. Ports, schools, offices, and local authorities disagree over where national coordination should end and local discretion should begin."
 ve_era_crossroads.20.a:0 "Map the state's obligations through a central commission."
 ve_era_crossroads.20.b:0 "Allow institutional boundaries to emerge by negotiation."
 ve_era_crossroads.20.c:0 "Coordinate through our established doctrinal networks."
 ve_era_crossroads.20.a.tt:0 "Spend #N 10 National Insight#! to gain #P +3 Crossroads progress#!."
 ve_era_crossroads.20.b.tt:0 "Spend no resource and make no immediate change to Crossroads progress."
 ve_era_crossroads.20.c.tt:0 "Requires a route-fit level-IV Idea Group. Spend #N 5 National Insight#! to gain #P +3 Crossroads progress#!."

 ve_era_crossroads.21.t:0 "The Price of Integration"
 ve_era_crossroads.21.d:0 "External reach, social provision, and national discipline all create winners, costs, and new expectations. The programme can endure only if the state decides how those burdens will be distributed."
 ve_era_crossroads.21.a:0 "Create a national board to manage adjustment."
 ve_era_crossroads.21.b:0 "Distribute the burden through negotiated compromises."
 ve_era_crossroads.21.c:0 "Let our doctrinal institutions absorb the strain."
 ve_era_crossroads.21.a.tt:0 "Spend #N 10 National Insight#! to gain #P +3 Crossroads progress#!."
 ve_era_crossroads.21.b.tt:0 "Spend no resource and make no immediate change to Crossroads progress."
 ve_era_crossroads.21.c.tt:0 "Requires a route-fit level-IV Idea Group. Spend #N 5 National Insight#! to gain #P +3 Crossroads progress#!."

 ve_era_crossroads.41.t:0 "Empire and Mass Society"
 ve_era_crossroads.41.d:0 "The chosen settlement now connects the state's external reach, social obligations, and national institutions. What began as a strategic direction has become a durable framework for governing mass society."
 ve_era_crossroads.41.a:0 "The second age has found its settlement."
 ve_era_crossroads.41.a.tt:0 "The completed Era Crossroads has granted #P +50 Era Momentum#!. It has not completed an objective or altered Golden Age eligibility."

 ve_era_crossroads.30.t:0 "The Nation Is Called to Duty"
 ve_era_crossroads.30.d:0 "Citizens, commanders, workers, and administrators are all being assigned new obligations by the chosen programme. Unless those duties are made legible to one another, mobilization will remain a collection of competing demands."
 ve_era_crossroads.30.a:0 "Codify national duties through a central commission."
 ve_era_crossroads.30.b:0 "Let institutions negotiate their responsibilities."
 ve_era_crossroads.30.c:0 "Use our doctrinal organizations to coordinate duty."
 ve_era_crossroads.30.a.tt:0 "Spend #N 10 National Insight#! to gain #P +3 Crossroads progress#!."
 ve_era_crossroads.30.b.tt:0 "Spend no resource and make no immediate change to Crossroads progress."
 ve_era_crossroads.30.c.tt:0 "Requires a route-fit level-IV Idea Group. Spend #N 5 National Insight#! to gain #P +3 Crossroads progress#!."

 ve_era_crossroads.31.t:0 "A Permanent Emergency"
 ve_era_crossroads.31.d:0 "The machinery built for mass participation, strategic readiness, or industrial mobilization is becoming permanent. The state must decide how to preserve capacity without allowing emergency discipline to consume ordinary national life."
 ve_era_crossroads.31.a:0 "Define permanent limits through a national review."
 ve_era_crossroads.31.b:0 "Keep the settlement deliberately flexible."
 ve_era_crossroads.31.c:0 "Rely on doctrinal institutions to contain the machinery."
 ve_era_crossroads.31.a.tt:0 "Spend #N 10 National Insight#! to gain #P +3 Crossroads progress#!."
 ve_era_crossroads.31.b.tt:0 "Spend no resource and make no immediate change to Crossroads progress."
 ve_era_crossroads.31.c.tt:0 "Requires a route-fit level-IV Idea Group. Spend #N 5 National Insight#! to gain #P +3 Crossroads progress#!."

 ve_era_crossroads.42.t:0 "The Mobilized Society"
 ve_era_crossroads.42.d:0 "Citizenship, command, and industrial capacity now form a durable national settlement. The institutions of mobilization have been made part of ordinary government rather than left as improvised answers to each new crisis."
 ve_era_crossroads.42.a:0 "The final age has found its national form."
 ve_era_crossroads.42.a.tt:0 "The completed Era Crossroads has granted #P +50 Era Momentum#!. It has not completed an objective or altered Golden Age eligibility."
