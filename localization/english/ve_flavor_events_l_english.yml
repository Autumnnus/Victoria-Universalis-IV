 economic_flavor.1.t:0 "Economic Developments"
 economic_flavor.1.desc:0 "Our economic doctrine is bearing fruit in ways the ministries did not plan for. Whatever follows, the effects will be felt across the economy for years."
 economic_flavor.1.a:0 "So be it"
 innovative_flavor.1.t:0 "A Shift in Doctrine"
