l_english:
 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "This campaign runs on the rebuilt Victoria Universalis IV. In short:\n\n#Y Religion#! - Your Church and State law now sets one of four Religious Models. You hold a 0-100 Religious Settlement meter, spend Piety Reform on eight permanent programs per model, and may run one targeted Religious Project in a state of your choice.\n\n#Y National Identity#! - Ethnic, Civic or Composite nationhood, with Cultural Mandate to spend, a National Cohesion meter to keep high, and five Cultural Projects.\n\n#Y Idea Groups#! - 21 groups across Production, Society and Military, including the new Agrarian group. Group slots are earned through doctrine investment instead of the calendar, and every purchase costs you a 24-month implementation period.\n\n#Y National Ideas#! - Twelve new country profiles, and progress now comes from every single idea level you buy.\n\n#Y Ages#! - Three Ages with objectives, thirteen Era Reward slots and three Golden Ages, plus one strategic Era Crossroads journey per Age.\n\n#Y New content#! - Over a hundred new events: doctrine dilemmas, multi-year Doctrine Journeys, project incidents and crises, and flavour chains for the Ottomans, Japan and the United States.\n\n#Y Interface#! - A new topbar row, rebuilt Religion and National Identity pages, a doctrine readout on every country panel, and a world-wide Doctrine Ledger."
 ve_welcome.1.f:0 "Every doctrine leaves its mark on the nation that adopts it."
 ve_welcome.1.a:0 "For the details, see the mod description. Have fun ^_^"
