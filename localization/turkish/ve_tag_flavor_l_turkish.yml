l_turkish:
 ve_tag_flavor_delayed_result_tt:0 "Bu kurumsal tercihin sonuçları yaklaşık bir yıl içinde ortaya çıkacaktır."
 ve_tag_flavor_free_route_tt:0 "Bu yol hiçbir Ulusal Kavrayış, Kültürel Yetki veya Dindarlık Reformu harcamaz."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Ortak Bir Sivil Lügat"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Paylaşılan resmî bir lügat, reformu okullara ve vilayet dairelerine taşır; ancak sürekli açıklama gereksinimi merkezi otoriteyi tüketir."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Kutsal Devamlılık"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "Reform, miras alınan dinî kurumlar üzerinden çerçevelendirilmiş olup yabancı yöntemlerin dolaştığı kanalları daraltırken komutayı pekiştirmektedir."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "İdari Tercüme"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "Bürokrasi, reformu aşina olunan usullere tercüme eder. İdare daha istikrarlı hâle gelir, fakat yasama süreci biraz hız kaybeder."
 ve_tag_flavor.1.t:0 "Reformun Dili"
 ve_tag_flavor.1.d:0 "Bir hüküm başkentten kusursuz bir üslupla çıkıp bir okula, mahkemeye, vilayet dairesine veya vakfa dört farklı talimat şeklinde ulaşabilir. Reformcular şimdi ortak bir lügat talep etmektedir. Mesele, hangi kurumların bu lügata anlamını vereceğidir."
 ve_tag_flavor.1.a:0 "Ortak bir sivil lügat taslağı hazırlayın."
 ve_tag_flavor.1.a.tt:0 "Sivil Ulus veya Bileşik Devlet gerektirir.\nŞimdi #N 20 Kültürel Yetki#! harcayın.\nYaklaşık bir yıl sonra: #P 8 Ulusal Kavrayış#! ve #P 3 Ulusal Uyum#! kazanın, ardından 24 ay boyunca #P +1% Eğitime Erişim#! ve #N -25 Otorite#! kazanın."
 ve_tag_flavor.1.b:0 "Reformu kutsal devamlılığa dayandırın."
 ve_tag_flavor.1.b.tt:0 "Mezhepsel Dinî Model gerektirir.\nŞimdi #N 20 Dindarlık Reformu#! harcayın.\nYaklaşık bir yıl sonra: #P 8 Ulusal Kavrayış#! ve #P 3 Dinî Uzlaşı#! kazanın, ardından 24 ay boyunca #P +25 Otorite#! ve #N -2.5% Teknoloji Yayılımı#! kazanın."
 ve_tag_flavor.1.c:0 "Emri her büro kendisi tercüme etsin."
 ve_tag_flavor.1.c.tt:0 "Yaklaşık bir yıl sonra: #P 4 Ulusal Kavrayış#! kazanın, ardından 24 ay boyunca #P +25 Bürokrasi#! ve #N -2.5% Kanun Çıkarma Hızı#! kazanın."
 ve_tag_flavor.2.t:0 "Kelimeler Usule Dönüşüyor"
 ve_tag_flavor.2.d:0 "Bir yıllık genelgeler, şerhler, ders kitapları, vaazlar ve vilayet yazışmaları, reform programına işlevsel bir dil kazandırmıştır. Mükemmel bir yekparelikte olmasa da yetkililer artık hangi ifadelerin mutabakat sağladığını ve hangilerinin hâlen ihtilafı gizlediğini bilmektedir."
 ve_tag_flavor.2.a:0 "Lügat devlet mekanizmasına giriyor."
 ve_tag_flavor.2.a.tt:0 "Bir yıl önce seçilen netice şimdi yürürlüğe girer. Kaynak değişimleri olağan sınırlarında sabitlenir ve kurumsal etkeni 24 ay sürer."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Tercüme Büroları"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Mütehassıs daireler yabancı yöntemlerin yayılımını hızlandırır, ancak otonomileri merkezin doğrudan komutasını zayıflatır."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Yönlendirilmiş İktibas"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "İthal edilen kurumlar merkezî idare altında yeniden teşkilatlandırılır. Otorite korunur, fakat her reformun resmî kanallardan geçmesi daha uzun sürer."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Seçici Benimseme"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "Devlet yalnızca tesis edilmiş otoriteyle uzlaştırılabilen yöntemleri kabul ederek, yayılım hızını siyasi kontrol uğruna feda eder."
 ve_tag_flavor.10.t:0 "İktibas Edilen Yöntemler, Yerli Otorite"
 ve_tag_flavor.10.d:0 "Yabancı kılavuzlar, makineler, okul planları ve idari cetveller, hiçbir nezaretin onları tartamayacağı bir hızla gelmektedir. Bazı yetkililer daimi tercüme ofisleri talep etmekte; diğerleri ise iktibas edilen her kurumun merkezî idare altında yeniden kurulmasında ısrar etmektedir. Üçüncü bir fırka ise yalnızca tesis edilmiş düzeni sarsmadan absorbe edilebilecek olanları kabul edecektir."
 ve_tag_flavor.10.a:0 "Tercüme büroları kurun."
 ve_tag_flavor.10.a.tt:0 "Akademik Fikir IV veya Altyapı Fikir IV gerektirir.\nŞimdi #N 15 Ulusal Kavrayış#! harcayın.\nYaklaşık bir yıl sonra: #P 10 Çağ İvmesi#! kazanın, ardından 24 ay boyunca #P +2.5% Teknoloji Yayılımı#! ve #N -25 Otorite#! kazanın."
 ve_tag_flavor.10.b:0 "Yalnızca merkezî idare eliyle iktibas edin."
 ve_tag_flavor.10.b.tt:0 "Japon Ulusal Fikri IV gerektirir.\nŞimdi #N 10 Ulusal Kavrayış#! harcayın.\nYaklaşık bir yıl sonra: #P 7 Çağ İvmesi#! kazanın, ardından 24 ay boyunca #P +25 Otorite#! ve #N -2.5% Kanun Çıkarma Hızı#! kazanın."
 ve_tag_flavor.10.c:0 "Seçici bir şekilde benimseyin ve komutayı koruyun."
 ve_tag_flavor.10.c.tt:0 "Yaklaşık bir yıl sonra: #P 3 Çağ İvmesi#! kazanın, ardından 24 ay boyunca #P +25 Otorite#! ve #N -2.5% Teknoloji Yayılımı#! kazanın."
 ve_tag_flavor.11.t:0 "Kendimizin Kıldığı Yöntemler"
 ve_tag_flavor.11.d:0 "Bir yıllık tercüme, tetkik, yeniden taslaklama ve resmî münazara, yeniliği faydadan ayırmıştır. Benimsenen yöntemler artık yabancı talimatlar gibi görünmemekte; devletin kendi komuta lügatına girmiş bulunmaktadır."
 ve_tag_flavor.11.a:0 "İncelemeden sağ çıkanları kullanın."
 ve_tag_flavor.11.a.tt:0 "Bir yıl önce seçilen netice şimdi yürürlüğe girer. Çağ İvmesi olağan sıfır tabanını korur ve kurumsal etken 24 ay sürer."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Vatandaşlık Sözleşmesi"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Ortak bir vatandaşlık dili, ülkeye varışı ve katılımı kolaylaştırır; ancak sözleşmeyi her bir yargı çevresinde açıklamak merkezi otoriteyi tüketir."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Bileşik Uzlaşı"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "Federal idare, kurucu topluluklar arasında müzakere etmeyi öğrenerek tek bir kültürel forma yönelik baskıyı azaltırken ofisleri güçlendiriyor."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Federal Muğlaklık"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Bilinçli muğlaklık Birliğin diplomatik sesini genişletiyor, ancak bir süre için Ulusal Uyum dengesini 2 düşürüyor."
 ve_tag_flavor.20.t:0 "Birliğin Anlamı"
 ve_tag_flavor.20.d:0 "Yeni gelenler, kökleşmiş vilayetler ve farklı kamusal geleneklere sahip topluluklar Birliği kendi şartlarında yardıma çağırıyor. Yasamacılar ortak bir formüle ihtiyaç duyulduğu konusunda hemfikir, ancak bunun bireysel vatandaşlığı mı tanımlaması, kurucu topluluklar arasındaki bir uzlaşıyı mı koruması yoksa her yetki alanının yorumlayabileceği kadar geniş mi kalması gerektiği konusunda anlaşamıyorlar."
 ve_tag_flavor.20.a:0 "Bir vatandaşlık sözleşmesi yazın."
 ve_tag_flavor.20.a.tt:0 "Sivil Ulus gerektirir.\nŞimdi #N 20 Kültürel Yetki#! harcayın.\nYaklaşık bir yıl sonra: #P 8 Ulusal Kavrayış#! ve #P 3 Ulusal Uyum#! kazanın, ardından 24 ay boyunca #P +%2.5 Göç Cazibesi#! ve #N -25 Otorite#! kazanın."
 ve_tag_flavor.20.b:0 "Bileşik bir uzlaşı müzakere edin."
 ve_tag_flavor.20.b.tt:0 "Bileşik Devlet gerektirir.\nŞimdi #N 20 Kültürel Yetki#! harcayın.\nYaklaşık bir yıl sonra: #P 8 Ulusal Kavrayış#! ve #P 3 Ulusal Uyum#! kazanın, ardından 24 ay boyunca #P +25 Bürokrasi#! ve #N -%2.5 Asimilasyon#! kazanın."
 ve_tag_flavor.20.c:0 "Federal formülü bilinçli olarak geniş bırakın."
 ve_tag_flavor.20.c.tt:0 "Yaklaşık bir yıl sonra: 24 ay boyunca #P 4 Ulusal Kavrayış#! ve #P +25 Nüfuz#! kazanın. Etken aktifken, Ulusal Uyum dengesi #N 2 daha düşük#! olur."
 ve_tag_flavor.21.t:0 "Birlik İçin Bir Formül"
 ve_tag_flavor.21.d:0 "Bir yıllık kurultaylar, komite raporları, vilayet kararları ve kamuoyu tartışmaları, kurumların kullanabileceği bir dil ortaya çıkardı. Bildirileri kadar sessizlikleri de önem taşıyor; hangi anlaşmazlıkları Birliğin çözeceğini ve hangilerini müzakereye bırakacağını tanımlıyor."
 ve_tag_flavor.21.a:0 "Formülün kamusal hayata girmesine izin verin."
 ve_tag_flavor.21.a.tt:0 "Bir yıl önce seçilen sonuç artık yürürlüğe giriyor. Kaynak değişiklikleri normal sınırlarına sabitlenir ve kurumsal etken 24 ay sürer."
