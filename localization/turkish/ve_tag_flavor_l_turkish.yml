l_turkish:
 ve_tag_flavor_delayed_result_tt:0 "Bu kurumsal tercihin sonuçları yaklaşık bir yıl içinde ortaya çıkacak."
 ve_tag_flavor_free_route_tt:0 "Bu rotada hiçbir Ulusal İçgörü, Kültürel Talimat veya Dindarlık Reformu harcanmıyor."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Ortak Bir Yurttaşlık Sözlüğü"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Ortak bir resmi sözcük dağarcığı reformu okullara ve taşra teşkilatlarına taşır, ancak sürekli açıklama merkezi otoriteyi tüketir."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Kutsal Süreklilik"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "Reform, miras alınan dini kurumlar aracılığıyla çerçevelenmiştir; bu, yabancı yöntemlerin dolaşım kanallarını daraltırken komutayı güçlendirir."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "İdari Çeviri"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "Bürokrasi, reformu tanıdık prosedürlere dönüştürür. Yönetim daha istikrarlı hale gelir ancak mevzuat değişikliği bir miktar hız kaybeder."
 ve_tag_flavor.1.t:0 "Reformun Dili"
 ve_tag_flavor.1.d:0 "Bir ferman başkentten kusursuz bir üslupla ayrılsa da yine de bir okula, mahkemeye, taşra dairesine veya dini vakfa dört farklı talimat olarak gelebilir. Reformcular artık ortak bir kelime dağarcığı talep ediyor. Sorun, bu kelime dağarcığına anlamını kimin kurumlarının vereceğidir."
 ve_tag_flavor.1.a:0 "Ortak bir yurttaşlık sözlüğü taslağı hazırlayın."
 ve_tag_flavor.1.a.tt:0 "Yurttaş Ulusu veya Karma Devlet gerektirir.\nHarcayın #N 20 Kültürel Yetki#! şimdi.\nYaklaşık bir yıl sonra: #P 8 National Insight kazanın#! ve #P 3 Ulusal Uyum#!, ardından kazanın #P +%1 Eğitim Erişimi#! Ve #N -25 Yetki#! 24 ay boyunca."
 ve_tag_flavor.1.b:0 "Kutsal devamlılıkta temel reform."
 ve_tag_flavor.1.b.tt:0 "Devlet Dini Düzenini gerektirir.\nŞimdi #N 20 Dindarlık Reformu#! harcarsınız.\nYaklaşık bir yıl sonra #P 8 Ulusal İçgörü#! ve #P 3 Dini Yerleşim#! kazanır; ardından 24 ay boyunca #P +25 Otorite#! ile #N -%2,5 Teknoloji Yayılımı#! etkisini alırsınız."
 ve_tag_flavor.1.c:0 "Her büronun emri tercüme etmesine izin verin."
 ve_tag_flavor.1.c.tt:0 "Yaklaşık bir yıl sonra: kazanç #P 4 Ulusal İçgörü#!ve ardından #P +25 Bürokrasi#! ve #N -%2,5 Kanun Çıkarma Hızı#! 24 ay boyunca."
 ve_tag_flavor.2.t:0 "Kelimeler Prosedür Haline Geliyor"
 ve_tag_flavor.2.d:0 "Genelgeler, yorumlar, ders kitapları, vaazlar ve il yazışmalarıyla geçen bir yıl, reform programına işleyen bir dil kazandırdı. Tamamen tek tip değil, ancak yetkililer artık hangi ifadelerin anlaşmayı gerektirdiğini ve hangilerinin hala anlaşmazlığı gizlediğini biliyor."
 ve_tag_flavor.2.a:0 "Kelime dağarcığı devletin mekanizmasına girer."
 ve_tag_flavor.2.a.tt:0 "Bir yıl önce seçilen sonuç artık yürürlüğe giriyor. Kaynak değişiklikleri normal sınırlarına sabitlenmiştir ve kurumsal değiştiricisi 24 ay sürer."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Çeviri Büroları"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Uzman ofisler yabancı yöntemlerin dolaşımını hızlandırır, ancak özerklikleri merkezin doğrudan komutasını zayıflatır."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Yönlendirilmiş Borçlanma"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "İthal kurumlar merkezi yönetim altında yeniden organize edilmektedir. Yetki korunur ancak her reformun resmi kanallardan geçmesi daha uzun sürer."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Seçici Evlat Edinme"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "Devlet yalnızca yerleşik otoriteyle uzlaşabilecek yöntemleri kabul ediyor; yayılma hızını siyasi kontrolle takas ediyor."
 ve_tag_flavor.10.t:0 "Ödünç Alınan Yöntemler, Yerel Otorite"
 ve_tag_flavor.10.d:0 "Yabancı kılavuzlar, makineler, okul planları ve idari tablolar herhangi bir bakanlığın yargılayabileceğinden daha hızlı bir şekilde elimize ulaşıyor. Bazı yetkililer kalıcı tercüme büroları talep ediyor; diğerleri ödünç alınan her kurumun merkezi yönetim altında yeniden yapılandırılmasında ısrar ediyor. Üçüncü bir grup ise yalnızca kurulu düzeni bozmadan özümsenebilecekleri kabul edecektir."
 ve_tag_flavor.10.a:0 "Çeviri büroları kurun."
 ve_tag_flavor.10.a.tt:0 "Akademik Fikir IV veya Altyapı Fikri IV gerektirir.\nHarcama #N 15 Ulusal Bilgi#! şimdi.\nYaklaşık bir yıl sonra: kazanç #P 10 Çağ İvmesi#!, ardından kazanın #P +%2,5 Teknoloji Yayılımı#! ve #N -25 Yetki#! 24 ay boyunca."
 ve_tag_flavor.10.b:0 "Yalnızca merkezi yönetim altında borç alın."
 ve_tag_flavor.10.b.tt:0 "Japon Ulusal Fikri IV gerektirir.\nHarcama #N 10 Ulusal İçgörü#! şimdi.\nYaklaşık bir yıl sonra: #P 7 Era Momentum kazanın#!, sonra kazan #P +25 Yetki#! Ve #N -%2,5 Kanun Çıkarma Hızı#! 24 ay boyunca."
 ve_tag_flavor.10.c:0 "Seçerek benimseyin ve komutayı koruyun."
 ve_tag_flavor.10.c.tt:0 "Yaklaşık bir yıl sonra: #P 3 Çağ İvmesi#! kazanın, ardından #P +25 Yetki kazanın#! Ve #N -%2,5 Teknoloji Yayılımı#! 24 ay boyunca."
 ve_tag_flavor.11.t:0 "Kendimize Özel Yöntemler"
 ve_tag_flavor.11.d:0 "Bir yıl süren çeviri, test, yeniden taslak ve resmi tartışma, yeniliği faydalı olmaktan ayırdı. Benimsenen yöntemler artık yabancı talimat olarak görünmüyor; devletin kendi komuta sözlüğüne girmişler."
 ve_tag_flavor.11.a:0 "Sınavdan sağ çıkanları kullanın."
 ve_tag_flavor.11.a.tt:0 "Bir yıl önce seçilen sonuç artık yürürlüğe giriyor. Era Momentum normal sıfır tabanını koruyor ve kurumsal değişiklik 24 ay sürüyor."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Vatandaşlık Sözleşmesi"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Vatandaşlığın ortak dili, gelişi ve katılımı kolaylaştırır, ancak sözleşmeyi her yargı alanında açıklamak merkezi otoriteyi tüketir."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Bileşik Pazarlık"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "Federal yönetim, tek bir kültürel forma yönelik baskıyı azaltırken ofisleri güçlendirerek kurucu topluluklar arasında müzakere etmeyi öğrenir."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Federal Belirsizlik"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Kasıtlı belirsizlik Birliğin diplomatik sesini genişletir, ancak bir süre için Ulusal Uyum dengesini 2 oranında azaltır."
 ve_tag_flavor.20.t:0 "Birliğin Anlamı"
 ve_tag_flavor.20.d:0 "Yeni gelenler, yerleşik devletler ve farklı kamu geleneklerine sahip toplulukların tümü Birliğe kendi şartlarıyla başvuruyor. Yasa koyucular ortak bir formülün gerekli olduğu konusunda hemfikirdir ancak bunun bireysel vatandaşlığı tanımlaması, kurucu topluluklar arasındaki pazarlığı koruması veya her yargı yetkisinin yorumlayabileceği kadar geniş kalması gerektiği konusunda fikir birliğine varmazlar."
 ve_tag_flavor.20.a:0 "Bir vatandaşlık sözleşmesi yazın."
 ve_tag_flavor.20.a.tt:0 "Sivil Ulus gerektirir.\nHarcayın #N 20 Kültürel Görev#! şimdi.\nYaklaşık bir yıl sonra: #P 8 Ulusal İçgörü#! ve #P 3 Ulusal Uyum kazanın#!, sonra kazan #P +%2,5 Göç Çekimi#! Ve #N -25 Yetki#! 24 ay boyunca."
 ve_tag_flavor.20.b:0 "Bileşik bir pazarlık yapın."
 ve_tag_flavor.20.b.tt:0 "Bileşik Devlet gerektirir.\nHarcama #N 20 Kültürel Görev#! şimdi.\nYaklaşık bir yıl sonra: #P 8 National Insight kazanın#! ve #P 3 Ulusal Uyum#!, ardından #P +25 Bürokrasi kazanın#! Ve #N -%2,5 Asimilasyon#! 24 ay boyunca."
 ve_tag_flavor.20.c:0 "Federal formülü bilinçli olarak geniş bırakın."
 ve_tag_flavor.20.c.tt:0 "Yaklaşık bir yıl sonra: kazanç #P 4 Ulusal Bilgi#! Ve #P 24 ay boyunca +25 Etki#! . Değiştirici aktifken, Ulusal Uyum dengesi #N 2 daha düşüktür#!."
 ve_tag_flavor.21.t:0 "Birliğin Formülü"
 ve_tag_flavor.21.d:0 "Konvansiyonlar, komite raporları, devlet kararları ve kamuoyu tartışmalarıyla geçen bir yıl, kurumların kullanabileceği bir dil üretti. Birliğin hangi anlaşmazlıkları çözeceğini ve hangilerini müzakereye bırakacağını belirleyen açıklamaları kadar sessizlikleri de önemli."
 ve_tag_flavor.21.a:0 "Bırakın formül kamusal hayata girsin."
 ve_tag_flavor.21.a.tt:0 "Bir yıl önce seçilen sonuç artık yürürlüğe giriyor. Kaynak değişiklikleri normal sınırlarına sabitlenir ve kurumsal değiştirici 24 ay sürer."
