l_turkish:
 ve_doctrine_ambient_cooldown_mdf:0 "Doktrin Tartışması Bekleme Süresi"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Ülkenin kurumları, yakın zamanda yapılan bir doktrin tartışmasının sonuçlarını sindiriyor."
 ve_doctrine_ambient_ig_supported_mdf:0 "Kurumsal Destek"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Hükümet, bir doktrin tartışmasının çözüme kavuşturulmasında bu Çıkar Grubu'na görünür bir Rol vermiştir."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Kurumsal Hafife Alınma"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Hükümet, bu Çıkar Grubu'nu yakın zamandaki bir doktrin uzlaşmasının dışına itmiştir."

 ve_doctrine_industrialist_positive_mdf:0 "Standartlaştırılmış Sınai Uygulama"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Üreticiler, koordine edilmiş bir sınai uygulama bütününsden faydalanmaktadır."
 ve_doctrine_industrialist_negative_mdf:0 "Sınai Darboğazlar"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Çözülemeyen koordinasyon aksaklıkları imalatı kısıtlamaktadır."
 ve_doctrine_academic_positive_mdf:0 "Koordine Araştırma Ağı"
 ve_doctrine_academic_positive_mdf_desc:0 "Üniversiteler; koordine edilmiş bir ağ aracılığıyla yöntemleri, personeli ve sonuçları paylaşmaktadır."
 ve_doctrine_academic_negative_mdf:0 "Akademik Darboğazlar"
 ve_doctrine_academic_negative_mdf_desc:0 "Yetki ve koordinasyon anlaşmazlıkları üniversiteleri aksatmaktadır."
 ve_doctrine_nationalist_positive_mdf:0 "Ulusal Dernekler Ağı"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Ulusal dernekler, meşru hükümeti daha geniş bir Sadakat'e dönüştürmektedir."
 ve_doctrine_nationalist_negative_mdf:0 "Rakip Ulusal Cemiyetler"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Rakip ulusal kuruluşlar siyasi meşruluğu yeni hoşnutsuzluklara dönüştürmektedir."
 ve_doctrine_reformist_positive_mdf:0 "Organize Reform Ağı"
 ve_doctrine_reformist_positive_mdf_desc:0 "Siyasi Hareketler katılım ve uzlaşı için düzenli kanallar kazanmıştır."
 ve_doctrine_reformist_negative_mdf:0 "Parçalanmış Reform Koalisyonu"
 ve_doctrine_reformist_negative_mdf_desc:0 "Rakip reform kuruluşları siyasi Seferberlik'i Radikalizm'e dönüştürmektedir."
 ve_doctrine_professional_army_positive_mdf:0 "Karargâh Eğitim Döngüsü"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Koordine edilmiş bir karargâh programı ordunun eğitim sistemini geliştirmektedir."
 ve_doctrine_professional_army_negative_mdf:0 "Subay Sınıfı Darboğazı"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Terfi ve personel atama anlaşmazlıkları askerî eğitimi yavaşlatmaktadır."
 ve_doctrine_agrarian_positive_mdf:0 "Koordine Tarımsal Uygulama"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Kırsal kurumlar güvenilir yöntemleri tarım ekonomisine yaymaktadır."
 ve_doctrine_agrarian_negative_mdf:0 "Tarımsal Arz Kıtlığı"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Tohum, Kredi ve koordinasyon kıtlıkları tarımsal Üretim Hacmi'ni düşürmektedir."

 ve_idea_evt.10.t:0 "Tam Kapasitede Emniyet Kodları"
 ve_idea_evt.10.d:0 "Bir dizi fabrika kazası, sınai teftiş meselesini açıkça tartışmaya açmıştır. Bağımsız müfettişler güvenilir standartlar vaat ederken, üreticiler gönüllü kuralların çıktıyı ve girişimi koruyacağında ısrar etmektedir."
 ve_idea_evt.10.a:0 "Bağımsız müfettişler atayın."
 ve_idea_evt.10.a.tt:0 "#N 25#! Ulusal Kavrayış harcanır. Sendikalar 24 ay boyunca #P +1#! Onay kazanır ve Sanayiciler #N 1#! Onay kaybeder."
 ve_idea_evt.10.b:0 "Gönüllü kodları yazma işini Sanayiler'e bırakın."
 ve_idea_evt.10.b.tt:0 "Sanayiciler 24 ay boyunca #P +1#! Onay kazanır ve Sendikalar #N 1#! Onay kaybeder."
 ve_idea_evt.10.c:0 "Kuralları kademeli olarak standartlaştırın."
 ve_idea_evt.10.c.tt:0 "#N 10#! Ulusal Kavrayış harcanır. Hiçbir Çıkar Grubu Onayı değişmez."

 ve_idea_evt.11.t:0 "Standartlaştırılmış Makine Parçaları"
 ve_idea_evt.11.d:0 "Çeşitli sanayi bölgelerinden mühendislerin ortak bir ölçü, bağlantı parçası ve makine parçası kataloğu hazırladı. Ulusal bir standardı finanse etmek masraflı olur ancak üretim ağı genelindeki sürtünmeyi ortadan kaldırabilir."
 ve_idea_evt.11.a:0 "Standartları ülke genelinde benimseyin."
 ve_idea_evt.11.a.tt:0 "#N 40#! Ulusal Kavrayış harcayın ve 36 ay boyunca #P +5%#! İmalat Üretim Hacmi kazanın."
 ve_idea_evt.11.b:0 "Bulguları daha sonra kullanmak üzere arşivleyin."
 ve_idea_evt.11.b.tt:0 "#P 15#! Ulusal Kavrayış kazanın."
 ve_idea_evt.11.c:0 "Üretim ağlarımız halihazırda hazırlıklı."
 ve_idea_evt.11.c.tt:0 "#N 20#! Ulusal Kavrayış harcayın ve 36 ay boyunca #P +5%#! İmalat Üretim Hacmi kazanın."

 ve_idea_evt.12.t:0 "Fabrikalardaki Darboğaz"
 ve_idea_evt.12.d:0 "Uyumsuz prosedürler, geciken bileşenler ve karışık programlar ülkenin fabrikalarını tıkarken Emirler birikiyor. Hükümet uzman gönderebilir, sorunu firmalara bırakabilir ya da bir yanıtı koordine etmek için kurulmuş inşaat dairelerini kullanabilir."
 ve_idea_evt.12.a:0 "Uzman bir ekip görevlendirin."
 ve_idea_evt.12.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın ve sanayi cezasından kaçının."
 ve_idea_evt.12.b:0 "Fabrikalar bunu kendi başlarına çözmeli."
 ve_idea_evt.12.b.tt:0 "24 ay boyunca #N -5%#! İmalat Üretim Hacmi cezasına katlanın."
 ve_idea_evt.12.c:0 "İnşaat bürolarını harekete geçirin."
 ve_idea_evt.12.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın ve sanayi cezasından kaçının."

 ve_idea_evt.60.t:0 "Motorsanlaşma ve Toprak Mülkiyeti"
 ve_idea_evt.60.d:0 "Yeni makineler tarımsal çıktıyı artırabilir ancak kiracılar ve küçük toprak sahipleri, hızlı bir geçişin kırsal geçim kaynaklarını kökünden sarsacağından korkuyor. Hükümet, mekanizasyonu hızlandırmaya mı, önce mülkiyeti korumaya mı yoksa kademeli bir yerel geçişi koordine etmeye mi karar vermelidir."
 ve_idea_evt.60.a:0 "Bir mekanizasyon fonu oluşturun."
 ve_idea_evt.60.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın ve 24 ay boyunca #P +5%#! Tarım Üretim Hacmi kazanın. Sanayiciler 24 ay boyunca #P +1#! Çıkar Grubu Onayı kazanır ve Kırsal Kesim #N 1#! Çıkar Grubu Onayı kaybeder."
 ve_idea_evt.60.b:0 "Çiftlikleri değiştirmeden önce kiracıları güvenceye alın."
 ve_idea_evt.60.b.tt:0 "Kırsal Kesim #P +1#! Çıkar Grubu Onayı kazanır ve Toprak Sahipleri 24 ay boyunca #N 1#! Çıkar Grubu Onayı kaybeder."
 ve_idea_evt.60.c:0 "Kademeli bir geçiş için yerel üretim ağlarını kullanın."
 ve_idea_evt.60.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın ve 24 ay boyunca #P +5%#! Tarım Üretim Hacmi kazanın. Çıkar Grubu Onayı değişmez."

 ve_idea_evt.61.t:0 "Kooperatif Tahıl Ambarları"
 ve_idea_evt.61.d:0 "Kırsal kesimden delegeler, yedekleri, kayıtları ve nakliyeyi paylaşabilen kooperatif tahıl ambarı ağını gözler önüne serdi. Ulusal bir program tarımsal koordinasyonu güçlendirebilirken, yalnızca planları muhafaza etmek bile hükümetin kurumsal bilgisini zenginleştirecektir."
 ve_idea_evt.61.a:0 "Kooperatif ağını finanse edin."
 ve_idea_evt.61.a.tt:0 "#N 40#! Ulusal Kavrayış harcayın ve 36 ay boyunca #P +5%#! Tarım Üretim Hacmi kazanın."
 ve_idea_evt.61.b:0 "Kayıtları tarım dairelerine dağıtın."
 ve_idea_evt.61.b.tt:0 "#P 15#! Ulusal Kavrayış kazanın."
 ve_idea_evt.61.c:0 "Hâlihazırda kurulu olan kırsal kurumları kullanın."
 ve_idea_evt.61.c.tt:0 "#N 20#! Ulusal Kavrayış harcayın ve 36 ay boyunca #P +5%#! Tarım Üretim Hacmi kazanın."

 ve_idea_evt.62.t:0 "Tohum ve Kredi Kıtlığı"
 ve_idea_evt.62.d:0 "Zayıf tohum stokları ve daralan kırsal kredi yaklaşan tarım döngüsünü tehdit ediyor. Uzmanlar acil durum müdahalesi organize edebilir, yerel ağlar doğaçlama yapmaya bırakılabilir veya köklü geçim kurumları geçici olarak yükü sırtlanabilir."
 ve_idea_evt.62.a:0 "Acil durum uzmanlık programı düzenleyin."
 ve_idea_evt.62.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın ve tarım cezasından kaçının."
 ve_idea_evt.62.b:0 "Yerel ağların kendi çözümlerini bulmasına izin verin."
 ve_idea_evt.62.b.tt:0 "24 ay boyunca #N -5%#! Tarım Üretim Hacmi cezasına katlanın."
 ve_idea_evt.62.c:0 "Geçici bir omurga olarak geçim ağlarını kullanın."
 ve_idea_evt.62.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın ve tarım cezasından kaçının."

 ve_idea_evt.20.t:0 "Himaye mi Akran Değerlendirmesi mi"
 ve_idea_evt.20.d:0 "Hükümet, araştırma ödeneklerinden pratik sonuçlar beklerken akademisyenler himayenin kanıtın yerini siyasi faydacılıkla dolduracağı konusunda uyarıyor. Kalıcı bir uzlaşı, ülkenin ilmî birikimini kimin yargılayacağını tanımlamak zorundadır."
 ve_idea_evt.20.a:0 "Bağımsız değerlendirme kurulları kurun."
 ve_idea_evt.20.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın. Aydınlar #P +1#! Onay kazanır ve Küçük Burjuvazi 24 aylığına #N 1#! Onay kaybeder."
 ve_idea_evt.20.b:0 "Araştırma önceliklerini devletin belirlemesine izin verin."
 ve_idea_evt.20.b.tt:0 "Küçük Burjuvazi #P +1#! Onay kazanır ve Aydınlar 24 aylığına #N 1#! Onay kaybeder."
 ve_idea_evt.20.c:0 "Ortak akademik standartları kurumsallaştırın."
 ve_idea_evt.20.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın. Çıkar Grubu Onayı değişmez."
 ve_idea_evt.21.t:0 "Taşra Araştırma Ağı"
 ve_idea_evt.21.d:0 "Taşra yüksekokulları merkezi bir yönlendirme olmaksızın öğretim görevlileri, araç gereçler ve bulgular takas etmeye başladı. Resmi destek, bu doğaçlama iş birliğini ulusal bir araştırma ağına dönüştürebilir."
 ve_idea_evt.21.a:0 "Ağı finanse edin."
 ve_idea_evt.21.a.tt:0 "#N 40#! Ulusal Kavrayış harcayın ve 36 aylığına #P +5%#! Üniversite Üretim Hacmi kazanın."
 ve_idea_evt.21.b:0 "Raporları merkezi arşive kaydedin."
 ve_idea_evt.21.b.tt:0 "#P 15#! Ulusal Kavrayış kazanın."
 ve_idea_evt.21.c:0 "Ulusal akademiye bağlayın."
 ve_idea_evt.21.c.tt:0 "#N 20#! Ulusal Kavrayış harcayın ve 36 aylığına #P +5%#! Üniversite Üretim Hacmi kazanın."
 ve_idea_evt.22.t:0 "Sertifika Darboğazı"
 ve_idea_evt.22.d:0 "Üniversiteler artan öğrenci, eğitmen ve yeni disiplin sayısını yeterince hızlı değerlendiremiyor. Geciken sertifikalar artık daha geniş araştırma sistemini tehdit ediyor."
 ve_idea_evt.22.a:0 "Değerlendirme kapasitesini genişletin."
 ve_idea_evt.22.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın ve akademik cezadan kaçının."
 ve_idea_evt.22.b:0 "Mevcut kurumlar başının çaresine bakmalıdır."
 ve_idea_evt.22.b.tt:0 "24 aylığına #N -5%#! Üniversite Üretim Hacmi cezası alın."
 ve_idea_evt.22.c:0 "Okul ağı aracılığıyla standartlaştırın."
 ve_idea_evt.22.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın ve akademik cezadan kaçının."

 ve_idea_evt.30.t:0 "Tek Külliyat, Birçok Gelenek"
 ve_idea_evt.30.d:0 "Ulusal bir külliyat hazırlayan yetkililer taşra geleneklerinin yeri konusunda anlaşmazlığa düşüyor. Tek bir anlatı netlik vadederken, yerel gelenekleri dışlamak tanımlamayı amaçladığı ulusun kendisini zayıflatabilir."
 ve_idea_evt.30.a:0 "Yerel gelenekleri ortak hikayeye dahil edin."
 ve_idea_evt.30.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın. Kırsal Kesim #P +1#! Onay kazanır ve Küçük Burjuvazi 24 aylığına #N 1#! Onay kaybeder."
 ve_idea_evt.30.b:0 "Resmi tek bir külliyat ilan edin."
 ve_idea_evt.30.b.tt:0 "Küçük Burjuvazi #P +1#! Onay kazanır ve Kırsal Kesim 24 aylığına #N 1#! Onay kaybeder."
 ve_idea_evt.30.c:0 "İşi eğitilmiş kültürel kadrolara emanet edin."
 ve_idea_evt.30.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın. Çıkar Grubu Onayı değişmez."
 ve_idea_evt.31.t:0 "Gazi Ulusal Dernekleri"
 ve_idea_evt.31.d:0 "Gazi askerler, törenleri, karşılıklı yardımlaşmayı ve devlet sadakatini birbirine bağlayan teşkilatlar kurmuşlardır. Ağları ülke çapında genişletilebilir yahut kendilerine resmi bir rol verilmeksizin tetkik edilebilir."
 ve_idea_evt.31.a:0 "Dernekleri ülke çapında destekleyin."
 ve_idea_evt.31.a.tt:0 "#N 40#! Ulusal Kavrayış harcayın ve 36 aylığına Meşruluktan #P +5%#! Sadıklar kazanın."
 ve_idea_evt.31.b:0 "Deneyimlerini devlet arşivlerine kaydedin."
 ve_idea_evt.31.b.tt:0 "#P 15#! Ulusal Kavrayış kazanın."
 ve_idea_evt.31.c:0 "Halihazırda kurulmuş ulusal ağları kullanın."
 ve_idea_evt.31.c.tt:0 "#N 20#! Ulusal Kavrayış harcayın ve 36 aylığına Meşruluktan #P +5%#! Sadıklar kazanın."
 ve_idea_evt.32.t:0 "Rakip Milli Cemiyetler"
 ve_idea_evt.32.d:0 "Rakip cemiyetler şimdi ulus adına konuşma hakkını iddia ediyor. Birbiriyle yarışan törenleri ve yayınları, ortak bir siyasi dili bir şikayet kaynağına dönüştürüyor."
 ve_idea_evt.32.a:0 "Ortak bir tüzük taslağı hazırlayın."
 ve_idea_evt.32.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın ve milliyetçi cezasından kaçının."
 ve_idea_evt.32.b:0 "Rekabet kendi sınırlarını bulacaktır."
 ve_idea_evt.32.b.tt:0 "24 ay boyunca Meşruluk kaynaklı #N +5%#! Radikaller muzdarip olunur."
 ve_idea_evt.32.c:0 "Ulusal kurumların hakemlik etmesine izin verin."
 ve_idea_evt.32.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın ve milliyetçi cezasından kaçının."

 ve_idea_evt.40.t:0 "Komite mi Sokak mı"
 ve_idea_evt.40.d:0 "Reformcular uzman komisyonları ile kitlesel baskı arasında bölünmüş durumda. Komiteler tutarlı yasalar vadederken, organize hareketler kamusal güç olmaksızın yapılacak reformun süresiz olarak gecikeceğinde ısrar ediyor."
 ve_idea_evt.40.a:0 "Bağımsız bir reform komisyonu kurun."
 ve_idea_evt.40.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın. Aydınlar 24 ay boyunca #P +1#! Onay kazanır ve Sendikalar #N 1#! Onay kaybeder."
 ve_idea_evt.40.b:0 "Haketlere hareket alanı tanıyın."
 ve_idea_evt.40.b.tt:0 "Sendikalar 24 ay boyunca #P +1#! Onay kazanır ve Sanayiciler #N 1#! Onay kaybeder."
 ve_idea_evt.40.c:0 "Yerleşik haklar ve usuller çerçevesini uygulayın."
 ve_idea_evt.40.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın. Hiçbir Çıkar Grubu Onayı değişmez."
 ve_idea_evt.41.t:0 "Dilekçe Ağı"
 ve_idea_evt.41.d:0 "Yerel dilekçeler, şikayetleri ayıklamaya ve reformlar önermeye muktedir koordine bir ulusal ağ haline geldi. Hükümet bunu istişari bir kanal olarak tanıyabilir veya yöntemlerini daha sonra kullanmak üzere saklı tutabilir."
 ve_idea_evt.41.a:0 "Ağı resmi istişareye dönüştürün."
 ve_idea_evt.41.a.tt:0 "#N 40#! Ulusal Kavrayış harcayın ve 36 ay boyunca Siyasi Hareket Sadıkları için #P +5%#! kazanın."
 ve_idea_evt.41.b:0 "Talepleri inceleme arşivine kaldırın."
 ve_idea_evt.41.b.tt:0 "#P 15#! Ulusal Kavrayış kazanın."
 ve_idea_evt.41.c:0 "Hâlihazırda kurulmuş olan reform kuruluşlarını kullanın."
 ve_idea_evt.41.c.tt:0 "#N 20#! Ulusal Kavrayış harcayın ve 36 ay boyunca Siyasi Hareket Sadıkları için #P +5%#! kazanın."
 ve_idea_evt.42.t:0 "Koalisyonun Çatrdaması"
 ve_idea_evt.42.d:0 "Reform koalisyonu öncelikler, zamanlama ve liderlik konusunda bölünmektedir. Ortak bir program yeniden tesis edilmediği takdirde, organize siyasi enerji rakip radikal kamplara dönüşecektir."
 ve_idea_evt.42.a:0 "Ortak programı yeniden yazın."
 ve_idea_evt.42.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın ve reformcu cezasından kaçının."
 ve_idea_evt.42.b:0 "Bölünmenin açık siyasetin içine girmesine izin verin."
 ve_idea_evt.42.b.tt:0 "24 ay boyunca Siyasi Hareket Radikalleri sebebiyle #N +5%#! muzdarip olunur."
 ve_idea_evt.42.c:0 "Eşitlikçi çerçeveyi yeniden uygulayın."
 ve_idea_evt.42.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın ve reformcu cezasından kaçının."

 ve_idea_evt.50.t:0 "Kıdem mi Liyakat mi"
 ve_idea_evt.50.d:0 "Subay kadrosu terfi konusunda bölünmüş durumda. Kıdemli komutanlar hizmet ve gelenek yoluyla dereceyi savunurken, reformcular terfiyi kanıtlanmış yeteneğe açacak sınavlar ve performans sicilleri talep ediyor."
 ve_idea_evt.50.a:0 "Liyakat sınavlarını getirin."
 ve_idea_evt.50.a.tt:0 "#N 25#! Ulusal Kavrayış harcayın ve 24 ay boyunca Eğitim Oranı #P +5%#! kazanın. Silahlı Kuvvetler 24 ay boyunca #N 1#! Onay kaybeder."
 ve_idea_evt.50.b:0 "Kıdem sistemini koruyun."
 ve_idea_evt.50.b.tt:0 "Silahlı Kuvvetler 24 ay boyunca #P +1#! Onay kazanır, ancak Eğitim Oranı 12 ay boyunca #N -5%#! düşer."
 ve_idea_evt.50.c:0 "Genelkurmay'ın hizmet sicillerini kullanın."
 ve_idea_evt.50.c.tt:0 "#N 10#! Ulusal Kavrayış harcayın ve 24 ay boyunca Eğitim Oranı #P +5%#! kazanın. Çıkar Grubu Onayı değişmez."
 ve_idea_evt.51.t:0 "Büyük Kurmay Tatbikatı"
 ve_idea_evt.51.d:0 "Geniş çaplı bir kurmay tatbikatı; seferberlik, talim ve komuta hususlarında değerli dersler ortaya çıkardı. Programın genişletilmesi bu dersleri orduya yayabilirken, bulguların arşivlenmesi ise bunları düşük maliyetle koruyacaktır."
 ve_idea_evt.51.a:0 "Tatbikatı genişlet."
 ve_idea_evt.51.a.tt:0 "#N 40#! Ulusal Kavrayış harcanır ve 36 ay boyunca #P +5%#! Eğitim Oranı elde edilir."
 ve_idea_evt.51.b:0 "Bulguları doktrin arşivine kaldır."
 ve_idea_evt.51.b.tt:0 "#P 15#! Ulusal Kavrayış elde edilir."
 ve_idea_evt.51.c:0 "Profesyonel komuta ağını kullan."
