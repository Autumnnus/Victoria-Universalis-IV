 ve_doctrine_ambient_cooldown_mdf:0 "Doktrin Tartışması Bekleme Süresi"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Ülkenin kurumları yakın zamanda gerçekleşen bir doktrin tartışmasının sonuçlarını özümsüyor."
 ve_doctrine_ambient_ig_supported_mdf:0 "Kurumsal Destek"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Hükümet bu Çıkar Grubuna bir doktrin tartışmasını çözüme kavuşturmada görünür bir rol verdi."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Kurumsal Hafiflik"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Hükümet bu Çıkar Grubunu yakın zamanda yapılan bir doktrin çözümünden hariç tuttu."

 ve_doctrine_industrialist_positive_mdf:0 "Standartlaştırılmış Endüstriyel Uygulama"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Üreticiler, koordineli bir endüstriyel uygulama bütününden yararlanmaktadır."
 ve_doctrine_industrialist_negative_mdf:0 "Endüstriyel Darboğazlar"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Çözülmemiş koordinasyon hataları üretimi kısıtlıyor."
 ve_doctrine_academic_positive_mdf:0 "Koordineli Araştırma Ağı"
 ve_doctrine_academic_positive_mdf_desc:0 "Üniversiteler, koordineli bir ağ aracılığıyla yöntemleri, personeli ve sonuçları paylaşıyor."
 ve_doctrine_academic_negative_mdf:0 "Akademik Darboğazlar"
 ve_doctrine_academic_negative_mdf_desc:0 "Üniversiteler ve koordinasyon anlaşmazlıkları üniversiteleri sekteye uğratıyor."
 ve_doctrine_nationalist_positive_mdf:0 "Ulusal Dernekler Ağı"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Ulusal dernekler meşru hükümeti daha geniş bir sadakate dönüştürüyor."
 ve_doctrine_nationalist_negative_mdf:0 "Rekabet Eden Ulusal Dernekler"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Rakip ulusal örgütler siyasi meşruiyeti yeni şikâyetlere dönüştürüyor."
 ve_doctrine_reformist_positive_mdf:0 "Organize Reform Ağı"
 ve_doctrine_reformist_positive_mdf_desc:0 "Siyasi hareketler katılım ve uzlaşma için düzenli kanallar kazandı."
 ve_doctrine_reformist_negative_mdf:0 "Parçalanmış Reform Koalisyonu"
 ve_doctrine_reformist_negative_mdf_desc:0 "Rakip reform örgütleri siyasi seferberliği radikalizme dönüştürüyor."
 ve_doctrine_professional_army_positive_mdf:0 "Personel Eğitim Döngüsü"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Koordineli bir personel programı ordunun eğitim sistemini iyileştiriyor."
 ve_doctrine_professional_army_negative_mdf:0 "Subay Birlikleri Darboğaz"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Terfi ve personel anlaşmazlıkları askeri eğitimi yavaşlatıyor."
 ve_doctrine_agrarian_positive_mdf:0 "Koordineli Tarım Uygulamaları"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Kırsal kurumlar tarım ekonomisinde güvenilir yöntemler yayıyor."
 ve_doctrine_agrarian_negative_mdf:0 "Tarımsal Arz Kıtlığı"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Ekonomik Kıtlıklar tohum, kredi ve koordinasyon tarımsal üretimi azaltıyor."

 ve_idea_evt.10.t:0 "Tam Çıkışta Güvenlik Kodları"
 ve_idea_evt.10.d:0 "Bir dizi fabrika kazası, endüstriyel denetim sorununun açığa çıkmasına neden oldu. Bağımsız denetçiler güvenilir standartlar vaat ederken, üreticiler gönüllü kuralların çıktıyı ve inisiyatifi koruyacağı konusunda ısrar ediyor."
 ve_idea_evt.10.a:0 "Bağımsız denetçiler atayın."
 ve_idea_evt.10.a.tt:0 "Harcama #N 25#! Ulusal Anlayış. Sendikalar 24 ay boyunca  #P +1#! Onay alıyor, Sanayiciler ise  #N 1#! Onayı kaybediyor."
 ve_idea_evt.10.b:0 "Bırakın sektörler gönüllü kodlar yazsın."
 ve_idea_evt.10.b.tt:0 "Sanayiciler #P +1#! Onay alır, Sendikalar kaybeder #N 1#! 24 ay süreyle onay."
 ve_idea_evt.10.c:0 "Kuralları aşamalı olarak standartlaştırın."
 ve_idea_evt.10.c.tt:0 "Harcayın #N 10#! Ulusal İçgörü. İlgi Grubu Onayında değişiklik yok."

 ve_idea_evt.11.t:0 "Standartlaştırılmış Makine Parçaları"
 ve_idea_evt.11.d:0 "Çeşitli sanayi bölgelerinden mühendisler, göstergeler, bağlantı parçaları ve makine parçalarının ortak bir kataloğunu oluşturdular. Ulusal bir standardın finansmanı maliyetli olabilir ancak üretim ağındaki sürtüşmeleri ortadan kaldırabilir."
 ve_idea_evt.11.a:0 "Standartları ülke çapında benimseyin."
 ve_idea_evt.11.a.tt:0 "Harcayın #N 40#! Ulusal İçgörü ve kazanç #P +%5#! 36 ay boyunca Üretim Üretim Hacmi."
 ve_idea_evt.11.b:0 "Bulguları daha sonra kullanmak üzere arşivleyin."
 ve_idea_evt.11.b.tt:0 "Kazanç #P 15#! Ulusal İçgörü."
 ve_idea_evt.11.c:0 "Üretim ağlarımız zaten hazırlandı."
 ve_idea_evt.11.c.tt:0 "Harcama #N 20#! Ulusal İçgörü ve Kazanç #P +%5#! 36 Aylık Üretim Üretim Hacmi."

 ve_idea_evt.12.t:0 "İşyerlerindeki Darboğaz"
 ve_idea_evt.12.d:0 "Uyumsuz prosedürler, geciken bileşenler ve karışık programlar ülkenin fabrikalarını boğarken siparişler birikiyor. Hükümet uzmanlar gönderebilir, sorunu firmalara bırakabilir veya müdahaleyi koordine etmek için yerleşik inşaat ofislerini kullanabilir."
 ve_idea_evt.12.a:0 "Uzman bir ekip gönderin."
 ve_idea_evt.12.a.tt:0 "Harcama #N 25#! National Insight ve endüstriyel cezadan kaçınma."
 ve_idea_evt.12.b:0 "Fabrikaların bu sorunu kendilerinin çözmesi gerekiyor."
 ve_idea_evt.12.b.tt:0 "24 ay boyunca #N -%5#! Üretim Verimliliğiyle karşı karşıya kalın."
 ve_idea_evt.12.c:0 "İnşaat bürolarını etkinleştirin."
 ve_idea_evt.12.c.tt:0 "Harcayın #N 10#! Ulusal İçgörü ve endüstriyel cezadan kaçının."

 ve_idea_evt.60.t:0 "Makineleşme ve Kullanım Süresi"
 ve_idea_evt.60.d:0 "Yeni makineler tarımsal üretimi artırabilir, ancak kiracılar ve küçük mülk sahipleri hızlı bir geçişin kırsal geçim kaynaklarını ortadan kaldıracağından korkuyor. Hükümet, makineleşmeyi hızlandırmak mı, önce mülkiyeti korumak mı yoksa kademeli bir yerel geçişi koordine etmek mi gerektiğine karar vermelidir."
 ve_idea_evt.60.a:0 "Bir mekanizasyon fonu oluşturun."
 ve_idea_evt.60.a.tt:0 "Harcama yapın #N 25#! Ulusal Bilgi ve kazanç #P +%5#! 24 ay boyunca Tarım Üretimi. Sanayici  #P +1#! Onay alıyor, Köylü kaybediyor #N 1#! 24 ay boyunca onay."
 ve_idea_evt.60.b:0 "Çiftlikleri değiştirmeden önce kiracıların güvenliğini sağlayın."
 ve_idea_evt.60.b.tt:0 "Kırsal Halk, #P +1#! Onay kazanır ve Arazi Sahipleri  #N 1#! 24 ay için Onay kaybeder."
 ve_idea_evt.60.c:0 "Kademeli bir geçiş için yerel üretim ağlarını kullanın."
 ve_idea_evt.60.c.tt:0 "Harcayın #N 10#! Ulusal İçgörü ve kazanç #P +%5#! 24 ay boyunca Tarım Üretimi. Çıkar Grubu Onayında değişiklik yok."

 ve_idea_evt.61.t:0 "Kooperatif Tahıl Ambarları"
 ve_idea_evt.61.d:0 "Kırsal delegeler, rezervleri, kayıtları ve taşımayı paylaşma kapasitesine sahip bir kooperatif tahıl ambarları ağı sergilediler. Ulusal bir program tarımsal koordinasyonu güçlendirebilir, aynı zamanda planların korunması da hükümetin kurumsal bilgisini zenginleştirebilir."
 ve_idea_evt.61.a:0 "Kooperatif ağını finanse edin."
 ve_idea_evt.61.a.tt:0 " #N 40#! Ulusal İçgörü harcayın ve 36 ay boyunca #P +%5#! Tarım Verimi kazanın."
 ve_idea_evt.61.b:0 "Kayıtları tarım ofislerine dağıtın."
 ve_idea_evt.61.b.tt:0 " #P 15#! Ulusal İçgörü kazanın."
 ve_idea_evt.61.c:0 "Halihazırda mevcut olan kırsal kurumları kullanın."
 ve_idea_evt.61.c.tt:0 "Harcayın #N 20#! Ulusal Bilgi ve Kazanç #P +%5#! 36 Aylık Tarım Üretimi."

 ve_idea_evt.62.t:0 "Tohum ve Kredi Kıtlığı"
 ve_idea_evt.62.d:0 "Zayıf tohum stokları ve sıkılaşan kırsal kredi, önümüzdeki tarım döngüsünü tehdit ediyor. Uzmanlar bir acil durum müdahalesi organize edebilir, yerel ağlar doğaçlama yapmaya bırakılabilir veya yerleşik geçim kurumları bu yükü geçici olarak üstlenebilir."
 ve_idea_evt.62.a:0 "Bir acil durum uzmanlık programı düzenleyin."
 ve_idea_evt.62.a.tt:0 " #N 25#! Ulusal İçgörü harcayın ve tarımsal cezadan kurtulun."
 ve_idea_evt.62.b:0 "Yerel ağların kendi çözümlerini bulmasına izin verin."
 ve_idea_evt.62.b.tt:0 "Acı çekin #N -%5#! 24 ay boyunca Tarım Üretimi."
 ve_idea_evt.62.c:0 "Geçim ağlarını geçici bir omurga olarak kullanın."
 ve_idea_evt.62.c.tt:0 "Harcamak #N 10#! Ulusal Görüş ve tarımsal cezadan kaçının."

 ve_idea_evt.20.t:0 "Patronaj veya Akran Değerlendirmesi"
 ve_idea_evt.20.d:0 "Hükümet, araştırma bağışlarından pratik sonuçlar beklerken, bilim insanları, himayenin kanıtların yerini siyasi kolaylıklarla değiştireceği konusunda uyarıyor. Kalıcı bir çözüm, ülkenin öğrenimini kimin değerlendireceğini tanımlamalıdır."
 ve_idea_evt.20.a:0 "Bağımsız inceleme kurulları oluşturun."
 ve_idea_evt.20.a.tt:0 "Harcamak #N 25#! Ulusal Bilgi. Entelijansiya kazanıyor #P +1#! Onay ve Küçük Burjuvazi kaybeder #N 1#! 24 ay boyunca Onay."
 ve_idea_evt.20.b:0 "Araştırma önceliklerini devlet belirlesin."
 ve_idea_evt.20.b.tt:0 "Küçük Burjuvazi kazanır #P +1#! Onay ve Entelijansiya, #N 1#! 24 ay boyunca onayı kaybeder."
 ve_idea_evt.20.c:0 "Ortak akademik standartları kurumsallaştırın."
 ve_idea_evt.20.c.tt:0 "Harcamak #N 10#! Ulusal Bilgi. İlgi Grubu Onayında değişiklik yok."
 ve_idea_evt.21.t:0 "İl Araştırma Ağı"
 ve_idea_evt.21.d:0 "Eyalet kolejleri, merkezi yönlendirme olmaksızın öğretim üyelerini, enstrümanları ve bulguları paylaşmaya başladı. Resmi destek, bu doğaçlama işbirliğini ulusal bir araştırma ağına dönüştürebilir."
 ve_idea_evt.21.a:0 "Ağı finanse edin."
 ve_idea_evt.21.a.tt:0 "Harcamak #N 40#! Ulusal İçgörü ve kazanç #P +%5#! 36 ay boyunca Üniversite Verimi."
 ve_idea_evt.21.b:0 "Raporları merkezi arşive yerleştirin."
 ve_idea_evt.21.b.tt:0 " #P 15#! Ulusal İçgörü kazanın."
 ve_idea_evt.21.c:0 "Ulusal akademiye bağlayın."
 ve_idea_evt.21.c.tt:0 "Harcayın #N 20#! Ulusal İçgörü ve 36 ay boyunca #P +%5#! Üniversite Verimi kazanın."
 ve_idea_evt.22.t:0 "Sınav Darboğazı"
 ve_idea_evt.22.d:0 "Üniversiteler artan sayıda öğrenci, eğitmen ve yeni disiplinleri yeterince hızlı değerlendiremiyor. Geciken kimlik bilgileri artık daha geniş araştırma sistemini tehdit ediyor."
 ve_idea_evt.22.a:0 "Değerlendirme kapasitesini genişletin."
 ve_idea_evt.22.a.tt:0 "National Insight'ı harcayın #N 25#! Akademik cezadan kaçının."
 ve_idea_evt.22.b:0 "Mevcut kurumların bununla başa çıkması gerekiyor."
 ve_idea_evt.22.b.tt:0 "Zarar görmek #N -%5#! 24 ay boyunca Üniversite Verimi."
 ve_idea_evt.22.c:0 "Okul ağı aracılığıyla standartlaştırın."
 ve_idea_evt.22.c.tt:0 "Harcamak #N 10#! National Insight ve akademik cezadan kaçının."

 ve_idea_evt.30.t:0 "Bir Kanon, Birçok Gelenek"
 ve_idea_evt.30.d:0 "Ulusal bir kanon hazırlayan yetkililer, eyalet geleneklerinin yeri konusunda anlaşamıyorlar. Tek bir açıklama netlik vaat ediyor, ancak yerel gelenekleri dışlamak, tanımlamayı amaçladığı ulusun kendisini zayıflatabilir."
 ve_idea_evt.30.a:0 "Yerel gelenekleri ortak hikayeye dahil edin."
 ve_idea_evt.30.a.tt:0 "Harcamak #N 25#! Ulusal Bilgi. Kırsal Halk kazancı #P +1#! Onay ve Küçük Burjuvazi kaybeder #N 1#! 24 ay boyunca Onay'ı kaybeder."
 ve_idea_evt.30.b:0 "Bir resmi kanon ilan edin."
 ve_idea_evt.30.b.tt:0 "Küçük Burjuvazi kazanır #P +1#! Onay ve Kırsal Halk  #N 1#! 24 ay süreyle onayı kaybeder."
 ve_idea_evt.30.c:0 "İşi eğitimli kültür kadrolarına emanet edin."
 ve_idea_evt.30.c.tt:0 "Harcayın #N 10#! Ulusal Bilgi. Çıkar Grubu Onayında değişiklik yok."
 ve_idea_evt.31.t:0 "Ulusal Gaziler Dernekleri"
 ve_idea_evt.31.d:0 "Gaziler tören, karşılıklı yardım ve sadakati devlete bağlayan dernekler düzenlemiştir. Ağları ülke çapında genişletilebilir veya resmi bir rol verilmeden incelenebilir."
 ve_idea_evt.31.a:0 "Dernekleri ülke çapında destekleyin."
 ve_idea_evt.31.a.tt:0 "Harcama yapın #N 40#! Ulusal İçgörü ve kazanç #P +%5#! 36 ay boyunca Meşruiyetten Sadıklar."
 ve_idea_evt.31.b:0 "Deneyimlerini devlet arşivlerine kaydedin."
 ve_idea_evt.31.b.tt:0 "Kazanç #P 15#! Ulusal Bilgi."
 ve_idea_evt.31.c:0 "Halihazırda kurulmuş olan ulusal ağları kullanın."
 ve_idea_evt.31.c.tt:0 "Harcama #N 20#! Ulusal İçgörü ve 36 ay boyunca Meşruiyetten  #P +%5#! Sadıklar kazanın."
 ve_idea_evt.32.t:0 "Rekabet Eden Ulusal Dernekler"
 ve_idea_evt.32.d:0 "Rakip toplumlar artık ulus adına konuşma hakkını talep ediyor. Birbiriyle yarışan törenler ve yayınlar, ortak siyasi dili bir şikâyet kaynağına dönüştürüyor."
 ve_idea_evt.32.a:0 "Ortak bir tüzük taslağı hazırlayın."
 ve_idea_evt.32.a.tt:0 " #N 25#! Ulusal İçgörü harcayın ve milliyetçi cezadan kaçının."
 ve_idea_evt.32.b:0 "Rekabet kendi sınırlarını bulacaktır."
 ve_idea_evt.32.b.tt:0 "Acı çek #N +%5#! 24 ay boyunca Meşruiyetten Radikaller."
 ve_idea_evt.32.c:0 "Bırakın ulusal kurumlar hakemlik yapsın."
 ve_idea_evt.32.c.tt:0 "Ulusal İçgörüyü harcayın #N 10#! Milliyetçi cezadan kaçının."

 ve_idea_evt.40.t:0 "Komite veya Sokak"
 ve_idea_evt.40.d:0 "Reformcular uzman komisyonları ve kitlesel baskı arasında bölünmüş durumda. Komiteler tutarlı mevzuat sözü verirken, organize hareketler kamu gücü olmadan reformun süresiz olarak erteleneceği konusunda ısrar ediyor."
 ve_idea_evt.40.a:0 "Bağımsız bir reform komisyonu oluşturun."
 ve_idea_evt.40.a.tt:0 "Harcama yapın #N 25#! Ulusal Bilgi. Entelijansiyanın kazancı #P +1#! Onay ve Sendikalar  #N 1#! 24 ay süreyle Onay kaybeder."
 ve_idea_evt.40.b:0 "Hareketlere hareket alanı tanıyın."
 ve_idea_evt.40.b.tt:0 "Sendikalar kazanır #P +1#! Onay ve Sanayici  #N 1#! 24 ay süreyle Onay kaybeder."
 ve_idea_evt.40.c:0 "Oluşan hak ve prosedür çerçevesini uygulayın."
 ve_idea_evt.40.c.tt:0 "Harcayın #N 10#! Ulusal İçgörü. Çıkar Grubu Onayında değişiklik yok."
 ve_idea_evt.41.t:0 "Dilekçe Ağı"
 ve_idea_evt.41.d:0 "Yerel dilekçeler, şikayetleri çözebilen ve reformlar önerebilen koordineli bir ulusal ağ haline geldi. Hükümet bunu bir danışma kanalı olarak tanıyabilir veya yöntemlerini daha sonra kullanmak üzere koruyabilir."
 ve_idea_evt.41.a:0 "Ağını resmi istişareye dönüştürün."
 ve_idea_evt.41.a.tt:0 "Harcama #N 40#! Ulusal İçgörü ve kazanın #P +%5#! 36 ay boyunca Siyasi Hareketlerden Sadıklar."
 ve_idea_evt.41.b:0 "İnceleme arşivindeki talepleri dosyalayın."
 ve_idea_evt.41.b.tt:0 "Kazanç #P 15#! Ulusal Görüş."
 ve_idea_evt.41.c:0 "Halihazırda kurulmuş olan reform örgütlerini kullanın."
 ve_idea_evt.41.c.tt:0 "Harcama #N 20#! Ulusal İçgörü ve Kazanın #P +%5#! 36 ay boyunca Siyasi Hareketlerden Sadıklar."
 ve_idea_evt.42.t:0 "Koalisyon Kırıkları"
 ve_idea_evt.42.d:0 "Reform koalisyonu öncelikler, zamanlama ve liderlik konusunda bölünüyor. Ortak bir program yeniden tesis edilmedikçe, organize siyasi enerji sertleşerek rakip radikal kamplara dönüşecektir."
 ve_idea_evt.42.a:0 "Ortak programı yeniden yazın."
 ve_idea_evt.42.a.tt:0 "Ulusal İçgörüyü harcayın #N 25#! Reformcu cezadan kaçının."
 ve_idea_evt.42.b:0 "Bölünmenin açık siyasete girmesine izin verin."
 ve_idea_evt.42.b.tt:0 "24 ay boyunca Siyasi Hareketlerden gelen Radikaller #N +%5#! Radikaller."
 ve_idea_evt.42.c:0 "Eşitlikçi çerçeveyi yeniden uygulayın."
 ve_idea_evt.42.c.tt:0 "Harcama #N 10#! National Insight ve reformcu cezalardan kaçının."

 ve_idea_evt.50.t:0 "Kıdem veya Liyakat"
 ve_idea_evt.50.d:0 "Subay kadrosu terfi konusunda bölünmüş durumda. Kıdemli komutanlar rütbeyi hizmet ve gelenek bazında savunurken, reformcular ilerlemeyi kanıtlanmış yeteneğe açacak sınavlar ve performans kayıtları talep ediyor."
 ve_idea_evt.50.a:0 "Liyakat sınavlarını tanıtın."
 ve_idea_evt.50.a.tt:0 "Harcayın #N 25#! Ulusal İçgörü ve kazanç 24 ay boyunca #P +%5#! Eğitim Oranı. Silahlı Kuvvetler kaybediyor #N 1#! 24 ay onay."
 ve_idea_evt.50.b:0 "Kıdem sistemini koruyun."
 ve_idea_evt.50.b.tt:0 "Silahlı Kuvvetler kazanır #P +1#! 24 ay onay ancak Eğitim Oranı % #N -5 düşer#! 12 ay boyunca."
 ve_idea_evt.50.c:0 "Genelkurmay hizmet kayıtlarını kullanın."
 ve_idea_evt.50.c.tt:0 "Harcama #N 10#! Ulusal İçgörü ve kazanç #P +%5#! 24 ay boyunca Eğitim Oranı. Çıkar Grubunun Onayı değişmez."
 ve_idea_evt.51.t:0 "Büyük Personel Tatbikatı"
 ve_idea_evt.51.d:0 "Büyük bir personel tatbikatı seferberlik, talimat ve komuta konularında değerli dersleri ortaya çıkardı. Programın genişletilmesi bu derslerin orduya yayılmasını sağlayabilirken, bulguların arşivlenmesi de bunların çok az maliyetle korunmasını sağlayacaktır."
 ve_idea_evt.51.a:0 "Egzersizi genişletin."
 ve_idea_evt.51.a.tt:0 "Harcamak #N 40#! Ulusal İçgörü ve kazanç #P +%5#! 36 ay Eğitim Oranı."
 ve_idea_evt.51.b:0 "Bulguları doktrin arşivine yerleştirin."
 ve_idea_evt.51.b.tt:0 "Kazanç #P 15#! Ulusal İçgörü."
 ve_idea_evt.51.c:0 "Profesyonel komuta ağını kullanın."
 ve_idea_evt.51.c.tt:0 "Harcayın #N 20#! Ulusal İçgörü ve kazanın #P +%5#! 36 Aylık Eğitim Oranı."
