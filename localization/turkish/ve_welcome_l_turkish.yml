 # Victoria Universalis IV 2.0 karşılama olayı - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Bu kampanya yeniden yazılmış Victoria Universalis IV üzerinde çalışıyor. Kısaca:\n\n#Y Din#! - Kilise ve Devlet yasanız artık dört Dini Modelden birini belirliyor. 0-100 arası bir Dini Uzlaşı göstergeniz olur, Dindarlık Reformu harcayarak her modele ait sekiz kalıcı programdan birini alırsınız ve seçtiğiniz bir eyalette tek bir hedefli Dini Proje yürütebilirsiniz.\n\n#Y Ulusal Kimlik#! - Etnik, Sivil veya Bileşik ulus modeli; harcanacak Kültürel Yetki, yüksek tutulması gereken bir Ulusal Bütünlük göstergesi ve beş Kültürel Proje.\n\n#Y Fikir Grupları#! - Üretim, Toplum ve Ordu altında, yeni Tarımcı grup dahil 21 grup. Grup slotları artık takvimle değil doktrin yatırımıyla kazanılıyor ve her alım size 24 aylık bir uygulama süresine mal oluyor.\n\n#Y Ulusal Fikirler#! - On iki yeni ülke profili ve artık ilerleme, satın aldığınız her fikir seviyesinden geliyor.\n\n#Y Çağlar#! - Hedefleriyle üç Çağ, on üç Çağ Ödülü slotu ve üç Altın Çağ; ayrıca her Çağ için bir stratejik Çağ Kavşağı yolculuğu.\n\n#Y Yeni içerik#! - Yüzden fazla yeni olay: doktrin ikilemleri, yıllar süren Doktrin Yolculukları, proje olayları ve krizleri, ayrıca Osmanlı, Japonya ve Amerika Birleşik Devletleri için özel zincirler.\n\n#Y Arayüz#! - Yeni bir üst çubuk satırı, yeniden tasarlanmış Din ve Ulusal Kimlik sayfaları, her ülke panelinde doktrin özeti ve tüm dünyayı kapsayan bir Doktrin Defteri."
 ve_welcome.1.f:0 "Her doktrin, onu benimseyen ulusta bir iz bırakır."
 ve_welcome.1.a:0 "Ayrıntılar için modun açıklamasına bakın. İyi eğlenceler ^_^"
