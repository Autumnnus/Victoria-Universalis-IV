l_turkish:
 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Bu kampanya, yeniden inşa edilmiş Victoria Universalis IV üzerinde yürütülmektedir. Kısaca:\n\n#Y Din#! - Kilise ve Devlet kanununuz artık dört Dinî Modelden birini belirler. 0-100 Dinî Uzlaşı göstergesine sahipsiniz, her model için sekiz kalıcı programa Dindarlık Reformu harcarsınız ve seçtiğiniz bir vilayette bir hedefli Dinî Proje yürütebilirsiniz.\n\n#Y Ulusal Kimlik#! - Etnik, Sivil veya Karma ulus olma durumu, harcanacak Kültürel Yetki, yüksek tutulacak bir Ulusal Uyum göstergesi ve beş Kültürel Proje ile.\n\n#Y Fikir Grupları#! - Üretim, Toplum ve Ordu genelinde 21 grup, yeni Tarımcı grubu dahil. Grup yuvaları takvim yerine doktrin yatırımıyla kazanılır ve her satın alma size 24 aylık bir uygulama süresi maliyeti getirir.\n\n#Y Ulusal Fikirler#! - On iki yeni ülke profili ve ilerleme artık satın aldığınız her fikir seviyesinden gelir.\n\n#Y Çağlar#! - Hedefli üç Çağ, on üç Çağ Ödülü yuvası ve üç Altın Çağ, ayrıca her Çağ için bir stratejik Çağ Kavşağı yolculuğu.\n\n#Y Yeni içerik#! - Yüzden fazla yeni olay: doktrin ikilemleri, çok yıllık Doktrin Yolculukları, proje olayları ve krizleri ve Osmanlılar, Japonya ve Amerika Birleşik Devletleri için tema zincirleri.\n\n#Y Arayüz#! - Yeni bir üst çubuk sırası, yeniden inşa edilmiş Din ve Ulusal Kimlik sayfaları, her ülke panelinde bir doktrin okuması ve dünya çapında bir Doktrin Defteri."
 ve_welcome.1.f:0 "Her doktrin, onu benimseyen ulus üzerinde iz bırakır."
 ve_welcome.1.a:0 "Detaylar için mod açıklamasına bakınız. İyi eğlenceler ^_^"
