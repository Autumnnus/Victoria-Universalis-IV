l_turkish:
 ve_je_religious_project:0 "Dinî Proje"
 ve_je_religious_project_reason:0 "Hükümet uzun vadeli bir dinî proje yürütmektedir. Projenin ilerlemesi idari kapasite, siyasi meşruluk, dinî koşullar ve hedef vilayetteki olaylar tarafından belirlenir."
 ve_je_religious_project_progress:0 "Dinî Proje'nin tamamlama yönündeki ilerlemesi"
 ve_je_religious_project_status_confessional:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] içindeki Devlet Dini Dönüşümü, organize bir kampanya aracılığıyla devlet dinini yaymaya çalışmaktadır.\n\n#Y 125#! ilerlemede tamamlama: hedef vilayet nüfusunun %5'ini devlet dinine dönüştürür, #P 20#! Dindarlık Reformu iade eder ve #P 5#! Dinî Uzlaşı ekler."
 ve_je_religious_project_status_freedom:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] içindeki Özgürlük Girişimi, vicdana ve gönüllü birliğe dayanan bir uzlaşı inşa etmektedir.\n\n#Y 100#! ilerlemede tamamlama: zorunlu din değiştirme olmaksızın vilayet sadıkları ekler, #P 20#! Dindarlık Reformu iade eder ve #P 7#! Dinî Uzlaşı ekler."
 ve_je_religious_project_status_secularization:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] içindeki Laikleştirme Kampanyası, organize dinin kamusal otoritesini azaltmaktadır.\n\n#Y 150#! ilerlemede tamamlama: hedef vilayet nüfusunun %5'ini ateizme dönüştürür, #P 25#! Dindarlık Reformu iade eder ve #P 8#! Dinî Uzlaşı ekler."
 ve_je_religious_project_complete_tt:0 "Dinî Proje hedefine ulaştı."
 ve_je_religious_project_fail_tt:0 "Dinî Proje iptal edildi."

 ve_je_cultural_project:0 "Kültürel Proje"
 ve_je_cultural_project_reason:0 "Hükümet uzun vadeli bir kültürel proje yürütmektedir. İdari kapasite, meşruluk, eğitim, ulusal uyum ve yerel koşullar projenin hızını belirler."
 ve_je_cultural_project_progress:0 "Kültürel Proje'nin tamamlama yönündeki ilerlemesi"
 ve_je_cultural_project_status_curriculum:0 "Ülkenin okulları ve kurumları için bir Ulusal Müfredat hazırlanmaktadır.\n\n#Y 100#! ilerlemede tamamlama: #P +20#! Kültürel Yetki, #P +5#! Ulusal Uyum ve 10 yıllık bir sonuç olarak +%2 Eğitime Erişim, +%5 Nitelikler, -25 Bürokrasi."
 ve_je_cultural_project_status_symbols:0 "Ortak Simgeler programı ortak bir yurttaşlık kelime dağarcığı oluşturmaktadır.\n\n#Y 75#! ilerlemede tamamlama: #P +20#! Kültürel Yetki, #P +7#! Ulusal Uyum ve 8 yıllık bir sonuç olarak tam kabul gören toplumlardan +%10 sadık ve +25 Otorite."
 ve_je_cultural_project_status_ethnic:0 "[ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] içindeki Etnik Bütünleşme Kampanyası, azınlık nüfusu ana kültüre doğru baskılamaktadır.\n\n#Y 125#! ilerlemede tamamlama: hedef kültürün toplumlarının %5'ini ana kültüre dönüştürür (Milliyetçi VII ile %7), #P +25#! Kültürel Yetki, #P +8#! Ulusal Uyum ve 10 yıllık bir asimilasyon sonucu."
 ve_je_cultural_project_status_civic:0 "[ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] içindeki Eşit Yurttaşlık Girişimi, kültür çizgileri ötesinde ortak bir yurttaşlık statüsü yaymaktadır.\n\n#Y 100#! ilerlemede tamamlama: 10 yıl boyunca +%15 Kabul, vilayet sadıkları, #P +25#! Kültürel Yetki, #P +10#! Ulusal Uyum ve 10 yıllık nitelikler/göç sonucu."
 ve_je_cultural_project_status_composite:0 "[ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] içindeki Bileşen Uzlaşması, bileşik devlet içinde kalıcı tanımayı müzakere etmektedir.\n\n#Y 150#! ilerlemede tamamlama (40+ Ulusal Uyum gerektirir): kalıcı +%15 Kabul, kültürü bileşen listesine ekler, vilayet sadıkları, #P +30#! Kültürel Yetki, #P +12#! Ulusal Uyum."
 ve_je_cultural_project_complete_tt:0 "Kültürel Proje hedefine ulaştı."
 ve_je_cultural_project_fail_tt:0 "Kültürel Proje iptal edildi."
 ve_je_project_resolving_status:0 "Proje idaresi nihai raporunu sunmaktadır."

 ve_evt_religious_incident_cooldown_mdf:0 "Dinî Proje Olayı Bekleme Süresi"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "Proje idaresi yakın tarihteki bir olayın sonuçlarını sindirmektedir."
 ve_evt_cultural_incident_cooldown_mdf:0 "Kültürel Proje Olayı Bekleme Süresi"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "Proje idaresi yakın tarihteki bir olayın sonuçlarını sindirmektedir."
 ve_evt_central_clergy_supported_mdf:0 "Merkezi Ruhban Sınıfı Desteklendi"
 ve_evt_central_clergy_supported_mdf_desc:0 "Hükümet merkezi dinî hiyerarşinin otoritesini desteklemiştir."
 ve_evt_central_clergy_slighted_mdf:0 "Merkezi Ruhban Sınıfı Hafife Alındı"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Hükümet merkezi dinî hiyerarşinin tercihlerine karşı yerel uygulamaları kayırmıştır."
 ve_evt_municipal_patronage_mdf:0 "Belediye Himaye Ağları"
 ve_evt_municipal_patronage_mdf_desc:0 "Yerel ileri gelenler, vergi toplamayı zayıflatan düzenlemelerle projeyi ilerletmektedir."

 ve_rel_evt.1.t:0 "Yerel Önde Gelenlerin Dilekçesi"
 ve_rel_evt.1.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] vilayetinden bir din adamları, belediye figürleri ve mahalle ileri gelenleri heyeti, hükümete Devlet Dini Dönüşümü'nü yavaşlatması için dilekçe sundu. Esnek olmayan bir takvimin, uyumu kalıcı bir kırgınlığa dönüştüreceği konusunda uyarıyorlar."
 ve_rel_evt.1.f:0 "\"İstişare olmaksızın dayatılan inanç, kilise sıralarını boşaltırken resmi kayıtları doldurabilir.\""
 ve_rel_evt.1.a:0 "Dilekçelerini dinleyin."
 ve_rel_evt.1.a.tt:0 "Dinî Proje ilerlemesi #N 4#! azalır.\nDinî Yerleşim #P 3#! artar."
 ve_rel_evt.1.b:0 "Takvim değişmeyecektir."
 ve_rel_evt.1.b.tt:0 "Dinî Proje ilerlemesi #P 5#! artar.\nDinî Yerleşim #N 2#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] vilayetindeki nüfusun #N %0.5#! kadarı Radikal hâline gelir."
 ve_rel_evt.1.c:0 "Güvenilir aracıları görevlendirin."
 ve_rel_evt.1.c.tt:0 "#N 10#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 3#! artar.\nDinî Yerleşim #P 1#! artar."

 ve_rel_evt.2.t:0 "Saha Subayların Eksikliği"
 ve_rel_evt.2.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] vilayetinden gelen raporlar; yanıtsız dilekçeleri, çelişkili talimatları ve haftalardır bir proje memuru görmemiş mahalleleri anlatıyor. Devlet Dini Dönüşümü, bunu yürütmekle görevli idarenin önünde gidiyor."
 ve_rel_evt.2.f:0 "\"Bir hüküm ülkeyi bir günde geçebilir. Liyakatli bir kâtip geçemez.\""
 ve_rel_evt.2.a:0 "Geçici saha subayları tutun."
 ve_rel_evt.2.a.tt:0 "#N 15#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 4#! artar."
 ve_rel_evt.2.b:0 "Programı yavaşlatın."
 ve_rel_evt.2.b.tt:0 "Dinî Proje ilerlemesi #N 6#! azalır.\nDinî Yerleşim #P 2#! artar."
 ve_rel_evt.2.c:0 "Merkezi sicil kadrolarını kullanın."
 ve_rel_evt.2.c.tt:0 "#N 10#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 5#! artar."

 ve_cul_evt.1.t:0 "Tercüme Büroları"
 ve_cul_evt.1.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] vilayetindeki yetkililer, Eşit Yurttaşlık Girişimi'nin [SCOPE.sCulture('ve_evt_target_culture').GetName] dilini nasıl ele alması gerektiği konusunda anlaşmazlık içinde. Yerel yöneticiler iki dilli daireler isterken, merkezi bakanlıklar tek bir idari standart talep ediyor."
 ve_cul_evt.1.f:0 "\"Bir yurttaş, kendi adına verilen hakları anlamak için tercümana ihtiyaç duymamalıdır.\""
 ve_cul_evt.1.a:0 "Yerel dillerin kamu kurumlarında yaşamasına izin verin."
 ve_cul_evt.1.a.tt:0 "Kültürel Proje ilerlemesi #N 4#! azalır.\nUyum #P 3#! artar."
 ve_cul_evt.1.b:0 "Tek bir idari standart dayatın."
 ve_cul_evt.1.b.tt:0 "Kültürel Proje ilerlemesi #P 5#! artar.\nUyum #N 2#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] vilayetindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusunun #N %0.5#! kadarı Radikal hâline gelir."
 ve_cul_evt.1.c:0 "Akademik bir çeviri komisyonu kurun."
 ve_cul_evt.1.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 3#! artar.\nUyum #P 1#! artar."

 ve_cul_evt.2.t:0 "Yerel Öğretmenlerin Eksikliği"
 ve_cul_evt.2.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] okullarında, hem devlet müfredatına hem de [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluklarına hizmet edebilecek öğretmenler bulunmuyor. Eğitilmiş bir yerel kadro olmaksızın, eşit yurttaşlık yalnızca resmi kağıtlara yazılmış bir söz olarak kalma riski taşıyor."
 ve_cul_evt.2.f:0 "\"Kanun bir öğleden sonra eşitliği ilan eder; sınıf bunu bir nesil boyunca öğretmelidir.\""
 ve_cul_evt.2.a:0 "Yeni öğretmen okulllarını finanse edin."
 ve_cul_evt.2.a.tt:0 "#N 15#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 4#! artar."
 ve_cul_evt.2.b:0 "Uygulamayı yavaşlatın."
 ve_cul_evt.2.b.tt:0 "Kültürel Proje ilerlemesi #N 6#! azalır.\nUyum #P 2#! artar."
 ve_cul_evt.2.c:0 "Hâlihazırda mevcut kurumları kullanın."
 ve_cul_evt.2.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 5#! artar.\nUyum #P 1#! artar."

 ve_rel_evt.3.t:0 "Çatışan Siciller"
 ve_rel_evt.3.d:0 "Cemaat yazımları, belediye defterleri ve proje subaylarının raporları, [SCOPE.sState('ve_evt_target_state').GetName] içerisindeki dinî bağlılık konusunda birbiriyle uyuşmayan hesaplar sunmaktadır. Yönetim, gerçeği ortaya çıkarmak için zaman kaybetmeyi mi yoksa kusurlu olduğunu bildiği rakamlarla devam etmeyi mi seçmelidir."
 ve_rel_evt.3.f:0 "\"Her dairenin kesin bir yekûnu vardır. Hiçbir yekûn diğeriyle uyuşmaz.\""
 ve_rel_evt.3.a:0 "Eksiksiz bir denetim yürütün."
 ve_rel_evt.3.a.tt:0 "#P 8#! Dindarlık Reformu kazanırsınız.\nDinî Proje ilerlemesi #N 6#! düşer."
 ve_rel_evt.3.b:0 "Makul tahminlerle devam edin."
 ve_rel_evt.3.b.tt:0 "#N 8#! Dindarlık Reformu harcarsınız.\nDinî Proje ilerlemesi #P 5#! artar."
 ve_rel_evt.3.c:0 "Kutsal Yönetim sicillerini kullanın."
 ve_rel_evt.3.c.tt:0 "Dinî Proje ilerlemesi #P 3#! artar."

 ve_rel_evt.4.t:0 "Söylentiler ve Karşı Vaazlar"
 ve_rel_evt.4.d:0 "Broşürler, sokak vaazları ve endişeli söylentiler artık [SCOPE.sState('ve_evt_target_state').GetName] içindeki Devlet Dini Dönüşümü'nü yerel hayata bir saldırı olarak nitelendirmektedir. Yetkililer, sessizliğin muhaliflerin projeyi tanımlamasına yol açacağını, baskının ise onların en karanlık iddialarını doğrulayabileceğini konusunda uyarmaktadır."
 ve_rel_evt.4.f:0 "\"Bir söylenti ne makama, ne mühre ne de bütçeye ihtiyaç duyar.\""
 ve_rel_evt.4.a:0 "Halk duruşmaları düzenleyin."
 ve_rel_evt.4.a.tt:0 "Dinî Proje ilerlemesi #N 3#! düşer.\nDinî Uzlaşı #P 3#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içerisindeki nüfusun #P 0.5%#! kadarı Sadık hâline gelir."
 ve_rel_evt.4.b:0 "Kışkırtıcıları cezalandırın."
 ve_rel_evt.4.b.tt:0 "Dinî Proje ilerlemesi #P 4#! artar.\nDinî Uzlaşı #N 3#! düşer.\n[SCOPE.sState('ve_evt_target_state').GetName] içerisindeki nüfusun #N 1%#! kadarı Radikal hâline gelir."
 ve_rel_evt.4.c:0 "Kayıtları ve sonuçları yayımlayın."
 ve_rel_evt.4.c.tt:0 "#N 10#! Dindarlık Reformu harcarsınız.\nDinî Proje ilerlemesi #P 2#! artar.\nDinî Uzlaşı #P 1#! artar."

 ve_rel_evt.5.t:0 "Vaazın Dili"
 ve_rel_evt.5.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içerisindeki proje ruhanileri, resmî vaazların doktriner birliği koruduğunu ancak pek çok cemaat üyesine ulaşamadığını bildirmektedir. Yerel dilde vaaz vermek kampanyayı daha ileri taşıyacaktır, ancak merkezi hiyerarşi adaptasyonun bağımsızlığa dönüşmesinden korkmaktadır."
 ve_rel_evt.5.f:0 "\"İşitilmeyen kutsal bir söz kusursuz şekilde korunur—ancak hiç kimse tarafından alınmaz.\""
 ve_rel_evt.5.a:0 "Yerel dillerde vaaz verin."
 ve_rel_evt.5.a.tt:0 "Dinî Proje ilerlemesi #P 6#! artar.\nDindarlar #Y 2.5 yıl#! boyunca #N 1#! Onay kaybeder."
 ve_rel_evt.5.b:0 "Ayin birliğini koruyun."
 ve_rel_evt.5.b.tt:0 "Dinî Proje ilerlemesi #N 3#! düşer.\nDinî Uzlaşı #P 3#! artar.\nDindarlar #Y 2.5 yıl#! boyunca #P 1#! Onay kazanır."
 ve_rel_evt.5.c:0 "Eğitimli tercümanlar yetiştirin."
 ve_rel_evt.5.c.tt:0 "#N 10#! Dindarlık Reformu harcarsınız.\nDinî Proje ilerlemesi #P 4#! artar.\nDinî Uzlaşı #P 1#! artar."

 ve_rel_evt.6.t:0 "Rakip Kilise Makamları"
 ve_rel_evt.6.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içerisindeki merkezi atamalılar ve kökleşmiş yerel ruhaniler, Devlet Dini Dönüşümü'nü yönlendirme hakkını ayrı ayrı iddia etmektedir. Bir tarafı desteklemek komutayı hızla yeniden tesis edebilir, ancak bu anlaşmazlık şimdiden inanç adına kimin konuştuğunun bir sınavı hâline gelmiştir."
 ve_rel_evt.6.f:0 "\"Tartışma, kurumların gücü tanımlama biçimi olan yetki alanıyla ilgilidir.\""
 ve_rel_evt.6.a:0 "Merkezi ruhanileri destekleyin."
 ve_rel_evt.6.a.tt:0 "Dinî Proje ilerlemesi #P 5#! artar.\nDindarlar #Y 2.5 yıl#! boyunca #P 1#! Onay kazanır.\nDinî Uzlaşı #N 3#! düşer.\n[SCOPE.sState('ve_evt_target_state').GetName] içerisindeki nüfusun #N 0.5%#! kadarı Radikal hâline gelir."
 ve_rel_evt.6.b:0 "Yerel ruhanileri yatıştırın."
 ve_rel_evt.6.b.tt:0 "Dinî Proje ilerlemesi #N 4#! düşer.\nDindarlar #Y 2.5 yıl#! boyunca #N 1#! Onay kaybeder.\nDinî Uzlaşı #P 3#! artar."
 ve_rel_evt.6.c:0 "Yetkilerini yazılı olarak tanımlayın."
 ve_rel_evt.6.c.tt:0 "#N 10#! Dindarlık Reformu harcarsınız.\nDinî Proje ilerlemesi #P 3#! artar.\nDinî Uzlaşı #P 1#! artar."

 ve_cul_evt.3.t:0 "Nüfus Sayımının Kategorileri"
 ve_cul_evt.3.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki nüfus sayımı memurları, [SCOPE.sCulture('ve_evt_target_culture').GetName] kültütüne mensup yurttaşların nasıl kaydedilmesi gerektiği konusunda uzlaşamıyor. Yerel yanıt verenler birbiriyle örtüşen kimlikler kullanırken, merkezi formlar tek kutuda tek bir yanıt talep ediyor."
 ve_cul_evt.3.f:0 "\"Bir kategori, ülkeyi basitleştirmeden çok önce muhasebe defterini basitleştirir.\""
 ve_cul_evt.3.a:0 "Kendi kendini tanımlamaya izin ver."
 ve_cul_evt.3.a.tt:0 "Kültürel Proje ilerlemesi #N 4#! azalır.\nUlusal Uyum #P 4#! artar."
 ve_cul_evt.3.b:0 "Kategoriler merkezi olarak belirlenecek."
 ve_cul_evt.3.b.tt:0 "Kültürel Proje ilerlemesi #P 6#! artar.\nUlusal Uyum #N 4#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusunun #N %0.5#! kadarı Radikal olur."
 ve_cul_evt.3.c:0 "Modern sicil sistemini kullan."
 ve_cul_evt.3.c.tt:0 "#N 10#! Kültürel Yetki harca.\nKültürel Proje ilerlemesi #P 5#! artar.\nUlusal Uyum #P 1#! artar."

 ve_cul_evt.4.t:0 "Belediye Eşrafı"
 ve_cul_evt.4.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki belediye hamileri, [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusu için eşit yurttaşlığı ilerletmek adına makamlarını, müvekkillerini ve nüfuzunu teklif ediyor. İş birlikleri hızlı olurdu, ancak bedeli yerel gelirler üzerindeki sürekli kontrolleridir."
 ve_cul_evt.4.f:0 "\"Belediye binasına giden en kısa yol birkaç özel oturma odasından geçer.\""
 ve_cul_evt.4.a:0 "Yerel ağları kullan."
 ve_cul_evt.4.a.tt:0 "Kültürel Proje ilerlemesi #P 5#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName], #Y 2 yıl#! boyunca #N %5#! Vergi Kapasitesi kaybeder."
 ve_cul_evt.4.b:0 "Açık meclisler oluştur."
 ve_cul_evt.4.b.tt:0 "Kültürel Proje ilerlemesi #N 3#! azalır.\nUlusal Uyum #P 3#! artar."
 ve_cul_evt.4.c:0 "Kurallara dayalı bir mutabakat müzakere et."
 ve_cul_evt.4.c.tt:0 "#N 10#! Kültürel Yetki harca.\nKültürel Proje ilerlemesi #P 3#! artar.\nUlusal Uyum #P 1#! artar."

 ve_cul_evt.5.t:0 "Kamu Hizmeti Sınavları"
 ve_cul_evt.5.d:0 "Kamu hizmeti sınavlarının [SCOPE.sCulture('ve_evt_target_culture').GetName] adaylarına açılması, yasal eşitlik ile pratik hazırlık arasındaki uçurumu gözler önüne serdi. Derhal erişim sembolik olarak güçlü olurdu, ancak yıll süren eşitsiz eğitim hükümle silinemez."
 ve_cul_evt.5.f:0 "\"Yalnızca tek bir adaya dili öğretildiyse, aynı sınav aynı fırsat değildir.\""
 ve_cul_evt.5.a:0 "Hazırlık kurslarını finanse et."
 ve_cul_evt.5.a.tt:0 "#N 15#! Kültürel Yetki harca.\nKültürel Proje ilerlemesi #P 5#! artar.\nUlusal Uyum #P 2#! artar."
 ve_cul_evt.5.b:0 "Eşit erişim derhal başlar."
 ve_cul_evt.5.b.tt:0 "Kültürel Proje ilerlemesi #P 7#! artar.\nUlusal Uyum #N 4#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki nüfusun #N %0.5#! kadarı Radikal olur."
 ve_cul_evt.5.c:0 "Okul ve Refah ağlarını seferber et."
 ve_cul_evt.5.c.tt:0 "#N 10#! Kültürel Yetki harca.\nKültürel Proje ilerlemesi #P 5#! artar.\nUlusal Uyum #P 2#! artar."
 ve_cul_evt.5.e:0 "Önce Kamu Hizmeti sınav sistemini reforme et."
 ve_cul_evt.5.e.tt:0 "Kültürel Proje ilerlemesi #N 4#! azalır.\nUlusal Uyum #P 3#! artar."

 ve_cul_evt.6.t:0 "Çoğunluk Geri İtiyor"
 ve_cul_evt.6.d:0 "Eşit Yurttaşlık Girişimi muhalifleri, ortak hakların [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusuna genişletilmesinin herkesin statüsünü azalttığını iddia ediyor. [SCOPE.sState('ve_evt_target_state').GetName] içindeki gösteriler, idari bir reformu ulusal bir siyasi teste dönüştürüyor."
 ve_cul_evt.6.f:0 "\"Paylaşılan bir hak, çalınmış bir ayrıcalık olarak tasvir ediliyor.\""
 ve_cul_evt.6.a:0 "Girişimi açıkça savun."
 ve_cul_evt.6.a.tt:0 "Kültürel Proje ilerlemesi #P 4#! artar.\nUlusal Uyum #N 4#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki nüfusun #N %1#! kadarı Radikal olur."
 ve_cul_evt.6.b:0 "Uygulama hızını düşür."
 ve_cul_evt.6.b.tt:0 "Kültürel Proje ilerlemesi #N 5#! azalır.\nUlusal Uyum #P 3#! artar."
 ve_cul_evt.6.c:0 "Reform koalisyonunu seferber et."
 ve_cul_evt.6.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 3#! artar.\nUlusal Uyum #P 2#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusun #P %0.5#! kadarı Sadık hâline gelir."

 ve_rel_evt.7.t:0 "Kırılma Noktasındaki Misyon"
 ve_rel_evt.7.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki Devlet Dini Dönüşümü idari ve siyasi bir çöküşün eşiğinde. Bürolar birbirine yanıt vermeyi kesti, kamusal direniş sertleşiyor ve saha ruhanileri misyonun mevcut şartlar altında devam edemeyeceği konusunda uyarıyor."
 ve_rel_evt.7.f:0 "\"Raporlar bunu hâlâ geçici bir zorluk olarak adlandırıyor. Sokaklar ise daha sert bir isim seçti.\""
 ve_rel_evt.7.a:0 "Kayıpları kabul edin ve geri çekilin."
 ve_rel_evt.7.a.tt:0 "Dindarlık Reformu iadesi olmaksızın Dinî Proje iptal edilir.\nDinî Uzlaşı #N 5#! azalır.\n#Y 2 yıl#! boyunca: #N -50#! Bürokrasi, #N -50#! Otorite ve #N -3%#! Kanun Çıkarma Başarısı."
 ve_rel_evt.7.b:0 "Acil durum kaynakları aktarın."
 ve_rel_evt.7.b.tt:0 "#N 25#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #N 5#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki nüfusun #N 1%#! kadarı Radikal hâline gelir.\nProje devam eder."
 ve_rel_evt.7.c:0 "Asgari personelle devam edin."
 ve_rel_evt.7.c.tt:0 "Dinî Proje ilerlemesi #N 10#! azalır.\nDinî Uzlaşı #N 2#! azalır.\nProje devam eder."
 ve_rel_evt.7.e:0 "Yöntemi yeniden müzakere edin."
 ve_rel_evt.7.e.tt:0 "#N 15#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #N 3#! azalır.\nDinî Uzlaşı #P 2#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki nüfusun #N 0.5%#! kadarı Radikal hâline gelir.\nProje devam eder."

 ve_cul_evt.7.t:0 "Girişim Meşruluğunu Kaybediyor"
 ve_cul_evt.7.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki Eşit Yurttaşlık Girişimi, hem kökleşmiş kurumların hem de hizmet etmesi amaçlanan [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluklarının desteğini kaybediyor. Radikal hareketler artık her uzlaşmayı hükümetin eşitliği sağlayamayacağının kanıtı olarak sunuyor."
 ve_cul_evt.7.f:0 "\"Bir reform muhalefete direnebilir. İnanılmaz hâle gelmeye direnemez.\""
 ve_cul_evt.7.a:0 "Girişimi sonlandırın."
 ve_cul_evt.7.a.tt:0 "Kültürel Yetki iadesi olmaksızın Kültürel Proje iptal edilir.\nUlusal Uyum #N 5#! azalır.\n#Y 2 yıl#! boyunca: #N -50#! Bürokrasi, #N -25#! Otorite ve #N -3%#! Kanun Çıkarma Başarısı."
 ve_cul_evt.7.b:0 "Acil yerel hibeler yayın."
 ve_cul_evt.7.b.tt:0 "#N 25#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #N 5#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusun #N 1%#! kadarı Radikal hâline gelir.\nProje devam eder."
 ve_cul_evt.7.c:0 "Minimal bir programla devam edin."
 ve_cul_evt.7.c.tt:0 "Kültürel Proje ilerlemesi #N 10#! azalır.\nUlusal Uyum #N 2#! azalır.\nProje devam eder."
 ve_cul_evt.7.e:0 "Koalisyonu yeniden kurun."
 ve_cul_evt.7.e.tt:0 "#N 15#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #N 3#! azalır.\nUlusal Uyum #P 2#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusun #N 0.5%#! kadarı Radikal hâline gelir.\nProje devam eder."

 ve_rel_evt.8.t:0 "Beklenmedik Bir Yerel Uzlaşı"
 ve_rel_evt.8.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki ruhaniler, belediye yetkilileri ve topluluk önde gelenleri, hiçbir merkezi direktifin üretemeyeceği bir anlaşmaya vardılar. Yerel direniş geriliyor, cemaatler misyonu kendi aralarında koordine ediyor ve Devlet Dini Dönüşümü beklenmedik bir İvme kazandı."
 ve_rel_evt.8.f:0 "\"Başkentten gelen bir emir olarak başlayan şey, kasaba meydanında yapılan bir anlaşmaya dönüştü.\""
 ve_rel_evt.8.a:0 "Bu ivmeden sonuna kadar yararlanın."
 ve_rel_evt.8.a.tt:0 "Dinî Uzlaşı #P 1#! artar.\nDinî Proje ilerlemesi #P 25#! artar.\nEğer ilerleme #Y 100#! değerine ulaşırsa, projenin normal tamamlama etkisi uygulanır."
 ve_rel_evt.8.b:0 "Hızdan önce dayanıklılık."
 ve_rel_evt.8.b.tt:0 "Dinî Uzlaşı #P 4#! artar.\nDinî Proje ilerlemesi #P 10#! artar.\nEğer ilerleme #Y 100#! değerine ulaşırsa, projenin normal tamamlama etkisi uygulanır."

 ve_cul_evt.8.t:0 "Yerel Bir Sivil Koalisyon"
 ve_cul_evt.8.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki öğretmenler, belediye yetkilileri, ticaret dernekleri ve [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluğunun temsilcileri ortak bir komite kurdu. Anlaşmazlıkları başkente ulaşmadan çözerek bu koalisyon, Eşit Yurttaşlık Girişimi'ne yönetimin üretemeyeceği bir ivme kazandırdı."
 ve_cul_evt.8.f:0 "\"Nadir aynı masayı paylaşan kurumlar sorumluluk paylaşmaya başladığında yurttaşlık gerçek oldu.\""
 ve_cul_evt.8.a:0 "Koalisyonun ivmesini kullanın."
 ve_cul_evt.8.a.tt:0 "Ulusal Uyum #P 1#! artar.\nKültürel Proje ilerlemesi #P 25#! artar.\nEğer ilerleme #Y 100#! değerine ulaşırsa, projenin normal tamamlama etkisi uygulanır."
 ve_cul_evt.8.b:0 "Kurumları kalıcı kılın."
 ve_cul_evt.8.b.tt:0 "Ulusal Uyum #P 4#! artar.\nKültürel Proje ilerlemesi #P 10#! artar.\nEğer ilerleme #Y 100#! değerine ulaşırsa, projenin normal tamamlama etkisi uygulanır."

 ve_rel_evt.40.t:0 "Uyumsuz Kayıtlar"
 ve_rel_evt.40.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] eyaletindeki taşra sicilleri cemaatler, sivil dernekler ve kamu kurumları için birbiriyle bağdaşmayan kategoriler kullanmaktadır. Başkente ulaşan raporlar artık birbirleriyle çelişmekte olup, projeyi uyum ile direnişi ayırt edemez hâle getirmektedir."
 ve_rel_evt.40.f:0 "\"Üç defter üzerinden yönetilen bir politika, kısa sürede üç farklı gerçeklik edinir.\""
 ve_rel_evt.40.a:0 "Merkezi bir teftiş gönderin."
 ve_rel_evt.40.a.tt:0 "#N 10#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 5#! artar.\nDinî Yerleşim #P 1#! artar."
 ve_rel_evt.40.b:0 "Kayıtları yerelde uzlaştırın."
 ve_rel_evt.40.b.tt:0 "Dinî Proje ilerlemesi #N 3#! azalır.\nDinî Yerleşim #P 2#! artar."
 ve_rel_evt.40.c:0 "Standart sicil prosedürünü uygulayın."
 ve_rel_evt.40.c.tt:0 "#N 5#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 4#! artar.\nDinî Yerleşim #P 1#! artar."

 ve_rel_evt.41.t:0 "Taşra Personeli Kıtlığı"
 ve_rel_evt.41.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içerisindeki projeyi yöneten daireler yeterli eğitilmiş Kâtiplerin, öğretmen ve müfettiş bulamamaktadır. Talimatlar yerel memurların onları yorumlayabileceğinden daha hızlı birikmekte ve aceleyle yapılan atamalar her anlaşmazlığı daha da kötüleştirmekle tehdit etmektedir."
 ve_rel_evt.41.f:0 "\"Kararname bir günde vardı. Bunu uygulamaya muktedir halk ise bir nesil alabilir.\""
 ve_rel_evt.41.a:0 "Yeni bir memur kadrosunu finanse edin."
 ve_rel_evt.41.a.tt:0 "#N 15#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 6#! artar."
 ve_rel_evt.41.b:0 "Uygulamayı yavaşlatın."
 ve_rel_evt.41.b.tt:0 "Dinî Proje ilerlemesi #N 6#! azalır.\nDinî Yerleşim #P 2#! artar."
 ve_rel_evt.41.c:0 "Mevcut Eğitim ağını kullanın."
 ve_rel_evt.41.c.tt:0 "#N 10#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 5#! artar.\nDinî Yerleşim #P 1#! artar."

 ve_rel_evt.42.t:0 "Bölge Çapında Söylentiler"
 ve_rel_evt.42.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki söylentiler, projenin hükümet tarafından açıklananlardan çok daha sert tedbirler gizlediğini iddia etmektedir. Dini örgütleyiciler ile yerel Kışkırtıcılar çelişkili hikâyeler tekrarlarken, resmî sessizlik her yeni versiyona yayılma alanı vermektedir."
 ve_rel_evt.42.f:0 "\"Bir söylenti ne makam, ne bütçe, ne de imza gerektirir.\""
 ve_rel_evt.42.a:0 "Raporları yayımlayın."
 ve_rel_evt.42.a.tt:0 "Dinî Proje ilerlemesi #N 3#! azalır.\nDinî Yerleşim #P 4#! artar."
 ve_rel_evt.42.b:0 "Kışkırtmaları göz ardı edin."
 ve_rel_evt.42.b.tt:0 "Dinî Proje ilerlemesi #P 5#! artar.\nDinî Yerleşim #N 3#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki Nüfus unsurunun #N 1%#! kadarı Radikal hâline gelir."
 ve_rel_evt.42.c:0 "Yerel arabulucuları görevlendirin."
 ve_rel_evt.42.c.tt:0 "#N 10#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 4#! artar.\nDinî Yerleşim #P 2#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki Nüfus unsurunun #P 0.5%#! kadarı Sadık hâline gelir."

 ve_rel_evt.43.t:0 "Kırılma Noktasındaki İdare"
 ve_rel_evt.43.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içerisindeki projede idari çöküş yaklaşmaktadır. Taşra daireleri bunalmış, kamu Kararlılık çökmüş ve organize Karşı Çıkma artık her yeni direktifi hükümetin kontrolü kaybettiğinin kanıtı olarak değerlendirmektedir."
 ve_rel_evt.43.f:0 "\"Dosyalar durduğunda, kriz sokaklara taşınır.\""
 ve_rel_evt.43.a:0 "Programı sonlandırın."
 ve_rel_evt.43.a.tt:0 "Dindarlık Reformu iadesi olmaksızın Dinî Proje iptal edilir.\nDinî Yerleşim #N 5#! azalır.\n#Y 2 yıl#! boyunca: #N -50#! Bürokrasi, #N -50#! Otorite ve #N -3%#! Kanun Çıkarma Başarısı."
 ve_rel_evt.43.b:0 "Acil durum kaynakları aktarın."
 ve_rel_evt.43.b.tt:0 "#N 25#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #N 5#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki Nüfus unsurunun #N 1%#! kadarı Radikal hâline gelir.\nProje devam eder."
 ve_rel_evt.43.c:0 "Asgari personelle devam edin."
 ve_rel_evt.43.c.tt:0 "Dinî Proje ilerlemesi #N 10#! azalır.\nDinî Yerleşim #N 2#! azalır.\nProje devam eder."
 ve_rel_evt.43.e:0 "Yerel ortaklığı yeniden inşa edin."
 ve_rel_evt.43.e.tt:0 "#N 15#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #N 3#! azalır.\nDinî Yerleşim #P 2#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki Nüfus unsurunun #N 0.5%#! kadarı Radikal hâline gelir.\nProje devam eder."

 ve_rel_evt.100.t:0 "Dinlerarası Konseydeki Koltuklar"
 ve_rel_evt.100.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki delegeler, bir dinlerarası konseyin gerekli olduğu konusunda hemfikir, ancak kimin koltuk hak ettiği konusunda uzlaşamıyorlar. Nispi Temsil daha küçük toplulukları güvence altına alabilirken, başkentte tasarlanan sabit bir Dinî Uzlaşı hemen çalışmaya başlayabilir."
 ve_rel_evt.100.f:0 "\"Herkes sandalyeler sayılana kadar ortak bir masayı destekler.\""
 ve_rel_evt.100.a:0 "Temsiliyeti nüfusa göre dağıtın."
 ve_rel_evt.100.a.tt:0 "Dinî Proje İlerleme değeri #N 3#! azalır.\nDinî Uzlaşı #P 4#! artar."
 ve_rel_evt.100.b:0 "Sabit bir merkezi uzlaşı dayatın."
 ve_rel_evt.100.b.tt:0 "Dinî Proje İlerleme değeri #P 5#! artar.\nDinî Uzlaşı #N 2#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki Nüfus unsurunun #N %0.5#! kadarı Radikal hâline gelir."
 ve_rel_evt.100.c:0 "Dinlerarası Konseylere yetki verin."
 ve_rel_evt.100.c.tt:0 "#N 10#! Dindarlık Reformu harcanır.\nDinî Proje İlerleme değeri #P 5#! artar.\nDinî Uzlaşı #P 2#! artar."

 ve_rel_evt.101.t:0 "Ortak Bir Okul Müfredatı"
 ve_rel_evt.101.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki okulların, Özgürlük Girişimi'ni yerel inançlara karşı bir kampanyaya dönüştürmeden ortak yurttaşlık derslerine ihtiyacı var. Öğretmenler net materyaller ve ortak eğitim talep ederken, topluluk liderleri yerel eğitimin kendi gelenekleri için alan bırakmasında ısrarcı."
 ve_rel_evt.101.f:0 "\"Ortak bir ders, ancak her aile sınıfı kendisinin olarak tanıdığında başarılı olur.\""
 ve_rel_evt.101.a:0 "Ortak bir öğretmen kadrosunu finanse edin."
 ve_rel_evt.101.a.tt:0 "#N 15#! Dindarlık Reformu harcanır.\nDinî Proje İlerleme değeri #P 6#! artar.\nDinî Uzlaşı #P 1#! artar."
 ve_rel_evt.101.b:0 "Yerel müfredatlar için alan bırakın."
 ve_rel_evt.101.b.tt:0 "Dinî Proje İlerleme değeri #N 4#! azalır.\nDinî Uzlaşı #P 3#! artar."
 ve_rel_evt.101.c:0 "Reform koalisyonunu okullara dâhil edin."
 ve_rel_evt.101.c.tt:0 "#N 10#! Dindarlık Reformu harcanır.\nDinî Proje İlerleme değeri #P 5#! artar.\nDinî Uzlaşı #P 2#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki Nüfus unsurunun #P %0.5#! kadarı Sadık hâline gelir."

 ve_rel_evt.102.t:0 "Karşılıklı Garantiler Sözleşmesi"
 ve_rel_evt.102.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki Dini topluluklar, belediye yetkilileri ve reform dernekleri ortak bir sözleşme taslağı hazırladı. Her imza sahibi, hiçbir topluluğun yerel Kurumlar dışına itilmeyeceğine dair kamusal garantiler karşılığında aynı yurttaşlık Yükümlülükler kabul eder."
 ve_rel_evt.102.f:0 "\"Her sözleşme başka bir tarafın hakkı olarak yazıldığında güven mümkün oldu.\""
 ve_rel_evt.102.a:0 "Mutabakatın İvme değerini kullanın."
 ve_rel_evt.102.a.tt:0 "Dinî Uzlaşı #P 2#! artar.\nDinî Proje İlerleme değeri #P 20#! artar.\nEğer İlerleme #Y 100#! değerine ulaşırsa, projenin normal tamamlama etkisi uygulanır."
 ve_rel_evt.102.b:0 "Garantileri kalıcı hâle getirin."
 ve_rel_evt.102.b.tt:0 "Dinî Uzlaşı #P 4#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki Nüfus unsurunun #P %0.5#! kadarı Sadık hâline gelir.\nDinî Proje İlerleme değeri #P 10#! artar.\nEğer İlerleme #Y 100#! değerine ulaşırsa, projenin normal tamamlama etkisi uygulanır."

 ve_rel_evt.150.t:0 "Öğretmenler mi, Müfettişler mi?"
 ve_rel_evt.150.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki Laikleştirme Kampanyası, Okuryazar personel Kıtlık ortaya çıkardı. Yönetim, uzun vadeli yurttaşlık Kapasite inşa eden öğretmen kadrosunu nı Genişletebilir veya halihazırda mevcut personelle yeni kuralları uygulayabilecek müfettişlere güvenebilir."
 ve_rel_evt.150.f:0 "\"Bir müfettiş bir okulu öğleden sonra kapatabilir. Bir öğretmenin orada öğretilenin yerini alması yıllar sürebilir.\""
 ve_rel_evt.150.a:0 "Öğretmen kadrosunu nı Genişlet."
 ve_rel_evt.150.a.tt:0 "#N 15#! Dindarlık Reformu harcanır.\nDinî Proje İlerleme değeri #P 6#! artar."
 ve_rel_evt.150.b:0 "Mevcut personele uyum sağlamak için programı yavaşlatın."
 ve_rel_evt.150.b.tt:0 "Dinî Proje İlerleme değeri #N 5#! azalır.\nDinî Uzlaşı #P 2#! artar."
 ve_rel_evt.150.c:0 "Kamusal Eğitim ağını görevlendirin."
 ve_rel_evt.150.c.tt:0 "#N 10#! Dindarlık Reformu harcanır.\nDinî Proje İlerleme değeri #P 5#! artar.\nDinî Uzlaşı #P 1#! artar."

 ve_rel_evt.151.t:0 "El Konulan Mülkler"
 ve_rel_evt.151.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki eski dinî mülkler okul, klinik ve kamu ofislerine dönüştürülmeye hazırdır. Derhâl devir, kampanyaya değerli altyapı kazandıracaktır ancak tazminat ödenmemesi Dindarlar için bir toplanma noktası hâline gelmektedir."
 ve_rel_evt.151.f:0 "\"Anahtarlar bir sabah el değiştirdi. Mülkiyet hakkı tartışması kilitlerden daha uzun sürecek.\""
 ve_rel_evt.151.a:0 "Tazminatı taksitle ödeyin."
 ve_rel_evt.151.a.tt:0 "#N 15#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 3#! artar.\nDinî Uzlaşı #P 3#! artar."
 ve_rel_evt.151.b:0 "Mülkleri derhâl kamu hizmetine sokun."
 ve_rel_evt.151.b.tt:0 "Dinî Proje ilerlemesi #P 7#! artar.\nDinî Uzlaşı #N 4#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki nüfusun #N %1#! kadarı Radikal hâline gelir.\nDindarlar, #Y 2.5 yıl#! boyunca #N 1#! Onay kaybeder."
 ve_rel_evt.151.c:0 "Bunları seküler refah kurumlarına devredin."
 ve_rel_evt.151.c.tt:0 "#N 10#! Dindarlık Reformu harcanır.\nDinî Proje ilerlemesi #P 5#! artar.\nDinî Uzlaşı #P 2#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki nüfusun #P %0.5#! kadarı Sadık hâline gelir."

 ve_rel_evt.152.t:0 "Sivil Dernekler Kök Salıyor"
 ve_rel_evt.152.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki öğretmen çemberleri, karşılıklı yardımlaşma cemiyetleri ve belediye dernekleri, bir zamanlar dinî kurumlar aracılığıyla yürütülen hizmetleri sağlamaya başlamıştır. İş birlikleri, Laikleştirme Kampanyasına idari bir varlık göstermeden ziyade yerel bir sivil temel kazandırmıştır."
 ve_rel_evt.152.f:0 "\"Yeni düzen, vatandaşlar bir müfettiş beklemeden onu korumaya başladığında kalıcı oldu.\""
 ve_rel_evt.152.a:0 "Yerel ivmeyi kullanın."
 ve_rel_evt.152.a.tt:0 "Dinî Uzlaşı #P 2#! artar.\nDinî Proje ilerlemesi #P 20#! artar.\nİlerleme #Y 100#! değerine ulaşırsa projenin normal tamamlama etkisi uygulanır."
 ve_rel_evt.152.b:0 "Dernekleri kalıcı kurumlara dönüştürün."
 ve_rel_evt.152.b.tt:0 "Dinî Uzlaşı #P 4#! artar.\nDinî Proje ilerlemesi #P 10#! artar.\nİlerleme #Y 100#! değerine ulaşırsa projenin normal tamamlama etkisi uygulanır."

 ve_cul_evt.40.t:0 "Yerel Okul Kurulları"
 ve_cul_evt.40.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki okul kurulları, kamu eğitiminde [SCOPE.sCulture('ve_evt_target_culture').GetName] dilinin yeri konusunda anlaşmazlık yaşamaktadır. Yerel dilde eğitim güveni koruyacakken tek bir idari dil ulusal projenin yönlendirilmesini kolaylaştıracaktır."
 ve_cul_evt.40.f:0 "\"İlk ders için seçilen dil, genellikle okulun kime ait olduğuna kimin inandığını belirler.\""
 ve_cul_evt.40.a:0 "Yerel dili koruyun."
 ve_cul_evt.40.a.tt:0 "Kültürel Proje ilerlemesi #N 4#! azalır.\nUyum #P 3#! artar."
 ve_cul_evt.40.b:0 "Tek bir idari dil dayatın."
 ve_cul_evt.40.b.tt:0 "Kültürel Proje ilerlemesi #P 5#! artar.\nUyum #N 2#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusunun #N %0.5#! kadarı Radikal hâline gelir."
 ve_cul_evt.40.c:0 "Öğretmen ağını genişletin."
 ve_cul_evt.40.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 4#! artar.\nUyum #P 2#! artar."

 ve_cul_evt.41.t:0 "İstatistiki Sınırlar"
 ve_cul_evt.41.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] bölgesini inceleyen memurlar, [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluğunun nerede başlayıp nerede bittiği konusunda anlaşamamaktadır. Yerel kimlikler dil, ilçe ve gelenekler boyunca örtüşmektedir ancak ulusal projede sayılabilecek ve idare edilebilecek kategoriler gerekmektedir."
 ve_cul_evt.41.f:0 "\"Nüfus sayımı için çizilen bir sınır kısa sürede memurlar, bütçeler ve savunucular edinir.\""
 ve_cul_evt.41.a:0 "Kendi kendine tanımlama için yer bırakın."
 ve_cul_evt.41.a.tt:0 "Kültürel Proje ilerlemesi #N 3#! azalır.\nUyum #P 3#! artar."
 ve_cul_evt.41.b:0 "Sınırları merkezin tanımlamasına izin verin."
 ve_cul_evt.41.b.tt:0 "Kültürel Proje ilerlemesi #P 6#! artar.\nUyum #N 3#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusunun #N %0.5#! kadarı Radikal hâline gelir."
 ve_cul_evt.41.c:0 "Standart sicil sistemini kullanın."
 ve_cul_evt.41.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 5#! artar.\nUyum #P 1#! artar."

 ve_cul_evt.42.t:0 "Kırılma Noktasındaki Millî Proje"
 ve_cul_evt.42.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki millî proje çöküşün eşiğine geldi. Radikal hareketler, hükümetin [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluğuna ihanet ettiğini veya onlara boyun eğdiğini iddia ederken, yerel daireler artık başka bir uzlaşmayı dayatacak kararlılığa sahip değil."
 ve_cul_evt.42.f:0 "\"Hem baskı hem de teslimiyet olarak saldırıya uğrayan bir anlaşma, kısa süre içinde tamamen bir anlaşma olmaktan çıkabilir.\""
 ve_cul_evt.42.a:0 "Projeyi sonlandırın."
 ve_cul_evt.42.a.tt:0 "Kültürel Proje, Kültürel Yetki iadesi olmaksızın iptal edilir.\nMillî Uyum #N 5#! azalır.\n#Y 2 yıl#! boyunca: #N -50#! Bürokrasi, #N -25#! Otorite ve #N -3%#! Kanun Çıkarma Başarısı."
 ve_cul_evt.42.b:0 "Acil yerel kaynaklar aktarın."
 ve_cul_evt.42.b.tt:0 "#N 25#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #N 5#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusun #N 1%#! kadarı Radikal hâline gelir.\nProje devam eder."
 ve_cul_evt.42.c:0 "Asgari bir programla devam edin."
 ve_cul_evt.42.c.tt:0 "Kültürel Proje ilerlemesi #N 10#! azalır.\nMillî Uyum #N 2#! azalır.\nProje devam eder."
 ve_cul_evt.42.e:0 "Müzakere çerçevesini yeniden kurun."
 ve_cul_evt.42.e.tt:0 "#N 15#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #N 3#! azalır.\nMillî Uyum #P 2#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusun #N 0.5%#! kadarı Radikal hâline gelir.\nProje devam eder."

 ve_cul_evt.50.t:0 "Soyadı ve Dil Direktifi"
 ve_cul_evt.50.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki yetkililer, soyadlarını ve resmî kayıtları millî dilde standartlaştırmayı teklif ediyor. Direktif, [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusunun merkezî yönetim tarafından sınıflandırılmasını kolaylaştıracaktır; ancak aileler, özel kimliğin devlet komutasının bir nesnesi hâline gelmesinden korkuyor."
 ve_cul_evt.50.f:0 "\"Sicilde farklı yazılmış bir isim, bir ailenin kendisini hatırladığı isim olmaya devam edebilir.\""
 ve_cul_evt.50.a:0 "Kademeli bir kayıt kampanyasını finanse edin."
 ve_cul_evt.50.a.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 4#! artar.\nMillî Uyum #P 1#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusun #N 0.5%#! kadarı Radikal hâline gelir."
 ve_cul_evt.50.b:0 "Tek bir millî standardı dayatın."
 ve_cul_evt.50.b.tt:0 "Kültürel Proje ilerlemesi #P 7#! artar.\nMillî Uyum #N 4#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusun #N 1%#! kadarı Radikal hâline gelir."
 ve_cul_evt.50.c:0 "Direktifi gözden geçirilmek üzere geri çekin."
 ve_cul_evt.50.c.tt:0 "Kültürel Proje ilerlemesi #N 5#! azalır.\nMillî Uyum #P 3#! artar."

 ve_cul_evt.51.t:0 "Asker Alım Sicilleri"
 ve_cul_evt.51.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki Ordu yetkilileri; hizmet yükümlülükleri, soyadları ve komutalar için tek bir sicil talep ediyor. Bunu [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusuna uygulamak Etnik Entegrasyon çabasını güçlendirecektir, ancak orduyu kültürel silinmenin başka bir aracı olarak gören topluluklar arasında direniş büyüyor."
 ve_cul_evt.51.f:0 "\"Devlet, bir köyün isimlerini ilk olarak vergilerini toplamak veya oğullarını çağırmak istediğinde öğrenir.\""
 ve_cul_evt.51.a:0 "Millî sicilleri uygulayın."
 ve_cul_evt.51.a.tt:0 "Kültürel Proje ilerlemesi #P 5#! artar.\nMillî Uyum #N 2#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusun #N 0.5%#! kadarı Radikal hâline gelir."
 ve_cul_evt.51.b:0 "Yerel kayıt uygulamalarını koruyun."
 ve_cul_evt.51.b.tt:0 "Kültürel Proje ilerlemesi #N 3#! azalır.\nMillî Uyum #P 3#! artar."
 ve_cul_evt.51.c:0 "Sicilleri askerî hizmet yoluyla entegre edin."
 ve_cul_evt.51.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 6#! artar.\nMillî Uyum #P 1#! artar.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusun #N 0.5%#! kadarı Radikal hâline gelir."

 ve_cul_evt.100.t:0 "Kurucu Heyet"
 ve_cul_evt.100.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluğundan bir heyet, Bileşen Uzlaşması kurumlarında temsil talepleriyle geldi. Müzakere projeyi yavaşlatacak ancak meşruiyetini güçlendirecektir; başkentten dayatılan bir anlaşma ise güven pahasına daha hızlı ilerleyebilir."
 ve_cul_evt.100.f:0 "\"Bir uzlaşma ancak her bir bileşen yazılmasına yardım ettiği bir maddeye işaret edebildiği zaman ortak bir değer kazanır.\""
 ve_cul_evt.100.a:0 "Uzlaşmadaki yerlerini müzakere et."
 ve_cul_evt.100.a.tt:0 "Kültürel Proje ilerlemesi #N 4#! azalır.\nUlusal Uyum #P 4#! artar."
 ve_cul_evt.100.b:0 "Merkezi uzlaşıyı dayat."
 ve_cul_evt.100.b.tt:0 "Kültürel Proje ilerlemesi #P 5#! artar.\nUlusal Uyum #N 2#! azalır.\n[SCOPE.sState('ve_evt_target_state').GetName] içindeki [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfusunun #N %0.5#! kadarı Radikal olur."
 ve_cul_evt.100.c:0 "Parlamenter koalisyonu görüşmelere dahil et."
 ve_cul_evt.100.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 4#! artar.\nUlusal Uyum #P 2#! artar."

 ve_cul_evt.101.t:0 "İkili Yönetim"
 ve_cul_evt.101.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] bölgesindeki Bileşen Uzlaşması artık örtüşen iki yönetime bağlıdır. Merkezi memurlar ile [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluğunun temsilcileri kayıtları mükerrer tutmakta, atamaları tartışmakta ve ülkenin bürokrasisi tükenme noktasına yaklaşırken çelişkili talimatlar yayınlamaktadır."
 ve_cul_evt.101.f:0 "\"İki ofis otoriteyi bir evrak dolabını paylaşabileceklerinden daha kolay paylaşabilir.\""
 ve_cul_evt.101.a:0 "Müşterek bir idari kadroyu finanse et."
 ve_cul_evt.101.a.tt:0 "#N 15#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 6#! artar."
 ve_cul_evt.101.b:0 "Ofisler anlaşana dek uzlaşmayı yavaşlat."
 ve_cul_evt.101.b.tt:0 "Kültürel Proje ilerlemesi #N 6#! azalır.\nUlusal Uyum #P 2#! artar."
 ve_cul_evt.101.c:0 "Ofisleri kamu hizmeti altında birleştir."
 ve_cul_evt.101.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 5#! artar.\nUlusal Uyum #P 2#! artar."

 ve_cul_evt.150.t:0 "İdari Bölgelerde Uygulama"
 ve_cul_evt.150.d:0 "İdari bölge yönetimleri, ulusal kültürel projenin tamamen farklı hızlarda ilerlediğini bildirmektedir. Kimi ofisler fon sağlanan uygulama komisyonları talep ederken, kimileri de her bölgeye tek bir takvim dayatmanın kıt personeli tüketeceğini ve halkın kararlılığını zayıflatacağını uyarmaktadır."
 ve_cul_evt.150.f:0 "\"Ulusal bir hüküm bir kez yazılır, ancak ülkenin her ofisinde uygulanmalıdır.\""
 ve_cul_evt.150.a:0 "Uygulama komisyonlarını finanse et."
 ve_cul_evt.150.a.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 5#! artar."
 ve_cul_evt.150.b:0 "Kademeli bir takvim kullan."
 ve_cul_evt.150.b.tt:0 "Kültürel Proje ilerlemesi #N 4#! azalır.\nUlusal Uyum #P 2#! artar."
 ve_cul_evt.150.c:0 "Mevcut yönetimi standartlaştır."
 ve_cul_evt.150.c.tt:0 "#N 5#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 3#! artar.\nUlusal Uyum #P 2#! artar."

 ve_cul_evt.151.t:0 "Öğretim Dili"
 ve_cul_evt.151.d:0 "Ulusal Müfredat ortak bir öğretim dili gerektirmesine rağmen, ülkedeki okullar çok farklı dil geleneklerine sahip topluluklara hizmet etmektedir. Çok dilli materyaller kararlılığı koruyacak ancak dağıtımı geciktirecektir; tek bir müfredat ise eğitimi kültürel bir çekişmeye dönüştürme riskiyle sınıflara hızla ulaşabilecektir."
 ve_cul_evt.151.f:0 "\"Öğrencinin güvenmediği bir dilde verilen ders, konusu dışında her şeyiyle hatırlanabilir.\""
 ve_cul_evt.151.a:0 "Çok dilli materyalleri finanse et."
 ve_cul_evt.151.a.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 3#! artar.\nUlusal Uyum #P 3#! artar."
 ve_cul_evt.151.b:0 "Tek bir ulusal müfredat uygula."
 ve_cul_evt.151.b.tt:0 "Kültürel Proje ilerlemesi #P 6#! artar.\nUlusal Uyum #N 3#! azalır."
 ve_cul_evt.151.c:0 "Eğitim ve refah ağlarını birleştir."
 ve_cul_evt.151.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 5#! artar.\nUlusal Uyum #P 2#! artar."

 ve_cul_evt.160.t:0 "Ulusun Temsilcisi Kim?"
 ve_cul_evt.160.d:0 "Ortak Simgeler projesi; kimin tarihinin, üniformalarının, anıtlarının ve törenlerinin tüm ülkeyi temsil edebileceği meselesini yeniden açmıştır. Geleneklerin dönüşümlü kullanılması tanınmayı genişletecek ancak mutabakatı yavaşlatacaktır; tek bir resmî anlatının seçilmesi ise pek çok vatandaşı dışarıda bırakırken netlik sağlayacaktır."
 ve_cul_evt.160.f:0 "\"Bir simge ancak vatandaşlar kendilerini onda bir açıklamaya gerek duyulmaksızın gördüklerinde ulusal hâle gelir.\""
 ve_cul_evt.160.a:0 "Simgeleri kamusal kullanımda dönüştür."
 ve_cul_evt.160.a.tt:0 "Kültürel Proje ilerlemesi #N 3#! azalır.\nUlusal Uyum #P 4#! artar."
 ve_cul_evt.160.b:0 "Tek bir resmî anlatı seç."
 ve_cul_evt.160.b.tt:0 "Kültürel Proje ilerlemesi #P 6#! artar.\nUlusal Uyum #N 3#! azalır."
 ve_cul_evt.160.c:0 "Ortak bir kamusal tören tasarla."
 ve_cul_evt.160.c.tt:0 "#N 10#! Kültürel Yetki harcanır.\nKültürel Proje ilerlemesi #P 4#! artar.\nUlusal Uyum #P 2#! artar."
