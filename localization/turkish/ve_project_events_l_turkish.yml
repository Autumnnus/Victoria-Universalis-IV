l_turkish:
 ve_je_religious_project:0 "Dini Proje"
 ve_je_religious_project_reason:0 "Hükümet uzun vadeli bir dini proje yürütmektedir. Gelişimi idari kapasiteye, siyasi meşruiyete, dini koşullara ve hedef eyaletteki olaylara göre belirlenir."
 ve_je_religious_project_progress:0 "Dini Proje tamamlanmaya doğru ilerliyor"
 ve_je_religious_project_status_confessional:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] eyaletindeki Devlet Dini Dönüşümü, örgütlü bir kampanyayla devlet dininin etkisini genişletmeyi amaçlıyor.\n\n#Y 125#! ilerlemede tamamlanır: hedef eyalet nüfusunun %5'ini devlet dinine dönüştürür, #P 20#! Dindarlık Reformu iade eder ve #P 5#! Dini Yerleşim kazandırır."
 ve_je_religious_project_status_freedom:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] eyaletindeki Özgürlük Açılımı, vicdan özgürlüğü ve gönüllü iş birliği temelinde dini uzlaşmayı güçlendirmeyi amaçlıyor.\n\n#Y 100#! ilerlemede tamamlanır: zorla din değiştirme olmaksızın sadıklar kazandırır, #P 20#! Dindarlık Reformu iade eder ve #P 7#! Dini Yerleşim kazandırır."
 ve_je_religious_project_status_secularization:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] eyaletindeki Laikleşme Kampanyası, örgütlü dinin kamusal etkisini azaltmayı amaçlıyor.\n\n#Y 150#! ilerlemede tamamlanır: hedef eyalet nüfusunun %5'ini ateizme dönüştürür, #P 25#! Dindarlık Reformu iade eder ve #P 8#! Dini Yerleşim kazandırır."
 ve_je_religious_project_complete_tt:0 "Dini Proje amacına ulaşmıştır."
 ve_je_religious_project_fail_tt:0 "Dini Proje iptal edilmiştir."

 ve_je_cultural_project:0 "Kültür Projesi"
 ve_je_cultural_project_reason:0 "Hükümet uzun vadeli bir kültürel projeyi yönetiyor. İdari kapasite, meşruiyet, eğitim, ulusal uyum ve yerel koşullar bunun hızını belirlemektedir."
 ve_je_cultural_project_progress:0 "Kültürel Proje tamamlanmaya doğru ilerlemektedir"
 ve_je_cultural_project_status_curriculum:0 "Ülkenin okul ve kurumları için Ulusal Müfredat hazırlanmaktadır.\n\nTamamlanma süreci #Y 100#! ilerlemede: #P +20#! Kültürel Yetki, #P +5#! Ulusal Uyum ve +%2 Eğitim Erişimi, +%5 Nitelikler, -25 Bürokrasinin 10 yıllık sonucu."
 ve_je_cultural_project_status_symbols:0 "Paylaşılan Semboller programı, ortak bir yurttaşlık sözlüğü oluşturuyor.\n\nTamamlanma tarihi: #Y 75#! ilerleme: #P +20#! Kültürel Yetki, #P +7#! Ulusal Uyum ve tamamen kabul görmüş nüfustan +%10 sadık kişilerin ve +25 Otoritenin 8 yıllık sonucu."
 ve_je_cultural_project_status_ethnic:0 "Etnik Entegrasyon Kampanyası [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] azınlık nüfusunu birincil kültüre doğru itiyor.\n\nTamamlanma tarihi: #Y 125#! ilerleme: hedef kültürün popülasyonlarının %5'ini birincil kültüre dönüştürür (Milliyetçi VII ile %7), #P +25#! Kültürel Talimat, #P +8#! Ulusal Uyum ve 10 yıllık asimilasyon sonucu."
 ve_je_cultural_project_status_civic:0 "Eşit Vatandaşlık Girişimi [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] ortak bir yurttaşlık statüsünü kültürel sınırların ötesine taşıyor.\n\nTamamlanma tarihi: #Y 100#! ilerleme: 10 yıl boyunca +%15 Kabul, devlete sadık olanlar, #P +25#! Kültürel Yetki, #P +10#! Ulusal Uyum ve 10 yıllık yeterlilikler/göç sonucu."
 ve_je_cultural_project_status_composite:0 "Kurucu Sözleşme [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] bileşik bir durum içerisinde kalıcı tanınma için pazarlık yapılıyor.\n\nTamamlanma tarihi: #Y 150#! ilerleme (40+ Ulusal Uyum gerektirir): kalıcı +%15 Kabul, kültürü seçmen listesine ekler, devlete sadık olanlar, #P +30#! Kültürel Talimat, #P +12#! Ulusal Uyum."
 ve_je_cultural_project_complete_tt:0 "Kültür Projesi amacına ulaştı."
 ve_je_cultural_project_fail_tt:0 "Kültür Projesi iptal edildi."
 ve_je_project_resolving_status:0 "Proje yönetimi nihai raporunu hazırlıyor."

 ve_evt_religious_incident_cooldown_mdf:0 "Dini Proje Olayı Bekleme Süresi"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "Proje yönetimi yakın zamanda meydana gelen bir olayın sonuçlarına katlanıyor."
 ve_evt_cultural_incident_cooldown_mdf:0 "Kültürel Proje Olayı Bekleme Süresi"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "Proje yönetimi yakın zamanda yaşanan bir olayın sonuçlarına katlanıyor."
 ve_evt_central_clergy_supported_mdf:0 "Merkezi Ruhban Sınıfı Desteklendi"
 ve_evt_central_clergy_supported_mdf_desc:0 "Hükümet, merkezi dini hiyerarşinin otoritesini onayladı."
 ve_evt_central_clergy_slighted_mdf:0 "Merkez Ruhban Sınıfı Hafiflemiş"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Hükümet, merkezi dini hiyerarşinin tercihleri yerine yerel uygulamaları tercih etmiştir."
 ve_evt_municipal_patronage_mdf:0 "Belediye Patronaj Ağları"
 ve_evt_municipal_patronage_mdf_desc:0 "Yerel ileri gelenler, vergi tahsilatını zayıflatacak düzenlemeler yoluyla projeyi ilerletiyor."

 ve_rel_evt.1.t:0 "Yerel ileri gelenlerin dilekçesi"
 ve_rel_evt.1.d:0 "Din adamları, belediye yetkilileri ve mahalle ileri gelenlerinden oluşan bir heyet, [SCOPE.sState('ve_evt_target_state').GetName] eyaletindeki Devlet Dini Dönüşümünün yavaşlatılması için hükümete dilekçe verdi. Katı bir takvimin, uyumu kalıcı bir kırgınlığa dönüştüreceği uyarısında bulunuyorlar."
 ve_rel_evt.1.f:0 "\\"Öğüt olmadan dayatılan inanç, sıraları boşaltırken kayıtları doldurabilir.\\""
 ve_rel_evt.1.a:0 "Dilekçelerini dinleyin."
 ve_rel_evt.1.a.tt:0 "Dini Proje ilerlemesi  #N 4#! azalır.\nDini Yerleşim artar #P 3#!."
 ve_rel_evt.1.b:0 "Takvim değişmeyecek."
 ve_rel_evt.1.b.tt:0 "Dini Proje ilerlemesi şu oranda artar: #P 5#!.\nDini Yerleşim  #N 2#! azalır.\n#N %0,5#! nüfusun geliri Radikal olur. [SCOPE.sState('ve_evt_target_state').GetName] Komisyonun güvendiği aracılar."
 ve_rel_evt.1.c:0 "10"
 ve_rel_evt.1.c.tt:0 "Dindarlık Reformu Harcayın.\nDini Proje ilerlemesi #N 3#!  artar.\nDini Yerleşim  #P 3#! artar. #P 1#!."

 ve_rel_evt.2.t:0 "Saha Görevlisi Eksikliği"
 ve_rel_evt.2.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] eyaletinden gelen raporlar; yanıtsız dilekçeleri, çelişkili talimatları ve haftalardır proje görevlisi görmeyen ilçeleri anlatıyor. Devlet Dini Dönüşümü, onu yürütmekle görevli idarenin kapasitesini aşmaya başladı."
 ve_rel_evt.2.f:0 "\\"Bir kararname ülkeyi bir günde geçebilir. Yetkili bir katip bunu yapamaz.\\""
 ve_rel_evt.2.a:0 "Geçici saha görevlilerini işe alın."
 ve_rel_evt.2.a.tt:0 "Harcama #N 15#! Dindarlık Reformu.\nDini Proje ilerlemesi #P 4#! artar."
 ve_rel_evt.2.b:0 "Programı yavaşlatın."
 ve_rel_evt.2.b.tt:0 "Dini Proje ilerlemesi  #N 6#! azalır.\nDini Yerleşim  #P 2#! artar."
 ve_rel_evt.2.c:0 "Merkezi sicil kadrolarını kullanın."
 ve_rel_evt.2.c.tt:0 "Harcamak #N 10#! Dindarlık Reformu.\nDini Proje ilerlemesi şu oranda artar: #P 5#!."

 ve_cul_evt.1.t:0 "Çeviri Büroları"
 ve_cul_evt.1.d:0 "Yetkilileri [SCOPE.sState('ve_evt_target_state').GetName] Eşit Vatandaşlık Girişiminin bu sorunu nasıl ele alması gerektiği konusunda anlaşamıyorum [SCOPE.sCulture('ve_evt_target_culture').GetName] dil. Yerel yöneticiler iki dilli ofisler istiyor; merkezi bakanlıklar tek bir idari standart talep etmektedir."
 ve_cul_evt.1.f:0 "\\"Bir vatandaşın kendi adına tanınan hakları anlaması için tercümana ihtiyacı olmamalıdır.\\""
 ve_cul_evt.1.a:0 "Yerel diller kamu kurumlarında yaşasın."
 ve_cul_evt.1.a.tt:0 "Kültürel Proje ilerlemesi azalır #N 4#!.\nUlusal Uyum  #P 3#! artar."
 ve_cul_evt.1.b:0 "Tek bir idari standart uygulayın."
 ve_cul_evt.1.b.tt:0 "Kültürel Proje ilerlemesi #P 5#! artar.\nUlusal Uyum şu kadar azalır: #N 2#!.\n#N 0,5%#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_cul_evt.1.c:0 "Akademik bir çeviri komisyonu kurun."
 ve_cul_evt.1.c.tt:0 "Harcayın #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi  #P 3#! artar.\nUlusal Uyum  #P 1 artar#!."

 ve_cul_evt.2.t:0 "Yerel Öğretmen Eksikliği"
 ve_cul_evt.2.d:0 "Okullar [SCOPE.sState('ve_evt_target_state').GetName] Hem devlet müfredatına hem de devlet müfredatına hizmet edebilecek öğretmenlerin eksikliği [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluklar. Eğitimli bir yerel kadro olmadan, eşit vatandaşlık yalnızca resmi kağıt üzerinde yazılı bir söz olarak kalma riskiyle karşı karşıya kalır."
 ve_cul_evt.2.f:0 "\\"Yasa eşitliği bir öğleden sonra ilan ediyor; sınıfta bunu bir nesil boyunca öğretmek gerekiyor.\\""
 ve_cul_evt.2.a:0 "Yeni öğretmen kolejlerini finanse edin."
 ve_cul_evt.2.a.tt:0 "Harcayın #N 15#! Kültürel Talimat.\nKültürel Projenin ilerlemesi #P 4#!."
 ve_cul_evt.2.b:0 "Yavaş uygulama."
 ve_cul_evt.2.b.tt:0 "Kültürel Proje ilerlemesi  #N 6#! azalır.\nUlusal Uyum  #P 2#! artar."
 ve_cul_evt.2.c:0 "Halihazırda mevcut olan kurumları kullanın."
 ve_cul_evt.2.c.tt:0 "Harcama #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi  #P 5#! artar.\nUlusal Uyum  #P 1#! artar."

 ve_rel_evt.3.t:0 "Çakışan Kayıtlar"
 ve_rel_evt.3.d:0 "Mahalle kayıtları, belediye defterleri ve proje görevlilerinin raporları, dinsel bağlılığa ilişkin uyumsuz açıklamalar veriyor. [SCOPE.sState('ve_evt_target_state').GetName]. Yönetim, gerçeği ortaya çıkarmak için zaman mı kaybedeceğine yoksa belirsiz olduğunu bildiği rakamlarla mı devam edeceğine karar vermelidir."
 ve_rel_evt.3.f:0 "\\"Her ofisin kesin bir toplamı vardır. İki toplam birbirine uymuyor.\\""
 ve_rel_evt.3.a:0 "Eksiksiz bir denetim gerçekleştirin."
 ve_rel_evt.3.a.tt:0 "Kazanç #P 8#! Dindarlık Reformu.\nDini Proje ilerlemesi  #N 6#! azalır."
 ve_rel_evt.3.b:0 "Makul tahminlerle ilerleyin."
 ve_rel_evt.3.b.tt:0 "Harcama #N 8#! Dindarlık Reformu.\nDini Proje ilerlemesi şu oranda artar: #P 5#!."
 ve_rel_evt.3.c:0 "Kutsal Yönetim kayıtlarını kullanın."
 ve_rel_evt.3.c.tt:0 "Dini Proje ilerlemesi #P 3#!."

 ve_rel_evt.4.t:0 "Söylentiler ve Karşı Vaaz"
 ve_rel_evt.4.d:0 "Broşürler, sokak vaazları ve endişeli söylentiler, [SCOPE.sState('ve_evt_target_state').GetName] eyaletindeki Devlet Dini Dönüşümünü yerel yaşama yönelik bir saldırı gibi sunuyor. Yetkililer, sessizliğin rakiplerin projeyi tanımlamasına izin vereceğini; baskınınsa en sert iddiaları doğrulayacağını söylüyor."
 ve_rel_evt.4.f:0 "\"Söylentinin makama, mühüre ve bütçeye ihtiyacı yoktur.\\""
 ve_rel_evt.4.a:0 "Halka açık oturumlar düzenleyin."
 ve_rel_evt.4.a.tt:0 "Dini Proje ilerlemesi #N 3#! azalır.\nDini Yerleşim artar #P 3#!.\n#P %0,5#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Sadık olur."
 ve_rel_evt.4.b:0 "Kışkırtıcıları cezalandırın."
 ve_rel_evt.4.b.tt:0 "Dini Proje ilerlemesi  #P 4#! arttı.\nDini Yerleşim  #N 3#! azaldı.\n#N 1#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_rel_evt.4.c:0 "Kayıtları ve sonuçları yayınlayın."
 ve_rel_evt.4.c.tt:0 "Harcama yapın #N 10#! Dindarlık Reformu.\nDini Proje ilerlemesi #P 2#! artar.\nDini Yerleşim artar #P 1#!."

 ve_rel_evt.5.t:0 "Hutbenin Dili"
 ve_rel_evt.5.d:0 "Proje din adamları [SCOPE.sState('ve_evt_target_state').GetName] resmi vaazların doktrinsel birliği koruduğunu ancak pek çok cemaate ulaşmada başarısız olduğunu bildiriyor. Merkezi hiyerarşi adaptasyonun bağımsızlığa dönüşmesinden korkmasına rağmen, yerel dilde vaaz verilmesi kampanyayı daha da ileriye taşıyacaktır."
 ve_rel_evt.5.f:0 "\\"Duyulmamış kutsal bir söz mükemmel bir şekilde korunur ve kimse tarafından kabul edilmez.\\""
 ve_rel_evt.5.a:0 "Yerel dillerde vaaz verin."
 ve_rel_evt.5.a.tt:0 "Dini Proje ilerlemesi  #P 6#! artar.\nDevout kaybeder #N 1#! Şunun için onay: #Y 2,5 yıl#!."
 ve_rel_evt.5.b:0 "Ayinsel birliği koruyun."
 ve_rel_evt.5.b.tt:0 "Dini Proje ilerlemesi #N 3#! azalır.\nDini Yerleşim  #P 3#! artar.\nDindarlık kazancı #P 1#! Şunun için onay: #Y 2,5 yıl#!."
 ve_rel_evt.5.c:0 "Eğitimli tercümanlar yetiştirin."
 ve_rel_evt.5.c.tt:0 "Harcama yapın #N 10#! Dindarlık Reformu.\nDini Proje ilerlemesi  #P 4#! artar.\nDini Yerleşim  #P 1#! artar."

 ve_rel_evt.6.t:0 "Rakip Kilise Otoriteleri"
 ve_rel_evt.6.d:0 "Merkezden atanan görevliler ile yerleşik din adamları, [SCOPE.sState('ve_evt_target_state').GetName] eyaletindeki Devlet Dini Dönüşümünü yönetme hakkını birbirinden talep ediyor. Bir tarafı desteklemek komutayı hızla toparlayabilir; ancak anlaşmazlık, kimin inanç adına konuşacağına dair bir sınava dönüştü."
 ve_rel_evt.6.f:0 "\\"Tartışma, kurumların gücü böyle tanımladığı yargı yetkisiyle ilgilidir.\\""
 ve_rel_evt.6.a:0 "Merkezi din adamlarını destekleyin."
 ve_rel_evt.6.a.tt:0 "Dini Proje ilerlemesi #P 5#! artar.\nDindarlar kazanır #P 1#! Onay  #Y 2,5 yıl#!.\nDini Yerleşim Nüfusun  #N 3#!.\n#N %0,5#! altında kalıyor [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_rel_evt.6.b:0 "Yerel din adamlarını yatıştırın."
 ve_rel_evt.6.b.tt:0 "Dini Proje ilerlemesi #N 4#! azalır.\nDindarlar #N 1#! Onayı kaybeder #Y 2,5 yıl#!.\nDini Yerleşim  #P 3 artıyor#!."
 ve_rel_evt.6.c:0 "Yetkilerini yazılı olarak tanımlayın."
 ve_rel_evt.6.c.tt:0 "Harcama #N 10#! Dindarlık Reformu.\nDini Proje ilerlemesi  #P 3#! artar.\nDini Yerleşim  #P 1#! artar."

 ve_cul_evt.3.t:0 "Nüfus Sayımının Kategorileri"
 ve_cul_evt.3.d:0 "Nüfus sayımı görevlileri [SCOPE.sState('ve_evt_target_state').GetName] vatandaşların nasıl olduğu konusunda anlaşamıyorum [SCOPE.sCulture('ve_evt_target_culture').GetName] kültürü kaydedilmelidir. Yerel katılımcılar örtüşen kimlikler kullanırken, merkezi formlar tek kutuda tek yanıt talep ediyor."
 ve_cul_evt.3.f:0 "\\"Bir kategori, ülkeyi basitleştirmeden çok önce defteri basitleştirir.\\""
 ve_cul_evt.3.a:0 "Kendinizi tanımlamaya izin verin."
 ve_cul_evt.3.a.tt:0 "Kültürel Proje ilerlemesi şu oranda azalır: #N 4#!.\nUlusal Uyum  #P 4#! artar."
 ve_cul_evt.3.b:0 "Kategoriler merkezi olarak belirlenecektir."
 ve_cul_evt.3.b.tt:0 "Kültürel Proje ilerlemesi #P 6#!artacaktır.\nUlusal Uyum şu oranda azalacaktır: #N 4#!.\n#N %0,5#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_cul_evt.3.c:0 "Modern kayıt sistemini kullanın."
 ve_cul_evt.3.c.tt:0 " #N 10#! Kültürel Talimat harcayın.\nKültürel Proje ilerlemesi  #P 5#! artar.\nUlusal Uyum  #P 1#! artar."

 ve_cul_evt.4.t:0 "Belediye ileri gelenleri"
 ve_cul_evt.4.d:0 "Belediye patronları [SCOPE.sState('ve_evt_target_state').GetName] eşit vatandaşlığı geliştirmek için ofislerine, müşterilerine ve nüfuzlarına sahip olmalarını sağlar. [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus. İşbirliği hızlı olacaktır, ancak bedeli yerel gelirler üzerindeki kontrolün devam etmesidir."
 ve_cul_evt.4.f:0 "\\"Belediye binasına giden en kısa yol birkaç özel çizim odasından geçer.\\""
 ve_cul_evt.4.a:0 "Yerel ağları kullanın."
 ve_cul_evt.4.a.tt:0 "Kültürel Projenin ilerlemesi şu şekilde artar: #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] kaybeder #N %5#! Vergi Kapasitesi #Y 2 yıl#!."
 ve_cul_evt.4.b:0 "Açık konseyler oluşturun."
 ve_cul_evt.4.b.tt:0 "Kültürel Projenin ilerlemesi  #N 3#! azalır.\nUlusal Uyum  #P 3#! artar."
 ve_cul_evt.4.c:0 "Kurallara dayalı bir çözüm için müzakere yapın."
 ve_cul_evt.4.c.tt:0 " #N 10#! Kültürel Talimat harcayın.\nKültürel Proje ilerlemesi  #P 3#! artar.\nUlusal Uyum  #P 1 artar#!."

 ve_cul_evt.5.t:0 "Kamu Hizmeti Sınavları"
 ve_cul_evt.5.d:0 "Kamu hizmeti sınavlarının açılması [SCOPE.sCulture('ve_evt_target_culture').GetName] Adaylar yasal eşitlik ile pratik hazırlık arasındaki boşluğu ortaya çıkardı. Derhal erişim sembolik olarak güçlü olabilir, ancak yıllarca süren eşitsiz eğitim kanun hükmünde kararname ile silinemez."
 ve_cul_evt.5.f:0 "\\"Aynı sınav, yalnızca bir adaya kendi dilinin öğretildiği aynı fırsat değildir.\\""
 ve_cul_evt.5.a:0 "Mali hazırlık kursları."
 ve_cul_evt.5.a.tt:0 "Harcayın #N 15#! Kültürel Talimat.\nKültürel Proje ilerlemesi  #P 5#! artar.\nUlusal Uyum  #P 2#! artar."
 ve_cul_evt.5.b:0 "Eşit erişim anında başlar."
 ve_cul_evt.5.b.tt:0 "Kültürel Proje ilerlemesi #P 7#! artar.\nUlusal Uyum  #N 4#! azalır.\n#N %0,5#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Radikal hale gelir."
 ve_cul_evt.5.c:0 "Okul ve sosyal yardım ağlarını harekete geçirin."
 ve_cul_evt.5.c.tt:0 "Harcama yapın #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi  #P 5#! artar.\nUlusal Uyum şu oranda artar: #P 2#!."
 ve_cul_evt.5.e:0 "Önce sınav sisteminde reform yapın."
 ve_cul_evt.5.e.tt:0 "Kültürel Proje ilerlemesi #N 4#!azalır.\nUlusal Uyum #P 3 artar#!."

 ve_cul_evt.6.t:0 "Çoğunluk Geri Dönüyor"
 ve_cul_evt.6.d:0 "Eşit Vatandaşlık Girişimi'nin muhalifleri, ortak hakların tüm vatandaşlara genişletilmesi gerektiğini iddia ediyor [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus diğer herkesin itibarını azaltır. Gösteriler [SCOPE.sState('ve_evt_target_state').GetName] İdari bir reformu ulusal bir siyasi sınava dönüştürüyorlar."
 ve_cul_evt.6.f:0 "\\"Paylaşılan bir hak, çalınan bir ayrıcalık olarak tanımlanıyor.\\""
 ve_cul_evt.6.a:0 "İnisiyatifi açıkça savunun."
 ve_cul_evt.6.a.tt:0 "Kültürel Proje ilerlemesi  #P 4#! arttı.\nUlusal Uyum  #N 4#! azaldı.\n#N 1#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Radikal hale gelir."
 ve_cul_evt.6.b:0 "Uygulama hızını azaltın."
 ve_cul_evt.6.b.tt:0 "Kültürel Proje ilerlemesi #N 5#!azalır.\nUlusal Uyum #P 3 artar#!."
 ve_cul_evt.6.c:0 "Reform koalisyonunu harekete geçirin."
 ve_cul_evt.6.c.tt:0 "Harcama #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi #P 3#! artar.\nUlusal Uyum artar #P 2#!.\n#P 0,5%#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Sadık olur."

 ve_rel_evt.7.t:0 "Kırılma Noktasındaki Görev"
 ve_rel_evt.7.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] eyaletindeki Devlet Dini Dönüşümü idari ve siyasi bir çöküşün eşiğinde. Daireler birbirine cevap vermeyi bıraktı, halkın direnişi sertleşti ve din adamları projenin mevcut koşullarda sürdürülemeyeceği uyarısında bulunuyor."
 ve_rel_evt.7.f:0 "\\"Raporlar buna hâlâ geçici bir zorluk diyor. Sokaklar daha sert bir isim seçti.\\""
 ve_rel_evt.7.a:0 "Kayıpları kabul edin ve geri çekilin."
 ve_rel_evt.7.a.tt:0 "Dindarlık Reformu iadesi olmadan Dini Projeyi iptal edin.\nDini Yerleşim  #N 5#! azalır.\nFor #Y 2 yıl#!: #N -50#! Bürokrasi, #N -50#! Otorite ve #N -3%#! Kanun Çıkarma Başarısı."
 ve_rel_evt.7.b:0 "Acil durum kaynaklarını aktarın."
 ve_rel_evt.7.b.tt:0 "Harcayın #N 25#! Dindarlık Reformu.\nDini Proje ilerlemesi #N 5#! azalır.\n#N %1#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Radikal oluyor.\nProje devam ediyor."
 ve_rel_evt.7.c:0 "Çekirdek kadroyla devam edin."
 ve_rel_evt.7.c.tt:0 "Dini Proje ilerlemesi #N 10#! azalır.\nDini Yerleşim azalır. #N 2#!.\nProje devam ediyor."
 ve_rel_evt.7.e:0 "Yöntemi yeniden görüşün."
 ve_rel_evt.7.e.tt:0 "Harcama #N 15#! Dindarlık Reformu.\nDini Proje ilerlemesi #N 3 azalır#!.\nDini Yerleşim  #P 2#! artar.\n#N %0,5#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Radikal oluyor.\nProje devam ediyor."

 ve_cul_evt.7.t:0 "Girişim Meşruiyetini Kaybediyor"
 ve_cul_evt.7.d:0 "Eşit Vatandaşlık Girişimi [SCOPE.sState('ve_evt_target_state').GetName] hem yerleşik kurumların hem de hükümetin desteğini kaybediyor [SCOPE.sCulture('ve_evt_target_culture').GetName] hizmet etmesi amaçlanan topluluklardı. Radikal hareketler artık her uzlaşmayı hükümetin eşitliği sağlayamayacağının kanıtı olarak gösteriyor."
 ve_cul_evt.7.f:0 "\\"Bir reform muhalefetten sağ çıkabilir. İnanılmaz hale gelerek hayatta kalamaz.\\""
 ve_cul_evt.7.a:0 "İnisiyatifi sonlandırın."
 ve_cul_evt.7.a.tt:0 "Kültürel Talimat iadesi olmadan Kültür Projesini iptal edin.\nUlusal Uyum şu kadar azalır: #N 5#!.\n #Y 2 yıl boyunca#!: #N -50#! Bürokrasi, #N -25#! Yetki ve #N -%3#! Kanun Çıkarma Başarısı."
 ve_cul_evt.7.b:0 "Acil yerel hibeler verin."
 ve_cul_evt.7.b.tt:0 "Harcama #N 25#! Kültürel Talimat.\nKültürel Proje ilerlemesi şu oranda azalır: #N 5#!.\n#N 1%#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur.\nProje devam eder."
 ve_cul_evt.7.c:0 "Minimal bir programla devam edin."
 ve_cul_evt.7.c.tt:0 "Kültürel Proje ilerlemesi  #N 10#! azaldı.\nUlusal Uyum  #N 2#! azaldı.\nProje devam ediyor."
 ve_cul_evt.7.e:0 "Koalisyonu yeniden inşa edin."
 ve_cul_evt.7.e.tt:0 "Harcama #N 15#! Kültürel Talimat.\nKültürel Proje ilerlemesi  #N 3#! azalır.\nUlusal Uyum  #P 2#! artar.\n#N %0,5#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal oluyor.\nProje devam ediyor."

 ve_rel_evt.8.t:0 "Beklenmedik Bir Yerel Concord"
 ve_rel_evt.8.d:0 "Din adamları, belediye yetkilileri ve toplum ileri gelenleri, [SCOPE.sState('ve_evt_target_state').GetName] eyaletinde hiçbir merkezi talimatın sağlayamayacağı bir uzlaşmaya vardılar. Yerel direniş azalıyor, cemaatler projeyi kendileri koordine ediyor ve Devlet Dini Dönüşümü beklenmedik bir ivme kazanıyor."
 ve_rel_evt.8.f:0 "\\"Başkentten gelen bir emirle başlayan şey, kasaba meydanında yapılan bir anlaşmaya dönüştü.\\""
 ve_rel_evt.8.a:0 "Bu ivmeyi sonuna kadar kullanın."
 ve_rel_evt.8.a.tt:0 "Dini Yerleşim #P 1#! artar.\nDini Proje ilerlemesi #P 25#! artar.\nİlerleme şu seviyeye ulaşırsa: #Y 100#!, projenin normal tamamlama etkisi uygulanır."
 ve_rel_evt.8.b:0 "Hızdan önce dayanıklılık."
 ve_rel_evt.8.b.tt:0 "Dini Yerleşim #P 4#! artar.\nDini Proje ilerlemesi şu oranda artar: #P 10#!.\nİlerleme  #Y 100#!'e ulaşırsa, projenin normal tamamlama etkisi uygulanır."

 ve_cul_evt.8.t:0 "Yerel Sivil Koalisyon"
 ve_cul_evt.8.d:0 "Öğretmenler, belediye yetkilileri, ticari dernekler ve yerel yönetimlerin temsilcileri [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluk [SCOPE.sState('ve_evt_target_state').GetName] ortak bir komite oluşturduk. Bu koalisyon, anlaşmazlıkları başkente ulaşmadan çözerek Eşit Vatandaşlık Girişimi'ne yönetimin sağlayamayacağı bir ivme kazandırdı."
 ve_cul_evt.8.f:0 "\\"Nadiren masa paylaşan kurumların sorumluluğu paylaşmaya başlamasıyla vatandaşlık gerçek oldu.\\""
 ve_cul_evt.8.a:0 "Koalisyonun momentumunu kullanın."
 ve_cul_evt.8.a.tt:0 "Ulusal Uyum artar #P 1#!.\nKültürel Proje ilerlemesi  #P 25#! artar.\nİlerleme  #Y 100#!'e ulaşırsa, projenin normal tamamlama etkisi uygulanır."
 ve_cul_evt.8.b:0 "Kurumları kalıcı hale getirin."
 ve_cul_evt.8.b.tt:0 "Ulusal Uyum  #P 4#! artar.\nKültürel Proje ilerlemesi  #P 10#! artar.\nİlerleme  #Y 100'e ulaşırsa#!, projenin normal tamamlanma etkisi uygulanır."

 ve_rel_evt.40.t:0 "Adım Dışındaki Kayıtlar"
 ve_rel_evt.40.d:0 "İl kayıtları [SCOPE.sState('ve_evt_target_state').GetName] Cemaatler, sivil dernekler ve kamu kurumları için uyumsuz kategoriler kullanmak. Başkente ulaşan raporlar artık birbiriyle çelişiyor ve proje, uyum ile direnişi ayırt edemiyor."
 ve_rel_evt.40.f:0 "\\"Üç defter aracılığıyla yönetilen bir politika kısa sürede üç farklı gerçeklik kazanır.\\""
 ve_rel_evt.40.a:0 "Merkezi bir denetim gönderin."
 ve_rel_evt.40.a.tt:0 " #N 10#! Dindarlık Reformu Harcayın.\nDini Proje ilerlemesi  #P 5#! artar.\nDini Yerleşim  #P 1 artar#!."
 ve_rel_evt.40.b:0 "Kayıtları yerel olarak mutabakata varın."
 ve_rel_evt.40.b.tt:0 "Dini Proje ilerlemesi #N 3#! azalır.\nDini Yerleşim  #P 2#! artar."
 ve_rel_evt.40.c:0 "Standart kayıt prosedürünü uygulayın."
 ve_rel_evt.40.c.tt:0 "Harcama #N 5#! Dindarlık Reformu.\nDini Proje ilerlemesi #P 4 artar#!.\nDini Yerleşim  #P 1#! artar."

 ve_rel_evt.41.t:0 "İl Personeli Eksikliği"
 ve_rel_evt.41.d:0 "Projeyi yönlendiren ofisler [SCOPE.sState('ve_evt_target_state').GetName] Yeterince eğitimli katip, öğretmen ve müfettiş bulamıyoruz. Direktifler, yerel yetkililerin yorumlayabileceğinden daha hızlı bir şekilde birikiyor ve aceleci atamalar her anlaşmazlığı daha da kötüleştirme tehlikesi taşıyor."
 ve_rel_evt.41.f:0 "\"Karar bir günde geldi. Bunu gerçekleştirebilecek kişilerin bulunması bir nesil sürebilir.\""
 ve_rel_evt.41.a:0 "Yeni bir memur kadrosunu finanse edin."
 ve_rel_evt.41.a.tt:0 "Harcayın #N 15#! Dindarlık Reformu.\nDini Proje ilerlemesi: #P 6#!."
 ve_rel_evt.41.b:0 "Uygulamayı yavaşlatın."
 ve_rel_evt.41.b.tt:0 "Dini Proje ilerlemesi #N 6#! azalır.\nDini Yerleşim artar #P 2#!."
 ve_rel_evt.41.c:0 "Mevcut eğitim ağını kullanın."
 ve_rel_evt.41.c.tt:0 "Harcama #N 10#! Dindarlık Reformu.\nDini Proje ilerlemesi #P 5 artar#!.\nDini Yerleşim  #P 1#! artar."

 ve_rel_evt.42.t:0 "Bölgedeki Söylentiler"
 ve_rel_evt.42.d:0 "Söylentiler [SCOPE.sState('ve_evt_target_state').GetName] Projenin hükümet tarafından açıklananlardan çok daha sert önlemleri gizlediğini iddia ediyor. Dini organizatörler ve yerel kışkırtıcılar çelişkili hikayeleri tekrarlarken, resmi sessizlik her yeni versiyonun yayılmasına olanak tanıyor."
 ve_rel_evt.42.f:0 "\\"Söylenti ofis gerektirmez, bütçe gerektirmez ve imza gerektirmez.\\""
 ve_rel_evt.42.a:0 "Raporları yayınlayın."
 ve_rel_evt.42.a.tt:0 "Dini Proje ilerlemesi #N 3#! azalır.\nDini Yerleşim artar #P 4#!."
 ve_rel_evt.42.b:0 "Ajitasyonu bırakın."
 ve_rel_evt.42.b.tt:0 "Dini Proje ilerlemesi #P 5#! artar.\nDini Yerleşim #N 3 azalır#!.\n#N Nüfusun %1#!  [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_rel_evt.42.c:0 "Yerel arabulucuları görevlendirin."
 ve_rel_evt.42.c.tt:0 "Harcayın #N 10#! Dindarlık Reformu.\nDini Proje ilerlemesi  #P 4#! artar.\nDini Yerleşim  #P 2#! artar.\n#P %0,5#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Sadık oluyor."

 ve_rel_evt.43.t:0 "Kırılma Noktasındaki Yönetim"
 ve_rel_evt.43.d:0 "Proje [SCOPE.sState('ve_evt_target_state').GetName] İdari çöküşe yaklaşıyor. İl daireleri bunalmış, kamuoyunun güveni sarsılmış ve organize muhalefet artık her yeni direktifi hükümetin kontrolü kaybettiğinin kanıtı olarak görüyor."
 ve_rel_evt.43.f:0 "\\"Dosyalar hareket etmeyi bıraktığında kriz sokaklara taşar.\\""
 ve_rel_evt.43.a:0 "Programı sonlandırın."
 ve_rel_evt.43.a.tt:0 "Dindarlık Reformu geri ödemesi olmadan Dini Projeyi iptal edin.\nDini Yerleşim şu kadar azalır: #N 5#!.\n #Y 2 yıl boyunca#!: #N -50#! Bürokrasi, #N -50#! Yetki ve #N -%3#! Kanun Çıkarma Başarısı."
 ve_rel_evt.43.b:0 "Acil durum kaynaklarını aktarın."
 ve_rel_evt.43.b.tt:0 "Harcayın #N 25#! Dindarlık Reformu.\nDini Proje ilerlemesi şu oranda azalır: #N 5#!.\n#N 1%#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Radikal oluyor.\nProje devam ediyor."
 ve_rel_evt.43.c:0 "Çekirdek kadroyla devam edin."
 ve_rel_evt.43.c.tt:0 "Dini Proje ilerlemesi azalıyor #N 10#!.\nDini Yerleşim  #N 2#! azaldı.\nProje devam ediyor."
 ve_rel_evt.43.e:0 "Yerel ortaklığı yeniden inşa edin."
 ve_rel_evt.43.e.tt:0 "Harcama yapın #N 15#! Dindarlık Reformu.\nDini Proje ilerlemesi  #N 3#! azalır.\nDini Yerleşim  #P 2#! artar.\n#N %0,5#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Radikalleşiyor.\nProje devam ediyor."

 ve_rel_evt.100.t:0 "Dinlerarası Konsey Koltukları"
 ve_rel_evt.100.d:0 "Delegeler [SCOPE.sState('ve_evt_target_state').GetName] Dinler arası bir konseyin gerekli olduğu konusunda hemfikirsiniz ancak kimin sandalyeyi hak ettiği konusunda değil. Orantılı temsil daha küçük topluluklara güven verirken, başkentte tasarlanan sabit bir yerleşim hemen çalışmaya başlayabilir."
 ve_rel_evt.100.f:0 "\\"Sandalyeler sayılana kadar herkes ortak bir masayı destekler.\\""
 ve_rel_evt.100.a:0 "Temsili nüfusa göre dağıtın."
 ve_rel_evt.100.a.tt:0 "Dini Proje ilerlemesi şu oranda azalır: #N 3#!.\nDini Yerleşim  #P 4#! artar."
 ve_rel_evt.100.b:0 "Sabit bir merkezi uzlaşma uygulayın."
 ve_rel_evt.100.b.tt:0 "Dini Proje ilerlemesi #P 5 artar#!.\nDini Yerleşim  #N 2#! azalır.\n#N %0,5#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_rel_evt.100.c:0 "Dinlerarası Konseyleri güçlendirin."
 ve_rel_evt.100.c.tt:0 "Harcamak #N 10#! Dindarlık Reformu.\nDini Proje ilerlemesi şu oranda artar: #P 5#!.\nDini Yerleşim  #P 2#! artar."

 ve_rel_evt.101.t:0 "Paylaşılan Okul Müfredatı"
 ve_rel_evt.101.d:0 "Okullar [SCOPE.sState('ve_evt_target_state').GetName] Özgürlük Yardımını yerel inançlara karşı bir kampanyaya dönüştürmeden ortak yurttaşlık derslerine ihtiyacımız var. Öğretmenler anlaşılır materyaller ve ortak eğitim talep ederken, toplum liderleri yerel eğitimde kendi geleneklerine yer verilmesi konusunda ısrar ediyor."
 ve_rel_evt.101.f:0 "\\"Paylaşılan bir ders ancak her ailenin sınıfı kendisine ait olarak kabul etmesi durumunda başarılı olur.\\""
 ve_rel_evt.101.a:0 "Ortak bir öğretim kadrosunu finanse edin."
 ve_rel_evt.101.a.tt:0 "Harcama yapın #N 15#! Dindarlık Reformu.\nDini Proje ilerlemesi  #P 6#! artar.\nDini Yerleşim  #P 1#! artar."
 ve_rel_evt.101.b:0 "Yerel müfredata yer bırakın."
 ve_rel_evt.101.b.tt:0 "Dini Proje ilerlemesi  #N 4#! azalır.\nDini Yerleşim  #P 3#! artar."
 ve_rel_evt.101.c:0 "Reform koalisyonunu okullara getirin."
 ve_rel_evt.101.c.tt:0 "Harcama #N 10#! Dindarlık Reformu.\nDini Proje ilerlemesi  #P 5#! artar.\nDini Yerleşim  #P 2#! artar.\n#P %0,5#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Sadık olur."

 ve_rel_evt.102.t:0 "Karşılıklı Garantiler Şartı"
 ve_rel_evt.102.d:0 "Dini topluluklar, belediye yetkilileri ve reform dernekleri [SCOPE.sState('ve_evt_target_state').GetName] ortak bir tüzük taslağı hazırladık. İmzacıların her biri, hiçbir topluluğun yerel kurumlardan dışlanmayacağına dair kamu garantileri karşılığında aynı yurttaşlık yükümlülüklerini kabul etmektedir."
 ve_rel_evt.102.f:0 "\\"Her söz diğer tarafın hakkı olarak yazıldığında güven mümkün hale geldi.\\""
 ve_rel_evt.102.a:0 "Kompaktın ivmesini kullanın."
 ve_rel_evt.102.a.tt:0 "Dini Yerleşim  #P 2#! artar.\nDini Proje ilerlemesi  #P 20#! artar.\nİlerleme  #Y 100#!'e ulaşırsa projenin normal tamamlama etkisi uygulanır."
 ve_rel_evt.102.b:0 "Garantileri kalıcı yapın."
 ve_rel_evt.102.b.tt:0 "Dini Yerleşim  #P 4#! artar.\n#P %0,5#! nüfusun [SCOPE.sState('ve_evt_target_state').GetName] Sadık olur.\nDini Proje ilerlemesi şu oranda artar: #P 10#!.\nİlerleme #Y 100'e ulaşırsa#!, projenin normal tamamlama etkisi uygulanır."

 ve_rel_evt.150.t:0 "Öğretmenler mi, Müfettişler mi?"
 ve_rel_evt.150.d:0 "Laikleşme Kampanyası [SCOPE.sState('ve_evt_target_state').GetName] okur-yazar personel açığını ortaya çıkardı. Yönetim, uzun vadeli sivil kapasiteyi geliştirecek öğretim kadrosunu genişletebilir veya mevcut kadroyla yeni kuralları uygulayabilecek müfettişlere güvenebilir."
 ve_rel_evt.150.f:0 "\"Bir müfettiş bir okulu bir öğleden sonra kapatabilir. Bir öğretmenin orada öğretilenleri yenisiyle değiştirmesi yıllar alabilir.\""
 ve_rel_evt.150.a:0 "Öğretim kadrosunu genişletin."
 ve_rel_evt.150.a.tt:0 "Harcamak #N 15#! Dindarlık Reformu.\nDini Proje ilerlemesi şu oranda artar: #P 6#!."
 ve_rel_evt.150.b:0 "Mevcut personele uyacak şekilde programı yavaşlatın."
 ve_rel_evt.150.b.tt:0 "Dini Proje ilerlemesi  #N 5#! azalır.\nDini Yerleşim  #P 2#! artar."
 ve_rel_evt.150.c:0 "Halk eğitim ağını devreye alın."
 ve_rel_evt.150.c.tt:0 " #N 10#! Dindarlık Reformu Harcayın.\nDini Proje ilerlemesi  #P 5#! artar.\nDini Yerleşim  #P 1 artar#!."

 ve_rel_evt.151.t:0 "Ele Geçirilen Mülkler"
 ve_rel_evt.151.d:0 "Eski dini mülkler [SCOPE.sState('ve_evt_target_state').GetName] okullara, kliniklere ve sivil ofislere dönüştürülmeye hazır olun. Derhal devredilmesi kampanyaya değerli bir altyapı kazandıracak, ancak tazminatın olmaması Devout için bir toplanma noktası haline geliyor."
 ve_rel_evt.151.f:0 "\\"Anahtarlar bir sabah el değiştirdi. Mülkiyet konusundaki tartışma kilitlerden sonra da varlığını sürdürecek.\\""
 ve_rel_evt.151.a:0 "Tazminatları kademeli olarak ödeyin."
 ve_rel_evt.151.a.tt:0 " #N 15#! Dindarlık Reformu harcayın.\nDini Proje ilerlemesi #P 3#! artar.\nDini Yerleşim  #P 3 artar#!."
 ve_rel_evt.151.b:0 "Gayrimenkullerin acilen kamu hizmetine açılması."
 ve_rel_evt.151.b.tt:0 "Dini Proje ilerlemesi #P 7#!artıyor.\nDini Yerleşim #N 4 azalıyor#!.\n#N Nüfusun %1#!  [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur.\nDindarlar kaybeder #N 1#! Onay #Y 2,5 yıl#!."
 ve_rel_evt.151.c:0 "Onları laik refah kurumlarına aktarın."
 ve_rel_evt.151.c.tt:0 "Harcayın #N 10#! Dindarlık Reformu.\nDini Proje ilerlemesi şu oranda artar: #P 5#!.\nDini Yerleşim nüfusun  #P 2#!.\n#P %0,5#! artıyor [SCOPE.sState('ve_evt_target_state').GetName] Sadık olur."

 ve_rel_evt.152.t:0 "Sivil Dernekler Kök salıyor"
 ve_rel_evt.152.d:0 "Öğretmen çevreleri, yardımlaşma toplulukları ve belediye birlikleri [SCOPE.sState('ve_evt_target_state').GetName] Dini kurumlar aracılığıyla organize edilerek hizmet verilmeye başlandı. Onların işbirliği, Laikleşme Kampanyası'na yalnızca idari bir varlık yerine yerel bir sivil temel kazandırdı."
 ve_rel_evt.152.f:0 "\\"Vatandaşların bir müfettiş beklemeden onu sürdürmeye başlamasıyla yeni düzen ayakta kaldı.\\""
 ve_rel_evt.152.a:0 "Yerel ivmeyi kullanın."
 ve_rel_evt.152.a.tt:0 "Dini Yerleşim  #P 2#! artar.\nDini Proje ilerlemesi  #P 20#! artar.\nİlerleme  #Y 100'e ulaşırsa#!, projenin normal tamamlama etkisi uygulanır."
 ve_rel_evt.152.b:0 "Dernekler kalıcı kurumlara dönüştürülür."
 ve_rel_evt.152.b.tt:0 "Dini Yerleşim #P 4#! artar.\nDini Proje ilerlemesi #P 10#! artar.\nİlerleme şu seviyeye ulaşırsa: #Y 100#!, projenin normal tamamlama etkisi uygulanır."

 ve_cul_evt.40.t:0 "Yerel Okul Kurulları"
 ve_cul_evt.40.d:0 "Okul kurulları [SCOPE.sState('ve_evt_target_state').GetName] yeri konusunda anlaşamıyoruz [SCOPE.sCulture('ve_evt_target_culture').GetName] Halk eğitiminde dil. Yerel dil öğretimi güveni korurken, tek bir idari dil ulusal projenin yönetilmesini kolaylaştıracaktır."
 ve_cul_evt.40.f:0 "\\"İlk ders için seçilen dil genellikle okulun kimin kendisine ait olduğuna karar verir.\\""
 ve_cul_evt.40.a:0 "Yerel dili koruyun."
 ve_cul_evt.40.a.tt:0 "Kültürel Proje ilerlemesi  #N 4#! azalır.\nUlusal Uyum  #P 3#! artar."
 ve_cul_evt.40.b:0 "Tek bir yönetim dili uygulayın."
 ve_cul_evt.40.b.tt:0 "Kültürel Proje ilerlemesi artıyor #P 5#!.\nUlusal Uyum azalıyor #N 2#!.\n#N 0,5#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_cul_evt.40.c:0 "Öğretmen ağını genişletin."
 ve_cul_evt.40.c.tt:0 " #N 10#! Kültürel Talimat harcayın.\nKültürel Proje ilerlemesi  #P 4 artar#!.\nUlusal Uyum  #P 2#! artar."

 ve_cul_evt.41.t:0 "İstatistiksel Sınırlar"
 ve_cul_evt.41.d:0 "Araştırma yapan yetkililer [SCOPE.sState('ve_evt_target_state').GetName] nerede olduğu konusunda anlaşamam [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluk başlar ve biter. Yerel kimlikler dil, bölge ve gelenek açısından örtüşüyor, ancak ulusal proje sayılabilecek ve yönetilebilecek kategoriler talep ediyor."
 ve_cul_evt.41.f:0 "\\"Sayım için çizilen sınır kısa sürede yetkilileri, bütçeleri ve savunucuları ele geçirir.\\""
 ve_cul_evt.41.a:0 "Kendini tanımlamaya yer bırakın."
 ve_cul_evt.41.a.tt:0 "Kültürel Proje ilerlemesi #N 3#! azalır.\nUlusal Uyum #P 3#! artar."
 ve_cul_evt.41.b:0 "Sınırları merkez belirlesin."
 ve_cul_evt.41.b.tt:0 "Kültürel Proje ilerlemesi #P 6#! artar.\nUlusal Uyum  #N 3#! azalır.\n#N %0,5#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_cul_evt.41.c:0 "Standart kayıt sistemini kullanın."
 ve_cul_evt.41.c.tt:0 "Harcama #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi şu oranda artar: #P 5#!.\nUlusal Uyum  #P 1 oranında artıyor#!."

 ve_cul_evt.42.t:0 "Ulusal Proje Kırılma Noktasında"
 ve_cul_evt.42.d:0 "Ulusal proje Türkiye'de [SCOPE.sState('ve_evt_target_state').GetName] çöküşe yaklaşıyor. Radikal hareketler hükümetin ya ihanet ettiğini iddia ediyor [SCOPE.sCulture('ve_evt_target_culture').GetName] Yerel makamlar artık başka bir uzlaşmayı dayatma güvenine sahip değilken, yerel ofisler artık başka bir uzlaşmayı dayatacak güvene sahip değil."
 ve_cul_evt.42.f:0 "\\"Hem zorlama hem de teslim olma nedeniyle saldırıya uğrayan bir yerleşim, kısa sürede bir yerleşim olmaktan çıkabilir.\\""
 ve_cul_evt.42.a:0 "Projeyi sonlandırın."
 ve_cul_evt.42.a.tt:0 "Kültürel Talimat iadesi olmadan Kültür Projesini iptal edin.\nUlusal Uyum #N 5#! azalır.\n #Y 2 yıl boyunca#!: #N -50#! Bürokrasi, #N -25#! Otorite ve #N -%3#! Kanun Çıkarma Başarısı."
 ve_cul_evt.42.b:0 "Acil yerel kaynakları aktarın."
 ve_cul_evt.42.b.tt:0 "Harcama #N 25#! Kültürel Talimat.\nKültürel Proje ilerlemesi #N 5#! azalır.\n#N %1#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal oluyor.\nProje devam ediyor."
 ve_cul_evt.42.c:0 "Minimal bir programla devam edin."
 ve_cul_evt.42.c.tt:0 "Kültürel Proje ilerlemesi #N 10#! azalır.\nUlusal Uyum %10 azalır. #N 2#!.\nProje devam ediyor."
 ve_cul_evt.42.e:0 "Müzakere çerçevesini yeniden oluşturun."
 ve_cul_evt.42.e.tt:0 "Harcama #N 15#! Kültürel Talimat.\nKültürel Proje ilerlemesi #N 3 azalır#!.\nUlusal Uyum  #P 2#! artar.\n#N %0,5#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikalleşiyor.\nProje devam ediyor."

 ve_cul_evt.50.t:0 "Soyadı ve Dil Yönergesi"
 ve_cul_evt.50.d:0 "İlçedeki yetkililer [SCOPE.sState('ve_evt_target_state').GetName] Soyadlarının ve kamu kayıtlarının ulusal dilde standartlaştırılmasını teklif etmek. Direktif şunları yapacaktır: [SCOPE.sCulture('ve_evt_target_culture').GetName] Nüfusun merkezi yönetim tarafından sınıflandırılması daha kolay, ancak aileler özel kimliğin devletin komuta nesnesi haline gelmesinden korkuyor."
 ve_cul_evt.50.f:0 "\\"Kayıt defterinde farklı yazılan bir isim yine de bir ailenin kendisini hatırladığı isim olabilir.\\""
 ve_cul_evt.50.a:0 "Kademeli bir kayıt kampanyası finanse edin."
 ve_cul_evt.50.a.tt:0 " #N 10#! Kültürel Talimat harcayın.\nKültürel Proje ilerlemesi  #P 4#! artar.\nUlusal Uyum  #P 1 artar#!.\n#N %0,5#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_cul_evt.50.b:0 "Tek bir ulusal standardın uygulanması."
 ve_cul_evt.50.b.tt:0 "Kültürel Projenin ilerlemesi şu oranda artar: #P 7#!.\nUlusal Uyum  #N 4#!.\n#N %1#! kadar düşüyor [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_cul_evt.50.c:0 "Direktifin revizyonu için geri çekilmesi."
 ve_cul_evt.50.c.tt:0 "Kültürel Proje ilerlemesi  #N 5#! azaldı.\nUlusal Uyum  #P 3 arttı#!."

 ve_cul_evt.51.t:0 "Askeri Askerlik Kayıtları"
 ve_cul_evt.51.d:0 "Askeri görevliler [SCOPE.sState('ve_evt_target_state').GetName] hizmet yükümlülükleri, soyadları ve komutları için tek bir kayıt talep edin. Bunu uygulamak [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus Etnik Entegrasyon hamlesini güçlendirebilir ancak orduyu kültürel silmenin başka bir aracı olarak gören topluluklar arasında direniş büyüyor."
 ve_cul_evt.51.f:0 "\\"Devlet, vergilerini toplamak veya oğullarını çağırmak istediğinde ilk olarak bir köyün adını öğrenir.\\""
 ve_cul_evt.51.a:0 "Ulusal kayıtları uygulayın."
 ve_cul_evt.51.a.tt:0 "Kültürel Proje ilerlemesi #P 5#! artar.\nUlusal Uyum  #N 2#! azalır.\n#N %0,5#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_cul_evt.51.b:0 "Yerel kayıt uygulamalarını koruyun."
 ve_cul_evt.51.b.tt:0 "Kültürel Proje ilerlemesi azalır #N 3#!.\nUlusal Uyum  #P 3#! artar."
 ve_cul_evt.51.c:0 "Kayıtları askerlik hizmeti yoluyla entegre edin."
 ve_cul_evt.51.c.tt:0 "Harcayın #N 10#! Kültürel Yetki.\nKültürel Proje ilerlemesi şu oranda artar: #P 6#!.\nUlusal Uyum  #P 1#! oranında artıyor.\n#N %0,5#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikalleşiyor."

 ve_cul_evt.100.t:0 "Kurucu Heyet"
 ve_cul_evt.100.d:0 "dan bir heyet [SCOPE.sCulture('ve_evt_target_culture').GetName] topluluk [SCOPE.sState('ve_evt_target_state').GetName] Kurucu Sözleşme kurumlarında temsil edilme talepleriyle geldi. Müzakere projeyi yavaşlatacak ancak meşruiyetini güçlendirecektir; Sermayenin dayattığı bir anlaşma güven pahasına daha hızlı ilerleyebilir."
 ve_cul_evt.100.f:0 "\\"Sözleşme ancak her seçmen yazılmasına yardım ettiği bir maddeyi işaret edebildiğinde yaygınlaşır.\\""
 ve_cul_evt.100.a:0 "Kompakttaki yerlerini müzakere edin."
 ve_cul_evt.100.a.tt:0 "Kültürel Proje ilerlemesi  #N 4#! azalır.\nUlusal Uyum  #P 4#! artar."
 ve_cul_evt.100.b:0 "Merkezi yerleşimi uygulayın."
 ve_cul_evt.100.b.tt:0 "Kültürel Proje ilerlemesi #P 5#! artar.\nUlusal Uyum  #N 2#! azalır.\n#N %0,5#! arasında [SCOPE.sCulture('ve_evt_target_culture').GetName] nüfus [SCOPE.sState('ve_evt_target_state').GetName] Radikal olur."
 ve_cul_evt.100.c:0 "Parlamento koalisyonunu görüşmelere dahil edin."
 ve_cul_evt.100.c.tt:0 "Harcama #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi şu oranda artar: #P 4#!.\nUlusal Uyum  #P 2 oranında artıyor#!."

 ve_cul_evt.101.t:0 "İkili Yönetim"
 ve_cul_evt.101.d:0 "Kurucu Sözleşme [SCOPE.sState('ve_evt_target_state').GetName] artık örtüşen iki yönetime bağlı. Merkezi yetkililer ve temsilciler [SCOPE.sCulture('ve_evt_target_culture').GetName] Ülkenin bürokrasisi tükenmeye yaklaşırken topluluk kayıtları birbirini kopyalıyor, atamalara itiraz ediyor ve çelişkili talimatlar veriyor."
 ve_cul_evt.101.f:0 "\\"İki ofis, bir dosya dolabını paylaşmaktan daha kolay bir şekilde otoriteyi paylaşabilir.\\""
 ve_cul_evt.101.a:0 "Ortak bir idari personeli finanse edin."
 ve_cul_evt.101.a.tt:0 "Harcama #N 15#! Kültürel Talimat.\nKültürel Proje ilerlemesi  #P 6#! artar."
 ve_cul_evt.101.b:0 "Ofisler kabul edene kadar sözleşmeyi yavaşlatın."
 ve_cul_evt.101.b.tt:0 "Kültürel Proje ilerlemesi  #N 6 azalır#!.\nUlusal Uyum  #P 2#! artar."
 ve_cul_evt.101.c:0 "Ofisleri kamu hizmeti kapsamında birleştirin."
 ve_cul_evt.101.c.tt:0 "Harcama #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi  #P 5#! artar.\nUlusal Uyum  #P 2#! artar."

 ve_cul_evt.150.t:0 "İllerdeki Uygulama"
 ve_cul_evt.150.d:0 "İl yönetimleri, ülke çapındaki kültür projesinin çok farklı hızlarda ilerlediğini belirtiyor. Bazı ofisler finansmanlı uygulama komisyonları talep ederken, diğerleri her bölgeye tek bir takvim dayatmanın kıt personeli tüketeceği ve kamunun güvenini zayıflatacağı konusunda uyarıyor."
 ve_cul_evt.150.f:0 "\\"Ulusal kararname bir kez yazılır ama ülkenin her ofisinde uygulanması gerekir.\\""
 ve_cul_evt.150.a:0 "Uygulama komisyonlarını finanse edin."
 ve_cul_evt.150.a.tt:0 "Harcayın #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi #P 5#! artar."
 ve_cul_evt.150.b:0 "Kademeli bir zaman çizelgesi kullanın."
 ve_cul_evt.150.b.tt:0 "Kültürel Proje ilerlemesi #N 4 azalır#!.\nUlusal Uyum  #P 2#! artar."
 ve_cul_evt.150.c:0 "Mevcut yönetimi standartlaştırın."
 ve_cul_evt.150.c.tt:0 "Harcama #N 5#! Kültürel Yetki.\nKültürel Proje ilerlemesi #P 3#! artar.\nUlusal Uyum  #P 2#! artar."

 ve_cul_evt.151.t:0 "Öğretim Dili"
 ve_cul_evt.151.d:0 "Ulusal Müfredat ortak bir eğitim dili gerektirir, ancak ülke genelindeki okullar çok farklı dil geleneklerine sahip topluluklara hizmet vermektedir. Çok dilli materyaller güveni korur ancak dağıtımı geciktirir; tek bir müfredat, eğitimi kültürel bir yarışmaya dönüştürme riskiyle karşı karşıya kalarak sınıflara hızlı bir şekilde ulaşabilir."
 ve_cul_evt.151.f:0 "\\"Öğrencinin güvenmediği bir dilde öğretilen bir ders, konusu dışındaki her şeyle hatırlanabilir.\\""
 ve_cul_evt.151.a:0 "Çok dilli materyalleri finanse edin."
 ve_cul_evt.151.a.tt:0 "Harcayın #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi #P 3#! artar.\nUlusal Uyum artar by #P 3#!."
 ve_cul_evt.151.b:0 "Tek bir ulusal müfredat uygulayın."
 ve_cul_evt.151.b.tt:0 "Kültürel Projenin ilerlemesi  #P 6#! artar.\nUlusal Uyum  #N 3#! azalır."
 ve_cul_evt.151.c:0 "Öğretme ve refah ağlarını birleştirin."
 ve_cul_evt.151.c.tt:0 " #N 10#! Kültürel Talimat harcayın.\nKültürel Proje ilerlemesi  #P 5#! artar.\nUlusal Uyum  #P 2 artar#!."

 ve_cul_evt.160.t:0 "Ulusu Kim Temsil Ediyor?"
 ve_cul_evt.160.d:0 "Paylaşılan Semboller projesi, kimin tarihinin, üniformalarının, anıtlarının ve törenlerinin tüm ülke için geçerli olabileceği sorusunu yeniden gündeme getirdi. Geleneklerin dönüşümlü olması tanınmayı genişletir ancak anlaşmayı yavaşlatır; tek bir resmi anlatımın seçilmesi, birçok vatandaşın dışarıda bırakılmasını sağlarken netlik sağlayacaktır."
 ve_cul_evt.160.f:0 "\\"Bir sembol, ancak vatandaşlar bir açıklamaya ihtiyaç duymadan kendilerini onun içinde gördüklerinde ulusal hale gelir.\\""
 ve_cul_evt.160.a:0 "Kamu kullanımında sembolleri dönüşümlü kullanın."
 ve_cul_evt.160.a.tt:0 "Kültürel Proje ilerlemesi #N 3#! azalır.\nUlusal Uyum #P 4#! artar."
 ve_cul_evt.160.b:0 "Bir resmi anlatı seçin."
 ve_cul_evt.160.b.tt:0 "Kültürel Proje ilerlemesi şu kadar artar: #P 6#!.\nUlusal Uyum  #N 3#! azalır."
 ve_cul_evt.160.c:0 "Ortak bir halka açık tören tasarlayın."
 ve_cul_evt.160.c.tt:0 "Harcama #N 10#! Kültürel Talimat.\nKültürel Proje ilerlemesi  #P 4#! artar.\nUlusal Uyum  #P 2#! artar."
