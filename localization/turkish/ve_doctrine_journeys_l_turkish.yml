 ve_je_doctrine_journey_professional_army:0 "Genelkurmay'da Reform"
 ve_je_doctrine_journey_professional_army_reason:0 "Profesyonel bir subay birliği kışla ve komisyonlardan daha fazlasını gerektirir. Eğitim, planlama ve seferberlik, dayanıklı tek bir personel sistemi halinde organize edilmelidir."
