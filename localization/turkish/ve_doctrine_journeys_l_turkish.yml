 ve_doctrine_journey_general_staff_reform_mdf:0 "Kurumsal Genelkurmay"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Kurmay okulları, seferberlik tabloları ve ortak eğitim standartları Silahlı Kuvvetler'in kalıcı bir parçası hâline gelmiştir."

 ve_doctrine_journey.1.t:0 "Fabrika Düzenini Standartlaştırmak"
 ve_doctrine_journey.1.d:0 "Sanayi birlikleri; makineleri, teftişleri ve imalat pratiklerini uyumlu hâle getirmek için ulusal bir çaba öneriyor. Bu girişim beş yıl sürecek ve sürekli bir sanayi ölçeği ile idari istikrar talep edecektir."
 ve_doctrine_journey.1.a:0 "Standartlaştırma çabasını başlat."
 ve_doctrine_journey.1.b:0 "Teklifi beş yıl içinde yeniden değerlendir."
 ve_doctrine_journey.1.c:0 "Fabrikalarımızın ulusal bir doktrine ihtiyacı yok."
 ve_doctrine_journey.2.t:0 "Bir Âlimler Cumhuriyeti"
 ve_doctrine_journey.2.d:0 "Rektörler ve ilim cemiyetleri, üniversiteleri kalıcı bir ulusal araştırma topluluğu halinde birbirine bağlamak için beş yıllık bir çaba öneriyor. Başarısı hem akademik kapasiteye hem de okuryazarlığın yayılmasına bağlı olacaktır."
 ve_doctrine_journey.2.a:0 "Âlimler cumhuriyetine sponsor ol."
 ve_doctrine_journey.2.b:0 "Teklife beş yıl sonra dön."
 ve_doctrine_journey.2.c:0 "Öğrenim yerel olarak organize edilmiş kalmalıdır."
 ve_doctrine_journey.3.t:0 "Genelkurmayı Yeniden Düzenlemek"
 ve_doctrine_journey.3.d:0 "Kıdemli subaylar eğitim, planlama ve seferberlik hususunda beş yıllık bir reform öneriyor. Genelkurmay, profesyonel doktrinin imtiyazlı komutanlardan oluşan bir dairenin ötesinde yaşayabileceğini kanıtlamak zorunda kalacaktır."
 ve_doctrine_journey.3.a:0 "Genelkurmay reformunu emret."
 ve_doctrine_journey.3.b:0 "Planları beş yıl sonra tekrar gözden geçir."
 ve_doctrine_journey.3.c:0 "Mevcut komuta sistemi yeterlidir."

 ve_doctrine_journey_start_tt:0 "Bu beş yıllık Doktrin Yolculuğu'nu başlatır. Aynı anda yalnızca bir Doktrin Yolculuğu aktif olabilir."
 ve_doctrine_journey_defer_tt:0 "Bu grubun teklifini #Y 5 yıl#! erteler. Sonrasında yeniden teklif edilebilir."
 ve_doctrine_journey_decline_tt:0 "Bu grubun Doktrin Yolculuğu'nu kalıcı olarak reddeder."

 ve_doctrine_journey.10.t:0 "Ölçüler ve Toleranslar"
 ve_doctrine_journey.10.d:0 "Fabrikalar birbiriyle uyumsuz ölçüleri, bağlantıları ve toleransları kullanmaktadır. Mühendislerin devlete tek bir katalog dayatması yönündeki baskısına karşılık taşra üreticileri, katı bir standardın yararlı yerel uygulamaları dondurabileceği konusunda uyarmaktadır."
 ve_doctrine_journey.10.a:0 "Ulusal bir standartlar kataloğunu finanse edin."
 ve_doctrine_journey.10.a.tt:0 "#N 15#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."
 ve_doctrine_journey.10.b:0 "Uyumlu bölgesel standartlara izin verin."
 ve_doctrine_journey.10.b.tt:0 "Seyahat, ani bir kaynak veya ilerleme değişimi olmaksızın devam eder."
 ve_doctrine_journey.10.c:0 "Benimsenmeyi koordine etmek için inşaat ofislerini kullanın."
 ve_doctrine_journey.10.c.tt:0 "Sanayici Fikir V gerektirir.\n#N 10#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."
 ve_doctrine_journey.11.t:0 "Ulusal Teftiş Kurulu"
 ve_doctrine_journey.11.d:0 "İlk ortak standartlar artık uygulama gerektirmektedir. Yetkililer merkezi bir teftiş kurulu önerirken, üreticiler öz belgelendirmeyi tercih etmekte ve deneyimli sanayi planlamacıları her ikisinin de denetlenmesini savunmaktadır."
 ve_doctrine_journey.11.a:0 "Merkezi bir sanayi teftiş kurulu kurun."
 ve_doctrine_journey.11.a.tt:0 "#N 15#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."
 ve_doctrine_journey.11.b:0 "Sanayi öz belgelendirmesini tanıyın."
 ve_doctrine_journey.11.b.tt:0 "Seyahat, ani bir kaynak veya ilerleme değişimi olmaksızın devam eder."
 ve_doctrine_journey.11.c:0 "Müfettişleri ve üreticileri tek bir sistem üzerinden denetleyin."
 ve_doctrine_journey.11.c.tt:0 "Sanayici Fikir VII gerektirir.\n#N 10#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."

 ve_doctrine_journey.20.t:0 "Açık Kürsüler"
 ve_doctrine_journey.20.d:0 "Üniversiteler yeni kürsülerin yerel fakültelere mi, ulusal önceliklere mi yoksa kamusal bir ders verme direktifine mi karşı sorumlu olması gerektiği konusunda anlaşmazlık içindedir. İlk atamalar, akademik ağın insan ve fikir alışverişini ne kadar özgürce gerçekleştireceğini belirleyecektir."
 ve_doctrine_journey.20.a:0 "Koordineli bir ulusal kürsü programını finanse edin."
 ve_doctrine_journey.20.a.tt:0 "#N 15#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."
 ve_doctrine_journey.20.b:0 "Her fakültenin kendi kürsülerini belirlemesine izin verin."
 ve_doctrine_journey.20.b.tt:0 "Seyahat, ani bir kaynak veya ilerleme değişimi olmaksızın devam eder."
 ve_doctrine_journey.20.c:0 "Kürsüleri kamusal bir konferans ağına bağlayın."
 ve_doctrine_journey.20.c.tt:0 "Akademik Fikir V gerektirir.\n#N 10#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."
 ve_doctrine_journey.21.t:0 "Hakemler Cumhuriyeti"
 ve_doctrine_journey.21.d:0 "Araştırmalar artık kurumlar arasında eski himaye sisteminin değerlendirebileceğinden daha hızlı ilerlemektedir. Bilginler ulusal akran değerlendirmesi önerirken, köklü akademiler seçici davetleri ve disipliner bağımsızlığı savunmaktadır."
 ve_doctrine_journey.21.a:0 "Ulusal bir akran değerlendirme hizmetini finanse edin."
 ve_doctrine_journey.21.a.tt:0 "#N 15#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."
 ve_doctrine_journey.21.b:0 "Değerlendirmeyi bilumum ilim cemiyetlerine bırakın."
 ve_doctrine_journey.21.b.tt:0 "Seyahat, ani bir kaynak veya ilerleme değişimi olmaksızın devam eder."
 ve_doctrine_journey.21.c:0 "Disiplinler arası değerlendirme meclisleri toplayın."
 ve_doctrine_journey.21.c.tt:0 "Akademik Fikir VII gerektirir.\n#N 10#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."

 ve_doctrine_journey.30.t:0 "Kurmay Koleji"
 ve_doctrine_journey.30.d:0 "Yeni kurmay koleji, bir subayı komuta elverişli kılan şeyin ne olduğuna karar vermelidir. Reformcular sınavlar ve ortak eğitim talep ederken, köklü komutanlar kıdemi ve saha hizmetinde edinilen muhakemeyi savunmaktadır."
 ve_doctrine_journey.30.a:0 "Ulusal sınavları ve ortak müfredatı finanse edin."
 ve_doctrine_journey.30.a.tt:0 "#N 15#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."
 ve_doctrine_journey.30.b:0 "Kıdem ile kolejin tavsiyelerini dengeleyin."
 ve_doctrine_journey.30.b.tt:0 "Seyahat, ani bir kaynak veya ilerleme değişimi olmaksızın devam eder."
 ve_doctrine_journey.30.c:0 "Saha subaylarını kurmay dersliklerinde görevlendirerek döndürün."
 ve_doctrine_journey.30.c.tt:0 "Profesyonel Ordu Fikir V gerektirir.\n#N 10#! Ulusal Kavrayış harcanır.\nSeyahat ilerlemesi #P 4#! artar."
 ve_doctrine_journey.31.t:0 "Seferberlik Tabloları"
 ve_doctrine_journey.31.d:0 "Planlamacılar; askerler, ikmal unsurları ve demiryolu taşımacılığı için birbiriyle yarışan programlar hazırladı. Tek bir ulusal tablo eş güdüm vaat ediyor, ancak bölgesel komutanlıklar katı zaman çizelgelerinin yerel kapasiteyi göz ardı edeceği konusunda uyarıda bulunuyor."
 ve_doctrine_journey.31.a:0 "Merkezi bir seferberlik bürosunu finanse et."
 ve_doctrine_journey.31.a.tt:0 "#N 15#! Ulusal Kavrayış harcanır.\nSeyahat İlerlemesi #P 4#! artar."
 ve_doctrine_journey.31.b:0 "Bölgesel komutanlıkların uyumlu programları sürdürmesine izin ver."
 ve_doctrine_journey.31.b.tt:0 "Seyahat, ani bir kaynak veya ilerleme değişikliği olmaksızın devam eder."
 ve_doctrine_journey.31.c:0 "Demiryolu, depo ve komuta planlamasını entegre et."
 ve_doctrine_journey.31.c.tt:0 "Profesyonel Ordu Fikri VII gerektirir.\n#N 10#! Ulusal Kavrayış harcanır.\nSeyahat İlerlemesi #P 4#! artar."
