 ve_je_doctrine_journey_professional_army:0 "Genelkurmayı Yeniden Düzenlemek"
 ve_je_doctrine_journey_professional_army_reason:0 "Profesyonel bir subay kadrosu kışlalardan ve berat bulmaktan fazlasını gerektirir. Eğitim, planlama ve seferberlik tek bir kalıcı kurmay sistemi altında organize edilmelidir."
