 ve_je_doctrine_journey_industrialist:0 "Fabrika Düzenini Standartlaştırmak"
 ve_je_doctrine_journey_industrialist_reason:0 "Endüstriyel doktrin münferit fabrikaların ötesine yayıldı. İmalatçılar, müfettişler ve yöneticiler artık yerel uygulamaları kalıcı bir ulusal sisteme dönüştürmelidir."
