 ve_je_doctrine_journey_industrialist:0 "Fabrika Sisteminin Standartlaştırılması"
 ve_je_doctrine_journey_industrialist_reason:0 "Endüstriyel doktrin bireysel fabrikaların ötesine yayıldı. Üreticiler, müfettişler ve yöneticiler artık yerel uygulamaları dayanıklı bir ulusal sisteme dönüştürmelidir."
 ve_je_doctrine_journey_industrialist_status_both:0 "İlerleme: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nKalan süre: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] ay#!\nAylık ilerleme: #P +2#!\n\n#P Üretim ölçeği karşılandı#!: en azından #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! Üretim binası seviyeleri.\n#P İstikrarlı yönetim karşılandı#!: olumsuz olmayan Bürokrasi, yaklaşan kıtlık yok ve %15'ten az ülke Kargaşası.\n\nBaşarı ödülü: #P +40 Ulusal Fikir#!. İlerleme 60 ay içinde 60'a ulaşmazsa Yolculuk ödül olmadan sona erer."
