 ve_doctrine_journey_general_staff_reform_mdf:0 "Kurumsal Genelkurmay"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Personel okulları, seferberlik tabloları ve ortak eğitim standartları silahlı kuvvetlerin dayanıklı bir parçası haline gelmiştir."

 ve_doctrine_journey.1.t:0 "Fabrika Sisteminin Standartlaştırılması"
 ve_doctrine_journey.1.d:0 "Sanayi birlikleri, makineleri, denetimleri ve üretim uygulamalarını uyumlu hale getirmek için ulusal bir çaba önermektedir. Girişim beş yıl sürecek ve sürdürülebilir endüstriyel ölçek ve idari istikrar talep edecek."
 ve_doctrine_journey.1.a:0 "Standartlaştırma çabalarına başlayın."
 ve_doctrine_journey.1.b:0 "Teklifi beş yıl içinde yeniden değerlendirin."
 ve_doctrine_journey.1.c:0 "Fabrikalarımızın ulusal bir doktrine ihtiyacı yok."
 ve_doctrine_journey.2.t:0 "Akademisyenler Cumhuriyeti"
 ve_doctrine_journey.2.d:0 "Rektörler ve bilgin topluluklar, üniversiteleri dayanıklı bir ulusal araştırma topluluğuna bağlamak için beş yıllık bir çaba önermektedir. Başarısı hem akademik kapasiteye hem de okuryazarlığın yaygınlaşmasına bağlı olacaktır."
 ve_doctrine_journey.2.a:0 "Bilim adamları cumhuriyetine sponsor olun."
 ve_doctrine_journey.2.b:0 "Beş yıl içinde teklife geri dönün."
 ve_doctrine_journey.2.c:0 "Öğrenim yerel olarak organize edilmeli."
 ve_doctrine_journey.3.t:0 "Genelkurmay'da reform yapılması"
 ve_doctrine_journey.3.d:0 "Üst düzey subaylar, eğitim, planlama ve seferberlik konusunda beş yıllık bir reform öneriyor. Genelkurmay, profesyonel doktrinin ayrıcalıklı komutanlar çevresinin ötesinde de ayakta kalabileceğini kanıtlamak zorunda kalacak."
 ve_doctrine_journey.3.a:0 "Genelkurmay reformunu devreye alın."
 ve_doctrine_journey.3.b:0 "Planları beş yıl içinde yeniden gözden geçirin."
 ve_doctrine_journey.3.c:0 "Mevcut komuta sistemi yeterlidir."

 ve_doctrine_journey_start_tt:0 "Bu beş yıllık Doktrin Yolculuğunu başlatır. Aynı anda yalnızca bir Doktrin Yolculuğu etkin olabilir."
 ve_doctrine_journey_defer_tt:0 "Bu grubun teklifini #Y 5 yıl#! erteler. Daha sonra tekrar teklif edilebilir."
 ve_doctrine_journey_decline_tt:0 "Bu grubun Doktrin Yolculuğunu kalıcı olarak reddeder."

 ve_doctrine_journey.10.t:0 "Ölçüler ve Toleranslar"
 ve_doctrine_journey.10.d:0 "Fabrikalar uyumsuz ölçüler, bağlantı parçaları ve toleranslar kullanır. Mühendisler devleti tek bir katalog uygulamaya çağırırken, eyaletteki üreticiler katı bir standardın yararlı yerel uygulamaları dondurabileceği konusunda uyarıyorlar."
 ve_doctrine_journey.10.a:0 "Ulusal bir standartlar kataloğuna fon sağlayın."
 ve_doctrine_journey.10.a.tt:0 "Harcayın #N 15#! National Insight.\nYolculuk ilerlemesi #P 4#! artar."
 ve_doctrine_journey.10.b:0 "Uyumlu bölgesel standartlara izin verin."
 ve_doctrine_journey.10.b.tt:0 "Yolculuk acil bir kaynak veya ilerleme değişikliği olmadan devam eder."
 ve_doctrine_journey.10.c:0 "Evlat edinmeyi koordine etmek için inşaat ofislerini kullanın."
 ve_doctrine_journey.10.c.tt:0 "Sanayici Fikri V gerektirir.\n #N 10#! Ulusal Insight harcayın.\nYolculuk ilerlemesi #P 4#! artar."
 ve_doctrine_journey.11.t:0 "Ulusal Müfettişlik"
 ve_doctrine_journey.11.d:0 "İlk ortak standartların artık uygulanması gerekiyor. Yetkililer merkezi bir denetim yapılmasını öneriyor, üreticiler kendi kendilerini sertifikalandırmayı tercih ediyor ve deneyimli endüstriyel planlamacılar her ikisinin de denetlenmesini savunuyor."
 ve_doctrine_journey.11.a:0 "Merkezi bir sanayi müfettişliği kurun."
 ve_doctrine_journey.11.a.tt:0 "Harcama #N 15#! National Insight.\nYolculuk ilerlemesi #P 4#! artar."
 ve_doctrine_journey.11.b:0 "Sektörün kendi kendine sertifikasyonunu tanıyın."
 ve_doctrine_journey.11.b.tt:0 "Yolculuk, acil bir kaynak veya ilerleme değişikliği olmadan devam eder."
 ve_doctrine_journey.11.c:0 "Müfettişleri ve üreticileri tek bir sistem üzerinden denetleyin."
 ve_doctrine_journey.11.c.tt:0 "Sanayici Fikri VII gerektirir.\nHarcama #N 10#! National Insight.\nYolculuk ilerlemesi #P 4#! artar."

 ve_doctrine_journey.20.t:0 "Açık Sandalyeler"
 ve_doctrine_journey.20.d:0 "Üniversiteler, yeni kürsülerin yerel fakültelere mi, ulusal önceliklere mi yoksa kamu öğretim talimatına mı cevap vermesi gerektiği konusunda anlaşamıyorlar. İlk randevular, bilimsel ağın ne kadar özgürce insan ve fikir alışverişinde bulunacağını tanımlayacak."
 ve_doctrine_journey.20.a:0 "Koordineli bir ulusal başkanlık programını finanse edin."
 ve_doctrine_journey.20.a.tt:0 "Harcamak #N 15#! Ulusal Bilgi.\nYolculuk ilerlemesi şu oranda artar: #P 4#!."
 ve_doctrine_journey.20.b:0 "Her fakültenin kendi sandalyelerini tanımlamasına izin verin."
 ve_doctrine_journey.20.b.tt:0 "Yolculuk acil bir kaynak veya ilerleme değişikliği olmadan devam eder."
 ve_doctrine_journey.20.c:0 "Sandalyeleri halka açık bir ders ağına bağlayın."
 ve_doctrine_journey.20.c.tt:0 "Akademik Fikir V gerektirir.\nHarcayın #N 10#! Ulusal Fikir.\nYolculuk ilerlemesi #P 4#!arar."
 ve_doctrine_journey.21.t:0 "Hakem Cumhuriyeti"
 ve_doctrine_journey.21.d:0 "Araştırma artık kurumlar arasında eski patronajın tahmin edebileceğinden daha hızlı hareket ediyor. Akademisyenler ulusal akran değerlendirmesi önerirken, yerleşik akademiler seçici daveti ve disiplin bağımsızlığını savunur."
 ve_doctrine_journey.21.a:0 "Ulusal bir hakemlik hizmetini finanse edin."
 ve_doctrine_journey.21.a.tt:0 "Ulusal Fikiryü harcayın. #N 15#! Ulusal Fikir.\nYolculuk ilerlemesi #P 4#! artar."
 ve_doctrine_journey.21.b:0 "İncelemeyi bilgili topluluklara bırakın."
 ve_doctrine_journey.21.b.tt:0 "Yolculuk acil bir kaynak veya ilerleme değişikliği olmadan devam eder."
 ve_doctrine_journey.21.c:0 "Disiplinler arası inceleme konseyleri toplayın."
 ve_doctrine_journey.21.c.tt:0 "Akademik Fikir VII gerektirir.\nHarcama #N 10#! National Insight.\nYolculuk ilerlemesi #P 4#! artar."

 ve_doctrine_journey.30.t:0 "Personel Koleji"
 ve_doctrine_journey.30.d:0 "Yeni personel koleji, bir subayı komuta için neyin uygun kılacağına karar vermelidir. Reformcular sınavlar ve ortak eğitim talep ederken yerleşik komutanlar kıdemi ve saha hizmetinde kazanılan muhakemeyi savunurlar."
 ve_doctrine_journey.30.a:0 "Ulusal sınavlara ve ortak bir müfredata fon sağlayın."
 ve_doctrine_journey.30.a.tt:0 "Harcamak #N 15#! Ulusal Bilgi.\nYolculuk ilerlemesi şu oranda artar: #P 4#!."
 ve_doctrine_journey.30.b:0 "Kıdem ile üniversitenin tavsiyelerini dengeleyin."
 ve_doctrine_journey.30.b.tt:0 "Yolculuk, acil bir kaynak veya ilerleme değişikliği olmadan devam eder."
 ve_doctrine_journey.30.c:0 "Saha subaylarını personel sınıfları arasında dönüşümlü olarak kullanın."
 ve_doctrine_journey.30.c.tt:0 "Profesyonel Ordu Fikri V gerektirir.\n #N 10#! Ulusal Fikir harcayın.\nYolculuk ilerlemesi #P 4#! artar."
 ve_doctrine_journey.31.t:0 "Seferberlik Tabloları"
 ve_doctrine_journey.31.d:0 "Planlamacılar erkekler, malzeme ve demiryolu taşımacılığı için birbiriyle yarışan programlar hazırladılar. Tek bir ulusal tablo koordinasyon vaat ediyor, ancak bölgesel komutanlıklar katı zaman çizelgelerinin yerel kapasiteyi göz ardı edeceği konusunda uyarıyor."
 ve_doctrine_journey.31.a:0 "Merkezi bir seferberlik bürosunu finanse edin."
 ve_doctrine_journey.31.a.tt:0 "Harcama yapın #N 15#! Ulusal Bilgi.\nYolculuk ilerlemesi #P 4#! artar."
 ve_doctrine_journey.31.b:0 "Bölgesel komutanlıkların uyumlu programları sürdürmesine izin verin."
 ve_doctrine_journey.31.b.tt:0 "Yolculuk, acil bir kaynak veya ilerleme değişikliği olmadan devam eder."
 ve_doctrine_journey.31.c:0 "Demiryolu, depo ve komuta planlamasını entegre edin."
 ve_doctrine_journey.31.c.tt:0 "Profesyonel Ordu Fikir VII gerektirir.\nHarcama #N 10#! Ulusal Bilgi.\nYolculuk ilerlemesi #P 4#! artar."
