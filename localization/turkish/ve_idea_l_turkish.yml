 reformist_idea_5_system_tt:0 "#P +1 Dindarlık Reformu/ay#! Vicdan Özgürlüğü veya Tam Ayrılık ve #P +1 Kültürel Görev/ay#! Sivil Ulus veya Bileşik Devlet alanında."
