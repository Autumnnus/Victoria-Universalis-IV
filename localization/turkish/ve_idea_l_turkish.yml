 ve_idea_era_momentum_age_1_tt:0 "#P 1 Yaşında: +1 Era Momentum/ay#! bu IV. Seviye Fikir Grubundan. Fikir Grubu katkısı sınırlıdır #Y +2#!."
 ve_idea_era_momentum_age_2_tt:0 "#P 2 Yaşında: +1 Çağ Hızı/ay#! bu IV. Seviye Fikir Grubundan. Fikir Grubu katkısı sınırlıdır #Y +2#!."
