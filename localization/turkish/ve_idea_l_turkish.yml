 ve_national_insight_tt:0 "#header Ulusal Kavrayış#!\nStok: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nBu ay: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nSatın alma durumu: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Ne işe yarar?#!\nUlusal Kavrayış, benimsenmiş Fikir Gruplarının içindeki fikirleri satın alır. Etkin olan her satın alım Ulusal Fikirleri ilerletir ve mevcut Doktrin Yatırımına eklenir; yatırım eşiğine ulaşmak kalıcı grup kapasitesi kazandırır.\n\n#title Aylık gelir neden değişiyor?#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nOkuryazarlık: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nOkullar: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nÜniversiteler: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nİdare: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nAydınlar: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nBorç, karışıklık ve uygulama: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Stok baskısı#!\nGelir çarpanı: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nGelir #Y 750#! değerinde yarıya, #Y 900#! değerinde dörtte bire düşer ve #Y 1000#! değerinde durur. Sınıra ulaşmadan harcamak gelir kaybını önler."
 ve_national_insight_implementation_strain:0 "Doktrin Uygulama Yükü"
 ve_national_insight_implementation_strain_desc:0 "İdare, yeni benimsenen ulusal doktrine kurumları ve yöntemleri uyarlıyor. Bu 24 aylık uygulama dönemi bitene kadar başka bir grup fikri benimsenemez."
 idea_points_cus_loc_1:0 "#tooltippable_concept Monthly Idea Points: \n#Y Base: #P +13 \n#Y +0% Literacy: #P +1 \n#lore +25% Literacy: +2 \n +50% Literacy: +3 \n+75% Literacy: +4 "
