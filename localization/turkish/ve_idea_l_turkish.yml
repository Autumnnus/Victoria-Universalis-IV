 embrace_idea_tt:0 "#header Fikir Grubu Kapasitesi#!\nKullanılan yuva: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nŞu an boş yuva: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nMevcut Doktrin Yatırımı: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! etkin satın alınmış fikir\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Kapasite nasıl işler?#!\nEtkin olan her satın alınmış grup fikri #P +1#! Doktrin Yatırımı sağlar. #Y 4, 8, 13, 19, 26#! veya #Y 34#! eşiğine ulaşmak kalıcı olarak bir grup yuvası ekler. 5–6. yuvalar ayrıca 2. Çağı, 7. yuva 3. Çağı gerektirir.\n\n#title Benimseme ve iptal#!\nGrup benimsemek Kavrayış harcamaz fakat bir boş yuva kaplar. İptal; yuvayı boşaltır, grubun değiştiricilerini kaldırır ve mevcut Doktrin Yatırımını düşürür. Harcanan Kavrayış iade edilmez; daha önce kazanılmış kapasite yuvası kalıcı olarak korunur."
 ve_idea_capacity_player_progress:0 "#title Sıradaki kalıcı yuva#!\nYuva: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! satın alınmış fikir\nEksik: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
