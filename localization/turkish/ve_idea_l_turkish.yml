 ve_idea_capacity_country_age_2:0 "#title Sonraki kalıcı yuva#!\nYuva: #Y 5#!\nİlerleme: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! satın alınmış fikir\nHâlâ gereken: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nÇağ gereksinimi: #N Çağ 2 bekleniyor#!"
 ve_idea_capacity_country_age_3:0 "#title Sonraki kalıcı yuva#!\nYuva: #Y 7#!\nİlerleme: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! satın alınmış fikir\nHâlâ gereken: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nÇağ gereksinimi: #N Çağ 3 bekleniyor#!"
