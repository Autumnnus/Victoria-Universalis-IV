 ve_boost_idea:0 "Fikri Geliştir"
 ve_boost_idea_tt:0 "#header Sonraki Fikri Benimse#!\nUlusal Kavrayış: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nSatın alma durumu: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Sonraki seviyenin maliyeti#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nBu gruptaki sıradaki boş seviyeye karşılık gelen maliyet kullanılır.\n\n#title Satın alındığında ne olur?#!\n#P Bu gruptaki sıradaki değiştirici etkinleşir.#!\n#P Doktrin Yatırımı ve Ulusal Fikir ilerlemesi 1'er artar.#!\n#N 24 aylık Doktrin Uygulama dönemi başlar; bu sürede başka grup fikri alınamaz.#!\n\n#title Düğme neden kapalı olabilir?#!\nKavrayış sıradaki seviyenin maliyetinden düşüktür; Doktrin Uygulaması sürüyordur; grup tamamlanmıştır veya sıradaki seviye Çağ şartıyla kilitlidir.\n\nBu grubu iptal etmek fikir değiştiricilerini ve mevcut ilerlemesini kaldırır. Harcanan Kavrayış asla iade edilmez; fakat bir eşikten daha önce kazanılmış grup yuvası geri alınmaz."
