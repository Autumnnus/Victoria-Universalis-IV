 ve_national_ideas:0 " Ulusal Fikirler"
 ve_idea_points:0 "#tooltippable_name Ulusal Kavrayış"
 ve_national_insight_tt:0 "#header Ulusal Kavrayış#!\nStok: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nBu ay: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nSatın alım durumu: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Ne İşe Yarar#!\nUlusal Kavrayış, benimsenmiş bir Fikir Grubu içindeki bireysel fikirleri satın alır. Her aktif satın alım, Ulusal Fikirleri ilerletir ve mevcut Doktrin Yatırımını artırır; bir yatırım dönüm noktasına ulaşmak kalıcı olarak grup kapasitesi kazandırır.\n\n#title Aylık Gelir Neden Değişiyor#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nOkuryazarlık: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nOkullar: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nÜniversiteler: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nİdare: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nEntelijensiya: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nBorç, kargaşa ve uygulama: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Stok Baskısı#!\nGelir çarpanı: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nGelir #Y 750#! değerinde yarıya düşer, #Y 900#! değerinde çeyreğe düşer ve #Y 1000#! değerinde durur. Stok sınırından önce harcama yapmak boşa giden geliri önler."
 ve_national_insight_implementation_strain:0 "Doktrin Uygulama Yükü"
 ve_national_insight_implementation_strain_desc:0 "Hükümet, kurumları ve usulleri yeni benimsenen bir ulusal doktrine uyarlamaktadır. Bu 24 aylık uygulama döngüsü sona erene kadar başka bir grup fikri benimsterilemez."
 ve_total_ideas:0 "Fikir Grupları"
 ve_traditions:0 "#tooltippable_concept Gelenekler: "
 ve_bonus:0 "#tooltippable_concept Bonus: "
 ve_ambition:0 "Nihai Hedef"
 ve_ambition_tooltip:0 "#Y Nihai Hedef#!\n#P Kalıcı zirve ödülü#!\nBu gruptaki yedi fikrin tümü benimsendiğinde otomatik olarak açılır."
 ve_idea_cancel_warning:0 "#header [StateRegion.MakeScope.Var('idea_group')] İptal Edilsin mi?#!\n\n#N Bu gruptaki her aktif fikir etkeni kaldırılacaktır.#!\n#N Açılmışsa Nihai Hedef etkeni de kaldırılacaktır.#!\n\nHarcanan Ulusal Kavrayış iade edilmez.\nİade edilen Ulusal Kavrayış: #Y 0#!\n\n#title Kaldırılacak Etkiler#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Onayla: bu fikir grubunu iptal et.#! İlerleme ve etkenler kaybedilir, Ulusal Kavrayış iade edilmez."
 ve_idea_cancel_keep_tt:0 "Bu fikir grubunu koru - iptal etme."
 ve_embrace:0 "Benimse"
 ve_idea_locked:0 "Yol Kapalı"
 ve_idea_locked_tt:0 "#N Bu fikir grubu, halihazırda benimsemiş olduğunuz ile karşılıklı olarak dışlayıcıdır. Bu yolu açmak için o grubu iptal edin."
 ve_idea_age_locked:0 "Teknoloji Gerekli"
 ve_idea_age_locked_tt:0 "#N Bu fikir grubu, henüz araştırılmamış bir teknoloji gerektirir."
 ve_idea_labour_technology_locked_tt:0 "#N [GetTechnology('labor_movement').GetName] gerektirir.#!"
 ve_idea_welfare_technology_locked_tt:0 "#N [GetTechnology('human_rights').GetName] gerektirir.#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N [GetTechnology('nationalism').GetName] gerektirir.#!"
 ve_idea_reformist_technology_locked_tt:0 "#N [GetTechnology('egalitarianism').GetName] gerektirir.#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N [GetTechnology('enlistment_offices').GetName] gerektirir.#!"
 ve_idea_colonial_technology_locked_tt:0 "#N [GetTechnology('quinine').GetName] gerektirir.#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N [GetTechnology('war_propaganda').GetName] gerektirir.#!"
 ve_boost_idea:0 "Fikri Güçlendir"
 ve_boost_idea_tt:0 "#header Sonraki Fikri Benimse#!\nUlusal Kavrayış: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nSatın alım durumu: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Sonraki seviyenin maliyeti#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nBu gruptaki henüz doldurulmamış sonraki seviyeye denk gelen maliyeti kullanın.\n\n#title Satın alındığında ne olur#!\n#P Bu gruptaki sonraki etken etkinleşir.#!\n#P Doktrin Yatırımı ve Ulusal Fikir ilerlemesi birer artar.#!\n#N 24 aylık bir Doktrin Uygulama döngüsü başlar. Bu süre zarfında başka bir grup fikri satın alınamaz.#!\n\n#title Düğme neden devre dışı kalabilir?#!\nKavrayış sonraki seviye maliyetinin altındadır; Doktrin Uygulaması etkindir; grup tamamlanmıştır; ya da sonraki seviye henüz araştırılmamış bir teknoloji gerektirmektedir.\n\nBu grubun iptal edilmesi, fikir etkenlerini ve mevcut ilerlemeyi kaldırır. Harcanan Kavrayış asla iade edilmez, ancak bir dönüm noktasından halihazırda kazanılmış bir grup yuvası asla geri alınmaz."
