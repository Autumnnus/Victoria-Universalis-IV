 ve_national_ideas:0 " Ulusal Fikirler"
 ve_idea_points:0 "#tooltippable_name Ulusal Fikir"
 ve_national_insight_tt:0 "#header Ulusal Fikir#!\nStok: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nBu ay: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nSatın alma durumu: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Ne yapar?\nNational Insight, benimsenmiş bir Fikir Grubu içindeki bireysel fikirleri satın alır. Her aktif satın alma, Ulusal Fikirleri ilerletir ve mevcut Doktrin Yatırımına katkıda bulunur; bir yatırım dönüm noktasına ulaşmak kalıcı olarak grup kapasitesini ödüllendirir.\n\n#!Aylık gelir neden değişir?Temel:#title \nOkuryazarlık:#!\nOkullar: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nÜniversiteler: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nİdare: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nEntelijansiya: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nBorç, kargaşa ve uygulama: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\n\n [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]Hisse senedi basınç [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\nGelir çarpanı:#title \nGelir #!750 #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!'de yarıya iner,  #Y 750#!'de dörtte bire düşer #Y 900#! ve durur #Y 1000#!. Stok tavanından önce harcama yapmak gelirin israfını önler."
 ve_national_insight_implementation_strain:0 "Doktrin Uygulama Zorluğu"
 ve_national_insight_implementation_strain_desc:0 "İdare, kurumları ve prosedürleri yeni kabul edilen ulusal doktrine göre uyarlamaktadır. Bu 24 aylık uygulama döngüsü sona ermeden başka bir grup fikri benimsenemez."
 ve_total_ideas:0 "Fikir Grupları"
 ve_traditions:0 "#tooltippable_concept Gelenekler: "
 ve_bonus:0 "#tooltippable_concept Bonus: "
 ve_ambition:0 "Hırs"
 ve_ambition_tooltip:0 "#Y Hırs#!\n#P Kalıcı sonuç ödülü#!\nBu gruptaki yedi fikrin tamamı benimsendiğinde otomatik olarak açılır."
 ve_idea_cancel_warning:0 "#header İptal [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Bu gruptaki tüm etkin fikir değiştiriciler kaldırılacaktır.#!\n#N Kilidi açılmışsa Ambition değiştiricisi de kaldırılacaktır.#!\n\nHarcanan National Insight iade edilmez.\nNational Insight geri döndü: #Y 0#!\n\n#title Kaldırılacak efektler#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Onayla: bu fikri iptal et grup.#! İlerleme ve değiştiriciler kaybolur, National Insight'a geri ödeme yapılmaz."
 ve_idea_cancel_keep_tt:0 "Bu fikir grubunu koruyun - iptal etmeyin."
 ve_embrace:0 "Benimseyin"
 ve_idea_locked:0 "Yol Kapalı"
 ve_idea_locked_tt:0 "#N Bu fikir grubu, halihazırda benimsemiş olduğunuz fikir grubuyla birbirini dışlıyor. Bu yolu açmak için o grubu iptal edin."
 ve_idea_age_locked:0 "Teknoloji Gereklidir"
 ve_idea_age_locked_tt:0 "#N Bu fikir grubu henüz araştırılmamış bir teknolojiye ihtiyaç duyuyor."
 ve_idea_labour_technology_locked_tt:0 "#N Gereklilikler [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Gerektirir [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Gerektirir [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Gereklilikler [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Gereklilikler [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Gereklilikler [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Gerektirir [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Fikrini Artırın"
 ve_boost_idea_tt:0 "#header Sonraki Fikri Benimseyin#!\nUlusal Görüş: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nSatın alma durumu: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Sonraki seviyenin maliyeti#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nBu gruptaki bir sonraki doldurulmamış seviyeyle eşleşen maliyeti kullanın.\n\n#title Satın alındığında ne olur?#!\n#P Bu gruptaki bir sonraki değiştirici etkin hale gelir.#!\n#P Doktrin Yatırım ve Milli Fikir ilerlemesi her biri 1.#!\n#N 24 aylık Doktrin Uygulama döngüsü başlıyor. Bu sırada başka hiçbir grup fikri satın alınamaz.#!\n\n#title Düğme neden devre dışı bırakılabilir?#!\nFikir bir sonraki seviye maliyetinin altındadır; Doktrin Uygulaması aktif; grup tamamlandı; veya bir sonraki seviye, araştırılmamış bir teknoloji gerektirir.\n\nBu grubun iptal edilmesi, fikir değiştiricileri ve mevcut ilerlemeyi kaldırır. Harcanan Bilgi asla iade edilmez, ancak bir dönüm noktasından zaten kazanılmış bir grup kontenjanı asla iptal edilmez."
