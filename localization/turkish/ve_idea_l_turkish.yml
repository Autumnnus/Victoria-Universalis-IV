 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Dindarlık Reformu/ay#! İtiraf veya Devlet Ateizmi ve  #P +1 Kültürel Görev/ay#! Etnik Ulus'ta."
 nationalist_idea_7_tt:0 "#P +1 Dini Proje ilerlemesi/ay#! Mesleki veya Devlet Ateizminde; #P +1 Kültürel Proje ilerlemesi/ay#! Etnik Ulus'ta; Zorlayıcı Dini ve Etnik Entegrasyon sonuçları #Y %5#! ile #Y %7#!."
 embrace_idea_tt:0 "#header Fikir Grubu Kapasitesi#!\nKullanılan yuvalar: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nŞimdiki boş slotlar: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nMevcut Doktrin Yatırımı: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktif olarak satın alınan fikirler\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Kapasite nasıl çalışır#!\nHer aktif olarak satın alınan grup fikri tedarik edilir #P +1#! Doktrin Yatırım. Ulaşmak #Y 4, 8, 13, 19, 26#! veya #Y 34#! kalıcı olarak bir grup yuvası ekler. 5-6. Slotlar ayrıca 2 Yaşını da gerektirir; 7. yuva 3 Yaş gerektirir.\n\n#title Benimseme ve iptal etme#!\nBir gruba katılmanın Analiz maliyeti yoktur ancak bir boş yer kaplar. İptal etmek bu alanı serbest bırakır, grubun değiştiricilerini kaldırır ve mevcut Doktrin Yatırımını azaltır; harcanan Insight iade edilmez. Halihazırda kazanılmış herhangi bir kapasite yuvası kalıcı olarak kullanılabilir durumda kalır."
 ve_idea_capacity_player_progress:0 "#title Sonraki kalıcı yuva#!\nYuva: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! satın alınan fikirler\nHala gerekli: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Sonraki kalıcı yuva#!\nYuva: #Y 5#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! satın alınan fikirler\nHala gerekli: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nYaş gereksinim: #N 2 Yaşını Beklemek#!"
 ve_idea_capacity_player_age_3:0 "#title Sonraki kalıcı kontenjan#!\nSlot: #Y 7#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! satın alınan fikirler\nHala gerekli: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nYaş gereksinimi: #N 3 Yaş bekleniyor#!"
 ve_idea_capacity_player_max:0 "#P Maksimum kapasiteye ulaşıldı: 7 kalıcı grup yuvasının tümü mevcut.#!"
 ve_idea_capacity_country_progress:0 "#title Sonraki kalıcı yuva#!\nYuva: #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nİlerleme: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! satın alındı fikirler\nHala gerekli: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title Sonraki kalıcı slot#!\nSlot: #Y 5#!\nİlerleme: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! satın alınan fikirler\nHala gerekli: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nYaş gereksinimi: #N 2 Yaşını Bekliyor#!"
 ve_idea_capacity_country_age_3:0 "#title Sonraki kalıcı slot#!\nSlot: #Y 7#!\nİlerleme: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! satın alınan fikirler\nHala ihtiyaç var: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nYaş şartı: #N 3 Yaş bekleniyor#!"
