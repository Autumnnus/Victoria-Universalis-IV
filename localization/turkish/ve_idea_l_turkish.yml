 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P Etnik Ulusta veya Devlet Ateizminde +1 Dindarlık Reformu/ay#! ve #P Etnik Ulusta +1 Kültürel Yetki/ay#!."
 nationalist_idea_7_tt:0 "#P Mezhepsel veya Devlet Ateizminde +1 Dinî Proje ilerlemesi/ay#!; #P Etnik Ulusta +1 Kültürel Proje ilerlemesi/ay#!; baskıcı Dinî ve Etnik Entegrasyon sonuçları #Y %5#! oranından #Y %7#! oranına yükselir."
 embrace_idea_tt:0 "#header Fikir Grubu Kapasitesi#!\nKullanılan yuvalar: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nMevcut boş yuvalar: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nMevcut Doktrin Yatırımı: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! etkin satın alınmış fikir\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Kapasite nasıl çalışır#!\nSatın alınmış her etkin grup fikri #P +1#! Doktrin Yatırımı sağlar. #Y 4, 8, 13, 19, 26#! veya #Y 34#! değerine ulaşmak kalıcı olarak bir grup yuvası ekler. 5–6 numaralı yuvalar ayrıca Çağ 2 gerektirir; 7 numaralı yuva ise Çağ 3 gerektirir.\n\n#title Benimseme ve iptal etme#!\nBir grubun benimsenmesi İçgörü maliyeti gerektirmez ancak bir boş yuva kaplar. İptal etmek bu yuvayı serbest bırakır, grubun etkenlerini kaldırır ve mevcut Doktrin Yatırımını düşürür; harcanan İçgörü iade edilmez. Kazanılmış olan herhangi bir kapasite yuvası kalıcı olarak kullanılabilir kalır."
 ve_idea_capacity_player_progress:0 "#title Sonraki kalıcı yuva#!\nYuva: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! satın alınmış fikir\nHâlâ gereken: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Sonraki kalıcı yuva#!\nYuva: #Y 5#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! satın alınmış fikir\nHâlâ gereken: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nÇağ gereksinimi: #N Çağ 2 bekleniyor#!"
 ve_idea_capacity_player_age_3:0 "#title Sonraki kalıcı yuva#!\nYuva: #Y 7#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! satın alınmış fikir\nHâlâ gereken: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nÇağ gereksinimi: #N Çağ 3 bekleniyor#!"
 ve_idea_capacity_player_max:0 "#P Maksimum kapasiteye ulaşıldı: 7 kalıcı grup yuvasının tümü kullanılabilir durumda.#!"
