 ve_targeted_religious_project_state_action_tt:0 "#header Hedefli Dinî Proje#!\nBu vilayetin dinî yapısına karşı mevcut Dinî Model ile ilişkili projeyi başlatır. Tam Ayrılık bunu başlatamaz. Kesin maliyetler, ilerleme kuralları ve sonuçlar için Din panelini açın."
