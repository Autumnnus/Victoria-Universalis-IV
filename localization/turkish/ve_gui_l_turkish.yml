 ve_start_religious_project_button:0 "Projeyi Başlat"
 ve_cancel_religious_project_button:0 "Projeyi İptal Et"
 ve_confirm_cancel_button:0 "#N Evet, İptal Et#!"
 ve_keep_project_button:0 "Projeyi Sürdür"
 ve_targeted_religious_project_state_requirements_tt:0 "Vilayet tarafımızdan sahip olunmalı ve kendi dinimiz nüfusunun #Y %90#! veya daha fazlasına halihazırda sahip olmamalıdır. Devlet Dini Düzeni, Vicdan Özgürlüğü ve Devlet Ateizmi her biri birer tane başlatabilir; Tam Ayrılık başlatamaz. Etkin Dinî Model'in Dindarlık Reformu maliyeti de karşılanmalıdır."

