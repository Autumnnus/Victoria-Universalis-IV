l_turkish:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Ulusal Doktrin"
 VE_CP_COLLAPSE_TT:0 "Bu ülke için Victoria Universalis genel bakışını gizleyin"
 VE_CP_EXPAND_TT:0 "Bu ülke için Victoria Universalis genel bakışını göster"

 VE_CP_INSIGHT_LABEL:0 "Ulusal Fikir"
 VE_CP_INSIGHT_TT:0 "#header Ulusal Fikir#!\nStok: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nBenimsemiş bir fikir grubu içindeki bireysel fikirlere harcanmıştır."
 VE_CP_PIETY_LABEL:0 "Dindarlık Reformu"
 VE_CP_PIETY_TT:0 "#header Dindarlık Reformu#!\nStok: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nDini Programlara ve Hedeflenen Dini Projeye Harcama."
 VE_CP_MANDATE_LABEL:0 "Kültürel Manda"
 VE_CP_MANDATE_TT:0 "#header Kültürel Manda#!\nStok: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nKimlik Modelini Değiştirme ve Kültürel Projelere Harcama."
 VE_CP_MOMENTUM_LABEL:0 "Çağ İvmesi"
 VE_CP_MOMENTUM_TT:0 "#header Era Momentum#!\nStok: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nKazanılan karşılanan Çağ Hedeflerinden ve Çağ Ödüllerine harcanan tutardan. Yeni bir Çağ başladığında ivme sıfırlanır."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Fikirler"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Fikir Grupları#!\nKullanılan alanlar: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nBoş slotlar: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nMevcut Doktrin Yatırımı: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktif olarak satın alınan fikirler\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nAktif grup fikirleri #Y 4, 8, 13, 19, 26#! ve #Y 34#!'de kalıcı kapasite kazanır. 5-6. yuvalar aynı zamanda 2. Yaş ve 7. yuva da 3 Yaş gerektirir. Bir grubun iptal edilmesi mevcut yatırımı azaltır ve Analiz asla iade edilmez, ancak zaten kazanılmış olan kapasite korunur."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Ulusal Fikirler"
 VE_CP_PROGRESS_LABEL:0 "Fikir İlerlemesi"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Ulusal Fikir İlerlemesi#!\nSatın alınan grup fikirleri: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nSatın alınan her üçüncü grup fikri bir sonraki Ulusal Fikri açar. Yirmi birincisi aynı zamanda Ulusal Bonus da verir."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Henüz benimsenen bir fikir grubu yok.#!"
 VE_CP_PROGRAMS_LABEL:0 "Dini Programlar"
 VE_CP_NONE_YET:0 "#lore Henüz Yok#!"
 VE_CP_PROJECT_LABEL:0 "Proje"
 VE_CP_COHESION_LABEL:0 "Ulusal Uyum"
 VE_CP_OBJECTIVES_LABEL:0 "Çağ Hedefleri"
 VE_CP_OBJECTIVES_TT:0 "#header Çağ Hedefleri#!\nBu Çağda Tamamlandı: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nMemnun edilen her hedef, her ay Era Momentum kazandırır. Tamamlanan dört hedef Altın Çağın kilidini açar."
 VE_CP_REWARDS_LABEL:0 "Era Ödülleri"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] bu Çağı satın aldı"
 VE_CP_REWARDS_TT:0 "#header Çağ Ödülleri#!\nBu Çağda satın alındı: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nHer ödülün maliyeti bir öncekinden daha fazladır ve ödül etkileri Çağ ile birlikte sona erer. 10-13 numaralı yuvalar ülkeye özgüdür."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Bilinmeyen Yaş"
 ve_cp_golden_age_industrial_active:0 "#P Endüstriyel Altın Çağ#!"
 ve_cp_golden_age_cultural_active:0 "#P Kültürel Altın Çağ#!"
 ve_cp_golden_age_strategic_active:0 "#P Stratejik Altın Çağ#!"
 ve_cp_golden_age_spent:0 "#lore Altın Çağ kullanılıyor#!"
 ve_cp_golden_age_ready:0 "#Y Altın Çağ mevcut#!"
 ve_cp_golden_age_locked:0 "#lore Altın Çağ kilitli#!"
 ve_cp_tier_high:0 "#P Gelişen#!"
 ve_cp_tier_stable:0 "#lore Stabil#!"
 ve_cp_tier_low:0 "#N Gergin#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Benimsenmiş, ancak bu grupta henüz bir fikir satın alınmamış.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Dini Yerleşim#!\nAkım: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nDenge: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nAylık hareket: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nSayaç her ay dengeye doğru %20 hareket eder ve bu oran  #Y 5#! noktayla sınırlıdır. Şu tarihte: #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\n #N 25#! veya altı: #N -5 Meşruiyet ve -%5 Kanun Çıkarma Başarısı#!."
 VE_CP_COHESION_TT:0 "#header Ulusal Uyum#!\nMevcut: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nDenge: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nAylık hareket: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nUyum her ay dengeye doğru %20 oranında ilerler, #Y 5 ile sınırlıdır#! puan. Şu tarihte: #P 75#! Kimlik Modeli ekstra bir fayda sağlıyor; en #N 25#! veya altında ulusal istikrarsızlık geçerlidir."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Hedeflenen Dini Proje#!\nDurumu: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Kültürel Proje#!\nDurum: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nHedef: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "İlerleme: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nAylık ilerleme: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Çalışan proje yok. Sahip olunan bir eyaletin panelinden bir proje başlatılır ve Total Separation bu projeyi çalıştıramaz.#!"
 ve_cp_cultural_project_detail_active:0 "İlerleme: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nAylık ilerleme: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Hiçbir proje yürütülmüyor. Ülke çapındaki projeler Ulusal Kimlik panelinden başlar, hedeflenenler ise sahip olunan bir devletin panelinden yapılır.#!"
