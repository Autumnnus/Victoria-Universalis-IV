l_turkish:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Ulusal Doktrin"
 VE_CP_COLLAPSE_TT:0 "Bu ülke için Victoria Universalis genel bakışını gizle"
 VE_CP_EXPAND_TT:0 "Bu ülke için Victoria Universalis genel bakışını göster"

 VE_CP_INSIGHT_LABEL:0 "Ulusal Kavrayış"
 VE_CP_INSIGHT_TT:0 "#header Ulusal Kavrayış#!\nStok: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nBenimsenmiş bir fikir grubu içindeki bireysel fikirler için harcanır."
 VE_CP_PIETY_LABEL:0 "Dindarlık Reformu"
 VE_CP_PIETY_TT:0 "#header Dindarlık Reformu#!\nStok: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nDinî Programlar ve Hedeflenen Dinî Proje için harcanır."
 VE_CP_MANDATE_LABEL:0 "Kültürel Yetki"
 VE_CP_MANDATE_TT:0 "#header Kültürel Yetki#!\nStok: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nKimlik Modelini değiştirmek ve Kültürel Projeler için harcanır."
 VE_CP_MOMENTUM_LABEL:0 "Çağ İvmesi"
 VE_CP_MOMENTUM_TT:0 "#header Çağ İvmesi#!\nStok: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nMemnun Çağ Hedeflerinden kazanılır ve Çağ Ödülleri için harcanır. Yeni bir Çağ başladığında İvme sıfırlanır."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Fikirler"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Fikir Grupları#!\nKullanılan yuvalar: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nBoş yuvalar: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nMevcut Doktrin Yatırımı: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! aktif satın alınmış fikir\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nAktif grup fikirleri #Y 4, 8, 13, 19, 26#! ve #Y 34#! seviyelerinde kalıcı kapasite kazandırır. 5–6 numaralı yuvalar ayrıca Çağ 2'yi ve 7 numaralı yuva Çağ 3'ü gerektirir. Bir grubu iptal etmek mevcut yatırımı düşürür ve asla Kavrayış iade etmez, ancak halihazırda kazanılmış kapasite korunur."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Ulusal Fikirler"
 VE_CP_PROGRESS_LABEL:0 "Fikir İlerlemesi"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Ulusal Fikir İlerlemesi#!\nSatın alınan grup fikirleri: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nSatın alınan her üçüncü grup fikri bir sonraki Ulusal Fikrin kilidini açar. Yirmi birinci fikir ayrıca Ulusal Bonusu kazandırır."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Henüz hiçbir fikir grubu benimsenmedi.#!"
 VE_CP_PROGRAMS_LABEL:0 "Dinî Programlar"
 VE_CP_NONE_YET:0 "#lore Henüz yok#!"
 VE_CP_PROJECT_LABEL:0 "Proje"
 VE_CP_COHESION_LABEL:0 "Ulusal Uyum"
 VE_CP_OBJECTIVES_LABEL:0 "Çağ Hedefleri"
 VE_CP_OBJECTIVES_TT:0 "#header Çağ Hedefleri#!\nBu Çağda tamamlanan: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nMemnun her hedef her ay Çağ İvmesi öder. Dört tamamlanan hedef Altın Çağ'ın kilidini açar."
 VE_CP_REWARDS_LABEL:0 "Çağ Ödülleri"
 VE_CP_REWARDS_VALUE:0 "Bu Çağda [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] adet satın alındı"
 VE_CP_REWARDS_TT:0 "#header Çağ Ödülleri#!\nBu Çağda satın alınan: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nHer ödül bir öncekinden daha pahalıya mal olur ve ödül etkileri Çağ ile birlikte sona erer. 10-13 numaralı yuvalar ülkeye özeldir."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Bilinmeyen Çağ"
 ve_cp_golden_age_industrial_active:0 "#P Sanayi Altın Çağı#!"
 ve_cp_golden_age_cultural_active:0 "#P Kültürel Altın Çağ#!"
 ve_cp_golden_age_strategic_active:0 "#P Stratejik Altın Çağ#!"
 ve_cp_golden_age_spent:0 "#lore Altın Çağ kullanıldı#!"
 ve_cp_golden_age_ready:0 "#Y Altın Çağ kullanılabilir#!"
 ve_cp_golden_age_locked:0 "#lore Altın Çağ kilitli#!"
 ve_cp_tier_high:0 "#P Gelişmekte#!"
 ve_cp_tier_stable:0 "#lore İstikrarlı#!"
 ve_cp_tier_low:0 "#N Gergin#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Benimsendi, ancak bu grupta henüz hiçbir fikir satın alınmadı.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Dinî Uzlaşı#!\nMevcut: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nDenge: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nAylık değişim: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nÖlçüt her ay dengeye doğru %20 hareket eder, #Y 5#! puanla sınırlıdır. #P 75#! seviyesinde: [Country.GetCustom('ve_religious_high_settlement_effect')]\n#N 25#! veya altında: #N -5 Meşruluk ve -5% Kanun Çıkarma Başarısı#!"
 VE_CP_COHESION_TT:0 "#header Ulusal Uyum#!\nMevcut: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nDenge: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nAylık değişim: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nUyum her ay dengeye doğru %20 oranında hareket eder, en fazla #Y 5#! puanla sınırlıdır. #P 75#! seviyesinde Kimlik Modeli ek bir fayda sağlar; #N 25#! veya altında ise ulusal istikrarsızlık uygulanır."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Hedeflenen Dinî Proje#!\nDurum: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Kültürel Proje#!\nDurum: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nHedef: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "İlerleme: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nAylık ilerleme: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Aktif bir proje bulunmuyor. Bir proje sahip olunan vilayetin panelinden başlatılır ve Tam Ayrılık bir proje yürütemez.#!"
 ve_cp_cultural_project_detail_active:0 "İlerleme: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nAylık ilerleme: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Aktif bir proje bulunmuyor. Ülke genelindeki projeler Ulusal Kimlik panelinden, hedeflenen projeler ise sahip olunan bir vilayetin panelinden başlatılır.#!"
