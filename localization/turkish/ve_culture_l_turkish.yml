l_turkish:
 ve_culture_reform_point_tt:0 "#header Kültürel Yetki#!\nMevcut: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nAylık değişim: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Ne için harcanır?#!\nKültürel Projeler (75–150) ve Kimlik Modeli değişimleri (200). Yetkiyi biriktirmek güvenlidir; gelir 400'de yarıya iner ve 500'de durur.\n\n#Y Aylık ayrıntı#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nİdare: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nModel toplumu: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nİstikrar ve kültürel hareketler: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nKanun uyumu: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nFikir doktrini: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nTavan çarpanı: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Fikir doktrini — yalnızca mevcut Kimlik Modelin sayılır#!\n#P Etnik Ulus#!: Nationalist V #P +1#!\n#P Sivil Ulus#!: Reformist V #P +1#!; Academic V #P +1#!\n#P Bileşik Devlet#!: Reformist V #P +1#!\nYukarıdaki etkin toplam en fazla #Y +2#! olabilir."
 ve_culture_reform_point:0 "Kültürel Yetki"
 ve_cultural_project_progress:0 "Kültürel Proje İlerlemesi"
 ve_cultural_project_progress_tt:0 "#header Aylık Proje İlerlemesi#!\nMevcut: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nKalan: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nAylık toplam: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (en az 1, en çok 7)\n\n#Y Aylık ayrıntı#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nİdare: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nModel toplumu: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nUyum: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nKültürel hareketler: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nHedef eyalet karışıklığı: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nFikir Grupları: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Fikir Grupları — yalnızca mevcut Kimlik Modelinle eşleşen bonuslar etkin#!\n#P Etnik Ulus#!: Nationalist VII #P +1#!\n#P Sivil Ulus#!: Reformist VII, Academic VII veya Welfare VI — her biri #P +1#!\n#P Bileşik Devlet#!: Reformist VII veya Diplomatic VI — her biri #P +1#!\nYukarıdaki etkin Fikir Grubu toplamı en fazla #Y +2#! olabilir; bu sınırdan sonraki uygun bonuslar ilerlemeyi artırmaz."
 ve_ethnic_campaign_desc:0 "#header Etnik Entegrasyon Kampanyası#!\nBir eyalette, nüfusun en az #Y %5#!'ini oluşturan en büyük birincil olmayan kültüre karşı yürütülür.\n\n#Y Maliyet#!\n#Y 125 Kültürel Yetki#!, hemen ödenir\n\n#Y Tamamlanınca#!\nHedef kültürün #Y %5#!'ini birincil kültüre asimile eder; Nationalist VII ile #Y %7#! olur\n#P +25 Kültürel Yetki, +8 Ulusal Uyum#!\nEyalette #Y 10 yıllık#! asimilasyon programı bırakır\n\n#Y Uyarı#!\n#N Projeyi başlatmak ve bitirmek hedef kültürde radikal oluşturur.#!"
