 ve_national_identity:0 "Ulusal Kimlik"
 ve_primary_cultures_label:0 "Birincil Kültürler"
 ve_identity_models:0 "Kimlik Modelleri"
 ve_identity_model_active_footer:0 "Halihazırda Aktif"
 ve_switch_identity_button:0 "Anahtar"
 ve_switch_identity_cost_label:0 "Maliyetler #Y 200 Kültürel Zorunluluk#!"
 ve_begin_project_button:0 "Projeyi Başlatın"
 ve_identity_models_help:0 "Ulusunuzun her zaman tek bir Kimlik Modeli vardır ve bu #P zaten aktif#! — burada hiçbir şey seçmek zorunda değilsiniz. Model yalnızca nasıl olacağına karar verir #Y Ulusal Uyum#! kazanıldığı ve hangi Kültürel Projeyi yürütebileceğiniz.\n#Y Anahtarlama isteğe bağlıdır:#! maliyeti #Y 200 Kültürel Görev#!, Uyum'u  #Y 35#!'e sıfırlar, devam eden tüm Kültür Projelerini iptal eder ve başka bir geçişi 5 yıl süreyle engeller.\n#Y Tüm efektleri görmek için herhangi bir kartın veya sayacın üzerine gelin.#!"
 ve_ethnic_identity_name:0 "Etnik Ulus"
 ve_civic_identity_name:0 "Sivil Ulus"
 ve_composite_identity_name:0 "Bileşik Devlet"
 ve_ethnic_identity_short:0 "Ulus, birincil kültürleri etrafında tanımlanır.\nUyum, #Y demografik baskınlık#!."
 ve_civic_identity_short:0 "Okul yoluyla inşa edilen siyasi bir ulus.\nUyum, #Y okuryazarlık ve kabul edilmiş azınlıklar#!."
 ve_composite_identity_short:0 "Müzakere edilen kurumlar altında birden fazla halk.\nUyum, #Y gerçekten çoğul bir nüfus#!."
 ve_ethnic_identity_unlocks:0 "Kilidini açar #Y Etnik Entegrasyon Kampanyası#! proje"
 ve_civic_identity_unlocks:0 "Kilidini açar #Y Eşit Vatandaşlık Girişimi#! proje"
 ve_composite_identity_unlocks:0 "Kilidini açar #Y Kurucu Kompakt#! projesi"
 ve_ethnic_identity_desc:0 "#header Etnik Ulus#!\nUlus, birincil kültürleri etrafında tanımlanır.\n\n#Y Aktifken#!\n#P +%15 Asimilasyon, +%5 Otorite#!\n#N -%5 Göç Çekimi, +%5 Açık Önyargıdan Gelen Radikaller#!\n\n#Y Uyum#!\nBirincil kültürler aynı düzeyde oluştuğunda yükselir Nüfusun en az %60-75'i ve %40'ın keskin bir şekilde altına düşüyor.\n\n#Y 75 Uyum'da#!\n#P +%5 Zorunlu Askerlik Oranı, +3 Meşruiyet#!\n\n#Y Kültürel Proje#!\nEtnik Entegrasyon Kampanyası"
 ve_civic_identity_desc:0 "#header Sivil Ulus#!\nOrtak bir siyasi ulus, eğitim ve katılım yoluyla inşa edilir.\n\n#Y Aktifken#!\n#P +%7 Göç Çekimi, +%1 Eğitim Erişimi#!\n#N -%10 Asimilasyon, -5% Otorite, -50 Bürokrasi#!\n\n#Y Uyum#!\nOkuryazarlık bunu yükseltir, ancak nüfusun %10'unun üzerindeki herhangi bir birincil olmayan kültür ve çok düşük Kabul bunu düşürür.\n\n#Y 75 Uyum#!\n#P +%5 Niteliklerde, +3 Meşruiyet#!\n\n#Y Kültürel Proje#!\nEşit Vatandaşlık Girişimi"
 ve_composite_identity_desc:0 "#header Bileşik Devlet#!\nBirçok halk, müzakere edilen kurumlar aracılığıyla yönetilmektedir.\n\n#Y Aktifken#!\n#P -%10 Kültürel Silinme ve İkinci Sınıf Vatandaşlıktan Kaynaklanan Radikaller, +%5 Etki#!\n#N -%15 Asimilasyon, -%5 Otorite, -75 Bürokrasi#!\n\n#Y Uyum#!\nGerçekten çoğul bir nüfus onu yükseltir; %90'ın üzerinde birincil kültür popülasyonu bu modeli zayıflatır.\n\n#Y 75 Uyum#!\n#P +%5 Etki, +3 Meşruiyet#!\n\n#Y Kültürel Proje#!\nKurucu Sözleşme"
 ve_identity_change_cost_tt:0 "Kimlik Modelini Değiştirmek için #Y 200 Kültürel Yetki gerekir#! ve aktif Kimlik Geçişi Boşluğu yok. Değişiklik Uyum'u #Y 35#!'e sıfırlar, #Y 5 yıllık geçiş tepkisi#! ve herhangi bir aktif Kültür Projesini ek bir iptal cezası olmaksızın iptal eder."
 ve_cultural_mandate:0 "Kültürel Görev"
 ve_culture_reform_point:0 "Kültürel Görev"
 ve_cultural_mandate_hint:0 "Kültürel Projelere harcandı. Tasarruf etmek güvenlidir ancak gelir 400'de yarıya iner ve 500'de durur."
 ve_culture_reform_point_tt:0 "#header Kültürel Talimat#!\nMevcut: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nAylık değişim: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Neye harcanıyor#!\nKültürel Projeler (75–150) ve Kimlik Modeli değişiklikleri (200). Her ikisi de gerekli değildir: Tasarruf Yetkisi güvenlidir, gelir yalnızca 400'de yarıya iner ve 500'de durur.\n\n#Y Aylık dağılım#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nYönetim: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nModel Toplum: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nİstikrar ve Kültürel Hareketler: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nYasa uyumu: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nFikir doktrini: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nKapak çarpan: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Fikir doktrini — yalnızca mevcut Kimlik Modeliniz dikkate alınır#!\n#P Etnik Ulus#!: Milliyetçi V #P +1#!\n#P Sivil Ulus#!: Reformcu V #P +1#!; Akademik V #P +1#!\n#P Bileşik Devlet#!: Reformcu V #P +1#!\nYukarıdaki aktif toplam  #Y +2#! ile sınırlıdır.\n\nCivic Nation, Model Toplum bileşenini okuryazarlıktan, Bileşik Devleti çoğul toplumdaki okuryazarlıktan ve Etnik Ulus'u birincil kültürün demografik gücünden alır.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Ulusal Uyum"
 ve_national_cohesion_hint:0 "Kimlik Modelinizin ürettiği dengeye doğru sürüklenir. 75+'da, 25 veya daha az istikrarsızlıkta bir bonus kazanırsınız."
 ve_national_cohesion_tt:0 "#header Ulusal Uyum#!\nMevcut: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nDenge: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nAylık hareket: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nOrtak koşullar: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nKimlik modeli koşulları: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nUyum her ay dengeye doğru mesafenin %20'sini hareket ettirir, en fazla 5 puan. Radikal kültürel hareketler dengeyi 10 oranında azaltır. 75 veya daha fazla olduğunda mevcut model ek bir fayda sağlar; 25 veya daha az düzeyde ulusal istikrarsızlık geçerlidir.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Etkisi yok"
 ve_cultural_projects:0 "Kültürel Projeler"
 ve_cultural_projects_intro:0 "Kültürel Projeler #Y isteğe bağlı#!. Aynı anda yalnızca bir kişi çalıştırılabilir: Yetki bedeli anında ödenir ve #N -75 Bürokrasi ve -25 Yetki#! çalıştığı sürece uygulayın. Bir projeyi tamamlamak, bir miktar Yetki iadesi sağlar ve Uyum'u artırır. Ülke çapındaki projeler ancak tamamlanma avantajı sona erdikten sonra tekrarlanabilir; tamamlanmış bir Eyalet/Kültür hedefi tekrar seçilemez.\n#Y Tüm etkilerini görmek için herhangi bir kartın veya ölçüm cihazının üzerine gelin.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Proje devam ediyor"
 ve_cultural_project_progress:0 "Proje İlerlemesi"
 ve_cultural_project_progress_tt:0 "#header Aylık Proje İlerlemesi#!\nMevcut: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nKalan: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nAylık toplam: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (minimum 1, maksimum 7)\n\n#Y Aylık dağılım#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nYönetim: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nModel Toplum: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nUyum: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nKültürel Hareketler: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nHedef-Devlet Kargaşası: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nFikir Grupları: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Fikir Grupları — yalnızca mevcut Kimlik Modelinize uygun bonuslar etkindir#!\n#P Etnik Ulus#!: Milliyetçi VII #P +1#!\n#P Sivil Ulus#!: Reformist VII, Akademik VII veya Refah VI — #P +1#! her biri\n#P Bileşik Devlet#!: Reformist VII veya Diplomatik VI — #P +1#! her biri\nYukarıdaki aktif Fikir Grubu toplamı şu şekilde sınırlandırılmıştır: #Y +2#!; başka eşleşen bonuslar ilerlemeyi artırmaz.\n\nModel Topluluğu, aktif Kimlik Modeline göre vatandaşlık okuryazarlığını, etnik demografik yoğunlaşmayı veya bileşik çeşitliliği ödüllendirir. İlerleme ulaştıktan sonra bir sonraki aylık güncellemede tamamlanma kararı alınır #Y 100#!."
 ve_cancel_cultural_project_button:0 "Projeyi İptal Et"
 ve_cancel_cultural_project_tt:0 "#header Kültürel Projeyi İptal Et#!\nYatırım yapılan Kültürel Görev #N iade edilmedi#!. Ulusal Uyum düşüyor #N 5#! ve bir #N 2 yıllık tepki#! başka bir projeyi önler."
 ve_start_cultural_project_button:0 "Projeyi Başlat"
 ve_national_curriculum_name:0 "Ulusal Müfredat"
 ve_national_curriculum_cost:0 "Maliyet: #Y 100 Kültürel Talimat#!"
 ve_national_curriculum_short:0 "Ülke çapında bir eğitim reformu.\n#P +20 Yetki, +5 Uyum#!, ardından daha iyi eğitim."
 ve_national_curriculum_desc:0 "#header Ulusal Müfredat#!\nTüm ülke çapında uygulanan bir eğitim reformu.\n\n#Y Maliyet#!\n#Y 100 Kültürel Görev#!, hemen ödenir\n\n#Y Tamamlandığında#!\n#P +20 Kültürel Görev, +5 Ulusal Uyum#!\n\n#Y Sonraki 10 yıl boyunca#!\n#P +%2 Eğitim Erişimi, +%5 Nitelikler#!\n#N -25 Bürokrasi#!"
 ve_national_curriculum_requirements_tt:0 "Gerektirir #Y 100 Kültürel Talimat#!, aktif bir Kültürel Proje yok ve Proje Tepkisi yok. Aynı zamanda önceki durumdayken de başlayamaz. #Y Ulusal Müfredat#! avantajı aktif."
 ve_shared_symbols_name:0 "Paylaşılan Semboller"
 ve_shared_symbols_cost:0 "Maliyet: #Y 75 Kültürel Manda#!"
 ve_shared_symbols_short:0 "Bayraklar, marşlar ve halka açık törenler.\n#P +20 Manda, +7 Uyum#!, ardından sadıklar ve Otorite."
 ve_shared_symbols_desc:0 "#header Paylaşılan Semboller#!\nTüm ülke çapında tanıtılan bayraklar, marşlar ve halka açık törenler.\n\n#Y Maliyet#!\n#Y 75 Kültürel Talimat#!, anında ödenir\n\n#Y Tamamlandığında#!\n#P +20 Kültürel Görev, +7 Ulusal Uyum#!\n\n#Y 8 yıl sonrasında#!\n#P +%10 Tamamen Kabul Edilmiş Poplardan Sadıklar, +25 Yetki#!"
 ve_shared_symbols_requirements_tt:0 "Gereklilikler #Y 75 Kültürel Talimat#!, aktif bir Kültürel Proje yok ve Proje Tepkisi yok. Aynı zamanda önceki durumdayken de başlayamaz. #Y Paylaşılan Semboller#! avantajı aktif."
 ve_ethnic_campaign_name:0 "Etnik Entegrasyon Kampanyası"
 ve_ethnic_campaign_cost:0 "Maliyet: #Y 125 Kültürel Zorunluluk#!"
 ve_ethnic_campaign_short:0 "Büyük bir azınlığı tek bir Eyalette asimile edin.\n#P +25 Manda, +8 Uyum#!, ancak radikaller yaratır."
 ve_ethnic_campaign_desc:0 "#header Etnik Entegrasyon Kampanyası#!\nTek bir Eyalette, en az % #Y 5'i elinde bulundurması gereken en büyük birincil olmayan kültüre karşı koşun#! o Eyaletin nüfusunun yüzde 100'ü.\n\n#Y Maliyet#!\n#Y 125 Kültürel Vekalet#!, hemen ödenir\n\n#Y Tamamlandığında#!\nAsimile olur #Y %5#! Hedef kültürün birincil kültüre dönüştürülmesi veya #Y %7#! Milliyetçi VII\n#P +25 Kültürel Manda, +8 Ulusal Uyum ile#!\nBir yaprak bırakır #Y 10 yıllık#! Devletteki asimilasyon programı\n\n#Y Uyarı#!\n#N Projeyi hem başlatmak hem de bitirmek hedef kültürde radikaller yaratır.#!"
 ve_civic_initiative_name:0 "Eşit Vatandaşlık Girişimi"
 ve_civic_initiative_cost:0 "Maliyet: #Y 100 Kültürel Zorunluluk#!"
 ve_civic_initiative_short:0 "Tek bir Eyalette bir azınlığın Kabulünü artırın.\n#P +25 Manda, +10 Uyum#! ve sadık kişiler."
 ve_civic_initiative_desc:0 "#header Eşit Vatandaşlık İnisiyatifi#!\nTek bir Eyalette, birincil olmayan en büyük kültür üzerinde çalışır; #Y %5#! o Eyaletin nüfusunun.\n\n#Y Maliyet#!\n#Y 100 Kültürel Vekalet#!, hemen ödenir\n\n#Y Tamamlandığında#!\n#P +15 Bu kültüre 10 yıl boyunca kabul#!\nHedef Eyaletteki Sadıklar\n#P +25 Kültürel Yetki, +10 Ulusal Uyum#!\nOn yıllık iyileştirilmiş Nitelikler ve Göç Çekimi"
 ve_composite_compact_name:0 "Kurucu Sözleşme"
 ve_composite_compact_cost:0 "Maliyet: #Y 150 Kültürel Yetki#! ve #Y 40 Uyum#!"
 ve_composite_compact_short:0 "Bir azınlığın kurucu kültür olarak tanınması.\n#P +30 Yetki, +12 Uyum#!, kalıcı olarak."
 ve_composite_compact_desc:0 "#header Kurucu Sözleşme#!\nEn az % #Y 5'e sahip, tanınmayan birincil olmayan bir kültür üzerinde tek bir Eyalette yayınlayın#! o Eyaletin nüfusu kadar.\n\n#Y Maliyet#!\n#Y 150 Kültürel Manda#!, hemen ödenir ve en az #Y 40 Ulusal Uyum#!\n\n#Y Tamamlandığında#!\n#P +15 Bu kültürün kalıcı olarak kabul edilmesi#!\nBunu bir kurucu kültür olarak tanır\nHedef Eyaletteki sadıklar\n#P +30 Kültürel Manda, +12 Ulusal Uyum#!"
 ve_targeted_project_start_instruction:0 "#Y Nasıl başlamalı#!\n1. Kendi Eyaletlerinizden birini açın.\n2. Basın #Y Projeyi Başlat#! söz konusu Eyaletin panelinde.\nHedef kültür ve hala eksik olan her şey bu düğmenin ipucunda listelenir."
 ve_targeted_project_state_requirements_tt:0 "Eyalet bize ait olmalı ve en az % #Y 5 oranında uygun, birincil olmayan bir kültür içermelidir.#! nüfusunun. Uygun olan en büyük kültür hedef haline gelir. Bu Eyalette halihazırda tamamlanmış bir kültür tekrar hedef alınamaz ancak başka bir Eyalette hedeflenebilir. Mevcut Kimlik Modelinin maliyetinin ve gereksinimlerinin de karşılanması gerekiyor."
 ve_targeted_cultural_project_target:0 "Hedef: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! içinde #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Kapsam: #Y Tüm Ülke#!"
 ve_no_cultural_project_target:0 "Proje hedefi yok "
 ve_no_active_cultural_project:0 "Aktif Kültürel Proje Yok "

