 ve_identity_transition_backlash_notice:0 "Bir Kimlik Geçişi Tepkisi hala aktif - süre dolana kadar model tekrar değiştirilemez."
 ve_cultural_project_backlash_notice:0 "İptal edilen bir proje yenisini engellemeye devam ediyor - 2 yıllık tepkinin süresi dolmalı."

