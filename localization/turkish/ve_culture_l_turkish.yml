 ve_ethnic_high_cohesion_effect:0 "#P +%5 Asker Alım Oranı ve +3 Meşruluk#!."
 ve_civic_high_cohesion_effect:0 "#P +%5 Nitelikler ve +3 Meşruluk#!."
