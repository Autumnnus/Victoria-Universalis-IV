l_turkish:
 ve_national_identity:0 "Ulusal Kimlik"
 ve_primary_cultures_label:0 "Ana Kültürler"
 ve_identity_models:0 "Kimlik Modelleri"
 ve_identity_model_active_footer:0 "Halihazırda Etkin"
 ve_switch_identity_button:0 "Değiştir"
 ve_switch_identity_cost_label:0 "Maliyeti: #Y 200 Kültürel Yetki#!"
 ve_begin_project_button:0 "Projeye Başla"
 ve_identity_models_help:0 "Ulunuzun her zaman tam olarak bir Kimlik Modeli bulunur ve bu model #P halihazırda etkin#! durumdadır; burada herhangi bir şey seçmeniz gerekmez. Model yalnızca #Y Ulusal Uyum#! değerinin nasıl kazanılacağını ve hangi Kültürel Projeyi yürütebileceğinizi belirler.\n#Y Değiştirmek isteğe bağlıdır:#! maliyeti #Y 200 Kültürel Yetki#! olup Uyum'u #Y 35#! değerine sıfırlar, devam eden tüm Kültürel Projeleri iptal eder ve 5 yıl boyunca başka bir değişikliği engeller.\n#Y Tüm etkilerini görmek için herhangi bir kartın veya göstergenin üzerine gelin.#!"
 ve_ethnic_identity_name:0 "Etnik Ulus"
 ve_civic_identity_name:0 "Sivil Ulus"
 ve_composite_identity_name:0 "Bileşik Devlet"
 ve_ethnic_identity_short:0 "Ulus, ana kültürü etrafında tanımlanır.\nUyum, #Y demografik egemenlikten#! gelir."
 ve_civic_identity_short:0 "Okullaşma yoluyla inşa edilen siyasi bir ulus.\nUyum, #Y okuryazarlık ve kabul gören azınlıklardan#! gelir."
 ve_composite_identity_short:0 "Müzakere edilmiş kurumlar altında birleşmiş halklar.\nUyum, #Y gerçekten çoğulcu bir nüfustan#! gelir."
 ve_ethnic_identity_unlocks:0 "#Y Etnik Bütünleşme Kampanyası#! projesinin kilidini açar"
 ve_civic_identity_unlocks:0 "#Y Eşit Yurttaşlık Girişimi#! projesinin kilidini açar"
 ve_composite_identity_unlocks:0 "#Y Bileşen Uzlaşması#! projesinin kilidini açar"
 ve_ethnic_identity_desc:0 "#header Etnik Ulus#!\nUlus, ana kültürü etrafında tanımlanır.\n\n#Y Etkinken#!\n#P +%15 Asimilasyon, +%5 Otorite#!\n#N -%5 Göç Cazibesi, Açık Önyargıdan +%5 Radikaller#!\n\n#Y Uyum#!\nAna kültürler nüfusun en az %60–75'ini oluşturduğunda yükselir, %40'ın altına düştüğünde keskin bir şekilde azalır.\n\n#Y 75 Uyumda#!\n#P +%5 Asker Alım Oranı, +3 Meşruluk#!\n\n#Y Kültürel Proje#!\nEtnik Bütünleşme Kampanyası"
 ve_civic_identity_desc:0 "#header Sivil Ulus#!\nPaylaşılan siyasi bir ulus, eğitim ve katılım yoluyla inşa edilir.\n\n#Y Etkinken#!\n#P +%7 Göç Cazibesi, +%1 Eğitime Erişim#!\n#N -%10 Asimilasyon, -%5 Otorite, -50 Bürokrasi#!\n\n#Y Uyum#!\nOkuryazarlık uyumu artırır, ancak nüfusun %10'undan fazlasını oluşturan ve çok düşük Kabul gören herhangi bir ana kültür dışı unsur uyumu düşürür.\n\n#Y 75 Uyumda#!\n#P +%5 Nitelikler, +3 Meşruluk#!\n\n#Y Kültürel Proje#!\nEşit Yurttaşlık Girişimi"
 ve_composite_identity_desc:0 "#header Bileşik Devlet#!\nÇeşitli halklar, müzakere edilmiş kurumlar aracılığıyla yönetilir.\n\n#Y Etkinken#!\n#P Kültürel Silinme ve İkinci Sınıf Yurttaşlıktan -%10 Radikaller, +%5 Nüfuz#!\n#N -%15 Asimilasyon, -%5 Otorite, -75 Bürokrasi#!\n\n#Y Uyum#!\nGerçekten çoğulcu bir nüfus uyumu artırır; ana kültürlerin %90'ı aşması bu modeli zayıflatır.\n\n#Y 75 Uyumda#!\n#P +%5 Nüfuz, +3 Meşruluk#!\n\n#Y Kültürel Proje#!\nBileşen Uzlaşması"
 ve_identity_change_cost_tt:0 "Kimlik Modeli'ni değiştirmek #Y 200 Kültürel Yetki#! ve etkin bir Kimlik Geçişi Tepkisi olmamasını gerektirir. Bu değişiklik Uyum'u #Y 35#! değerine sıfırlar, #Y 5 yıllık bir geçiş tepkisine#! yol açar ve ek bir iptal cezası olmaksızın tüm etkin Kültürel Projeleri iptal eder."
 ve_cultural_mandate:0 "Kültürel Yetki"
 ve_culture_reform_point:0 "Kültürel Yetki"
 ve_cultural_mandate_hint:0 "Kültürel Projeler için harcanır. Biriktirmek güvenlidir, ancak gelir 400'de yarıya iner ve 500'de durur."
 ve_culture_reform_point_tt:0 "#header Kültürel Yetki#!\nMevcut: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nAylık değişim: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Ne için harcanır#!\nKültürel Projeler (75–150) ve Kimlik Modeli değişiklikleri (200). İkisi de zorunlu değildir: Yetki biriktirmek güvenlidir, gelir yalnızca 400'de yarıya iner ve 500'de durur.\n\n#Y Aylık döküm#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nMeşruluk: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nYönetim: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nModel Toplum: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nİstikrar ve Kültürel Hareketler: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nYasa uyumu: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nFikir doktrini: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nSınır çarpanı: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Fikir doktrini — yalnızca mevcut Kimlik Modeliniz geçerlidir#!\n#P Etnik Ulus#!: Milliyetçi V #P +1#!\n#P Sivil Ulus#!: Reformcu V #P +1#!; Akademik V #P +1#!\n#P Bileşik Devlet#!: Reformcu V #P +1#!\nYukarıdaki etkin toplam #Y +2#! ile sınırlandırılmıştır.\n\nSivil Ulus Model Toplum bileşenini okuryazarlıktan, Bileşik Devlet çoğulcu bir toplumdaki okuryazarlıktan ve Etnik Ulus ana kültür demografik gücünden alır.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Ulusal Uyum"
 ve_national_cohesion_hint:0 "Kimlik Modelinizin ürettiği dengeye doğru kayar. 75 ve üzerinde bir bonus kazanırsınız, 25 veya altında ise istikrarsızlık baş gösterir."
 ve_national_cohesion_tt:0 "#header Ulusal Uyum#!\nMevcut: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nDenge: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nAylık değişim: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nGenel koşullar: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nKimlik modeli koşulları: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nUyum her ay dengeye olan mesafenin %20'si kadar, en fazla 5 puan hareket eder. Radikal kültürel hareketler dengeyi 10 azaltır. 75 veya daha yüksek olduğunda mevcut model ek bir fayda sağlar; 25 veya daha düşük olduğunda ulusal istikrarsızlık uygulanır.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Etki yok"
 ve_cultural_projects:0 "Kültürel Projeler"
 ve_cultural_projects_intro:0 "Kültürel Projeler #Y isteğe bağlıdır#!. Aynı anda yalnızca bir tanesi yürütülebilir: Direktif maliyeti derhal ödenir ve yürürlükte olduğu sürece #N -75 Bürokrasi ve -25 Otorite#! uygulanır. Bir projenin tamamlanması bir miktar Direktifi iade eder ve Uyumu yükseltir. Ülke çapındaki projeler yalnızca tamamlanma faydası sona erdikten sonra yinelenebilir; tamamlanmış bir Vilayet/Kültür hedefi yeniden seçilemez.\n#Y Tam etkileri için herhangi bir kartın veya göstergenin üzerine gelin.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Devam eden proje"
 ve_cultural_project_progress:0 "Proje İlerlemesi"
 ve_cultural_project_progress_tt:0 "#header Aylık Proje İlerlemesi#!\nMevcut: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nKalan: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nAylık toplam: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (en az 1, en çok 7)\n\n#Y Aylık döküm#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nYönetim: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nModel Toplum: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nUyum: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nKültürel Hareketler: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nHedef Vilayet Kargaşası: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nFikir Grupları: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Fikir Grupları — yalnızca mevcut Kimlik Modelinizle eşleşen bonuslar etkindir#!\n#P Etnik Ulus#!: Milliyetçi VII #P +1#!\n#P Sivil Ulus#!: Reformcu VII, Akademik VII veya Refah VI — her biri #P +1#!\n#P Bileşik Devlet#!: Reformcu VII veya Diplomatik VI — her biri #P +1#!\nYukarıdaki aktif Fikir Grubu toplamı en fazla #Y +2#! ile sınırlıdır; diğer eşleşen bonuslar ilerlemeyi artırmaz.\n\nModel Toplum, aktif Kimlik Modeline göre sivil okuryazarlığı, etnik demografik yoğunlaşmayı veya bileşik çeşitliliği ödüllendirir. Tamamlanma, ilerleme #Y 100#! değerine ulaştıktan sonraki ilk aylık güncellemede karara bağlanır."
 ve_cancel_cultural_project_button:0 "Projeyi İptal Et"
 ve_cancel_cultural_project_tt:0 "#header Kültürel Projeyi İptal Et#!\nYatırılan Kültürel Direktif #N iade edilmez#!. Ulusal Uyum #N 5#! düşer ve #N 2 yıllık bir tepki#! başka bir projeyi engeller."
 ve_start_cultural_project_button:0 "Projeyi Başlat"
 ve_national_curriculum_name:0 "Ulusal Müfredat"
 ve_national_curriculum_cost:0 "Maliyet: #Y 100 Kültürel Direktif#!"
 ve_national_curriculum_short:0 "Ülke çapında bir okul reformu.\n#P +20 Direktif, +5 Uyum#!, ardındansa daha iyi eğitim."
 ve_national_curriculum_desc:0 "#header Ulusal Müfredat#!\nTüm ülkede yürütülen bir okul reformu.\n\n#Y Maliyet#!\n#Y 100 Kültürel Direktif#!, derhal ödenir\n\n#Y Tamamlandığında#!\n#P +20 Kültürel Direktif, +5 Ulusal Uyum#!\n\n#Y Ardından geçen 10 yıl boyunca#!\n#P +%2 Eğitime Erişim, +%5 Nitelikler#!\n#N -25 Bürokrasi#!"
 ve_national_curriculum_requirements_tt:0 "#Y 100 Kültürel Direktif#!, aktif bir Kültürel Proje olmamasını ve Proje Tepkisi bulunmamasını gerektirir. Ayrıca önceki #Y Ulusal Müfredat#! faydası aktifken başlatılamaz."
 ve_shared_symbols_name:0 "Ortak Simgeler"
 ve_shared_symbols_cost:0 "Maliyet: #Y 75 Kültürel Direktif#!"
 ve_shared_symbols_short:0 "Bayraklar, marşlar ve kamusal tören.\n#P +20 Direktif, +7 Uyum#!, ardındansa sadıklar ve Otorite."
 ve_shared_symbols_desc:0 "#header Ortak Simgeler#!\nTüm ülkede teşvik edilen bayraklar, marşlar ve kamusal tören.\n\n#Y Maliyet#!\n#Y 75 Kültürel Direktif#!, derhal ödenir\n\n#Y Tamamlandığında#!\n#P +20 Kültürel Direktif, +7 Ulusal Uyum#!\n\n#Y Ardından geçen 8 yıl boyunca#!\n#P +%10 Tamamen Kabul Gören Toplumlardan Sadıklar, +25 Otorite#!"
 ve_shared_symbols_requirements_tt:0 "#Y 75 Kültürel Direktif#!, aktif bir Kültürel Proje olmamasını ve Proje Tepkisi bulunmamasını gerektirir. Ayrıca önceki #Y Ortak Simgeler#! faydası aktifken başlatılamaz."
 ve_ethnic_campaign_name:0 "Etnik Bütünleşme Kampanyası"
 ve_ethnic_campaign_cost:0 "Maliyet: #Y 125 Kültürel Direktif#!"
 ve_ethnic_campaign_short:0 "Bir Vilayetteki büyük bir azınlığı asimile edin.\n#P +25 Direktif, +8 Uyum#!, ancak radikaller yaratır."
 ve_ethnic_campaign_desc:0 "#header Etnik Bütünleşme Kampanyası#!\nTek bir Vilayette, o Vilayetin nüfusunun en az #Y %5#!'ini oluşturması gereken en büyük ana kültür dışı azınlığa karşı yürütülür.\n\n#Y Maliyet#!\nDerhal ödenen #Y 125 Kültürel Yetki#!\n\n#Y Tamamlandığında#!\nHedef kültürün #Y %5#!'ini (Milliyetçi VII ile #Y %7#!'ini) bir ana kültüre asimile eder\n#P +25 Kültürel Yetki, +8 Ulusal Uyum#!\nVilayette #Y 10 yıllık#! bir asimilasyon programı bırakır\n\n#Y Uyarı#!\n#N Projenin hem başlatılması hem de bitirilmesi hedef kültür arasında radikaller yaratır.#!"
 ve_civic_initiative_name:0 "Eşit Yurttaşlık Girişimi"
 ve_civic_initiative_cost:0 "Maliyet: #Y 100 Kültürel Yetki#!"
 ve_civic_initiative_short:0 "Bir Vilayette bir azınlığın Kabul seviyesini artırın.\n#P +25 Yetki, +10 Uyum#! ve sadıklar kazanın."
 ve_civic_initiative_desc:0 "#header Eşit Yurttaşlık Girişimi#!\nTek bir Vilayette, o Vilayetin nüfusunun en az #Y %5#!'ini oluşturması gereken en büyük ana kültür dışı azınlığa karşı yürütülür.\n\n#Y Maliyet#!\nDerhal ödenen #Y 100 Kültürel Yetki#!\n\n#Y Tamamlandığında#!\n#P 10 yıllığına o kültür için +15 Kabul#!\nHedef Vilayette sadıklar\n#P +25 Kültürel Yetki, +10 Ulusal Uyum#!\nOn yıllık gelişmiş Nitelikler ve Göç Cazibesi"
 ve_composite_compact_name:0 "Bileşen Uzlaşması"
 ve_composite_compact_cost:0 "Maliyet: #Y 150 Kültürel Yetki#! ve #Y 40 Uyum#!"
 ve_composite_compact_short:0 "Bir azınlığı bileşen kültür olarak tanıyın.\nKalıcı olarak #P +30 Yetki, +12 Uyum#!."
 ve_composite_compact_desc:0 "#header Bileşen Uzlaşması#!\nTek bir Vilayette, o Vilayetin nüfusunun en az #Y %5#!'ini oluşturan tanınmayan ana kültür dışı bir azınlığa karşı yürütülür.\n\n#Y Maliyet#!\nDerhal ödenen #Y 150 Kültürel Yetki#! ve en az #Y 40 Ulusal Uyum#!\n\n#Y Tamamlandığında#!\n#P O kültür için kalıcı olarak +15 Kabul#!\nOnu bileşen kültür olarak tanır\nHedef Vilayette sadıklar\n#P +30 Kültürel Yetki, +12 Ulusal Uyum#!"
 ve_targeted_project_start_instruction:0 "#Y Nasıl başlatılır#!\n1. Kendi Vilayetlerinizden birini açın.\n2. O Vilayetin panelinde #Y Proje Başlat#! tuşuna basın.\nHedef kültür ve eksik kalan diğer unsurlar o düğmenin ipucunda listelenir."
 ve_targeted_project_state_requirements_tt:0 "Vilayet bize ait olmalı ve nüfusunun en az #Y %5#!'ini içeren uygun bir ana kültür dışı azınlık barındırmalıdır. Uygun kültürlerin en büyüğü hedef haline gelir. Bu Vilayette halihazırda tamamlanmış bir kültür tekrar hedef alınamaz, ancak başka bir Vilayette hedef alınabilir. Mevcut Kimlik Modelinin maliyeti ve Gereksinimleri de karşılanmalıdır."
 ve_targeted_cultural_project_target:0 "Hedef: #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#! içindeki #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Kapsam: #Y Tüm Ülke#!"
 ve_no_cultural_project_target:0 "Proje hedefi yok"
 ve_no_active_cultural_project:0 "Aktif Kültürel Proje Yok"

