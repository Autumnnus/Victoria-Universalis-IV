l_turkish:
 SULIUS_LEGITIMACY_LEVEL_ACTIVE_TOOLTIP:0 "#tooltip_header [concept_legitimacy] \n[LegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\n$LEGITIMACY_LEVEL_BOUNDS_DESC$\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\nEtkiler:#indent_newline:2 \n[LegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\nBunun sebebi:#indent_newline:2 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 SULIUS_CAPITAL_MONEY:0 "#tooltip_header [concept_money]#!\nBakiye: #variable @money![AccessPlayer.PredictWeeklyBalance|D=+]#![GetPlayer.GetPowerDeltaIcon('money')]\n[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.GetPrincipal, '(CFixedPoint)0'), 'CREDIT_DESC', 'GOLD_RESERVES_DESC')]\nAltın Rezervi Sınırı: @money![GetPlayer.GetGoldReserveLimit|Dv]#!#![SelectLocalization(GetMetaPlayer.GetPlayedOrObservedCountry.IsValid, 'CAPITAL_MONEY_DELAYED', 'OBSERVER_NO_COUNTRY_SELECTED') ]"
 
 SULIUS_RESEARCH:0 "#tooltip_header [concept_technology]#!\n[SelectLocalization( GetPlayer.GetCurrentlyResearchedTechnology.IsValid, 'SULIUS_RESEARCHING', 'SULIUS_NOT_RESEARCHING' )]\n$TOOLTIP_DELIMITER$\n#V Teknoloji İlerlemesi#!\n#help [concept_innovation] Ögesinden: @innovation![GetPlayer.GetWeeklyInnovation|+0]\n[concept_technology_spread] Ögesinden: [GetPlayer.GetWeeklyTechnologySpreadForTechDesc(GetPlayer.GetCurrentlyResearchedTechnology.Self)]\n$TOOLTIP_DELIMITER$\n#V [concept_innovation]#!\nHer hafta şu kadar #v @innovation![GetPlayer.GetWeeklyInnovation|+2]#! [concept_innovation] üretiyoruz:\n[GetPlayer.GetWeeklyInnovationDesc]\n\nAktif araştırmaya her hafta en fazla @innovation![GetPlayer.GetWeeklyMaxInnovation|v2] [concept_innovation] yatırılabilir:\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\nYatırım sınırları veya aktif araştırma eksikliği nedeniyle harcanmayan tüm [concept_innovation], ülkemize [concept_technology_spread] oranını artıracaktır"
 SULIUS_RESEARCHING:0 "[GetPlayer.GetName] şu anda [GetPlayer.GetCurrentlyResearchedTechnology.GetName] araştırmasını yürütüyor#!\nİlerleme: #v @innovation! [GetPlayer.GetCurrentlyResearchedTechnology.GetProgress(GetPlayer.Self)|D]#! / #maximum [GetPlayer.GetCurrentlyResearchedTechnology.GetCost(GetPlayer.Self)|D]#! ([GetPlayer.GetCurrentlyResearchedTechnology.GetTimeLeftDesc( GetPlayer.Self )] kaldı)"
 SULIUS_NOT_RESEARCHING:0 "[GetPlayer.GetName] şu anda aktif olarak herhangi bir şey araştırmıyor."
