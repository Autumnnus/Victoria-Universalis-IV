l_turkish:
 ve_splendor:0 "#tooltippable_name Çağ İvmesi: "
 ve_age_of_victoria_title:0 "Sanayi ve Uluslar"
 ve_age_of_victoria_desc:0 "Eski düzenler fabrikalar, demiryolları, okuryazar kamular ve modern devlet ile karşı karşıya geliyor. İvme, miras kalan kurumları kalıcı ulusal kapasiteye dönüştüren ülkelerin elindedir."
 ve_imperialism_age_title:0 "İmparatorluk ve Kitle Toplumu"
 ve_imperialism_age_desc:0 "Sanayi kıtalara yayılırken eğitim, kamu kurumları ve organize ordular kitle toplumunu yeniden şekillendiriyor. Üstün güçler dışarıda genişleyebilir; daha küçük devletler egemenlik ve iç kalkınma yoluyla refaha erebilir."
 ve_great_wars_age_title:0 "Kitle Siyaseti ve Topyekûn Harp"
 ve_great_wars_age_desc:0 "Elektrik, petrol, kitle katılımı, refah ve endüstriyel savaş, devlet ile toplum arasındaki ilişkiyi dönüştürüyor. Hayatta kalma artık ordular kadar kurumlarına da bağlıdır."
 ve_age_notify_option:0 "Yeni bir çağ başlıyor."
 ve_victorian_age_icon_p_tt:0 "#P Sanayi ve Uluslar (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Sanayi ve Uluslar (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P İmparatorluk ve Kitle Toplumu (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N İmparatorluk ve Kitle Toplumu (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Kitle Siyaseti ve Topyekûn Harp (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Kitle Siyaseti ve Topyekûn Harp (1906–1936)"

 ve_golden_age:0 "Altın Çağ"
 ve_golden_age_industrial:0 "Sanayi Altın Çağı"
 ve_golden_age_cultural:0 "Kültürel Altın Çağ"
 ve_golden_age_strategic:0 "Stratejik Altın Çağ"
 ve_golden_age_tt:0 "Mevcut çağda #v 5 farklı hedefi#! tamamladıktan sonra #v 1845#! yılından itibaren kullanılabilir. Bir ülke tüm oyun boyunca yalnızca bir Altın Çağ seçebilir; etkileri #v 15 yıl#! sürer."
 ve_golden_age_requirement_unused:0 "Bu kampanya sırasında hiçbir Altın Çağ seçilmemiştir."
 ve_golden_age_requirement_year:0 "#v 1845#! veya sonraki bir yıl gerektirir."
 ve_golden_age_requirement_objectives:0 "Mevcut çağda en az #v 5 farklı hedefi#! tamamlayın."
 ve_golden_age_industrial_tt:0 "#header Sanayi Altın Çağı#!\n#Y 15 yıl#! boyunca: #P +%10 İmalat Üretim Hacmi#! ve #P +%10 Kaynak Keşfetme İhtimali#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Kültürel Altın Çağ#!\n#Y 15 yıl#! boyunca: #P +%5 Eğitime Erişim#! ve #P +%10 Prestij#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Stratejik Altın Çağ#!\n#Y 15 yıl#! boyunca: #P +%5 Ordu Saldırı#! ve #P -%10 gelen Savaş Bitkinliği#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Çağ Hedefleri"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Sanayi Atılımı"
 ve_victorian_age_obj_desc_1:0 "Köylü payını %40'ın altına düşürün."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Eski Düzenine Son Verin"
 ve_victorian_age_obj_desc_2:0 "Köleliği yasaklayın ve serfliği lağvedin."
 ve_victorian_age_obj_title_3:0 "#tooltip_header İşlevsel Devlet"
 ve_victorian_age_obj_desc_3:0 "Yaklaşan bir kıtlık olmaksızın en az 70 meşruluk ve negatif olmayan bir bürokrasi bilançosu koruyun."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Eğitimli Kamu"
 ve_victorian_age_obj_desc_4:0 "%50 okuryazarlığa veya 3. seviye Okullara ulaşın."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Bütünleşik Pazar"
 ve_victorian_age_obj_desc_5:0 "Nüfusu 5 milyonun altındaysa en az 3 Demiryolu seviyesine, aksi takdirde 6 Demiryolu seviyesine sahip olun."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Ulusal Uyanış"
 ve_victorian_age_obj_desc_6:0 "En az 65 meşruluk ve %5'ten az ülke kargaşası ile bağımsız olun."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Küresel Erişim"
 ve_victorian_age_obj_desc_7:0 "Büyük veya Üstün Güç olun veya en az 5 ilan edilmiş ilgi koruyun."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Endüstriyel Güç"
 ve_imperialism_age_obj_desc_1:0 "£100 milyon GSYH'ye ulaşın veya köylü payını %25'in altına düşürün."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Kitlesel Eğitim"
 ve_imperialism_age_obj_desc_2:0 "%65 okuryazarlığa veya 4. seviye Okullara ulaşın."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header İmparatorluk veya Egemenlik"
 ve_imperialism_age_obj_desc_3:0 "En az 2 egemenlik altındaki ülkeye sahip olun veya bağımsız ve tanınmış kalın."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Küresel Ticaret"
 ve_imperialism_age_obj_desc_4:0 "Nüfus 10 milyonun altındaysa 2 Liman seviyesine sahip olun, aksi takdirde 10 Liman seviyesine sahip olun veya 5 ilan edilmiş ilgi koruyun."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Ulus İnşası"
 ve_imperialism_age_obj_desc_5:0 "En az 60 meşruluk ve %5'ten az ülke kargaşası koruyun."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header Sosyal Soru"
 ve_imperialism_age_obj_desc_6:0 "Sağlık Sistemi, İşyeri Güvenliği veya Sosyal Güvenlik'i 2. seviyeye yükseltin."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Modern Silahlı Kuvvetler"
 ve_imperialism_age_obj_desc_7:0 "Ordu içinde en az %50 Sayar veya Siper Piyadesi ve %10 Mobil Topçu konuşlandırın."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Kitlesel Siyaset"
 ve_great_wars_age_obj_desc_1:0 "Evrensel Oy Hakkı veya Konsey Cumhuriyeti'ni çıkarın ya da Parlamenter veya Başkanlık Sistemli Cumhuriyet olarak 75 meşruluk koruyun."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Sosyal Devlet"
 ve_great_wars_age_obj_desc_2:0 "Sağlık, Sosyal Güvenlik, İşyeri Güvenliği ve Okullar arasında en az iki adet 3. seviye kurum koruyun."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Elektrikli Ekonomi"
 ve_great_wars_age_obj_desc_3:0 "Nüfus 10 milyonun altındaysa 1 Enerji Santrali seviyesine, aksi takdirde 5 Enerji Santrali seviyesine sahip olun."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Petrol ve Motorlar"
 ve_great_wars_age_obj_desc_4:0 "Bir Petrol Sondaj Kulesine veya en az 5 Motor Sanayi seviyesine sahip olun."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Modern Ordu"
 ve_great_wars_age_obj_desc_5:0 "Ordu içinde en az %50 Siper veya Müfreze Piyadesi ve %15 Şarapnel Topçusu konuşlandırın."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Toplam Savaş Kapasitesi"
 ve_great_wars_age_obj_desc_6:0 "40 ordu birimi ile en az 5 Silah Sanayi veya 3 Mühimmat Fabrikası seviyesi koruyun."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Dünya Nüfuzu"
 ve_great_wars_age_obj_desc_7:0 "Bir Üstün Güç veya Büyük Güç olun, bir Ülkeler Bloku yönetin veya en az 6 ilan edilmiş ilgi koruyun."

 ve_age_splendor_tt:0 "#title Çağ İvmesi#!\nMevcut stok: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nMemnun hedefler: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nFikir Grupları (mevcut Çağ, en fazla +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nAylık değişim: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nBu çağda tamamlanan farklı hedefler: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nBu çağda satın alınan ödüller: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nSonraki ödül maliyeti: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Fikir Grupları Nasıl Katkıda Bulunur#!\nEşleşen herhangi bir IV. seviye grup, yalnızca atandığı Çağ güncelken ayda #P +1#! verir. Yukarıdaki satır, en fazla #Y +2#! ile sınırlandırılmış aktif toplamı gösterir.\n#P 1. Çağ#!: Sanayi, ticaret, yönetim ve akademik gruplar\n#P 2. Çağ#!: kaynaklar, toplum, diplomasi, milliyetçi/reformcu ve koloni gruplar\n#P 3. Çağ#!: ordu ve savaş ekonomisi grupları\n\nŞu anda memnun olan her hedef ayrıca ayda #P +1#! Çağ İvmesi sağlar. Fikir Grupları, hedef tamamlama durumunu veya bir defaya mahsus #P +50#! ödülünü değiştirmez.\n\nÖdül maliyetleri her çağ içinde tırmanır: #Y 200, 300, 400, 500#!, ardından sonraki her ödül için #Y 600#!. İvme ve maliyet basamağı yeni bir çağ başladığında sıfırlanır."
 ve_age_obj_efct_tt:0 "Memnun olduğu sürece: #P Ayda +1 Çağ İvmesi#!\nBu çağdaki ilk tamamlama: #P +50 Çağ İvmesi#!"
 splendor_default_bonus:0 "En az #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Çağ İvmesine sahip olun"
