l_turkish:
 ve_splendor:0 "#tooltippable_name Çağın İvmesi: "
 ve_age_of_victoria_title:0 "Sanayi ve Milletler"
 ve_age_of_victoria_desc:0 "Eski düzenler fabrikalarla, demiryollarıyla, okur-yazar halkla ve modern devletle karşı karşıyadır. Momentum, miras kalan kurumları kalıcı ulusal kapasiteye dönüştüren ülkelere aittir."
 ve_imperialism_age_title:0 "İmparatorluk ve Kitle Toplumu"
 ve_imperialism_age_desc:0 "Sanayi kıtalara ulaşırken eğitim, kamu kurumları ve organize ordular kitle toplumunu yeniden şekillendirir. Büyük güçler yurt dışına yayılabilir; küçük devletler egemenlik ve iç kalkınma yoluyla zenginleşebilirler."
 ve_great_wars_age_title:0 "Kitle Politikası ve Topyekûn Savaş"
 ve_great_wars_age_desc:0 "Elektrik, petrol, kitlesel katılım, refah ve endüstriyel savaş, devlet ile toplum arasındaki ilişkiyi dönüştürüyor. Hayatta kalmak artık ordulara olduğu kadar kurumlara da bağlı."
 ve_age_notify_option:0 "Yeni bir çağ doğuyor."
 ve_victorian_age_icon_p_tt:0 "#P Sanayi ve Milletler (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Sanayi ve Milletler (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P İmparatorluk ve Kitle Toplumu (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N İmparatorluk ve Kitle Toplumu (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Kitle Politikası ve Topyekün Savaş (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Kitle Politikası ve Topyekün Savaş (1906–1936)"

 ve_golden_age:0 "Altın Çağ"
 ve_golden_age_industrial:0 "Endüstriyel Altın Çağ"
 ve_golden_age_cultural:0 "Kültürel Altın Çağ"
 ve_golden_age_strategic:0 "Stratejik Altın Çağ"
 ve_golden_age_tt:0 "Şu adresten edinilebilir: #v 1845#! tamamladıktan sonra #v 5 farklı hedef#! şimdiki çağda. Bir ülke tüm oyun boyunca yalnızca bir Altın Çağ seçebilir; etkileri kalıcıdır #v 15 yıl#!."
 ve_golden_age_requirement_unused:0 "Bu kampanya sırasında hiçbir Altın Çağ seçilmedi."
 ve_golden_age_requirement_year:0 "Yıl gerektirir #v 1845#! veya daha sonra."
 ve_golden_age_requirement_objectives:0 "En azından tamamlayın #v 5 farklı hedef#! içinde bulunduğumuz çağda."
 ve_golden_age_industrial_tt:0 "#header Endüstriyel Altın Çağ#!\n #Y 15 yıl için#!: #P +%10 Üretim Üretim Hızı#! ve #P +%10 Kaynak Keşfi Şansı#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Kültürel Altın Çağ#!\n #Y 15 yıl için#!: #P +%5 Eğitim Erişimi#! ve #P +%10 Prestij#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Stratejik Altın Çağ#!\n #Y 15 yıl boyunca#!: #P +%5 Ordu Saldırısı#! ve #P -%10 Kayıplardan Kaynaklanan Savaş Yorgunluğu#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Yaş Hedefleri"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Endüstriyel Kalkış"
 ve_victorian_age_obj_desc_1:0 "Köylü payını %40'ın altına indirin."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Eskiyi Sonlandırın Düzenleyin "
 ve_victorian_age_obj_desc_2:0 "Köleliği yasaklayın ve serfliği kaldırın."
 ve_victorian_age_obj_title_3:0 "#tooltip_header İşlevsel Devlet"
 ve_victorian_age_obj_desc_3:0 "Yaklaşan bir kıtlık olmadan en az 70 meşruiyeti ve negatif olmayan bir bürokrasi dengesini koruyun."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Eğitimli Halk"
 ve_victorian_age_obj_desc_4:0 "%50 okuryazarlığa veya 3. seviyeye ulaşın."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Entegre Pazar"
 ve_victorian_age_obj_desc_5:0 "5 milyonun altındaysa en az 3 Demiryolu seviyesine veya 6 Demiryolu seviyesine sahip olun aksi takdirde."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Ulusal Uyanış"
 ve_victorian_age_obj_desc_6:0 "En az 65 meşruiyet ve %5'ten daha az ülke çalkantısıyla bağımsız olun."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Küresel Erişim"
 ve_victorian_age_obj_desc_7:0 "Büyük veya Büyük Güç olun veya ilan edilmiş en az 5 çıkarı sürdürün."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Endüstriyel Güç"
 ve_imperialism_age_obj_desc_1:0 "100 milyon £ GSYH'ye ulaşın veya köylü payını %25'in altına düşürün."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Kitlesel Eğitim"
 ve_imperialism_age_obj_desc_2:0 "%65 okuryazarlığa veya seviye 4'e ulaşın Okullar."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header İmparatorluk veya Egemenlik"
 ve_imperialism_age_obj_desc_3:0 "En az 2 tebaaya sahip olun veya bağımsız ve tanınmış kalın."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Küresel Ticaret"
 ve_imperialism_age_obj_desc_4:0 "10 milyonun altında nüfus varsa 2 Liman seviyesine sahip olun, aksi halde 10 Liman seviyesine sahip olun veya ilan edilmiş 5 çıkarı sürdürün."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Ulus İnşası"
 ve_imperialism_age_obj_desc_5:0 "En az 60 meşruiyeti ve %5'ten az ülke kargaşasını koruyun."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header Sosyal Soru"
 ve_imperialism_age_obj_desc_6:0 "Sağlık Sistemini Yükseltin, İşyeri Güvenliği veya Sosyal Güvenlik 2. seviyeye kadar."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Modern Silahlı Kuvvetler"
 ve_imperialism_age_obj_desc_7:0 "Orduda en az %50 Çatışma veya Hendek Piyadesi ve %10 Mobil Topçu bulundurun."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Kitle Politikası"
 ve_great_wars_age_obj_desc_1:0 "Genel Oy Hakkını veya Konsey Cumhuriyeti'ni yürürlüğe koyun veya Parlamenter veya Cumhurbaşkanlığı Cumhuriyeti olarak 75 meşruiyetini sürdürün."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Sosyal Devlet"
 ve_great_wars_age_obj_desc_2:0 "Sağlık, Sosyal ve Sosyal Güvenlik arasında en az iki 3. düzey kurumu sürdürün Güvenlik, İşyeri Güvenliği ve Okullar."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Elektrikli Ekonomi"
 ve_great_wars_age_obj_desc_3:0 "Nüfusu 10 milyonun altındaysa 1 Enerji Santrali seviyesine veya aksi takdirde 5 Enerji Santrali seviyesine sahip olun."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Petrol ve Motorlar"
 ve_great_wars_age_obj_desc_4:0 "Bir Petrol Platformuna veya en az 5 Motor Endüstrisi seviyesine sahip olun."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Modern Askeri"
 ve_great_wars_age_obj_desc_5:0 "Orduda en az %50 Siper veya Manga Piyadesi ve %15 Şarapnel Topçusu."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Toplam Savaş Kapasitesi"
 ve_great_wars_age_obj_desc_6:0 "40 ordu birimi ve en az 5 Silah Endüstrisi veya 3 Mühimmat Fabrikası seviyeleri."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Dünya Nüfuzu"
 ve_great_wars_age_obj_desc_7:0 "Büyük veya Büyük Güç olun, bir Güç Bloğuna liderlik edin veya ilan edilmiş en az 6 ilgi alanını sürdürün."

 ve_age_splendor_tt:0 "#title Era Momentum#!\nMevcut stok: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nMemnun edilen hedefler: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nFikir Grupları (mevcut Yaş, maksimum +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nAylık değişim: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nBu yaşta tamamlanan farklı hedefler: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nBu yaşta satın alınan ödüller: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nSonraki ödülün maliyeti: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Fikir Grupları nasıl katkıda bulunur#!\nEşleşen herhangi bir IV. düzey grup, #P +1 verir#! yalnızca atanan Yaşı geçerli olduğu sürece ayda bir. Yukarıdaki satır, üst limiti #Y +2#! olan aktif toplamı göstermektedir.\n#P 1. Yaş#!: Sanayi, ticaret, yönetim ve akademik gruplar\n#P 2. Yaş#!: kaynaklar, toplum, diplomasi, milliyetçi/reformist ve sömürgeci gruplar\n#P Yaş 3#!: askeri ve savaş ekonomisi grupları\n\nŞu anda karşılanan her hedef aynı zamanda #P +1 verir#! Aylık Era Momentumu. Fikir Grupları hedef tamamlamayı veya tek seferlik  #P +50#! ödülünü değiştirmez.\n\nÖdül maliyetleri her yaşta artar: #Y 200, 300, 400, 500#!, Daha sonra #Y 600#! sonraki her ödül için. Yeni bir çağ başladığında ivme ve maliyet merdiveni sıfırlanır."
 ve_age_obj_efct_tt:0 "Memnun kaldığınızda: #P +1 Aylık Era Momentumu#!\nBu yaştaki ilk tamamlama: #P +50 Era Momentumu#!"
 splendor_default_bonus:0 "En azından #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Era Momentum'a sahip olun"
