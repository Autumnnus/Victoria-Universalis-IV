l_turkish:
 ve_splendor:0 "#tooltippable_name Çağ Momentumu: "
 ve_age_of_victoria_title:0 "Sanayi ve Uluslar"
 ve_age_of_victoria_desc:0 "Eski düzenler fabrikalar, demiryolları, okuryazar halklar ve modern devletle yüzleşir. Momentum, miras aldığı kurumları kalıcı ulusal kapasiteye dönüştüren ülkelerindir."
 ve_imperialism_age_title:0 "İmparatorluk ve Kitle Toplumu"
 ve_imperialism_age_desc:0 "Sanayi kıtalar boyunca yayılırken eğitim, kamu kurumları ve örgütlü ordular kitle toplumunu dönüştürür. Büyük güçler dışarıya açılabilir; küçük devletler egemenliklerini ve iç gelişimlerini koruyarak zenginleşebilir."
 ve_great_wars_age_title:0 "Kitle Siyaseti ve Topyekûn Savaş"
 ve_great_wars_age_desc:0 "Elektrik, petrol, kitlesel katılım, refah ve sanayi savaşı devlet ile toplum arasındaki ilişkiyi dönüştürür. Hayatta kalmak artık ordular kadar kurumlara da bağlıdır."
 ve_age_notify_option:0 "Yeni bir çağ doğuyor."
 ve_victorian_age_icon_p_tt:0 "#P Sanayi ve Uluslar (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Sanayi ve Uluslar (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P İmparatorluk ve Kitle Toplumu (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N İmparatorluk ve Kitle Toplumu (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Kitle Siyaseti ve Topyekûn Savaş (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Kitle Siyaseti ve Topyekûn Savaş (1906–1936)"

 ve_golden_age:0 "Altın Çağ"
 ve_golden_age_industrial:0 "Sanayi Altın Çağı"
 ve_golden_age_cultural:0 "Kültürel Altın Çağ"
 ve_golden_age_strategic:0 "Stratejik Altın Çağ"
 ve_golden_age_tt:0 "Mevcut çağda #v 5 farklı objective#! tamamlandıktan sonra, #v 1845#! yılından itibaren kullanılabilir. Her ülke tüm oyun boyunca yalnızca bir Altın Çağ seçebilir; etkileri #v 15 yıl#! sürer."
 ve_golden_age_requirement_unused:0 "Bu oyun boyunca henüz bir Altın Çağ seçilmedi."
 ve_golden_age_requirement_year:0 "Yıl en az #v 1845#! olmalıdır."
 ve_golden_age_requirement_objectives:0 "Mevcut çağda en az #v 5 farklı objective#! tamamlayın."
 ve_golden_age_industrial_tt:0 "#header Sanayi Altın Çağı#!\n#Y 15 yıl#! boyunca: #P +%10 İmalat Verimi#! ve #P +%10 Kaynak Keşif Şansı#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Kültürel Altın Çağ#!\n#Y 15 yıl#! boyunca: #P +%5 Eğitim Erişimi#! ve #P +%10 Prestij#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Stratejik Altın Çağ#!\n#Y 15 yıl#! boyunca: #P +%5 Ordu Taarruzu#! ve #P -%10 Zayiat Kaynaklı Savaş Yorgunluğu#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Çağ Objective'leri"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Sanayi Atılımı"
 ve_victorian_age_obj_desc_1:0 "Köylü oranını %40'ın altına düşürün."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Eski Düzenin Sonu"
 ve_victorian_age_obj_desc_2:0 "Köleliği yasaklayın ve serfliği kaldırın."
 ve_victorian_age_obj_title_3:0 "#tooltip_header İşleyen Devlet"
 ve_victorian_age_obj_desc_3:0 "Yaklaşan açık olmadan en az 70 Meşruiyet ve negatif olmayan Bürokrasi dengesi sağlayın."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Eğitimli Halk"
 ve_victorian_age_obj_desc_4:0 "%50 Okuryazarlığa veya Seviye 3 Okullara ulaşın."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Bütünleşik Pazar"
 ve_victorian_age_obj_desc_5:0 "Nüfusunuz 5 milyonun altındaysa en az 3, aksi halde en az 6 Demiryolu Seviyesine sahip olun."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Ulusal Uyanış"
 ve_victorian_age_obj_desc_6:0 "Bağımsız olun; en az 65 Meşruiyet ve %5'in altında ülke kargaşası koruyun."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Küresel Erişim"
 ve_victorian_age_obj_desc_7:0 "Büyük Güç veya Major Güç olun ya da en az 5 ilan edilmiş çıkar alanı koruyun."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Sanayi Gücü"
 ve_imperialism_age_obj_desc_1:0 "£100 milyon GSYİH'ye ulaşın veya köylü oranını %25'in altına düşürün."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Kitle Eğitimi"
 ve_imperialism_age_obj_desc_2:0 "%65 Okuryazarlığa veya Seviye 4 Okullara ulaşın."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header İmparatorluk veya Egemenlik"
 ve_imperialism_age_obj_desc_3:0 "En az 2 tebaaya sahip olun ya da bağımsız ve tanınmış kalın."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Küresel Ticaret"
 ve_imperialism_age_obj_desc_4:0 "Nüfusunuz 10 milyonun altındaysa 2, aksi halde 10 Liman Seviyesine sahip olun ya da 5 ilan edilmiş çıkar alanı koruyun."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Ulus İnşası"
 ve_imperialism_age_obj_desc_5:0 "En az 60 Meşruiyet ve %5'in altında ülke kargaşası koruyun."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header Sosyal Sorun"
 ve_imperialism_age_obj_desc_6:0 "Sağlık Sistemi, İş Yeri Güvenliği veya Sosyal Güvenliği Seviye 2'ye çıkarın."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Modern Silahlı Kuvvetler"
 ve_imperialism_age_obj_desc_7:0 "Orduda en az %50 Çatışma veya Siper Piyadesi ile %10 Mobil Topçu bulundurun."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Kitle Siyaseti"
 ve_great_wars_age_obj_desc_1:0 "Evrensel Oy Hakkı veya Konsey Cumhuriyetini yürürlüğe koyun; ya da Parlamenter/Başkanlık Cumhuriyetinde 75 Meşruiyet koruyun."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Sosyal Devlet"
 ve_great_wars_age_obj_desc_2:0 "Sağlık, Sosyal Güvenlik, İş Yeri Güvenliği ve Okullar arasından en az ikisini Seviye 3'te tutun."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Elektrikli Ekonomi"
 ve_great_wars_age_obj_desc_3:0 "Nüfusunuz 10 milyonun altındaysa 1, aksi halde 5 Elektrik Santrali Seviyesine sahip olun."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Petrol ve Motorlar"
 ve_great_wars_age_obj_desc_4:0 "Bir Petrol Kuyusuna veya en az 5 Motor Endüstrisi Seviyesine sahip olun."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Modern Ordu"
 ve_great_wars_age_obj_desc_5:0 "Orduda en az %50 Siper veya Manga Piyadesi ile %15 Şarapnel Topçusu bulundurun."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Topyekûn Savaş Kapasitesi"
 ve_great_wars_age_obj_desc_6:0 "40 ordu birimi ile en az 5 Silah Endüstrisi veya 3 Mühimmat Fabrikası Seviyesi koruyun."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Dünya Nüfuzu"
 ve_great_wars_age_obj_desc_7:0 "Major veya Büyük Güç olun, bir Güç Bloğuna liderlik edin ya da en az 6 ilan edilmiş çıkar alanı koruyun."

 ve_age_splendor_tt:0 "#title Çağ Momentumu#!\nMevcut stok: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nKarşılanan hedefler: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nFikir Grupları (mevcut Çağ, en fazla +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nAylık değişim: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nBu çağda tamamlanan farklı hedefler: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nBu çağda satın alınan ödüller: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nSonraki ödül maliyeti: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\nKarşılanan her hedef aylık #P +1#! Çağ Momentumu verir. Mevcut Çağla eşleşen her IV. seviye Fikir Grubu aylık #P +1#! verir; toplamı #Y +2#! ile sınırlıdır. Fikir Grupları hedef tamamlanmasını veya bir defalık #P +50#! ödülünü değiştirmez.\n\nÖdül maliyetleri her çağda sırasıyla #Y 200, 300, 400, 500#!; sonrasındaki her ödül için #Y 600#! olur. Momentum ve maliyet basamağı yeni çağda sıfırlanır."
 ve_age_obj_efct_tt:0 "Karşılandığı sürece: aylık #P +1 Çağ Momentumu#!\nBu çağdaki ilk tamamlanma: #P +50 Çağ Momentumu#!"
 splendor_default_bonus:0 "En az #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Çağ Momentumu bulundurun"
 ve_age_1_bonus_10_tt:0 "Kuzey İtalyan veya Güney İtalyan birincil kültürü gerektirir."
 ve_age_2_bonus_10_tt:0 "Avusturya olmayı gerektirir."
 ve_age_3_bonus_10_tt:0 "Büyük Britanya olmayı gerektirir."
 ve_age_1_bonus_11_tt:0 "Kuzey Alman veya Güney Alman birincil kültürü gerektirir."
 ve_age_2_bonus_11_tt:0 "Rusya olmayı gerektirir."
 ve_age_3_bonus_11_tt:0 "Qing olmayı gerektirir."
 ve_age_1_bonus_12_tt:0 "Hollanda olmayı gerektirir."
 ve_age_2_bonus_12_tt:0 "Belçika olmayı gerektirir."
 ve_age_3_bonus_12_tt:0 "Fransa olmayı gerektirir."
 ve_age_1_bonus_13_tt:0 "Osmanlı İmparatorluğu olmayı gerektirir."
 ve_age_2_bonus_13_tt:0 "Amerika Birleşik Devletleri olmayı gerektirir."
 ve_age_3_bonus_13_tt:0 "Japonya olmayı gerektirir."
