l_turkish:
 ve_je_religious_settlement_transition:0 "Dinî Uzlaşı Geçişi"
 ve_je_religious_settlement_transition_reason:0 "Kilise ile devletin hukuki uzlaşısı değişti. Geçiş krizi yürürlükte kalmaya devam ederken Kurumlar, topluluklar ve memurlar duruma uyum sağlamak zorundadır. Bu Günlük Girdisi'nin takvimi değil, kriz etkeni esastır."
 ve_je_religious_settlement_transition_complete_tt:0 "Dinî Uzlaşı geçiş krizi sona erdi."
 ve_je_religious_settlement_transition_status_confessional:0 "Hedef uzlaşı: #Y Devlet Dini Düzeni#!\nDinî Uzlaşı: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTahmini kalan süre: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] ay#!\nTamamlanan dönüm noktaları: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nKriz sona erdiğinde sonuç: #Y 60+#! uzlaşı erken istikrar kazanır, #Y 26-59#! tarafsız şekilde çözümlenir, #Y 25 ve altı#! krize dönüşür. Kalan her dönüm noktası Dinî Uzlaşı'yı etkileyen bir seçim sunar."
 ve_je_religious_settlement_transition_status_freedom:0 "Hedef uzlaşı: #Y Vicdan Özgürlüğü#!\nDinî Uzlaşı: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTahmini kalan süre: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] ay#!\nTamamlanan dönüm noktaları: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nKriz sona erdiğinde sonuç: #Y 60+#! uzlaşı erken istikrar kazanır, #Y 26-59#! tarafsız şekilde çözümlenir, #Y 25 ve altı#! krize dönüşür. Kalan her dönüm noktası Dinî Uzlaşı'yı etkileyen bir seçim sunar."
