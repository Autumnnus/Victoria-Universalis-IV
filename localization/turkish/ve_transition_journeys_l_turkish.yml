 ve_je_religious_settlement_transition_status_atheism:0 "Hedef uzlaşı: #Y Devlet Ateizmi#!\nDinî Uzlaşı: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTahmini kalan süre: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] ay#!\nTamamlanan dönüm noktaları: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nKriz sona erdiğinde sonuç: #Y 60+#! uzlaşı erken istikrar kazanır, #Y 26-59#! tarafsız şekilde çözümlenir, #Y 25 ve altı#! krize dönüşür. Kalan her dönüm noktası Dinî Uzlaşı'yı etkileyen bir seçim sunar."

 ve_je_national_compact_transition:0 "Ulusal Sözleşme Geçişi"
 ve_je_national_compact_transition_reason:0 "Devlet, ulusal aidiyetin yeni bir tanımını benimsemiştir. Geçiş tepkisi yürürlükte kalmaya devam ederken yöneticiler, seçkinler ve topluluklar bu sözleşmeyi müzakere etmek zorundadır. Bu Günlük Girdisi'nin takvimi değil, tepki etkeni esastır."
 ve_je_national_compact_transition_complete_tt:0 "Ulusal Sözleşme geçiş tepkisi sona erdi."
 ve_je_national_compact_transition_status_ethnic:0 "Hedef kimlik: #Y Etnik Kimlik#!\nUlusal Uyum: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTahmini kalan süre: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] ay#!\nTamamlanan dönüm noktaları: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nTepki sona erdiğinde sonuç: #Y 60+#! uyum erken istikrar kazanır, #Y 26-59#! tarafsız şekilde çözümlenir, #Y 25 ve altı#! krize dönüşür. Kalan her dönüm noktası Ulusal Uyum'u etkileyen bir seçim sunar."
 ve_je_national_compact_transition_status_civic:0 "Hedef kimlik: #Y Yurttaşlık Kimliği#!\nUlusal Uyum: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTahmini kalan süre: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] ay#!\nTamamlanan dönüm noktaları: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nTepki sona erdiğinde sonuç: #Y 60+#! uyum erken istikrar kazanır, #Y 26-59#! tarafsız şekilde çözümlenir, #Y 25 ve altı#! krize dönüşür. Kalan her dönüm noktası Ulusal Uyum'u etkileyen bir seçim sunar."
 ve_je_national_compact_transition_status_composite:0 "Hedef kimlik: #Y Karma Kimlik#!\nUlusal Uyum: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTahmini kalan süre: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] ay#!\nTamamlanan dönüm noktaları: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nTepki sona erdiğinde sonuç: #Y 60+#! uyum erken istikrar kazanır, #Y 26-59#! tarafsız şekilde çözümlenir, #Y 25 ve altı#! krize dönüşür. Kalan her dönüm noktası Ulusal Uyum'u etkileyen bir seçim sunar."
 ve_je_transition_resolving_status:0 "Geçiş sicili, mevcut ulusal uzlaşı ile mutabık kılınıyor."

 ve_rel_transition_conciliatory_tt:0 "#N 10#! Dindarlık Reformu harca ve #P 3#! Dinî Uzlaşı kazan."
 ve_rel_transition_central_tt:0 "#P 5#! Dindarlık Reformu kazan ve #N 3#! Dinî Uzlaşı kaybet."
 ve_rel_transition_doctrine_tt:0 "#N 5#! Dindarlık Reformu harca ve #P 2#! Dinî Uzlaşı kazan."

 ve_rel_evt.210.t:0 "Dinî Atamaların Sınırları"
 ve_rel_evt.210.d:0 "Dinî otoriteler kamu görevleri için aday listeleri sunarken üst düzey yöneticiler devlet hizmetinin liyakati ödüllendirmesi gerektiğinde ısrarcı. Yeni uzlaşı kapsamındaki ilk atamalar, ruhban tavsiyesinin nerede bittiğini ve sivil otoritenin nerede başladığını belirleyecek."
 ve_rel_evt.210.a:0 "Karma bir atama kurulu toplayın."
 ve_rel_evt.210.b:0 "Dinî listeleri kabul edin."
 ve_rel_evt.210.c:0 "Standart sınavları dinî tavsiyeyle eşleştirin."

 ve_rel_evt.211.t:0 "Okullar ve Sadakat Yeminleri"
 ve_rel_evt.211.d:0 "Cemaat okulları kamusal sistemde tanınan bir yer arıyor. Bu okulların destekçileri dinî eğitimin korunmasını talep ederken yetkililer, rekabetçi müfredatların ve yeminlerin yeni nesli böleceğinden korkuyor."
 ve_rel_evt.211.a:0 "Ortak bir çekirdek müfredatı garanti edin."
 ve_rel_evt.211.b:0 "Tek bir yeknesak sadakat yemini dayatın."
 ve_rel_evt.211.c:0 "Uzlaşıyı bürokratik denetime tabi tutun."

 ve_rel_evt.220.t:0 "Azınlık Garantilerinin Dili"
 ve_rel_evt.220.d:0 "Azınlık toplulukları haklarının korunmasının açıkça yeni uzlaşıya yazılmasını istiyor. Hükümet hukukçuları ise topluluğa özel vaatlerin eski bölünmeleri sertleştirebileceği uyarısında bulunarak tek bir genel maddeyi tercih ediyor."
 ve_rel_evt.220.a:0 "Garantileri açıkça yazın."
 ve_rel_evt.220.b:0 "Tek bir yeknesak vatandaşlık maddesi kullanın."
 ve_rel_evt.220.c:0 "Reform koalisyonunun ifade üzerinde arabuluculuk yapmasına izin verin."

 ve_rel_evt.221.t:0 "Ortak Kurumlar'da Temsiliyet"
 ve_rel_evt.221.d:0 "Okullar, hastaneler ve yerel kurullar artık çeşitli mezheplerden vatandaşlara eşit şartlarda hizmet etmeli. Buradaki soru, temsiliyetin yerel gerçeklikleri mi yoksa merkezden dayatılan bir formülü mü izlemesi gerektiğidir."
 ve_rel_evt.221.a:0 "Temsiliyeti yerelde dengeleyin."
 ve_rel_evt.221.b:0 "Merkezi bir kota belirleyin."
 ve_rel_evt.221.c:0 "Diplomatik bir temsiliyet formülü müzakere edin."

 ve_rel_evt.230.t:0 "Tarafsız Sicil"
 ve_rel_evt.230.d:0 "Doğumlar, evlilikler ve mülk Hak İddiaları dinî koruyuculardan sivil memurlara devrediliyor. Yetkililer geçiş sürecinde ikili kayıtları muhafaza edebilir ancak reformcular temiz ve ani bir kopuş talep ediyor."
 ve_rel_evt.230.a:0 "Bir geçiş dönemi için ikili kayıtları sürdürün."
 ve_rel_evt.230.b:0 "Dinî sicilleri derhal kapatın."
 ve_rel_evt.230.c:0 "Eğitimli bir kamu hizmeti ağı görevlendirin."

 ve_rel_evt.231.t:0 "Okul ve Kamu Töreni"
 ve_rel_evt.231.d:0 "Devlet tarafsızlığı İlke'si okul meclislerine ve kamu törenlerine ulaştı. Yerel topluluklar miras kalan gelenekler için alan isterken merkezî yetkililer hiçbir belirsizliğe yer bırakmayan tek bir seküler protokol istiyor."
 ve_rel_evt.231.a:0 "Yerel törenler için alan bırakın."
 ve_rel_evt.231.b:0 "Tek bir seküler protokolü Direktif olarak kılın."
 ve_rel_evt.231.c:0 "Ortak bir sivil tören standardı oluşturun."

 ve_rel_evt.240.t:0 "Seküler Kadro Kıtlık"
 ve_rel_evt.240.d:0 "Yeni idarenin dinî kurumlar olmadan faaliyet gösterebilecek öğretmenlere, sicil memurlarına ve müfettişlere ihtiyacı var. Eğitilmiş aday sayısı çok az ve mevcut personeli uygulamalarını Din Değiştirmeye zorlamak direnişi tetikleyebilir."
 ve_rel_evt.240.a:0 "Yeni bir kadro eğitim programını finanse edin."
 ve_rel_evt.240.b:0 "Mevcut personeli uyum sağlamaya zorlayın."
 ve_rel_evt.240.c:0 "Akademik bir eğitim ağı inşa edin."

 ve_rel_evt.241.t:0 "Mülk ve Yeraltı İbadeti"
 ve_rel_evt.241.d:0 "Dinî mülklerin devri bazı cemaatleri göz önünden uzaklaştırdı. Acil el koyma yeni devleti hızlıca donatır ancak aceleye getirilmiş bir uzlaşı, Özel ibadeti Organize bir meydan okumaya dönüştürme riski taşır."
 ve_rel_evt.241.a:0 "Mülkü kademeli olarak devredin."
 ve_rel_evt.241.b:0 "Derhal Kamulaştır."
 ve_rel_evt.241.c:0 "Varlıkları denetimli Refah kurumlarına yönlendir."

 ve_rel_evt.290.t:0 "Bir Uzlaşı Kök Salıyor"
 ve_rel_evt.290.d:0 "Geçiş krizi, ülkenin dinî uzlaşısını bozmadan atlatıldı. İdareciler artık yeni kurallar çerçevesinde çalışıyor, topluluklar nerede durduklarını biliyor ve hükümet bu tecrübeyi ister reform kapasitesine ister daha derin bir halk kararlılığına dönüştürebilir."
 ve_rel_evt.290.a:0 "Alınan dersleri bir sonraki reforma taşı."
 ve_rel_evt.290.a.tt:0 "#P 10#! Dindarlık Reformu kazanılır."
 ve_rel_evt.290.b:0 "Uzlaşıyı halka açık şekilde yeniden teyit et."
 ve_rel_evt.290.b.tt:0 "#P 3#! Dinî Uzlaşı kazanılır."

 ve_rel_evt.291.t:0 "Kırılgan Bir Denge"
 ve_rel_evt.291.d:0 "Resmî geçiş tamamlanmıştır, ancak yeni uzlaşı bir inançtan ziyade temkinli bir pazarlık olmaya devam etmektedir. Kendi kendine olgunlaşmaya bırakılabilir, sınırlı bir imtiyazla güçlendirilebilir veya benimsenen modele uygun kurumlar aracılığıyla istikrara kavuşturulabilir."
 ve_rel_evt.291.a:0 "Uzlaşı yürürlükte kalsın."
 ve_rel_evt.291.a.tt:0 "Geçiş, ilave bir mekanik etki olmaksızın sona erer."
 ve_rel_evt.291.b:0 "Son bir uyarlamayı finanse et."
 ve_rel_evt.291.b.tt:0 "#N 10#! Dindarlık Reformu harcanır ve #P 3#! Dinî Uzlaşı kazanılır."
 ve_rel_evt.291.c:0 "Uzlaşıyı modele uygun kurumlara emanet et."
 ve_rel_evt.291.c.tt:0 "#N 5#! Dindarlık Reformu harcanır ve #P 2#! Dinî Uzlaşı kazanılır. Benimsenen Dinî Model e uygun bir Fikir gerektirir."

 ve_rel_evt.292.t:0 "Bir Uzlaşı Krizi"
 ve_rel_evt.292.d:0 "Geçiş etkeninin süresi dolmasına rağmen ülke yeni dinî düzeni kabul etmemiştir. Hükümet kıt reform kapasitesini acil bir uyarlamaya harcayabilir, daha dar kapsamlı bir müdahale için modele uygun kurumlara güvenebilir ya da çözülmemiş çatışmanın nüfusun bir kısmını radikalleştirmesine izin verebilir."
 ve_rel_evt.292.a:0 "Acil bir uyarlamanın bedelini öde."
 ve_rel_evt.292.a.tt:0 "#N 15#! Dindarlık Reformu harcanır ve #P 5#! Dinî Uzlaşı kazanılır."
 ve_rel_evt.292.b:0 "Devletin sunabileceği başka imtiyaz kalmadı."
 ve_rel_evt.292.b.tt:0 "Ülke nüfusunun #N 0.25%#! kadarı Radikal hâline gelir."
 ve_rel_evt.292.c:0 "Bu uzlaşı için inşa edilen kurumları kullan."
 ve_rel_evt.292.c.tt:0 "#N 5#! Dindarlık Reformu harcanır ve #P 2#! Dinî Uzlaşı kazanılır. Benimsenen Dinî Model e uygun bir Fikir gerektirir."

 ve_identity_transition_conciliatory_tt:0 "#N 10#! Kültürel Yetki harcanır ve #P 3#! Ulusal Uyum kazanılır."
 ve_identity_transition_central_tt:0 "#P 5#! Kültürel Yetki kazanılır ve #N 3#! Ulusal Uyum kaybedilir."
 ve_identity_transition_doctrine_tt:0 "#N 5#! Kültürel Yetki harcanır ve #P 2#! Ulusal Uyum kazanılır."

 ve_cul_evt.210.t:0 "Vilayetler'in Resmî Dili"
 ve_cul_evt.210.d:0 "Yeni ulusal kompakt, mahkemeler, okullar ve kamu hizmetleri için ortak bir dil gerektirmektedir. Derhâl tekdüzelik sağlamak idare etmek açısından kolay olurdu, ancak birçok tecrübeli memur ve vatandaş önerilen standardı henüz karşılayamamaktadır."
 ve_cul_evt.210.a:0 "Dili kademeli eğitim yoluyla tanı."
 ve_cul_evt.210.b:0 "Tek dilli bir emir yayımla."
 ve_cul_evt.210.c:0 "Milliyetçi idareyi Seferber Et."

 ve_cul_evt.211.t:0 "Hizmet ve Üyelik"
 ve_cul_evt.211.d:0 "Askerî hizmet ve gazi statüsü ulusal üyeliğin kanıtları hâline gelmektedir. Yeni kompakt altına alınan topluluklar uyum sağlamak için zaman talep ederken, merkez aidiyetin tek bir ortak Yükümlülük taşıması gerektiğini vurgulamaktadır."
 ve_cul_evt.211.a:0 "Geçiş dönemi muafiyetleri tanınsın."
 ve_cul_evt.211.b:0 "Tek bir hizmet Yükümlülük'ü uygula."
 ve_cul_evt.211.c:0 "Evrensel bir hizmet sicili oluştur."

 ve_cul_evt.220.t:0 "Eşit Vatandaşlık Sicili"
 ve_cul_evt.220.d:0 "Eski etnik ve dinî kategoriler kamu kayıtlarında yer almaya devam etmektedir. Bunları derhâl kaldırmak eşit vatandaşlığı ilan eder ancak yerel makamlar, aceleye getirilmiş bir Din Değiştirme işleminin Hak İddiaları'nı siliP hizmetlere erişimi aksatabileceği konusunda uyarmaktadır."
 ve_cul_evt.220.a:0 "Ortak bir sivil sicili aşamalı olarak devreye sok."
 ve_cul_evt.220.b:0 "Eski kategorileri derhâl kaldır."
 ve_cul_evt.220.c:0 "Din Değiştirme sürecini bir reform komisyonunun denetimine ver."

 ve_cul_evt.221.t:0 "Ortak Okul, Ortak Hizmet"
 ve_cul_evt.221.d:0 "Kanunda eşit erişim mevcuttur; ancak okullar ve kamu daireleri bunu sağlamak için gereken personelden yoksundur. Hükümet sabırlı bir yatırım, uygulanabilir tek bir merkezi standart ve ulusal bir akademik nitelikler ağı arasında seçim yapmak zorundadır."
 ve_cul_evt.221.a:0 "Öğretmenlere ve kamu çalışanları yatırım yapın."
 ve_cul_evt.221.b:0 "Tek bir merkezi standardı uygulayın."
 ve_cul_evt.221.c:0 "Akademik nitelikler ağı inşa edin."

 ve_cul_evt.230.t:0 "Asli Halklar Meclisi"
 ve_cul_evt.230.d:0 "Bileşik mutabakatta adı geçen topluluklar, yönetimininde söz sahibi olmayı talep etmektedir. Müzakereler meşruluk üretebilirken, başkentte tasarlanan sabit bir kota daha hızlı ve öngörülebilir bir uzlaşı vaat etmektedir."
 ve_cul_evt.230.a:0 "Müzakereler müzakere et."
 ve_cul_evt.230.b:0 "Başkentin sabit kotasını dayatın."
 ve_cul_evt.230.c:0 "Parlamenter bir uzlaşıya aracılık edin."

 ve_cul_evt.231.t:0 "Katmanlı Yönetim"
 ve_cul_evt.231.d:0 "Yerel otorite ve merkezi standartlar artık bileşik devlet genelinde örtüşmektedir. Net bir protokol olmadan her daire sınırı yeniden müzakere edecektir; çok katı bir komuta zinciriyle ise mutabakat anlamını yitirebilir."
 ve_cul_evt.231.a:0 "Yetki protokolü müzakere et."
 ve_cul_evt.231.b:0 "Merkezi bir komuta zinciri kurun."
 ve_cul_evt.231.c:0 "Ortak bir bürokratik sicil oluşturun."

 ve_cul_evt.290.t:0 "Yeni Bir Ulusal Mutabakat"
 ve_cul_evt.290.d:0 "Tepki dinişmiş ve ulusal üyeliğin yeni tanımı kök salmıştır. Hükümet idari dersleri Kültürel Yetki olarak koruyabilir ya da mutabakata olan kararlılık güçlendirmek için bu anı kullanabilir."
 ve_cul_evt.290.a:0 "Tecrübe gelecek devlet yönetimine taşıyın."
 ve_cul_evt.290.a.tt:0 "#P 10#! Kültürel Yetki kazan."
 ve_cul_evt.290.b:0 "Mutabakatı ülke genelinde kutlayın."
 ve_cul_evt.290.b.tt:0 "#P 3#! Ulusal Uyum kazan."

 ve_cul_evt.291.t:0 "Kırılgan Bir Mutabakat"
 ve_cul_evt.291.d:0 "Resmi geçiş sona ermiştir, ancak yeni ulusal kimlik eşit şekilde Kabul Gören olmaya devam etmektedir. Hükümet uzlaşının olgunlaşmasına izin verebilir, sınırlı yetkiyi başka bir uyarlamaya harcayabilir ya da kabul edilen modele uygun kurumlar aracılığıyla bunu güçlendirebilir."
 ve_cul_evt.291.a:0 "Uzlaşının kendi bilanço bulmasına izin verin."
 ve_cul_evt.291.a.tt:0 "Geçiş, ek mekanik etki olmaksızın sona erer."
 ve_cul_evt.291.b:0 "Son bir uyarlamayı finanse edin."
 ve_cul_evt.291.b.tt:0 "#N 10#! Kültürel Yetki harca ve #P 3#! Ulusal Uyum kazan."
 ve_cul_evt.291.c:0 "Mutabakatı modele uygun kurumlara emanet edin."
 ve_cul_evt.291.c.tt:0 "#N 5#! Kültürel Yetki harca ve #P 2#! Ulusal Uyum kazan. Kabul edilen Kimlik Modeli'ne uygun bir Fikir gerektirir."

 ve_cul_evt.292.t:0 "Ulusal Mutabakat Krizi"
 ve_cul_evt.292.d:0 "Geçiş tepkisi sona ermiştir, ancak ait olmanın yeni tanımı geniş sadakat komuta etmekte başarısız olmuştur. Hükümet kıt yetkiyi acil bir uyarlamaya harcayabilir, daha dar kapsamlı bir müdahale için modele uygun kurumlara güvenebilir ya da bir radikalleşme dalgasını kabul edebilir."
 ve_cul_evt.292.a:0 "Acil bir uyarlama için ödeme yapın."
 ve_cul_evt.292.a.tt:0 "#N 15#! Kültürel Yetki harca ve #P 5#! Ulusal Uyum kazan."
 ve_cul_evt.292.b:0 "Vilayet, mutabakatı yazıldığı gibi uygulayacaktır."
 ve_cul_evt.292.b.tt:0 "Ülkenin Nüfus un #N 0.25%#! kadarı Radikal olur."
 ve_cul_evt.292.c:0 "Bu kimlik için inşa edilen kurumları kullanın."
