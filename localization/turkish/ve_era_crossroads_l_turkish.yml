 ve_je_era_crossroads_age_3_route_1_status:0 "#Y Sosyal Cumhuriyet#!\nİlerleme: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nKalan süre: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ay#!\nAylık ilerleme: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nÇapa noktaları: Bu Çağ boyunca güvence altına alınan kitle siyaseti hedefi ve olgun sosyal kurumlar hedefi.\n\nAmaç: #P +50 Çağ İvmesi#! için 60 İlerleme noktasına ulaşın. 20 ve 40 İlerleme noktalarındaki Dönüm Noktaları, Ulusal Kavrayış destekli bir atılım sunar."
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y Stratejik Komuta#!\nİlerleme: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nKalan süre: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ay#!\nAylık ilerleme: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nÇapa noktaları: Bu Çağ boyunca güvence altına alınan modern kuvvet kompozisyonu hedefi ve büyük güç menzili hedefi.\n\nAmaç: #P +50 Çağ İvmesi#! için 60 İlerleme noktasına ulaşın. 20 ve 40 İlerleme noktalarındaki Dönüm Noktaları, Ulusal Kavrayış destekli bir atılım sunar."
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y Cephanelik Toplumu#!\nİlerleme: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nKalan süre: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ay#!\nAylık ilerleme: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nÇapa noktaları: Bu Çağ boyunca güvence altına alınan elektrik sanayisi hedefi ve kitle silahlanması hedefi.\n\nAmaç: #P +50 Çağ İvmesi#! için 60 İlerleme noktasına ulaşın. 20 ve 40 İlerleme noktalarındaki Dönüm Noktaları, Ulusal Kavrayış destekli bir atılım sunar."

 ve_era_crossroads.1.t:0 "Buhar ve Devlet"
 ve_era_crossroads.1.d:0 "Demiryolları, okullar, reformcular ve yöneticiler modern ulusa dair rakip anlatılar sunmaktadır. Hükümet, toplum ile devlet arasındaki hangi ilişkinin ilk çağı organize edeceğine karar vermelidir."
 ve_era_crossroads.1.a:0 "Ülkeyi bir Buhar Ağı vasıtasıyla birbirine bağlayın."
 ve_era_crossroads.1.b:0 "Eğitimli Bir Yurttaşlık inşa edin."
 ve_era_crossroads.1.c:0 "İdari bir devleti pekiştirin."
 ve_era_crossroads.1.d.option:0 "Bu çağın ulusal kavşaklara ihtiyacı yok."
 ve_era_crossroads.1.a.tt:0 "#Y Buhar Ağı#! yolunu başlatır (Odak: Sanayileşme, Köylü Göçü ve Demiryolları).\n• Amaç: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme noktasına ulaşın.\n• İlerleme Hızı: +1 taban aylık ilerleme kazanır, ayrıca tamamlanan her Çağ 1 çapa noktası (Köylü Payı ve Demiryolu hedefleri) için +1 ek kazanır.\n• Doktrin Sinerjisi: #Y Sanayici IV#! veya #Y Altyapı IV#! sahibi olmak, daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Kavrayış)."
 ve_era_crossroads.1.b.tt:0 "#Y Eğitimli Yurttaşlık#! yolunu başlatır (Odak: Eğitim, Okuryazarlık ve Özgür İşçi Hareketi).\n• Amaç: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme noktasına ulaşın.\n• İlerleme Hızı: +1 taban aylık ilerleme kazanır, ayrıca tamamlanan her Çağ 1 çapa noktası (Özgür İşçi Hareketi ve Okuryazarlık/Eğitim hedefleri) için +1 ek kazanır.\n• Doktrin Sinerjisi: #Y Akademik IV#! veya #Y Reformcu IV#! sahibi olmak, daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Kavrayış)."
 ve_era_crossroads.1.c.tt:0 "#Y İdari Devlet#! yolunu başlatır (Odak: Hükümet Meşruluğu, Bürokrasi ve İstikrar).\n• Amaç: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme noktasına ulaşın.\n• İlerleme Hızı: +1 taban aylık ilerleme kazanır, ayrıca tamamlanan her Çağ 1 çapa noktası (Meşruluk/Bürokrasi ve Bağımsız İstikrar hedefleri) için +1 ek kazanır.\n• Doktrin Sinerjisi: #Y Bürokratik IV#! veya #Y Parlamenter IV#! sahibi olmak, daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Kavrayış)."
 ve_era_crossroads.2.t:0 "İmparatorluk mu, Kitle Toplumu mu?"
 ve_era_crossroads.2.d:0 "Devlet, denizaşırı menzili, popüler refahı ve ulusal entegrasyonu ayrı sorular olarak ele alamaz. Bunlardan biri, diğerlerinin nasıl takip edileceğini tanımlayacaktır."
 ve_era_crossroads.2.a:0 "İmparatorluk Ufku'na doğru bakın."
 ve_era_crossroads.2.b:0 "Bir Kitle Refahı sistemi inşa edin."
 ve_era_crossroads.2.c:0 "Entegre Bir Ulus oluşturun."
 ve_era_crossroads.2.d.option:0 "Çağın kendi yönünü bulmasına izin verin."
 ve_era_crossroads.2.a.tt:0 "#Y İmparatorluk Ufku#! yolunu başlatır (Odak: Diplomatik Güç ve Denizaşırı Menzil).\n• Amaç: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme noktasına ulaşın.\n• İlerleme Hızı: +1 taban aylık ilerleme kazanır, ayrıca tamamlanan her Çağ 2 çapa noktası (Tanınan Devlet Kapasitesi ve Limanlar/İlgiler hedefleri) için +1 ek kazanır.\n• Doktrin Sinerjisi: #Y Diplomatik IV#! veya #Y Sömürge IV#! sahibi olmak, daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Kavrayış)."
 ve_era_crossroads.2.b.tt:0 "#Y Kitle Refahı#! yolunu başlatır (Odak: Sosyal Kurumlar, Sağlık Hizmetleri ve Eğitim).\n• Amaç: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme noktasına ulaşın.\n• İlerleme Hızı: +1 taban aylık ilerleme kazanır, ayrıca tamamlanan her Çağ 2 çapa noktası (Okuryazarlık/Eğitim ve Sosyal Kurumlar hedefleri) için +1 ek kazanır.\n• Doktrin Sinerjisi: #Y Refah IV#! veya #Y Reformcu IV#! sahibi olmak, daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Kavrayış)."
 ve_era_crossroads.2.c.tt:0 "#Y Entegre Ulus#! yolunu başlatır (Odak: Ekonomik Dönüşüm ve Dahili İstikrar).\n• Amaç: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme noktasına ulaşın.\n• İlerleme Hızı: +1 taban aylık ilerleme kazanır, ayrıca tamamlanan her Çağ 2 çapa noktası (Ekonomik Dönüşüm ve Düşük Kargaşa Meşruluğu hedefleri) için +1 ek kazanır.\n• Doktrin Sinerjisi: #Y Milliyetçi IV#! veya #Y İşçi Hareketi IV#! sahibi olmak, daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Kavrayış)."
 ve_era_crossroads.3.t:0 "Seferber Toplum"
 ve_era_crossroads.3.d:0 "Kitle siyaseti, stratejik komuta ve endüstriyel seferberlik artık her bir kuruma sirayet etmektedir. Nihai çağ, ulusu hangi seferberlik biçiminin tanımlayacağı konusunda bir seçim yapmayı gerektirmektedir."
 ve_era_crossroads.3.a:0 "Sosyal Cumhuriyet taahhüdünde bulun."
 ve_era_crossroads.3.b:0 "Ulusu Stratejik Komuta altına al."
 ve_era_crossroads.3.c:0 "Bir Cebehane Toplumu inşa et."
 ve_era_crossroads.3.d.option:0 "Daimi bir seferberlik projesini reddet."
 ve_era_crossroads.3.a.tt:0 "#Y Sosyal Cumhuriyet#! yolunu başlatır (Odak: Kitle Siyaseti ve Sosyal Kurumlar).\n• Hedef: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme noktasına ulaş.\n• İlerleme Hızı: +1 taban aylık ilerleme ve tamamlanan her Çağ 3 demir noktası (Kitle Siyaseti ve Olgun Sosyal Kurumlar hedefleri) için ekstra +1 kazanır.\n• Doktrin Sinerjisi: #Y Parlamenter IV#! veya #Y Refah IV#! sahibi olmak daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Ulusal Kavrayış)."
 ve_era_crossroads.3.b.tt:0 "#Y Stratejik Komuta#! yolunu başlatır (Odak: Askeri Modernizasyon ve Küresel Güç Erişimi).\n• Hedef: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme noktasına ulaş.\n• İlerleme Hızı: +1 taban aylık ilerleme ve tamamlanan her Çağ 3 demir noktası (Modern Kuvvet Teşkilatı ve Üstün Güç Erişimi hedefleri) için ekstra +1 kazanır.\n• Doktrin Sinerjisi: #Y Profesyonel Ordu IV#! veya #Y Savunma IV#! sahibi olmak daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Ulusal Kavrayış)."
 ve_era_crossroads.3.c.tt:0 "#Y Cebehane Toplumu#! yolunu başlatır (Odak: Endüstriyel Savaş Ekonomisi ve Kitle Silahlanması).\n• Hedef: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme noktasına ulaş.\n• İlerleme Hızı: +1 taban aylık ilerleme ve tamamlanan her Çağ 3 demir noktası (Elektrik Sanayi ve Kitle Silahlanması hedefleri) için ekstra +1 kazanır.\n• Doktrin Sinerjisi: #Y Savaş Ekonomisi IV#! veya #Y Toplu Asker Alım IV#! sahibi olmak daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Ulusal Kavrayış)."

 ve_era_crossroads_decline_tt:0 "Mevcut Çağın Çağ Kavşağı'nı kalıcı olarak reddeder. Sonraki çağlar uygun kalmaya devam eder."

 ve_era_crossroads.10.t:0 "Ulusal Takvim"
 ve_era_crossroads.10.d:0 "Vilayet daireleri, özel cemiyetler ve bakanlıklar seçilen dönüşümü farklı hızlarda takip etmektedir. Ortak bir takvim, dağınık başarıları ulusal bir programa dönüştürebilir ancak koordinasyonun kendisi kıt idari dikkat gerektirmektedir."
 ve_era_crossroads.10.a:0 "Merkezi bir koordinasyon komisyonunu finanse et."
 ve_era_crossroads.10.b:0 "Kurumların kendi zaman çizelgelerini müzakere etmesine izin ver."
 ve_era_crossroads.10.c:0 "Tespit edilmiş doktrinlerimiz tarafından kurulan ağları kullan."
 ve_era_crossroads.10.a.tt:0 "#P +3 Kavşak ilerlemesi#! kazanmak için #N 10 Ulusal Kavrayış#! harca."
 ve_era_crossroads.10.b.tt:0 "Hiçbir kaynak harcama ve Kavşak ilerlemesinde anlık bir değişiklik yapma."
 ve_era_crossroads.10.c.tt:0 "Yola uygun bir seviye-IV Fikir Grubu gerektirir. #P +3 Kavşak ilerlemesi#! kazanmak için #N 5 Ulusal Kavrayış#! harca."

 ve_era_crossroads.11.t:0 "İlerlemeyi Kim Yönlendirecek?"
 ve_era_crossroads.11.d:0 "Program, gevşek bir anlaşma olarak kalamayacak kadar büyük sonuçlar doğurmuştur. Bakanlar ulusal otorite iddia etmekte, uzmanlar siyasetten yalıtılmayı talep etmekte ve yerel aktörler katı komutanın ilerlemeyi mümkün kılan kurumları yıkacağı konusunda uyarmaktadır."
 ve_era_crossroads.11.a:0 "Merkeze net bir koordinasyon direktifi ver."
 ve_era_crossroads.11.b:0 "Müzakere edilen otorite dengesini koru."
 ve_era_crossroads.11.c:0 "Koordinasyonu doktriner kurumlarımıza emanet et."
 ve_era_crossroads.11.a.tt:0 "#P +3 Kavşak ilerlemesi#! kazanmak için #N 10 Ulusal Kavrayış#! harca."
 ve_era_crossroads.11.b.tt:0 "Hiçbir kaynak harcama ve Kavşak ilerlemesinde anlık bir değişiklik yapma."
 ve_era_crossroads.11.c.tt:0 "Yola uygun bir seviye-IV Fikir Grubu gerektirir. #P +3 Kavşak ilerlemesi#! kazanmak için #N 5 Ulusal Kavrayış#! harca."

 ve_era_crossroads.40.t:0 "Buhar ve Devlet"
 ve_era_crossroads.40.d:0 "Seçilen rota artık bir dizi soyut başarıdan ibaret değildir. Altyapı, vatandaşlık veya idare artık devletin çağın dönüşümlerini anlayabileceği ve yönlendirebileceği kalıcı bir ulusal program oluşturmaktadır."
 ve_era_crossroads.40.a:0 "İlk çağ kurumsal biçimini bulmuştur."
 ve_era_crossroads.40.a.tt:0 "Tamamlanan Çağ Kavşağı #P +50 Çağ İvmesi#! kazandırdı. Bu durum bir hedefi tamamlamadı veya Altın Çağ uygunluğunu değiştirmedi."

 ve_era_crossroads.20.t:0 "Devletin Erişimi"
 ve_era_crossroads.20.d:0 "Seçilen program artık ilk başta onu destekleyen kurumların ötesine uzanmaktadır. Limanlar, okullar, daireler ve yerel merciler ulusal koordinasyonun nerede bitip yerel takdir yetkisinin nerede başlaması gerektiği konusunda anlaşmazlık yaşamaktadır."
 ve_era_crossroads.20.a:0 "Merkezi bir komisyon aracılığıyla devletin yükümlülüklerinin haritasını çıkar."
 ve_era_crossroads.20.b:0 "Kurumsal sınırların müzakere yoluyla ortaya çıkmasına izin ver."
 ve_era_crossroads.20.c:0 "Tespit edilmiş doktriner ağlarımız aracılığıyla koordine et."
 ve_era_crossroads.20.a.tt:0 "#P +3 Kavşak ilerlemesi#! kazanmak için #N 10 Ulusal Kavrayış#! harca."
 ve_era_crossroads.20.b.tt:0 "Hiçbir kaynak harcama ve Kavşak ilerlemesinde anlık bir değişiklik yapma."
 ve_era_crossroads.20.c.tt:0 "Yola uygun bir seviye-IV Fikir Grubu gerektirir. #P +3 Kavşak ilerlemesi#! kazanmak için #N 5 Ulusal Kavrayış#! harca."

 ve_era_crossroads.21.t:0 "Entegrasyonun Bedeli"
 ve_era_crossroads.21.d:0 "Harici nüfuz, sosyal iaşe ve ulusal disiplin; kazananlar, maliyetler ve yeni beklentiler yaratır. Bu program, ancak devlet bu yüklerin nasıl dağıtılacağına karar verirse ayakta kalabilir."
 ve_era_crossroads.21.a:0 "Uyum sürecini yönetmek için ulusal bir kurul oluşturun."
 ve_era_crossroads.21.b:0 "Yükü müzakere edilen uzlaşmalar yoluyla dağıtın."
 ve_era_crossroads.21.c:0 "Doktriner kurumlarımızın yükü göğüslemesine izin verin."
 ve_era_crossroads.21.a.tt:0 "#P +3 Çağ Kavşağı ilerlemesi#! kazanmak için #N 10 Ulusal Kavrayış#! harcayın."
 ve_era_crossroads.21.b.tt:0 "Hiçbir kaynak harcamayın ve Çağ Kavşağı ilerlemesinde anlık değişiklik yapmayın."
 ve_era_crossroads.21.c.tt:0 "Yola uygun IV. seviye bir Fikir Grubu gerektirir. #P +3 Çağ Kavşağı ilerlemesi#! kazanmak için #N 5 Ulusal Kavrayış#! harcayın."

 ve_era_crossroads.41.t:0 "İmparatorluk ve Kitle Toplumu"
 ve_era_crossroads.41.d:0 "Seçilen mutabakat artık devletin harici nüfuzunu, sosyal yükümlülüklerini ve ulusal kurumlarını birbirine bağlıyor. Stratejik bir yönelim olarak başlayan şey, kitle toplumunu yönetmek için kalıcı bir çerçeve haline geldi."
 ve_era_crossroads.41.a:0 "İkinci çağ kendi mutabakatını buldu."
 ve_era_crossroads.41.a.tt:0 "Tamamlanan Çağ Kavşağı #P +50 Çağ İvmesi#! kazandırdı. Bu, bir hedefi tamamlamadı veya Altın Çağ uygunluğunu değiştirmedi."

 ve_era_crossroads.30.t:0 "Ulus Göreve Çağrılıyor"
 ve_era_crossroads.30.d:0 "Vatandaşlara, komutanlara, işçilere ve yöneticilere seçilen program tarafından yeni yükümlülükler yükleniyor. Bu görevler birbirleri için anlaşılır kılınmadığı sürece, seferberlik rekabet eden talepler bütünü olarak kalacaktır."
 ve_era_crossroads.30.a:0 "Ulusal görevleri merkezi bir komisyon aracılığıyla kanunlaştırın."
 ve_era_crossroads.30.b:0 "Kurumların sorumluluklarını müzakere etmesine izin verin."
 ve_era_crossroads.30.c:0 "Görevi koordine etmek için doktriner teşkilatlarımızı kullanın."
 ve_era_crossroads.30.a.tt:0 "#P +3 Çağ Kavşağı ilerlemesi#! kazanmak için #N 10 Ulusal Kavrayış#! harcayın."
 ve_era_crossroads.30.b.tt:0 "Hiçbir kaynak harcamayın ve Çağ Kavşağı ilerlemesinde anlık değişiklik yapmayın."
 ve_era_crossroads.30.c.tt:0 "Yola uygun IV. seviye bir Fikir Grubu gerektirir. #P +3 Çağ Kavşağı ilerlemesi#! kazanmak için #N 5 Ulusal Kavrayış#! harcayın."

 ve_era_crossroads.31.t:0 "Daimi Bir Ohal"
 ve_era_crossroads.31.d:0 "Kitle katılımı, stratejik hazırlık veya sanayi seferberliği için inşa edilen makine kalıcı hale geliyor. Devlet, ohal disiplininin sıradan ulusal yaşamı tüketmesine izin vermeden kapasiteyi nasıl koruyacağına karar vermelidir."
 ve_era_crossroads.31.a:0 "Ulusal bir inceleme yoluyla kalıcı sınırları tanımlayın."
 ve_era_crossroads.31.b:0 "Mutabakatı bilinçli olarak esnek tutun."
 ve_era_crossroads.31.c:0 "Makineyi zapt etmek için doktriner kurumlara güvenin."
 ve_era_crossroads.31.a.tt:0 "#P +3 Çağ Kavşağı ilerlemesi#! kazanmak için #N 10 Ulusal Kavrayış#! harcayın."
 ve_era_crossroads.31.b.tt:0 "Hiçbir kaynak harcamayın ve Çağ Kavşağı ilerlemesinde anlık değişiklik yapmayın."
 ve_era_crossroads.31.c.tt:0 "Yola uygun IV. seviye bir Fikir Grubu gerektirir. #P +3 Çağ Kavşağı ilerlemesi#! kazanmak için #N 5 Ulusal Kavrayış#! harcayın."

 ve_era_crossroads.42.t:0 "Seferber Toplum"
 ve_era_crossroads.42.d:0 "Vatandaşlık, komuta ve sanayi kapasitesi artık kalıcı bir ulusal mutabakat oluşturuyor. Seferberlik kurumları, her yeni kriz için doğaçlama yanıtlar olarak bırakılmak yerine sıradan hükümetin bir parçası haline getirildi."
 ve_era_crossroads.42.a:0 "Son çağ kendi ulusal formunu buldu."
 ve_era_crossroads.42.a.tt:0 "Tamamlanan Çağ Kavşağı #P +50 Çağ İvmesi#! kazandırdı. Bu, bir hedefi tamamlamadı veya Altın Çağ uygunluğunu değiştirmedi."
