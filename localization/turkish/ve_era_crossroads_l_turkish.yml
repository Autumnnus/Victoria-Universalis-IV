 ve_je_era_crossroads_age_1:0 "Buhar ve Devlet"
 ve_je_era_crossroads_age_1_reason:0 "Sanayi ve Uluslar, modern devletçiliğe giden birkaç yol açtı. Seçilen rota, münferit başarılar kümesinden fazlası olmalıdır."
 ve_je_era_crossroads_age_1_status:0 "İlerleme: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nKalan süre: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ay#!\nAylık ilerleme: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nHedef: #P +50 Çağ İvmesi#! kazanmak için 60 İlerleme'ye ulaşın. 20 ve 40 İlerleme'deki dönüm noktaları Ulusal Kavrayış destekli bir avantaj sunar."
