 ve_era_crossroads.1.t:0 "Steam ve Devlet"
 ve_era_crossroads.1.d:0 "Demiryolları, okullar, reformcular ve idareciler modern ulusa dair rakip açıklamalar sunuyor. İlk çağı toplum ve devlet arasındaki hangi ilişkinin düzenleyeceğine hükümet karar vermelidir."
 ve_era_crossroads.1.a:0 "Ülkeyi bir Steam Ağı aracılığıyla birbirine bağlayın."
 ve_era_crossroads.1.b:0 "Eğitimli bir Vatandaşlık oluşturun."
 ve_era_crossroads.1.c:0 "İdari bir Devleti Konsolide Edin."
 ve_era_crossroads.1.d.option:0 "Bu çağın ulusal kavşaklara ihtiyacı yok."
 ve_era_crossroads.1.a.tt:0 " #Y Steam Ağını Başlatır#! rota (Odak: Sanayileşme, Köylü Göçü ve Demiryolları).\n• Hedef: 60 İlerlemeye ulaşıp #P +50 Çağ İvmesi elde edin#!.\n• İlerleme Hızı: +1 temel aylık ilerleme artı tamamlanan her 1. Yaş çapası için +1 ekstra (Köylü Payı ve Demiryolu hedefleri) kazanır.\n• Doktrin Sinerjisi: Sahip Olmak #Y Sanayici IV#! veya #Y Altyapı IV#! daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Bilgi)."
 ve_era_crossroads.1.b.tt:0 "Başlatır #Y Eğitimli Vatandaşlık#! rota (Odak: Eğitim, Okuryazarlık ve Serbest Çalışma).\n• Hedef:  #P +50 Çağ İvmesi kazanmak için 60 İlerlemeye ulaşın#!.\n• İlerleme Hızı: +1 temel aylık ilerleme artı tamamlanan her 1. Yaş dayanağı için +1 ekstra (Ücretsiz Çalışma ve Okuryazarlık/Okul hedefleri) kazanır.\n• Doktrin Sinerjisi: Sahip Olmak #Y Akademik IV#! veya #Y Reformcu IV#! daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Bilgi)."
 ve_era_crossroads.1.c.tt:0 "Başlatır #Y İdari Devlet#! rota (Odak: Hükümetin Meşruiyeti, Bürokrasi ve İstikrar).\n• Hedef:  #P +50 Çağ İvmesi kazanmak için 60 İlerlemeye ulaşın#!.\n• İlerleme Hızı: +1 temel aylık ilerleme artı tamamlanan her 1. Yaş dayanağı için +1 ekstra (Meşruiyet/Bürokrasi ve Bağımsız İstikrar hedefleri) kazanır.\n• Doktrin Sinerjisi: Sahip Olma #Y Bürokratik IV#! veya #Y Parlamento IV#! daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Bilgi)."
 ve_era_crossroads.2.t:0 "İmparatorluk mu yoksa Kitle Toplumu mu?"
 ve_era_crossroads.2.d:0 "Devlet artık denizaşırı erişim, halkın refahı ve ulusal entegrasyonu ayrı sorunlar olarak ele alamaz. Bunlardan biri diğerlerinin nasıl takip edileceğini tanımlayacak."
 ve_era_crossroads.2.a:0 "İmparatorluk Ufkuna doğru bakın."
 ve_era_crossroads.2.b:0 "Bir Kitle Refahı sistemi inşa edin."
 ve_era_crossroads.2.c:0 "Bütünleşmiş bir Ulus oluşturun."
 ve_era_crossroads.2.d.option:0 "Çağın kendi yönünü bulmasına izin verin."
 ve_era_crossroads.2.a.tt:0 " #Y İmparatorluk Ufku#! rota (Odak: Diplomatik Güç ve Denizaşırı Erişim).\n• Hedef: 60 İlerlemeye Ulaşın, kazanın #P +50 Çağ İvmesi#!.\n• İlerleme Hızı: +1 temel aylık ilerleme artı tamamlanan her 2. Yaş dayanağı için +1 ekstra (Tanınan Eyalet Kapasitesi ve Limanlar/İlgi Alanları hedefleri) kazanır.\n• Doktrin Sinerjisi: Sahip Olma #Y Diplomatik IV#! veya #Y Sömürge IV#! daha ucuz kilometre taşı kararlarının kilidini açar (10 yerine 5 Bilgi)."
 ve_era_crossroads.2.b.tt:0 " #Y Kitle Refahı#! rota (Odak: Sosyal Kurumlar, Sağlık ve Eğitim).\n• Hedef: 60 İlerlemeye Ulaşın #P +50 Çağ İvmesi#!.\n• İlerleme Hızı: Aylık +1 temel ilerleme artı tamamlanan her 2. Yaş dayanağı için +1 ekstra kazanır (Okuryazarlık/Okullar ve Sosyal Kurumlar hedefleri).\n• Doktrin Sinerjisi: Sahip Olmak #Y Refah IV#! veya #Y Reformcu IV#! daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Bilgi)."
 ve_era_crossroads.2.c.tt:0 "Başlatır #Y Entegre Ulus#! rota (Odak: Ekonomik Dönüşüm ve İç İstikrar).\n• Hedef: 60 İlerlemeye ulaşıp #P +50 Çağ İvmesi elde edin#!.\n• İlerleme Hızı: Aylık +1 temel ilerleme artı tamamlanan her 2. Yaş dayanağı için +1 ekstra kazanır (Ekonomik Dönüşüm ve Düşük Kargaşalı Meşruiyet hedefleri).\n• Doktrin Sinerjisi: Sahip Olmak #Y Milliyetçi IV#! veya #Y İşgücü IV#! daha ucuz kilometre taşı kararlarının kilidini açar (10 yerine 5 İçgörü)."
 ve_era_crossroads.3.t:0 "Harekete Geçirilmiş Toplum"
 ve_era_crossroads.3.d:0 "Kitle siyaseti, stratejik komuta ve endüstriyel seferberlik artık her kuruma ulaşıyor. Son çağ, ulusu hangi seferberlik biçiminin tanımlayacağı konusunda bir seçim yapmayı gerektirir."
 ve_era_crossroads.3.a:0 "Sosyal Cumhuriyet'e bağlanın."
 ve_era_crossroads.3.b:0 "Ülkeyi Stratejik Komuta altına alın."
 ve_era_crossroads.3.c:0 "Bir Cephanelik Topluluğu oluşturun."
 ve_era_crossroads.3.d.option:0 "Kalıcı bir seferberlik projesini reddedin."
 ve_era_crossroads.3.a.tt:0 "Başlatır #Y Sosyal Cumhuriyet#! rota (Odak: Kitle Politikaları ve Sosyal Kurumlar).\n• Hedef: 60 İlerlemeye ulaşmak #P +50 Çağ İvmesi#!.\n• İlerleme Hızı: +1 temel aylık ilerleme artı tamamlanan her 3. Yaş dayanağı için +1 ekstra (Kitle Politikası ve Olgun Sosyal Kurumlar hedefleri).\n• Doktrin Sinerjisi: Sahip Olma #Y Parlamento IV#! veya #Y Refah IV#! daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Bilgi)."
 ve_era_crossroads.3.b.tt:0 "Başlatır #Y Stratejik Komuta#! rota (Odak: Askeri Modernizasyon ve Küresel Güç Erişimi).\n• Hedef: 60 İlerlemeye Ulaşmak Kazanmak için #P +50 Çağ İvmesi#!.\n• İlerleme Hızı: +1 temel aylık ilerleme artı tamamlanan her 3. Yaş dayanağı için +1 ekstra (Modern Kuvvet Bileşimi ve Büyük Güç Erişimi hedefleri).\n• Doktrin Sinerjisi: Sahip Olma #Y Profesyonel Ordu IV#! veya #Y Savunma IV#! daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Bilgi)."
 ve_era_crossroads.3.c.tt:0 "Başlatır #Y Arsenal Topluluğu#! rota (Odak: Endüstriyel Savaş Ekonomisi ve Kitle Silahlanmaları).\n• Hedef: 60 İlerlemeye Ulaşın, Kazanın #P +50 Çağ İvmesi#!.\n• İlerleme Hızı: Aylık +1 temel ilerleme artı tamamlanan her 3. Çağ çapası için +1 ekstra (Elektrik Endüstrisi ve Kitle Silahlanma hedefleri) kazanır.\n• Doktrin Sinerjisi: Sahip olmak #Y Savaş Ekonomisi IV#! veya #Y Toplu Zorunlu Askerlik IV#! daha ucuz dönüm noktası kararlarının kilidini açar (10 yerine 5 Bilgi)."

 ve_era_crossroads_decline_tt:0 "Mevcut Çağın Dönem Kavşağı'nı kalıcı olarak reddeder. Daha sonraki Çağlar da uygun olmaya devam edecektir."

 ve_era_crossroads.10.t:0 "Ulusal Takvim"
 ve_era_crossroads.10.d:0 "İl müdürlükleri, özel dernekler ve bakanlıklar seçilen dönüşümü farklı hızlarda sürdürüyor. Ortak bir takvim dağınık başarıları ulusal bir programa dönüştürebilir, ancak koordinasyonun kendisi çok az idari dikkat gerektirir."
 ve_era_crossroads.10.a:0 "Merkezi bir koordinasyon komisyonuna fon sağlayın."
 ve_era_crossroads.10.b:0 "Bırakın kurumlar kendi takvimlerini kendileri belirlesinler."
 ve_era_crossroads.10.c:0 "Yerleşik doktrinlerimizin oluşturduğu ağları kullanın."
 ve_era_crossroads.10.a.tt:0 "Harcama #N 10 Ulusal Bilgi#! kazanmak #P +3 Crossroads ilerlemesi#!."
 ve_era_crossroads.10.b.tt:0 "Crossroads ilerlemesinde hiçbir kaynak harcamayın ve hemen değişiklik yapmayın."
 ve_era_crossroads.10.c.tt:0 "Rotaya uygun seviye IV Fikir Grubu gerektirir. Harcama #N 5 Ulusal Bilgi#! kazanmak #P +3 Kavşak ilerlemesi#!."

 ve_era_crossroads.11.t:0 "İlerlemeyi Kim Yönlendirecek?"
 ve_era_crossroads.11.d:0 "Program gevşek bir anlaşma olarak kalamayacak kadar önemli hale geldi. Bakanlar ulusal otorite talep ediyor, uzmanlar siyasetten izolasyon talep ediyor ve yerel aktörler katı komutanın ilerlemeyi mümkün kılan kurumları bozacağı konusunda uyarıyor."
 ve_era_crossroads.11.a:0 "Merkez'e açık bir koordinasyon yetkisi verin."
 ve_era_crossroads.11.b:0 "Müzakere edilmiş yetki dengesini koruyun."
 ve_era_crossroads.11.c:0 "Koordinasyonu doktrin kurumlarımıza emanet edin."
 ve_era_crossroads.11.a.tt:0 "Harcama yapın #N 10 National Insight#! kazanmak için #P +3 Crossroads ilerlemesi#!."
 ve_era_crossroads.11.b.tt:0 "Hiçbir kaynak harcamayın ve Crossroads ilerlemesinde hemen değişiklik yapmayın."
 ve_era_crossroads.11.c.tt:0 "Rotaya uygun IV. Seviye Fikir Grubu gerektirir. Harcama #N 5 Ulusal Bilgi#! kazanmak #P +3 Kavşak ilerlemesi#!."

 ve_era_crossroads.40.t:0 "Steam ve Devlet"
 ve_era_crossroads.40.d:0 "Seçilen kurs artık bir dizi izole başarıdan ibaret değil. Altyapı, vatandaşlık veya yönetim artık devletin çağın dönüşümlerini anlayabileceği ve yönlendirebileceği kalıcı bir ulusal program oluşturmaktadır."
 ve_era_crossroads.40.a:0 "İlk çağ kurumsal formunu buldu."
 ve_era_crossroads.40.a.tt:0 "Tamamlanan Çağ Kavşağı, #P +50 Çağ İvmesi#!. Herhangi bir hedefi tamamlamamış veya Altın Çağ'a uygunluğu değiştirmemiştir."

 ve_era_crossroads.20.t:0 "Devletin Erişimi"
 ve_era_crossroads.20.d:0 "Seçilen program artık ona ilk sponsor olan kurumların ötesine geçiyor. Limanlar, okullar, ofisler ve yerel yetkililer, ulusal koordinasyonun nerede bitip yerel takdir yetkisinin nerede başlaması gerektiği konusunda anlaşamıyorlar."
 ve_era_crossroads.20.a:0 "Merkezi bir komisyon aracılığıyla devletin yükümlülüklerinin haritasını çıkarın."
 ve_era_crossroads.20.b:0 "Kurumsal sınırların müzakere yoluyla ortaya çıkmasına izin verin."
 ve_era_crossroads.20.c:0 "Yerleşik doktrinsel ağlarımız aracılığıyla koordinasyon sağlayın."
 ve_era_crossroads.20.a.tt:0 "Harcamak #N 10 Ulusal Bilgi#! kazanmak #P +3 Crossroads ilerlemesi#!."
 ve_era_crossroads.20.b.tt:0 "Crossroads ilerlemesinde hiçbir kaynak harcamayın ve hemen değişiklik yapmayın."
 ve_era_crossroads.20.c.tt:0 "Rotaya uygun seviye IV Fikir Grubu gerektirir. Harcama #N 5 Ulusal Bilgi#! kazanmak #P +3 Kavşak ilerlemesi#!."

 ve_era_crossroads.21.t:0 "Entegrasyonun Bedeli"
 ve_era_crossroads.21.d:0 "Dış erişim, sosyal hizmet ve ulusal disiplin; kazananlar, maliyetler ve yeni beklentiler yaratır. Program ancak bu yüklerin nasıl dağıtılacağına devletin karar vermesi durumunda sürdürülebilir."
 ve_era_crossroads.21.a:0 "Uyarlamayı yönetmek için ulusal bir kurul oluşturun."
 ve_era_crossroads.21.b:0 "Yükü müzakere edilmiş uzlaşmalar yoluyla dağıtın."
 ve_era_crossroads.21.c:0 "Bırakın doktrinsel kurumlarımız bu gerilimi karşılasın."
 ve_era_crossroads.21.a.tt:0 "Harcama #N 10 National Insight#! kazanmak için #P +3 Crossroads ilerlemesi#!."
 ve_era_crossroads.21.b.tt:0 "Hiçbir kaynak harcamayın ve Crossroads ilerlemesinde hemen değişiklik yapmayın."
 ve_era_crossroads.21.c.tt:0 "Rotaya uygun IV. Seviye Fikir Grubu gerektirir. Harcama #N 5 Ulusal Bilgi#! kazanmak #P +3 Kavşak ilerlemesi#!."

 ve_era_crossroads.41.t:0 "İmparatorluk ve Kitle Toplumu"
 ve_era_crossroads.41.d:0 "Seçilen çözüm artık devletin dış erişimini, sosyal yükümlülüklerini ve ulusal kurumlarını birbirine bağlıyor. Stratejik bir yön olarak başlayan şey, kitle toplumunu yönetmek için dayanıklı bir çerçeve haline geldi."
 ve_era_crossroads.41.a:0 "İkinci çağ çözümünü buldu."
 ve_era_crossroads.41.a.tt:0 "Tamamlanan Çağ Kavşağı, #P +50 Çağ İvmesi#!. Herhangi bir hedefi tamamlamamış veya Altın Çağ'a uygunluğu değiştirmemiştir."

 ve_era_crossroads.30.t:0 "Millet Göreve Çağrılıyor"
 ve_era_crossroads.30.d:0 "Seçilen programla vatandaşlara, komutanlara, işçilere ve idarecilere yeni yükümlülükler veriliyor. Bu görevler birbirlerine okunabilir hale getirilmediği sürece, seferberlik birbiriyle çatışan talepler bütünü olarak kalacaktır."
 ve_era_crossroads.30.a:0 "Ulusal görevlerin merkezi bir komisyon aracılığıyla kanunlaştırılması."
 ve_era_crossroads.30.b:0 "Kurumların sorumluluklarını müzakere etmesine izin verin."
 ve_era_crossroads.30.c:0 "Görevi koordine etmek için doktrinsel organizasyonlarımızı kullanın."
 ve_era_crossroads.30.a.tt:0 "Harcamak #N 10 Ulusal Bilgi#! kazanmak #P +3 Crossroads ilerlemesi#!."
 ve_era_crossroads.30.b.tt:0 "Crossroads ilerlemesinde hiçbir kaynak harcamayın ve hemen değişiklik yapmayın."
 ve_era_crossroads.30.c.tt:0 "Rotaya uygun seviye IV Fikir Grubu gerektirir. Harcama #N 5 Ulusal Bilgi#! kazanmak #P +3 Kavşak ilerlemesi#!."

 ve_era_crossroads.31.t:0 "Kalıcı Acil Durum"
 ve_era_crossroads.31.d:0 "Kitlesel katılım, stratejik hazırlık veya endüstriyel seferberlik için inşa edilen makineler kalıcı hale geliyor. Devlet, acil durum disiplininin sıradan ulusal yaşamı tüketmesine izin vermeden kapasiteyi nasıl koruyacağına karar vermelidir."
 ve_era_crossroads.31.a:0 "Ulusal bir inceleme yoluyla kalıcı sınırlar tanımlayın."
 ve_era_crossroads.31.b:0 "Yerleşimi kasıtlı olarak esnek tutun."
 ve_era_crossroads.31.c:0 "Makineyi kontrol altına almak için doktrinsel kurumlara güvenin."
 ve_era_crossroads.31.a.tt:0 "Harcama yapın #N 10 National Insight#! kazanmak için #P +3 Crossroads ilerlemesi#!."
 ve_era_crossroads.31.b.tt:0 "Hiçbir kaynak harcamayın ve Crossroads ilerlemesinde hemen değişiklik yapmayın."
 ve_era_crossroads.31.c.tt:0 "Rotaya uygun IV. Seviye Fikir Grubu gerektirir. Harcama #N 5 Ulusal Bilgi#! kazanmak #P +3 Kavşak ilerlemesi#!."

 ve_era_crossroads.42.t:0 "Mobilize Toplum"
 ve_era_crossroads.42.d:0 "Vatandaşlık, komuta ve endüstriyel kapasite artık kalıcı bir ulusal yerleşim oluşturuyor. Seferberlik kurumları, her yeni krize doğaçlama yanıtlar olarak bırakılmak yerine, sıradan hükümetin bir parçası haline getirildi."
 ve_era_crossroads.42.a:0 "Son çağ ulusal biçimini buldu."
 ve_era_crossroads.42.a.tt:0 "Tamamlanan Era Crossroads'un kazandırdığı #P +50 Çağ İvmesi#!. Herhangi bir hedefi tamamlamamış veya Altın Çağ'a uygunluğu değiştirmemiştir."
