 VE_LG_COL_INSIGHT:0 "Kavrayış"
 VE_LG_COL_GROUPS:0 "Grup"
 VE_LG_COL_IDEAS:0 "Grup Fikri"
 VE_LG_COL_NATIONAL_IDEAS:0 "Ulusal Fikirler"
 VE_LG_COL_NATIONAL_IDEAS_TT:0 "#header Ulusal Fikirler#!\nHer Ulusal Fikir slotu için bir işaret, sağda Ulusal Bonus. Ülke, satın aldığı her üçüncü grup fikriyle bir sonraki slotu açar."
 VE_LG_COL_RELIGION:0 "Dinî Model"
 VE_LG_COL_IDENTITY:0 "Kimlik Modeli"
