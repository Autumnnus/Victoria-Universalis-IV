 VE_LG_REFRESH:0 "Yenile"
 VE_LG_REFRESH_TT:0 "Listeyi yeniden oluştur. Satır değerleri her zaman yayındadır; liste oluşturulurken yalnızca sayfanın sırası ve üyeliği ayarlanır."
