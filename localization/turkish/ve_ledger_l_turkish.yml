 # Doktrin Defteri - gui/ve_panel_ledger.gui
 VE_LEDGER:0 "Defter"
 VE_LEDGER_SELECTED:0 "#bold Defter#!"
 VE_LG_TITLE:0 "Doktrin Defteri"
 VE_LG_HINT:0 "Bütün ülkelerin doktrin durumu. Sıralamak için kolon başlığına, listeyi daraltmak için filtreye, tüm grup ayrıntısı için ülkeye tıkla."

