 # Paging
 VE_LG_PAGE_INFO:0 "Sayfa [GetGlobalVariable('ve_ledger_page_number').GetValue|0] / [GetGlobalVariable('ve_ledger_page_count').GetValue|0]  ([GetGlobalVariable('ve_ledger_total').GetValue|0])"
 VE_LG_REFRESH:0 "Yenile"
 VE_LG_REFRESH_TT:0 "Listeyi yeniden oluştur. Satır değerleri her zaman günceldir; yalnızca listenin düzeni ve sayfanın üyeliği liste oluşturulduğunda belirlenir."
 VE_LG_FIRST_TT:0 "İlk sayfa"
 VE_LG_PREV_TT:0 "Önceki sayfa"
