 ve_piety_tt:0 "#header Dini Denge#!\nMevcut durum: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nToplumsal denge: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nAylık hareket: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Denge ayrıntısı#!\nDini düzen modeli: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nModel desteği: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nMeşruiyet, idare ve istikrar: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nGösterge her ay dengeye doğru #Y %20#! ilerler; aylık değişim #Y ±5#! ile sınırlıdır.\n#P 75#! değerinde: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\n#N 25#! veya altında: #N -5 Meşruiyet ve -%5 Kanun Çıkarma Başarısı#!.\n\nBu gösterge artık Program ödemesi yapmaz; Piety Reform'a bakın. Programlar en az #Y 25#! Piety Reform gerektirir, #Y 25#! tutar ve #Y 24 aylık#! uygulama yükü verir."


