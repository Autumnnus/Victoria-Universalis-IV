l_turkish:
 ve_piety:0 "Dindarlık"
 ve_piety_reform:0 "Dindarlık Reformu"
 ve_piety_reform_tt:0 "#header Dindarlık Reformu#!\nMevcut: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nAylık kazanç: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Aylık döküm#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nMeşruluk: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nİdare: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nDindarların desteği: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nFikir doktrini: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Fikir doktrini — yalnızca mevcut Dinî Model'iniz sayılır#!\n#P Devlet Dini Düzeni / Devlet Ateizmi#!: Milliyetçi V #P +1#!\n#P Vicdan Özgürlüğü / Tam Ayrılık#!: Reformcu V #P +1#!\nYukarıdaki aktif toplam en fazla #Y +1#! ile sınırlandırılmıştır, dolayısıyla iki yol birleşemez.\n\nDoktrinler ve Programlar için (#Y 25'er#!) ve Hedeflenen Dinî Proje için (#Y 100-150#!, modele bağlı olarak) harcanır. Kazanç #Y 400#! sonrasında yavaşlar ve #Y 500#! değerinde durur.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doktrinler ve Programlar"
 ve_piety_tt:0 "#header Dinî Uzlaşı#!\nMevcut durum: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nSosyal denge: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nAylık değişim: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Denge dökümü#!\nUzlaşı modeli: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nModel desteği: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nMeşruluk, idare ve istikrar: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nÖlçer her ay dengeye doğru #Y %20#! hareket eder; en fazla #Y ±5#! ile sınırlıdır.\n#P 75#! değerinde: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\n#N 25#! veya altında: #N -5 Meşruluk ve -%5 Kanun Çıkarma Başarısı#!.\n\nBu ölçer artık Programlar için harcama yapmaz; bunun için Dindarlık Reformu'na bakın. Programlar en az #Y 25#! Dindarlık Reformu gerektirir, #Y 25#! tüketir ve #Y 24 aylık#! bir uygulama yükü getirir.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Dinî Proje"
 ve_religious_project_progress_tt:0 "#header Hedeflenen Dinî Proje#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nAylık ilerleme: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (en az 1, en çok 7)\n\n#Y Aylık döküm#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nİdare: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nMeşruluk: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nModel desteği: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nUzlaşı: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nDinî Hareketler: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nHedef Vilayet Kargaşası: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nFikir Grupları: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Fikir Grupları — yalnızca mevcut Dinî Model'inizle eşleşen bonuslar etkindir#!\n#P Devlet Dini Düzeni#!: Milliyetçi VII #P +1#!\n#P Vicdan Özgürlüğü#!: Reformcu VII #P +1#!\n#P Devlet Ateizmi#!: Milliyetçi VII #P +1#! ve Akademik VII #P +1#!\nYukarıdaki aktif Fikir Grubu toplamı en fazla #Y +2#! ile sınırlandırılmıştır.\n\nSahip olunan bir vilayetin panelinden bir tane başlatın. Devlet Dini Düzeni ve Devlet Ateizmi, tamamlandığında hedef vilayet nüfusunun #Y %5#! kısmının (Milliyetçi VII ile #Y %7#! kısmının) dinini değiştirir ve radikaller ekler. Vicdan Özgürlüğü ise din değiştirmeye zorlamadan sadıklar ekler. Tam Ayrılık bir proje başlatamaz; tamamen tarafsız modeldir.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "Devam ediyor"
