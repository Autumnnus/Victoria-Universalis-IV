 ve_freedom_outreach_desc:0 "#header Özgürlük Desteği#!\nKendi dininizin payı aşağıda olan tek bir Eyalette koşun #Y %90#!.\n\n#Y Maliyet#!\n#Y 100 Dindarlık Reformu#!, anında ödenir\n\n#Y Çalışırken#!\N#N -50 Bürokrasi, -25 Yetki#! ülke için\n\n#Y Tamamlandığında#!\n#P Zorla din değiştirme yok#! - bunun yerine hedef Eyaletteki sadık kişiler\n#P +20 Dindarlık Reformu, +7 Dini Yerleşim#!"
