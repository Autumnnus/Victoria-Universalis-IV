 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Dinî Modeller"
 ve_religious_models_help:0 "Dinî Modeliniz, #Y Kilise ve Devlet#! kanununuz tarafından belirlenir ve #P halihazırda aktiftir#! - burada seçilecek bir şey yoktur. Model yalnızca #Y Dinî Uzlaşı#! kazanımını, hangi sekiz Programı benimseyebileceğinizi ve hangi Dinî Proje'yi yürütebileceğinizi belirler.\n#Y Kanunu değiştirmek isteğe bağlıdır:#! Uzlaşı'yı #Y 35#! seviyesine sıfırlar, benimsemiş olduğunuz her Programı kaldırır, devam eden bir Dinî Proje'yi iptal eder ve #Y 3-5 yıllık#! bir Uzlaşı Krizi tetikler.\n#Y Tüm etkilerini görmek için herhangi bir kartın veya sayacın üzerine gelin.#!"
 ve_religious_model_active_footer:0 "Mevcut Model"
 ve_confessional_state_short:0 "Kilise ve devlet birlikte yönetir.\nUzlaşı, #Y Dindarlar Onay ve Tesir#! unsurundan gelir."
 ve_freedom_state_short:0 "Tek bir devlet altında her dine hoşgörü gösterilir.\nUzlaşı, #Y sakin, iyi yönetilen bir ülkeden#! gelir."
 ve_separation_state_short:0 "Vilayetin dini bir konumu yoktur.\nUzlaşı en yüksekte başlar ve #Y düşük kargaşayı#! ödüllendirir."
 ve_atheism_state_short:0 "Aktif, devlet liderliğinde laikleştirme.\nUzlaşı #Y okuryazarlık ve Aydınlardan#! gelir."
 ve_confessional_state_unlocks:0 "#Y Devlet Dini Dönüşümü#! projesini yürütür"
 ve_freedom_state_unlocks:0 "#Y Özgürlük Girişimi#! projesini yürütür"
 ve_separation_state_unlocks:0 "#N Dinî Proje yürütülemez#!"
 ve_atheism_state_unlocks:0 "#Y Laikleştirme Kampanyası#! projesini yürütür"
 ve_confessional_state_desc:0 "#header Devlet Dini Düzeni#!\nKilise ve devlet birlikte yönetir.\n\n#Y Aktifken#!\n#P +5% Otorite, +10% Din Değiştirme, +10% Dindarlar Siyasi Güç#!\n#N -3% Göç Cazibesi, +5% Açık Önyargıdan Kaynaklanan Radikaller#!\nVe devlet dininizin inanç ailesi için küçük bir paket (Hristiyan, İslami, Yahudi, Dharmik, Akademik veya Animist).\n\n#Y Uzlaşı#!\nTemel denge #Y 55#!. Dindarların onayı ve tesiri bunu en çok hareket ettirendir.\n\n#Y 75 Uzlaşıda#!\n#P +5% Otorite, +5 Meşruluk#!\n\n#Y Dinî Proje#!\nDevlet Dini Dönüşümü"
 ve_freedom_state_desc:0 "#header Vicdan Özgürlüğü#!\nTek devlet altında her inanç hoşgörüyle karşılanır.\n\n#Y Aktifken#!\n#P +5% Göç Cazibesi, -5% Açık Önyargıdan Kaynaklanan Radikaller#!\n#N -15% Din Değiştirme, -25 Bürokrasi#!\n\n#Y Uzlaşı#!\nTemel denge #Y 55#!. Düşük kargaşa, meşruluk ve sağlıklı bir idare bunu yükseltir.\n\n#Y 75 Uzlaşıda#!\n#P +5% Göç Cazibesi, +5 Meşruluk#!\n\n#Y Dinî Proje#!\nÖzgürlük Girişimi"
 ve_separation_state_desc:0 "#header Tam Ayrılık#!\nTarafsız model: devlet hiçbir dini konum almaz.\n\n#Y Aktifken#!\n#P +8% Göç Cazibesi, -10% Açık Önyargıdan Kaynaklanan Radikaller, -5% Şiddetli Düşmanlıktan Kaynaklanan Radikaller#!\n#N -30% Din Değiştirme#!\n\n#Y Uzlaşı#!\nTemel denge #Y 60#!, dördünün en yükseği. Düşük kargaşa bunu daha da yükseltir.\n\n#Y 75 Uzlaşıda#!\n#P +5% Kanun Çıkarma Başarısı, +5 Meşruluk#!\n\n#Y Dinî Proje#!\n#N Hiçbiri. Bu model kasıtlı olarak hiçbir dini kampanyaya sahip değildir.#!"
 ve_atheism_state_desc:0 "#header Devlet Ateizmi#!\nHoşgörülü değil, saldırgan bir laikleştirme modeli.\n\n#Y Aktifken#!\n#P +5% Teknoloji Yayılımı, +2% Eğitime Erişim, +20% Din Değiştirme#!\n#N -5% Otorite, -10% Dindarlar Siyasi Güç, +5% Açık Önyargıdan Kaynaklanan Radikaller#!\n\n#Y Uzlaşı#!\nTemel denge #Y 45#!, dördünün en düşüğü. Okuryazarlık ve Aydınların onayı bunu yükseltir; güçlü Dindarlar tesiri bunu düşürür.\n\n#Y 75 Uzlaşıda#!\n#P +5% Teknoloji Yayılımı, +5% Bürokrasi#!\n\n#Y Dinî Proje#!\nLaikleştirme Kampanyası\n\n#Y Not#!\nOkuryazarlık %50'nin altındaysa veya Dindarlar tesiri %20 ya da daha fazlaysa bu modele geçmek 3 yerine #N 5 yıllık#! bir kriz maliyeti getirir."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Programlar #Y isteğe bağlı#! ve kalıcıdır. Her biri #Y 25 Dindarlık Reformu#! mal olur ve sonraki hiçbir Programın benimsenemeyeceği #Y 24 aylık#! bir uygulama yükü başlatır. Sekizinin de tümü mevcut Dinî Modelinize aittir ve bu model değişirse kaybedilir.\n#Y Tam etkileri için herhangi bir kartın veya göstergenin üzerine gelin.#!"
 ve_religious_program_strain_notice:0 "Bir Program hâlâ uygulanmaktadır - bu yük sona erene kadar başka bir Program kabul edilemez."
 ve_religious_program_adopted_badge:0 "BENİMSENDİ"
 ve_adopt_program_button:0 "Benimse"
 ve_religious_program_cost_label:0 "Maliyeti: #Y 25 Dindarlık Reformu#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Hedeflenen Dinî Proje"
 ve_religious_projects_intro:0 "Dinî Proje #Y isteğe bağlıdır#! ve aynı anda yalnızca biri yürütülebilir. Dindarlık Reformu maliyeti derhal ödenir ve yürürlükte olduğu sürece #N -50 Bürokrasi ve -25 Otorite#! uygulanır. Tamamlanması bazı Dindarlık Reformlarını iade eder ve Dinî Uzlaşıyı yükseltir.\n#Y Tam etkileri için herhangi bir kartın veya göstergenin üzerine gelin.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Proje yürütülüyor"
 ve_religious_project_backlash_notice:0 "İptal edilen bir proje hâlâ yenisini engeller - 24 aylık tepki süresinin önce sona ermesi gerekir."
 ve_religious_project_start_instruction:0 "#Y Nasıl başlatılır#!\n1. Kendi Vilayetlerinizden birini açın.\n2. O Vilayetin panelinde #Y Projeyi Başlat#! tuşuna basın.\nHâlâ eksik olan her şey o tuşun ipucunda listelenir."
 ve_targeted_religious_project_target:0 "Hedef: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Proje hedefi yok"
 ve_no_active_religious_project:0 "Aktif Dinî Proje Yok"
 ve_confessional_conversion_name:0 "Devlet Dini Dönüşümü"
 ve_confessional_conversion_cost:0 "Maliyet: #Y 125 Dindarlık Reformu#!"
 ve_confessional_conversion_short:0 "Bir Vilayeti devlet dinine dönüştürün.\nTamamlandığında #P +20 Dindarlık Reformu, +5 Uzlaşı#! - ancak radikaller yaratır."
