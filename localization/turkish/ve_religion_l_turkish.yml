 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Dini Modeller"
 ve_religious_models_help:0 "Dini Modelinize sizin tarafınızdan karar verilir. #Y Kilise ve Devlet#! kanun ve #P zaten aktif#! - burada seçilecek hiçbir şey yok. Model yalnızca nasıl olacağına karar verir #Y Dini Yerleşim#! kazanabileceğiniz, hangi sekiz Programı benimseyebileceğiniz ve hangi Dini Projeyi yürütebileceğiniz.\n#Y Yasayı değiştirmek isteğe bağlıdır:#! Yerleşimi  #Y 35#!'e sıfırlar, benimsediğiniz her Programı kaldırır, devam eden bir Dini Projeyi iptal eder ve #Y 3-5 yıllık#! Yerleşim Krizi.\n#Y Tüm efektleri görmek için herhangi bir kartın veya ölçüm cihazının üzerine gelin.#!"
 ve_religious_model_active_footer:0 "Mevcut Model"
 ve_confessional_state_short:0 "Kilise ve devlet birlikte yönetir.\nYerleşim #Y Dindarlığın onayı ve nüfuzu#!."
 ve_freedom_state_short:0 "Tek bir eyalette her inanca hoşgörüyle bakılır.\nYerleşim #Y sakin ve iyi yönetilen bir ülke#!."
 ve_separation_state_short:0 "Devletin hiçbir dini tutumu yoktur.\nYerleşim en yüksekte başlar ve ödüllendirilir #Y düşük çalkantı#!."
 ve_atheism_state_short:0 "Aktif, devlet öncülüğünde laikleşme.\nYerleşim, #Y okuryazarlık ve Entelijansiya#!."
 ve_confessional_state_unlocks:0 "#Y Devlet Dini Dönüşümü#! projesini açar"
 ve_freedom_state_unlocks:0 "Çalıştırır #Y Özgürlük Sosyal Yardımı#! projesi"
 ve_separation_state_unlocks:0 "#N Dini bir Proje yürütemez#!"
 ve_atheism_state_unlocks:0 "Çalıştırır #Y Laikleşme Kampanyası#! proje"
 ve_confessional_state_desc:0 "#header Devlet Dini Düzeni#!\nDevlet ile dinî kurumlar birlikte hareket eder.\n\n#Y Aktifken#!\n#P +%5 Otorite, +%10 Dönüşüm, +%10 Dindar Siyasi Güç#!\n#N -%3 Göç Çekimi, Açık Önyargıdan +%5 Radikaller#!\nDevlet dininizin inanç ailesine göre ayrıca küçük bir ek paket sağlanır.\n\n#Y Dini Yerleşim#!\nTemel denge #Y 55#!. Dindarların onayı ve nüfuzu bu dengeyi en güçlü biçimde etkiler.\n\n#Y 75 Yerleşimde#!\n#P +%5 Otorite, +5 Meşruiyet#!\n\n#Y Dini Proje#!\nDevlet Dini Dönüşümü"
 ve_freedom_state_desc:0 "#header Vicdan Özgürlüğü#!\nHer inanç tek bir eyalet altında tolere edilir.\n\n#Y Aktifken#!\n#P +%5 Göç Çekimi, Açık Önyargıdan -%5 Radikaller#!\n#N -%15 Dönüşüm, -25 Bürokrasi#!\n\n#Y Yerleşim#!\nTemel denge #Y 55#!. Çalkantıların az olması, meşruiyet ve sağlıklı bir yönetim bunu artırıyor.\n\n#Y 75 Yerleşimde#!\n#P +%5 Göç Çekimi, +5 Meşruiyet#!\n\n#Y Dini Proje#!\nÖzgürlük Sosyal Yardımı"
 ve_separation_state_desc:0 "#header Toplam Ayrılık#!\nTarafsız model: devlet hiçbir dini tutum almaz.\n\n#Y Aktifken#!\n#P +%8 Göç Çekimi, Açık Önyargıdan -%10 Radikaller, Şiddetten -%5 Radikaller Düşmanlık#!\n#N -%30 Dönüşüm#!\n\n#Y Yerleşme#!\nTemel denge #Y 60#!, dördünün en yükseği. Düşük çalkantı durumu daha da artırıyor.\n\n#Y 75 Yerleşimde#!\n#P +%5 Kanun Çıkarma Başarısı, +5 Meşruiyet#!\n\n#Y Dini Proje#!\n#N Yok. Bu modelin bilinçli olarak dini bir kampanyası yoktur.#!"
 ve_atheism_state_desc:0 "#header Devlet Ateizmi#!\nHoşgörülü değil, saldırgan bir sekülerleşme modeli.\n\n#Y Aktif iken#!\n#P +%5 Teknoloji Yayılımı, +%2 Eğitim Erişimi, +%20 Dönüşüm#!\n#N -%5 Otorite, -%10 Dindar Siyasi Güç, +%5 Açık Önyargıdan Gelen Radikaller#!\n\n#Y Yerleşim#!\nTemel denge #Y 45#!, dörtten en düşük olanı. Okuryazarlık ve Entelijansiya'nın onayı bunu artırıyor; güçlü Dindarlık nüfuzu bunu düşürür.\n\n#Y 75 Yerleşimde#!\n#P +%5 Teknoloji Yayılımı, +%5 Bürokrasi#!\n\n#Y Dini Proje#!\nLaikleşme Kampanyası\n\n#Y Not#!\nBu modele geçişin maliyeti #N 5 yıl#! Okuryazarlık oranı %50'nin altındaysa veya Dindarlık nüfuzu %20 veya daha fazlaysa 3 yerine kriz."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Programlar #Y isteğe bağlı#! ve kalıcı. Her bir maliyet #Y 25 Dindarlık Reformu#! ve başlar #Y 24 ay#! başka bir Programın kabul edilemeyeceği uygulama gerilimi. Sekizinin tamamı mevcut Dini Modelinize aittir ve bu model değişirse kaybolur.\n#Y Tüm etkilerini görmek için herhangi bir kartın veya sayacın üzerine gelin.#!"
 ve_religious_program_strain_notice:0 "Bir Program halen uygulanmaktadır; bu zorlama sona erene kadar başka bir Program kabul edilemez."
 ve_religious_program_adopted_badge:0 "KABUL EDİLDİ"
 ve_adopt_program_button:0 "Kabul Et"
 ve_religious_program_cost_label:0 "Maliyetler #Y 25 Dindarlık Reformu#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Hedefli Dini Proje"
 ve_religious_projects_intro:0 "Dini bir proje #Y isteğe bağlı#! ve aynı anda yalnızca biri koşabilir. Dindarlık Reformunun maliyeti anında ödenir ve #N -50 Bürokrasi ve -25 Yetki#! çalıştığı sürece geçerlidir. Tamamlandığında Dindarlık Reformu'nun bir kısmı iade edilir ve Dini Yerleşim yükseltilir.\n#Y Tüm etkilerini görmek için herhangi bir kartın veya sayacın üzerine gelin.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Proje devam ediyor"
 ve_religious_project_backlash_notice:0 "İptal edilen bir proje yine de yeni bir projeyi engeller; önce 24 aylık gecikmenin sona ermesi gerekir."
 ve_religious_project_start_instruction:0 "#Y Nasıl başlatılır#!\n1. Kendi Eyaletlerinizden birini açın.\n2. Basmak #Y Projeyi Başlat#! o Durumun panelinde.\nHala eksik olan her şey o düğmenin ipucunda listelenir."
 ve_targeted_religious_project_target:0 "Hedef: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Proje hedefi yok"
 ve_no_active_religious_project:0 "Aktif Dini Proje Yok"
 ve_confessional_conversion_name:0 "Devlet Dini Dönüşümü"
 ve_confessional_conversion_cost:0 "Maliyet: #Y 125 Dindarlık Reformu#!"
 ve_confessional_conversion_short:0 "Bir eyalette devlet dininin yayılmasını sağlayın.\nTamamlandığında #P +20 Dindarlık Reformu ve +5 Dini Yerleşim#! kazandırır; ancak radikalleşmeye yol açar."
 ve_confessional_conversion_desc:0 "#header Devlet Dini Dönüşümü#!\nDevlet dininin nüfus payı #Y %90#!ın altında olan, size ait bir eyalette yürütülür.\n\n#Y Maliyet#!\n#Y 125 Dindarlık Reformu#! hemen ödenir.\n\n#Y Proje sürerken#!\nÜlke genelinde #N -50 Bürokrasi ve -25 Otorite#!\nHedef eyalette #N +%20 Dönüşüm ve +%20 radikalleşme etkisi#!\n\n#Y Tamamlandığında#!\nHedef eyalet nüfusunun #Y %5#!i devlet dinine döner; Milliyetçi VII ile bu oran #Y %7#!ye çıkar.\n#P +20 Dindarlık Reformu ve +5 Dini Yerleşim#!\n\n#Y Uyarı#!\n#N Dönüşüm, hedef eyalette radikalleşme yaratır.#!"
