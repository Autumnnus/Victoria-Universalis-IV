l_turkish:
 ve_piety:0 "Dindarlık"
 ve_piety_reform:0 "Dindarlık Reformu"
 ve_piety_reform_tt:0 "#header Dindarlık Reformu#!\nMevcut: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nAylık gelir: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Aylık dağılım#!\nTaban: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nYönetim: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nDindarlık desteği: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nFikir doktrin: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Fikir doktrini — yalnızca mevcut Dini Modeliniz önemlidir#!\n#P İtirafçı Devlet / Devlet Ateizmi#!: Milliyetçi V #P +1#!\n#P Vicdan Özgürlüğü / Tam Ayrılık#!: Reformist V #P +1#!\nYukarıdaki aktif toplam şu şekilde sınırlandırılmıştır: #Y +1#!, dolayısıyla iki yol bir araya gelemez.\n\nÖğretiler ve Programlara (her biri #Y 25#! ) ve Hedeflenen Dini Projeye (#Y 100-150#!, modele bağlı). Gelir yavaşlıyor #Y 400#! ve durur #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Öğretiler ve Programlar"
 ve_piety_tt:0 "#header Dini Yerleşim#!\nMevcut durum: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nSosyal denge: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nAylık hareket: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Denge dökümü#!\nYerleştirme modeli: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nModel desteği: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nMeşruiyet, yönetim ve istikrar: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nSayaç hareket ediyor #Y %20#! her ay dengeye doğru, sınırlı #Y ±5#!.\n #P 75#!'de: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nŞu anda #N 25#! veya altı: #N -5 Meşruiyet ve -%5 Kanun Çıkarma Başarısı#!.\n\nBu sayaç artık Programlar için ödeme yapmıyor - bkz. Dindarlık Reformu. Programlar en az #Y 25#! Dindarlık Reformu gerektirir, maliyet #Y 25#! ve empoze etmek #Y 24 ay#! uygulama zorluğu.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Dini Proje"
 ve_religious_project_progress_tt:0 "#header Hedefli Dini Proje#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nAylık ilerleme: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (en az 1, en çok 7)\n\n#Y Aylık katkılar#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nYönetim: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nModel desteği: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nDini Yerleşim: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nDini Hareketler: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nHedef eyalet kargaşası: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nFikir Grupları: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Fikir Grubu bonusları#!\n#P Devlet Dini Düzeni#!: Milliyetçi VII #P +1#!\n#P Vicdan Özgürlüğü#!: Reformist VII #P +1#!\n#P Devlet Ateizmi#!: Milliyetçi VII #P +1#! ve Akademik VII #P +1#!\nEtkin Fikir Grubu bonuslarının toplamı en fazla #Y +2#! olabilir.\n\nSahip olduğunuz bir eyaletin panelinden proje başlatın. Devlet Dini Dönüşümü ve Devlet Ateizmi projeleri, tamamlandığında hedef eyalet nüfusunun #Y %5#!ini dönüştürür; Milliyetçi VII ile bu oran #Y %7#!ye çıkar ve radikalleşme yaratır. Vicdan Özgürlüğü ise zorla dönüştürme yerine sadıklar kazandırır. Toplam Ayrılık, bilinçli olarak tarafsız olduğundan proje başlatamaz.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "Devam ediyor"
