 ve_piety_reform:0 "Piety Reform"
 ve_piety_reform_tt:0 "#header Piety Reform#!\nMevcut: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nAylık gelir: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Aylık ayrıntı#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nİdare: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nDindar desteği: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nFikir doktrini: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\nNationalist V Confessional veya State Atheism'de #P +1#!; Reformist V Freedom of Conscience veya Total Separation'da #P +1#! verir. Fikir doktrini en fazla #Y +1#! olabilir.\n\nDoktrinler ve Programlar (her biri #Y 25#!) ile Hedefli Dini Proje (#Y 100-150#!, modele bağlı) için harcanır. Gelir #Y 400#! sonrasında yavaşlar, #Y 500#! değerinde durur."
 ve_religious_project_progress:0 "Dini Proje"
 ve_religious_project_progress_tt:0 "#header Hedefli Dini Proje#!\nİlerleme: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nAylık ilerleme: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (en az 1, en çok 7)\n\n#Y Aylık ayrıntı#!\nTemel: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nİdare: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nMeşruiyet: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nModel desteği: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nDini denge: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nDini hareketler: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nHedef eyalet karışıklığı: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nFikir Grupları: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\nNationalist VII Confessional veya State Atheism'de #P +1#!; Reformist VII Freedom of Conscience'da #P +1#!; Academic VII State Atheism'de #P +1#! verir. Fikir Grupları en fazla #Y +2#! olabilir.\n\nConfessional ve State Atheism tamamlanınca hedef eyalet nüfusunun #Y %5#!'ini dönüştürür; Nationalist VII ile #Y %7#! olur ve radikal ekler. Freedom of Conscience zorlama olmadan sadık ekler. Total Separation proje başlatamaz."
