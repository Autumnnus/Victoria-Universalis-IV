l_russian:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Национальная доктрина"
 VE_CP_COLLAPSE_TT:0 "Скрыть обзор Victoria Universalis для этой страны"
 VE_CP_EXPAND_TT:0 "Показать обзор Victoria Universalis для этой страны"

 VE_CP_INSIGHT_LABEL:0 "Национальный опыт"
 VE_CP_INSIGHT_TT:0 "#header Национальный опыт#!\nЗапас: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nТратится на отдельные идеи в рамках принятой группы идей."
 VE_CP_PIETY_LABEL:0 "Религиозное усердие"
 VE_CP_PIETY_TT:0 "#header Религиозное усердие#!\nЗапас: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nТратится на религиозные программы и целенаправленный религиозный проект."
 VE_CP_MANDATE_LABEL:0 "Культурный мандат"
 VE_CP_MANDATE_TT:0 "#header Культурный мандат#!\nЗапас: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nТратится на изменение модели идентичности и культурные проекты."
 VE_CP_MOMENTUM_LABEL:0 "Дыхание эпохи"
 VE_CP_MOMENTUM_TT:0 "#header Дыхание эпохи#!\nЗапас: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nПолучается за выполнение целей эпохи и тратится на награды эпохи. Дыхание эпохи сбрасывается с началом новой эпохи."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Идеи"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Группы идей#!\nИспользовано ячеек: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nСвободно ячеек: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nТекущие вложения в доктрину: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! активных приобретенных идей\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nАктивные групповые идеи приносят постоянный потенциал при #Y 4, 8, 13, 19, 26#! и #Y 34#!. Ячейки 5–6 также требуют эпохи II, а ячейка 7 требует эпохи III. Отмена группы снижает текущие вложения и никогда не возвращает национальный опыт, но уже накопленный потенциал сохраняется."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Национальные идеи"
 VE_CP_PROGRESS_LABEL:0 "Прогресс идей"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Прогресс национальной идеи#!\nПриобретенные групповые идеи: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nКаждая третья приобретенная групповая идея открывает новую национальную идею. Двадцать первая также дает национальный бонус."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Группы идей пока не приняты.#!"
 VE_CP_PROGRAMS_LABEL:0 "Религиозные программы"
 VE_CP_NONE_YET:0 "#lore Пока нет#!"
 VE_CP_PROJECT_LABEL:0 "Проект"
 VE_CP_COHESION_LABEL:0 "Национальное единение"
 VE_CP_OBJECTIVES_LABEL:0 "Цели эпохи"
 VE_CP_OBJECTIVES_TT:0 "#header Цели эпохи#!\nЗавершено в этой эпохе: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nКаждая выполненная цель приносит дыхание эпохи каждый месяц. Четыре завершенные цели открывают золотой век."
 VE_CP_REWARDS_LABEL:0 "Награды эпохи"
 VE_CP_REWARDS_VALUE:0 "Куплено в этой эпохе: [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]"
 VE_CP_REWARDS_TT:0 "#header Награды эпохи#!\nКуплено в этой эпохе: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nКаждая награда стоит дороже предыдущей, а эффекты наград заканчиваются с окончанием эпохи. Ячейки 10-13 специфичны для стран."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Неизвестная эпоха"
 ve_cp_golden_age_industrial_active:0 "#P Промышленный золотой век#!"
 ve_cp_golden_age_cultural_active:0 "#P Культурный золотой век#!"
 ve_cp_golden_age_strategic_active:0 "#P Стратегический золотой век#!"
 ve_cp_golden_age_spent:0 "#lore Золотой век использован#!"
 ve_cp_golden_age_ready:0 "#Y Доступен золотой век#!"
 ve_cp_golden_age_locked:0 "#lore Золотой век заблокирован#!"
 ve_cp_tier_high:0 "#P Процветание#!"
 ve_cp_tier_stable:0 "#lore Стабильно#!"
 ve_cp_tier_low:0 "#N Напряженно#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Принято, но в этой группе еще не куплено ни одной идеи.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Религиозный компромисс#!\nТекущее: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nРавновесие: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nЕжемесячное изменение: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nШкала смещается на 20% к равновесию каждый месяц, ограничиваясь #Y 5#! пунктами. При #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\nПри #N 25#! или ниже: #N -5 легитимность и -5% успех принятия закона#!."
 VE_CP_COHESION_TT:0 "#header Национальное единение#!\nТекущее: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nРавновесие: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nЕжемесячное изменение: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nЕдинение смещается на 20% к равновесию ежемесячно, в пределах #Y 5#! пунктов. При значении #P 75#! модель идентичности даёт дополнительное преимущество; при значении #N 25#! или ниже наступает национальная нестабильность."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Целевой религиозный проект#!\nСостояние: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Культурный проект#!\nСостояние: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nЦель: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "Прогресс: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nЕжемесячный прогресс: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Проект не запущен. Проект запускается в панели подконтрольной области, при этом Полное отделение не может его осуществлять.#!"
 ve_cp_cultural_project_detail_active:0 "Прогресс: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nЕжемесячный прогресс: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Проект не запущен. Общестрановые проекты запускаются в панели национальной идентичности, целевые — в панели подконтрольной области.#!"
