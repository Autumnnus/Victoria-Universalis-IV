l_russian:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Национальная доктрина"
 VE_CP_COLLAPSE_TT:0 "Скрыть обзор Victoria Universalis для этой страны"
 VE_CP_EXPAND_TT:0 "Показать обзор Victoria Universalis для этой страны"

 VE_CP_INSIGHT_LABEL:0 "Национальное понимание"
 VE_CP_INSIGHT_TT:0 "#header National Insight#!\nЗапасы: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nЗатраты на отдельные идеи внутри принятой группы идей."
 VE_CP_PIETY_LABEL:0 "Реформа благочестия"
 VE_CP_PIETY_TT:0 "#header Реформа благочестия#!\nЗапасы: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nПотрачено на религиозные программы и целевые религиозные проекты."
 VE_CP_MANDATE_LABEL:0 "Культурный мандат"
 VE_CP_MANDATE_TT:0 "#header Культурный мандат#!\nАкции: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nПотрачено на изменение модели идентичности и на культурные проекты."
 VE_CP_MOMENTUM_LABEL:0 "Эра Импульс"
 VE_CP_MOMENTUM_TT:0 "#header Era Momentum#!\nАкции: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nПолучено от выполнили цели эпохи и потратили на награды эпохи. Импульс сбрасывается с началом новой эпохи."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Идеи"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Группы идей#!\nИспользуемые слоты: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nБесплатные слоты: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nТекущая доктрина инвестиций: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! активные купленные идеи\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nАктивные групповые идеи приносят постоянную емкость в #Y 4, 8, 13, 19, 26#! и #Y 34#!. Для слотов 5–6 также требуется возраст 2, а для слота 7 — возраст 3. Отмена группы снижает текущие инвестиции и никогда не возвращает Insight, но уже заработанные мощности сохраняются."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Национальные идеи"
 VE_CP_PROGRESS_LABEL:0 "Прогресс идеи"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Прогресс национальной идеи#!\nКупленные групповые идеи: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nКаждая третья купленная групповая идея открывает следующую Национальную идею. Двадцать первый также предоставляет Национальный бонус."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Ни одна группа идей пока не приняла.#!"
 VE_CP_PROGRAMS_LABEL:0 "Религиозные программы"
 VE_CP_NONE_YET:0 "#lore Пока нет#!"
 VE_CP_PROJECT_LABEL:0 "Проект"
 VE_CP_COHESION_LABEL:0 "Национальное сплочение"
 VE_CP_OBJECTIVES_LABEL:0 "Цели эпохи"
 VE_CP_OBJECTIVES_TT:0 "#header Цели эпохи#!\nЗавершено в эту эпоху: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nКаждая выполненная цель приносит Импульс Эры каждый месяц. Четыре выполненные задачи открывают Золотой век."
 VE_CP_REWARDS_LABEL:0 "Награды эпохи"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] купленные в эту эпоху"
 VE_CP_REWARDS_TT:0 "#header Награды эпохи#!\nКупленные в эту эпоху: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nКаждая награда стоит дороже предыдущей, а эффекты награды заканчиваются с течением Эпохи. Слоты 10–13 зависят от страны."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Неизвестный век"
 ve_cp_golden_age_industrial_active:0 "#P Промышленный золотой век#!"
 ve_cp_golden_age_cultural_active:0 "#P Культурный золотой век#!"
 ve_cp_golden_age_strategic_active:0 "#P Стратегический золотой век#!"
 ve_cp_golden_age_spent:0 "#lore Золотой век используется#!"
 ve_cp_golden_age_ready:0 "#Y Золотой век доступен#!"
 ve_cp_golden_age_locked:0 "#lore Золотой век заблокирован#!"
 ve_cp_tier_high:0 "#P Процветающий#!"
 ve_cp_tier_stable:0 "#lore Стабильный#!"
 ve_cp_tier_low:0 "#N Напряжённый#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Принят, но в этой группе пока нет идей.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Религиозное поселение#!\nТекущий: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nРавновесие: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nМесячное движение: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nКамера перемещается на 20% к равновесию каждый месяц, ограниченный  #Y 5#! пунктами. В #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\nВ #N 25#! или ниже: #N -5 Легитимность и -5% Успех принятия закона#!."
 VE_CP_COHESION_TT:0 "#header Национальная сплоченность#!\nТекущий: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nРавновесие: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nМесячное движение: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nСплоченность перемещается на 20% к равновесию каждый месяц, ограничено  #Y 5#! точки. В #P 75#! Модель идентичности дает дополнительную выгоду; в #N 25#! или ниже действует национальная нестабильность."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Целевой религиозный проект#!\nСтатус: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Культурный проект#!\nСтатус: #Y [Country.GetCustom('ve_cultural_project_name')]#!\nЦель: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "Прогресс: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nЕжемесячный прогресс: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Ни один проект не запущен. Проект запускается с панели принадлежащего ему состояния, и Total Separation не может его запустить.#!"
 ve_cp_cultural_project_detail_active:0 "Прогресс: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nЕжемесячный прогресс: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Ни один проект не запущен. Общенациональные проекты начинаются с панели национальной идентичности, целевые — с панели штата.#!"
