l_russian:
 ve_je_religious_settlement_transition:0 "Переходный период религиозного компромисса"
 ve_je_religious_settlement_transition_reason:0 "Правовые основы взаимоотношений церкви и государства изменились. Институты, общины и должностные лица должны адаптироваться, пока действует переходный кризис. Решающее значение имеет модификатор кризиса, а не календарь этой Записи в дневнике."
 ve_je_religious_settlement_transition_complete_tt:0 "Переходный кризис религиозного компромисса завершился."
 ve_je_religious_settlement_transition_status_confessional:0 "Целевой компромисс: #Y Конфессиональное государство#!\nРелигиозный компромисс: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nПримерное оставшееся время: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] мес.#!\nПройдено вех: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nИтог по окончании кризиса: при значении #Y 60+#! компромисс стабилизируется досрочно, при #Y 26-59#! разрешение будет нейтральным, а при #Y 25 и ниже#! начнется кризис. Каждая оставшаяся веха предлагает выбор, влияющий на Религиозный компромисс."
 ve_je_religious_settlement_transition_status_freedom:0 "Целевой компромисс: #Y Свобода совести#!\nРелигиозный компромисс: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nПримерное оставшееся время: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] мес.#!\nПройдено вех: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nИтог по окончании кризиса: при значении #Y 60+#! компромисс стабилизируется досрочно, при #Y 26-59#! разрешение будет нейтральным, а при #Y 25 и ниже#! начнется кризис. Каждая оставшаяся веха предлагает выбор, влияющий на Религиозный компромисс."
 ve_je_religious_settlement_transition_status_separation:0 "Целевой компромисс: #Y Полное разделение#!\nРелигиозный компромисс: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nПримерное оставшееся время: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] мес.#!\nПройдено вех: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nИтог по окончании кризиса: при значении #Y 60+#! компромисс стабилизируется досрочно, при #Y 26-59#! разрешение будет нейтральным, а при #Y 25 и ниже#! начнется кризис. Каждая оставшаяся веха предлагает выбор, влияющий на Религиозный компромисс."
 ve_je_religious_settlement_transition_status_atheism:0 "Целевой компромисс: #Y Государственный атеизм#!\nРелигиозный компромисс: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nПримерное оставшееся время: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] мес.#!\nПройдено вех: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nИтог по окончании кризиса: при значении #Y 60+#! компромисс стабилизируется досрочно, при #Y 26-59#! разрешение будет нейтральным, а при #Y 25 и ниже#! начнется кризис. Каждая оставшаяся веха предлагает выбор, влияющий на Религиозный компромисс."

 ve_je_national_compact_transition:0 "Переходный период национального пакта"
 ve_je_national_compact_transition_reason:0 "Государство приняло новое определение национальной принадлежности. Администраторы, элиты и общины должны договариваться об условиях пакта, пока действует переходный отпор. Решающее значение имеет модификатор отпора, а не календарь этой Записи в дневнике."
 ve_je_national_compact_transition_complete_tt:0 "Переходный отпор национального пакта завершился."
 ve_je_national_compact_transition_status_ethnic:0 "Целевая идентичность: #Y Этническая идентичность#!\nНациональное единение: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nПримерное оставшееся время: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] мес.#!\nПройдено вех: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nИтог по окончании отпора: при значении #Y 60+#! единение стабилизируется досрочно, при #Y 26-59#! разрешение будет нейтральным, а при #Y 25 и ниже#! начнется кризис. Каждая оставшаяся веха предлагает выбор, влияющий на Национальное единение."
 ve_je_national_compact_transition_status_civic:0 "Целевая идентичность: #Y Гражданская идентичность#!\nНациональное единение: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nПримерное оставшееся время: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] мес.#!\nПройдено вех: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nИтог по окончании отпора: при значении #Y 60+#! единение стабилизируется досрочно, при #Y 26-59#! разрешение будет нейтральным, а при #Y 25 и ниже#! начнется кризис. Каждая оставшаяся веха предлагает выбор, влияющий на Национальное единение."
 ve_je_national_compact_transition_status_composite:0 "Целевая идентичность: #Y Смешанная идентичность#!\nНациональное единение: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nПримерное оставшееся время: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] мес.#!\nПройдено вех: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nИтог по окончании отпора: при значении #Y 60+#! единение стабилизируется досрочно, при #Y 26-59#! разрешение будет нейтральным, а при #Y 25 и ниже#! начнется кризис. Каждая оставшаяся веха предлагает выбор, влияющий на Национальное единение."
 ve_je_transition_resolving_status:0 "Переходные показатели сверяются с текущим положением дел в государстве."

 ve_rel_transition_conciliatory_tt:0 "Потратить #N 10#! религиозного усердия и получить #P 3#! к религиозному компромиссу."
 ve_rel_transition_central_tt:0 "Получить #P 5#! религиозного усердия и потерять #N 3#! религиозного компромисса."
 ve_rel_transition_doctrine_tt:0 "Потратить #N 5#! религиозного усердия и получить #P 2#! к религиозному компромиссу."

 ve_rel_evt.210.t:0 "Пределы духовных назначений"
 ve_rel_evt.210.d:0 "Религиозные авторитеты представили списки кандидатов на государственные должности, тогда как высшие чиновники настаивают на том, что служба государству по-прежнему должна вознаграждать за компетентность. Первые назначения в рамках нового урегулирования определят, где заканчивается совет духовенства и начинается гражданская власть."
 ve_rel_evt.210.a:0 "Созвать смешанную комиссию по назначениям."
 ve_rel_evt.210.b:0 "Принять списки духовенства."
 ve_rel_evt.210.c:0 "Совместить стандартные экзамены с религиозными наставлениями."

 ve_rel_evt.211.t:0 "Школы и клятвы Лояльность"
 ve_rel_evt.211.d:0 "Церковно-приходские школы добиваются признанного места в государственной системе. Их попечители требуют защиты религиозного обучения, в то время как чиновники опасаются, что соперничающие учебные планы и присяги разделят следующее поколение."
 ve_rel_evt.211.a:0 "Гарантировать единый базовый учебный план."
 ve_rel_evt.211.b:0 "Навязать единую всеобщую присягу Лояльность."
 ve_rel_evt.211.c:0 "Подчинить компромисс Бюрократическая инспекции."

 ve_rel_evt.220.t:0 "Язык гарантий для меньшинств"
 ve_rel_evt.220.d:0 "Общины меньшинств требуют чётко прописать их защиту в новом урегулировании. Правительственные юристы, напротив, выступают за единую общую статью, предупреждая, что обещания для конкретных общин могут лишь укрепить старые разногласия."
 ve_rel_evt.220.a:0 "Изложить гарантии простым языком."
 ve_rel_evt.220.b:0 "Использовать единое положение о гражданстве."
 ve_rel_evt.220.c:0 "Поручить коалиции реформаторов выработать приемлемую формулировку."

 ve_rel_evt.221.t:0 "Представительство в общих Институты"
 ve_rel_evt.221.d:0 "Школы, больницы и местные советы теперь должны на равных обслуживать граждан различных конфессий. Вопрос в том, должно ли представительство опираться на местные реалии или на формулу, спущенную сверху."
 ve_rel_evt.221.a:0 "Сбалансировать представительство на местах."
 ve_rel_evt.221.b:0 "Установить центральную квоту."
 ve_rel_evt.221.c:0 "Договариваться о формуле Дипломатическая представительства."

 ve_rel_evt.230.t:0 "Нейтралитет реестр"
 ve_rel_evt.230.d:0 "Акты гражданского состояния — рождения, браки и Претензии на имущество — переходят от религиозных служителей к гражданским регистраторам. Чиновники могут вести дублирующие записи на переходный период, но реформаторы требуют четкого и немедленного размежевания."
 ve_rel_evt.230.a:0 "Вести двойной учет на переходный период."
 ve_rel_evt.230.b:0 "Немедленно закрыть религиозные реестры."
 ve_rel_evt.230.c:0 "Задействовать обученную сеть государственной службы."

 ve_rel_evt.231.t:0 "Школа и общественные церемонии"
 ve_rel_evt.231.d:0 "Принцип Нейтралитет государства дошел до школьных собраний и публичных церемоний. Местные общины хотят сохранить место для унаследованных обычаев, а центральные власти желают единого светского протокола без всяких двусмысленностей."
 ve_rel_evt.231.a:0 "Оставить простор для местных церемоний."
 ve_rel_evt.231.b:0 "Утвердить в качестве обязательного единый светский протокол."
 ve_rel_evt.231.c:0 "Создать общий гражданский церемониальный стандарт."

 ve_rel_evt.240.t:0 "Дефицит светских кадров"
 ve_rel_evt.240.d:0 "Новой администрации нужны учителя, регистраторы и инспекторы, способные работать независимо от религиозных институтов. Подготовленных кандидатов крайне мало, а принуждение нынешних служащих изменить свои методы работы может вызвать сопротивление."
 ve_rel_evt.240.a:0 "Финансировать новую программу подготовки кадров."
 ve_rel_evt.240.b:0 "Принудить существующий персонал к адаптации."
 ve_rel_evt.240.c:0 "Создать Академическая сеть подготовки кадров."

 ve_rel_evt.241.t:0 "Имущество и тайные богослужения"
 ve_rel_evt.241.d:0 "Передача религиозного имущества заставила некоторые общины уйти в подполье. Немедленная конфискация позволила бы быстро усилить новое государство, но поспешное урегулирование грозит превратить Частное богослужение в Организованное сопротивление."
 ve_rel_evt.241.a:0 "Передавать имущество постепенно."
 ve_rel_evt.241.b:0 "Национализировать его немедленно."
 ve_rel_evt.241.c:0 "Направить активы в Социальная учреждения под надзором."

 ve_rel_evt.290.t:0 "Компромисс пускает корни"
 ve_rel_evt.290.d:0 "Переходный кризис миновал, не разрушив религиозный компромисс страны. Администраторы теперь действуют по новым правилам, общины знают своё положение, а правительство может обратить этот опыт либо в потенциал реформ, либо в более глубокое общественное доверие."
 ve_rel_evt.290.a:0 "Перенести уроки на следующую реформу."
 ve_rel_evt.290.a.tt:0 "Получить #P 10#! Религиозное усердие."
 ve_rel_evt.290.b:0 "Публично подтвердить компромисс."
 ve_rel_evt.290.b.tt:0 "Получить #P 3#! Религиозный компромисс."

 ve_rel_evt.291.t:0 "Хрупкое равновесие"
 ve_rel_evt.291.d:0 "Официальный переход завершен, но новый компромисс остается плодом осторожности, а не убеждения. Можно предоставить ему развиваться самостоятельно, укрепить его еще одной ограниченной уступкой или стабилизировать с помощью институтов, соответствующих принятой модели."
 ve_rel_evt.291.a:0 "Оставить компромисс в силе."
 ve_rel_evt.291.a.tt:0 "Переход завершается без дополнительных механических эффектов."
 ve_rel_evt.291.b:0 "Профинансировать последнюю уступку."
 ve_rel_evt.291.b.tt:0 "Потратить #N 10#! Религиозное усердие и получить #P 3#! Религиозный компромисс."
 ve_rel_evt.291.c:0 "Вверить компромисс институтам, соответствующим модели."
 ve_rel_evt.291.c.tt:0 "Потратить #N 5#! Религиозное усердие и получить #P 2#! Религиозный компромисс. Требуется Идея, соответствующая принятой Религиозная модель."

 ve_rel_evt.292.t:0 "Кризис компромисса"
 ve_rel_evt.292.d:0 "Переходный модификатор истек, однако страна не приняла новый религиозный порядок. Правительство может потратить скудный потенциал реформ на чрезвычайные уступки, положиться на институты, соответствующие модели, для более узкого вмешательства или позволить неразрешенному конфликту радикализовать часть населения."
 ve_rel_evt.292.a:0 "Заплатить цену чрезвычайной уступки."
 ve_rel_evt.292.a.tt:0 "Потратить #N 15#! Религиозное усердие и получить #P 5#! Религиозный компромисс."
 ve_rel_evt.292.b:0 "У государства не осталось уступок."
 ve_rel_evt.292.b.tt:0 "#N 0.25%#! населения страны становятся Радикал."
 ve_rel_evt.292.c:0 "Использовать институты, созданные для этого компромисса."
 ve_rel_evt.292.c.tt:0 "Потратить #N 5#! Религиозное усердие и получить #P 2#! Религиозный компромисс. Требуется Идея, соответствующая принятой Религиозная модель."

 ve_identity_transition_conciliatory_tt:0 "Потратить #N 10#! Культурный мандат и получить #P 3#! Национальное единение."
 ve_identity_transition_central_tt:0 "Получить #P 5#! Культурный мандат и потерять #N 3#! Национальное единение."
 ve_identity_transition_doctrine_tt:0 "Потратить #N 5#! Культурный мандат и получить #P 2#! Национальное единение."

 ve_cul_evt.210.t:0 "Официальный язык государства"
 ve_cul_evt.210.d:0 "Новый национальный пакт требует общего языка для судов, школ и государственной службы. Немедленное единообразие было бы легко администрировать, но многие опытные чиновники и граждане еще не соответствуют предлагаемым стандартам."
 ve_cul_evt.210.a:0 "Внедрять язык посредством поэтапного обучения."
 ve_cul_evt.210.b:0 "Издать указ об одном языке."
 ve_cul_evt.210.c:0 "Мобилизовать национальную администрацию."

 ve_cul_evt.211.t:0 "Служба и членство"
 ve_cul_evt.211.d:0 "Воинская служба и статус ветерана становятся доказательствами принадлежности к нации. Общины, охваченные новым пактом, требуют времени на адаптацию, в то время как центр настаивает, что принадлежность должна нести одно единое Обязательство."
 ve_cul_evt.211.a:0 "Предоставить переходные исключения."
 ve_cul_evt.211.b:0 "Применить единое обязательство службы."
 ve_cul_evt.211.c:0 "Создать всеобщий реестр службы."

 ve_cul_evt.220.t:0 "Реестр равного гражданства"
 ve_cul_evt.220.d:0 "Старые этнические и религиозные категории остаются заложенными в публичных записях. Их немедленное удаление провозгласило бы равное гражданство, но местные ведомства предупреждают, что поспешное Обращение может стереть Претензии и нарушить доступ к услугам."
 ve_cul_evt.220.a:0 "Поэтапно ввести общий гражданский реестр."
 ve_cul_evt.220.b:0 "Немедленно удалить старые категории."
 ve_cul_evt.220.c:0 "Передать Обращение в ведение комиссии по реформам."

 ve_cul_evt.221.t:0 "Общая школа, общая служба"
 ve_cul_evt.221.d:0 "Равный доступ гарантирован законом, однако в школах и государственных ведомствах по-прежнему не хватает кадров для его обеспечения. Правительству предстоит сделать выбор между терпеливыми инвестициями, единым обязательным центральным стандартом и национальной сетью академической квалификации."
 ve_cul_evt.221.a:0 "Инвестировать в учителей и чиновников."
 ve_cul_evt.221.b:0 "Внедрить единый центральный стандарт."
 ve_cul_evt.221.c:0 "Создать сеть академической квалификации."

 ve_cul_evt.230.t:0 "Совет составных народов"
 ve_cul_evt.230.d:0 "Общины, упомянутые в составном договоре, требуют права голоса в управлении им. Открытые переговоры могут принести Легитимность, в то время как фиксированная квота, разработанная в столице, обещает более быстрое и предсказуемое урегулирование."
 ve_cul_evt.230.a:0 "Начать представительские переговоры."
 ve_cul_evt.230.b:0 "Навязать установленную столицей квоту."
 ve_cul_evt.230.c:0 "Заключить парламентский компромисс."

 ve_cul_evt.231.t:0 "Многоуровневая администрация"
 ve_cul_evt.231.d:0 "Местная власть и центральные стандарты теперь пересекаются по всему составному государству. Без четкого протокола каждое ведомство будет заново договариваться о границах полномочий; при слишком жесткой вертикали Командование договор может утратить свой смысл."
 ve_cul_evt.231.a:0 "Договариваться о протоколе компетенций."
 ve_cul_evt.231.b:0 "Установить централизованную вертикаль Командование."
 ve_cul_evt.231.c:0 "Создать общий бюрократический реестр."

 ve_cul_evt.290.t:0 "Новый национальный пакт"
 ve_cul_evt.290.d:0 "Отпор пошел на спад, а новое определение национальной принадлежности пустило корни. Правительство может сохранить административный опыт в качестве Культурный мандат или воспользоваться моментом, чтобы укрепить Уверенность в пакте."
 ve_cul_evt.290.a:0 "Перенести этот Опыт в будущее государственное строительство."
 ve_cul_evt.290.a.tt:0 "Получить #P 10#! Культурный мандат."
 ve_cul_evt.290.b:0 "Празздновать заключение пакта по всей стране."
 ve_cul_evt.290.b.tt:0 "Получить #P 3#! Национальное единение."

 ve_cul_evt.291.t:0 "Хрупкий пакт"
 ve_cul_evt.291.d:0 "Формальный переходный период завершен, однако новая национальная идентичность принимается далеко не везде. Правительство может позволить компромиссу устояться, потратить ограниченный мандат на еще одно урегулирование или укрепить его с помощью Институты, соответствующих принятой модели."
 ve_cul_evt.291.a:0 "Позволить компромиссу обрести собственный Баланс."
 ve_cul_evt.291.a.tt:0 "Переходный период завершается без дополнительных механических эффектов."
 ve_cul_evt.291.b:0 "Профинансировать последнее урегулирование."
 ve_cul_evt.291.b.tt:0 "Потратить #N 10#! Культурный мандат и получить #P 3#! Национальное единение."
 ve_cul_evt.291.c:0 "Поручить пакт Институты, соответствующим модели."
 ve_cul_evt.291.c.tt:0 "Потратить #N 5#! Культурный мандат и получить #P 2#! Национальное единение. Требуется идея, соответствующая принятой Модель идентичности."

 ve_cul_evt.292.t:0 "Кризис национального пакта"
 ve_cul_evt.292.d:0 "Отпор в ходе переходного периода сошел на нет, однако новое определение принадлежности не смогло вызвать широкую Лояльность. Правительство может потратить дефицитный мандат на экстренное урегулирование, опереться на Институты, соответствующие модели, для более точечного вмешательства или принять волну Радикализация."
 ve_cul_evt.292.a:0 "Оплатить экстренное урегулирование."
 ve_cul_evt.292.a.tt:0 "Потратить #N 15#! Культурный мандат и получить #P 5#! Национальное единение."
 ve_cul_evt.292.b:0 "Правительство обеспечит соблюдение пакта в первозданном виде."
 ve_cul_evt.292.b.tt:0 "#N 0.25%#! Население страны становятся Радикал."
 ve_cul_evt.292.c:0 "Использовать Институты, созданные для этой идентичности."
 ve_cul_evt.292.c.tt:0 "Потратить #N 5#! Культурный мандат и получить #P 2#! Национальное единение. Требуется идея, соответствующая принятой Модель идентичности."
