l_russian:
 ve_doctrine_ambient_cooldown_mdf:0 "Перерыв в обсуждении доктрин"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Институты страны усваивают последствия недавних дебатов о доктринах."
 ve_doctrine_ambient_ig_supported_mdf:0 "Институциональная поддержка"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Правительство ответило этой заинтересованной группе заметную Роль в разрешении спора о доктрине."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Институциональное пренебрежение"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Правительство отстранило эту заинтересованную группу от недавнего урегулирования вопросов доктрины."

 ve_doctrine_industrialist_positive_mdf:0 "Стандартизированная промышленная практика"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Предприятия извлекают выгоду из скоординированного свода правил промышленной деятельности."
 ve_doctrine_industrialist_negative_mdf:0 "Промышленные узкие места"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Нерешенные проблемы координации сдерживают развитие промышленности."
 ve_doctrine_academic_positive_mdf:0 "Скоординированная исследовательская сеть"
 ve_doctrine_academic_positive_mdf_desc:0 "Университеты делятся методами, кадрами и результатами через скоординированную сеть."
 ve_doctrine_academic_negative_mdf:0 "Академические узкие места"
 ve_doctrine_academic_negative_mdf_desc:0 "Споры о квалификации и координации дестабилизируют работу университетов."
 ve_doctrine_nationalist_positive_mdf:0 "Сеть национальных ассоциаций"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Национальные ассоциации претворяют легитимное Правительство в широкую лояльность."
 ve_doctrine_nationalist_negative_mdf:0 "Конкурирующие национальные общества"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Организации-соперники превращают политическую легитимность в новые поводы для недовольства."
 ve_doctrine_reformist_positive_mdf:0 "Организованная сеть реформ"
 ve_doctrine_reformist_positive_mdf_desc:0 "Политические движения получили упорядоченные каналы для участия и компромисса."
 ve_doctrine_reformist_negative_mdf:0 "Расколотая коалиция реформистов"
 ve_doctrine_reformist_negative_mdf_desc:0 "Конкурирующие реформистские организации превращают политическую мобилизацию в радикализм."
 ve_doctrine_professional_army_positive_mdf:0 "Цикл подготовки кадров"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Скоординированная кадровая программа совершенствует систему подготовки армии."
 ve_doctrine_professional_army_negative_mdf:0 "Проблема офицерского корпуса"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Споры о продвижении по службе и кадровом составе замедляют военную подготовку."
 ve_doctrine_agrarian_positive_mdf:0 "Скоординированная сельскохозяйственная практика"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Сельские институты распространяют надежные методы по всей аграрной экономике."
 ve_doctrine_agrarian_negative_mdf:0 "Дефицит сельскохозяйственного снабжения"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Нехватка семян, кредит и отсутствие координации снижают товарооборот сельского хозяйства."

 ve_idea_evt.10.t:0 "Правила безопасности при полной выработке"
 ve_idea_evt.10.d:0 "Череда заводских аварий вынесла вопрос о промышленном инспектировании на обсуждение общественности. Независимые инспекторы обещают надежные стандарты, в то время как промышленники настаивают, что добровольные правила позволят сохранить объемы производства и инициативу."
 ve_idea_evt.10.a:0 "Назначить независимых инспекторов."
 ve_idea_evt.10.a.tt:0 "Потратить #N 25#! Национальный опыт. Профсоюзы получают #P +1#! Одобрение, а Промышленники теряют #N 1#! Одобрение на 24 месяцев."
 ve_idea_evt.10.b:0 "Позволить Промышленность самим составить добровольные правила."
 ve_idea_evt.10.b.tt:0 "Промышленники получают #P +1#! Одобрение, а Профсоюзы теряют #N 1#! Одобрение на 24 месяцев."
 ve_idea_evt.10.c:0 "Стандартизировать правила поэтапно."
 ve_idea_evt.10.c.tt:0 "Потратить #N 10#! Национальный опыт. Одобрение заинтересованной группы не меняется."

 ve_idea_evt.11.t:0 "Стандартизированные детали машин"
 ve_idea_evt.11.d:0 "Инженеры из нескольких промышленных районов создали общий каталог калибров, арматуры и деталей машин. Финансирование национального стандарта потребует больших затрат, но позволит устранить трения в производственной сети."
 ve_idea_evt.11.a:0 "Принять стандарты по всей стране."
 ve_idea_evt.11.a.tt:0 "Потратить #N 40#! национального опыта и получить #P +5%#! к товарообороту промышленности на 36 месяцев."
 ve_idea_evt.11.b:0 "Архивировать разработки на будущее."
 ve_idea_evt.11.b.tt:0 "Получить #P 15#! национального опыта."
 ve_idea_evt.11.c:0 "Наши производственные сети уже готовы."
 ve_idea_evt.11.c.tt:0 "Потратить #N 20#! национального опыта и получить #P +5%#! к товарообороту промышленности на 36 месяцев."

 ve_idea_evt.12.t:0 "Узкое место на производстве"
 ve_idea_evt.12.d:0 "Заказы накапливаются, в то время как несовместимые процедуры, задержки компонентов и путаница в графиках парализуют фабрики страны. Правительство может направить специалистов, предоставить фирмам самим разбираться с проблемой или задействовать существующие строительные управления для координации ответа."
 ve_idea_evt.12.a:0 "Направить группу специалистов."
 ve_idea_evt.12.a.tt:0 "Потратить #N 25#! национального опыта и избежать промышленного штрафа."
 ve_idea_evt.12.b:0 "Фабрики должны решить это сами."
 ve_idea_evt.12.b.tt:0 "Понести штраф: #N -5%#! к товарообороту промышленности на 24 месяца."
 ve_idea_evt.12.c:0 "Задействовать строительные бюро."
 ve_idea_evt.12.c.tt:0 "Потратить #N 10#! национального опыта и избежать промышленного штрафа."

 ve_idea_evt.60.t:0 "Механизация и землевладение"
 ve_idea_evt.60.d:0 "Новая техника могла бы повысить сельскохозяйственное производство, но арендаторы и мелкие землевладельцы опасаются, что быстрый переход подорвет основы сельского уклада. Правительство должно решить, ускорять ли механизацию, сначала защитить арендаторов или координировать постепенный местный переход."
 ve_idea_evt.60.a:0 "Создать фонд механизации."
 ve_idea_evt.60.a.tt:0 "Потратить #N 25#! национального опыта и получить #P +5%#! к agricultural throughput на 24 месяца. Промышленники получают #P +1#! к одобрению, а Селяне теряют #N 1#! к одобрению на 24 месяца."
 ve_idea_evt.60.b:0 "Обеспечить положение арендаторов до переустройства ферм."
 ve_idea_evt.60.b.tt:0 "Селяне получают #P +1#! к одобрению, а Землевладельцы теряют #N 1#! к одобрению на 24 месяца."
 ve_idea_evt.60.c:0 "Использовать местные производственные сети для постепенного перехода."
 ve_idea_evt.60.c.tt:0 "Потратить #N 10#! национального опыта и получить #P +5%#! к agricultural throughput на 24 месяца. Одобрение заинтересованных групп не изменится."

 ve_idea_evt.61.t:0 "Кооперативные амбары"
 ve_idea_evt.61.d:0 "Сельские делегаты продемонстрировали сеть кооперативных амбаров, способную распределять запасы, учет и транспорт. Национальная программа могла бы усилить координацию в сельском хозяйстве, тогда как простое сохранение планов все равно обогатило бы институциональные знания правительства."
 ve_idea_evt.61.a:0 "Финансировать кооперативную сеть."
 ve_idea_evt.61.a.tt:0 "Потратить #N 40#! национального опыта и получить #P +5%#! к agricultural throughput на 36 месяцев."
 ve_idea_evt.61.b:0 "Передать учетные данные в сельскохозяйственные ведомства."
 ve_idea_evt.61.b.tt:0 "Получить #P 15#! национального опыта."
 ve_idea_evt.61.c:0 "Использовать уже существующие сельские институты."
 ve_idea_evt.61.c.tt:0 "Потратить #N 20#! национального опыта и получить #P +5%#! к agricultural throughput на 36 месяцев."

 ve_idea_evt.62.t:0 "Дефицит семян и кредитов"
 ve_idea_evt.62.d:0 "Низкое качество семенного фонда и сокращение сельских кредитов угрожают предстоящему сельскохозяйственному циклу. Специалисты могут организовать экстренные меры, местным сетям можно позволить импровизировать, или же существующие институты жизнеобеспечения могут временно взять на себя это бремя."
 ve_idea_evt.62.a:0 "Организовать экстренную экспертную программу."
 ve_idea_evt.62.a.tt:0 "Потратить #N 25#! национального опыта и избежать сельскохозяйственного штрафа."
 ve_idea_evt.62.b:0 "Позволить местным сетям найти собственное решение."
 ve_idea_evt.62.b.tt:0 "Понести штраф: #N -5%#! к agricultural throughput на 24 месяца."
 ve_idea_evt.62.c:0 "Использовать сети жизнеобеспечения в качестве временной опоры."
 ve_idea_evt.62.c.tt:0 "Потратить #N 10#! национального опыта и избежать сельскохозяйственного штрафа."

 ve_idea_evt.20.t:0 "Патронаж или экспертная оценка"
 ve_idea_evt.20.d:0 "Правительство ожидает практических результатов от своих исследовательских грантов, в то время как ученые предупреждают, что патронаж заменит факты политической целесообразностью. Прочное соглашение должно определить, кто будет судить об образованности страны."
 ve_idea_evt.20.a:0 "Создать независимые экспертные советы."
 ve_idea_evt.20.a.tt:0 "Потратить #N 25#! Национальный опыт. Интеллигенты получают #P +1#! к одобрению, а Мелкие буржуа теряют #N 1#! к одобрению на 24 месяцев."
 ve_idea_evt.20.b:0 "Позволить государству определить приоритеты исследований."
 ve_idea_evt.20.b.tt:0 "Мелкие буржуа получают #P +1#! к одобрению, а Интеллигенты теряют #N 1#! к одобрению на 24 месяцев."
 ve_idea_evt.20.c:0 "Институционализировать общие академические стандарты."
 ve_idea_evt.20.c.tt:0 "Потратить #N 10#! Национальный опыт. Одобрение заинтересованных групп не изменится."
 ve_idea_evt.21.t:0 "Провинциальная исследовательская сеть"
 ve_idea_evt.21.d:0 "Провинциальные колледжи начали обмениваться преподавателями, приборами и результатами исследований без централизованного руководства. Официальная поддержка могла бы превратить это стихийное сотрудничество в национальную исследовательскую сеть."
 ve_idea_evt.21.a:0 "Профинансировать сеть."
 ve_idea_evt.21.a.tt:0 "Потратить #N 40#! Национальный опыт и получить #P +5%#! к товарообороту Университеты на 36 месяцев."
 ve_idea_evt.21.b:0 "Поместить отчеты в центральный архив."
 ve_idea_evt.21.b.tt:0 "Получить #P 15#! Национальный опыт."
 ve_idea_evt.21.c:0 "Подключить ее к национальной академии."
 ve_idea_evt.21.c.tt:0 "Потратить #N 20#! Национальный опыт и получить #P +5%#! к товарообороту Университеты на 36 месяцев."
 ve_idea_evt.22.t:0 "Узкое место аттестации"
 ve_idea_evt.22.d:0 "Университеты не успевают оценивать растущее число студентов, преподавателей и новых дисциплин. Задержка с выдачей документов теперь угрожает всей системе исследований."
 ve_idea_evt.22.a:0 "Расширить потенциал оценивания."
 ve_idea_evt.22.a.tt:0 "Потратить #N 25#! Национальный опыт и избежать академического штрафа."
 ve_idea_evt.22.b:0 "Существующие институты должны справиться."
 ve_idea_evt.22.b.tt:0 "Понести штраф #N -5%#! к товарообороту Университеты на 24 месяцев."
 ve_idea_evt.22.c:0 "Стандартизировать через школьную сеть."
 ve_idea_evt.22.c.tt:0 "Потратить #N 10#! Национальный опыт и избежать академического штрафа."

 ve_idea_evt.30.t:0 "Один канон, множество традиций"
 ve_idea_evt.30.d:0 "Чиновники, готовящие национальный канон, расходятся во мнениях относительно места провинциальных обычаев. Единый свод обещает ясность, но исключение местных традиций может ослабить ту самую нацию, которую он призван определить."
 ve_idea_evt.30.a:0 "Вплести местные традиции в общую историю."
 ve_idea_evt.30.a.tt:0 "Потратить #N 25#! Национальный опыт. Селяне получают #P +1#! к одобрению, а Мелкие буржуа теряют #N 1#! к одобрению на 24 месяцев."
 ve_idea_evt.30.b:0 "Провозгласить единый официальный канон."
 ve_idea_evt.30.b.tt:0 "Мелкие буржуа получают #P +1#! к одобрению, а Селяне теряют #N 1#! к одобрению на 24 месяцев."
 ve_idea_evt.30.c:0 "Поручить эту работу подготовленным культурным кадрам."
 ve_idea_evt.30.c.tt:0 "Потратить #N 10#! Национальный опыт. Одобрение заинтересованных групп не изменится."
 ve_idea_evt.31.t:0 "Национальные ассоциации ветеранов"
 ve_idea_evt.31.d:0 "Ветераны создали ассоциации, которые объединяют церемонии, взаимопомощь и лояльность государству. Их сеть может быть расширена на всю страну или изучена без предоставления ей официальной роли."
 ve_idea_evt.31.a:0 "Поддержать ассоциации по всей стране."
 ve_idea_evt.31.a.tt:0 "Потратить #N 40#! Национальный опыт и получить #P +5%#! лоялистов от легитимности на 36 месяцев."
 ve_idea_evt.31.b:0 "Записать их опыт в государственных архивах."
 ve_idea_evt.31.b.tt:0 "Получить #P 15#! Национальный опыт."
 ve_idea_evt.31.c:0 "Использовать уже созданные национальные сети."
 ve_idea_evt.31.c.tt:0 "Потратить #N 20#! Национальный опыт и получить #P +5%#! лоялистов от легитимности на 36 месяцев."
 ve_idea_evt.32.t:0 "Соперничающие национальные общества"
 ve_idea_evt.32.d:0 "Соперничающие общества теперь заявляют о своем праве говорить от имени нации. Их конкурирующие церемонии и публикации превращают общий политический язык в источник обид."
 ve_idea_evt.32.a:0 "Составить общую хартию."
 ve_idea_evt.32.a.tt:0 "Потратить #N 25#! национального опыта и избежать националистического штрафа."
 ve_idea_evt.32.b:0 "Соперничество найдет свои пределы."
 ve_idea_evt.32.b.tt:0 "Получить #N +5%#! к радикалам от легитимности на 24 месяца."
 ve_idea_evt.32.c:0 "Позволить национальным институтам выступить арбитрами."
 ve_idea_evt.32.c.tt:0 "Потратить #N 10#! национального опыта и избежать националистического штрафа."

 ve_idea_evt.40.t:0 "Комитет или улица"
 ve_idea_evt.40.d:0 "Реформаторы разрываются между экспертными комиссиями и массовым давлением. Комитеты сулят последовательное законодательство, тогда как организованные движения настаивают, что реформа без публичного давления будет отложена на неопределенный срок."
 ve_idea_evt.40.a:0 "Создать независимую комиссию по реформам."
 ve_idea_evt.40.a.tt:0 "Потратить #N 25#! национального опыта. Интеллигенты получают #P +1#! к одобрению, а Профсоюзы теряют #N 1#! к одобрению на 24 месяца."
 ve_idea_evt.40.b:0 "Дать движениям простор для действий."
 ve_idea_evt.40.b.tt:0 "Профсоюзы получают #P +1#! к одобрению, а Промышленники теряют #N 1#! к одобрению на 24 месяца."
 ve_idea_evt.40.c:0 "Применить устоявшуюся систему прав и процедур."
 ve_idea_evt.40.c.tt:0 "Потратить #N 10#! национального опыта. Одобрение заинтересованных групп не изменится."
 ve_idea_evt.41.t:0 "Сеть петиций"
 ve_idea_evt.41.d:0 "Местные петиции превратились в скоординированную национальную сеть, способную разбирать жалобы и предлагать реформы. Правительство может признать ее в качестве консультативного канала или сберечь ее методы для последующего использования."
 ve_idea_evt.41.a:0 "Превратить сеть в официальный консультативный орган."
 ve_idea_evt.41.a.tt:0 "Потратить #N 40#! национального опыта и получить #P +5%#! к лояльности от политических движений на 36 месяцев."
 ve_idea_evt.41.b:0 "Сдать требования в архив рассмотрения."
 ve_idea_evt.41.b.tt:0 "Получить #P 15#! национального опыта."
 ve_idea_evt.41.c:0 "Задействовать уже созданные организации реформаторов."
 ve_idea_evt.41.c.tt:0 "Потратить #N 20#! национального опыта и получить #P +5%#! к лояльности от политических движений на 36 месяцев."
 ve_idea_evt.42.t:0 "Раскол коалиции"
 ve_idea_evt.42.d:0 "Коалиция реформаторов раскалывается из-за приоритетов, сроков и лидерства. Если не восстановить общую программу, организованная политическая энергия переродится в враждебные лагеря радикалов."
 ve_idea_evt.42.a:0 "Переписать общую программу."
 ve_idea_evt.42.a.tt:0 "Потратить #N 25#! национального опыта и избежать реформистского штрафа."
 ve_idea_evt.42.b:0 "Допустить раскол в открытую политику."
