l_russian:
 ve_doctrine_ambient_cooldown_mdf:0 "Остановка дебатов по доктрине"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Институции страны осознают последствия недавних дебатов по доктрине."
 ve_doctrine_ambient_ig_supported_mdf:0 "Институциональная поддержка"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Правительство отвело этой группе интересов заметную роль в урегулировании дебатов по доктрине."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Институциональное незначительное внимание"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Правительство исключило эту группу интересов из недавнего урегулирования доктрины."

 ve_doctrine_industrialist_positive_mdf:0 "Стандартизированная производственная практика"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Производители получают выгоду от скоординированного органа промышленной практики."
 ve_doctrine_industrialist_negative_mdf:0 "Промышленность Узкие места"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Неустраненные сбои в координации ограничивают производство."
 ve_doctrine_academic_positive_mdf:0 "Сеть скоординированных исследований"
 ve_doctrine_academic_positive_mdf_desc:0 "Университеты обмениваются методами, персоналом и результатами через скоординированную сеть."
 ve_doctrine_academic_negative_mdf:0 "Академические узкие места"
 ve_doctrine_academic_negative_mdf_desc:0 "Споры о полномочиях и координации разрушают работу университетов."
 ve_doctrine_nationalist_positive_mdf:0 "Сеть национальных ассоциаций"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Национальные ассоциации переводят законное правительство в более широкую лояльность."
 ve_doctrine_nationalist_negative_mdf:0 "Конкурирующие национальные общества"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Соперничающие национальные организации поворачиваются политическая легитимность в новые обиды."
 ve_doctrine_reformist_positive_mdf:0 "Сеть организованных реформ"
 ve_doctrine_reformist_positive_mdf_desc:0 "Политические движения получили упорядоченные каналы для участия и компромисса."
 ve_doctrine_reformist_negative_mdf:0 "Коалиция расколотой реформы"
 ve_doctrine_reformist_negative_mdf_desc:0 "Конкурирующие реформаторские организации превращают политическую мобилизацию в радикализм."
 ve_doctrine_professional_army_positive_mdf:0 "Цикл подготовки кадров"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Скоординированная программа штабов улучшает систему подготовки армии."
 ve_doctrine_professional_army_negative_mdf:0 "Узкое место в офицерском корпусе"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Продвижение по службе и кадровые споры замедляют военную подготовку."
 ve_doctrine_agrarian_positive_mdf:0 "Скоординированная сельскохозяйственная практика"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Сельские учреждения распространяют надежные методы в сельскохозяйственной экономике."
 ve_doctrine_agrarian_negative_mdf:0 "Дефицит сельскохозяйственного снабжения"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Нехватка семян, кредитов и координации снижает производительность сельского хозяйства."

 ve_idea_evt.10.t:0 "Коды безопасности при полной мощности"
 ve_idea_evt.10.d:0 "Серия несчастных случаев на заводах выдвинула на первый план вопрос о промышленной инспекции. Независимые инспекторы обещают надежные стандарты, в то время как производители настаивают на том, что добровольные правила сохранят производительность и инициативу."
 ve_idea_evt.10.a:0 "Назначьте независимых инспекторов."
 ve_idea_evt.10.a.tt:0 "Потратить #N 25#! Национальное понимание. Профсоюзы получают #P +1#! Одобрение и промышленники теряют #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.10.b:0 "Пусть отрасли пишут добровольные кодексы."
 ve_idea_evt.10.b.tt:0 "Промышленники получают #P +1#! Одобрение, а профсоюзы теряют #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.10.c:0 "Поэтапно стандартизируйте правила."
 ve_idea_evt.10.c.tt:0 "Потратьте #N 10#! National Insight. Никаких изменений в одобрении группы по интересам."

 ve_idea_evt.11.t:0 "Стандартизированные детали машин"
 ve_idea_evt.11.d:0 "Инженеры нескольких промышленных районов подготовили общий каталог датчиков, арматуры и деталей машин. Финансирование национального стандарта будет дорогостоящим, но может устранить разногласия в производственной сети."
 ve_idea_evt.11.a:0 "Принять стандарты по всей стране."
 ve_idea_evt.11.a.tt:0 "Потратить #N 40#! National Insight и прибыль #P +5%#! Производительность за 36 месяцев."
 ve_idea_evt.11.b:0 "Архивируйте результаты на будущее."
 ve_idea_evt.11.b.tt:0 "Выигрыш #P 15#! National Insight."
 ve_idea_evt.11.c:0 "Наши производственные сети уже подготовлены."
 ve_idea_evt.11.c.tt:0 "Потратьте #N 20#! National Insight и получите #P +5%#! Объем производства за 36 месяцев."

 ve_idea_evt.12.t:0 "Узкое место на заводе"
 ve_idea_evt.12.d:0 "Заказы накапливаются, в то время как несовместимые процедуры, задержки компонентов и запутанные графики душат заводы страны. Правительство может направить специалистов, оставить проблему фирмам или использовать существующие строительные офисы для координации реагирования."
 ve_idea_evt.12.a:0 "Отправьте команду специалистов."
 ve_idea_evt.12.a.tt:0 "Потратьте #N 25#! National Insight и избегайте промышленных штрафов."
 ve_idea_evt.12.b:0 "Заводы должны решить эту проблему сами."
 ve_idea_evt.12.b.tt:0 "Пострадать #N -5%#! Производительность в течение 24 месяцев."
 ve_idea_evt.12.c:0 "Активировать строительные бюро."
 ve_idea_evt.12.c.tt:0 "Потратить #N 10#! National Insight и избежать промышленных штрафов."

 ve_idea_evt.60.t:0 "Механизация и землевладение"
 ve_idea_evt.60.d:0 "Новая техника могла бы увеличить сельскохозяйственное производство, но арендаторы и мелкие землевладельцы опасаются, что быстрый переход лишит сельских жителей средств к существованию. Правительство должно решить, следует ли ускорять механизацию, сначала защищать права владения или координировать постепенный переход на местном уровне."
 ve_idea_evt.60.a:0 "Создать фонд механизации."
 ve_idea_evt.60.a.tt:0 "Потратить #N 25#! Национальное понимание и прирост #P +5%#! Производительность сельского хозяйства за 24 месяца. Промышленники получают #P +1#! Одобрение, а сельские жители проигрывают. #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.60.b:0 "Закрепите арендаторов перед сменой фермы."
 ve_idea_evt.60.b.tt:0 "Сельские жители получают #P +1#! Одобрение, а землевладельцы теряют #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.60.c:0 "Используйте местные производственные сети для постепенного перехода."
 ve_idea_evt.60.c.tt:0 "Потратьте #N 10#! National Insight и получите #P +5%#! Производительность сельского хозяйства за 24 месяца. Никаких изменений в одобрении группы по интересам."

 ve_idea_evt.61.t:0 "Кооперативные зернохранилища"
 ve_idea_evt.61.d:0 "Сельские делегаты продемонстрировали сеть кооперативных зернохранилищ, способных совместно использовать запасы, записи и транспорт. Национальная программа могла бы усилить координацию сельского хозяйства, в то время как простое сохранение планов все равно обогатило бы институциональные знания правительства."
 ve_idea_evt.61.a:0 "Финансируйте кооперативную сеть."
 ve_idea_evt.61.a.tt:0 "Потратьте #N 40#! National Insight и получите #P +5%#! Производительность сельского хозяйства за 36 месяцев."
 ve_idea_evt.61.b:0 "Распространите записи в сельскохозяйственные офисы."
 ve_idea_evt.61.b.tt:0 "Получите #P 15#! национальное понимание."
 ve_idea_evt.61.c:0 "Используйте уже существующие сельские учреждения."
 ve_idea_evt.61.c.tt:0 "Потратьте #N 20#! Национальное понимание и выгода #P +5%#! Производительность сельского хозяйства за 36 месяцев."

 ve_idea_evt.62.t:0 "Нехватка семян и кредитов"
 ve_idea_evt.62.d:0 "Плохие запасы семян и ужесточение сельского кредитования угрожают предстоящему сельскохозяйственному циклу. Специалисты могут организовать реагирование на чрезвычайную ситуацию, местные сети можно предоставить импровизировать, или существующие учреждения социального обеспечения могут временно нести это бремя."
 ve_idea_evt.62.a:0 "Организовать программу экстренной экспертизы."
 ve_idea_evt.62.a.tt:0 "Потратьте #N 25#! National Insight и избегайте сельскохозяйственного штрафа."
 ve_idea_evt.62.b:0 "Позвольте местным сетям найти свое собственное решение."
 ve_idea_evt.62.b.tt:0 "Пострадайте #N -5%#! Пропускная способность сельского хозяйства в течение 24 месяцев."
 ve_idea_evt.62.c:0 "Используйте натуральные сети в качестве временной магистрали."
 ve_idea_evt.62.c.tt:0 "Потратьте #N 10#! National Insight и избегайте сельскохозяйственных штрафов."

 ve_idea_evt.20.t:0 "Патронаж или экспертная оценка"
 ve_idea_evt.20.d:0 "Правительство ожидает практических результатов от своих исследовательских грантов, в то время как ученые предупреждают, что покровительство заменит доказательства политическими удобствами. Долгосрочное урегулирование должно определить, кто будет судить об обучении страны."
 ve_idea_evt.20.a:0 "Создайте независимые наблюдательные комиссии."
 ve_idea_evt.20.a.tt:0 "Потратьте  #N 25#! National Insight. Выигрыш интеллигенции #P +1#! Одобрение и мелкая буржуазия теряет #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.20.b:0 "Пусть государство определяет приоритеты исследований."
 ve_idea_evt.20.b.tt:0 "Маленькая буржуазия получает #P +1#! Одобрение и интеллигенция теряет #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.20.c:0 "Институционализировать общие академические стандарты."
 ve_idea_evt.20.c.tt:0 "Потратьте  #N 10#! National Insight. Никаких изменений в одобрении группы по интересам."
 ve_idea_evt.21.t:0 "Провинциальная исследовательская сеть"
 ve_idea_evt.21.d:0 "Провинциальные колледжи начали обмениваться лекторами, инструментами и научными исследованиями без центрального руководства. Официальная поддержка могла бы превратить это импровизированное сотрудничество в национальную исследовательскую сеть."
 ve_idea_evt.21.a:0 "Финансируйте сеть."
 ve_idea_evt.21.a.tt:0 "Потратьте #N 40#! National Insight и получите #P +5%#! Пропускная способность университета за 36 месяцев."
 ve_idea_evt.21.b:0 "Поместите отчеты в центральный архив."
 ve_idea_evt.21.b.tt:0 "Получите #P 15#! National Insight."
 ve_idea_evt.21.c:0 "Подключите его к национальной академии."
 ve_idea_evt.21.c.tt:0 "Потратьте #N 20#! National Insight и прибыль #P +5%#! Пропускная способность университетов за 36 месяцев."
 ve_idea_evt.22.t:0 "Узкое место в профессиональной подготовке"
 ve_idea_evt.22.d:0 "Университеты не могут достаточно быстро оценить растущее число студентов, преподавателей и новых дисциплин. Задержка получения полномочий теперь угрожает более широкой исследовательской системе."
 ve_idea_evt.22.a:0 "Расширить возможности оценки."
 ve_idea_evt.22.a.tt:0 "Потратить #N 25#! National Insight и избежать академического штрафа."
 ve_idea_evt.22.b:0 "Существующие институты должны справиться."
 ve_idea_evt.22.b.tt:0 "Страдать #N -5%#! Пропускная способность университета за 24 месяца."
 ve_idea_evt.22.c:0 "Стандартизировать школьную сеть."
 ve_idea_evt.22.c.tt:0 "Потратьте #N 10#! National Insight и избегайте академических штрафов."

 ve_idea_evt.30.t:0 "Один канон, много традиций"
 ve_idea_evt.30.d:0 "Официальные лица, готовящие национальный канон, расходятся во мнениях по поводу места провинциальных обычаев. Единый отчет обещает ясность, но исключение местных традиций может ослабить ту самую нацию, которую он намеревается определить."
 ve_idea_evt.30.a:0 "Вплетите местные традиции в общую историю."
 ve_idea_evt.30.a.tt:0 "Потратьте #N 25#! National Insight. Сельский народ выигрывает #P +1#! Одобрение и мелкая буржуазия теряет #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.30.b:0 "Провозгласить один официальный канон."
 ve_idea_evt.30.b.tt:0 "Маленькая буржуазия получает #P +1#! Одобрение, а сельский народ теряет #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.30.c:0 "Доверьте работу подготовленным культурным кадрам."
 ve_idea_evt.30.c.tt:0 "Потратить #N 10#! Национальное понимание. Никаких изменений в одобрении группы по интересам."
 ve_idea_evt.31.t:0 "Национальные ассоциации ветеранов"
 ve_idea_evt.31.d:0 "Ветераны организовали ассоциации, которые объединяют церемонию, взаимопомощь и лояльность государству. Их сеть может быть расширена по всей стране или изучена без предоставления ей официальной роли."
 ve_idea_evt.31.a:0 "Поддержите ассоциации по всей стране."
 ve_idea_evt.31.a.tt:0 "Потратьте #N 40#! Национальное понимание и выигрыш #P +5%#! Лоялисты от легитимности на 36 месяцев."
 ve_idea_evt.31.b:0 "Запишите их опыт в государственные архивы."
 ve_idea_evt.31.b.tt:0 "Выигрыш #P 15#! National Insight."
 ve_idea_evt.31.c:0 "Используйте уже созданные национальные сети."
 ve_idea_evt.31.c.tt:0 "Потратьте #N 20#! Национальное понимание и выгода #P +5%#! Лоялисты от Легитимности на 36 месяцев."
 ve_idea_evt.32.t:0 "Конкурирующие национальные общества"
 ve_idea_evt.32.d:0 "Соперничающие общества теперь претендуют на право говорить от имени нации. Их конкурирующие церемонии и публикации превращают общий политический язык в источник недовольства."
 ve_idea_evt.32.a:0 "Разработайте общий устав."
 ve_idea_evt.32.a.tt:0 "Потратьте #N 25#! National Insight и избегайте националистического штрафа."
 ve_idea_evt.32.b:0 "Конкуренция найдет свои собственные пределы."
 ve_idea_evt.32.b.tt:0 "Страдайте #N +5%#! Радикалы от легитимности в течение 24 месяцев."
 ve_idea_evt.32.c:0 "Позвольте национальным институтам выносить решения."
 ve_idea_evt.32.c.tt:0 "Потратьте #N 10#! National Insight и избегайте националистических наказаний."

 ve_idea_evt.40.t:0 "Комитет или улица"
 ve_idea_evt.40.d:0 "Реформаторы разделены между экспертными комиссиями и массовым давлением. Комитеты обещают последовательное законодательство, в то время как организованные движения настаивают на том, что реформа без общественной силы будет отложена на неопределенный срок."
 ve_idea_evt.40.a:0 "Создать независимую комиссию по реформе."
 ve_idea_evt.40.a.tt:0 "Тратить #N 25#! Национальное понимание. Интеллигенция получает #P +1#! Одобрение и профсоюзы теряют #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.40.b:0 "Дайте движениям возможность действовать."
 ve_idea_evt.40.b.tt:0 "Профсоюзы получают #P +1#! Одобрение, и промышленники теряют #N 1#! Одобрение на 24 месяца."
 ve_idea_evt.40.c:0 "Примените установленную структуру прав и процедур."
 ve_idea_evt.40.c.tt:0 "Потратьте #N 10#! National Insight. Никаких изменений в одобрении групп интересов."
 ve_idea_evt.41.t:0 "Сеть петиций"
 ve_idea_evt.41.d:0 "Местные петиции стали скоординированной национальной сетью, способной сортировать жалобы и предлагать реформы. Правительство может признать ее консультативным каналом или сохранить ее методы для дальнейшего использования."
 ve_idea_evt.41.a:0 "Превратить сеть в формальные консультации."
 ve_idea_evt.41.a.tt:0 "Потратить #N 40#! National Insight и выигрыш #P +5%#! Лоялисты от политических движений на 36 месяцев."
 ve_idea_evt.41.b:0 "Подайте требования в архив отзывов."
 ve_idea_evt.41.b.tt:0 "Прирост #P 15#! National Insight."
 ve_idea_evt.41.c:0 "Использовать уже созданные реформаторские организации."
 ve_idea_evt.41.c.tt:0 "Потратить #N 20#! Национальное понимание и выигрыш #P +5%#! Лоялисты от политических движений на 36 месяцев."
 ve_idea_evt.42.t:0 "Коалиция раскололась"
 ve_idea_evt.42.d:0 "Коалиция реформ раскололась по вопросам приоритетов, сроков и руководства. Если общая программа не будет восстановлена, организованная политическая энергия сосредоточится в соперничающих радикальных лагерях."
 ve_idea_evt.42.a:0 "Перепишите общую программу."
 ve_idea_evt.42.a.tt:0 "Потратьте #N 25#! National Insight и избежать реформистского наказания."
 ve_idea_evt.42.b:0 "Пусть дивизия вступит в открытую политику."
 ve_idea_evt.42.b.tt:0 "Пострадайте #N +5%#! Радикалы из политических движений в течение 24 месяцев."
 ve_idea_evt.42.c:0 "Вновь примените эгалитарную систему."
 ve_idea_evt.42.c.tt:0 "Потратьте #N 10#! National Insight и избежать реформистского наказания."

 ve_idea_evt.50.t:0 "Старшинство или заслуги"
 ve_idea_evt.50.d:0 "Офицерский корпус разделен по поводу продвижения по службе. Старшие командиры защищают звание по службе и обычаям, в то время как реформаторы требуют экзаменов и отчетов о результатах работы, которые открыли бы возможность продвижения по службе тем, кто доказал свои способности."
 ve_idea_evt.50.a:0 "Ввести квалификационные экзамены."
 ve_idea_evt.50.a.tt:0 "Потратить #N 25#! National Insight and Gain #P +5%#! Ставка на обучение за 24 месяца. Вооруженные силы проигрывают #N 1#! Утверждение на 24 месяца."
 ve_idea_evt.50.b:0 "Сохранить систему старшинства."
 ve_idea_evt.50.b.tt:0 "Вооруженные Силы получают #P +1#! Одобрение на 24 месяца, но скорость обучения падает на  #N -5%#!  в течение 12 месяцев."
 ve_idea_evt.50.c:0 "Используйте трудовые книжки общего персонала."
 ve_idea_evt.50.c.tt:0 "Расходы #N 10#! Национальное понимание и выгода #P +5%#! Стоимость обучения за 24 месяца. Одобрение группы интересов не меняется."
 ve_idea_evt.51.t:0 "Великое упражнение для персонала"
 ve_idea_evt.51.d:0 "Крупные штабные учения позволили извлечь ценные уроки в области мобилизации, обучения и командования. Расширение программы могло бы распространить эти уроки по всей армии, а архивирование результатов позволило бы сохранить их с небольшими затратами."
 ve_idea_evt.51.a:0 "Разверните упражнение."
 ve_idea_evt.51.a.tt:0 "Потратьте #N 40#! National Insight и получите #P +5%#! Скорость обучения за 36 месяцев."
 ve_idea_evt.51.b:0 "Поместите результаты в архив доктрины."
 ve_idea_evt.51.b.tt:0 "Усиление #P 15#! National Insight."
 ve_idea_evt.51.c:0 "Используйте профессиональную командную сеть."
 ve_idea_evt.51.c.tt:0 "Потратьте #N 20#! National Insight и получите #P +5%#! скорость обучения в течение 36 месяцев."
 ve_idea_evt.52.t:0 "Узкое место офицерского корпуса"
 ve_idea_evt.52.d:0 "Армия расширяется быстрее, чем могут быть подготовлены ее инструкторы и штабные офицеры. График обучения теперь зависит от узкой группы истощенных кадров."
 ve_idea_evt.52.a:0 "Расширьте обучающие кадры."
 ve_idea_evt.52.a.tt:0 "Потратьте #N 25#! National Insight и избегайте военных наказаний."
 ve_idea_evt.52.b:0 "Подталкивайте существующие кадры сильнее."
 ve_idea_evt.52.b.tt:0 "Страдайте #N -5%#! Скорость обучения в течение 24 месяцев."
 ve_idea_evt.52.c:0 "Переведите логистический кадровый резерв."
 ve_idea_evt.52.c.tt:0 "Потратьте #N 10#! Национальный Проницательность и избежать военного наказания."
