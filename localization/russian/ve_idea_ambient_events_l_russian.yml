 ve_idea_evt.50.t:0 "Выслуга или заслуги"
 ve_idea_evt.50.d:0 "Офицерский корпус разделен в вопросах продвижения по службе. Старшие командиры защищают звания по выслуге и обычаю, в то время как реформаторы требуют экзаменов и послужных списков, которые открыли бы путь к повышению благодаря доказанным способностям."
 ve_idea_evt.50.a:0 "Ввести экзамены на соответствие."
 ve_idea_evt.50.a.tt:0 "Потратить #N 25#! национального опыта и получить #P +5%#! к темпам обучения на 24 месяца. Вооружённые силы теряют #N 1#! к одобрению на 24 месяца."
 ve_idea_evt.50.b:0 "Сохранить систему выслуги лет."
 ve_idea_evt.50.b.tt:0 "Вооружённые силы получают #P +1#! к одобрению на 24 месяца, однако темпы обучения падают на #N -5%#! на 12 месяцев."
 ve_idea_evt.50.c:0 "Использовать послужные списки генерального штаба."
 ve_idea_evt.50.c.tt:0 "Потратить #N 10#! национального опыта и получить #P +5%#! к темпам обучения на 24 месяца. Одобрение заинтересованных групп не изменится."
 ve_idea_evt.51.t:0 "Великие маневры штаба"
 ve_idea_evt.51.d:0 "Крупные штабные маневры преподали ценные уроки в вопросах мобилизации, обучения и командования. Расширение программы позволит распространить этот опыт по всей армии, в то время как архивация выводов сохранит их при минимальных затратах."
 ve_idea_evt.51.a:0 "Расширить масштабы маневров."
 ve_idea_evt.51.a.tt:0 "Потратить #N 40#! Национального опыта и получить #P +5%#! Скорость обучения на 36 месяцев."
 ve_idea_evt.51.b:0 "Сдать материалы в архив доктрин."
 ve_idea_evt.51.b.tt:0 "Получить #P 15#! Национального опыта."
 ve_idea_evt.51.c:0 "Задействовать профессиональную сеть командования."
 ve_idea_evt.51.c.tt:0 "Потратить #N 20#! Национального опыта и получить #P +5%#! Скорость обучения на 36 месяцев."
 ve_idea_evt.52.t:0 "Застой в офицерском корпусе"
 ve_idea_evt.52.d:0 "Армия растет быстрее, чем успевают выпускаться инструкторы и штабные офицеры. Графики обучения теперь зависят от узкой группы исчерпавших свои ресурсы кадров."
 ve_idea_evt.52.a:0 "Расширить кадры инструкторов."
 ve_idea_evt.52.a.tt:0 "Потратить #N 25#! Национального опыта и избежать штрафа для армии и флота."
 ve_idea_evt.52.b:0 "Выжать максимум из имеющихся кадров."
 ve_idea_evt.52.b.tt:0 "Получить штраф #N -5%#! Скорость обучения на 24 месяцев."
 ve_idea_evt.52.c:0 "Задействовать резерв тылового штаба."
 ve_idea_evt.52.c.tt:0 "Потратить #N 10#! Национального опыта и избежать штрафа для армии и флота."
