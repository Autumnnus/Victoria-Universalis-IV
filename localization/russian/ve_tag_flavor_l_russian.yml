l_russian:
 ve_tag_flavor_delayed_result_tt:0 "Последствия этого институционального выбора проявятся примерно через год."
 ve_tag_flavor_free_route_tt:0 "Этот маршрут не требует затрат на национальное понимание, культурный мандат или реформу благочестия."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Общий гражданский лексикон"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Общий официальный словарь несет реформу в школах и провинциальных офисах, но постоянные объяснения поглощают центральную власть."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Священная непрерывность"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "Реформа проводилась через унаследованные религиозные институты, усиливая командование и одновременно сужая каналы, по которым циркулируют иностранные методы."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Административный перевод"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "Бюрократия превращает реформу в привычную процедуру. Администрация становится более стабильной, но законодательные изменения теряют некоторую скорость."
 ve_tag_flavor.1.t:0 "Язык реформ"
 ve_tag_flavor.1.d:0 "Указ может покинуть столицу в безупречной прозе и все же прийти в школу, суд, провинциальное управление или религиозный фонд в виде четырех разных инструкций. Реформаторы теперь требуют единого словаря. Вопрос в том, чьи институты придадут смысл этому словарю."
 ve_tag_flavor.1.a:0 "Разработать единый гражданский лексикон."
 ve_tag_flavor.1.a.tt:0 "Требуется Civic Nation или Composite State.\nПотратить #N 20 Культурный мандат#! сейчас.\nПримерно через год: получите #P 8 баллов National Insight.#! и  #P 3 Национальное сплочение#!, а затем получить #P +1% Доступ к образованию#! и #N -25 Авторитет#! за 24 месяца."
 ve_tag_flavor.1.b:0 "Основная реформа в священной преемственности."
 ve_tag_flavor.1.b.tt:0 "Требуется конфессиональная религиозная модель.\nПотратьте #N 20 Реформа благочестия#! сейчас.\nПримерно через год: получите #P 8 Национальное понимание#! и #P 3 Религиозное поселение#!, затем получите #P +25 Авторитета.#! и  #N -2,5% распространения технологий.#! в течение 24 месяцев."
 ve_tag_flavor.1.c:0 "Пусть каждое бюро переведет заказ."
 ve_tag_flavor.1.c.tt:0 "Приблизительно через год: прибыль #P 4 National Insight#!, затем получите #P +25 Бюрократия#! и #N -2,5% Скорость принятия закона#! за 24 месяца."
 ve_tag_flavor.2.t:0 "Слова становятся процедурой"
 ve_tag_flavor.2.d:0 "Год циркуляров, комментариев, школьных учебников, проповедей и провинциальной переписки дал программе реформы рабочий язык. Он не является абсолютно единообразным, но чиновники теперь знают, какие фразы вызывают согласие, а какие все еще скрывают разногласия."
 ve_tag_flavor.2.a:0 "Словарный запас входит в государственный аппарат."
 ve_tag_flavor.2.a.tt:0 "Результат, выбранный год назад, теперь вступает в силу. Изменения его ресурсов ограничены нормальными пределами, а его институциональный модификатор длится 24 месяца."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Бюро переводов"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Специализированные офисы ускоряют распространение иностранных методов, хотя их автономия ослабляет непосредственное командование центра."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Направленное заимствование"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Импортированные институты реорганизуются под центральным руководством. Власть сохраняется, но для прохождения каждой реформы по официальным каналам требуется больше времени."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Выборочное принятие"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "Государство допускает только те методы, которые можно согласовать с установленной властью, обменивая скорость распространения на политический контроль."
 ve_tag_flavor.10.t:0 "Заимствованные методы, местный авторитет"
 ve_tag_flavor.10.d:0 "Иностранные руководства, машины, школьные планы и административные таблицы прибывают быстрее, чем какое-либо министерство может о них судить. Некоторые чиновники требуют наличия постоянных бюро переводов; другие настаивают на том, чтобы каждое заимствованное учреждение было переделано под централизованным руководством. Третья фракция допустит только то, что можно поглотить, не нарушая установленного порядка."
 ve_tag_flavor.10.a:0 "Создайте бюро переводов."
 ve_tag_flavor.10.a.tt:0 "Требуется Академическая идея IV или Инфраструктурная идея IV.\nПотратьте #N 15 National Insight#! сейчас.\nПриблизительно через год: получите #P 10 Era Momentum#!, затем получите #P +2,5% распространения технологий#! и #N -25 Авторитета#! на 24 месяца."
 ve_tag_flavor.10.b:0 "Заимствуйте только под центральным руководством."
 ve_tag_flavor.10.b.tt:0 "Требуется Японская национальная идея. IV.\nПотратьте #N 10 National Insight#! сейчас.\nПриблизительно через год: получите #P 7 Импульса Эры#!, затем получите #P +25 Авторитета#! и #N -2,5% Скорость принятия закона#! в течение 24 месяцев."
 ve_tag_flavor.10.c:0 "Принимайте выборочно и сохраняйте командование."
 ve_tag_flavor.10.c.tt:0 "Примерно через год: получите #P 3 Импульс Эры#!, затем получите #P +25 Авторитета#! и #N -2,5% Распространение технологий#! на 24 месяца."
 ve_tag_flavor.11.t:0 "Созданные нами собственные методы"
 ve_tag_flavor.11.d:0 "Год перевода, тестирования, переработок и официальной аргументации отделил новизну от полезности. Принятые методы больше не выглядят как зарубежные инструкции; они вошли в собственный командный словарь штата. "
 ve_tag_flavor.11.a:0 " Используйте то, что выдержало проверку. "
 ve_tag_flavor.11.a.tt:0 " Результат, выбранный год назад, теперь вступает в силу. Era Momentum сохраняет свой обычный нулевой минимум, а институциональный модификатор длится 24 месяца."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Компакт о гражданстве "
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Общий язык гражданства облегчает прибытие и участие, но объяснение договора в каждой юрисдикции требует центральной власти."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Комплексная сделка."
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "Федеральная администрация учится вести переговоры между составляющими ее сообществами, укрепляя офисы и одновременно снижая давление в сторону единой культурной формы."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Федеральная двусмысленность"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Намеренная двусмысленность расширяет дипломатический голос Союза, но на время снижает равновесие национальной сплоченности на 2."
 ve_tag_flavor.20.t:0 "Значение Союза"
 ve_tag_flavor.20.d:0 "Новоприбывшие, существующие штаты и общины с разными общественными обычаями — все они взывают к Союзу по-своему. Законодатели согласны с тем, что необходима общая формула, но не в том, должна ли она определять индивидуальное гражданство, сохранять договоренность между составляющими ее сообществами или оставаться достаточно широкой для интерпретации каждой юрисдикцией."
 ve_tag_flavor.20.a:0 "Напишите договор о гражданстве."
 ve_tag_flavor.20.a.tt:0 "Требуется Civic Nation.\nПотратить #N 20 Культурный мандат#! сейчас.\nПримерно через год: получите #P 8 баллов National Insight.#! и #P 3 Национальное сплочение#!, затем получите #P +2,5% миграционной привлекательности#! и #N -25 полномочий#! на 24 месяца."
 ve_tag_flavor.20.b:0 "Заключить составную сделку."
 ve_tag_flavor.20.b.tt:0 "Требуется составное состояние.\nПотратить #N 20 Культурный Мандат#! сейчас.\nПримерно через год: получите #P 8 Национальное Проницательность#! и #P 3 Национальное Сплочение#!, затем получите #P +25 Бюрократии#! и  #N -2,5% Ассимиляция#!  за 24 мес."
 ve_tag_flavor.20.c:0 "Оставьте федеральную формулу намеренно широкой."
 ve_tag_flavor.20.c.tt:0 "Примерно через год: прирост #P 4 Национальное понимание#! и #P +25 Влияние#! за 24 месяца. Пока модификатор активен, равновесие национальной сплоченности #N 2 нижних#!."
 ve_tag_flavor.21.t:0 "Формула Союза"
 ve_tag_flavor.21.d:0 "Год съездов, отчетов комитетов, резолюций штатов и публичных дискуссий позволил создать язык, который могут использовать учреждения. Его молчание имеет такое же значение, как и его заявления, определяя, какие споры Союз разрешает, а какие оставляет на обсуждение."
 ve_tag_flavor.21.a:0 "Пусть формула войдет в общественную жизнь."
 ve_tag_flavor.21.a.tt:0 "Результат, выбранный год назад, теперь вступает в силу. Изменения ресурсов ограничиваются нормальными пределами, а институциональный модификатор длится 24 месяца."
