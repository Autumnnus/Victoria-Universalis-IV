l_russian:
 ve_tag_flavor_delayed_result_tt:0 "Последствия этого институционального выбора проявятся примерно через год."
 ve_tag_flavor_free_route_tt:0 "Этот путь не расходует Национальный опыт, Культурный мандат или Религиозное усердие."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Общий гражданский лексикон"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Единый официальный словарный запас приносит реформы в школы и провинциальные учреждения, но постоянные пояснения истощают центральный Авторитет."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Священная преемственность"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "Реформа была облечена в формы унаследованных религиозных институтов, что укрепляет командование, но сужает каналы распространения иностранных методов."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Административный перевод"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "Бюрократия переводит реформу на привычный процедурный язык. Управление становится стабильнее, но принятие законов несколько замедляется."
 ve_tag_flavor.1.t:0 "Язык реформ"
 ve_tag_flavor.1.d:0 "Указ может покинуть столицу в безупречной словесной форме, но в школу, суд, провинциальное ведомство или религиозный фонд он прибывает в виде четырёх разных предписаний. Реформаторы теперь требуют единого словаря. Вопрос лишь в том, институты какой из сторон придадут этому словарю истинный смысл."
 ve_tag_flavor.1.a:0 "Выработать общий гражданский лексикон."
 ve_tag_flavor.1.a.tt:0 "Требуется Гражданская нация или Составное государство.\nПотратить #N 20 Культурный мандат#! сейчас.\nПримерно через год: получите #P 8 Национальный опыт#! и #P 3 Национальное единение#!, а затем получите #P +1% Доступность образования#! и #N -25 Авторитет#! на 24 месяца."
 ve_tag_flavor.1.b:0 "Обосновать реформы священной преемственностью."
 ve_tag_flavor.1.b.tt:0 "Требуется Конфессиональная религиозная модель.\nПотратить #N 20 Религиозное усердие#! сейчас.\nПримерно через год: получите #P 8 Национальный опыт#! и #P 3 Религиозный компромисс#!, а затем получите #P +25 Авторитет#! и #N -2.5% Распространение технологий#! на 24 месяца."
 ve_tag_flavor.1.c:0 "Позволить каждому ведомству переводить предписание по-своему."
 ve_tag_flavor.1.c.tt:0 "Примерно через год: получите #P 4 Национальный опыт#!, а затем получите #P +25 Бюрократия#! и #N -2.5% Скорость принятия законов#! на 24 месяца."
 ve_tag_flavor.2.t:0 "Слова становятся процедурой"
 ve_tag_flavor.2.d:0 "Год циркуляров, толкований, учебников, проповедей и провинциальной переписки сформировал рабочий язык программы реформ. Он не вполне единообразен, но чиновники теперь знают, какие фразы гарантируют согласие, а какие всё ещё скрывают разногласия."
 ve_tag_flavor.2.a:0 "Лексикон вливается в государственный механизм."
 ve_tag_flavor.2.a.tt:0 "Результат, выбранный год назад, вступает в силу. Изменения ресурсов ограничиваются обычными пределами, а институциональный модификатор действует 24 месяца."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Бюро переводов"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Специализированные ведомства ускоряют освоение иностранных методов, хотя их автономия ослабляет прямое командование центра."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Направляемые заимствования"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Импортируемые институты реорганизуются под централизованным руководством. Авторитет сохраняется, но на проведение каждой реформы через официальные инстанции уходит больше времени."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Избирательное принятие"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "Государство допускает лишь те методы, которые могут быть согласованы с устоявшейся властью, жертвуя скоростью распространения ради политического контроля."
 ve_tag_flavor.10.t:0 "Заимствованные методы, исконный авторитет"
 ve_tag_flavor.10.d:0 "Иностранные руководства, машины, школьные планы и административные таблицы прибывают быстрее, чем любое министерство способно их оценить. Одни чиновники требуют создания постоянных переводческих бюро, другие настаивают на том, чтобы каждый заимствованный институт был пересоздан под централизованным руководством. Третья фракция готова допустить лишь то, что можно усвоить без потрясения для устоявшегося порядка."
 ve_tag_flavor.10.a:0 "Учредить бюро переводов."
 ve_tag_flavor.10.a.tt:0 "Требуется Академическая идея IV или Инфраструктура идея IV.\nПотратить #N 15 Национальный опыт#! сейчас.\nПримерно через год: получите #P 10 Дыхание эпохи#!, а затем получите #P +2.5% Распространение технологий#! и #N -25 Авторитет#! на 24 месяца."
 ve_tag_flavor.10.b:0 "Заимствовать исключительно под централизованным руководством."
 ve_tag_flavor.10.b.tt:0 "Требуется Национальная идея Японии IV.\nПотратить #N 10 Национальный опыт#! сейчас.\nПримерно через год: получите #P 7 Дыхание эпохи#!, а затем получите #P +25 Авторитет#! и #N -2.5% Скорость принятия законов#! на 24 месяца."
 ve_tag_flavor.10.c:0 "Принимать избирательно, сохраняя командование."
 ve_tag_flavor.10.c.tt:0 "Примерно через год: получите #P 3 Дыхание эпохи#!, а затем получите #P +25 Авторитет#! и #N -2.5% Распространение технологий#! на 24 месяца."
 ve_tag_flavor.11.t:0 "Методы становятся нашими собственными"
 ve_tag_flavor.11.d:0 "Год перевода, испытаний, переработки и споров в ведомствах позволил отделить новизну от практической пользы. Принятые методы больше не выглядят как чужеродные предписания; они вошли в собственный лексикон государственного управления."
 ve_tag_flavor.11.a:0 "Использовать то, что выдержало проверку."
 ve_tag_flavor.11.a.tt:0 "Результат, выбранный год назад, вступает в силу. Дыхание эпохи сохраняет свой обычный нулевой минимум, а институциональный модификатор действует 24 месяца."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Пакт о гражданстве"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Общий язык гражданства облегчает прибытие и участие, но разъяснение этого пакта в каждой юрисдикции истощает центральный Авторитет."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Составная сделка"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "Федеральная администрация учится вести переговоры между составляющими сообществами, укрепляя ведомства и снижая давление в пользу единой культурной формы."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Федеральная неопределенность"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Намеренная неопределенность расширяет дипломатический голос Союза, но на время снижает равновесие Национальное единение на 2."
 ve_tag_flavor.20.t:0 "Смысл Союза"
 ve_tag_flavor.20.d:0 "Прибывающие переселенцы, устоявшиеся штаты и сообщества с различными общественными обычаями — все они апеллируют к Союзу на собственных условиях. Законодатели сходятся во мнении, что необходима общая формула, однако нет согласия в том, должна ли она определять индивидуальное гражданство, сохранять сделку между составляющими сообществами или оставаться достаточно широкой для истолкования каждой юрисдикцией."
 ve_tag_flavor.20.a:0 "Записать договор о гражданстве."
 ve_tag_flavor.20.a.tt:0 "Требуется Гражданская нация.\nТратит #N 20 Культурный мандат#! сейчас.\nПримерно через год: дает #P 8 Национальный опыт#! и #P 3 Национальный единение#!, а затем дает #P +2.5% Миграционная привлекательность#! и #N -25 Авторитет#! на 24 месяцев."
 ve_tag_flavor.20.b:0 "Заключить составную сделку."
 ve_tag_flavor.20.b.tt:0 "Требуется Составное государство.\nТратит #N 20 Культурный мандат#! сейчас.\nПримерно через год: дает #P 8 Национальный опыт#! и #P 3 Национальный единение#!, а затем дает #P +25 Бюрократия#! и #N -2.5% Ассимиляция#! на 24 месяцев."
 ve_tag_flavor.20.c:0 "Оставить федеральную формулу намеренно широкой."
 ve_tag_flavor.20.c.tt:0 "Примерно через год: дает #P 4 Национальный опыт#! и #P +25 Влияние#! на 24 месяцев. Пока модификатор активен, равновесие Национальное единение становится #N на 2 ниже#!."
 ve_tag_flavor.21.t:0 "Формула для Союза"
 ve_tag_flavor.21.d:0 "Год съездов, комитетских докладов, резолюций штатов и публичных споров породил формулировки, которые могут использовать институты. Ее умолчания столь же значительны, сколь и декларации: они определяют, какие споры Союз разрешает, а какие оставляет на Переговоры."
 ve_tag_flavor.21.a:0 "Позволить формуле войти в общественную жизнь."
 ve_tag_flavor.21.a.tt:0 "Результат, выбранный год назад, теперь вступает в силу. Изменения ресурсов ограничены их обычными пределами, а институциональный модификатор длится 24 месяцев."
