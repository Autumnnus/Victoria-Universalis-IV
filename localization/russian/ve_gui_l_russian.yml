 ve_targeted_religious_project_state_action:0 "#tooltippable_name Целевой религиозный проект"
 ve_targeted_religious_project_state_action_tt:0 "#header Целевой религиозный проект#!\nЗапускает проект, связанный с текущей религиозной моделью, против религиозного состава этой области. Полное разделение не позволяет его начать. Откройте панель религии, чтобы узнать точные затраты, правила прогресса и результаты."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Целевой культурный проект"
 ve_start_religious_project_button:0 "Начать проект"
 ve_cancel_religious_project_button:0 "Отменить проект"
 ve_confirm_cancel_button:0 "#N Да, отменить#!"
 ve_keep_project_button:0 "Сохранить проект"
 ve_targeted_religious_project_state_requirements_tt:0 "Область должна принадлежать нам, и наша собственная религия не должна составлять #Y 90%#! или более ее населения. Конфессиональное государство, Свобода совести и Государственный атеизм могут запустить по одному проекту; Полное отделение не может. Стоимость в Религиозное усердие для активной Религиозной модели также должна быть покрыта."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "Религиозная модель позволяет начать целевой проект (Полное отделение не может запустить его)"
 ve_religious_project_req_no_active:0 "Целевой религиозный проект еще не запущен"
 ve_religious_project_req_no_backlash:0 "Не действует 24-месячный период восстановления после отмены проекта"
 ve_religious_project_req_reform_point:0 "Достаточно Религиозного усердия для активной Религиозной модели (#Y 125#! Конфессиональное государство / #Y 100#! Свобода совести / #Y 150#! Государственный атеизм)"
 ve_religious_project_req_target:0 "Наша собственная религия составляет менее #Y 90%#! населения этой области"
 ve_religious_project_cancel_warning:0 "#header Отменить целевой религиозный проект?#!\n\nВесь достигнутый прогресс будет утрачен. Применяются #N -5 Религиозный компромисс#! и штраф в виде #N 24-месячного#! периода восстановления перед началом нового проекта."
 ve_cultural_project_req_no_active:0 "Культурный проект еще не запущен"
 ve_cultural_project_req_no_backlash:0 "Не действует 24-месячный период восстановления после отмены проекта"
 ve_cultural_project_req_reform_point:0 "Достаточно Культурного мандата для активной Модели идентичности (#Y 125#! Этническая нация / #Y 100#! Гражданская нация / #Y 150#! Составное государство, плюс #Y 40#! Сплочённость для Составного государства)"
 ve_cultural_project_req_target:0 "В этой области есть подходящая некоренная культура, составляющая не менее #Y 5%#! населения"
 ve_cultural_project_cancel_warning:0 "#header Отменить культурный проект?#!\n\nВесь достигнутый прогресс будет утрачен. Применяются #N -5 Национальное единение#! и штраф в виде #N 24-месячного#! периода восстановления перед началом нового проекта."
 alert_can_unlock_ideas_name:0 "Можно принять идею"
 alert_can_unlock_ideas_hint:0 "У нас достаточно Национального опыта для изучения следующей идеи в принятой группе, и в данный момент никакой цикл внедрения Доктрины не блокирует эту покупку."
 alert_max_piety_name:0 "Можно принять религиозно-государственную программу"
 alert_max_piety_hint:0 "Наше Религиозное усердие достаточно высоко для принятия еще одной религиозной программы."
 alert_ve_can_begin_cultural_project_name:0 "Накопление культурного мандата"
 alert_ve_can_begin_cultural_project_hint:0 "У нас более #Y 300#! культурного мандата, и мы можем начать культурный проект. Прирост мандата сокращается вдвое при достижении 400 и останавливается на 500, поэтому его стоит потратить. Ничто не навязывается: наша Модель идентичности уже активна."
 alert_can_unlock_age_bonus_name:0 "Можно открыть награду эпохи"
 alert_can_unlock_age_bonus_hint:0 "У нас достаточно Дыхания эпохи, чтобы выбрать новую награду."
 ag_ve_missionary_group_name:0 "Религиозные и культурные действия"
 alert_can_use_missionary_name:0 "Можно отправить миссионеров"
 alert_can_use_missionary_hint:0 "Наши миссионеры ждут активной миссии. Выберите принадлежащую нам область и начните обращение местного населения."
 ag_ve_state_project_group_name:0 "Целевые областные проекты"
 alert_ve_can_begin_targeted_cultural_project_name:0 "Можно начать целевой культурный проект"
 alert_ve_can_begin_targeted_cultural_project_hint:0 "У нас есть ресурсы и подходящая область для целевого культурного проекта нашей Модели идентичности."
 alert_ve_can_begin_targeted_religious_project_name:0 "Можно начать целевой религиозный проект"
 alert_ve_can_begin_targeted_religious_project_hint:0 "У нас есть Религиозное усердие и подходящая область для проекта активной Религиозной модели."
 ve_culture_reform_cost_tt:0 "Требования для реформы традиционной культуры."
 ve_state_religion_tt:0 "#P Активирует механики Конфессионального государства и предоставляет 3 миссионеров.#! Религиозный авторитет чутко реагирует на поддержку со стороны верующих."
 ve_freedom_of_conscience_tt:0 "#P Активирует механики плюралистического государства и предоставляет 1 миссионера.#! Религиозная гармония вознаграждает стабильное сосуществование."
 ve_total_separation_tt:0 "#P Активирует механики плюралистического государства.#! Миссионеры недоступны."
 ve_ethnostate_tt:0 "#P Сильно сближается с Моделью идентичности «Этническая нация».#! Противоречит гражданской нации и меньше подходит для составного государства."
 ve_national_supremacy_tt:0 "#P Согласуется с Моделью идентичности «Этническая нация».#! Противоречит гражданской нации."
 ve_racial_segregation_tt:0 "#P Согласуется с Моделью идентичности «Составное государство».#! Обеспечивает лишь частичную поддержку для этнической нации."
 ve_cultural_exclusion_tt:0 "#P Согласуется с Моделью идентичности «Составное государство» и частично поддерживает гражданскую нацию.#!"
 ve_multicultural_tt:0 "#P Сильно сближается с Моделью идентичности «Гражданская нация».#! Противоречит этнической нации."
 ve_send_missionary_tt:0 "#variable Миссионер обращает веру в местном населении каждые #gold 6 месяцев.\n\n#white Если население области менее 250 тыс.: #darker_white 0% #white Базовое Обращение Базовая Мощность Спад\n#white Если население области менее 500 тыс.: #negative_value -0.02% #white Обращение Базовая Мощность Спад\n#white Если население области менее 750 тыс.: #negative_value -0.03% #white Обращение Базовая Мощность Спад\n#white Если население области менее 1 млн: #negative_value -0.04% #white Обращение Базовая Мощность Спад\n#white Если население области менее 5 млн: #negative_value -0.043% #white Обращение Базовая Мощность Спад\n#white Если население области менее 10 млн: #negative_value -0.045% #white Обращение Базовая Мощность Спад\n#white Если население области более 10 млн+: #negative_value -0.0475% #white Обращение Базовая Мощность Спад"
 ve_targeted_cultural_project_state_action_tt:0 "#header Целевой культурный проект#!\nЗапускает проект, связанный с текущей Моделью идентичности. Крупнейшая подходящая некоренная культура, составляющая не менее #Y 5%#! населения этой области, становится целью. Откройте панель национальной идентичности для просмотра точных затрат, правил прогресса и результатов."
 ve_topbar:0 "Переключить содержимое верхней панели"

