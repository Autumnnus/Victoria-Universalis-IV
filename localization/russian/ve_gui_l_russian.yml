 ve_targeted_religious_project_state_action:0 "#tooltippable_name Целевой религиозный проект"
 ve_targeted_religious_project_state_action_tt:0 "#header Целевой религиозный проект#!\nЗапускает проект, связанный с Текущая религиозная модель против религиозной структуры этого государства. Полное Разделение не может его начать. Откройте панель «Религия», чтобы узнать точные затраты, правила прогресса и результаты."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Целевой культурный проект"
 ve_start_religious_project_button:0 "Начать проект"
 ve_cancel_religious_project_button:0 "Отменить проект"
 ve_confirm_cancel_button:0 "#N Да, отменить#!"
 ve_keep_project_button:0 "Сохранить проект"
 ve_targeted_religious_project_state_requirements_tt:0 "Государство должно принадлежать нам, и наша собственная религия не должна уже удерживать #Y 90%#! или более его населения. Конфессиональный, свободный совести и государственный атеизм могут положить начало одному; Полное разделение не может. Затраты на реформу благочестия активной религиозной модели также должны быть покрыты."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "Религиозная модель позволяет реализовать целевой проект (полное разделение не может начать его)"
 ve_religious_project_req_no_active:0 "Целевой религиозный проект еще не выполняется"
 ve_religious_project_req_no_backlash:0 "Не в течение 24-месячного периода восстановления после отмены проекта"
 ve_religious_project_req_reform_point:0 "Достаточно реформы благочестия для активной религиозной модели (#Y 125#! Конфессиональный/ #Y 100#! Свобода совести/ #Y 150#! Государственный атеизм)"
 ve_religious_project_req_target:0 "Наша собственная религия принадлежит менее #Y 90%#! населения этого штата"
 ve_religious_project_cancel_warning:0 "#header Отменить целевой религиозный проект?#!\n\nПрогресс, достигнутый до сих пор, потерян. #N -5 Религиозное поселение#! и #N 24 месяца#! Модификатор перезарядки применяется перед запуском другого проекта."
 ve_cultural_project_req_no_active:0 "Ни один культурный проект уже не находится в стадии реализации. "
 ve_cultural_project_req_no_backlash:0 "Не прошло 24 месяца после отмены проекта. "
 ve_cultural_project_req_reform_point:0 "Достаточно культурного мандата для активной модели идентичности (#Y 125#! Этнический / #Y 100#! Гражданский / #Y 150#! Композитный, плюс #Y 40#! Сплоченность для композита)"
 ve_cultural_project_req_target:0 "Этот штат имеет подходящую неосновную культуру, в которой проживает не менее  #Y 5%#! его населения."
 ve_cultural_project_cancel_warning:0 "#header Отменить культурный проект?#!\n\nПрогресс, достигнутый до сих пор, потерян. #N -5 Национальная сплоченность#! и #N 24 месяца#! Модификатор перезарядки применяется до того, как можно будет начать другой проект."
 alert_can_unlock_ideas_name:0 "Можно принять идею"
 alert_can_unlock_ideas_hint:0 "У нас достаточно национального понимания, чтобы по крайней мере одна принятая группа приняла следующую идею, и никакой цикл реализации доктрины в настоящее время не блокирует покупку."
 alert_max_piety_name:0 "Может принять религиозно-государственную программу"
 alert_max_piety_hint:0 "Наша реформа благочестия достаточно высока, чтобы принять еще одну религиозную программу."
 alert_ve_can_begin_cultural_project_name:0 "Культурный мандат накапливается"
 alert_ve_can_begin_cultural_project_hint:0 "Мы закончили #Y 300#! Культурный мандат и культурный проект, который мы могли бы начать. Доход от мандата уменьшается вдвое на уровне 400 и останавливается на уровне 500, так что тратить стоит. Ничего не является принудительным: наша модель идентичности уже активна."
 alert_can_unlock_age_bonus_name:0 "Можно разблокировать награду эпохи"
 alert_can_unlock_age_bonus_hint:0 "У нас достаточно Era Momentum, чтобы выбрать другую награду."
 ag_ve_missionary_group_name:0 "Религиозные и культурные действия"
 alert_can_use_missionary_name:0 "Могут отправлять миссионеров"
 alert_can_use_missionary_hint:0 "Наши миссионеры ждут активной миссии. Нажмите на принадлежащий штат и преобразуйте местных жителей."
 ag_ve_state_project_group_name:0 "Целевые государственные проекты"
 alert_ve_can_begin_targeted_cultural_project_name:0 "Можно начать целевой культурный проект"
 alert_ve_can_begin_targeted_cultural_project_hint:0 "У нас есть ресурсы и подходящий штат для целевого культурного проекта нашей модели идентичности."
 alert_ve_can_begin_targeted_religious_project_name:0 "Можно начать целевой религиозный проект"
 alert_ve_can_begin_targeted_religious_project_hint:0 "У нас есть реформа благочестия и государство, подходящее для активного проекта религиозной модели."
 ve_culture_reform_cost_tt:0 "Требование к культурной реформе наследия."
 ve_state_religion_tt:0 "#P Включает механику конфессионального государства и 3 миссионеров.#! Религиозная власть активно реагирует на поддержку благочестивых."
 ve_freedom_of_conscience_tt:0 "#P Включает механику плюралистического государства и 1 миссионера.#! Религиозная гармония вознаграждает стабильное сосуществование."
 ve_total_separation_tt:0 "#P Включает плюралистическое государство механика.#! Миссионеры отключены."
 ve_ethnostate_tt:0 "#P Сильно согласуется с моделью этнической нации.#! Конфликтует с гражданской нацией и менее подходит для составного государства."
 ve_national_supremacy_tt:0 "#P Соответствует модели этнической нации.#! Конфликтует с гражданской нацией."
 ve_racial_segregation_tt:0 "#P Соответствует модели составной государственной идентичности.#! Она обеспечивает лишь частичную поддержку этнической Нация."
 ve_cultural_exclusion_tt:0 "#P Соответствует модели составной государственной идентичности и частично поддерживает гражданскую нацию.#!"
 ve_multicultural_tt:0 "#P Сильно согласуется с моделью гражданской нации.#! Конфликтует с этнической нацией."
 ve_send_missionary_tt:0 "#variable Миссионер меняет религию местного населения каждые #gold 6 месяцев.\n\n#white Если население штата меньше 250 тыс.: #darker_white 0% #white Базовая мощность преобразования Распад\n#white Если численность населения штата менее 500 тыс.: #negative_value -0,02% #white Спад конверсионной базовой мощности\n#white Если численность населения штата меньше 750 тыс.: #negative_value -0,03% #white Спад конверсионной базовой мощности\n#white Если численность населения штата меньше 1 млн: #negative_value -0,04% #white Спад конверсионной базовой мощности\n#white Если численность населения штата меньше 5м: #negative_value -0,043% #white Спад конверсионной базовой мощности\n#white Если численность населения штата меньше 10 м: #negative_value -0,045% #white Спад конверсионной базовой мощности\n#white Если население штата превышает 10 млн+: #negative_value -0,0475% #white Спад конверсионной базовой мощности"
 ve_targeted_cultural_project_state_action_tt:0 "#header Целевой культурный проект#!\nЗапускает проект, связанный с текущим Модель идентичности. Самая крупная подходящая неосновная культура с как минимум #Y 5%#! населения этого штата становится целью. Откройте панель «Национальная идентичность», чтобы узнать точные затраты, правила выполнения и результаты."
 ve_topbar:0 "Переключить содержимое верхней панели"

