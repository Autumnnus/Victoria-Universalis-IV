l_russian:
 ve_piety:0 "Благочестие"
 ve_piety_reform:0 "Религиозное усердие"
 ve_piety_reform_tt:0 "#header Религиозное усердие#!\nТекущее: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nЕжемесячный прирост: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Ежемесячная разбивка#!\nБазовое: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nПоддержка духовенства: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nДоктрина идей: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Доктрина идей — учитывается только ваша текущая Религиозная модель#!\n#P Конфессиональное государство / Государственный атеизм#!: Национальная V #P +1#!\n#P Свобода совести / Полное отделение#!: Реформистская V #P +1#!\nАктивная сумма выше ограничена значением #Y +1#!, поэтому оба пути не суммируются.\n\nТратится на доктрины и программы (по #Y 25#!) и на целевой религиозный проект (#Y 100-150#! в зависимости от модели). Прирост замедляется после #Y 400#! и останавливается на #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Доктрины и программы"
 ve_piety_tt:0 "#header Религиозный компромисс#!\nТекущее состояние: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nСоциальное равновесие: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nЕжемесячное изменение: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Разбивка равновесия#!\nМодель компромисса: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nПоддержка модели: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nЛегитимность, администрация и стабильность: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nШкала смещается на #Y 20%#! к равновесию каждый месяц, в пределах #Y ±5#!.\nПри #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nПри #N 25#! или ниже: #N -5 Легитимность и -5% Успех принятия законов#!.\n\nЭта шкала больше не расходуется на программы — см. Религиозное усердие. Программы требуют не менее #Y 25#! Религиозного усердия, стоят #Y 25#! и накладывают #Y 24-месячное#! напряжение реализации.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Религиозный проект"
 ve_religious_project_progress_tt:0 "#header Целевой религиозный проект#!\nПрогресс: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nЕжемесячный прогресс: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (минимум 1, максимум 7)\n\n#Y Ежемесячная разбивка#!\nБазовое: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nПоддержка модели: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nКомпромисс: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nРелигиозные движения: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nБеспорядки в целевой области: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nГруппы идей: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Группы идей — активны только бонусы, соответствующие вашей текущей Религиозной модели#!\n#P Конфессиональное государство#!: Национальная VII #P +1#!\n#P Свобода совести#!: Реформистская VII #P +1#!\n#P Государственный атеизм#!: Национальная VII #P +1#! и Академическая VII #P +1#!\nАктивная сумма групп идей выше ограничена значением #Y +2#!.\n\nЗапустите проект на панели подконтрольной области. Конфессиональное государство и Государственный атеизм обращают #Y 5%#! населения целевой области по завершении (или #Y 7%#! с Национальной VII) и добавляют радикалов. Свобода совести вместо этого добавляет лоялистов без принудительного обращения. Полное отделение не может запустить проект — это полностью нейтральная модель.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "В процессе"
 ve_religious_project_none:0 "Нет активных"

