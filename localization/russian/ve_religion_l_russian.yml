 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Государственная религия"
 ve_settlement_tier_high:0 "УСТАНОВЛЕНО – [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "ОСПОРАНО – #N -5 легитимности и -5% успеха принятия закона.#!."
 ve_settlement_hint:0 "Смещается к равновесию, которое создает ваша религиозная модель. При 75+ вы получаете бонус, при 25 или меньше нестабильность."
 ve_piety_reform_hint:0 "Потрачено на программы (по 25 штук) и религиозные проекты. Экономить безопасно, но доход уменьшится вдвое на уровне 400 и остановится на уровне 500."
 ve_religious_project_hint:0 "Необязательно. Началось в одном из ваших штатов, если ваша религиозная модель это позволяет."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Религиозные модели"
 ve_religious_models_help:0 "Ваша религиозная модель определяется вашим #Y Церковь и государство#! закон и является #P уже активен#! - здесь выбирать нечего. Модель решает только, как #Y Религиозное поселение#! заработано, какие восемь программ вы можете принять и какой религиозный проект вы можете запустить.\n#Y Изменение закона не является обязательным:#! он сбрасывает Поселение до  #Y 35#!, удаляет все принятые вами Программы, отменяет действующий Религиозный Проект и применяет  #Y 3-5-летний#! Кризис Поселения.\n#Y Наведите курсор на любую карту или счетчик, чтобы увидеть его полный эффект.#!"
 ve_religious_model_active_footer:0 "Текущая модель"
 ve_confessional_state_short:0 "Церковь и государство управляют вместе.\nПоселение происходит на основе  #Y благочестивого одобрения и влияния#!."
 ve_freedom_state_short:0 "Любая вера допускается в одном государстве.\nПоселение происходит из  #Y спокойной, хорошо управляемой страны#!."
 ve_separation_state_short:0 "Государство вообще не занимает никакой религиозной позиции.\nПоселение начинается с самого высокого уровня и вознаграждается  #Y низкими беспорядками#!."
 ve_atheism_state_short:0 "Активная, возглавляемая государством секуляризация.\nУрегулирование происходит за счет  #Y грамотности и интеллигенции#!."
 ve_confessional_state_unlocks:0 "Управляет #Y Конфессиональное обращение#! проект"
 ve_freedom_state_unlocks:0 "Запускает #Y Freedom Outreach#! проект"
 ve_separation_state_unlocks:0 "#N Не может запустить религиозный проект#!"
 ve_atheism_state_unlocks:0 "Управляет #Y Кампания по секуляризации#! проект"
 ve_confessional_state_desc:0 "#header Конфессиональное государство#!\nЦерковь и государство управляют вместе.\n\n#Y Во время активности#!\n#P +5% авторитета, +10% обращения, +10% религиозной политической силы#!\n#N -3% миграционная привлекательность, +5% радикалов от открытых предрассудков#!\nПлюс один небольшой пакет для религиозной семьи вашей государственной религии (христианская, исламская, иудейская, дхармическая, научная или анимистская).\n\n#Y Поселение#!\nБазовое равновесие #Y 55#!. Набожное одобрение и влияние влияют на него больше всего.\n\n#Y При поселении 75#!\n#P +5% авторитета, +5 легитимности#!\n\n#Y Религиозный проект#!\nКонфессиональное обращение"
 ve_freedom_state_desc:0 "#header Свобода совести#!\nЛюбая вера допускается в одном государстве.\n\n#Y Во время активности#!\n#P +5% Миграция Привлечение, -5% радикалов от открытого предубеждения#!\n#N -15% Конверсия, -25 Бюрократия#!\n\n#Y Урегулирование#!\nБазовое равновесие #Y 55#!. Низкий уровень беспорядков, легитимность и здоровая администрация повышают его.\n\n#Y В поселении 75#!\n#P +5% миграционная привлекательность, +5 легитимность#!\n\n#Y Религиозный проект#!\nОхват свободы"
 ve_separation_state_desc:0 "#header Полное разделение#!\nНейтральная модель: государство не занимает религиозной позиции.\n\n#Y В активном режиме#!\n#P +8% миграционная привлекательность, -10% радикалов от открытых предрассудков, -5% радикалов от насилия Враждебность#!\n#N -30% Конверсия#!\n\n#Y Расчет#!\nБазовое равновесие #Y 60#!, самое высокое из четырех. Низкие беспорядки повышают его еще больше.\n\n#Y При 75 поселении#!\n#P +5% успеха принятия закона, +5 легитимности#!\n\n#Y Религиозный проект#!\n#N Нет. В этой модели намеренно нет религиозной кампании.#!"
 ve_atheism_state_desc:0 "#header Государственный атеизм#!\nАгрессивная модель секуляризации, а не толерантная.\n\n#Y Пока активна#!\n#P +5% Распространение технологий, +2% Доступ к образованию, +20% Конверсия#!\n#N -5% Авторитет, -10% Благочестивая политическая сила, +5% Радикалы от открытых предубеждений#!\n\n#Y Урегулирование#!\nБазовое равновесие #Y 45#!, самое низкое из четырех. Грамотность и одобрение интеллигенции повышают его; сильное влияние Благочестивых снижает его.\n\n#Y При 75 поселении#!\n#P +5% распространения технологий, +5% бюрократии#!\n\n#Y Религиозный проект#!\nКампания по секуляризации\n\n#Y Примечание#!\nПереход на эту модель стоит  #N 5-летнего#! кризиса вместо 3, если грамотность ниже 50% или влияние набожности составляет 20% или более."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Программы #Y необязательный#! и постоянный. Каждый стоит  #Y 25 Реформа благочестия.#! и начинает #Y 24 месяца#! напряженность в реализации, во время которой никакая дальнейшая Программа не может быть принята. Все восемь принадлежат вашей текущей религиозной модели и теряются при изменении этой модели.\n#Y Наведите курсор на любую карту или счетчик, чтобы увидеть все ее эффекты.#!"
 ve_religious_program_strain_notice:0 "Программа все еще реализуется – никакая дальнейшая Программа не может быть принята до тех пор, пока не истечет срок действия этого штамма."
 ve_religious_program_adopted_badge:0 "ПРИНЯТО"
 ve_adopt_program_button:0 "Принять"
 ve_religious_program_cost_label:0 "Затраты #Y 25 Реформа благочестия#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Цель религиозного проекта"
 ve_religious_projects_intro:0 "Религиозный проект – это #Y необязательно#! и одновременно может работать только один. Стоимость реформы благочестия выплачивается немедленно и #N -50 Бюрократия и -25 Авторитет.#! подавать заявку до тех пор, пока она работает. Завершение возвращает часть реформы благочестия и повышает уровень религиозного поселения.\n#Y Наведите курсор на любую карту или счетчик, чтобы увидеть полный эффект.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Проект в работе"
 ve_religious_project_backlash_notice:0 "Отмененный проект по-прежнему блокирует новый – сначала должен истечь 24-месячный срок действия."
 ve_religious_project_start_instruction:0 "#Y Как его запустить#!\n1. Откройте одно из своих состояний.\n2. Нажмите #Y Начать проект#! на панели этого штата.\nВсе, чего еще не хватает, указано во всплывающей подсказке этой кнопки."
 ve_targeted_religious_project_target:0 "Цель: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Нет цели проекта"
 ve_no_active_religious_project:0 "Нет активного религиозного проекта"
 ve_confessional_conversion_name:0 "Конфессиональное обращение"
 ve_confessional_conversion_cost:0 "Стоимость: #Y 125 Реформа благочестия#!"
 ve_confessional_conversion_short:0 "Обратить один штат в сторону государственной религии.\n#P +20 Реформа благочестия, +5 Поселение#! по завершении – но оно порождает радикалов."
 ve_confessional_conversion_desc:0 "#header Конфессиональное обращение#!\nПроводится в одном штате, где доля вашей собственной религии ниже #Y 90%#!.\n\n#Y Стоимость#!\n#Y 125 Реформа благочестия#!, выплачивается немедленно\n\n#Y Пока она действует#!\n#N -50 Бюрократия, -25 Авторитет#! для страны\n#N +20% Каналы конверсии и +20% радикализма#! в целевом государстве\n\n#Y По завершении#!\nПревращает #Y 5%#! населения штата в вашу государственную религию или #Y 7%#! с националистической VII версией.\n#P +20 Реформа благочестия, +5 Религиозная Мировое соглашение#!\n\n#Y Предупреждение#!\n#N Преобразование создает радикалы в целевом государстве.#!"
 ve_freedom_outreach_name:0 "Пропаганда свободы"
 ve_freedom_outreach_cost:0 "Стоимость: #Y 100 Реформа благочестия#!"
 ve_freedom_outreach_short:0 "Завоевать одно государство без принудительного обращения.\n#P +20 Реформа благочестия, +7 поселений#! по завершении, плюс лоялисты."
 ve_freedom_outreach_desc:0 "#header Пропаганда свободы#!\nБеги в одном штате, доля вашей религии в котором составляет ниже #Y 90%#!.\n\n#Y Стоимость#!\n#Y 100 Реформа благочестия#!, выплачивается немедленно\n\n#Y Пока она действует#!\n#N -50 Бюрократия, -25 Авторитет#! для страны\n\n#Y По завершении#!\n#P Нет принудительного преобразования#! - вместо этого лоялисты в целевом государстве\n#P +20 Благочестие Реформа, +7 Религиозное поселение#!"
 ve_secularization_campaign_name:0 "Кампания по секуляризации"
 ve_secularization_campaign_cost:0 "Стоимость: #Y 150 Реформа благочестия#!"
 ve_secularization_campaign_short:0 "Обратить одно государство в атеизм.\n#P +25 Реформа благочестия, +8 Поселение#! по завершении – но оно порождает радикалов."
 ve_secularization_campaign_desc:0 "#header Кампания по секуляризации#!\nЗапускайте в одном государстве, доля вашей собственной религии составляет ниже #Y 90%#!.\n\n#Y Стоимость#!\n#Y 150 Реформа благочестия#!, выплачивается немедленно\n\n#Y Пока она действует#!\n#N -50 Бюрократия, -25 Авторитет#! для страны\n#N +20% Каналы конверсии и +20% радикализма#! в целевом государстве\n\n#Y Вкл. завершение#!\nПревращает #Y 5%#! населения штата в атеизм, или #Y 7%#! с Националистическим VII\n#P +25 Реформа благочестия, +8 Религиозное поселение#!\n\n#Y Предупреждение#!\n#N Обращение создает радикалы в целевом государстве.#!"
 ve_religious_project_unavailable_name:0 "Нет доступных проектов"
 ve_religious_project_unavailable_cost:0 "#N Total Separation не может запустить религиозный проект#!"
 ve_religious_project_unavailable_short:0 "Нейтральная модель сознательно не имеет религиозной кампании. Примите другой закон Церкви и штата, если хотите."
 ve_religious_project_unavailable_desc:0 "#header Нет доступных проектов#!\nТотальное разделение является полностью нейтральной моделью и не может начать целевой религиозный проект.\n\nКонфессиональное государство, Свобода совести и Государственный атеизм реализуют каждый свой собственный проект. Примите соответствующий закон Церкви и штата, чтобы получить его."

