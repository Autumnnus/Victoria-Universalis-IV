l_russian:
 ve_piety:0 "Благочестие"
 ve_piety_reform:0 "Реформа благочестия"
 ve_piety_reform_tt:0 "#header Реформа благочестия#!\nТекущий: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nЕжемесячный доход: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Разбивка по месяцам#!\nБаза: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nНабожная поддержка: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nИдея доктрина: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Идея доктрины — учитывается только ваша текущая религиозная модель#!\n#P Конфессиональное государство/Государственный атеизм#!: Националистический V #P +1#!\n#P Свобода совести/Полное отделение#!: Реформистский V #P +1#!\nВышеуказанная активная сумма ограничена #Y +1#!, поэтому два пути не могут суммироваться.\n\nПотрачено на доктрины и программы (#Y 25#! каждый) и по Целевому религиозному проекту (#Y 100-150#!, в зависимости от модели). Доход замедляется #Y 400#! и останавливается на #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Доктрины и программы"
 ve_piety_tt:0 "#header Религиозное поселение#!\nТекущее состояние: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nСоциальное равновесие: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nМесячное движение: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Нарушение равновесия#!\nМодель поселения: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nПоддержка модели: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nЛегитимность, управление и стабильность: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nСчетчик перемещается #Y 20%#! к равновесию каждый месяц, ограниченный #Y ±5#!.\nВ #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nВ  #N 25#! или ниже:  #N -5 легитимности и -5% успеха принятия закона.#!.\n\nЭтот счетчик больше не оплачивает программы — см. «Реформа благочестия». Для программ требуется не менее  #Y 25#! Реформа благочестия, стоимость  #Y 25#! и навязать #Y 24 месяца#! напряжение реализации.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Религиозный проект"
 ve_religious_project_progress_tt:0 "#header Целевой религиозный проект#!\nПрогресс: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nМесячный прогресс: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (минимум 1, максимум 7)\n\n#Y Разбивка по месяцам#!\nБаза: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nПоддержка модели: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nПоселение: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nРелигиозные движения: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nЦель-государство Суматоха: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nГруппы идей: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Группы идей — активны только бонусы, соответствующие вашей текущей религиозной модели#!\n#P Конфессиональное государство#!: Националист VII #P +1#!\n#P Свобода совести#!: Реформист VII #P +1#!\n#P Государственный атеизм#!: Националист VII #P +1#!  и Академический VII #P +1#!\nОбщее количество активных групп идей, указанных выше, ограничено  #Y +2#!.\n\nНачните одну с панели принадлежащего штата. Конфессиональный и государственный атеизм конвертируют #Y 5%#! населения целевого государства после завершения, или  #Y 7%#! с Националистом VII и добавьте радикалов. Вместо этого «Свобода совести» добавляет лоялистов, не принуждая к обращению. Total Separation не может запустить проект — это полностью нейтральная модель.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "В процессе"
 ve_religious_project_none:0 "Нет активных"

