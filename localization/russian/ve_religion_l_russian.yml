 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Государственная религия"
 ve_settlement_tier_high:0 "УРЕГУЛИРОВАНО — [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "ОСПАРИВАЕТСЯ — #N -5 Легитимность и -5% Успех принятия закона#!."
 ve_settlement_hint:0 "Стремится к равновесию, которое производит ваша Религиозная модель. При 75+ вы получаете бонус, при 25 и менее — нестабильность."
 ve_piety_reform_hint:0 "Тратится на программы (по 25) и на Религиозные проекты. Накапливать их безопасно, но при достижении 400 прирост уменьшается вдвое, а при 500 — останавливается."
 ve_religious_project_hint:0 "Необязательно. Запускается из одной из ваших Областей, если это позволяет ваша Религиозная модель."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Религиозные модели"
 ve_religious_models_help:0 "Ваша Религиозная модель определяется законом #Y Церковь и государство#! и #P уже активна#! — здесь нечего выбирать. Модель определяет лишь то, как зарабатывается #Y Религиозный компромисс#!, какие восемь программ вы можете принять и какой Религиозный проект можете запустить.\n#Y Изменение закона необязательно:#! оно сбрасывает Религиозный компромисс до #Y 35#!, отменяет все принятые вами программы, прекращает выполнение текущего Религиозного проекта и вызывает #Y кризис Религиозного компромисса на 3–5 лет#!.\n#Y Наведите указатель на любую карточку или шкалу, чтобы увидеть их полный эффект.#!"
 ve_religious_model_active_footer:0 "Текущая модель"
 ve_confessional_state_short:0 "Церковь и государство управляют вместе.\nКомпромисс зависит от #Y Одобрения и Уровня влияния Верующих#!."
 ve_freedom_state_short:0 "Каждая вера терпима под единым государством.\nКомпромисс зависит от #Y спокойствия и благоустройства страны#!."
 ve_separation_state_short:0 "Государство не занимает никакой религиозной позиции.\nРелигиозный компромисс начинается с наивысших значений и вознаграждает за #Y низкий уровень беспорядков#!."
 ve_atheism_state_short:0 "Активная секуляризация под руководством государства.\nРелигиозный компромисс зависит от #Y грамотности и интеллигентов#!."
 ve_confessional_state_unlocks:0 "Запуск проекта: #Y Конфессиональное обращение#!"
 ve_freedom_state_unlocks:0 "Запуск проекта: #Y Церковное просвещение#!"
 ve_separation_state_unlocks:0 "#N Невозможно запустить религиозный проект#!"
 ve_atheism_state_unlocks:0 "Запуск проекта: #Y Кампания секуляризации#!"
 ve_confessional_state_desc:0 "#header Конфессиональное государство#!\nЦерковь и государство правят совместно.\n\n#Y Во время действия#!\n#P +5% Авторитет, +10% Обращение, +10% Политическая сила верующих#!\n#N -3% Миграционная привлекательность, +5% Радикалы от открытых предрассудков#!\nПлюс небольшой бонус для семьи конфессий вашей государственной религии (христианская, исламская, иудейская, дхармаистическая, ученая или анимистическая).\n\n#Y Религиозный компромисс#!\nБазовое равновесие: #Y 55#!. Одобрение и уровень влияния верующих сильнее всего влияют на него.\n\n#Y При компромиссе 75#!\n#P +5% Авторитет, +5 Легитимность#!\n\n#Y Религиозный проект#!\nКонфессиональное обращение"
 ve_freedom_state_desc:0 "#header Свобода совести#!\nЛюбая вера терпима в рамках одного государства.\n\n#Y Во время действия#!\n#P +5% Миграционная привлекательность, -5% Радикалы от открытых предрассудков#!\n#N -15% Обращение, -25 Бюрократия#!\n\n#Y Религиозный компромисс#!\nБазовое равновесие: #Y 55#!. Низкие беспорядки, легитимность и эффективное управление повышают его.\n\n#Y При компромиссе 75#!\n#P +5% Миграционная привлекательность, +5 Легитимность#!\n\n#Y Религиозный проект#!\nЦерковное просвещение"
 ve_separation_state_desc:0 "#header Полное отделение#!\nНейтральная модель: государство не занимает религиозной позиции.\n\n#Y В активном режиме#!\n#P +8% миграционная привлекательность, -10% радикалов от открытых предрассудков, -5% радикалов от насильственной враждебности#!\n#N -30% Конверсия#!\n\n#Y Религиозный компромисс#!\nБазовое равновесие #Y 60#!, самое высокое из четырех. Низкие беспорядки повышают его еще больше.\n\n#Y При компромиссе 75#!\n#P +5% успеха принятия закона, +5 легитимности#!\n\n#Y Религиозный проект#!\n#N Нет. В этой модели намеренно нет религиозной кампании.#!"
 ve_atheism_state_desc:0 "#header Государственный атеизм#!\nМодель агрессивной секуляризации, а не веротерпимости.\n\n#Y Во время действия#!\n#P +5% Распространение технологий, +2% Доступность образования, +20% Обращение#!\n#N -5% Авторитет, -10% Политическая сила верующих, +5% Радикалы от открытых предрассудков#!\n\n#Y Религиозный компромисс#!\nБазовое равновесие: #Y 45#! — наименьшее среди всех четырех. Грамотность и одобрение интеллигентов повышают его; сильный уровень влияния верующих понижает его.\n\n#Y При компромиссе 75#!\n#P +5% Распространение технологий, +5% Бюрократия#!\n\n#Y Религиозный проект#!\nКампания секуляризации\n\n#Y Примечание#!\nПереход на эту модель вызывает кризис продолжительностью в #N 5 лет#! вместо 3, если грамотность ниже 50% или уровень влияния верующих составляет 20% или более."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Программы являются #Y необязательными#! и постоянными. Каждая стоит #Y 25 Религиозное усердие#! и запускает #Y 24-месячное#! напряжение при внедрении, во время которого невозможно принять новые программы. Все восемь программ принадлежат к вашей текущей религиозной модели и будут утрачены при ее изменении.\n#Y Наведите указатель мыши на любую карточку или шкалу, чтобы увидеть все эффекты.#!"
 ve_religious_program_strain_notice:0 "Программа все еще внедряется — принятие новых программ невозможно до истечения этого напряжения."
 ve_religious_program_adopted_badge:0 "ПРИНЯТО"
 ve_adopt_program_button:0 "Принять"
 ve_religious_program_cost_label:0 "Стоимость: #Y 25 Религиозное усердие#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Целевой религиозный проект"
 ve_religious_projects_intro:0 "Религиозный проект является #Y необязательным#!, и одновременно может действовать только один. Стоимость в религиозном усердии оплачивается немедленно, а на время его проведения действуют штрафы: #N -50 Бюрократия и -25 Авторитет#!. Завершение проекта возвращает часть религиозного усердия и повышает религиозный компромисс.\n#Y Наведите указатель мыши на любую карточку или шкалу, чтобы увидеть все эффекты.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Проект выполняется"
 ve_religious_project_backlash_notice:0 "Отмененный проект все еще препятствует началу нового: сперва должен истечь 24-месячный отпор."
 ve_religious_project_start_instruction:0 "#Y Как запустить#!\n1. Откройте одну из ваших областей.\n2. Нажмите #Y Начать проект#! на панели этой области.\nВсе недостающие условия указаны во всплывающей подсказке этой кнопки."
 ve_targeted_religious_project_target:0 "Цель: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Нет цели проекта"
 ve_no_active_religious_project:0 "Нет активного религиозного проекта"
 ve_confessional_conversion_name:0 "Конфессиональное обращение"
 ve_confessional_conversion_cost:0 "Стоимость: #Y 125 Религиозное усердие#!"
 ve_confessional_conversion_short:0 "Обратить одну область в государственную религию.\n#P +20 Религиозное усердие, +5 Компромисс#! при завершении, но создает радикалов."
 ve_confessional_conversion_desc:0 "#header Конфессиональное обращение#!\nПроводится в отдельной области, где доля вашей религии составляет менее #Y 90%#!.\n\n#Y Стоимость#!\n#Y 125 Религиозное усердие#!, выплачивается немедленно\n\n#Y Во время выполнения#!\n#N -50 Бюрократия, -25 Авторитет#! для страны\n#N +20% Обращение и +20% к росту радикалов#! в целевой области\n\n#Y По завершении#!\nОбращает #Y 5%#! населения области в вашу государственную религию, или #Y 7%#! с национальной доктриной VII\n#P +20 Религиозное усердие, +5 Религиозный компромисс#!\n\n#Y Предупреждение#!\n#N Обращение создает радикалов в целевой области.#!"
 ve_freedom_outreach_name:0 "Церковное просвещение"
 ve_freedom_outreach_cost:0 "Стоимость: #Y 100 Религиозное усердие#!"
 ve_freedom_outreach_short:0 "Расположить к себе одну область без принудительного обращения.\n#P +20 Религиозное усердие, +7 Компромисс#! при завершении, а также лоялисты."
 ve_freedom_outreach_desc:0 "#header Церковное просвещение#!\nПроводится в отдельной Области, доля приверженцев вашей религии в которой составляет менее #Y 90%#!.\n\n#Y Стоимость#!\n#Y 100 Религиозное усердие#!, выплачивается немедленно\n\n#Y Во время проведения#!\n#N -50 Бюрократия, -25 Авторитет#! для страны\n\n#Y По завершении#!\n#P Без принудительного обращения#! — вместо этого в целевой Области появляются лоялисты\n#P +20 Религиозное усердие, +7 Религиозный компромисс#!"
 ve_secularization_campaign_name:0 "Кампания секуляризации"
 ve_secularization_campaign_cost:0 "Стоимость: #Y 150 Религиозное усердие#!"
 ve_secularization_campaign_short:0 "Обратить одну Область в атеизм.\n#P +25 Религиозное усердие, +8 Религиозный компромисс#! по завершении, но это порождает радикалов."
 ve_secularization_campaign_desc:0 "#header Кампания секуляризации#!\nПроводится в отдельно взятой Области, чья доля вашей собственной религии составляет менее #Y 90%#!.\n\n#Y Стоимость#!\n#Y 150 Религиозное усердие#!, выплачивается немедленно\n\n#Y Во время проведения#!\n#N -50 Бюрократия, -25 Авторитет#! для страны\n#N +20% Обращение и +20% Радикализм#! в целевой Области\n\n#Y По завершении#!\nОбращает #Y 5%#! населения Области в атеизм, либо #Y 7%#! при наличии Национальная VII\n#P +25 Религиозное усердие, +8 Религиозный компромисс#!\n\n#Y Предупреждение#!\n#N Обращение порождает радикалов в целевой Области.#!"
 ve_religious_project_unavailable_name:0 "Нет доступных проектов"
 ve_religious_project_unavailable_cost:0 "#N Полное отделение не позволяет проводить Религиозный проект#!"
 ve_religious_project_unavailable_short:0 "Нейтральная модель намеренно не предусматривает религиозных кампаний. Примите другой закон об отношении церкви и государства, если хотите ее запустить."
 ve_religious_project_unavailable_desc:0 "#header Нет доступных проектов#!\nПолное отделение является полностью нейтральной моделью и не может начинать целевой Религиозный проект.\n\nГосударственная церковь, Свобода совести и Государственный атеизм имеют собственные проекты. Примите соответствующий закон об отношении церкви и государства, чтобы получить один из них."

