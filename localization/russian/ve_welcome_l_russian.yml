l_russian:
 # Приветственное событие Victoria Universalis IV 2.0 - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Эта кампания идёт на переработанном Victoria Universalis IV. Коротко:\n\n#Y Религия#! - Закон о церкви и государстве теперь задаёт одну из четырёх Религиозных моделей. У вас есть шкала Религиозного согласия от 0 до 100, вы тратите Реформу благочестия на восемь постоянных программ каждой модели и можете вести один Религиозный проект в выбранном штате.\n\n#Y Национальная идентичность#! - Этническая, гражданская или составная нация: тратьте Культурный мандат, держите высокой Национальную сплочённость и ведите пять Культурных проектов.\n\n#Y Группы идей#! - 21 группа в разделах Производство, Общество и Армия, включая новую Аграрную группу. Слоты групп теперь зарабатываются вложениями в доктрину, а не по календарю, и каждая покупка стоит 24 месяца внедрения.\n\n#Y Национальные идеи#! - Двенадцать новых профилей стран, а прогресс теперь даёт каждый купленный уровень идеи.\n\n#Y Эпохи#! - Три эпохи с задачами, тринадцать наград эпохи и три Золотых века, а также один стратегический Перекрёсток эпохи в каждой эпохе.\n\n#Y Новый контент#! - Более ста новых событий: доктринальные дилеммы, многолетние Доктринальные пути, происшествия и кризисы проектов, а также тематические цепочки для Османов, Японии и США.\n\n#Y Интерфейс#! - Новая строка верхней панели, переработанные страницы Религии и Национальной идентичности, сводка доктрины в панели любой страны и всемирная Доктрина Леджер."
 ve_welcome.1.f:0 "Каждая доктрина оставляет след в нации, которая её принимает."
 ve_welcome.1.a:0 "Подробности - в описании мода. Приятной игры ^_^"
