l_russian:
 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Эта кампания работает на обновленной модификации Victoria Universalis IV. Кратко:\n\n#Y Религия#! — Ваш закон о церкви и государстве теперь определяет одну из четырех религиозных моделей. Вам доступны показатель религиозного компромисса (0-100), расходование религиозного усердия на восемь постоянных программ для каждой модели, а также возможность проведения одного адресного религиозного проекта в выбранной области.\n\n#Y Национальная идентичность#! — Этническая, гражданская или смешанная нация с доступным к расходованию культурным мандатом, показателем национального единения, который следует поддерживать на высоком уровне, и пятью культурными проектами.\n\n#Y Группы идей#! — 21 группа в категориях «Производство», «Общество» и «Армия и флот», включая новую аграрную группу. Слоты групп открываются за инвестиции в доктрины, а не с течением времени, причем каждое приобретение требует 24-месячного периода внедрения.\n\n#Y Национальные идеи#! — Двенадцать новых профилей стран, а прогресс теперь достигается за каждый приобретенный уровень идеи.\n\n#Y Эпохи#! — Три эпохи с целями, тринадцатью слотами наград эпохи и тремя золотыми веками, а также одно стратегическое перепутье эпохи для каждой эпохи.\n\n#Y Новый контент#! — Более ста новых событий: дилеммы доктрин, многолетние путешествия по доктринам, инциденты и кризисы в рамках проектов, а также цепочки исторических событий для Османской империи, Японии и Соединенных Штатов.\n\n#Y Интерфейс#! — Новая строка в верхней панели, переработанные страницы религии и национальной идентичности, сводка доктрин в панели каждой страны, а также всемирный регистр доктрин."
 ve_welcome.1.f:0 "Каждая доктрина оставляет свой след на принявшей ее нации."
 ve_welcome.1.a:0 "Подробности см. в описании мода. Приятной игры ^_^"
