l_russian:
 ve_national_identity:0 "Национальная идентичность"
 ve_primary_cultures_label:0 "Основные культуры"
 ve_identity_models:0 "Модели идентичности"
 ve_identity_model_active_footer:0 "Уже активна"
 ve_switch_identity_button:0 "Сменить"
 ve_switch_identity_cost_label:0 "Стоимость: #Y 200 Культурный мандат#!"
 ve_begin_project_button:0 "Начать проект"
 ve_identity_models_help:0 "Ваша нация всегда имеет ровно одну Модель идентичности, и она #P уже активна#! — здесь не нужно ничего выбирать. Модель определяет лишь то, как зарабатывается #Y Национальное единение#! и какой Культурный проект вы можете проводить.\n#Y Смена необязательна:#! она стоит #Y 200 Культурный мандат#!, сбрасывает Единение до #Y 35#!, отменяет любой текущий Культурный проект и блокирует повторную смену на 5 лет.\n#Y Наведите указатель на любую карточку или шкалу, чтобы увидеть все эффекты.#!"
 ve_ethnic_identity_name:0 "Этническая нация"
 ve_civic_identity_name:0 "Гражданская нация"
 ve_composite_identity_name:0 "Составное государство"
 ve_ethnic_identity_short:0 "Нация определяется вокруг своих основных культур.\nЕдинение обеспечивается #Y демографическим преобладанием#!."
 ve_civic_identity_short:0 "Политическая нация, создаваемая через образование.\nЕдинение обеспечивается #Y грамотностью и принятыми меньшинствами#!."
 ve_composite_identity_short:0 "Несколько народов при согласованных институтах.\nЕдинение обеспечивается #Y подлинно плюралистичным населением#!."
 ve_ethnic_identity_unlocks:0 "Открывает проект «#Y Кампания этнической интеграции#!»"
 ve_civic_identity_unlocks:0 "Открывает проект «#Y Инициатива равного гражданства#!»"
 ve_composite_identity_unlocks:0 "Открывает проект «#Y Учредительный пакт#!»"
 ve_ethnic_identity_desc:0 "#header Этническая нация#!\nНация определяется вокруг своих основных культур.\n\n#Y Пока активна#!\n#P +15% Ассимиляция, +5% Авторитет#!\n#N -5% Миграционная привлекательность, +5% Радикалы от открытых предрассудков#!\n\n#Y Единение#!\nРастет, когда основные культуры составляют не менее 60–75% населения, и резко падает ниже 40%.\n\n#Y При Единении 75#!\n#P +5% к доле призывников, +3 Легитимность#!\n\n#Y Культурный проект#!\nКампания этнической интеграции"
 ve_civic_identity_desc:0 "#header Гражданская нация#!\nОбщая политическая нация строится через образование и участие.\n\n#Y Пока активна#!\n#P +7% Миграционная привлекательность, +1% к доступности образования#!\n#N -10% Ассимиляция, -5% Авторитет, -50 Бюрократия#!\n\n#Y Единение#!\nГрамотность повышает его, но любая непринятая культура, составляющая более 10% населения при очень низкой Терпимости, понижает его.\n\n#Y При Единении 75#!\n#P +5% к квалификациям, +3 Легитимность#!\n\n#Y Культурный проект#!\nИнициатива равного гражданства"
 ve_composite_identity_desc:0 "#header Составное государство#!\nНесколько народов управляются через согласованные институты.\n\n#Y Пока активна#!\n#P -10% Радикалы от стирания культур и второсортного гражданства, +5% Влияние#!\n#N -15% Ассимиляция, -5% Авторитет, -75 Бюрократия#!\n\n#Y Единение#!\nПодлинно плюралистичное население повышает его; если население более чем на 90% состоит из основных культур, эта модель ослабевает.\n\n#Y При Единении 75#!\n#P +5% Влияние, +3 Легитимность#!\n\n#Y Культурный проект#!\nУчредительный пакт"
 ve_identity_change_cost_tt:0 "Смена Модели идентичности требует #Y 200 Культурный мандат#! и отсутствия активного отпора переходу идентичности. Смена сбрасывает Единение до #Y 35#!, вызывает #Y 5-летний отпор переходу#! и отменяет любой активный Культурный проект без дополнительного штрафа за отмену."
 ve_cultural_mandate:0 "Культурный мандат"
 ve_culture_reform_point:0 "Культурный мандат"
 ve_cultural_mandate_hint:0 "Тратится на Культурные проекты. Накапливать его безопасно, но прирост сокращается вдвое при достижении 400 и останавливается при 500."
 ve_culture_reform_point_tt:0 "#header Культурный мандат#!\nТекущее: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nЕжемесячное изменение: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y На что он тратится#!\nКультурные проекты (75–150) и смена Модели идентичности (200). Ни то, ни другое не обязательно: копить Мандат безопасно, прирост лишь сокращается вдвое при 400 и останавливается при 500.\n\n#Y Ежемесячная разбивка#!\nБазовое: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nМодельное общество: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nСтабильность и Культурные движения: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nСоответствие законам: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nДоктрина идеи: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nМножитель предела: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Доктрина идеи — учитывается только ваша текущая Модель идентичности#!\n#P Этническая нация#!: Национальная V #P +1#!\n#P Гражданская нация#!: Реформистская V #P +1#!; Академическая V #P +1#!\n#P Составное государство#!: Реформистская V #P +1#!\nУказанный выше активный итог ограничен значением #Y +2#!.\n\nГражданская нация черпает компонент Модельного общества из грамотности, Составное государство — из грамотности в плюралистичном обществе, а Этническая нация — из демографической силы основных культур.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Национальное единение"
 ve_national_cohesion_hint:0 "Стремится к равновесию, которое создает ваша Модель идентичности. При 75+ вы получаете бонус, при 25 или менее — нестабильность."
 ve_national_cohesion_tt:0 "#header Национальное единение#!\nТекущее: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nРавновесие: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nЕжемесячное изменение: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nОбщие условия: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nУсловия модели идентичности: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nЕжемесячно сплоченность смещается на 20% от оставшегося расстояния до равновесия, не более чем на 5 пунктов. Радикальные культурные движения снижают равновесие на 10. При значении 75 или выше текущая модель дает дополнительное преимущество; при значении 25 или ниже наступает национальная нестабильность.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Нет эффекта"
 ve_cultural_projects:0 "Культурные проекты"
 ve_cultural_projects_intro:0 "Культурные проекты являются #Y необязательными#!. Одновременно может выполняться только один: стоимость в Мандат оплачивается немедленно, а на время его проведения действуют штрафы #N -75 Бюрократия и -25 Авторитет#!. Завершение проекта возвращает часть Мандата и повышает Национальное единение. Общестрановые проекты могут быть повторены только после окончания срока действия бонуса от их завершения; завершенная цель Область/Культура не может быть выбрана повторно.\n#Y Наведите указатель мыши на любую карточку или шкалу, чтобы увидеть все эффекты.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Проект в процессе"
 ve_cultural_project_progress:0 "Прогресс проекта"
 ve_cultural_project_progress_tt:0 "#header Ежемесячный прогресс проекта#!\nТекущий: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nОсталось: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nВсего за месяц: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (минимум 1, максимум 7)\n\n#Y Ежемесячная разбивка#!\nБазовый: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nОбщество модели: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nСплоченность: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nКультурные движения: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nБеспорядки в целевой области: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nГруппы идей: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Группы идей — активны только бонусы, соответствующие вашей текущей Модели идентичности#!\n#P Этническая нация#!: Национальная VII — #P +1#!\n#P Гражданская нация#!: Реформистская VII, Академическая VII или Социальная VI — по #P +1#! каждому\n#P Составное государство#!: Реформистская VII или Дипломатическая VI — по #P +1#! каждому\nСумма активных групп идей выше ограничена максимумом в #Y +2#!; любые дальнейшие совпадающие бонусы не увеличивают прогресс.\n\nОбщество модели вознаграждает гражданскую грамотность, этническую демографическую концентрацию или составное разнообразие в соответствии с активной Моделью идентичности. Завершение оформляется при следующем ежемесячном обновлении после того, как прогресс достигает #Y 100#!."
 ve_cancel_cultural_project_button:0 "Отменить проект"
 ve_cancel_cultural_project_tt:0 "#header Отменить культурный проект#!\nВложенный Культурный мандат #N не возвращается#!. Национальное единение падает на #N 5#!, а #N 2-летний отпор#! предотвращает запуск другого проекта."
 ve_start_cultural_project_button:0 "Начать проект"
 ve_national_curriculum_name:0 "Национальная учебная программа"
 ve_national_curriculum_cost:0 "Стоимость: #Y 100 Культурный мандат#!"
 ve_national_curriculum_short:0 "Школьная реформа в масштабах всей страны.\n#P +20 Мандат, +5 Сплоченность#!, затем улучшение образования."
 ve_national_curriculum_desc:0 "#header Национальная учебная программа#!\nШкольная реформа, проводимая по всей стране.\n\n#Y Стоимость#!\n#Y 100 Культурный мандат#!, оплачивается немедленно\n\n#Y При завершении#!\n#P +20 Культурный мандат, +5 Национальное единение#!\n\n#Y В течение следующих 10 лет#!\n#P +2% Доступность образования, +5% Квалификации#!\n#N -25 Бюрократия#!"
 ve_national_curriculum_requirements_tt:0 "Требуется #Y 100 Культурный мандат#!, отсутствие активного Культурного проекта и отсутствие отпора по проекту. Она также не может быть начата, пока действует предыдущий бонус от #Y Национальной учебной программы#!."
 ve_shared_symbols_name:0 "Общие символы"
 ve_shared_symbols_cost:0 "Стоимость: #Y 75 Культурный мандат#!"
 ve_shared_symbols_short:0 "Флаги, гимны и публичные церемонии.\n#P +20 Мандат, +7 Сплоченность#!, затем лоялисты и Авторитет."
 ve_shared_symbols_desc:0 "#header Общие символы#!\nФлаги, гимны и публичные церемонии, продвигаемые по всей стране.\n\n#Y Стоимость#!\n#Y 75 Культурный мандат#!, оплачивается немедленно\n\n#Y При завершении#!\n#P +20 Культурный мандат, +7 Национальное единение#!\n\n#Y В течение следующих 8 лет#!\n#P +10% Лоялисты от полностью принятых групп населения, +25 Авторитет#!"
 ve_shared_symbols_requirements_tt:0 "Требуется #Y 75 Культурный мандат#!, отсутствие активного Культурного проекта и отсутствие отпора по проекту. Она также не может быть начата, пока действует предыдущий бонус от #Y Общих символов#!."
 ve_ethnic_campaign_name:0 "Кампания этнической интеграции"
 ve_ethnic_campaign_cost:0 "Стоимость: #Y 125 Культурный мандат#!"
 ve_ethnic_campaign_short:0 "Ассимиляция крупного меньшинства в одной Области.\n#P +25 Мандат, +8 Сплоченность#!, но это порождает радикалов."
 ve_ethnic_campaign_desc:0 "#header Кампания этнической интеграции#!\nПроводится в отдельной Области против её крупнейшей не основной культуры, составляющей не менее #Y 5%#! населения этой Области.\n\n#Y Стоимость#!\n#Y 125 Культурный мандат#!, оплачивается немедленно\n\n#Y При завершении#!\nАссимилирует #Y 5%#! целевой культуры в основную культуру или #Y 7%#! с Национальная VII\n#P +25 Культурный мандат, +8 Национальное единение#!\nОставляет в Области программу ассимиляции на #Y 10 лет#!\n\n#Y Предупреждение#!\n#N Как запуск, так и завершение проекта порождают радикалов среди целевой культуры.#!"
 ve_civic_initiative_name:0 "Инициатива равного гражданства"
 ve_civic_initiative_cost:0 "Стоимость: #Y 100 Культурный мандат#!"
 ve_civic_initiative_short:0 "Повысить Терпимость к меньшинству в одной Области.\n#P +25 Мандат, +10 Сплочённость#!, а также лоялисты."
 ve_civic_initiative_desc:0 "#header Инициатива равного гражданства#!\nПроводится в отдельной Области против её крупнейшей не основной культуры, составляющей не менее #Y 5%#! населения этой Области.\n\n#Y Стоимость#!\n#Y 100 Культурный мандат#!, оплачивается немедленно\n\n#Y При завершении#!\n#P +15 Терпимость к этой культуре на 10 лет#!\nЛоялисты в целевой Области\n#P +25 Культурный мандат, +10 Национальное единение#!\nДесять лет улучшенных Квалификаций и Миграционной привлекательности"
 ve_composite_compact_name:0 "Учредительный пакт"
 ve_composite_compact_cost:0 "Стоимость: #Y 150 Культурный мандат#! и #Y 40 Сплочённость#!"
 ve_composite_compact_short:0 "Признать меньшинство в качестве государствообразующей культуры.\n#P +30 Мандат, +12 Сплочённость#!, навсегда."
 ve_composite_compact_desc:0 "#header Учредительный пакт#!\nПроводится в отдельной Области в отношении непризнанной не основной культуры, составляющей не менее #Y 5%#! населения этой Области.\n\n#Y Стоимость#!\n#Y 150 Культурный мандат#!, оплачивается немедленно, и не менее #Y 40 Национальное единение#!\n\n#Y При завершении#!\n#P +15 Терпимость к этой культуре, навсегда#!\nПризнает её в качестве государствообразующей культуры\nЛоялисты в целевой Области\n#P +30 Культурный мандат, +12 Национальное единение#!"
 ve_targeted_project_start_instruction:0 "#Y Как запустить#!\n1. Откройте одну из собственных Областей.\n2. Нажмите #Y Начать проект#! на панели этой Области.\nЦелевая культура и все еще недостающие требования указаны во всплывающей подсказке этой кнопки."
 ve_targeted_project_state_requirements_tt:0 "Область должна принадлежать нам и содержать подходящую не основную культуру, составляющую не менее #Y 5%#! её населения. Крупнейшая подходящая культура становится целью. Культура, проект по которой уже завершен в этой Области, не может быть выбрана снова, но может стать целью в другой Области. Также должны быть выполнены требования и стоимость текущей Модели идентичности."
 ve_targeted_cultural_project_target:0 "Цель: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! в #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Охват: #Y Вся страна#!"
 ve_no_cultural_project_target:0 "Нет цели проекта"
 ve_no_active_cultural_project:0 "Нет активного Культурного проекта"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "СПЛОЧЕННОСТЬ - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "РАЗДРОБЛЕННОСТЬ - #N действует национальная нестабильность#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% Воинский призыв и +3 Легитимность#!."
 ve_civic_high_cohesion_effect:0 "#P +5% Квалификации и +3 Легитимность#!."
 ve_composite_high_cohesion_effect:0 "#P +5% Влияние и +3 Легитимность#!."
 ve_identity_transition_backlash_notice:0 "Отпор при смене идентичности все еще активен — модель нельзя сменить снова, пока он не истечет."
 ve_cultural_project_backlash_notice:0 "Отмененный проект все еще блокирует новый — 2-летний отпор должен сначала истечь."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Активен отпор при смене"
 ve_cultural_project_backlash_notice_short:0 "Активен отпор при отмене"
 ve_targeted_project_start_instruction_short:0 "Запустите из одной из своих Областей: откройте Область и нажмите #Y Начать проект#!."
