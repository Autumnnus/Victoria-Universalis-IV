l_russian:
 ve_national_identity:0 "Национальная идентичность"
 ve_primary_cultures_label:0 "Основные культуры"
 ve_identity_models:0 "Модели идентичности"
 ve_identity_model_active_footer:0 "Уже активны"
 ve_switch_identity_button:0 "Стоимость переключения"
 ve_switch_identity_cost_label:0 " #Y 200 Культурный мандат#!"
 ve_begin_project_button:0 "Начать проект"
 ve_identity_models_help:0 "У вашей нации всегда есть ровно одна модель идентичности, и это #P уже активен#!  — здесь ничего выбирать не нужно. Модель решает только, как #Y Национальное единство#! заработано и какой культурный проект вы можете запустить.\n#Y Переключение необязательно:#! оно стоит #Y 200 Культурного Мандата#!, сбрасывает Сплоченность до  #Y 35#!, отменяет любой запущенный Культурный Проект и блокирует другое переключение на 5 лет.\n#Y Наведите курсор на любую карту или счетчик, чтобы получить полный эффект.#!"
 ve_ethnic_identity_name:0 "Этническая Нация"
 ve_civic_identity_name:0 "Гражданская Нация"
 ve_composite_identity_name:0 "Композитное Государство"
 ve_ethnic_identity_short:0 "Нация определяется вокруг ее основных культур.\nСплоченность возникает из #Y демографических доминирование#!."
 ve_civic_identity_short:0 "Политическая нация, построенная посредством школьного образования.\nСплоченность возникает из #Y грамотность и признанные меньшинства#!."
 ve_composite_identity_short:0 "Несколько народов находятся в рамках договорных институтов.\nСплоченность возникает благодаря #Y действительно многочисленное население#!."
 ve_ethnic_identity_unlocks:0 "Открывает проект  #Y Кампания по этнической интеграции#! ."
 ve_civic_identity_unlocks:0 "Открывает #Y Инициатива равного гражданства#! проект"
 ve_composite_identity_unlocks:0 "Открывает #Y Учредительный договор#! проект"
 ve_ethnic_identity_desc:0 "#header Этническая нация#!\nНация определяется вокруг своих основных культур.\n\n#Y В активном состоянии#!\n#P +15% Ассимиляция, +5% Авторитет#!\n#N -5% Привлечение миграции, +5% Радикалы от открытых предрассудков#!\n\n#Y Сплоченность#!\nПовышается при первичном культуры составляют не менее 60–75% населения и резко падают ниже 40%.\n\n#Y При 75 сплоченности#!\n#P +5% уровень призыва, +3 легитимности#!\n\n#Y Культурный проект#!\nКампания по этнической интеграции"
 ve_civic_identity_desc:0 "#header Гражданская нация#!\nОбщая политическая нация строится посредством образования и участия.\n\n#Y В активном режиме#!\n#P +7% миграционная привлекательность, +1% доступ к образованию#!\n#N -10% Ассимиляция, -5% Авторитет, -50 Бюрократия#!\n\n#Y Сплоченность#!\nГрамотность повышает его, но любая неосновная культура выше 10% населения с очень низким Принятием снижает его.\n\n#Y При 75 Сплоченность#!\n#P +5% Квалификация, +3 Легитимность#!\n\n#Y Культурный Проект#!\nИнициатива равного гражданства"
 ve_composite_identity_desc:0 "#header Композитное государство#!\nНекоторые народы управляются посредством договорных институтов.\n\n#Y Пока активен#!\n#P -10% радикалов из культурного стирания и второсортного гражданства, +5% влияния#!\n#N -15% Ассимиляция, -5% Авторитет, -75 Бюрократия#!\n\n#Y Сплоченность#!\nПодлинно плюралистическое население повышает его; население, состоящее более чем на 90% из первичных культур, ослабляет эту модель.\n\n#Y При 75 сплоченности#!\n#P +5% влияния, +3 легитимности#!\n\n#Y Культурный проект#!\nУчредительный договор"
 ve_identity_change_cost_tt:0 "Изменение модели идентичности требует #Y 200 культурного мандата#! и отсутствие активной обратной реакции при переходе к идентичности. Это изменение сбрасывает сплоченность до #Y 35#!, вызывает #Y 5-летняя реакция на переходный период#! и отмена любого активного культурного проекта без дополнительного штрафа за отмену."
 ve_cultural_mandate:0 "Культурный мандат"
 ve_culture_reform_point:0 "Культурный мандат"
 ve_cultural_mandate_hint:0 "Потрачено на культурные проекты. Копить безопасно, но доход уменьшается вдвое на уровне 400 и останавливается на уровне 500."
 ve_culture_reform_point_tt:0 "#header Культурный мандат#!\nТекущий: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nЕжемесячные изменения: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y На что они тратятся#!\nКультурные проекты (75–150) и изменения модели идентичности (200). Ни то, ни другое не требуется: сберегательный мандат безопасен, доход сокращается вдвое на уровне 400 и останавливается на уровне 500.\n\n#Y Разбивка по месяцам#!\nБаза: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nМодельное общество: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nСтабильность и культурные движения: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nСогласование закона: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nИдея доктрины: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nКап множитель: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Идея доктрины — учитывается только ваша текущая Модель идентичности#!\n#P Этническая нация#!: Националистическая V #P +1#!\n#P Гражданская нация#!: Реформистская V #P +1#!; Академический V #P +1#!\n#P Композитное государство#!: Реформистский V #P +1#!\nВышеуказанная активная сумма ограничена  #Y +2#!.\n\nГражданская нация извлекает компонент «Модель общества» из грамотности, Составное государство — из грамотности в плюралистическом обществе, а «Этническая нация» — из демографической силы первичной культуры.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Национальная сплоченность"
 ve_national_cohesion_hint:0 "Дрейфует к равновесию, которое создает ваша Модель Идентичности. При 75+ вы получаете бонус, при 25 или меньше нестабильность."
 ve_national_cohesion_tt:0 "#header Национальная сплоченность#!\nТекущий: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nРавновесие: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nЕжемесячное движение: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nОбщие условия: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nУсловия модели идентичности: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nСплоченность перемещается на 20% расстояния к равновесию каждый месяц, до 5 очков. Радикальные культурные движения снижают равновесие на 10. При возрасте 75 лет и более текущая модель дает дополнительную выгоду; при 25 или меньше действует национальная нестабильность.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Нет эффекта"
 ve_cultural_projects:0 "Культурные проекты"
 ve_cultural_projects_intro:0 "Культурные проекты #Y необязательный#!. Одновременно может участвовать только один: стоимость его мандата оплачивается немедленно и #N -75 Бюрократия и -25 Авторитет.#! подавать заявку до тех пор, пока она работает. Завершение проекта возвращает часть мандата и повышает сплоченность. Общенациональные проекты могут быть повторены только после истечения срока действия льгот по их завершению; завершенную цель штата/культуры нельзя выбрать повторно.\n#Y Наведите курсор на любую карту или счетчик, чтобы увидеть ее полный эффект.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Проект в процессе"
 ve_cultural_project_progress:0 "Прогресс проекта"
 ve_cultural_project_progress_tt:0 "#header Ежемесячный прогресс проекта#!\nТекущий: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nОсталось: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nВсего за месяц: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (минимум 1, максимум 7)\n\n#Y Разбивка по месяцам#!\nБаза: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nМодельное общество: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nСплоченность: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nКультурные движения: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nЦель-государство Суматоха: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nГруппы идей: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Группы идей — активны только бонусы, соответствующие вашей текущей модели идентичности#!\n#P Этническая нация#!: Националистическая VII #P +1#!\n#P Гражданская нация#!: Реформистская VII, Академическая VII или Благосостояние VI — #P +1#! каждая\n#P Композитная Государство#!: Реформистское VII или Дипломатическое VI — #P +1#! каждый\nОбщее количество активных групп идей, указанных выше, ограничено #Y +2#!; любые дальнейшие бонусы соответствия не увеличивают прогресс.\n\nМодельное общество вознаграждает гражданскую грамотность, этническую демографическую концентрацию или сложное разнообразие в соответствии с активной Моделью Идентичности. Завершение разрешается в следующем ежемесячном обновлении после достижения прогресса. #Y 100#!."
 ve_cancel_cultural_project_button:0 "Отменить проект"
 ve_cancel_cultural_project_tt:0 "#header Отменить культурный проект#!\nВложенный культурный мандат #N не возвращен#!. Национальное единство падает #N 5#! и #N Двухлетняя негативная реакция#! предотвращает реализацию нового проекта."
 ve_start_cultural_project_button:0 "Начать проект"
 ve_national_curriculum_name:0 "Национальная учебная программа"
 ve_national_curriculum_cost:0 "Стоимость: #Y 100 Культурный мандат#!"
 ve_national_curriculum_short:0 "Реформа школьного образования по всей стране.\n#P +20 Мандат, +5 Сплоченность#!, затем лучшее образование."
 ve_national_curriculum_desc:0 "#header Национальная учебная программа#!\nРеформа школьного образования охватывает всю страну.\n\n#Y Стоимость#!\n#Y 100 Культурный мандат#!, оплата немедленно\n\n#Y По завершении#!\n#P +20 Культурный мандат, +5 Национальная сплоченность#!\n\n#Y В течение 10 лет после этого#!\n#P +2% Доступ к образованию, +5% Квалификация#!\n#N -25 Бюрократия#!"
 ve_national_curriculum_requirements_tt:0 "Требуется #Y 100 Культурный мандат#!, нет активного культурного проекта и никакой реакции на проект. Он также не может начаться, пока предыдущий #Y Национальная учебная программа#! преимущество активно."
 ve_shared_symbols_name:0 "Общие символы"
 ve_shared_symbols_cost:0 "Стоимость: #Y 75 Культурный мандат#!"
 ve_shared_symbols_short:0 "Флаги, гимны и публичные церемонии.\n#P +20 Мандат, +7 Сплоченность.#!, затем лоялисты и власть."
 ve_shared_symbols_desc:0 "#header Общие символы#!\nФлаги, гимны и публичные церемонии, рекламируемые по всей стране.\n\n#Y Стоимость#!\n#Y 75 Культурный мандат#!, выплачивается немедленно\n\n#Y По завершении#!\n#P +20 Культурный мандат, +7 Национальная сплоченность#!\n\n#Y В течение 8 лет после этого#!\n#P +10% лоялистов из полностью принятого населения, +25 авторитета#!"
 ve_shared_symbols_requirements_tt:0 "Требует #Y 75 Культурный мандат#!, нет активного культурного проекта и нет обратной реакции на проект. Он также не может начаться, пока предыдущий #Y Общие символы#! выгода активна."
 ve_ethnic_campaign_name:0 "Кампания по этнической интеграции"
 ve_ethnic_campaign_cost:0 "Расходы: #Y 125 Культурный мандат#!"
 ve_ethnic_campaign_short:0 "Ассимилировать большое меньшинство в одном государстве.\n#P +25 Мандат, +8 Сплоченность#!, но он порождает радикалов."
 ve_ethnic_campaign_desc:0 "#header Кампания по этнической интеграции#!\nПроводится в одном штате против его крупнейшей неосновной культуры, которая должна удерживать не менее #Y 5%#! этого государства население.\n\n#Y Стоимость#!\n#Y 125 Культурный мандат#!, выплачивается немедленно\n\n#Y По завершении#!\nАссимиляты #Y 5%#! целевой культуры в первичную культуру, или #Y 7%#! с Националистическим VII\n#P +25 Культурный Мандат, +8 Национальное Сплочение#!\nУходит на #Y 10 лет#! Программа ассимиляции в штате\n\n#Y Предупреждение#!\n#N Как начало, так и завершение проекта создают радикалов среди целевой культуры.#!"
 ve_civic_initiative_name:0 "Инициатива равного гражданства"
 ve_civic_initiative_cost:0 "Стоимость: #Y 100 Культурный мандат#!"
 ve_civic_initiative_short:0 "Повысьте принятие меньшинства в одном штате.\n#P +25 Мандат, +10 Сплоченность#!, плюс лоялисты."
 ve_civic_initiative_desc:0 "#header Инициатива равного гражданства#!\nВыполняется в одном штате с его крупнейшей неосновной культурой, которая должна содержать не менее  #Y 5%#! населения этого штата.\n\n#Y Стоимость#!\n#Y 100 Культурный мандат#!, платный немедленно\n\n#Y По завершении#!\n#P +15 Принятие в эту культуру на 10 лет#!\nЛоялисты в целевом государстве\n#P +25 Культурный мандат, +10 Национальная сплоченность#!\nДесять лет повышения квалификации и миграционной привлекательности"
 ve_composite_compact_name:0 "Учредительный договор"
 ve_composite_compact_cost:0 "Стоимость: #Y 150 Культурный мандат#! и #Y 40 Сплоченность#!"
 ve_composite_compact_short:0 "Признание меньшинства в качестве составной культуры.\n#P +30 Мандат, +12 Сплоченность#!, навсегда."
 ve_composite_compact_desc:0 "#header Учредительный договор#!\nЗаключается в одном штате на основе непризнанной неосновной культуры, в которой проживает не менее  #Y 5%#! населения этого штата.\n\n#Y Стоимость#!\n#Y 150 культурного мандата#!, выплачивается немедленно, и не менее  #Y 40 национальной сплоченности#!\n\n#Y На завершение#!\n#P +15 Принятие этой культуры на постоянной основе#!\nПризнает ее в качестве составной культуры\nЛоялисты в целевом государстве\n#P +30 Культурный мандат, +12 Национальная сплоченность#!"
 ve_targeted_project_start_instruction:0 "#Y Как начать#!\n1. Откройте одно из своих состояний.\n2. Нажмите #Y Начать проект#! на панели этого штата.\nЦелевая культура и все, что еще отсутствует, перечислены во всплывающей подсказке этой кнопки. "
 ve_targeted_project_state_requirements_tt:0 "Штат должен принадлежать нам и содержать подходящую неосновную культуру, составляющую не менее  #Y 5%#! своего населения. Целью становится самая крупная подходящая культура. Культура, уже реализованная в этом штате, не может стать целью снова, но может стать целью в другом штате. Также должны быть соблюдены стоимость и требования текущей модели идентичности."
 ve_targeted_cultural_project_target:0 "Цель: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! в #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Масштаб:  #Y Вся страна #!"
 ve_no_cultural_project_target:0 "Нет цели проекта "
 ve_no_active_cultural_project:0 "Нет активного культурного проекта "

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "Сплоченность –  [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "ФРАГМЕНТАЦИЯ –  #N национальная нестабильность#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% к уровню призыва и +3 легитимности#!."
 ve_civic_high_cohesion_effect:0 "#P +5% квалификаций и +3 легитимности#!."
 ve_composite_high_cohesion_effect:0 "#P +5% влияния и +3 легитимности#!."
 ve_identity_transition_backlash_notice:0 "Отзыв на изменение идентичности все еще активен – модель нельзя переключить снова до истечения срока его действия."
 ve_cultural_project_backlash_notice:0 "Отмененный проект по-прежнему блокирует новый – должен истечь двухлетний срок действия обратной реакции сначала."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Люфт перехода активен"
 ve_cultural_project_backlash_notice_short:0 "Отмена люфта активен"
 ve_targeted_project_start_instruction_short:0 "Запустите его из одного из ваших собственных состояний: откройте состояние и нажмите  #Y Начать проект#!."
