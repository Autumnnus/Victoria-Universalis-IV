 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "Этническая нация"
 ve_ethnic_identity_mdf_desc:0 "Государство определяет политическую принадлежность на основе своих основных культур."
 ve_civic_identity_mdf:0 "Гражданская нация"
 ve_civic_identity_mdf_desc:0 "Государство определяет политическую принадлежность через общие институты и гражданство."
 ve_composite_identity_mdf:0 "Составное государство"
 ve_composite_identity_mdf_desc:0 "Государство поддерживает баланс между народами посредством договорённостей и административных институтов."
 ve_ethnic_high_cohesion_mdf:0 "Мобилизованное национальное сообщество"
 ve_ethnic_high_cohesion_mdf_desc:0 "Сплочённая этническая нация способна мобилизовать своё население и укрепить легитимность государства."
 ve_civic_high_cohesion_mdf:0 "Уверенное гражданское общество"
 ve_civic_high_cohesion_mdf_desc:0 "Общие гражданские институты создают легитимность и обеспечивают социальную мобильность."
 ve_composite_high_cohesion_mdf:0 "Стабильный имперский пакт"
 ve_composite_high_cohesion_mdf_desc:0 "Стабильный пакт между народами государства укрепляет легитимность и дипломатические позиции."
 ve_low_national_cohesion_mdf:0 "Низкое национальное единение"
 ve_low_national_cohesion_mdf_desc:0 "Определение нации, принятое в государстве, теряет свою легитимность."
 ve_identity_transition_backlash_mdf:0 "Отпор при смене идентичности"
 ve_identity_transition_backlash_mdf_desc:0 "Институты и сообщества оказывают сопротивление переопределению нации."
 ve_cultural_project_administration_mdf:0 "Администрирование культурного проекта"
 ve_cultural_project_administration_mdf_desc:0 "Чиновники и политический капитал направлены на реализацию активного Культурного проекта."
 ve_cultural_project_backlash_mdf:0 "Заброшенный культурный проект"
 ve_cultural_project_backlash_mdf_desc:0 "Резкий отказ от культурной программы нанёс ущерб общественному доверию и административной координации."
 ve_national_curriculum_result_mdf:0 "Национальная учебная программа"
 ve_national_curriculum_result_mdf_desc:0 "Общая учебная программа расширяет образование и квалификации, однако её поддержание требует Бюрократия."
 ve_shared_symbols_result_mdf:0 "Общие национальные символы"
 ve_shared_symbols_result_mdf_desc:0 "Общие гражданские ритуалы и символы укрепляют Лояльность и Авторитет государства."
 ve_ethnic_campaign_active_mdf:0 "Кампания этнической интеграции"
 ve_ethnic_campaign_active_mdf_desc:0 "Государство активно ускоряет Ассимиляция, провоцируя сопротивление культурному стиранию."
 ve_ethnic_campaign_result_mdf:0 "Программа ассимиляции"
 ve_ethnic_campaign_result_mdf_desc:0 "Завершённая кампания интеграции продолжает ускорять Ассимиляция, одновременно порождая напряжённость из-за культурного стирания."
 ve_civic_initiative_active_mdf:0 "Инициатива равного гражданства"
 ve_civic_initiative_active_mdf_desc:0 "Школы и государственные институты реорганизуются для расширения возможностей и снижения открытых предрассудков."
 ve_civic_initiative_result_mdf:0 "Программа равного гражданства"
 ve_civic_initiative_result_mdf_desc:0 "Инициатива улучшает Квалификации, Миграционная привлекательность и Устойчивость к открытым предрассудкам."
 ve_composite_compact_active_mdf:0 "Переговоры об Учредительном пакте"
 ve_composite_compact_active_mdf_desc:0 "Переговоры снижают недовольство второсортным гражданством, но временно создают Напряжение в налоговом управлении."
 ve_composite_compact_result_mdf:0 "Учредительный пакт"
