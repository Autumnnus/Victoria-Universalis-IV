 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "Этническая нация"
 ve_ethnic_identity_mdf_desc:0 "Государство определяет политическое членство на основе своих основных культур."
 ve_civic_identity_mdf:0 "Гражданская нация"
 ve_civic_identity_mdf_desc:0 "Государство определяет политическое членство через общие институты и гражданство."
 ve_composite_identity_mdf:0 "Композитное государство"
 ve_composite_identity_mdf_desc:0 "Государство уравновешивает несколько народов посредством договорных и административных институтов."
 ve_ethnic_high_cohesion_mdf:0 "Мобилизованное национальное сообщество"
 ve_ethnic_high_cohesion_mdf_desc:0 "Сплоченная этническая нация может мобилизовать свое население и узаконить Государство."
 ve_civic_high_cohesion_mdf:0 "Уверенное гражданское общество"
 ve_civic_high_cohesion_mdf_desc:0 "Общие гражданские институты создают легитимность и социальную мобильность."
 ve_composite_high_cohesion_mdf:0 "Стабильный имперский договор"
 ve_composite_high_cohesion_mdf_desc:0 "Стабильный договор между народами государства укрепляет легитимность и дипломатию."
 ve_low_national_cohesion_mdf:0 "Низкая национальная сплоченность"
 ve_low_national_cohesion_mdf_desc:0 "Государственное определение нации теряет легитимность."
 ve_identity_transition_backlash_mdf:0 "Ответная реакция на переход идентичности"
 ve_identity_transition_backlash_mdf_desc:0 "Институты и сообщества сопротивляются переопределению нации."
 ve_cultural_project_administration_mdf:0 "Администрация культурного проекта"
 ve_cultural_project_administration_mdf_desc:0 "Чиновники и политический капитал привержены активному культурному проекту."
 ve_cultural_project_backlash_mdf:0 "Заброшенный культурный проект"
 ve_cultural_project_backlash_mdf_desc:0 "Резкий отказ от культурной программы нанес ущерб общественному доверию и административной координации."
 ve_national_curriculum_result_mdf:0 "Национальная учебная программа"
 ve_national_curriculum_result_mdf_desc:0 "Общая учебная программа расширяет образование и квалификацию, хотя ее поддержание требует бюрократии."
 ve_shared_symbols_result_mdf:0 "Общие национальные символы"
 ve_shared_symbols_result_mdf_desc:0 "Совместные гражданские ритуалы и символы укрепляют лояльность и государство власти."
 ve_ethnic_campaign_active_mdf:0 "Кампания по этнической интеграции"
 ve_ethnic_campaign_active_mdf_desc:0 "Государство активно ускоряет ассимиляцию, провоцируя сопротивление культурному стиранию."
 ve_ethnic_campaign_result_mdf:0 "Программа ассимиляции"
 ve_ethnic_campaign_result_mdf_desc:0 "Завершенная интеграционная кампания продолжает ускорять ассимиляцию, порождая при этом напряженность, связанную с культурным стиранием."
 ve_civic_initiative_active_mdf:0 "Инициатива равного гражданства"
 ve_civic_initiative_active_mdf_desc:0 "Школы и государственные учреждения реорганизуются, чтобы расширить возможности и уменьшить открытые предрассудки."
 ve_civic_initiative_result_mdf:0 "Программа равного гражданства"
 ve_civic_initiative_result_mdf_desc:0 "Инициатива улучшает квалификацию, миграционную привлекательность и сопротивление открытым предрассудкам."
 ve_composite_compact_active_mdf:0 "Переговоры по Учредительному договору"
 ve_composite_compact_active_mdf_desc:0 "Переговоры уменьшают количество второсортных жалоб на гражданство, но временно создают нагрузку на налоговое администрирование."
 ve_composite_compact_result_mdf:0 "Учредительный договор"
 ve_composite_compact_result_mdf_desc:0 "Договор укрепляет лояльность и уменьшает недовольство, вызванное второсортным гражданством."
