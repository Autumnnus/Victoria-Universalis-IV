l_russian:
 ve_je_religious_project:0 "Религиозный проект"
 ve_je_religious_project_reason:0 "Правительство руководит долгосрочным религиозным проектом. Его продвижение определяется административным потенциалом, политической легитимностью, религиозными условиями и событиями в целевой области."
 ve_je_religious_project_progress:0 "Прогресс религиозного проекта до завершения"
 ve_je_religious_project_status_confessional:0 "Конфессиональное обращение в области [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] стремится распространить государственную религию посредством организованной кампании.\n\nЗавершение при #Y 125#! прогресса: обращает 5% населения целевой области в государственную религию, возвращает #P 20#! Религиозное усердие и добавляет #P 5#! Религиозный компромисс."
 ve_je_religious_project_status_freedom:0 "Церковное просвещение в области [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] строит урегулирование на основе совести и добровольного объединения.\n\nЗавершение при #Y 100#! прогресса: добавляет лоялистов в области без насильственного обращения, возвращает #P 20#! Религиозное усердие и добавляет #P 7#! Религиозный компромисс."
 ve_je_religious_project_status_secularization:0 "Кампания секуляризации в области [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] сокращает общественный авторитет организованной религии.\n\nЗавершение при #Y 150#! прогресса: обращает 5% населения целевой области в атеизм, возвращает #P 25#! Религиозное усердие и добавляет #P 8#! Религиозный компромисс."
 ve_je_religious_project_complete_tt:0 "Религиозный проект достиг своей цели."
 ve_je_religious_project_fail_tt:0 "Религиозный проект был отменен."

 ve_je_cultural_project:0 "Культурный проект"
 ve_je_cultural_project_reason:0 "Правительство руководит долгосрочным культурным проектом. Административный потенциал, легитимность, образование, национальное единение и местные условия определяют его темпы."
 ve_je_cultural_project_progress:0 "Прогресс культурного проекта до завершения"
 ve_je_cultural_project_status_curriculum:0 "Национальная учебная программа готовится для школ и институтов страны.\n\nЗавершение при #Y 100#! прогресса: #P +20#! Культурный мандат, #P +5#! Национальное единение и 10-летний результат в виде +2% к доступности образования, +5% к квалификациям, -25 к количеству бюрократии."
 ve_je_cultural_project_status_symbols:0 "Программа «Общие символы» формирует общий гражданский лексикон.\n\nЗавершение при #Y 75#! прогресса: #P +20#! Культурный мандат, #P +7#! Национальное единение и 8-летний результат в виде +10% лоялистов от полностью принятых групп населения и +25 к количеству авторитета."
 ve_je_cultural_project_status_ethnic:0 "Кампания этнической интеграции в области [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] подталкивает меньшинство к основной культуре.\n\nЗавершение при #Y 125#! прогресса: обращает 5% групп населения целевой культуры в основную культуру (7% при наличии Национальная VII), #P +25#! Культурный мандат, #P +8#! Национальное единение и 10-летний результат ассимиляции."
 ve_je_cultural_project_status_civic:0 "Инициатива равного гражданства в области [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] распространяет общий гражданский статус через культурные границы.\n\nЗавершение при #Y 100#! прогресса: +15% к терпимости на 10 лет, лоялисты в области, #P +25#! Культурный мандат, #P +10#! Национальное единение и 10-летний результат квалификаций/миграции."
 ve_je_cultural_project_status_composite:0 "Учредительный пакт в области [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] ведет переговоры о постоянном признании в составе составного государства.\n\nЗавершение при #Y 150#! прогресса (требуется 40+ Национальное единение): постоянные +15% к терпимости, добавление культуры в список составных, лоялисты в области, #P +30#! Культурный мандат, #P +12#! Национальное единение."
 ve_je_cultural_project_complete_tt:0 "Культурный проект достиг своей цели."
 ve_je_cultural_project_fail_tt:0 "Культурный проект был отменен."
 ve_je_project_resolving_status:0 "Администрация проекта подает свой итоговый отчет."

 ve_evt_religious_incident_cooldown_mdf:0 "Затишье после инцидента религиозного проекта"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "Администрация проекта справляется с последствиями недавнего инцидента."
 ve_evt_cultural_incident_cooldown_mdf:0 "Затишье после инцидента культурного проекта"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "Администрация проекта справляется с последствиями недавнего инцидента."
 ve_evt_central_clergy_supported_mdf:0 "Поддержка центрального духовенства"
 ve_evt_central_clergy_supported_mdf_desc:0 "Правительство поддержало авторитет центральной религиозной иерархии."
 ve_evt_central_clergy_slighted_mdf:0 "Ущемление центрального духовенства"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Правительство предпочло местную практику предпочтениям центральной религиозной иерархии."
 ve_evt_municipal_patronage_mdf:0 "Сеть муниципального покровительства"
 ve_evt_municipal_patronage_mdf_desc:0 "Местные нотабли продвигают проект посредством договоренностей, которые ослабляют к сбору налогов."

 ve_rel_evt.1.t:0 "Петиция местных нотаблей"
 ve_rel_evt.1.d:0 "Делегация духовенства, муниципальных деятелей и квартальных старейшин из [SCOPE.sState('ve_evt_target_state').GetName] обратилась к правительству с петицией замедлить Конфессиональное обращение. Они предупреждают, что негибкий график превратит покорность в долговечное недовольство."
 ve_rel_evt.1.f:0 "\"Вера, навязанная без совета, может наполнить списки при опустошении скамей.\""
 ve_rel_evt.1.a:0 "Выслушать их петицию."
 ve_rel_evt.1.a.tt:0 "Прогресс религиозного проекта уменьшается на #N 4#!.\nРелигиозное урегулирование увеличивается на #P 3#!."
 ve_rel_evt.1.b:0 "График останется неизменным."
 ve_rel_evt.1.b.tt:0 "Прогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозное урегулирование уменьшается на #N 2#!.\n#N 0.5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становятся радикалами."
 ve_rel_evt.1.c:0 "Поручить дело доверенным посредникам."
 ve_rel_evt.1.c.tt:0 "Потратить #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 3#!.\nРелигиозное урегулирование увеличивается на #P 1#!."

 ve_rel_evt.2.t:0 "Дефицит полевых агентов"
 ve_rel_evt.2.d:0 "Донесения из [SCOPE.sState('ve_evt_target_state').GetName] повествуют об оставшихся без ответа петициях, противоречивых указаниях и уездах, где уже несколько недель не видели проектного агента. Конфессиональное обращение опережает административный аппарат, призванный его осуществлять."
 ve_rel_evt.2.f:0 "\"Указ может пересечь страну за день. Компетентный чиновник — нет.\""
 ve_rel_evt.2.a:0 "Нанять временных полевых агентов."
 ve_rel_evt.2.a.tt:0 "Потратить #N 15#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 4#!."
 ve_rel_evt.2.b:0 "Замедлить программу."
 ve_rel_evt.2.b.tt:0 "Прогресс религиозного проекта уменьшается на #N 6#!.\nРелигиозное урегулирование увеличивается на #P 2#!."
 ve_rel_evt.2.c:0 "Задействовать кадры центрального реестра."
 ve_rel_evt.2.c.tt:0 "Потратить #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 5#!."

 ve_cul_evt.1.t:0 "Бюро переводов"
 ve_cul_evt.1.d:0 "Чиновники в [SCOPE.sState('ve_evt_target_state').GetName] расходятся во мнениях относительно того, как Инициатива равного гражданства должна подходить к языку [SCOPE.sCulture('ve_evt_target_culture').GetName]. Местная администрация добивается двуязычных учреждений; центральные министерства требуют единого административного стандарта."
 ve_cul_evt.1.f:0 "\"Гражданин не должен нуждаться в переводчике, чтобы понять права, дарованные от его собственного имени.\""
 ve_cul_evt.1.a:0 "Допустить местные языки в государственные учреждения."
 ve_cul_evt.1.a.tt:0 "Прогресс культурного проекта уменьшается на #N 4#!.\nНациональная сплочённость увеличивается на #P 3#!."
 ve_cul_evt.1.b:0 "Навязать единый административный стандарт."
 ve_cul_evt.1.b.tt:0 "Прогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплочённость уменьшается на #N 2#!.\n#N 0.5%#! населения культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] в [SCOPE.sState('ve_evt_target_state').GetName] становятся радикалами."
 ve_cul_evt.1.c:0 "Учредить академическую переводческую комиссию."
 ve_cul_evt.1.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 3#!.\nНациональная сплочённость увеличивается на #P 1#!."

 ve_cul_evt.2.t:0 "Дефицит местных учителей"
 ve_cul_evt.2.d:0 "В школах [SCOPE.sState('ve_evt_target_state').GetName] не хватает преподавателей, способных удовлетворить запросы как государственной учебной программы, так и общин [SCOPE.sCulture('ve_evt_target_culture').GetName]. Без подготовленных местных кадров равное гражданство рискует остаться лишь обещанием на официальной бумаге."
 ve_cul_evt.2.f:0 "\"Закон провозглашает равенство за один день; классная комната должна преподавать его целое поколение.\""
 ve_cul_evt.2.a:0 "Финансировать новые педагогические институты."
 ve_cul_evt.2.a.tt:0 "Потратить #N 15#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 4#!."
 ve_cul_evt.2.b:0 "Замедлить осуществление."
 ve_cul_evt.2.b.tt:0 "Прогресс культурного проекта уменьшается на #N 6#!.\nНациональная сплочённость увеличивается на #P 2#!."
 ve_cul_evt.2.c:0 "Задействовать уже имеющиеся институты."
 ve_cul_evt.2.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплочённость увеличивается на #P 1#!."

 ve_rel_evt.3.t:0 "Противоречащие реестры"
 ve_rel_evt.3.d:0 "Приходские списки, муниципальные бухгалтерские книги и отчеты должностных лиц проекта дают несовместимые сведения о религиозной принадлежности в [SCOPE.sState('ve_evt_target_state').GetName]. Администрации предстоит решить, стоит ли терять время на установление истины или продолжать работу с данными, достоверность которых вызывает сомнения."
 ve_rel_evt.3.f:0 "\"В каждом ведомстве есть точная итоговая цифра. Ни одна цифра не совпадает с другой.\""
 ve_rel_evt.3.a:0 "Провести полную ревизию."
 ve_rel_evt.3.a.tt:0 "Вы получите #P 8#! Религиозное усердие.\nПрогресс религиозного проекта уменьшится на #N 6#!."
 ve_rel_evt.3.b:0 "Продолжить работу с разумными оценками."
 ve_rel_evt.3.b.tt:0 "Вы потратите #N 8#! Религиозное усердие.\nПрогресс религиозного проекта увеличится на #P 5#!."
 ve_rel_evt.3.c:0 "Использовать реестры священной администрации."
 ve_rel_evt.3.c.tt:0 "Прогресс религиозного проекта увеличится на #P 3#!."

 ve_rel_evt.4.t:0 "Слухи и контрпроповедь"
 ve_rel_evt.4.d:0 "Памфлеты, уличные проповеди и тревожные слухи представляют конфессиональное обращение в [SCOPE.sState('ve_evt_target_state').GetName] как посягательство на уклад местной жизни. Чиновники предупреждают, что молчание позволит противникам определить характер проекта, тогда как репрессии лишь подтвердят их самые мрачные претензии."
 ve_rel_evt.4.f:0 "\"Слуху не нужны ни канцелярия, ни печать, ни бюджет.\""
 ve_rel_evt.4.a:0 "Провести общественные слушания."
 ve_rel_evt.4.a.tt:0 "Прогресс религиозного проекта уменьшится на #N 3#!.\nРелигиозное урегулирование увеличится на #P 3#!.\n#P 0.5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] станут Лоялист."
 ve_rel_evt.4.b:0 "Наказать агитаторы."
 ve_rel_evt.4.b.tt:0 "Прогресс религиозного проекта увеличится на #P 4#!.\nРелигиозное урегулирование уменьшится на #N 3#!.\n#N 1%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] станут Радикал."
 ve_rel_evt.4.c:0 "Опубликовать записи и результаты."
 ve_rel_evt.4.c.tt:0 "Вы потратите #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличится на #P 2#!.\nРелигиозное урегулирование увеличится на #P 1#!."

 ve_rel_evt.5.t:0 "Язык проповеди"
 ve_rel_evt.5.d:0 "Проектное духовенство в [SCOPE.sState('ve_evt_target_state').GetName] сообщает, что официальные проповеди сохраняют доктринальное единство, но не доходят до многих прихожан. Проповеди на местном языке позволили бы кампании продвинуться дальше, хотя центральная иерархия опасается, что адаптация перерастет в независимость."
 ve_rel_evt.5.f:0 "\"Неуслышанное священное слово сохраняется безупречно — и не принимается никем.\""
 ve_rel_evt.5.a:0 "Проповедовать на местных языках."
 ve_rel_evt.5.a.tt:0 "Прогресс религиозного проекта увеличится на #P 6#!.\nВерующие потеряют #N 1#! Одобрение на #Y 2.5 года#!."
 ve_rel_evt.5.b:0 "Сохранить литургическое единство."
 ve_rel_evt.5.b.tt:0 "Прогресс религиозного проекта уменьшится на #N 3#!.\nРелигиозное урегулирование увеличится на #P 3#!.\nВерующие получат #P 1#! Одобрение на #Y 2.5 года#!."
 ve_rel_evt.5.c:0 "Обучить образованных толкователей."
 ve_rel_evt.5.c.tt:0 "Вы потратите #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличится на #P 4#!.\nРелигиозное урегулирование увеличится на #P 1#!."

 ve_rel_evt.6.t:0 "Соперничающие церковные власти"
 ve_rel_evt.6.d:0 "Назначенцы из центра и устоявшееся местное духовенство в [SCOPE.sState('ve_evt_target_state').GetName] оспаривают друг у друга право руководить конфессиональным обращением. Поддержка одной из сторон может быстро восстановить комендант, но этот спор уже стал проверкой того, кто именно говорит от имени веры."
 ve_rel_evt.6.f:0 "\"Этот спор касается юрисдикции, каковой институты и называют власть.\""
 ve_rel_evt.6.a:0 "Поддержать центральное духовенство."
 ve_rel_evt.6.a.tt:0 "Прогресс религиозного проекта увеличится на #P 5#!.\nВерующие получат #P 1#! Одобрение на #Y 2.5 года#!.\nРелигиозное урегулирование уменьшится на #N 3#!.\n#N 0.5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] станут Радикал."
 ve_rel_evt.6.b:0 "Умиротворить местное духовенство."
 ve_rel_evt.6.b.tt:0 "Прогресс религиозного проекта уменьшится на #N 4#!.\nВерующие потеряют #N 1#! Одобрение на #Y 2.5 года#!.\nРелигиозное урегулирование увеличится на #P 3#!."
 ve_rel_evt.6.c:0 "Письменно зафиксировать их полномочия."
 ve_rel_evt.6.c.tt:0 "Вы потратите #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличится на #P 3#!.\nРелигиозное урегулирование увеличится на #P 1#!."

 ve_cul_evt.3.t:0 "Категории переписи"
 ve_cul_evt.3.d:0 "Чиновники переписи в регионе [SCOPE.sState('ve_evt_target_state').GetName] не могут прийти к согласию о том, как следует учитывать граждан культуры [SCOPE.sCulture('ve_evt_target_culture').GetName]. Местные респонденты используют пересекающиеся идентичности, в то время как центральные бланки требуют один ответ в одной графе."
 ve_cul_evt.3.f:0 "\"Категория упрощает бухгалтерскую книгу задолго до того, как она упрощает страну.\""
 ve_cul_evt.3.a:0 "Разрешить самоидентификацию."
 ve_cul_evt.3.a.tt:0 "Прогресс культурного проекта уменьшается на #N 4#!.\nНациональная сплочённость увеличивается на #P 4#!."
 ve_cul_evt.3.b:0 "Категории будут установлены централизованно."
 ve_cul_evt.3.b.tt:0 "Прогресс культурного проекта увеличивается на #P 6#!.\nНациональная сплочённость уменьшается на #N 4#!.\n#N 0.5%#! населения культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] в регионе [SCOPE.sState('ve_evt_target_state').GetName] становятся Радикал."
 ve_cul_evt.3.c:0 "Использовать современную систему реестров."
 ve_cul_evt.3.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплочённость увеличивается на #P 1#!."

 ve_cul_evt.4.t:0 "Муниципальные нотабли"
 ve_cul_evt.4.d:0 "Муниципальные покровители в регионе [SCOPE.sState('ve_evt_target_state').GetName] предлагают свои конторы, клиентов и влияние для продвижения равного гражданства для населения культуры [SCOPE.sCulture('ve_evt_target_culture').GetName]. Их сотрудничество было бы быстрым, но их цена — сохранение контроля над местными доходами."
 ve_cul_evt.4.f:0 "\"Самая короткая дорога к ратуше лежит через несколько частных гостиных.\""
 ve_cul_evt.4.a:0 "Использовать местные связи."
 ve_cul_evt.4.a.tt:0 "Прогресс культурного проекта увеличивается на #P 5#!.\nРегион [SCOPE.sState('ve_evt_target_state').GetName] теряет #N 5%#! Потенциал налогообложения на #Y 2 года#!."
 ve_cul_evt.4.b:0 "Создать открытые советы."
 ve_cul_evt.4.b.tt:0 "Прогресс культурного проекта уменьшается на #N 3#!.\nНациональная сплочённость увеличивается на #P 3#!."
 ve_cul_evt.4.c:0 "Договариваться об урегулировании на основе правил."
 ve_cul_evt.4.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 3#!.\nНациональная сплочённость увеличивается на #P 1#!."

 ve_cul_evt.5.t:0 "Экзамены на Государственная служба"
 ve_cul_evt.5.d:0 "Открытие экзаменов на Государственная служба для кандидатов культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] обнажило разрыв между юридическим равенством и практической подготовкой. Немедленный доступ был бы символически силен, но годы неравного образования нельзя стереть через Указ."
 ve_cul_evt.5.f:0 "\"Один и тот же экзамен не является равной возможностью, когда только один кандидат был обучен его языку.\""
 ve_cul_evt.5.a:0 "Финансировать подготовительные курсы."
 ve_cul_evt.5.a.tt:0 "Потратить #N 15#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплочённость увеличивается на #P 2#!."
 ve_cul_evt.5.b:0 "Равный доступ начинается немедленно."
 ve_cul_evt.5.b.tt:0 "Прогресс культурного проекта увеличивается на #P 7#!.\nНациональная сплочённость уменьшается на #N 4#!.\n#N 0.5%#! населения в регионе [SCOPE.sState('ve_evt_target_state').GetName] становятся Радикал."
 ve_cul_evt.5.c:0 "Мобилизовать сети школ и Социальная."
 ve_cul_evt.5.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплочённость увеличивается на #P 2#!."
 ve_cul_evt.5.e:0 "Сначала реформировать экзаменационную систему."
 ve_cul_evt.5.e.tt:0 "Прогресс культурного проекта уменьшается на #N 4#!.\nНациональная сплочённость увеличивается на #P 3#!."

 ve_cul_evt.6.t:0 "Отпор большинства"
 ve_cul_evt.6.d:0 "Противники Инициатива равного гражданства заявляют, что распространение общих прав на население культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] ущемляет положение всех остальных. Демонстрации в регионе [SCOPE.sState('ve_evt_target_state').GetName] превращают административную реформу в национальное политическое испытание."
 ve_cul_evt.6.f:0 "\"Разделенное право преподносится как украденная привилегия.\""
 ve_cul_evt.6.a:0 "Открыто защищать инициативу."
 ve_cul_evt.6.a.tt:0 "Прогресс культурного проекта увеличивается на #P 4#!.\nНациональная сплочённость уменьшается на #N 4#!.\n#N 1%#! населения в регионе [SCOPE.sState('ve_evt_target_state').GetName] становятся Радикал."
 ve_cul_evt.6.b:0 "Замедлить темпы реализации."
 ve_cul_evt.6.b.tt:0 "Прогресс культурного проекта уменьшается на #N 5#!.\nНациональная сплочённость увеличивается на #P 3#!."
 ve_cul_evt.6.c:0 "Мобилизовать коалицию реформ."
 ve_cul_evt.6.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 3#!.\nНациональная сплочённость увеличивается на #P 2#!.\n#P 0.5%#! населения культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] в регионе [SCOPE.sState('ve_evt_target_state').GetName] становятся Лоялист."

 ve_rel_evt.7.t:0 "Миссия на грани срыва"
 ve_rel_evt.7.d:0 "Конфессиональное обращение в регионе [SCOPE.sState('ve_evt_target_state').GetName] близко к административному и политическому краху. Ведомства перестали отвечать на запросы друг друга, общественное сопротивление ужесточается, а духовенство на местах предупреждает, что миссия не может продолжаться на прежних условиях."
 ve_rel_evt.7.f:0 "\"В отчетах это по-прежнему называют временной трудностью. Улицы выбрали для этого более суровое название.\""
 ve_rel_evt.7.a:0 "Принять убытки и отступить."
 ve_rel_evt.7.a.tt:0 "Отменить Религиозный проект без возврата средств Религиозное усердие.\nРелигиозный компромисс уменьшается на #N 5#!.\nВ течение #Y 2 лет#!: #N -50#! Бюрократия, #N -50#! Авторитет и #N -3%#! Успех принятия закона."
 ve_rel_evt.7.b:0 "Направить чрезвычайные ресурсы."
 ve_rel_evt.7.b.tt:0 "Потратить #N 25#! Религиозное усердие.\nПрогресс Религиозный проект уменьшается на #N 5#!.\n#N 1%#! населения в регионе [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами.\nПроект продолжается."
 ve_rel_evt.7.c:0 "Продолжить силами минимального штата."
 ve_rel_evt.7.c.tt:0 "Прогресс Религиозный проект уменьшается на #N 10#!.\nРелигиозный компромисс уменьшается на #N 2#!.\nПроект продолжается."
 ve_rel_evt.7.e:0 "Пересмотреть метод."
 ve_rel_evt.7.e.tt:0 "Потратить #N 15#! Религиозное усердие.\nПрогресс Религиозный проект уменьшается на #N 3#!.\nРелигиозный компромисс увеличивается на #P 2#!.\n#N 0.5%#! населения в регионе [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами.\nПроект продолжается."

 ve_cul_evt.7.t:0 "Инициатива теряет легитимность"
 ve_cul_evt.7.d:0 "Инициатива равного гражданства в регионе [SCOPE.sState('ve_evt_target_state').GetName] теряет поддержку как со стороны устоявшихся институтов, так и со стороны общин культуры [SCOPE.sCulture('ve_evt_target_culture').GetName], которым она была призвана служить. Радикальные движения теперь представляют любой компромисс как доказательство неспособности правительства обеспечить равенство."
 ve_cul_evt.7.f:0 "\"Реформа может пережить противодействие. Она не может пережить потерю доверия.\""
 ve_cul_evt.7.a:0 "Прекратить инициативу."
 ve_cul_evt.7.a.tt:0 "Отменить Культурный проект без возврата средств Культурный мандат.\nНациональное единение уменьшается на #N 5#!.\nВ течение #Y 2 лет#!: #N -50#! Бюрократия, #N -25#! Авторитет и #N -3%#! Успех принятия закона."
 ve_cul_evt.7.b:0 "Выдать чрезвычайные местные субсидии."
 ve_cul_evt.7.b.tt:0 "Потратить #N 25#! Культурный мандат.\nПрогресс Культурный проект уменьшается на #N 5#!.\n#N 1%#! населения культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] в регионе [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами.\nПроект продолжается."
 ve_cul_evt.7.c:0 "Продолжить с минимальной программой."
 ve_cul_evt.7.c.tt:0 "Прогресс Культурный проект уменьшается на #N 10#!.\nНациональное единение уменьшается на #N 2#!.\nПроект продолжается."
 ve_cul_evt.7.e:0 "Воссоздать коалицию."
 ve_cul_evt.7.e.tt:0 "Потратить #N 15#! Культурный мандат.\nПрогресс Культурный проект уменьшается на #N 3#!.\nНациональное единение увеличивается на #P 2#!.\n#N 0.5%#! населения культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] в регионе [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами.\nПроект продолжается."

 ve_rel_evt.8.t:0 "Неожиданное местное соглашение"
 ve_rel_evt.8.d:0 "Духовенство, муниципальные чиновники и старейшины общин в регионе [SCOPE.sState('ve_evt_target_state').GetName] достигли соглашения, которого не смогла бы добиться ни одна директива из центра. Сопротивление на местах идет на спад, приходы координируют миссию самостоятельно, а Конфессиональное обращение приобрело неожиданную мотивацию."
 ve_rel_evt.8.f:0 "\"То, что начиналось как приказ из столицы, стало договором, заключенным на городской площади.\""
 ve_rel_evt.8.a:0 "Использовать эту мотивацию по максимуму."
 ve_rel_evt.8.a.tt:0 "Религиозный компромисс увеличивается на #P 1#!.\nПрогресс Религиозный проект увеличивается на #P 25#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."
 ve_rel_evt.8.b:0 "Прочность превыше скорости."
 ve_rel_evt.8.b.tt:0 "Религиозный компромисс увеличивается на #P 4#!.\nПрогресс Религиозный проект увеличивается на #P 10#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."

 ve_cul_evt.8.t:0 "Местная гражданская коалиция"
 ve_cul_evt.8.d:0 "Учителя, муниципальные чиновники, торговые объединения и представители общины культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] в регионе [SCOPE.sState('ve_evt_target_state').GetName] сформировали общий комитет. Улаживая споры до того, как они дойдут до столицы, эта коалиция придала Инициатива равного гражданства такую мотивацию, которую администрация была не в силах создать искусственно."
 ve_cul_evt.8.f:0 "\"Гражданство стало реальностью, когда институты, редко садившиеся за один стол, начали разделять ответственность.\""
 ve_cul_evt.8.a:0 "Воспользоваться мотивацией коалиции."
 ve_cul_evt.8.a.tt:0 "Национальное единение увеличивается на #P 1#!.\nПрогресс Культурный проект увеличивается на #P 25#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."
 ve_cul_evt.8.b:0 "Закрепить институты на постоянной основе."
 ve_cul_evt.8.b.tt:0 "Национальное единение увеличивается на #P 4#!.\nПрогресс Культурный проект увеличивается на #P 10#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."

 ve_rel_evt.40.t:0 "Расходящиеся отчеты"
 ve_rel_evt.40.d:0 "Провинциальные реестры в [SCOPE.sState('ve_evt_target_state').GetName] используют несовместимые категории для общин, гражданских ассоциаций и общественных институтов. Отчеты, поступающие в столицу, противоречат друг другу, из-за чего проект не может отличить соблюдение предписаний от сопротивления."
 ve_rel_evt.40.f:0 "\"Политика, проводимая на основе трех разных учетных книг, быстро порождает три разные реальности.\""
 ve_rel_evt.40.a:0 "Направить центральную ревизию."
 ve_rel_evt.40.a.tt:0 "Потратить #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозное урегулирование увеличивается на #P 1#!."
 ve_rel_evt.40.b:0 "Согласовать записи на местах."
 ve_rel_evt.40.b.tt:0 "Прогресс религиозного проекта уменьшается на #N 3#!.\nРелигиозное урегулирование увеличивается на #P 2#!."
 ve_rel_evt.40.c:0 "Применить стандартную процедуру регистрации."
 ve_rel_evt.40.c.tt:0 "Потратить #N 5#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 4#!.\nРелигиозное урегулирование увеличивается на #P 1#!."

 ve_rel_evt.41.t:0 "Нехватка провинциальных кадров"
 ve_rel_evt.41.d:0 "Канцелярии, руководящие проектом в [SCOPE.sState('ve_evt_target_state').GetName], не могут найти достаточно подготовленных к служащих, учителей и инспекторов. Директивы накапливаются быстрее, чем местные чиновники успевают их истолковывать, а поспешные назначения грозят усугубить каждый спор."
 ve_rel_evt.41.f:0 "\"Указ прибыл за день. На подготовку людей, способных его исполнить, может уйти целое поколение.\""
 ve_rel_evt.41.a:0 "Финансировать новый штат чиновников."
 ve_rel_evt.41.a.tt:0 "Потратить #N 15#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 6#!."
 ve_rel_evt.41.b:0 "Замедлить осуществление."
 ve_rel_evt.41.b.tt:0 "Прогресс религиозного проекта уменьшается на #N 6#!.\nРелигиозное урегулирование увеличивается на #P 2#!."
 ve_rel_evt.41.c:0 "Использовать существующую сеть Образование."
 ve_rel_evt.41.c.tt:0 "Потратить #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозное урегулирование увеличивается на #P 1#!."

 ve_rel_evt.42.t:0 "Слухи по всему округу"
 ve_rel_evt.42.d:0 "Слухи в [SCOPE.sState('ve_evt_target_state').GetName] утверждают, что проект скрывает меры гораздо более суровые, чем те, о которых объявило Правительство. Религиозные организаторы и местные Агитаторы повторяют противоречащие друг другу истории, в то время как официальное молчание дает каждой новой версии простор для распространения."
 ve_rel_evt.42.f:0 "\"Слуху не нужны канцелярия, бюджет и подпись.\""
 ve_rel_evt.42.a:0 "Опубликовать отчеты."
 ve_rel_evt.42.a.tt:0 "Прогресс религиозного проекта уменьшается на #N 3#!.\nРелигиозное урегулирование увеличивается на #P 4#!."
 ve_rel_evt.42.b:0 "Отвергнуть агитацию."
 ve_rel_evt.42.b.tt:0 "Прогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозное урегулирование уменьшается на #N 3#!.\n#N 1%#! Население в [SCOPE.sState('ve_evt_target_state').GetName] становится Радикал."
 ve_rel_evt.42.c:0 "Привлечь местных посредников."
 ve_rel_evt.42.c.tt:0 "Потратить #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 4#!.\nРелигиозное урегулирование увеличивается на #P 2#!.\n#P 0.5%#! Население в [SCOPE.sState('ve_evt_target_state').GetName] становится Лоялист."

 ve_rel_evt.43.t:0 "Администрация на грани краха"
 ve_rel_evt.43.d:0 "Проект в [SCOPE.sState('ve_evt_target_state').GetName] приближается к административному коллапсу. Провинциальные ведомства перегружены, Уверенность общественности подорвана, а Организованное Возражения теперь рассматривает каждую новую директиву как свидетельство того, что Правительство потеряло контроль."
 ve_rel_evt.43.f:0 "\"Когда бумаги перестают двигаться, кризис перемещается на улицы.\""
 ve_rel_evt.43.a:0 "Свернуть программу."
 ve_rel_evt.43.a.tt:0 "Отменить религиозный проект без возмещения Религиозное усердие.\nРелигиозное урегулирование уменьшается на #N 5#!.\nВ течение #Y 2 лет#!: #N -50#! Бюрократия, #N -50#! Авторитет и #N -3%#! Успех принятия Закон."
 ve_rel_evt.43.b:0 "Перебросить экстренные ресурсы."
 ve_rel_evt.43.b.tt:0 "Потратить #N 25#! Религиозное усердие.\nПрогресс религиозного проекта уменьшается на #N 5#!.\n#N 1%#! Население в [SCOPE.sState('ve_evt_target_state').GetName] становится Радикал.\nПроект продолжается."
 ve_rel_evt.43.c:0 "Продолжить работу с минимальным штатом."
 ve_rel_evt.43.c.tt:0 "Прогресс религиозного проекта уменьшается на #N 10#!.\nРелигиозное урегулирование уменьшается на #N 2#!.\nПроект продолжается."
 ve_rel_evt.43.e:0 "Восстановить партнерство на местах."
 ve_rel_evt.43.e.tt:0 "Потратить #N 15#! Религиозное усердие.\nПрогресс религиозного проекта уменьшается на #N 3#!.\nРелигиозное урегулирование увеличивается на #P 2#!.\n#N 0.5%#! Население в [SCOPE.sState('ve_evt_target_state').GetName] становится Радикал.\nПроект продолжается."

 ve_rel_evt.100.t:0 "Места в межконфессиональном совете"
 ve_rel_evt.100.d:0 "Делегаты в [SCOPE.sState('ve_evt_target_state').GetName] сходятся во мнении, что межконфессиональный совет необходим, однако не могут решить, кто именно заслуживает места в нем. Пропорциональная избирательная система успокоила бы малые общины, тогда как фиксированный компромисс, разработанный в столице, позволил бы немедленно приступить к работе."
 ve_rel_evt.100.f:0 "\"Каждый поддерживает общий стол, пока не пересчитают стулья.\""
 ve_rel_evt.100.a:0 "Распределить представительство по численности населения."
 ve_rel_evt.100.a.tt:0 "Прогресс религиозного проекта уменьшается на #N 3#!.\nРелигиозный компромисс увеличивается на #P 4#!."
 ve_rel_evt.100.b:0 "Навязать фиксированный центральный компромисс."
 ve_rel_evt.100.b.tt:0 "Прогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозный компромисс уменьшается на #N 2#!.\n#N 0.5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становятся Радикал."
 ve_rel_evt.100.c:0 "Наделить полномочиями межконфессиональные советы."
 ve_rel_evt.100.c.tt:0 "Потратить #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозный компромисс увеличивается на #P 2#!."

 ve_rel_evt.101.t:0 "Общая школьная программа"
 ve_rel_evt.101.d:0 "Школам в [SCOPE.sState('ve_evt_target_state').GetName] необходимы общие уроки гражданственности, однако они не должны превращать Церковное просвещение в кампанию против местных верований. Учителя запрашивают четкие материалы и совместную подготовку, в то время как лидеры общин настаивают на том, чтобы местное обучение сохраняло пространство для их традиций."
 ve_rel_evt.101.f:0 "\"Общий урок имеет успех лишь тогда, когда каждая семья признает классную комнату своей.\""
 ve_rel_evt.101.a:0 "Финансировать общий педагогический состав."
 ve_rel_evt.101.a.tt:0 "Потратить #N 15#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 6#!.\nРелигиозный компромисс увеличивается на #P 1#!."
 ve_rel_evt.101.b:0 "Оставить простор для местных учебных программ."
 ve_rel_evt.101.b.tt:0 "Прогресс религиозного проекта уменьшается на #N 4#!.\nРелигиозный компромисс увеличивается на #P 3#!."
 ve_rel_evt.101.c:0 "Привлечь реформаторскую коалицию к работе в школах."
 ve_rel_evt.101.c.tt:0 "Потратить #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозный компромисс увеличивается на #P 2#!.\n#P 0.5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становятся Лоялист."

 ve_rel_evt.102.t:0 "Хартия взаимных гарантий"
 ve_rel_evt.102.d:0 "Религиозные общины, муниципальные чиновники и реформаторские ассоциации в [SCOPE.sState('ve_evt_target_state').GetName] выработали проект общей хартии. Каждый из подписавших ее принимает на себя одинаковые гражданские обязательства в обмен на публичные гарантии того, что ни одна община не будет исключена из институты."
 ve_rel_evt.102.f:0 "\"Доверие стало возможным, когда каждое обещание было записано как право другой стороны.\""
 ve_rel_evt.102.a:0 "Воспользоваться Мотивация пакта."
 ve_rel_evt.102.a.tt:0 "Религиозный компромисс увеличивается на #P 2#!.\nПрогресс религиозного проекта увеличивается на #P 20#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."
 ve_rel_evt.102.b:0 "Закрепить гарантии на постоянной основе."
 ve_rel_evt.102.b.tt:0 "Религиозный компромисс увеличивается на #P 4#!.\n#P 0.5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становятся Лоялист.\nПрогресс религиозного проекта увеличивается на #P 10#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."

 ve_rel_evt.150.t:0 "Учителя или инспекторы?"
 ve_rel_evt.150.d:0 "Кампания секуляризации в [SCOPE.sState('ve_evt_target_state').GetName] выявила дефицит Грамотные кадров. Администрация может расширить преподавательский корпус, который формирует долгосрочный Потенциал гражданственности, либо положиться на инспекторов, способных обеспечить соблюдение новых правил силами уже имеющегося персонала."
 ve_rel_evt.150.f:0 "\"Инспектор может закрыть школу за полдня. Учителю могут потребоваться годы, чтобы восполнить то, чему учили там.\""
 ve_rel_evt.150.a:0 "Расширить преподавательский корпус."
 ve_rel_evt.150.a.tt:0 "Потратить #N 15#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 6#!."
 ve_rel_evt.150.b:0 "Замедлить программу в соответствии с наличным штатом."
 ve_rel_evt.150.b.tt:0 "Прогресс религиозного проекта уменьшается на #N 5#!.\nРелигиозный компромисс увеличивается на #P 2#!."
 ve_rel_evt.150.c:0 "Запустить сеть общественное Образование."
 ve_rel_evt.150.c.tt:0 "Потратить #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозный компромисс увеличивается на #P 1#!."

 ve_rel_evt.151.t:0 "Конфискованное имущество"
 ve_rel_evt.151.d:0 "Бывшее религиозное имущество в регионе [SCOPE.sState('ve_evt_target_state').GetName] готово к переоборудованию под школы, клиники и гражданские учреждения. Немедленная передача дала бы кампании ценную инфраструктуру, однако отсутствие компенсации становится поводом для сплочения Верующие."
 ve_rel_evt.151.f:0 "\"Ключи сменили владельцев в одно утро. Спор о праве собственности переживет замки.\""
 ve_rel_evt.151.a:0 "Выплатить компенсацию поэтапно."
 ve_rel_evt.151.a.tt:0 "Потратить #N 15#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 3#!.\nРелигиозный компромисс увеличивается на #P 3#!."
 ve_rel_evt.151.b:0 "Передать имущество в общественное пользование немедленно."
 ve_rel_evt.151.b.tt:0 "Прогресс религиозного проекта увеличивается на #P 7#!.\nРелигиозный компромисс уменьшается на #N 4#!.\n#N 1%#! населения в регионе [SCOPE.sState('ve_evt_target_state').GetName] становятся Радикал.\nВерующие теряют #N 1#! Одобрение на #Y 2.5 года#!."
 ve_rel_evt.151.c:0 "Передать его светским социальная институтам."
 ve_rel_evt.151.c.tt:0 "Потратить #N 10#! Религиозное усердие.\nПрогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозный компромисс увеличивается на #P 2#!.\n#P 0.5%#! населения в регионе [SCOPE.sState('ve_evt_target_state').GetName] становятся Лоялист."

 ve_rel_evt.152.t:0 "Гражданские ассоциации пускают корни"
 ve_rel_evt.152.d:0 "Учительские кружки, общества взаимопомощи и муниципальные ассоциации в регионе [SCOPE.sState('ve_evt_target_state').GetName] начали предоставлять услуги, ранее Организованное через религиозные институты. Их сотрудничество придало Кампания секуляризации местную гражданскую основу, а не просто административное присутствие."
 ve_rel_evt.152.f:0 "\"Новый порядок устоял, когда граждане начали поддерживать его, не дожидаясь инспектора.\""
 ve_rel_evt.152.a:0 "Использовать местную мотивация."
 ve_rel_evt.152.a.tt:0 "Религиозный компромисс увеличивается на #P 2#!.\nПрогресс религиозного проекта увеличивается на #P 20#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."
 ve_rel_evt.152.b:0 "Превратить ассоциации в постоянные институты."
 ve_rel_evt.152.b.tt:0 "Религиозный компромисс увеличивается на #P 4#!.\nПрогресс религиозного проекта увеличивается на #P 10#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."

 ve_cul_evt.40.t:0 "Местные школьные советы"
 ve_cul_evt.40.d:0 "Школьные советы в регионе [SCOPE.sState('ve_evt_target_state').GetName] расходятся во мнениях относительно роли языка [SCOPE.sCulture('ve_evt_target_culture').GetName] в народном образовании. Обучение на местном языке сохранит доверие, тогда как единый административный язык облегчит руководство национальным проектом."
 ve_cul_evt.40.f:0 "\"Язык, выбранный для первого урока, часто решает, кто верит, что школа принадлежит им.\""
 ve_cul_evt.40.a:0 "Защитить местный язык."
 ve_cul_evt.40.a.tt:0 "Прогресс культурного проекта уменьшается на #N 4#!.\nНациональная Сплочённость увеличивается на #P 3#!."
 ve_cul_evt.40.b:0 "Навязать единый административный язык."
 ve_cul_evt.40.b.tt:0 "Прогресс культурного проекта увеличивается на #P 5#!.\nНациональная Сплочённость уменьшается на #N 2#!.\n#N 0.5%#! населения культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] в регионе [SCOPE.sState('ve_evt_target_state').GetName] становятся Радикал."
 ve_cul_evt.40.c:0 "Расширить сеть учителей."
 ve_cul_evt.40.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 4#!.\nНациональная Сплочённость увеличивается на #P 2#!."

 ve_cul_evt.41.t:0 "Статистические границы"
 ve_cul_evt.41.d:0 "Чиновники, проводящие обследование региона [SCOPE.sState('ve_evt_target_state').GetName], не могут прийти к согласию о том, где начинается и заканчивается община [SCOPE.sCulture('ve_evt_target_culture').GetName]. Местные особенности пересекаются в языке, уезде и обычаях, но национальный проект требует категорий, которые можно подсчитать и упорядочить."
 ve_cul_evt.41.f:0 "\"Граница, проведенная для переписи, вскоре обретает чиновников, бюджеты и защитников.\""
 ve_cul_evt.41.a:0 "Оставить простор для самоопределения."
 ve_cul_evt.41.a.tt:0 "Прогресс культурного проекта уменьшается на #N 3#!.\nНациональная Сплочённость увеличивается на #P 3#!."
 ve_cul_evt.41.b:0 "Позволить центру определить границы."
 ve_cul_evt.41.b.tt:0 "Прогресс культурного проекта увеличивается на #P 6#!.\nНациональная Сплочённость уменьшается на #N 3#!.\n#N 0.5%#! населения культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] в регионе [SCOPE.sState('ve_evt_target_state').GetName] становятся Радикал."
 ve_cul_evt.41.c:0 "Использовать стандартную систему реестров."
 ve_cul_evt.41.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная Сплочённость увеличивается на #P 1#!."

 ve_cul_evt.42.t:0 "Национальный проект на грани срыва"
 ve_cul_evt.42.d:0 "Национальный проект в области [SCOPE.sState('ve_evt_target_state').GetName] близок к краху. Радикальные движения заявляют, что правительство либо предало общину [SCOPE.sCulture('ve_evt_target_culture').GetName], либо капитулировало перед ней, тогда как у местных ведомств больше нет уверенность в возможности добиться нового компромисса."
 ve_cul_evt.42.f:0 "\"Урегулирование, отвергаемое и как принуждение, и как капитуляция, вскоре может вовсе перестать быть урегулированием.\""
 ve_cul_evt.42.a:0 "Завершить проект."
 ve_cul_evt.42.a.tt:0 "Отменить Культурный проект без возврата средств в Культурный мандат.\nСплочённость нации уменьшается на #N 5#!.\nВ течение #Y 2 лет#!: Бюрократия: #N -50#!, Авторитет: #N -25#! и Успех принятия закона: #N -3%#!."
 ve_cul_evt.42.b:0 "Направить чрезвычайные местные ресурсы."
 ve_cul_evt.42.b.tt:0 "Потратить #N 25#! Культурный мандат.\nПрогресс Культурного проекта уменьшается на #N 5#!.\n#N 1%#! населения [SCOPE.sCulture('ve_evt_target_culture').GetName] в области [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами.\nПроект продолжается."
 ve_cul_evt.42.c:0 "Продолжить по минимальной программе."
 ve_cul_evt.42.c.tt:0 "Прогресс Культурного проекта уменьшается на #N 10#!.\nСплочённость нации уменьшается на #N 2#!.\nПроект продолжается."
 ve_cul_evt.42.e:0 "Воссоздать основы для Переговоры."
 ve_cul_evt.42.e.tt:0 "Потратить #N 15#! Культурный мандат.\nПрогресс Культурного проекта уменьшается на #N 3#!.\nСплочённость нации увеличивается на #P 2#!.\n#N 0.5%#! населения [SCOPE.sCulture('ve_evt_target_culture').GetName] в области [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами.\nПроект продолжается."

 ve_cul_evt.50.t:0 "Директива об именах и языке"
 ve_cul_evt.50.d:0 "Чиновники в области [SCOPE.sState('ve_evt_target_state').GetName] предлагают унифицировать фамилии и официальные записи на национальном языке. Эта директива облегчит центральной администрации классификацию населения [SCOPE.sCulture('ve_evt_target_culture').GetName], однако семьи опасаются, что частное самосознание становится объектом правительство."
 ve_cul_evt.50.f:0 "\"Имя, записанное в реестре иначе, всё равно остаётся именем, которым семья помнит себя.\""
 ve_cul_evt.50.a:0 "Финансировать кампанию постепенной регистрации."
 ve_cul_evt.50.a.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс Культурного проекта увеличивается на #P 4#!.\nСплочённость нации увеличивается на #P 1#!.\n#N 0.5%#! населения [SCOPE.sCulture('ve_evt_target_culture').GetName] в области [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами."
 ve_cul_evt.50.b:0 "Внедрить единый национальный стандарт."
 ve_cul_evt.50.b.tt:0 "Прогресс Культурного проекта увеличивается на #P 7#!.\nСплочённость нации уменьшается на #N 4#!.\n#N 1%#! населения [SCOPE.sCulture('ve_evt_target_culture').GetName] в области [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами."
 ve_cul_evt.50.c:0 "Отозвать директиву для доработки."
 ve_cul_evt.50.c.tt:0 "Прогресс Культурного проекта уменьшается на #N 5#!.\nСплочённость нации увеличивается на #P 3#!."

 ve_cul_evt.51.t:0 "Реестры Воинский призыв"
 ve_cul_evt.51.d:0 "Армия чиновники в области [SCOPE.sState('ve_evt_target_state').GetName] требуют создать единый реестр для Обязательства по службе, фамилий и Командование. Распространение его на население [SCOPE.sCulture('ve_evt_target_culture').GetName] укрепило бы курс на Культурные Интеграция, однако сопротивление нарастает среди общин, видящих в Армия еще одно орудие культурного стирания."
 ve_cul_evt.51.f:0 "\"Государство впервые узнает имена деревни, когда желает собрать Налоги или созвать своих сыновей.\""
 ve_cul_evt.51.a:0 "Применить национальные реестры."
 ve_cul_evt.51.a.tt:0 "Прогресс Культурного проекта увеличивается на #P 5#!.\nСплочённость нации уменьшается на #N 2#!.\n#N 0.5%#! населения [SCOPE.sCulture('ve_evt_target_culture').GetName] в области [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами."
 ve_cul_evt.51.b:0 "Сохранить местные практики регистрации."
 ve_cul_evt.51.b.tt:0 "Прогресс Культурного проекта уменьшается на #N 3#!.\nСплочённость нации увеличивается на #P 3#!."
 ve_cul_evt.51.c:0 "Интегрировать реестры посредством прохождения службы в Армия."
 ve_cul_evt.51.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс Культурного проекта увеличивается на #P 6#!.\nСплочённость нации увеличивается на #P 1#!.\n#N 0.5%#! населения [SCOPE.sCulture('ve_evt_target_culture').GetName] в области [SCOPE.sState('ve_evt_target_state').GetName] становится радикалами."

 ve_cul_evt.100.t:0 "Учредительная делегация"
 ve_cul_evt.100.d:0 "Делегация от общины [SCOPE.sCulture('ve_evt_target_culture').GetName] в регионе [SCOPE.sState('ve_evt_target_state').GetName] прибыла с требованиями о представительстве в институтах Учредительного пакта. Переговоры замедлили бы проект, но укрепили бы его легитимность; урегулирование, навязанное из столицы, могло бы продвигаться быстрее ценой утраты доверия."
 ve_cul_evt.100.f:0 "\"Пакт становится общим лишь тогда, когда каждый участник может указать на пункт, в написании которого он участвовал.\""
 ve_cul_evt.100.a:0 "Договариваться об их месте в пакте."
 ve_cul_evt.100.a.tt:0 "Прогресс культурного проекта уменьшается на #N 4#!.\nНациональная сплочённость увеличивается на #P 4#!."
 ve_cul_evt.100.b:0 "Навязать централизованное урегулирование."
 ve_cul_evt.100.b.tt:0 "Прогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплочённость уменьшается на #N 2#!.\n#N 0.5%#! населения культуры [SCOPE.sCulture('ve_evt_target_culture').GetName] в регионе [SCOPE.sState('ve_evt_target_state').GetName] становятся Радикалами."
 ve_cul_evt.100.c:0 "Привлечь парламентскую коалицию к переговорам."
 ve_cul_evt.100.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 4#!.\nНациональная сплочённость увеличивается на #P 2#!."

 ve_cul_evt.101.t:0 "Двойное управление"
 ve_cul_evt.101.d:0 "Учредительный пакт в регионе [SCOPE.sState('ve_evt_target_state').GetName] теперь зависит от двух пересекающихся администраций. Центральные чиновники и представители общины [SCOPE.sCulture('ve_evt_target_culture').GetName] дублируют учетные ведомости, оспаривают назначения и издают противоречащие друг другу распоряжения, в то время как бюрократия страны близка к истощению."
 ve_cul_evt.101.f:0 "\"Двум ведомствам проще разделять Авторитет, чем делить один картотечный шкаф.\""
 ve_cul_evt.101.a:0 "Финансировать совместный административный штат."
 ve_cul_evt.101.a.tt:0 "Потратить #N 15#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 6#!."
 ve_cul_evt.101.b:0 "Замедлить исполнение пакта до достижения соглашения между ведомствами."
 ve_cul_evt.101.b.tt:0 "Прогресс культурного проекта уменьшается на #N 6#!.\nНациональная сплочённость увеличивается на #P 2#!."
 ve_cul_evt.101.c:0 "Объединить ведомства под началом Государственной службы."
 ve_cul_evt.101.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплочённость увеличивается на #P 2#!."

 ve_cul_evt.150.t:0 "Внедрение в провинциях"
 ve_cul_evt.150.d:0 "Провинциальные администрации сообщают, что общенациональный культурный проект продвигается с кардинально разной скоростью. Одни ведомства требуют финансирования комиссий по внедрению, в то время как другие предупреждают, что навязывание единого графика каждому региону истощит дефицитные кадры и подорвет общественную уверенность."
 ve_cul_evt.150.f:0 "\"Указ пишется один раз, но воплощать его приходится в каждом ведомстве страны.\""
 ve_cul_evt.150.a:0 "Финансировать комиссии по внедрению."
 ve_cul_evt.150.a.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!."
 ve_cul_evt.150.b:0 "Использовать постепенный график."
 ve_cul_evt.150.b.tt:0 "Прогресс культурного проекта уменьшается на #N 4#!.\nНациональная сплочённость увеличивается на #P 2#!."
 ve_cul_evt.150.c:0 "Стандартизировать существующую администрацию."
 ve_cul_evt.150.c.tt:0 "Потратить #N 5#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 3#!.\nНациональная сплочённость увеличивается на #P 2#!."

 ve_cul_evt.151.t:0 "Язык обучения"
 ve_cul_evt.151.d:0 "Национальная учебная программа требует единого языка преподавания, однако школы по всей стране обслуживают общины с совершенно разными языковыми традициями. Многоязычные материалы сохранили бы уверенность, но задержали бы распространение, тогда как единая учебная программа могла бы быстро дойти до классов ценой превращения Образования в культурное состязание."
 ve_cul_evt.151.f:0 "\"Урок, преподаваемый на языке, которому ученик не доверяет, может запомниться чем угодно, кроме своего предмета.\""
 ve_cul_evt.151.a:0 "Финансировать многоязычные материалы."
 ve_cul_evt.151.a.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 3#!.\nНациональная сплочённость увеличивается на #P 3#!."
 ve_cul_evt.151.b:0 "Применить единую национальную учебную программу."
 ve_cul_evt.151.b.tt:0 "Прогресс культурного проекта увеличивается на #P 6#!.\nНациональная сплочённость уменьшается на #N 3#!."
 ve_cul_evt.151.c:0 "Объединить сети преподавания и Социального обеспечения."
 ve_cul_evt.151.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплочённость увеличивается на #P 2#!."

 ve_cul_evt.160.t:0 "Кто представляет Нация?"
 ve_cul_evt.160.d:0 "Проект «Общие символы» вновь поднял вопрос о том, чья история, чья форма, Монументы и церемонии могут олицетворять всю страну. Чередование традиций расширило бы Признание, но замедлило бы достижение согласия; выбор же единого официального нарратива обеспечил бы ясность, оставив при этом многих граждан за его бортом."
 ve_cul_evt.160.f:0 "\"Символ становится национальным лишь тогда, когда граждане видят в нем самих себя без каких-либо объяснений.\""
 ve_cul_evt.160.a:0 "Чередовать символы в общественном употреблении."
 ve_cul_evt.160.a.tt:0 "Прогресс Культурного проекта уменьшается на #N 3#!.\nКультурная Сплочённость увеличивается на #P 4#!."
 ve_cul_evt.160.b:0 "Утвердить единый официальный нарратив."
 ve_cul_evt.160.b.tt:0 "Прогресс Культурного проекта увеличивается на #P 6#!.\nКультурная Сплочённость уменьшается на #N 3#!."
 ve_cul_evt.160.c:0 "Разработать общую общественную церемонию."
 ve_cul_evt.160.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс Культурного проекта увеличивается на #P 4#!.\nКультурная Сплочённость увеличивается на #P 2#!."
