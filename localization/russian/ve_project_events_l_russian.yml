l_russian:
 ve_je_religious_project:0 "Религиозный проект"
 ve_je_religious_project_reason:0 "Правительство руководит долгосрочным религиозным проектом. Его прогресс определяется административными возможностями, политической легитимностью, религиозными условиями и событиями в целевом государстве."
 ve_je_religious_project_progress:0 "Религиозный проект приближается к завершению"
 ve_je_religious_project_status_confessional:0 "Конфессиональное обращение в [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] стремится расширить веру государства посредством организованной кампании.\n\nЗавершение в #Y 125#! прогресс: обращает 5% населения целевого государства в государственную религию, возвращает #P 20#! Реформу благочестия и добавляет #P 5#! Религиозное поселение."
 ve_je_religious_project_status_freedom:0 "Пропаганда свободы в [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] строит поселение, основанное на совести и добровольном объединении.\n\nЗавершение в #Y 100#! прогресс: добавлены сторонники государства без принудительного преобразования, возврат средств #P 20#! Реформа благочестия и добавляет #P 7#! Религиозное поселение."
 ve_je_religious_project_status_secularization:0 "Кампания по секуляризации в [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] снижает общественный авторитет организованной религии.\n\nЗавершение при  #Y 150#! прогрессе: обращает 5% населения целевого государства в атеизм, возвращает  #P 25#! Реформу благочестия и добавляет #P 8#! Религиозное поселение."
 ve_je_religious_project_complete_tt:0 "Религиозный проект достиг своей цели."
 ve_je_religious_project_fail_tt:0 "Религиозный проект был отменен."

 ve_je_cultural_project:0 "Культурный проект"
 ve_je_cultural_project_reason:0 "Правительство руководит долгосрочным культурным проектом. Административный потенциал, легитимность, образование, национальная сплоченность и местные условия определяют его темп."
 ve_je_cultural_project_progress:0 "Ход культурного проекта приближается к завершению"
 ve_je_cultural_project_status_curriculum:0 "Национальная учебная программа готовится для школ и учреждений страны.\n\nЗавершение при #Y 100#! прогрессе: #P +20#! Культурный мандат, #P +5#! Национальная сплоченность и 10-летний результат +2% к образованию Доступ, +5% Квалификация, -25 Бюрократия."
 ve_je_cultural_project_status_symbols:0 "Программа общих символов формирует общий гражданский словарь.\n\nЗавершение на уровне  #Y 75.#! прогресс: #P +20#! Культурный мандат, #P +7#! Национальная сплоченность и 8-летний результат: +10% лоялистов из полностью принятых слоев населения и +25 авторитета."
 ve_je_cultural_project_status_ethnic:0 "Кампания по этнической интеграции в [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] подталкивает меньшинство к основной культуре.\n\nЗавершение при #Y 125#! прогрессе: преобразует 5% населения целевой культуры к основной культуре (7% с Националистическим VII), #P +25#! Культурный мандат, #P +8#! Национальное сплочение и 10-летний результат ассимиляции."
 ve_je_cultural_project_status_civic:0 "Инициатива равного гражданства в [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] расширяет общий гражданский статус через культурные линии.\n\nЗавершение при  #Y 100#! прогрессе: +15% Принятие на 10 лет, штат лоялисты, #P +25#! Культурный мандат, #P +10#! Национальное единство и 10-летний результат квалификации/миграции."
 ve_je_cultural_project_status_composite:0 "Учредительный договор в [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] ведет переговоры о постоянном признании в составном государстве.\n\nЗавершение при прогрессе  #Y 150#! (требуется 40+ Национальная сплоченность): постоянное принятие +15%, добавляет культуру в список составляющих, сторонники государства, #P +30#! Культурный мандат, #P +12#! Национальное единство."
 ve_je_cultural_project_complete_tt:0 "Культурный проект достиг своей цели."
 ve_je_cultural_project_fail_tt:0 "Культурный проект отменен."
 ve_je_project_resolving_status:0 "Администрация проекта сдает итоговый отчет."

 ve_evt_religious_incident_cooldown_mdf:0 "Религиозный инцидент в рамках проекта «Перезарядка»"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "Администрация проекта устраняет последствия недавнего инцидента."
 ve_evt_cultural_incident_cooldown_mdf:0 "Культурный проект «Восстановление инцидента»"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "Администрация проекта осознает последствия недавнего инцидента."
 ve_evt_central_clergy_supported_mdf:0 "Поддержка центрального духовенства"
 ve_evt_central_clergy_supported_mdf_desc:0 "Правительство поддержало авторитет центральной религиозной иерархии."
 ve_evt_central_clergy_slighted_mdf:0 "Центральное духовенство ущемлено"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Правительство отдает предпочтение местной практике предпочтениям центральной религиозной иерархии."
 ve_evt_municipal_patronage_mdf:0 "Муниципальные сети патронажа"
 ve_evt_municipal_patronage_mdf_desc:0 "Местные деятели продвигают проект посредством мер, которые ослабляют сбор налогов."

 ve_rel_evt.1.t:0 "Петиция местных знати"
 ve_rel_evt.1.d:0 "Делегация священнослужителей, муниципальных деятелей и старейшин района из [SCOPE.sState('ve_evt_target_state').GetName] обратился к правительству с просьбой замедлить конфессиональное обращение. Они предупреждают, что негибкий график превратит соблюдение требований в длительное недовольство."
 ve_rel_evt.1.f:0 "«Вера, навязанная без совета, может заполнить списки и опустошить скамейки»."
 ve_rel_evt.1.a:0 "Выслушайте их прошение."
 ve_rel_evt.1.a.tt:0 "Прогресс Религиозного проекта снижается на #N 4#!.\nРелигиозное поселение увеличивается на #P 3#!."
 ve_rel_evt.1.b:0 "Расписание не изменится."
 ve_rel_evt.1.b.tt:0 "Прогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозное поселение уменьшается на #N 2#!.\n#N 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_rel_evt.1.c:0 "Доверенные посредники Комиссии."
 ve_rel_evt.1.c.tt:0 "Потратьте #N 10#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 3#!.\nРелигиозное поселение увеличивается на #P 1#!."

 ve_rel_evt.2.t:0 "Нехватка полевых офицеров"
 ve_rel_evt.2.d:0 "Отчеты из [SCOPE.sState('ve_evt_target_state').GetName] описывают остающиеся без ответа петиции, противоречивые инструкции и районы, которые не видели сотрудника проекта в течение нескольких недель. Конфессиональное обращение опережает администрацию, назначенную для его проведения."
 ve_rel_evt.2.f:0 "\\"Указ может пересечь всю страну за день. Компетентный клерк не может.\\""
 ve_rel_evt.2.a:0 "Наймите временных полевых офицеров."
 ve_rel_evt.2.a.tt:0 "Потратьте #N 15#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 4#!."
 ve_rel_evt.2.b:0 "Замедлите программу."
 ve_rel_evt.2.b.tt:0 "Прогресс религиозного проекта снижается на #N 6#!.\nРелигиозный процесс Поселение увеличивается на  #P 2#!."
 ve_rel_evt.2.c:0 "Используйте кадры центрального реестра."
 ve_rel_evt.2.c.tt:0 "Потратьте #N 10#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 5#!."

 ve_cul_evt.1.t:0 "Бюро переводов"
 ve_cul_evt.1.d:0 "Официальные лица в [SCOPE.sState('ve_evt_target_state').GetName] расходятся во мнениях относительно того, как Инициатива равного гражданства должна решать проблему [SCOPE.sCulture('ve_evt_target_culture').GetName] язык. Местным администраторам нужны двуязычные офисы; центральные министерства требуют единого административного стандарта."
 ve_cul_evt.1.f:0 "«Гражданин не должен нуждаться в переводчике, чтобы понять права, предоставленные от его собственного имени»."
 ve_cul_evt.1.a:0 "Пусть местные языки живут в государственных учреждениях."
 ve_cul_evt.1.a.tt:0 "Прогресс культурного проекта снижается на #N 4#!.\nНациональная сплоченность увеличивается на #P 3#!."
 ve_cul_evt.1.b:0 "Ввести один административный стандарт."
 ve_cul_evt.1.b.tt:0 "Прогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплоченность снижается на #N 2#!.\n#N 0,5%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.1.c:0 "Создайте комиссию по академическому переводу."
 ve_cul_evt.1.c.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 3#!.\nНациональная сплоченность увеличивается на #P 1.#!."

 ve_cul_evt.2.t:0 "Нехватка местных учителей"
 ve_cul_evt.2.d:0 "Школы г. [SCOPE.sState('ve_evt_target_state').GetName] не хватает учителей, способных обслуживать как государственную учебную программу, так и [SCOPE.sCulture('ve_evt_target_culture').GetName] сообщества. Без подготовленных местных кадров равное гражданство рискует остаться обещанием, записанным только на официальной бумаге."
 ve_cul_evt.2.f:0 "«Закон провозглашает равенство во второй половине дня; этому должны учить в классе целое поколение»."
 ve_cul_evt.2.a:0 "Финансируйте новые педагогические колледжи."
 ve_cul_evt.2.a.tt:0 "Потратьте #N 15#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 4#!."
 ve_cul_evt.2.b:0 "Медленная реализация."
 ve_cul_evt.2.b.tt:0 "Прогресс культурного проекта уменьшается на  #N 6#!.\nНациональная сплоченность увеличивается на  #P 2#!."
 ve_cul_evt.2.c:0 "Используйте уже существующие учреждения."
 ve_cul_evt.2.c.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на  #P 5#!.\nНациональная сплоченность увеличивается на  #P 1#!."

 ve_rel_evt.3.t:0 "Конфликтующие регистры"
 ve_rel_evt.3.d:0 "Приходские списки, муниципальные бухгалтерские книги и отчеты руководителей проекта дают несовместимые сведения о религиозной приверженности в [SCOPE.sState('ve_evt_target_state').GetName]. Администрация должна решить, стоит ли терять время на установление истины или продолжать использовать цифры, которые, как ей известно, являются неопределенными."
 ve_rel_evt.3.f:0 "«В каждом офисе есть точная сумма. Никакие две суммы не совпадают»."
 ve_rel_evt.3.a:0 "Провести полный аудит."
 ve_rel_evt.3.a.tt:0 "Выигрыш #P 8#! Реформа благочестия.\nПрогресс религиозного проекта снижается на #N 6#!."
 ve_rel_evt.3.b:0 "Приступайте к разумным оценкам."
 ve_rel_evt.3.b.tt:0 "Потратьте #N 8#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 5#!."
 ve_rel_evt.3.c:0 "Используйте регистры Священного управления."
 ve_rel_evt.3.c.tt:0 "Прогресс религиозного проекта увеличивается на #P 3#!."

 ve_rel_evt.4.t:0 "Слухи и контрпроповедь"
 ve_rel_evt.4.d:0 "Брошюры, уличные проповеди и тревожные слухи теперь описывают исповедальное обращение в [SCOPE.sState('ve_evt_target_state').GetName] как нападение на местную жизнь. Чиновники предупреждают, что молчание позволит оппонентам определять ход проекта, а репрессии могут подтвердить их самые мрачные утверждения."
 ve_rel_evt.4.f:0 "«Слуху не нужны ни офисы, ни печати, ни бюджет»."
 ve_rel_evt.4.a:0 "Проведите общественные слушания."
 ve_rel_evt.4.a.tt:0 "Прогресс религиозного проекта снижается на #N 3#!.\nРелигиозное поселение увеличивается на #P 3#!.\n#P 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится лоялистами."
 ve_rel_evt.4.b:0 "Наказать агитаторов."
 ve_rel_evt.4.b.tt:0 "Прогресс религиозного проекта увеличивается на #P 4#!.\nРелигиозное поселение уменьшается на #N 3#!.\n#N 1%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_rel_evt.4.c:0 "Опубликуйте записи и результаты."
 ve_rel_evt.4.c.tt:0 "Потратьте #N 10#! Реформу благочестия.\nПрогресс религиозного проекта увеличивается на #P 2#!.\nРелигиозное поселение увеличивается на #P 1#!."

 ve_rel_evt.5.t:0 "Язык проповеди"
 ve_rel_evt.5.d:0 "Духовенство проекта в [SCOPE.sState('ve_evt_target_state').GetName] сообщают, что формальные проповеди сохраняют доктринальное единство, но не достигают многих прихожан. Проповедь на местном языке будет способствовать дальнейшему развитию кампании, хотя центральная иерархия опасается, что адаптация приведет к независимости."
 ve_rel_evt.5.f:0 "«Священное слово, неслыханное, прекрасно сохраняется — и никем не получено»."
 ve_rel_evt.5.a:0 "Проповедуйте на местных языках."
 ve_rel_evt.5.a.tt:0 "Прогресс Религиозного проекта увеличивается на #P 6#!.\nНабожные теряют #N 1#! Одобрение на #Y 2,5 года#!."
 ve_rel_evt.5.b:0 "Сохраняют литургическое единство."
 ve_rel_evt.5.b.tt:0 "Прогресс Религиозного проекта уменьшается на #N 3#!.\nРелигиозное поселение увеличивается на #P 3#!.\nНабожные получают #P 1#! Одобрение на #Y 2,5 Годы#!."
 ve_rel_evt.5.c:0 "Подготовка образованных переводчиков."
 ve_rel_evt.5.c.tt:0 "Потратить #N 10#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 4#!.\nКоличество религиозных поселений увеличивается на #P 1#!."

 ve_rel_evt.6.t:0 "Соперничающие церковные власти"
 ve_rel_evt.6.d:0 "Назначенные из центра и установленные местные духовенства в [SCOPE.sState('ve_evt_target_state').GetName] каждый претендует на право руководить конфессиональным обращением. Поддержка одной стороны может быстро восстановить командование, но спор уже стал проверкой того, кто говорит за веру."
 ve_rel_evt.6.f:0 "«Спор касается юрисдикции, то есть того, как институты описывают власть». "
 ve_rel_evt.6.a:0 "Поддержите центральное духовенство."
 ve_rel_evt.6.a.tt:0 "Прогресс Религиозного проекта увеличивается на #P 5#!.\nПрирост благочестия #P 1#! Разрешение на  #Y 2,5 года#!.\nРелигиозное поселение уменьшается на  #N 3#!.\n#N 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_rel_evt.6.b:0 "Умиротворить местное духовенство."
 ve_rel_evt.6.b.tt:0 "Прогресс религиозного проекта снижается на #N 4#!.\nНабожные теряют #N 1#! Одобрение на #Y 2,5 года#!.\nРелигиозное поселение увеличивается на #P 3#!."
 ve_rel_evt.6.c:0 "Определите свои полномочия в письменном виде."
 ve_rel_evt.6.c.tt:0 "Потратить #N 10#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на  #P 3#!.\nРелигиозное поселение увеличивается на  #P 1#!."

 ve_cul_evt.3.t:0 "Категории переписи населения"
 ve_cul_evt.3.d:0 "Сотрудники переписи населения в [SCOPE.sState('ve_evt_target_state').GetName] не могу согласиться с тем, как граждане [SCOPE.sCulture('ve_evt_target_culture').GetName] Культура должна быть записана. Местные респонденты используют пересекающиеся идентичности, в то время как центральные формы требуют одного ответа в одном поле."
 ve_cul_evt.3.f:0 "\\"Категория упрощает бухгалтерскую книгу задолго до того, как она упрощает страну.\\""
 ve_cul_evt.3.a:0 "Разрешить самоидентификацию."
 ve_cul_evt.3.a.tt:0 "Прогресс культурного проекта снижается на #N 4#!.\nНациональная сплоченность увеличивается на #P 4#!."
 ve_cul_evt.3.b:0 "Категории будут устанавливаться централизованно."
 ve_cul_evt.3.b.tt:0 "Прогресс культурного проекта увеличивается на #P 6#!.\nНациональная сплоченность уменьшается на #N 4#!.\n#N 0,5%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.3.c:0 "Используйте современную систему регистрации."
 ve_cul_evt.3.c.tt:0 "Потратьте  #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на  #P 5#!.\nНациональная сплочённость увеличивается на  #P 1#!."

 ve_cul_evt.4.t:0 "Муниципальные знатные люди"
 ve_cul_evt.4.d:0 "Муниципальные покровители в [SCOPE.sState('ve_evt_target_state').GetName] предложить свои офисы, клиентов и влияние для продвижения равного гражданства для [SCOPE.sCulture('ve_evt_target_culture').GetName] население. Их сотрудничество будет быстрым, но их ценой будет продолжение контроля над местными доходами."
 ve_cul_evt.4.f:0 "«Кратчайшая дорога к ратуше проходит через несколько частных гостиных»."
 ve_cul_evt.4.a:0 "Используйте локальные сети."
 ve_cul_evt.4.a.tt:0 "Прогресс культурного проекта увеличивается на #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] теряет #N 5%#! Налоговые возможности на #Y 2 года#!."
 ve_cul_evt.4.b:0 "Создайте открытые советы."
 ve_cul_evt.4.b.tt:0 "Прогресс культурного проекта снижается на #N 3#!.\nНациональная сплоченность увеличивается на #P 3#!."
 ve_cul_evt.4.c:0 "Проведите переговоры об урегулировании на основе правил."
 ve_cul_evt.4.c.tt:0 "Потратьте  #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 3#!.\nНациональная сплоченность увеличивается на #P 1.#!."

 ve_cul_evt.5.t:0 "Экзамены на государственную службу"
 ve_cul_evt.5.d:0 "Открытие экзаменов на государственную службу [SCOPE.sCulture('ve_evt_target_culture').GetName] Кандидаты выявили разрыв между юридическим равенством и практической подготовкой. Немедленный доступ имел бы символическое значение, но годы неравного обучения не могут быть отменены указом."
 ve_cul_evt.5.f:0 "«Один и тот же экзамен — это не та же возможность, когда только один кандидат обучался языку»."
 ve_cul_evt.5.a:0 "Подготовительные курсы по финансам."
 ve_cul_evt.5.a.tt:0 "Потратить #N 15#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплоченность увеличивается на #P 2#!."
 ve_cul_evt.5.b:0 "Равный доступ начинается немедленно."
 ve_cul_evt.5.b.tt:0 "Прогресс культурного проекта увеличивается на #P 7#!.\nНациональная сплоченность снижается на #N 4#!.\n#N 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.5.c:0 "Мобилизуйте школы и сети социального обеспечения."
 ve_cul_evt.5.c.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплоченность увеличивается на #P 2#!."
 ve_cul_evt.5.e:0 "Сначала реформируйте экзаменационную систему."
 ve_cul_evt.5.e.tt:0 "Прогресс культурного проекта снижается на #N 4#!.\nНациональная сплоченность увеличивается на #P 3#!."

 ve_cul_evt.6.t:0 "Большинство отталкивает"
 ve_cul_evt.6.d:0 "Противники Инициативы равного гражданства утверждают, что распространение общих прав на [SCOPE.sCulture('ve_evt_target_culture').GetName] население умаляет положение всех остальных. Демонстрации в [SCOPE.sState('ve_evt_target_state').GetName] превращают административную реформу в национальное политическое испытание."
 ve_cul_evt.6.f:0 "«Общее право рассматривается как украденная привилегия». "
 ve_cul_evt.6.a:0 "Открыто защищайте инициативу."
 ve_cul_evt.6.a.tt:0 "Прогресс культурного проекта увеличивается на  #P 4#!.\nНациональная сплочённость снижается на  #N 4#!.\n#N 1%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.6.b:0 "Снизить темп реализации."
 ve_cul_evt.6.b.tt:0 "Прогресс культурного проекта уменьшается на #N 5#!.\nНациональная сплоченность увеличивается на #P 3#!."
 ve_cul_evt.6.c:0 "Мобилизовать реформаторскую коалицию."
 ve_cul_evt.6.c.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 3#!.\nНациональная сплоченность увеличивается на #P 2#!.\n#P 0,5%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится лоялистом."

 ve_rel_evt.7.t:0 "Миссия на переломном этапе"
 ve_rel_evt.7.d:0 "Конфессиональное обращение в [SCOPE.sState('ve_evt_target_state').GetName] близка к административному и политическому краху. Офисы перестали отвечать друг другу, сопротивление общественности усиливается, а полевое духовенство предупреждает, что миссия не может продолжать работу на нынешних условиях."
 ve_rel_evt.7.f:0 "«В отчетах все еще называют это временной трудностью. Улицы выбрали более резкое название»."
 ve_rel_evt.7.a:0 "Примите потери и отойдите."
 ve_rel_evt.7.a.tt:0 "Отмените религиозный проект без возврата средств за реформу благочестия.\nРелигиозное поселение уменьшается на #N 5#!.\nДля #Y 2 года#!: #N -50#! Бюрократия, #N -50#! Власть и #N -3%#! Успех принятия закона."
 ve_rel_evt.7.b:0 "Передача экстренных ресурсов."
 ve_rel_evt.7.b.tt:0 "Потратить #N 25#! Реформа благочестия.\nПрогресс религиозного проекта снижается на #N 5#!.\n#N 1%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным.\nПроект продолжается."
 ve_rel_evt.7.c:0 "Продолжайте с минимальным штатом."
 ve_rel_evt.7.c.tt:0 "Прогресс религиозного проекта уменьшается на #N 10#!.\nРелигиозное поселение уменьшается на #N 2#!.\nПроект продолжается."
 ve_rel_evt.7.e:0 "Пересмотреть метод."
 ve_rel_evt.7.e.tt:0 "Потратить #N 15#! Реформа благочестия.\nПрогресс религиозного проекта снижается на #N 3#!.\nРелигиозное поселение увеличивается на #P 2#!.\n#N 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным.\nПроект продолжается."

 ve_cul_evt.7.t:0 "Инициатива теряет легитимность"
 ve_cul_evt.7.d:0 "Инициатива равного гражданства в [SCOPE.sState('ve_evt_target_state').GetName] теряет поддержку как со стороны устоявшихся институтов, так и со стороны [SCOPE.sCulture('ve_evt_target_culture').GetName] сообщества, которым он должен был служить. Радикальные движения теперь изображают каждый компромисс как доказательство того, что правительство не может обеспечить равенство."
 ve_cul_evt.7.f:0 "«Реформа может пережить сопротивление. Она не может пережить то, что становится невероятной»."
 ve_cul_evt.7.a:0 "Завершить инициативу."
 ve_cul_evt.7.a.tt:0 "Отменить Культурный проект без возврата средств по Культурному мандату.\nНациональная сплочённость снижается на #N 5#!.\nЗа #Y 2 года#!: #N -50#! Бюрократия, #N -25#! Полномочия и #N -3%#! Успешное принятие закона."
 ve_cul_evt.7.b:0 "Выдать чрезвычайные местные гранты."
 ve_cul_evt.7.b.tt:0 "Потратить #N 25#! Культурный мандат.\nПрогресс культурного проекта снижается на #N 5#!.\n#N 1%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным.\nПроект продолжается."
 ve_cul_evt.7.c:0 "Продолжить с минимальной программой."
 ve_cul_evt.7.c.tt:0 "Прогресс культурного проекта снижается на #N 10#!.\nНациональная сплоченность снижается на #N 2#!.\nПроект продолжается."
 ve_cul_evt.7.e:0 "Восстановите коалицию."
 ve_cul_evt.7.e.tt:0 "Потратьте #N 15#! Культурный мандат.\nПрогресс культурного проекта снижается на #N 3#!.\nНациональная сплоченность увеличивается на #P 2#!.\n#N 0,5%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным.\nПроект продолжается."

 ve_rel_evt.8.t:0 "Неожиданное местное согласие"
 ve_rel_evt.8.d:0 "Духовенство, муниципальные чиновники и старейшины общин в [SCOPE.sState('ve_evt_target_state').GetName] достигли соглашения, которого не могла бы достичь ни одна центральная директива. Местное сопротивление ослабевает, общины сами координируют миссию, а исповедальное обращение приобрело неожиданный импульс."
 ve_rel_evt.8.f:0 "«То, что началось как приказ из столицы, превратилось в договор, заключенный на городской площади»."
 ve_rel_evt.8.a:0 "Используйте этот импульс в полной мере."
 ve_rel_evt.8.a.tt:0 "Религиозное поселение увеличивается на #P 1#!.\nПрогресс религиозного проекта увеличивается на  #P 25#!.\nЕсли прогресс достигает  #Y 100#!, применяется обычный эффект завершения проекта."
 ve_rel_evt.8.b:0 "Долговечность важнее скорости."
 ve_rel_evt.8.b.tt:0 "Религиозное поселение увеличивается на  #P 4#!.\nПрогресс религиозного проекта увеличивается на #P 10#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."

 ve_cul_evt.8.t:0 "Местная гражданская коалиция"
 ve_cul_evt.8.d:0 "Учителя, муниципальные чиновники, торговые ассоциации и представители [SCOPE.sCulture('ve_evt_target_culture').GetName] сообщество в [SCOPE.sState('ve_evt_target_state').GetName] сформировали общий комитет. Разрешая споры до того, как они достигнут столицы, эта коалиция дала Инициативе равного гражданства импульс, который администрация не смогла создать."
 ve_cul_evt.8.f:0 "«Гражданство стало реальностью, когда учреждения, которые редко делили один стол, начали делить ответственность»."
 ve_cul_evt.8.a:0 "Используйте импульс коалиции."
 ve_cul_evt.8.a.tt:0 "Национальная сплоченность увеличивается на #P 1#!.\nПрогресс культурного проекта увеличивается на  #P 25#!.\nЕсли прогресс достигает  #Y 100#!, применяется обычный эффект завершения проекта."
 ve_cul_evt.8.b:0 "Сделайте учреждения постоянными."
 ve_cul_evt.8.b.tt:0 "Национальная сплоченность увеличивается на  #P 4#!.\nПрогресс культурного проекта увеличивается на  #P 10#!.\nЕсли прогресс достигает  #Y 100#!, применяется эффект обычного завершения проекта."

 ve_rel_evt.40.t:0 "Записи вне шага"
 ve_rel_evt.40.d:0 "Провинциальные регистры в [SCOPE.sState('ve_evt_target_state').GetName] использовать несовместимые категории для общин, гражданских объединений и государственных учреждений. Сообщения, поступающие в столицу, теперь противоречат друг другу, в результате чего проект не может отличить согласие от сопротивления."
 ve_rel_evt.40.f:0 "«Политика, проводимая через три реестра, вскоре приобретает три разные реальности»."
 ve_rel_evt.40.a:0 "Отправить центральный аудит."
 ve_rel_evt.40.a.tt:0 "Потратьте  #N 10#! Реформу благочестия.\nПрогресс религиозного проекта увеличивается на  #P 5#!.\nРелигиозное поселение увеличивается на  #P 1.#!."
 ve_rel_evt.40.b:0 "Согласуйте записи на местном уровне."
 ve_rel_evt.40.b.tt:0 "Прогресс религиозного проекта уменьшается на #N 3#!.\nРелигиозное поселение увеличивается на #P 2#!."
 ve_rel_evt.40.c:0 "Примените стандартную процедуру регистрации."
 ve_rel_evt.40.c.tt:0 "Потратьте #N 5#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 4#!.\nРелигиозное поселение увеличивается на #P 1#!."

 ve_rel_evt.41.t:0 "Нехватка провинциальных кадров"
 ve_rel_evt.41.d:0 "Офисы, руководящие проектом в [SCOPE.sState('ve_evt_target_state').GetName] не может найти достаточно подготовленных клерков, учителей и инспекторов. Директивы накапливаются быстрее, чем местные чиновники успевают их интерпретировать, а поспешные назначения грозят усугубить любой спор."
 ve_rel_evt.41.f:0 "\\"Указ прибыл через день. Людям, способным его выполнить, может потребоваться поколение.\\""
 ve_rel_evt.41.a:0 "Профинансируйте новые кадры чиновников."
 ve_rel_evt.41.a.tt:0 "Потратьте #N 15#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 6#!."
 ve_rel_evt.41.b:0 "Замедлить реализацию."
 ve_rel_evt.41.b.tt:0 "Прогресс религиозного проекта уменьшается на #N 6#!.\nРелигиозное поселение увеличивается на #P 2#!."
 ve_rel_evt.41.c:0 "Использовать существующую образовательную сеть."
 ve_rel_evt.41.c.tt:0 "Потратить #N 10#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 5#!.\nКоличество религиозных поселений увеличилось на #P 1#!."

 ve_rel_evt.42.t:0 "Слухи по всему округу"
 ve_rel_evt.42.d:0 "Слухи [SCOPE.sState('ve_evt_target_state').GetName] утверждают, что проект скрывает меры, гораздо более жесткие, чем объявленные правительством. Религиозные организаторы и местные агитаторы повторяют противоречивые истории, в то время как официальное молчание дает простор для распространения каждой новой версии."
 ve_rel_evt.42.f:0 "\\"Слух не требует ни офиса, ни бюджета, ни подписи.\\""
 ve_rel_evt.42.a:0 "Публикуйте отчеты."
 ve_rel_evt.42.a.tt:0 "Прогресс религиозного проекта уменьшается на #N 3#!.\nРелигиозное поселение увеличивается на #P 4#!."
 ve_rel_evt.42.b:0 "Отклоните агитацию."
 ve_rel_evt.42.b.tt:0 "Прогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозное поселение уменьшается на #N 3#!.\n#N 1%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_rel_evt.42.c:0 "Комиссия местных посредников."
 ve_rel_evt.42.c.tt:0 "Потратить #N 10#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на  #P 4#!.\nРелигиозное поселение увеличивается на  #P 2#!.\n#P 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится лоялистом."

 ve_rel_evt.43.t:0 "Администрация на переломном этапе"
 ve_rel_evt.43.d:0 "Проект в [SCOPE.sState('ve_evt_target_state').GetName] приближается к административному коллапсу. Провинциальные офисы перегружены, общественное доверие подорвано, а организованная оппозиция теперь рассматривает каждую новую директиву как свидетельство того, что правительство потеряло контроль."
 ve_rel_evt.43.f:0 "«Когда файлы перестают двигаться, кризис выходит на улицы»."
 ve_rel_evt.43.a:0 "Завершите программу."
 ve_rel_evt.43.a.tt:0 "Отмените религиозный проект без возврата средств за реформу благочестия.\nРелигиозное поселение уменьшается на #N 5#!.\nЗа #Y 2 года#!: #N -50#! Бюрократия, #N -50#! Авторитет и #N -3%#! Успех принятия закона."
 ve_rel_evt.43.b:0 "Передача чрезвычайных ресурсов."
 ve_rel_evt.43.b.tt:0 "Потратить #N 25#! Реформа благочестия.\nПрогресс религиозного проекта снижается на #N 5#!.\n#N 1%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным.\nПроект продолжается."
 ve_rel_evt.43.c:0 "Продолжайте использовать скелетный персонал."
 ve_rel_evt.43.c.tt:0 "Прогресс религиозного проекта снижается на #N 10#!.\nРелигиозное поселение уменьшается на #N 2#!.\nПроект продолжается."
 ve_rel_evt.43.e:0 "Восстановить местное партнерство."
 ve_rel_evt.43.e.tt:0 "Потратить #N 15#! Реформа благочестия.\nПрогресс религиозного проекта снижается на  #N 3#!.\nРелигиозное поселение увеличивается на  #P 2#!.\n#N 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным.\nПроект продолжается."

 ve_rel_evt.100.t:0 "Места в Межконфессиональном совете"
 ve_rel_evt.100.d:0 "Делегаты в [SCOPE.sState('ve_evt_target_state').GetName] согласен с тем, что межконфессиональный совет необходим, но не для того, кто заслуживает места. Пропорциональное представительство успокоило бы небольшие общины, в то время как фиксированное поселение, спроектированное в столице, могло бы начать работу немедленно."
 ve_rel_evt.100.f:0 "«Все поддерживают общий стол, пока стулья не пересчитаны»."
 ve_rel_evt.100.a:0 "Распределите представительство по населению."
 ve_rel_evt.100.a.tt:0 "Религиозный прогресс проекта снижается на #N 3#!.\nРелигиозное поселение увеличивается на #P 4#!."
 ve_rel_evt.100.b:0 "Назначить фиксированный централизованный компромисс."
 ve_rel_evt.100.b.tt:0 "Прогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозное поселение уменьшается на #N 2#!.\n#N 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_rel_evt.100.c:0 "Расширение прав и возможностей Межконфессиональных советов."
 ve_rel_evt.100.c.tt:0 "Потратьте  #N 10#! Реформу благочестия.\nПрогресс религиозного проекта увеличивается на  #P 5#!.\nРелигиозное поселение увеличивается на  #P 2#!."

 ve_rel_evt.101.t:0 "Совместная школьная программа"
 ve_rel_evt.101.d:0 "Школы в [SCOPE.sState('ve_evt_target_state').GetName] нужны общие гражданские уроки, не превращая «Продвижение за свободу» в кампанию против местных убеждений. Учителя требуют четких материалов и совместного обучения, в то время как общественные лидеры настаивают на том, чтобы местное обучение сохраняло место для их традиций."
 ve_rel_evt.101.f:0 "«Совместный урок успешен только в том случае, если каждая семья признает класс своим». "
 ve_rel_evt.101.a:0 "Финансируйте общий преподавательский состав."
 ve_rel_evt.101.a.tt:0 "Потратьте #N 15#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 6#!.\nРелигиозное поселение увеличивается на #P 1#!."
 ve_rel_evt.101.b:0 "Оставить место для местных учебных программ."
 ve_rel_evt.101.b.tt:0 "Прогресс религиозных проектов снижается на #N 4#!.\nРелигиозное поселение увеличивается на #P 3#!."
 ve_rel_evt.101.c:0 "Привести реформаторскую коалицию в школы."
 ve_rel_evt.101.c.tt:0 "Потратить #N 10#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозное поселение увеличивается на #P 2#!.\n#P 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится лоялистом."

 ve_rel_evt.102.t:0 "Хартия взаимных гарантий"
 ve_rel_evt.102.d:0 "Религиозные общины, муниципальные чиновники и реформаторские объединения в [SCOPE.sState('ve_evt_target_state').GetName] разработали общий устав. Каждая подписавшая сторона принимает на себя одинаковые гражданские обязательства в обмен на публичные гарантии того, что ни одно сообщество не будет исключено из местных институтов."
 ve_rel_evt.102.f:0 "«Доверие стало возможным, когда каждое обещание было записано как право другой стороны»."
 ve_rel_evt.102.a:0 "Используйте импульс договора."
 ve_rel_evt.102.a.tt:0 "Религиозное поселение увеличивается на #P 2#!.\nПрогресс религиозного проекта увеличивается на #P 20#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."
 ve_rel_evt.102.b:0 "Сделайте гарантии постоянными."
 ve_rel_evt.102.b.tt:0 "Религиозное поселение увеличивается на #P 4#!.\n#P 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится лоялистом.\nПрогресс религиозного проекта увеличивается на #P 10#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."

 ve_rel_evt.150.t:0 "Учителя или инспекторы?"
 ve_rel_evt.150.d:0 "Кампания по секуляризации в [SCOPE.sState('ve_evt_target_state').GetName] выявила нехватку грамотных кадров. Администрация может расширить преподавательский корпус, что создаст долгосрочный гражданский потенциал, или положиться на инспекторов, которые смогут обеспечить соблюдение новых правил с помощью уже имеющегося персонала."
 ve_rel_evt.150.f:0 "«Инспектор может закрыть школу за один день. Учителю могут потребоваться годы, чтобы заменить то, чему там учили»."
 ve_rel_evt.150.a:0 "Расширить преподавательский корпус."
 ve_rel_evt.150.a.tt:0 "Потратьте  #N 15#! Реформу благочестия.\nПрогресс религиозного проекта увеличивается на  #P 6#!."
 ve_rel_evt.150.b:0 "Замедлите программу, чтобы она соответствовала имеющемуся персоналу."
 ve_rel_evt.150.b.tt:0 "Прогресс религиозного проекта уменьшается на  #N 5#!.\nРелигиозное поселение увеличивается на  #P 2#!."
 ve_rel_evt.150.c:0 "Введите в действие сеть государственного образования."
 ve_rel_evt.150.c.tt:0 "Потратьте  #N 10#! Реформу благочестия.\nПрогресс религиозного проекта увеличивается на  #P 5#!.\nРелигиозное поселение увеличивается на  #P 1#!."

 ve_rel_evt.151.t:0 "Захваченная собственность"
 ve_rel_evt.151.d:0 "Бывшие религиозные объекты [SCOPE.sState('ve_evt_target_state').GetName] готовы к преобразованию в школы, клиники и общественные учреждения. Немедленная передача предоставит кампании ценную инфраструктуру, но отсутствие компенсации становится объединяющим фактором для Благочестивых."
 ve_rel_evt.151.f:0 "\\"Ключи перешли из рук в руки утром. Спор о собственности переживет замки.\\""
 ve_rel_evt.151.a:0 "Выплачивайте компенсацию поэтапно."
 ve_rel_evt.151.a.tt:0 "Потратьте #N 15#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 3#!.\nРелигиозное поселение увеличивается на #P 3#!."
 ve_rel_evt.151.b:0 "Немедленно передать объекты в пользование государству."
 ve_rel_evt.151.b.tt:0 "Прогресс религиозного проекта увеличивается на #P 7#!.\nРелигиозное поселение уменьшается на #N 4#!.\n#N 1%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным.\nНабожные теряют #N 1#! Одобрение #Y 2,5 года#!."
 ve_rel_evt.151.c:0 "Передать их в светские учреждения социального обеспечения."
 ve_rel_evt.151.c.tt:0 "Потратить #N 10#! Реформа благочестия.\nПрогресс религиозного проекта увеличивается на #P 5#!.\nРелигиозное поселение увеличивается на #P 2#!.\n#P 0,5%#! населения в [SCOPE.sState('ve_evt_target_state').GetName] становится лоялистом."

 ve_rel_evt.152.t:0 "Гражданские объединения укореняются"
 ve_rel_evt.152.d:0 "Учительские кружки, общества взаимопомощи и муниципальные ассоциации в [SCOPE.sState('ve_evt_target_state').GetName] начали предоставлять услуги, которые когда-то были организованы через религиозные учреждения. Их сотрудничество дало Кампании по секуляризации местную гражданскую основу, а не просто административное присутствие."
 ve_rel_evt.152.f:0 "«Новый порядок сохранился, когда граждане начали поддерживать его, не дожидаясь инспектора»."
 ve_rel_evt.152.a:0 "Используйте местный импульс."
 ve_rel_evt.152.a.tt:0 "Религиозное поселение увеличивается на  #P 2#!.\nПрогресс религиозного проекта увеличивается на  #P 20#!.\nЕсли прогресс достигает  #Y 100#!, применяется обычный эффект завершения проекта."
 ve_rel_evt.152.b:0 "Превратите ассоциации в постоянные учреждения."
 ve_rel_evt.152.b.tt:0 "Религиозное поселение увеличивается на #P 4#!.\nПрогресс религиозного проекта увеличивается на #P 10#!.\nЕсли прогресс достигает #Y 100#!, применяется обычный эффект завершения проекта."

 ve_cul_evt.40.t:0 "Местные школьные советы"
 ve_cul_evt.40.d:0 "Школьные советы в [SCOPE.sState('ve_evt_target_state').GetName] не согласен по поводу места [SCOPE.sCulture('ve_evt_target_culture').GetName] язык в государственном обучении. Обучение на местном языке сохранит доверие, а единый административный язык облегчит управление национальным проектом."
 ve_cul_evt.40.f:0 "«Язык, выбранный для первого урока, часто решает, кто считает, что школа принадлежит ему»."
 ve_cul_evt.40.a:0 "Защитите местный язык."
 ve_cul_evt.40.a.tt:0 "Прогресс культурного проекта снижается на #N 4#!.\nНациональная сплоченность увеличивается на #P 3#!."
 ve_cul_evt.40.b:0 "Введите один административный язык."
 ve_cul_evt.40.b.tt:0 "Прогресс культурного проекта увеличивается на  #P 5#!.\nНациональная сплоченность снижается на  #N 2#!.\n#N 0,5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.40.c:0 "Расширить сеть учителей."
 ve_cul_evt.40.c.tt:0 "Потратьте  #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 4.#!.\nНациональная сплочённость увеличивается на #P 2#!."

 ve_cul_evt.41.t:0 "Статистические границы"
 ve_cul_evt.41.d:0 "Официальные лица, проводящие исследования [SCOPE.sState('ve_evt_target_state').GetName] не могут прийти к единому мнению, где начинается и заканчивается [SCOPE.sCulture('ve_evt_target_culture').GetName] сообщество. Местные идентичности пересекаются в зависимости от языка, района и обычаев, но национальный проект требует категорий, которые можно подсчитать и которыми можно управлять."
 ve_cul_evt.41.f:0 "\\"Граница, проведенная для переписи населения, вскоре обрастает чиновниками, бюджетом и защитниками.\\""
 ve_cul_evt.41.a:0 "Оставьте место для самоидентификации."
 ve_cul_evt.41.a.tt:0 "Прогресс культурного проекта снижается на #N 3#!.\nНациональная сплоченность увеличивается на #P 3#!."
 ve_cul_evt.41.b:0 "Пусть центр определяет границы."
 ve_cul_evt.41.b.tt:0 "Прогресс культурного проекта увеличивается на #P 6#!.\nНациональная сплоченность снижается на #N 3#!.\n#N 0,5%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.41.c:0 "Используйте стандартную систему регистрации."
 ve_cul_evt.41.c.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплоченность увеличивается на #P 1#!."

 ve_cul_evt.42.t:0 "Национальный проект на грани краха"
 ve_cul_evt.42.d:0 "Национальный проект в [SCOPE.sState('ve_evt_target_state').GetName] близится к краху. Радикальные движения утверждают, что правительство либо предало [SCOPE.sCulture('ve_evt_target_culture').GetName] сообщество или сдались ему, в то время как местные офисы больше не обладают уверенностью в том, чтобы добиться нового компромисса."
 ve_cul_evt.42.f:0 "«Поселение, на которое нападают одновременно с применением принуждения и капитуляции, может вскоре вообще перестать быть урегулированием»."
 ve_cul_evt.42.a:0 "Завершите проект."
 ve_cul_evt.42.a.tt:0 "Отменить культурный проект без возмещения культурного мандата.\nНациональная сплоченность снижается на #N 5#!.\nНа #Y 2 года#!: #N -50#! Бюрократия, #N -25#! Власть и #N -3%#! Успех принятия закона."
 ve_cul_evt.42.b:0 "Передача экстренных местных ресурсов."
 ve_cul_evt.42.b.tt:0 "Потратить #N 25#! Культурный мандат.\nПрогресс культурного проекта снижается на #N 5#!.\n#N 1%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным.\nПроект продолжается."
 ve_cul_evt.42.c:0 "Продолжайте с минимальной программой."
 ve_cul_evt.42.c.tt:0 "Прогресс культурного проекта снижается на #N 10#!.\nНациональная сплоченность уменьшается на #N 2#!.\nПроект продолжается."
 ve_cul_evt.42.e:0 "Восстановите структуру переговоров."
 ve_cul_evt.42.e.tt:0 "Потратьте #N 15#! Культурный мандат.\nПрогресс культурного проекта снижается на #N 3#!.\nНациональная сплоченность увеличивается на #P 2#!.\n#N 0,5%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным.\nПроект продолжается."

 ve_cul_evt.50.t:0 "Директива по фамилиям и языкам"
 ve_cul_evt.50.d:0 "Официальные лица в [SCOPE.sState('ve_evt_target_state').GetName] предложить стандартизировать фамилии и публичные записи на национальном языке. Директива сделает [SCOPE.sCulture('ve_evt_target_culture').GetName] центральной администрации легче классифицировать население, но семьи опасаются, что личная личность становится объектом государственного контроля."
 ve_cul_evt.50.f:0 "«Имя, записанное в реестре по-другому, может по-прежнему оставаться именем, под которым семья запомнит себя». "
 ve_cul_evt.50.a:0 "Профинансируйте кампанию по постепенной регистрации."
 ve_cul_evt.50.a.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 4#!.\nНациональная сплочённость увеличивается на #P 1.#!.\n#N 0,5%#! от [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.50.b:0 "Ввести один национальный стандарт."
 ve_cul_evt.50.b.tt:0 "Прогресс культурного проекта увеличивается на #P 7#!.\nНациональная сплоченность снижается на  #N 4#!.\n#N 1%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.50.c:0 "Отозвать директиву на доработку."
 ve_cul_evt.50.c.tt:0 "Прогресс культурного проекта снижается на #N 5#!.\nНациональная сплоченность увеличивается на #P 3.#!."

 ve_cul_evt.51.t:0 "Регистры призыва"
 ve_cul_evt.51.d:0 "Военнослужащих в [SCOPE.sState('ve_evt_target_state').GetName] требовать единого реестра служебных обязанностей, фамилий и команд. Применяя его к [SCOPE.sCulture('ve_evt_target_culture').GetName] население усилило бы стремление к этнической интеграции, однако сопротивление растет среди сообществ, которые рассматривают армию как еще один инструмент культурного стирания."
 ve_cul_evt.51.f:0 "«Государство сначала узнает названия деревень, когда хочет собрать налоги или созвать своих сыновей»."
 ve_cul_evt.51.a:0 "Примените национальные регистры."
 ve_cul_evt.51.a.tt:0 "Прогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплоченность снижается на #N 2#!.\n#N 0,5%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.51.b:0 "Сохранение местной практики регистрации."
 ve_cul_evt.51.b.tt:0 "Прогресс культурного проекта снижается на #N 3#!.\nНациональная сплоченность увеличивается на #P 3#!."
 ve_cul_evt.51.c:0 "Объедините регистры посредством военной службы."
 ve_cul_evt.51.c.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 6#!.\nНациональная сплоченность увеличивается на  #P 1#!.\n#N 0,5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."

 ve_cul_evt.100.t:0 "Учредительная делегация"
 ve_cul_evt.100.d:0 "Делегация из [SCOPE.sCulture('ve_evt_target_culture').GetName] сообщество в [SCOPE.sState('ve_evt_target_state').GetName] прибыл с требованиями о представительстве в учреждениях Учредительного договора. Переговоры замедлят реализацию проекта, но укрепят его легитимность; урегулирование, навязанное столицей, может произойти быстрее за счет доверия."
 ve_cul_evt.100.f:0 "«Договор становится общим только тогда, когда каждый избиратель может указать на пункт, который он помогал писать»."
 ve_cul_evt.100.a:0 "Обсудите их место в договоре."
 ve_cul_evt.100.a.tt:0 "Прогресс культурного проекта уменьшается на #N 4#!.\nНациональная сплоченность увеличивается на #P 4#!."
 ve_cul_evt.100.b:0 "Введите центральное поселение."
 ve_cul_evt.100.b.tt:0 "Прогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплоченность снижается на #N 2#!.\n#N 0,5%#! принадлежащий [SCOPE.sCulture('ve_evt_target_culture').GetName] население в [SCOPE.sState('ve_evt_target_state').GetName] становится радикальным."
 ve_cul_evt.100.c:0 "Привлеките к переговорам парламентскую коалицию."
 ve_cul_evt.100.c.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 4#!.\nНациональная сплоченность увеличивается на #P 2#!."

 ve_cul_evt.101.t:0 "Двойное управление"
 ve_cul_evt.101.d:0 "Учредительный договор в [SCOPE.sState('ve_evt_target_state').GetName] сейчас зависит от двух перекрывающихся администраций. Центральные чиновники и представители [SCOPE.sCulture('ve_evt_target_culture').GetName] сообщество дублирует реестры, спорит о назначениях и издает противоречивые инструкции, в то время как бюрократия страны приближается к истощению."
 ve_cul_evt.101.f:0 "«Двум офисам легче разделить полномочия, чем разделить картотеку»."
 ve_cul_evt.101.a:0 "Финансировать совместный административный персонал."
 ve_cul_evt.101.a.tt:0 "Потратить #N 15#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 6#!."
 ve_cul_evt.101.b:0 "Замедлите подписание договора, пока офисы не согласятся."
 ve_cul_evt.101.b.tt:0 "Прогресс культурного проекта уменьшается на #N 6.#!.\nНациональная сплоченность увеличивается на #P 2#!."
 ve_cul_evt.101.c:0 "Объедините офисы в рамках государственной службы."
 ve_cul_evt.101.c.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплоченность увеличивается на #P 2#!."

 ve_cul_evt.150.t:0 "Реализация в провинциях"
 ve_cul_evt.150.d:0 "Администрации провинций сообщают, что общенациональный культурный проект продвигается с совершенно разными скоростями. Некоторые офисы требуют финансирования комиссий по реализации, в то время как другие предупреждают, что навязывание единого графика каждому региону потребует нехватки персонала и ослабит доверие общественности."
 ve_cul_evt.150.f:0 "«Национальный указ пишется один раз, но он должен выполняться во всех учреждениях страны»."
 ve_cul_evt.150.a:0 "Финансирование комиссий по реализации."
 ve_cul_evt.150.a.tt:0 "Расходы #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!."
 ve_cul_evt.150.b:0 "Используйте постепенное расписание."
 ve_cul_evt.150.b.tt:0 "Прогресс культурного проекта уменьшается на #N 4.#!.\nНациональная сплоченность увеличивается на #P 2#!."
 ve_cul_evt.150.c:0 "Стандартизировать существующую администрацию."
 ve_cul_evt.150.c.tt:0 "Потратить #N 5#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 3#!.\nНациональная сплоченность увеличивается на #P 2#!."

 ve_cul_evt.151.t:0 "Язык обучения"
 ve_cul_evt.151.d:0 "Национальная учебная программа требует общего языка обучения, однако школы по всей стране обслуживают сообщества с очень разными языковыми традициями. Многоязычные материалы сохранят доверие, но задержат распространение, в то время как единая учебная программа может быстро дойти до классов, рискуя превратить образование в культурное соревнование."
 ve_cul_evt.151.f:0 "«Урок, преподанный на языке, которому ученик не доверяет, может запомниться всем, кроме его предмета»."
 ve_cul_evt.151.a:0 "Финансируйте многоязычные материалы."
 ve_cul_evt.151.a.tt:0 "Потратить #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на  #P 3#!.\nНациональная сплоченность увеличивается на  #P 3#!."
 ve_cul_evt.151.b:0 "Примените одну национальную учебную программу."
 ve_cul_evt.151.b.tt:0 "Прогресс культурного проекта увеличивается на #P 6#!.\nНациональная сплоченность уменьшается на #N 3#!."
 ve_cul_evt.151.c:0 "Объедините сети обучения и социального обеспечения."
 ve_cul_evt.151.c.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 5#!.\nНациональная сплоченность увеличивается на #P 2#!."

 ve_cul_evt.160.t:0 "Кто представляет нацию?"
 ve_cul_evt.160.d:0 "Проект «Общие символы» вновь открыл вопрос о том, чья история, униформа, памятники и церемонии могут представлять собой всю страну. Смена традиций расширит признание, но замедлит достижение соглашения; выбор одного официального повествования создаст ясность, в то время как многие граждане останутся за его пределами."
 ve_cul_evt.160.f:0 "\\"Символ становится национальным только тогда, когда граждане видят себя в нем, не нуждаясь в объяснении.\\""
 ve_cul_evt.160.a:0 "Вращайте символы в публичном использовании."
 ve_cul_evt.160.a.tt:0 "Прогресс культурного проекта уменьшается на #N 3#!.\nНациональная сплоченность увеличивается на #P 4#!."
 ve_cul_evt.160.b:0 "Выберите одну официальную повествование."
 ve_cul_evt.160.b.tt:0 "Прогресс культурного проекта увеличивается на #P 6#!.\nНациональная сплоченность уменьшается на  #N 3#!."
 ve_cul_evt.160.c:0 "Разработайте общую публичную церемонию."
 ve_cul_evt.160.c.tt:0 "Потратьте #N 10#! Культурный мандат.\nПрогресс культурного проекта увеличивается на #P 4#!.\nНациональная сплоченность увеличивается на #P 2#!."
