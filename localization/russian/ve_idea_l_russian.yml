 SOC_HEADER:0 "Общество"
 PROD_HEADER:0 "Производство"
 MIL_HEADER:0 "Армия и флот"
 ve_national_ideas:0 " Национальные идеи"
 ve_idea_points:0 "#tooltippable_name Национальный опыт"
 ve_national_insight_tt:0 "#header Национальный опыт#!\nЗапас: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nВ этом месяце: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nСостояние приобретения: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Эффекты#!\nНациональный опыт расходуется на приобретение отдельных идей в рамках принятой группы идей. Каждая активная покупка продвигает национальные идеи и вносит вклад в текущие инвестиции в доктрины; достижение инвестиционной вехи навсегда дает потенциал группы.\n\n#title Причины изменения ежемесячного прироста#!\nБазовое значение: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nГрамотность: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nШколы: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nУниверситеты: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nИнтеллигенция: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nДолг, беспорядки и внедрение: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Давление на запас#!\nМножитель дохода: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nДоход сокращается вдвое при #Y 750#!, падает до четверти при #Y 900#! и прекращается при #Y 1000#!. Трата опыта до достижения предельного запаса предотвращает потерю дохода."
 ve_national_insight_implementation_strain:0 "Нагрузка от внедрения доктрины"
 ve_national_insight_implementation_strain_desc:0 "Администрация адаптирует институты и процедуры к недавно принятой национальной доктрине. Невозможно принять другую идею группы, пока не завершится этот 24-месячный цикл внедрения."
 ve_total_ideas:0 "Группы идей"
 ve_traditions:0 "#tooltippable_concept Традиции: "
 ve_bonus:0 "#tooltippable_concept Бонус: "
 ve_ambition:0 "Стремление"
 ve_ambition_tooltip:0 "#Y Стремление#!\n#P Постоянная завершающая награда#!\nОткрывается автоматически, когда все семь идей в этой группе приняты."
 ve_idea_cancel_warning:0 "#header Отменить [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Каждый действующий модификатор идеи в этой группе будет удален.#!\n#N Модификатор стремления также будет удален, если он был разблокирован.#!\n\nПотраченный национальный опыт не возвращается.\nВозвращено национального опыта: #Y 0#!\n\n#title Эффекты, которые будут удалены#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Подтвердить: отменить эту группу идей.#! Прогресс и модификаторы будут утеряны, национальный опыт не возвращается."
 ve_idea_cancel_keep_tt:0 "Сохранить эту группу идей — не отменять."
 ve_embrace:0 "Принять"
 ve_idea_locked:0 "Путь закрыт"
 ve_idea_locked_tt:0 "#N Эта группа идей взаимоисключающа с той, которую вы уже приняли. Отмените ту группу, чтобы открыть этот путь."
 ve_idea_age_locked:0 "Требуется технология"
 ve_idea_age_locked_tt:0 "#N Эта группа идей требует технологию, которая еще не изучена."
 ve_idea_labour_technology_locked_tt:0 "#N Требуется технология: [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Требуется технология: [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Требуется технология: [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Требуется технология: [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Требуется технология: [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Требуется технология: [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Требуется технология: [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Развить идею"
 ve_boost_idea_tt:0 "#header Принять следующую идею#!\nНациональный опыт: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nСостояние приобретения: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Стоимость следующего уровня#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nИспользуйте стоимость, соответствующую следующему незаполненному уровню в этой группе.\n\n#title Что происходит при покупке#!\n#P Следующий модификатор в этой группе становится активным.#!\n#P Инвестиции в доктрины и прогресс национальных идей увеличиваются на 1 каждый.#!\n#N Начинается 24-месячный цикл внедрения доктрины. Во время него нельзя купить другую идею группы.#!\n\n#title Почему кнопка может быть неактивна?#!\nОпыта недостаточно для оплаты следующего уровня; активно внедрение доктрины; группа полностью заполнена; либо следующий уровень требует неизученной технологии.\n\nОтмена этой группы удаляет ее модификаторы и текущий прогресс. Потраченный опыт никогда не возвращается, но слот группы, уже полученный за веху, не отбирается."
