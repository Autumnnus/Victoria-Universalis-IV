l_russian:
 SOC_HEADER:0 "Идеи общества"
 PROD_HEADER:0 "Производственные идеи"
 MIL_HEADER:0 "Военные идеи"
 ve_national_ideas:0 " Национальные идеи"
 ve_idea_points:0 "#tooltippable_name Национальный взгляд"
 ve_national_insight_tt:0 "#header National Insight#!\nЗапасы: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nВ этом месяце: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nСтатус покупки: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Чем занимается#!\nNational Insight покупает отдельные идеи внутри объединенной группы идей. Каждая активная покупка продвигает национальные идеи и увеличивает текущие инвестиции в доктрину; достижение инвестиционной вехи навсегда увеличивает потенциал группы.\n\n#title Почему меняется ежемесячный доход#!\nБаза: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nГрамотность: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nШколы: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nУниверситеты: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nАдминистрация: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nЛегитимность: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nИнтеллигенция: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nДолги, беспорядки и реализация: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Давление на акции#!\nМножитель дохода: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nДоход сокращается вдвое при  #Y 750#!, падает до одной четверти при #Y 900#! и останавливается на #Y 1000#!. Расходы до ограничения запасов предотвращают потерю дохода."
 ve_national_insight_implementation_strain:0 "Напряженность реализации доктрины"
 ve_national_insight_implementation_strain_desc:0 "Администрация адаптирует институты и процедуры к недавно принятой национальной доктрине. Другая групповая идея не может быть принята до окончания 24-месячного цикла реализации."
 ve_total_ideas:0 "Группы идей"
 ve_traditions:0 "#tooltippable_concept Традиции: "
 ve_bonus:0 "#tooltippable_concept Бонус: "
 ve_ambition:0 "Амбиции"
 ve_ambition_tooltip:0 "#Y Амбиции#!\n#P Постоянная награда за ключевой камень#!\nРазблокируется автоматически, когда все семь идей в этой группе будут приняты."
 ve_idea_cancel_warning:0 "#header Отмена [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Все активные модификаторы идей в этой группе будут удалены.#!\n#N Его модификатор амбиций также будет удален, если он был разблокирован.#!\n\nПотраченное National Insight не возвращается.\nNational Insight возвращено: #Y 0#!\n\n#title Эффекты, которые будут удалены#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Подтвердите: отменить эту идею группа.#! Прогресс и модификаторы теряются, средства National Insight не возвращаются."
 ve_idea_cancel_keep_tt:0 "Сохраните эту группу идей – не отменяйте."
 ve_embrace:0 "Объятия"
 ve_idea_locked:0 "Путь закрыт"
 ve_idea_locked_tt:0 "#N Эта группа идей является взаимоисключающей с той, которую вы уже приняли. Отмените эту группу, чтобы открыть этот путь."
 ve_idea_age_locked:0 "Требуемая технология"
 ve_idea_age_locked_tt:0 "#N Эта группа идей требует технологии, которая еще не исследована."
 ve_idea_labour_technology_locked_tt:0 "#N Требуется [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Требуется [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Требуется [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Требуется [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Требуется [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Требуется [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Требуется [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Усилить идею"
 ve_boost_idea_tt:0 "#header Принять следующую идею#!\nNational Insight: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nСтатус покупки: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Стоимость следующего уровня#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nИспользуйте стоимость, соответствующую следующему незаполненному уровню в этой группе.\n\n#title Что происходит при покупке#!\n#P Следующий модификатор в этой группе становится активным.#!\n#P Прогресс инвестиций в доктрину и национальной идеи увеличивается на 1.#!\n#N Начинается 24-месячный цикл реализации доктрины. Во время него нельзя купить другую групповую идею.#!\n\n#title Почему кнопку можно отключить?#!\nИнсайт ниже стоимости следующего уровня; Реализация доктрины активна; группа укомплектована; или следующий уровень требует неисследованной технологии.\n\nОтмена этой группы удаляет ее модификаторы идеи и текущий прогресс. Потраченное Insight никогда не возвращается, но групповой слот, уже заработанный за достижение этой вехи, никогда не отзывается."
