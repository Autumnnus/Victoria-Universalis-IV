 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Религиозное усердие в месяц#! при конфессиональном государстве или государственном атеизме, а также #P +1 Культурный мандат в месяц#! при этнической нации."
 nationalist_idea_7_tt:0 "#P +1 к прогрессу религиозного проекта в месяц#! при конфессиональном государстве или государственном атеизме; #P +1 к прогрессу культурного проекта в месяц#! при этнической нации; результаты принудительной религиозной и этнической интеграции улучшаются с #Y 5%#! до #Y 7%#!."
 embrace_idea_tt:0 "#header Вместимость групп идей#!\nЗанятые ячейки: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nСвободные ячейки: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nТекущие инвестиции в доктрины: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! активных приобретенных идей\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Как работает вместимость#!\nКаждая активная приобретенная идея группы дает #P +1#! к инвестициям в доктрины. Достижение #Y 4, 8, 13, 19, 26#! или #Y 34#! навсегда добавляет одну ячейку группы. Для ячеек 5–6 также требуется эпоха 2; для ячейки 7 требуется эпоха 3.\n\n#title Принятие и отмена#!\nПринятие группы не требует понимания, но занимает одну свободную ячейку. Отмена освобождает эту ячейку, удаляет модификаторы группы и снижает текущие инвестиции в доктрины; потраченное понимание не возвращается. Любая уже полученная ячейка вместимости остается доступной навсегда."
 ve_idea_capacity_player_progress:0 "#title Следующая постоянная ячейка#!\nЯчейка: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nПрогресс: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! приобретенных идей\nОсталось собрать: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Следующая постоянная ячейка#!\nЯчейка: #Y 5#!\nПрогресс: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! приобретенных идей\nОсталось собрать: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nТребование эпохи: #N Ожидание эпохи 2#!"
 ve_idea_capacity_player_age_3:0 "#title Следующая постоянная ячейка#!\nЯчейка: #Y 7#!\nПрогресс: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! приобретенных идей\nОсталось собрать: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nТребование эпохи: #N Ожидание эпохи 3#!"
 ve_idea_capacity_player_max:0 "#P Достигнута максимальная вместимость: доступны все 7 постоянных ячеек групп.#!"
 ve_idea_capacity_country_progress:0 "#title Следующая постоянная ячейка#!\nЯчейка: #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nПрогресс: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! приобретенных идей\nОсталось собрать: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title Следующая постоянная ячейка#!\nЯчейка: #Y 5#!\nПрогресс: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! приобретенных идей\nОсталось собрать: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nТребование эпохи: #N Ожидание эпохи 2#!"
 ve_idea_capacity_country_age_3:0 "#title Следующая постоянная ячейка#!\nЯчейка: #Y 7#!\nПрогресс: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! приобретенных идей\nОсталось собрать: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nТребование эпохи: #N Ожидание эпохи 3#!"
 ve_idea_capacity_country_max:0 "#P Достигнута максимальная вместимость: доступны все 7 постоянных ячеек групп.#!"
 ve_idea_implementation_player_ready:0 "#P Готово — можно принять новую идею, когда накопится достаточно понимания.#!"
 ve_idea_implementation_player_locked:0 "#N Идет внедрение — до принятия следующей идеи осталось: [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')].#!"
 ve_idea_era_momentum_age_1_tt:0 "#P В течение эпохи 1: +1 дыхание эпохи в месяц#! от этой группы идей уровня IV. Вклад группы идей ограничен значением #Y +2#!."
 ve_idea_era_momentum_age_2_tt:0 "#P В течение эпохи 2: +1 дыхание эпохи в месяц#! от этой группы идей уровня IV. Вклад группы идей ограничен значением #Y +2#!."
 ve_idea_era_momentum_age_3_tt:0 "#P В течение эпохи 3: +1 дыхание эпохи в месяц#! от этой группы идей уровня IV. Вклад группы идей ограничен значением #Y +2#!."
 reformist_idea_5_system_tt:0 "#P +1 Религиозное усердие в месяц#! при свободе совести или полном отделении, а также #P +1 Культурный мандат в месяц#! при гражданской нации или составном государстве."
 reformist_idea_7_system_tt:0 "#P +1 к прогрессу религиозного проекта в месяц#! при свободе совести и #P +1 к прогрессу культурного проекта в месяц#! при гражданской нации или составном государстве."
 academic_idea_5_system_tt:0 "#P +1 Культурный мандат в месяц#! при гражданской нации."
 academic_idea_7_system_tt:0 "#P +1 к прогрессу религиозного проекта в месяц#! при государственном атеизме и #P +1 к прогрессу культурного проекта в месяц#! при гражданской нации."
 welfare_idea_6_system_tt:0 "#P +1#! Прогресс культурного проекта в месяц в Гражданской нации."
 diplomatic_idea_6_system_tt:0 "#P +1#! Прогресс культурного проекта в месяц в Составном государстве."
