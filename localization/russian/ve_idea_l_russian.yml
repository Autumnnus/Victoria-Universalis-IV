 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 реформа благочестия/месяц#! в конфессиональном или государственном атеизме и  #P +1 культурный мандат в месяц#! в «Этнической нации»."
 nationalist_idea_7_tt:0 "#P +1 прогресс религиозного проекта/месяц#! в конфессиональном или государственном атеизме; #P +1 прогресс культурного проекта/месяц#! в этнической нации; принудительная религиозная и этническая интеграция улучшаются с #Y 5%#! к #Y 7%#!."
 embrace_idea_tt:0 "#header Вместимость группы идей#!\nИспользованные слоты: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nСвободные слоты сейчас: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nТекущая доктрина Инвестиции: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! активные купленные идеи\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Как работает мощность#!\nКаждая активная купленная групповая идея обеспечивает #P +1#! Доктрина Инвестиции. Достижение #Y 4, 8, 13, 19, 26#! или  #Y 34#! навсегда добавляет один групповой слот. Для слотов 5–6 также требуется возраст 2; для слота 7 требуется возраст 3.\n\n#title Принятие и отмена#!\nПрисоединение к группе не требует проницательности, но занимает один свободный слот. Отмена освобождает этот слот, удаляет модификаторы группы и снижает текущие инвестиции в доктрину; потраченный Инсайт не возвращается. Любой уже заработанный слот мощности остается доступным постоянно."
 ve_idea_capacity_player_progress:0 "#title Следующий постоянный слот#!\nСлот: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nПрогресс: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! купленные идеи\nВсе еще необходимо: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Следующий постоянный слот#!\nСлот: #Y 5#!\nПрогресс: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! купленных идей\nВсе еще необходимо: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nВозраст требование: #N Ожидание возраста 2#!"
 ve_idea_capacity_player_age_3:0 "#title Следующий постоянный слот#!\nСлот: #Y 7#!\nПрогресс: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! купленных идеи\nВсе еще необходимо: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nТребование к возрасту: #N В ожидании возраста 3#!"
 ve_idea_capacity_player_max:0 "#P Максимальная вместимость достигнута: доступны все 7 постоянных групповых слотов.#!"
 ve_idea_capacity_country_progress:0 "#title Следующий постоянный слот#!\nСлот: #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nПрогресс: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! куплено идеи\nВсе еще необходимо: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title Следующий постоянный слот#!\nСлот: #Y 5#!\nПрогресс: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! купленных идей\nВсе еще необходимо: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nВозрастное требование: #N Ожидание возраста 2#!"
 ve_idea_capacity_country_age_3:0 "#title Следующий постоянный слот#!\nСлот: #Y 7#!\nПрогресс: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! купленных идеи\nВсе еще необходимо: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nВозрастное требование: #N Ожидание 3 лет#!"
 ve_idea_capacity_country_max:0 "#P Достигнута максимальная вместимость: доступны все 7 постоянных групповых слотов.#!"
 ve_idea_implementation_player_ready:0 "#P Готово — другая идея может быть принята, когда будет доступно достаточно Проницательности.#!"
 ve_idea_implementation_player_locked:0 "#N Идет реализация – [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] остается до того, как может быть принята другая идея.#!"
 ve_idea_era_momentum_age_1_tt:0 "#P В эпоху 1: +1 Импульс Эры/месяц#! от этой Группы идей уровня IV. Вклад Группы идей ограничен  #Y +2#!."
 ve_idea_era_momentum_age_2_tt:0 "#P В течение Эпохи 2: +1 Импульс Эры/месяц#! от этой Группы идей уровня IV. Вклад Группы идей ограничен  #Y +2#!."
 ve_idea_era_momentum_age_3_tt:0 "#P В течение Эпохи 3: +1 Импульс Эры/месяц#! от этой Группы идей уровня IV. Вклад Idea Group ограничен #Y +2#!."
 reformist_idea_5_system_tt:0 "#P +1 Реформа благочестия/месяц#! в Свободе совести или полном отделении и #P +1 Культурный мандат/месяц#! в Гражданской нации или Составном государстве."
 reformist_idea_7_system_tt:0 "#P +1 Прогресс религиозного проекта/месяц.#! в свободе совести и #P +1 прогресс культурного проекта/месяц#! в гражданской нации или составном государстве."
 academic_idea_5_system_tt:0 "#P +1 культурный мандат/месяц#! в Civic Nation."
 academic_idea_7_system_tt:0 "#P +1 прогресс религиозного проекта/месяц#! в государственном атеизме и #P +1 прогресс культурного проекта/месяц#! в Civic Nation."
 welfare_idea_6_system_tt:0 "#P +1 прогресс культурного проекта/месяц#! в Гражданской Нации."
 diplomatic_idea_6_system_tt:0 "#P +1 прогресс культурного проекта в месяц#! в составном государстве."
