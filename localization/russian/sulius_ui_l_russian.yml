l_russian:
 SULIUS_LEGITIMACY_LEVEL_ACTIVE_TOOLTIP:0 "#tooltip_header [concept_legitimacy] \n[LegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\n$LEGITIMACY_LEVEL_BOUNDS_DESC$\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\nЭффекты:#indent_newline:2 \n[LegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\nПричины:#indent_newline:2 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 SULIUS_CAPITAL_MONEY:0 "#tooltip_header [concept_money]#!\nБаланс: #variable @money![AccessPlayer.PredictWeeklyBalance|D=+]#![GetPlayer.GetPowerDeltaIcon('money')]\n[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.GetPrincipal, '(CFixedPoint)0'), 'CREDIT_DESC', 'GOLD_RESERVES_DESC')]\nПредел золотого резерва: @money![GetPlayer.GetGoldReserveLimit|Dv]#!#![SelectLocalization(GetMetaPlayer.GetPlayedOrObservedCountry.IsValid, 'CAPITAL_MONEY_DELAYED', 'OBSERVER_NO_COUNTRY_SELECTED') ]"
 
 SULIUS_RESEARCH:0 "#tooltip_header [concept_technology]#!\n[SelectLocalization( GetPlayer.GetCurrentlyResearchedTechnology.IsValid, 'SULIUS_RESEARCHING', 'SULIUS_NOT_RESEARCHING' )]\n$TOOLTIP_DELIMITER$\n#V Прогресс технологии#!\n#help От [concept_innovation]: @innovation![GetPlayer.GetWeeklyInnovation|+0]\nОт [concept_technology_spread]: [GetPlayer.GetWeeklyTechnologySpreadForTechDesc(GetPlayer.GetCurrentlyResearchedTechnology.Self)]\n$TOOLTIP_DELIMITER$\n#V [concept_innovation]#!\nМы производим #v @innovation![GetPlayer.GetWeeklyInnovation|+2]#! [concept_innovation] каждую неделю:\n[GetPlayer.GetWeeklyInnovationDesc]\n\nМаксимум @innovation![GetPlayer.GetWeeklyMaxInnovation|v2] [concept_innovation] может еженедельно направляться на активные исследования:\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\nЛюбые [concept_innovation], не использованные из-за ограничений вложений или отсутствия активных исследований, ускорят [concept_technology_spread] в нашей стране"
 SULIUS_RESEARCHING:0 "[GetPlayer.GetName] в настоящее время исследует [GetPlayer.GetCurrentlyResearchedTechnology.GetName]#!\nПрогресс: #v @innovation! [GetPlayer.GetCurrentlyResearchedTechnology.GetProgress(GetPlayer.Self)|D]#! / #maximum [GetPlayer.GetCurrentlyResearchedTechnology.GetCost(GetPlayer.Self)|D]#! (осталось: [GetPlayer.GetCurrentlyResearchedTechnology.GetTimeLeftDesc( GetPlayer.Self )])"
 SULIUS_NOT_RESEARCHING:0 "[GetPlayer.GetName] в данный момент ничего не исследует."
