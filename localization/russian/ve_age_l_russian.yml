l_russian:
 ve_splendor:0 "#tooltippable_name Импульс эпохи: "
 ve_age_of_victoria_title:0 "Промышленность и нации"
 ve_age_of_victoria_desc:0 "Старые порядки противостоят фабрикам, железным дорогам, грамотному населению и современному государству. Импульс принадлежит странам, которые превращают унаследованные институты в прочный национальный потенциал."
 ve_imperialism_age_title:0 "Империя и массовое общество"
 ve_imperialism_age_desc:0 "Промышленность охватывает все континенты, а образование, государственные институты и организованные армии меняют массовое общество. Великие державы могут расширяться за границу; меньшие государства могут процветать благодаря суверенитету и внутреннему развитию."
 ve_great_wars_age_title:0 "Массовая политика и тотальная война"
 ve_great_wars_age_desc:0 "Электричество, нефть, массовое участие, социальное обеспечение и промышленная война меняют отношения между государством и обществом. Выживание теперь зависит не только от армий, но и от институтов."
 ve_age_notify_option:0 "Наступает новая эра."
 ve_victorian_age_icon_p_tt:0 "#P Промышленность и нации (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Промышленность и нации (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Империя и массовое общество (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Империя и массовое общество (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Массовая политика и тотальная война (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Массовая политика и тотальная война (1906–1936)"

 ve_golden_age:0 "Золотой век"
 ve_golden_age_industrial:0 "Золотой век промышленности"
 ve_golden_age_cultural:0 "Золотой век культуры"
 ve_golden_age_strategic:0 "Стратегический золотой век"
 ve_golden_age_tt:0 "Доступно на сайте #v 1845 г.#! после завершения #v 5 различных целей#! в нынешнюю эпоху. Страна может выбрать только один Золотой век за всю игру; его эффект длится #v 15 лет#!."
 ve_golden_age_requirement_unused:0 "Во время этой кампании не был выбран Золотой век."
 ve_golden_age_requirement_year:0 "Требуется год #v 1845#!  или позже."
 ve_golden_age_requirement_objectives:0 "Выполните не менее #v 5 различных задач#!  в текущем веке."
 ve_golden_age_industrial_tt:0 "#header Промышленный золотой век#!\nНа #Y 15 лет#!: #P +10% производительности#! и #P +10% ресурсов Шанс открытия#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Золотой век культуры#!\nНа #Y 15 лет#!: #P +5% Доступ к образованию#! и #P +10% престижа#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Стратегический золотой век#!\nНа #Y 15 лет#!: #P +5% атаки армии#! и #P -10% военного истощения от потерь#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Цели эпохи"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Промышленный взлет"
 ve_victorian_age_obj_desc_1:0 "Снизить долю крестьян ниже 40%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Конец старому Приказ"
 ve_victorian_age_obj_desc_2:0 "Запретить рабство и отменить крепостное право."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Функциональное государство"
 ve_victorian_age_obj_desc_3:0 "Поддерживать легитимность не менее 70 и неотрицательный баланс бюрократии без приближающегося дефицита."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Образованная публика"
 ve_victorian_age_obj_desc_4:0 "Достичь 50% грамотности или школ 3-го уровня."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Интегрированный рынок"
 ve_victorian_age_obj_desc_5:0 "Владеть не менее 3 уровнями железных дорог, если население ниже 5 миллионов, или 6 уровнями железных дорог в противном случае."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Национальное пробуждение"
 ve_victorian_age_obj_desc_6:0 "Будьте независимыми, имея по крайней мере 65 легитимности и менее 5% беспорядков в стране."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Глобальный охват"
 ve_victorian_age_obj_desc_7:0 "Будьте великой или великой державой или поддерживайте как минимум 5 заявленных интересов."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Промышленная держава"
 ve_imperialism_age_obj_desc_1:0 "Достигните 100 миллионов фунтов стерлингов ВВП или сократите долю крестьян ниже 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Массовое образование"
 ve_imperialism_age_obj_desc_2:0 "Достигните 65% грамотности или уровня 4. Школы."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Империя или суверенитет"
 ve_imperialism_age_obj_desc_3:0 "Имейте как минимум 2 субъекта или оставайтесь независимыми и признанными."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Глобальная торговля"
 ve_imperialism_age_obj_desc_4:0 "Владите 2 уровнями портов, если население ниже 10 миллионов, в противном случае владейте 10 уровнями портов или поддерживайте 5 заявленных интересов."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Строительство нации"
 ve_imperialism_age_obj_desc_5:0 "Поддерживайте легитимность не менее 60 и менее 5% беспорядков в стране."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header Социальный вопрос"
 ve_imperialism_age_obj_desc_6:0 "Поднимите здоровье Система, безопасность на рабочем месте или социальное обеспечение до уровня 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Современные вооруженные силы"
 ve_imperialism_age_obj_desc_7:0 "Имейте в армии не менее 50% стрелковой или траншейной пехоты и 10% мобильной артиллерии."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Массовая политика"
 ve_great_wars_age_obj_desc_1:0 "Введите всеобщее избирательное право или советскую республику или поддержите 75 легитимность в качестве парламентской или президентской республики."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Социальное государство"
 ve_great_wars_age_obj_desc_2:0 "Поддерживайте как минимум два учреждения уровня 3 среди здравоохранения, социального обеспечения Безопасность, безопасность на рабочем месте и школы."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Электрифицированная экономика"
 ve_great_wars_age_obj_desc_3:0 "Владеть 1 уровнем электростанции, если население ниже 10 миллионов, или 5 уровнями электростанции в противном случае."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Нефть и двигатели"
 ve_great_wars_age_obj_desc_4:0 "Владеть нефтяной вышкой или не менее 5 уровней автомобильной промышленности."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Современные военные"
 ve_great_wars_age_obj_desc_5:0 "Полевые войска должны содержать не менее 50% траншейной или отрядной пехоты и 15% шрапнельной артиллерии."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Общая военная мощь"
 ve_great_wars_age_obj_desc_6:0 "Поддерживать 40 армейских подразделений и не менее 5 оружейной промышленности или 3 уровня завода по производству боеприпасов."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Мировое влияние"
 ve_great_wars_age_obj_desc_7:0 "Будьте великой или великой державой, возглавьте силовой блок или поддерживайте как минимум 6 заявленных интересов."

 ve_age_splendor_tt:0 "#title Импульс эпохи#!\nТекущий запас: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nВыполненные цели: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nГруппы идей (текущий возраст, максимум +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nЕжемесячное изменение: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nВыполнены отдельные цели в этом возраст: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nНаграды, приобретенные в этом возрасте: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nСтоимость следующего вознаграждения: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Как вносят вклад группы идей#!\nЛюбая соответствующая группа уровня IV дает #P +1#! в месяц только до тех пор, пока назначенный ей возраст является текущим. В строке выше показано активное общее количество, ограниченное  #Y +2#!.\n#P Эпоха 1#!: промышленность, торговля, администрация и академические группы.\n#P Эпоха 2#!: ресурсы, общество, дипломатия, националистические/реформистские и колониальные группы.\n#P Возраст 3#!: военные и группы военной экономики.\n\nКаждая выполненная на данный момент цель также дает  #P +1.#! Эра Импульс в месяц. Группы идей не изменяют завершение задачи или ее единовременную  #P +50#! вознаграждение.\n\nСтоимость вознаграждения увеличивается с каждой эпохой:  #Y 200, 300, 400, 500.#!, затем #Y 600#! за каждую последующую награду. Импульс и лестница затрат обнуляются, когда начинается новая эпоха."
 ve_age_obj_efct_tt:0 "При удовлетворении: #P +1 Импульс Эры в месяц#!\nПервое прохождение в этом возрасте: #P +50 Импульс Эры#!"
 splendor_default_bonus:0 "Иметь как минимум #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Era Momentum"
 ve_age_1_bonus_10_tt:0 "Требуется североитальянская или южноитальянская основная культура."
 ve_age_2_bonus_10_tt:0 "Требуется Австрия."
 ve_age_3_bonus_10_tt:0 "Требуется Великобритания."
 ve_age_1_bonus_11_tt:0 "Требуется северогерманская или южногерманская первичная культура."
 ve_age_2_bonus_11_tt:0 "Требуется Россия."
 ve_age_3_bonus_11_tt:0 "Требуется Цин."
 ve_age_1_bonus_12_tt:0 "Требуются Нидерланды."
 ve_age_2_bonus_12_tt:0 "Требуется Бельгия."
 ve_age_3_bonus_12_tt:0 "Требуется Франция."
 ve_age_1_bonus_13_tt:0 "Требуется Османская империя."
 ve_age_2_bonus_13_tt:0 "Требуются Соединенные Штаты."
 ve_age_3_bonus_13_tt:0 "Требуется Япония."
