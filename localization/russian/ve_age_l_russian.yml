l_russian:
 ve_splendor:0 "#tooltippable_name Дыхание эпохи: "
 ve_age_of_victoria_title:0 "Промышленность и нации"
 ve_age_of_victoria_desc:0 "Старые порядки сталкиваются с фабриками, железными дорогами, грамотной публикой и современным государством. Мотивация принадлежит тем странам, что претворяют унаследованные институты в прочный национальный потенциал."
 ve_imperialism_age_title:0 "Империи и массовое общество"
 ve_imperialism_age_desc:0 "Промышленность простирается через континенты, в то время как образование, общественные институты и организованные армии преобразуют массовое общество. Великие державы могут расширять владения за рубежом; государства поменьше способны процветать через суверенитет и внутреннее развитие."
 ve_great_wars_age_title:0 "Массовая политика и тотальная война"
 ve_great_wars_age_desc:0 "Электричество, ГСМ, массовое участие, социальная и индустриальная война меняют взаимоотношения между государством и обществом. Выживание отныне зависит от институтов не в меньшей мере, чем от армий."
 ve_age_notify_option:0 "Наступает новая эпоха."
 ve_victorian_age_icon_p_tt:0 "#P Промышленность и нации (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Промышленность и нации (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Империи и массовое общество (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Империи и массовое общество (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Массовая политика и тотальная война (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Массовая политика и тотальная война (1906–1936)"

 ve_golden_age:0 "Золотой век"
 ve_golden_age_industrial:0 "Промышленный золотой век"
 ve_golden_age_cultural:0 "Культурный золотой век"
 ve_golden_age_strategic:0 "Стратегический золотой век"
 ve_golden_age_tt:0 "Доступно с #v 1845#! после выполнения #v 5 различных целей#! в текущей эпохе. Страна может выбрать лишь один Золотой век за всю игру; его эффекты длятся #v 15 лет#!."
 ve_golden_age_requirement_unused:0 "В ходе этой кампании еще не был выбран Золотой век."
 ve_golden_age_requirement_year:0 "Требуется 1845 #v год#! или более поздний."
 ve_golden_age_requirement_objectives:0 "Выполните по меньшей мере #v 5 различных целей#! в текущей эпохе."
 ve_golden_age_industrial_tt:0 "#header Промышленный золотой век#!\nВ течение #Y 15 лет#!: #P +10% к товарообороту мануфактур#! и #P +10% к шансу обнаружения ресурсов#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Культурный золотой век#!\nВ течение #Y 15 лет#!: #P +5% к доступности образования#! и #P +10% к престижу#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Стратегический золотой век#!\nВ течение #Y 15 лет#!: #P +5% к армии атака#! и #P -10% к утомлению войной от потерь#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Цели эпохи"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Промышленный взлет"
 ve_victorian_age_obj_desc_1:0 "Снизить долю крестьян ниже 40%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Конец старому порядку"
 ve_victorian_age_obj_desc_2:0 "Запретить рабство и отменить крепостное право."
 ve_victorian_age_obj_title_3:0 "#tooltip_header Функциональное государство"
 ve_victorian_age_obj_desc_3:0 "Поддерживать по меньшей мере 70 легитимность и неотрицательный баланс бюрократии без надвигающегося дефицита."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Образованная публика"
 ve_victorian_age_obj_desc_4:0 "Достичь 50% грамотности или 3 уровня школ."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Интегрированный рынок"
 ve_victorian_age_obj_desc_5:0 "Владеть как минимум 3 уровнями железных дорог при населении менее 5 миллионов или 6 уровнями железных дорог в ином случае."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Национальное пробуждение"
 ve_victorian_age_obj_desc_6:0 "Быть независимым государством с легитимностью не менее 65 и беспорядками в стране менее 5%."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Глобальный охват"
 ve_victorian_age_obj_desc_7:0 "Быть великой или крупной державой либо поддерживать по меньшей мере 5 заявленных интересов."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Промышленная мощь"
 ve_imperialism_age_obj_desc_1:0 "Достигните ВВП в £100 млн или сократите долю крестьянства ниже 25%."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Массовое образование"
 ve_imperialism_age_obj_desc_2:0 "Достигните 65% грамотности или 4-го уровня школ."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Империя или суверенитет"
 ve_imperialism_age_obj_desc_3:0 "Имейте не менее 2 субъектов либо оставайтесь независимыми и признанными."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Мировая торговля"
 ve_imperialism_age_obj_desc_4:0 "Владейте 2 уровнями портов при населении менее 10 млн, 10 уровнями портов в ином случае либо поддерживайте 5 объявленных интересов."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Создание нации"
 ve_imperialism_age_obj_desc_5:0 "Поддерживайте легитимность не менее 60 и беспорядки в стране менее 5%."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header Рабочий вопрос"
 ve_imperialism_age_obj_desc_6:0 "Повысьте систему здравоохранения, безопасность труда или социальную защиту до 2-го уровня."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Современные вооруженные силы"
 ve_imperialism_age_obj_desc_7:0 "Сформируйте в армии не менее 50% пехоты в рассыпном строю или окопной пехоты и 10% мобильной артиллерии."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Массовая политика"
 ve_great_wars_age_obj_desc_1:0 "Принять всеобщее избирательное право или советскую республику либо поддерживать легитимность 75 в качестве парламентской или президентской республики."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header Социальное государство"
 ve_great_wars_age_obj_desc_2:0 "Поддерживайте по меньшей мере два института 3-го уровня среди здравоохранения, социальной защиты, безопасности труда и школ."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Электрифицированная экономика"
 ve_great_wars_age_obj_desc_3:0 "Владейте 1 уровнем электростанции при населении менее 10 млн либо 5 уровнями электростанций в ином случае."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Нефть и двигатели"
 ve_great_wars_age_obj_desc_4:0 "Владейте нефтяной вышкой или не менее чем 5 уровнями индустрии моторов."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Современная армия"
 ve_great_wars_age_obj_desc_5:0 "Сформируйте в армии не менее 50% окопной или штурмовой пехоты и 15% шрапнельной артиллерии."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Потенциал тотальной войны"
 ve_great_wars_age_obj_desc_6:0 "Поддерживайте 40 армейских единиц и не менее 5 уровней заводов стрелкового оружия или 3 уровней заводов боеприпасов."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Мировое влияние"
 ve_great_wars_age_obj_desc_7:0 "Будьте великой или державой-покровительницей, возглавляйте блок государств или поддерживайте не менее 6 объявленных интересов."

 ve_age_splendor_tt:0 "#title Дыхание эпохи#!\nТекущий запас: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nВыполненные цели: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nГруппы идей (текущая эпоха, макс. +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nЕжемесячное изменение: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nЗавершенные уникальные цели в эту эпоху: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nНаграды, приобретенные в эту эпоху: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nСтоимость следующей награды: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Как группы идей влияют на это#!\nЛюбая подходящая группа уровня IV дает #P +1#! в месяц только тогда, когда активна соотнесенная с ней эпоха. В строке выше показан активный итог, ограниченный максимум #Y +2#!.\n#P Эпоха 1#!: промышленность, торговля, административные и академические группы\n#P Эпоха 2#!: ресурсы, общество, дипломатия, национальные/реформистские и колониальные группы\n#P Эпоха 3#!: армия и флот и военно-промышленные группы\n\nКаждая из текущих удовлетворенных целей также приносит #P +1#! дыхания эпохи в месяц. Группы идей не изменяют выполнение целей или их единовременную награду в #P +50#!.\n\nСтоимость наград растет в ходе каждой эпохи: #Y 200, 300, 400, 500#!, а затем #Y 600#! для каждой последующей награды. Мотивация и шкала стоимости сбрасываются при начале новой эпохи."
 ve_age_obj_efct_tt:0 "Пока выполнены: #P +1 дыхания эпохи в месяц#!\nПервое завершение в эту эпоху: #P +50 дыхания эпохи#!"
 splendor_default_bonus:0 "Имейте не менее #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! дыхания эпохи"
 ve_age_1_bonus_10_tt:0 "Требуется североитальянская или южноитальянская основная культура."
 ve_age_2_bonus_10_tt:0 "Требуется Австрия."
 ve_age_3_bonus_10_tt:0 "Требуется Великобритания."
 ve_age_1_bonus_11_tt:0 "Требуется северогерманская или южногерманская основная культура."
 ve_age_2_bonus_11_tt:0 "Требуется Россия."
 ve_age_3_bonus_11_tt:0 "Требуется Цин."
 ve_age_1_bonus_12_tt:0 "Требуются Нидерланды."
 ve_age_2_bonus_12_tt:0 "Требуется Бельгия."
 ve_age_3_bonus_12_tt:0 "Требуется Франция."
 ve_age_1_bonus_13_tt:0 "Требуется Османская империя."
 ve_age_2_bonus_13_tt:0 "Требуются Соединенные Штаты."
 ve_age_3_bonus_13_tt:0 "Требуется Япония."
