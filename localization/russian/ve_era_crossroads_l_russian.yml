 ve_je_era_crossroads_age_3_route_1_status:0 "#Y Социальная Республика#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЯкоря: цель массовой политики и цель зрелых социальных институтов, достигнутая в течение этой Эпохи.\n\nЦель: достичь 60 Прогресса для  #P +50 Импульса Эры#!. Вехи на 20 и 40 уровнях прогресса обеспечивают повышение, финансируемое National Insight."
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y Стратегическое командование#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЯкоря: цель современного состава сил и цель достижения великой державы, достигнутая в течение этой Эпохи.\n\nЦель: достичь 60 Прогресса для #P +50 Импульса Эры#!. Вехи на уровне 20 и 40 Прогресса обеспечивают повышение, финансируемое National Insight."
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y Общество Арсенала#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЯкоря: цель электротехнической промышленности и цель массового вооружения, достигнутые в течение этой эпохи.\n\nЦель: достичь 60 прогресса для  #P +50 импульса эпохи.#!. Вехи на 20 и 40 уровнях прогресса обеспечивают поддержку, финансируемую National Insight."

 ve_era_crossroads.1.t:0 "Steam и государство"
 ve_era_crossroads.1.d:0 "Железные дороги, школы, реформаторы и администраторы предлагают конкурирующие взгляды на современную нацию. Правительство должно решить, какие отношения между обществом и государством организуют первую эпоху."
 ve_era_crossroads.1.a:0 "Объедините страну посредством сети Steam."
 ve_era_crossroads.1.b:0 "Постройте образованную гражданскую позицию."
 ve_era_crossroads.1.c:0 "Консолидация административного государства."
 ve_era_crossroads.1.d.option:0 "Эта эпоха не нуждается в национальных перекрестках."
 ve_era_crossroads.1.a.tt:0 "Начинает маршрут #Y Steam Network#!  (Фокус: индустриализация, крестьянская миграция и железные дороги).\n• Цель: Достигните 60 прогресса, чтобы получить  #P +50 импульса эпохи#!.\n• Скорость прогресса: получает +1 базовый ежемесячный прогресс плюс +1 дополнительно за каждый завершенный якорь эпохи 1 (Крестьянская доля и железная дорога). цели).\n• Доктрина синергии: наличие #Y Промышленника IV#! или #Y Инфраструктура IV#! открывает доступ к более дешевым решениям этапов (5 идей вместо 10)."
 ve_era_crossroads.1.b.tt:0 "Запускает #Y Образованную гражданственность.#! маршрут (Фокус: Образование, Грамотность и Свободный труд).\n• Цель: Достигните 60 Прогресса, чтобы получить  #P +50 Импульса Эры#!.\n• Скорость Прогресса: Получает +1 базовый ежемесячный прогресс, плюс +1 дополнительно за каждый завершенный якорь Возраста 1 (цели Свободного Труда и Грамотности/Школы).\n• Доктринальная Синергия: Иметь  #Y Академический IV#! или #Y Реформист IV#! открывает доступ к более дешевым решениям этапов (5 Проницательности вместо 10)."
 ve_era_crossroads.1.c.tt:0 "Запускает #Y Административное государство.#! маршрут (Фокус: Правительственная легитимность, бюрократия и стабильность).\n• Цель: достичь 60 прогресса, чтобы получить  #P +50 импульса эпохи#!.\n• Скорость прогресса: получает +1 базовый ежемесячный прогресс, плюс +1 дополнительно за каждый завершенный якорь эпохи 1 (цели легитимности/бюрократии и независимой стабильности).\n• Синергия доктрины: наличие  #Y Бюрократического IV#! или #Y Парламентский IV#! разблокирует более дешевые решения этапов (5 идей вместо 10)."
 ve_era_crossroads.2.t:0 "Империя или массовое общество?"
 ve_era_crossroads.2.d:0 "Государство больше не может рассматривать зарубежное влияние, народное благосостояние и национальную интеграцию как отдельные вопросы. Один из них будет определять, как преследовать остальных."
 ve_era_crossroads.2.a:0 "Посмотрите на имперский горизонт."
 ve_era_crossroads.2.b:0 "Постройте систему массового благосостояния."
 ve_era_crossroads.2.c:0 "Сформируйте интегрированную нацию."
 ve_era_crossroads.2.d.option:0 "Пусть эпоха найдет свое собственное направление."
 ve_era_crossroads.2.a.tt:0 "Начинает #Y Имперский горизонт#! маршрут (Фокус: Дипломатическая власть и зарубежное влияние).\n• Цель: Достигните 60 уровня прогресса, чтобы получить #P +50 Импульса Эры#!.\n• Скорость прогресса: получает +1 базовый ежемесячный прогресс, плюс +1 дополнительно за каждый завершенный якорь Эпохи 2 (признанные мощности государства и цели портов/интересов).\n• Синергия доктрины: наличие #Y Дипломатический IV#! или #Y Колониальный IV#! открывает более дешевые решения этапов (5 Проницательности вместо 10)."
 ve_era_crossroads.2.b.tt:0 "Начинает #Y Массовое благосостояние#! маршрут (Фокус: социальные учреждения, здравоохранение и образование).\n• Цель: достичь 60 прогресса, чтобы получить #P +50 импульса эпохи#!.\n• Скорость прогресса: получает +1 базовый ежемесячный прогресс плюс +1 дополнительно за каждый завершенный якорь 2-го возраста (цели грамотности/школ и социальных институтов).\n• Синергия доктрины: наличие #Y Благосостояния IV.#! или #Y Реформист IV#! открывает более дешевые решения этапов (5 идей вместо 10)."
 ve_era_crossroads.2.c.tt:0 "Запускает #Y Интегрированную нацию#! маршрут (Фокус: Экономическая трансформация и внутренняя стабильность).\n• Цель: достичь 60 прогресса, чтобы получить  #P +50 импульса эпохи#!.\n• Скорость прогресса: получает +1 базовый ежемесячный прогресс, плюс +1 дополнительно за каждый завершенный якорь эпохи 2 (цели экономической трансформации и легитимности с низким уровнем потрясений).\n• Синергия доктрины: наличие  #Y националиста IV#! или #Y Труд IV#! открывает более дешевые решения этапов (5 идей вместо 10)."
 ve_era_crossroads.3.t:0 "Мобилизованное общество"
 ve_era_crossroads.3.d:0 "Массовая политика, стратегическое командование и промышленная мобилизация теперь проникли в каждый институт. Последняя эпоха требует выбора, какая форма мобилизации будет определять нацию."
 ve_era_crossroads.3.a:0 "Примите участие в Социальной Республике."
 ve_era_crossroads.3.b:0 "Передайте нацию под стратегическое командование."
 ve_era_crossroads.3.c:0 "Постройте общество «Арсенал»."
 ve_era_crossroads.3.d.option:0 "Отклоните проект постоянной мобилизации."
 ve_era_crossroads.3.a.tt:0 "Начинает путь #Y Социальной Республики#! (Фокус: массовая политика и социальные институты).\n• Цель: Достигните 60 прогресса, чтобы получить #P +50 импульса эпохи#!.\n• Скорость прогресса: получает +1 базовый ежемесячный прогресс, плюс +1 дополнительно за каждый завершенный якорь 3-го возраста (цели массовой политики и зрелых социальных институтов).\n• Синергия доктрины: наличие #Y Парламентский IV#! или #Y Благосостояние IV#! открывает более дешевые решения этапов (5 идей вместо 10)."
 ve_era_crossroads.3.b.tt:0 "Запускает #Y Стратегическое командование#! маршрут (Фокус: военная модернизация и глобальная мощь).\n• Цель: достичь 60 прогресса, чтобы получить  #P +50 импульса эпохи#!.\n• Скорость прогресса: получает +1 базовый ежемесячный прогресс, плюс +1 дополнительно за каждый завершенный якорь 3-й эпохи (цели «Современный состав сил» и «Достижение великой державы»).\n• Синергия доктрины: наличие #Y Профессиональная армия IV#! или #Y Defensive IV#! разблокирует более дешевые решения этапов (5 Insight вместо 10)."
 ve_era_crossroads.3.c.tt:0 "Запускает #Y Общество Арсенала#! маршрут (Фокус: Промышленная военная экономика и массовое вооружение).\n• Цель: достичь 60 прогресса, чтобы получить  #P +50 импульса эпохи#!.\n• Скорость прогресса: получает +1 базовый ежемесячный прогресс, плюс +1 дополнительно за каждый завершенный якорь эпохи 3 (цели электроиндустрии и массового вооружения).\n• Синергия доктрины: наличие #Y Военная экономика IV#! или #Y Массовый призыв IV#! открывает более дешевые решения этапов (5 идей вместо 10)."

 ve_era_crossroads_decline_tt:0 "Постоянно снижает Перекресток Эры текущей Эпохи. Более поздние возрасты по-прежнему имеют право на участие."

 ve_era_crossroads.10.t:0 "Национальный календарь"
 ve_era_crossroads.10.d:0 "Провинциальные управления, частные ассоциации и министерства реализуют выбранную трансформацию с разной скоростью. Общий календарь мог бы превратить разрозненные достижения в национальную программу, но сама координация не требует особого административного внимания."
 ve_era_crossroads.10.a:0 "Профинансировать центральную координационную комиссию."
 ve_era_crossroads.10.b:0 "Пусть учреждения согласуют свой собственный график."
 ve_era_crossroads.10.c:0 "Используйте сети, построенные на основе наших устоявшихся доктрин."
 ve_era_crossroads.10.a.tt:0 "Тратить #N 10 National Insight#! чтобы получить #P +3 Прогресс Перекрестка#!."
 ve_era_crossroads.10.b.tt:0 "Не тратьте ресурсы и не вносите немедленные изменения в прогресс Перекрестка."
 ve_era_crossroads.10.c.tt:0 "Требуется группа идей уровня IV, подходящая для маршрута. Потратить #N 5 National Insight#! чтобы получить #P +3 прогресса «Перекрестка»#!."

 ve_era_crossroads.11.t:0 "Кто будет направлять прогресс?"
 ve_era_crossroads.11.d:0 "Программа стала слишком значимой, чтобы оставаться свободным соглашением. Министры заявляют о национальной власти, эксперты требуют изоляции от политики, а местные игроки предупреждают, что жесткое командование разрушит институты, которые сделали возможным прогресс."
 ve_era_crossroads.11.a:0 "Дайте центру четкие координационные полномочия."
 ve_era_crossroads.11.b:0 "Сохраняйте согласованный баланс полномочий."
 ve_era_crossroads.11.c:0 "Доверьте координацию нашим доктринальным институтам."
 ve_era_crossroads.11.a.tt:0 "Тратить #N 10 National Insight#! чтобы получить #P +3 прогресса Crossroads#!."
 ve_era_crossroads.11.b.tt:0 "Не тратьте ресурсы и не вносите немедленных изменений в прогресс Crossroads."
 ve_era_crossroads.11.c.tt:0 "Требуется группа идей IV уровня, соответствующая маршруту. Потратить #N 5 National Insight#! чтобы получить #P +3 Прогресс Перекрестка#!."

 ve_era_crossroads.40.t:0 "Steam и государство"
 ve_era_crossroads.40.d:0 "Выбранный курс больше не является серией изолированных достижений. Инфраструктура, гражданство или администрация теперь образуют прочную национальную программу, с помощью которой государство может понимать и направлять преобразования эпохи."
 ve_era_crossroads.40.a:0 "Первый возраст обрел свою институциональную форму."
 ve_era_crossroads.40.a.tt:0 "Завершенный Перекресток Эры предоставил #P +50 Импульса Эры#!. Он не выполнил цель и не изменил право на участие в Золотом Веке."

 ve_era_crossroads.20.t:0 "Досягаемость государства"
 ve_era_crossroads.20.d:0 "Выбранная программа теперь выходит за рамки учреждений, которые ее первыми спонсировали. Порты, школы, офисы и местные власти расходятся во мнениях относительно того, где должна заканчиваться национальная координация и начинаться местная свобода действий."
 ve_era_crossroads.20.a:0 "Составьте карту обязательств государства через центральную комиссию."
 ve_era_crossroads.20.b:0 "Разрешить институциональным границам возникать путем переговоров."
 ve_era_crossroads.20.c:0 "Координируйте свои действия через наши существующие доктринальные сети."
 ve_era_crossroads.20.a.tt:0 "Тратить #N 10 National Insight#! чтобы получить #P +3 Прогресс Перекрестка#!."
 ve_era_crossroads.20.b.tt:0 "Не тратьте ресурсы и не вносите немедленные изменения в прогресс Перекрестка."
 ve_era_crossroads.20.c.tt:0 "Требуется группа идей уровня IV, подходящая для маршрута. Потратить #N 5 National Insight#! чтобы получить #P +3 прогресса в Перекрестке#!."

 ve_era_crossroads.21.t:0 "Цена интеграции"
 ve_era_crossroads.21.d:0 "Внешний охват, социальное обеспечение и национальная дисциплина – все это создает победителей, затраты и новые ожидания. Программа может продолжаться только в том случае, если государство решит, как будет распределяться это бремя."
 ve_era_crossroads.21.a:0 "Создайте национальный совет для управления корректировкой."
 ve_era_crossroads.21.b:0 "Распределите бремя посредством согласованных компромиссов."
 ve_era_crossroads.21.c:0 "Пусть наши доктринальные институты возьмут на себя это напряжение."
 ve_era_crossroads.21.a.tt:0 "Тратить #N 10 National Insight#! чтобы получить #P +3 прогресса Crossroads#!."
 ve_era_crossroads.21.b.tt:0 "Не тратьте ресурсы и не вносите немедленных изменений в прогресс Crossroads."
 ve_era_crossroads.21.c.tt:0 "Требуется группа идей IV уровня, соответствующая маршруту. Потратить #N 5 National Insight#! чтобы получить #P +3 Прогресс Перекрестка#!."

 ve_era_crossroads.41.t:0 "Империя и массовое общество"
 ve_era_crossroads.41.d:0 "Выбранное урегулирование теперь связывает внешнее влияние государства, социальные обязательства и национальные институты. То, что началось как стратегическое направление, превратилось в прочную основу для управления массовым обществом."
 ve_era_crossroads.41.a:0 "Вторая эпоха нашла свое поселение."
 ve_era_crossroads.41.a.tt:0 "Завершенный «Перекресток Эры» предоставил #P +50 Импульса Эры#!. Он не выполнил цель и не изменил право на участие в Золотом Веке."

 ve_era_crossroads.30.t:0 "Нация призвана к исполнению долга"
 ve_era_crossroads.30.d:0 "Избранная программа возлагает на граждан, командиров, рабочих и администраторов новые обязанности. Если эти обязанности не будут понятны друг другу, мобилизация останется набором конкурирующих требований."
 ve_era_crossroads.30.a:0 "Кодифицируйте национальные обязанности через центральную комиссию."
 ve_era_crossroads.30.b:0 "Позвольте учреждениям договориться о своих обязанностях."
 ve_era_crossroads.30.c:0 "Используйте наши доктринальные организации для координации обязанностей."
 ve_era_crossroads.30.a.tt:0 "Тратить #N 10 National Insight#! чтобы получить #P +3 Прогресс Перекрестка#!."
 ve_era_crossroads.30.b.tt:0 "Не тратьте ресурсы и не вносите немедленные изменения в прогресс Перекрестка."
 ve_era_crossroads.30.c.tt:0 "Требуется группа идей уровня IV, подходящая для маршрута. Потратить #N 5 National Insight#! чтобы получить #P +3 прогресса «Перекрестка»#!."

 ve_era_crossroads.31.t:0 "Постоянная чрезвычайная ситуация"
 ve_era_crossroads.31.d:0 "Механизм, созданный для массового участия, стратегической готовности или промышленной мобилизации, становится постоянным. Государство должно решить, как сохранить работоспособность, не позволяя чрезвычайной дисциплине поглощать обычную национальную жизнь."
 ve_era_crossroads.31.a:0 "Определите постоянные ограничения посредством национального обзора."
 ve_era_crossroads.31.b:0 "Сохраняйте урегулирование намеренно гибким."
 ve_era_crossroads.31.c:0 "Положитесь на доктринальные институты, чтобы сдержать этот механизм."
 ve_era_crossroads.31.a.tt:0 "Тратить #N 10 National Insight#! чтобы получить #P +3 прогресса Crossroads#!."
 ve_era_crossroads.31.b.tt:0 "Не тратьте ресурсы и не вносите немедленных изменений в прогресс Crossroads."
 ve_era_crossroads.31.c.tt:0 "Требуется группа идей IV уровня, соответствующая маршруту. Потратить #N 5 National Insight#! чтобы получить #P +3 Прогресс Перекрестка#!."

 ve_era_crossroads.42.t:0 "Мобилизованное общество"
 ve_era_crossroads.42.d:0 "Гражданство, командование и промышленный потенциал теперь образуют прочное национальное поселение. Институты мобилизации стали частью обычного правительства, а не оставались импровизированными ответами на каждый новый кризис."
 ve_era_crossroads.42.a:0 "Последний век обрел свою национальную форму."
 ve_era_crossroads.42.a.tt:0 "Завершенный Перекресток Эры предоставил #P +50 Импульса Эры#!. Он не выполнил цель и не изменил право на участие в Золотом Веке."
