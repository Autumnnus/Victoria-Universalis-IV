 ve_je_era_crossroads_age_1:0 "Пар и государство"
 ve_je_era_crossroads_age_1_reason:0 "Промышленность и нации открыла несколько путей к современной государственности. Выбранный курс должен стать не просто набором разрозненных достижений."
 ve_je_era_crossroads_age_1_status:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] мес.#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЦель: достичь 60 Прогресс для получения #P +50 Дыхание эпохи#!. Рубежи на 20 и 40 Прогресс дают усиление за Национальный опыт."
