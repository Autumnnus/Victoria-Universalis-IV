 ve_je_era_crossroads_age_2_route_3_status:0 "#Y Интегрированная нация#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] мес.#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nОпоры: цель экономической трансформации и цель Легитимность при низких Беспорядки, обеспеченные в эту эпоху.\n\nЦель: достичь 60 Прогресс для получения #P +50 Дыхание эпохи#!. Рубежи на 20 и 40 Прогресс дают усиление за Национальный опыт."
