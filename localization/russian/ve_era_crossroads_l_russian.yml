 ve_je_era_crossroads_age_3_route_1_status:0 "#Y Социальная республика#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОсталось времени: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] мес.#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nОпоры: цель массовой политики и цель развитых социальных институтов, обеспеченные в течение этой Эпохи.\n\nЗадача: достичь 60 Прогресс для получения #P +50 Дыхание эпохи#!. Вехи на 20 и 40 Прогресс предлагают бонус за Национальный опыт."
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y Стратегическое командование#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОсталось времени: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] мес.#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nОпоры: цель современного состава войск и цель глобального влияния великой державы, обеспеченные в течение этой Эпохи.\n\nЗадача: достичь 60 Прогресс для получения #P +50 Дыхание эпохи#!. Вехи на 20 и 40 Прогресс предлагают бонус за Национальный опыт."
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y Общество арсеналов#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОсталось времени: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] мес.#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nОпоры: цель электротехнической промышленности и цель массового производства вооружений, обеспеченные в течение этой Эпохи.\n\nЗадача: достичь 60 Прогресс для получения #P +50 Дыхание эпохи#!. Вехи на 20 и 40 Прогресс предлагают бонус за Национальный опыт."

 ve_era_crossroads.1.t:0 "Пар и государство"
 ve_era_crossroads.1.d:0 "Железные дороги, школы, реформаторы и администраторы предлагают разные видения современной нации. Правительство должно решить, какие отношения между обществом и государством определят первую эпоху."
 ve_era_crossroads.1.a:0 "Сплотить страну посредством паровой сети."
 ve_era_crossroads.1.b:0 "Построить образованное гражданское общество."
 ve_era_crossroads.1.c:0 "Укрепить административное государство."
 ve_era_crossroads.1.d.option:0 "Эпоха не нуждается в национальных распутьях."
 ve_era_crossroads.1.a.tt:0 "Запускает Путь #Y Паровая сеть#! (Фокус: Индустриализация, миграция крестьян и Железные дороги).\n• Задача: Достичь 60 Прогресс, чтобы получить #P +50 Дыхание эпохи#!.\n• Скорость прогресса: Дает +1 к базовому ежемесячному прогрессу, а также +1 дополнительно за каждую выполненную опору Эпохи 1 (цели доли крестьян и Железные дороги).\n• Синергия доктрин: Наличие доктрины #Y Промышленность IV#! или #Y Инфраструктура IV#! открывает более дешевые решения вех (5 Национальный опыт вместо 10)."
 ve_era_crossroads.1.b.tt:0 "Запускает Путь #Y Образованное гражданское общество#! (Фокус: Образование, Грамотность и свободный труд).\n• Задача: Достичь 60 Прогресс, чтобы получить #P +50 Дыхание эпохи#!.\n• Скорость прогресса: Дает +1 к базовому ежемесячному прогрессу, а также +1 дополнительно за каждую выполненную опору Эпохи 1 (цели свободного труда и Грамотности/школ).\n• Синергия доктрин: Наличие доктрины #Y Академическая IV#! или #Y Реформистская IV#! открывает более дешевые решения вех (5 Национальный опыт вместо 10)."
 ve_era_crossroads.1.c.tt:0 "Запускает Путь #Y Административное государство#! (Фокус: Легитимность правительства, Бюрократия и стабильность).\n• Задача: Достичь 60 Прогресс, чтобы получить #P +50 Дыхание эпохи#!.\n• Скорость прогресса: Дает +1 к базовому ежемесячному прогрессу, а также +1 дополнительно за каждую выполненную опору Эпохи 1 (цели Легитимность/Бюрократия и независимая стабильность).\n• Синергия доктрин: Наличие доктрины #Y Бюрократическая IV#! или #Y Парламентская IV#! открывает более дешевые решения вех (5 Национальный опыт вместо 10)."
 ve_era_crossroads.2.t:0 "Империя или массовое общество?"
 ve_era_crossroads.2.d:0 "Государство больше не может рассматривать заморское влияние, народное благосостояние и национальную интеграцию как отдельные вопросы. Один из них определит то, как будут решаться остальные."
 ve_era_crossroads.2.a:0 "Устремить взгляд к имперскому горизонту."
 ve_era_crossroads.2.b:0 "Построить систему массового благосостояния."
 ve_era_crossroads.2.c:0 "Сформировать интегрированную нацию."
 ve_era_crossroads.2.d.option:0 "Пусть эпоха сама найдет свое направление."
 ve_era_crossroads.2.a.tt:0 "Запускает Путь #Y Имперский горизонт#! (Фокус: Дипломатическая мощь и заморское влияние).\n• Задача: Достичь 60 Прогресс, чтобы получить #P +50 Дыхание эпохи#!.\n• Скорость прогресса: Дает +1 к базовому ежемесячному прогрессу, а также +1 дополнительно за каждую выполненную опору Эпохи 2 (цели признанного потенциала нации и портов/Интересы).\n• Синергия доктрин: Наличие доктрины #Y Дипломатическая IV#! или #Y Колониальная IV#! открывает более дешевые решения вех (5 Национальный опыт вместо 10)."
 ve_era_crossroads.2.b.tt:0 "Запускает Путь #Y Массовое благосостояние#! (Фокус: Социальные институты, здравоохранение и Образование).\n• Задача: Достичь 60 Прогресс, чтобы получить #P +50 Дыхание эпохи#!.\n• Скорость прогресса: Дает +1 к базовому ежемесячному прогрессу, а также +1 дополнительно за каждую выполненную опору Эпохи 2 (цели Грамотность/школы и социальные институты).\n• Синергия доктрин: Наличие доктрины #Y Социальная IV#! или #Y Реформистская IV#! открывает более дешевые решения вех (5 Национальный опыт вместо 10)."
 ve_era_crossroads.2.c.tt:0 "Запускает Путь #Y Интегрированная нация#! (Фокус: Экономическая трансформация и внутренняя стабильность).\n• Задача: Достичь 60 Прогресс, чтобы получить #P +50 Дыхание эпохи#!.\n• Скорость прогресса: Дает +1 к базовому ежемесячному прогрессу, а также +1 дополнительно за каждую выполненную опору Эпохи 2 (цели экономической трансформации и легитимности при низких Беспорядки).\n• Синергия доктрин: Наличие доктрины #Y Национальная IV#! или #Y Труд IV#! открывает более дешевые решения вех (5 Национальный опыт вместо 10)."
 ve_era_crossroads.3.t:0 "Мобилизованное общество"
 ve_era_crossroads.3.d:0 "Массовая политика, стратегическое командование и промышленная мобилизация проникают во все институты. Последняя эпоха требует сделать выбор: какая именно форма мобилизации определит облик нации."
 ve_era_crossroads.3.a:0 "Встать на путь социальной республики."
 ve_era_crossroads.3.b:0 "Подчинить нацию Стратегическому командованию."
 ve_era_crossroads.3.c:0 "Построить общество-арсенал."
 ve_era_crossroads.3.d.option:0 "Отказаться от постоянного мобилизационного проекта."
 ve_era_crossroads.3.a.tt:0 "Начинает путь #Y Социальная республика#! (Направление: массовая политика и социальные институты).\n• Цель: достичь 60 Прогресс для получения #P +50 Дыхание эпохи#!.\n• Скорость прогресса: +1 к базовому ежемесячному прогрессу, а также +1 дополнительно за каждый завершенный якорь эпохи III (цели «Массовая политика» и «Зрелые социальные институты»).\n• Доктринальная синергия: наличие доктрин #Y Парламентская IV#! или #Y Социальная IV#! открывает более дешевые решения для вех (5 Национальный опыт вместо 10)."
 ve_era_crossroads.3.b.tt:0 "Начинает путь #Y Стратегическое командование#! (Направление: военная модернизация и глобальное влияние).\n• Цель: достичь 60 Прогресс для получения #P +50 Дыхание эпохи#!.\n• Скорость прогресса: +1 к базовому ежемесячному прогрессу, а также +1 дополнительно за каждый завершенный якорь эпохи III (цели «Современный состав вооруженных сил» и «Влияние великой державы»).\n• Доктринальная синергия: наличие доктрин #Y Профессиональная армия IV#! или #Y Оборонительная IV#! открывает более дешевые решения для вех (5 Национальный опыт вместо 10)."
 ve_era_crossroads.3.c.tt:0 "Начинает путь #Y Общество-арсенал#! (Направление: военная экономика промышленности и массовое вооружение).\n• Цель: достичь 60 Прогресс для получения #P +50 Дыхание эпохи#!.\n• Скорость прогресса: +1 к базовому ежемесячному прогрессу, а также +1 дополнительно за каждый завершенный якорь эпохи III (цели «Электротехническая промышленность» и «Массовое вооружение»).\n• Доктринальная синергия: наличие доктрин #Y Военная экономика IV#! или #Y Массовая мобилизация IV#! открывает более дешевые решения для вех (5 Национальный опыт вместо 10)."

 ve_era_crossroads_decline_tt:0 "Окончательно отказывается от Перепутье эпохи текущей эпохи. Более поздние эпохи остаются доступны."

 ve_era_crossroads.10.t:0 "Национальный календарь"
 ve_era_crossroads.10.d:0 "Провинциальные управления, частные объединения и министерства претворяют выбранное преобразование с различной скоростью. Общий календарь мог бы превратить разрозненные достижения в единую национальную программу, однако сама координация требует дефицитного административного внимания."
 ve_era_crossroads.10.a:0 "Финансировать центральную координационную комиссию."
 ve_era_crossroads.10.b:0 "Позволить институтам самостоятельно согласовать график."
 ve_era_crossroads.10.c:0 "Использовать сети, созданные нашими устоявшимися доктринами."
 ve_era_crossroads.10.a.tt:0 "Потратить #N 10 Национальный опыт#!, чтобы получить #P +3 к прогрессу пути#!."
 ve_era_crossroads.10.b.tt:0 "Не тратить ресурсы и не вносить немедленных изменений в прогресс пути."
 ve_era_crossroads.10.c.tt:0 "Требуется группа идей IV уровня, соответствующая выбранному пути. Потратить #N 5 Национальный опыт#!, чтобы получить #P +3 к прогрессу пути#!."

 ve_era_crossroads.11.t:0 "Кто возглавит прогресс?"
 ve_era_crossroads.11.d:0 "Программа приобрела слишком важное значение, чтобы оставаться лишь негласным соглашением. Министры заявляют о национальных полномочиях, эксперты требуют оградить дело от политики, а местные деятели предупреждают, что жесткое командование разрушит институты, сделавшие прогресс возможным."
 ve_era_crossroads.11.a:0 "Наделить центр четким мандатом на координацию."
 ve_era_crossroads.11.b:0 "Сохранить достигнутый баланс полномочий."
 ve_era_crossroads.11.c:0 "Доверить координацию нашим доктринальным институтам."
 ve_era_crossroads.11.a.tt:0 "Потратить #N 10 Национальный опыт#!, чтобы получить #P +3 к прогрессу пути#!."
 ve_era_crossroads.11.b.tt:0 "Не тратить ресурсы и не вносить немедленных изменений в прогресс пути."
 ve_era_crossroads.11.c.tt:0 "Требуется группа идей IV уровня, соответствующая выбранному пути. Потратить #N 5 Национальный опыт#!, чтобы получить #P +3 к прогрессу пути#!."

 ve_era_crossroads.40.t:0 "Пар и государство"
 ve_era_crossroads.40.d:0 "Избранный курс перестал быть чередой разрозненных достижений. Инфраструктура, гражданство и администрация формируют прочную национальную программу, посредством которой государство способно осмыслить и направлять преобразования этой эпохи."
 ve_era_crossroads.40.a:0 "Первая эпоха обрела свою институциональную форму."
 ve_era_crossroads.40.a.tt:0 "Завершение Перепутье эпохи принесло #P +50 Дыхание эпохи#!. Это не завершило цель и не повлияло на доступность Золотой век."

 ve_era_crossroads.20.t:0 "Масштаб государственного влияния"
 ve_era_crossroads.20.d:0 "Избранная программа теперь выходит за рамки институтов, которые первоначально ее поддерживали. Порты, школы, ведомства и местные власти спорят о том, где должна заканчиваться национальная координация и начинаться местная автономия."
 ve_era_crossroads.20.a:0 "Определить обязательства государства через центральную комиссию."
 ve_era_crossroads.20.b:0 "Позволить границам институтов сформироваться путем переговоров."
 ve_era_crossroads.20.c:0 "Координировать действия через наши сложившиеся доктринальные сети."
 ve_era_crossroads.20.a.tt:0 "Потратить #N 10 Национальный опыт#!, чтобы получить #P +3 к прогрессу пути#!."
 ve_era_crossroads.20.b.tt:0 "Не тратить ресурсы и не вносить немедленных изменений в прогресс пути."
 ve_era_crossroads.20.c.tt:0 "Требуется группа идей IV уровня, соответствующая выбранному пути. Потратить #N 5 Национальный опыт#!, чтобы получить #P +3 к прогрессу пути#!."

 ve_era_crossroads.21.t:0 "Цена интеграции"
 ve_era_crossroads.21.d:0 "Внешнее влияние, социальное обеспечение и национальная дисциплина — всё это создает победителей, издержки и новые ожидания. Программа может устоять лишь в том случае, если государство решит, как именно будут распределены эти тяготы."
 ve_era_crossroads.21.a:0 "Создать национальный комитет по управлению адаптацией."
 ve_era_crossroads.21.b:0 "Распределить бремя путем достигнутых компромиссов."
 ve_era_crossroads.21.c:0 "Позволить нашим институтам доктрины взять на себя напряжение."
 ve_era_crossroads.21.a.tt:0 "Потратить #N 10 Национальный опыт#!, чтобы получить #P +3 к прогресс перепутья эпохи#!."
 ve_era_crossroads.21.b.tt:0 "Не расходовать ресурсы и не вносить немедленных изменений в прогресс перепутья эпохи."
 ve_era_crossroads.21.c.tt:0 "Требуется подходящая под путь группа идей уровня IV. Потратить #N 5 Национальный опыт#!, чтобы получить #P +3 к прогресс перепутья эпохи#!."

 ve_era_crossroads.41.t:0 "Империя и массовое общество"
 ve_era_crossroads.41.d:0 "Выбранное урегулирование теперь связывает воедино внешнее влияние государства, социальные обязательства и национальные институты. То, что начиналось как стратегическое направление, превратилось в прочный каркас управления массовым обществом."
 ve_era_crossroads.41.a:0 "Вторая эпоха обрела свое урегулирование."
 ve_era_crossroads.41.a.tt:0 "Завершенное перепутье эпохи дало #P +50 Дыхание эпохи#!. Это не выполнило цель и не изменило условия для золотого века."

 ve_era_crossroads.30.t:0 "Нация призвана к долгу"
 ve_era_crossroads.30.d:0 "Граждане, командиры, рабочие и администраторы — всем им выбранная программа возлагает новые обязанности. До тех пор пока эти обязанности не станут понятны каждому, мобилизация останется лишь набором противоречащих друг другу требований."
 ve_era_crossroads.30.a:0 "Кодифицировать национальный долг через центральную комиссию."
 ve_era_crossroads.30.b:0 "Позволить институтам согласовать свои обязанности."
 ve_era_crossroads.30.c:0 "Использовать наши организации доктрины для координации долга."
 ve_era_crossroads.30.a.tt:0 "Потратить #N 10 Национальный опыт#!, чтобы получить #P +3 к прогресс перепутья эпохи#!."
 ve_era_crossroads.30.b.tt:0 "Не расходовать ресурсы и не вносить немедленных изменений в прогресс перепутья эпохи."
 ve_era_crossroads.30.c.tt:0 "Требуется подходящая под путь группа идей уровня IV. Потратить #N 5 Национальный опыт#!, чтобы получить #P +3 к прогресс перепутья эпохи#!."

 ve_era_crossroads.31.t:0 "Перманентная чрезвычайная ситуация"
 ve_era_crossroads.31.d:0 "Механизмы, созданные для участия масс, стратегической готовности или промышленной мобилизации, становятся постоянными. Государство должно решить, как сохранить потенциал, не позволяя чрезвычайной дисциплине поглотить обычную национальную жизнь."
 ve_era_crossroads.31.a:0 "Определить постоянные пределы посредством национального пересмотра."
 ve_era_crossroads.31.b:0 "Сохранять урегулирование намеренно гибким."
 ve_era_crossroads.31.c:0 "Положиться на институты доктрины в сдерживании этого механизма."
 ve_era_crossroads.31.a.tt:0 "Потратить #N 10 Национальный опыт#!, чтобы получить #P +3 к прогресс перепутья эпохи#!."
 ve_era_crossroads.31.b.tt:0 "Не расходовать ресурсы и не вносить немедленных изменений в прогресс перепутья эпохи."
 ve_era_crossroads.31.c.tt:0 "Требуется подходящая под путь группа идей уровня IV. Потратить #N 5 Национальный опыт#!, чтобы получить #P +3 к прогресс перепутья эпохи#!."

 ve_era_crossroads.42.t:0 "Мобилизованное общество"
 ve_era_crossroads.42.d:0 "Гражданство, командование и промышленный потенциал теперь образуют прочное национальное урегулирование. Институты мобилизации стали частью обычного правительства, а не остались импровизированными ответами на каждый новый кризис."
 ve_era_crossroads.42.a:0 "Последняя эпоха нашла свою национальную форму."
 ve_era_crossroads.42.a.tt:0 "Завершенное перепутье эпохи дало #P +50 Дыхание эпохи#!. Это не выполнило цель и не изменило условия для золотого века."
