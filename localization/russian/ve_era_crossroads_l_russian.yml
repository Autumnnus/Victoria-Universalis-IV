 ve_je_era_crossroads_age_1:0 "Steam и государство"
 ve_je_era_crossroads_age_1_reason:0 "«Промышленность и нации» открыли несколько путей к современной государственности. Выбранный курс должен стать чем-то большим, чем набором отдельных достижений."
 ve_je_era_crossroads_age_1_status:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЦель: достичь 60 прогресса для #P +50 импульса эры#!. Вехи на уровне 20 и 40 Прогресса обеспечивают повышение, финансируемое National Insight."
 ve_je_era_crossroads_age_1_route_1_status:0 "#Y Сеть Steam#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЯкоря: цель крестьянской доли и цель железной дороги, достигнутая в течение этой эпохи.\n\nЦель: достичь 60 прогресса за #P +50 импульса эры#!. Вехи на уровне 20 и 40 Прогресса обеспечивают повышение, финансируемое National Insight."
 ve_je_era_crossroads_age_1_route_2_status:0 "#Y Образованная гражданственность#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЯкоря: цель свободного труда и цель грамотности или школ, достигнутая в течение этой эпохи.\n\nЦель: достичь 60 прогресса для  #P +50 импульса эры#!. Вехи на уровне 20 и 40 Прогресса обеспечивают поддержку, финансируемую National Insight."
 ve_je_era_crossroads_age_1_route_3_status:0 "#Y Административное государство#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЯкоря: цель легитимности и бюрократии и цель независимой стабильности, достигнутая в течение этой эпохи.\n\nЦель: достичь 60 Прогресса для #P +50 Эра Импульс#!. Вехи на 20 и 40 уровнях Прогресса обеспечивают поддержку, финансируемую National Insight."
 ve_je_era_crossroads_age_2:0 "Империя или массовое общество?"
 ve_je_era_crossroads_age_2_reason:0 "Империя и массовое общество вынуждают государство выбирать, как внешний охват, благосостояние и национальная интеграция будут определять друг друга."
 ve_je_era_crossroads_age_2_status:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЦель: достичь 60 Прогресс для #P +50 Эра Импульс#!. Вехи на уровне 20 и 40 Прогресса обеспечивают поддержку, финансируемую National Insight."
 ve_je_era_crossroads_age_2_route_1_status:0 "#Y Имперский Горизонт#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЯкоря: цель признанного потенциала государства и цель портов или интересов, достигнутая в течение этой эпохи.\n\nЦель: достичь 60 прогресса для #P +50 импульса эры#!. Вехи на уровне 20 и 40 Прогресса обеспечивают поддержку, финансируемую National Insight."
 ve_je_era_crossroads_age_2_route_2_status:0 "#Y Массовое благосостояние#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nОпоры: цель грамотности или школ и цель социальных институтов, достигнутая в течение этой эпохи.\n\nЦель: достичь 60 Прогресса для #P +50 Импульса Эры#!. Вехи на уровне 20 и 40 Прогресса обеспечивают повышение, финансируемое National Insight."
 ve_je_era_crossroads_age_2_route_3_status:0 "#Y Интегрированная Нация#!\nПрогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nЯкоря: цель экономической трансформации и цель легитимности с низким уровнем потрясений, достигнутая в течение этой Эпохи.\n\nЦель: достичь 60 Прогресса для  #P +50 Импульса Эры#!. Вехи на 20 и 40 уровнях прогресса обеспечивают поддержку, финансируемую National Insight."
 ve_je_era_crossroads_age_3:0 "Мобилизованное общество"
 ve_je_era_crossroads_age_3_reason:0 "Массовая политика и тотальная война делают гражданство, промышленность и стратегическую готовность частями одного и того же национального урегулирования."
