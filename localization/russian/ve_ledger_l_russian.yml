l_russian:
 # Doctrine Ledger - gui/ve_panel_ledger.gui
 VE_LEDGER:0 "Регистр"
 VE_LEDGER_SELECTED:0 "#bold Регистр#!"
 VE_LG_TITLE:0 "Регистр доктрин"
 VE_LG_HINT:0 "Положение доктрин каждой страны. Нажмите на заголовок столбца для сортировки, на фильтр для сужения списка или на страну, чтобы открыть её панель с подробной информацией по каждой группе."

 # Columns
 VE_LG_COL_RANK:0 "#"
 VE_LG_COL_COUNTRY:0 "Страна"
 VE_LG_COL_INSIGHT:0 "Опыт"
 VE_LG_COL_GROUPS:0 "Группы"
 VE_LG_COL_IDEAS:0 "Идеи группы"
 VE_LG_COL_NATIONAL_IDEAS:0 "Нац. идеи"
 VE_LG_COL_NATIONAL_IDEAS_TT:0 "#header Национальные идеи#!\nПо одному значку на ячейку национальной идеи плюс национальный бонус справа. Страна открывает следующую ячейку за каждые три приобретенные идеи групп."
 VE_LG_COL_RELIGION:0 "Религиозная модель"
 VE_LG_COL_IDENTITY:0 "Модель идентичности"
 VE_LG_COL_ERA:0 "Эпоха"

 # Cell values
 VE_LG_GROUPS_VALUE:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_LG_IDEAS_VALUE:0 "[Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21"
 VE_LG_REWARDS_VALUE:0 "R [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]"
 VE_LG_ERA_TT:0 "#header [Country.GetCustom('ve_cp_age_name')]#!\nДыхание эпохи: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\nПриобретено наград эпохи: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nВыполняемые цели: #Y [Country.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0] / 7#!\nОбеспеченные цели этой эпохи: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\nЗолотой век: [Country.GetCustom('ve_cp_golden_age_status')]"
 VE_LG_OPEN_COUNTRY_TT:0 "Открыть панель этой страны. Сведения о её идеях, религии, идентичности и эпохе находятся в разделе #Y Национальная доктрина#!."

 # Sort tooltips
 VE_LG_SORT_PRESTIGE_TT:0 "Сортировать по #Y престижу#! — порядок по умолчанию, сначала наибольший."
 VE_LG_SORT_INSIGHT_TT:0 "Сортировать по накопленному #Y национальному опыту#!, сначала наибольший."
 VE_LG_SORT_GROUPS_TT:0 "Сортировать по #Y принятым группам идей#!, сначала наибольшие."
 VE_LG_SORT_IDEAS_TT:0 "Сортировать по #Y приобретенным идеям групп#! (прогресс национальных идей), сначала наибольшие."
 VE_LG_SORT_SETTLEMENT_TT:0 "Сортировать по #Y религиозному компромиссу#!, сначала наибольший."
 VE_LG_SORT_COHESION_TT:0 "Сортировать по #Y национальному единению#!, сначала наибольшее."
 VE_LG_SORT_MOMENTUM_TT:0 "Сортировать по #Y дыханию эпохи#!, сначала наибольшее."

 # Filters
 VE_LG_F_ALL:0 "Все"
 VE_LG_F_GREAT_POWERS:0 "Великие державы"
 VE_LG_F_MAJOR_POWERS:0 "Крупные державы+"
 VE_LG_F_RECOGNIZED:0 "Признанные"
 VE_LG_F_RELEVANT:0 "Значимые для меня"
 VE_LG_F_WITH_GROUPS:0 "С группами идей"

 # Paging
 VE_LG_PAGE_INFO:0 "Стр. [GetGlobalVariable('ve_ledger_page_number').GetValue|0] / [GetGlobalVariable('ve_ledger_page_count').GetValue|0]  ([GetGlobalVariable('ve_ledger_total').GetValue|0])"
 VE_LG_REFRESH:0 "Обновить"
 VE_LG_REFRESH_TT:0 "Перестроить список. Значения в строках всегда актуальны; при построении списка задаются только порядок и состав страниц."
 VE_LG_FIRST_TT:0 "Первая страница"
 VE_LG_PREV_TT:0 "Предыдущая страница"
 VE_LG_NEXT_TT:0 "Следующая страница"
 VE_LG_YOU:0 "#lore Ваша страна#!"
 VE_LG_EMPTY:0 "#lore Под этот фильтр не подходит ни одна страна. Нажмите «Обновить» или выберите более широкий фильтр.#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_ledger.txt
 ve_ledger_groups_tt_header:0 "#header Принятые группы идей#!"
 ve_ledger_groups_tt_none:0 "#lore Группы идей пока не приняты.#!"
