l_russian:
 # Doctrine Ledger - gui/ve_panel_ledger.gui
 VE_LEDGER:0 "Леджер"
 VE_LEDGER_SELECTED:0 "#bold Леджер#!"
 VE_LG_TITLE:0 "Доктрина Леджер"
 VE_LG_HINT:0 "Положение доктрины каждой страны. Нажмите заголовок столбца для сортировки, фильтр, чтобы сузить список, и страну, чтобы открыть панель для получения полной информации по каждой группе."

 # Columns
 VE_LG_COL_RANK:0 "#"
 VE_LG_COL_COUNTRY:0 "Страна"
 VE_LG_COL_INSIGHT:0 "Понимание"
 VE_LG_COL_GROUPS:0 "Группы"
 VE_LG_COL_IDEAS:0 "Групповые идеи"
 VE_LG_COL_NATIONAL_IDEAS:0 "Национальные идеи"
 VE_LG_COL_NATIONAL_IDEAS_TT:0 "#header Национальные идеи#!\nПо одному маркеру на ячейку Национальной идеи плюс Национальный бонус справа. Страна открывает следующий слот для каждой третьей групповой идеи, которую она покупает."
 VE_LG_COL_RELIGION:0 "Религиозная модель"
 VE_LG_COL_IDENTITY:0 "Модель идентичности"
 VE_LG_COL_ERA:0 "Эра"

 # Cell values
 VE_LG_GROUPS_VALUE:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_LG_IDEAS_VALUE:0 "[Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21"
 VE_LG_REWARDS_VALUE:0 "Р [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]"
 VE_LG_ERA_TT:0 "#header [Country.GetCustom('ve_cp_age_name')]#!\nИмпульс эпохи: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\nНаграды эпохи, купленные в этом веке: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nЦели, достигнутые на данный момент: #Y [Country.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0] / 7#!\nЦели, достигнутые в этом веке: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\nЗолотой век: [Country.GetCustom('ve_cp_golden_age_status')]"
 VE_LG_OPEN_COUNTRY_TT:0 "Откройте панель этой страны. Подробности его идей, религии, идентичности и эпохи представлены в #Y Национальная доктрина#! раздел там."

 # Sort tooltips
 VE_LG_SORT_PRESTIGE_TT:0 "Сортировать по #Y Престиж#!  — порядок по умолчанию, сначала самый высокий."
 VE_LG_SORT_INSIGHT_TT:0 "Сортировать по запасам #Y National Insight#!, сначала самый высокий."
 VE_LG_SORT_GROUPS_TT:0 "Сортировать по #Y приняли группы идей#!, самое первое."
 VE_LG_SORT_IDEAS_TT:0 "Сортировать по #Y приобретенные групповые идеи#! (Прогресс Национальной идеи), самые первые."
 VE_LG_SORT_SETTLEMENT_TT:0 "Сортировать по #Y Религиозное поселение#!, сначала самый высокий."
 VE_LG_SORT_COHESION_TT:0 "Сортировать по #Y Национальному сплочению#!, сначала самый высокий."
 VE_LG_SORT_MOMENTUM_TT:0 "Сортировать по #Y Импульсу эпохи#!, сначала самый высокий."

 # Filters
 VE_LG_F_ALL:0 "Все"
 VE_LG_F_GREAT_POWERS:0 "Великие державы"
 VE_LG_F_MAJOR_POWERS:0 "Основные полномочия+"
 VE_LG_F_RECOGNIZED:0 "Признаны"
 VE_LG_F_RELEVANT:0 "Соответствующие мне"
 VE_LG_F_WITH_GROUPS:0 "Есть группы идей"

 # Paging
 VE_LG_PAGE_INFO:0 "Страница [GetGlobalVariable('ve_ledger_page_number').GetValue|0] / [GetGlobalVariable('ve_ledger_page_count').GetValue|0]  ([GetGlobalVariable('ve_ledger_total').GetValue|0])"
 VE_LG_REFRESH:0 "Обновить"
 VE_LG_REFRESH_TT:0 "Перестроить список. Значения строк всегда активны; при построении списка задаются только порядок и членство на странице."
 VE_LG_FIRST_TT:0 "Первая страница"
 VE_LG_PREV_TT:0 "Предыдущая страница"
 VE_LG_NEXT_TT:0 "Следующая страница"
 VE_LG_YOU:0 "#lore Ваша страна#!"
 VE_LG_EMPTY:0 "#lore Ни одна страна не соответствует этому фильтру. Нажмите «Обновить» или выберите более широкий фильтр.#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_ledger.txt
 ve_ledger_groups_tt_header:0 "#header Принятые группы идей#!"
 ve_ledger_groups_tt_none:0 "#lore Ни одна группа идей пока не принята.#!"
