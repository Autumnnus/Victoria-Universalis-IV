l_russian:
 ve_je_doctrine_journey_industrialist:0 "Стандартизация фабричной системы"
 ve_je_doctrine_journey_industrialist_reason:0 "Промышленная доктрина вышла за пределы отдельныx мельниц. Производители, инспекторы и администраторы должны превратить местную практику в прочную национальную систему."
 ve_je_doctrine_journey_industrialist_status_both:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОсталось времени: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] мес.#!\nЕжемесячный прогресс: #P +2#!\n\n#P Масштаб производства достигнут#!: не менее #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! уровней промышленных сооружений.\n#P Стабильное управление достигнуто#!: неотрицательная Бюрократия, отсутствие надвигающегося дефицита и уровень беспорядков в стране менее 15%.\n\nНаграда за успех: #P +40 Национальный опыт#!. Если прогресс не достигнет 60 за 60 месяцев, этот путь завершится без награды."
