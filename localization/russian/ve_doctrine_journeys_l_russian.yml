 ve_je_doctrine_journey_professional_army:0 "Реформа генерального штаба"
 ve_je_doctrine_journey_professional_army_reason:0 "Профессиональный офицерский корпус требует большего, чем казармы и патенты на чины. Обучение, планирование и мобилизация должны быть сведены в единую устойчивую штабную систему."
 ve_je_doctrine_journey_professional_army_status_both:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОсталось времени: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] мес.#!\nЕжемесячный прогресс: #P +2#!\n\n#P Масштаб казарм достигнут#!: не менее #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! уровней сооружения Казармы.\n#P Профессиональная доктрина соблюдена#!: закон «Профессиональная армия» или технология «Генеральный штаб».\n\nНаграда за успех: #Y Институциональный генеральный штаб#! (+7.5% Скорость обучения, 36 месяцев). Если прогресс не достигнет 60 за 60 месяцев, Путь завершится без награды."
