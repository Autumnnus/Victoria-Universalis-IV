 ve_je_doctrine_journey_academic_reason:0 "Университеты и ученые общества готовы стать национальным сообществом исследователей, если их институты и социальные основы смогут это поддержать."
 ve_je_doctrine_journey_academic_status_both:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОсталось времени: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] мес.#!\nЕжемесячный прогресс: #P +2#!\n\n#P Масштаб университетов достигнут#!: не менее #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! уровней сооружения Университеты.\n#P База грамотности достигнута#!: не менее 50% грамотности или на 5 процентных пунктов выше начального значения пути.\n\nНаграда за успех: #P +15 Дыхание эпохи#!. Если прогресс не достигнет 60 за 60 месяцев, этот путь завершится без награды."
