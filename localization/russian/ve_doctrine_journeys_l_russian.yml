 ve_doctrine_journey.31.t:0 "Таблицы мобилизации"
 ve_doctrine_journey.31.d:0 "Планировщики составили конкурирующие расписания для людей, снабжения и железнодорожного транспорта. Единый национальный стол обещает координацию, но региональные командования предупреждают, что жесткие графики игнорируют местные возможности."
 ve_doctrine_journey.31.a:0 "Финансировать центральное мобилизационное бюро."
 ve_doctrine_journey.31.a.tt:0 "Потратить #N 15#! National Insight.\nПрогресс в путешествии увеличивается на #P 4#!."
 ve_doctrine_journey.31.b:0 "Позвольте региональным командованиям поддерживать совместимые графики."
 ve_doctrine_journey.31.b.tt:0 "Путешествие продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.31.c:0 "Интегрируйте планирование железной дороги, депо и командования."
 ve_doctrine_journey.31.c.tt:0 "Требуется профессиональная армейская идея VII.\nПотратьте #N 10#! National Insight.\nПрогресс путешествия увеличивается на #P 4#!."
