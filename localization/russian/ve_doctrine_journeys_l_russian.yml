 ve_je_doctrine_journey_professional_army_status_neither:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОсталось времени: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] мес.#!\nЕжемесячный прогресс: #N 0#!\n\n#N Масштаб казарм не достигнут#!: требуется не менее #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! уровней сооружения Казармы.\n#N Профессиональная доктрина не соблюдена#!: требуется закон «Профессиональная армия» или технология «Генеральный штаб».\n\nНаграда за успех: #Y Институциональный генеральный штаб#! (+7.5% Скорость обучения, 36 месяцев). Если прогресс не достигнет 60 за 60 месяцев, Путь завершится без награды."
 ve_doctrine_journey_general_staff_reform_mdf:0 "Институциональный генеральный штаб"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Штабные колледжи, мобилизационные таблицы и единые стандарты обучения стали неотъемлемой частью вооружённых сил."

 ve_doctrine_journey.1.t:0 "Стандартизация фабричной системы"
 ve_doctrine_journey.1.d:0 "Промышленные ассоциации предлагают начать общенациональную работу по унификации оборудования, инспекций и производственной практики. Это предприятие займет пять лет и потребует поддержания промышленных масштабов и административной стабильности."
 ve_doctrine_journey.1.a:0 "Приступить к стандартизации."
 ve_doctrine_journey.1.b:0 "Вернуться к рассмотрению через пять лет."
 ve_doctrine_journey.1.c:0 "Нашим фабрикам не нужна национальная доктрина."
 ve_doctrine_journey.2.t:0 "Ученые круги"
 ve_doctrine_journey.2.d:0 "Ректоры и ученые общества предлагают пятилетнюю программу по объединению университетов в устойчивое национальное исследовательское сообщество. Успех этого начинания будет зависеть как от академического потенциала, так и от распространения грамотности."
 ve_doctrine_journey.2.a:0 "Взять ученые круги под покровительство."
 ve_doctrine_journey.2.b:0 "Вернуться к предложению через пять лет."
 ve_doctrine_journey.2.c:0 "Наука должна оставаться в ведении местных сообществ."
 ve_doctrine_journey.3.t:0 "Реформа генерального штаба"
 ve_doctrine_journey.3.d:0 "Высшие офицеры предлагают пятилетнюю реформу системы обучения, планирования и мобилизации. Генеральному штабу предстоит доказать, что профессиональная доктрина способна укрепиться за пределами узкого круга приближенных командиров."
 ve_doctrine_journey.3.a:0 "Поручить проведение реформы генерального штаба."
 ve_doctrine_journey.3.b:0 "Пересмотреть планы через пять лет."
 ve_doctrine_journey.3.c:0 "Существующая система командования вполне достаточна."

 ve_doctrine_journey_start_tt:0 "Запускает этот пятилетний Путь доктрины. Одновременно может быть активен только один Путь доктрины."
 ve_doctrine_journey_defer_tt:0 "Откладывает предложение этой группы на #Y 5 лет#!. Впоследствии оно может поступить вновь."
 ve_doctrine_journey_decline_tt:0 "Окончательно отклоняет Путь доктрины этой группы."

 ve_doctrine_journey.10.t:0 "Меры и допуски"
 ve_doctrine_journey.10.d:0 "На фабриках используются несовместимые измерительные приборы, крепеж и допуски. Инженеры призывают государство ввести единый каталог, в то время как провинциальные промышленники предупреждают, что жесткий стандарт может заморозить полезную местную практику."
 ve_doctrine_journey.10.a:0 "Профинансировать создание национального каталога стандартов."
 ve_doctrine_journey.10.a.tt:0 "Потратить #N 15#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."
 ve_doctrine_journey.10.b:0 "Допустить совместимые региональные стандарты."
 ve_doctrine_journey.10.b.tt:0 "Путь продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.10.c:0 "Использовать Строительство для координации внедрения."
 ve_doctrine_journey.10.c.tt:0 "Требуется Промышленность, идея V.\nПотратить #N 10#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."
 ve_doctrine_journey.11.t:0 "Национальная инспекция"
 ve_doctrine_journey.11.d:0 "Первые общие стандарты теперь требуют контроля за их соблюдением. Чиновники предлагают создать центральную инспекцию, промышленники предпочитают самосертификацию, а опытные планировщики производства выступают за аудит обоих направлений."
 ve_doctrine_journey.11.a:0 "Учредить центральную инспекцию промышленности."
 ve_doctrine_journey.11.a.tt:0 "Потратить #N 15#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."
 ve_doctrine_journey.11.b:0 "Признать промышленную самосертификацию."
 ve_doctrine_journey.11.b.tt:0 "Путь продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.11.c:0 "Проводить аудит инспекторов и производителей в рамках единой системы."
 ve_doctrine_journey.11.c.tt:0 "Требуется Промышленность, идея VII.\nПотратить #N 10#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."

 ve_doctrine_journey.20.t:0 "Вакантные кафедры"
 ve_doctrine_journey.20.d:0 "Университеты расходятся во мнениях относительно того, должны ли новые кафедры подчиняться местным факультетам, государственным приоритетам или общему мандату на преподавание. Первые назначения определят, насколько свободно научное сообщество обменивается людьми и идеями."
 ve_doctrine_journey.20.a:0 "Профинансировать скоординированную национальную программу кафедр."
 ve_doctrine_journey.20.a.tt:0 "Потратить #N 15#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."
 ve_doctrine_journey.20.b:0 "Позволить каждому факультету самостоятельно определять свои кафедры."
 ve_doctrine_journey.20.b.tt:0 "Путь продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.20.c:0 "Привязать кафедры к сети публичных лекций."
 ve_doctrine_journey.20.c.tt:0 "Требуется Академическая идея V.\nПотратить #N 10#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."
 ve_doctrine_journey.21.t:0 "Республика рецензентов"
 ve_doctrine_journey.21.d:0 "Исследования теперь распространяются между институтами быстрее, чем старое покровительство успевает их оценивать. Ученые предлагают ввести национальное рецензирование коллегами, в то время как устоявшиеся академии отстаивают избирательное приглашение и дисциплинарную независимость."
 ve_doctrine_journey.21.a:0 "Финансировать национальную службу экспертной оценки."
 ve_doctrine_journey.21.a.tt:0 "Потратить #N 15#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."
 ve_doctrine_journey.21.b:0 "Оставить рецензирование на усмотрение ученых обществ."
 ve_doctrine_journey.21.b.tt:0 "Путь продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.21.c:0 "Созвать междисциплинарные советы по рецензированию."
 ve_doctrine_journey.21.c.tt:0 "Требуется Академическая идея VII.\nПотратить #N 10#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."

 ve_doctrine_journey.30.t:0 "Академия генерального штаба"
 ve_doctrine_journey.30.d:0 "Новая академия генерального штаба должна решить, что делает офицера пригодным к Командование. Реформаторы требуют экзаменов и общего обучения, в то время как признанные Командиры отстаивают выслугу лет и суждения, приобретенные на поле боя."
 ve_doctrine_journey.30.a:0 "Профинансировать национальные экзамены и общую учебную программу."
 ve_doctrine_journey.30.a.tt:0 "Потратить #N 15#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."
 ve_doctrine_journey.30.b:0 "Сбалансировать выслугу лет с рекомендациями академии."
 ve_doctrine_journey.30.b.tt:0 "Путь продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.30.c:0 "Ротировать полевых офицеров через аудитории академии."
 ve_doctrine_journey.30.c.tt:0 "Требуется Профессиональная армия, идея V.\nПотратить #N 10#! Национального опыта.\nПрогресс пути увеличивается на #P 4#!."
 ve_doctrine_journey.31.t:0 "Мобилизационные таблицы"
 ve_doctrine_journey.31.d:0 "Плановики подготовили конкурирующие графики для личного состава, припасов и железнодорожных перевозок. Единая общенациональная таблица сулит слаженность, однако региональное командование предупреждает, что жесткие расписания не учитывают местный потенциал."
 ve_doctrine_journey.31.a:0 "Финансировать центральное бюро мобилизации."
 ve_doctrine_journey.31.a.tt:0 "Потратить #N 15#! Национального опыта.\nПрогресс путешествия увеличивается на #P 4#!."
 ve_doctrine_journey.31.b:0 "Позволить региональному командованию поддерживать совместимые графики."
 ve_doctrine_journey.31.b.tt:0 "Путешествие продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.31.c:0 "Интегрировать планирование железных дорог, складов и командования."
 ve_doctrine_journey.31.c.tt:0 "Требуется идея Профессиональная армия VII.\nПотратить #N 10#! Национального опыта.\nПрогресс путешествия увеличивается на #P 4#!."
