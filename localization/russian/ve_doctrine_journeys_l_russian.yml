l_russian:
 ve_je_doctrine_journey_industrialist:0 "Стандартизация заводской системы"
 ve_je_doctrine_journey_industrialist_reason:0 "Промышленная доктрина распространилась за пределы отдельных заводов. Производители, инспекторы и администраторы теперь должны превратить местную практику в прочную национальную систему."
 ve_je_doctrine_journey_industrialist_status_both:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P +2#!\n\n#P Производственный масштаб соответствует#!: как минимум #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! Уровни производственных зданий.\n#P Стабильное управление соответствует#!: неотрицательная бюрократия, отсутствие приближающегося дефицита и менее 15% беспорядков в стране.\n\nНаграда за успех: #P +40 National Insight#!. Если Прогресс не достигает 60 в течение 60 месяцев, Путешествие заканчивается без награды."
 ve_je_doctrine_journey_industrialist_status_core:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nМесячный прогресс: #P +1#!\n\n#P Соответствующий масштаб производства#!: минимум #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! Уровни производственных зданий.\n#N Стабильность управления не достигнута#!: требуется неотрицательная бюрократия, отсутствие приближающегося дефицита и менее 15% беспорядков в стране.\n\nНаграда за успех: #P +40 национального понимания#!. Если Прогресс не достигает 60 в течение 60 месяцев, Путешествие завершается без награды."
 ve_je_doctrine_journey_industrialist_status_support:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P +1#!\n\n#N Производственный масштаб не достигнут#!: требуется как минимум #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! Уровни производственных зданий.\n#P Стабильное управление#!: неотрицательная бюрократия, отсутствие приближающегося дефицита и менее 15% беспорядков в стране.\n\nНаграда за успех: #P +40 национального понимания#!. Если Прогресс не достигнет 60 в течение 60 месяцев, Путешествие завершается без награды."
 ve_je_doctrine_journey_industrialist_status_neither:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nМесячный прогресс: #N 0#!\n\n#N Производственный масштаб не достигнут#!: требуется как минимум  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! Уровень производственных зданий.\n#N Стабильное управление не достигнуто#!: требуется неотрицательная бюрократия, отсутствие приближающегося дефицита и менее 15% беспорядков в стране.\n\nНаграда за успех: #P +40 национального понимания#!. Если Прогресс не достигнет 60 в течение 60 месяцев, Путешествие закончится без награды."
 ve_je_doctrine_journey_academic:0 "Республика ученых"
 ve_je_doctrine_journey_academic_reason:0 "Университеты и научные общества готовы стать национальным исследовательским сообществом, при условии, что их институты и социальные фонды смогут его поддерживать."
 ve_je_doctrine_journey_academic_status_both:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцы#!\nЕжемесячный прогресс: #P +2#!\n\n#P Университетская шкала выполнено#!: минимум #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! уровень здания университета.\n#P Основа грамотности достигнута#!: минимум 50% грамотности или на 5 процентных пунктов выше начального значения Путешествия.\n\nНаграда за успех: #P +15 Era Momentum#!. Если Прогресс не достигает 60 в течение 60 месяцев, Путешествие завершается без награды."
 ve_je_doctrine_journey_academic_status_core:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P +1#!\n\n#P Шкала университета соответствует#!: минимум #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! Уровни зданий университета.\n#N Основа грамотности не достигнута#!: требуется как минимум 50% грамотности или на 5 процентных пунктов выше начального значения Путешествия.\n\nНаграда за успех: #P +15 Era Momentum#!. Если Прогресс не достигает 60 в течение 60 месяцев, Путешествие завершается без награды."
 ve_je_doctrine_journey_academic_status_support:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P +1#!\n\n#N Университетская шкала не достигнута#!: требуется как минимум #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! уровень здания университета.\n#P Фундамент грамотности достигнут#!: минимум 50% грамотности или на 5 процентных пунктов выше начального значения Путешествия.\n\nНаграда за успех: #P +15 Era Momentum#!. Если Прогресс не достигает 60 в течение 60 месяцев, Путешествие завершается без награды."
 ve_je_doctrine_journey_academic_status_neither:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nЕжемесячный прогресс:  #N 0#!\n\n#N Шкала университета не достигнута#!: требуется как минимум  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! уровень здания университета.\n#N Фундамент грамотности не достигнут#!: требуется как минимум 50% грамотности или на 5 процентных пунктов выше начального значения Путешествия.\n\nНаграда за успех:  #P +15 Era Momentum#!. Если Прогресс не достигнет 60 в течение 60 месяцев, Путешествие закончится без награды."
 ve_je_doctrine_journey_professional_army:0 "Реформирование Генерального штаба"
 ve_je_doctrine_journey_professional_army_reason:0 "Профессиональный офицерский корпус требует большего, чем просто казармы и комиссии. Обучение, планирование и мобилизация должны быть организованы в одну прочную штатную систему."
 ve_je_doctrine_journey_professional_army_status_both:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P +2#!\n\n#P Шкала казарм достигнута#!: как минимум  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! уровни постройки казарм.\n#P Соответствующая профессиональная доктрина#!: закон профессиональной армии или технология Генерального штаба.\n\nНаграда за успех:  #Y институциональный генеральный штаб#!  (+7,5% скорости обучения, 36 месяцев). Если Прогресс не достигает 60 в течение 60 месяцев, Путешествие заканчивается без награды."
 ve_je_doctrine_journey_professional_army_status_core:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nМесячный прогресс: #P +1#!\n\n#P Масштаб казарм соблюден#!: как минимум #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! уровни постройки казарм.\n#N Профессиональная доктрина не соблюдена#!: требуется закон Профессиональной армии или технология Генерального штаба.\n\nНаграда за успех: #Y Институциональный генеральный штаб#!  (+7,5% скорости обучения, 36 месяцев). Если Прогресс не достигает 60 в течение 60 месяцев, Путешествие завершается без награды."
 ve_je_doctrine_journey_professional_army_status_support:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #P +1#!\n\n#N Шкала казарм не соблюдена#!: требуется как минимум #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! уровень строительства казарм.\n#P Соблюдается профессиональная доктрина#!: закон профессиональной армии или технология Генерального штаба.\n\nНаграда за успех: #Y Институциональный генеральный штаб#!  (+7,5% уровень подготовки, 36 месяцев). Если Прогресс не достигает 60 в течение 60 месяцев, Путешествие заканчивается без награды."
 ve_je_doctrine_journey_professional_army_status_neither:0 "Прогресс: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nОставшееся время: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] месяцев#!\nЕжемесячный прогресс: #N 0#!\n\n#N Шкала казарм не достигнута#!: требуется как минимум #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! уровень постройки казарм.\n#N Профессиональная доктрина не соблюдена#!: требуется закон Профессиональной армии или технология Генерального штаба.\n\nНаграда за успех: #Y Институциональный генеральный штаб#!  (+7,5% скорости обучения, 36 месяцев). Если Прогресс не достигнет 60 в течение 60 месяцев, Путешествие заканчивается без награды."
 ve_doctrine_journey_general_staff_reform_mdf:0 "Институциональный Генеральный Штаб"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Коллегии штабов, мобилизационные столы и единые стандарты подготовки стали прочной частью вооруженных сил."

 ve_doctrine_journey.1.t:0 "Стандартизация заводской системы"
 ve_doctrine_journey.1.d:0 "Промышленные ассоциации предлагают национальные усилия по согласованию машинного оборудования, проверок и производственной практики. Это предприятие продлится пять лет и потребует устойчивого промышленного масштаба и административной стабильности."
 ve_doctrine_journey.1.a:0 "Начните работу по стандартизации."
 ve_doctrine_journey.1.b:0 "Пересмотрите предложение через пять лет."
 ve_doctrine_journey.1.c:0 "Нашим заводам не нужна национальная доктрина."
 ve_doctrine_journey.2.t:0 "Республика ученых"
 ve_doctrine_journey.2.d:0 "Ректоры и научные общества предлагают пятилетнюю программу по объединению университетов в прочное национальное исследовательское сообщество. Его успех будет зависеть как от академического потенциала, так и от распространения грамотности."
 ve_doctrine_journey.2.a:0 "Спонсируйте республику ученых."
 ve_doctrine_journey.2.b:0 "Вернитесь к предложению через пять лет."
 ve_doctrine_journey.2.c:0 "Обучение должно оставаться организованным на местном уровне."
 ve_doctrine_journey.3.t:0 "Реформирование Генерального штаба"
 ve_doctrine_journey.3.d:0 "Старшие офицеры предлагают пятилетнюю реформу обучения, планирования и мобилизации. Генеральному штабу придется доказать, что профессиональная доктрина может выжить за пределами круга любимых командиров."
 ve_doctrine_journey.3.a:0 "Провести реформу генерального штаба."
 ve_doctrine_journey.3.b:0 "Еще раз пересмотрите планы через пять лет."
 ve_doctrine_journey.3.c:0 "Существующей системы командования достаточно."

 ve_doctrine_journey_start_tt:0 "Начинается пятилетнее доктринальное путешествие. Одновременно может быть активным только одно Путешествие по доктрине."
 ve_doctrine_journey_defer_tt:0 "Откладывает предложение этой группы на #Y 5 лет#!. Впоследствии это может быть предложено снова."
 ve_doctrine_journey_decline_tt:0 "Навсегда отклоняет доктринальное путешествие этой группы."

 ve_doctrine_journey.10.t:0 "Меры и допуски"
 ve_doctrine_journey.10.d:0 "Фабрики используют несовместимые калибры, фитинги и допуски. Инженеры призывают государство ввести единый каталог, в то время как провинциальные производители предупреждают, что жесткий стандарт может заморозить полезную местную практику."
 ve_doctrine_journey.10.a:0 "Профинансируйте национальный каталог стандартов."
 ve_doctrine_journey.10.a.tt:0 "Потратить #N 15#! Национальное понимание.\nПрогресс путешествия увеличивается на #P 4#!."
 ve_doctrine_journey.10.b:0 "Разрешить совместимость региональных стандартов."
 ve_doctrine_journey.10.b.tt:0 "Путешествие продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.10.c:0 "Используйте строительные офисы для координации внедрения."
 ve_doctrine_journey.10.c.tt:0 "Требуется Промышленная идея V.\nПотратьте #N 10#! Национальное понимание.\nПрогресс путешествия увеличивается на #P 4#!."
 ve_doctrine_journey.11.t:0 "Национальная инспекция"
 ve_doctrine_journey.11.d:0 "Первые общие стандарты теперь требуют соблюдения. Чиновники предлагают создать центральную инспекцию, производители предпочитают самосертификацию, а опытные специалисты по промышленному планированию выступают за аудит и того, и другого."
 ve_doctrine_journey.11.a:0 "Создать центральную промышленную инспекцию."
 ve_doctrine_journey.11.a.tt:0 "Потратить #N 15#! National Insight.\nПрогресс в пути увеличивается на #P 4#!."
 ve_doctrine_journey.11.b:0 "Признайте самосертификацию отрасли."
 ve_doctrine_journey.11.b.tt:0 "Путешествие продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.11.c:0 "Аудит инспекторов и производителей через одну систему."
 ve_doctrine_journey.11.c.tt:0 "Требуется идея промышленника VII.\nПотратить #N 10#! National Insight.\nПрогресс в путешествии увеличивается на #P 4#!."

 ve_doctrine_journey.20.t:0 "Открытые стулья"
 ve_doctrine_journey.20.d:0 "Университеты расходятся во мнениях относительно того, должны ли новые кафедры подчиняться местным факультетам, национальным приоритетам или мандату общественного преподавания. Первые назначения определят, насколько свободно научная сеть будет обмениваться людьми и идеями."
 ve_doctrine_journey.20.a:0 "Финансировать скоординированную национальную программу кафедр."
 ve_doctrine_journey.20.a.tt:0 "Потратьте #N 15#! National Insight.\nПрогресс путешествия увеличивается на #P 4#!."
 ve_doctrine_journey.20.b:0 "Позвольте каждому факультету определить свои собственные кафедры."
 ve_doctrine_journey.20.b.tt:0 "Путешествие продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.20.c:0 "Свяжите кафедры с публичной сетью лекций."
 ve_doctrine_journey.20.c.tt:0 "Требуется Академическая идея V.\nПотратьте #N 10#! Национальное понимание.\nПрогресс путешествия увеличивается на #P 4#!."
 ve_doctrine_journey.21.t:0 "Республика судей"
 ve_doctrine_journey.21.d:0 "Сейчас исследования перемещаются между учреждениями быстрее, чем об этом может судить старый патронаж. Ученые предлагают национальную экспертную оценку, в то время как признанные академии защищают выборочное приглашение и дисциплинарную независимость."
 ve_doctrine_journey.21.a:0 "Профинансируйте национальную службу рецензирования."
 ve_doctrine_journey.21.a.tt:0 "Потратить #N 15#! National Insight.\nПрогресс путешествия увеличивается на #P 4#!."
 ve_doctrine_journey.21.b:0 "Оставьте обзор на усмотрение образованных обществ."
 ve_doctrine_journey.21.b.tt:0 "Путешествие продолжается без немедленного изменения ресурсов или прогресса."
 ve_doctrine_journey.21.c:0 "Созовите междисциплинарные обзорные советы."
 ve_doctrine_journey.21.c.tt:0 "Требуется академическая идея VII.\nПотратить #N 10#! National Insight.\nПрогресс в путешествии увеличивается на #P 4#!."

 ve_doctrine_journey.30.t:0 "Колледж персонала"
 ve_doctrine_journey.30.d:0 "Новая штабная коллегия должна решить, что делает офицера пригодным для командования. Реформаторы требуют экзаменов и общего обучения, в то время как авторитетные командиры защищают старшинство и суждения, полученные на полевой службе."
 ve_doctrine_journey.30.a:0 "Финансировать национальные экзамены и общую учебную программу."
 ve_doctrine_journey.30.a.tt:0 "Потратьте #N 15#! National Insight.\nПрогресс путешествия увеличивается на #P 4#!."
 ve_doctrine_journey.30.b:0 "Сбалансируйте старшинство с рекомендациями колледжа."
 ve_doctrine_journey.30.b.tt:0 "Путешествие продолжается без немедленного изменения ресурсов или прогресса."
