 ve_state_religion_tt:0 "#P 告白国家のメカニズムと3人の伝道者を有効化します。#! 信者の支持に応じて宗教権力が高まります。"
 ve_freedom_of_conscience_tt:0 "#P 多元主義国家のメカニズムと1人の伝道者を有効化します。#! 宗教的調和は安定した共生に報います。"
 ve_total_separation_tt:0 "#P 多元主義国家のメカニズムを有効化します。#! 伝道者は無効化されます。"
 ve_ethnostate_tt:0 "#P 民族国家アイデンティティモデルと強く一致します。#! 市民国家と競合し、複合国家にはあまり適していません。"
 ve_national_supremacy_tt:0 "#P 民族国家アイデンティティモデルと一致します。#! 市民国家と競合します。"
 ve_racial_segregation_tt:0 "#P 複合国家アイデンティティモデルと一致します。#! 民族国家に対しては部分的な支持のみを提供します。"
 ve_cultural_exclusion_tt:0 "#P 複合国家アイデンティティモデルと一致し、市民国家を部分的に支持します。#!"
 ve_multicultural_tt:0 "#P 市民国家アイデンティティモデルと強く一致します。#! 民族国家と競合します。"
 ve_send_missionary_tt:0 "#variable 宣教師は毎年地元の人々の宗教を改宗させます #gold 6 か月。\n\n#white 州の人口が 250,000 未満の場合: #darker_white 0% #white ベース変換ベース電力減衰\n#white 州の人口が50万未満の場合: #negative_value -0.02% #white 変換ベース電力減衰\n#white 州の人口が75万未満の場合: #negative_value -0.03% #white 変換ベース電力減衰\n#white 州の人口が1m未満の場合: #negative_value -0.04% #white 変換ベース電力減衰\n#white If州人口は500万人未満です: #negative_value -0.043% #white コンバージョンベースパワー減衰\n#white 州の人口が1000万人未満の場合: #negative_value -0.045% #white コンバージョンベースパワー減衰\n#white 州の人口が1000万以上の場合: #negative_value -0.0475% #white コンバージョンベースパワー減衰"
 ve_targeted_cultural_project_state_action_tt:0 "#header 対象文化事業#!\n現在のアイデンティティモデルに関連付けられた事業を開始します。この州の人口の少なくとも #Y 5%#! を占める条件を満たす最大の非主要文化が標的となります。正確なコスト、進捗ルール、結果については国家アイデンティティパネルを開いて確認してください。"
