 ve_tb_click_ideas:0 "\n\n#Y クリック#!して思想パネルを開く。"
 ve_tb_click_religion:0 "\n\n#Y クリック#!して宗教パネルを開く。"
 ve_tb_click_culture:0 "\n\n#Y クリック#!して国家アイデンティティパネルを開く。"
 ve_tb_click_era:0 "\n\n#Y クリック#!して時代パネルを開く。"

 ve_tb_insight_tt:0 "$ve_national_insight_tt$$ve_tb_click_ideas$"
 ve_tb_idea_groups_tt:0 "$embrace_idea_tt$\n\n#title 国家思想の進捗#!\n#Y [GetPlayer.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n国家思想は、有効な取得済みグループ思想の数が #Y 3、6、9、12、15、18#! および #Y 21#! に達すると解放されます。$ve_tb_click_ideas$"
 ve_tb_piety_reform_tt:0 "$ve_piety_reform_tt$$ve_tb_click_religion$"
 ve_tb_settlement_tt:0 "$ve_piety_tt$$ve_tb_click_religion$"
 ve_tb_religious_project_tt:0 "$ve_religious_project_progress_tt$$ve_tb_click_religion$"
 ve_tb_mandate_tt:0 "$ve_culture_reform_point_tt$$ve_tb_click_culture$"
 ve_tb_cohesion_tt:0 "$ve_national_cohesion_tt$$ve_tb_click_culture$"
 ve_tb_cultural_project_tt:0 "$ve_cultural_project_progress_tt$$ve_tb_click_culture$"
 ve_tb_momentum_tt:0 "$ve_age_splendor_tt$$ve_tb_click_era$"
 ve_targeted_religious_project_state_action:0 "#tooltippable_name 対象を絞った宗教事業"
 ve_targeted_religious_project_state_action_tt:0 "#header 対象を絞った宗教事業#!\n当州の宗教的構成に対し、現在の宗教モデルに関連する事業を開始する。完全分離では開始できない。正確なコスト、進捗ルール、成果については宗教パネルを開いて確認すること。"
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name 対象を絞った文化事業"
 ve_start_religious_project_button:0 "事業を開始"
 ve_cancel_religious_project_button:0 "事業を中止"
 ve_confirm_cancel_button:0 "#N はい、中止します#!"
 ve_keep_project_button:0 "事業を維持"
 ve_targeted_religious_project_state_requirements_tt:0 "州は我が国が所有している必要があり、かつ自国宗教の人口比率がすでに #Y 90%#! 未満でなければなりません。告白国家、良心の自由、および国家無神論はそれぞれ1つずつ開始できますが、完全分離は開始できません。また、アクティブな宗教モデルの信仰改革力のコストを満たす必要があります。"

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "宗教モデルが対象事業を許可していること（完全分離では開始できません）"
 ve_religious_project_req_no_active:0 "現在進行中の宗教事業がないこと"
 ve_religious_project_req_no_backlash:0 "事業のキャンセル後24か月のクールダウン中ではないこと"
 ve_religious_project_req_reform_point:0 "アクティブな宗教モデル分の十分な信仰改革力があること（告白国家 #Y 125#! / 良心の自由 #Y 100#! / 国家無神論 #Y 150#!）"
 ve_religious_project_req_target:0 "自国宗教がこの州の人口の #Y 90%#! 未満を占めていること"
 ve_religious_project_cancel_warning:0 "#header 宗教事業をキャンセルしますか？#!\n\nこれまでの進捗は失われます。別の事業を開始できるようになる前に、#N -5 宗教的和解#!と #N 24か月#!のクールダウン補正が適用されます。"
 ve_cultural_project_req_no_active:0 "現在進行中の文化事業がないこと"
 ve_cultural_project_req_no_backlash:0 "事業のキャンセル後24か月のクールダウン中ではないこと"
 ve_cultural_project_req_reform_point:0 "アクティブなアイデンティティモデル分の十分な文化政策力があること（民族国家 #Y 125#! / 市民国家 #Y 100#! / 複合国家 #Y 150#!、複合国家の場合はさらに結束力 #Y 40#!）"
 ve_cultural_project_req_target:0 "この州に人口の少なくとも #Y 5%#! を占める条件を満たす非主要文化が存在すること"
 ve_cultural_project_cancel_warning:0 "#header 文化事業をキャンセルしますか？#!\n\nこれまでの進捗は失われます。別の事業を開始できるようになる前に、#N -5 国家結束#!と #N 24か月#!のクールダウン補正が適用されます。"
 alert_can_unlock_ideas_name:0 "思想を採用可能"
 alert_can_unlock_ideas_hint:0 "採用済みグループの次の思想の少なくとも1つ分に十分な国政識見があり、現在国策施行サイクルによって購入が阻まれていません。"
 alert_max_piety_name:0 "宗教国家プログラムを採用可能"
 alert_max_piety_hint:0 "信仰改革力が別の宗教プログラムを採用するのに十分な高さに達しています。"
 alert_ve_can_begin_cultural_project_name:0 "文化政策力が蓄積されている"
 alert_ve_can_begin_cultural_project_hint:0 "文化政策力が #Y 300#! を超えており、開始可能な文化事業が存在します。政策力収入は400で半減し500で停止するため、消費する価値があります。強制されることはありません。アイデンティティモデルはすでに有効です。"
 alert_can_unlock_age_bonus_name:0 "時代の報酬を解放可能"
 alert_can_unlock_age_bonus_hint:0 "別の報酬を選択するのに十分な時代勢力があります。"
