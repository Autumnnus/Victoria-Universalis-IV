 ve_targeted_religious_project_state_action:0 "#tooltippable_name 対象を絞った宗教プロジェクト"
 ve_targeted_religious_project_state_action_tt:0 "#header 対象を絞った宗教プロジェクト#!\nこの州の宗教構成に対する現在の宗教モデルに関連付けられたプロジェクトを開始します。完全な分離では開始できません。正確なコスト、進行ルール、結果を確認するには、「宗教」パネルを開いてください。"
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name 対象文化プロジェクト"
 ve_start_religious_project_button:0 "プロジェクトの開始"
 ve_cancel_religious_project_button:0 "プロジェクトのキャンセル"
 ve_confirm_cancel_button:0 "#N はい、キャンセルします#!"
 ve_keep_project_button:0 "プロジェクトを維持します"
 ve_targeted_religious_project_state_requirements_tt:0 "国家は私たちによって所有されなければならず、私たち自身の宗教がすでに保持されていてはなりません #Y 90%#! またはその人口のそれ以上。告白、良心の自由、無神論国家はそれぞれを始めることができます。完全な分離はできません。積極的な宗教モデルの敬虔改革コストも満たさなければなりません。"

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "宗教モデルにより、対象を絞ったプロジェクトが可能になります（完全な分離を開始することはできません）"
 ve_religious_project_req_no_active:0 "対象を絞った宗教プロジェクトはすでに進行中ではありません"
 ve_religious_project_req_no_backlash:0 "プロジェクトをキャンセルした後、24 か月のクールダウン期間中ではない"
 ve_religious_project_req_reform_point:0 "積極的な宗教モデルには十分な敬虔改革 (#Y 125#! 告白 / #Y 100#! 良心の自由 / #Y 150#! 国家無神論）"
 ve_religious_project_req_target:0 "私たち自身の宗教は以下のものを保持しています #Y 90%#! この州の人口のうち"
 ve_religious_project_cancel_warning:0 "#header 対象の宗教プロジェクトをキャンセルしますか?#!\n\nこれまでの進捗状況は失われます。 #N -5 宗教和解#! そして #N 24ヶ月#! クールダウン修飾子は、別のプロジェクトを開始する前に適用されます。"
 ve_cultural_project_req_no_active:0 "すでに進行中の文化プロジェクトはない"
 ve_cultural_project_req_no_backlash:0 "プロジェクトキャンセル後の24か月のクールダウン中ではない"
 ve_cultural_project_req_reform_point:0 "アクティブなアイデンティティモデルに対して十分な文化的義務がある（#Y 125#! エスニック / #Y 100#! シビック / #Y 150#! 複合、プラス #Y 40#! 複合材料の凝集力)"
 ve_cultural_project_req_target:0 "この州には、少なくとも次の条件を満たす適格な非主要文化があります。 #Y 5%#! その人口の"
 ve_cultural_project_cancel_warning:0 "#header 文化プロジェクトをキャンセルしますか?#!\n\nこれまでの進捗状況は失われます。 #N -5 国民の団結力#! そして #N 24ヶ月#! クールダウン修飾子は、別のプロジェクトを開始する前に適用されます。"
 alert_can_unlock_ideas_name:0 "アイデアを採用できます。"
 alert_can_unlock_ideas_hint:0 "少なくとも 1 つの採用グループの次のアイデアについて十分な国民的洞察力があり、現時点で購入を妨げている教義実装サイクルはありません。"
 alert_max_piety_name:0 "宗教国家プログラムを採用できます"
 alert_max_piety_hint:0 "私たちの敬虔改革は、別の宗教計画を採用するのに十分なレベルにあります。"
 alert_ve_can_begin_cultural_project_name:0 "積み重なる文化的使命"
 alert_ve_can_begin_cultural_project_hint:0 "もう終わった #Y 300#! 文化的使命と私たちが始められる文化的プロジェクト。義務収入は 400 で半分になり、500 で停止するため、支出する価値があります。何も強制されることはありません。アイデンティティ モデルはすでにアクティブです。"
 alert_can_unlock_age_bonus_name:0 "時代の報酬をアンロックできる"
 alert_can_unlock_age_bonus_hint:0 "私たちには、別の報酬を選択するのに十分な時代の勢いがあります。"
 ag_ve_missionary_group_name:0 "宗教的および文化的活動"
 alert_can_use_missionary_name:0 "宣教師を派遣できます"
 alert_can_use_missionary_hint:0 "私たちの宣教師は、積極的な宣教を待っています。所有する州をクリックして、地元の人々を改宗させます。"
 ag_ve_state_project_group_name:0 "対象国家プロジェクト"
 alert_ve_can_begin_targeted_cultural_project_name:0 "対象を絞った文化プロジェクトを開始できます。"
 alert_ve_can_begin_targeted_cultural_project_hint:0 "アイデンティティ モデルの対象の文化プロジェクトに適したリソースと適格な州があります。"
 alert_ve_can_begin_targeted_religious_project_name:0 "対象を絞った宗教プロジェクトを開始できます"
 alert_ve_can_begin_targeted_religious_project_hint:0 "私たちは敬虔改革と積極的な宗教モデルプロジェクトの適格国家を持っています。"
 ve_culture_reform_cost_tt:0 "レガシー文化改革要件。"
 ve_state_religion_tt:0 "#P 告白国家の仕組みと3人の宣教師を有効にします。#! 宗教当局は敬虔な支持に強く反応します。"
 ve_freedom_of_conscience_tt:0 "#P 多元主義国家の仕組みと1人の宣教師を有効にします。#! 宗教の調和は安定した共存に報います。"
 ve_total_separation_tt:0 "#P 多元主義国家を有効にします。メカニズム。#! 宣教師は無効です。"
 ve_ethnostate_tt:0 "#P 民族国家アイデンティティ モデルと強く一致しています。#! 市民国家と矛盾しており、複合国家にはあまり適していません。"
 ve_national_supremacy_tt:0 "#P 民族国家アイデンティティモデルと一致します。#! シビック・ネイションとは対立します。"
 ve_racial_segregation_tt:0 "#P 複合状態アイデンティティモデルと一致します。#! 民族国家に対する部分的な支援のみを提供します。"
 ve_cultural_exclusion_tt:0 "#P 複合国家アイデンティティ モデルと連携し、Civic Nation を部分的にサポートします。#!"
 ve_multicultural_tt:0 "#P 市民国家のアイデンティティモデルと強く一致しています。#! それは民族国家と矛盾しています。"
 ve_send_missionary_tt:0 "#variable 宣教師は毎年地元の人々の宗教を改宗させています。 #gold 6 か月。\n\n#white 州の人口が 250,000 未満の場合: #darker_white 0% #white ベース変換ベース電力減衰\n#white 州の人口が50万未満の場合: #negative_value -0.02% #white 変換ベース電力減衰\n#white 州の人口が75万未満の場合: #negative_value -0.03% #white 変換ベース電力減衰\n#white 州の人口が1m未満の場合: #negative_value -0.04% #white 変換ベース電力減衰\n#white If州人口が500万人未満の場合: #negative_value -0.043% #white コンバージョンベースパワー減衰\n#white 州の人口が1000万人未満の場合: #negative_value -0.045% #white コンバージョンベースパワー減衰\n#white 州の人口が1000万人以上の場合: #negative_value -0.0475% #white コンバージョンベースパワー減衰"
 ve_targeted_cultural_project_state_action_tt:0 "#header 対象文化プロジェクト#!\n関連するプロジェクトを開始現在のアイデンティティモデルを使用します。少なくとも次の条件を満たす最大の適格な非一次文化 #Y 5%#! この州の人口のうちの 1 人が対象となります。国民のアイデンティティパネルを開いて、正確なコスト、進捗ルール、結果を確認します。"
 ve_topbar:0 "トップバーのコンテンツを切り替えます"

