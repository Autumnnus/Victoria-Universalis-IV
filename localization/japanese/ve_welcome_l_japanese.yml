l_japanese:
 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "本キャンペーンは再構築されたVictoria Universalis IV上で動作します。要約:\n\n#Y 宗教#! - あなたの教会と国家の法律により、4つの宗教モデルのいずれかが設定されます。0-100の宗教的和解メーターを維持し、モデルごとに8つの永続的プログラムに信仰改革力を費やし、任意の州で特定の宗教事業を1つ実行することができます。\n\n#Y 国家アイデンティティ#! - 民族的、市民的、または複合的な国家観を持ち、文化政策力を消費し、国家結束メーターを高水準に維持し、5つの文化事業を行います。\n\n#Y 思想グループ#! - 生産、社会、軍事にわたる21のグループ（新登場の農本主義グループを含む）。グループスロットは暦年ではなく国策への投資によって獲得され、購入のたびに24ヶ月の導入期間が必要となります。\n\n#Y 国家思想#! - 12の新国家プロフィール。進捗は購入したすべての思想レベルからもたらされます。\n\n#Y 時代#! - 目標を持つ3つの時代、13の時代の報酬スロット、3つの黄金時代、そして各時代につき1つの戦略的な時代の分水嶺のジャーニー。\n\n#Y 新コンテンツ#! - 100を超える新イベント: 国策のジレンマ、多年にわたる国策ジャーニー、事業のインシデントと危機、そしてオスマン帝国、日本、アメリカ合衆国のフレーバーチェイン。\n\n#Y インターフェース#! - 新しいトップバー行、再構築された宗教および国家アイデンティティページ、すべての国パネル上の国策表示、および全世界のドクトリン台帳。"
 ve_welcome.1.f:0 "すべての国策は、それを採用する国家にその足跡を残す。"
 ve_welcome.1.a:0 "詳細はMODの説明を参照のこと。健闘を祈る ^_^"
