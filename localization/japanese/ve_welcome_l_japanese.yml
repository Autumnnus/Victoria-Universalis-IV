 # Victoria Universalis IV 2.0 の開始イベント - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "このキャンペーンは再構築された Victoria Universalis IV で動作しています。要点は次のとおりです。\n\n#Y 宗教#! - 教会と国家の法律が4つの宗教モデルのいずれかを決定します。0～100の宗教的定着度を持ち、敬虔の改革を各モデル8つの恒久プログラムに費やし、任意の州で1つの宗教プロジェクトを進められます。\n\n#Y 国家アイデンティティ#! - 民族国家・市民国家・複合国家のいずれかを選びます。文化的使命を費やし、国家凝集を高く保ち、5つの文化プロジェクトを進めます。\n\n#Y アイデアグループ#! - 生産・社会・軍事にまたがる21グループ。新しい農業グループも加わりました。グループ枠は暦ではなく教義への投資で得られ、購入ごとに24か月の実施期間がかかります。\n\n#Y 国家アイデア#! - 12の新しい国家プロファイル。進行度は購入したアイデアの各段階から得られます。\n\n#Y 時代#! - 目標を持つ3つの時代、13の時代報酬枠、3種類の黄金時代。さらに各時代に1つの戦略的な時代の岐路が加わります。\n\n#Y 新規コンテンツ#! - 100を超える新イベント。教義のジレンマ、数年にわたる教義の旅、プロジェクトの事件と危機、そしてオスマン・日本・アメリカ合衆国の専用チェーン。\n\n#Y インターフェース#! - 新しい上部バーの行、再構築された宗教と国家アイデンティティのページ、各国パネルの教義概要、そして世界規模の教義台帳。"
 ve_welcome.1.f:0 "すべての教義は、それを採用した国家に痕跡を残す。"
 ve_welcome.1.a:0 "詳細はMODの説明をご覧ください。楽しんでね ^_^"
