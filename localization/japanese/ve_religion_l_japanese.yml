 ve_confessional_conversion_name:0 "告白教化"
 ve_confessional_conversion_cost:0 "コスト: #Y 125 信仰改革力#!"
 ve_confessional_conversion_short:0 "1つの州を国教へと改宗させる。\n完了時に #P +20 信仰改革力, +5 和解#!を獲得するが、急進派を生み出す。"
 ve_confessional_conversion_desc:0 "#header 告白教化#!\n自国の宗教の割合が #Y 90%#!未満の単一の州で実行する。\n\n#Y コスト#!\n#Y 125 信仰改革力#!（即座に支払い）\n\n#Y 実行中#!\n国家に対して #N -50 行政力, -25 権力#!\n対象州で #N +20% 改宗および +20% 急進主義チャンネル#!\n\n#Y 完了時#!\n州の人口の #Y 5%#!、あるいは国家主義 VII を有している場合は #Y 7%#!を国教へと改宗させる。\n#P +20 信仰改革力, +5 宗教的和解#!\n\n#Y 警告#!\n#N この改宗により対象州で急進派が発生する。#!"
 ve_freedom_outreach_name:0 "自由啓発活動"
 ve_freedom_outreach_cost:0 "コスト: #Y 100 信仰改革力#!"
 ve_freedom_outreach_short:0 "改宗を強要することなく1つの州を味方に引き入れる。\n完了時に #P +20 信仰改革力, +7 和解#!を獲得し、さらに体制派を得る。"
 ve_freedom_outreach_desc:0 "#header 自由啓発活動#!\n自国宗教の比率が #Y 90%#! 未満の単一の州において実施します。\n\n#Y コスト#!\n#Y 信仰改革力 100#!、即時支払い\n\n#Y 実施中#!\n国内の #N 行政力 -50、権力 -25#!\n\n#Y 完了時#!\n#P 強制改宗なし#! - 代わりに標的国の州内の体制派が\n#P 信仰改革力 +20、宗教的和解 +7#!のおり"
 ve_secularization_campaign_name:0 "世俗化運動"
 ve_secularization_campaign_cost:0 "費用: #Y 150 信仰改革力#!"
 ve_secularization_campaign_short:0 "1つの州を無神論に改宗させます。\n完了時に #P +25 信仰改革力、+8 宗教的和解#!を獲得しますが、急進派を生み出します。"
 ve_secularization_campaign_desc:0 "#header 世俗化運動#!\n自国宗教の割合が #Y 90%#! 未満の単一の州で実行する。\n\n#Y 費用#!\n#Y 信仰改革力 150#!（即時支払い）\n\n#Y 実行中#!\n国家の #N 行政力 -50、権力 -25#!\n標的国の #N 改宗 +20%、急進主義の流入 +20%#!\n\n#Y 完了時#!\n州の #Y 人口の 5%#!、国家主義 VII の場合は #Y 7%#! を無神論へと改宗する。\n#P 信仰改革力 +25、宗教的和解 +8#!\n\n#Y 警告#!\n#N この改宗は標的国に急進派を生み出す。#!"
 ve_religious_project_unavailable_name:0 "利用可能な事業なし"
 ve_religious_project_unavailable_cost:0 "#N 完全分離では宗教事業を実行できません#!"
 ve_religious_project_unavailable_short:0 "中立モデルには意図的に宗教運動がありません。希望する場合は別の「教会と国家」の法律を制定してください。"
 ve_religious_project_unavailable_desc:0 "#header 利用可能な事業なし#!\n完全分離は完全なる中立モデルであり、標的を絞った宗教事業を開始することはできません。\n\n国教制、良心の自由、国家無神論はそれぞれ独自の事業を実行します。一致する「教会と国家」の法律を制定して獲得してください。"

