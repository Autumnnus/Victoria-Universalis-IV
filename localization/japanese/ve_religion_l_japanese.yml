 ve_confessional_conversion_name:0 "信仰改宗"
 ve_confessional_conversion_cost:0 "コスト: #Y 125 敬虔改革#!"
 ve_confessional_conversion_short:0 "1つの州を国教に改宗させる。\n#P +20 敬虔な改革、+5 和解#! 完了すると - しかし、過激派が作成されます。"
 ve_confessional_conversion_desc:0 "#header 告白の改宗#!\n自分の宗教の割合が以下の単一の州で実行する #Y 90%#!。\n\n#Y 費用#!\n#Y 125 信心改革#!、即時支払い\n\n#Y 実行中#!\n#N -50 官僚制、-25 権限#! 国のために\n#N +20% コンバージョンおよび +20% 過激派チャンネル#! ターゲット状態で\n\n#Y 完了時#!\n変換 #Y 5%#! 州の人口のあなたの国教に対する信仰、または #Y 7%#! 国民主義者 VII と\n#P +20 敬虔改革、+5 宗教定住#!\n\n#Y 警告#!\n#N 変換により、ターゲットの州に部首が作成されます。#!"
 ve_freedom_outreach_name:0 "自由の普及"
 ve_freedom_outreach_cost:0 "コスト: #Y 100 敬虔な改革#!"
 ve_freedom_outreach_short:0 "変換を強制せずに 1 つの州に勝利します。\n#P +20 敬虔な改革、+7 和解#! 完成時には、支持者も加わります。"
 ve_freedom_outreach_desc:0 "#header 自由の普及活動#!\n自分の宗教の割合が #Y 90%#!未満である単一の州で実行します。\n\n#Y コスト#!\n#Y 100 敬虔改革#!、すぐに支払われます\n\n#Y 実行中#!\n#N -50 官僚主義、-25 権威#! 国のために\n\n#Y 完了時#!\n#P 強制改宗なし#! 対象国の支持者が代わりに\n#P +20信心改革、+7宗教定住#!"
 ve_secularization_campaign_name:0 "世俗化キャンペーン"
 ve_secularization_campaign_cost:0 "コスト:  #Y 150 敬虔改革#!"
 ve_secularization_campaign_short:0 "1 つの州を無神論に改宗させます。\n#P +25 敬虔な改革、+8 和解#! 完了すると - しかし、過激派が生まれます。"
 ve_secularization_campaign_desc:0 "#header 世俗化キャンペーン#!\n自分の宗教の割合が #Y 90%#!未満である単一の州で実行します。\n\n#Y コスト#!\n#Y 150 敬虔改革#!、すぐに支払いました\n\n#Y 実行中#!\n#N -50 官僚主義、-25 権威#! 国のために\n#N +20% コンバージョンと +20% 過激主義チャンネル#! ターゲット状態\n\n#Y 完了時#!\n変換 #Y 5%#! 州の人口の無神論、または #Y 7%#! 国民主義者 VII と\n#P +25 敬虔改革、+8 宗教定住#!\n\n#Y 警告#!\n#N この転換により、対象国に急進派が生まれます。#!"
