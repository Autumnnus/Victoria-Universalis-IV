 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "宗教モデル"
 ve_religious_models_help:0 "あなたの宗教モデルは、あなたの宗教モデルによって決定されます。 #Y 教会と国家#! 法律とそれは #P すでにアクティブです#! - ここでは選択するものは何もありません。モデルは方法を決定するだけです #Y 宗教的居住地#! 獲得できる金額、どの 8 つのプログラムを採用できるか、どの宗教プロジェクトを実行できるか。\n#Y 法律の変更はオプションです:#! 決済をリセットします #Y 35#!、採用したすべてのプログラムを削除し、実行中の宗教プロジェクトをキャンセルし、 #Y 3～5 年#! 決済危機。\n#Y カードまたはメーターをポイントすると、その効果を最大限に発揮できます。#!"
 ve_religious_model_active_footer:0 "現在のモデル"
 ve_confessional_state_short:0 "教会と州は一緒に統治します。\n和解は次から生まれます。 #Y 敬虔な承認と影響力#!。"
 ve_freedom_state_short:0 "あらゆる信仰は 1 つの州の下で容認されます。\n和解は以下から生じます。 #Y 穏やかでよく運営された国#!。"
 ve_separation_state_short:0 "国家は宗教上の立場をまったく持っていません。\n和解は最高額で開始され、報酬も得られます #Y 低い混乱#!。"
 ve_atheism_state_short:0 "国家主導の積極的な世俗化。\n和解は #Y 読み書き能力とインテリジェンシア#!."
 ve_confessional_state_unlocks:0 "を実行します。 #Y 告白の改心#! プロジェクト"
 ve_freedom_state_unlocks:0 "を実行します #Y Freedom Outreach#! プロジェクト"
 ve_separation_state_unlocks:0 "#N 宗教プロジェクトは実行できません#!"
 ve_atheism_state_unlocks:0 " #Y 世俗化キャンペーン#! プロジェクト"
 ve_confessional_state_desc:0 "#header 告白状態#!\n教会と州は共に統治します。\n\n#Y 活動中#!\n#P 権威+5%、改宗+10%、敬虔な政治力+10%#!\n#N -3% 移住誘致、+5% 公然偏見からの急進主義者#!\nさらに、国教の信仰家族 (キリスト教、イスラム教、ユダヤ教、ダルマ教、学者、アニミスト) のための小さなパッケージ 1 つ。\n\n#Y 和解#!\n基本均衡 #Y 55#!。敬虔な承認と影響力が最もそれを動かします。\n\n#Y 75 和解時#!\n#P 権限 +5%、正統性 +5#!\n\n#Y 宗教プロジェクト#!\n告白改宗"
 ve_freedom_state_desc:0 "#header 良心の自由#!\nすべての信仰は 1 つの国家の下で容認されます。\n\n#Y 活動中#!\n#P +5% 移住誘致、公然の偏見からの -5% 急進派#!\n#N  -15% 改宗、-25 官僚主義#!\n\n#Y 決済#!\n基本均衡 #Y 55#!。混乱が少なく、正当性があり、健全な政権がこの値を上げます。\n\n#Y 75 和解時#!\n#P +5% 移民誘致、+5 正当性#!\n\n#Y 宗教プロジェクト#!\n自由普及活動"
 ve_separation_state_desc:0 "#header 完全分離#!\n中立モデル: 国家は宗教的立場を取りません。\n\n#Y 活動中#!\n#P +8% 移民誘致、公然の偏見からの急進派の -10%、暴力的な過激派の -5%敵意#!\n#N -30% 変換#!\n\n#Y 和解#!\n基本均衡 #Y 60#!、4 つの中で最も高い。混乱が少ないとさらに上昇します。\n\n#Y 和解75で#!\n#P 法律制定の成功率+5%、正当性+5#!\n\n#Y 宗教プロジェクト#!\n#N なし。このモデルには意図的に宗教運動がありません。#!"
 ve_atheism_state_desc:0 "#header 国家無神論#!\n寛容なモデルではなく、積極的な世俗化モデルです。\n\n#Y 活動中#!\n#P +5% テクノロジー普及、+2% 教育アクセス、+20% 改宗#!\n#N -5% 権威、-10% 敬虔な政治力、+5% 公然とした偏見からの急進派#!\n\n#Y 和解#!\n基本均衡 #Y 45#!、4 つのうちの最低値。識字能力とインテリジェンシアの承認がそれを高めます。信心深い影響力が強いとそれが下がります。\n\n#Y 75 決済時#!\n#P +5% テクノロジー普及、+5% 官僚主義#!\n\n#Y 宗教プロジェクト#!\n世俗化キャンペーン\n\n#Y 注#!\nこのモデルに切り替えるには、 #N 5年#! 識字率が 50% 未満、または敬虔な影響力が 20% 以上の場合、危機は 3 ではなく危機となります。"

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "プログラムは #Y オプション#! そして永久的。それぞれにかかる費用 #Y 25 信心改革#! そして、 #Y 24ヶ月#! 実行の負担がかかり、その間はそれ以上のプログラムを採用できなくなります。 8 つすべてが現在の宗教モデルに属しており、そのモデルが変更されると失われます。\n#Y カードまたはメーターにカーソルを合わせると、その効果を最大限に発揮できます。#!"
 ve_religious_program_strain_notice:0 "プログラムはまだ実施中です。その負担が終了するまで、これ以上プログラムを採用することはできません。"
 ve_religious_program_adopted_badge:0 "採用されました"
 ve_adopt_program_button:0 "採用する"
 ve_religious_program_cost_label:0 "コスト #Y 25 敬虔な改革#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "標的を絞った宗教プロジェクト"
 ve_religious_projects_intro:0 "宗教プロジェクトというのは、 #Y オプション#! 一度に実行できるのは 1 つだけです。その信心改革費用は直ちに支払われ、 #N -50 官僚主義と -25 権威#! 実行される限り適用されます。それを完了すると敬虔改革の一部が払い戻され、宗教和解が増加します。\n#Y カードまたはメーターにカーソルを合わせると、その効果を最大限に発揮できます。#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "進行中のプロジェクト"
 ve_religious_project_backlash_notice:0 "キャンセルされたプロジェクトは依然として新しいプロジェクトをブロックしています。最初に 24 か月のバックラッシュが期限切れになる必要があります。"
