 ve_religious_project_hint:0 "任意。宗教モデルで許可されている場合、自国のいずれかの州から開始されます。"

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "宗教モデル"
 ve_religious_models_help:0 "あなたの宗教モデルは#Y 教会と国家#!の法律によって決定され、#P すでに有効です#!。ここで選択するものはありません。このモデルは、#Y 宗教的和解#!がどのように獲得されるか、どの8つのプログラムを採用できるか、どの宗教事業を実行できるかを決定するのみです。\n#Y 法律の変更は任意です:#! 和解が#Y 35#!にリセットされ、採用したすべてのプログラムが削除され、実行中の宗教事業がキャンセルされ、#Y 3〜5年#!の和解の危機が適用されます。\n#Y カードまたはメーターにカーソルを合わせると、その完全な効果が表示されます。#!"
 ve_religious_model_active_footer:0 "現在のモデル"
 ve_confessional_state_short:0 "教会と国家が共同で統治します。\n和解は#Y 信者の支持と影響力#!から生み出されます。"
 ve_freedom_state_short:0 "あらゆる信仰が一つの国家の下で寛容されます。\n和解は#Y 穏やかでよく統治された国家#!から生み出されます。"
 ve_separation_state_short:0 "国家は宗教に対して一切の立場をとらない。\n和解は最も高い状態で始まり、#Y 低い社会不安#!によって報酬が与えられる。"
 ve_atheism_state_short:0 "国家的主導による積極的な世俗化。\n和解は #Y 識字率と知識人#!から得られる。"
 ve_confessional_state_unlocks:0 "#Y 告白教化#!プロジェクトを実行する"
 ve_freedom_state_unlocks:0 "#Y 自由啓発活動#!プロジェクトを実行する"
 ve_separation_state_unlocks:0 "#N 宗教事業を実行できない#!"
 ve_atheism_state_unlocks:0 "#Y 世俗化運動#!プロジェクトを実行する"
 ve_confessional_state_desc:0 "#header 告白国家#!\n教会と国家が共に統治する。\n\n#Y 有効期間中#!\n#P +5% 権力, +10% 改宗, +10% 信者の政治力#!\n#N -3% 移住求心力, +5% 露骨な偏見による急進派#!\nさらに国教の信仰系統（キリスト教、イスラム教、ユダヤ教、インド諸宗教、学問的、アニミズム）に応じたささやかな恩恵がもたらされる。\n\n#Y 和解#!\n基本均衡値 #Y 55#!。信者の支持と影響力によって最も大きく変動する。\n\n#Y 和解が 75 の場合#!\n#P +5% 権力, +5 正当性#!\n\n#Y 宗教事業#!\n告白教化"
 ve_freedom_state_desc:0 "#header 良心の自由#!\n単一の国家のもとで全ての信仰が寛容される。\n\n#Y 有効期間中#!\n#P +5% 移住求心力, -5% 露骨な偏見による急進派#!\n#N -15% 改宗, -25 行政力#!\n\n#Y 和解#!\n基本均衡値 #Y 55#!。低い社会不安、正当性、および健全な行政によって上昇する。\n\n#Y 和解が 75 の場合#!\n#P +5% 移住求心力, +5 正当性#!\n\n#Y 宗教事業#!\n自由啓発活動"
 ve_separation_state_desc:0 "#header 完全分離#!\n中立的なモデル：国家は宗教的な立場をとらない。\n\n#Y 有効期間中#!\n#P +8% 移住求心力, -10% 露骨な偏見による急進派, -5% 激しい敵意による急進派#!\n#N -30% 改宗#!\n\n#Y 和解#!\n基本均衡値 #Y 60#!（4つの中で最高値）。低い社会不安によりさらに上昇する。\n\n#Y 和解が 75 の場合#!\n#P +5% 法律の制定成功, +5 正当性#!\n\n#Y 宗教事業#!\n#N なし。このモデルには意図的に宗教キャンペーンが存在しない。#!"
 ve_atheism_state_desc:0 "#header 国家無神論#!\n寛容なものではなく、攻撃的な世俗化モデル。\n\n#Y 有効期間中#!\n#P +5% 技術の普及, +2% 教育機会, +20% 改宗#!\n#N -5% 権力, -10% 信者の政治力, +5% 露骨な偏見による急進派#!\n\n#Y 和解#!\n基本均衡値 #Y 45#!（4つの中で最低値）。識字率と知識人の支持によって上昇し、信者の強い影響力によって低下する。\n\n#Y 和解が 75 の場合#!\n#P +5% 技術の普及, +5% 行政力#!\n\n#Y 宗教事業#!\n世俗化運動\n\n#Y 注意#!\n識字率が 50% 未満であるか、信者の影響力が 20% 以上である場合、このモデルへの移行には 3 年ではなく #N 5 年#!の危機コストがかかる。"

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "プログラムは #Y 任意#!であり永続的である。各プログラムは #Y 25 信仰改革力#!を消費し、#Y 24ヶ月#!の移行重圧を開始する。その間はさらなるプログラムを採用できない。8つのプログラムは全て現在の宗教モデルに属しており、モデルが変更された場合は失われる。\n#Y カードやメーターにカーソルを合わせると効果の詳細が表示される。#!"
 ve_religious_program_strain_notice:0 "プログラムが現在実装中であるため、重圧が切れるまでさらなるプログラムを採用することはできない。"
 ve_religious_program_adopted_badge:0 "採用済み"
 ve_adopt_program_button:0 "採用"
 ve_religious_program_cost_label:0 "コスト: #Y 25 信仰改革力#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "対象を絞った宗教事業"
 ve_religious_projects_intro:0 "宗教事業は #Y 任意#!であり、同時に実行できるのは1つのみである。信仰改革力コストは即座に支払われ、実行中は #N -50 行政力および -25 権力#!が適用される。完了すると信仰改革力の一部が払い戻され、宗教的和解が上昇する。\n#Y カードやメーターにカーソルを合わせると効果の詳細が表示される。#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "事業進行中"
 ve_religious_project_backlash_notice:0 "キャンセルされた事業は新しい事業の開始を妨げるため、まず 24ヶ月の反発が期限切れにならなければならない。"
 ve_religious_project_start_instruction:0 "#Y 開始方法#!\n1. 自国のいずれかの州を開く。\n2. その州のパネルにある #Y 事業を開始#!を押す。\n不足しているものはすべて、そのボタンのツールチップにリストされる。"
