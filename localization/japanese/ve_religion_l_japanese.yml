l_japanese:
 ve_piety:0 "信仰"
 ve_piety_reform:0 "信仰改革力"
 ve_piety_reform_tt:0 "#header 信仰改革力#!\n現在値: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n月間収入: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y 月間内訳#!\n基礎値: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\n正当性: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\n行政: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\n聖職者の支持: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\n思想の国策: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y 思想の国策 — 現在の宗教モデルのみが有効#!\n#P 告白国家 / 国家無神論#!: 国家主義 V #P +1#!\n#P 良心の自由 / 完全分離#!: 改革主義 V #P +1#!\n上記の有効な合計は上限が #Y +1#! であるため、2つの経路を重複させることはできません。\n\n国策およびプログラム（各 #Y 25#!）および標的型宗教事業（モデルに応じて #Y 100-150#!）に消費されます。収入は #Y 400#! を超えると減少し、#Y 500#! で停止します。\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "国策とプログラム"
 ve_piety_tt:0 "#header 宗教的和解#!\n現在の状態: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n社会の均衡値: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n月間変動: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y 均衡値の内訳#!\n和解モデル: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nモデルの支持: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\n正当性、行政、安定度: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nメーターは毎月均衡値に向かって #Y 20%#! 移動し、#Y ±5#! に制限されます。\n#P 75#! 時: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\n#N 25#! 以下時: #N 正当性 -5 および法律制定成功 -5%#!。\n\nこのメーターはプログラムの支払いには使用されなくなりました — 信仰改革力を参照してください。プログラムには少なくとも #Y 25#! の信仰改革力が必要であり、#Y 25#! を消費し、#Y 24ヶ月#! の重圧を課します。\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "宗教事業"
 ve_religious_project_progress_tt:0 "#header 標的型宗教事業#!\n進捗: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n月間進捗: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] （最小 1、最大 7）\n\n#Y 月間内訳#!\n基礎値: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\n行政: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\n正当性: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nモデルの支持: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\n和解: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\n宗教運動: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\n標的州の社会不安: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\n思想群: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y 思想群 — 現在の宗教モデルに一致するボーナスのみが有効#!\n#P 告白国家#!: 国家主義 VII #P +1#!\n#P 良心の自由#!: 改革主義 VII #P +1#!\n#P 国家無神論#!: 国家主義 VII #P +1#! および 学術 VII #P +1#!\n上記の有効な思想群の合計は上限が #Y +2#! です。\n\n所有する州のパネルから1つ開始します。告白国家および国家無神論は完了時に標的州の人口の #Y 5%#! （国家主義 VII の場合は #Y 7%#!）を改宗させ、急進派を増加させます。良心の自由は改宗を強制する代わりに体制派を増加させます。完全分離は事業を開始できません — 完全に中立なモデルです。\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "進行中"
 ve_religious_project_none:0 "未実行"

