l_japanese:
 ve_piety:0 "信心"
 ve_piety_reform:0 "信心改革"
 ve_piety_reform_tt:0 "#header 信心改革#!\n現在: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n月収: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y 月内訳#!\n根拠: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\n正当性: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\n管理: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\n敬虔な支持: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\n思想教義: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y 思想教義 — 現在の宗教モデルのみが考慮されます#!\n#P 告白国家 / 国家無神論#!: 国家主義者 V #P +1#!\n#P 良心の自由 / 完全分離#!: 改革主義者 V #P +1#!\n上記の有効な合計には上限があります #Y +1#! なので、2 つのパスはスタックできません。\n\nドクトリンとプログラムに費やします (#Y 25#! それぞれ）および対象を絞った宗教プロジェクト（#Y 100-150#!、モデルによって異なります）。過去に収入が鈍化 #Y 400#! そして止まります #Y 500#!。\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "教義とプログラム"
 ve_piety_tt:0 "#header 宗教定住#!\n現在の状態: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n社会均衡: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n月次動向: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y 均衡崩壊#!\n決済モデル: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nモデルのサポート: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\n正当性、管理性、安定性: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nメーターが動きます #Y 20%#! 毎月の均衡に向けて、 #Y ±5#!.\n #P 75#!の場合: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\n #N 25#! 以下: #N -5の正当性および-5%の法制定の成功#!。\n\nこのメーターはプログラムの支払いには使用されなくなりました - 信心改革を参照してください。プログラムには少なくとも次のものが必要です #Y 25#! 敬虔な改革、コスト #Y 25#! そして課す #Y 24ヶ月#! 実装の負担。\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "宗教プロジェクト"
 ve_religious_project_progress_tt:0 "#header 対象を絞った宗教プロジェクト#!\n進捗状況: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n月次進捗状況: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (最小1、最大7)\n\n#Y 月次内訳#!\nベース: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\n管理: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\n正当性: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nモデルサポート: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\n和解: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\n宗教運動: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\n目標国家の混乱: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nアイデアグループ: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y アイデアグループ — 現在の宗教モデルに一致するボーナスのみが有効です#!\n#P 告白国家#!: 国家主義者 VII #P +1#!\n#P 良心の自由#!: 改革主義者 VII #P +1#!\n#P 国家無神論#!: 国家主義者 VII #P +1#! および学者 VII #P +1#!\n上記のアクティブなアイデア グループの合計は #Y +2#!が上限です。\n\n1 つから始めてください所有国のパネルから。告白および国家無神論は変換 #Y 5%#! 完了時のターゲット州の人口、または #Y 7%#! Nationalist VII と過激派を追加します。その代わりに、良心の自由は改宗を強制することなく支持者を追加します。 Total Separation ではプロジェクトを開始できません - これは完全に中立的なモデルです。\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "進行中"
 ve_religious_project_none:0 "アクティブなし"

