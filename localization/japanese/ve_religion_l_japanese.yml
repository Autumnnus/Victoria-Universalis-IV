 ve_religious_project_unavailable_short:0 "中立モデルでは意図的に宗教キャンペーンを行っていません。必要に応じて、別の教会法と州法を制定してください。"
 ve_religious_project_unavailable_desc:0 "#header 利用可能なプロジェクトがありません#!\n完全分離は完全に中立的なモデルであり、対象を絞った宗教プロジェクトを開始することはできません。\n\n告白国家、良心の自由、国家無神論はそれぞれ独自のプロジェクトを実行します。教会法と州法を一致させて制定し、それを獲得してください。"

