l_japanese:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "国家ドクトリン"
 VE_CP_COLLAPSE_TT:0 "この国のヴィクトリア・ユニヴァーサリスの概要を隠す"
 VE_CP_EXPAND_TT:0 "この国のヴィクトリア・ユニヴァーサリスの概要を表示する"

 VE_CP_INSIGHT_LABEL:0 "国政識見"
 VE_CP_INSIGHT_TT:0 "#header 国政識見#!\n備蓄: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\n受容した思想群内の個別の思想に費やされます。"
 VE_CP_PIETY_LABEL:0 "信仰改革力"
 VE_CP_PIETY_TT:0 "#header 信仰改革力#!\n備蓄: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\n宗教プログラムおよび対象となった宗教事業に費やされます。"
 VE_CP_MANDATE_LABEL:0 "文化政策力"
 VE_CP_MANDATE_TT:0 "#header 文化政策力#!\n備蓄: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nアイデンティティモデルの変更および文化事業に費やされます。"
 VE_CP_MOMENTUM_LABEL:0 "時代勢力"
 VE_CP_MOMENTUM_TT:0 "#header 時代勢力#!\n備蓄: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\n満足した時代の目標から獲得され、時代の報酬に費やされます。新しい時代が始まると勢いはリセットされます。"
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "思想"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header 思想群#!\n使用スロット: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\n空きスロット: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n現在のドクトリン投資: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! 有効な購入済みの思想\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\n有効な群の思想は、#Y 4、8、13、19、26#!および#Y 34#!で永続的なキャパシティを獲得します。スロット5～6には時代2も必要であり、スロット7には時代3が必要です。群を破棄すると現在の投資が低下し、識見が払い戻されることはありませんが、すでに獲得したキャパシティは保持されます。"
 VE_CP_NATIONAL_IDEAS_LABEL:0 "国家思想"
 VE_CP_PROGRESS_LABEL:0 "思想の進捗"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header 国家思想の進捗#!\n購入済みの群の思想: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\n群の思想を3つ購入するごとに次の国家思想がアンロックされます。21番目の購入は国家ボーナスも付与します。"
 VE_CP_NO_IDEA_GROUPS:0 "#lore まだ思想群を受容していません。#!"
 VE_CP_PROGRAMS_LABEL:0 "宗教プログラム"
 VE_CP_NONE_YET:0 "#lore なし#!"
 VE_CP_PROJECT_LABEL:0 "事業"
 VE_CP_COHESION_LABEL:0 "国家結束"
 VE_CP_OBJECTIVES_LABEL:0 "時代の目標"
 VE_CP_OBJECTIVES_TT:0 "#header 時代の目標#!\nこの時代で完了したもの: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\n満足した目標のそれぞれが毎月時代勢力を支払います。4つの完了した目標が黄金時代をアンロックします。"
 VE_CP_REWARDS_LABEL:0 "時代の報酬"
 VE_CP_REWARDS_VALUE:0 "この時代で[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]個購入済み"
 VE_CP_REWARDS_TT:0 "#header 時代の報酬#!\nこの時代で購入したもの: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\n報酬のコストは前のものよりも高くなり、報酬の効果は時代とともに終了します。スロット10～13は国固有のものです。"

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "不明な時代"
 ve_cp_golden_age_industrial_active:0 "#P 工業の黄金時代#!"
 ve_cp_golden_age_cultural_active:0 "#P 文化の黄金時代#!"
 ve_cp_golden_age_strategic_active:0 "#P 戦略の黄金時代#!"
 ve_cp_golden_age_spent:0 "#lore 黄金時代使用済み#!"
 ve_cp_golden_age_ready:0 "#Y 黄金時代利用可能#!"
 ve_cp_golden_age_locked:0 "#lore 黄金時代未開放#!"
 ve_cp_tier_high:0 "#P 繁栄#!"
 ve_cp_tier_stable:0 "#lore 安定#!"
 ve_cp_tier_low:0 "#N 緊張#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore 受容済みですが、この群ではまだ思想を購入していません。#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header 宗教的和解#!\n現在: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n均衡値: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n毎月の変動: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nメーターは毎月均衡値に向かって20%移動し、#Y 5#!ポイントに制限されます。#P 75#!時: [Country.GetCustom('ve_religious_high_settlement_effect')]\n#N 25#!以下時: #N 正当性-5および法律制定成功-5%#!"
 VE_CP_COHESION_TT:0 "#header 国家結束#!\n現在値: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n均衡値: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n月間変動: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n国家結束は毎月均衡値へ向けて20%近づき、変動幅は最大 #Y 5#! ポイントに制限されます。#P 75#! 以上ではアイデンティティモデルによる追加ボーナスが付与され、#N 25#! 以下では国家の不安定化ペナルティが適用されます。"
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header 宗教事業（対象指定）#!\n状況: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header 文化事業#!\n状況: #Y [Country.GetCustom('ve_cultural_project_name')]#!\n対象: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "進捗: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n月間進捗: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore 事業は実行されていません。事業は所有する州のパネルから開始でき、完全分離では実行できません。#!"
 ve_cp_cultural_project_detail_active:0 "進捗: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n月間進捗: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore 事業は実行されていません。全国規模の事業は国家アイデンティティパネルから、対象指定の事業は所有する州のパネルから開始します。#!"
