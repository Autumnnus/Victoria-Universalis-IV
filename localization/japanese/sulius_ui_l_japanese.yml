l_japanese:
 SULIUS_LEGITIMACY_LEVEL_ACTIVE_TOOLTIP:0 "#tooltip_header [concept_legitimacy] \n[LegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\n$LEGITIMACY_LEVEL_BOUNDS_DESC$\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\n効果:#indent_newline:2 \n[LegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\n要因:#indent_newline:2 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 SULIUS_CAPITAL_MONEY:0 "#tooltip_header [concept_money]#!\n収支: #variable @money![AccessPlayer.PredictWeeklyBalance|D=+]#![GetPlayer.GetPowerDeltaIcon('money')]\n[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.GetPrincipal, '(CFixedPoint)0'), 'CREDIT_DESC', 'GOLD_RESERVES_DESC')]\n金準備上限: @money![GetPlayer.GetGoldReserveLimit|Dv]#!#![SelectLocalization(GetMetaPlayer.GetPlayedOrObservedCountry.IsValid, 'CAPITAL_MONEY_DELAYED', 'OBSERVER_NO_COUNTRY_SELECTED') ]"
 
 SULIUS_RESEARCH:0 "#tooltip_header [concept_technology]#!\n[SelectLocalization( GetPlayer.GetCurrentlyResearchedTechnology.IsValid, 'SULIUS_RESEARCHING', 'SULIUS_NOT_RESEARCHING' )]\n$TOOLTIP_DELIMITER$\n#V 技術の進捗#!\n#help [concept_innovation]によるもの: @innovation![GetPlayer.GetWeeklyInnovation|+0]\n[concept_technology_spread]によるもの: [GetPlayer.GetWeeklyTechnologySpreadForTechDesc(GetPlayer.GetCurrentlyResearchedTechnology.Self)]\n$TOOLTIP_DELIMITER$\n#V [concept_innovation]#!\n毎週生成されている #v @innovation![GetPlayer.GetWeeklyInnovation|+2]#! の[concept_innovation]:\n[GetPlayer.GetWeeklyInnovationDesc]\n\n毎週のアクティブな研究への投資は、最大で @innovation![GetPlayer.GetWeeklyMaxInnovation|v2] [concept_innovation] までとなります:\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\n投資上限やアクティブな研究の欠如によって使用されなかった[concept_innovation]は、我が国への[concept_technology_spread]の速度を上昇させます"
 SULIUS_RESEARCHING:0 "[GetPlayer.GetName]は現在[GetPlayer.GetCurrentlyResearchedTechnology.GetName]を研究中です#!\n進捗: #v @innovation! [GetPlayer.GetCurrentlyResearchedTechnology.GetProgress(GetPlayer.Self)|D]#! / #maximum [GetPlayer.GetCurrentlyResearchedTechnology.GetCost(GetPlayer.Self)|D]#! (残り [GetPlayer.GetCurrentlyResearchedTechnology.GetTimeLeftDesc( GetPlayer.Self )])"
 SULIUS_NOT_RESEARCHING:0 "[GetPlayer.GetName]は現在どの技術も研究していません。"
