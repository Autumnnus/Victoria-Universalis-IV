l_japanese:
 ve_tag_flavor_delayed_result_tt:0 "この制度的選択の結果は、おおむね1年後に現れる。"
 ve_tag_flavor_free_route_tt:0 "この路線は国政識見、文化政策力、信仰改革力を消費しない。"
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "共通の市民的用語集"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "共通の公式用語が学校や地方官庁への改革を推し進めるが、絶え間ない説明が中央権力をすり減らす。"
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "神聖なる連続性"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "改革は受け継がれた宗教的制度を通じて枠組みが作られ、指揮を強化する一方で、外国の手法が巡る経路を狭めている。"
 ve_tag_flavor_tur_administrative_translation_mdf:0 "行政的翻訳"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "官僚機構は改革を慣れ親しんだ手続きへと翻訳する。行政はより堅実になるが、立法上の変化はある程度の速度を失う。"
 ve_tag_flavor.1.t:0 "改革の言語"
 ve_tag_flavor.1.d:0 "布告は非の打ちどころのない散文で首都を離れながらも、学校、法廷、地方官庁、あるいは宗教財団には4つの異なる指示として届くことがある。改革派は今や共通の用語集を求めている。問題は、どの機関がその用語集に意味を与えるかである。"
 ve_tag_flavor.1.a:0 "共通の市民的用語集を起草する。"
 ve_tag_flavor.1.a.tt:0 "市民国家または複合国家が必要。\n今すぐ #N 20 文化政策力#! を消費する。\nおおむね1年後: #P 8 国政識見#! と #P 3 国家結束#! を獲得し、その後24か月にわたり #P +1% 教育機会#! と #N -25 権力#! を獲得する。"
 ve_tag_flavor.1.b:0 "神聖なる連続性に改革の基盤を置く。"
 ve_tag_flavor.1.b.tt:0 "国教的宗教モデルが必要。\n今すぐ #N 20 信仰改革力#! を消費する。\nおおむね1年後: #P 8 国政識見#! と #P 3 宗教的和解#! を獲得し、その後24か月にわたり #P +25 権力#! と #N -2.5% 技術の普及#! を獲得する。"
 ve_tag_flavor.1.c:0 "各局に命令の翻訳を任せる。"
 ve_tag_flavor.1.c.tt:0 "おおむね1年後: #P 4 国政識見#! を獲得し、その後24か月にわたり #P +25 行政力#! と #N -2.5% 法律制定速度#! を獲得する。"
 ve_tag_flavor.2.t:0 "言葉が手続きとなる"
 ve_tag_flavor.2.d:0 "回覧文書、注釈、教科書、説教、地方からの書簡に満ちた1年が、改革プログラムに共通の作業言語を与えた。それは完全に画一的ではないが、官僚たちはどの表現が合意を導き、どの表現が依然として不和を隠しているかを理解している。"
 ve_tag_flavor.2.a:0 "用語集が国家の機構に入る。"
 ve_tag_flavor.2.a.tt:0 "1年前に選択された結果が発効する。その資源変化は通常の上限に固定され、その制度的補正は24か月間持続する。"
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "翻訳局"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "専門機関が外国の手法の流通を加速させるが、その自治権が中央の直接的な指揮を弱める。"
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "指導的移入"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "輸入された制度は中央の指導のもとで再編される。権力は維持されるが、各改革が公式の経路を通過するのにより長い時間がかかる。"
 ve_tag_flavor_jap_selective_adoption_mdf:0 "選択的採用"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "国家は確立された権力と調和できる手法のみを認め、拡散の速度を政治的統制と引き換える。"
 ve_tag_flavor.10.t:0 "移入された手法、在来の権力"
 ve_tag_flavor.10.d:0 "外国のマニュアル、機械、学校計画、行政表が、どの省庁の審査よりも速く到着する。一部の官僚は常設の翻訳局を要求し、また別の者たちは輸入されたすべての制度が中央の指導のもとで作り直されねばならないと主張する。第三の派閥は、確立された秩序を乱すことなく吸収できるものだけを認めるべきだとする。"
 ve_tag_flavor.10.a:0 "翻訳局を設立する。"
 ve_tag_flavor.10.a.tt:0 "学術の思想 IVまたはインフラストラクチャーの思想 IVが必要。\n今すぐ #N 15 国政識見#! を消費する。\nおおむね1年後: #P 10 時代勢力#! を獲得し、その後24か月にわたり #P +2.5% 技術の普及#! と #N -25 権力#! を獲得する。"
 ve_tag_flavor.10.b:0 "中央の指導のもとでのみ移入する。"
 ve_tag_flavor.10.b.tt:0 "日本の国家思想 IVが必要。\n今すぐ #N 10 国政識見#! を消費する。\nおおむね1年後: #P 7 時代勢力#! を獲得し、その後24か月にわたり #P +25 権力#! と #N -2.5% 法律制定速度#! を獲得する。"
 ve_tag_flavor.10.c:0 "選択的に採用し、指揮を維持する。"
 ve_tag_flavor.10.c.tt:0 "おおむね1年後: #P 3 時代勢力#! を獲得し、その後24か月にわたり #P +25 権力#! と #N -2.5% 技術の普及#! を獲得する。"
 ve_tag_flavor.11.t:0 "我々のものとなった手法"
 ve_tag_flavor.11.d:0 "翻訳、試行、再起草、公式の議論による1年が、新規性と実用性を切り分けてきた。採用された手法はもはや外国の指示としては見えず、国家自身の指揮の用語集に入り込んでいる。"
 ve_tag_flavor.11.a:0 "審査を生き延びたものを使用する。"
 ve_tag_flavor.11.a.tt:0 "1年前に選択された結果が発効する。時代勢力は通常のゼロの下限を維持し、制度的補正は24か月間持続する。"
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "市民権協定"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "市民権に関する共通の言語が到着と参画を容易にするが、すべての管轄区域にわたって協定を説明することが中央権力をすり減らす。"
 ve_tag_flavor_usa_composite_bargain_mdf:0 "複合的妥協"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "連邦政府は構成コミュニティ間の交渉術を習得し、単一の文化形態への圧力を抑えつつ機関を強化する。"
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "連邦の曖昧性"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "意図的な曖昧性が同盟の外交通声を広げるが、当面の間、国家結束の均衡値を2低下させる。"
 ve_tag_flavor.20.t:0 "同盟の意義"
 ve_tag_flavor.20.d:0 "新参者、既成の州、そして異なる公的慣習を持つコミュニティのいずれもが、それぞれの言葉で同盟に訴えかけている。立法者らは共通の定式が必要である点では一致しているが、それが個人の市民権を定義すべきか、構成コミュニティ間の妥協を維持すべきか、あるいは各管轄区が解釈できるだけの広範さを残すべきかについては意見が分かれている。"
 ve_tag_flavor.20.a:0 "市民権に関する協定を起草する。"
 ve_tag_flavor.20.a.tt:0 "市民国家が必要です。\n今すぐ#N 20 文化政策力#!を消費します。\n約1年後：#P 8 国政識見#!および#P 3 国家結束#!を獲得し、その後24ヶ月間#P +2.5% 移住求心力#!および#N -25 権力#!を獲得します。"
 ve_tag_flavor.20.b:0 "複合的妥協を交渉する。"
 ve_tag_flavor.20.b.tt:0 "複合国家が必要です。\n今すぐ#N 20 文化政策力#!を消費します。\n約1年後：#P 8 国政識見#!および#P 3 国家結束#!を獲得し、その後24ヶ月間#P +25 行政力#!および#N -2.5% 同化#!を獲得します。"
 ve_tag_flavor.20.c:0 "連邦の定式を意図的に広範なままにしておく。"
 ve_tag_flavor.20.c.tt:0 "約1年後：#P 4 国政識見#!および24ヶ月間の#P +25 影響力#!を獲得します。補正が有効な間、国家結束の均衡値は#N 2 低下#!します。"
 ve_tag_flavor.21.t:0 "同盟の定式"
 ve_tag_flavor.21.d:0 "大会合、委員会報告、州の決議、そして公の議論の1年を経て、諸機関が活用できる文言が作成された。その文言が語らない部分は宣言された部分と同様に重要であり、同盟がどの紛争を解決し、どの紛争を交渉に委ねるかを定義している。"
 ve_tag_flavor.21.a:0 "定式を公共生活に導入する。"
 ve_tag_flavor.21.a.tt:0 "1年前に選択された結果が効力を発揮します。資源の変動は通常の限界に制限され、制度的補正は24ヶ月間持続します。"
