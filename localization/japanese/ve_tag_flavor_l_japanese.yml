l_japanese:
 ve_tag_flavor_delayed_result_tt:0 "この制度的選択の結果は、約 1 年以内に明らかになるであろう。"
 ve_tag_flavor_free_route_tt:0 "この路線には、国家的見識、文化的使命、信心改革が費やされない。"
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "共通の市民用語集"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "共有された公式語彙により、学校や地方自治体の改革が推進されるが、絶え間ない説明が中央の権威を消費する。"
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "神聖な継続性"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "改革は、継承された宗教制度を通じて組み立てられ、指揮を強化する一方、外国の手法が通る経路を狭める。 "
 ve_tag_flavor_tur_administrative_translation_mdf:0 "行政翻訳"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "官僚制度は、改革を慣れ親しんだ手順に翻訳します。行政はより安定するが、法改正のスピードはいくらか失われる。"
 ve_tag_flavor.1.t:0 "改革の言語"
 ve_tag_flavor.1.d:0 "法令は、非の打ちどころのない散文で首都を出ても、学校、裁判所、地方自治体、または宗教団体に 4 つの異なる指示として届く場合があります。改革者たちは現在、共通の語彙を求めています。問題は、誰の機関がその語彙に意味を与えるかということだ。"
 ve_tag_flavor.1.a:0 "共通の市民用語集の草案を作成します。"
 ve_tag_flavor.1.a.tt:0 "市民国家または複合国家が必要です。\n支出 #N 20 文化的使命#! \n約 1 年後: 利益が得られます #P 8 国家的見識#! そして #P 3 国民の団結#!、その後ゲイン #P +1% 教育アクセス#! そして #N -25 権限#! 24か月間。"
 ve_tag_flavor.1.b:0 "神聖な継続性における地面の改革。"
 ve_tag_flavor.1.b.tt:0 "告白宗教モデルが必要です。\n支出 #N 20 敬虔な改革#! \n約 1 年後: 利益が得られます #P 8 国家的見識#! および #P 3 宗教的居住地#!、その後ゲイン #P +25権限#! そして #N -2.5% テクノロジーの普及#! 24 か月間。"
 ve_tag_flavor.1.c:0 "各局に命令を翻訳させます。"
 ve_tag_flavor.1.c.tt:0 "約 1 年後: 利益が得られます。 #P 4 National Insight#! を獲得し、 #P +25 官僚主義#! そして #N -2.5% 法律制定速度#! 24か月間。"
 ve_tag_flavor.2.t:0 "言葉が手続きになる"
 ve_tag_flavor.2.d:0 "1年間にわたる回覧、注釈、教科書、説教、地方通信により、改革プログラムは実用的な言語となった。完全に統一されているわけではないが、当局者らは現在、どの文言が合意を意味し、どの文言が依然として意見の相違を隠しているかを把握している。"
 ve_tag_flavor.2.a:0 "語彙は国家機構に組み込まれます。"
 ve_tag_flavor.2.a.tt:0 "1 年前に選択された結果が有効になります。リソースの変更は通常の制限内に固定されており、制度上の修正期間は 24 か月です。"
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "翻訳局"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "専門事務所は外国の手法の流通を加速させているが、その自律性によりセンターの直接の指揮力は弱まっている。"
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "直接借入"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "輸入された機関は中央の指示の下に再編成されます。権限は維持されますが、各改革が公式ルートを通過するまでに時間がかかります。"
 ve_tag_flavor_jap_selective_adoption_mdf:0 "選択的養子縁組"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "国家は、普及の速度を政治的統制と引き換えにして、既成の権威と調和できる方法のみを認めている。"
 ve_tag_flavor.10.t:0 "借用メソッド、ネイティブ権限"
 ve_tag_flavor.10.d:0 "外国のマニュアル、機械、学校計画、管理表は、どの省庁も判断できないほど早く到着します。一部の役人は翻訳事務所の常設を要求している。借りた機関はすべて中央の指示の下で作り直すべきだと主張する人もいる。第三の派閥は、確立された秩序を乱すことなく吸収できるものだけを認めるでしょう。"
 ve_tag_flavor.10.a:0 "翻訳局を設立します。"
 ve_tag_flavor.10.a.tt:0 "Academic Idea IV または Infrastructure Idea IV が必要です。\n支出 #N 15 国家洞察#! \n約 1 年後: 利益が得られます #P 10 時代の勢い#!、その後獲得 #P +2.5% テクノロジーの普及#! および #N -25 権限#! 24か月間。"
 ve_tag_flavor.10.b:0 "中央指示のもとでのみ借用してください。"
 ve_tag_flavor.10.b.tt:0 "日本の国家理念 IV が必要です。\n支出 #N 10 国家的見識#! \n約 1 年後: 利益が得られます #P 7 時代の勢い#!、その後ゲイン #P +25権限#! そして #N -2.5% 法律制定速度#! 24 か月間。"
 ve_tag_flavor.10.c:0 "選択的に採用し、コマンドを保持します。"
 ve_tag_flavor.10.c.tt:0 "約1年後: 増加 #P 3 時代の勢い#!、その後ゲイン #P +25権限#! そして #N -2.5% テクノロジーの普及#! 24か月間。"
 ve_tag_flavor.11.t:0 "独自のメソッド"
 ve_tag_flavor.11.d:0 "1 年間の翻訳、テスト、再草案、公式議論を経て、新規性と実用性が区別されました。採用されたメソッドはもはや外部の命令としては表示されません。彼らは国家独自の指揮用語を入力したのだ。"
 ve_tag_flavor.11.a:0 "審査に合格したものを使用してください。"
 ve_tag_flavor.11.a.tt:0 "1 年前に選択された結果が有効になります。 Era Momentum は通常のゼロフロアを維持し、制度的修正は 24 か月間続きます。"
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "市民権協定"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "市民権の共通言語により到着と参加が容易になりますが、すべての管轄区域にわたって協定を説明するのは中央の権限を消費します。"
 ve_tag_flavor_usa_composite_bargain_mdf:0 "複合バーゲン"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "連邦行政は構成コミュニティ間で交渉することを学び、単一の文化形態への圧力を軽減しながら事務所を強化します。"
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "連邦政府の曖昧さ"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "意図的なあいまいさは連合の外交的発言力を拡大しますが、一時的に国家結束の均衡を 2 低下させます。"
 ve_tag_flavor.20.t:0 "連合の意味"
 ve_tag_flavor.20.d:0 "新しく到着した人々、確立された州、異なる公共慣習を持つコミュニティはすべて、それぞれの言葉で連合を求めます。議員らは、共通の公式が必要であることに同意しているが、それが個人の市民権を定義するべきか、構成コミュニティ間の取り決めを維持すべきか、各管轄区域が解釈できる広さを維持すべきかどうかには同意していない。"
 ve_tag_flavor.20.a:0 "市民権の協定書を作成する。"
 ve_tag_flavor.20.a.tt:0 "市民国家が必要である。\n文化的義務を 20 費やす #N #! \n約 1 年後: 利益が得られます #P 8 国家的見識#! および #P 3 国民の団結#!、その後ゲイン #P +2.5% 移住の魅力#! そして #N -25 権限#! 24 か月間。"
 ve_tag_flavor.20.b:0 "複合取引について交渉します。"
 ve_tag_flavor.20.b.tt:0 "複合状態が必要です。\n支出 #N 20 文化的使命#! \n約 1 年後: 利益が得られます #P 8 国家的見識#! および #P 3 国民の団結#!、その後ゲイン #P +25 官僚主義#! そして #N -2.5% 同化#! 24か月間。"
 ve_tag_flavor.20.c:0 "連邦政府の公式を意図的に広範なままにしておきます。"
 ve_tag_flavor.20.c.tt:0 "約 1 年後: 利益が得られます。 #P 4 国家的見識#! そして #P +25 影響力#! 24か月間。モディファイアが有効な間、国家凝集均衡は次のようになります。 #N 2 下の#!。"
 ve_tag_flavor.21.t:0 "組合のための公式"
 ve_tag_flavor.21.d:0 "1 年間の大会、委員会報告書、州決議、そして公の議論により、各機関が使用できる言語が生み出されました。その沈黙は宣言と同じくらい重要であり、連合がどの紛争を解決し、どの紛争を交渉に委ねるかを決定する。"
 ve_tag_flavor.21.a:0 "公式を公の場に導入しましょう。"
 ve_tag_flavor.21.a.tt:0 "1 年前に選択された結果が有効になります。リソースの変更は通常の制限内に固定され、制度上の修正は 24 か月間続きます。"
