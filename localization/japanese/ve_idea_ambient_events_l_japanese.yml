l_japanese:
 ve_doctrine_ambient_cooldown_mdf:0 "ドクトリン論争のクールダウン"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "国の機関は、最近のドクトリン論争の結果を吸収しつつある。"
 ve_doctrine_ambient_ig_supported_mdf:0 "制度的支援"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "政府は、この利益団体に、ドクトリン論争を解決するための目に見える役割を与えている。"
 ve_doctrine_ambient_ig_slighted_mdf:0 "制度上の軽微"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "政府はこの利益団体を最近の理論上の和解から除外した。"

 ve_doctrine_industrialist_positive_mdf:0 "標準化された産業慣行"
 ve_doctrine_industrialist_positive_mdf_desc:0 "製造業者は、調整された一連の産業慣行から恩恵を受けています。"
 ve_doctrine_industrialist_negative_mdf:0 "産業上のボトルネック"
 ve_doctrine_industrialist_negative_mdf_desc:0 "未解決の調整の失敗により、製造が制約されています。"
 ve_doctrine_academic_positive_mdf:0 "調整された研究ネットワーク"
 ve_doctrine_academic_positive_mdf_desc:0 "大学は調整されたネットワークを通じて方法、スタッフ、結果を共有しています。"
 ve_doctrine_academic_negative_mdf:0 "学術上のボトルネック"
 ve_doctrine_academic_negative_mdf_desc:0 "資格および調整に関する紛争により大学は混乱しています。"
 ve_doctrine_nationalist_positive_mdf:0 "全国協会ネットワーク"
 ve_doctrine_nationalist_positive_mdf_desc:0 "国家協会は、合法的な政府をより広範な忠誠心に変えています。"
 ve_doctrine_nationalist_negative_mdf:0 "競争する国家協会"
 ve_doctrine_nationalist_negative_mdf_desc:0 "ライバルの国家組織が政治的正当性を新たな不満に変えている。"
 ve_doctrine_reformist_positive_mdf:0 "組織的改革ネットワーク"
 ve_doctrine_reformist_positive_mdf_desc:0 "政治運動は、参加と妥協のための秩序あるルートを獲得しました。"
 ve_doctrine_reformist_negative_mdf:0 "分裂した改革連合"
 ve_doctrine_reformist_negative_mdf_desc:0 "競合する改革組織が政治動員を急進主義に変えている。"
 ve_doctrine_professional_army_positive_mdf:0 "参謀訓練サイクル"
 ve_doctrine_professional_army_positive_mdf_desc:0 "調整された参謀プログラムにより陸軍の訓練システムが改善されている。"
 ve_doctrine_professional_army_negative_mdf:0 "士官部隊のボトルネック"
 ve_doctrine_professional_army_negative_mdf_desc:0 "昇進と人員配置の紛争により軍事訓練が遅れている。"
 ve_doctrine_agrarian_positive_mdf:0 "調整された農業慣行"
 ve_doctrine_agrarian_positive_mdf_desc:0 "農村部の機関は信頼できる方法を農業経済全体に広めています。"
 ve_doctrine_agrarian_negative_mdf:0 "農産物の供給不足"
 ve_doctrine_agrarian_negative_mdf_desc:0 "種子、信用、調整の不足により、農業生産量が減少しています。"

 ve_idea_evt.10.t:0 "フル出力時の安全コード"
 ve_idea_evt.10.d:0 "一連の工場事故により、産業検査の問題が白日の下にさらされることになった。独立した検査官は信頼できる基準を約束するが、製造業者は自主的な規則によって生産量と主導権が維持されると主張する。"
 ve_idea_evt.10.a:0 "独立した検査官を任命します。"
 ve_idea_evt.10.a.tt:0 "支出 #N 25#! 国家洞察。労働組合が利益を得る #P +1#! 承認されれば実業家は負ける #N 1#! 24 か月間承認。"
 ve_idea_evt.10.b:0 "業界に自主的な規範を作成させましょう。"
 ve_idea_evt.10.b.tt:0 "産業主義者は #P +1#! 承認を獲得し、労働組合は #N 1を失います。#! 24か月の承認。"
 ve_idea_evt.10.c:0 "ルールを段階的に標準化します。"
 ve_idea_evt.10.c.tt:0 "過ごす #N 10#! 国家的洞察。利益団体の承認は変更されません。"

 ve_idea_evt.11.t:0 "標準化された機械部品"
 ve_idea_evt.11.d:0 "いくつかの工業地区のエンジニアが、ゲージ、継手、機械部品の共通カタログを作成しました。国家標準の策定には資金がかかりますが、製造ネットワーク全体の摩擦を取り除くことができます。"
 ve_idea_evt.11.a:0 "全国的に標準を採用します。"
 ve_idea_evt.11.a.tt:0 "支出 #N 40#! National Insight とゲイン  #P +5%#! 36 か月間製造スループット。"
 ve_idea_evt.11.b:0 "後で使用できるように調査結果をアーカイブします。"
 ve_idea_evt.11.b.tt:0 "ゲイン #P 15#! 国家的洞察。"
 ve_idea_evt.11.c:0 "当社の生産ネットワークはすでに準備されています。"
 ve_idea_evt.11.c.tt:0 "支出 #N 20#! National Insight とゲイン #P +5%#! 36 か月間の製造スループット。"

 ve_idea_evt.12.t:0 "作業現場のボトルネック"
 ve_idea_evt.12.d:0 "互換性のない手順、部品の遅れ、混乱したスケジュールがこの国の工場を圧迫する一方で、注文は蓄積している。政府は専門家を派遣したり、問題を企業に任せたり、既存の建設事務所を利用して対応を調整したりすることができる。"
 ve_idea_evt.12.a:0 "専門チームを派遣します。"
 ve_idea_evt.12.a.tt:0 "支出 #N 25#! 国家の洞察力を高め、産業上のペナルティを回避します。"
 ve_idea_evt.12.b:0 "工場はこれを自ら解決しなければなりません。"
 ve_idea_evt.12.b.tt:0 "苦しむ #N -5%#! 24 か月間の製造スループット。"
 ve_idea_evt.12.c:0 "建設局をアクティブ化します。"
 ve_idea_evt.12.c.tt:0 "消費 #N 10#! 国家の洞察力を高め、産業上のペナルティを回避します。"

 ve_idea_evt.60.t:0 "機械化と在職期間"
 ve_idea_evt.60.d:0 "新しい機械は農業生産高を増加させる可能性があるが、小作人や小規模自作農は、急速な移行が農村部の生計を根絶することを懸念している。政府は、機械化を加速するか、最初に在職期間を保護するか、段階的な地域移行を調整するかを決定する必要があります。"
 ve_idea_evt.60.a:0 "機械化基金を創設する。"
 ve_idea_evt.60.a.tt:0 "支出する。 #N 25#! National Insightとゲイン #P +5%#! 24 か月間の農業スループット。実業家が利益を得る #P +1#! 承認と田舎の人々の敗北 #N 1#! 24か月の承認。"
 ve_idea_evt.60.b:0 "農場を変更する前にテナントを確保してください。"
 ve_idea_evt.60.b.tt:0 "田舎の人々の利益 #P +1#! 承認すると地主が負ける #N 1#! 24か月の承認。"
 ve_idea_evt.60.c:0 "段階的な移行には、ローカルの実稼働ネットワークを使用します。"
 ve_idea_evt.60.c.tt:0 "過ごす #N 10#! 国民の洞察と利益 #P 24 か月間 +5%#! 農業スループット。利益団体の承認は変更されません。"

 ve_idea_evt.61.t:0 "協同組合穀倉地帯"
 ve_idea_evt.61.d:0 "地方の代表者らは、埋蔵量、記録、輸送を共有できる協力的な穀倉のネットワークを実証した。国家計画は農業調整を強化する可能性があるが、計画を維持するだけでも政府の制度上の知識はさらに充実するだろう。"
 ve_idea_evt.61.a:0 "協同組合ネットワークに資金を提供します。"
 ve_idea_evt.61.a.tt:0 "過ごす #N 40#! 国家の洞察と利益 #P +5%#! 36 か月間の農業スループット。"
 ve_idea_evt.61.b:0 "記録を農業事務所に配布します。"
 ve_idea_evt.61.b.tt:0 "得 #P 15#! 国家的洞察。"
 ve_idea_evt.61.c:0 "すでに設置されている地方の機関を利用してください。"
 ve_idea_evt.61.c.tt:0 "支出 #N 20#! 国家の洞察と利益 #P 36 か月間、+5%#! 農業スループット。"

 ve_idea_evt.62.t:0 "シードとクレジットの不足"
 ve_idea_evt.62.d:0 "種子在庫の不足と地方信用の逼迫は、今後の農業サイクルを脅かしている。専門家が緊急対応を組織したり、地元のネットワークを即興で任せたり、確立された生活機関が一時的に負担を引き受けたりすることができます。"
 ve_idea_evt.62.a:0 "緊急時の専門知識プログラムを組織します。"
 ve_idea_evt.62.a.tt:0 " #N 25#! National Insightを費やして、農業ペナルティを回避してください。"
 ve_idea_evt.62.b:0 "ローカルネットワークに独自の解決策を見つけてもらいます。"
 ve_idea_evt.62.b.tt:0 "24か月間、 #N -5%#! 農業スループットに苦しみます。"
 ve_idea_evt.62.c:0 "一時的なバックボーンとして自給自足ネットワークを使用してください。"
 ve_idea_evt.62.c.tt:0 "10 #N National Insightを費やして、#! 農業ペナルティを回避してください。"

 ve_idea_evt.20.t:0 "パトロネージまたはピアレビュー"
 ve_idea_evt.20.d:0 "政府は研究助成金からの実用的な成果を期待しているが、学者らは後援が証拠を政治的便宜に置き換えることになると警告している。永続的な解決策は、国の学習を誰が判断するかを定義する必要があります。"
 ve_idea_evt.20.a:0 "独立した審査委員会を設置します。"
 ve_idea_evt.20.a.tt:0 "過ごす #N 25#! 国家洞察。インテリ層の利益 #P +1#! 承認と小ブルジョワジーは 24 か月間 #N 1#! 承認を失います。"
 ve_idea_evt.20.b:0 "研究の優先順位は国家に決定させます。"
 ve_idea_evt.20.b.tt:0 "小ブルジョワジーは獲得します。 #P +1#! 承認とインテリの敗北 #N 1#! 24か月の承認。"
 ve_idea_evt.20.c:0 "共通の学術基準を制度化する。"
 ve_idea_evt.20.c.tt:0 "過ごす #N 10#! 国家的洞察。利益団体の承認は変更されません。"
 ve_idea_evt.21.t:0 "地方の研究ネットワーク"
 ve_idea_evt.21.d:0 "州立大学は、中央の指示なしに、講師、器具、研究結果の交換を始めている。正式な支援があれば、この即席の協力が全国的な研究ネットワークに変わる可能性がある。"
 ve_idea_evt.21.a:0 "ネットワークに資金を提供します。"
 ve_idea_evt.21.a.tt:0 "過ごす #N 40#! 国家の洞察と利益 #P +5%#! 36 か月間の大学のスループット。"
 ve_idea_evt.21.b:0 "レポートを中央アーカイブに配置します。"
 ve_idea_evt.21.b.tt:0 "得 #P 15#! 国家的洞察。"
 ve_idea_evt.21.c:0 "国立アカデミーに接続します。"
 ve_idea_evt.21.c.tt:0 "支出 #N 20#! National Insight とゲイン #P +5%#! 36 か月間の大学のスループット。"
 ve_idea_evt.22.t:0 "資格情報のボトルネック"
 ve_idea_evt.22.d:0 "大学は、増え続ける学生、教員、新しい分野を十分に迅速に評価することができません。認証の遅れは現在、より広範な研究システムを脅かしています。"
 ve_idea_evt.22.a:0 "評価能力を拡大します。"
 ve_idea_evt.22.a.tt:0 "支出 #N 25#! 国民の洞察力を高め、学術上のペナルティを回避します。"
 ve_idea_evt.22.b:0 "既存の教育機関は対処しなければなりません。"
 ve_idea_evt.22.b.tt:0 "苦難 #N -5%#! 24 か月間の大学のスループット。"
 ve_idea_evt.22.c:0 "学校ネットワークを通じて標準化。"
 ve_idea_evt.22.c.tt:0 "過ごす #N 10#! 国家的洞察力を高め、学業上のペナルティを回避します。"

 ve_idea_evt.30.t:0 "1 つの規範、多くの伝統"
 ve_idea_evt.30.d:0 "全国規範を準備している当局者らは、地方の慣習をどこに置くかについて意見が分かれている。単一の説明は明確さを約束しますが、地元の伝統を除外すると、それが定義しようとしている国家そのものが弱体化する可能性があります。"
 ve_idea_evt.30.a:0 "地元の伝統を共通の物語に織り込みます。"
 ve_idea_evt.30.a.tt:0 "過ごす #N 25#! 国家洞察。田舎の人々の利益 #P +1#! 承認するとプチ ブルジョワジーは 24 か月間 #N 1#! 承認を失う。"
 ve_idea_evt.30.b:0 "1 つの正式な規範を宣言する。"
 ve_idea_evt.30.b.tt:0 "プチ ブルジョワジーは獲得する #P +1#! 承認を得ると、農村部の人々は 24 か月間  #N 1#! 承認を失います。"
 ve_idea_evt.30.c:0 "訓練を受けた文化幹部に仕事を任せてください。"
 ve_idea_evt.30.c.tt:0 "支出します。 #N 10#! 国家的洞察。利益団体なしの承認の変更。"
 ve_idea_evt.31.t:0 "退役軍人全国協会"
 ve_idea_evt.31.d:0 "退役軍人は、儀式、相互扶助、国家への忠誠を結び付ける協会を組織しました。彼らのネットワークは、公式の役割を与えずに全国に拡大したり、研究したりすることができます。"
 ve_idea_evt.31.a:0 "全国の協会を支援します。"
 ve_idea_evt.31.a.tt:0 "支出する #N 40#! 国家的洞察力と獲得 #P +5%#! 36か月間、正当性からのロイヤリスト。"
 ve_idea_evt.31.b:0 "彼らの経験を州のアーカイブに記録。"
 ve_idea_evt.31.b.tt:0 "獲得 #P 15#! 国家的洞察。"
 ve_idea_evt.31.c:0 "すでに構築されている全国ネットワークを活用します。"
 ve_idea_evt.31.c.tt:0 "過ごす #N 20#! 国家の洞察と利益 #P +5%#! 正当性の支持者を 36 か月間獲得。"
 ve_idea_evt.32.t:0 "競合する各国社会"
 ve_idea_evt.32.d:0 "ライバル社会は現在、国家を代弁する権利を主張している。彼らの競合する式典や出版物は、共通の政治的言語を不満の源に変えています。"
 ve_idea_evt.32.a:0 "共通憲章の草案を作成します。"
 ve_idea_evt.32.a.tt:0 "過ごす #N 25#! 国家的洞察力を高め、国家主義者の処罰を回避する。"
 ve_idea_evt.32.b:0 "競争はそれ自体の限界を見つけるでしょう。"
 ve_idea_evt.32.b.tt:0 "苦難 #N +5%#! 急進派を24か月間正当性から遠ざける。"
 ve_idea_evt.32.c:0 "国家機関に仲裁を任せる。"
 ve_idea_evt.32.c.tt:0 "10 #N National Insightを費やし、#! 国家主義者の処罰を回避する。"

 ve_idea_evt.40.t:0 "委員会または街頭"
 ve_idea_evt.40.d:0 "改革派は専門家委員会と大衆の圧力の間で意見が分かれている。委員会は一貫した法律の制定を約束する一方、組織的な運動は公的力を伴わない改革は無期限に延期されると主張している。"
 ve_idea_evt.40.a:0 "独立した改革委員会を創設する。"
 ve_idea_evt.40.a.tt:0 "過ごす #N 25#! 国家洞察。インテリ層の利益 #P +1#! 承認と労働組合の敗北 #N 1#! 24 か月間承認。"
 ve_idea_evt.40.b:0 "動作に余地を与えます。"
 ve_idea_evt.40.b.tt:0 "労働組合が利益を得る #P +1#! 承認されれば実業家は負ける #N 1#! 24 か月間承認。"
 ve_idea_evt.40.c:0 "確立された権利の枠組みと手順を適用します。"
 ve_idea_evt.40.c.tt:0 "支出 #N 10#! 国家洞察。利益団体の承認は変更されません。"
 ve_idea_evt.41.t:0 "請願ネットワーク"
 ve_idea_evt.41.d:0 "地方請願は、苦情を整理し、改革を提案できる、調整された全国ネットワークとなっています。政府はそれを協議チャネルとして認識することも、後で使用できるようにその方法を保存することもできます。"
 ve_idea_evt.41.a:0 "ネットワークを正式な協議に変えます。"
 ve_idea_evt.41.a.tt:0 "支出 #N 40#! National Insight とゲイン #P +5%#! 36 か月間政治運動のロイヤリスト。"
 ve_idea_evt.41.b:0 "レビュー アーカイブに要求を提出。"
 ve_idea_evt.41.b.tt:0 "利益を得る。 #P 15#! 国家的洞察。"
 ve_idea_evt.41.c:0 "すでに設立されている改革組織を活用する。"
 ve_idea_evt.41.c.tt:0 "支出 #N 20#! National Insight とゲイン #P +5%#! 36か月間の政治運動のロイヤリスト。"
 ve_idea_evt.42.t:0 "連合の亀裂"
 ve_idea_evt.42.d:0 "改革連合は優先順位、タイミング、リーダーシップを巡って意見が分かれている。共通の計画が回復されない限り、組織化された政治エネルギーは対立する急進派陣営に固まってしまうだろう。"
 ve_idea_evt.42.a:0 "共通プログラムを書き換えます。"
 ve_idea_evt.42.a.tt:0 "支出 #N 25#! 国家的洞察力を高め、改革派の処罰を回避する。"
 ve_idea_evt.42.b:0 "分裂をオープンな政治に参加させましょう。"
 ve_idea_evt.42.b.tt:0 "苦しむ #N +5%#! 政治運動の急進派を24か月間."
 ve_idea_evt.42.c:0 "平等主義の枠組みを再適用する."
 ve_idea_evt.42.c.tt:0 "支出する #N 10#! 国家的洞察力を高め、改革派の処罰を回避する。"

 ve_idea_evt.50.t:0 "年功序列または功績"
 ve_idea_evt.50.d:0 "将校団は昇進をめぐって分裂している。上級指揮官は軍務や習慣によって階級を擁護するが、改革派は証明された能力に昇進をもたらすための試験や業績記録を要求する。"
 ve_idea_evt.50.a:0 "実力試験を導入します。"
 ve_idea_evt.50.a.tt:0 "支出 #N 25#! 国家の洞察と利益 #P 24 か月間 +5%#! トレーニング率。国軍が負ける #N 1#! 24 か月間承認。"
 ve_idea_evt.50.b:0 "年功序列制度を守りましょう。"
 ve_idea_evt.50.b.tt:0 "軍が利益を得る #P +1#! 24 か月間承認されますが、トレーニング率は低下します #N -5%#! 12 か月間。"
 ve_idea_evt.50.c:0 "一般職員の勤務記録を使用。"
 ve_idea_evt.50.c.tt:0 "支出する。 #N 10#! 国民の洞察と利益 #P 24 か月間 +5%#! トレーニング率。利益団体の承認は変更されません。"
