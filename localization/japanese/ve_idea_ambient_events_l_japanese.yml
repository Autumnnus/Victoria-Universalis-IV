l_japanese:
 ve_doctrine_ambient_cooldown_mdf:0 "国策論争のクールダウン"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "国の諸制度が、最近の国策論争の余波を吸収しつつある。"
 ve_doctrine_ambient_ig_supported_mdf:0 "制度的支持"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "政府はこの利益集団に対し、国策論争の調停において目に見える役割を与えた。"
 ve_doctrine_ambient_ig_slighted_mdf:0 "制度的軽視"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "政府はこの利益集団を、最近の国策の合意形成から外した。"

 ve_doctrine_industrialist_positive_mdf:0 "標準化された産業慣行"
 ve_doctrine_industrialist_positive_mdf_desc:0 "製造業者は調整された産業慣行の体系から恩恵を受けている。"
 ve_doctrine_industrialist_negative_mdf:0 "産業上のボトルネック"
 ve_doctrine_industrialist_negative_mdf_desc:0 "未解決の調整不全が製造業を圧迫している。"
 ve_doctrine_academic_positive_mdf:0 "協調的研究ネットワーク"
 ve_doctrine_academic_positive_mdf_desc:0 "大学が協調的ネットワークを通じて手法、人材、成果を共有している。"
 ve_doctrine_academic_negative_mdf:0 "学術的ボトルネック"
 ve_doctrine_academic_negative_mdf_desc:0 "資格や調整をめぐる紛争が大学を混乱させている。"
 ve_doctrine_nationalist_positive_mdf:0 "国民的結社ネットワーク"
 ve_doctrine_nationalist_positive_mdf_desc:0 "国民的結社が、正当な政府への支持をより広範な忠実性へと変換している。"
 ve_doctrine_nationalist_negative_mdf:0 "競合する国民的社会"
 ve_doctrine_nationalist_negative_mdf_desc:0 "ライバルの国民的組織が、政治的正当性を新たな不満の種へと変えている。"
 ve_doctrine_reformist_positive_mdf:0 "組織化された改革ネットワーク"
 ve_doctrine_reformist_positive_mdf_desc:0 "政治運動が、参画と妥協のための秩序ある経路を獲得した。"
 ve_doctrine_reformist_negative_mdf:0 "分裂した改革派連合"
 ve_doctrine_reformist_negative_mdf_desc:0 "競合する改革組織が、政治的動員を急進主義へと変えている。"
 ve_doctrine_professional_army_positive_mdf:0 "参謀訓練サイクル"
 ve_doctrine_professional_army_positive_mdf_desc:0 "組織的な参謀プログラムが陸軍の訓練システムを改善している。"
 ve_doctrine_professional_army_negative_mdf:0 "将校団のボトルネック"
 ve_doctrine_professional_army_negative_mdf_desc:0 "昇進や人員配置をめぐる紛争が軍事訓練を遅らせている。"
 ve_doctrine_agrarian_positive_mdf:0 "協調的農業慣行"
 ve_doctrine_agrarian_positive_mdf_desc:0 "農村の諸制度が、信頼性の高い手法を農業経済全体に広めている。"
 ve_doctrine_agrarian_negative_mdf:0 "農業物資の不足"
 ve_doctrine_agrarian_negative_mdf_desc:0 "種子、信用枠、調整の不足が農業の生産量を低下させている。"

 ve_idea_evt.10.t:0 "最高生産量における安全基準"
 ve_idea_evt.10.d:0 "相次ぐ工場事故により、産業査察の是非が公然たる問題となった。独立した査察官は信頼できる基準を約束する一方、製造業者は自主規制こそが生産量とイニシアチブを維持すると主張している。"
 ve_idea_evt.10.a:0 "独立した査察官を任命する。"
 ve_idea_evt.10.a.tt:0 "#N 25#! の国政識見を消費する。労働組合の支持が #P +1#! 変動し、実業家の支持が #N 1#! 低下する（24か月間）。"
 ve_idea_evt.10.b:0 "産業界に自主規制を作らせる。"
 ve_idea_evt.10.b.tt:0 "実業家の支持が #P +1#! 変動し、労働組合の支持が #N 1#! 低下する（24か月間）。"
 ve_idea_evt.10.c:0 "段階的に規則を標準化する。"
 ve_idea_evt.10.c.tt:0 "#N 10#! の国政識見を消費する。利益集団の支持は変化しない。"

 ve_idea_evt.11.t:0 "標準化された機械部品"
 ve_idea_evt.11.d:0 "いくつかの工業地区の技師らが、ゲージ、継手、および機械部品の共通カタログを作成した。国家規模の標準化に資金を投じるには多額の費用がかかるが、製造ネットワーク全体での摩擦を取り除くことができるだろう。"
 ve_idea_evt.11.a:0 "全国で標準規格を採用する。"
 ve_idea_evt.11.a.tt:0 "#N 40#! の国政識見を消費し、36か月間、製造業の生産量が #P +5%#! 増加する。"
 ve_idea_evt.11.b:0 "調査結果を後日のために保管する。"
 ve_idea_evt.11.b.tt:0 "#P 15#! の国政識見を獲得する。"
 ve_idea_evt.11.c:0 "我々の生産ネットワークはすでに準備ができている。"
 ve_idea_evt.11.c.tt:0 "#N 20#! の国政識見を消費し、36か月間、製造業の生産量が #P +5%#! 増加する。"

 ve_idea_evt.12.t:0 "工場におけるボトルネック"
 ve_idea_evt.12.d:0 "互換性のない手順、部品の遅延、混乱したスケジュールにより、国内の工場が停滞する一方で、注文が山積みとなっている。政府は専門家を派遣するか、問題を各企業に任せるか、あるいは既存の建設局を利用して対応を調整することができる。"
 ve_idea_evt.12.a:0 "専門家チームを派遣する。"
 ve_idea_evt.12.a.tt:0 "#N 25#! の国政識見を消費し、工業ペナルティを回避する。"
 ve_idea_evt.12.b:0 "工場は自力でこれを解決せねばならない。"
 ve_idea_evt.12.b.tt:0 "24か月間、製造業の生産量が #N -5%#! 低下する。"
 ve_idea_evt.12.c:0 "建設局を動員する。"
 ve_idea_evt.12.c.tt:0 "#N 10#! の国政識見を消費し、工業ペナルティを回避する。"

 ve_idea_evt.60.t:0 "機械化と土地保有"
 ve_idea_evt.60.d:0 "新しい機械は農業生産量を増加させることができるが、小作人と自作農は急激な移行が農村の生活基盤を根底から揺るがすことを恐れている。政府は機械化を加速させるか、まず土地保有を保護するか、あるいは段階的な地域の移行を調整するかを決定しなければならない。"
 ve_idea_evt.60.a:0 "機械化基金を設立する。"
 ve_idea_evt.60.a.tt:0 "#N 25#! の国政識見を消費し、24か月間、農業 生産量が #P +5%#! 増加する。実業家の支持が #P +1#! 増加し、農村民の支持が #N 1#! 減少する（24か月間）。"
 ve_idea_evt.60.b:0 "農地を変更する前に小作人を保護する。"
 ve_idea_evt.60.b.tt:0 "農村民の支持が #P +1#! 増加し、地主の支持が #N 1#! 減少する（24か月間）。"
 ve_idea_evt.60.c:0 "地域の生産ネットワークを利用して段階的な移行を図る。"
 ve_idea_evt.60.c.tt:0 "#N 10#! の国政識見を消費し、24か月間、農業 生産量が #P +5%#! 増加する。利益集団の支持の変化はない。"

 ve_idea_evt.61.t:0 "協同組合の穀倉"
 ve_idea_evt.61.d:0 "農村の代表者らは、備蓄、記録、輸送を共有可能な協同組合の穀倉ネットワークの実例を示した。国家プログラムを実施すれば農業の調整を強化できる一方で、単に計画を保持するだけでも政府の制度的知識を豊かにすることができる。"
 ve_idea_evt.61.a:0 "協同組合ネットワークに資金を提供する。"
 ve_idea_evt.61.a.tt:0 "#N 40#! の国政識見を消費し、36か月間、農業 生産量が #P +5%#! 増加する。"
 ve_idea_evt.61.b:0 "記録を農業事務所に配布する。"
 ve_idea_evt.61.b.tt:0 "#P 15#! の国政識見を獲得する。"
 ve_idea_evt.61.c:0 "すでに存在している農村制度を利用する。"
 ve_idea_evt.61.c.tt:0 "#N 20#! の国政識見を消費し、36か月間、農業 生産量が #P +5%#! 増加する。"

 ve_idea_evt.62.t:0 "種子と信用の不足"
 ve_idea_evt.62.d:0 "劣悪な種子の備蓄と逼迫する農村の信用が、次の農業サイクルを脅かしている。専門家が緊急対応を組織することも、地域ネットワークに場当たり的な対応を任せることも、あるいは既存の自給自足制度に一時的に負担を担わせることも可能である。"
 ve_idea_evt.62.a:0 "緊急の専門知識プログラムを組織する。"
 ve_idea_evt.62.a.tt:0 "#N 25#! の国政識見を消費し、農業ペナルティを回避する。"
 ve_idea_evt.62.b:0 "地域ネットワークに独自の解決策を見つけさせる。"
 ve_idea_evt.62.b.tt:0 "24か月間、農業 生産量が #N -5%#! 低下する。"
 ve_idea_evt.62.c:0 "自給自足ネットワークを一時的な支えとして利用する。"
 ve_idea_evt.62.c.tt:0 "#N 10#! の国政識見を消費し、農業ペナルティを回避する。"

 ve_idea_evt.20.t:0 "後援か査読か"
 ve_idea_evt.20.d:0 "政府は研究助成から現実的な成果を期待する一方、学者たちは後援が証拠に代えて政治的便宜をもたらすと警告する。国の学識を誰が判定するかを、確固たる取り決めによって定めなければならない。"
 ve_idea_evt.20.a:0 "独立した審査会を設置する。"
 ve_idea_evt.20.a.tt:0 "#N 25#! の国政識見を消費する。知識人の支持が #P +1#! 増加し、小ブルジョワの支持が #N 1#! 低下する（24か月間）。"
 ve_idea_evt.20.b:0 "研究の優先順位を政府が定める。"
 ve_idea_evt.20.b.tt:0 "小ブルジョワの支持が #P +1#! 増加し、知識人の支持が #N 1#! 低下する（24か月間）。"
 ve_idea_evt.20.c:0 "共通の学術基準を制度化する。"
 ve_idea_evt.20.c.tt:0 "#N 10#! の国政識見を消費する。利益集団の支持に変化はない。"
 ve_idea_evt.21.t:0 "地方研究ネットワーク"
 ve_idea_evt.21.d:0 "地方のカレッジは、中央の指示なしに講師、器具、研究成果の交換を始めている。公式な支援を行えば、この即興的な協力を国家的な研究ネットワークへと発展させることができるだろう。"
 ve_idea_evt.21.a:0 "ネットワークに資金を提供する。"
 ve_idea_evt.21.a.tt:0 "#N 40#! の国政識見を消費し、大学の生産量が #P +5%#! 増加する（36か月間）。"
 ve_idea_evt.21.b:0 "報告書を中央公文書館に収める。"
 ve_idea_evt.21.b.tt:0 "#P 15#! の国政識見を獲得する。"
 ve_idea_evt.21.c:0 "それを国立アカデミーに接続する。"
 ve_idea_evt.21.c.tt:0 "#N 20#! の国政識見を消費し、大学の生産量が #P +5%#! 増加する（36か月間）。"
 ve_idea_evt.22.t:0 "資格審査のボトルネック"
 ve_idea_evt.22.d:0 "大学は、増加する学生、講師、新しい学問分野の評価に追いついていない。資格認定の遅れが、いまや広範な研究システムを脅かしている。"
 ve_idea_evt.22.a:0 "評価キャパシティを拡張する。"
 ve_idea_evt.22.a.tt:0 "#N 25#! の国政識見を消費し、学術上のペナルティを回避する。"
 ve_idea_evt.22.b:0 "既存の制度で対処させる。"
 ve_idea_evt.22.b.tt:0 "大学の生産量が #N -5%#! 低下する（24か月間）。"
 ve_idea_evt.22.c:0 "学校ネットワークを通じて標準化する。"
 ve_idea_evt.22.c.tt:0 "#N 10#! の国政識見を消費し、学術上のペナルティを回避する。"

 ve_idea_evt.30.t:0 "一つの典拠、多様な伝統"
 ve_idea_evt.30.d:0 "国家の典拠を準備する官僚たちの間で、地方の慣習の扱いをめぐり意見が割れている。単一の記述は明確さを約束するが、地元の伝統を排除することは、定義しようとするその国家自体を弱体化させる恐れがある。"
 ve_idea_evt.30.a:0 "地元の伝統を共通の物語に織り込む。"
 ve_idea_evt.30.a.tt:0 "#N 25#! の国政識見を消費する。農村民の支持が #P +1#! 増加し、小ブルジョワの支持が #N 1#! 低下する（24か月間）。"
 ve_idea_evt.30.b:0 "公式の典拠を一つに定める。"
 ve_idea_evt.30.b.tt:0 "小ブルジョワの支持が #P +1#! 増加し、農村民の支持が #N 1#! 低下する（24か月間）。"
 ve_idea_evt.30.c:0 "訓練された文化的幹部に作業を任せる。"
 ve_idea_evt.30.c.tt:0 "#N 10#! の国政識見を消費する。利益集団の支持に変化はない。"
 ve_idea_evt.31.t:0 "退役軍人全国協会"
 ve_idea_evt.31.d:0 "退役軍人たちは、儀式、相互扶助、国家への忠実性を結びつける協会を組織した。彼らのネットワークは全国規模に拡張することも、公式な役割を与えずに研究対象とすることもできる。"
 ve_idea_evt.31.a:0 "協会を全国規模で支援する。"
 ve_idea_evt.31.a.tt:0 "#N 40#! の国政識見を消費し、正当性からの体制派が #P +5%#! 増加する（36か月間）。"
 ve_idea_evt.31.b:0 "彼らの経験を国家文書館に記録する。"
 ve_idea_evt.31.b.tt:0 "#P 15#! の国政識見を獲得する。"
 ve_idea_evt.31.c:0 "すでに確立された国家ネットワークを利用する。"
 ve_idea_evt.31.c.tt:0 "#N 20#! の国政識見を消費し、正当性からの体制派が #P +5%#! 増加する（36か月間）。"
 ve_idea_evt.32.t:0 "競合する国家社会"
 ve_idea_evt.32.d:0 "ライバルである社会が今や国を代表して語る権利を主張している。その競合する式典や出版物は、共有されていた政治的言語を不満の源へと変えつつある。"
 ve_idea_evt.32.a:0 "共通の憲章を起草する。"
 ve_idea_evt.32.a.tt:0 "#N 25#! の国政識見を消費し、国家主義のペナルティを回避する。"
 ve_idea_evt.32.b:0 "競争は自ずとその限界を見出すだろう。"
 ve_idea_evt.32.b.tt:0 "24か月の間、正当性に起因する急進派が #N +5%#! 増加する。"
 ve_idea_evt.32.c:0 "国家の制度に仲裁を委ねる。"
 ve_idea_evt.32.c.tt:0 "#N 10#! の国政識見を消費し、国家主義のペナルティを回避する。"

 ve_idea_evt.40.t:0 "委員会か街頭か"
 ve_idea_evt.40.d:0 "改革派は専門家による委員会と大衆的圧力の間で分裂している。委員会が一貫した立法を約束する一方で、組織化された運動は民衆の力なき改革は無期限に遅れると主張している。"
 ve_idea_evt.40.a:0 "独立した改革委員会を設立する。"
 ve_idea_evt.40.a.tt:0 "#N 25#! の国政識見を消費する。24か月の間、知識人は #P +1#! の支持を得て、労働組合は #N 1#! の支持を失う。"
 ve_idea_evt.40.b:0 "運動に行動の余地を与える。"
 ve_idea_evt.40.b.tt:0 "24か月の間、労働組合は #P +1#! の支持を得て、実業家は #N 1#! の支持を失う。"
 ve_idea_evt.40.c:0 "確立された権利と手続きの枠組みを適用する。"
 ve_idea_evt.40.c.tt:0 "#N 10#! の国政識見を消費する。利益集団の支持は変化しない。"
 ve_idea_evt.41.t:0 "嘆願のネットワーク"
 ve_idea_evt.41.d:0 "地域の嘆願が、不満の整理と改革の提案を行うことのできる組織化された国家ネットワークへと成長した。政府はこれを諮問チャネルとして承認するか、あるいはその手法を後の使用のために温存することができる。"
 ve_idea_evt.41.a:0 "ネットワークを正式な諮問機関に転換する。"
 ve_idea_evt.41.a.tt:0 "#N 40#! の国政識見を消費し、36か月の間、政治運動に端を発する体制派が #P +5%#! 増加する。"
 ve_idea_evt.41.b:0 "要求を審査記録保管所に綴じ込む。"
 ve_idea_evt.41.b.tt:0 "#P 15#! の国政識見を得る。"
 ve_idea_evt.41.c:0 "既に設立されている改革組織を利用する。"
 ve_idea_evt.41.c.tt:0 "#N 20#! の国政識見を消費し、36か月の間、政治運動に端を発する体制派が #P +5%#! 増加する。"
 ve_idea_evt.42.t:0 "連立の亀裂"
 ve_idea_evt.42.d:0 "改革派連立は優先順位、時期、そして指導部をめぐって分裂しつつある。共通の綱領が修復されない限り、組織化された政治的エネルギーは敵対的な急進派陣営へと硬化するだろう。"
 ve_idea_evt.42.a:0 "共通の綱領を書き直す。"
 ve_idea_evt.42.a.tt:0 "#N 25#! の国政識見を消費し、改革主義のペナルティを回避する。"
 ve_idea_evt.42.b:0 "分裂を公然たる政治闘争に持ち込ませる。"
 ve_idea_evt.42.b.tt:0 "24か月の間、政治運動に端を発する急進派が #N +5%#! 増加する。"
 ve_idea_evt.42.c:0 "平等主義の枠組みを再適用する。"
 ve_idea_evt.42.c.tt:0 "#N 10#! の国政識見を消費し、改革主義のペナルティを回避する。"

 ve_idea_evt.50.t:0 "年功序列か能力主義か"
 ve_idea_evt.50.d:0 "士官団は昇進をめぐって分裂している。古参の司令官たちは服務と慣習による階級を擁護し、一方で改革派は実績ある能力への昇進の道を開く試験と業績記録を要求している。"
 ve_idea_evt.50.a:0 "能力試験を導入する。"
 ve_idea_evt.50.a.tt:0 "#N 25#! の国政識見を消費し、24か月の間、訓練率が #P +5%#! 増加する。24か月の間、軍部は #N 1#! の支持を失う。"
 ve_idea_evt.50.b:0 "年功序列制を維持する。"
 ve_idea_evt.50.b.tt:0 "24か月の間、軍部は #P +1#! の支持を得るが、12か月の間、訓練率が #N -5%#! 低下する。"
 ve_idea_evt.50.c:0 "参謀本部の服務記録を利用する。"
 ve_idea_evt.50.c.tt:0 "#N 10#! の国政識見を消費し、24か月の間、訓練率が #P +5%#! 増加する。利益集団の支持は変化しない。"
 ve_idea_evt.51.t:0 "大規模参謀演習"
 ve_idea_evt.51.d:0 "大規模な参謀演習により、動員、教育、指揮における貴重な教訓が明らかになった。計画を拡張すれば陸軍全体にその教訓を波及させることができ、一方、調査結果を文書館に収蔵すれば僅かな費用でそれを維持できる。"
 ve_idea_evt.51.a:0 "演習を拡張する。"
 ve_idea_evt.51.a.tt:0 "#N 40#!の国政識見を消費し、36か月の間#P +5%#!の訓練率を獲得する。"
 ve_idea_evt.51.b:0 "調査結果を国策文書館に収蔵する。"
 ve_idea_evt.51.b.tt:0 "#P 15#!の国政識見を獲得する。"
 ve_idea_evt.51.c:0 "専門の指揮ネットワークを活用する。"
 ve_idea_evt.51.c.tt:0 "#N 20#!の国政識見を消費し、36か月の間#P +5%#!の訓練率を獲得する。"
 ve_idea_evt.52.t:0 "士官団のボトルネック"
 ve_idea_evt.52.d:0 "陸軍の拡張スピードに、教官や参謀士官の育成が追いついていない。訓練スケジュールは現在、疲弊した少数の幹部層に依存している。"
 ve_idea_evt.52.a:0 "訓練幹部を拡充する。"
 ve_idea_evt.52.a.tt:0 "#N 25#!の国政識見を消費し、軍事的ペナルティを回避する。"
 ve_idea_evt.52.b:0 "既存の幹部層をさらに酷使する。"
 ve_idea_evt.52.b.tt:0 "24か月の間#N -5%#!の訓練率を受ける。"
 ve_idea_evt.52.c:0 "後方支援の参謀予備員を異動させる。"
 ve_idea_evt.52.c.tt:0 "#N 10#!の国政識見を消費し、軍事的ペナルティを回避する。"
