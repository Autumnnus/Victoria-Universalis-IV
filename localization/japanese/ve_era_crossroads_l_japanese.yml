 ve_je_era_crossroads_age_2_route_1_status:0 "#Y 帝国の地平#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n錨: この時代に確保された承認国のキャパシティに関する目標および港湾または関心に関する目標。\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40のマイルストーンでは、国政識見を消費する強化を獲得できる。"
 ve_je_era_crossroads_age_2_route_2_status:0 "#Y 大衆福祉#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n錨: この時代に確保された識字率または学校に関する目標および社会制度に関する目標。\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40のマイルストーンでは、国政識見を消費する強化を獲得できる。"
 ve_je_era_crossroads_age_2_route_3_status:0 "#Y 統合された国#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n錨: この時代に確保された経済変革に関する目標および低社会不安と正当性に関する目標。\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40のマイルストーンでは、国政識見を消費する強化を獲得できる。"
 ve_je_era_crossroads_age_3:0 "動員された社会"
 ve_je_era_crossroads_age_3_reason:0 "大衆政治と総力戦は、市民権、産業、そして戦略的即応性を同一の国家体制の一部とする。"
 ve_je_era_crossroads_age_3_status:0 "進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40のマイルストーンでは、国政識見を消費する強化を獲得できる。"
 ve_je_era_crossroads_age_3_route_1_status:0 "#Y 社会共和国#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] か月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー: この時代に確保した大衆政治の目標および成熟した社会制度の目標。\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40の節目では、国政識見を消費してボーナスを得られる。"
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y 戦略的指揮#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] か月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー: この時代に確保した近代的な軍編成の目標および列強の投射能力の目標。\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40の節目では、国政識見を消費してボーナスを得られる。"
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y 兵器廠社会#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] か月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー: この時代に確保した電気産業の目標および大規模軍需品生産の目標。\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40の節目では、国政識見を消費してボーナスを得られる。"

 ve_era_crossroads.1.t:0 "蒸気と国家"
 ve_era_crossroads.1.d:0 "鉄道、学校、改革派、そして官僚たちは、近代国家のあり方についてそれぞれ異なる解釈を提示している。政府は、社会と国家のどのような関係性によって最初の時代を築き上げるかを決定しなければならない。"
 ve_era_crossroads.1.a:0 "蒸気ネットワークを通じて国を結束させる。"
 ve_era_crossroads.1.b:0 "教育を受けた市民社会を築く。"
 ve_era_crossroads.1.c:0 "行政国家を確立する。"
 ve_era_crossroads.1.d.option:0 "この時代に国家の岐路は必要ない。"
 ve_era_crossroads.1.a.tt:0 "#Y 蒸気ネットワーク#!路線を開始する（焦点: 産業化、農民の移住、鉄道）。\n• 目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。\n• 進捗速度: 基本月間進捗+1に加え、完了した時代1のアンカー（農民の割合および鉄道の目標）ごとにさらに+1。\n• 国策の相乗効果: #Y 実業家 IV#!または #Y インフラストラクチャー IV#!を保有している場合、節目ディシジョンのコストが軽減される（10の代わりに5の国政識見）。"
 ve_era_crossroads.1.b.tt:0 "#Y 教育を受けた市民社会#!路線を開始する（焦点: 教育、識字率、自由労働）。\n• 目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。\n• 進捗速度: 基本月間進捗+1に加え、完了した時代1のアンカー（自由労働および識字率・学校の目標）ごとにさらに+1。\n• 国策の相乗効果: #Y 学術 IV#!または #Y 改革主義 IV#!を保有している場合、節目ディシジョンのコストが軽減される（10の代わりに5の国政識見）。"
 ve_era_crossroads.1.c.tt:0 "#Y 行政国家#!路線を開始する（焦点: 政府の正当性、行政力、安定）。\n• 目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。\n• 進捗速度: 基本月間進捗+1に加え、完了した時代1のアンカー（正当性・行政力および独立した安定の目標）ごとにさらに+1。\n• 国策の相乗効果: #Y 官僚主義 IV#!または #Y 議会主義 IV#!を保有している場合、節目ディシジョンのコストが軽減される（10の代わりに5の国政識見）。"
 ve_era_crossroads.2.t:0 "帝国か大衆社会か？"
 ve_era_crossroads.2.d:0 "国家はもはや、海外への影響力、大衆の福祉、そして国家の統合を別個の問題として扱うことはできない。そのうちの一つが、残りの追求方法を決定づけることとなる。"
 ve_era_crossroads.2.a:0 "帝国の地平に目を向ける。"
 ve_era_crossroads.2.b:0 "社会福祉の体系を構築する。"
 ve_era_crossroads.2.c:0 "統合された国家を鍛え上げる。"
 ve_era_crossroads.2.d.option:0 "この時代に自らの進むべき道を見出させる。"
 ve_era_crossroads.2.a.tt:0 "#Y 帝国の地平#!路線を開始する（焦点: 外交力と海外への到達）。\n• 目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。\n• 進捗速度: 基本月間進捗+1に加え、完了した時代2のアンカー（承認国のキャパシティおよび港湾・関心の目標）ごとにさらに+1。\n• 国策の相乗効果: #Y 外交 IV#!または #Y 植民地 IV#!を保有している場合、節目ディシジョンのコストが軽減される（10の代わりに5の国政識見）。"
 ve_era_crossroads.2.b.tt:0 "#Y 社会福祉#!路線を開始する（焦点: 社会制度、医療、教育）。\n• 目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。\n• 進捗速度: 基本月間進捗+1に加え、完了した時代2のアンカー（識字率・学校および社会制度の目標）ごとにさらに+1。\n• 国策の相乗効果: #Y 社会福祉 IV#!または #Y 改革主義 IV#!を保有している場合、節目ディシジョンのコストが軽減される（10の代わりに5の国政識見）。"
 ve_era_crossroads.2.c.tt:0 "#Y 統合された国家#!路線を開始する（焦点: 経済変革と国内の安定）。\n• 目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。\n• 進捗速度: 基本月間進捗+1に加え、完了した時代2のアンカー（経済変革および社会不安の低い正当性の目標）ごとにさらに+1。\n• 国策の相乗効果: #Y 国家主義 IV#!または #Y 労働 IV#!を保有している場合、節目ディシジョンのコストが軽減される（10の代わりに5の国政識見）。"
 ve_era_crossroads.3.t:0 "動員された社会"
 ve_era_crossroads.3.d:0 "大衆政治、戦略的指揮、そして産業動員が、いまやあらゆる制度の隅々にまで及んでいる。最後の時代は、いかなる形態の動員が国を定義づけるかについての選択を迫っている。"
 ve_era_crossroads.3.a:0 "社会共和制に身を捧げる。"
 ve_era_crossroads.3.b:0 "国を戦略的指揮の下に置く。"
 ve_era_crossroads.3.c:0 "国軍廠社会を構築する。"
 ve_era_crossroads.3.d.option:0 "常設の動員プロジェクトを拒否する。"
 ve_era_crossroads.3.a.tt:0 "#Y 社会共和制#!路線を開始する（焦点：大衆政治と社会制度）。\n• 目標：進捗60に到達し、#P +50時代勢力#!を獲得する。\n• 進捗速度：基礎月間進捗が+1、さらに完了した時代3のアンカー（大衆政治および成熟した社会制度の目標）ごとに+1が追加される。\n• 国策の相乗効果：#Y 議会主義 IV#!または#Y 社会福祉 IV#!を所有していると、より安価な節目ディシジョン（10ではなく5の国政識見）が解放される。"
 ve_era_crossroads.3.b.tt:0 "#Y 戦略的指揮#!路線を開始する（焦点：軍事近代化と世界的な力の誇示）。\n• 目標：進捗60に到達し、#P +50時代勢力#!を獲得する。\n• 進捗速度：基礎月間進捗が+1、さらに完了した時代3のアンカー（近代的な部隊編成と列強の到達範囲の目標）ごとに+1が追加される。\n• 国策の相乗効果：#Y 職業軍人 IV#!または#Y 防御 IV#!を所有していると、より安価な節目ディシジョン（10ではなく5の国政識見）が解放される。"
 ve_era_crossroads.3.c.tt:0 "#Y 国軍廠社会#!路線を開始する（焦点：産業戦時経済と大量軍備）。\n• 目標：進捗60に到達し、#P +50時代勢力#!を獲得する。\n• 進捗速度：基礎月間進捗が+1、さらに完了した時代3のアンカー（電気産業と大量軍備の目標）ごとに+1が追加される。\n• 国策の相乗効果：#Y 戦時経済 IV#!または#Y 大規模徴兵 IV#!を所有していると、より安価な節目ディシジョン（10ではなく5の国政識見）が解放される。"

 ve_era_crossroads_decline_tt:0 "現在の時代の時代の分水嶺を恒久的に辞退する。後の時代は引き続き条件を満たす。"

 ve_era_crossroads.10.t:0 "国のカレンダー"
 ve_era_crossroads.10.d:0 "地方官庁、民間団体、そして各省庁は、それぞれ異なる速度で選択された変革を追求している。共通のカレンダーがあれば、散在する成果を国のプログラムへと変えることができるかもしれないが、調整そのものが希少な行政的注意を必要とする。"
 ve_era_crossroads.10.a:0 "中央調整委員会に資金を拠出する。"
 ve_era_crossroads.10.b:0 "諸制度に独自のタイムテーブルを交渉させる。"
 ve_era_crossroads.10.c:0 "我が国の確立した国策によって構築されたネットワークを利用する。"
 ve_era_crossroads.10.a.tt:0 "#N 10国政識見#!を消費し、#P +3の分水嶺進捗#!を獲得する。"
 ve_era_crossroads.10.b.tt:0 "資源を消費せず、分水嶺の進捗にも直ちに変更を加えない。"
 ve_era_crossroads.10.c.tt:0 "路線に適合したレベルIVの思想群を必要とする。#N 5国政識見#!を消費し、#P +3の分水嶺進捗#!を獲得する。"

 ve_era_crossroads.11.t:0 "誰が進捗を指揮するのか？"
 ve_era_crossroads.11.d:0 "このプログラムは、もはや緩やかな合意にとどまらないほど重大なものとなった。大臣らは国の権限を主張し、専門家は政治からの隔離を要求し、地方のアクターらは厳格な指揮が進捗を可能にした諸制度を破壊すると警告している。"
 ve_era_crossroads.11.a:0 "中央に明確な調整権限を与える。"
 ve_era_crossroads.11.b:0 "交渉済みの権限のバランスを維持する。"
 ve_era_crossroads.11.c:0 "調整を我が国の国策的制度に委ねる。"
 ve_era_crossroads.11.a.tt:0 "#N 10国政識見#!を消費し、#P +3の分水嶺進捗#!を獲得する。"
 ve_era_crossroads.11.b.tt:0 "資源を消費せず、分水嶺の進捗にも直ちに変更を加えない。"
 ve_era_crossroads.11.c.tt:0 "路線に適合したレベルIVの思想群を必要とする。#N 5国政識見#!を消費し、#P +3の分水嶺進捗#!を獲得する。"

 ve_era_crossroads.40.t:0 "蒸気と国家"
 ve_era_crossroads.40.d:0 "選択された道は、もはや孤立した一連の成果ではない。インフラ、市民権、あるいは行政は、いまや国家が時代の変革を理解し方向づけることのできる、持続的な国家プログラムを形成している。"
 ve_era_crossroads.40.a:0 "最初の時代はその制度的形態を見出した。"
 ve_era_crossroads.40.a.tt:0 "完了した時代の分水嶺は、#P +50時代勢力#!を付与した。これは目標を完了させたわけでも、黄金時代の条件を満たしているかどうかに影響を与えたわけでもない。"

 ve_era_crossroads.20.t:0 "国家の到達範囲"
 ve_era_crossroads.20.d:0 "選択されたプログラムは、いまや最初にそれを後援した制度の領域を超えて広がっている。港湾、学校、官庁、そして地方当局は、国家の調整がどこで終わり、地方の裁量がどこから始まるべきかについて意見が対立している。"
 ve_era_crossroads.20.a:0 "中央委員会を通じて国家の義務をマッピングする。"
 ve_era_crossroads.20.b:0 "交渉によって制度的境界が自然に形成されるようにする。"
 ve_era_crossroads.20.c:0 "確立された国策ネットワークを通じて調整する。"
 ve_era_crossroads.20.a.tt:0 "#N 10国政識見#!を消費し、#P +3の分水嶺進捗#!を獲得する。"
 ve_era_crossroads.20.b.tt:0 "資源を消費せず、分水嶺の進捗にも直ちに変更を加えない。"
 ve_era_crossroads.20.c.tt:0 "路線に適合したレベルIVの思想群を必要とする。#N 5国政識見#!を消費し、#P +3の分水嶺進捗#!を獲得する。"

 ve_era_crossroads.21.t:0 "統合の代償"
 ve_era_crossroads.21.d:0 "対外的影響力、社会福祉、そして国民的規律は、いずれも勝者や負担、そして新たな期待を生み出す。この計画は、国家がそれらの負担をいかに配分するかを決定して初めて持続可能となる。"
 ve_era_crossroads.21.a:0 "調整を管理する国営評議会を創設する。"
 ve_era_crossroads.21.b:0 "交渉済みの妥協を通じて負担を配分する。"
 ve_era_crossroads.21.c:0 "我々の思想的諸制度に重圧を吸収させる。"
 ve_era_crossroads.21.a.tt:0 "#N 10#! 国政識見を消費して、#P +3 分水嶺進捗#!を獲得する。"
 ve_era_crossroads.21.b.tt:0 "資源を消費せず、分水嶺進捗を即座に変更しない。"
 ve_era_crossroads.21.c.tt:0 "路線適合するレベルIVの思想群が必要。#N 5#! 国政識見を消費して、#P +3 分水嶺進捗#!を獲得する。"

 ve_era_crossroads.41.t:0 "帝国と大衆社会"
 ve_era_crossroads.41.d:0 "選択された合意は今や、国家の対外的影響力、社会的義務、そして国家諸制度を結びつけている。戦略的方針として始まったものは、大衆社会を統治するための持続可能な枠組みとなった。"
 ve_era_crossroads.41.a:0 "第二の時代はその合意を見出した。"
 ve_era_crossroads.41.a.tt:0 "完了した時代の分水嶺により、#P +50 時代勢力#!が付与された。これは目標の完了または黄金時代の資格の変更を行うものではない。"

 ve_era_crossroads.30.t:0 "国家に下る動員の号令"
 ve_era_crossroads.30.d:0 "市民、司令官、労働者、そして行政官のすべてが、選択された計画によって新たな義務を割り当てられている。それらの職務が互いにとって明瞭なものとされない限り、動員は競合する要求の寄せ集めに留まるだろう。"
 ve_era_crossroads.30.a:0 "中央委員会を通じて国民の義務を成文化する。"
 ve_era_crossroads.30.b:0 "諸制度にその責任を交渉させる。"
 ve_era_crossroads.30.c:0 "我々の思想的組織を用いて義務を調整する。"
 ve_era_crossroads.30.a.tt:0 "#N 10#! 国政識見を消費して、#P +3 分水嶺進捗#!を獲得する。"
 ve_era_crossroads.30.b.tt:0 "資源を消費せず、分水嶺進捗を即座に変更しない。"
 ve_era_crossroads.30.c.tt:0 "路線適合するレベルIVの思想群が必要。#N 5#! 国政識見を消費して、#P +3 分水嶺進捗#!を獲得する。"

 ve_era_crossroads.31.t:0 "恒久的な緊急事態"
 ve_era_crossroads.31.d:0 "大衆の参加、戦略的即応性、あるいは産業動員のために構築された機構は、恒久的なものになりつつある。国家は、緊急時の規律が通常の国民生活を蝕むことを許さずに、キャパシティを維持する方法を決定しなければならない。"
 ve_era_crossroads.31.a:0 "国家による見直しを通じて恒久的な制限を定義する。"
 ve_era_crossroads.31.b:0 "合意を意図的に柔軟な状態に保つ。"
 ve_era_crossroads.31.c:0 "思想的諸制度に頼って機構を抑制する。"
 ve_era_crossroads.31.a.tt:0 "#N 10#! 国政識見を消費して、#P +3 分水嶺進捗#!を獲得する。"
 ve_era_crossroads.31.b.tt:0 "資源を消費せず、分水嶺進捗を即座に変更しない。"
 ve_era_crossroads.31.c.tt:0 "路線適合するレベルIVの思想群が必要。#N 5#! 国政識見を消費して、#P +3 分水嶺進捗#!を獲得する。"

 ve_era_crossroads.42.t:0 "動員された社会"
 ve_era_crossroads.42.d:0 "市民権、指揮、そして産業上のキャパシティは今や、持続可能な国家の合意を形成している。動員の諸制度は、新たな危機が生じるたびの場当たり的な対応ではなく、通常の政府の一部となっている。"
 ve_era_crossroads.42.a:0 "最後の時代はその国家の形を見出した。"
 ve_era_crossroads.42.a.tt:0 "完了した時代の分水嶺により、#P +50 時代勢力#!が付与された。これは目標の完了または黄金時代の資格の変更を行うものではない。"
