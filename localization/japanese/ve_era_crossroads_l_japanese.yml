 ve_je_era_crossroads_age_1:0 "蒸気と国家"
 ve_je_era_crossroads_age_1_reason:0 "産業と国家は近代国家形成への幾つもの道を開いた。選ばれたる道程は、単なる個別の達成の蓄積にとどまらぬものでなければならない。"
 ve_je_era_crossroads_age_1_status:0 "進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40のマイルストーンでは、国政識見を消費する強化を獲得できる。"
 ve_je_era_crossroads_age_1_route_1_status:0 "#Y 鉄道網#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n錨: この時代に確保された農民の割合に関する目標および鉄道に関する目標。\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40のマイルストーンでは、国政識見を消費する強化を獲得できる。"
 ve_je_era_crossroads_age_1_route_2_status:0 "#Y 教養ある市民社会#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n錨: この時代に確保された自由労働に関する目標および識字率または学校に関する目標。\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40のマイルストーンでは、国政識見を消費する強化を獲得できる。"
 ve_je_era_crossroads_age_1_route_3_status:0 "#Y 行政国家#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月間進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n錨: この時代に確保された正当性および行政力に関する目標ならびに自立した安定性に関する目標。\n\n目標: 進捗60に到達して #P +50 時代勢力#!を獲得する。進捗20および40のマイルストーンでは、国政識見を消費する強化を獲得できる。"
