 ve_je_era_crossroads_age_2_status:0 "進歩: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] か月#!\n月次進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n目標: 進捗状況が 60 に達する #P +50 時代の勢い#!。 20 および 40 プログレスのマイルストーンは、National Insight の資金によるブーストを提供します。"
 ve_je_era_crossroads_age_2_route_1_status:0 "#Y インペリアル ホライズン#!\n進捗状況:  #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間:  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]  か月#!\n月次進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー: 承認された国家能力の目標と、この時代中に確保された港湾または権益の目標。\n\n目標: 60 の進捗状況に到達する #P +50 時代の勢い#!。 20 および 40 の進捗のマイルストーンは、National Insight の資金による後押しを提供します。"
 ve_je_era_crossroads_age_2_route_2_status:0 "#Y 大衆福祉#!\n進捗状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間:  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]  か月#!\n月ごとの進捗:  #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー: 識字率または学校の目標と、この時代に確保された社会制度の目標。\n\n目標: 60 に到達  #P +50 時代の勢いに向けた進捗#!。 20 および 40 の進捗のマイルストーンは、National Insight の資金によるブーストを提供します。"
 ve_je_era_crossroads_age_2_route_3_status:0 "#Y 統合国家#!\n進捗状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月次進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー: 経済変革の目標と、この時代に確保された混乱の少ない正当性の目標。\n\n目標: の進捗状況が 60 に達する #P +50 時代の勢い#!。 20 および 40 プログレスのマイルストーンは、National Insight の資金によるブーストを提供します。"
 ve_je_era_crossroads_age_3:0 "動員社会"
