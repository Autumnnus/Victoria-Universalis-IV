 ve_je_era_crossroads_age_1:0 "蒸気と国家"
 ve_je_era_crossroads_age_1_reason:0 "産業と国家は、近代国家へのいくつかの道を切り開いてきました。選択したコースは、孤立した成果の集合以上のものでなければなりません。"
 ve_je_era_crossroads_age_1_status:0 "進行状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n毎月の進捗状況: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n目標: 60 の進捗状況に達する #P +50 時代の勢い#!。 20 および 40 の進捗のマイルストーンは、National Insight の資金によるブーストを提供します。"
 ve_je_era_crossroads_age_1_route_1_status:0 "#Y Steam ネットワーク#!\n進捗状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月次進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー:この時代中に確保された農民分配目標と鉄道目標。\n\n目標:60の進捗に到達する #P +50 時代の勢い#!。 20 および 40 の進捗のマイルストーンは、National Insight の資金によるブーストを提供します。"
 ve_je_era_crossroads_age_1_route_2_status:0 "#Y 教育を受けた市民権#!\n進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]  か月#!\n毎月の進捗状況: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー: 自由労働の目標と、この時代に確保された読み書き能力または学校の目標。\n\n目標: 60 の進捗状況に到達する #P +50 時代の勢い#!。 20 および 40 プログレスのマイルストーンは、National Insight の資金によるブーストを提供します。"
 ve_je_era_crossroads_age_1_route_3_status:0 "#Y 行政状態#!\n進捗状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月次進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー:正統性と官僚制の目標、およびこの時代に確保される独立した安定の目標。\n\n目標:60の進捗に到達する #P +50 時代の勢い#!。 20 と 40 の進歩のマイルストーンは、National Insight の資金による後押しを提供します。"
