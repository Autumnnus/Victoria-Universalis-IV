 ve_je_era_crossroads_age_3_status:0 "進捗状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] months#!\n月次進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n目標:60 に到達  #P +50 時代の勢いの進捗#!。 20 および 40 の進捗のマイルストーンでは、National Insight の資金によるブーストが提供されます。"
 ve_je_era_crossroads_age_3_route_1_status:0 "#Y 社会共和国#!\n進捗状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]  か月#!\n毎月の進捗状況: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー: この時代に確保された大衆政治の目標と成熟した社会制度の目標。\n\n目標: 60 の進歩を達成する #P +50 時代の勢い#!。 20 および 40 の進捗のマイルストーンでは、National Insight の資金によるブーストが提供されます。"
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y 戦略コマンド#!\n進捗状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] ヶ月#!\n月次進捗: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー:現代の戦力構成目標と、この時代に確保された大国到達目標。\n\n目標:60に到達する進捗状況 #P +50 時代の勢い#!。 20 および 40 の進捗のマイルストーンでは、National Insight の資金によるブーストが提供されます。"
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y アーセナル協会#!\n進捗状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] か月#!\n毎月の進捗状況: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nアンカー: この時代に確保された電気産業の目標と大量軍備の目標。\n\n目標: の進捗が 60 に達する #P +50 時代の勢い#!。 20 および 40 プログレスのマイルストーンは、National Insight の資金によるブーストを提供します。"

 ve_era_crossroads.1.t:0 "Steam と国家"
 ve_era_crossroads.1.d:0 "鉄道、学校、改革者、行政機関は、近代国家についてのライバルの説明を提供します。政府は、社会と国家の間のどの関係が最初の時代を組織するかを決定しなければなりません。"
 ve_era_crossroads.1.a:0 "蒸気ネットワークを通じて国を結び付けます。"
 ve_era_crossroads.1.b:0 "教育を受けた市民権を構築します。"
 ve_era_crossroads.1.c:0 "行政国家を統合します。"
 ve_era_crossroads.1.d.option:0 "この時代に国家の岐路は必要ない。"
 ve_era_crossroads.1.a.tt:0 "を開始します #Y スチームネットワーク#! ルート (焦点: 工業化、農民移住、鉄道)。\n• 目標: 60 の進捗状況に到達する #P +50 時代の勢い#!。\n• 進行速度: 基本月間進行状況 +1 を獲得し、さらに、完成した Age 1 アンカー (農民の分け前と鉄道目標) ごとに +1 追加されます。\n• ドクトリン シナジー: #Y 実業家 IV#! または #Y インフラストラクチャーIV#! マイルストーンの意思決定をより安価に行うことができます (10 ではなく 5 インサイト)。"
 ve_era_crossroads.1.b.tt:0 "を開始します #Y 教育を受けた市民権#! ルート (焦点: 教育、識字能力、無償労働)。\n• 目標: 60 の進歩に到達する #P +50 時代の勢い#!。\n• 進行速度: 基本的な毎月の進行状況が +1 獲得され​​、さらに、エイジ 1 アンカー (自由労働と識字能力/学校目標) を完了するごとに +1 追加されます。\n• ドクトリンの相乗効果: #Y アカデミックIV#! または #Y 改革者 IV#! マイルストーンの意思決定をより安価に行うことができます (10 ではなく 5 インサイト)。"
 ve_era_crossroads.1.c.tt:0 "を開始します #Y 行政状態#! ルート (焦点: 政府の正当性、官僚制、安定性)。\n• 目標: 60 の進捗状況に到達する #P +50 時代の勢い#!。\n• 進行速度: 基本月間進行状況 +1 を獲得し、さらに、年齢 1 のアンカー (正統性/官僚制および独立安定目標) を完了するごとに +1 追加されます。\n• ドクトリンの相乗効果: #Y 官僚主義 IV#! または #Y 議会 IV#! マイルストーンの意思決定をより安価に行うことができます (10 ではなく 5 インサイト)。"
 ve_era_crossroads.2.t:0 "帝国か大衆社会か?"
 ve_era_crossroads.2.d:0 "国家はもはや海外進出、国民の福祉、国家統合を別個の問題として扱うことはできない。そのうちの 1 つが、他のものがどのように追求されるかを定義します。"
 ve_era_crossroads.2.a:0 "帝国の地平線を目指してください。"
 ve_era_crossroads.2.b:0 "大衆福祉のシステムを構築します。"
 ve_era_crossroads.2.c:0 "統合国家を築きましょう。"
 ve_era_crossroads.2.d.option:0 "時代に独自の方向性を見つけさせてください。"
 ve_era_crossroads.2.a.tt:0 "世界を始めましょう。 #Y インペリアル ホライゾン#! ルート (焦点: 外交力と海外展開)。\n• 目標: 60 に到達して獲得する進捗状況 #P +50 時代の勢い#!。\n• 進行速度: 基本月間進行状況 +1 を獲得し、さらに、完成した Age 2 アンカー (承認された国家能力および港湾/利益目標) ごとに +1 追加されます。\n• ドクトリン シナジー: #Y 外交Ⅳ#! または #Y コロニアル IV#! マイルストーンの意思決定をより安価に行うことができます (10 ではなく 5 インサイト)。"
 ve_era_crossroads.2.b.tt:0 "を開始します #Y 大衆福祉#! ルート (重点: 社会制度、医療、教育)。\n• 目標: 60 の進捗状況に到達する #P +50 時代の勢い#!。\n• 進行速度: 基本的な毎月の進行状況が +1 獲得され​​、さらに、年齢 2 のアンカー (識字/学校および社会制度の目標) を完了するごとに +1 追加されます。\n• ドクトリンの相乗効果: #Y 福祉Ⅳ#! または #Y 改革者 IV#! マイルストーンの意思決定をより安価に行うことができます (10 ではなく 5 インサイト)。"
 ve_era_crossroads.2.c.tt:0 "を開始します #Y 統合国家#! ルート (焦点: 経済変革と国内の安定)。\n• 目標: 60 に到達して獲得する進捗状況 #P +50 時代の勢い#!。\n• 進行速度: 基本的な毎月の進行状況が +1 獲得され​​、さらに、エイジ 2 のアンカー (経済変革と低混乱の正当性目標) を完了するごとに +1 追加されます。\n• ドクトリンの相乗効果: #Y ナショナリスト IV#! または #Y 労働 IV#! マイルストーンの意思決定をより安価に行うことができます (10 ではなく 5 インサイト)。"
 ve_era_crossroads.3.t:0 "動員社会"
 ve_era_crossroads.3.d:0 "大衆政治、戦略的指揮、産業動員は今やあらゆる機関に及んでいます。最後の時代には、どのような形態の動員が国家を定義するかという選択が求められる。"
 ve_era_crossroads.3.a:0 "社会共和国にコミットします。"
 ve_era_crossroads.3.b:0 "国家を戦略的指揮下に置く。"
 ve_era_crossroads.3.c:0 "アーセナル協会を構築する。"
 ve_era_crossroads.3.d.option:0 "永久動員プロジェクトを拒否する。"
 ve_era_crossroads.3.a.tt:0 "を開始します #Y 社会共和国#! ルート (焦点: 大衆政治と社会制度)。\n• 目標: 60 に到達して獲得する進歩 #P +50 時代の勢い#!。\n• 進行速度: 基本月間進行状況 +1 を獲得し、さらに、エイジ 3 アンカー (大衆政治と成熟した社会制度の目標) を完了するごとに +1 追加されます。\n• ドクトリン シナジー: #Y 議会 IV#! または #Y 福祉Ⅳ#! マイルストーンの意思決定をより安価に行うことができます (10 ではなく 5 インサイト)。"
 ve_era_crossroads.3.b.tt:0 "を開始します #Y 戦略的指揮#! ルート (焦点: 軍事近代化と世界的勢力への到達)。\n• 目標: 60 に到達して獲得する進捗状況 #P +50 Era Momentum#!。\n• 進行速度: 基本月間進行状況 +1 を獲得し、さらに、Age 3 のアンカー (現代の部隊構成と Great Power Reach 目標) を完了するごとに +1 追加されます。\n• ドクトリン シナジー: #Y プロフェッショナル・アーミー IV#! または #Y 防御IV#! マイルストーンの意思決定をより安価に行うことができます (10 ではなく 5 インサイト)。"
 ve_era_crossroads.3.c.tt:0 "を開始します #Y アーセナル協会#! ルート (焦点: 産業戦争経済と大量軍備)。\n• 目標: 60 の進捗状況に到達する #P +50 時代の勢い#!。\n• 進行速度: 基本月間進行状況 +1 を獲得し、さらに、エイジ 3 アンカー (電気産業と大量兵器の目標) を完了するごとに +1 追加されます。\n• ドクトリン シナジー: #Y 戦争経済IV#! または #Y 大量徴兵 IV#! マイルストーンの意思決定をより安価に行うことができます (10 ではなく 5 インサイト)。"

 ve_era_crossroads_decline_tt:0 "現在の時代のクロスロードを永久に拒否します。それ以降の年齢層も引き続き対象となります。"

 ve_era_crossroads.10.t:0 "全国カレンダー"
 ve_era_crossroads.10.d:0 "地方自治体、民間団体、省庁は、さまざまな速度で選択された変革を追求しています。共通のカレンダーがあれば、散在する成果を国家計画に変えることができるかもしれないが、調整自体には行政上の配慮はほとんど必要ない。"
 ve_era_crossroads.10.a:0 "中央調整委員会に資金を提供する。"
 ve_era_crossroads.10.b:0 "各機関が独自のスケジュールを交渉できるようにしましょう。"
 ve_era_crossroads.10.c:0 "私たちの確立された原則によって構築されたネットワークを使用してください。"
 ve_era_crossroads.10.a.tt:0 "過ごす #N 10 国家的見識#! 得る #P +3 クロスロードの進行状況#!。"
 ve_era_crossroads.10.b.tt:0 "リソースを費やすことはなく、Crossroads の進行状況にすぐに変更を加えることはありません。"
 ve_era_crossroads.10.c.tt:0 "ルート適合レベル IV アイデア グループが必要です。過ごす #N 5 国家的見識#! 得る #P +3 クロスロードの進行状況#!."

 ve_era_crossroads.11.t:0 "誰が進歩を指揮するのか？"
 ve_era_crossroads.11.d:0 "この計画は、緩やかな合意を残すにはあまりにも重要なものになってしまった。閣僚は国家の権威を主張し、専門家は政治からの絶縁を要求し、地方関係者は厳格な命令が進歩を可能にした制度を破壊すると警告する。"
 ve_era_crossroads.11.a:0 "センターに明確な調整権限を与える。"
 ve_era_crossroads.11.b:0 "交渉による権限の均衡を維持する。"
 ve_era_crossroads.11.c:0 "調整を教義上の機関に委ねる。"
 ve_era_crossroads.11.a.tt:0 "支出を行う。 #N 10 国家的見識#! 得る #P +3 クロスロードの進行状況#!."
 ve_era_crossroads.11.b.tt:0 "リソースを消費せず、クロスロードの進行状況を直ちに変更しないでください。"
 ve_era_crossroads.11.c.tt:0 "ルート適合レベル IV アイデア グループが必要です。過ごす #N 5 国家的見識#! 得る #P +3 クロスロードの進行状況#!。"

 ve_era_crossroads.40.t:0 "蒸気と国家"
 ve_era_crossroads.40.d:0 "選択したコースは、もは​​や一連の孤立した成果ではありません。インフラストラクチャー、市民権、または行政は現在、国家が時代の変革を理解し、方向付けることができる永続的な国家プログラムを形成しています。"
 ve_era_crossroads.40.a:0 "第一の時代はその制度的形態を見つけました。"
 ve_era_crossroads.40.a.tt:0 "完成した時代の交差点が叶えたのは、 #P +50 時代の勢い#!。目標を達成していないか、黄金時代の資格を変更していません。"

 ve_era_crossroads.20.t:0 "国家の範囲"
 ve_era_crossroads.20.d:0 "選ばれたプログラムは、最初に後援した機関を超えて広がりました。港湾、学校、オフィス、地方自治体は、国の調整をどこで終了し、地方の裁量を開始するかについて意見が一致していない。"
 ve_era_crossroads.20.a:0 "中央委員会を通じて国家の義務を地図化する。"
 ve_era_crossroads.20.b:0 "交渉によって制度上の境界を設けることを許可する。"
 ve_era_crossroads.20.c:0 "確立された教義上のネットワークを通じて調整します。"
 ve_era_crossroads.20.a.tt:0 "過ごす #N 10 国家的見識#! 得る #P +3 クロスロードの進行状況#!。"
 ve_era_crossroads.20.b.tt:0 "リソースを費やすことはなく、Crossroads の進行状況にすぐに変更を加えることはありません。"
 ve_era_crossroads.20.c.tt:0 "ルート適合レベル IV アイデア グループが必要です。過ごす #N 5 国家的見識#! 得る #P +3 クロスロードの進行状況#!."

 ve_era_crossroads.21.t:0 "統合の代償"
 ve_era_crossroads.21.d:0 "外部からの影響力、社会的提供、国家規律はすべて、勝者、コスト、そして新たな期待を生み出します。このプログラムは、国家がこれらの負担をどのように配分するかを決定する場合にのみ存続することができます。"
 ve_era_crossroads.21.a:0 "調整を管理するための国家委員会を設立します。"
 ve_era_crossroads.21.b:0 "交渉による妥協を通じて負担を配分します。"
 ve_era_crossroads.21.c:0 "私たちの教義上の制度に負担を吸収させます。"
 ve_era_crossroads.21.a.tt:0 "支出を行います。 #N 10 国家的見識#! 得る #P +3 クロスロードの進行状況#!."
 ve_era_crossroads.21.b.tt:0 "リソースを消費せず、クロスロードの進行状況を直ちに変更しないでください。"
 ve_era_crossroads.21.c.tt:0 "ルート適合レベル IV アイデア グループが必要です。過ごす #N 5 国家的見識#! 得る #P +3 クロスロードの進行状況#!。"

 ve_era_crossroads.41.t:0 "帝国と大衆社会"
 ve_era_crossroads.41.d:0 "選択された和解は現在、国家の対外的範囲、社会的義務、国家機関を結びつけている。戦略的方向性として始まったものは、大衆社会を統治するための永続的な枠組みになりました。"
 ve_era_crossroads.41.a:0 "第二の時代は終焉を迎えました。"
 ve_era_crossroads.41.a.tt:0 "完成した時代の交差点が叶えたのは、 #P +50 時代の勢い#!。目標を達成していないか、黄金時代の資格を変更していません。"

 ve_era_crossroads.30.t:0 "国家は義務を求められている"
 ve_era_crossroads.30.d:0 "国民、指揮官、労働者、管理者は皆、選択されたプログラムによって新たな義務を割り当てられています。 Unless those duties are made legible to one another, mobilization will remain a collection of competing demands."
 ve_era_crossroads.30.a:0 "中央委員会を通じて国家の義務を成文化する。"
 ve_era_crossroads.30.b:0 "各機関がその責任について交渉しましょう。"
 ve_era_crossroads.30.c:0 "私たちの教義上の組織を利用して義務を調整します。"
 ve_era_crossroads.30.a.tt:0 "過ごす #N 10 国家的見識#! 得る #P +3 クロスロードの進行状況#!。"
 ve_era_crossroads.30.b.tt:0 "リソースを費やすことはなく、Crossroads の進行状況にすぐに変更を加えることはありません。"
 ve_era_crossroads.30.c.tt:0 "ルート適合レベル IV アイデア グループが必要です。過ごす #N 5 国家的見識#! 得る #P +3 クロスロードの進行状況#!."

 ve_era_crossroads.31.t:0 "恒久的な緊急事態"
 ve_era_crossroads.31.d:0 "大衆の参加、戦略的準備、産業動員のために構築された機構は恒久的なものになりつつあります。国家は、緊急規律によって通常の国民生活を消費させずに能力を維持する方法を決定する必要がある。"
 ve_era_crossroads.31.a:0 "国家的見直しを通じて恒久的な制限を定義する。"
 ve_era_crossroads.31.b:0 "和解を意図的に柔軟に保つ。"
 ve_era_crossroads.31.c:0 "機械を封じ込めるために教義上の制度に依存する。"
 ve_era_crossroads.31.a.tt:0 "支出を行う。 #N 10 国家的見識#! 得る #P +3 クロスロードの進行状況#!."
 ve_era_crossroads.31.b.tt:0 "リソースを消費せず、クロスロードの進行状況を直ちに変更しないでください。"
 ve_era_crossroads.31.c.tt:0 "ルート適合レベル IV アイデア グループが必要です。過ごす #N 5 国家的見識#! 得る #P +3 クロスロードの進行状況#!。"

 ve_era_crossroads.42.t:0 "動員社会"
 ve_era_crossroads.42.d:0 "市民権、指揮権、産業能力により、現在では永続的な国家定住が形成されています。動員機関は、新たな危機のたびにその場しのぎの対応策として残されるのではなく、通常の政府の一部となった。"
 ve_era_crossroads.42.a:0 "最後の時代は国家の形を見つけました。"
 ve_era_crossroads.42.a.tt:0 "完成した時代の交差点が叶えたのは、 #P +50 時代の勢い#!。目標を達成していないか、黄金時代の資格を変更していません。"
