l_japanese:
 SOC_HEADER:0 "社会思想"
 PROD_HEADER:0 "生産思想"
 MIL_HEADER:0 "軍事思想"
 ve_national_ideas:0 " 国家思想"
 ve_idea_points:0 "#tooltippable_name 国政識見"
 ve_national_insight_tt:0 "#header 国政識見#!\n備蓄: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n今月: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\n購入状況: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 効果#!\n国政識見を消費して、採用済みの思想群における個別の思想を購入します。購入のたびに国家思想が進展し、現在の国策投資に加算されます。投資の節目に到達すると、思想群のキャパシティが永続的に付与されます。\n\n#title 月間収入の変動要因#!\n基本値: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\n識字率: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\n学校: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\n大学: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\n行政: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\n正統性: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\n知識人: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\n借金、社会不安および実行負荷: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title 備蓄圧迫#!\n収入倍率: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\n#Y 750#!で収入は半分になり、#Y 900#!で4分の1に低下し、#Y 1000#!で停止します。上限に達する前に消費することで、収入の無駄を防げます。"
 ve_national_insight_implementation_strain:0 "国策実行負荷"
 ve_national_insight_implementation_strain_desc:0 "政府は、新たに採用された国策に合わせて制度や手続きを適応させている。この24か月の実行期間が終了するまで、新たな思想群の思想を採用することはできない。"
 ve_total_ideas:0 "思想群"
 ve_traditions:0 "#tooltippable_concept 伝統: "
 ve_bonus:0 "#tooltippable_concept ボーナス: "
 ve_ambition:0 "大望"
 ve_ambition_tooltip:0 "#Y 大望#!\n#P 永続的な極意報酬#!\nこの思想群の7つの思想すべてが採用されると自動的に解除されます。"
 ve_idea_cancel_warning:0 "#header [StateRegion.MakeScope.Var('idea_group')]を破棄しますか？#!\n\n#N この思想群の有効なすべての思想補正が削除されます。#!\n#N 解除済みである場合、その大望補正も削除されます。#!\n\n消費した国政識見は返還されません。\n返還される国政識見: #Y 0#!\n\n#title 削除される効果#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N 確認: この思想群を破棄します。#! 進捗と補正は失われ、国政識見は返還されません。"
 ve_idea_cancel_keep_tt:0 "この思想群を維持し、破棄しません。"
 ve_embrace:0 "採用"
 ve_idea_locked:0 "閉ざされた道"
 ve_idea_locked_tt:0 "#N この思想群は、すでに採用している思想群と排他関係にあります。この道を開くには、該当する群を破棄してください。"
 ve_idea_age_locked:0 "技術要件"
 ve_idea_age_locked_tt:0 "#N この思想群には、まだ研究されていない技術が必要です。"
 ve_idea_labour_technology_locked_tt:0 "#N [GetTechnology('labor_movement').GetName]が必要です。#!"
 ve_idea_welfare_technology_locked_tt:0 "#N [GetTechnology('human_rights').GetName]が必要です。#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N [GetTechnology('nationalism').GetName]が必要です。#!"
 ve_idea_reformist_technology_locked_tt:0 "#N [GetTechnology('egalitarianism').GetName]が必要です。#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N [GetTechnology('enlistment_offices').GetName]が必要です。#!"
 ve_idea_colonial_technology_locked_tt:0 "#N [GetTechnology('quinine').GetName]が必要です。#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N [GetTechnology('war_propaganda').GetName]が必要です。#!"
 ve_boost_idea:0 "思想の強化"
 ve_boost_idea_tt:0 "#header 次の思想を採用#!\n国政識見: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\n購入状況: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 次のレベルのコスト#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nこの群の次の未取得レベルに一致するコストを使用します。\n\n#title 購入時の動作#!\n#P この群の次の補正が有効になります。#!\n#P 国策投資と国家思想の進捗がそれぞれ 1 増加します。#!\n#N 24か月の国策実行負荷サイクルが始まります。この期間中は他の群の思想を購入できません。#!\n\n#title ボタンが無効になる理由#!\n国政識見が次のレベルのコストを下回っている、国策実行負荷が有効である、群が完了している、または次のレベルに未研究の技術が必要です。\n\nこの群を破棄すると、思想の補正と現在の進捗が削除されます。消費した識見が返還されることはありませんが、節目からすでに獲得した群のキャパシティが取り消されることはありません。"
 academic_idea_name:0 "#b 学術的思想"
