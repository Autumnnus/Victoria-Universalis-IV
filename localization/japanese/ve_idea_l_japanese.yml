 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P 告解体制または国家無神論において信仰改革力/月 +1#!、および#P 民族国家において文化政策力/月 +1#!"
 nationalist_idea_7_tt:0 "#P 告解体制または国家無神論において宗教事業進捗/月 +1#!、#P 民族国家において文化事業進捗/月 +1#!、威圧的な宗教的および民族的統合の結果が#Y 5%#!から#Y 7%#!へと向上する。"
 embrace_idea_tt:0 "#header 思想群許容量#!\n使用スロット: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\n残り空きスロット: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n現在の国策投資: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! 有効な購入済み思想\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title 許容量の仕組み#!\n有効な購入済みの思想群はそれぞれ#P +1#!の国策投資を供給する。#Y 4, 8, 13, 19, 26#!または#Y 34#!に到達すると、グループスロットが永久に1つ追加される。スロット5～6には時代2も必要であり、スロット7には時代3が必要となる。\n\n#title 採用と破棄#!\n思想群の採用に洞察力は消費されないが、空きスロットを1つ占有する。破棄するとスロットが解放され、そのグループの補正が削除され、現在の国策投資が減少する。消費された洞察力は返還されない。すでに獲得した容量スロットは永久に利用可能なままとなる。"
 ve_idea_capacity_player_progress:0 "#title 次の永久スロット#!\nスロット: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n進捗: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 購入済み思想\n必要残数: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title 次の永久スロット#!\nスロット: #Y 5#!\n進捗: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 購入済み思想\n必要残数: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n時代の要件: #N 時代2を待機中#!"
 ve_idea_capacity_player_age_3:0 "#title 次の永久スロット#!\nスロット: #Y 7#!\n進捗: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 購入済み思想\n必要残数: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n時代の要件: #N 時代3を待機中#!"
 ve_idea_capacity_player_max:0 "#P 最大容量に到達: 7つの永久グループスロットすべてが利用可能です。#!"
 ve_idea_capacity_country_progress:0 "#title 次の永久スロット#!\nスロット: #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n進捗: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 購入済み思想\n必要残数: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title 次の永久スロット#!\nスロット: #Y 5#!\n進捗: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 購入済み思想\n必要残数: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n時代の要件: #N 時代2を待機中#!"
 ve_idea_capacity_country_age_3:0 "#title 次の永久スロット#!\nスロット: #Y 7#!\n進捗: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 購入済み思想\n必要残数: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n時代の要件: #N 時代3を待機中#!"
 ve_idea_capacity_country_max:0 "#P 最大容量に到達: 7つの永久グループスロットすべてが利用可能です。#!"
 ve_idea_implementation_player_ready:0 "#P 準備完了 — 十分な洞察力があれば、別の思想を採用できます。#!"
 ve_idea_implementation_player_locked:0 "#N 実装進行中 — 別の思想を採用できるようになるまで [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] 残っています。#!"
 ve_idea_era_momentum_age_1_tt:0 "#P  年齢 1 の間: +1 Era Momentum/月#! このレベル IV アイデア グループから。 Ide Group への寄付の上限は次のとおりです。 #Y +2#!。"
