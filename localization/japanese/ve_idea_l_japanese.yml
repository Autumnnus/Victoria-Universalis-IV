 ve_national_ideas:0 " 国家アイデア"
 ve_idea_points:0 "#tooltippable_name 国家洞察"
 ve_national_insight_tt:0 "#header National Insight#!\n在庫: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n今月: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\n購入ステータス: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title その内容#!\nNational Insightは、採用されたアイデア グループ内の個々のアイデアを購入します。積極的に購入するたびに国家アイデアが前進し、現在のドクトリン投資が増加します。投資マイルストーンに到達すると、グループのキャパシティが永続的に付与されます。\n\n#title 月収が変化する理由#!\n基盤:  [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\n識字率:  [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\n学校:  [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\n大学:  [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\n行政:  [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\n正統性:  [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nインテリ層:  [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\n借金、混乱、実行:  [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title 株価圧力#!\n所得乗数:  #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\n収入は半減する #Y 750#! では 4 分の 1 に低下します。 #Y 900#! そして止まります #Y 1000#!。在庫上限に達する前に支出することで、収入の無駄を防ぐことができます。"
 ve_national_insight_implementation_strain:0 "ドクトリン実装の緊張"
 ve_national_insight_implementation_strain_desc:0 "政権は制度と手続きを新たに採用された国家原則に適応させようとしている。この 24 か月の実施サイクルが終了するまで、別のグループのアイデアを採用することはできません。"
 ve_total_ideas:0 "アイデアグループ"
 ve_traditions:0 "#tooltippable_concept 伝統: "
 ve_bonus:0 "#tooltippable_concept ボーナス: "
 ve_ambition:0 "野心"
 ve_ambition_tooltip:0 "#Y 野心#!\n#P 永久キャップストーン報酬#!\nこのグループの 7 つのアイデアすべてが受け入れられると、自動的にロックが解除されます。"
 ve_idea_cancel_warning:0 "#header キャンセル [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N このグループ内のアクティブなアイデア修飾子はすべて削除されます。#!\n#N ロックが解除されている場合は、その野心修飾子も削除されます。#!\n\n使用したNational Insightは返金されません。\n返されたNational Insight: #Y 0#!\n\n#title 削除される効果#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N 確認: このアイデアをキャンセルしますグループ。#! 進行状況と修飾子は失われ、National Insight は返金されません。"
 ve_idea_cancel_keep_tt:0 "このアイデア グループを保持します - キャンセルしないでください。"
 ve_embrace:0 "受け入れる"
 ve_idea_locked:0 "パスが閉じられました"
 ve_idea_locked_tt:0 "#N このアイデア グループは、あなたがすでに受け入れているアイデア グループとは相互に排他的です。このパスを開くには、そのグループをキャンセルしてください。"
 ve_idea_age_locked:0 "必要な技術"
 ve_idea_age_locked_tt:0 "#N このアイデア グループには、まだ研究されていないテクノロジが必要です。"
 ve_idea_labour_technology_locked_tt:0 "#N 要件 [GetTechnology('labor_movement').GetName]。#!"
 ve_idea_welfare_technology_locked_tt:0 "#N 要件 [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N 要件 [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N 要件 [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N 要件 [GetTechnology('enlistment_offices').GetName]。#!"
 ve_idea_colonial_technology_locked_tt:0 "#N 要件 [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N 要件 [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "アイデアを強化"
 ve_boost_idea_tt:0 "#header 次のアイデアを採用#!\nNational Insight: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\n購入ステータス: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 次のレベルのコスト#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\nこのグループの次の未記入レベルに一致するコストを使用します。\n\n#title 購入時の動作#!\n#P このグループの次のモディファイアがアクティブになります。#!\n#P ドクトリン投資と国家理念の進捗は 1 ずつ増加します。#!\n#N 24 か月のドクトリン実装サイクルが始まります。この期間中は他のグループのアイデアを購入できません。#!\n\n#title ボタンを無効にできるのはなぜですか?#!\nインサイトは次のレベルのコストを下回っています。ドクトリンの実装はアクティブです。グループが完成しました。または、次のレベルには未研究のテクノロジーが必要です。\n\nこのグループをキャンセルすると、アイデアの変更子と現在の進行状況が削除されます。 Spent Insight は払い戻されませんが、マイルストーンからすでに獲得したグループ スロットが取り消されることはありません。"
