 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 敬虔な改革/月#! 告白的または国家的無神論において、そして #P +1 文化的義務/月#! 民族国家では"
 nationalist_idea_7_tt:0 "#P 宗教プロジェクトの進捗が 1 か月あたり#! 告白または国家無神論の場合、文化プロジェクトの進捗が 1 か月あたり #P #! 民族国家で。強制的な宗教と民族の統合の成果は以前より改善される #Y 5%#! に #Y 7%#!."
 embrace_idea_tt:0 "#header アイデア グループの容量#!\n使用スロット: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\n今すぐ無料スロット: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n現在の Doctrine 投資: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! アクティブな購入済みアイデア\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title 容量の仕組み#!\n各アクティブな購入済みグループ アイデアの供給 #P +1#! ドクトリン投資。到達 #Y 4、8、13、19、26#! または #Y 34#! 1 つのグループ スロットを永続的に追加します。スロット 5 ～ 6 にも Age 2 が必要です。スロット 7 には年齢 3 が必要です。\n\n#title 受け入れてキャンセルします#!\nグループを受け入れるにはインサイトはかかりませんが、空きスロットが 1 つ占有されます。キャンセルするとスロットが解放され、グループのモディファイアが削除され、現在の Doctrine Investment が減ります。使用したインサイトは返金されません。すでに獲得した容量スロットは永続的に利用可能です。"
 ve_idea_capacity_player_progress:0 "#title 次の永続スロット#!\nスロット: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n進行状況: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 購入したアイデア\nまだ必要です: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title 次の永続スロット#!\nスロット: #Y 5#!\n進行状況: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 購入済みアイデア\nまだ必要: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n年齢要件: #N 2歳待ち#!"
 ve_idea_capacity_player_age_3:0 "#title 次の永久スロット#!\nスロット: #Y 7#!\n進行状況: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 購入済みアイデア\nまだ必要: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n年齢要件: #N 3歳まで待機中#!"
 ve_idea_capacity_player_max:0 "#P 最大容量に達しました: 7 つの永続グループ スロットがすべて利用可能です。#!"
 ve_idea_capacity_country_progress:0 "#title 次の永続スロット#!\nスロット:  #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n進行状況:  #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 購入したアイデア\nまだ必要です: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title 次の永続スロット#!\nスロット: #Y 5#!\n進行状況: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 購入済みアイデア\nまだ必要: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n年齢要件: #N 2歳まで待機中#!"
 ve_idea_capacity_country_age_3:0 "#title 次の永久スロット#!\nスロット: #Y 7#!\n進行状況: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 購入済みアイデア\nまだ必要: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n年齢要件: #N 3歳まで待機中#!"
 ve_idea_capacity_country_max:0 "#P 最大容量に達しました: 7 つの永続的なグループ スロットがすべて使用可能です。#!"
 ve_idea_implementation_player_ready:0 "#P 準備完了 — 十分な洞察が得られれば、別のアイデアが採用される可能性があります。#!"
 ve_idea_implementation_player_locked:0 "#N 実装中 — [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] 別のアイデアが採用されるまでの残り時間。#!"
 ve_idea_era_momentum_age_1_tt:0 "#P  年齢 1 の間: +1 Era Momentum/月#! このレベル IV アイデア グループから。 Ide Group への寄付の上限は次のとおりです。 #Y +2#!。"
 ve_idea_era_momentum_age_2_tt:0 "#P 年齢 2 の間: +1 時代の勢い/月#! このレベル IV アイデア グループから。 Ide Group への寄付の上限は次のとおりです。 #Y +2#!。"
 ve_idea_era_momentum_age_3_tt:0 "#P 3 歳中: +1 時代の勢い/月#! このレベル IV アイデア グループから。 Ide Group への寄付の上限は次のとおりです。 #Y +2#!."
 reformist_idea_5_system_tt:0 "#P +1 敬虔な改革/月#! 良心の自由または完全な分離において、そして #P +1 文化的義務/月#! 市民国家または複合国家で。"
 reformist_idea_7_system_tt:0 "#P +1 宗教プロジェクトの進捗状況/月#! 良心の自由と #P +1 文化プロジェクトの進捗状況/月#! 市民国家または複合国家において。"
 academic_idea_5_system_tt:0 "#P +1 文化的義務/月#! Civic Nation."
 academic_idea_7_system_tt:0 "#P +1 宗教プロジェクトの進捗状況/月#! 国家無神論と #P +1 文化プロジェクトの進捗状況/月#! Civic Nation."
 welfare_idea_6_system_tt:0 "#P +1 文化プロジェクトの進捗状況/月#! シビック・ネイションで。"
 diplomatic_idea_6_system_tt:0 "#P +1 文化プロジェクトの進捗状況/月#! 複合状態。"
