l_japanese:
 ve_splendor:0 "#tooltippable_name 時代の勢い: "
 ve_age_of_victoria_title:0 "産業と国家"
 ve_age_of_victoria_desc:0 "古い秩序は、工場、鉄道、読み書きできる国民、そして近代国家と対峙しています。勢いは、継承された制度を永続的な国家能力に変える国々に属します。"
 ve_imperialism_age_title:0 "帝国と大衆社会"
 ve_imperialism_age_desc:0 "産業は大陸を越えて広がり、教育、公的機関、組織された軍隊が大衆社会を再形成します。大国は海外に進出するかもしれない。小さな国家は主権と国内発展によって繁栄することができます。"
 ve_great_wars_age_title:0 "大衆政治と総力戦"
 ve_great_wars_age_desc:0 "電力、石油、大衆参加、福祉、産業戦争は国家と社会の関係を変革します。今や生存は軍隊と同様に組織に依存している。"
 ve_age_notify_option:0 "新しい時代の幕開けです。"
 ve_victorian_age_icon_p_tt:0 "#P 産業と国家 (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N 産業と国家 (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P 帝国と大衆社会 (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N 帝国と大衆社会 (1871–1905) "
 ve_great_war_age_icon_p_tt:0 "#P 大衆政治と総戦争 (1906–1936) "
 ve_great_war_age_icon_n_tt:0 "#N 大衆政治と総戦争 (1906–1936) "

 ve_golden_age:0 "黄金時代 "
 ve_golden_age_industrial:0 "産業黄金時代"
 ve_golden_age_cultural:0 "文化的黄金時代"
 ve_golden_age_strategic:0 "戦略的黄金時代"
 ve_golden_age_tt:0 "入手可能場所 #v 1845年#! 完了後 #v 5 つの異なる目標#! 今の時代では。国はゲーム全体を通じて黄金時代を 1 つだけ選択できます。その効果は持続する #v 15年#!."
 ve_golden_age_requirement_unused:0 "このキャンペーン中に黄金時代が選択されていません。"
 ve_golden_age_requirement_year:0 "年が必要です #v 1845年#! 以降。"
 ve_golden_age_requirement_objectives:0 "少なくとも完了してください #v 5 つの異なる目標#! 今の時代では。"
 ve_golden_age_industrial_tt:0 "#header 産業の黄金時代#!\n #Y 15 年間#!: #P +10% の製造スループット#! そして #P +10% リソース発見チャンス#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header 文化の黄金時代#!\n #Y 15 年間#!: #P +5% 教育アクセス#! および #P +10% 威信#!。\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header 戦略黄金時代#!\n #Y 15 年間#!: #P  陸軍攻撃力#! +5%  #P 、死傷者による戦争疲労度 -10%#!。\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "年齢目標"

 ve_victorian_age_obj_title_1:0 "#tooltip_header 産業の離陸"
 ve_victorian_age_obj_desc_1:0 "農民の割合を40%未満に減らす。"
 ve_victorian_age_obj_title_2:0 "#tooltip_header 旧秩序を終わらせる"
 ve_victorian_age_obj_desc_2:0 "奴隷制を禁止し、農奴制を廃止する。"
 ve_victorian_age_obj_title_3:0 "#tooltip_header 機能的な国家"
 ve_victorian_age_obj_desc_3:0 "不足が近づくことなく、少なくとも70の正当性と否定的でない官僚制のバランスを維持する。"
 ve_victorian_age_obj_title_4:0 "#tooltip_header 教育を受けた国民"
 ve_victorian_age_obj_desc_4:0 "識字率50%またはレベル3の学校に到達する。"
 ve_victorian_age_obj_title_5:0 "#tooltip_header 統合マーケット"
 ve_victorian_age_obj_desc_5:0 "人口が 500 万人未満の場合は少なくとも 3 つの鉄道レベルを所有し、それ以外の場合は 6 つの鉄道レベルを所有します。"
 ve_victorian_age_obj_title_6:0 "#tooltip_header 国家の覚醒"
 ve_victorian_age_obj_desc_6:0 "少なくとも65の正統性と国家の混乱が5%未満で独立すること。"
 ve_victorian_age_obj_title_7:0 "#tooltip_header 世界的なリーチ"
 ve_victorian_age_obj_desc_7:0 "大国または大国になるか、少なくとも5つの宣言された利益を維持すること。"

 ve_imperialism_age_obj_title_1:0 "#tooltip_header 産業大国"
 ve_imperialism_age_obj_desc_1:0 "GDP1億ポンドに達するか、農民のシェアを25%以下に減らす。"
 ve_imperialism_age_obj_title_2:0 "#tooltip_header 大衆教育"
 ve_imperialism_age_obj_desc_2:0 "識字率65%に達するか、学校レベル4に達する。"
 ve_imperialism_age_obj_title_3:0 "#tooltip_header 帝国または主権"
 ve_imperialism_age_obj_desc_3:0 "少なくとも 2 つの主体を持つか、独立して承認されたままである。"
 ve_imperialism_age_obj_title_4:0 "#tooltip_header グローバルコマース"
 ve_imperialism_age_obj_desc_4:0 "人口が 1,000 万未満の場合は 2 つの港レベルを所有し、それ以外の場合は 10 の港レベルを所有するか、5 つの宣言された権益を維持します。"
 ve_imperialism_age_obj_title_5:0 "#tooltip_header 国家建設"
 ve_imperialism_age_obj_desc_5:0 "少なくとも 60 の正統性と 5% 未満の国の混乱を維持する。"
 ve_imperialism_age_obj_title_6:0 "#tooltip_header 社会的な質問"
 ve_imperialism_age_obj_desc_6:0 "医療制度、職場の安全、または社会保障をレベル 2 に引き上げます。"
 ve_imperialism_age_obj_title_7:0 "#tooltip_header 現代軍隊"
 ve_imperialism_age_obj_desc_7:0 "軍隊の少なくとも 50% の散兵または塹壕歩兵と 10% の機動砲兵を配備します。"

 ve_great_wars_age_obj_title_1:0 "#tooltip_header 大衆政治"
 ve_great_wars_age_obj_desc_1:0 "普通選挙または評議会共和国を制定するか、議会または大統領共和国としての正統性を維持します。"
 ve_great_wars_age_obj_title_2:0 "#tooltip_header 社会状態"
 ve_great_wars_age_obj_desc_2:0 "保健、社会保障、職場の安全、学校のうち少なくとも 2 つのレベル 3 機関を維持します。"
 ve_great_wars_age_obj_title_3:0 "#tooltip_header 電化経済"
 ve_great_wars_age_obj_desc_3:0 "人口が 1,000 万人未満の場合は 1 つの発電所レベルを所有し、それ以外の場合は 5 つの発電所レベルを所有します。"
 ve_great_wars_age_obj_title_4:0 "#tooltip_header オイルとエンジン"
 ve_great_wars_age_obj_desc_4:0 "石油掘削装置を所有するか、少なくとも 5 つの自動車産業レベルを所有します。"
 ve_great_wars_age_obj_title_5:0 "#tooltip_header 現代の軍事"
 ve_great_wars_age_obj_desc_5:0 "陸軍の少なくとも 50% の塹壕歩兵または分隊歩兵と 15% の破片砲兵を配備します。"
 ve_great_wars_age_obj_title_6:0 "#tooltip_header 総戦争能力"
 ve_great_wars_age_obj_desc_6:0 "40 の陸軍ユニットと少なくとも 5 つの兵器産業レベルまたは 3 つの軍需工場レベルを維持します。"
 ve_great_wars_age_obj_title_7:0 "#tooltip_header 世界への影響力"
 ve_great_wars_age_obj_desc_7:0 "大国または大国になるか、権力ブロックを率いるか、少なくとも 6 つの宣言された利益を維持してください。"

 ve_age_splendor_tt:0 "#title 時代の勢い#!\n現在のストック: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\n達成された目標: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nアイデア グループ (現在の年齢、最大 +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\n月次変化: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nこの年齢で達成した個別の目標: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nこの年齢で購入した報酬: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n次回の報酬コスト: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y アイデア グループの貢献度#!\n一致するレベル IV グループは #P +1#! 割り当てられた年齢が現在の間のみ、月ごとにのみ。上の行はアクティブな合計を示しており、上限は #Y +2#!です。\n#P 年齢 1#!: 産業、貿易、行政、学術グループ\n#P 年齢 2#!: 資源、社会、外交、国家主義者/改革主義者、植民地グループ\n#P 年齢 3#!: 軍事および戦争経済グループ\n\n現在達成されている各目標により、 #P +1 も付与されます#! 月ごとの時代の勢い。アイデア グループは目標の完了やその 1 回限りの変更を変更しません #P +50#! 報酬。\n\n報酬コストは各年齢内で増加します: #Y 200、300、400、500#!、 それから #Y 以降の報酬ごとに 600#! 。新しい時代が始まると、勢いとコストのはしごがリセットされます。"
 ve_age_obj_efct_tt:0 "満足している間: #P  1 か月あたり +1 Era Momentum#!\nこの年齢での最初の完了: #P  +50 Era Momentum#!"
 splendor_default_bonus:0 "少なくとも #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! 時代の勢いがある"
 ve_age_1_bonus_10_tt:0 "北イタリアまたは南イタリアの一次文化が必要"
 ve_age_2_bonus_10_tt:0 "オーストリアが必要"
 ve_age_3_bonus_10_tt:0 "イギリスが必要"
 ve_age_1_bonus_11_tt:0 "北ドイツまたは南ドイツの一次文化が必要"
 ve_age_2_bonus_11_tt:0 "ロシアが必要"
 ve_age_3_bonus_11_tt:0 "清が必要"
 ve_age_1_bonus_12_tt:0 "オランダが必要"
 ve_age_2_bonus_12_tt:0 "ベルギーが必要"
 ve_age_3_bonus_12_tt:0 "フランスが必要"
 ve_age_1_bonus_13_tt:0 "オスマン帝国が必要"
 ve_age_2_bonus_13_tt:0 "アメリカ合衆国が必要州"
 ve_age_3_bonus_13_tt:0 "日本が必要です。"
