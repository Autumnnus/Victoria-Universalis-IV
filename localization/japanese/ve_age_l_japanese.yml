l_japanese:
 ve_splendor:0 "#tooltippable_name 時代勢力: "
 ve_age_of_victoria_title:0 "産業と国家"
 ve_age_of_victoria_desc:0 "古い秩序は工場、鉄道、識学者たる大衆、そして近代国家と対峙する。勢力は、受け継いだ制度を永続的な国家のキャパシティへと転換する国のものである。"
 ve_imperialism_age_title:0 "帝国と大衆社会"
 ve_imperialism_age_desc:0 "産業は大陸を越えて拡大し、一方で教育、公共制度、そして組織化された陸軍が大衆社会を再形成する。列強は対外的に拡張し、小国は主権と内政発展を通じて繁栄しうる。"
 ve_great_wars_age_title:0 "大衆政治と総力戦"
 ve_great_wars_age_desc:0 "電力、石油、大衆参画、社会福祉、そして工業化された戦争が、国家と社会の関係を変容させる。もはや生存は陸軍と同じく制度にかかっている。"
 ve_age_notify_option:0 "新しい時代が幕を開ける。"
 ve_victorian_age_icon_p_tt:0 "#P 産業と国家 (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N 産業と国家 (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P 帝国と大衆社会 (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N 帝国と大衆社会 (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P 大衆政治と総力戦 (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N 大衆政治と総力戦 (1906–1936)"

 ve_golden_age:0 "黄金時代"
 ve_golden_age_industrial:0 "工業の黄金時代"
 ve_golden_age_cultural:0 "文化の黄金時代"
 ve_golden_age_strategic:0 "戦略の黄金時代"
 ve_golden_age_tt:0 "#v 1845#!年以降、現在の時代で#v 5つの固有の目標#!を達成することで利用可能になります。国家はゲームを通じて1度のみ黄金時代を選択でき、その効果は#v 15年間#!持続します。"
 ve_golden_age_requirement_unused:0 "このキャンペーンにおいて黄金時代はまだ選択されていません。"
 ve_golden_age_requirement_year:0 "#v 1845#!年以降であることが必要です。"
 ve_golden_age_requirement_objectives:0 "現在の時代で少なくとも#v 5つの固有の目標#!を達成してください。"
 ve_golden_age_industrial_tt:0 "#header 工業の黄金時代#!\n#Y 15年間#!: #P 製造業生産量 +10%#!および#P 資源発見確率 +10%#!。\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header 文化の黄金時代#!\n#Y 15年間#!: #P 教育機会 +5%#!および#P 威信 +10%#!。\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header 戦略の黄金時代#!\n#Y 15年間#!: #P 陸軍 攻撃 +5%#!および#P 死傷者による 厭戦 -10%#!。\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "時代の目標"

 ve_victorian_age_obj_title_1:0 "#tooltip_header 工業化の飛躍"
 ve_victorian_age_obj_desc_1:0 "農民の割合を40%未満に削減する。"
 ve_victorian_age_obj_title_2:0 "#tooltip_header 旧秩序の終焉"
 ve_victorian_age_obj_desc_2:0 "奴隷制を禁止し、農奴制を廃止する。"
 ve_victorian_age_obj_title_3:0 "#tooltip_header 機能する国家"
 ve_victorian_age_obj_desc_3:0 "不足が迫ることなく、少なくとも70の正当性と非負の行政力収支を維持する。"
 ve_victorian_age_obj_title_4:0 "#tooltip_header 教育された大衆"
 ve_victorian_age_obj_desc_4:0 "識字率50%またはレベル3の学校に到達する。"
 ve_victorian_age_obj_title_5:0 "#tooltip_header 統合された市場"
 ve_victorian_age_obj_desc_5:0 "人口が500万人未満の場合は少なくとも3つの鉄道レベルを、それ以外の場合は6つの鉄道レベルを所有する。"
 ve_victorian_age_obj_title_6:0 "#tooltip_header 国家覚醒"
 ve_victorian_age_obj_desc_6:0 "少なくとも65の正当性を持ち、社会不安が5%未満の独立国であること。"
 ve_victorian_age_obj_title_7:0 "#tooltip_header グローバルな関心"
 ve_victorian_age_obj_desc_7:0 "主要国または列強であるか、あるいは少なくとも5つの宣言された関心を維持する。"

 ve_imperialism_age_obj_title_1:0 "#tooltip_header 工業力"
 ve_imperialism_age_obj_desc_1:0 "GDPが£1億に達するか、農民の割合を25%未満に削減する。"
 ve_imperialism_age_obj_title_2:0 "#tooltip_header 大衆教育"
 ve_imperialism_age_obj_desc_2:0 "識字率65%に達するか、学校制度レベル4に達する。"
 ve_imperialism_age_obj_title_3:0 "#tooltip_header 帝国または主権"
 ve_imperialism_age_obj_desc_3:0 "従属国を2つ以上持つか、独立を維持し列強に認められている。"
 ve_imperialism_age_obj_title_4:0 "#tooltip_header グローバル商業"
 ve_imperialism_age_obj_desc_4:0 "人口が1000万人未満の場合は港レベルを2つ所有し、それ以外の場合は港レベルを10個所有するか、5つの宣言された関心を維持する。"
 ve_imperialism_age_obj_title_5:0 "#tooltip_header 国づくり"
 ve_imperialism_age_obj_desc_5:0 "正当性60以上かつ国の社会不安5%未満を維持する。"
 ve_imperialism_age_obj_title_6:0 "#tooltip_header 社会問題"
 ve_imperialism_age_obj_desc_6:0 "医療制度、職場安全性、社会保障のいずれかをレベル2に引き上げる。"
 ve_imperialism_age_obj_title_7:0 "#tooltip_header 近代陸軍"
 ve_imperialism_age_obj_desc_7:0 "陸軍において散兵またはトレンチ歩兵を50%以上、かつ機動砲兵を10%以上配備する。"

 ve_great_wars_age_obj_title_1:0 "#tooltip_header 大衆政治"
 ve_great_wars_age_obj_desc_1:0 "普通選挙または評議会共和制を制定するか、議会主義または大統領共和制として正当性75を維持する。"
 ve_great_wars_age_obj_title_2:0 "#tooltip_header 福祉国家"
 ve_great_wars_age_obj_desc_2:0 "医療、社会保障、職場安全性、学校のうち少なくとも2つでレベル3の制度を維持する。"
 ve_great_wars_age_obj_title_3:0 "#tooltip_header 電化された経済"
 ve_great_wars_age_obj_desc_3:0 "人口が1000万人未満の場合は発電所レベルを1つ所有し、それ以外の場合は発電所レベルを5つ所有する。"
 ve_great_wars_age_obj_title_4:0 "#tooltip_header 石油とエンジン"
 ve_great_wars_age_obj_desc_4:0 "石油採掘施設または自動車産業レベルを少なくとも5つ所有する。"
 ve_great_wars_age_obj_title_5:0 "#tooltip_header 近代軍事"
 ve_great_wars_age_obj_desc_5:0 "陸軍においてトレンチまたは分隊歩兵を50%以上、かつ榴散弾砲兵を15%以上配備する。"
 ve_great_wars_age_obj_title_6:0 "#tooltip_header 総力戦キャパシティ"
 ve_great_wars_age_obj_desc_6:0 "陸軍部隊40個と、兵器産業レベル5以上または軍需品工場レベル3以上を維持する。"
 ve_great_wars_age_obj_title_7:0 "#tooltip_header 世界的影響力"
 ve_great_wars_age_obj_desc_7:0 "主要国または列強であること、勢力ブロックを指導していること、または少なくとも6つの宣言された関心を維持すること。"

 ve_age_splendor_tt:0 "#title 時代勢力#!\n現在の備蓄: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\n満足した目標: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\n思想グループ (現在の時代、最大+2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\n毎月の変化: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nこの時代に完了した個別の目標: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nこの時代に購入した報酬: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n次の報酬のコスト: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y 思想グループの貢献方法#!\n対応するレベルIVグループは、割り当てられた時代が現在の間のみ、毎月 #P +1#! を付与します。上の行はアクティブな合計を示しており、#Y +2#! が上限です。\n#P 時代1#!: 産業、貿易、行政、学術グループ\n#P 時代2#!: 資源、社会、外交、国家主義/改革主義、植民地グループ\n#P 時代3#!: 軍事、戦時経済グループ\n\n現在満足している各目標も、毎月 #P +1#! の時代勢力を付与します。思想グループは目標の達成や、その一回限りの #P +50#! の報酬を変更しません。\n\n報酬のコストは各時代内で深刻化します: #Y 200, 300, 400, 500#!、以降のすべての報酬については #Y 600#! となります。新しい時代が始まると、勢力とコストの段階はリセットされます。"
 ve_age_obj_efct_tt:0 "満足している間: 毎月 #P +1 時代勢力#!\nこの時代の最初の完了: #P +50 時代勢力#!"
 splendor_default_bonus:0 "#v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!以上の時代勢力を持つ"
 ve_age_1_bonus_10_tt:0 "北部イタリア人または南部イタリア人の主要文化が必要。"
 ve_age_2_bonus_10_tt:0 "オーストリアが必要。"
 ve_age_3_bonus_10_tt:0 "大英帝国が必要。"
 ve_age_1_bonus_11_tt:0 "北部ドイツ人または南部ドイツ人の主要文化が必要。"
 ve_age_2_bonus_11_tt:0 "ロシアが必要。"
 ve_age_3_bonus_11_tt:0 "清が必要。"
 ve_age_1_bonus_12_tt:0 "オランダが必要。"
 ve_age_2_bonus_12_tt:0 "ベルギーが必要。"
 ve_age_3_bonus_12_tt:0 "フランスが必要。"
 ve_age_1_bonus_13_tt:0 "オスマン帝国が必要です。"
 ve_age_2_bonus_13_tt:0 "アメリカ合衆国が必要です。"
 ve_age_3_bonus_13_tt:0 "日本が必要です。"
