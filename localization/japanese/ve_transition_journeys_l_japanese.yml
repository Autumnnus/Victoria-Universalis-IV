l_japanese:
 ve_je_religious_settlement_transition:0 "宗教的和解の移行"
 ve_je_religious_settlement_transition_reason:0 "教会と国家の法制上の和解が変更された。移行危機の効力が持続する間、制度、コミュニティ、そして官僚は適応を迫られる。このジャーナル記事の期間ではなく、危機補正が基準となる。"
 ve_je_religious_settlement_transition_complete_tt:0 "宗教的和解の移行危機が終了した。"
 ve_je_religious_settlement_transition_status_confessional:0 "目標とする和解: #Y 告白国家#!\n宗教的和解: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nおおよその残り時間: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] ヶ月#!\n完了した節目: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n危機終了時の結果: #Y 60以上#!で和解は早期に安定、#Y 26〜59#!で中立的に解決、#Y 25以下#!で危機へと発展する。残された各節目には、宗教的和解に影響を与える選択肢が用意されている。"
 ve_je_religious_settlement_transition_status_freedom:0 "目標とする和解: #Y 良心の自由#!\n宗教的和解: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nおおよその残り時間: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] ヶ月#!\n完了した節目: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n危機終了時の結果: #Y 60以上#!で和解は早期に安定、#Y 26〜59#!で中立的に解決、#Y 25以下#!で危機へと発展する。残された各節目には、宗教的和解に影響を与える選択肢が用意されている。"
 ve_je_religious_settlement_transition_status_separation:0 "目標とする和解: #Y 完全分離#!\n宗教的和解: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nおおよその残り時間: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] ヶ月#!\n完了した節目: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n危機終了時の結果: #Y 60以上#!で和解は早期に安定、#Y 26〜59#!で中立的に解決、#Y 25以下#!で危機へと発展する。残された各節目には、宗教的和解に影響を与える選択肢が用意されている。"
 ve_je_religious_settlement_transition_status_atheism:0 "目標とする和解: #Y 国家無神論#!\n宗教的和解: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nおおよその残り時間: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] ヶ月#!\n完了した節目: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n危機終了時の結果: #Y 60以上#!で和解は早期に安定、#Y 26〜59#!で中立的に解決、#Y 25以下#!で危機へと発展する。残された各節目には、宗教的和解に影響を与える選択肢が用意されている。"

 ve_je_national_compact_transition:0 "国家協約の移行"
 ve_je_national_compact_transition_reason:0 "国家は国家帰属意識の新たな定義を採用した。移行反発の効力が持続する間、行政官、エリート層、そしてコミュニティは協約を交渉しなければならない。このジャーナル記事の期間ではなく、反発補正が基準となる。"
 ve_je_national_compact_transition_complete_tt:0 "国家協約の移行反発が終了した。"
 ve_je_national_compact_transition_status_ethnic:0 "目標とするアイデンティティ: #Y 民族的アイデンティティ#!\n国家結束: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nおおよその残り時間: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] ヶ月#!\n完了した節目: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\n反発終了時の結果: #Y 60以上#!で結束力は早期に安定、#Y 26〜59#!で中立的に解決、#Y 25以下#!で危機へと発展する。残された各節目には、国家結束に影響を与える選択肢が用意されている。"
 ve_je_national_compact_transition_status_civic:0 "目標とするアイデンティティ: #Y 市民的アイデンティティ#!\n国家結束: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nおおよその残り時間: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] ヶ月#!\n完了した節目: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\n反発終了時の結果: #Y 60以上#!で結束力は早期に安定、#Y 26〜59#!で中立的に解決、#Y 25以下#!で危機へと発展する。残された各節目には、国家結束に影響を与える選択肢が用意されている。"
 ve_je_national_compact_transition_status_composite:0 "目標とするアイデンティティ: #Y 複合的アイデンティティ#!\n国家結束: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nおおよその残り時間: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] ヶ月#!\n完了した節目: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\n反発終了時の結果: #Y 60以上#!で結束力は早期に安定、#Y 26〜59#!で中立的に解決、#Y 25以下#!で危機へと発展する。残された各節目には、国家結束に影響を与える選択肢が用意されている。"
 ve_je_transition_resolving_status:0 "移行の記録が、現在の国家的和解と照らし合わせて調停されている。"

 ve_rel_transition_conciliatory_tt:0 "#N 10#!の信仰改革力を消費し、#P 3#!の宗教的和解を獲得する。"
 ve_rel_transition_central_tt:0 "#P 5#!の信仰改革力を獲得し、#N 3#!の宗教的和解を失う。"
 ve_rel_transition_doctrine_tt:0 "#N 5#!の信仰改革力を消費し、#P 2#!の宗教的和解を獲得する。"

 ve_rel_evt.210.t:0 "聖職者任用の境界"
 ve_rel_evt.210.d:0 "宗教的権威が公職候補者の名簿を提出した一方で、上級行政官らは国家への奉仕においては依然として能力が報われねばならないと主張している。新しい和解の下での最初の任用は、聖職者の助言が終わる場所と、国家権力が始まる場所を定めることとなる。"
 ve_rel_evt.210.a:0 "合同任用委員会を招集する。"
 ve_rel_evt.210.b:0 "聖職者名簿を受け入れる。"
 ve_rel_evt.210.c:0 "標準試験と聖職者の助言を組み合わせる。"

 ve_rel_evt.211.t:0 "学校と忠実性の宣誓"
 ve_rel_evt.211.d:0 "教区学校は公教育システム内での公認された地位を求めている。その支援者らは宗教教育の保護を要求しているが、当局は競合するカリキュラムや宣誓が次世代を分断することを懸念している。"
 ve_rel_evt.211.a:0 "共通の主要カリキュラムを保証する。"
 ve_rel_evt.211.b:0 "一律の忠実性の宣誓を課す。"
 ve_rel_evt.211.c:0 "妥協案を官僚主義的な査察下に置く。"

 ve_rel_evt.220.t:0 "少数派の保証に関する文言"
 ve_rel_evt.220.d:0 "少数派コミュニティは自らの保護を新しい和解に明文化することを望んでいる。政府の法制官らはむしろ単一の一般的条項を支持し、コミュニティ独自の約束は古い分断を固定化しかねないと警告している。"
 ve_rel_evt.220.a:0 "保証を明確に文面化する。"
 ve_rel_evt.220.b:0 "単一の統一された市民権条項を使用する。"
 ve_rel_evt.220.c:0 "改革連合に文言の仲介をさせる。"

 ve_rel_evt.221.t:0 "共通制度における代表"
 ve_rel_evt.221.d:0 "学校、病院、地方委員会は、異なる信仰を持つ市民に平等な条件で奉仕せねばならなくなった。問題は、代表制が地方の実情に従うべきか、あるいは中央から課された公式に従うべきかである。"
 ve_rel_evt.221.a:0 "地方ごとに代表のバランスを取る。"
 ve_rel_evt.221.b:0 "中央の割当枠を設定する。"
 ve_rel_evt.221.c:0 "外交的な代表構成の公式を交渉する。"

 ve_rel_evt.230.t:0 "中立の登録簿"
 ve_rel_evt.230.d:0 "出生、婚姻、および財産の請求権は、宗教的管理者から民間の登録官へと移行しつつある。当局は移行期間中二重の記録を保持することもできるが、改革派は清潔かつ即座の決別を要求している。"
 ve_rel_evt.230.a:0 "移行期間中は二重の記録を維持する。"
 ve_rel_evt.230.b:0 "直ちに宗教的登録簿を閉鎖する。"
 ve_rel_evt.230.c:0 "訓練を受けた官僚ネットワークを配置する。"

 ve_rel_evt.231.t:0 "学校と公的儀式"
 ve_rel_evt.231.d:0 "国家中立性の原則が学校の集会や公的儀式にも達した。地域社会は継承された習慣の余地を求めているが、中央当局は曖昧さを残さない単一の世俗的プロトコルを求めている。"
 ve_rel_evt.231.a:0 "地方の儀式のための余地を残す。"
 ve_rel_evt.231.b:0 "単一の世俗的プロトコルを義務付ける。"
 ve_rel_evt.231.c:0 "共通の市民的儀式基準を作成する。"

 ve_rel_evt.240.t:0 "世俗スタッフの不足"
 ve_rel_evt.240.d:0 "新しい政府には、宗教機関なしで活動できる教師、登録官、視察官が必要である。訓練を受けた候補者が少なすぎ、既存のスタッフに実務の転換を強いることは抵抗を招く恐れがある。"
 ve_rel_evt.240.a:0 "新しいスタッフ養成プログラムに資金を拠出する。"
 ve_rel_evt.240.b:0 "既存のスタッフに適応を強要する。"
 ve_rel_evt.240.c:0 "学術的な訓練ネットワークを構築する。"

 ve_rel_evt.241.t:0 "財産と地下礼拝"
 ve_rel_evt.241.d:0 "宗教的財産の移転により、一部の信徒グループは表舞台から姿を消すことを余儀なくされた。即座の没収は新国家を速やかに利することになるが、急進的な和解は民間の礼拝を組織的な反抗へと変えてしまう危険を孕んでいる。"
 ve_rel_evt.241.a:0 "財産を段階的に移転する。"
 ve_rel_evt.241.b:0 "直ちに国有化する。"
 ve_rel_evt.241.c:0 "資産を監督下の社会福祉制度へと向かわせる。"

 ve_rel_evt.290.t:0 "和解の定着"
 ve_rel_evt.290.d:0 "移行期の危機は、国の宗教的和解を揺るがすことなく過ぎ去った。行政官らは新ルールのもとで動き、各コミュニティは自らの立場を理解し、政府はこの経験を信仰改革力あるいはより深まった国民の自信へと転換することができる。"
 ve_rel_evt.290.a:0 "その教訓を次なる改革へと持ち込む。"
 ve_rel_evt.290.a.tt:0 "#P 10#!の信仰改革力を獲得する。"
 ve_rel_evt.290.b:0 "公の場で和解を再確認する。"
 ve_rel_evt.290.b.tt:0 "#P 3#!の宗教的和解を獲得する。"

 ve_rel_evt.291.t:0 "もろい均衡値"
 ve_rel_evt.291.d:0 "公式な移行期間は完了したものの、新たな和解は確信に基づくものではなく、慎重な妥協の産物にとどまっている。これを自然に成熟させるか、さらなる限定的な譲歩によって強化するか、あるいは採用されたモデルに適した制度を通じて安定させることができる。"
 ve_rel_evt.291.a:0 "この妥協をそのまま維持する。"
 ve_rel_evt.291.a.tt:0 "追加的なゲーム効果なしで移行期間が終了する。"
 ve_rel_evt.291.b:0 "最後の一歩となる譲歩に資金を投じる。"
 ve_rel_evt.291.b.tt:0 "#N 10#!の信仰改革力を消費し、#P 3#!の宗教的和解を獲得する。"
 ve_rel_evt.291.c:0 "和解をモデル適合的な制度に委ねる。"
 ve_rel_evt.291.c.tt:0 "#N 5#!の信仰改革力を消費し、#P 2#!の宗教的和解を獲得する。採用された宗教モデルに適した思想が必要。"

 ve_rel_evt.292.t:0 "和解の危機"
 ve_rel_evt.292.d:0 "移行補正が期限を迎えたにもかかわらず、国は新たな宗教秩序を受け入れていない。政府は乏しい改革力を緊急の譲歩に費やすか、モデル適合的な制度による限定的な介入に頼るか、あるいは未解決の対立が人口の一部を急進化させるのを放置するかを選ぶことができる。"
 ve_rel_evt.292.a:0 "緊急の譲歩の代償を支払う。"
 ve_rel_evt.292.a.tt:0 "#N 15#!の信仰改革力を消費し、#P 5#!の宗教的和解を獲得する。"
 ve_rel_evt.292.b:0 "国家にはもはや提示できる譲歩がない。"
 ve_rel_evt.292.b.tt:0 "国の人口の#N 0.25%#!が急進派になる。"
 ve_rel_evt.292.c:0 "この和解のために構築された制度を利用する。"
 ve_rel_evt.292.c.tt:0 "#N 5#!の信仰改革力を消費し、#P 2#!の宗教的和解を獲得する。採用された宗教モデルに適した思想が必要。"

 ve_identity_transition_conciliatory_tt:0 "#N 10#!の文化政策力を消費し、#P 3#!的国家結束を獲得する。"
 ve_identity_transition_central_tt:0 "#P 5#!の文化政策力を獲得し、#N 3#!的国家結束を失う。"
 ve_identity_transition_doctrine_tt:0 "#N 5#!の文化政策力を消費し、#P 2#!的国家結束を獲得する。"

 ve_cul_evt.210.t:0 "国家の公用語"
 ve_cul_evt.210.d:0 "新しい国家コンパクトは、裁判所、学校、および公共サービスのための共通言語を求めている。即座の単一化は行政管理を容易にするが、多くの経験豊富な官僚や市民はまだ提示された基準を満たすことができない。"
 ve_cul_evt.210.a:0 "段階的な指導を通じて言語を導入する。"
 ve_cul_evt.210.b:0 "単一言語の指令を発令する。"
 ve_cul_evt.210.c:0 "国家主義的行政機構を動員する。"

 ve_cul_evt.211.t:0 "兵役と帰属意識"
 ve_cul_evt.211.d:0 "兵役と退役軍人の地位は、国家への帰属の証となりつつある。新しいコンパクトのもとに置かれたコミュニティは適応のための時間を要求する一方、中央政府は帰属意識にはひとつの統一された義務が伴わねばならないと主張している。"
 ve_cul_evt.211.a:0 "移行期の特例を認める。"
 ve_cul_evt.211.b:0 "単一の兵役義務を適用する。"
 ve_cul_evt.211.c:0 "普遍的な兵役名簿を作成する。"

 ve_cul_evt.220.t:0 "平等な市民権の登録名簿"
 ve_cul_evt.220.d:0 "古い民族的および宗教的区分が依然として公文書に根深く残っている。それらを直ちに撤廃することは平等な市民権を謳うことになるが、地方官庁は急な改宗が請求権を消滅させ、サービスへのアクセスを混乱させかねないと警告している。"
 ve_cul_evt.220.a:0 "共通の市民名簿を段階的に導入する。"
 ve_cul_evt.220.b:0 "古い区分を直ちに撤廃する。"
 ve_cul_evt.220.c:0 "改宗の管理を改革委員会に委ねる。"

 ve_cul_evt.221.t:0 "共通の学校、共通の公務"
 ve_cul_evt.221.d:0 "法の下での平等は存在するが、学校や官公庁にはそれを実現するために必要な職員が不足している。政府は、忍耐強い投資、強制力を持つ単一の中央標準、そして学術資格の全国的ネットワークのいずれかを選択せねばならない。"
 ve_cul_evt.221.a:0 "教師と公務員に投資する。"
 ve_cul_evt.221.b:0 "単一の中央標準を強制する。"
 ve_cul_evt.221.c:0 "学術資格のネットワークを構築する。"

 ve_cul_evt.230.t:0 "構成民会議"
 ve_cul_evt.230.d:0 "複合協約に挙げられた諸共同体は、その行政における発言権を要求している。公開交渉は正当性を生み出すかもしれない一方、首都で立案された固定割当は、より迅速かつ予測可能な決着を約束する。"
 ve_cul_evt.230.a:0 "代表者による交渉を開始する。"
 ve_cul_evt.230.b:0 "首都の固定割当を課す。"
 ve_cul_evt.230.c:0 "議会主義的な妥協を仲介する。"

 ve_cul_evt.231.t:0 "階層化された行政"
 ve_cul_evt.231.d:0 "地方権限と中央標準が今や複合国家の全域で重複している。明確な規程がなければ、あらゆる官庁がその境界を新たに交渉することになり、あまりにも硬直した指揮系統では、協約はその意味を失いかねない。"
 ve_cul_evt.231.a:0 "権限の規程を交渉する。"
 ve_cul_evt.231.b:0 "中央指揮系統を確立する。"
 ve_cul_evt.231.c:0 "共有の官僚主義的台帳を作成する。"

 ve_cul_evt.290.t:0 "新たな国家協約"
 ve_cul_evt.290.d:0 "反発は収まり、国民的構成員の新たな定義が定着した。政府は行政的教訓を文化政策力として保持するか、この機を利用して協約への自信を強化することができる。"
 ve_cul_evt.290.a:0 "経験値を将来の国家運営に活かす。"
 ve_cul_evt.290.a.tt:0 "#P 10#!の文化政策力を獲得する。"
 ve_cul_evt.290.b:0 "国中で協約を祝う。"
 ve_cul_evt.290.b.tt:0 "#P 3#!の国家結束を獲得する。"

 ve_cul_evt.291.t:0 "脆弱な協約"
 ve_cul_evt.291.d:0 "形式的な移行は終わったが、新たな国民的アイデンティティは未だ均等には受容されていない。政府は妥協の成熟を待つか、限られた政策力を別の和解に費やすか、あるいは採用されたモデルに適した制度を通じてそれを強化することができる。"
 ve_cul_evt.291.a:0 "妥協に自らの収支を見出させる。"
 ve_cul_evt.291.a.tt:0 "移行は追加の機構的効果なしに終了する。"
 ve_cul_evt.291.b:0 "最後の和解に資金を投じる。"
 ve_cul_evt.291.b.tt:0 "#N 10#!の文化政策力を消費し、#P 3#!の国家結束を獲得する。"
 ve_cul_evt.291.c:0 "モデル適合的な制度に協約を委ねる。"
 ve_cul_evt.291.c.tt:0 "#N 5#!の文化政策力を消費し、#P 2#!の国家結束を獲得する。採用されたアイデンティティモデルに適した思想を必要とする。"

 ve_cul_evt.292.t:0 "国家協約の危機"
 ve_cul_evt.292.d:0 "移行の反発は満了したものの、帰属に関する新たな定義は幅広い忠実性を得るに至らなかった。政府は乏しい政策力を緊急の和解に費やすか、より限定的な介入のためにモデル適合的な制度に頼るか、あるいは急進化の波を受け入れるかのいずれかを選択できる。"
 ve_cul_evt.292.a:0 "緊急の和解に費用を払う。"
 ve_cul_evt.292.a.tt:0 "#N 15#!の文化政策力を消費し、#P 5#!の国家結束を獲得する。"
 ve_cul_evt.292.b:0 "政府は書かれた通りに協約を強制する。"
 ve_cul_evt.292.b.tt:0 "国内の人口の#N 0.25%#!が急進派になる。"
 ve_cul_evt.292.c:0 "このアイデンティティのために構築された制度を利用する。"
 ve_cul_evt.292.c.tt:0 "#N 5#!の文化政策力を消費し、#P 2#!の国家結束を獲得する。採用されたアイデンティティモデルに適した思想を必要とする。"
