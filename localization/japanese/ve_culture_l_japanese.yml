l_japanese:
 ve_national_identity:0 "国家アイデンティティ"
 ve_primary_cultures_label:0 "主要文化"
 ve_identity_models:0 "アイデンティティモデル"
 ve_identity_model_active_footer:0 "発動中"
 ve_switch_identity_button:0 "変更"
 ve_switch_identity_cost_label:0 "コスト: #Y 200 文化政策力#!"
 ve_begin_project_button:0 "事業を開始"
 ve_identity_models_help:0 "あなたの国は常に1つのアイデンティティモデルを所有しており、それは#P すでに有効です#! — ここで何かを選択する必要はありません。このモデルは、#Y 国家結束#!がどのように獲得されるか、そしてどの文化事業を実行できるかを決定するのみです。\n#Y 変更は任意です:#! #Y 200 文化政策力#!を消費し、結束を#Y 35#!にリセットし、実行中の文化事業をすべてキャンセルし、5年間は再変更を禁止します。\n#Y カードやメーターにカーソルを合わせると、すべての効果が表示されます。#!"
 ve_ethnic_identity_name:0 "民族国家"
 ve_civic_identity_name:0 "市民国家"
 ve_composite_identity_name:0 "複合国家"
 ve_ethnic_identity_short:0 "国家はその主要文化を中心に定義される。\n結束は#Y 人口の優勢#!によってもたらされる。"
 ve_civic_identity_short:0 "教育を通じて構築される政治的国家。\n結束は#Y 識字率と受容された少数派#!によってもたらされる。"
 ve_composite_identity_short:0 "交渉された制度の下にある複数の民族。\n結束は#Y 真に多元的な人口#!によってもたらされる。"
 ve_ethnic_identity_unlocks:0 "#Y 民族統合運動#!事業をアンロックします"
 ve_civic_identity_unlocks:0 "#Y 平等市民権構想#!事業をアンロックします"
 ve_composite_identity_unlocks:0 "#Y 構成協約#!事業をアンロックします"
 ve_ethnic_identity_desc:0 "#header 民族国家#!\n国家はその主要文化を中心に定義される。\n\n#Y 有効中#!\n#P +15% 同化、+5% 権力#!\n#N -5% 移住求心力、+5% 露骨な偏見による急進派#!\n\n#Y 結束#!\n主要文化が人口の60〜75%以上を占めると上昇し、40%を下回ると急激に低下する。\n\n#Y 結束75以上#!\n#P +5% 徴兵率、+3 正当性#!\n\n#Y 文化事業#!\n民族統合運動"
 ve_civic_identity_desc:0 "#header 市民国家#!\n教育と政治参加を通じて、共有された政治的国家が築かれる。\n\n#Y 有効中#!\n#P 移住求心力 +7%、教育機会 +1%#!\n#N 同化 -10%、権力 -5%、行政力 -50#!\n\n#Y 結束力#!\n識字率はこれを上昇させるが、受容度が非常に低い、人口の10%を超える非主要文化はこれを低下させる。\n\n#Y 結束力 75 以上#!\n#P 資格取得 +5%、正当性 +3#!\n\n#Y 文化事業#!\n平等の市民権イニシアチブ"
 ve_composite_identity_desc:0 "#header 複合国家#!\n複数の民族が交渉された制度を通じて統治される。\n\n#Y 有効中#!\n#P -10% 文化的抹殺および二級市民権による急進派、+5% 影響力#!\n#N -15% 同化、-5% 権力、-75 行政力#!\n\n#Y 結束#!\n真に多元的な人口がこれを上昇させ、人口の90%以上が主要文化である場合はこのモデルを弱める。\n\n#Y 結束75以上#!\n#P +5% 影響力、+3 正当性#!\n\n#Y 文化事業#!\n構成協約"
 ve_identity_change_cost_tt:0 "アイデンティティモデルの変更には#Y 200 文化政策力#!が必要であり、アクティブなアイデンティティ移行の反発があってはならない。この変更により、結束が#Y 35#!にリセットされ、#Y 5年間の移行の反発#!が発生し、追加のキャンセルペナルティなしで現在実行中のすべての文化事業がキャンセルされる。"
 ve_cultural_mandate:0 "文化政策力"
 ve_culture_reform_point:0 "文化政策力"
 ve_cultural_mandate_hint:0 "文化事業に消費される。温存することは安全だが、収入は400で半分になり、500で停止する。"
 ve_culture_reform_point_tt:0 "#header 文化政策力#!\n現在値: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n月間変動: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y 消費先#!\n文化事業 (75〜150) およびアイデンティティモデルの変更 (200)。いずれも必須ではない。政策力の温存は安全であり、収入は400で半分になり、500で停止するのみである。\n\n#Y 月間内訳#!\n基本値: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\n正当性: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\n行政: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nモデル社会: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\n安定度と文化運動: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\n法律の適合: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\n思想の国策: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\n上限乗数: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y 思想の国策 — 現在のアイデンティティモデルのみがカウントされる#!\n#P 民族国家#!: 国家主義 V #P +1#!\n#P 市民国家#!: 改革主義 V #P +1#!; 学術 V #P +1#!\n#P 複合国家#!: 改革主義 V #P +1#!\n上記の有効な合計は最大 #Y +2#! までとなる。\n\n市民国家は識字率からモデル社会の要素を引き出し、複合国家は多元社会における識字率から引き出し、民族国家は主要文化の人口的強さから引き出す。\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "国家結束"
 ve_national_cohesion_hint:0 "アイデンティティモデルがもたらす均衡値に向かって変動する。75以上でボーナスを得られ、25以下で不安定化する。"
 ve_national_cohesion_tt:0 "#header 国家結束#!\n現在値: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n均衡値: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n月間変動: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n通常条件: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nアイデンティティモデル条件: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\n国家結束は毎月、均衡値との間の距離の20%（最大5ポイント）ずつ変動します。急進的な文化運動は均衡値を10減少させます。75以上では現在のモデルによる追加の利益が付与され、25以下では国家の不安定化が適用されます。\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "効果なし"
 ve_cultural_projects:0 "文化事業"
 ve_cultural_projects_intro:0 "文化事業は #Y 任意#!です。同時に実行できるのは1つのみです。その文化政策力のコストが即座に支払われ、実行中は #N 行政力 -75 および 権力 -25#! が適用されます。事業を完了すると一部の文化政策力が返還され、国家結束が上昇します。全国的な事業は完了時の利益の有効期限が切れた後でのみ繰り返すことができます。完了した州および文化の標的は再度選択できません。\n#Y カードまたはメーターにカーソルを合わせると、すべての効果が表示されます。#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "事業進行中"
 ve_cultural_project_progress:0 "事業の進捗"
 ve_cultural_project_progress_tt:0 "#header 月間事業進捗#!\n現在値: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n残り: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\n月間合計: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] （最小1、最大7）\n\n#Y 月間内訳#!\n基礎: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\n行政: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\n正統性: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nモデル社会: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\n国家結束: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\n文化運動: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\n標的州の社会不安: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\n思想群: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y 思想群 — 現在のアイデンティティモデルに一致するボーナスのみが有効です#!\n#P 民族国家#!: 国家主義 VII #P +1#!\n#P 市民国家#!: 改革主義 VII、学術 VII、または社会福祉 VI — 各 #P +1#!\n#P 複合国家#!: 改革主義 VII または 外交 VI — 各 #P +1#!\n上記の有効な思想群の合計は最大 #Y +2#! に制限され、一致するボーナスがさらにあっても進捗は増加しません。\n\nモデル社会は、現在のアイデンティティモデルに応じて、市民の識字率、民族的人口の集中度、または複合的な多様性に報酬を与えます。完了は、進捗が #Y 100#! に達した後の次の月次更新時に処理されます。"
 ve_cancel_cultural_project_button:0 "事業を中止"
 ve_cancel_cultural_project_tt:0 "#header 文化事業を中止#!\n投資された文化政策力は #N 返還されません#!。国家結束が #N 5#! 低下し、#N 2年間の反発#!により別の事業の開始が阻止されます。"
 ve_start_cultural_project_button:0 "事業を開始"
 ve_national_curriculum_name:0 "国家カリキュラム"
 ve_national_curriculum_cost:0 "コスト: #Y 文化政策力 100#!"
 ve_national_curriculum_short:0 "国全体の学校教育改革。\n#P 文化政策力 +20、国家結束 +5#!、その後教育が向上します。"
 ve_national_curriculum_desc:0 "#header 国家カリキュラム#!\n国全体で実施される学校教育の改革。\n\n#Y コスト#!\n#Y 文化政策力 100#! （即座に支払い）\n\n#Y 完了時#!\n#P 文化政策力 +20、国家結束 +5#!\n\n#Y その後10年間#!\n#P 教育機会 +2%、資格取得 +5%#!\n#N 行政力 -25#!"
 ve_national_curriculum_requirements_tt:0 "#Y 文化政策力 100#!、進行中の文化事業がないこと、および事業の反発がないことが必要です。また、前の #Y 国家カリキュラム#! の利益が有効な間は開始できません。"
 ve_shared_symbols_name:0 "共通の象徴"
 ve_shared_symbols_cost:0 "コスト: #Y 文化政策力 75#!"
 ve_shared_symbols_short:0 "国旗、国歌、そして公式式典。\n#P 文化政策力 +20、国家結束 +7#!、その後体制派と権力が得られます。"
 ve_shared_symbols_desc:0 "#header 共通の象徴#!\n国全体で奨励される国旗、国歌、そして公式式典。\n\n#Y コスト#!\n#Y 文化政策力 75#! （即座に支払い）\n\n#Y 完了時#!\n#P 文化政策力 +20、国家結束 +7#!\n\n#Y その後8年間#!\n#P 完全受容されたPOPからの体制派 +10%、権力 +25#!"
 ve_shared_symbols_requirements_tt:0 "#Y 文化政策力 75#!、進行中の文化事業がないこと、および事業の反発がないことが必要です。また、前の #Y 共通の象徴#! の利益が有効な間は開始できません。"
 ve_ethnic_campaign_name:0 "民族統合運動"
 ve_ethnic_campaign_cost:0 "コスト: #Y 文化政策力 125#!"
 ve_ethnic_campaign_short:0 "1つの州における大規模な少数派を同化する。\n#P 文化政策力 +25、国家結束 +8#!、ただし急進派が発生します。"
 ve_ethnic_campaign_desc:0 "#header 民族統合運動#!\n単一の州で実行され、その州の人口の少なくとも #Y 5%#!を占める必要のある、最大の非主要文化を対象とします。\n\n#Y 費用#!\n#Y 125 文化政策力#!、即時支払い\n\n#Y 完了時#!\n対象文化の人口の #Y 5%#!（国家主義 VII の場合は #Y 7%#!）を主要文化に同化させます\n#P +25 文化政策力、+8 国家結束#!\n州内に #Y 10年間#!の同化プログラムを残します\n\n#Y 警告#!\n#N プロジェクトの開始と完了の双方が、対象文化の間で急進派を生み出します。#!"
 ve_civic_initiative_name:0 "平等市民権構想"
 ve_civic_initiative_cost:0 "費用: #Y 100 文化政策力#!"
 ve_civic_initiative_short:0 "1つの州における少数派の受容を上昇させます。\n#P +25 政策力、+10 結束#!に加え、体制派を生み出します。"
 ve_civic_initiative_desc:0 "#header 平等市民権構想#!\n単一の州で実行され、その州の人口の少なくとも #Y 5%#!を占める必要のある、最大の非主要文化を対象とします。\n\n#Y 費用#!\n#Y 100 文化政策力#!、即時支払い\n\n#Y 完了時#!\n#P 10年間にわたり、その文化の受容 +15#!\n対象州における体制派\n#P +25 文化政策力、+10 国家結束#!\n10年間の資格取得および移住求心力の向上"
 ve_composite_compact_name:0 "構成協約"
 ve_composite_compact_cost:0 "費用: #Y 150 文化政策力#!および #Y 40 結束#!"
 ve_composite_compact_short:0 "少数派を構成文化として承認します。\n#P +30 政策力、+12 結束#!（恒久）。"
 ve_composite_compact_desc:0 "#header 構成協約#!\n単一の州で実行され、その州の人口の少なくとも #Y 5%#!を占める、未承認の非主要文化を対象とします。\n\n#Y 費用#!\n#Y 150 文化政策力#!（即時支払い）および少なくとも #Y 40 国家結束#!\n\n#Y 完了時#!\n#P その文化の受容 +15（恒久）#!\n構成文化として承認します\n対象州における体制派\n#P +30 文化政策力、+12 国家結束#!"
 ve_targeted_project_start_instruction:0 "#Y 開始方法#!\n1. 自国のいずれかの州を開きます。\n2. その州パネルにある #Y プロジェクト開始#!を押します。\n対象文化および不足している条件は、そのボタンのツールチップに記載されています。"
 ve_targeted_project_state_requirements_tt:0 "州は自国が所有しており、人口の少なくとも #Y 5%#!を占める条件を満たした非主要文化を含んでいる必要があります。最も人口の多い条件を満たした文化が標的となります。この州ですでに完了した文化を再度標的にすることはできませんが、別の州であれば標的にすることができます。現在のアイデンティティモデルのコストと条件も満たされている必要があります。"
 ve_targeted_cultural_project_target:0 "対象: #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! (#Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!)"
 ve_countrywide_cultural_project_target:0 "スコープ: #Y 国土全体#!"
 ve_no_cultural_project_target:0 "プロジェクトの標的なし"
 ve_no_active_cultural_project:0 "有効な文化事業なし"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "結束 - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "断片化 - #N 国家の不安定化が適用されます#!。"
 ve_ethnic_high_cohesion_effect:0 "#P 徴兵率 +5% および 正当性 +3#!。"
 ve_civic_high_cohesion_effect:0 "#P 資格取得 +5% および 正当性 +3#!。"
 ve_composite_high_cohesion_effect:0 "#P 影響力 +5% および 正当性 +3#!。"
 ve_identity_transition_backlash_notice:0 "アイデンティティ移行の反発がまだ有効です。期限が切れるまでモデルを再変更することはできません。"
 ve_cultural_project_backlash_notice:0 "キャンセルされたプロジェクトが新たなプロジェクトを阻害しています。2年間の反発が期限切れになる必要があります。"

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "移行の反発が有効です"
 ve_cultural_project_backlash_notice_short:0 "キャンセルの反発が有効です"
 ve_targeted_project_start_instruction_short:0 "自国の州の1つから開始します：州を開き、#Y プロジェクト開始#!を押してください。"
