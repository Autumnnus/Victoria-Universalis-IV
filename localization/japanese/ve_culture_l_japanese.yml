l_japanese:
 ve_national_identity:0 "国民のアイデンティティ"
 ve_primary_cultures_label:0 "一次文化"
 ve_identity_models:0 "アイデンティティモデル"
 ve_identity_model_active_footer:0 "すでにアクティブです"
 ve_switch_identity_button:0 "スイッチ"
 ve_switch_identity_cost_label:0 "コスト #Y 200 の文化的使命#!"
 ve_begin_project_button:0 "プロジェクトの開始"
 ve_identity_models_help:0 "あなたの国には常に 1 つのアイデンティティ モデルがあり、それは #P すでにアクティブです#! — ここでは何も選択する必要はありません。モデルは方法を決定するだけです #Y 国民の団結#! 獲得した金額と、どの文化プロジェクトを実行できるか。\n#Y 切り替えはオプションです。#! 費用がかかります #Y 200 文化的使命#!、凝集力を次のようにリセットします。 #Y 35#!、実行中の文化プロジェクトをキャンセルし、5 年間別の切り替えをブロックします。\n#Y カードまたはメーターにカーソルを合わせると、その効果を最大限に発揮できます。#!"
 ve_ethnic_identity_name:0 "民族国家"
 ve_civic_identity_name:0 "シビック・ネイション"
 ve_composite_identity_name:0 "複合国家"
 ve_ethnic_identity_short:0 "国家はその一次文化を中心に定義されます。\n結束力は次のようなものから生まれます。 #Y 人口統計上の優位性#!。"
 ve_civic_identity_short:0 "学校教育を通じて築かれた政治国家。\n団結力は次から生まれます。 #Y 識字能力と受け入れられた少数派#!。"
 ve_composite_identity_short:0 "いくつかの民族が交渉による制度の下にあります。\n結束力は次のようなものから生まれます。 #Y 真に複数の集団#!。"
 ve_ethnic_identity_unlocks:0 "ロックを解除します #Y 民族統合キャンペーン#! プロジェクト"
 ve_civic_identity_unlocks:0 "ロックを解除します #Y 平等な市民権イニシアチブ#! プロジェクト"
 ve_composite_identity_unlocks:0 "ロックを解除します #Y 憲法制定コンパクト#! プロジェクト"
 ve_ethnic_identity_desc:0 "#header 民族国家#!\n国家はその一次文化を中心に定義されます。\n\n#Y 活動中#!\n#P +15% 同化、+5% 権威#!\n#N -5% 移住誘致、+5% 公然の偏見からの急進派#!\n\n#Y 凝集度#!\n一次文化が人口の少なくとも 60 ～ 75% を占めると上昇し、40% を大きく下回ると急激に低下します。\n\n#Y 凝集度 75 では#!\n#P +5% 徴兵率、+3 正当性#!\n\n#Y 文化プロジェクト#!\n民族統合キャンペーン"
 ve_civic_identity_desc:0 "#header 市民国家#!\n共通の政治国家は教育と参加を通じて築かれます。\n\n#Y 活動中#!\n#P +7% 移民誘致、+1% 教育アクセス#!\n#N -10%同化、-5% 権威、-50 官僚主義#!\n\n#Y 団結度#!\n識字率は上昇しますが、人口の 10% を超える非主要文化で受け入れ度が非常に低い場合は低下します。\n\n#Y 75 団結度#!\n#P +5% 資格、+3 正当性#!\n\n#Y 文化プロジェクト#!\n平等市民権イニシアチブ"
 ve_composite_identity_desc:0 "#header 複合国家#!\nいくつかの民族が、交渉による制度を通じて統治されています。\n\n#Y 活動中#!\n#P -10% 文化的消去と二流市民権による急進主義者、+5% 影響力#!\n#N -15% 同化、-5% 権威、-75 官僚主義#!\n\n#Y 団結#!\n真に複数の人口が存在すると、この値が上昇します。一次文化が 90% を超える集団は、このモデルを弱めます。\n\n#Y 凝集度 75 では#!\n#P +5% 影響力、+3 正当性#!\n\n#Y 文化プロジェクト#!\n憲法制定協定"
 ve_identity_change_cost_tt:0 "アイデンティティ モデルを変更するには、以下が必要です #Y 200 文化的使命#! アクティブなアイデンティティ遷移バックラッシュはありません。この変更により、Cohesion が次のようにリセットされます。 #Y 35#!、原因は #Y 5年間にわたる移行の反動#! 追加のキャンセルペナルティなしで、アクティブな文化プロジェクトをキャンセルします。"
 ve_cultural_mandate:0 "文化的使命"
 ve_culture_reform_point:0 "文化的使命"
 ve_cultural_mandate_hint:0 "文化プロジェクトに費やされます。保存しても安全ですが、収入は 400 で半分になり、500 で止まります。"
 ve_culture_reform_point_tt:0 "#header 文化的義務#!\n現在: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n毎月の変化: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y 何に費やされるか#!\n文化プロジェクト (75–150) とアイデンティティ モデルの変更 (200)。どちらも必要ありません: 委任の保存は安全で、収入は 400 で半分に減り、500 で止まります。\n\n#Y 月次内訳#!\n基盤: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\n正当性: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\n管理: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nモデル社会: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\n安定と文化運動: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\n法の整合: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\n理念原則: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\n上限乗数: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y アイデア主義 - 現在のアイデンティティ モデルのみがカウントされます#!\n#P 民族国家#!：国家主義者 V #P +1#!\n#P 市民国家#!：改革主義者 V #P +1#!;アカデミック V #P +1#!\n#P 複合国家#!: 改革派 V #P +1#!\n上記の有効な合計の上限は #Y +2#!です。\n\n市民国家は読み書き能力からモデル社会コンポーネントを導き出し、複数社会の読み書き能力から複合国家を導き出し、一次文化の人口統計の強さから民族国家を引き出します。\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "国民の凝集"
 ve_national_cohesion_hint:0 "アイデンティティ モデルが生み出す均衡に向かって漂流します。 75 以上ではボーナスが得られ、25 以下では不安定になります。"
 ve_national_cohesion_tt:0 "#header 国家の凝集度#!\n現在: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n均衡: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n月次の動き: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n共通条件: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nアイデンティティ モデルの条件: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\n凝集度は毎月、均衡に向けて距離の 20% (最大 5 ポイント) 移動します。急進的な文化運動は均衡を 10 減少させます。75 歳以上では、現在のモデルでは追加の利益が得られます。 25 以下では国家不安定が適用されます。\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "効果なし"
 ve_cultural_projects:0 "文化プロジェクト"
 ve_cultural_projects_intro:0 "文化プロジェクトは #Y オプション#!。一度に実行できるのは 1 つだけです。その委任コストはすぐに支払われ、 #N -75 官僚主義と -25 権威#! 実行される限り適用されます。プロジェクトを完了すると、マンデートの一部が返金され、結束力が向上します。全国規模のプロジェクトは、完了特典の期限が切れた後にのみ繰り返すことができます。完了した州/文化ターゲットを再度選択することはできません。\n#Y カードまたはメーターをポイントすると、その効果を最大限に発揮できます。#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "進行中のプロジェクト"
 ve_cultural_project_progress:0 "プロジェクトの進捗状況"
 ve_cultural_project_progress_tt:0 "#header 月次プロジェクトの進捗#!\n現在: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n残り: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\n月の合計: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (最小 1、最大 7)\n\n#Y 月ごとの内訳#!\n基準: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\n行政:  [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\n正統性:  [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nモデル社会:  [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\n団結力:  [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\n文化運動:  [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\n目標国家の混乱:  [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nアイデア グループ: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y アイデア グループ — 現在のアイデンティティ モデルに一致するボーナスのみが有効です#!\n#P 民族国家#!: 国家主義者 VII #P +1#!\n#P Civic Nation#!: 改革派 VII、学術 VII、または福祉 VI — #P +1#! 各\n#P 複合国家#!:改革派 VII または外交派 VI — #P +1#! それぞれ\n上記のアクティブなアイデア グループの合計は #Y +2 に制限されています#!;それ以上のマッチング ボーナスによって進歩は増加しません。\n\nモデル ソサエティは、アクティブなアイデンティティ モデルに従って、市民の読み書き能力、民族の人口集中、または複合的な多様性に報酬を与えます。完了は、進捗状況が次の月次更新に達した後、解決されます。 #Y 100#!。"
 ve_cancel_cultural_project_button:0 "プロジェクトをキャンセル"
 ve_cancel_cultural_project_tt:0 "#header 文化プロジェクトをキャンセル#!\n投資された文化的使命は次のとおりです #N 返金されない#!。国民の団結力が低下する #N 5#! そして #N 2年間の反発#! 別のプロジェクトを妨げます。"
 ve_start_cultural_project_button:0 "プロジェクトの開始"
 ve_national_curriculum_name:0 "全国カリキュラム"
 ve_national_curriculum_cost:0 "コスト: #Y 100 文化的義務#!"
 ve_national_curriculum_short:0 "全国規模の学校教育改革。\n#P +20 義務、+5 結束#!、そしてより良い教育。"
 ve_national_curriculum_desc:0 "#header 国家カリキュラム#!\n学校教育改革は全国で実施されます。\n\n#Y コスト#!\n#Y 100 文化任務#!、即時支払い\n\n#Y 完了時#!\n#P +20 文化任務#!、+5 国家結束#Y \n\n#!その後 10 年間#P \n#!+2% 教育アクセス、+5% 資格#N \n#!"
 ve_national_curriculum_requirements_tt:0 "-25 官僚制 #Y 100 文化任務#!が必要、アクティブな文化プロジェクトなしプロジェクトのバックラッシュもありません。また、前の状態では開始できません。 #Y ナショナルカリキュラム#! 特典が有効です。"
 ve_shared_symbols_name:0 "共有シンボル"
 ve_shared_symbols_cost:0 "コスト: #Y 75 文化的義務#!"
 ve_shared_symbols_short:0 "国旗、国歌、公開式典。\n#P +20 義務、+7 結束力#!、次に支持者と権威。"
 ve_shared_symbols_desc:0 "#header 共有シンボル#!\n国旗、国歌、公開式典が全国で推進されます。\n\n#Y コスト#!\n#Y 75 文化的義務#!、即時支払い\n\n#Y 完了時#!\n#P +20の文化的義務、+7国家結束#!\n\n#Y その後8年間#!\n#P 完全に受け入れられたポップスから+10%のロイヤリスト、+25権限#!"
 ve_shared_symbols_requirements_tt:0 "必要 #Y 75 文化的使命#!、活発な文化プロジェクトもプロジェクトのバックラッシュもありません。また、前の状態では開始できません。 #Y 共有シンボル#! 特典が有効です。"
 ve_ethnic_campaign_name:0 "民族統合キャンペーン"
 ve_ethnic_campaign_cost:0 "料金： #Y 125 文化的使命#!"
 ve_ethnic_campaign_short:0 "1 つの州の大多数の少数派を同化させます。\n#P +25 文化的使命、+8 結束力#!"
 ve_ethnic_campaign_desc:0 "#header 民族統合キャンペーン#!\n単一の州で、その最大の非主要文化に対して実行します。これは少なくとも保持する必要があります。 #Y 5%#! \n\n#Y 費用#!\n#Y 125 文化義務#!、即時支払い\n\n#Y 完了時に#!\n同化 #Y 5%#! ターゲット文化を一次文化に変える、または #Y 7%#! ナショナリスト VII と\n#P +25 文化的使命、+8 国家結束#!\n残す #Y 10年#! 州の同化プログラム\n\n#Y 警告#!\n#N プロジェクトの開始と終了の両方で、ターゲットの文化の中に過激派が生まれます。#!"
 ve_civic_initiative_name:0 "市民権平等イニシアチブ"
 ve_civic_initiative_cost:0 "コスト: #Y 100 文化的義務#!"
 ve_civic_initiative_short:0 "1 つの州で少数派の支持率を高めます。\n#P +25 委任、+10 団結#!、さらに支持者。"
 ve_civic_initiative_desc:0 "#header 平等な市民権イニシアチブ#!\n単一の州でその最大の非プライマリ カルチャで実行します。これは少なくとも保持する必要があります。 #Y 5%#! その州の人口のうち。\n\n#Y 費用#!\n#Y 100 文化的義務#!、すぐに支払われます\n\n#Y 完了時に#!\n#P +15 その文化を 10 年間受け入れます#!\n対象国のロイヤリスト\n#P +25 文化的使命、+10 国家結束#!\n10 年間の向上した資格と移住誘致"
 ve_composite_compact_name:0 "憲法制定コンパクト"
 ve_composite_compact_cost:0 "料金： #Y 150 文化的使命#! そして #Y 40 結束#!"
 ve_composite_compact_short:0 "少数派を構成文化として認識します。\n#P +30 委任、+12 結束#!"
 ve_composite_compact_desc:0 "#header 憲法のコンパクト#!\n少なくとも保持している未認識の非プライマリ カルチャで単一の状態で実行 #Y 5%#! その州の人口の割合です。\n\n#Y コスト#!\n#Y 150 文化的使命#!、すぐに支払われ、少なくとも #Y 40 国家の団結#!\n\n#Y 完了時#!\n#P +15 その文化に対する永続的な受け入れ#!\nそれを構成文化として認識します\n対象国のロイヤリスト\n#P +30 文化的使命、+12 国家結束#!"
 ve_targeted_project_start_instruction:0 "#Y 開始方法#!\n1.自分の州を 1 つ開きます。\n2.プレス #Y プロジェクトの開始#! \nターゲット カルチャとまだ不足しているものは、そのボタンのツールチップにリストされます。"
 ve_targeted_project_state_requirements_tt:0 "州は私たちによって所有され、少なくとも次の要素を含む適格な非主要文化を含んでいなければなりません。 #Y 5%#! その人口の。対象となる最大の対象文化がターゲットになります。この州ですでに完了した文化を再度ターゲットにすることはできませんが、別の州でターゲットにすることはできます。現在のアイデンティティ モデルのコストと要件も満たさなければなりません。"
 ve_targeted_cultural_project_target:0 "ターゲット： #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! で #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "範囲: #Y 全国#!"
 ve_no_cultural_project_target:0 "プロジェクト対象なし"
 ve_no_active_cultural_project:0 "積極的な文化プロジェクトはありません"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "一貫性のある - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "断片化された - #N 国家不安定が適用される#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% 徴兵率および +3 正当性#!."
 ve_civic_high_cohesion_effect:0 "#P +5% 資格および +3 正当性#!."
 ve_composite_high_cohesion_effect:0 "#P +5% 影響力および +3 正当性#!。"
 ve_identity_transition_backlash_notice:0 "ID 遷移バックラッシュはまだアクティブです。有効期限が切れるまで、モデルを再度切り替えることはできません。"
 ve_cultural_project_backlash_notice:0 "キャンセルされたプロジェクトは引き続き新しいプロジェクトをブロックします。最初に 2 年間のバックラッシュが期限切れになる必要があります。"

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "遷移バックラッシュがアクティブ"
 ve_cultural_project_backlash_notice_short:0 "キャンセルバックラッシュ有効"
 ve_targeted_project_start_instruction_short:0 "自分の州の 1 つから開始します。州を開いて を押します。 #Y プロジェクト#!を開始します。"
