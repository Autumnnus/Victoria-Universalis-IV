 ve_je_doctrine_journey_industrialist_status_support:0 "進行状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] か月#!\n月次進捗: #P +1#!\n\n#N 製造規模が満たされていません#!: 少なくとも必要です #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! 製造ビルのレベル。\n#P 安定した政権運営が実現#!: 官僚主義は否定的ではなく、不足が近づいているわけではなく、国の混乱は 15% 未満です。\n\n成功報酬: #P +40 国家洞察力#!。 60 か月以内に進行状況が 60 に達しない場合、ジャーニーは報酬なしで終了します。"
 ve_je_doctrine_journey_industrialist_status_neither:0 "進捗： #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] months#!\n月次進捗状況: #N 0#!\n\n#N 製造規模が満たされていません#!: 少なくとも必要です #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! 製造ビルのレベル。\n#N 安定した政権運営が果たせていない#!: 非ネガティブな官僚制、差し迫った不足がなく、国の混乱が 15% 未満であることが必要です。\n\n成功報酬:  #P +40 National Insight#!。 60 か月以内に進行状況が 60 に達しない場合、ジャーニーは報酬なしで終了します。"
 ve_je_doctrine_journey_academic:0 "学者の共和国"
 ve_je_doctrine_journey_academic_reason:0 "大学と学識団体は、その機関と社会基盤がそれを維持できる限り、全国規模の研究コミュニティになる準備ができています。"
