 ve_je_doctrine_journey_academic_status_neither:0 "進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] ヶ月#!\n月間進捗: #N 0#!\n\n#N 大学の規模が不足しています#!: 最低でも #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! の大学施設レベルが必要です。\n#N 識字率の基礎条件が不足しています#!: 識字率が50%以上、または歩みの開始時点の値から5パーセントポイント以上高くなければなりません。\n\n成功報酬: #P +15 時代勢力#!。進捗が60ヶ月以内に60に達しない場合、この歩みは報酬なしで終了します。"
 ve_je_doctrine_journey_professional_army:0 "参謀本部の改革"
 ve_je_doctrine_journey_professional_army_reason:0 "プロフェッショナルな士官団の育成には、兵舎や辞令だけでは不十分である。訓練、計画立案、そして動員を統合し、永続的な参謀制度として組織しなければならない。"
 ve_je_doctrine_journey_professional_army_status_both:0 "進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] ヶ月#!\n月間進捗: #P +2#!\n\n#P 兵舎の規模条件を満たしています#!: 最低 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! の兵舎施設レベル。\n#P 専門的ドクトリン条件を満たしています#!: 職業軍人法または参謀本部の技術。\n\n成功報酬: #Y 制度化された参謀本部#! (+7.5% 訓練率、36ヶ月)。進捗が60ヶ月以内に60に達しない場合、この歩みは報酬なしで終了します。"
 ve_je_doctrine_journey_professional_army_status_core:0 "進捗: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] ヶ月#!\n月間進捗: #P +1#!\n\n#P 兵舎の規模条件を満たしています#!: 最低 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! の兵舎施設レベル。\n#N 専門的ドクトリン条件を満たしていません#!: 職業軍人法または参謀本部の技術が必要です。\n\n成功報酬: #Y 制度化された参謀本部#! (+7.5% 訓練率、36ヶ月)。進捗が60ヶ月以内に60に達しない場合、この歩みは報酬なしで終了します。"
