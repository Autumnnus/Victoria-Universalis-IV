 ve_je_doctrine_journey_industrialist:0 "工場制の標準化"
 ve_je_doctrine_journey_industrialist_reason:0 "工業国策は個別の工場を越えて広がりを見せている。製造業者、検査官、そして行政官は、いまや地域ごとの実地慣行を永続的な国家システムへと昇華させねばならない。"
