 ve_doctrine_journey_general_staff_reform_mdf:0 "制度化された参謀本部"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "大学校、動員計画表、そして共通の訓練基準は、陸軍の永続的な一部となった。"

 ve_doctrine_journey.1.t:0 "工場制の標準化"
 ve_doctrine_journey.1.d:0 "産業組合は、機械設備、検査体制、そして製造手法の足並みを揃える国家的な取り組みを提案している。この事業には5年間の期間が見込まれ、持続的な産業規模と行政の安定性が求められる。"
 ve_doctrine_journey.1.a:0 "標準化の取り組みを開始する。"
 ve_doctrine_journey.1.b:0 "5年後に改めて提案を検討する。"
 ve_doctrine_journey.1.c:0 "我が国の工場に国家ドクトリンは不要である。"
 ve_doctrine_journey.2.t:0 "学問共和国"
 ve_doctrine_journey.2.d:0 "大学総長と学術結社は、大学群を結びつけて持続的な国家規模の学術共同体を築くための、5年間の取り組みを提案している。その成功は、学術的キャパシティと識字率の普及の双方にかかっている。"
 ve_doctrine_journey.2.a:0 "学問共和国を後援する。"
 ve_doctrine_journey.2.b:0 "5年後に再び提案を見直す。"
 ve_doctrine_journey.2.c:0 "学問は地域主導で組織されるべきである。"
 ve_doctrine_journey.3.t:0 "参謀本部の改革"
 ve_doctrine_journey.3.d:0 "上級将校団は、訓練、計画立案、動員に関する5年間の改革を提案している。参謀本部は、専門的ドクトリンが一部の寵愛を受ける司令官たちのサークルの外でも機能し得ることを証明せねばならない。"
 ve_doctrine_journey.3.a:0 "参謀本部の改革を委嘱する。"
 ve_doctrine_journey.3.b:0 "5年後に再び計画を審査する。"
 ve_doctrine_journey.3.c:0 "既存の指揮系統で十分である。"

 ve_doctrine_journey_start_tt:0 "この5年間のドクトリンの歩みを開始する。同時に有効にできるドクトリンの歩みは1つのみである。"
 ve_doctrine_journey_defer_tt:0 "このグループの提案を #Y 5年間#!延期する。その後再び提案される可能性がある。"
 ve_doctrine_journey_decline_tt:0 "このグループのドクトリンの歩みを永久に拒否する。"

 ve_doctrine_journey.10.t:0 "測定基準と許容差"
 ve_doctrine_journey.10.d:0 "工場は互換性のない規格、継手、許容差を使用している。技師は国家に統一カタログの制定を迫る一方、地方の製造業者らは厳格な基準が有用な地元の慣習を凍結させる恐れがあると警告している。"
 ve_doctrine_journey.10.a:0 "国家規格カタログに資金を投じる。"
 ve_doctrine_journey.10.a.tt:0 "#N 15#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"
 ve_doctrine_journey.10.b:0 "互換性のある地域基準を容認する。"
 ve_doctrine_journey.10.b.tt:0 "資源や進捗の即時的な変動なしにジャーニーは継続されます。"
 ve_doctrine_journey.10.c:0 "建設局を用いて採用を調整する。"
 ve_doctrine_journey.10.c.tt:0 "実業家 思想 Vが必要です。\n#N 10#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"
 ve_doctrine_journey.11.t:0 "国家検査局"
 ve_doctrine_journey.11.d:0 "最初の共通基準の施行が求められている。当局は中央検査局の設立を提案し、製造業者は自己認証を好み、経験豊富な産業計画家らは双方の監査を主張している。"
 ve_doctrine_journey.11.a:0 "中央産業検査局を設立する。"
 ve_doctrine_journey.11.a.tt:0 "#N 15#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"
 ve_doctrine_journey.11.b:0 "産業界の自己認証を承認する。"
 ve_doctrine_journey.11.b.tt:0 "資源や進捗の即時的な変動なしにジャーニーは継続されます。"
 ve_doctrine_journey.11.c:0 "単一のシステムを通じて検査官と製造業者を監査する。"
 ve_doctrine_journey.11.c.tt:0 "実業家 思想 VIIが必要です。\n#N 10#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"

 ve_doctrine_journey.20.t:0 "新設の講座"
 ve_doctrine_journey.20.d:0 "大学群の間で、新設の講座が地元の学部、国家の優先事項、あるいは公共の教育的権限のいずれに従属すべきかを巡り意見が割れている。最初の任命が、学術ネットワークがいかに自由に人材と思想を交流させるかを決定づけることになろう。"
 ve_doctrine_journey.20.a:0 "調整された国家講座プログラムに資金を投じる。"
 ve_doctrine_journey.20.a.tt:0 "#N 15#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"
 ve_doctrine_journey.20.b:0 "各学部に独自の講座を定義させる。"
 ve_doctrine_journey.20.b.tt:0 "資源や進捗の即時的な変動なしにジャーニーは継続されます。"
 ve_doctrine_journey.20.c:0 "講座を公開講義ネットワークに結び付ける。"
 ve_doctrine_journey.20.c.tt:0 "学術 思想 Vが必要です。\n#N 10#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"
 ve_doctrine_journey.21.t:0 "査読の共和国"
 ve_doctrine_journey.21.d:0 "研究は今や、古めかしい後援体制がそれを審査できる速度を上回って諸機関の間を移動している。学者らは国家によるピアレビューを提案し、一方で既存のアカデミーは選抜制の招待と学問分野の独立性を守ろうとしている。"
 ve_doctrine_journey.21.a:0 "国家ピアレビュー事業に資金を拠出する。"
 ve_doctrine_journey.21.a.tt:0 "#N 15#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"
 ve_doctrine_journey.21.b:0 "審査を学術協会に委ねる。"
 ve_doctrine_journey.21.b.tt:0 "資源や進捗の即時的な変動なしにジャーニーは継続されます。"
 ve_doctrine_journey.21.c:0 "学際的な審査評議会を召集する。"
 ve_doctrine_journey.21.c.tt:0 "学術 思想 VIIが必要です。\n#N 10#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"

 ve_doctrine_journey.30.t:0 "陸軍大学校"
 ve_doctrine_journey.30.d:0 "新設の陸軍大学校は、何が士官を指揮官にふさわしくするのかを決定せねばならない。改革派は試験と共通の指導を要求し、一方で既成の司令官らは年功序列と野戦勤務で得られた判断力を擁護している。"
 ve_doctrine_journey.30.a:0 "国家試験と共通カリキュラムに資金を投じる。"
 ve_doctrine_journey.30.a.tt:0 "#N 15#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"
 ve_doctrine_journey.30.b:0 "年功序列と陸軍大学校の勧告の均衡を取る。"
 ve_doctrine_journey.30.b.tt:0 "資源や進捗の即時的な変動なしにジャーニーは継続されます。"
 ve_doctrine_journey.30.c:0 "野戦士官を陸軍大学校の教室でローテーションさせる。"
 ve_doctrine_journey.30.c.tt:0 "常備軍 思想 Vが必要です。\n#N 10#!の国政識見を消費します。\nジャーニーの進捗が#P 4#!増加します。"
 ve_doctrine_journey.31.t:0 "動員計画表"
 ve_doctrine_journey.31.d:0 "計画立案者たちが人員、物資、そして鉄道輸送に関する競合する日程表を策定した。単一の国家統括表は調整を約束するものの、地域指揮官らは硬直した時間割が地元のキャパシティを無視することになると警告している。"
 ve_doctrine_journey.31.a:0 "中央動員局に資金を投じる。"
 ve_doctrine_journey.31.a.tt:0 "#N 15#!の国政識見を消費する。\nジャーニー進捗が#P 4#!増加する。"
 ve_doctrine_journey.31.b:0 "地域指揮官らに互換性のある日程表の維持を任せる。"
 ve_doctrine_journey.31.b.tt:0 "リソースや進捗の即座な変更なしにジャーニーが継続する。"
 ve_doctrine_journey.31.c:0 "鉄道、補給廠、および指揮の計画を統合する。"
 ve_doctrine_journey.31.c.tt:0 "常備軍思想 VIIが必要。\n#N 10#!の国政識見を消費する。\nジャーニー進捗が#P 4#!増加する。"
