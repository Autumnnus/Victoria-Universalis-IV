 ve_je_doctrine_journey_academic:0 "学問共和国"
 ve_je_doctrine_journey_academic_reason:0 "大学や学会は、その制度的および社会的基盤がこれを維持しうるならば、国家的な探求の共同体となる準備が整っている。"
