 ve_je_doctrine_journey_academic_status_neither:0 "進行状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] か月#!\n月の進捗状況: #N 0#!\n\n#N 大学の規模が満たされていません#!: 少なくとも必要です #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! 大学の建物レベル。\n#N 識字能力の基礎が満たされていない#!: 少なくとも 50% の識字率、または旅の開始値より 5 パーセントポイント高いことが必要です。\n\n成功報酬: #P +15 Era Momentum#!。 60 か月以内に進捗が 60 に達しない場合、旅は報酬なしで終了します。"
 ve_je_doctrine_journey_professional_army:0 "参謀の改革"
 ve_je_doctrine_journey_professional_army_reason:0 "専門士官部隊には兵舎や任務以上のものが必要です。訓練、計画、動員は 1 つの永続的なスタッフ システムに組織化する必要があります。"
 ve_je_doctrine_journey_professional_army_status_both:0 "進行状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] か月#!\n月次進捗: #P +2#!\n\n#P 兵舎の規模が満たされました#!: 少なくとも #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 兵舎の建物レベル。\n#P 専門的教義を満たす#!: 専門陸軍法または参謀本部の技術。\n\n成功報酬: #Y 施設参謀#! (+7.5% トレーニング率、36 か月)。 60 か月以内に進行状況が 60 に達しない場合、ジャーニーは報酬なしで終了します。"
 ve_je_doctrine_journey_professional_army_status_core:0 "進行状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] か月#!\n毎月の進行状況: #P +1#!\n\n#P 兵舎の規模が満たされました#!： 少なくとも #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 兵舎の建物レベル。\n#N 専門的な原則が満たされていない#!: 職業軍法または参謀本部のテクノロジーが必要です。\n\n成功報酬: #Y 機関参謀#! (+7.5% トレーニング率、36 か月)。 60 か月以内に進行状況が 60 に達しない場合、旅は報酬なしで終了します。"
 ve_je_doctrine_journey_professional_army_status_support:0 "進行状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 月#!\n月次進捗: #P +1#!\n\n#N 兵舎の規模が満たされていません#!: 少なくとも #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 兵舎の建物レベルが必要です。\n#P 専門的教義が満たされています#!: 専門的な陸軍法または参謀本部の技術。\n\n成功報酬: #Y 施設参謀#! (+7.5% トレーニング率、36 か月)。 60 か月以内に進行状況が 60 に達しない場合、ジャーニーは報酬なしで終了します。"
 ve_je_doctrine_journey_professional_army_status_neither:0 "進行状況: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] か月#!\n毎月の進行状況: #N 0#!\n\n#N 兵舎の規模が満たされていません#!: 少なくとも必要です #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 兵舎の建物レベル。\n#N 専門的な原則が満たされていない#!: 職業軍法または参謀本部のテクノロジーが必要です。\n\n成功報酬: #Y 機関系一般職員#! (+7.5% トレーニング率、36 か月)。 60 か月以内に進行状況が 60 に達しない場合、ジャーニーは報酬なしで終了します。"
 ve_doctrine_journey_general_staff_reform_mdf:0 "機関系一般職員"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "幕僚大学、動員表、および共通の訓練基準は、軍隊の永続的な部分となっています。"

 ve_doctrine_journey.1.t:0 "工場システムの標準化"
 ve_doctrine_journey.1.d:0 "業界団体は、機械、検査、製造慣行を調整するための全国的な取り組みを提案しています。この事業は5年間続き、持続的な産業規模と経営の安定性が求められる。"
 ve_doctrine_journey.1.a:0 "標準化の取り組みを開始します。"
 ve_doctrine_journey.1.b:0 "5年後に提案を再検討してください。"
 ve_doctrine_journey.1.c:0 "私たちの工場には国家主義は必要ありません。"
 ve_doctrine_journey.2.t:0 "学者の共和国"
 ve_doctrine_journey.2.d:0 "学長と学識団体は、大学を永続的な全国的な研究コミュニティに結び付けるための5年間の取り組みを提案している。その成功は学力と読み書き能力の普及の両方にかかっています。"
 ve_doctrine_journey.2.a:0 "学者共和国を後援してください。"
 ve_doctrine_journey.2.b:0 "5 年後に提案に戻ります。"
 ve_doctrine_journey.2.c:0 "学習はローカルに組織化されたままにする必要があります。"
 ve_doctrine_journey.3.t:0 "参謀本部の改革"
 ve_doctrine_journey.3.d:0 "上級将校は訓練、計画、動員の5年間の改革を提案している。一般参謀は、専門的な教義が支持される指揮官のサークルを超えて存続できることを証明する必要があるだろう。"
 ve_doctrine_journey.3.a:0 "参謀改革を委嘱する。"
 ve_doctrine_journey.3.b:0 "5年後に再度計画を見直す。"
 ve_doctrine_journey.3.c:0 "既存の指揮系統で十分である。"

 ve_doctrine_journey_start_tt:0 "この 5 年間の教義の旅が始まります。一度にアクティブにできる Doctrine Journey は 1 つだけです。"
 ve_doctrine_journey_defer_tt:0 "このグループのオファーを延期します #Y 5年#!。その後、再度提供される可能性があります。"
 ve_doctrine_journey_decline_tt:0 "このグループの Doctrine Journey を永久に拒否します。"

 ve_doctrine_journey.10.t:0 "寸法と許容範囲"
 ve_doctrine_journey.10.d:0 "工場では互換性のないゲージ、継手、公差が使用されています。技術者らは州にカタログを1つだけ課すよう求める一方、地方の製造業者は厳格な基準が地域の有益な実践を凍結する可能性があると警告している。"
 ve_doctrine_journey.10.a:0 "規格の全国カタログに資金を提供します。"
 ve_doctrine_journey.10.a.tt:0 "支出 #N 15#! National Insight。\n旅の進行状況は次のように増加します。 #P 4#!."
 ve_doctrine_journey.10.b:0 "互換性のある地域標準を許可します。"
 ve_doctrine_journey.10.b.tt:0 "リソースや進行状況をすぐに変更することなく、旅は続行します。"
 ve_doctrine_journey.10.c:0 "建設事務所を使用して導入を調整します。"
 ve_doctrine_journey.10.c.tt:0 "Industrialist Idea V が必要です。\n #N 10#! National Insight を費やします。\n旅の進行状況は #P 4#!増加します。"
 ve_doctrine_journey.11.t:0 "国家検査局"
 ve_doctrine_journey.11.d:0 "最初の共通標準は施行が必要になりました。当局者は中央検査機関の設置を提案し、製造業者は自己認証を好み、経験豊富な産業計画者は両方の監査を主張している。"
 ve_doctrine_journey.11.a:0 "中央工業検査局を設立する。"
 ve_doctrine_journey.11.a.tt:0 "支出 #N 15#! National Insight。\n旅の進行状況は次のように増加します。 #P 4#!。"
 ve_doctrine_journey.11.b:0 "業界の自己認証を認識します。"
 ve_doctrine_journey.11.b.tt:0 "リソースや進捗状況を即座に変更することなく、旅は続きます。"
 ve_doctrine_journey.11.c:0 "1 つのシステムを通じて検査官と製造業者を監査します。"
 ve_doctrine_journey.11.c.tt:0 "実業家のアイデア VII が必要です。\n消費 #N 10#! National Insight。\n旅の進行状況は次のように増加します。 #P 4#!。"

 ve_doctrine_journey.20.t:0 "オープンチェア"
 ve_doctrine_journey.20.d:0 "新しい学部長が地元の学部、国の優先事項、または公教育の使命に応えるべきかどうかについて、大学間の意見が分かれている。最初の任命は、学術ネットワークがいかに自由に人材やアイデアを交換するかを定義することになる。"
 ve_doctrine_journey.20.a:0 "調整された全国議長プログラムに資金を提供します。"
 ve_doctrine_journey.20.a.tt:0 " #N 15#! National Insightを費やします。\n旅の進行状況は次のように増加します #P 4#!."
 ve_doctrine_journey.20.b:0 "各教員に独自の椅子を定義させます。"
 ve_doctrine_journey.20.b.tt:0 "旅は、即時のリソースや進行状況の変更なしで続行します。"
 ve_doctrine_journey.20.c:0 "椅子を公開講義ネットワークに結び付けます。"
 ve_doctrine_journey.20.c.tt:0 "学術的アイデア V が必要です。\n消費 #N 10#! National Insight。\n旅の進行状況は #P 4#!増加します。"
 ve_doctrine_journey.21.t:0 "査読者の共和国"
 ve_doctrine_journey.21.d:0 "研究は、今までの支援者が判断できるよりも早く機関間を移動します。学者は全国的な査読を提案する一方、確立されたアカデミーは選択的招待と規律的独立を擁護します。"
 ve_doctrine_journey.21.a:0 "全国的な査読サービスに資金を提供します。"
 ve_doctrine_journey.21.a.tt:0 "15 #N National Insightを費やします。#! 旅の進捗状況は #P 4#!増加します。"
 ve_doctrine_journey.21.b:0 "レビューは学識ある学会に任せます。"
 ve_doctrine_journey.21.b.tt:0 "旅は、リソースや進捗状況を即座に変更することなく続行します。"
 ve_doctrine_journey.21.c:0 "専門分野を超えた審査評議会を招集します。"
 ve_doctrine_journey.21.c.tt:0 "Academic Idea VII が必要です。\n #N 10#! National Insight を費やします。\n旅の進行状況は #P 4#!増加します。"

 ve_doctrine_journey.30.t:0 "スタッフカレッジ"
 ve_doctrine_journey.30.d:0 "新しい幕僚大学は、何が将校を指揮にふさわしいものとするのかを判断しなければならない。改革派は試験と共通の指導を要求する一方、既成の指揮官は年功序列と現場勤務で得た判断を擁護する。"
 ve_doctrine_journey.30.a:0 "国家試験と共通カリキュラムに資金を提供します。"
 ve_doctrine_journey.30.a.tt:0 " #N 15#! National Insightを費やします。\n旅の進行状況は次のように増加します #P 4#!."
 ve_doctrine_journey.30.b:0 "年功序列と大学の推薦のバランスを取る。"
 ve_doctrine_journey.30.b.tt:0 "当面のリソースや進捗状況の変更なしで旅は続く。"
 ve_doctrine_journey.30.c:0 "職員教室で現場職員を交替させる。"
 ve_doctrine_journey.30.c.tt:0 "Professional Army Idea Vが必要です。\n #N 10#! National Insightを費やします。\n旅の進行状況は #P 4#!増加します。"
 ve_doctrine_journey.31.t:0 "動員テーブル"
 ve_doctrine_journey.31.d:0 "計画立案者は、人員、物資、鉄道輸送について競合するスケジュールを作成しました。単一の国家テーブルは調整を約束するが、地方司令部は、厳格なスケジュールは地方の能力を無視することになると警告している。"
 ve_doctrine_journey.31.a:0 "中央動員局に資金を提供する。"
 ve_doctrine_journey.31.a.tt:0 "支出 #N 15#! National Insight。\n旅の進行状況は次のように増加します。 #P 4#!。"
 ve_doctrine_journey.31.b:0 "地域コマンドに互換性のあるスケジュールを維持させます。"
 ve_doctrine_journey.31.b.tt:0 " 旅は、リソースや進行状況を即座に変更することなく続行します。"
 ve_doctrine_journey.31.c:0 " 鉄道、補給所、指揮計画を統合します。"
 ve_doctrine_journey.31.c.tt:0 " Professional Army Idea VII が必要です。\n #N 10#! National Insight を費やします。\n旅の進行状況は #P 4#!増加します。"
