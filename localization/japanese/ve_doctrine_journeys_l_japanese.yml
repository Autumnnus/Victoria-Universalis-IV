 ve_je_doctrine_journey_industrialist:0 "工場システムの標準化"
 ve_je_doctrine_journey_industrialist_reason:0 "産業原理は個々の工場を超えて広がりました。製造業者、検査官、管理者は今、地域の慣行を永続的な国家システムに変える必要があります。"
 ve_je_doctrine_journey_industrialist_status_both:0 "進捗： #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n残り時間: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] か月#!\n月次進捗: #P +2#!\n\n#P 製造規模を満たしている#!： 少なくとも #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! 製造ビルのレベル。\n#P 安定した政権運営が実現#!: 官僚制は否定的ではなく、不足は迫っていない、国の混乱は 15% 未満です。\n\n成功報酬:  #P +40 National Insight#!。 60 か月以内に進行状況が 60 に達しない場合、旅は報酬なしで終了します。"
