l_japanese:
 ve_je_religious_project:0 "宗教プロジェクト"
 ve_je_religious_project_reason:0 "政府は長期的な宗教プロジェクトを指揮しています。その進行は、行政能力、政治的正当性、宗教的条件、対象国の出来事によって左右されます。"
 ve_je_religious_project_progress:0 "完成に向けた宗教プロジェクトの進捗状況"
 ve_je_religious_project_status_confessional:0 "における告白回心 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 組織的なキャンペーンを通じて州の信仰を広めることを目指しています。\n\n完了は #Y 125#! 進捗：対象州の人口の5%を国教に改宗、返金 #P 20#! 敬虔の改革と追加 #P 5#! 宗教的居住地."
 ve_je_religious_project_status_freedom:0 "における自由の普及活動 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 良心と自主的な結社に基づいて和解を構築しています。\n\n完了は #Y 100#! 進捗状況: 強制改宗や返金を行わずに国家支持者を追加 #P 20#! 信心改革、および追加 #P 7#! 宗教定住."
 ve_je_religious_project_status_secularization:0 "における世俗化キャンペーン [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 組織化された宗教の公的権威を低下させています。\n\n完了は #Y 150#! 進捗状況: 対象州の人口の 5% を無神論に改宗させ、返金する #P 25#! 敬虔の改革と追加 #P 8#! 宗教定住。"
 ve_je_religious_project_complete_tt:0 "宗教プロジェクトは目標に達しました。"
 ve_je_religious_project_fail_tt:0 "宗教プロジェクトはキャンセルされました。"

 ve_je_cultural_project:0 "文化プロジェクト"
 ve_je_cultural_project_reason:0 "政府は長期的な文化プロジェクトを指揮している。行政能力、正当性、教育、国家の結束、地域の状況がそのペースを決定します。"
 ve_je_cultural_project_progress:0 "完成に向けた文化プロジェクトの進捗状況"
 ve_je_cultural_project_status_curriculum:0 "国内の学校や教育機関向けに国家カリキュラムが準備されています。\n\n修​​了時期は次のとおりです。 #Y 100#! 進捗： #P +20#! 文化的使命、 #P +5#! 国家の結束、および 10 年間の結果では、教育アクセス +2%、資格 +5%、官僚制 -25 でした。"
 ve_je_cultural_project_status_symbols:0 "共有シンボルのプログラムは、一般的な市民語彙を形成しています。\n\n完了は次のとおりです。 #Y 75#! 進行状況: #P +20#! 文化的使命、 #P +7#! National Cohesion、および完全に受け入れられたポップスからの +10% の支持者と +25 の権威という 8 年間の結果。"
 ve_je_cultural_project_status_ethnic:0 "における民族統合キャンペーン [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 少数民族に一次文化を押し付けています。\n\n完了は次のとおりです。 #Y 125#! 進捗: ターゲット カルチャーのポップスの 5% をプライマリ カルチャーに変換 (Nationalist VII では 7%)、 #P +25#! 文化的使命、 #P +8#! 国民の団結と10年間の同化の結果。"
 ve_je_cultural_project_status_civic:0 "における平等市民権イニシアチブ [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 文化の違いを越えて共通の市民的地位を拡張しています。\n\n完了時期は次のとおりです。 #Y 100#! 進歩: +15% 10年間の承認、国家支持者、 #P +25#! 文化的使命、 #P +10#! 国民の結束、および 10 年間の資格/移住の結果。"
 ve_je_cultural_project_status_composite:0 " [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 複合状態内で永続的な認識をネゴシエートしています。\n\n完了は次のとおりです。 #Y 150#! 進捗（40以上の国家結束が必要）：永続的な+15％の承認、構成員リストに文化を追加、国家支持者、 #P +30#! 文化的使命、 #P +12#! 国民の団結。"
 ve_je_cultural_project_complete_tt:0 "文化プロジェクトは目標を達成しました。"
 ve_je_cultural_project_fail_tt:0 "文化プロジェクトは中止されました。"
 ve_je_project_resolving_status:0 "プロジェクト管理者は最終報告書を提出中です。"

 ve_evt_religious_incident_cooldown_mdf:0 "宗教プロジェクト事件のクールダウン"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "プロジェクト管理者は、最近の事件の影響を吸収しています。"
 ve_evt_cultural_incident_cooldown_mdf:0 "文化プロジェクト事件のクールダウン"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "プロジェクト管理者は、最近の事件の影響を吸収しています。"
 ve_evt_central_clergy_supported_mdf:0 "中央聖職者が支持しています。"
 ve_evt_central_clergy_supported_mdf_desc:0 "政府は中央宗教階層の権威を支持しています。"
 ve_evt_central_clergy_slighted_mdf:0 "中央聖職者は軽視しています"
 ve_evt_central_clergy_slighted_mdf_desc:0 "政府中央の宗教階層の好みよりも地元の慣習を支持している。"
 ve_evt_municipal_patronage_mdf:0 "自治体後援ネットワーク"
 ve_evt_municipal_patronage_mdf_desc:0 "地元の名士らは、徴税を弱める取り決めを通じてこのプロジェクトを進めている。"

 ve_rel_evt.1.t:0 "地元の名士の嘆願書"
 ve_rel_evt.1.d:0 "地元の聖職者、自治体関係者、近所の長老からなる代表団。 [SCOPE.sState('ve_evt_target_state').GetName] は政府に対し、告白改宗を遅らせるよう請願した。彼らは、柔軟性のないスケジュールはコンプライアンスを永続的な憤りに変えるだろうと警告しています。"
 ve_rel_evt.1.f:0 "「助言なしに押し付けられた信仰は、席を空にする一方で登録簿を埋める可能性があります。」"
 ve_rel_evt.1.a:0 "彼らの嘆願を聞いてください。"
 ve_rel_evt.1.a.tt:0 "宗教プロジェクトの進行状況が減少します #N 4#!.\n宗教的居住地が増加します #P 3#!."
 ve_rel_evt.1.b:0 "スケジュールは変更されません。"
 ve_rel_evt.1.b.tt:0 "宗教プロジェクトの進捗状況は次のように増加します。 #P 5#!.\n宗教的居住地が #N 2減少します#!.\n#N 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] "
 ve_rel_evt.1.c:0 "信頼できる仲介者に委託する。"
 ve_rel_evt.1.c.tt:0 "支出する #N 10#! 信心改革。\n宗教プロジェクトの進行状況は次のように増加します。 #P 3#!.\n宗教的居住地が増加します #P 1#!."

 ve_rel_evt.2.t:0 "佐官の不足"
 ve_rel_evt.2.d:0 "からのレポート [SCOPE.sState('ve_evt_target_state').GetName] 回答のない嘆願書、矛盾した指示、数週間もプロジェクト担当者に会っていない地区について説明します。告白改宗は、それを遂行するために割り当てられた行政を上回っています。"
 ve_rel_evt.2.f:0 "「法令は 1 日で国を横断することができますが、有能な書記官にはそれはできません。」"
 ve_rel_evt.2.a:0 "臨時の現場警察官を雇う。"
 ve_rel_evt.2.a.tt:0 "支出 #N 15#! 敬虔な改革。\n宗教プロジェクトの進行状況が #P 4#!増加します。"
 ve_rel_evt.2.b:0 "プログラムを遅くします。"
 ve_rel_evt.2.b.tt:0 "宗教プロジェクトの進捗は #N 6#!減少します。\n宗教集落は #P 2#!増加します。"
 ve_rel_evt.2.c:0 "中央登録幹部を使用します。"
 ve_rel_evt.2.c.tt:0 " #N 10#! 敬虔改革を費やします。\n宗教プロジェクトの進捗状況は #P 5#!増加します。"

 ve_cul_evt.1.t:0 "翻訳局"
 ve_cul_evt.1.d:0 "職員 [SCOPE.sState('ve_evt_target_state').GetName] 市民権均等イニシアチブが問題にどのように対処すべきかについては意見が一致しない。 [SCOPE.sCulture('ve_evt_target_culture').GetName] 言語。地方の管理者はオフィスに二か国語を使用することを望んでいます。中央省庁は単一の管理基準を要求します。"
 ve_cul_evt.1.f:0 "「国民は、自分の名前で与えられた権利を理解するために通訳を必要とすべきではありません。」"
 ve_cul_evt.1.a:0 "公共機関で現地の言語を普及させましょう。"
 ve_cul_evt.1.a.tt:0 "文化プロジェクトの進捗状況は #N 4減少します#!.\n国家の結束力が増加します #P 3#!。"
 ve_cul_evt.1.b:0 "1 つの管理基準を課します。"
 ve_cul_evt.1.b.tt:0 "文化プロジェクトの進捗は次のように増加します。 #P 5#!.\n国家の結束力が減少します #N 2#!.\n#N 0.5%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] ラジカルになる。"
 ve_cul_evt.1.c:0 "学術翻訳委員会を設立します。"
 ve_cul_evt.1.c.tt:0 "支出 #N 10#! 文化的使命。\n文化プロジェクトの進捗は #P 3#!増加します。\n国家の団結は #P 1増加します。#!."

 ve_cul_evt.2.t:0 "地元の教師不足"
 ve_cul_evt.2.d:0 "学校 [SCOPE.sState('ve_evt_target_state').GetName] 州のカリキュラムと教育の両方を担当できる教師が不足している [SCOPE.sCulture('ve_evt_target_culture').GetName] コミュニティ。訓練を受けた地元幹部がいないと、平等な市民権は公式文書にのみ書かれた約束のままになる危険がある。"
 ve_cul_evt.2.f:0 "「法律は午後の平等を宣言しています。教室では一世代にわたって平等を教えなければなりません。」"
 ve_cul_evt.2.a:0 "新しい教師の大学に資金を提供します。"
 ve_cul_evt.2.a.tt:0 "支出 #N 15#! 文化的使命。\n文化プロジェクトの進行状況は #P 4#!増加します。"
 ve_cul_evt.2.b:0 "実装が遅い。"
 ve_cul_evt.2.b.tt:0 "文化プロジェクトの進捗状況は #N 6#!減少します。\n国民の団結力は #P 2#!増加します。"
 ve_cul_evt.2.c:0 "すでに設置されている制度を利用します。"
 ve_cul_evt.2.c.tt:0 "支出します。 #N 10#! 文化的使命。\n文化プロジェクトの進捗状況は #P 5#!増加します。\n国家の団結は #P 1#!増加します。"

 ve_rel_evt.3.t:0 "矛盾する登録"
 ve_rel_evt.3.d:0 "教区名簿、地方自治体の台帳、プロジェクト担当者の報告書には、宗教的信奉について相容れない記述が示されている。 [SCOPE.sState('ve_evt_target_state').GetName]。政権は真実を解明するために時間を無駄にするか、不確実であるとわかっている数字をそのまま進めるべきかを決断しなければならない。"
 ve_rel_evt.3.f:0 "「どのオフィスも正確な合計を持っています。一致する合計が 2 つとありません。」"
 ve_rel_evt.3.a:0 "完全な監査を実施します。"
 ve_rel_evt.3.a.tt:0 "得 #P 8#! 信心改革。\n宗教プロジェクトの進捗状況が #N 6#!減少します。"
 ve_rel_evt.3.b:0 "合理的な見積もりを立てて続行します。"
 ve_rel_evt.3.b.tt:0 "支出 #N 8#! 信心改革。\n宗教プロジェクトの進行状況は次のように増加します。 #P 5#!."
 ve_rel_evt.3.c:0 "神聖な行政登録簿を使用する。"
 ve_rel_evt.3.c.tt:0 "宗教プロジェクトの進捗状況は  #P 3#! 増加する。"

 ve_rel_evt.4.t:0 "噂と反対説教"
 ve_rel_evt.4.d:0 "現在、パンフレット、街頭説教、不安な噂では、告白回心について説明されています。 [SCOPE.sState('ve_evt_target_state').GetName] 地元の生活に対する攻撃として。当局者らは、沈黙すれば反対派がプロジェクトを定義できるようになり、反対に弾圧は彼らの最も暗い主張を裏付ける可能性があると警告している。"
 ve_rel_evt.4.f:0 "「噂には事務所も印鑑も予算も必要ありません。」"
 ve_rel_evt.4.a:0 "公聴会を開催します。"
 ve_rel_evt.4.a.tt:0 "宗教プロジェクトの進捗が減少します。 #N 3#!.\n宗教的居住地が増加します #P 3#!.\n#P 0.5%#! の人口のうち [SCOPE.sState('ve_evt_target_state').GetName] ロイヤリストになる。"
 ve_rel_evt.4.b:0 "扇動者を罰してください。"
 ve_rel_evt.4.b.tt:0 "宗教プロジェクトの進行状況は次のように増加します #P 4#!.\n宗教的居住地が減少します #N 3#!.\n#N 1%#!  [SCOPE.sState('ve_evt_target_state').GetName] "
 ve_rel_evt.4.c:0 "記録と結果を公開する。"
 ve_rel_evt.4.c.tt:0 "支出する #N 10#! 信心改革。\n宗教プロジェクトの進行状況は次のように増加します。 #P 2#!.\n宗教的居住地が増加します #P 1#!."

 ve_rel_evt.5.t:0 "説教の言葉"
 ve_rel_evt.5.d:0 "プロジェクト聖職者 [SCOPE.sState('ve_evt_target_state').GetName] 正式な説教は教義の統一性を保っているが、多くの信徒に届かないと報告している。地元の言語での説教がキャンペーンをさらに推進するだろうが、中央階層は適応が独立してしまうことを懸念している。"
 ve_rel_evt.5.f:0 "「聞いたことのない神聖な言葉は完全に保存され、誰にも受け入れられません。」"
 ve_rel_evt.5.a:0 "現地の言語で説教する。"
 ve_rel_evt.5.a.tt:0 "宗教プロジェクトの進捗状況は #P 6#!増加します。\n敬虔な人は #N 2年半の間、#! 1 #Y 承認を失います#!."
 ve_rel_evt.5.b:0 "典礼的統一を維持します。"
 ve_rel_evt.5.b.tt:0 "宗教プロジェクトの進捗状況は #N 3#!減少します。\n宗教的和解は #P 3#!増加します。\n敬虔な信者の利益 #P 1#! の承認 #Y 2年半#!."
 ve_rel_evt.5.c:0 "教育を受けた通訳者を訓練します。"
 ve_rel_evt.5.c.tt:0 "支出 #N 10#! 信心改革。\n宗教プロジェクトの進捗状況は #P 4#!増加します。\n宗教居住は #P 1#!増加します。"

 ve_rel_evt.6.t:0 "ライバルの教会当局"
 ve_rel_evt.6.d:0 "中央任命者と確立された地元聖職者 [SCOPE.sState('ve_evt_target_state').GetName] それぞれが告白回心を指示する権利を主張します。一方を支持すればすぐに指揮を回復できるかもしれないが、この論争はすでに誰が信仰を代弁するかを問う試練となっている。"
 ve_rel_evt.6.f:0 "「この争いは管轄権に関するものであり、それが機関が権力を表現する方法である。」"
 ve_rel_evt.6.a:0 "中央の聖職者を支持する。"
 ve_rel_evt.6.a.tt:0 "宗教プロジェクトの進行状況が #P 5#!増加します。\n敬虔な人々の利益 #P 1#! の承認 #Y 2.5 年#!。\n宗教的居住地が減少します #N 3#!.\n#N 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 急進的になります。"
 ve_rel_evt.6.b:0 "地元の聖職者を懐柔します。"
 ve_rel_evt.6.b.tt:0 "宗教プロジェクトの進捗状況は #N 4#!減少します。\n敬虔な人は #N 1#! 承認を失います。 #Y 2.5 年#!。\n宗教定住者は #P 3#!増加します。"
 ve_rel_evt.6.c:0 "その権限を書面で定義します。"
 ve_rel_evt.6.c.tt:0 "10 を費やします #N #! 信心改革。\n宗教プロジェクトの進捗状況は #P 3#!増加します。\n宗教定住数は #P 1#!増加します。"

 ve_cul_evt.3.t:0 "国勢調査のカテゴリ"
 ve_cul_evt.3.d:0 "の国勢調査職員 [SCOPE.sState('ve_evt_target_state').GetName] 国民の考え方に同意できない [SCOPE.sCulture('ve_evt_target_culture').GetName] 文化は記録されるべきです。ローカルの回答者は重複する ID を使用しますが、中央のフォームでは 1 つのボックスに 1 つの回答が必要です。"
 ve_cul_evt.3.f:0 "「カテゴリは国を簡素化するずっと前に台帳を簡素化します。」"
 ve_cul_evt.3.a:0 "自己識別を許可します。"
 ve_cul_evt.3.a.tt:0 "文化プロジェクトの進行状況は #N 4減少します#!.\n国家の結束力が増加します #P 4#!。"
 ve_cul_evt.3.b:0 "カテゴリは一元的に設定されます。"
 ve_cul_evt.3.b.tt:0 "文化プロジェクトの進行状況は次のように増加します。 #P 6#!.\n国家の結束力が減少します #N 4#!.\n#N 0.5%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] ラジカルになる。"
 ve_cul_evt.3.c:0 "最新のレジストリ システムを使用します。"
 ve_cul_evt.3.c.tt:0 " #N 10#! 文化的使命を費やします。\n文化的プロジェクトの進行状況は によって増加します #P 5#!.\n国家の団結力が増加します #P 1#!."

 ve_cul_evt.4.t:0 "市の著名人"
 ve_cul_evt.4.d:0 "自治体の常連客 [SCOPE.sState('ve_evt_target_state').GetName] オフィス、顧客、影響力を提供して、国民の平等な市民権を推進する [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口。彼らの協力は迅速に行われるでしょうが、その代償として地方の収入を継続的に支配することになります。"
 ve_cul_evt.4.f:0 "「市庁舎への最短の道は、いくつかの私有応接室を通過します。」"
 ve_cul_evt.4.a:0 "地元のネットワークを利用します。"
 ve_cul_evt.4.a.tt:0 "文化プロジェクトの進捗は次のとおり増加します。 #P 5#!。\n[SCOPE.sState('ve_evt_target_state').GetName] 2年間 #N 5%#! 納税能力を失う #Y 。#!開かれた評議会を創設する。"
 ve_cul_evt.4.b:0 "文化プロジェクトの進捗状況が"
 ve_cul_evt.4.b.tt:0 "3 #N 減少する。#!国民の団結力が #P 3#!増加する。"
 ve_cul_evt.4.c:0 "ルールに基づいた和解について交渉する。"
 ve_cul_evt.4.c.tt:0 " #N 10#! 文化的使命を費やします。\n文化的プロジェクトの進行状況は によって増加します #P 3#!.\n国家の団結力が #P 1増加します#!."

 ve_cul_evt.5.t:0 "公務員試験"
 ve_cul_evt.5.d:0 "公務員試験の開放 [SCOPE.sCulture('ve_evt_target_culture').GetName] 候補者たちは、法的な平等と実際的な準備との間にギャップがあることを明らかにしました。即時アクセスは象徴的に強力であるが、長年にわたる不平等な学校教育を法令でなくすことはできない。"
 ve_cul_evt.5.f:0 "「受験者が 1 人だけその言語を教えられた場合、同じ試験は同じ機会ではない。」"
 ve_cul_evt.5.a:0 "金融準備コース。"
 ve_cul_evt.5.a.tt:0 "支出する #N 15#! 文化的義務。\n文化プロジェクトの進捗状況は #P 5#!増加します。\n国家の団結は #P 2#!増加します。"
 ve_cul_evt.5.b:0 "平等なアクセスが直ちに開始されます。"
 ve_cul_evt.5.b.tt:0 "文化プロジェクトの進行状況は次のように増加します #P 7#!.\n国家の結束力が減少します #N 4#!.\n#N 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 急進的になる。"
 ve_cul_evt.5.c:0 "学校と福祉のネットワークを動員する。"
 ve_cul_evt.5.c.tt:0 "文化的使命を #N 10#! 支出する。\n文化プロジェクトの進捗状況が #P 5#!増加する。\n国民の団結度が #P 2#!増加する。"
 ve_cul_evt.5.e:0 "まず試験制度を改革する。"
 ve_cul_evt.5.e.tt:0 "文化プロジェクトの進捗状況が #N 4#!減少する。\n国家の結束力が #P 3増加する。#!."

 ve_cul_evt.6.t:0 "多数派が反発"
 ve_cul_evt.6.d:0 "市民権平等イニシアチブの反対者は、共通の権利を国民に拡大すると主張している。 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口が増えると他の人の地位が低下します。でのデモ [SCOPE.sState('ve_evt_target_state').GetName] 行政改革を国政の試練に変えようとしている。"
 ve_cul_evt.6.f:0 "「共有された権利は、特権が盗まれたと表現されています。」"
 ve_cul_evt.6.a:0 "率直にイニシアチブを擁護してください。"
 ve_cul_evt.6.a.tt:0 "文化プロジェクトの進行状況は次のように増加します #P 4#!.\n国家の結束力が減少します #N 4#!.\n#N 1%#!  [SCOPE.sState('ve_evt_target_state').GetName] 急進的になります。"
 ve_cul_evt.6.b:0 "実施のペースを低下させます。"
 ve_cul_evt.6.b.tt:0 "文化プロジェクトの進捗状況は #N 5#!減少します。\n国家の団結力は #P 3増加します#!."
 ve_cul_evt.6.c:0 "改革連合を動員する."
 ve_cul_evt.6.c.tt:0 "支出する #N 10#! 文化的使命。\n文化プロジェクトの進捗状況は #P 3#!増加します。\n国家の団結力は増加します。 #P 2#!.\n#P 0.5%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] "

 ve_rel_evt.7.t:0 "限界点にある使命"
 ve_rel_evt.7.d:0 "における告白回心 [SCOPE.sState('ve_evt_target_state').GetName] 行政的にも政治的にも崩壊に近づいています。各政府機関は互いに返答をしなくなり、国民の抵抗は強まり、現場の聖職者らはこのままでは任務を継続できないと警告している。"
 ve_rel_evt.7.f:0 "「報道では依然として一時的な困難とされています。街路はより厳しい名前を選択しました。」"
 ve_rel_evt.7.a:0 "損失を受け入れて撤回してください。"
 ve_rel_evt.7.a.tt:0 "敬虔改革の返金なしで宗教プロジェクトをキャンセルします。\n宗教和解は  #N 5#! 減少します。\n #Y 2年#!: #N -50#! 官僚主義、 #N -50#! 権威と、 #N -3%#! 法律制定の成功."
 ve_rel_evt.7.b:0 "緊急リソースの移転."
 ve_rel_evt.7.b.tt:0 "支出 #N 25#! 信心改革。\n宗教プロジェクトの進捗状況は #N 5#!減少します。\n#N 1%#! の人口のうち [SCOPE.sState('ve_evt_target_state').GetName] \nプロジェクトは続行されます。"
 ve_rel_evt.7.c:0 "スケルトンスタッフを使用して続行します。"
 ve_rel_evt.7.c.tt:0 "宗教プロジェクトの進行状況は によって減少します。 #N 10#!.\n宗教的居住地が減少します #N 2#!.\nプロジェクトは継続します。"
 ve_rel_evt.7.e:0 "方法を再交渉してください。"
 ve_rel_evt.7.e.tt:0 " #N 15#! 信心改革を費やします。\n宗教プロジェクトの進行状況は #N 3減少します#!.\n宗教的居住地が #P 2#!増加します。\n#N 0.5%#! の人口のうち [SCOPE.sState('ve_evt_target_state').GetName] \nプロジェクトは続行されます。"

 ve_cul_evt.7.t:0 "この取り組みは正当性を失う"
 ve_cul_evt.7.d:0 "における平等市民権イニシアチブ [SCOPE.sState('ve_evt_target_state').GetName] 既存の機関と政府の両方からの支持を失いつつあります。 [SCOPE.sCulture('ve_evt_target_culture').GetName] それが提供することを目的としたコミュニティ。急進的な運動は現在、政府が平等を実現できない証拠としてあらゆる妥協を描いています。"
 ve_cul_evt.7.f:0 "「改革は反対に耐えられるかもしれません。信じられないものになっても生き残ることはできません。」"
 ve_cul_evt.7.a:0 "取り組みを終了してください。"
 ve_cul_evt.7.a.tt:0 "文化的義務の払い戻しなしで文化プロジェクトを中止してください。\n国民の団結力は によって減少します #N 5#!.\n #Y 2 年間#!: #N -50#! 官僚、 #N -25#! 権威と、 #N -3%#! 法律制定の成功。"
 ve_cul_evt.7.b:0 "地方に緊急交付金を発行する。"
 ve_cul_evt.7.b.tt:0 "過ごす #N 25#! 文化的使命。\n文化的プロジェクトの進行状況は によって減少します #N 5#!.\n#N 1%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] \nプロジェクトは続行されます。"
 ve_cul_evt.7.c:0 "最小限のプログラムを続行してください。"
 ve_cul_evt.7.c.tt:0 "文化プロジェクトの進捗が #N 10#!減少します。\n国民の団結力が #N 2#!減少します。\nプロジェクトは続行します。"
 ve_cul_evt.7.e:0 "連合を再構築します。"
 ve_cul_evt.7.e.tt:0 "支出 #N 15#! 文化的使命。\n文化プロジェクトの進捗状況は #N 3#!減少します。\n国家の団結力は #P 2#!増加します。\n#N 0.5%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] \nプロジェクトは続行されます。"

 ve_rel_evt.8.t:0 "予期せぬ地元の一致"
 ve_rel_evt.8.d:0 "聖職者、自治体職員、地域の長老たち [SCOPE.sState('ve_evt_target_state').GetName] 中央指令では成し得なかった合意に達しました。地元の抵抗は後退し、諸会衆が自ら伝道活動を調整しており、告白改宗は予想外の勢いを増している。"
 ve_rel_evt.8.f:0 "「王都からの命令で始まったものが、街の広場で作られたコンパクトになった。」"
 ve_rel_evt.8.a:0 "この勢いを最大限に活用してください。"
 ve_rel_evt.8.a.tt:0 "宗教集落が  #P 1#! 増加します。\n宗教プロジェクトの進捗状況が  #P 25#! 増加します。\n進捗が次のレベルに達すると、 #Y 100#!、プロジェクトの通常の完了効果が適用されます。"
 ve_rel_evt.8.b:0 "スピードよりも耐久性。"
 ve_rel_evt.8.b.tt:0 "宗教的居住地が増加します #P 4#!.\n宗教プロジェクトの進行状況は次のように増加します #P 10#!。\n進捗状況が  #Y 100#! に達すると、プロジェクトの通常の完了効果が適用されます。"

 ve_cul_evt.8.t:0 "地方市民連合"
 ve_cul_evt.8.d:0 "教師、自治体職員、業界団体、団体の代表者 [SCOPE.sCulture('ve_evt_target_culture').GetName] のコミュニティ [SCOPE.sState('ve_evt_target_state').GetName] 共通の委員会を結成しました。紛争が首都に到達する前に解決することで、この連合は、政府が作り出すことのできなかった市民権平等イニシアチブに勢いを与えた。"
 ve_cul_evt.8.f:0 "「ほとんど同じテーブルを共有しなかった機関が責任を共有し始めたとき、市民権が現実のものになりました。」"
 ve_cul_evt.8.a:0 "連合の勢いを利用しましょう。"
 ve_cul_evt.8.a.tt:0 "国民の団結力は次のように増加します #P 1#!.\n文化プロジェクトの進行状況は によって増加します #P 25#!.\n進行状況が 25 に達した場合 #Y 100#!、プロジェクトの通常の完了効果が適用されます。"
 ve_cul_evt.8.b:0 "機関を恒久的にします。"
 ve_cul_evt.8.b.tt:0 "国民の団結力は次のように増加します #P 4#!.\n文化プロジェクトの進行状況は次のように増加します #P 10#!.\n進行状況が次の目標に達した場合 #Y 100#!、プロジェクトの通常の完了効果が適用されます。"

 ve_rel_evt.40.t:0 "ステップ外のレコード"
 ve_rel_evt.40.d:0 "地方の登録 [SCOPE.sState('ve_evt_target_state').GetName] 会衆、市民団体、公共機関に対して互換性のないカテゴリを使用する。首都に届いた報告書は現在互いに矛盾しており、プロジェクトは順守か抵抗かを区別できなくなっている。"
 ve_rel_evt.40.f:0 "「3 つの台帳を通じてポリシーを管理すると、すぐに 3 つの異なる現実が生じます。」"
 ve_rel_evt.40.a:0 "中央監査を送信します。"
 ve_rel_evt.40.a.tt:0 "過ごす #N 10#! 信心改革。\n宗教プロジェクトの進行状況は次のように増加します。 #P 5#!.\n宗教的居住地が #P 1増加します#!."
 ve_rel_evt.40.b:0 "ローカルで記録を調整します。"
 ve_rel_evt.40.b.tt:0 "宗教プロジェクトの進行状況は #N 3#!減少します。\n宗教集落は #P 2増加します#!."
 ve_rel_evt.40.c:0 "標準のレジストリ手順を適用します。"
 ve_rel_evt.40.c.tt:0 "支出 #N 5#! 信心改革。\n宗教プロジェクトの進行状況は によって増加します #P 4#!.\n宗教的居住地が #P 1#!増加します。"

 ve_rel_evt.41.t:0 "地方の職員不足"
 ve_rel_evt.41.d:0 "プロジェクトを指揮するオフィス [SCOPE.sState('ve_evt_target_state').GetName] 十分な訓練を受けた事務員、教師、検査官を見つけることができません。指令は地方当局が解釈できるよりも速いスピードで蓄積されており、急いで任命するとあらゆる紛争がさらに悪化する恐れがある。"
 ve_rel_evt.41.f:0 "「法令は 1 日で届きました。それを実行できる人々には 1 世代かかるかもしれません。」"
 ve_rel_evt.41.a:0 "新しい幹部に資金を提供します。"
 ve_rel_evt.41.a.tt:0 "支出してください。 #N 15#! 信心改革。\n宗教プロジェクトの進行状況が #P 6増加します#!."
 ve_rel_evt.41.b:0 "実装を遅らせます。"
 ve_rel_evt.41.b.tt:0 "宗教プロジェクトの進行状況は #N 6#!減少します。\n宗教居住地は #P 2増加します#!."
 ve_rel_evt.41.c:0 "既存の教育ネットワークを利用する。"
 ve_rel_evt.41.c.tt:0 "支出する #N 10#! 信心改革。\n宗教プロジェクトの進行状況は によって増加します #P 5#!.\n宗教的居住地が #P 1#!増加します。"

 ve_rel_evt.42.t:0 "地区全体の噂"
 ve_rel_evt.42.d:0 "の噂 [SCOPE.sState('ve_evt_target_state').GetName] このプロジェクトには政府が発表したものよりもはるかに厳しい措置が隠蔽されていると主張している。宗教主催者と地元の扇動者は矛盾した話を繰り返す一方、政府の沈黙により、それぞれの新しいバージョンが広まる余地が与えられる。"
 ve_rel_evt.42.f:0 "「噂には事務所も予算も署名も必要ありません。\\""
 ve_rel_evt.42.a:0 "報告書を発行します。"
 ve_rel_evt.42.a.tt:0 "宗教プロジェクトの進捗状況は #N 3#!減少します。\n宗教集落は #P 4増加します#!."
 ve_rel_evt.42.b:0 "動揺を鎮めます。"
 ve_rel_evt.42.b.tt:0 "宗教プロジェクトの進捗状況は #P 5#!増加します。\n宗教集落は #N 3減少します#!.\n#N 人口の 1%#!  [SCOPE.sState('ve_evt_target_state').GetName] 急進派になります。"
 ve_rel_evt.42.c:0 "地元の調停者を委託します。"
 ve_rel_evt.42.c.tt:0 "支出 #N 10#! 信心改革。\n宗教プロジェクトの進行状況は によって増加します #P 4#!.\n宗教的居住地が増加します #P 2#!.\n#P 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] ロイヤリストになる。"

 ve_rel_evt.43.t:0 "限界点にある政権"
 ve_rel_evt.43.d:0 "におけるプロジェクト [SCOPE.sState('ve_evt_target_state').GetName] 行政崩壊が近づいています。地方自治体は圧倒され、国民の信頼は崩壊し、組織的な反対派は現在、新たな指令を政府がコントロールを失っている証拠として扱っています。"
 ve_rel_evt.43.f:0 "「ファイルの移動が停止すると、危機が街頭に広がります。」"
 ve_rel_evt.43.a:0 "プログラムを終了します。"
 ve_rel_evt.43.a.tt:0 "敬虔改革の返金なしで宗教プロジェクトをキャンセルします。\n宗教和解は によって減少します。 #N 5#!.\n #Y 2 年間#!: #N -50#! 官僚、 #N -50#! 権威と、 #N -3%#! 法律制定の成功。"
 ve_rel_evt.43.b:0 "緊急リソースを転送します。"
 ve_rel_evt.43.b.tt:0 "支出 #N 25#! 信心改革。\n宗教プロジェクトの進捗状況が減少します。 #N 5#!.\n#N 1%#! の人口のうち [SCOPE.sState('ve_evt_target_state').GetName] \nプロジェクトは続行されます。"
 ve_rel_evt.43.c:0 "スケルトンスタッフを使用して続行します。"
 ve_rel_evt.43.c.tt:0 "宗教プロジェクトの進行状況は によって減少します。 #N 10#!.\n宗教的居住地が #N 2減少します#!。\nプロジェクトは継続します。"
 ve_rel_evt.43.e:0 "地元のパートナーシップを再構築します。"
 ve_rel_evt.43.e.tt:0 "支出 #N 15#! 敬虔な改革。\n宗教プロジェクトの進行状況が減少します。 #N 3#!.\n宗教的居住地が増加します #P 2#!.\n#N 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 急進的になります。\nプロジェクトは継続します。"

 ve_rel_evt.100.t:0 "宗教間評議会の議席"
 ve_rel_evt.100.d:0 "代表者 [SCOPE.sState('ve_evt_target_state').GetName] 宗教間評議会は必要だが、誰が議席に値するかについては必要ではないことに同意する。比例代表制は小規模なコミュニティを安心させる一方、首都に設計された定住地はすぐに作業を開始できる。"
 ve_rel_evt.100.f:0 "「椅子が数えられるまで全員が共通のテーブルを支持する。」"
 ve_rel_evt.100.a:0 "代表を人口ごとに配分する。"
 ve_rel_evt.100.a.tt:0 "宗教プロジェクトの進捗は次の割合で減少する。 #N 3#!.\n宗教的居住地が #P 4#!増加します。"
 ve_rel_evt.100.b:0 "固定の中央妥協案を課します。"
 ve_rel_evt.100.b.tt:0 "宗教プロジェクトの進捗状況が #P 5増加します#!.\n宗教的居住地が #N 2#!減少します。\n#N 0.5%#! の人口のうち [SCOPE.sState('ve_evt_target_state').GetName] ラジカルになる。"
 ve_rel_evt.100.c:0 "諸宗教評議会に権限を与えます。"
 ve_rel_evt.100.c.tt:0 "過ごす #N 10#! 信心改革。\n宗教プロジェクトの進行状況は次のように増加します。 #P 5#!.\n宗教的居住地が #P 2#!増加します。"

 ve_rel_evt.101.t:0 "共通の学校カリキュラム"
 ve_rel_evt.101.d:0 "の学校 [SCOPE.sState('ve_evt_target_state').GetName] フリーダム・アウトリーチを地元の信仰に反するキャンペーンに変えずに、市民に共通の教訓を与える必要がある。教師たちは明確な教材と共同トレーニングを要求する一方、地域の指導者たちは地元の指導に伝統を残す余地を残すよう主張する。"
 ve_rel_evt.101.f:0 "「共有授業は、すべての家族が教室を自分のものだと認識した場合にのみ成功します。」"
 ve_rel_evt.101.a:0 "共通の教育幹部に資金を提供します。"
 ve_rel_evt.101.a.tt:0 "支出 #N 15#! 敬虔な改革。\n宗教プロジェクトの進捗状況は #P 6#!増加します。\n宗教定住地は #P 1#!増加します。"
 ve_rel_evt.101.b:0 "ローカル カリキュラムのための余地を残します。"
 ve_rel_evt.101.b.tt:0 "宗教プロジェクトの進捗状況は 減少します。 #N 4#!.\n宗教定住数が #P 3#!増加します。"
 ve_rel_evt.101.c:0 "改革連合を学校に導入します。"
 ve_rel_evt.101.c.tt:0 "10を費やします #N #! 敬虔な改革。\n宗教プロジェクトの進行状況が #P 5#!増加します。\n宗教集落が #P 2#!増加します。\n#P 0.5%#! の人口のうち [SCOPE.sState('ve_evt_target_state').GetName] "

 ve_rel_evt.102.t:0 "相互保証憲章"
 ve_rel_evt.102.d:0 "宗教団体、地方自治体職員、改革団体 [SCOPE.sState('ve_evt_target_state').GetName] 共通憲章を起草しました。各署名者は、地域社会が地方機関から排除されないという公的保証と引き換えに、同じ市民的義務を受け入れます。"
 ve_rel_evt.102.f:0 "「すべての約束が他の当事者の権利として書かれたとき、信頼が可能になりました。」"
 ve_rel_evt.102.a:0 "コンパクトの勢いを利用します。"
 ve_rel_evt.102.a.tt:0 "宗教的居住地が #P 2#!増加します。\n宗教プロジェクトの進捗状況が #P 20#!増加します。\n進捗状況が #Y 100#!に達すると、プロジェクトの通常の完了効果が適用されます。"
 ve_rel_evt.102.b:0 "保証を永続的にします。"
 ve_rel_evt.102.b.tt:0 "宗教的居住地は #P 4#!増加します。\n#P 0.5%#! の人口のうち [SCOPE.sState('ve_evt_target_state').GetName] ロイヤリストになります。\n宗教プロジェクトの進行状況は によって増加します #P 10#!.\n進行状況が次の目標に達した場合 #Y 100#!、プロジェクトの通常の完了効果が適用されます。"

 ve_rel_evt.150.t:0 "教師ですか、それとも監督官ですか?"
 ve_rel_evt.150.d:0 "における世俗化キャンペーン [SCOPE.sState('ve_evt_target_state').GetName] 読み書きができる人材の不足が明らかになった。行政は、長期的な市民能力を構築する教育部隊を拡大することも、すでに用意されているスタッフで新しい規則を施行できる検査官に頼ることもできます。"
 ve_rel_evt.150.f:0 "「検査官は午後に学校を閉鎖することもできます。そこで教えられた内容を教師が置き換えるには何年もかかる場合があります。\」"
 ve_rel_evt.150.a:0 "教育部隊を拡大します。"
 ve_rel_evt.150.a.tt:0 " #N 15#! 敬虔改革を費やします。\n宗教プロジェクトの進行状況は #P 6#!増加します。"
 ve_rel_evt.150.b:0 "既存のスタッフに合わせてプログラムの速度を落とします。"
 ve_rel_evt.150.b.tt:0 "宗教プロジェクトの進行状況が減少します #N 5#!.\n宗教的居住地が増加します #P 2#!."
 ve_rel_evt.150.c:0 "公教育ネットワークを委託する。"
 ve_rel_evt.150.c.tt:0 "過ごす #N 10#! 信心改革。\n宗教プロジェクトの進行状況は次のように増加します。 #P 5#!.\n宗教的居住地が #P 1増加します#!."

 ve_rel_evt.151.t:0 "押収された財産"
 ve_rel_evt.151.d:0 "旧宗教施設 [SCOPE.sState('ve_evt_target_state').GetName] 学校、診療所、市役所への転換の準備を整えてください。即時移籍は陣営に貴重なインフラを与えることになるが、補償金がないことが敬虔派の結集点になりつつある。"
 ve_rel_evt.151.f:0 "「ある朝、鍵の所有者が変わった。所有権をめぐる議論は鍵がなくなるまで長引くだろう。」"
 ve_rel_evt.151.a:0 "段階的に補償金を支払う。"
 ve_rel_evt.151.a.tt:0 "過ごす #N 15#! 信心改革。\n宗教プロジェクトの進行状況は次のように増加します。 #P 3#!.\n宗教的居住地が #P 3増加します#!."
 ve_rel_evt.151.b:0 "財産を直ちに公共サービスに投入します。"
 ve_rel_evt.151.b.tt:0 "宗教プロジェクトの進捗状況は #P 7#!増加します。\n宗教居住地は #N 4減少します#!.\n#N 人口の 1%#!  [SCOPE.sState('ve_evt_target_state').GetName] 急進的になります。\n敬虔な人は #N 1#! 承認を失います #Y 2.5年#!"
 ve_rel_evt.151.c:0 "世俗の福祉施設に移送する。"
 ve_rel_evt.151.c.tt:0 "過ごす #N 10#! 信心改革。\n宗教プロジェクトの進行状況は次のように増加します。 #P 5#!.\n宗教的居住地が #P 2増加します#!.\n#P 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] "

 ve_rel_evt.152.t:0 "市民団体が根付く"
 ve_rel_evt.152.d:0 "教師サークル、互助会、地方自治体協会が組織される [SCOPE.sState('ve_evt_target_state').GetName] かつて宗教団体を通じて組織されたサービスの提供を開始した。彼らの協力により、世俗化キャンペーンは単なる行政的な存在ではなく、地域の市民基盤となった。"
 ve_rel_evt.152.f:0 "「新しい秩序は、国民が査察官を待たずに維持し始めたときに存続しました。」"
 ve_rel_evt.152.a:0 "地元の勢いを利用する。"
 ve_rel_evt.152.a.tt:0 "宗教的居住地が増加します #P 2#!.\n宗教プロジェクトの進行状況は次のように増加します #P 20#!.\n進行状況が次の目標に達した場合 #Y 100#!の場合、プロジェクトの通常の完了効果が適用されます。"
 ve_rel_evt.152.b:0 "協会を恒久的な機関に変えます。"
 ve_rel_evt.152.b.tt:0 "宗教的居住地が #P 4#!増加します。\n宗教プロジェクトの進捗状況が #P 10#!増加します。\n進捗状況が次の値に達すると、 #Y 100#!、プロジェクトの通常完了効果が適用されます。"

 ve_cul_evt.40.t:0 "地方教育委員会"
 ve_cul_evt.40.d:0 "の教育委員会 [SCOPE.sState('ve_evt_target_state').GetName] ～の場所について同意しない [SCOPE.sCulture('ve_evt_target_culture').GetName] 公共指導における言語。地元の言語を教えれば信頼が保たれる一方、行政言語が単一であれば国家プロジェクトの指揮が容易になるだろう。"
 ve_cul_evt.40.f:0 "「最初のレッスンで選択した言語によって、その学校が自分たちのものだと誰が信じるかが決まります。」"
 ve_cul_evt.40.a:0 "地元の言語を保護します。"
 ve_cul_evt.40.a.tt:0 "文化プロジェクトの進行状況は #N 4#!減少します。\n国家の団結力は #P 3#!増加します。"
 ve_cul_evt.40.b:0 "1 つの行政言語を課します。"
 ve_cul_evt.40.b.tt:0 "文化プロジェクトの進行状況は次のように増加します #P 5#!.\n国家の結束力が減少します #N 2#!.\n#N 0.5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] ラジカルになる。"
 ve_cul_evt.40.c:0 "教師のネットワークを拡大します。"
 ve_cul_evt.40.c.tt:0 " #N 10#! 文化的任務を費やします。\n文化的プロジェクトの進行状況は #P 4増加します#!.\n国家の結束力が増加します #P 2#!。"

 ve_cul_evt.41.t:0 "統計的境界"
 ve_cul_evt.41.d:0 "当局による測量 [SCOPE.sState('ve_evt_target_state').GetName] どこで同意できないか [SCOPE.sCulture('ve_evt_target_culture').GetName] コミュニティが始まり、終わる。地域のアイデンティティは、言語、地域、慣習を超えて重複していますが、国家プロジェクトでは、数えて管理できるカテゴリーが必要です。"
 ve_cul_evt.41.f:0 "\\"国勢調査のために引かれた境界線にはすぐに役人、予算、そして擁護者が集まります。\\""
 ve_cul_evt.41.a:0 "自己識別の余地を残してください。"
 ve_cul_evt.41.a.tt:0 "文化プロジェクトの進捗状況は  #N 3#! 減少します。\n国民の団結力は  #P 3#! 増加します。"
 ve_cul_evt.41.b:0 "センターに境界を定義させましょう。"
 ve_cul_evt.41.b.tt:0 "文化プロジェクトの進捗状況は #P 6#!増加します。\n国家の団結力は #N 3#!減少します。\n#N 0.5%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] ラジカルになる。"
 ve_cul_evt.41.c:0 "標準のレジストリ システムを使用します。"
 ve_cul_evt.41.c.tt:0 "過ごす #N 10#! 文化的使命。\n文化的プロジェクトの進行状況は次のように増加します。 #P 5#!.\n国家の団結力が #P 1増加します#!."

 ve_cul_evt.42.t:0 "限界点にある国家プロジェクト"
 ve_cul_evt.42.d:0 "国家プロジェクトとしては、 [SCOPE.sState('ve_evt_target_state').GetName] 崩壊が近づいています。急進的な運動は、政府が政府を裏切った、または裏切ったと主張している。 [SCOPE.sCulture('ve_evt_target_culture').GetName] "
 ve_cul_evt.42.f:0 "「強制と降伏の両方で攻撃された和解は、間もなく和解ではなくなるかもしれない。\」"
 ve_cul_evt.42.a:0 "プロジェクトを終了する。"
 ve_cul_evt.42.a.tt:0 "文化委任の返金なしで文化プロジェクトを中止する。\n国民の団結力は  #N 5#! 減少する。\n期間  #Y 2 年間#!: #N -50#! 官僚制、 #N -25#! 権威、および #N -3%#! 法律制定の成功。"
 ve_cul_evt.42.b:0 "緊急の地域リソースを移転します。"
 ve_cul_evt.42.b.tt:0 "支出 #N 25#! 文化的使命。\n文化プロジェクトの進行状況が #N 5#!減少します。\n#N 1%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] \nプロジェクトは続行されます。"
 ve_cul_evt.42.c:0 "最小限のプログラムを継続します。"
 ve_cul_evt.42.c.tt:0 "文化プロジェクトの進行状況は次のように減少します。 #N 10#!.\n国家の団結力が減少します #N 2#!。\nプロジェクトは続行します。"
 ve_cul_evt.42.e:0 "交渉枠組みを再構築します。"
 ve_cul_evt.42.e.tt:0 "15 #N 文化的使命を費やします。#! 文化的プロジェクトの進行状況は #N 3減少します。#!.\n国家の結束力が増加します #P 2#!.\n#N 0.5%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] \nプロジェクトは継続します。"

 ve_cul_evt.50.t:0 "姓と言語に関する指令"
 ve_cul_evt.50.d:0 "政府当局者 [SCOPE.sState('ve_evt_target_state').GetName] 姓と公文書を国語で標準化することを提案する。ディレクティブにより、 [SCOPE.sCulture('ve_evt_target_culture').GetName] 中央政府にとっては人口を分類するのは容易だが、家族は個人のアイデンティティが国家の命令の対象になりつつあることを懸念している。"
 ve_cul_evt.50.f:0 "「登録簿に別の方法で書かれた名前でも、家族が覚えている名前として残っている可能性があります。」"
 ve_cul_evt.50.a:0 "段階的な登録キャンペーンに資金を提供します。"
 ve_cul_evt.50.a.tt:0 " #N 10#! 文化的使命を費やします。\n文化的プロジェクトの進行状況は によって増加します #P 4#!.\n国家の結束力が #P 1増加します#!.\n#N 0.5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] ラジカルになる。"
 ve_cul_evt.50.b:0 "1 つの国家基準を強制します。"
 ve_cul_evt.50.b.tt:0 "文化プロジェクトの進行状況は次のように増加します #P 7#!.\n国家の団結力が #N 4減少します#!.\n#N 1%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] 急進的になります。"
 ve_cul_evt.50.c:0 "改訂指令を撤回します。"
 ve_cul_evt.50.c.tt:0 "文化プロジェクトの進行状況が #N 5#!減少します。\n国民の団結力が #P 3増加します#!."

 ve_cul_evt.51.t:0 "徴兵登録簿"
 ve_cul_evt.51.d:0 "国内の軍関係者 [SCOPE.sState('ve_evt_target_state').GetName] 奉仕義務、姓、命令を単一の記録簿に記録することを要求します。それを適用すると、 [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口は民族統合の推進を強化するだろうが、軍隊を文化消去のもう一つの手段とみなすコミュニティの間で抵抗が高まっている。"
 ve_cul_evt.51.f:0 "「国は、税金を徴収したり、息子たちを召喚したりするときに、最初に村の名前を知ります。」"
 ve_cul_evt.51.a:0 "国家登録簿を適用します。"
 ve_cul_evt.51.a.tt:0 "文化プロジェクトの進行状況は #P 5#!増加します。\n国家の団結力は #N 2#!減少します。\n#N 0.5%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] ラジカルになる。"
 ve_cul_evt.51.b:0 "ローカル登録慣行を維持します。"
 ve_cul_evt.51.b.tt:0 "文化プロジェクトの進捗が #N 3減少#!.\n国家の結束力が増加します #P 3#!。"
 ve_cul_evt.51.c:0 "兵役を通じてレジスターを統合します。"
 ve_cul_evt.51.c.tt:0 "支出 #N 10#! 文化的使命。\n文化的プロジェクトの進行状況は次のように増加します。 #P 6#!.\n国家の団結力が #P 1増加します#!.\n#N 0.5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] 急進的になる。"

 ve_cul_evt.100.t:0 "憲法制定代表団"
 ve_cul_evt.100.d:0 "からの代表団 [SCOPE.sCulture('ve_evt_target_culture').GetName] のコミュニティ [SCOPE.sState('ve_evt_target_state').GetName] 憲法制定協定の機関に代表を求める要求が到着した。交渉はプロジェクトの進行を遅らせることになるが、その正当性は強化されるだろう。資本から課せられた和解は、信頼を犠牲にしてより早く進む可能性がある。"
 ve_cul_evt.100.f:0 "「協定書は、すべての有権者が自分たちが作成に協力した条項を指摘できる場合にのみ一般的になります。」"
 ve_cul_evt.100.a:0 "コンパクト内での位置を交渉します。"
 ve_cul_evt.100.a.tt:0 "文化プロジェクトの進行状況が #N 4#!減少します。\n国家の結束力が #P 4#!増加します。"
 ve_cul_evt.100.b:0 "中央入植地を占領します。"
 ve_cul_evt.100.b.tt:0 "文化プロジェクトの進行状況が #P 5#!増加します。\n国家の結束力が #N 2#!減少します。\n#N 0.5%#! の [SCOPE.sCulture('ve_evt_target_culture').GetName] の人口 [SCOPE.sState('ve_evt_target_state').GetName] ラジカルになる。"
 ve_cul_evt.100.c:0 "議会連合を交渉に参加させる。"
 ve_cul_evt.100.c.tt:0 "支出する #N 10#! 文化的使命。\n文化的プロジェクトの進行状況は次のように増加します。 #P 4#!.\n国家の団結力が #P 2増加します#!."

 ve_cul_evt.101.t:0 "二重管理"
 ve_cul_evt.101.d:0 "憲法制定協定 [SCOPE.sState('ve_evt_target_state').GetName] 現在、2 つの重複する政権に依存しています。中央政府関係者とその代表者 [SCOPE.sCulture('ve_evt_target_culture').GetName] 国の官僚制度が疲弊に近づく中、コミュニティの重複登録、任命の争い、矛盾した指示の発行。"
 ve_cul_evt.101.f:0 "「2 つの官庁はファイルキャビネットを共有するよりも簡単に権限を共有できる。」"
 ve_cul_evt.101.a:0 "共同管理スタッフに資金を提供する。"
 ve_cul_evt.101.a.tt:0 "支出  #N 15#! 文化的使命。\n文化的プロジェクトの進行状況が #P 6#!増加します。"
 ve_cul_evt.101.b:0 "オフィスが同意するまで圧縮を遅らせます。"
 ve_cul_evt.101.b.tt:0 "文化プロジェクトの進捗が #N 6減少#!.\n国家の結束力が #P 2#!増加します。"
 ve_cul_evt.101.c:0 "公務員の下にある事務所を統合します。"
 ve_cul_evt.101.c.tt:0 "文化的使命を #N 10#! 費やします。\n文化プロジェクトの進捗状況が #P 5#!増加します。\n国家の結束力が #P 2#!増加します。"

 ve_cul_evt.150.t:0 "地方での実施"
 ve_cul_evt.150.d:0 "州政府は、全国的な文化プロジェクトが根本的に異なる速度で進んでいると報告している。一部の官庁は資金提供された実施委員会を要求していますが、他の官庁は、すべての地域に単一のスケジュールを強制することは不足の人員を消耗し、国民の信頼を弱めることになると警告しています。"
 ve_cul_evt.150.f:0 "「国家法令は一度作成されますが、それは国のすべての官庁で実施されなければなりません。\」"
 ve_cul_evt.150.a:0 "実施委員会に資金を提供してください。"
 ve_cul_evt.150.a.tt:0 "支出 #N 10#! 文化的使命。\n文化プロジェクトの進捗は #P 5#!増加します。"
 ve_cul_evt.150.b:0 "段階的なスケジュールを使用してください。"
 ve_cul_evt.150.b.tt:0 "文化プロジェクトの進捗は #N 4減少します。#!.\n国家の結束力が #P 2#!増加します。"
 ve_cul_evt.150.c:0 "既存の行政を標準化します。"
 ve_cul_evt.150.c.tt:0 "文化的使命を #N 5#! 支出します。\n文化プロジェクトの進捗が #P 3#!増加します。\n国家の結束力が #P 2#!増加します。"

 ve_cul_evt.151.t:0 "指導言語"
 ve_cul_evt.151.d:0 "全国カリキュラムでは共通の指導言語が必要ですが、全国の学校は言語の伝統が大きく異なる地域社会にサービスを提供しています。多言語教材は信頼を保つが配布が遅れる一方、単一のカリキュラムではすぐに教室に届く可能性があるが、教育を文化コンテストに変える危険がある。"
 ve_cul_evt.151.f:0 "「生徒が不信感を抱く言語で教えられた授業は、その主題以外のすべてのことについて記憶に残る可能性がある。」"
 ve_cul_evt.151.a:0 "多言語教材に資金を提供する。"
 ve_cul_evt.151.a.tt:0 "支出 #N 10#! 文化的使命。\n文化的プロジェクトの進行状況は次のように増加します。 #P 3#!.\n国家の結束力が増加します #P 3#!."
 ve_cul_evt.151.b:0 "1 つの国内カリキュラムを適用します。"
 ve_cul_evt.151.b.tt:0 "文化プロジェクトの進捗状況は #P 6#!増加します。\n国家の団結力は #N 3#!減少します。"
 ve_cul_evt.151.c:0 "教育と福祉のネットワークを統合します。"
 ve_cul_evt.151.c.tt:0 " #N 10#! 文化的使命を費やします。\n文化的プロジェクトの進行状況は によって増加します #P 5#!.\n国家の団結力が #P 2増加します#!."

 ve_cul_evt.160.t:0 "国家を代表するのは誰か?"
 ve_cul_evt.160.d:0 "共有シンボル プロジェクトは、誰の歴史、制服、記念碑、儀式が国全体を代表できるのかという問題を再び問い直しました。伝統を交代させると認識は広がるが、合意は遅くなるだろう。公式の物語を 1 つ選択すると、多くの国民がそこから外れる一方で明確さが生まれます。"
 ve_cul_evt.160.f:0 "「シンボルは、説明を必要とせずに国民がその中に自分自身を映したときにのみ国家的になります。」"
 ve_cul_evt.160.a:0 "公の場でシンボルを回転させます。"
