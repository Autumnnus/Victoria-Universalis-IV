l_japanese:
 ve_je_religious_project:0 "宗教事業"
 ve_je_religious_project_reason:0 "政府は長期的な宗教事業を主導しています。その進捗は、行政力、政治的正当性、宗教的状況、および標的国の動向によって左右されます。"
 ve_je_religious_project_progress:0 "完了に向けた宗教事業の進捗"
 ve_je_religious_project_status_confessional:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName]における告白教化は、組織化された運動を通じて国教の拡大を図っています。\n\n#Y 125#!の進捗で完了：標的国の人口の5%を国教に改宗させ、信仰改革力#P 20#!を返還し、宗教的和解を#P 5#!追加します。"
 ve_je_religious_project_status_freedom:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName]における自由啓発活動は、良心と自発的な結社に基づく和解を構築しています。\n\n#Y 100#!の進捗で完了：強制改宗なしで体制派のPOPを追加し、信仰改革力#P 20#!を返還し、宗教的和解を#P 7#!追加します。"
 ve_je_religious_project_status_secularization:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName]における世俗化運動は、組織化された宗教の公的権威を縮小させています。\n\n#Y 150#!の進捗で完了：標的国の人口の5%を無神論に改宗させ、信仰改革力#P 25#!を返還し、宗教的和解を#P 8#!追加します。"
 ve_je_religious_project_complete_tt:0 "宗教事業が目標に到達しました。"
 ve_je_religious_project_fail_tt:0 "宗教事業は中止されました。"

 ve_je_cultural_project:0 "文化事業"
 ve_je_cultural_project_reason:0 "政府は長期的な文化事業を主導しています。行政力、正当性、教育、国家結束、および現地の状況がそのペースを決定します。"
 ve_je_cultural_project_progress:0 "完了に向けた文化事業の進捗"
 ve_je_cultural_project_status_curriculum:0 "国の学校および制度に向けて国家カリキュラムが準備されています。\n\n#Y 100#!の進捗で完了：文化政策力#P +20#!、国家結束#P +5#!、ならびに教育機会+2%、資格取得+5%、行政力-25の10年間の効果。"
 ve_je_cultural_project_status_symbols:0 "共通の象徴のプログラムが、共通の市民的ボキャブラリーを形成しつつあります。\n\n#Y 75#!の進捗で完了：文化政策力#P +20#!、国家結束#P +7#!、ならびに完全受容されたPOPからの体制派+10%と権威+25の8年間の効果。"
 ve_je_cultural_project_status_ethnic:0 "[ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName]における民族統合運動は、少数派人口を主要文化へと同化させようとしています。\n\n#Y 125#!の進捗で完了：対象文化のPOPの5%を主要文化に同化させ（国家主義VIIの場合は7%）、文化政策力#P +25#!、国家結束#P +8#!、および10年間の同化効果。"
 ve_je_cultural_project_status_civic:0 "[ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName]における平等市民権構想は、文化の垣根を越えて共通の市民的地位を拡大しています。\n\n#Y 100#!の進捗で完了：10年間受容+15%、体制派のPOP、文化政策力#P +25#!、国家結束#P +10#!、および10年間の資格取得・移住の効果。"
 ve_je_cultural_project_status_composite:0 "[ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName]における構成協約は、複合国家内における恒久的な承認を交渉しています。\n\n#Y 150#!の進捗で完了（国家結束40以上が必要）：恒久的な受容+15%、構成文化リストへの文化の追加、体制派のPOP、文化政策力#P +30#!、国家結束#P +12#!。"
 ve_je_cultural_project_complete_tt:0 "文化事業が目標に到達しました。"
 ve_je_cultural_project_fail_tt:0 "文化事業は中止されました。"
 ve_je_project_resolving_status:0 "事業管理部が最終報告書を提出しています。"

 ve_evt_religious_incident_cooldown_mdf:0 "宗教事業のインシデントクールダウン"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "事業管理部は最近のインシデントの影響を処理しています。"
 ve_evt_cultural_incident_cooldown_mdf:0 "文化事業のインシデントクールダウン"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "事業管理部は最近のインシデントの影響を処理しています。"
 ve_evt_central_clergy_supported_mdf:0 "中央聖職者の支持"
 ve_evt_central_clergy_supported_mdf_desc:0 "政府は中央の宗教的階層制の権威を支持しました。"
 ve_evt_central_clergy_slighted_mdf:0 "中央聖職者の軽視"
 ve_evt_central_clergy_slighted_mdf_desc:0 "政府は中央の宗教的階層制の意向よりも地元の慣習を優先しました。"
 ve_evt_municipal_patronage_mdf:0 "地方の縁故主義ネットワーク"
 ve_evt_municipal_patronage_mdf_desc:0 "地方の有力者たちは、徴税を弱める取り決めを通じて事業を推進しています。"

 ve_rel_evt.1.t:0 "地元の名士たちの請願"
 ve_rel_evt.1.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の聖職者、自治体関係者、地区の長老らによる代表団が、告白教化の減速を求めて政府に請願した。彼らは、融通の利かないスケジュールは服従を永続的な反感に変えることになると警告している。"
 ve_rel_evt.1.f:0 "\"熟議なき信仰の強制は、長椅子を空っぽにする一方で台帳を埋めることになろう。\""
 ve_rel_evt.1.a:0 "彼らの請願を聞き入れる。"
 ve_rel_evt.1.a.tt:0 "宗教事業の進捗が#N 4#!減少する。\n宗教的定着が#P 3#!増加する。"
 ve_rel_evt.1.b:0 "スケジュールは変更しない。"
 ve_rel_evt.1.b.tt:0 "宗教事業の進捗が#P 5#!増加する。\n宗教的定着が#N 2#!減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の#N 0.5%#!が急進派になる。"
 ve_rel_evt.1.c:0 "信頼できる仲介者を委任する。"
 ve_rel_evt.1.c.tt:0 "信仰改革力を#N 10#!消費する。\n宗教事業の進捗が#P 3#!増加する。\n宗教的定着が#P 1#!増加する。"

 ve_rel_evt.2.t:0 "現地士官の不足"
 ve_rel_evt.2.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]からの報告によれば、未回答の請願、矛盾する指示、そして数週間にわたって事業士官の姿を見ていない地区があるという。告白教化はそれを担う行政機構の処理能力を上回っている。"
 ve_rel_evt.2.f:0 "\"布告は一日で国境を越えることができる。しかし、有能な書記官はそうはいかない。\""
 ve_rel_evt.2.a:0 "臨時の現地士官を雇用する。"
 ve_rel_evt.2.a.tt:0 "信仰改革力を#N 15#!消費する。\n宗教事業の進捗が#P 4#!増加する。"
 ve_rel_evt.2.b:0 "プログラムを減速させる。"
 ve_rel_evt.2.b.tt:0 "宗教事業の進捗が#N 6#!減少する。\n宗教的定着が#P 2#!増加する。"
 ve_rel_evt.2.c:0 "中央登録所の要員を活用する。"
 ve_rel_evt.2.c.tt:0 "信仰改革力を#N 10#!消費する。\n宗教事業の進捗が#P 5#!増加する。"

 ve_cul_evt.1.t:0 "翻訳局"
 ve_cul_evt.1.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の官僚たちは、平等市民権構想が[SCOPE.sCulture('ve_evt_target_culture').GetName]の言語にどのように対応すべきかで意見が対立している。地方行政官はバイリンガルな官公庁を求めており、中央省庁は単一の行政基準を要求している。"
 ve_cul_evt.1.f:0 "\"市民が自身の名において与えられた権利を理解するために、通訳を必要としてはならない。\""
 ve_cul_evt.1.a:0 "公共機関において現地言語の使用を認める。"
 ve_cul_evt.1.a.tt:0 "文化事業の進捗が#N 4#!減少する。\n結束力が#P 3#!増加する。"
 ve_cul_evt.1.b:0 "単一の行政基準を課す。"
 ve_cul_evt.1.b.tt:0 "文化事業の進捗が#P 5#!増加する。\n結束力が#N 2#!減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の#N 0.5%#!が急進派になる。"
 ve_cul_evt.1.c:0 "学術的翻訳委員会を設置する。"
 ve_cul_evt.1.c.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 3#!増加する。\n結束力が#P 1#!増加する。"

 ve_cul_evt.2.t:0 "現地教師の不足"
 ve_cul_evt.2.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の学校には、政府のカリキュラムと[SCOPE.sCulture('ve_evt_target_culture').GetName]コミュニティの両方に仕えることのできる教師が不足している。訓練された地元の要員がいなければ、平等な市民権は公式の紙面上にのみ書かれた約束のままで終わる危険性がある。"
 ve_cul_evt.2.f:0 "\"法律は一午後で平等を宣言するが、教室は一世代かけてそれを教え込まねばならない。\""
 ve_cul_evt.2.a:0 "新しい教員養成学校に資金を投じる。"
 ve_cul_evt.2.a.tt:0 "文化政策力を#N 15#!消費する。\n文化事業の進捗が#P 4#!増加する。"
 ve_cul_evt.2.b:0 "実装を遅らせる。"
 ve_cul_evt.2.b.tt:0 "文化事業の進捗が#N 6#!減少する。\n結束力が#P 2#!増加する。"
 ve_cul_evt.2.c:0 "すでに存在する制度を活用する。"
 ve_cul_evt.2.c.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 5#!増加する。\n結束力が#P 1#!増加する。"

 ve_rel_evt.3.t:0 "相反する台帳"
 ve_rel_evt.3.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]における宗教的帰属について、教区の名簿、自治体の台帳、そして事業担当官の報告の間で記述が食い違っている。行政部は、真実を明らかにするために時間を費やすか、あるいは不正確と分かっている数字のまま進めるか、決断を下さなければならない。"
 ve_rel_evt.3.f:0 "\"いかなる役所も正確な総数を有している。だが、どの総数も一致しない。\""
 ve_rel_evt.3.a:0 "完全な監査を実施する。"
 ve_rel_evt.3.a.tt:0 "信仰改革力 #P 8#! を獲得する。\n宗教事業の進捗が #N 6#! 低下する。"
 ve_rel_evt.3.b:0 "妥当な推計のもとで進める。"
 ve_rel_evt.3.b.tt:0 "信仰改革力 #N 8#! を消費する。\n宗教事業の進捗が #P 5#! 増加する。"
 ve_rel_evt.3.c:0 "神聖行政部の台帳を使用する。"
 ve_rel_evt.3.c.tt:0 "宗教事業の進捗が #P 3#! 増加する。"

 ve_rel_evt.4.t:0 "噂と反論説教"
 ve_rel_evt.4.d:0 "現在、[SCOPE.sState('ve_evt_target_state').GetName]における告白教化は、パンフレット、街頭説教、そして不安な噂によって、地域住民の生活に対する攻撃として描かれている。当局は、沈黙すれば反対派に事業の定義を許すことになり、一方で弾圧は彼らの最悪の主張を裏付けることになりかねないと警告している。"
 ve_rel_evt.4.f:0 "\"噂は役所も、公印も、予算も必要としない。\""
 ve_rel_evt.4.a:0 "公聴会を開催する。"
 ve_rel_evt.4.a.tt:0 "宗教事業の進捗が #N 3#! 低下する。\n宗教的定着が #P 3#! 増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #P 0.5%#! が体制派になる。"
 ve_rel_evt.4.b:0 "扇動者を処罰する。"
 ve_rel_evt.4.b.tt:0 "宗教事業の進捗が #P 4#! 増加する。\n宗教的定着が #N 3#! 低下する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #N 1%#! が急進派になる。"
 ve_rel_evt.4.c:0 "記録と結果を公表する。"
 ve_rel_evt.4.c.tt:0 "信仰改革力 #N 10#! を消費する。\n宗教事業の進捗が #P 2#! 増加する。\n宗教的定着が #P 1#! 増加する。"

 ve_rel_evt.5.t:0 "説教の言語"
 ve_rel_evt.5.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の事業聖職者によると、形式的な説教は教義の統一性を保つものの、多くの会衆に届いていないという。現地語での説教は運動をさらに広めることになろうが、中央の階層組織は適応が独立へと変質することを恐れている。"
 ve_rel_evt.5.f:0 "\"耳に届かぬ神聖な言葉は完璧に保たれるが、誰にも受け取られない。\""
 ve_rel_evt.5.a:0 "現地語で説教を行う。"
 ve_rel_evt.5.a.tt:0 "宗教事業の進捗が #P 6#! 増加する。\n#Y 2.5年#! の間、信者の支持が #N 1#! 低下する。"
 ve_rel_evt.5.b:0 "典礼の統一性を守る。"
 ve_rel_evt.5.b.tt:0 "宗教事業の進捗が #N 3#! 低下する。\n宗教的定着が #P 3#! 増加する。\n#Y 2.5年#! の間、信者の支持が #P 1#! 増加する。"
 ve_rel_evt.5.c:0 "教養ある通訳者を育成する。"
 ve_rel_evt.5.c.tt:0 "信仰改革力 #N 10#! を消費する。\n宗教事業の進捗が #P 4#! 増加する。\n宗教的定着が #P 1#! 増加する。"

 ve_rel_evt.6.t:0 "ライバルの聖職者権威"
 ve_rel_evt.6.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の中央任命の聖職者と既成の現地聖職者は、それぞれが告白教化を指揮する権利を主張している。一方を支持すれば指揮権は速やかに回復するかもしれないが、この争いはすでに、誰が信仰を代弁するかを試すものとなっている。"
 ve_rel_evt.6.f:0 "\"このいさかいは管轄権に関するものであり、それこそが制度が権力を描写する方法である。\""
 ve_rel_evt.6.a:0 "中央の聖職者を支持する。"
 ve_rel_evt.6.a.tt:0 "宗教事業の進捗が #P 5#! 増加する。\n#Y 2.5年#! の間、信者の支持が #P 1#! 増加する。\n宗教的定着が #N 3#! 低下する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #N 0.5%#! が急進派になる。"
 ve_rel_evt.6.b:0 "現地の聖職者を懐柔する。"
 ve_rel_evt.6.b.tt:0 "宗教事業の進捗が #N 4#! 低下する。\n#Y 2.5年#! の間、信者の支持が #N 1#! 低下する。\n宗教的定着が #P 3#! 増加する。"
 ve_rel_evt.6.c:0 "彼らの権限を文書で明確化する。"
 ve_rel_evt.6.c.tt:0 "信仰改革力 #N 10#! を消費する。\n宗教事業の進捗が #P 3#! 増加する。\n宗教的定着が #P 1#! 増加する。"

 ve_cul_evt.3.t:0 "国勢調査の分類"
 ve_cul_evt.3.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の国勢調査官は、[SCOPE.sCulture('ve_evt_target_culture').GetName]文化の市民をどのように記録すべきか合意に至っていない。地方の回答者は重複するアイデンティティを用いているが、中央の用紙は1つの欄に1つの回答を求めている。"
 ve_cul_evt.3.f:0 "\"分類は、国を単純化するよりもずっと前に、帳簿を単純化する。\""
 ve_cul_evt.3.a:0 "自己申告を許可する。"
 ve_cul_evt.3.a.tt:0 "文化事業の進捗が#N 4#!減少する。\n国家の結束力が#P 4#!増加する。"
 ve_cul_evt.3.b:0 "分類は中央で決定される。"
 ve_cul_evt.3.b.tt:0 "文化事業の進捗が#P 6#!増加する。\n国家の結束力が#N 4#!減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の#N 0.5%#!が急進派となる。"
 ve_cul_evt.3.c:0 "近代的な登録制度を使用する。"
 ve_cul_evt.3.c.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 5#!増加する。\n国家の結束力が#P 1#!増加する。"

 ve_cul_evt.4.t:0 "都市の名士たち"
 ve_cul_evt.4.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の都市の庇護者たちは、[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の平等市民権構想を推進するため、自らの事務所、被後見人、そして影響力を提供している。彼らの協力は迅速なものとなるだろうが、その代償は地方の歳入に対する継続的な統制権である。"
 ve_cul_evt.4.f:0 "\"市庁舎への最短の道は、いくつかの民間応接室を経由する。\""
 ve_cul_evt.4.a:0 "地方のネットワークを利用する。"
 ve_cul_evt.4.a.tt:0 "文化事業の進捗が#P 5#!増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]の税金キャパシティが#Y 2年間#!#N 5%#!減少する。"
 ve_cul_evt.4.b:0 "公開評議会を創設する。"
 ve_cul_evt.4.b.tt:0 "文化事業の進捗が#N 3#!減少する。\n国家の結束力が#P 3#!増加する。"
 ve_cul_evt.4.c:0 "規則に基づく合意を交渉する。"
 ve_cul_evt.4.c.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 3#!増加する。\n国家の結束力が#P 1#!増加する。"

 ve_cul_evt.5.t:0 "文官試験"
 ve_cul_evt.5.d:0 "[SCOPE.sCulture('ve_evt_target_culture').GetName]の候補者に文官試験への道を開いたことは、法的な平等と実践的な準備の間のギャップを露呈させた。即座の開放は象徴的な影響力が大きいが、長年の不平等な就学は布告によって消し去ることはできない。"
 ve_cul_evt.5.f:0 "\"一人の候補者しかその言語を教えられていなかった場合、同じ試験であっても同じ機会とはならない。\""
 ve_cul_evt.5.a:0 "準備講習会に資金を拠出する。"
 ve_cul_evt.5.a.tt:0 "文化政策力を#N 15#!消費する。\n文化事業の進捗が#P 5#!増加する。\n国家の結束力が#P 2#!増加する。"
 ve_cul_evt.5.b:0 "平等の機会は直ちに開始される。"
 ve_cul_evt.5.b.tt:0 "文化事業の進捗が#P 7#!増加する。\n国家の結束力が#N 4#!減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の#N 0.5%#!が急進派となる。"
 ve_cul_evt.5.c:0 "学校と社会福祉のネットワークを動員する。"
 ve_cul_evt.5.c.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 5#!増加する。\n国家の結束力が#P 2#!増加する。"
 ve_cul_evt.5.e:0 "まず試験制度を改革する。"
 ve_cul_evt.5.e.tt:0 "文化事業の進捗が#N 4#!減少する。\n国家の結束力が#P 3#!増加する。"

 ve_cul_evt.6.t:0 "多数派による反発"
 ve_cul_evt.6.d:0 "平等市民権構想の反対派は、[SCOPE.sCulture('ve_evt_target_culture').GetName]人口への共通の権利の拡大は他のすべての者たちの地位を低下させると主張している。[SCOPE.sState('ve_evt_target_state').GetName]におけるデモは、行政改革を国家的な政治的試練へと変えつつある。"
 ve_cul_evt.6.f:0 "\"共有された権利が、奪われた特権であるかのように描かれている。\""
 ve_cul_evt.6.a:0 "公然と構想を擁護する。"
 ve_cul_evt.6.a.tt:0 "文化事業の進捗が#P 4#!増加する。\n国家の結束力が#N 4#!減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の#N 1%#!が急進派となる。"
 ve_cul_evt.6.b:0 "実装のペースを落とす。"
 ve_cul_evt.6.b.tt:0 "文化事業の進捗が#N 5#!減少する。\n国家の結束力が#P 3#!増加する。"
 ve_cul_evt.6.c:0 "改革連合を動員する。"
 ve_cul_evt.6.c.tt:0 "文化政策力経済を #N 10#! 消費します。\n文化的プロジェクトの進捗が #P 3#! 増加します。\n国家の結束力が #P 2#! 増加します。\n[SCOPE.sState('ve_evt_target_state').GetName] 内の [SCOPE.sCulture('ve_evt_target_culture').GetName] 人口の #P 0.5%#! が体制派に転向します。"

 ve_rel_evt.7.t:0 "崩壊寸前の布教活動"
 ve_rel_evt.7.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]における告白教化は、行政的および政治的崩壊の瀬戸際にある。官庁間の連絡は途絶え、大衆の抵抗は激化し、現場の聖職者たちは現在の条件では布教を継続できないと警告している。"
 ve_rel_evt.7.f:0 "\"報告書はいまだにこれを一時的な困難と呼んでいる。だが、街路はより過酷な名を選んだ。\""
 ve_rel_evt.7.a:0 "損失を受け入れ、撤退する。"
 ve_rel_evt.7.a.tt:0 "信仰改革力の払い戻しなしで宗教事業をキャンセルする。\n宗教的和解が #N 5#! 低下する。\n#Y 2年間#!：行政力 #N -50#!、権力 #N -50#!、法律制定成功 #N -3%#!。"
 ve_rel_evt.7.b:0 "緊急資源を移転する。"
 ve_rel_evt.7.b.tt:0 "信仰改革力 #N 25#! を消費する。\n宗教事業の進捗が #N 5#! 低下する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #N 1%#! が急進派になる。\n事業は継続される。"
 ve_rel_evt.7.c:0 "最小限の人員で継続する。"
 ve_rel_evt.7.c.tt:0 "宗教事業の進捗が #N 10#! 低下する。\n宗教的和解が #N 2#! 低下する。\n事業は継続される。"
 ve_rel_evt.7.e:0 "手法を再交渉する。"
 ve_rel_evt.7.e.tt:0 "信仰改革力 #N 15#! を消費する。\n宗教事業の進捗が #N 3#! 低下する。\n宗教的和解が #P 2#! 増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #N 0.5%#! が急進派になる。\n事業は継続される。"

 ve_cul_evt.7.t:0 "正当性を失う構想"
 ve_cul_evt.7.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]における平等市民権構想は、既成制度およびそれが奉仕すべき[SCOPE.sCulture('ve_evt_target_culture').GetName]コミュニティの双方から支持を失いつつある。急進派の運動は今や、あらゆる妥協を政府が平等を実現できない証拠として描き出している。"
 ve_cul_evt.7.f:0 "\"改革は反対勢力に耐えることができても、信認を失うことには耐えられない。\""
 ve_cul_evt.7.a:0 "構想を終了する。"
 ve_cul_evt.7.a.tt:0 "文化政策力の払い戻しなしで文化事業をキャンセルする。\n国家結束が #N 5#! 低下する。\n#Y 2年間#!：行政力 #N -50#!、権力 #N -25#!、法律制定成功 #N -3%#!。"
 ve_cul_evt.7.b:0 "緊急の地方補助金を支給する。"
 ve_cul_evt.7.b.tt:0 "文化政策力 #N 25#! を消費する。\n文化事業の進捗が #N 5#! 低下する。\n[SCOPE.sState('ve_evt_target_state').GetName]の[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の #N 1%#! が急進派になる。\n事業は継続される。"
 ve_cul_evt.7.c:0 "最小限のプログラムで継続する。"
 ve_cul_evt.7.c.tt:0 "文化事業の進捗が #N 10#! 低下する。\n国家結束が #N 2#! 低下する。\n事業は継続される。"
 ve_cul_evt.7.e:0 "連合を再構築する。"
 ve_cul_evt.7.e.tt:0 "文化政策力 #N 15#! を消費する。\n文化事業の進捗が #N 3#! 低下する。\n国家結束が #P 2#! 増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]の[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の #N 0.5%#! が急進派になる。\n事業は継続される。"

 ve_rel_evt.8.t:0 "予期せぬ地方の調和"
 ve_rel_evt.8.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の聖職者、自治体当局者、コミュニティの長老たちは、いかなる中央の指令でも生み出せなかった合意に達した。地方の抵抗は後退し、信徒団が自ら布教活動を調整しており、告白教化は予期せぬ勢いを獲得した。"
 ve_rel_evt.8.f:0 "\"首都からの命令として始まったものは、町の広場で結ばれた協定となった。\""
 ve_rel_evt.8.a:0 "この勢いを最大限に利用する。"
 ve_rel_evt.8.a.tt:0 "宗教的和解が #P 1#! 増加する。\n宗教事業の進捗が #P 25#! 増加する。\n進捗が #Y 100#! に達した場合、事業の通常の完了効果が適用される。"
 ve_rel_evt.8.b:0 "速度よりも耐久性を重視する。"
 ve_rel_evt.8.b.tt:0 "宗教的和解が #P 4#! 増加する。\n宗教事業の進捗が #P 10#! 増加する。\n進捗が #Y 100#! に達した場合、事業の通常の完了効果が適用される。"

 ve_cul_evt.8.t:0 "地方の市民連合"
 ve_cul_evt.8.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の教師、自治体当局者、貿易協会、および[SCOPE.sCulture('ve_evt_target_culture').GetName]コミュニティの代表者たちが共通の委員会を形成した。この連合は紛争が首都に届く前に解決することで、行政には作り出せなかった勢いを平等市民権構想もたらした。"
 ve_cul_evt.8.f:0 "\"めったに同じテーブルを囲むことのなかった制度が責任を分かち合い始めた時、市民権は現実のものとなった。\""
 ve_cul_evt.8.a:0 "連合の勢いを利用する。"
 ve_cul_evt.8.a.tt:0 "国家結束が #P 1#! 増加する。\n文化事業の進捗が #P 25#! 増加する。\n進捗が #Y 100#! に達した場合、事業の通常の完了効果が適用される。"
 ve_cul_evt.8.b:0 "制度を恒久的なものにする。"
 ve_cul_evt.8.b.tt:0 "国家結束が #P 4#! 増加する。\n文化事業の進捗が #P 10#! 増加する。\n進捗が #Y 100#! に達した場合、事業の通常の完了効果が適用される。"

 ve_rel_evt.40.t:0 "食い違う記録"
 ve_rel_evt.40.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の地方登録簿は、宗教団体、市民結社、そして公共機関の分類に互換性のないものを用いている。首都へと届く報告は互いに矛盾をきたしており、本事業は法令遵守と抵抗の区別さえつけられない状態にある。"
 ve_rel_evt.40.f:0 "\"3つの台帳で執行される政策は、やがて3つの異なる現実を生み出す。\""
 ve_rel_evt.40.a:0 "中央監査団を派遣する。"
 ve_rel_evt.40.a.tt:0 "信仰改革力 #N 10#! を消費する。\n宗教事業の進捗が #P 5#! 増加する。\n宗教的定着が #P 1#! 増加する。"
 ve_rel_evt.40.b:0 "現地で記録を調停する。"
 ve_rel_evt.40.b.tt:0 "宗教事業の進捗が #N 3#! 減少する。\n宗教的定着が #P 2#! 増加する。"
 ve_rel_evt.40.c:0 "標準的な登録手続きを適用する。"
 ve_rel_evt.40.c.tt:0 "信仰改革力 #N 5#! を消費する。\n宗教事業の進捗が #P 4#! 増加する。\n宗教的定着が #P 1#! 増加する。"

 ve_rel_evt.41.t:0 "地方職員の不足"
 ve_rel_evt.41.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]にて事業を指揮する事務所は、訓練を受けた事務員、教師、視察官を十分に確保できずにいる。通達は地方官僚が解釈できるペースを上回って蓄積しつつあり、急ごしらえの人事はあらゆる争いをさらに悪化させる恐れがある。"
 ve_rel_evt.41.f:0 "\"布告は一日にして届いた。それを実行できる人材の育成には一世代かかるかもしれない。\""
 ve_rel_evt.41.a:0 "新たな官僚の幹部候補を資金援助する。"
 ve_rel_evt.41.a.tt:0 "信仰改革力 #N 15#! を消費する。\n宗教事業の進捗が #P 6#! 増加する。"
 ve_rel_evt.41.b:0 "実装を遅らせる。"
 ve_rel_evt.41.b.tt:0 "宗教事業の進捗が #N 6#! 減少する。\n宗教的定着が #P 2#! 増加する。"
 ve_rel_evt.41.c:0 "既存の教育ネットワークを利用する。"
 ve_rel_evt.41.c.tt:0 "信仰改革力 #N 10#! を消費する。\n宗教事業の進捗が #P 5#! 増加する。\n宗教的定着が #P 1#! 増加する。"

 ve_rel_evt.42.t:0 "地区を駆け巡る噂"
 ve_rel_evt.42.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]における噂によれば、本事業には政府が発表したものよりもはるかに過酷な施策が隠されているという。宗教団体の組織者や地元の扇動者たちが矛盾した話を繰り返す一方、公式の沈黙が新たなバージョンの流布に余地を与えている。"
 ve_rel_evt.42.f:0 "\"噂は、いかなる役所も、予算も、署名も必要としない。\""
 ve_rel_evt.42.a:0 "報告書を公表する。"
 ve_rel_evt.42.a.tt:0 "宗教事業の進捗が #N 3#! 減少する。\n宗教的定着が #P 4#! 増加する。"
 ve_rel_evt.42.b:0 "扇動を一蹴する。"
 ve_rel_evt.42.b.tt:0 "宗教事業の進捗が #P 5#! 増加する。\n宗教的定着が #N 3#! 減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #N 1%#! が急進派になる。"
 ve_rel_evt.42.c:0 "地元の仲介者を委任する。"
 ve_rel_evt.42.c.tt:0 "信仰改革力 #N 10#! を消費する。\n宗教事業の進捗が #P 4#! 増加する。\n宗教的定着が #P 2#! 増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #P 0.5%#! が体制派になる。"

 ve_rel_evt.43.t:0 "限界点に達した行政"
 ve_rel_evt.43.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]における事業は、行政的崩壊に近づきつつある。地方事務所は圧倒され、公的自信は崩壊し、組織的な反対は新たな指令のたびに政府が統制を失った証拠として扱うようになっている。"
 ve_rel_evt.43.f:0 "\"書類が動かなくなるとき、危機は街頭へと動き出す。\""
 ve_rel_evt.43.a:0 "計画を終了する。"
 ve_rel_evt.43.a.tt:0 "信仰改革力の返還なしで宗教事業を中止する。\n宗教的定着が #N 5#! 減少する。\n#Y 2年間#!： 行政力 #N -50#!、権力 #N -50#!、および法制定成功 #N -3%#!。"
 ve_rel_evt.43.b:0 "緊急資源を移転する。"
 ve_rel_evt.43.b.tt:0 "信仰改革力 #N 25#! を消費する。\n宗教事業の進捗が #N 5#! 減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #N 1%#! が急進派になる。\n事業は継続される。"
 ve_rel_evt.43.c:0 "最小限の職員で継続する。"
 ve_rel_evt.43.c.tt:0 "宗教事業の進捗が #N 10#! 減少する。\n宗教的定着が #N 2#! 減少する。\n事業は継続される。"
 ve_rel_evt.43.e:0 "地元の協力関係を再構築する。"
 ve_rel_evt.43.e.tt:0 "信仰改革力 #N 15#! を消費する。\n宗教事業の進捗が #N 3#! 減少する。\n宗教的定着が #P 2#! 増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #N 0.5%#! が急進派になる。\n事業は継続される。"

 ve_rel_evt.100.t:0 "異教間評議会の議席"
 ve_rel_evt.100.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の代表者らは異教間評議会の必要性については合意しているものの、誰が議席に値するかについては意見が分かれている。比例代表制であれば小規模なコミュニティを安心させることができる一方、首都で立案された固定的な宗教的和解であれば即座に作業を開始できるだろう。"
 ve_rel_evt.100.f:0 "\"椅子が数えられるようになるまで、誰もが共通の食卓を支持するものだ。\""
 ve_rel_evt.100.a:0 "人口に応じて代表権を分配する。"
 ve_rel_evt.100.a.tt:0 "宗教事業の進捗が#N 3#!減少する。\n宗教的和解が#P 4#!増加する。"
 ve_rel_evt.100.b:0 "中央主導の固定的な妥協案を強制する。"
 ve_rel_evt.100.b.tt:0 "宗教事業の進捗が#P 5#!増加する。\n宗教的和解が#N 2#!減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の#N 0.5%#!が急進派となる。"
 ve_rel_evt.100.c:0 "異教間評議会に権限を与える。"
 ve_rel_evt.100.c.tt:0 "信仰改革力を#N 10#!消費する。\n宗教事業の進捗が#P 5#!増加する。\n宗教的和解が#P 2#!増加する。"

 ve_rel_evt.101.t:0 "共通の学校カリキュラム"
 ve_rel_evt.101.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の学校では、自由啓発活動を地域信仰に対する運動へと変容させることなく、共通の公民教育を行う必要がある。教師らは明確な教材と合同研修を求めている一方、コミュニティの指導者らは地域の教育内容に自分たちの伝統のための余地を残すよう強く主張している。"
 ve_rel_evt.101.f:0 "\"共通の教訓が成功するのは、すべての家族が教室を自分たちのものと認めるときだけである。\""
 ve_rel_evt.101.a:0 "共通の教員団に資金を提供する。"
 ve_rel_evt.101.a.tt:0 "信仰改革力を#N 15#!消費する。\n宗教事業の進捗が#P 6#!増加する。\n宗教的和解が#P 1#!増加する。"
 ve_rel_evt.101.b:0 "地域のカリキュラムのための余地を残す。"
 ve_rel_evt.101.b.tt:0 "宗教事業の進捗が#N 4#!減少する。\n宗教的和解が#P 3#!増加する。"
 ve_rel_evt.101.c:0 "改革連合を学校に引き入れる。"
 ve_rel_evt.101.c.tt:0 "信仰改革力を#N 10#!消費する。\n宗教事業の進捗が#P 5#!増加する。\n宗教的和解が#P 2#!増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の#P 0.5%#!が体制派となる。"

 ve_rel_evt.102.t:0 "相互保証憲章"
 ve_rel_evt.102.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の宗教コミュニティ、自治体職員、および改革協会は、共通の憲章を起草した。各署名者は、どのコミュニティも地域制度から排除されないという公的保証と引き換えに、同じ公民的義務を受け入れる。"
 ve_rel_evt.102.f:0 "\"すべての約束が他者の権利として記されたとき、信頼が可能となった。\""
 ve_rel_evt.102.a:0 "協定の勢いを利用する。"
 ve_rel_evt.102.a.tt:0 "宗教的和解が#P 2#!増加する。\n宗教事業の進捗が#P 20#!増加する。\n進捗が#Y 100#!に達した場合、この事業の通常の完了効果が適用される。"
 ve_rel_evt.102.b:0 "保証を恒久的なものにする。"
 ve_rel_evt.102.b.tt:0 "宗教的和解が#P 4#!増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の#P 0.5%#!が体制派となる。\n宗教事業の進捗が#P 10#!増加する。\n進捗が#Y 100#!に達した場合、この事業の通常の完了効果が適用される。"

 ve_rel_evt.150.t:0 "教師か視学官か？"
 ve_rel_evt.150.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]における世俗化運動は、識学者の不足を露呈させた。政府は長期的な公民的キャパシティを構築する教員団を拡張することも、すでに利用可能な人員で新しい規則を強制できる視学官に頼ることもできる。"
 ve_rel_evt.150.f:0 "\"視学官は午後の一時で学校を閉鎖できるが、教師がそこで教えられていたものを補うには何年もかかるかもしれない。\""
 ve_rel_evt.150.a:0 "教員団を拡張する。"
 ve_rel_evt.150.a.tt:0 "信仰改革力を#N 15#!消費する。\n宗教事業の進捗が#P 6#!増加する。"
 ve_rel_evt.150.b:0 "既存の人員に合わせてプログラムを減速させる。"
 ve_rel_evt.150.b.tt:0 "宗教事業の進捗が#N 5#!減少する。\n宗教的和解が#P 2#!増加する。"
 ve_rel_evt.150.c:0 "公教育ネットワークに委託する。"
 ve_rel_evt.150.c.tt:0 "信仰改革力を#N 10#!消費する。\n宗教事業の進捗が#P 5#!増加する。\n宗教的和解が#P 1#!増加する。"

 ve_rel_evt.151.t:0 "接収された財産"
 ve_rel_evt.151.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の旧宗教的財産は、学校、診療所、市民窓口への転用準備が整っている。速やかな移管を行えば運動に貴重なインフラがもたらされるが、補償の欠如は信者の結集点となりつつある。"
 ve_rel_evt.151.f:0 "\"鍵はひと朝の間に持ち主を変えた。所有権をめぐる論争は錠前よりも長生きするだろう。\""
 ve_rel_evt.151.a:0 "段階的に補償を支払う。"
 ve_rel_evt.151.a.tt:0 "信仰改革力 #N 15#! を消費する。\n宗教事業の進捗が #P 3#! 増加する。\n宗教的和解が #P 3#! 増加する。"
 ve_rel_evt.151.b:0 "財産を直ちに公共サービスに充てる。"
 ve_rel_evt.151.b.tt:0 "宗教事業の進捗が #P 7#! 増加する。\n宗教的和解が #N 4#! 減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #N 1%#! が急進派になる。\n信者の支持が #Y 2.5年#! の間 #N 1#! 低下する。"
 ve_rel_evt.151.c:0 "世俗的な社会福祉制度に移管する。"
 ve_rel_evt.151.c.tt:0 "信仰改革力 #N 10#! を消費する。\n宗教事業の進捗が #P 5#! 増加する。\n宗教的和解が #P 2#! 増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]の人口の #P 0.5%#! が体制派になる。"

 ve_rel_evt.152.t:0 "市民団体の定着"
 ve_rel_evt.152.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の教師サークル、相互扶助協会、自治体組合は、かつて宗教制度を通じて組織されていたサービスの提供を開始した。その協力により、世俗化運動は単なる行政上の存在感にとどまらない、地域社会の基盤を得ることになった。"
 ve_rel_evt.152.f:0 "\"市民が検閲官を待つことなく自ら維持し始めたとき、新しい秩序は定着した。\""
 ve_rel_evt.152.a:0 "現地の勢いを利用する。"
 ve_rel_evt.152.a.tt:0 "宗教的和解が #P 2#! 増加する。\n宗教事業の進捗が #P 20#! 増加する。\n進捗が #Y 100#! に達した場合、事業の通常の完了効果が適用される。"
 ve_rel_evt.152.b:0 "これらの協会を常設制度とする。"
 ve_rel_evt.152.b.tt:0 "宗教的和解が #P 4#! 増加する。\n宗教事業の進捗が #P 10#! 増加する。\n進捗が #Y 100#! に達した場合、事業の通常の完了効果が適用される。"

 ve_cul_evt.40.t:0 "地域の学校評議会"
 ve_cul_evt.40.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の学校評議会は、公教育における[SCOPE.sCulture('ve_evt_target_culture').GetName]語の位置づけをめぐって意見が対立している。現地語教育は信頼を維持する一方、単一の行政言語は国家プロジェクトの指揮を容易にする。"
 ve_cul_evt.40.f:0 "\"最初の授業に選ばれた言語は、学校が誰のものであるかを誰が信じるかをしばしば決定づける。\""
 ve_cul_evt.40.a:0 "現地語を保護する。"
 ve_cul_evt.40.a.tt:0 "文化事業の進捗が #N 4#! 減少する。\n結束力が #P 3#! 増加する。"
 ve_cul_evt.40.b:0 "単一の行政言語を強制する。"
 ve_cul_evt.40.b.tt:0 "文化事業の進捗が #P 5#! 増加する。\n結束力が #N 2#! 減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]における[SCOPE.sCulture('ve_evt_target_culture').GetName]文化の人口の #N 0.5%#! が急進派になる。"
 ve_cul_evt.40.c:0 "教師ネットワークを拡張する。"
 ve_cul_evt.40.c.tt:0 "文化政策力 #N 10#! を消費する。\n文化事業の進捗が #P 4#! 増加する。\n結束力が #P 2#! 増加する。"

 ve_cul_evt.41.t:0 "統計上の境界線"
 ve_cul_evt.41.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]を調査する官僚らは、[SCOPE.sCulture('ve_evt_target_culture').GetName]コミュニティがどこで始まりどこで終わるのかについて合意に至っていない。地域のアイデンティティは言語、地区、習慣を越えて重複しているが、国家プロジェクトには集計および管理可能な分類が必要とされる。"
 ve_cul_evt.41.f:0 "\"国勢調査のために引かれた境界線は、やがて官僚、予算、そして擁護者を生み出す。\""
 ve_cul_evt.41.a:0 "自己識別への余地を残す。"
 ve_cul_evt.41.a.tt:0 "文化事業の進捗が #N 3#! 減少する。\n結束力が #P 3#! 増加する。"
 ve_cul_evt.41.b:0 "中央に境界線を定義させる。"
 ve_cul_evt.41.b.tt:0 "文化事業の進捗が #P 6#! 増加する。\n結束力が #N 3#! 減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]における[SCOPE.sCulture('ve_evt_target_culture').GetName]文化の人口の #N 0.5%#! が急進派になる。"
 ve_cul_evt.41.c:0 "標準的な登録システムを使用する。"
 ve_cul_evt.41.c.tt:0 "文化政策力 #N 10#! を消費する。\n文化事業の進捗が #P 5#! 増加する。\n結束力が #P 1#! 増加する。"

 ve_cul_evt.42.t:0 "崩壊寸前の国家事業"
 ve_cul_evt.42.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]における国家事業は崩壊の危機に瀕している。急進派運動は、政府が[SCOPE.sCulture('ve_evt_target_culture').GetName]コミュニティを裏切ったか、あるいはそれに屈服したと主張している一方で、地方官庁はさらなる妥協を強制するだけの自信をすでに失っている。"
 ve_cul_evt.42.f:0 "\"強要でありかつ降伏でもあると攻撃される妥協案は、もはや妥協案でなくなるかもしれない。\""
 ve_cul_evt.42.a:0 "事業を終了する。"
 ve_cul_evt.42.a.tt:0 "文化事業を中止し、文化政策力の返還は行われない。\n結束力が #N 5#! 減少する。\n#Y 2年間#!：行政力 #N -50#!、権力 #N -25#!、法制定成功 #N -3%#!。"
 ve_cul_evt.42.b:0 "緊急の地方資源を投じる。"
 ve_cul_evt.42.b.tt:0 "文化政策力を #N 25#! 消費する。\n文化事業の進捗が #N 5#! 減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]における[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の #N 1%#! が急進派になる。\n事業は継続される。"
 ve_cul_evt.42.c:0 "最小限のプログラムで継続する。"
 ve_cul_evt.42.c.tt:0 "文化事業の進捗が #N 10#! 減少する。\n結束力が #N 2#! 減少する。\n事業は継続される。"
 ve_cul_evt.42.e:0 "交渉の枠組みを再構築する。"
 ve_cul_evt.42.e.tt:0 "文化政策力を #N 15#! 消費する。\n文化事業の進捗が #N 3#! 減少する。\n結束力が #P 2#! 増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]における[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の #N 0.5%#! が急進派になる。\n事業は継続される。"

 ve_cul_evt.50.t:0 "姓氏および言語指令"
 ve_cul_evt.50.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の官僚らは、国語による姓氏および公文書の標準化を提案している。この指令により、中央政府は[SCOPE.sCulture('ve_evt_target_culture').GetName]人口をより容易に分類できるようになるが、各家庭は民間としてのアイデンティティが国家の指揮の対象になりつつあることを恐れている。"
 ve_cul_evt.50.f:0 "\"登録簿に異なる綴りで書かれようとも、その名は家族が自らを記憶するための名であり続ける。\""
 ve_cul_evt.50.a:0 "段階的な登録キャンペーンに資金を投じる。"
 ve_cul_evt.50.a.tt:0 "文化政策力を #N 10#! 消費する。\n文化事業の進捗が #P 4#! 増加する。\n結束力が #P 1#! 増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]における[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の #N 0.5%#! が急進派になる。"
 ve_cul_evt.50.b:0 "単一の国家基準を強制する。"
 ve_cul_evt.50.b.tt:0 "文化事業の進捗が #P 7#! 増加する。\n結束力が #N 4#! 減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]における[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の #N 1%#! が急進派になる。"
 ve_cul_evt.50.c:0 "指令を撤回し見直す。"
 ve_cul_evt.50.c.tt:0 "文化事業の進捗が #N 5#! 減少する。\n結束力が #P 3#! 増加する。"

 ve_cul_evt.51.t:0 "徴兵登録簿"
 ve_cul_evt.51.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]の軍事関係者は、役務義務、姓氏、および指揮に関する単一の登録簿を要求している。これを[SCOPE.sCulture('ve_evt_target_culture').GetName]人口に適用することは民族的統合の推進を強化することになるが、陸軍を文化的抹殺の別の手段とみなすコミュニティの間では抵抗が強まっている。"
 ve_cul_evt.51.f:0 "\"国家が村の名前を初めて知るのは、税金を取り立てるか息子たちを召集するときである。\""
 ve_cul_evt.51.a:0 "国家登録簿を適用する。"
 ve_cul_evt.51.a.tt:0 "文化事業の進捗が #P 5#! 増加する。\n結束力が #N 2#! 減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]における[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の #N 0.5%#! が急進派になる。"
 ve_cul_evt.51.b:0 "地方の登録慣行を維持する。"
 ve_cul_evt.51.b.tt:0 "文化事業の進捗が #N 3#! 減少する。\n結束力が #P 3#! 増加する。"
 ve_cul_evt.51.c:0 "兵役を通じて登録簿を統合する。"
 ve_cul_evt.51.c.tt:0 "文化政策力を #N 10#! 消費する。\n文化事業の進捗が #P 6#! 増加する。\n結束力が #P 1#! 増加する。\n[SCOPE.sState('ve_evt_target_state').GetName]における[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の #N 0.5%#! が急進派になる。"

 ve_cul_evt.100.t:0 "構成の代表団"
 ve_cul_evt.100.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]における[SCOPE.sCulture('ve_evt_target_culture').GetName]コミュニティの代表団が、構成協約の制度における代表権の要求を携えて到着した。交渉を行えば事業は遅れるもののその正当性は強まるが、首都から押し付けられた妥協案は信頼を代償として迅速に進めることができよう。"
 ve_cul_evt.100.f:0 "\"協約が真に共通のものとなるのは、すべての構成員が自らの手で書き上げた条項を指し示せるときだけである。\""
 ve_cul_evt.100.a:0 "協約内での彼らの地位について交渉する。"
 ve_cul_evt.100.a.tt:0 "文化事業の進捗が#N 4#!減少する。\n国家の結束力が#P 4#!増加する。"
 ve_cul_evt.100.b:0 "中央主導の妥協案を押し付ける。"
 ve_cul_evt.100.b.tt:0 "文化事業の進捗が#P 5#!増加する。\n国家の結束力が#N 2#!減少する。\n[SCOPE.sState('ve_evt_target_state').GetName]の[SCOPE.sCulture('ve_evt_target_culture').GetName]人口の#N 0.5%#!が急進派になる。"
 ve_cul_evt.100.c:0 "議会主義の連立を協議に引き入れる。"
 ve_cul_evt.100.c.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 4#!増加する。\n国家の結束力が#P 2#!増加する。"

 ve_cul_evt.101.t:0 "二重行政"
 ve_cul_evt.101.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]における構成協約は、現在、重複する2つの行政機構に依存している。中央の官僚と[SCOPE.sCulture('ve_evt_target_culture').GetName]コミュニティの代表者らは台帳の二重作成や任命の争いを繰り返し、矛盾する指示を発し続ける一方で、国家の行政力は疲弊の瀬戸際に近づいている。"
 ve_cul_evt.101.f:0 "\"2つの役所は、書類棚を共有するよりも簡単に権限を共有することができる。\""
 ve_cul_evt.101.a:0 "共同の行政スタッフに資金を拠出する。"
 ve_cul_evt.101.a.tt:0 "文化政策力を#N 15#!消費する。\n文化事業の進捗が#P 6#!増加する。"
 ve_cul_evt.101.b:0 "役所の間で合意に至るまで協約を遅らせる。"
 ve_cul_evt.101.b.tt:0 "文化事業の進捗が#N 6#!減少する。\n国家の結束力が#P 2#!増加する。"
 ve_cul_evt.101.c:0 "文官組織のもとで役所を統一する。"
 ve_cul_evt.101.c.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 5#!増加する。\n国家の結束力が#P 2#!増加する。"

 ve_cul_evt.150.t:0 "地方における実施"
 ve_cul_evt.150.d:0 "地方行政からの報告によれば、全国的な文化的プロジェクトは地域によってまったく異なる速度で進行しているという。一部の官僚機関は資金提供された実施委員会の設置を要求している一方で、すべての地域に同一のスケジュールを強制することは乏しい人員を消耗させ、国民の自信を弱めると警告する声もある。"
 ve_cul_evt.150.f:0 "\"国家の布告は一度書かれるだけでよいが、国内のすべての役所において実施されなければならない。\""
 ve_cul_evt.150.a:0 "実施委員会に資金を拠出する。"
 ve_cul_evt.150.a.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 5#!増加する。"
 ve_cul_evt.150.b:0 "段階的なスケジュールを使用する。"
 ve_cul_evt.150.b.tt:0 "文化事業の進捗が#N 4#!減少する。\n国家の結束力が#P 2#!増加する。"
 ve_cul_evt.150.c:0 "既存の行政を標準化する。"
 ve_cul_evt.150.c.tt:0 "文化政策力を#N 5#!消費する。\n文化事業の進捗が#P 3#!増加する。\n国家の結束力が#P 2#!増加する。"

 ve_cul_evt.151.t:0 "教授言語"
 ve_cul_evt.151.d:0 "国家カリキュラムは共通の教授言語を必要としているが、全国の学校が奉仕するコミュニティの言語的伝統は大きく異なっている。多言語の教材は自信を維持する一方で配布を遅らせることになり、単一のカリキュラムは教育を文化闘争に変えてしまうリスクを冒しながらも急速に教室へと届くことになろう。"
 ve_cul_evt.151.f:0 "\"生徒が不信感を抱く言語で教えられた教訓は、その主題以外のあらゆることだけが記憶に残るかもしれない。\""
 ve_cul_evt.151.a:0 "多言語教材に資金を拠出する。"
 ve_cul_evt.151.a.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 3#!増加する。\n国家の結束力が#P 3#!増加する。"
 ve_cul_evt.151.b:0 "一つの国家カリキュラムを適用する。"
 ve_cul_evt.151.b.tt:0 "文化事業の進捗が#P 6#!増加する。\n国家の結束力が#N 3#!減少する。"
 ve_cul_evt.151.c:0 "教育と社会福祉のネットワークを統合する。"
 ve_cul_evt.151.c.tt:0 "文化政策力を#N 10#!消費する。\n文化事業の進捗が#P 5#!増加する。\n国家の結束力が#P 2#!増加する。"

 ve_cul_evt.160.t:0 "国を代表するのは誰か？"
 ve_cul_evt.160.d:0 "共通の象徴事業によって、一体誰の歴史、制服、記念碑、そして式典が国全体を代表し得るのかという問題が再び浮上した。伝統を輪番制にすれば承認は広がるものの合意形成は遅れ、公式の物語をひとつに絞れば明確さは生まれるが多くの市民を疎外することになる。"
 ve_cul_evt.160.f:0 "\"象徴が国民的なものとなるのは、市民が説明を必要とせずそこに自分自身を見出す時のみである。\""
 ve_cul_evt.160.a:0 "公的な使用において象徴を輪番制にする。"
 ve_cul_evt.160.a.tt:0 "文化事業の進捗が #N 3#! 低下する。\n国の結束力が #P 4#! 増加する。"
 ve_cul_evt.160.b:0 "公式の物語をひとつ選定する。"
 ve_cul_evt.160.b.tt:0 "文化事業の進捗が #P 6#! 増加する。\n国の結束力が #N 3#! 低下する。"
 ve_cul_evt.160.c:0 "共通の公式式典を設計する。"
 ve_cul_evt.160.c.tt:0 "文化政策力 を #N 10#! 消費する。\n文化事業の進捗が #P 4#! 増加する。\n国の結束力が #P 2#! 増加する。"
