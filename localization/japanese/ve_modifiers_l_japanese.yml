 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "民族国家"
 ve_ethnic_identity_mdf_desc:0 "州は、その主要文化に基づいて政治的メンバーシップを定義します。"
 ve_civic_identity_mdf:0 "市民国家"
 ve_civic_identity_mdf_desc:0 "国家は、共通の制度と市民権を通じて政治的メンバーシップを定義します。"
 ve_composite_identity_mdf:0 "複合国家"
 ve_composite_identity_mdf_desc:0 "国家は、交渉および行政機関を通じて複数の人々のバランスをとります。"
 ve_ethnic_high_cohesion_mdf:0 "動員された国民共同体"
 ve_ethnic_high_cohesion_mdf_desc:0 "団結した民族国家は国民を動員し、国家を正当化することができる。"
 ve_civic_high_cohesion_mdf:0 "自信に満ちた市民社会"
 ve_civic_high_cohesion_mdf_desc:0 "共有された市民制度は、正当性と社会的流動性を生み出します。"
 ve_composite_high_cohesion_mdf:0 "安定した帝国協定"
 ve_composite_high_cohesion_mdf_desc:0 "国民間の安定した協定は、正統性と外交を強化します。"
 ve_low_national_cohesion_mdf:0 "国民の団結力が低い"
 ve_low_national_cohesion_mdf_desc:0 "国家による国家の定義は正統性を失いつつある。"
 ve_identity_transition_backlash_mdf:0 "アイデンティティ移行のバックラッシュ"
 ve_identity_transition_backlash_mdf_desc:0 "制度やコミュニティは国家の再定義に抵抗します。"
 ve_cultural_project_administration_mdf:0 "文化事業運営"
 ve_cultural_project_administration_mdf_desc:0 "役人と政治資本は積極的な文化プロジェクトに取り組んでいます。"
 ve_cultural_project_backlash_mdf:0 "放棄された文化プロジェクト"
 ve_cultural_project_backlash_mdf_desc:0 "文化プログラムの突然の放棄は国民の信頼と行政の連携を損なった。"
 ve_national_curriculum_result_mdf:0 "国家カリキュラム"
 ve_national_curriculum_result_mdf_desc:0 "共通のカリキュラムは教育と資格を拡大するが、それを維持することは官僚主義を消耗する。"
 ve_shared_symbols_result_mdf:0 "国民の象徴の共有"
 ve_shared_symbols_result_mdf_desc:0 "市民の儀式と象徴の共有は忠誠心と国家の権威を強化する。"
 ve_ethnic_campaign_active_mdf:0 "民族統合キャンペーン"
 ve_ethnic_campaign_active_mdf_desc:0 "国家は同化を積極的に加速させており、文化の消去に対する抵抗を引き起こしている。"
 ve_ethnic_campaign_result_mdf:0 "同化プログラム"
 ve_ethnic_campaign_result_mdf_desc:0 "完了した統合キャンペーンは文化消去の緊張を生み出しながら同化を加速し続けている。"
 ve_civic_initiative_active_mdf:0 "平等市民権イニシアティブ"
 ve_civic_initiative_active_mdf_desc:0 "機会を広げ、あからさまな偏見を減らすために、学校と公共機関が再編成されています。"
 ve_civic_initiative_result_mdf:0 "市民権平等プログラム"
 ve_civic_initiative_result_mdf_desc:0 "この取り組みにより、資格、移住の魅力、あからさまな偏見に対する抵抗力が向上します。"
 ve_composite_compact_active_mdf:0 "有権者コンパクト交渉"
 ve_composite_compact_active_mdf_desc:0 "交渉は二流市民権に関する苦情を軽減しますが、税務行政に一時的に負担を与えます。"
 ve_composite_compact_result_mdf:0 "憲法制定憲章"
 ve_composite_compact_result_mdf_desc:0 "この協定は忠誠心を強化し、二流市民権によって引き起こされる苦情を軽減します。"
