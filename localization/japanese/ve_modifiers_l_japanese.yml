 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "民族国家"
 ve_ethnic_identity_mdf_desc:0 "国家がその主要文化を中心に政治的帰属を定義している。"
 ve_civic_identity_mdf:0 "市民国家"
 ve_civic_identity_mdf_desc:0 "国家が共通の制度と市民権を通じて政治的帰属を定義している。"
 ve_composite_identity_mdf:0 "複合国家"
 ve_composite_identity_mdf_desc:0 "国家が交渉済みおよび行政上の制度を通じて、複数の民族間の均衡を保っている。"
 ve_ethnic_high_cohesion_mdf:0 "動員された国民共同体"
 ve_ethnic_high_cohesion_mdf_desc:0 "結束した民族国家は、その人口を動員し、国家の正当性を高めることができる。"
 ve_civic_high_cohesion_mdf:0 "自信に満ちた市民社会"
 ve_civic_high_cohesion_mdf_desc:0 "共有された市民制度が正当性と社会流動性を生み出している。"
 ve_composite_high_cohesion_mdf:0 "安定した帝国協約"
 ve_composite_high_cohesion_mdf_desc:0 "国家の諸民族間における安定した協約が、正当性と外交を強化する。"
 ve_low_national_cohesion_mdf:0 "低い国家結束"
 ve_low_national_cohesion_mdf_desc:0 "国家による国民の定義が正当性を失いつつある。"
 ve_identity_transition_backlash_mdf:0 "アイデンティティ移行の反発"
 ve_identity_transition_backlash_mdf_desc:0 "制度と共同体が国家の再定義に抵抗している。"
 ve_cultural_project_administration_mdf:0 "文化事業の運営"
 ve_cultural_project_administration_mdf_desc:0 "官僚と政治的資本が、進行中の文化事業に投じられている。"
 ve_cultural_project_backlash_mdf:0 "放棄された文化事業"
 ve_cultural_project_backlash_mdf_desc:0 "文化プログラムの突然の放棄が、公共の信頼と行政の調整能力を損なった。"
 ve_national_curriculum_result_mdf:0 "国家カリキュラム"
 ve_national_curriculum_result_mdf_desc:0 "共通カリキュラムが教育と資格取得を拡大するが、その維持には行政力を消費する。"
 ve_shared_symbols_result_mdf:0 "共有された国家の象徴"
 ve_shared_symbols_result_mdf_desc:0 "共有された市民儀礼と象徴が、忠実性と国家権力を強化する。"
 ve_ethnic_campaign_active_mdf:0 "民族統合運動"
 ve_ethnic_campaign_active_mdf_desc:0 "国家が積極的に同化を加速させており、文化的抹消に対する抵抗を招いている。"
 ve_ethnic_campaign_result_mdf:0 "同化プログラム"
 ve_ethnic_campaign_result_mdf_desc:0 "完了した統合運動が同化を加速させ続ける一方で、文化的抹消に関する緊張度を生み出している。"
 ve_civic_initiative_active_mdf:0 "平等市民権構想"
 ve_civic_initiative_active_mdf_desc:0 "機会を拡大し、公然たる偏見を減らすために、学校や公共制度が再編されている。"
 ve_civic_initiative_result_mdf:0 "平等市民権プログラム"
 ve_civic_initiative_result_mdf_desc:0 "この構想は資格取得、移住求心力、そして公然たる偏見への抵抗を改善する。"
 ve_composite_compact_active_mdf:0 "構成協約の交渉"
 ve_composite_compact_active_mdf_desc:0 "交渉により二級市民としての不満は軽減されるが、一時的に税務行政に重圧がかかる。"
 ve_composite_compact_result_mdf:0 "構成協約"
 ve_composite_compact_result_mdf_desc:0 "この協約は忠実性を強化し、二級市民としての地位に起因する不満を軽減する。"
