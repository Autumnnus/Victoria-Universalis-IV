l_korean:
 ve_national_identity:0 "국가 정체성"
 ve_primary_cultures_label:0 "주요 문화"
 ve_identity_models:0 "정체성 모델"
 ve_identity_model_active_footer:0 "이미 활성"
 ve_switch_identity_button:0 "스위치"
 ve_switch_identity_cost_label:0 "비용 #Y 200 문화 명령#!"
 ve_begin_project_button:0 "프로젝트 시작"
 ve_identity_models_help:0 "당신의 국가는 항상 정확히 하나의 정체성 모델을 가지고 있으며 그것은 #P 이미 활동 중#! — 여기서는 아무것도 선택할 필요가 없습니다. 모델은 방법만 결정합니다. #Y 국민적 결속#! 획득한 금액과 실행할 수 있는 문화 프로젝트가 무엇인지 알 수 있습니다.\n#Y 전환은 선택 사항입니다.#! 비용이 든다 #Y 200 문화명령#!, 응집력을 다음으로 재설정합니다. #Y 35#!, 실행 중인 문화 프로젝트를 취소하고 5년 동안 다른 전환을 차단합니다.\n#Y 전체 효과를 보려면 카드나 미터에 마우스를 올리세요.#!"
 ve_ethnic_identity_name:0 "민족 국가"
 ve_civic_identity_name:0 "시민 국가"
 ve_composite_identity_name:0 "복합 국가"
 ve_ethnic_identity_short:0 "국가는 주요 문화를 중심으로 정의됩니다.\n결속력은 다음에서 비롯됩니다. #Y 인구통계학적 우세#!."
 ve_civic_identity_short:0 "학교 교육을 통해 건설된 정치 국가입니다.\n결속력은 다음에서 비롯됩니다. #Y 읽고 쓰는 능력과 수용된 소수자#!."
 ve_composite_identity_short:0 "여러 사람이 협상을 통해 조직에 속해 있습니다.\n결속력은 다음에서 비롯됩니다. #Y 진정한 복수의 인구#!."
 ve_ethnic_identity_unlocks:0 "잠금을 해제합니다 #Y 민족통합캠페인#! 프로젝트"
 ve_civic_identity_unlocks:0 "잠금을 해제합니다 #Y 평등 시민권 이니셔티브#! 프로젝트"
 ve_composite_identity_unlocks:0 "잠금 해제 #Y Constituent Compact#! project"
 ve_ethnic_identity_desc:0 "#header Ethnic Nation#!\n국가는 주요 문화를 중심으로 정의됩니다.\n\n#Y 활성 상태에서는#!\n#P +15% 동화, +5% 권위#!\n#N -5% 이주 매력, +5% 공개적 편견으로 인한 급진주의#!\n\n#Y 결속력#!\n1차 문화가 구성될 때 상승합니다. 인구의 최소 60~75%이며 40% 이하로 급격히 떨어집니다.\n\n#Y 응집력 75에서#!\n#P +5% 징병률, +3 합법성#!\n\n#Y 문화 프로젝트#!\n민족 통합 캠페인"
 ve_civic_identity_desc:0 "#header 시민 국가#!\n공유된 정치 국가는 교육과 참여를 통해 건설됩니다.\n\n#Y 활동 중#!\n#P +7% 이주 매력, +1% 교육 접근성#!\n#N -10% 동화, -5% 권위, -50 관료주의#!\n\n#Y 결속력#!\n문해력은 이를 높이지만 인구의 10%를 초과하고 수용도가 매우 낮은 비일차 문화는 이를 낮춥니다.\n\n#Y 75 결속력#!\n#P +5% 자격, +3 합법성#!\n\n#Y 문화 프로젝트#!\n동등한 시민권 이니셔티브"
 ve_composite_identity_desc:0 "#header 복합 국가#!\n여러 민족이 협상된 기관을 통해 통치됩니다.\n\n#Y 활동 중#!\n#P -10% 문화 말살 및 이류 시민권의 급진파, +5% 영향력#!\n#N -15% 동화, -5% 권위, -75 관료주의#!\n\n#Y 결속력#!\n진정한 다수의 인구가 이를 높입니다. 인구의 90%가 넘는 일차 문화는 이 모델을 약화시킵니다.\n\n#Y 응집력 75에서#!\n#P +5% 영향력, +3 합법성#!\n\n#Y 문화 프로젝트#!\n제헌 협약"
 ve_identity_change_cost_tt:0 "아이덴티티 모델을 변경하려면 다음이 필요합니다. #Y 200 문화명령#! 활성 ID 전환 백래시가 없습니다. 변경으로 인해 Cohesion이 다음으로 재설정됩니다. #Y 35#!, 원인 #Y 5년 전환 반발#! 추가 취소 벌금 없이 진행 중인 문화 프로젝트를 취소합니다."
 ve_cultural_mandate:0 "문화 명령"
 ve_culture_reform_point:0 "문화 명령"
 ve_cultural_mandate_hint:0 "문화 프로젝트에 지출되었습니다. 저축하는 것은 안전하지만 소득은 400에서 절반으로 줄어들고 500에서 멈춥니다."
 ve_culture_reform_point_tt:0 "#header Cultural Mandate#!\n현재: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n월별 변화: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y 소비되는 금액#!\n문화 프로젝트(75-150) 및 정체성 모델 변경(200). 둘 다 필요하지 않습니다: 위임장을 저장하는 것은 안전하며, 수입은 400에서 절반만 줄어들고 500에서 중지됩니다.\n\n#Y 월별 분석#!\n기반: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\n합법성: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\n행정: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\n모델 사회: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\n안정 및 문화 운동: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\n법 정렬: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\n아이디어 교리: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\n캡 승수: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y 아이디어 교리 — 현재 아이덴티티 모델만 계산됩니다.#!\n#P 민족국가#!: 민족주의 V #P +1#!\n#P 시민국가#!: 개혁주의 V #P +1#!; 학문적 V #P +1#!\n#P 복합 상태#!: 개혁주의 V #P +1#!\n위의 활성 합계는  #Y +2#!로 제한됩니다.\n\nCivic Nation은 모델 사회 구성요소를 문해력에서, 복합 국가는 다원 사회의 문해력에서, 민족 국가는 1차 문화 인구통계학적 강점에서 가져옵니다.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "국민적 결속"
 ve_national_cohesion_hint:0 "신원 모델이 생성하는 균형을 향해 표류합니다. 75+에서는 불안정성이 25 이하인 경우 보너스를 얻습니다."
 ve_national_cohesion_tt:0 "#header 국가 결속력#!\n현재: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n균형: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n월간 이동: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n공통 조건: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\n정체성 모델 조건: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\n결속력은 매달 평형을 향한 거리의 20%씩 이동합니다(최대 5). 포인트. 급진적인 문화 운동은 균형을 10만큼 감소시킵니다. 75 이상이면 현재 모델은 추가 혜택을 제공합니다. 25 이하에서는 국가 불안정이 적용됩니다.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "효과 없음"
 ve_cultural_projects:0 "문화 프로젝트"
 ve_cultural_projects_intro:0 "문화 프로젝트는 #Y 선택 과목#!. 한 번에 하나만 실행할 수 있습니다. 위임 비용은 즉시 지불되고 #N -75 관료주의 및 -25 권위#! 운영되는 동안 신청하세요. 프로젝트를 완료하면 일부 임무가 환불되고 결속력이 높아집니다. 전국 프로젝트는 완료 혜택이 만료된 후에만 반복될 수 있습니다. 완료된 상태/문화 대상은 다시 선택할 수 없습니다.\n#Y 전체 효과를 보려면 카드나 미터에 마우스를 올리세요.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "프로젝트 진행 중"
 ve_cultural_project_progress:0 "프로젝트 진행 상태"
 ve_cultural_project_progress_tt:0 "#header 월간 프로젝트 진행 상태#!\n현재: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n남은: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\n월간 합계: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (최소 1, 최대 7)\n\n#Y 월간 분석#!\n기본: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\n행정: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\n합법성: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\n모델 사회: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\n결속: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\n문화 운동: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\n대상 국가 혼란: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\n아이디어 그룹: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y 아이디어 그룹 — 현재 정체성 모델과 일치하는 보너스만 활성화됩니다.#!\n#P 민족 국가#!: 민족주의 VII #P +1#!\n#P 시민 국가#!: 개혁파 VII, 학술 VII 또는 복지 VI — #P +1#! 각\n#P 복합 국가#!: 개혁주의 VII 또는 외교 VI — #P +1#! 각각\n위의 활성 아이디어 그룹 합계는  #Y +2로 제한됩니다.#!; 추가 매칭 보너스는 진행 상황을 증가시키지 않습니다.\n\n모델 사회는 활성 아이덴티티 모델에 따라 시민 문해력, 인종적 인구통계학적 집중 또는 복합적 다양성을 보상합니다. 진행 상황이  #Y 100#!에 도달한 후 다음 월별 업데이트에서 완료가 결정됩니다."
 ve_cancel_cultural_project_button:0 "프로젝트 취소"
 ve_cancel_cultural_project_tt:0 "#header 문화 프로젝트 취소#!\n투자된 문화 명령은 다음과 같습니다. #N 환불되지 않았습니다#!. 국민통합이 무너지다 #N 5#! 그리고 #N 2년간의 반발#! 다른 프로젝트를 방해합니다."
 ve_start_cultural_project_button:0 "프로젝트 시작"
 ve_national_curriculum_name:0 "국가 커리큘럼"
 ve_national_curriculum_cost:0 "비용: #Y 100 문화 명령#!"
 ve_national_curriculum_short:0 "전국적인 학교 교육 개혁.\n#P +20 의무, +5 결속력#!, 더 나은 교육."
 ve_national_curriculum_desc:0 "#header 국가 커리큘럼#!\n학교 교육 개혁은 전국적으로 시행됩니다.\n\n#Y 비용#!\n#Y 100 문화 명령#!, 즉시 지급\n\n#Y 완료 시#!\n#P +20 문화 명령, +5 국가 결속#!\n\n#Y 이후 10년 동안#!\n#P +2% 교육 액세스, +5% 자격#!\n#N -25 관료주의#!"
 ve_national_curriculum_requirements_tt:0 "필요 #Y 100 문화 명령#!, 활성 문화 프로젝트 및 프로젝트 백래시 없음. 또한 이전에 시작하는 동안에는 시작할 수 없습니다. #Y 국가 커리큘럼#! 혜택이 활성화되었습니다."
 ve_shared_symbols_name:0 "공유 기호"
 ve_shared_symbols_cost:0 "비용: #Y 75 문화 명령#!"
 ve_shared_symbols_short:0 "기, 국가 및 공개 행사.\n#P +20 명령, +7 결속#!, 충성파 및 권위."
 ve_shared_symbols_desc:0 "#header 공유 상징#!\n국기, 성가 및 공개 행사가 전국적으로 홍보됩니다.\n\n#Y 비용#!\n#Y 75 문화 명령#!, 즉시 지불\n\n#Y 완료 시#!\n#P 문화 명령 +20, 국가 결속력 +7#!\n\n#Y 이후 8년 동안#!\n#P 완전히 수용된 대중의 충성파 +10%, 권위 +25#!"
 ve_shared_symbols_requirements_tt:0 "필요하다 #Y 75 문화 명령#!, 활성 문화 프로젝트 및 프로젝트 백래시가 없습니다. 또한 이전에 시작하는 동안에는 시작할 수 없습니다. #Y 공유 기호#! 혜택이 활성화되어 있습니다."
 ve_ethnic_campaign_name:0 "민족 통합 캠페인"
 ve_ethnic_campaign_cost:0 "비용: #Y 125 문화 명령#!"
 ve_ethnic_campaign_short:0 "한 국가에 다수의 소수를 동화시킵니다.\n#P +25 명령, +8 응집력#!, 하지만 이는 급진적인 성향을 낳습니다."
 ve_ethnic_campaign_desc:0 "#header 민족 통합 캠페인#!\n최대 규모의 비기본 문화권에 대해 단일 주에서 실행합니다. #Y 5%#! 해당 주의 인구 중\n\n#Y 비용#!\n#Y 125 문화 명령#!, 즉시 지불\n\n#Y 완료 시#!\n동화 #Y 5%#! 표적 배양액을 일차 배양액으로, 또는  #Y 7%#! 국민당 VII\n#P +25 문화 명령, +8 국가 결속#!\n남음 #Y 10년#! 국가의 동화 프로그램\n\n#Y 경고#!\n#N 프로젝트 시작과 종료 모두 대상 문화 사이에 급진적인 성향을 만듭니다.#!"
 ve_civic_initiative_name:0 "평등 시민권 이니셔티브"
 ve_civic_initiative_cost:0 "비용: #Y 100 Cultural Mandate#!"
 ve_civic_initiative_short:0 "한 주에서 소수의 수용을 높입니다.\n#P +25 위임장, +10 결속력#!, 충성파."
 ve_civic_initiative_desc:0 "#header 평등 시민권 이니셔티브#!\n최대 규모의 비주요 문화권을 바탕으로 단일 주에서 실행됩니다. #Y 5%#! 해당 주의 인구 중\n\n#Y 비용#!\n#Y 100 문화 명령#!, 즉시 지불\n\n#Y 완료 시#!\n#P +15 10년 동안 해당 문화에 대한 수용#!\n대상 국가의 충성주의자\n#P +25 문화 명령, +10 국가 결속력#!\n10년간 향상된 자격 및 이주 매력"
 ve_composite_compact_name:0 "헌법 협약"
 ve_composite_compact_cost:0 "비용: #Y 150 문화 명령#! 및 #Y 40 응집력#!"
 ve_composite_compact_short:0 "소수자를 구성 문화로 인식합니다.\n#P +30 위임, +12 응집력#!, 영구적으로."
 ve_composite_compact_desc:0 "#header Constituent Compact#!\n최소  #Y 5%를 보유하는 인식할 수 없는 비기본 문화권에 대한 단일 상태에서 실행#! 해당 국가 인구의 \n\n#Y 비용#!\n#Y 150 문화 명령#!, 즉시 지불, 최소  #Y 40 국민 결속#!\n\n#Y 완료 시#!\n#P +15 해당 문화에 대한 수용, 영구적으로 #!\n구성원 문화로 인식\n대상 국가의 충성주의자\n#P +30 문화 명령, +12 국민통합#!"
 ve_targeted_project_start_instruction:0 "#Y 시작하는 방법#!\n1. 자신의 주 중 하나를 엽니다.\n2.  #Y 프로젝트 시작을 누르세요#! 해당 주의 패널에 있습니다.\n대상 문화권과 아직 누락된 내용은 해당 버튼의 툴팁에 나열됩니다."
 ve_targeted_project_state_requirements_tt:0 "상태는 우리가 소유해야 하며 최소한 다음으로 구성된 적격 비기본 문화를 포함해야 합니다. #Y 5%#! 인구의. 가장 큰 적격 문화권이 대상이 됩니다. 해당 주에서 이미 완성된 문화는 다시 타겟팅할 수 없지만, 다른 주에서는 타겟팅할 수 있습니다. 현재 아이덴티티 모델의 비용과 요구 사항도 충족되어야 합니다."
