l_korean:
 ve_national_identity:0 "국가 정체성"
 ve_primary_cultures_label:0 "주류 문화"
 ve_identity_models:0 "정체성 제도"
 ve_identity_model_active_footer:0 "이미 활성화됨"
 ve_switch_identity_button:0 "전환"
 ve_switch_identity_cost_label:0 "비용 #Y 200 문화위임력#!"
 ve_begin_project_button:0 "사업 시작"
 ve_identity_models_help:0 "귀국의 정체성 제도는 항상 정확히 하나이며 #P 이미 활성화되어 있습니다#! — 여기서 따로 선택할 필요는 없습니다. 이 제도는 오직 #Y 국민통합도#!가 어떻게 획득되는지 그리고 어떤 문화 사업을 진행할 수 있는지만을 결정합니다.\n#Y 전환은 선택 사항입니다:#! #Y 200 문화위임력#!이 소모되며, 통합도가 #Y 35#!로 초기화되고, 진행 중인 문화 사업이 취소되며 5년 동안 다른 전환이 차단됩니다.\n#Y 전체 효과를 보려면 카드나 수치를 마우스로 가리키십시오.#!"
 ve_ethnic_identity_name:0 "민족국가"
 ve_civic_identity_name:0 "시민국가"
 ve_composite_identity_name:0 "복합국가"
 ve_ethnic_identity_short:0 "민족국가는 주류 문화를 중심으로 정의됩니다.\n통합도는 #Y 인구 구성상의 우위#!에서 비롯됩니다."
 ve_civic_identity_short:0 "교육을 통해 구축되는 정치적 민족국가입니다.\n통합도는 #Y 식자 및 수용된 소수집단#!에서 비롯됩니다."
 ve_composite_identity_short:0 "협상된 기관 아래의 여러 민족들입니다.\n통합도는 #Y 진정한 다원적 인구#!에서 비롯됩니다."
 ve_ethnic_identity_unlocks:0 "#Y 민족 통합 캠페인#! 사업을 해제합니다"
 ve_civic_identity_unlocks:0 "#Y 동등한 시민권 발의#! 사업을 해제합니다"
 ve_composite_identity_unlocks:0 "#Y 구성 협약#! 사업을 해제합니다"
 ve_ethnic_identity_desc:0 "#header 민족국가#!\n민족국가는 주류 문화를 중심으로 정의됩니다.\n\n#Y 활성화 중 효과#!\n#P 융화 +15%, 권위 +5%#!\n#N 이주 유치 -5%, 공공의 편견으로 인한 급진파 +5%#!\n\n#Y 통합도#!\n주류 문화가 인구의 60~75% 이상을 차지할 때 상승하며, 40% 미만으로 떨어지면 급격히 하락합니다.\n\n#Y 통합도 75 달성 시#!\n#P 징병률 +5%, 정통성 +3#!\n\n#Y 문화 사업#!\n민족 통합 캠페인"
 ve_civic_identity_desc:0 "#header 시민국가#!\n공유된 정치적 민족국가는 교육과 참여를 통해 구축됩니다.\n\n#Y 활성화 중 효과#!\n#P 이주 유치 +7%, 교육 접근성 +1%#!\n#N 융화 -10%, 권위 -5%, 행정력 -50#!\n\n#Y 통합도#!\n식자율이 이를 높이지만, 인구의 10%를 초과하는 비주류 문화의 수용도가 매우 낮으면 하락합니다.\n\n#Y 통합도 75 달성 시#!\n#P 자격 +5%, 정통성 +3#!\n\n#Y 문화 사업#!\n동등한 시민권 발의"
 ve_composite_identity_desc:0 "#header 복합국가#!\n여러 민족이 협상된 기관을 통해 통치됩니다.\n\n#Y 활성화 중 효과#!\n#P 문화 말살 및 2급 시민권으로 인한 급진파 -10%, 영향력 +5%#!\n#N 융화 -15%, 권위 -5%, 행정력 -75#!\n\n#Y 통합도#!\n진정한 다원적 인구가 이를 높이며, 주류 문화가 90%를 초과하는 인구는 이 제도를 약화시킵니다.\n\n#Y 통합도 75 달성 시#!\n#P 영향력 +5%, 정통성 +3#!\n\n#Y 문화 사업#!\n구성 협약"
 ve_identity_change_cost_tt:0 "정체성 제도를 변경하려면 #Y 200 문화위임력#!이 필요하며 활성화된 정체성 전환 반발이 없어야 합니다. 변경 시 통합도가 #Y 35#!로 초기화되고, #Y 5년 간의 전환 반발#!이 발생하며 추가 취소 페널티 없이 진행 중인 문화 사업이 취소됩니다."
 ve_cultural_mandate:0 "문화위임력"
 ve_culture_reform_point:0 "문화위임력"
 ve_cultural_mandate_hint:0 "문화 사업에 소모됩니다. 비축해도 안전하지만, 400에 도달하면 수입이 반토막 나고 500에 도달하면 중단됩니다."
 ve_culture_reform_point_tt:0 "#header 문화위임력#!\n현재: #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n월간 변화량: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y 소모처#!\n문화 사업(75~150) 및 정체성 제도 변경(200). 둘 다 필수가 아닙니다. 위임력을 비축해도 안전하며, 수입은 400에서 반토막 나고 500에서 중단됩니다.\n\n#Y 월간 내역#!\n기본: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\n정통성: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\n행정: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\n모형 사회: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\n안정 및 문화 운동: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\n법률 부합도: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\n이념 교리: [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\n상한 배수: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y 이념 교리 — 현재 정체성 제도만 적용됩니다#!\n#P 민족국가#!: 민족주의 V #P +1#!\n#P 시민국가#!: 개혁 V #P +1#!; 학술 V #P +1#!\n#P 복합국가#!: 개혁 V #P +1#!\n위의 활성화된 총합은 #Y +2#!로 제한됩니다.\n\n시민국가는 식자율에서 모형 사회 요소를 도출하고, 복합국가는 다원 사회의 식자율에서, 민족국가는 주류 문화 인구 우위에서 도출합니다.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "국민통합도"
 ve_national_cohesion_hint:0 "정체성 제도가 산출하는 균형점을 향해 표류합니다. 75 이상에서는 보너스를 얻고, 25 이하에서는 불안정이 발생합니다."
 ve_national_cohesion_tt:0 "#header 국민통합도#!\n현재: #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n균형점: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n월간 변동: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n일반 조건: [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\n정체성 제도 조건: [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\n국민통합도는 매월 균형점을 향해 남은 거리의 20%만큼, 최대 5포인트까지 이동합니다. 과격한 문화 운동은 균형점을 10 감소시킵니다. 75 이상일 때 현재 제도는 추가적인 이점을 부여하며, 25 이하일 때 국가적 불안정이 적용됩니다.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "효과 없음"
 ve_cultural_projects:0 "문화 사업"
 ve_cultural_projects_intro:0 "문화 사업은 #Y 선택 사항#!입니다. 한 번에 하나의 사업만 진행할 수 있습니다. 사업의 문화위임력 비용이 즉시 지불되며, 진행되는 동안 #N 행정력 -75 및 권위 -25#! 효과가 적용됩니다. 사업을 완료하면 일부 문화위임력이 환급되고 국민통합도가 상승합니다. 국가 전역 대상 사업은 완료 이익이 만료된 후에만 반복할 수 있으며, 이미 완료된 주/문화 대상은 다시 선택할 수 없습니다.\n#Y 전체 효과를 보려면 카드나 수치를 마우스로 가리키십시오.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "진행 중인 사업"
 ve_cultural_project_progress:0 "사업 진척도"
 ve_cultural_project_progress_tt:0 "#header 월간 사업 진척도#!\n현재: #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n남음: #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\n월간 합계: [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (최소 1, 최대 7)\n\n#Y 월간 세부 내역#!\n기본: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\n행정: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\n정통성: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\n제도 사회: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\n결속력: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\n문화 운동: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\n대상 주 갈등: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\n이념 무리: [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y 이념 무리 — 현재 정체성 제도와 일치하는 보너스만 활성화됩니다#!\n#P 민족국가#!: 민족주의 VII #P +1#!\n#P 시민국가#!: 개혁 VII, 학술 VII, 또는 복지 VI — 각각 #P +1#!\n#P 복합국가#!: 개혁 VII 또는 외교 VI — 각각 #P +1#!\n위의 활성화된 이념 무리 합계는 #Y +2#!로 상한이 설정되며, 일치하는 보너스가 더 있더라도 진척도가 증가하지 않습니다.\n\n제도 사회는 활성화된 정체성 제도에 따라 시민 식자, 민족 인구 집중도, 또는 복합적 다양성에 대한 보상을 제공합니다. 진척도가 #Y 100#!에 도달한 후 다음 월간 갱신 시점에 완료 처리됩니다."
 ve_cancel_cultural_project_button:0 "사업 취소"
 ve_cancel_cultural_project_tt:0 "#header 문화 사업 취소#!\n투자된 문화위임력은 #N 환급되지 않습니다#!. 국민통합도가 #N 5#! 하락하며 #N 2년간의 반발#!으로 인해 다른 사업을 진행할 수 없게 됩니다."
 ve_start_cultural_project_button:0 "사업 시작"
 ve_national_curriculum_name:0 "국가 교육과정"
 ve_national_curriculum_cost:0 "비용: #Y 문화위임력 100#!"
 ve_national_curriculum_short:0 "국가 전역의 학교 교육 개혁.\n#P 위임력 +20, 통합도 +5#! 및 향상된 교육."
 ve_national_curriculum_desc:0 "#header 국가 교육과정#!\n국가 전역에서 진행되는 학교 교육 개혁입니다.\n\n#Y 비용#!\n#Y 문화위임력 100#!,즉시 지불\n\n#Y 완료 시#!\n#P 문화위임력 +20, 국민통합도 +5#!\n\n#Y 이후 10년 동안#!\n#P 교육 접근성 +2%, 자격 +5%#!\n#N 행정력 -25#!"
 ve_national_curriculum_requirements_tt:0 "#Y 문화위임력 100#!, 진행 중인 문화 사업 없음, 그리고 사업 반발 없음이 필요합니다. 또한 이전 #Y 국가 교육과정#! 이점이 활성화되어 있는 동안에는 시작할 수 없습니다."
 ve_shared_symbols_name:0 "공유 상징"
 ve_shared_symbols_cost:0 "비용: #Y 문화위임력 75#!"
 ve_shared_symbols_short:0 "국기, 국가 및 대중 의식.\n#P 위임력 +20, 통합도 +7#! 및 충성파와 권위."
 ve_shared_symbols_desc:0 "#header 공유 상징#!\n국가 전역에서 장려되는 국기, 국가 및 대중 의식입니다.\n\n#Y 비용#!\n#Y 문화위임력 75#!, 즉시 지불\n\n#Y 완료 시#!\n#P 문화위임력 +20, 국민통합도 +7#!\n\n#Y 이후 8년 동안#!\n#P 완전히 수용된 인구층으로부터의 충성파 +10%, 권위 +25#!"
 ve_shared_symbols_requirements_tt:0 "#Y 문화위임력 75#!, 진행 중인 문화 사업 없음, 그리고 사업 반발 없음이 필요합니다. 또한 이전 #Y 공유 상징#! 이점이 활성화되어 있는 동안에는 시작할 수 없습니다."
 ve_ethnic_campaign_name:0 "민족 통합 캠페인"
 ve_ethnic_campaign_cost:0 "비용: #Y 문화위임력 125#!"
 ve_ethnic_campaign_short:0 "한 주의 거대 소수 민족을 융화합니다.\n#P 위임력 +25, 통합도 +8#!이지만 급진파가 발생합니다."
 ve_ethnic_campaign_desc:0 "#header 민족 통합 캠페인#!\n단일 주 내에서 해당 주 인구의 최소 #Y 5%#!를 차지하는 최대 비주류 문화와 진행합니다.\n\n#Y 비용#!\n#Y 125 문화위임력#!, 즉시 지불\n\n#Y 완료 시#!\n대상 문화 인구의 #Y 5%#!를 주류 문화로 융화 (민족주의 VII 적용 시 #Y 7%#!)\n#P +25 문화위임력, +8 국민통합도#!\n해당 주에 #Y 10년#! 동안 지속되는 융화 프로그램 잔존\n\n#Y 경고#!\n#N 프로젝트의 시작과 완료 모두 대상 문화 내에 급진파를 발생시킵니다.#!"
 ve_civic_initiative_name:0 "동등한 시민권 발의"
 ve_civic_initiative_cost:0 "비용: #Y 100 문화위임력#!"
 ve_civic_initiative_short:0 "어느 한 주의 소수 문화 수용도를 높입니다.\n#P +25 위임력, +10 결속력#! 및 충성파."
 ve_civic_initiative_desc:0 "#header 동등한 시민권 발의#!\n단일 주 내에서 해당 주 인구의 최소 #Y 5%#!를 차지하는 최대 비주류 문화와 진행합니다.\n\n#Y 비용#!\n#Y 100 문화위임력#!, 즉시 지불\n\n#Y 완료 시#!\n#P 10년 동안 해당 문화 수용도 +15#!\n대상 주의 충성파\n#P +25 문화위임력, +10 국민통합도#!\n10년 동안 향상된 자격 및 이주 유치"
 ve_composite_compact_name:0 "구성 협약"
 ve_composite_compact_cost:0 "비용: #Y 150 문화위임력#! 및 #Y 40 결속력#!"
 ve_composite_compact_short:0 "소수 문화를 구성 문화로 승인합니다.\n#P +30 위임력, +12 결속력#! (영구)."
 ve_composite_compact_desc:0 "#header 구성 협약#!\n단일 주 내에서 해당 주 인구의 최소 #Y 5%#!를 차지하는 미승인 비주류 문화와 진행합니다.\n\n#Y 비용#!\n#Y 150 문화위임력#! (즉시 지불) 및 최소 #Y 40 국민통합도#!\n\n#Y 완료 시#!\n#P 영구적으로 해당 문화 수용도 +15#!\n구성 문화로 승인\n대상 주의 충성파\n#P +30 문화위임력, +12 국민통합도#!"
 ve_targeted_project_start_instruction:0 "#Y 시작 방법#!\n1. 보유한 주 중 하나를 엽니다.\n2. 해당 주의 패널에서 #Y 프로젝트 시작#!을 누릅니다.\n대상 문화 및 아직 충족되지 않은 조건들은 해당 버튼의 툴팁에 표시됩니다."
 ve_targeted_project_state_requirements_tt:0 "주는 우리가 소유하고 있어야 하며, 인구의 최소 #Y 5%#!를 구성하는 적합한 비주류 문화가 있어야 합니다. 가장 큰 적합 문화가 대상이 됩니다. 이 주에서 이미 완료된 문화는 다시 대상으로 지정할 수 없으나, 다른 주에서는 대상으로 지정할 수 있습니다. 현재 정체성 제도의 비용과 요구 조건 또한 충족되어야 합니다."
 ve_targeted_cultural_project_target:0 "대상: #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!의 #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#!"
