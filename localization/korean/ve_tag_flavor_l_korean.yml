l_korean:
 ve_tag_flavor_delayed_result_tt:0 "이 제도적 선택의 결과는 대략 1년 후에 나타날 것입니다."
 ve_tag_flavor_free_route_tt:0 "이 진로는 국가식견, 문화위임력 또는 종교개혁력을 소모하지 않습니다."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "공통 시민권 어휘"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "공유된 공식 어휘는 학교와 지방 관청에 개혁을 전파하지만, 끊임없는 설명은 중앙의 권위를 소모합니다."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "신성한 연속성"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "개혁이 세습된 종교 기관을 통해 구상됨에 따라 지휘는 강화되는 반면 외래 방법론이 유통되는 통로는 좁아집니다."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "행정적 번역"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "관료제는 개혁을 익숙한 절차로 번역합니다. 행정은 더욱 안정되지만 입법적 변화의 속도는 다소 느려집니다."
 ve_tag_flavor.1.t:0 "개혁의 언어"
 ve_tag_flavor.1.d:0 "칙령이 흠잡을 데 없는 문장으로 수도를 떠나더라도 학교, 법원, 지방 관청 또는 종교 재단에 도착하면 네 가지의 서로 다른 지시가 되곤 합니다. 개혁가들은 이제 공통된 어휘를 요구하고 있습니다. 문제는 어떤 기관이 그 어휘에 의미를 부여할 것인가입니다."
 ve_tag_flavor.1.a:0 "공통의 시민국가 어휘를 기획한다."
 ve_tag_flavor.1.a.tt:0 "시민국가 또는 복합국가 필요.\n지금 #N 20 문화위임력#! 소모.\n대략 1년 후: #P 8 국가식견#! 및 #P 3 국민통합도#! 획득, 이후 24개월 동안 #P +1% 교육 접근성#! 및 #N -25 권위#! 획득."
 ve_tag_flavor.1.b:0 "신성한 연속성을 바탕으로 개혁을 뿌리내린다."
 ve_tag_flavor.1.b.tt:0 "고백적 종교 제도 필요.\n지금 #N 20 종교개혁력#! 소모.\n대략 1년 후: #P 8 국가식견#! 및 #P 3 종교합의#! 획득, 이후 24개월 동안 #P +25 권위#! 및 #N -2.5% 기술 전파#! 획득."
 ve_tag_flavor.1.c:0 "각 관청이 알아서 명령을 번역하게 둔다."
 ve_tag_flavor.1.c.tt:0 "대략 1년 후: #P 4 국가식견#! 획득, 이후 24개월 동안 #P +25 행정력#! 및 #N -2.5% 법 제정 속도#! 획득."
 ve_tag_flavor.2.t:0 "절차가 된 단어들"
 ve_tag_flavor.2.d:0 "1년 동안 이어진 회람, 해설, 교과서, 설교 및 지방 서신은 개혁 프로그램에 업무용 언어를 부여했습니다. 완벽하게 일일이 같지는 않으나, 이제 관료들은 어떤 문구가 합의를 이끌어내고 어떤 문구가 여전히 불화를 감추고 있는지 알고 있습니다."
 ve_tag_flavor.2.a:0 "어휘가 국가의 기계 장치 속으로 들어간다."
 ve_tag_flavor.2.a.tt:0 "1년 전에 선택한 결과가 이제 효력을 발휘합니다. 자원 변화량은 일반적인 한도로 고정되며, 제도적 변화 요인은 24개월 동안 지속됩니다."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "번역 국"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "전문 기관들이 외래 방법론의 유통을 가속화하지만, 이들의 자율성은 중앙의 즉각적인 지휘를 약화시킵니다."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "통제된 수용"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "수입된 기관들이 중앙의 지휘 아래 재편됩니다. 권위는 보존되지만 각 개혁이 공식적인 통로를 통과하는 데는 더 오랜 시간이 걸립니다."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "선별적 채택"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "국가는 기득 권위와 조화될 수 있는 방법론만 허용하며, 확산의 속도를 정치적 통제와 맞바꿉니다."
 ve_tag_flavor.10.t:0 "빌려온 방법론, 토착의 권위"
 ve_tag_flavor.10.d:0 "외국의 교본, 기계, 학교 계획안, 행정 도표가 어떤 부처가 판단할 수 있는 것보다 더 빨리 도착하고 있습니다. 일부 관료들은 상설 번역 기관을 요구하는 반면, 다른 이들은 수입된 모든 기관이 중앙의 지휘 아래 재조립되어야 한다고 주장합니다. 제3의 파벌은 기존 질서를 교란하지 않고 흡수할 수 있는 것만을 허용하려 합니다."
 ve_tag_flavor.10.a:0 "번역 국을 설립한다."
 ve_tag_flavor.10.a.tt:0 "학술 이념 IV 또는 사회간접자본 이념 IV 필요.\n지금 #N 15 국가식견#! 소모.\n대략 1년 후: #P 10 시대동력#! 획득, 이후 24개월 동안 #P +2.5% 기술 전파#! 및 #N -25 권위#! 획득."
 ve_tag_flavor.10.b:0 "오직 중앙의 지휘 아래서만 수입한다."
 ve_tag_flavor.10.b.tt:0 "일본 국가 이념 IV 필요.\n지금 #N 10 국가식견#! 소모.\n대략 1년 후: #P 7 시대동력#! 획득, 이후 24개월 동안 #P +25 권위#! 및 #N -2.5% 법 제정 속도#! 획득."
 ve_tag_flavor.10.c:0 "선별적으로 채택하고 지휘를 보존한다."
 ve_tag_flavor.10.c.tt:0 "대략 1년 후: #P 3 시대동력#! 획득, 이후 24개월 동안 #P +25 권위#! 및 #N -2.5% 기술 전파#! 획득."
 ve_tag_flavor.11.t:0 "우리의 것으로 거듭난 방법론"
 ve_tag_flavor.11.d:0 "1년 동안의 번역, 시험, 재초안 작성 및 공식적인 논쟁은 참신함과 유용성을 구분 지었습니다. 채택된 방법론은 더 이상 외국의 지시사항처럼 보이지 않으며, 국가 고유의 지휘 어휘로 편입되었습니다."
 ve_tag_flavor.11.a:0 "검증을 살아남은 것을 사용한다."
 ve_tag_flavor.11.a.tt:0 "1년 전에 선택한 결과가 이제 효력을 발휘합니다. 시대동력은 정상적인 하한선인 영 아래로 떨어지지 않으며, 제도적 변화 요인은 24개월 동안 지속됩니다."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "시민권 협약"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "공통의 시민권 언어는 이주와 참여를 더 쉽게 만들지만, 모든 관할 구역에 걸쳐 협약을 설명하는 것은 중앙의 권위를 소모합니다."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "복합적 타협"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "연방 행정부는 구성 공동체들 간의 협상법을 체득하여, 단일 문화적 형태를 향한 압박을 줄이는 동시에 관청을 강화합니다."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "연방의 모호성"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "고의적인 모호함은 연합의 외교적 발언권을 넓히지만 한동안 국가 결속 균형을 2만큼 낮춥니다."
 ve_tag_flavor.20.t:0 "연방의 의미"
 ve_tag_flavor.20.d:0 "이주민들, 기성 주들, 그리고 서로 다른 공공 관습을 지닌 공동체들 모두 각자의 입장에서 연방을 호명합니다. 입법자들은 공통된 공식이 필요하다는 점에는 동의하나, 그것이 개인 시민권을 정의해야 할지, 구성 공동체들 간의 타협을 보존해야 할지, 혹은 각 관할 구역이 해석할 수 있도록 충분히 포괄적으로 남겨두어야 할지에는 의견을 달리합니다."
 ve_tag_flavor.20.a:0 "시민권 협정을 작성한다."
 ve_tag_flavor.20.a.tt:0 "시민국가 필요.\n지금 #N 20 문화위임력#!을 소모합니다.\n약 1년 후: #P 8 국가식견#! 및 #P 3 국민통합도#!를 획득하며, 이후 24개월 동안 #P +2.5% 이주 유치#! 및 #N -25 권위#!를 얻습니다."
 ve_tag_flavor.20.b:0 "복합적 타협을 협상한다."
 ve_tag_flavor.20.b.tt:0 "복합국가 필요.\n지금 #N 20 문화위임력#!을 소모합니다.\n약 1년 후: #P 8 국가식견#! 및 #P 3 국민통합도#!를 획득하며, 이후 24개월 동안 #P +25 행정력#! 및 #N -2.5% 융화#!를 얻습니다."
 ve_tag_flavor.20.c:0 "연방의 공식을 의도적으로 포괄적으로 둔다."
 ve_tag_flavor.20.c.tt:0 "약 1년 후: #P 4 국가식견#! 및 #P +25 영향력#!을 24개월 동안 획득합니다. 변화 요인이 활성화되어 있는 동안 국민통합도 균형점이 #N 2 낮아집니다#!."
 ve_tag_flavor.21.t:0 "연방을 위한 공식"
 ve_tag_flavor.21.d:0 "1년 동안의 대회, 위원회 보고서, 주 결의안, 그리고 공론을 거쳐 기관이 활용할 수 있는 문안이 마련되었습니다. 그 침묵은 선언만큼이나 중대하며, 연방이 해결할 분쟁과 협상에 맡길 분쟁을 규정합니다."
 ve_tag_flavor.21.a:0 "공식이 공공의 삶에 스며들도록 한다."
 ve_tag_flavor.21.a.tt:0 "1년 전에 선택된 결과가 이제 효력을 발휘합니다. 자원 변화량은 통상적인 한도로 제한되며, 기관 변화호인은 24개월 동안 지속됩니다."
