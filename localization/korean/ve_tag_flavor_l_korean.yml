l_korean:
 ve_tag_flavor_delayed_result_tt:0 "이 제도적 선택의 결과는 약 1년 후에 나타날 것입니다. "
 ve_tag_flavor_free_route_tt:0 "이 경로에는 국가 통찰력, 문화 명령 또는 경건 개혁이 필요하지 않습니다. "
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "공통 시민 어휘 "
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "공유된 공식 어휘는 학교와 지방 사무소에 개혁을 가져오지만 끊임없는 설명은 중앙 권위를 소비합니다."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "신성한 연속성"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "개혁은 계승된 종교 기관을 통해 이루어졌으며, 명령을 강화하는 동시에 외국 방법이 유통되는 경로를 좁혔습니다."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "행정번역"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "관료제는 개혁을 익숙한 절차로 전환합니다. 행정은 안정되지만 입법 변화는 속도를 잃는다."
 ve_tag_flavor.1.t:0 "개혁의 언어"
 ve_tag_flavor.1.d:0 "법령은 흠 잡을 데 없는 산문으로 수도를 떠날 수 있으며 학교, 법원, 지방 사무소 또는 종교 재단에 네 가지 다른 지침으로 전달될 수 있습니다. 개혁자들은 이제 공통된 어휘를 요구합니다. 문제는 누구 기관이 해당 어휘에 의미를 부여할 것인가입니다. "
 ve_tag_flavor.1.a:0 "공통 시민 어휘집 초안을 작성합니다. "
 ve_tag_flavor.1.a.tt:0 "시민 국가 또는 복합 국가가 필요합니다.\n소비  #N 20 문화 명령#! 지금.\n약 1년 후: 증가 #P 8 내셔널 인사이트#! 그리고  #P 3 국민적 결속력 #!을 얻으세요. #P +1% 교육 액세스#! 그리고 #N 24개월 동안 -25 Authority#! ."
 ve_tag_flavor.1.b:0 "신성한 연속성을 바탕으로 한 기반 개혁."
 ve_tag_flavor.1.b.tt:0 "고백 종교 모델이 필요합니다.\n지출 #N 20 신앙 개혁#! 지금.\n약 1년 후: 증가 #P 8 내셔널 인사이트#! 및 #P 3 종교적 정착#!, 그런 다음 이득 #P +25 권위#! 및 #N -2.5% 기술 확산#! 은 24개월 동안입니다."
 ve_tag_flavor.1.c:0 "각 국에서 명령을 번역하도록 합니다."
 ve_tag_flavor.1.c.tt:0 "약 1년 후: 이득 #P 4 National Insight#!, 그다음 획득 #P +25 관료주의#! 그리고 #N -2.5% 법률 제정 속도#! 24개월."
 ve_tag_flavor.2.t:0 "말이 절차가 됩니다."
 ve_tag_flavor.2.d:0 "1년간의 회람, 논평, 교과서, 설교 및 지방 서신을 통해 개혁 프로그램에 실무 언어가 제공되었습니다. 완벽하게 균일하지는 않지만 관리들은 이제 어떤 문구가 합의를 명령하는지, 어떤 문구가 불일치를 숨기는지 알고 있습니다. "
 ve_tag_flavor.2.a:0 "어휘는 국가 기관에 들어갑니다."
 ve_tag_flavor.2.a.tt:0 "1년 전에 선택한 결과가 이제 적용됩니다. 자원 변경은 정상 한도로 제한되며 제도적 수정은 24개월 동안 지속됩니다."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "번역국"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "전문 사무소는 외국 방법의 유통을 가속화하지만, 이들의 자율성은 센터의 즉각적인 명령을 약화시킵니다."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "직접 차입"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "수입기관은 중앙의 지시에 따라 개편된다. 권위는 유지되지만 각 개혁이 공식 채널을 통과하는 데 더 오랜 시간이 걸립니다."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "선택적 채택"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "국가는 확립된 권위와 조화될 수 있는 방법만을 인정하며 확산 속도를 정치적 통제와 맞바꾼다. "
 ve_tag_flavor.10.t:0 "빌린 방법, 자국의 권위 "
 ve_tag_flavor.10.d:0 "외국의 매뉴얼, 기계, 학교 계획, 행정 테이블은 어떤 부처가 판단할 수 있는 것보다 더 빨리 도착한다. 일부 공무원은 영구 번역 사무소를 요구합니다. 다른 사람들은 빌린 모든 기관이 중앙의 지시에 따라 개편되어야 한다고 주장합니다. 세 번째 세력은 기존 질서를 어지럽히지 않고 흡수할 수 있는 것만 인정합니다."
 ve_tag_flavor.10.a:0 "번역국을 설립하세요."
 ve_tag_flavor.10.a.tt:0 "학술 아이디어 IV 또는 인프라 아이디어 IV가 필요합니다.\n지출 #N 15 내셔널 인사이트#! 지금.\n약 1년 후: 증가 #P 10 Era Momentum#! 이후 획득 #P +2.5% 기술 확산#! and #N -25 권위#! 24개월 동안."
 ve_tag_flavor.10.b:0 "센트럴 디렉션에서만 빌리세요."
 ve_tag_flavor.10.b.tt:0 "일본 국가 이념 IV가 필요합니다.\n지출 #N 10 내셔널 인사이트#! 지금.\n약 1년 후: 증가 #P 7시대 모멘텀#!, 그런 다음 이득 #P +25 권위#! 그리고 #N -2.5% 법률 제정 속도#! 24개월 동안."
 ve_tag_flavor.10.c:0 "선택적으로 채택하고 명령을 유지합니다."
 ve_tag_flavor.10.c.tt:0 "약 1년 후: 이득 #P 3시대 모멘텀#!, 그런 다음 이득 #P +25 권위#! 그리고 #N 24개월 동안 -2.5% 기술 확산#! ."
 ve_tag_flavor.11.t:0 "우리만의 방법"
 ve_tag_flavor.11.d:0 "1년간의 번역, 테스트, 재작성 및 공식 논의를 통해 참신함과 유용성이 분리되었습니다. 채택된 방법은 더 이상 외국 지침으로 나타나지 않습니다. 그들은 국가의 명령 어휘에 들어갔습니다."
 ve_tag_flavor.11.a:0 "검사에서 살아남은 것을 사용하십시오."
 ve_tag_flavor.11.a.tt:0 "1년 전에 선택한 결과가 이제 적용됩니다. Era Momentum은 정상적인 0점을 유지하며 제도적 수정치는 24개월 동안 지속됩니다."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "시민권 협약"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "시민권에 대한 공통 언어는 도착과 참여를 더 쉽게 만들지만 모든 관할권에 걸쳐 협약을 설명하는 데는 중앙 권한이 필요합니다."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "복합 특가"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "연방 행정부는 단일 문화적 형태에 대한 압력을 줄이면서 구성 공동체 간의 협상을 배우게 됩니다. "
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "연방의 모호함"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "고의적인 모호함은 연합의 외교적 발언권을 넓히지만 한동안 국가 결속 균형을 2만큼 낮춥니다."
 ve_tag_flavor.20.t:0 "연합의 의미"
 ve_tag_flavor.20.d:0 "새로 도착한 주, 기존 주, 다양한 공공 관습을 지닌 지역사회는 모두 자신만의 방식으로 연방을 호소합니다. 입법자들은 공통 공식이 필요하다는 데 동의하지만, 그것이 개인의 시민권을 정의해야 하는지, 구성 공동체 간의 협상을 유지해야 하는지, 각 관할권이 해석할 만큼 충분히 광범위하게 유지되어야 하는지는 동의하지 않습니다."
 ve_tag_flavor.20.a:0 "시민권 계약서를 작성하세요."
 ve_tag_flavor.20.a.tt:0 "시민 국가가 필요합니다.\n #N 20 문화 명령을 소비하세요.#! 지금.\n약 1년 후: 증가 #P 8 내셔널 인사이트#! 그리고  #P 3 국민적 결속#!, 그런 다음 이득 #P +2.5% 이주 매력#! 그리고 #N -25 권한#! 24개월 동안."
 ve_tag_flavor.20.b:0 "종합 협상을 협상합니다."
 ve_tag_flavor.20.b.tt:0 "복합 상태가 필요합니다.\n지출 #N 20 문화명령#! 지금.\n약 1년 후: 증가 #P 8 내셔널 인사이트#! 그리고  #P 3 국민적 결속#!, 그런 다음 이득 #P +25 관료주의#! 그리고 #N -2.5% 동화#! 24개월 동안."
 ve_tag_flavor.20.c:0 "의도적으로 연방 공식을 광범위하게 둡니다."
 ve_tag_flavor.20.c.tt:0 "약 1년 후: 이득 #P 4 국가적 통찰력#! 그리고 #P 24개월 동안 +25 영향력#! . 수정자가 활성화되어 있는 동안 국가 응집력 균형은 다음과 같습니다. #N 2개 더 낮음#!."
 ve_tag_flavor.21.t:0 "연합을 위한 공식"
 ve_tag_flavor.21.d:0 "1년간의 협약, 위원회 보고서, 주 결의안, 공개 논쟁을 통해 기관에서 사용할 수 있는 언어가 탄생했습니다. 그 침묵은 연합이 어떤 분쟁을 해결하고 어떤 분쟁을 협상에 맡길지를 정의하는 선언만큼 중요합니다."
 ve_tag_flavor.21.a:0 "공식을 공공 생활에 적용해 보세요."
 ve_tag_flavor.21.a.tt:0 "1년 전에 선택한 결과가 이제 적용됩니다. 자원 변경은 정상 한도로 제한되며 제도적 수정자는 24개월 동안 지속됩니다."
