l_korean:
 ve_piety:0 "신앙심"
 ve_piety_reform:0 "종교개혁력"
 ve_piety_reform_tt:0 "#header 종교개혁력#!\n현재: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n월간 획득량: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y 월간 내역#!\n기본: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\n정통성: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\n행정력: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\n독실파 지지: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\n이념 교리: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y 이념 교리 — 현재 종교 제도만 반영됩니다#!\n#P 신조국가 / 국가무신론#!: 민족주의 V #P +1#!\n#P 신앙의 자유 / 완전 분리#!: 개혁 V #P +1#!\n위의 활성화된 합계는 최대 #Y +1#!로 제한되므로 두 경로가 중첩되지 않습니다.\n\n교리 및 프로그램(#Y 각각 25#!)과 대상 지정 종교 사업(#Y 100-150#!, 제도에 따라 다름)에 소모됩니다. 획득량은 #Y 400#!을 초과하면 감소하며 #Y 500#!에서 중단됩니다.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "교리 및 프로그램"
 ve_piety_tt:0 "#header 종교합의#!\n현재 상태: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n사회적 균형점: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n월간 변동: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y 균형점 내역#!\n합의 제도: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\n제도 지지: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\n정통성, 행정력 및 안정도: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\n수치는 매월 균형점을 향해 #Y 20%#!씩 이동하며, 최대 #Y ±5#!로 제한됩니다.\n#P 75#! 이상: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\n#N 25#! 이하: #N 정통성 -5 및 법 제정 성공 -5%#!.\n\n이 수치는 더 이상 프로그램을 지불하는 데 사용되지 않으며, 종교개혁력을 참조하십시오. 프로그램은 최소 #Y 25#!의 종교개혁력이 필요하며, #Y 25#!를 소모하고 #Y 24개월#!의 과부하를 부과합니다.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "종교 사업"
 ve_religious_project_progress_tt:0 "#header 대상 지정 종교 사업#!\n진척도: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n월간 진척도: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (최소 1, 최대 7)\n\n#Y 월간 내역#!\n기본: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\n행정력: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\n정통성: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\n제도 지지: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\n합의: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\n종교 운동: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\n대상 주 갈등: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\n이념 무리: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y 이념 무리 — 현재 종교 제도와 일치하는 보너스만 적용됩니다#!\n#P 신조국가#!: 민족주의 VII #P +1#!\n#P 신앙의 자유#!: 개혁 VII #P +1#!\n#P 국가무신론#!: 민족주의 VII #P +1#! 및 학술 VII #P +1#!\n위의 활성화된 이념 무리 합계는 최대 #Y +2#!로 제한됩니다.\n\n소유한 주의 패널에서 시작하십시오. 신조국가 및 국가무신론은 완료 시 대상 주의 인구 중 #Y 5%#!를 개종시키며 (민족주의 VII 적용 시 #Y 7%#!), 급진파를 추가합니다. 신앙의 자유는 강제 개종 대신 충성파를 추가합니다. 완전 분리는 사업을 시작할 수 없습니다 — 완전한 중립 제도이기 때문입니다.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "진행 중"
 ve_religious_project_none:0 "활성화된 사업 없음"

