 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "종교 제도"
 ve_religious_models_help:0 "귀하의 종교 제도는 #Y 교회와 국가#! 법에 의해 결정되며 #P 이미 활성화되어 있습니다#! - 여기서는 선택할 수 있는 것이 없습니다. 이 제도는 #Y 종교합의#!가 획득되는 방식, 채택할 수 있는 8개의 프로그램, 그리고 진행할 수 있는 종교 사업만을 결정합니다.\n#Y 법을 변경하는 것은 선택 사항입니다:#! 합의를 #Y 35#!로 초기화하고, 채택한 모든 프로그램을 제거하며, 진행 중인 종교 사업을 취소하고 #Y 3~5년#! 간의 합의 위기를 적용합니다.\n#Y 전체 효과를 보려면 카드나 미터에 마우스를 올리십시오.#!"
 ve_religious_model_active_footer:0 "현재 제도"
 ve_confessional_state_short:0 "교회와 국가가 함께 통치합니다.\n합의는 #Y 종교인 찬성 및 정치력#!에서 비롯됩니다."
 ve_freedom_state_short:0 "모든 신앙은 하나의 국가 아래 용인됩니다.\n합의는 #Y 평온하고 잘 운영되는 국가#!에서 비롯됩니다."
 ve_separation_state_short:0 "국가는 어떠한 종교적 입장도 취하지 않습니다.\n합의는 가장 높은 상태에서 시작되며 #Y 낮은 갈등#!에 대해 보상합니다."
 ve_atheism_state_short:0 "능동적인 국가 주도 세속화.\n합의는 #Y 식자 및 지식인#!으로부터 얻습니다."
 ve_confessional_state_unlocks:0 "#Y 신조 개종#! 사업을 시행합니다"
 ve_freedom_state_unlocks:0 "#Y 자유 포교#! 사업을 시행합니다"
 ve_separation_state_unlocks:0 "#N 종교 사업을 시행할 수 없음#!"
 ve_atheism_state_unlocks:0 "#Y 세속화 운동#! 사업을 시행합니다"
 ve_confessional_state_desc:0 "#header 신조국가#!\n교회와 국가가 함께 통치합니다.\n\n#Y 활성화 중#!\n#P +5% 권위, +10% 개종, +10% 종교인 정치적 힘#!\n#N -3% 이주 유치, +5% 공공 편견으로 인한 급진파#!\n더불어 국교의 신앙 분파(기독교, 이슬람교, 유대교, 다르마, 학술 또는 애니미즘)에 따른 소규모 보너스 1종.\n\n#Y 종교합의#!\n기본 균형점 #Y 55#!. 종교인 찬성과 정치력이 이를 가장 크게 움직입니다.\n\n#Y 합의 75 도달 시#!\n#P +5% 권위, +5 정통성#!\n\n#Y 종교 사업#!\n신조 개종"
 ve_freedom_state_desc:0 "#header 양심의 자유#!\n단일 국가 아래 모든 신앙이 용인됩니다.\n\n#Y 활성화 중#!\n#P +5% 이주 유치, -5% 공공 편견으로 인한 급진파#!\n#N -15% 개종, -25 행정력#!\n\n#Y 종교합의#!\n기본 균형점 #Y 55#!. 낮은 갈등, 정통성 및 건전한 행정력이 이를 높입니다.\n\n#Y 합의 75 도달 시#!\n#P +5% 이주 유치, +5 정통성#!\n\n#Y 종교 사업#!\n자유 포교"
 ve_separation_state_desc:0 "#header 정교분리#!\n중립 모델: 국가는 어떠한 종교적 입장도 취하지 않습니다.\n\n#Y 활성화 중#!\n#P +8% 이주 유치, -10% 공공 편견으로 인한 급진파, -5% 폭력적 적대감으로 인한 급진파#!\n#N -30% 개종#!\n\n#Y 종교합의#!\n기본 균형점 #Y 60#!으로 네 모델 중 가장 높습니다. 낮은 갈등이 이를 더욱 높입니다.\n\n#Y 합의 75 도달 시#!\n#P +5% 법 제정 성공, +5 정통성#!\n\n#Y 종교 사업#!\n#N 없음. 본 모델은 의도적으로 종교 캠페인이 존재하지 않습니다.#!"
 ve_atheism_state_desc:0 "#header 국가무신론#!\n관용적인 모델이 아닌 공격적인 세속화 모델입니다.\n\n#Y 활성화 중#!\n#P +5% 기술 전파, +2% 교육 접근성, +20% 개종#!\n#N -5% 권위, -10% 종교인 정치적 힘, +5% 공공 편견으로 인한 급진파#!\n\n#Y 종교합의#!\n기본 균형점 #Y 45#!으로 네 모델 중 가장 낮습니다. 식자율과 지식인 찬성이 이를 높이며, 강력한 종교인 정치력이 이를 낮춥니다.\n\n#Y 합의 75 도달 시#!\n#P +5% 기술 전파, +5% 행정력#!\n\n#Y 종교 사업#!\n세속화 운동\n\n#Y 참고#!\n식자율이 50% 미만이거나 종교인 정치력이 20% 이상일 때 이 모델로 전환하면 3년이 아니라 #N 5년#!의 위기를 겪게 됩니다."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "프로그램은 #Y 선택 사항#!이며 영구적입니다. 각 프로그램은 #Y 25 종교개혁력#!이 소모되며 #Y 24개월#!의 구현 과부하가 시작되어 이 기간 동안 추가 프로그램을 채택할 수 없습니다. 8개의 프로그램 모두 현재 종교 제도에 속하며 해당 제도가 변경되면 상실됩니다.\n#Y 전체 효과를 보려면 카드나 수치에 마우스를 올리십시오.#!"
 ve_religious_program_strain_notice:0 "프로그램이 여전히 구현 중입니다. 해당 과부하가 만료될 때까지 추가 프로그램을 채택할 수 없습니다."
 ve_religious_program_adopted_badge:0 "채택됨"
 ve_adopt_program_button:0 "채택"
 ve_religious_program_cost_label:0 "비용: #Y 25 종교개혁력#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "대상 지정 종교 사업"
 ve_religious_projects_intro:0 "종교 사업은 #Y 선택 사항#!이며 한 번에 하나만 진행할 수 있습니다. 종교개혁력 비용은 즉시 지불되며 진행되는 동안 #N -50 행정력 및 -25 권위#!가 적용됩니다. 완료 시 일부 종교개혁력이 환급되며 종교합의가 상승합니다.\n#Y 전체 효과를 보려면 카드나 수치에 마우스를 올리십시오.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "진행 중인 사업"
 ve_religious_project_backlash_notice:0 "취소된 사업은 여전히 새로운 사업을 가로막습니다. 24개월의 반발 기간이 먼저 만료되어야 합니다."
 ve_religious_project_start_instruction:0 "#Y 시작하는 방법#!\n1. 소유한 주 중 하나를 엽니다.\n2. 해당 주의 패널에서 #Y 사업 시작#!을 누릅니다.\n아직 충족되지 않은 조건은 해당 버튼의 툴팁에 나열됩니다."
 ve_targeted_religious_project_target:0 "대상: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "사업 대상 없음"
 ve_no_active_religious_project:0 "활성화된 종교 사업 없음"
 ve_confessional_conversion_name:0 "신조 개종"
 ve_confessional_conversion_cost:0 "비용: #Y 125 종교개혁력#!"
 ve_confessional_conversion_short:0 "한 주의 종교를 국교로 개종시킵니다.\n완료 시 #P +20 종교개혁력, +5 합의#! - 그러나 급진파가 발생합니다."
 ve_confessional_conversion_desc:0 "#header 신조 개종#!\n자신들의 종교 비중이 #Y 90%#! 미만인 단일 주에서 실행합니다.\n\n#Y 비용#!\n#Y 125 종교개혁력#!, 즉시 지불\n\n#Y 진행 중#!\n국가 전체에 #N -50 행정력, -25 권위#!\n대상 주의 #N +20% 개종 및 +20% 급진주의 경로#!\n\n#Y 완료 시#!\n주의 인구 중 #Y 5%#!를 국교로 개종(민족주의 VII 적용 시 #Y 7%#!)\n#P +20 종교개혁력, +5 종교합의#!\n\n#Y 경고#!\n#N 개종으로 인해 대상 주에 급진파가 발생합니다.#!"
 ve_freedom_outreach_name:0 "자유 포교"
 ve_freedom_outreach_cost:0 "비용: #Y 100 종교개혁력#!"
 ve_freedom_outreach_short:0 "개종을 강제하지 않고 한 주의 마음을 얻습니다.\n완료 시 #P +20 종교개혁력, +7 합의#! 및 충성파 획득."
 ve_freedom_outreach_desc:0 "#header 자유 포교#!\n자신의 종교 신도 비율이 #Y 90%#! 미만인 단일 주에서 실행합니다.\n\n#Y 비용#!\n#Y 종교개혁력 100#!, 즉시 지불\n\n#Y 실행 중 효과#!\n국가 전역의 #N 행정력 -50, 권위 -25#!\n\n#Y 완료 시#!\n#P 강제 개종 없음#! - 대신 대상 주의 충성파\n#P 종교개혁력 +20, 종교합의 +7#!"
 ve_secularization_campaign_name:0 "세속화 운동"
 ve_secularization_campaign_cost:0 "비용: #Y 종교개혁력 150#!"
 ve_secularization_campaign_short:0 "한 주의 종교를 무신론으로 개종합니다.\n완료 시 #P 종교개혁력 +25, 종교합의 +8#! - 그러나 급진파가 발생합니다."
 ve_secularization_campaign_desc:0 "#header 세속화 운동#!\n자신의 종교 비중이 #Y 90%#! 미만인 단 하나의 주에서 시행됩니다.\n\n#Y 비용#!\n#Y 종교개혁력 150#!, 즉시 지불\n\n#Y 진행 중 효과#!\n국가의 #N 행정력 -50, 권위 -25#!\n대상 주의 #N 개종 +20% 및 급진파 유입 +20%#!\n\n#Y 완료 시#!\n주 인구의 #Y 5%#!를 무신론으로 개종, 민족주의 VII 적용 시 #Y 7%#!\n#P 종교개혁력 +25, 종교합의 +8#!\n\n#Y 경고#!\n#N 해당 개종은 대상 주에서 급진파를 발생시킵니다.#!"
 ve_religious_project_unavailable_name:0 "가능한 종교 사업 없음"
 ve_religious_project_unavailable_cost:0 "#N 완전 분리 상태에서는 종교 사업을 진행할 수 없습니다#!"
 ve_religious_project_unavailable_short:0 "중립 모델은 고의로 종교 운동을 진행하지 않습니다. 종교 사업을 원할 경우 다른 교회와 주 법을 제정하십시오."
 ve_religious_project_unavailable_desc:0 "#header 가능한 종교 사업 없음#!\n완전 분리는 완전한 중립 모델이며 대상 종교 사업을 시작할 수 없습니다.\n\n국교, 신앙의 자유, 국가 무신론은 각각 고유한 사업을 진행합니다. 이를 이용하려면 일치하는 교회와 주 법을 제정하십시오."

