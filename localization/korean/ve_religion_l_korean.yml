 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "종교 모델"
 ve_religious_models_help:0 "귀하의 종교 모델은 귀하에 의해 결정됩니다. #Y 정교#! 법과 이다 #P 이미 활동 중#! - 여기서는 선택할 수 있는 것이 없습니다. 모델은 방법만 결정합니다. #Y 종교적 정착#! 어떤 8가지 프로그램을 채택할 수 있는지, 어떤 종교 프로젝트를 실행할 수 있는지에 대해 알아보세요.\n#Y 법률 변경은 선택 사항입니다.#! 결제가 다음으로 재설정됩니다. #Y 35#!, 채택한 모든 프로그램을 제거하고 실행 중인 종교 프로젝트를 취소하고 #Y 3-5년#! 정착 위기.\n#Y 모든 효과를 보려면 카드나 측정기에 마우스를 올리세요.#!"
 ve_religious_model_active_footer:0 "현재 모델"
 ve_confessional_state_short:0 "교회와 국가는 함께 통치합니다.\n해결은 다음에서 이루어집니다. #Y 독실한 승인과 영향력#!."
 ve_freedom_state_short:0 "모든 신앙은 한 국가에서 허용됩니다.\n정착은 다음에서 비롯됩니다. #Y 조용하고 잘 운영되는 나라#!."
 ve_separation_state_short:0 "국가는 종교적 지위를 전혀 갖고 있지 않습니다.\n정착은 가장 높은 금액으로 시작되며 보상이 제공됩니다. #Y 낮은 혼란 #!."
 ve_atheism_state_short:0 "적극적인 국가 주도의 세속화.\n정착은 다음에서 옵니다. #Y 읽고 쓰는 능력과 인텔리젠시아#!."
 ve_confessional_state_unlocks:0 "실행 #Y 신앙 개종#! 프로젝트"
 ve_freedom_state_unlocks:0 " #Y 자유 봉사 활동#! 프로젝트를 실행합니다"
 ve_separation_state_unlocks:0 "#N 종교 프로젝트를 실행할 수 없습니다#!"
 ve_atheism_state_unlocks:0 " #Y 세속화 캠페인#! 프로젝트를 실행합니다"
 ve_confessional_state_desc:0 "#header 고백 국가#!\n교회와 국가가 함께 통치합니다.\n\n#Y 활동 중#!\n#P +5% 권위, +10% 개종, +10% 독실한 정치적 힘#!\n#N -3% 이주 매력, +5% 공개적인 편견으로 인한 급진파#!\n추가로 국교의 신앙 가족(기독교, 이슬람교, 유대교, 다르미즘, 학자 또는 애니미스트)을 위한 작은 패키지 하나.\n\n#Y 정착#!\n기본 평형 #Y 55#!. 독실한 승인과 영향력이 가장 많이 움직입니다.\n\n#Y 75 정착지#!\n#P +5% 권위, +5 합법성#!\n\n#Y 종교 프로젝트#!\n고백 개종"
 ve_freedom_state_desc:0 "#header 양심의 자유#!\n모든 신앙은 하나의 주에서 용인됩니다.\n\n#Y 활성 상태에서#!\n#P +5% 이주 매력, 공개적인 편견으로 인한 급진주의 -5%#!\n#N -15% 전환, -25 관료주의#!\n\n#Y 정착#!\n기본 균형 #Y 55#!. 낮은 혼란, 정당성 및 건전한 행정이 이를 높입니다.\n\n#Y 75 Settlement에서#!\n#P +5% 이민 매력, +5 합법성#!\n\n#Y 종교 프로젝트#!\n자유 봉사 활동"
 ve_separation_state_desc:0 "#header 완전한 분리#!\n중립 모델: 국가는 종교적 입장을 취하지 않습니다.\n\n#Y 활동하는 동안#!\n#P +8% 이민 매력, 공개 편견으로 인한 급진파 -10%, 폭력으로 인한 급진파 -5% 적대감#!\n#N -30% 전환#!\n\n#Y 정착#!\n기본 평형 #Y 60#!, 4가지 중 가장 높습니다. 낮은 혼란은 그것을 더욱 증가시킵니다.\n\n#Y 75 합의에서#!\n#P +5% 법 제정 성공, +5 합법성#!\n\n#Y 종교 프로젝트#!\n#N 없음. 이 모델은 의도적으로 종교적 캠페인을 하지 않습니다.#!"
 ve_atheism_state_desc:0 "#header 국가 무신론#!\n관용적인 모델이 아닌 공격적인 세속화 모델입니다.\n\n#Y 활동하는 동안#!\n#P +5% 기술 확산, +2% 교육 접근, +20% 전환#!\n#N -5% 권위, -10% 독실한 정치적 힘, 공개적 편견#!\n\n#Y 정착#!\n기본 균형 #Y 45#!, 넷 중 가장 낮습니다. 읽고 쓰는 능력과 Intelligentsia 승인이 이를 높입니다. 강력한 독실한 영향력은 이를 낮춥니다.\n\n#Y 정착 75에서#!\n#P +5% 기술 확산, +5% 관료주의#!\n\n#Y 종교사업#!\n세속화 캠페인\n\n#Y 참고#!\n이 모델로 전환하는 데 드는 비용은 #N 5년#! 읽고 쓰는 능력이 50% 미만이거나 종교적 영향력이 20% 이상인 경우 3 대신 위기입니다."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "프로그램은 #Y 선택 과목#! 영구적입니다. 각 비용 #Y 25 신앙 개혁#! 그리고 시작한다 #Y 24개월#! 더 이상 프로그램을 채택할 수 없는 실행 부담. 8개 모두 현재 종교 모델에 속하며 해당 모델이 변경되면 사라집니다.\n#Y 전체 효과를 보려면 카드나 미터에 마우스를 올리세요.#!"
 ve_religious_program_strain_notice:0 "프로그램은 아직 구현 중입니다. 해당 유형이 만료될 때까지 더 이상 프로그램을 채택할 수 없습니다."
 ve_religious_program_adopted_badge:0 "채택됨"
 ve_adopt_program_button:0 "입양하다"
 ve_religious_program_cost_label:0 "비용 #Y 25 경건 개혁#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "대상 종교 프로젝트"
 ve_religious_projects_intro:0 "종교 프로젝트는 #Y 선택 과목#! 한 번에 하나만 실행할 수 있습니다. 신앙 개혁 비용은 즉시 지불되며 #N -50 관료주의 및 -25 권위#! 운영되는 동안 신청하세요. 완료하면 일부 신앙 개혁이 환불되고 종교적 정착이 증가합니다.\n#Y 전체 효과를 보려면 카드나 측정기에 마우스를 올리세요.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "진행 중인 프로젝트"
 ve_religious_project_backlash_notice:0 "취소된 프로젝트는 여전히 새 프로젝트를 차단합니다. 24개월 백래시가 먼저 만료되어야 합니다."
 ve_religious_project_start_instruction:0 "#Y 시작 방법#!\n1. 자신의 주 중 하나를 엽니다.\n2. 해당 주의 패널에서  #Y 프로젝트 시작#! 을 누르십시오.\n아직 누락된 항목은 해당 버튼의 툴팁에 나열됩니다."
 ve_targeted_religious_project_target:0 "목표: #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "프로젝트 대상 없음"
 ve_no_active_religious_project:0 "활성 종교 프로젝트 없음"
 ve_confessional_conversion_name:0 "고백적 전환"
 ve_confessional_conversion_cost:0 "비용: #Y 125 신앙 개혁#!"
 ve_confessional_conversion_short:0 "한 주를 국교로 전환합니다.\n#P +20 신앙 개혁, +5 정착#! 완료 시 - 그러나 그것은 급진적인 성향을 낳습니다."
 ve_confessional_conversion_desc:0 "#header 고해성사적 개종#!\n자신의 종교가 다음과 같은 단일 주에서 달리십시오. #Y 90%#!.\n\n#Y 비용#!\n#Y 125 신앙 개혁#!, 즉시 지불\n\n#Y 실행하는 동안#!\n#N -50 관료주의, -25 권위#! 국가를 위해\n#N 전환율 +20% 및 급진주의 채널 +20%#! 대상 상태에서\n\n#Y 완료 시#!\n전환 #Y 5%#! 해당 주의 인구를 귀하의 국교로 바꾸거나 #Y 7%#! 민족주의자 VII\n#P +20 신앙 개혁, +5 종교 정착#!\n\n#Y 경고#!\n#N 개종은 대상 국가에 급진파를 만듭니다.#!"
 ve_freedom_outreach_name:0 "자유 봉사 활동"
 ve_freedom_outreach_cost:0 "비용: #Y 100 신앙 개혁#!"
 ve_freedom_outreach_short:0 "개종을 강요하지 않고 하나의 주를 획득하세요.\n#P +20 신앙 개혁, +7 정착#! 완료되면 충성스러운 사람들도 추가됩니다."
 ve_freedom_outreach_desc:0 "#header 자유 봉사 활동#!\n자신의 종교가 다음과 같은 단일 주에서 달리십시오. #Y 90%#!.\n\n#Y 비용#!\n#Y 100 신앙 개혁#!, 즉시 지불\n\n#Y 실행하는 동안#!\n#N -50 관료제, -25 국가의 권위#! \n\n#Y 완료 시#!\n#P 강제 개종 없음#! -대신 대상 국가의 충성파\n#P +20 신앙 개혁, +7 종교 정착#!"
 ve_secularization_campaign_name:0 "세속화 캠페인"
 ve_secularization_campaign_cost:0 "비용: #Y 150 신앙 개혁#!"
 ve_secularization_campaign_short:0 "한 국가를 무신론으로 전환합니다.\n#P +25 신앙 개혁, 완료 시 +8 정착#!  - 하지만 급진적이 됩니다."
 ve_secularization_campaign_desc:0 "#header 세속화 캠페인#!\n자신의 종교 비율이  #Y 90%#! 미만인 단일 주에서 실행하세요.\n\n#Y 비용#!\n#Y 150 신앙 개혁#!, 즉시 지불\n\n#Y 실행하는 동안#!\n#N -50 관료제, -25 권위#! 국가의 경우\n#N 전환율 +20% 및 급진주의 채널 +20%#! 대상 주에서\n\n#Y 완료 시#!\n주 인구의 #Y 5%#! 를 무신론으로 전환하거나, #Y 7%#! 민족주의자 VII\n#P +25 경건 개혁, +8 종교 정착#!\n\n#Y 경고#!\n#N 개종은 대상 국가에 급진주의를 만듭니다.#!"
 ve_religious_project_unavailable_name:0 "사용 가능한 프로젝트 없음"
 ve_religious_project_unavailable_cost:0 "#N 완전 분리는 종교 프로젝트를 실행할 수 없습니다.#!"
 ve_religious_project_unavailable_short:0 "중립 모델은 의도적으로 종교 캠페인이 없습니다. 원하는 경우 다른 교회 및 주 법률을 제정하십시오."
 ve_religious_project_unavailable_desc:0 "#header 사용 가능한 프로젝트 없음#!\n완전한 분리는 완전히 중립적인 모델이며 특정 종교 프로젝트를 시작할 수 없습니다.\n\n고백 국가, 양심의 자유 및 국가 무신론은 각각 자체 프로젝트를 실행합니다. 하나를 얻으려면 일치하는 교회 및 주 법률을 제정하십시오."

