l_korean:
 ve_piety:0 "경건"
 ve_piety_reform:0 "경건 개혁"
 ve_piety_reform_tt:0 "#header 경건 개혁#!\n현재: #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n월 수입: [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y 월별 고장#!\n기본: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\n합법성: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\n행정: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\n종교적 지원: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\n이념 교리: [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y 사상 교리 — 현재 종교 모델만 계산됩니다#!\n#P 신앙 국가 / 국가 무신론#!: 민족주의자 V #P +1#!\n#P 양심의 자유 / 완전한 분리#!: 개혁주의자 V #P +1#!\n위의 활성 합계는 다음으로 제한됩니다. #Y +1#!, 따라서 두 경로가 중첩될 수 없습니다.\n\n교리와 프로그램에 소비됨(#Y 각각 25#! ) 및 대상 종교 프로젝트(#Y 100-150#!, 모델에 따라 다름). 소득은 과거보다 둔화 #Y 400#! 에서 정차 #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "교리와 프로그램"
 ve_piety_tt:0 "#header 종교 정착#!\n현재 상태: #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n사회 균형: #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n월간 운동: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y 균형 분석#!\n정산 모델: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\n모델 지원: [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\n합법성, 관리 및 안정성: [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\n미터가 움직입니다. #Y 20%#! 매월 균형을 향해, 다음으로 제한됩니다. #Y ±5#!.\n #P 75#!: [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\n #N 25#!  이하: #N -5 합법성 및 -5% 법률 제정 성공#!.\n\n이 측정기는 더 이상 프로그램 비용을 지불하지 않습니다. 신앙 개혁을 참조하세요. 프로그램에는 최소  #Y 25가 필요합니다.#! 신앙 개혁, 비용 #Y 25#! 그리고 부과 #Y 24개월#! 구현 부담.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "종교 프로젝트"
 ve_religious_project_progress_tt:0 "#header 대상 종교 프로젝트#!\n진행 상황: #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n월별 진행 상황: [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (최소 1, 최대 7)\n\n#Y 월간 분석#!\n기반: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\n행정: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\n합법성: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\n모델 지원: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\n정착: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\n종교 운동: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\n대상 국가 혼란: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\n아이디어 그룹: [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y 아이디어 그룹 — 현재 종교 모델과 일치하는 보너스만 활성화됩니다.#!\n#P 고백 국가#!: 민족주의자 VII #P +1#!\n#P 양심의 자유#!: 개혁주의자 VII #P +1#!\n#P 국가 무신론#!: 민족주의자 VII #P +1#!  및 Academic VII #P +1#!\n위의 활성 아이디어 그룹 합계는 최대  #Y +2#!로 제한됩니다.\n\n소유된 상태의 패널에서 하나를 시작하세요. 신앙고백과 국가 무신론 개종 #Y 5%#! 완료 시 대상 주의 인구 수, 또는 #Y 7%#! Nationalist VII와 함께 급진파를 추가하십시오. 양심의 자유는 개종을 강요하지 않고 충성파를 추가합니다. Total Separation은 프로젝트를 시작할 수 없습니다. 완전히 중립적인 모델입니다.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "진행 중"
 ve_religious_project_none:0 "활성 상태 없음"

