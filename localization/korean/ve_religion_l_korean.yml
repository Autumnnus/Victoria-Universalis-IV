 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "국교"
 ve_settlement_tier_high:0 "합의됨 - [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "분쟁 중 - #N 정통성 -5 및 법 제정 성공 -5%#!."
 ve_settlement_hint:0 "종교 제도가 생산하는 균형점을 향해 표류합니다. 75 이상에서는 보너스를 얻고, 25 이하에서는 불안정이 발생합니다."
