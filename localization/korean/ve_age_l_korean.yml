l_korean:
 ve_splendor:0 "#tooltippable_name 시대동력: "
 ve_age_of_victoria_title:0 "산업과 국가"
 ve_age_of_victoria_desc:0 "구체제는 공장, 철로, 식자 인구의 대중, 그리고 현대적 국가와 마주하고 있습니다. 물려받은 기관을 영속적인 국가 역량으로 전환하는 국가가 대세를 쥘 것입니다."
 ve_imperialism_age_title:0 "제국과 대중사회"
 ve_imperialism_age_desc:0 "산업은 대륙을 넘어 뻗어나가고, 교육, 공공 기관, 그리고 조직된 육군은 대중사회를 재편합니다. 열강은 해외로 팽창할 수 있으며, 소국들은 주권과 내부 개발을 통해 번영할 수 있습니다."
 ve_great_wars_age_title:0 "대중 정치와 총력전"
 ve_great_wars_age_desc:0 "전기, 기름, 대중의 정치 참여, 복지, 그리고 산업 전쟁이 국가와 사회 사이의 관계를 변화시킵니다. 이제 생존은 육군만큼이나 기관에 달려 있습니다."
 ve_age_notify_option:0 "새로운 시대가 밝아옵니다."
 ve_victorian_age_icon_p_tt:0 "#P 산업과 국가 (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N 산업과 국가 (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P 제국과 대중사회 (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N 제국과 대중사회 (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P 대중 정치와 총력전 (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N 대중 정치와 총력전 (1906–1936)"

 ve_golden_age:0 "황금기"
 ve_golden_age_industrial:0 "산업 황금기"
 ve_golden_age_cultural:0 "문화 황금기"
 ve_golden_age_strategic:0 "전략 황금기"
 ve_golden_age_tt:0 "현재 시대에서 #v 5가지 고유 목표#!를 완수한 후 #v 1845년#!부터 이용할 수 있습니다. 국가별로 게임 전체 통틀어 단 하나의 황금기만을 선택할 수 있으며, 그 효과는 #v 15년#! 동안 지속됩니다."
 ve_golden_age_requirement_unused:0 "이번 캠페인 동안 선택된 황금기가 없습니다."
 ve_golden_age_requirement_year:0 "#v 1845년#! 이후여야 합니다."
 ve_golden_age_requirement_objectives:0 "현재 시대에서 최소 #v 5가지 고유 목표#!를 완수하십시오."
 ve_golden_age_industrial_tt:0 "#header 산업 황금기#!\n#Y 15년#! 동안: #P 제조업 처리율 +10%#! 및 #P 자원 발견 확률 +10%#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header 문화 황금기#!\n#Y 15년#! 동안: #P 교육 접근성 +5%#! 및 #P 위신 +10%#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header 전략 황금기#!\n#Y 15년#! 동안: #P 육군 공격력 +5%#! 및 #P 사상자로 인해 발생한 전쟁 피로 -10%#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "시대 목표"

 ve_victorian_age_obj_title_1:0 "#tooltip_header 산업 이륙"
 ve_victorian_age_obj_desc_1:0 "소작농 비중을 40% 미만으로 낮추십시오."
 ve_victorian_age_obj_title_2:0 "#tooltip_header 구체제 종식"
 ve_victorian_age_obj_desc_2:0 "노예제를 금지하고 농노제를 폐지하십시오."
 ve_victorian_age_obj_title_3:0 "#tooltip_header 기능적 국가"
 ve_victorian_age_obj_desc_3:0 "품귀 현상이 임박하지 않은 상태에서 정통성 70 이상과 0 이상의 행정력 수지를 유지하십시오."
 ve_victorian_age_obj_title_4:0 "#tooltip_header 교육받은 대중"
 ve_victorian_age_obj_desc_4:0 "식자율 50% 또는 3단계 교육부를 달성하십시오."
 ve_victorian_age_obj_title_5:0 "#tooltip_header 통합된 시장"
 ve_victorian_age_obj_desc_5:0 "인구가 5백만 명 미만인 경우 철로 3단계 이상을, 그 이상인 경우 6단계 이상을 소유하십시오."
 ve_victorian_age_obj_title_6:0 "#tooltip_header 민족 각성"
 ve_victorian_age_obj_desc_6:0 "정통성 65 이상 및 국가 갈등 5% 미만을 유지하며 독립 상태를 유지하십시오."
 ve_victorian_age_obj_title_7:0 "#tooltip_header 세계적 영향력"
 ve_victorian_age_obj_desc_7:0 "대국 또는 열강이 되거나, 최소 5개의 선언된 이해를 유지하십시오."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header 산업력"
 ve_imperialism_age_obj_desc_1:0 "£100 million GDP에 도달하거나 소작농 비중을 25% 미만으로 낮추십시오."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header 대중 교육"
 ve_imperialism_age_obj_desc_2:0 "식자율 65%에 도달하거나 4단계 학교를 달성하십시오."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header 제국 또는 주권"
 ve_imperialism_age_obj_desc_3:0 "종속국을 2개 이상 보유하거나, 독립을 유지하고 열강으로 공인받으십시오."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header 세계 무역"
 ve_imperialism_age_obj_desc_4:0 "인구가 1천만 명 미만인 경우 항구 2레벨, 그 외의 경우 항구 10레벨을 소유하거나, 선포된 이해 5개를 유지하십시오."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header 민족국가 건설"
 ve_imperialism_age_obj_desc_5:0 "정통성 60 이상 및 국가 갈등 5% 미만을 유지하십시오."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header 사회 문제"
 ve_imperialism_age_obj_desc_6:0 "보건부, 직장 안전 또는 사회보장부를 2단계로 높이십시오."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header 현대적 육군"
 ve_imperialism_age_obj_desc_7:0 "육군에서 산병 또는 참호 보병을 최소 50%, 기동 포병을 10% 이상 편성하십시오."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header 대중 정치"
 ve_great_wars_age_obj_desc_1:0 "보통선거권 또는 평의회 공화국을 제정하거나, 의회 또는 대통령제로서 정통성 75를 유지하십시오."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header 복지 국가"
 ve_great_wars_age_obj_desc_2:0 "보건부, 사회보장부, 직장 안전, 교육부 중 두 가지 이상의 기관을 3단계 이상으로 유지하십시오."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header 전력화된 경제"
 ve_great_wars_age_obj_desc_3:0 "인구가 1천만 명 미만인 경우 발전소 1레벨, 그 외의 경우 발전소 5레벨을 소유하십시오."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header 기름과 엔진"
 ve_great_wars_age_obj_desc_4:0 "유정 또는 자동차 산업 5레벨 이상을 소유하십시오."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header 현대 군사"
 ve_great_wars_age_obj_desc_5:0 "육군에서 참호 또는 분대 보병을 최소 50%, 유산탄 포병을 15% 이상 편성하십시오."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header 총력전 역량"
 ve_great_wars_age_obj_desc_6:0 "육군 부대 40개와 무기 산업 5레벨 또는 탄약 공장 3레벨 이상을 유지하십시오."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header 세계적 영향력"
 ve_great_wars_age_obj_desc_7:0 "대국 또는 열강이 되거나, 세력 블록을 이끌거나, 선포된 이해를 최소 6개 유지하십시오."

 ve_age_splendor_tt:0 "#title 시대동력#!\n현재 보유량: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\n만족한 목표: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\n이념 그룹 (현재 시대, 최대 +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\n월간 변동: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\n이번 시대에 완료한 고유 목표: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\n이번 시대에 구매한 보상: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n다음 보상 비용: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y 이념 그룹의 기여 방식#!\n지정된 시대가 현재 진행 중일 때 일치하는 레벨 IV 그룹은 월 #P +1#!을 제공합니다. 윗줄은 활성화된 총합을 보여주며 최대 #Y +2#!로 제한됩니다.\n#P 1시대#!: 산업, 무역, 행정 및 학술 그룹\n#P 2시대#!: 자원, 사회, 외교, 민족주의/개혁 및 식민 그룹\n#P 3시대#!: 군사 및 전시 경제 그룹\n\n현재 만족된 각 목표 역시 매월 #P +1#!의 시대동력을 부여합니다. 이념 그룹은 목표 완료나 일회성 #P +50#! 보상에 영향을 주지 않습니다.\n\n보상 비용은 각 시대 내에서 단계적으로 확대됩니다: #Y 200, 300, 400, 500#!, 이후 모든 후속 보상에 #Y 600#!. 동력과 비용 단계는 새로운 시대가 시작될 때 초기화됩니다."
 ve_age_obj_efct_tt:0 "만족 중인 동안: 매월 #P +1 시대동력#!\n이번 시대 최초 완료: #P +50 시대동력#!"
 splendor_default_bonus:0 "시대동력을 최소 #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! 보유"
 ve_age_1_bonus_10_tt:0 "북이탈리아 또는 남이탈리아 주류 문화가 필요합니다."
 ve_age_2_bonus_10_tt:0 "오스트리아가 필요합니다."
 ve_age_3_bonus_10_tt:0 "대영 제국이 필요합니다."
 ve_age_1_bonus_11_tt:0 "북독일 또는 남독일 주류 문화가 필요합니다."
 ve_age_2_bonus_11_tt:0 "러시아가 필요합니다."
 ve_age_3_bonus_11_tt:0 "청나라가 필요합니다."
 ve_age_1_bonus_12_tt:0 "네덜란드가 필요합니다."
 ve_age_2_bonus_12_tt:0 "벨기에가 필요합니다."
 ve_age_3_bonus_12_tt:0 "프랑스가 필요합니다."
 ve_age_1_bonus_13_tt:0 "오스만 제국이 필요합니다."
 ve_age_2_bonus_13_tt:0 "미국이 필요합니다."
 ve_age_3_bonus_13_tt:0 "일본이 필요합니다."
