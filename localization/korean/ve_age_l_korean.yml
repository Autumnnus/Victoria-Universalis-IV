l_korean:
 ve_splendor:0 "#tooltippable_name 시대의 모멘텀: "
 ve_age_of_victoria_title:0 "산업과 국가"
 ve_age_of_victoria_desc:0 "오래된 질서가 공장, 철도, 지식 있는 대중, 현대 국가에 맞서고 있습니다. 모멘텀은 계승된 제도를 지속적인 국가 역량으로 전환하는 국가에 속합니다. "
 ve_imperialism_age_title:0 "제국과 대중사회"
 ve_imperialism_age_desc:0 "산업은 대륙을 넘어 교육, 공공 기관 및 조직화된 군대가 대중 사회를 재구성합니다. 강대국이 해외로 확장될 수도 있습니다. 작은 국가는 주권과 내부 개발을 통해 번영할 수 있습니다."
 ve_great_wars_age_title:0 "대중정치와 총력전"
 ve_great_wars_age_desc:0 "전기, 석유, 대중참여, 복지, 산업전은 국가와 사회의 관계를 변화시킵니다. 이제 생존은 군대만큼이나 제도에 달려 있습니다."
 ve_age_notify_option:0 "새로운 시대가 밝아옵니다."
 ve_victorian_age_icon_p_tt:0 "#P 산업과 국가(1836~1870)"
 ve_victorian_age_icon_n_tt:0 "#N 산업과 국가(1836~1870)"
 ve_imperialism_age_icon_p_tt:0 "#P 제국과 대중사회(1871~1905)"
 ve_imperialism_age_icon_n_tt:0 "#N 제국과 대중사회(1871~1905)"
 ve_great_war_age_icon_p_tt:0 "#P 대중정치와 총력전(1906~1936)"
 ve_great_war_age_icon_n_tt:0 "#N 대중정치와 총력전(1906~1936)"

 ve_golden_age:0 "황금시대"
 ve_golden_age_industrial:0 "산업 황금시대"
 ve_golden_age_cultural:0 "문화적 황금시대"
 ve_golden_age_strategic:0 "전략적 황금시대"
 ve_golden_age_tt:0 "사용 가능처 #v 1845년#! 완료 후 #v 5가지 뚜렷한 목표#! 지금 나이에. 국가는 전체 게임 동안 단 하나의 황금기를 선택할 수 있습니다. 그 효과는 지속된다 #v 15년#!."
 ve_golden_age_requirement_unused:0 "이 캠페인에서는 황금 시대를 선택하지 않았습니다."
 ve_golden_age_requirement_year:0 "연도가 필요합니다. #v 1845년#! 이상."
 ve_golden_age_requirement_objectives:0 "최소 완료 #v 5가지 뚜렷한 목표#! 현재 시대에."
 ve_golden_age_industrial_tt:0 "#header 산업 황금 시대#!\n대상 #Y 15년#!: #P +10% 제조 처리량#! 및 #P +10% 자원 발견 확률#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header 문화 황금기#!\n #Y 15년 동안#!: #P +5% 교육 접근성#! 그리고  #P +10% 명성#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header 전략적 황금기#!\n의 경우 #Y 15년#!: #P +5% 육군 공격력#! 그리고 #P -10% 사상자로 인한 전쟁 피로도#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "연령 목표"

 ve_victorian_age_obj_title_1:0 "#tooltip_header 산업 도약"
 ve_victorian_age_obj_desc_1:0 "농민 비율을 40% 이하로 줄입니다."
 ve_victorian_age_obj_title_2:0 "#tooltip_header 구질서 종식"
 ve_victorian_age_obj_desc_2:0 "노예 제도를 금지하고 농노제를 폐지합니다."
 ve_victorian_age_obj_title_3:0 "#tooltip_header 기능 국가"
 ve_victorian_age_obj_desc_3:0 "적어도 부족함이 없이 최소한 70개의 합법성과 음이 아닌 관료주의 균형을 유지합니다."
 ve_victorian_age_obj_title_4:0 "#tooltip_header 교육받은 대중"
 ve_victorian_age_obj_desc_4:0 "50% 문해력 또는 레벨 3에 도달합니다. 학교."
 ve_victorian_age_obj_title_5:0 "#tooltip_header 통합 시장"
 ve_victorian_age_obj_desc_5:0 "인구가 500만 명 미만인 경우 최소 3개의 철도 레벨을 소유하고, 그렇지 않으면 6개의 철도 레벨을 소유하세요."
 ve_victorian_age_obj_title_6:0 "#tooltip_header 국가 각성"
 ve_victorian_age_obj_desc_6:0 "적법성 65 이상 및 국가 혼란 5% 미만으로 독립하세요."
 ve_victorian_age_obj_title_7:0 "#tooltip_header 글로벌 도달범위"
 ve_victorian_age_obj_desc_7:0 "주요 또는 강대국이 되거나 최소한 5개의 선언된 이익을 유지하십시오."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header 산업력"
 ve_imperialism_age_obj_desc_1:0 "GDP 1억 파운드에 도달하거나 농민 점유율을 25% 미만으로 줄이십시오."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header 대중 교육"
 ve_imperialism_age_obj_desc_2:0 "65% 문해력 또는 레벨 4에 도달하십시오. 학교."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header 제국 또는 주권"
 ve_imperialism_age_obj_desc_3:0 "적어도 2개의 과목을 갖거나 독립적이고 인정을 받습니다."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header 글로벌 상업"
 ve_imperialism_age_obj_desc_4:0 "인구가 1천만 명 미만인 경우 2개의 항구 수준을 소유하고, 그렇지 않은 경우 10개의 항구 수준을 소유하거나 5개의 선언된 이익을 유지합니다."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header 국가 건설"
 ve_imperialism_age_obj_desc_5:0 "최소 60개의 정당성을 유지하고 국가 혼란을 5% 미만으로 유지합니다."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header 사회적 질문"
 ve_imperialism_age_obj_desc_6:0 "건강을 높이십시오. 시스템, 작업장 안전 또는 사회 보장을 레벨 2로."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header 현대 군대"
 ve_imperialism_age_obj_desc_7:0 "군에서 최소 50%의 소규모 접전 또는 참호 보병과 10%의 기동 포병을 배치합니다."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header 대중 정치"
 ve_great_wars_age_obj_desc_1:0 "보통 참정권 또는 평의회 공화국을 제정하거나 의회 또는 대통령 공화국으로서 75개의 합법성을 유지합니다."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header 사회 국가"
 ve_great_wars_age_obj_desc_2:0 "보건, 사회 중에서 최소 2개의 레벨 3 기관을 유지합니다. 보안, 작업장 안전 및 학교."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header 전기 경제"
 ve_great_wars_age_obj_desc_3:0 "인구가 1,000만 명 미만이면 발전소 레벨 1개를 소유하고, 그렇지 않으면 발전소 레벨 5개를 소유하세요."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header 오일 및 엔진"
 ve_great_wars_age_obj_desc_4:0 "석유 굴착 장치를 소유하거나 최소 5개의 자동차 산업 레벨을 소유하세요."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header 현대 군사"
 ve_great_wars_age_obj_desc_5:0 "군대에 최소 50%의 참호 또는 분대 보병과 15%의 파편 포병을 배치하세요."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header 총 전쟁 수용량"
 ve_great_wars_age_obj_desc_6:0 "40개의 군대 유닛과 최소 5개의 무기 산업 또는 3개의 군수 공장 레벨을 유지하세요."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header 세계 영향력"
 ve_great_wars_age_obj_desc_7:0 "주요 세력 또는 강대국이 되거나, 세력 블록을 이끌거나, 최소 6개의 선언된 이익을 유지하십시오."

 ve_age_splendor_tt:0 "#title Era Momentum#!\n현재 재고: #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\n만족된 목표: #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\n아이디어 그룹(현재 연령, 최대 +2): #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\n월간 변경: #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\n이 시대에 완료한 뚜렷한 목표: #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\n이 시대에 구매한 보상: #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n다음 보상 비용: #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y 아이디어 그룹이 기여하는 방법#!\n일치하는 레벨 IV 그룹은 모두 #P +1을 제공합니다.#! 할당된 연령이 현재인 동안에만 월별입니다. 위 줄은 최대  #Y +2#!까지의 활성 합계를 보여줍니다.\n#P 1세#!: 산업, 무역, 행정 및 학계 그룹\n#P 2세#!: 자원, 사회, 외교, 민족주의/개혁주의 및 식민주의 그룹\n#P 3세#!: 군사 및 전쟁 경제 그룹\n\n현재 달성된 각 목표는 또한  #P +1을 부여합니다#! 월별 시대 모멘텀. 아이디어 그룹은 목표 완료 또는 일회성 #P +50을 변경하지 않습니다.#! 보상.\n\n보상 비용은 각 연령 내에서 증가합니다:  #Y 200, 300, 400, 500#!, 그 다음에 #Y 이후 보상마다 600#! . 새로운 시대가 시작되면 추진력과 비용 사다리가 재설정됩니다."
 ve_age_obj_efct_tt:0 "만족하는 동안: #P +1 Era Momentum/월#!\n이 연령의 첫 번째 완료: #P +50 Era Momentum#!"
 splendor_default_bonus:0 "최소한  #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Era Momentum을 갖습니다."
 ve_age_1_bonus_10_tt:0 "북이탈리아 또는 남부 이탈리아 1차 문화가 필요합니다."
 ve_age_2_bonus_10_tt:0 "오스트리아가 필요합니다."
 ve_age_3_bonus_10_tt:0 "영국이 필요합니다."
 ve_age_1_bonus_11_tt:0 "북독일 또는 남부 독일 1차 문화가 필요합니다."
 ve_age_2_bonus_11_tt:0 "러시아가 필요합니다."
 ve_age_3_bonus_11_tt:0 "청나라가 필요합니다."
 ve_age_1_bonus_12_tt:0 "네덜란드가 필요합니다."
 ve_age_2_bonus_12_tt:0 "벨기에가 필요합니다."
 ve_age_3_bonus_12_tt:0 "프랑스가 필요합니다."
 ve_age_1_bonus_13_tt:0 "오스만 제국이 필요합니다."
 ve_age_2_bonus_13_tt:0 "미국이 필요합니다."
 ve_age_3_bonus_13_tt:0 "일본이 필요합니다."
