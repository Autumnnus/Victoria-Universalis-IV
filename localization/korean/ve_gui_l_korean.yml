 ve_freedom_of_conscience_tt:0 "#P 다원주의 국가 메커니즘과 1명의 선교사를 활성화합니다.#! 종교 조화는 안정적인 공존을 보상합니다."
 ve_total_separation_tt:0 "#P 다원주의 국가를 활성화합니다. 역학.#! 선교사는 장애인입니다."
 ve_ethnostate_tt:0 "#P 민족 국가 정체성 모델과 강력하게 일치합니다.#! 시민 국가와 충돌하며 복합 국가에는 적합하지 않습니다."
 ve_national_supremacy_tt:0 "#P 민족국가 정체성 모델과 일치합니다. #! 시민국가와 충돌합니다."
 ve_racial_segregation_tt:0 "#P 복합 상태 ID 모델과 일치합니다.#! 소수민족 국가에 대해서는 부분적인 지원만 제공합니다."
 ve_cultural_exclusion_tt:0 "#P 복합 주 정체성 모델(Composite State Identity Model)과 일치하며 부분적으로 시민 국가(Civic Nation)를 지원합니다.#!"
 ve_multicultural_tt:0 "#P 시민 국가 정체성 모델과 강하게 일치합니다. #! 민족 국가와 충돌합니다. "
 ve_send_missionary_tt:0 "#variable 선교자는 매일 현지 사람들의 종교를 개종합니다. #gold 6개월.\n\n#white 주 인구가 250,000 미만인 경우: #darker_white 0% #white 기본 변환 기본 전력 감소\n#white 주 인구가 50만 명 미만인 경우: #negative_value -0.02% #white 전환 기반 전력 감소\n#white 주 인구가 75만 명 미만인 경우: #negative_value -0.03% #white 전환 기반 전력 감소\n#white 주 인구가 1백만 명 미만인 경우: #negative_value -0.04% #white 전환 기본 전력 감소\n#white 주가 인구 500만명 미만: #negative_value -0.043% #white 전환 기반 전력 감소\n#white 국가 인구가 1000만명 미만인 경우: #negative_value -0.045% #white 전환 기반 전력 감소\n#white 국가 인구가 1000만명 이상인 경우: #negative_value -0.0475% #white 전환 기반 전력 감소"
 ve_targeted_cultural_project_state_action_tt:0 "#header 목표 문화 프로젝트#!\n관련 프로젝트 시작 현재 ID 모델을 사용합니다. 최소 #Y 5%#! 이 주 인구의 목표가 됩니다. 정확한 비용, 진행 규칙 및 결과를 보려면 국가 정체성 패널을 엽니다."
