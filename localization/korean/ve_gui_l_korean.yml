 ve_targeted_religious_project_state_action_tt:0 "#header 대상 종교 사업#!\n이 주의 종교 구성에 대해 현재 종교 제도와 연계된 사업을 시작합니다. 완전 분리 상태에서는 시작할 수 없습니다. 정확한 비용, 진척도 규칙 및 결과는 종교 패널을 참조하십시오."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name 대상 문화 사업"
 ve_start_religious_project_button:0 "사업 시작"
 ve_cancel_religious_project_button:0 "사업 취소"
 ve_confirm_cancel_button:0 "#N 예, 취소합니다#!"
 ve_keep_project_button:0 "사업 유지"
 ve_targeted_religious_project_state_requirements_tt:0 "해당 주는 우리 소유여야 하며, 우리 종교가 이미 해당 주 인구의 #Y 90%#! 이상을 차지하고 있지 않아야 합니다. 신조국가, 양심의 자유, 국가무신론은 각각 하나씩 시작할 수 있으나 정교분리는 불가능합니다. 활성화된 종교 제도의 종교개혁력 비용도 충족되어야 합니다."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "종교 제도가 대상 사업을 허용함 (정교분리는 시작할 수 없음)"
 ve_religious_project_req_no_active:0 "진행 중인 대상 종교 사업이 없음"
 ve_religious_project_req_no_backlash:0 "사업 취소 후 24개월의 재사용 대기시간 중이 아님"
 ve_religious_project_req_reform_point:0 "활성화된 종교 제도에 충분한 종교개혁력 (#Y 125#! 신조국가 / #Y 100#! 양심의 자유 / #Y 150#! 국가무신론)"
 ve_religious_project_req_target:0 "우리 종교가 이 주의 인구 중 #Y 90%#! 미만을 차지함"
 ve_religious_project_cancel_warning:0 "#header 대상 종교 사업을 취소하시겠습니까?#!\n\n지금까지 진행된 진척도가 상실됩니다. #N -5 종교합의#! 및 다른 사업을 시작하기 전까지 #N 24개월#!의 재사용 대기시간 변화 요인이 적용됩니다."
 ve_cultural_project_req_no_active:0 "진행 중인 문화 사업이 없음"
 ve_cultural_project_req_no_backlash:0 "사업 취소 후 24개월의 재사용 대기시간 중이 아님"
 ve_cultural_project_req_reform_point:0 "활성화된 정체성 제도에 충분한 문화위임력 (#Y 125#! 민족국가 / #Y 100#! 시민국가 / #Y 150#! 복합국가, 복합국가의 경우 결속력 #Y 40#! 추가)"
 ve_cultural_project_req_target:0 "이 주에 인구의 최소 #Y 5%#! 이상을 차지하는 적합한 비주류 문화가 존재함"
 ve_cultural_project_cancel_warning:0 "#header 문화 사업을 취소하시겠습니까?#!\n\n지금까지 진행된 진척도가 상실됩니다. #N -5 국민통합도#! 및 다른 사업을 시작하기 전까지 #N 24개월#!의 재사용 대기시간 변화 요인이 적용됩니다."
 alert_can_unlock_ideas_name:0 "이념 채택 가능"
 alert_can_unlock_ideas_hint:0 "채택된 이념 그룹 중 최소 하나의 다음 이념을 위한 국가식견이 충분하며, 현재 교리 시행 주기가 구매를 막고 있지 않습니다."
 alert_max_piety_name:0 "종교 국가 과업 채택 가능"
 alert_max_piety_hint:0 "다른 종교 과업을 채택하기에 종교개혁력이 충분합니다."
 alert_ve_can_begin_cultural_project_name:0 "축적되는 문화위임력"
 alert_ve_can_begin_cultural_project_hint:0 "문화위임력이 #Y 300#!을 넘었으며 시작할 수 있는 문화 사업이 있습니다. 위임력 수입은 400에서 절반이 되고 500에서 멈추므로 소모하는 것이 좋습니다. 강제되는 사항은 없으며 정체성 제도는 이미 활성화되어 있습니다."
 alert_can_unlock_age_bonus_name:0 "시대 보상 해제 가능"
 alert_can_unlock_age_bonus_hint:0 "다른 보상을 선택하기에 충분한 시대동력이 있습니다."
 ag_ve_missionary_group_name:0 "종교 및 문화 행동"
 alert_can_use_missionary_name:0 "선교사 파견 가능"
 alert_can_use_missionary_hint:0 "선교사들이 활성화된 선교 임무를 기다리고 있습니다. 소유한 주를 클릭하여 현지 주민들을 개종시키십시오."
 ag_ve_state_project_group_name:0 "대상 주 사업"
 alert_ve_can_begin_targeted_cultural_project_name:0 "대상 문화 사업 시작 가능"
 alert_ve_can_begin_targeted_cultural_project_hint:0 "정체성 제도를 위한 자원과 적합한 주가 갖춰져 있어 대상 문화 사업을 시작할 수 있습니다."
 alert_ve_can_begin_targeted_religious_project_name:0 "대상 종교 사업 시작 가능"
 alert_ve_can_begin_targeted_religious_project_hint:0 "활성화된 종교 제도의 사업을 위한 종교개혁력과 적합한 주가 갖춰져 있습니다."
 ve_culture_reform_cost_tt:0 "유산 문화 개혁 요구 조건."
 ve_state_religion_tt:0 "#P 신조국가 메커니즘 및 선교사 3명을 활성화합니다.#! 종교적 권위는 종교인의 통일 지지에 강력하게 반응합니다."
 ve_freedom_of_conscience_tt:0 "#P 다원주의 국가 메커니즘 및 선교사 1명을 활성화합니다.#! 종교적 조화는 안정적인 공존에 보상을 제공합니다."
 ve_total_separation_tt:0 "#P 다원주의 국가 메커니즘을 활성화합니다.#! 선교사가 비활성화됩니다."
 ve_ethnostate_tt:0 "#P 민족국가 정체성 제도와 강력하게 부합합니다.#! 시민국가와 상충하며 복합국가에는 적합성이 떨어집니다."
 ve_national_supremacy_tt:0 "#P 민족국가 정체성 제도와 부합합니다.#! 시민국가와 상충합니다."
 ve_racial_segregation_tt:0 "#P 복합국가 정체성 제도와 부합합니다.#! 민족국가에 대해서는 부분적인 지원만 제공합니다."
 ve_cultural_exclusion_tt:0 "#P 복합국가 정체성 제도와 부합하며 시민국가를 부분적으로 지원합니다.#!"
 ve_multicultural_tt:0 "#P 시민국가 정체성 제도와 강력하게 부합합니다.#! 민족국가와 상충합니다."
 ve_send_missionary_tt:0 "#variable 선교사는 매해마다 현지 사람들의 종교를 개종시킵니다. #gold 6개월.\n\n#white 주 인구가 250,000 미만인 경우: #darker_white 0% #white 기본 변환 기본 전력 감소\n#white 주 인구가 50만 명 미만인 경우: #negative_value -0.02% #white 전환 기반 전력 감소\n#white 주 인구가 75만 명 미만인 경우: #negative_value -0.03% #white 전환 기반 전력 감소\n#white 주 인구가 1백만 명 미만인 경우: #negative_value -0.04% #white 전환 기본 전력 감소\n#white 주가 인구는 5백만 미만입니다. #negative_value -0.043% #white 전환 기반 전력 감소\n#white 국가 인구가 1000만명 미만인 경우: #negative_value -0.045% #white 전환 기반 전력 감소\n#white 국가 인구가 1000만명 이상인 경우: #negative_value -0.0475% #white 전환 기반 전력 감소"
 ve_targeted_cultural_project_state_action_tt:0 "#header 대상 문화 사업#!\n현재 정체성 제도와 연계된 사업을 시작합니다. 이 주의 인구 중 최소 #Y 5%#! 이상을 차지하는 가장 큰 적합 비주류 문화가 대상이 됩니다. 정확한 비용, 진척도 규칙 및 결과는 국가 정체성 패널을 여십시오."
