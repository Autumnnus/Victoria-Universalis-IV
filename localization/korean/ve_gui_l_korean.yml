 ve_targeted_religious_project_state_requirements_tt:0 "국가는 우리가 소유해야 하며, 우리 종교는 이미 국가를 소유해서는 안 됩니다. #Y 90%#! 또는 그 인구의 그 이상. 신앙고백, 양심의 자유, 국가 무신론은 각각 하나를 시작할 수 있습니다. 완전한 분리는 불가능합니다. 활성 종교 모델의 경건 개혁 비용도 충족되어야 합니다."

