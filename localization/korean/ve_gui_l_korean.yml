 ve_total_separation_tt:0 "#P 다원주의 국가 메커니즘을 활성화합니다.#! 선교사는 비활성화됩니다."
 ve_ethnostate_tt:0 "#P 민족 국가 정체성 모델과 강하게 일치합니다.#! 시민 국가와 충돌하며 복합 국가에는 덜 적합합니다."
 ve_national_supremacy_tt:0 "#P 민족 국가 정체성과 일치합니다. 모델.#! 시민 국가와 충돌합니다."
 ve_racial_segregation_tt:0 "#P 복합 국가 정체성 모델과 일치합니다.#! 민족 국가에 대해 부분적으로만 지원합니다."
 ve_cultural_exclusion_tt:0 "#P 복합 국가 정체성 모델과 일치하고 시민 국가를 부분적으로 지원합니다.#!"
 ve_multicultural_tt:0 "#P 시민 국가 정체성 모델과 강력하게 일치합니다.#! 민족국가와 충돌합니다."
 ve_send_missionary_tt:0 "#variable 선교사는 매해마다 현지 사람들의 종교를 개종시킵니다. #gold 6개월.\n\n#white 주 인구가 250,000 미만인 경우: #darker_white 0% #white 기본 변환 기본 전력 감소\n#white 주 인구가 50만 명 미만인 경우: #negative_value -0.02% #white 전환 기반 전력 감소\n#white 주 인구가 75만 명 미만인 경우: #negative_value -0.03% #white 전환 기반 전력 감소\n#white 주 인구가 1백만 명 미만인 경우: #negative_value -0.04% #white 전환 기본 전력 감소\n#white 주가 인구는 5백만 미만입니다. #negative_value -0.043% #white 전환 기반 전력 감소\n#white 국가 인구가 1000만명 미만인 경우: #negative_value -0.045% #white 전환 기반 전력 감소\n#white 국가 인구가 1000만명 이상인 경우: #negative_value -0.0475% #white 전환 기반 전력 감소"
 ve_targeted_cultural_project_state_action_tt:0 "#header 타겟팅된 문화 프로젝트#!\n현재 아이덴티티 모델과 관련된 프로젝트를 시작합니다. 최소 #Y 5%#! 이 주 인구의 목표가 됩니다. 정확한 비용, 진행 규칙 및 결과를 보려면 국가 정체성 패널을 엽니다."
 ve_topbar:0 "상단 표시줄 콘텐츠 전환"

