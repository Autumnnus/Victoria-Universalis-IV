 ve_cultural_project_req_target:0 "이 주에는 인구의 최소  #Y 5%#! 가 포함된 적격 비기본 문화가 있습니다. "
 ve_cultural_project_cancel_warning:0 "#header 문화 프로젝트를 취소하시겠습니까?#!\n\n지금까지 진행된 작업이 손실됩니다. #N -5 국민 결속력#! 그리고 #N 24개월#! 쿨다운 수정자는 다른 프로젝트가 시작되기 전에 적용됩니다. "
 alert_can_unlock_ideas_name:0 "아이디어 채택 가능 "
 alert_can_unlock_ideas_hint:0 "우리는 적어도 하나의 채택된 그룹의 다음 아이디어에 대해 충분한 국가 통찰력을 가지고 있으며 현재 구매를 차단하는 교리 구현 주기가 없습니다. "
