 ve_religious_project_cancel_warning:0 "#header 대상 종교 프로젝트를 취소하시겠습니까?#!\n\n지금까지 이루어진 진전은 손실됩니다. #N -5 종교적 정착#! 그리고 #N 24개월#! 다른 프로젝트를 시작하기 전에 쿨다운 수정자가 적용됩니다."
