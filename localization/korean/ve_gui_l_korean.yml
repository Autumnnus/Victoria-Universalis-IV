 alert_ve_can_begin_cultural_project_hint:0 "우리는 끝났습니다 #Y 300#! 문화 명령과 문화 프로젝트를 시작할 수 있습니다. 의무 소득은 400에서 절반으로 줄어들고 500에서 멈추므로 지출할 가치가 있습니다. 강제되는 것은 없습니다. 우리의 아이덴티티 모델은 이미 활성화되어 있습니다."
