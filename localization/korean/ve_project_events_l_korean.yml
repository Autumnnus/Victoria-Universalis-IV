l_korean:
 ve_je_religious_project:0 "종교 사업"
 ve_je_religious_project_reason:0 "정부가 장기적인 종교 사업을 주도하고 있습니다. 사업의 진척도는 행정 역량, 정치적 정통성, 종교적 여건 및 대상 주의 사건들에 의해 좌우됩니다."
 ve_je_religious_project_progress:0 "완료를 향한 종교 사업 진척도"
 ve_je_religious_project_status_confessional:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName]의 신조 개종은 조직적인 캠페인을 통해 국교를 확장하고자 합니다.\n\n#Y 125#! 진척도 달성 시: 대상 주 인구의 5%를 국교로 개종시키고, 종교개혁력 #P 20#!을 환급하며, 종교합의 #P 5#!를 추가합니다."
 ve_je_religious_project_status_freedom:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName]의 자유 포교는 양심과 자발적 결사를 바탕으로 합의를 구축하고 있습니다.\n\n#Y 100#! 진척도 달성 시: 강제 개종 없이 국가 충성파를 추가하고, 종교개혁력 #P 20#!을 환급하며, 종교합의 #P 7#!을 추가합니다."
 ve_je_religious_project_status_secularization:0 "[ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName]의 세속화 운동은 조직된 종교의 공적 권위를 약화시키고 있습니다.\n\n#Y 150#! 진척도 달성 시: 대상 주 인구의 5%를 세속주의로 개종시키고, 종교개혁력 #P 25#!을 환급하며, 종교합의 #P 8#!을 추가합니다."
 ve_je_religious_project_complete_tt:0 "종교 사업이 목표에 도달했습니다."
 ve_je_religious_project_fail_tt:0 "종교 사업이 취소되었습니다."

 ve_je_cultural_project:0 "문화 사업"
 ve_je_cultural_project_reason:0 "정부가 장기적인 문화 사업을 주도하고 있습니다. 행정 역량, 정통성, 교육, 국민통합도, 그리고 지역 여건이 사업 속도를 결정합니다."
 ve_je_cultural_project_progress:0 "완료를 향한 문화 사업 진척도"
 ve_je_cultural_project_status_curriculum:0 "국가의 학교와 기관들을 위한 국가 교육과정이 준비되고 있습니다.\n\n#Y 100#! 진척도 달성 시: 문화위임력 #P +20#!, 국민통합도 #P +5#!, 그리고 10년간 교육 접근성 +2%, 자격 +5%, 행정력 -25 효과가 부여됩니다."
 ve_je_cultural_project_status_symbols:0 "공유 상징 프로그램이 공통의 시민권 어휘를 다지고 있습니다.\n\n#Y 75#! 진척도 달성 시: 문화위임력 #P +20#!, 국민통합도 #P +7#!, 그리고 8년간 완전히 수용된 인구층으로부터의 충성파 +10% 및 권위 +25 효과가 부여됩니다."
 ve_je_cultural_project_status_ethnic:0 "[ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName]의 민족 통합 캠페인은 소수 인구를 주류 문화로 동화시키고 있습니다.\n\n#Y 125#! 진척도 달성 시: 대상 문화 인구의 5%를 주류 문화로 개종(민족주의 VII 적용 시 7%), 문화위임력 #P +25#!, 국민통합도 #P +8#!, 그리고 10년간 융화 결과가 적용됩니다."
 ve_je_cultural_project_status_civic:0 "[ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName]의 동등한 시민권 발의는 문화적 경계를 넘어 공통의 시민 신분을 확대하고 있습니다.\n\n#Y 100#! 진척도 달성 시: 10년간 수용도 +15%, 국가 충성파, 문화위임력 #P +25#!, 국민통합도 #P +10#!, 그리고 10년간 자격/이주 결과가 적용됩니다."
 ve_je_cultural_project_status_composite:0 "[ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName]의 구성 협약은 복합국가 내에서의 영구적인 승인을 협상하고 있습니다.\n\n#Y 150#! 진척도 달성 시 (국민통합도 40 이상 필요): 영구적 수용도 +15%, 구성원 목록에 문화 추가, 국가 충성파, 문화위임력 #P +30#!, 국민통합도 #P +12#!."
 ve_je_cultural_project_complete_tt:0 "문화 사업이 목표에 도달했습니다."
 ve_je_cultural_project_fail_tt:0 "문화 사업이 취소되었습니다."
 ve_je_project_resolving_status:0 "사업 행정부가 최종 보고서를 제출하고 있습니다."

 ve_evt_religious_incident_cooldown_mdf:0 "종교 사업 사건 재사용 대기시간"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "사업 행정부가 최근 발생한 사건의 여파를 수습하고 있습니다."
 ve_evt_cultural_incident_cooldown_mdf:0 "문화 사업 사건 재사용 대기시간"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "사업 행정부가 최근 발생한 사건의 여파를 수습하고 있습니다."
 ve_evt_central_clergy_supported_mdf:0 "중앙 성직자층 지원"
 ve_evt_central_clergy_supported_mdf_desc:0 "정부가 중앙 종교 지도부의 권위를 옹호했습니다."
 ve_evt_central_clergy_slighted_mdf:0 "중앙 성직자층 경시"
 ve_evt_central_clergy_slighted_mdf_desc:0 "정부가 중앙 종교 지도부의 선호 대신 지역 관행을 중시했습니다."
 ve_evt_municipal_patronage_mdf:0 "지방 후원 네트워크"
 ve_evt_municipal_patronage_mdf_desc:0 "지역 유지들이 세금 징수를 약화시키는 방식을 통해 사업을 진척시키고 있습니다."

 ve_rel_evt.1.t:0 "지역 유지들의 청원"
 ve_rel_evt.1.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 성직자, 시의원, 지역 원로들로 구성된 대표단이 정부에 신조 개종을 늦춰 달라고 청원했습니다. 이들은 융통성 없는 일정표가 순응을 지속적인 반감으로 바꿀 것이라고 경고합니다."
 ve_rel_evt.1.f:0 "\"상의 없이 강요된 신앙은 예배당을 비우면서 장부만 채우게 될 뿐이다.\""
 ve_rel_evt.1.a:0 "청원을 수용한다."
 ve_rel_evt.1.a.tt:0 "종교 사업 진척도가 #N 4#! 감소합니다.\n종교적 정착이 #P 3#! 증가합니다."
 ve_rel_evt.1.b:0 "일정표는 변경되지 않을 것이다."
 ve_rel_evt.1.b.tt:0 "종교 사업 진척도가 #P 5#! 증가합니다.\n종교적 정착이 #N 2#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 0.5%#!가 급진파가 됩니다."
 ve_rel_evt.1.c:0 "신뢰할 수 있는 중재자를 임명한다."
 ve_rel_evt.1.c.tt:0 "종교개혁력 #N 10#!을 소모합니다.\n종교 사업 진척도가 #P 3#! 증가합니다.\n종교적 정착이 #P 1#! 증가합니다."

 ve_rel_evt.2.t:0 "현장 장교 품귀"
 ve_rel_evt.2.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 보고에 따르면 답변 없는 청원, 모순된 지침, 그리고 몇 주 동안 사업 장교의 그림자도 보지 못한 구역들이 속출하고 있습니다. 신조 개종 속도가 이를 수행할 행정력을 앞서고 있습니다."
 ve_rel_evt.2.f:0 "\"칙령은 하루 만에 전국을 가로지를 수 있으나, 유능한 서기는 그럴 수 없다.\""
 ve_rel_evt.2.a:0 "임시 현장 장교를 고용한다."
 ve_rel_evt.2.a.tt:0 "종교개혁력 #N 15#!을 소모합니다.\n종교 사업 진척도가 #P 4#! 증가합니다."
 ve_rel_evt.2.b:0 "사업 속도를 늦춘다."
 ve_rel_evt.2.b.tt:0 "종교 사업 진척도가 #N 6#! 감소합니다.\n종교적 정착이 #P 2#! 증가합니다."
 ve_rel_evt.2.c:0 "중앙 등기소 간부를 활용한다."
 ve_rel_evt.2.c.tt:0 "종교개혁력 #N 10#!을 소모합니다.\n종교 사업 진척도가 #P 5#! 증가합니다."

 ve_cul_evt.1.t:0 "번역 국"
 ve_cul_evt.1.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 관료들은 동등한 시민권 발의가 [SCOPE.sCulture('ve_evt_target_culture').GetName] 언어를 어떻게 다루어야 할지를 두고 의견이 갈리고 있습니다. 지역 행정관들은 이중언어 사무소를 원하지만, 중앙 부처들은 단일 행정 표준을 요구하고 있습니다."
 ve_cul_evt.1.f:0 "\"시민이 자신의 이름으로 부여된 권리를 이해하는 데 통역사가 필요해서는 안 된다.\""
 ve_cul_evt.1.a:0 "지역 언어가 공공 기관 속에서 공존하도록 둔다."
 ve_cul_evt.1.a.tt:0 "문화 사업 진척도가 #N 4#! 감소합니다.\n결속력이 #P 3#! 증가합니다."
 ve_cul_evt.1.b:0 "단일 행정 표준을 강제한다."
 ve_cul_evt.1.b.tt:0 "문화 사업 진척도가 #P 5#! 증가합니다.\n결속력이 #N 2#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구의 #N 0.5%#!가 급진파가 됩니다."
 ve_cul_evt.1.c:0 "학술 번역 위원회를 설립한다."
 ve_cul_evt.1.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 3#! 증가합니다.\n결속력이 #P 1#! 증가합니다."

 ve_cul_evt.2.t:0 "지역 교사 품귀"
 ve_cul_evt.2.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 학교들에는 국가 교육 과정과 [SCOPE.sCulture('ve_evt_target_culture').GetName] 공동체 모두를 만족시킬 교사가 부족합니다. 훈련된 지역 간부가 없다면, 동등한 시민권은 공식 문서 위에만 적힌 약속으로 남을 위험이 있습니다."
 ve_cul_evt.2.f:0 "\"법은 한오후 만에 평등을 선언하지만, 교실은 한 세대 동안 그것을 가르쳐야 한다.\""
 ve_cul_evt.2.a:0 "신규 교원 대학에 자금을 지원한다."
 ve_cul_evt.2.a.tt:0 "문화위임력 #N 15#!을 소모합니다.\n문화 사업 진척도가 #P 4#! 증가합니다."
 ve_cul_evt.2.b:0 "이행을 늦춘다."
 ve_cul_evt.2.b.tt:0 "문화 사업 진척도가 #N 6#! 감소합니다.\n결속력이 #P 2#! 증가합니다."
 ve_cul_evt.2.c:0 "기존 기관들을 활용한다."
 ve_cul_evt.2.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 5#! 증가합니다.\n결속력이 #P 1#! 증가합니다."

 ve_rel_evt.3.t:0 "상충하는 장부"
 ve_rel_evt.3.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] 내 교구 명부와 시립 장부, 그리고 사업 장교들의 보고서가 가리키는 종교적 귀속 인구가 서로 일치하지 않습니다. 행정부는 진실을 밝히며 시간을 낭비할지, 아니면 불확실함을 알면서도 수치를 밀고 나갈지 결정해야 합니다."
 ve_rel_evt.3.f:0 "\"모든 관청에는 정확한 총계가 존재한다. 일치하는 총계는 단 하나도 없다.\""
 ve_rel_evt.3.a:0 "전면 감사를 실시하라."
 ve_rel_evt.3.a.tt:0 "종교개혁력 #P 8#!을/를 획득합니다.\n종교 사업 진척도가 #N 6#! 감소합니다."
 ve_rel_evt.3.b:0 "합리적인 추정치로 진행하라."
 ve_rel_evt.3.b.tt:0 "종교개혁력 #N 8#!을/를 소모합니다.\n종교 사업 진척도가 #P 5#! 증가합니다."
 ve_rel_evt.3.c:0 "신성 행정부의 장부를 사용하라."
 ve_rel_evt.3.c.tt:0 "종교 사업 진척도가 #P 3#! 증가합니다."

 ve_rel_evt.4.t:0 "소문과 역설교"
 ve_rel_evt.4.d:0 "이제 팜플렛, 거리 설교, 그리고 불안한 소문들이 [SCOPE.sState('ve_evt_target_state').GetName] 내의 신조 개종을 지역 삶에 대한 침략으로 묘사하고 있습니다. 관료들은 침묵을 지키면 반대파들이 사업의 성격을 규정하게 될 것이며, 탄압은 저들의 가장 어두운 주장을 정당화해 줄 뿐이라고 경고합니다."
 ve_rel_evt.4.f:0 "\"소문에는 관청도, 인준도, 예산도 필요 없다.\""
 ve_rel_evt.4.a:0 "공청회를 개최하라."
 ve_rel_evt.4.a.tt:0 "종교 사업 진척도가 #N 3#! 감소합니다.\n종교적 정착이 #P 3#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #P 0.5%#!이/가 충성파가 됩니다."
 ve_rel_evt.4.b:0 "선동가를 처벌하라."
 ve_rel_evt.4.b.tt:0 "종교 사업 진척도가 #P 4#! 증가합니다.\n종교적 정착이 #N 3#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 1%#!이/가 급진파가 됩니다."
 ve_rel_evt.4.c:0 "기록과 결과를 공표하라."
 ve_rel_evt.4.c.tt:0 "종교개혁력 #N 10#!을/를 소모합니다.\n종교 사업 진척도가 #P 2#! 증가합니다.\n종교적 정착이 #P 1#! 증가합니다."

 ve_rel_evt.5.t:0 "설교의 언어"
 ve_rel_evt.5.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 사업 성직자들은 격식 갖춘 설교가 교리적 통일성은 보존하나 수많은 회중에게 닿지 못하고 있다고 보고합니다. 중앙 성직계는 적응이 곧 독립으로 변질될 것을 염려하고 있으나, 현지 언어로 설교를 진행한다면 캠페인을 훨씬 더 멀리 뻗어나가게 할 수 있을 것입니다."
 ve_rel_evt.5.f:0 "\"들리지 않는 신성한 말씀은 완벽하게 보존되나—그 누구에게도 닿지 못한다.\""
 ve_rel_evt.5.a:0 "현지 언어로 설교하라."
 ve_rel_evt.5.a.tt:0 "종교 사업 진척도가 #P 6#! 증가합니다.\n종교인이 #Y 2.5년#! 동안 찬성 #N 1#!을/를 잃습니다."
 ve_rel_evt.5.b:0 "전례의 통일성을 보존하라."
 ve_rel_evt.5.b.tt:0 "종교 사업 진척도가 #N 3#! 감소합니다.\n종교적 정착이 #P 3#! 증가합니다.\n종교인이 #Y 2.5년#! 동안 찬성 #P 1#!을/를 얻습니다."
 ve_rel_evt.5.c:0 "교육받은 통역자를 양성하라."
 ve_rel_evt.5.c.tt:0 "종교개혁력 #N 10#!을/를 소모합니다.\n종교 사업 진척도가 #P 4#! 증가합니다.\n종교적 정착이 #P 1#! 증가합니다."

 ve_rel_evt.6.t:0 "경쟁하는 성직 권력"
 ve_rel_evt.6.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 중앙 임명자들과 기득권 현지 성직자들이 각각 신조 개종을 지휘할 권리를 주장하고 있습니다. 어느 한쪽을 지지하면 지휘권을 신속히 회복할 수 있겠으나, 이번 분쟁은 이미 신앙을 대변하는 자가 누구인지를 시험하는 무대가 되어버렸습니다."
 ve_rel_evt.6.f:0 "\"다툼의 대상은 관할권이며, 이는 곧 기관들이 권력을 묘사하는 방식이다.\""
 ve_rel_evt.6.a:0 "중앙 성직자를 지지하라."
 ve_rel_evt.6.a.tt:0 "종교 사업 진척도가 #P 5#! 증가합니다.\n종교인이 #Y 2.5년#! 동안 찬성 #P 1#!을/를 얻습니다.\n종교적 정착이 #N 3#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 0.5%#!이/가 급진파가 됩니다."
 ve_rel_evt.6.b:0 "현지 성직자를 달래라."
 ve_rel_evt.6.b.tt:0 "종교 사업 진척도가 #N 4#! 감소합니다.\n종교인이 #Y 2.5년#! 동안 찬성 #N 1#!을/를 잃습니다.\n종교적 정착이 #P 3#! 증가합니다."
 ve_rel_evt.6.c:0 "그들의 권한을 문장으로 명시하라."
 ve_rel_evt.6.c.tt:0 "종교개혁력 #N 10#!을/를 소모합니다.\n종교 사업 진척도가 #P 3#! 증가합니다.\n종교적 정착이 #P 1#! 증가합니다."

 ve_cul_evt.3.t:0 "인구조사의 범주들"
 ve_cul_evt.3.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 인구조사 관료들은 [SCOPE.sCulture('ve_evt_target_culture').GetName] 문화의 시민들을 어떻게 기록해야 할지 합의하지 못하고 있습니다. 지역 응답자들은 중첩되는 정체성을 사용하는 반면, 중앙의 양식들은 하나의 칸에 하나의 대답만을 요구합니다."
 ve_cul_evt.3.f:0 "\"범주는 국가를 단순화하기 훨씬 전에 장부를 단순화한다.\""
 ve_cul_evt.3.a:0 "자기기재를 허용한다."
 ve_cul_evt.3.a.tt:0 "문화 사업 진척도가 #N 4#! 감소합니다.\n국가 결속력이 #P 4#! 증가합니다."
 ve_cul_evt.3.b:0 "범주는 중앙에서 일괄 설정할 것이다."
 ve_cul_evt.3.b.tt:0 "문화 사업 진척도가 #P 6#! 증가합니다.\n국가 결속력이 #N 4#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 문화 인구의 #N 0.5%#!가 급진파가 됩니다."
 ve_cul_evt.3.c:0 "근대적 등록 체계를 사용한다."
 ve_cul_evt.3.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 5#! 증가합니다.\n국가 결속력이 #P 1#! 증가합니다."

 ve_cul_evt.4.t:0 "지방의 유지들"
 ve_cul_evt.4.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 지방 유지들이 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구를 위한 동등한 시민권 발의를 진전시키고자 자신들의 관청과 추종자, 영향력을 제공하겠다고 나섭니다. 그들의 협력은 신속하겠으나, 그 대가는 지방 세수에 대한 지속적인 통제권입니다."
 ve_cul_evt.4.f:0 "\"시청으로 향하는 가장 빠른 길은 여러 사적 응접실을 거쳐 간다.\""
 ve_cul_evt.4.a:0 "지역망을 활용한다."
 ve_cul_evt.4.a.tt:0 "문화 사업 진척도가 #P 5#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName]의 세금 역량이 #Y 2년#! 동안 #N 5%#! 감소합니다."
 ve_cul_evt.4.b:0 "개방형 위원회를 신설한다."
 ve_cul_evt.4.b.tt:0 "문화 사업 진척도가 #N 3#! 감소합니다.\n국가 결속력이 #P 3#! 증가합니다."
 ve_cul_evt.4.c:0 "규칙 기반의 합의를 도출한다."
 ve_cul_evt.4.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 3#! 증가합니다.\n국가 결속력이 #P 1#! 증가합니다."

 ve_cul_evt.5.t:0 "고등고시"
 ve_cul_evt.5.d:0 "[SCOPE.sCulture('ve_evt_target_culture').GetName] 지원자들에게 공무원 조직 시험을 개방한 것은 법적 평등과 현실적 준비 사이의 괴리를 드러냈습니다. 즉각적인 접근은 상징적으로 강력하겠지만, 수년간의 불평등한 교육은 칙령으로 지워질 수 없습니다."
 ve_cul_evt.5.f:0 "\"오직 한쪽 후보만이 그 언어를 교육받았을 때, 동일한 시험은 동일한 기회가 아니다.\""
 ve_cul_evt.5.a:0 "예비 과정을 재정적으로 지원한다."
 ve_cul_evt.5.a.tt:0 "문화위임력 #N 15#!을 소모합니다.\n문화 사업 진척도가 #P 5#! 증가합니다.\n국가 결속력이 #P 2#! 증가합니다."
 ve_cul_evt.5.b:0 "동등한 접근을 즉시 시행한다."
 ve_cul_evt.5.b.tt:0 "문화 사업 진척도가 #P 7#! 증가합니다.\n국가 결속력이 #N 4#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName]의 인구 중 #N 0.5%#!가 급진파가 됩니다."
 ve_cul_evt.5.c:0 "학교 및 복지망을 동원한다."
 ve_cul_evt.5.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 5#! 증가합니다.\n국가 결속력이 #P 2#! 증가합니다."
 ve_cul_evt.5.e:0 "시험 제도를 먼저 개혁한다."
 ve_cul_evt.5.e.tt:0 "문화 사업 진척도가 #N 4#! 감소합니다.\n국가 결속력이 #P 3#! 증가합니다."

 ve_cul_evt.6.t:0 "다수파의 반발"
 ve_cul_evt.6.d:0 "동등한 시민권 발의에 반대하는 이들은 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구에게 보편적 권리를 확대하는 것이 다른 모든 이들의 지위를 격하시킨다고 주장합니다. [SCOPE.sState('ve_evt_target_state').GetName]에서의 시위는 행정적 개혁을 국가적 정치 시험대로 변모시키고 있습니다."
 ve_cul_evt.6.f:0 "\"공유된 권리가 강탈당한 특권으로 묘사되고 있다.\""
 ve_cul_evt.6.a:0 "공개적으로 발의를 옹호한다."
 ve_cul_evt.6.a.tt:0 "문화 사업 진척도가 #P 4#! 증가합니다.\n국가 결속력이 #N 4#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName]의 인구 중 #N 1%#!가 급진파가 됩니다."
 ve_cul_evt.6.b:0 "시행 속도를 늦춘다."
 ve_cul_evt.6.b.tt:0 "문화 사업 진척도가 #N 5#! 감소합니다.\n국가 결속력이 #P 3#! 증가합니다."
 ve_cul_evt.6.c:0 "개혁 연대를 동원한다."
 ve_cul_evt.6.c.tt:0 "#N 10#! 문화위임력을 소모합니다.\n문화 프로젝트 진척도가 #P 3#! 증가합니다.\n국가 결속력이 #P 2#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구의 #P 0.5%#!가 충성파가 됩니다."

 ve_rel_evt.7.t:0 "파국에 직면한 선교"
 ve_rel_evt.7.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 신조 개종이 행정적·정치적 붕괴 직전에 이르렀다. 관청들은 서로의 질의에 답변을 멈추었으며, 대중의 저항은 거세지고 현장 성직자들은 현재의 조건으로는 선교를 계속할 수 없다고 경고하고 있다."
 ve_rel_evt.7.f:0 "\"보고서들은 여전히 이를 일시적인 난관이라 부른다. 그러나 거리는 더욱 가혹한 이름을 택했다.\""
 ve_rel_evt.7.a:0 "손실을 감수하고 철수한다."
 ve_rel_evt.7.a.tt:0 "종교개혁력 환급 없이 종교 사업을 취소합니다.\n종교합의가 #N 5#! 감소합니다.\n#Y 2년#! 동안: 행정력 #N -50#!, 권위 #N -50#!, 그리고 법 제정 성공 #N -3%#!."
 ve_rel_evt.7.b:0 "긴급 자원을 이관한다."
 ve_rel_evt.7.b.tt:0 "종교개혁력 #N 25#!을(를) 소모합니다.\n종교 사업 진척도가 #N 5#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 1%#!이(가) 급진파가 됩니다.\n사업이 계속됩니다."
 ve_rel_evt.7.c:0 "최소한의 인력으로 계속한다."
 ve_rel_evt.7.c.tt:0 "종교 사업 진척도가 #N 10#! 감소합니다.\n종교합의가 #N 2#! 감소합니다.\n사업이 계속됩니다."
 ve_rel_evt.7.e:0 "방식을 재협상한다."
 ve_rel_evt.7.e.tt:0 "종교개혁력 #N 15#!을(를) 소모합니다.\n종교 사업 진척도가 #N 3#! 감소합니다.\n종교합의가 #P 2#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 0.5%#!이(가) 급진파가 됩니다.\n사업이 계속됩니다."

 ve_cul_evt.7.t:0 "정통성을 잃어가는 발의"
 ve_cul_evt.7.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 동등한 시민권 발의가 기성 기관들과 이를 위해 봉사해야 할 [SCOPE.sCulture('ve_evt_target_culture').GetName] 공동체 모두로부터 지지를 잃어가고 있다. 급진파 운동들은 이제 모든 타협을 정부가 평등을 이행할 수 없다는 증거로 묘사하고 있다."
 ve_cul_evt.7.f:0 "\"개혁은 반발에서 살아남을 수 있다. 그러나 신뢰를 잃는 것으로부터는 살아남을 수 없다.\""
 ve_cul_evt.7.a:0 "발의를 종결한다."
 ve_cul_evt.7.a.tt:0 "문화위임력 환급 없이 문화 사업을 취소합니다.\n국민통합도가 #N 5#! 감소합니다.\n#Y 2년#! 동안: 행정력 #N -50#!, 권위 #N -25#!, 그리고 법 제정 성공 #N -3%#!."
 ve_cul_evt.7.b:0 "긴급 지역 보조금을 지급한다."
 ve_cul_evt.7.b.tt:0 "문화위임력 #N 25#!을(를) 소모합니다.\n문화 사업 진척도가 #N 5#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName]의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 중 #N 1%#!이(가) 급진파가 됩니다.\n사업이 계속됩니다."
 ve_cul_evt.7.c:0 "최소한의 프로그램으로 계속한다."
 ve_cul_evt.7.c.tt:0 "문화 사업 진척도가 #N 10#! 감소합니다.\n국민통합도가 #N 2#! 감소합니다.\n사업이 계속됩니다."
 ve_cul_evt.7.e:0 "연정을 재건한다."
 ve_cul_evt.7.e.tt:0 "문화위임력 #N 15#!을(를) 소모합니다.\n문화 사업 진척도가 #N 3#! 감소합니다.\n국민통합도가 #P 2#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName]의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 중 #N 0.5%#!이(가) 급진파가 됩니다.\n사업이 계속됩니다."

 ve_rel_evt.8.t:0 "예상치 못한 지역적 화합"
 ve_rel_evt.8.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 성직자, 지방 관리, 그리고 지역 공동체 원로들이 어떠한 중앙 지침도 빚어내지 못했던 합의에 도달했다. 지역의 저항은 수그러들고 있으며, 회중들이 직접 선교를 조율하고 있고, 신조 개종은 예상치 못한 대세를 획득했다."
 ve_rel_evt.8.f:0 "\"수도에서 내려온 명령으로 시작된 것이 광장에서 맺어진 협약이 되었다.\""
 ve_rel_evt.8.a:0 "이 대세를 최대한 활용한다."
 ve_rel_evt.8.a.tt:0 "종교합의가 #P 1#! 증가합니다.\n종교 사업 진척도가 #P 25#! 증가합니다.\n진척도가 #Y 100#!에 도달하면, 사업의 일반적인 완료 효과가 적용됩니다."
 ve_rel_evt.8.b:0 "속도보다 지속성을 중시한다."
 ve_rel_evt.8.b.tt:0 "종교합의가 #P 4#! 증가합니다.\n종교 사업 진척도가 #P 10#! 증가합니다.\n진척도가 #Y 100#!에 도달하면, 사업의 일반적인 완료 효과가 적용됩니다."

 ve_cul_evt.8.t:0 "지역 시민 연합"
 ve_cul_evt.8.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 교사, 지방 관리, 무역 협회, 그리고 [SCOPE.sCulture('ve_evt_target_culture').GetName] 공동체 대표들이 공동 위원회를 결성했다. 수도에 도달하기도 전에 분쟁을 해결함으로써, 이 연합은 행정부가 만들어낼 수 없었던 대세를 동등한 시민권 발의에 부여했다."
 ve_cul_evt.8.f:0 "\"시민권은 좀처럼 한 자리에 모이지 않던 기관들이 책임을 나누기 시작할 때 비로소 현실이 되었다.\""
 ve_cul_evt.8.a:0 "연합의 대세를 활용한다."
 ve_cul_evt.8.a.tt:0 "국민통합도가 #P 1#! 증가합니다.\n문화 사업 진척도가 #P 25#! 증가합니다.\n진척도가 #Y 100#!에 도달하면, 사업의 일반적인 완료 효과가 적용됩니다."
 ve_cul_evt.8.b:0 "기관들을 영구화한다."
 ve_cul_evt.8.b.tt:0 "국민통합도가 #P 4#! 증가합니다.\n문화 사업 진척도가 #P 10#! 증가합니다.\n진척도가 #Y 100#!에 도달하면, 사업의 일반적인 완료 효과가 적용됩니다."

 ve_rel_evt.40.t:0 "어긋난 기록"
 ve_rel_evt.40.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 지방 호적들이 신도 집단, 시민 단체, 공공 기관에 대해 서로 호환되지 않는 분류 체계를 사용하고 있습니다. 수도에 도착하는 보고들은 서로 모순되어, 해당 사업은 무엇이 순응이고 무엇이 저항인지 구별할 수 없는 지경에 이르렀습니다."
 ve_rel_evt.40.f:0 "\"세 가지 장부를 통해 집행되는 정책은 곧 세 가지의 서로 다른 현실을 낳기 마련이다.\""
 ve_rel_evt.40.a:0 "중앙 감찰단을 파견한다."
 ve_rel_evt.40.a.tt:0 "#N 10#!의 종교개혁력을 소모합니다.\n종교 사업 진척도가 #P 5#! 증가합니다.\n종교적 정착이 #P 1#! 증가합니다."
 ve_rel_evt.40.b:0 "기록을 현장에서 조정한다."
 ve_rel_evt.40.b.tt:0 "종교 사업 진척도가 #N 3#! 감소합니다.\n종교적 정착이 #P 2#! 증가합니다."
 ve_rel_evt.40.c:0 "표준 호적 절차를 적용한다."
 ve_rel_evt.40.c.tt:0 "#N 5#!의 종교개혁력을 소모합니다.\n종교 사업 진척도가 #P 4#! 증가합니다.\n종교적 정착이 #P 1#! 증가합니다."

 ve_rel_evt.41.t:0 "지방 인력 품귀"
 ve_rel_evt.41.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]에서 사업을 지휘하는 관청들이 훈련된 직원, 교사, 시찰관을 충분히 구하지 못하고 있습니다. 지침은 지방 관료들이 해석할 수 있는 속도보다 빠르게 쌓여가고 있으며, 서두른 임명은 모든 분쟁을 악화시킬 위협을 안고 있습니다."
 ve_rel_evt.41.f:0 "\"칙령은 하루 만에 도착했으나, 그것을 완수할 사람들을 기르는 데는 한 세기가 걸릴 수도 있다.\""
 ve_rel_evt.41.a:0 "새로운 관리 간부를 자금 지원하여 양성한다."
 ve_rel_evt.41.a.tt:0 "#N 15#!의 종교개혁력을 소모합니다.\n종교 사업 진척도가 #P 6#! 증가합니다."
 ve_rel_evt.41.b:0 "시행을 늦춘다."
 ve_rel_evt.41.b.tt:0 "종교 사업 진척도가 #N 6#! 감소합니다.\n종교적 정착이 #P 2#! 증가합니다."
 ve_rel_evt.41.c:0 "기존 교육부 네트워크를 활용한다."
 ve_rel_evt.41.c.tt:0 "#N 10#!의 종교개혁력을 소모합니다.\n종교 사업 진척도가 #P 5#! 증가합니다.\n종교적 정착이 #P 1#! 증가합니다."

 ve_rel_evt.42.t:0 "지구 전역에 퍼지는 소문"
 ve_rel_evt.42.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 소문들에 따르면 이번 사업은 정부가 발표한 것보다 훨씬 가혹한 조치들을 은폐하고 있다고 합니다. 종교 조직가들과 지역 선동가들이 모순된 이야기를 거듭하는 동안, 공식적인 침묵은 새로운 판본들마다 퍼져나갈 여지를 제공하고 있습니다."
 ve_rel_evt.42.f:0 "\"소문에는 관청도, 예산도, 서명도 필요하지 않다.\""
 ve_rel_evt.42.a:0 "보고서들을 공표한다."
 ve_rel_evt.42.a.tt:0 "종교 사업 진척도가 #N 3#! 감소합니다.\n종교적 정착이 #P 4#! 증가합니다."
 ve_rel_evt.42.b:0 "선동을 일축한다."
 ve_rel_evt.42.b.tt:0 "종교 사업 진척도가 #P 5#! 증가합니다.\n종교적 정착이 #N 3#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 1%#!가 급진파가 됩니다."
 ve_rel_evt.42.c:0 "지역 중재인들을 위임한다."
 ve_rel_evt.42.c.tt:0 "#N 10#!의 종교개혁력을 소모합니다.\n종교 사업 진척도가 #P 4#! 증가합니다.\n종교적 정착이 #P 2#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #P 0.5%#!가 충성파가 됩니다."

 ve_rel_evt.43.t:0 "한계에 다다른 행정"
 ve_rel_evt.43.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 사업이 행정적 붕괴 직전에 이르렀습니다. 지방 관청들은 압도당했고, 대중의 자신감은 무너졌으며, 조직된 반발은 이제 새로운 지침이 내려올 때마다 정부가 통제력을 상실한 증거로 대하고 있습니다."
 ve_rel_evt.43.f:0 "\"서류가 움직임을 멈추면, 위기는 거리로 쏟아져 나온다.\""
 ve_rel_evt.43.a:0 "프로그램을 종료한다."
 ve_rel_evt.43.a.tt:0 "종교개혁력 환급 없이 종교 사업을 취소합니다.\n종교적 정착이 #N 5#! 감소합니다.\n#Y 2년#! 동안: 행정력 #N -50#!, 권위 #N -50#!, 그리고 법 제정 성공 #N -3%#!."
 ve_rel_evt.43.b:0 "비상 자원을 이전한다."
 ve_rel_evt.43.b.tt:0 "#N 25#!의 종교개혁력을 소모합니다.\n종교 사업 진척도가 #N 5#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 1%#!가 급진파가 됩니다.\n사업이 계속됩니다."
 ve_rel_evt.43.c:0 "소수의 필수 인력만으로 계속 진행한다."
 ve_rel_evt.43.c.tt:0 "종교 사업 진척도가 #N 10#! 감소합니다.\n종교적 정착이 #N 2#! 감소합니다.\n사업이 계속됩니다."
 ve_rel_evt.43.e:0 "지역 협력 관계를 재구축한다."
 ve_rel_evt.43.e.tt:0 "#N 15#!의 종교개혁력을 소모합니다.\n종교 사업 진척도가 #N 3#! 감소합니다.\n종교적 정착이 #P 2#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 0.5%#!가 급진파가 됩니다.\n사업이 계속됩니다."

 ve_rel_evt.100.t:0 "종교간 평의회 의석"
 ve_rel_evt.100.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 대표들은 종교간 평의회의 필요성에는 동의하나, 누가 의석을 차지해야 하는지에는 의견이 갈립니다. 비례대표제는 소규모 공동체들을 안심시킬 수 있는 반면, 수도에서 입안한 고정된 종교합의은 즉시 실행에 들어갈 수 있습니다."
 ve_rel_evt.100.f:0 "\"의자의 숫자를 세기 전까지는 모두가 공동의 식탁을 지지한다.\""
 ve_rel_evt.100.a:0 "인구에 따라 대표권을 분배한다."
 ve_rel_evt.100.a.tt:0 "종교 사업 진척도가 #N 3#! 감소합니다.\n종교합의이 #P 4#! 증가합니다."
 ve_rel_evt.100.b:0 "고정된 중앙 타협안을 강제한다."
 ve_rel_evt.100.b.tt:0 "종교 사업 진척도가 #P 5#! 증가합니다.\n종교합의이 #N 2#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 0.5%#!가 급진파가 됩니다."
 ve_rel_evt.100.c:0 "종교간 평의회에 권한을 부여한다."
 ve_rel_evt.100.c.tt:0 "종종교개혁력 #N 10#!을 소모합니다.\n종교 사업 진척도가 #P 5#! 증가합니다.\n종교합의이 #P 2#! 증가합니다."

 ve_rel_evt.101.t:0 "공동 학교 교육과정"
 ve_rel_evt.101.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 학교들은 자유 포교를 지역 신앙에 대한 운동으로 변질시키지 않으면서도 공통의 시민 교육을 필요로 합니다. 교사들은 명확한 교재와 합동 연수를 요구하는 한편, 공동체 지도자들은 지역 교육에 그들의 전통을 위한 여지를 남겨둘 것을 고집하고 있습니다."
 ve_rel_evt.101.f:0 "\"공동의 수업은 모든 가족이 교실을 자신들의 것으로 인식할 때만 성공한다.\""
 ve_rel_evt.101.a:0 "공동 교사진에 자금을 지원한다."
 ve_rel_evt.101.a.tt:0 "종교개혁력 #N 15#!을 소모합니다.\n종교 사업 진척도가 #P 6#! 증가합니다.\n종교합의이 #P 1#! 증가합니다."
 ve_rel_evt.101.b:0 "지역 교육과정을 위한 여지를 남겨둔다."
 ve_rel_evt.101.b.tt:0 "종교 사업 진척도가 #N 4#! 감소합니다.\n종교합의이 #P 3#! 증가합니다."
 ve_rel_evt.101.c:0 "개혁 연합을 학교로 끌어들인다."
 ve_rel_evt.101.c.tt:0 "종교개혁력 #N 10#!을 소모합니다.\n종교 사업 진척도가 #P 5#! 증가합니다.\n종교합의이 #P 2#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #P 0.5%#!가 충성파가 됩니다."

 ve_rel_evt.102.t:0 "상호 보장 헌장"
 ve_rel_evt.102.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 종교 공동체, 지방 관리, 개혁 협회들이 공동 헌장을 기안했습니다. 각 서명자들은 어떠한 공동체도 지역 기관에서 배제되지 않을 것이라는 공공의 보장을 받는 대가로 동일한 시민적 의무를 받아들입니다."
 ve_rel_evt.102.f:0 "\"모든 약속이 다른 집단의 권리로 기록될 때 신뢰가 가능해졌다.\""
 ve_rel_evt.102.a:0 "협약의 대세를 활용한다."
 ve_rel_evt.102.a.tt:0 "종교합의이 #P 2#! 증가합니다.\n종교 사업 진척도가 #P 20#! 증가합니다.\n진척도가 #Y 100#!에 도달하면, 해당 사업의 일반적인 완료 효과가 적용됩니다."
 ve_rel_evt.102.b:0 "보장을 영구화한다."
 ve_rel_evt.102.b.tt:0 "종교합의이 #P 4#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #P 0.5%#!가 충성파가 됩니다.\n종교 사업 진척도가 #P 10#! 증가합니다.\n진척도가 #Y 100#!에 도달하면, 해당 사업의 일반적인 완료 효과가 적용됩니다."

 ve_rel_evt.150.t:0 "교사인가, 장학관인가?"
 ve_rel_evt.150.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 세속화 운동은 식자 인구의 품귀 현상을 드러냈습니다. 행정부는 장기적인 시민 역량을 구축하는 교사단을 확장하거나, 이미 가용한 인력으로 새 규칙을 집행할 수 있는 장학관들에게 의존할 수 있습니다."
 ve_rel_evt.150.f:0 "\"장학관은 오후 반나절이면 학교를 폐쇄할 수 있다. 교사는 그곳에서 가르쳐졌던 것을 대체하는 데 수년이 걸릴지 모른다.\""
 ve_rel_evt.150.a:0 "교사단을 확장한다."
 ve_rel_evt.150.a.tt:0 "종교개혁력 #N 15#!을 소모합니다.\n종교 사업 진척도가 #P 6#! 증가합니다."
 ve_rel_evt.150.b:0 "기존 인력에 맞춰 프로그램을 늦춘다."
 ve_rel_evt.150.b.tt:0 "종교 사업 진척도가 #N 5#! 감소합니다.\n종교합의이 #P 2#! 증가합니다."
 ve_rel_evt.150.c:0 "공공 교육부 네트워크에 위임한다."
 ve_rel_evt.150.c.tt:0 "종교개혁력 #N 10#!을 소모합니다.\n종교 사업 진척도가 #P 5#! 증가합니다.\n종교합의이 #P 1#! 증가합니다."

 ve_rel_evt.151.t:0 "압수된 재산"
 ve_rel_evt.151.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 과거 종교 시설들은 학교, 진료소, 그리고 시민 관공서로 전환될 준비가 되어 있습니다. 이를 즉시 이전하면 해당 운동에 귀중한 기반 시설을 제공할 수 있겠지만, 보상의 부재는 종교인들의 결집점이 되고 있습니다."
 ve_rel_evt.151.f:0 "\"열쇠들은 아침나절에 주인이 바뀌었습니다. 소유권을 둘러싼 논쟁은 자물쇠보다 오래갈 것입니다.\""
 ve_rel_evt.151.a:0 "단계적으로 보상금을 지급한다."
 ve_rel_evt.151.a.tt:0 "종교개혁력 #N 15#!을(를) 소모합니다.\n종교 사업 진척도가 #P 3#! 증가합니다.\n종교합의가 #P 3#! 증가합니다."
 ve_rel_evt.151.b:0 "해당 재산을 즉시 공공 서비스에 투입한다."
 ve_rel_evt.151.b.tt:0 "종교 사업 진척도가 #P 7#! 증가합니다.\n종교합의가 #N 4#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #N 1%#!이(가) 급진파가 됩니다.\n종교인이 #Y 2.5년#! 동안 찬성 #N 1#!을(를) 잃습니다."
 ve_rel_evt.151.c:0 "세속 복지 기관에 이관한다."
 ve_rel_evt.151.c.tt:0 "종교개혁력 #N 10#!을(를) 소모합니다.\n종교 사업 진척도가 #P 5#! 증가합니다.\n종교합의가 #P 2#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 인구의 #P 0.5%#!이(가) 충성파가 됩니다."

 ve_rel_evt.152.t:0 "뿌리내리는 시민 단체"
 ve_rel_evt.152.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 교사 모임, 상호부조 사회, 그리고 시립 단체들은 한때 종교 기관을 통해 조직되었던 서비스들을 제공하기 시작했습니다. 이들의 협력은 세속화 운동에 단순한 행정적 주도권 대신 지역 시민사회의 기반을 부여했습니다."
 ve_rel_evt.152.f:0 "\"새로운 질서는 시민들이 감시관을 기다리지 않고 스스로 유지하기 시작했을 때 비로소 정착되었다.\""
 ve_rel_evt.152.a:0 "지역의 대세를 활용한다."
 ve_rel_evt.152.a.tt:0 "종교합의가 #P 2#! 증가합니다.\n종교 사업 진척도가 #P 20#! 증가합니다.\n진척도가 #Y 100#!에 도달하면, 해당 사업의 일반적인 완료 효과가 적용됩니다."
 ve_rel_evt.152.b:0 "이 단체들을 영구적인 기관으로 격상한다."
 ve_rel_evt.152.b.tt:0 "종교합의가 #P 4#! 증가합니다.\n종교 사업 진척도가 #P 10#! 증가합니다.\n진척도가 #Y 100#!에 도달하면, 해당 사업의 일반적인 완료 효과가 적용됩니다."

 ve_cul_evt.40.t:0 "지역 학교 위원회"
 ve_cul_evt.40.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 학교 위원회들은 공교육에서 [SCOPE.sCulture('ve_evt_target_culture').GetName] 언어가 차지하는 위치를 두고 의견이 엇갈리고 있습니다. 현지어 교육은 신뢰를 유지할 수 있는 반면, 단일 행정 언어는 국가 사업을 더욱 쉽게 지휘할 수 있게 만들 것입니다."
 ve_cul_evt.40.f:0 "\"첫 수업에 선택된 언어는 종종 그 학교가 누구의 소유인지 믿게 만들지를 결정한다.\""
 ve_cul_evt.40.a:0 "현지어를 보호한다."
 ve_cul_evt.40.a.tt:0 "문화 사업 진척도가 #N 4#! 감소합니다.\n결속력이 #P 3#! 증가합니다."
 ve_cul_evt.40.b:0 "하나의 행정 언어를 강제한다."
 ve_cul_evt.40.b.tt:0 "문화 사업 진척도가 #P 5#! 증가합니다.\n결속력이 #N 2#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName]의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 중 #N 0.5%#!이(가) 급진파가 됩니다."
 ve_cul_evt.40.c:0 "교사망을 확장한다."
 ve_cul_evt.40.c.tt:0 "문화위임력 #N 10#!을(를) 소모합니다.\n문화 사업 진척도가 #P 4#! 증가합니다.\n결속력이 #P 2#! 증가합니다."

 ve_cul_evt.41.t:0 "통계적 경계"
 ve_cul_evt.41.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]을(를) 조사하는 관료들은 [SCOPE.sCulture('ve_evt_target_culture').GetName] 공동체의 시작과 끝이 어디인지 의견을 일치시키지 못하고 있습니다. 지역 정체성은 언어, 구역, 관습을 가로질러 중첩되지만, 국가 사업은 계수하고 관리할 수 있는 범주를 요구합니다."
 ve_cul_evt.41.f:0 "\"인구 조사를 위해 그어진 경계는 이내 관료, 예산, 그리고 옹호자들을 거느리게 된다.\""
 ve_cul_evt.41.a:0 "자체 식별의 여지를 남겨둔다."
 ve_cul_evt.41.a.tt:0 "문화 사업 진척도가 #N 3#! 감소합니다.\n결속력이 #P 3#! 증가합니다."
 ve_cul_evt.41.b:0 "중앙에서 경계를 정의하도록 한다."
 ve_cul_evt.41.b.tt:0 "문화 사업 진척도가 #P 6#! 증가합니다.\n결속력이 #N 3#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName]의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 중 #N 0.5%#!이(가) 급진파가 됩니다."
 ve_cul_evt.41.c:0 "표준 등록 체계를 사용한다."
 ve_cul_evt.41.c.tt:0 "문화위임력 #N 10#!을(를) 소모합니다.\n문화 사업 진척도가 #P 5#! 증가합니다.\n결속력이 #P 1#! 증가합니다."

 ve_cul_evt.42.t:0 "파국에 직면한 국가 사업"
 ve_cul_evt.42.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 국가 사업이 붕괴 직전에 처했습니다. 급진파 운동 세력은 정부가 [SCOPE.sCulture('ve_evt_target_culture').GetName] 공동체를 배신했거나 그에 굴복했다고 주장하는 한편, 지방 관청에는 타협안을 강제할 자신감이 더 이상 남아 있지 않습니다."
 ve_cul_evt.42.f:0 "\"강압이자 항복 양쪽 모두로 공격받는 타협은 머지않아 타협 그 자체로서의 의미를 잃게 될 것이다.\""
 ve_cul_evt.42.a:0 "사업을 종결합니다."
 ve_cul_evt.42.a.tt:0 "문화위임력 환급 없이 문화 사업을 취소합니다.\n국가 결속력이 #N 5#! 감소합니다.\n#Y 2년#! 동안: 행정력 #N -50#!, 권위 #N -25#!, 그리고 법 제정 성공 #N -3%#!."
 ve_cul_evt.42.b:0 "긴급 지역 자원을 투입합니다."
 ve_cul_evt.42.b.tt:0 "문화위임력 #N 25#!를 소모합니다.\n문화 사업 진척도가 #N 5#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구의 #N 1%#!가 급진파가 됩니다.\n사업이 계속됩니다."
 ve_cul_evt.42.c:0 "최소한의 계획만으로 계속 진행합니다."
 ve_cul_evt.42.c.tt:0 "문화 사업 진척도가 #N 10#! 감소합니다.\n국가 결속력이 #N 2#! 감소합니다.\n사업이 계속됩니다."
 ve_cul_evt.42.e:0 "협상 체계를 재건합니다."
 ve_cul_evt.42.e.tt:0 "문화위임력 #N 15#!를 소모합니다.\n문화 사업 진척도가 #N 3#! 감소합니다.\n국가 결속력이 #P 2#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구의 #N 0.5%#!가 급진파가 됩니다.\n사업이 계속됩니다."

 ve_cul_evt.50.t:0 "성명 및 언어 지침"
 ve_cul_evt.50.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 관료들이 국어로 성명과 공적 기록을 표준화할 것을 제안합니다. 이 지침은 중앙 행정이 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구를 더 쉽게 분류할 수 있도록 만들겠지만, 가족들은 사적 정체성이 국가 직권의 대상이 되고 있음을 우려하고 있습니다."
 ve_cul_evt.50.f:0 "\"등록부에 다르게 적힌 이름일지라도, 그것은 여전히 한 가족이 스스로를 기억하는 이름일 수 있다.\""
 ve_cul_evt.50.a:0 "점진적인 등록 캠페인에 자금을 지원합니다."
 ve_cul_evt.50.a.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 4#! 증가합니다.\n국가 결속력이 #P 1#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구의 #N 0.5%#!가 급진파가 됩니다."
 ve_cul_evt.50.b:0 "단일한 국가 표준을 강제합니다."
 ve_cul_evt.50.b.tt:0 "문화 사업 진척도가 #P 7#! 증가합니다.\n국가 결속력이 #N 4#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구의 #N 1%#!가 급진파가 됩니다."
 ve_cul_evt.50.c:0 "지침을 철회하고 개정합니다."
 ve_cul_evt.50.c.tt:0 "문화 사업 진척도가 #N 5#! 감소합니다.\n국가 결속력이 #P 3#! 증가합니다."

 ve_cul_evt.51.t:0 "징병 등록부"
 ve_cul_evt.51.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 군사 관료들이 복무 특약, 성명, 지휘를 위한 단일 등록부를 요구합니다. 이를 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구에 적용하면 민족 통합 추진이 강화되겠지만, 군대를 문화 말살의 또 다른 도구로 여기는 공동체들 사이에서 반발이 거세지고 있습니다."
 ve_cul_evt.51.f:0 "\"국가가 어느 마을의 이름을 알게 되는 때는 세금을 거두거나 그 아들들을 소집하려 할 때뿐이다.\""
 ve_cul_evt.51.a:0 "국가 등록부를 적용합니다."
 ve_cul_evt.51.a.tt:0 "문화 사업 진척도가 #P 5#! 증가합니다.\n국가 결속력이 #N 2#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구의 #N 0.5%#!가 급진파가 됩니다."
 ve_cul_evt.51.b:0 "지역 등록 관행을 유지합니다."
 ve_cul_evt.51.b.tt:0 "문화 사업 진척도가 #N 3#! 감소합니다.\n국가 결속력이 #P 3#! 증가합니다."
 ve_cul_evt.51.c:0 "군 복무를 통해 등록부를 통합합니다."
 ve_cul_evt.51.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 6#! 증가합니다.\n국가 결속력이 #P 1#! 증가합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구의 #N 0.5%#!가 급진파가 됩니다."

 ve_cul_evt.100.t:0 "구성 협약 대표단"
 ve_cul_evt.100.d:0 "[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 공동체 대표단이 구성 협약 기관 내의 대표권 보장을 요구하며 도착했습니다. 협상을 진행하면 사업 진척도는 느려지겠지만 정통성이 강화될 것입니다. 반면 수도에서 강요한 합의는 신뢰를 대가로 더 빠르게 추진될 수 있습니다."
 ve_cul_evt.100.f:0 "\"협약은 모든 구성원이 자신이 작성에 기여한 조항을 지적할 수 있을 때 비로소 공통의 것이 된다.\""
 ve_cul_evt.100.a:0 "협약 내 그들의 지위를 협상한다."
 ve_cul_evt.100.a.tt:0 "문화 사업 진척도가 #N 4#! 감소합니다.\n국가 결속력이 #P 4#! 증가합니다."
 ve_cul_evt.100.b:0 "중앙의 합의안을 강제한다."
 ve_cul_evt.100.b.tt:0 "문화 사업 진척도가 #P 5#! 증가합니다.\n국가 결속력이 #N 2#! 감소합니다.\n[SCOPE.sState('ve_evt_target_state').GetName] 내 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구의 #N 0.5%#!가 급진파가 됩니다."
 ve_cul_evt.100.c:0 "의회 연정을 협상에 참여시킨다."
 ve_cul_evt.100.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 4#! 증가합니다.\n국가 결속력이 #P 2#! 증가합니다."

 ve_cul_evt.101.t:0 "이원 행정"
 ve_cul_evt.101.d:0 "[SCOPE.sState('ve_evt_target_state').GetName]의 구성 협약은 이제 서로 겹치는 두 개의 행정에 의존하고 있습니다. 중앙 관료들과 [SCOPE.sCulture('ve_evt_target_culture').GetName] 공동체 대표들이 장부를 중복으로 관리하고 임명을 두고 다투며 모순된 지침을 하달하는 동안, 국가의 행정력은 한계에 달하고 있습니다."
 ve_cul_evt.101.f:0 "\"두 개의 사무소는 서류 캐비닛을 나누어 쓰는 것보다 권한을 나누어 쓰는 것이 더 쉽다.\""
 ve_cul_evt.101.a:0 "공동 행정 인력에 자금을 지원한다."
 ve_cul_evt.101.a.tt:0 "문화위임력 #N 15#!을 소모합니다.\n문화 사업 진척도가 #P 6#! 증가합니다."
 ve_cul_evt.101.b:0 "양측 사무소가 합의할 때까지 협약을 늦춘다."
 ve_cul_evt.101.b.tt:0 "문화 사업 진척도가 #N 6#! 감소합니다.\n국가 결속력이 #P 2#! 증가합니다."
 ve_cul_evt.101.c:0 "공무원 조직 산하로 사무소를 통일한다."
 ve_cul_evt.101.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 5#! 증가합니다.\n국가 결속력이 #P 2#! 증가합니다."

 ve_cul_evt.150.t:0 "지방에서의 이행"
 ve_cul_evt.150.d:0 "지방 행정부들은 전국적인 문화 사업이 극도로 상이한 속도로 진행되고 있다고 보고합니다. 일부 사무소에서는 자금이 지원되는 이행 위원회를 요구하는 반면, 모든 지역에 단일 일정을 강요하는 것은 부족한 인력을 소모하고 대중의 자신감을 약화시킬 것이라고 경고합니다."
 ve_cul_evt.150.f:0 "\"전국 칙령은 한 번 작성되지만, 국가의 모든 사무소에서 이행되어야 한다.\""
 ve_cul_evt.150.a:0 "이행 위원회에 자금을 지원한다."
 ve_cul_evt.150.a.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 5#! 증가합니다."
 ve_cul_evt.150.b:0 "점진적 일정을 사용한다."
 ve_cul_evt.150.b.tt:0 "문화 사업 진척도가 #N 4#! 감소합니다.\n국가 결속력이 #P 2#! 증가합니다."
 ve_cul_evt.150.c:0 "기존 행정을 표준화한다."
 ve_cul_evt.150.c.tt:0 "문화위임력 #N 5#!을 소모합니다.\n문화 사업 진척도가 #P 3#! 증가합니다.\n국가 결속력이 #P 2#! 증가합니다."

 ve_cul_evt.151.t:0 "교수 언어"
 ve_cul_evt.151.d:0 "국가 교육과정은 공통의 교수 언어를 요구하지만, 전국의 학교들은 언어적 전통이 매우 다른 공동체를 상대하고 있습니다. 다국어 교재는 자신감을 보존하겠지만 배포를 지연시킬 것이며, 단일 교육과정은 교실에 빠르게 도달할 수 있겠지만 교육을 문화적 경쟁으로 변질시킬 위험이 있습니다."
 ve_cul_evt.151.f:0 "\"학생이 불신하는 언어로 가르친 교훈은 그 과목을 제외한 모든 것만 기억에 남을 수 있다.\""
 ve_cul_evt.151.a:0 "다국어 교재에 자금을 지원한다."
 ve_cul_evt.151.a.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 3#! 증가합니다.\n국가 결속력이 #P 3#! 증가합니다."
 ve_cul_evt.151.b:0 "하나의 국가 교육과정을 적용한다."
 ve_cul_evt.151.b.tt:0 "문화 사업 진척도가 #P 6#! 증가합니다.\n국가 결속력이 #N 3#! 감소합니다."
 ve_cul_evt.151.c:0 "교육망과 복지망을 결합한다."
 ve_cul_evt.151.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 5#! 증가합니다.\n국가 결속력이 #P 2#! 증가합니다."

 ve_cul_evt.160.t:0 "누가 민족국가를 대표하는가?"
 ve_cul_evt.160.d:0 "공유 상징 사업은 누구의 역사, 제복, 기념비 및 의식이 국가 전체를 대변할 수 있는가에 대한 논란을 다시 불러일으켰습니다. 전통을 순환시키는 것은 승인을 넓히겠지만 합의를 늦출 것이며, 단 하나의 공식적 서사를 채택하는 것은 명확성을 확보하는 대신 많은 시민들을 소외시킬 것입니다."
 ve_cul_evt.160.f:0 "\"상징은 시민들이 설명 없이도 그 안에서 자신을 발견할 때 비로소 민족적인 것이 된다.\""
 ve_cul_evt.160.a:0 "공공 영역의 상징을 순환시킨다."
 ve_cul_evt.160.a.tt:0 "문화 사업 진척도가 #N 3#! 감소합니다.\n결속력이 #P 4#! 증가합니다."
 ve_cul_evt.160.b:0 "단 하나의 공식적 서사를 채택한다."
 ve_cul_evt.160.b.tt:0 "문화 사업 진척도가 #P 6#! 증가합니다.\n결속력이 #N 3#! 감소합니다."
 ve_cul_evt.160.c:0 "공유된 공개 의식을 설계한다."
 ve_cul_evt.160.c.tt:0 "문화위임력 #N 10#!을 소모합니다.\n문화 사업 진척도가 #P 4#! 증가합니다.\n결속력이 #P 2#! 증가합니다."
