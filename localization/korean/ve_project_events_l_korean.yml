l_korean:
 ve_je_religious_project:0 "종교사업"
 ve_je_religious_project_reason:0 "정부는 장기적인 종교사업을 추진하고 있습니다. 그 진행은 행정 능력, 정치적 정당성, 종교적 조건, 대상 국가의 사건에 따라 결정됩니다."
 ve_je_religious_project_progress:0 "종교사업 완료를 향한 진행상황"
 ve_je_religious_project_status_confessional:0 "고백적 개종 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 조직적인 캠페인을 통해 국가의 신앙을 확장하려고 합니다.\n\n완료 #Y 125#! 진행: 대상 국가 인구의 5%를 국교로 개종시키고, 환불합니다. #P 20#! 경건한 개혁,  #P 5 추가#! 종교적 정착."
 ve_je_religious_project_status_freedom:0 "자유 봉사 활동 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 양심과 자발적인 연합을 바탕으로 합의를 구축하고 있습니다.\n\n완료 #Y 100#! 진행: 강제 전환 없이 국가 충성파 추가, 환불 #P 20#! 신앙 개혁,  #P 7#! 종교 정착을 추가합니다."
 ve_je_religious_project_status_secularization:0 "세속화 캠페인 [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] 조직화된 종교의 공적 권위를 축소하고 있습니다.\n\n완료: #Y 150#! 진행률: 대상 국가 인구의 5%를 무신론자로 전환하고 환불합니다. #P 25#! 경건한 개혁, 그리고 추가 #P 8#! 종교 정착."
 ve_je_religious_project_complete_tt:0 "종교 사업이 목표에 도달했습니다."
 ve_je_religious_project_fail_tt:0 "종교 사업이 취소되었습니다."

 ve_je_cultural_project:0 "문화 사업"
 ve_je_cultural_project_reason:0 "정부에서는 장기 문화사업을 추진하고 있다. 행정 역량, 정당성, 교육, 국민적 결속, 지역 여건에 따라 진행 속도가 결정됩니다. "
 ve_je_cultural_project_progress:0 "완결을 향한 문화 프로젝트 진행"
 ve_je_cultural_project_status_curriculum:0 "국가의 학교와 기관을 위한 국가 커리큘럼이 준비 중입니다.\n\n완료 시간: #Y 100#! 진전: #P +20#! 문화 명령, #P +5#! 국가 결속력, 그리고 10년 동안 교육 접근성 +2%, 자격 +5%, 관료제 -25를 달성했습니다."
 ve_je_cultural_project_status_symbols:0 "공유 기호 프로그램은 공통 시민 어휘를 구성합니다.\n\n완료: #Y 75#! 진행 상황:  #P +20#! Cultural Mandate,  #P +7#! National Cohesion, 완전히 수용된 대중의 충성도 +10% 및 권위 +25의 8년 결과."
 ve_je_cultural_project_status_ethnic:0 "민족통합운동 [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 소수 인구를 1차 문화로 압박하고 있습니다.\n\n완료 시점 #Y 125#! 진행률: 대상 문화 팝의 5%를 기본 문화로 변환합니다(민족주의 VII의 경우 7%), #P +25#! 문화명령, #P +8#! 국민적 결속과 10년간의 동화 결과."
 ve_je_cultural_project_status_civic:0 "평등 시민권 이니셔티브 [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 문화적 경계를 넘어 공통의 시민적 지위를 확장하고 있습니다.\n\n완료: #Y 100#!  진행: 10년 동안 +15% 수용, 국가 충성파, #P +25#! 문화 명령, #P +10#! 국민 결속력, 그리고 10년간의 자격/이민 결과."
 ve_je_cultural_project_status_composite:0 "The Constituent Compact in [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] 복합 상태 내에서 영구 인정을 협상 중입니다.\n\n완료 시간: #Y 150#! 진행 상황(40+ 국민 결속력 필요): 영구적 +15% 수용도, 구성원 목록에 문화 추가, 국가 충성파, #P +30#! 문화 명령, #P +12#! 국가적 결속."
 ve_je_cultural_project_complete_tt:0 "문화 프로젝트가 목표를 달성했습니다."
 ve_je_cultural_project_fail_tt:0 "문화 프로젝트가 취소되었습니다."
 ve_je_project_resolving_status:0 "프로젝트 관리가 최종 보고서를 제출 중입니다."

 ve_evt_religious_incident_cooldown_mdf:0 "종교 프로젝트 사건 쿨다운"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "프로젝트 관리가 최근 사건의 결과를 흡수하고 있습니다."
 ve_evt_cultural_incident_cooldown_mdf:0 "문화 프로젝트 사건 쿨다운"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "프로젝트 관리가 최근 사건의 결과를 흡수하고 있습니다."
 ve_evt_central_clergy_supported_mdf:0 "중앙 성직자 지원"
 ve_evt_central_clergy_supported_mdf_desc:0 "정부는 중앙 종교 계층의 권위를 옹호했습니다."
 ve_evt_central_clergy_slighted_mdf:0 "중앙 성직자 Slighted"
 ve_evt_central_clergy_slighted_mdf_desc:0 "정부는 중앙 종교 계층의 선호보다 지역 관행을 선호했습니다."
 ve_evt_municipal_patronage_mdf:0 "시 후원 네트워크"
 ve_evt_municipal_patronage_mdf_desc:0 "지역 유명 인사들은 세금 징수를 약화시키는 조치를 통해 프로젝트를 추진하고 있습니다."

 ve_rel_evt.1.t:0 "지역 유명 인사들의 청원서"
 ve_rel_evt.1.d:0 " [SCOPE.sState('ve_evt_target_state').GetName] 고백 개종을 늦추도록 정부에 청원했습니다. 그들은 융통성 없는 시간표가 순응을 지속적인 분노로 바꿀 것이라고 경고합니다."
 ve_rel_evt.1.f:0 "\\"변호인 없이 강요된 믿음은 좌석을 비우면서 기록부를 채울 수 있습니다.\\""
 ve_rel_evt.1.a:0 "그들의 청원을 들어보십시오."
 ve_rel_evt.1.a.tt:0 "종교 프로젝트 진행률은  #N 4#!만큼 감소합니다.\n종교 정착촌은  #P 3#!만큼 증가합니다."
 ve_rel_evt.1.b:0 "시간표는 변경되지 않습니다."
 ve_rel_evt.1.b.tt:0 "종교 프로젝트 진행률은 다음만큼 증가합니다. #P 5#!.\n종교 정착이 다음과 같이 감소합니다. #N 2#!.\n#N 0.5%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_rel_evt.1.c:0 "수탁은 중개자를 신뢰합니다."
 ve_rel_evt.1.c.tt:0 "지출 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률이  #P 3#! 증가합니다.\n종교 정착이 1 증가합니다. #P 1#!."

 ve_rel_evt.2.t:0 "현장임원 부족"
 ve_rel_evt.2.d:0 "보고서의 출처 [SCOPE.sState('ve_evt_target_state').GetName] 답변되지 않은 청원, 모순되는 지시, 몇 주 동안 프로젝트 담당자를 만나지 못한 지역에 대해 설명합니다. 신앙고백 개종은 이를 수행하도록 지정된 행정부보다 더 빨리 진행되고 있습니다. "
 ve_rel_evt.2.f:0 "\\"법령은 하루 만에 전국을 통과할 수 있습니다. 유능한 서기는 그럴 수 없습니다.\\""
 ve_rel_evt.2.a:0 "임시 현장 직원을 고용합니다."
 ve_rel_evt.2.a.tt:0 "지출 #N 15#! 신앙 개혁.\n종교 프로젝트 진행률이  #P 4#! 증가합니다. "
 ve_rel_evt.2.b:0 "프로그램 속도를 늦춥니다."
 ve_rel_evt.2.b.tt:0 "종교 프로젝트 진행률은  #N 6#!만큼 감소합니다.\n종교 정착은  #P 2#!만큼 증가합니다."
 ve_rel_evt.2.c:0 "중앙 등록 간부를 사용합니다."
 ve_rel_evt.2.c.tt:0 "지출 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률은  #P 5#!만큼 증가합니다."

 ve_cul_evt.1.t:0 "번역국"
 ve_cul_evt.1.d:0 "공무원 [SCOPE.sState('ve_evt_target_state').GetName] 평등한 시민권 계획(Equal Citizenship Initiative)이 문제를 어떻게 다루어야 하는지에 대해 동의하지 않습니다. [SCOPE.sCulture('ve_evt_target_culture').GetName] 언어. 지역 관리자는 이중 언어 사무실을 원합니다. 중앙 부처는 단일한 행정 기준을 요구합니다."
 ve_cul_evt.1.f:0 "\\"시민은 자신의 이름으로 부여된 권리를 이해하기 위해 통역사가 필요해서는 안됩니다.\\""
 ve_cul_evt.1.a:0 "공공기관에서 현지어가 살 수 있게 해주세요."
 ve_cul_evt.1.a.tt:0 "문화사업 진행률이  #N 4 감소합니다.#!.\n국가 결속력은  #P 3#! 증가합니다."
 ve_cul_evt.1.b:0 "하나의 행정 기준을 부과합니다. "
 ve_cul_evt.1.b.tt:0 "문화 프로젝트 진행률이  #P 5#! 증가합니다.\n국가 결속력이 1만큼 감소합니다. #N 2#!.\n#N 0.5%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_cul_evt.1.c:0 "학술번역위원회를 설립합니다."
 ve_cul_evt.1.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률이  #P 3 증가합니다.#!.\n국가적 결속력은 다음과 같이 증가합니다. #P 1#!."

 ve_cul_evt.2.t:0 "현지 교사 부족"
 ve_cul_evt.2.d:0 "학교 [SCOPE.sState('ve_evt_target_state').GetName] 주 교육과정과 교육과정을 모두 담당할 수 있는 교사가 부족합니다. [SCOPE.sCulture('ve_evt_target_culture').GetName] 커뮤니티. 훈련된 지역 간부 없이 평등한 시민권은 공식 문서에만 기록된 약속으로 남을 위험이 있습니다."
 ve_cul_evt.2.f:0 "\\"법은 평등을 오후에 선언합니다. 교실에서는 이를 한 세대 동안 가르쳐야 합니다.\\""
 ve_cul_evt.2.a:0 "새로운 사범대학에 자금을 조달하세요."
 ve_cul_evt.2.a.tt:0 "지출 #N 15#! 문화 명령.\n문화 프로젝트 진행률이  #P 4#! 증가합니다."
 ve_cul_evt.2.b:0 "느린 구현."
 ve_cul_evt.2.b.tt:0 "문화 프로젝트 진행률은  #N 6#!만큼 감소합니다.\n국가적 결속력은  #P 2#!만큼 증가합니다."
 ve_cul_evt.2.c:0 "이미 시행 중인 기관을 사용합니다."
 ve_cul_evt.2.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률은  #P 5#!만큼 증가합니다.\n국가적 결속력은  #P 1#!만큼 증가합니다."

 ve_rel_evt.3.t:0 "상충되는 기록"
 ve_rel_evt.3.d:0 "교구 명부, 지방 자치 단체 장부 ​​및 프로젝트 담당자의 보고서는 종교적 신념에 대해 양립할 수 없는 설명을 제공합니다. [SCOPE.sState('ve_evt_target_state').GetName]. 행정부는 진실을 규명하는 데 시간을 낭비할 것인지 아니면 불확실하다고 알고 있는 수치를 처리할 것인지 결정해야 합니다. "
 ve_rel_evt.3.f:0 "\\"모든 사무실에는 정확한 합계가 있습니다. 두 합계가 일치하지 않습니다.\\""
 ve_rel_evt.3.a:0 "완전한 감사를 실시합니다."
 ve_rel_evt.3.a.tt:0 "Gain #P 8#! 경건 개혁.\n종교 프로젝트 진행률이  #N 6#! 감소합니다."
 ve_rel_evt.3.b:0 "합리적인 추정으로 진행합니다. "
 ve_rel_evt.3.b.tt:0 "지출 #N 8#! 경건 개혁.\n종교 프로젝트 진행률이 다음으로 증가합니다. #P 5#!."
 ve_rel_evt.3.c:0 "신성한 행정 기록을 사용합니다."
 ve_rel_evt.3.c.tt:0 "종교 프로젝트 진행률이 #P 3#!만큼 증가합니다."

 ve_rel_evt.4.t:0 "소문 및 반설교"
 ve_rel_evt.4.d:0 "팜플렛, 거리 설교, 불안한 소문은 이제 교회의 고백적 회심을 묘사하고 있습니다. [SCOPE.sState('ve_evt_target_state').GetName] 지역 생활에 대한 공격으로. 관계자들은 침묵하면 반대자들이 프로젝트를 정의하게 될 것이며 억압은 그들의 가장 어두운 주장을 확인할 수 있다고 경고합니다. "
 ve_rel_evt.4.f:0 "\\"소문에는 사무실도, 인감도, 예산도 필요하지 않습니다.\\""
 ve_rel_evt.4.a:0 "공청회를 개최합니다."
 ve_rel_evt.4.a.tt:0 "종교 프로젝트 진행률이  #N 3#! 감소합니다.\n종교 정착이 1만큼 증가합니다. #P 3#!.\n#P 0.5%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 충성주의자가 됩니다. "
 ve_rel_evt.4.b:0 "선동자를 처벌하십시오."
 ve_rel_evt.4.b.tt:0 "종교 프로젝트 진행률은  #P 4#! 증가합니다.\n종교 정착은  #N 3#! 감소합니다.\n#N 1%#!  [SCOPE.sState('ve_evt_target_state').GetName] 과격해집니다."
 ve_rel_evt.4.c:0 "기록과 결과를 게시합니다."
 ve_rel_evt.4.c.tt:0 "지출 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률이  #P 2#!만큼 증가합니다.\n종교 정착량이 씩 증가합니다. #P 1#!."

 ve_rel_evt.5.t:0 "설교의 언어"
 ve_rel_evt.5.d:0 "프로젝트 성직자 [SCOPE.sState('ve_evt_target_state').GetName] 공식적인 설교는 교리적 통일성을 유지하지만 많은 회중에게 다가가지 못한다고 보고합니다. 중앙 계층은 적응이 독립이 될 것을 두려워하지만 현지 언어로 설교하는 것은 캠페인을 더욱 발전시킬 것입니다."
 ve_rel_evt.5.f:0 "\\"들어본 적 없는 신성한 말씀은 완벽하게 보존되며, 누구도 받아들이지 않습니다.\\""
 ve_rel_evt.5.a:0 "현지 언어로 설교하세요."
 ve_rel_evt.5.a.tt:0 "종교 프로젝트 진행률이  #P 6#!만큼 증가합니다.\n종교자는 패배합니다. #N 1#! 승인 #Y 2.5년#!."
 ve_rel_evt.5.b:0 "예식적 통일성을 보존하십시오."
 ve_rel_evt.5.b.tt:0 "종교 프로젝트 진행률은  #N 3#!만큼 감소합니다.\n종교 정착은  #P 3#!만큼 증가합니다.\n종교적 이득 #P 1#! 승인 #Y 2.5년#!."
 ve_rel_evt.5.c:0 "교육받은 통역사를 양성합니다."
 ve_rel_evt.5.c.tt:0 "지출 #N 10#! 경건 개혁.\n종교 프로젝트 진행률은  #P 4#! 증가합니다.\n종교 정착은  #P 1#! 증가합니다."

 ve_rel_evt.6.t:0 "경쟁 교회 당국"
 ve_rel_evt.6.d:0 "중앙 지명자와 확립된 지역 성직자 [SCOPE.sState('ve_evt_target_state').GetName] 각 사람은 고백적 개종을 지시할 권리를 주장합니다. 한쪽을 지지하면 명령이 빨리 회복될 수 있지만 분쟁은 이미 누가 신앙을 대변하는지에 대한 시험이 되었습니다."
 ve_rel_evt.6.f:0 "\\"다툼은 기관이 권력을 설명하는 방식인 관할권에 관한 것입니다.\\""
 ve_rel_evt.6.a:0 "중앙 성직자를 지원합니다."
 ve_rel_evt.6.a.tt:0 "종교 프로젝트 진행률이  #P 5#! 증가합니다.\n종교인의 이익 #P 1#! 승인 #Y 2.5년#!.\n종교 정착이 다음과 같이 감소합니다. #N 3#!.\n#N 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_rel_evt.6.b:0 "지역 성직자를 배치합니다."
 ve_rel_evt.6.b.tt:0 "종교 프로젝트 진행률은 #N 4#! 감소합니다.\n종교자는  #N 1#! 승인을  #Y 2.5년#! 동안 잃습니다.\n종교 정착촌은  #P 3#!만큼 증가합니다."
 ve_rel_evt.6.c:0 "그들의 권한을 서면으로 정의합니다."
 ve_rel_evt.6.c.tt:0 "지출 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률이  #P 3#! 증가합니다.\n종교 정착이  #P 1#! 증가합니다."

 ve_cul_evt.3.t:0 "인구조사 범주"
 ve_cul_evt.3.d:0 "인구조사 공무원 [SCOPE.sState('ve_evt_target_state').GetName] 시민들은 어떻게 생각하는지 동의할 수 없습니다. [SCOPE.sCulture('ve_evt_target_culture').GetName] 문화를 기록해야 한다. 지역 응답자는 중복되는 신원을 사용하는 반면 중앙 양식은 하나의 상자에 하나의 답변을 요구합니다."
 ve_cul_evt.3.f:0 "\\"범주가 국가를 단순화하기 훨씬 전에 장부를 단순화합니다.\\""
 ve_cul_evt.3.a:0 "자기 식별을 허용합니다."
 ve_cul_evt.3.a.tt:0 "문화 프로젝트 진행률이  #N 4 감소합니다.#!.\n국가 결속력은  #P 4#! 증가합니다."
 ve_cul_evt.3.b:0 "범주는 중앙에서 설정됩니다. "
 ve_cul_evt.3.b.tt:0 "문화 프로젝트 진행률은  #P 6#! 증가합니다.\n국가 결속력은 다음과 같이 감소합니다. #N 4#!.\n#N 0.5%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_cul_evt.3.c:0 "현대적인 등록 시스템을 사용하십시오."
 ve_cul_evt.3.c.tt:0 "경비 #N 10#! 문화 명령.\n문화 프로젝트 진행률이 다음과 같이 증가합니다. #P 5#!.\n국가 결속력이  #P 1#! 증가합니다."

 ve_cul_evt.4.t:0 "지방자치단체의 주목할만한 인물"
 ve_cul_evt.4.d:0 "시의 후원자 [SCOPE.sState('ve_evt_target_state').GetName] 동등한 시민권을 증진하기 위해 사무실, 고객 및 영향력을 제공합니다. [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구. 그들의 협력은 신속할 것이지만 그 대가는 계속해서 지역 수입을 통제하는 것입니다."
 ve_cul_evt.4.f:0 "\\"시청으로 가는 가장 짧은 길은 여러 개의 개인 응접실을 통과합니다.\\""
 ve_cul_evt.4.a:0 "로컬 네트워크를 활용하십시오."
 ve_cul_evt.4.a.tt:0 "문화 프로젝트 진행률은 다음과 같이 증가합니다. #P 5#!.\N[SCOPE.sState('ve_evt_target_state').GetName] 진다 #N 5%#! 과세 용량 #Y 2년#!."
 ve_cul_evt.4.b:0 "열린협의회를 만들어 보세요."
 ve_cul_evt.4.b.tt:0 "문화 프로젝트 진행률이  #N 3 감소합니다.#!.\n국가 결속력이  #P 3#! 증가합니다."
 ve_cul_evt.4.c:0 "규칙 기반 합의를 협상하세요."
 ve_cul_evt.4.c.tt:0 "경비 #N 10#! 문화 명령.\n문화 프로젝트 진행률이 다음과 같이 증가합니다. #P 3#!.\n국가적 결속력은 다음과 같이 증가합니다. #P 1#!."

 ve_cul_evt.5.t:0 "공무원 시험"
 ve_cul_evt.5.d:0 "공무원 시험을 다음으로 개설합니다. [SCOPE.sCulture('ve_evt_target_culture').GetName] 후보자들은 법적 평등과 실질적인 준비 사이의 격차를 드러냈습니다. 즉각적인 접근은 상징적으로 강력하지만, 수년간의 불평등한 교육은 법령으로 지울 수 없습니다."
 ve_cul_evt.5.f:0 "\\"단 한 명의 지원자만이 해당 언어를 배웠을 때 동일한 시험은 동일한 기회가 아닙니다.\\""
 ve_cul_evt.5.a:0 "금융 준비 과정."
 ve_cul_evt.5.a.tt:0 "지출 #N 15#! 문화 명령.\n문화 프로젝트 진행률  #P 5#! 증가.\n국가 결속력  #P 2#! 증가."
 ve_cul_evt.5.b:0 "동등한 접근이 즉시 시작됨."
 ve_cul_evt.5.b.tt:0 "문화 프로젝트 진행률  #P 7#! 증가.\n국가적 결속력  #N 4#! 감소.\n#N 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 된다."
 ve_cul_evt.5.c:0 "학교와 복지 네트워크를 동원하라."
 ve_cul_evt.5.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률이  #P 5#! 증가합니다.\n국가 결속력이 1 증가합니다. #P 2#!."
 ve_cul_evt.5.e:0 "시험 제도를 먼저 개혁하십시오."
 ve_cul_evt.5.e.tt:0 "문화 프로젝트 진행률은  #N 4#! 감소합니다.\n국민 결속력은  #P 3 증가합니다.#!."

 ve_cul_evt.6.t:0 "대다수가 반발"
 ve_cul_evt.6.d:0 "평등 시민권 계획(Equal Citizenship Initiative)의 반대자들은 공동의 권리를 다음과 같이 확장한다고 주장합니다. [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구는 다른 모든 사람의 지위를 감소시킵니다. 의 데모 [SCOPE.sState('ve_evt_target_state').GetName] 행정개혁을 국가적 정치적 시험으로 삼고 있다."
 ve_cul_evt.6.f:0 "\\"공유된 권리는 도난당한 특권으로 설명됩니다.\\""
 ve_cul_evt.6.a:0 "이니셔티브를 공개적으로 방어하세요."
 ve_cul_evt.6.a.tt:0 "문화 프로젝트 진행률은  #P 4#! 증가합니다.\n국가 결속력은  #N 4#! 감소합니다.\n#N 1%#!  [SCOPE.sState('ve_evt_target_state').GetName] 과격해집니다."
 ve_cul_evt.6.b:0 "실행 속도를 줄입니다."
 ve_cul_evt.6.b.tt:0 "문화 프로젝트 진행률은 #N 5#!만큼 감소합니다.\n국가 결속력은  #P 3#!만큼 증가합니다."
 ve_cul_evt.6.c:0 "개혁 연합을 동원합니다."
 ve_cul_evt.6.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률은 #P 3#!만큼 증가합니다.\n국가적 결속력은 다음과 같이 증가합니다. #P 2#!.\n#P 0.5%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 충성주의자가 됩니다."

 ve_rel_evt.7.t:0 "브레이킹 포인트에서의 임무"
 ve_rel_evt.7.d:0 "고백적 개종 [SCOPE.sState('ve_evt_target_state').GetName] 행정적, 정치적 붕괴에 가깝습니다. 사무실들은 서로 응답을 중단했고 대중의 저항은 더욱 거세졌으며 현장 성직자들은 임무가 현재 상태로는 계속될 수 없다고 경고했습니다."
 ve_rel_evt.7.f:0 "\\"보고서에서는 여전히 이를 일시적인 어려움이라고 부릅니다. 거리는 더 가혹한 이름을 선택했습니다.\\""
 ve_rel_evt.7.a:0 "손실을 받아들이고 철회하십시오."
 ve_rel_evt.7.a.tt:0 "신앙 개혁 환불 없이 종교 프로젝트를 취소하십시오.\n종교 정착은  #N 5#! 감소합니다.\n #Y 2년#!: #N -50#! 관료주의, #N -50#! 권력, #N -3%#! 법 제정 성공."
 ve_rel_evt.7.b:0 "긴급 자원 이전."
 ve_rel_evt.7.b.tt:0 "지출 #N 25#! 신앙 개혁.\n종교 프로젝트 진행률 #N 5#! 감소.\n#N 1%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다.\n프로젝트는 계속됩니다."
 ve_rel_evt.7.c:0 "뼈대 있는 직원으로 계속하십시오."
 ve_rel_evt.7.c.tt:0 "종교 프로젝트 진행률은  #N 10#!만큼 감소합니다.\n종교 정착은 다음만큼 감소합니다. #N 2#!.\n프로젝트는 계속됩니다."
 ve_rel_evt.7.e:0 "방법을 재협상합니다."
 ve_rel_evt.7.e.tt:0 "지출 #N 15#! 신앙 개혁.\n종교 프로젝트 진행률은 #N 3 감소합니다.#!.\n종교 정착지가  #P 2#!만큼 증가합니다.\n#N 0.5%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다.\n프로젝트는 계속됩니다."

 ve_cul_evt.7.t:0 "이니셔티브는 정당성을 잃습니다."
 ve_cul_evt.7.d:0 "평등 시민권 이니셔티브 [SCOPE.sState('ve_evt_target_state').GetName] 기존 기관과 기관 모두로부터 지원을 잃고 있습니다. [SCOPE.sCulture('ve_evt_target_culture').GetName] 지역사회에 봉사하기 위한 것이었습니다. 이제 급진적 운동은 모든 타협을 정부가 평등을 제공할 수 없다는 증거로 묘사합니다."
 ve_cul_evt.7.f:0 "\\"개혁은 반대에도 살아남을 수 있습니다. 믿을 수 없게 되면 살아남을 수 없습니다.\\""
 ve_cul_evt.7.a:0 "이니셔티브를 종료합니다."
 ve_cul_evt.7.a.tt:0 "문화 명령 환불 없이 문화 프로젝트를 취소합니다.\n국가적 결속력은 다음과 같이 감소합니다. #N 5#!.\n용 #Y 2년#!: #N -50#! 관료제, #N -25#! 권위, 그리고  #N -3%#! 법 제정 성공."
 ve_cul_evt.7.b:0 "긴급 지역 보조금 지급."
 ve_cul_evt.7.b.tt:0 "지출 #N 25#! 문화 명령.\n문화 프로젝트 진행률이 다음으로 감소합니다. #N 5#!.\n#N 1%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다.\n프로젝트는 계속됩니다."
 ve_cul_evt.7.c:0 "최소한의 프로그램으로 계속하세요."
 ve_cul_evt.7.c.tt:0 "문화 프로젝트 진행률은  #N 10#! 감소합니다.\n국민 결속력은  #N 2#! 감소합니다.\n프로젝트는 계속됩니다."
 ve_cul_evt.7.e:0 "연합을 재건합니다."
 ve_cul_evt.7.e.tt:0 "지출 #N 15#! 문화 명령.\n문화 프로젝트 진행률은  #N 3#! 감소합니다.\n국가 결속력은  #P 2#! 증가합니다.\n#N 0.5%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다.\n프로젝트는 계속됩니다."

 ve_rel_evt.8.t:0 "예상치 못한 지역 콩코드"
 ve_rel_evt.8.d:0 "성직자, 지방자치단체 공무원, 지역사회 장로들 [SCOPE.sState('ve_evt_target_state').GetName] 어떤 중앙 지시도 도출할 수 없는 합의에 도달했습니다. 지역적 저항이 줄어들고 있고, 회중들이 스스로 선교를 조정하고 있으며, 고백적 회심이 예상치 못한 추진력을 얻었습니다."
 ve_rel_evt.8.f:0 "\\"수도의 명령으로 시작된 것이 마을 광장에서 만들어진 콤팩트가 되었다.\\""
 ve_rel_evt.8.a:0 "이 추진력을 최대한 활용하십시오."
 ve_rel_evt.8.a.tt:0 "종교 정착지는 #P 1#!만큼 증가합니다.\n종교 프로젝트 진행률은 #P 25#!만큼 증가합니다.\n진행률 #Y 100#!에 도달하면 프로젝트의 정상적인 완료 효과가 적용됩니다."
 ve_rel_evt.8.b:0 "속도 전 내구성."
 ve_rel_evt.8.b.tt:0 "종교 정착촌은 #P 4#!만큼 증가합니다.\n종교 프로젝트 진행률은 다음만큼 증가합니다. #P 10#!.\n진행률이  #Y 100#!에 도달하면 프로젝트의 정상적인 완료 효과가 적용됩니다."

 ve_cul_evt.8.t:0 "A 지역 시민 연합"
 ve_cul_evt.8.d:0 "교사, 지자체 공무원, 무역 협회 및 대표자 [SCOPE.sCulture('ve_evt_target_culture').GetName] 커뮤니티 [SCOPE.sState('ve_evt_target_state').GetName] 공동위원회를 구성했습니다. 분쟁이 수도에 도달하기 전에 해결함으로써 이 연합은 평등 시민권 이니셔티브(Equal Citizenship Initiative)에 행정부가 만들어낼 수 없는 추진력을 제공했습니다."
 ve_cul_evt.8.f:0 "\\"거의 테이블을 공유하지 않는 기관이 책임을 공유하기 시작하면서 시민권은 현실이 되었습니다.\\""
 ve_cul_evt.8.a:0 "연합의 추진력을 활용하세요. "
 ve_cul_evt.8.a.tt:0 "국민 결속력은  #P 1 증가합니다.#!.\n문화 프로젝트 진행률이  #P 25#!만큼 증가합니다.\n진행률이  #Y 100#!에 도달하면 프로젝트의 정상적인 완료 효과가 적용됩니다."
 ve_cul_evt.8.b:0 "기관을 영구적으로 만듭니다."
 ve_cul_evt.8.b.tt:0 "국가 결속력이  #P 4#!만큼 증가합니다.\n문화 프로젝트 진행률이  #P 10#!만큼 증가합니다.\n진행률이  #Y 100에 도달하면#!, 프로젝트의 정상 완료 효과가 적용됩니다."

 ve_rel_evt.40.t:0 "단계를 벗어난 기록"
 ve_rel_evt.40.d:0 "지방 등록부 [SCOPE.sState('ve_evt_target_state').GetName] 교회, 시민 단체, 공공 기관에는 호환되지 않는 카테고리를 사용하세요. 이제 수도에 도달하는 보고서는 서로 모순되어 프로젝트가 준수와 저항을 구분할 수 없게 됩니다."
 ve_rel_evt.40.f:0 "\\"세 개의 원장을 통해 관리되는 정책은 곧 세 가지 다른 현실을 획득합니다.\\""
 ve_rel_evt.40.a:0 "중앙 감사를 보냅니다."
 ve_rel_evt.40.a.tt:0 "경비 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률이 다음과 같이 증가합니다. #P 5#!.\n종교 정착지가 다음과 같이 증가합니다. #P 1#!."
 ve_rel_evt.40.b:0 "로컬 기록을 조정합니다."
 ve_rel_evt.40.b.tt:0 "종교 프로젝트 진행률은 #N 3#!만큼 감소합니다.\n종교 정착촌은  #P 2#!만큼 증가합니다."
 ve_rel_evt.40.c:0 "표준 등록 절차를 적용합니다."
 ve_rel_evt.40.c.tt:0 "지출 #N 5#! 신앙 개혁.\n종교 프로젝트 진행률은 #P 4만큼 증가합니다.#!.\n종교 정착지가  #P 1#!만큼 증가합니다."

 ve_rel_evt.41.t:0 "지방 직원 부족"
 ve_rel_evt.41.d:0 "프로젝트를 지휘하는 사무실 [SCOPE.sState('ve_evt_target_state').GetName] 훈련받은 서기, 교사, 조사관을 충분히 찾을 수 없습니다. 지침은 현지 공무원이 해석할 수 있는 것보다 더 빠르게 축적되고 있으며, 서둘러 임명하면 모든 분쟁이 더욱 악화될 위험이 있습니다."
 ve_rel_evt.41.f:0 "\\"법령은 하루 만에 도착했습니다. 이를 수행할 수 있는 사람들은 한 세대가 걸릴 수도 있습니다.\\""
 ve_rel_evt.41.a:0 "새로운 간부 간부에게 자금을 조달하십시오."
 ve_rel_evt.41.a.tt:0 "지출 #N 15#! 신앙 개혁.\n종교 프로젝트 진행률이  #P 6 증가합니다.#!."
 ve_rel_evt.41.b:0 "구현 속도를 늦춥니다."
 ve_rel_evt.41.b.tt:0 "종교 프로젝트 진행률은 #N 6#! 감소합니다.\n종교 정착은  #P 2#!만큼 증가합니다."
 ve_rel_evt.41.c:0 "기존 교육 네트워크를 사용합니다."
 ve_rel_evt.41.c.tt:0 "지출 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률은 #P 5 증가합니다.#!.\n종교 정착지가  #P 1#!만큼 증가합니다."

 ve_rel_evt.42.t:0 "지역 전체에 소문이 돌다"
 ve_rel_evt.42.d:0 "소문이 [SCOPE.sState('ve_evt_target_state').GetName] 해당 프로젝트에는 정부가 발표한 것보다 훨씬 더 가혹한 조치가 숨겨져 있다고 주장한다. 종교 조직자와 지역 선동가들은 모순된 이야기를 반복하는 반면 공식적인 침묵은 각각의 새로운 버전이 퍼질 여지를 제공합니다."
 ve_rel_evt.42.f:0 "\\"소문에는 사무실도, 예산도, 서명도 필요하지 않습니다.\\""
 ve_rel_evt.42.a:0 "보고서를 게시합니다."
 ve_rel_evt.42.a.tt:0 "종교 프로젝트 진행률이  #N 3#! 감소합니다.\n종교 정착지가  #P 4 증가합니다.#!."
 ve_rel_evt.42.b:0 "선동을 해제합니다."
 ve_rel_evt.42.b.tt:0 "종교 프로젝트 진행률이  #P 5#! 증가합니다.\n종교 정착이  #N 3 감소합니다.#!.\n#N 1%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_rel_evt.42.c:0 "지역 중재자를 위임합니다."
 ve_rel_evt.42.c.tt:0 "지출 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률이 다음과 같이 증가합니다. #P 4#!.\n종교 정착지가 다음과 같이 증가합니다. #P 2#!.\n#P 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 충성주의자가 됩니다."

 ve_rel_evt.43.t:0 "한계점에 있는 행정부"
 ve_rel_evt.43.d:0 "의 프로젝트 [SCOPE.sState('ve_evt_target_state').GetName] 행정 붕괴에 가까워지고 있습니다. 지방 사무소는 압도당하고, 대중의 신뢰는 무너졌으며, 조직화된 야당은 이제 각각의 새로운 지시를 정부가 통제력을 잃었다는 증거로 취급합니다."
 ve_rel_evt.43.f:0 "\\"파일 이동이 멈추면 위기는 거리로 옮겨갑니다.\\""
 ve_rel_evt.43.a:0 "프로그램을 종료하세요."
 ve_rel_evt.43.a.tt:0 "경건 개혁 환불 없이 종교 프로젝트를 취소하세요.\n종교 정착은 다음과 같이 감소합니다. #N 5#!.\n용 #Y 2년#!: #N -50#! 관료제, #N -50#! 권위 및  #N -3%#! 법 제정 성공."
 ve_rel_evt.43.b:0 "긴급 자원 이전."
 ve_rel_evt.43.b.tt:0 "지출 #N 25#! 신앙 개혁.\n종교 프로젝트 진행률이 다음과 같이 감소합니다. #N 5#!.\n#N 1%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다.\n프로젝트는 계속됩니다."
 ve_rel_evt.43.c:0 "뼈대 있는 직원으로 계속 진행하세요."
 ve_rel_evt.43.c.tt:0 "종교 프로젝트 진행률이 다음과 같이 감소합니다. #N 10#!.\n종교 정착이  #N 2#! 감소합니다.\n프로젝트는 계속됩니다."
 ve_rel_evt.43.e:0 "지역 파트너십을 재건합니다."
 ve_rel_evt.43.e.tt:0 "지출 #N 15#! 신앙 개혁.\n종교 프로젝트 진행률이 다음과 같이 감소합니다. #N 3#!.\n종교 정착지가 다음과 같이 증가합니다. #P 2#!.\n#N 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다.\n프로젝트는 계속됩니다."

 ve_rel_evt.100.t:0 "종교간 협의회 의석"
 ve_rel_evt.100.d:0 "대표 [SCOPE.sState('ve_evt_target_state').GetName] 종교 간 협의회가 필요하다는 데 동의하지만 누가 자리에 앉을 자격이 있는지에 대해서는 동의하지 않습니다. 비례 대표는 소규모 공동체를 안심시킬 수 있는 반면, 수도에 설계된 고정 거주지는 즉시 작업을 시작할 수 있습니다."
 ve_rel_evt.100.f:0 "\\"의자를 계산할 때까지 모든 사람이 공동 테이블을 지원합니다.\\""
 ve_rel_evt.100.a:0 "인구별로 대표를 분배합니다."
 ve_rel_evt.100.a.tt:0 "종교 프로젝트 진행률은 다음과 같이 감소합니다. #N 3#!.\n종교 정착은  #P 4#! 증가합니다."
 ve_rel_evt.100.b:0 "고정 중앙 절충안을 부과합니다."
 ve_rel_evt.100.b.tt:0 "종교 프로젝트 진행률은  #P 5 증가합니다#!.\n종교 정착이  #N 2#!만큼 감소합니다.\n#N 인구의 0.5%#!  [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_rel_evt.100.c:0 "종교간 협의회에 힘을 실어주세요."
 ve_rel_evt.100.c.tt:0 "경비 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률이 다음과 같이 증가합니다. #P 5#!.\n종교 정착지가  #P 2#! 증가합니다."

 ve_rel_evt.101.t:0 "공유 학교 커리큘럼"
 ve_rel_evt.101.d:0 "다음 학교 [SCOPE.sState('ve_evt_target_state').GetName] 자유 봉사 활동을 지역 신념에 반대하는 캠페인으로 바꾸지 않고 일반적인 시민 교훈이 필요합니다. 교사들은 명확한 자료와 합동 교육을 요구하는 반면, 지역 사회 지도자들은 지역 교육이 자신들의 전통을 유지할 여지를 남겨야 한다고 주장합니다."
 ve_rel_evt.101.f:0 "\\"공유 수업은 모든 가족이 교실을 자신의 교실로 인식할 때만 성공합니다.\\""
 ve_rel_evt.101.a:0 "공동 교사 간부에게 자금을 조달합니다."
 ve_rel_evt.101.a.tt:0 "소비 #N 15#! 경건한 개혁.\n종교 프로젝트 진행률은  #P 6#! 증가합니다.\n종교 정착촌은  #P 1#!만큼 증가합니다."
 ve_rel_evt.101.b:0 "지역 커리큘럼을 위한 여지는 남겨두십시오."
 ve_rel_evt.101.b.tt:0 "종교 프로젝트 진행률은  #N 4#!만큼 감소합니다.\n종교 정착촌은  #P 3#!만큼 증가합니다."
 ve_rel_evt.101.c:0 "개혁 연합을 학교에 도입하십시오."
 ve_rel_evt.101.c.tt:0 "지출 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률이  #P 5#! 증가합니다.\n종교 정착이  #P 2#! 증가합니다.\n#P 0.5%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 충성주의자가 됩니다."

 ve_rel_evt.102.t:0 "상호 보증 헌장"
 ve_rel_evt.102.d:0 "종교 단체, 지방자치단체 공무원, 개혁 협회 [SCOPE.sState('ve_evt_target_state').GetName] 공동 헌장 초안을 작성했습니다. 각 서명자는 어떤 공동체도 지역 기관에서 제외되지 않을 것이라는 공적 보증의 대가로 동일한 시민적 의무를 수락합니다."
 ve_rel_evt.102.f:0 "\\"모든 약속이 다른 당사자의 권리로 기록되었을 때 신뢰가 가능해졌습니다.\\""
 ve_rel_evt.102.a:0 "컴팩트의 추진력을 이용하세요."
 ve_rel_evt.102.a.tt:0 "종교 정착은  #P 2#!만큼 증가합니다.\n종교 프로젝트 진행률은  #P 20#!만큼 증가합니다.\n진행률이  #Y 100#!에 도달하면 프로젝트의 정상적인 완료 효과가 적용됩니다."
 ve_rel_evt.102.b:0 "보증을 영구적으로 만듭니다."
 ve_rel_evt.102.b.tt:0 "종교 정착은  #P 4#!만큼 증가합니다.\n#P 0.5%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 충성주의자가 됩니다.\n종교 프로젝트 진행률이 다음과 같이 증가합니다. #P 10#!.\n진행률이 도달한 경우 #Y 100#!, 프로젝트의 정상 완료 효과가 적용됩니다. "

 ve_rel_evt.150.t:0 "교사 또는 검사관?"
 ve_rel_evt.150.d:0 "세속화 캠페인 [SCOPE.sState('ve_evt_target_state').GetName] 전문인력 부족을 드러냈다. 행정부는 장기적인 시민 역량을 구축하는 교직원을 확대하거나 이미 이용 가능한 직원으로 새로운 규칙을 시행할 수 있는 조사관에게 의존할 수 있습니다."
 ve_rel_evt.150.f:0 "\\"조사관은 오후에 학교를 폐쇄할 수 있습니다. 교사는 그곳에서 가르친 내용을 대체하는 데 몇 년이 필요할 수 있습니다.\\""
 ve_rel_evt.150.a:0 "교직원을 확대하세요."
 ve_rel_evt.150.a.tt:0 "경비 #N 15#! 신앙 개혁.\n종교 프로젝트 진행률이 다음과 같이 증가합니다. #P 6#!."
 ve_rel_evt.150.b:0 "기존 직원에 맞춰 프로그램 속도를 늦춥니다."
 ve_rel_evt.150.b.tt:0 "종교 프로젝트 진행률이  #N 5#! 감소합니다.\n종교 정착이  #P 2#! 증가합니다."
 ve_rel_evt.150.c:0 "공공 교육 네트워크를 가동합니다."
 ve_rel_evt.150.c.tt:0 "경비 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률이 다음과 같이 증가합니다. #P 5#!.\n종교 정착지가 다음과 같이 증가합니다. #P 1#!."

 ve_rel_evt.151.t:0 "압수된 재산"
 ve_rel_evt.151.d:0 "의 이전 종교 재산 [SCOPE.sState('ve_evt_target_state').GetName] 학교, 진료소, 관공서로의 전환을 준비하세요. 즉시 이전하면 캠페인에 귀중한 인프라가 제공되지만 보상이 없다는 점은 Devout의 집결지가 되고 있습니다."
 ve_rel_evt.151.f:0 "\\"열쇠는 하루아침에 손이 바뀌었습니다. 소유권에 대한 논쟁은 자물쇠보다 오래 지속될 것입니다.\\""
 ve_rel_evt.151.a:0 "단계적으로 보상을 지불하십시오."
 ve_rel_evt.151.a.tt:0 "지출  #N 15#! 신앙 개혁.\n종교 프로젝트 진행률  #P 3#! 증가.\n종교 정착촌  #P 3#! 증가."
 ve_rel_evt.151.b:0 "부동산을 즉시 공공 서비스에 투입."
 ve_rel_evt.151.b.tt:0 "종교 프로젝트 진행률  #P 7#! 증가.\n종교 정착촌  #N 4 감소#!.\n#N 1%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다.\n독실한 신자는 패배합니다. #N 1#! 승인 #Y 2.5년#!."
 ve_rel_evt.151.c:0 "세속 복지 기관으로 이송합니다."
 ve_rel_evt.151.c.tt:0 "경비 #N 10#! 신앙 개혁.\n종교 프로젝트 진행률이 다음과 같이 증가합니다. #P 5#!.\n종교 정착지가  #P 2 증가합니다.#!.\n#P 0.5%#! 인구의 [SCOPE.sState('ve_evt_target_state').GetName] 충성주의자가 됩니다."

 ve_rel_evt.152.t:0 "시민단체가 뿌리를 내립니다."
 ve_rel_evt.152.d:0 "교원회, 공제회, 지방자치단체가 [SCOPE.sState('ve_evt_target_state').GetName] 일단 종교 기관을 통해 조직된 서비스를 제공하기 시작했습니다. 이들의 협력으로 세속화 캠페인은 단순한 행정적 존재가 아닌 지역 시민 기반을 갖게 되었습니다."
 ve_rel_evt.152.f:0 "\\"시민들이 검사관을 기다리지 않고 이를 유지하기 시작했을 때 새로운 질서는 지속되었습니다.\\""
 ve_rel_evt.152.a:0 "지역 추진력을 활용하십시오."
 ve_rel_evt.152.a.tt:0 "종교 정착지가 다음과 같이 증가합니다. #P 2#!.\n종교 프로젝트 진행률이 다음과 같이 증가합니다. #P 20#!.\n진행률이 도달한 경우 #Y 100#!, 프로젝트의 정상적인 완료 효과가 적용됩니다. "
 ve_rel_evt.152.b:0 "협회를 영구 기관으로 전환합니다. "
 ve_rel_evt.152.b.tt:0 "종교 정착이  #P 4#! 증가합니다.\n종교 프로젝트 진행이  #P 10#! 증가합니다.\n진행률이 #Y 100#!, 프로젝트의 정상 완료 효과가 적용됩니다."

 ve_cul_evt.40.t:0 "지역 학교위원회"
 ve_cul_evt.40.d:0 "학교 게시판 [SCOPE.sState('ve_evt_target_state').GetName] 장소에 대해 의견이 일치하지 않습니다. [SCOPE.sCulture('ve_evt_target_culture').GetName] 공공 교육에서의 언어. 현지 언어 교육은 신뢰를 유지하는 반면, 단일 행정 언어는 국가 프로젝트의 지시를 더 쉽게 만들 것입니다."
 ve_cul_evt.40.f:0 "\\"첫 번째 수업에서 선택한 언어는 종종 학교가 자신의 것이라고 믿는 사람을 결정합니다.\\""
 ve_cul_evt.40.a:0 "현지 언어를 보호하세요."
 ve_cul_evt.40.a.tt:0 "문화 프로젝트 진행률이  #N 4 감소합니다.#!.\n국가 결속력이  #P 3#! 증가합니다."
 ve_cul_evt.40.b:0 "하나의 행정 언어를 부과합니다."
 ve_cul_evt.40.b.tt:0 "문화 프로젝트 진행도가 증가합니다. #P 5#!.\n국가 결속력은 다음과 같이 감소합니다. #N 2#!.\n#N 0.5%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_cul_evt.40.c:0 "교사 네트워크를 확장합니다."
 ve_cul_evt.40.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률이  #P 4 증가합니다.#!.\n국가 결속력은  #P 2#! 증가합니다."

 ve_cul_evt.41.t:0 "통계적 경계"
 ve_cul_evt.41.d:0 "공무원 조사 [SCOPE.sState('ve_evt_target_state').GetName] 어디에 동의할 수 없다 [SCOPE.sCulture('ve_evt_target_culture').GetName] 공동체는 시작되고 끝납니다. 지역 정체성은 언어, 지역, 관습에 걸쳐 중복되지만 국가 프로젝트에서는 계산하고 관리할 수 있는 범주가 필요합니다."
 ve_cul_evt.41.f:0 "\\"인구 조사를 위해 설정된 경계에는 곧 공무원, 예산, 옹호자가 확보됩니다.\\""
 ve_cul_evt.41.a:0 "자기 식별의 여지를 남겨두십시오."
 ve_cul_evt.41.a.tt:0 "문화 프로젝트 진행률은  #N 3#! 감소합니다.\n국가 결속력은  #P 3#! 증가합니다."
 ve_cul_evt.41.b:0 "센터에서 경계를 정의하게 하세요. "
 ve_cul_evt.41.b.tt:0 "문화 프로젝트 진행률이  #P 6 증가합니다.#!.\n국민 결속력은  #N 3#! 감소합니다.\n#N 0.5%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_cul_evt.41.c:0 "표준 등록 시스템을 사용하세요."
 ve_cul_evt.41.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률이 다음과 같이 증가합니다. #P 5#!.\n국가적 결속력은 다음과 같이 증가합니다. #P 1#!."

 ve_cul_evt.42.t:0 "국가 프로젝트의 한계점"
 ve_cul_evt.42.d:0 "의 국가 프로젝트 [SCOPE.sState('ve_evt_target_state').GetName] 붕괴가 다가오고 있습니다. 급진적인 운동은 정부가 정부를 배신했다고 주장합니다. [SCOPE.sCulture('ve_evt_target_culture').GetName] 지역 사무소는 더 이상 또 다른 타협을 시행할 자신감을 갖고 있지 않습니다."
 ve_cul_evt.42.f:0 "\\"강요와 항복 모두로 공격받은 합의는 곧 전혀 합의가 될 수 없게 될 수 있습니다.\\""
 ve_cul_evt.42.a:0 "프로젝트를 종료하세요."
 ve_cul_evt.42.a.tt:0 "문화 명령 환불 없이 문화 프로젝트를 취소하십시오.\n국가 결속력은 다음과 같이 감소합니다. #N 5#!.\n용 #Y 2년#!: #N -50#! 관료주의, #N -25#! 권력, #N -3%#! 법 제정 성공."
 ve_cul_evt.42.b:0 "긴급 지역 자원 이전."
 ve_cul_evt.42.b.tt:0 "지출 #N 25#! 문화 명령.\n문화 프로젝트 진행률은 #N 5#!.\n#N 1%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다.\n프로젝트는 계속됩니다."
 ve_cul_evt.42.c:0 "최소한의 프로그램으로 계속 진행하세요."
 ve_cul_evt.42.c.tt:0 "문화 프로젝트 진행률은 #N 10#!.\n국가 결속력이 다음과 같이 감소합니다. #N 2#!.\n프로젝트는 계속됩니다."
 ve_cul_evt.42.e:0 "협상 프레임워크를 재구축하세요."
 ve_cul_evt.42.e.tt:0 "지출 #N 15#! 문화 명령.\n문화 프로젝트 진행률이  #N 3 감소합니다.#!.\n국가 결속력은  #P 2#! 증가합니다.\n#N 0.5%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다.\n프로젝트는 계속됩니다."

 ve_cul_evt.50.t:0 "성 및 언어 지침"
 ve_cul_evt.50.d:0 "공식 [SCOPE.sState('ve_evt_target_state').GetName] 성과 공공 기록을 자국어로 표준화하는 것을 제안합니다. 지시문은 [SCOPE.sCulture('ve_evt_target_culture').GetName] 중앙 정부에서는 인구를 분류하기가 쉽지만 가족들은 개인의 정체성이 국가 명령의 대상이 되는 것을 두려워합니다."
 ve_cul_evt.50.f:0 "\\"등록부에 다르게 기록된 이름은 여전히 ​​가족이 기억하는 이름일 수 있습니다.\\""
 ve_cul_evt.50.a:0 "점진적인 등록 캠페인에 자금을 지원하세요."
 ve_cul_evt.50.a.tt:0 "경비 #N 10#! 문화 명령.\n문화 프로젝트 진행률이 다음과 같이 증가합니다. #P 4#!.\n국가적 결속력은 다음과 같이 증가합니다. #P 1#!.\n#N 0.5%#! 의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_cul_evt.50.b:0 "하나의 국가 표준을 시행합니다. "
 ve_cul_evt.50.b.tt:0 "문화 프로젝트 진행률이 #P 7#!.\n국가 결속력은  #N 4#! 감소합니다.\n#N 1%#!  [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_cul_evt.50.c:0 "개정 지침을 철회합니다."
 ve_cul_evt.50.c.tt:0 "문화 프로젝트 진행률은  #N 5#! 감소합니다.\n국가 결속력은  #P 3 증가합니다.#!."

 ve_cul_evt.51.t:0 "징집 등록"
 ve_cul_evt.51.d:0 "군 관계자 [SCOPE.sState('ve_evt_target_state').GetName] 서비스 의무, 성 및 명령에 대한 단일 등록을 요구합니다. 에 적용하면 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구는 민족 통합 운동을 강화할 것이지만 군대를 문화 말살의 또 다른 도구로 보는 지역 사회에서는 저항이 커지고 있습니다."
 ve_cul_evt.51.f:0 "\\"국가는 세금을 징수하거나 아들을 소환하려고 할 때 먼저 마을의 이름을 알게 됩니다.\\""
 ve_cul_evt.51.a:0 "국가 등록을 적용합니다. "
 ve_cul_evt.51.a.tt:0 "문화 프로젝트 진행률이  #P 5#! 증가합니다.\n국가 결속력이  #N 2#! 감소합니다.\n#N 0.5%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_cul_evt.51.b:0 "지역 등록 관행을 보존합니다."
 ve_cul_evt.51.b.tt:0 "문화 프로젝트 진행률이  #N 3 감소합니다.#!.\n국가 결속력은  #P 3#! 증가합니다."
 ve_cul_evt.51.c:0 "병역을 통해 장부를 통합합니다."
 ve_cul_evt.51.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률이 다음과 같이 증가합니다. #P 6#!.\n국가적 결속력은 다음과 같이 증가합니다. #P 1#!.\n#N 0.5%#! 의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 된다."

 ve_cul_evt.100.t:0 "제헌의회 대표단"
 ve_cul_evt.100.d:0 "대표단은 [SCOPE.sCulture('ve_evt_target_culture').GetName] 커뮤니티 [SCOPE.sState('ve_evt_target_state').GetName] 제헌협약 기관에 대표를 선출하라는 요구가 도착했습니다. 협상을 통해 프로젝트 속도가 느려지지만 적법성은 강화됩니다. 자본에서 부과된 합의는 신뢰를 대가로 더 빨리 진행될 수 있습니다."
 ve_cul_evt.100.f:0 "\\"모든 구성원이 자신이 작성하는 데 도움을 준 조항을 지적할 수 있을 때만 협약이 일반화됩니다.\\""
 ve_cul_evt.100.a:0 "협약에서 각자의 자리를 협상합니다. "
 ve_cul_evt.100.a.tt:0 "문화 프로젝트 진행률은  #N 4#! 감소합니다.\n국민 결속력은  #P 4#! 증가합니다."
 ve_cul_evt.100.b:0 "중앙 합의를 시행합니다. "
 ve_cul_evt.100.b.tt:0 "문화 프로젝트 진행률은  #P 5#! 증가합니다.\n국민 결속력은  #N 2#! 감소합니다.\n#N 0.5%#! ~의 [SCOPE.sCulture('ve_evt_target_culture').GetName] 인구 [SCOPE.sState('ve_evt_target_state').GetName] 급진적이 됩니다."
 ve_cul_evt.100.c:0 "의회 연합을 회담에 참여시키세요."
 ve_cul_evt.100.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률이 다음과 같이 증가합니다. #P 4#!.\n국가 결속력이  #P 2 증가합니다.#!."

 ve_cul_evt.101.t:0 "이중 관리"
 ve_cul_evt.101.d:0 "헌법 협약 [SCOPE.sState('ve_evt_target_state').GetName] 이제 두 개의 겹치는 행정부에 의존합니다. 중앙정부 관계자 및 대표 [SCOPE.sCulture('ve_evt_target_culture').GetName] 국가의 관료제가 고갈되는 동안 커뮤니티 중복 등록, 분쟁 임명 및 모순된 지침을 발행합니다."
 ve_cul_evt.101.f:0 "\\"두 사무실은 파일 캐비닛을 공유하는 것보다 더 쉽게 권한을 공유할 수 있습니다.\\""
 ve_cul_evt.101.a:0 "공동 행정 직원에 자금을 조달합니다."
 ve_cul_evt.101.a.tt:0 "지출 #N 15#! 문화 명령.\n문화 프로젝트 진행률은 #P 6#!만큼 증가합니다."
 ve_cul_evt.101.b:0 "오피스가 동의할 때까지 압축 속도를 늦춥니다."
 ve_cul_evt.101.b.tt:0 "문화 프로젝트 진행률이 감소합니다. 으로 #N 6#!.\n국민 결속력은  #P 2#! 증가합니다."
 ve_cul_evt.101.c:0 "공무원 직위를 통합합니다."
 ve_cul_evt.101.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률은  #P 5#! 증가합니다.\n국민 결속력은  #P 2#! 증가합니다."

 ve_cul_evt.150.t:0 "지방에서의 구현"
 ve_cul_evt.150.d:0 "지방정부는 전국적인 문화사업이 전혀 다른 속도로 진행되고 있다고 보고하고 있다. 일부 사무실에서는 자금 지원 실행 수수료를 요구하는 반면, 다른 사무실에서는 모든 지역에 단일 시간표를 강요하면 인력이 부족하고 대중의 신뢰가 약화될 것이라고 경고합니다."
 ve_cul_evt.150.f:0 "\\"국가 법령은 한 번 작성되지만 국가의 모든 사무실에서 실행되어야 합니다.\\""
 ve_cul_evt.150.a:0 "실행 수수료에 자금을 조달하세요."
 ve_cul_evt.150.a.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률이  #P 5#! 증가합니다."
 ve_cul_evt.150.b:0 "점진적 시간표를 사용합니다."
 ve_cul_evt.150.b.tt:0 "문화 프로젝트 진행률이  #N 4 감소합니다.#!.\n국민 결속력은 #P 2#! 증가합니다."
 ve_cul_evt.150.c:0 "기존 행정을 표준화합니다."
 ve_cul_evt.150.c.tt:0 "지출 #N 5#! 문화 명령.\n문화 프로젝트 진행률은 #P 3#! 증가합니다.\n국민 결속력은 #P 2#! 증가합니다."

 ve_cul_evt.151.t:0 "교육 언어"
 ve_cul_evt.151.d:0 "국가 커리큘럼은 공통 언어 교육을 요구하지만, 전국의 학교는 매우 다른 언어 전통을 지닌 공동체에 봉사하고 있습니다. 다국어 자료는 신뢰를 유지하지만 배포를 지연시킬 수 있으며, 단일 커리큘럼은 교육을 문화적 경연으로 만들 위험을 무릅쓰고 교실에 빠르게 도달할 수 있습니다."
 ve_cul_evt.151.f:0 "\\"학생이 신뢰하지 않는 언어로 가르친 수업은 과목을 제외한 모든 것에 대해 기억될 수 있습니다.\\""
 ve_cul_evt.151.a:0 "금융 다국어 자료."
 ve_cul_evt.151.a.tt:0 "소비 #N 10#! 문화 명령.\n문화 프로젝트 진행률이  #P 3#! 증가합니다.\n국가 결속력이  #P 3#! 증가합니다."
 ve_cul_evt.151.b:0 "하나의 국가 커리큘럼을 적용합니다."
 ve_cul_evt.151.b.tt:0 "문화 프로젝트 진행률  #P 6#! 증가.\n국가 결속력  #N 3#! 감소."
 ve_cul_evt.151.c:0 "교육 및 복지 네트워크 통합."
 ve_cul_evt.151.c.tt:0 "지출 #N 10#! 문화 명령.\n문화 프로젝트 진행률  #P 5#! 증가.\n국가 결속력  #P 2 증가#!."

 ve_cul_evt.160.t:0 "누가 국가를 대표하는가?"
 ve_cul_evt.160.d:0 "공유 기호 프로젝트는 누구의 역사, 유니폼, 기념물, 의식이 국가 전체를 대표할 수 있는지에 대한 질문을 다시 열었습니다. 전통을 순환시키면 인식은 넓어지지만 동의는 느려질 것입니다. 하나의 공식적인 서술을 선택하면 많은 시민이 그 밖에 남아있게 되면서 명확성이 생길 것입니다."
 ve_cul_evt.160.f:0 "\\"상징은 시민들이 설명이 필요 없이 그 안에서 자신을 볼 때에만 국가적인 것이 됩니다.\\""
 ve_cul_evt.160.a:0 "공용으로 사용되는 상징을 회전시키십시오."
 ve_cul_evt.160.a.tt:0 "문화 프로젝트 진행률은 #N 3#!만큼 감소합니다.\n국가적 결속력은 #P 4#!만큼 증가합니다."
 ve_cul_evt.160.b:0 "공식 서술 하나를 선택하십시오."
