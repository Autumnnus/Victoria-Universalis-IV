l_korean:
 ve_je_doctrine_journey_industrialist:0 "공장 시스템 표준화"
 ve_je_doctrine_journey_industrialist_reason:0 "산업 교리는 개별 공장을 넘어 확산되었습니다. 제조업체, 검사관 및 관리자는 이제 지역 관행을 내구성 있는 국가 시스템으로 전환해야 합니다."
 ve_je_doctrine_journey_industrialist_status_both:0 "진전: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 개월#!\n월별 진행 상황: #P +2#!\n\n#P 제조 규모 충족#!: 최소한  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! 제조 건물 수준.\n#P 안정적인 관리 충족#!: 부정적이지 않은 관료주의, 부족 현상이 거의 발생하지 않고 국가 혼란이 15% 미만입니다.\n\n성공 보상:  #P +40 국가 통찰력#!. 진행률이 60개월 이내에 60에 도달하지 않으면 보상 없이 여정이 종료됩니다."
 ve_je_doctrine_journey_industrialist_status_core:0 "진행률: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 개월#!\n월별 진행률: #P +1#!\n\n#P 제조 규모 충족됨#!: 최소 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! 제조 건물 수준.\n#N 안정적인 관리가 이루어지지 않았습니다.#!: 부정적인 관료주의가 필요하지 않고, 부족 현상이 거의 없으며, 국가 혼란이 15% 미만이어야 합니다.\n\n성공 보상:  #P +40 국가 통찰력#!. 진행도가 60개월 이내에 60에 도달하지 않으면 보상 없이 여정이 종료됩니다."
 ve_je_doctrine_journey_industrialist_status_support:0 "진행률: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 개월#!\n월간 진행률: #P +1#!\n\n#N 제조 규모가 충족되지 않음#!: 최소 필요 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! 제조 건물 수준입니다.\n#P 안정적인 행정이 만났습니다#!: 부정적이지 않은 관료주의, 부족 현상이 거의 발생하지 않고 국가 혼란이 15% 미만입니다.\n\n성공 보상: #P +40 국가 통찰력#!. 진행도가 60개월 이내에 60에 도달하지 않으면 보상 없이 여정이 종료됩니다."
 ve_je_doctrine_journey_industrialist_status_neither:0 "진행: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 개월#!\n월간 진행률: #N 0#!\n\n#N 제조 규모가 충족되지 않음#!: 최소한  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! 제조 건물 수준이 필요합니다.\n#N 안정적인 행정이 충족되지 않음#!: 부정적인 관료주의가 필요하지 않고, 부족 현상이 거의 없으며, 국가 혼란이 15% 미만이어야 합니다.\n\n성공 보상:  #P +40 국가 통찰력#!. 60개월 이내에 진행률이 60에 도달하지 못하면 보상 없이 여정이 종료됩니다."
 ve_je_doctrine_journey_academic:0 "학자 공화국"
 ve_je_doctrine_journey_academic_reason:0 "대학과 학식 있는 학회는 해당 기관과 사회적 기반이 이를 유지할 수 있다면 전국적인 탐구 공동체가 될 준비가 되어 있습니다."
 ve_je_doctrine_journey_academic_status_both:0 "진행률: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 개월#!\n월간 진행률: #P +2#!\n\n#P 대학 규모 충족#!: 최소  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! 대학 건물 수준.\n#P 읽기 능력 기초 충족#!: 최소 50% 읽기 쓰기 능력 또는 여정의 시작 값보다 5% 포인트 높음.\n\n성공 보상:  #P +15 시대 모멘텀#!. 진행도가 60개월 이내에 60에 도달하지 않으면 보상 없이 여정이 종료됩니다."
