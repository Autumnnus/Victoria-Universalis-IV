 ve_je_doctrine_journey_professional_army_status_neither:0 "진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0]개월#!\n월간 진척도: #N 0#!\n\n#N 병영 규모 미달#!: 최소 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 단계의 병영 건물 필요.\n#N 전문 교리 미달#!: 전문직업군 법률 또는 참모본부 기술이 필요합니다.\n\n성공 보상: #Y 제도적 참모본부#! (훈련 속도 +7.5%, 36개월). 60개월 내에 진척도 60에 도달하지 못하면 과업은 보상 없이 종료됩니다."
 ve_doctrine_journey_general_staff_reform_mdf:0 "제도적 참모본부"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "참모 대학, 동원 표본, 그리고 공통된 훈련 기준이 군대의 영구적인 일부분으로 자리 잡았습니다."

 ve_doctrine_journey.1.t:0 "공장제 표준화"
 ve_doctrine_journey.1.d:0 "산업 협회들은 기계류, 검사 방식, 그리고 제조 관행을 일치시키기 위한 국가적 노력을 제안합니다. 이 사업은 5년간 지속되며 지속적인 산업 규모와 행정적 안정성을 요구할 것입니다."
 ve_doctrine_journey.1.a:0 "표준화 노력을 시작합니다."
 ve_doctrine_journey.1.b:0 "5년 뒤에 제안을 다시 검토합니다."
 ve_doctrine_journey.1.c:0 "우리 공장에는 국가 교리가 필요하지 않습니다."
 ve_doctrine_journey.2.t:0 "학자의 공화국"
 ve_doctrine_journey.2.d:0 "학장들과 학술 협회들은 대학들을 지속 가능한 국가적 연구 공동체로 연결하기 위한 5개년 노력을 제안합니다. 그 성공은 학술 역량과 식자율의 확산 모두에 달려 있을 것입니다."
 ve_doctrine_journey.2.a:0 "학자의 공화국을 후원한다."
 ve_doctrine_journey.2.b:0 "5년 뒤에 제안으로 돌아온다."
 ve_doctrine_journey.2.c:0 "학문은 지역별로 조직되어야 한다."
 ve_doctrine_journey.3.t:0 "참모본부 개혁"
 ve_doctrine_journey.3.d:0 "고위 장교단은 훈련, 계획, 동원에 대한 5년 간의 개혁을 제안합니다. 참모본부는 전문 교리가 선호하는 지휘관들의 울타리를 넘어 살아남을 수 있음을 증명해야 할 것입니다."
 ve_doctrine_journey.3.a:0 "참모본부 개혁을 위임한다."
 ve_doctrine_journey.3.b:0 "5년 뒤에 계획을 다시 검토한다."
 ve_doctrine_journey.3.c:0 "기존의 지휘 체계로 충분하다."

 ve_doctrine_journey_start_tt:0 "5년 간의 이 교리 과업을 시작합니다. 한 번에 하나의 교리 과업만 활성화할 수 있습니다."
 ve_doctrine_journey_defer_tt:0 "이 집단의 제안을 #Y 5년#! 동안 보류합니다. 이후에 다시 제안될 수 있습니다."
 ve_doctrine_journey_decline_tt:0 "이 집단의 교리 과업을 영구적으로 거절합니다."

 ve_doctrine_journey.10.t:0 "척도와 공차"
 ve_doctrine_journey.10.d:0 "공장들이 서로 호환되지 않는 치수와 부품, 공차를 사용하고 있습니다. 공학자들은 국가가 단일 규격을 도입할 것을 촉구하는 한편, 지방의 제조업자들은 엄격한 표준이 유용한 지역 관행을 해칠 수 있다고 경고합니다."
 ve_doctrine_journey.10.a:0 "국가 표준 목록에 자금을 지원합니다."
 ve_doctrine_journey.10.a.tt:0 "#N 15#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
 ve_doctrine_journey.10.b:0 "호환 가능한 지역별 표준을 허용합니다."
 ve_doctrine_journey.10.b.tt:0 "즉각적인 자원 소모나 진척도 변화 없이 여정이 계속됩니다."
 ve_doctrine_journey.10.c:0 "건설청을 동원해 도입을 조율합니다."
 ve_doctrine_journey.10.c.tt:0 "산업가 이념 V 필요.\n#N 10#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
 ve_doctrine_journey.11.t:0 "국가 검사청"
 ve_doctrine_journey.11.d:0 "이제 최초의 공통 표준에 대한 집행이 필요합니다. 관료들은 중앙 검사청의 설립을 제안하고, 제조업자들은 자율 인증을 선호하며, 숙련된 산업 기획자들은 양쪽 모두에 대한 감사를 주장합니다."
 ve_doctrine_journey.11.a:0 "중앙 산업 검사청을 설립합니다."
 ve_doctrine_journey.11.a.tt:0 "#N 15#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
 ve_doctrine_journey.11.b:0 "산업계의 자체 인증을 승인합니다."
 ve_doctrine_journey.11.b.tt:0 "즉각적인 자원 소모나 진척도 변화 없이 여정이 계속됩니다."
 ve_doctrine_journey.11.c:0 "단일 체계를 통해 검사원과 제조업자를 함께 감사합니다."
 ve_doctrine_journey.11.c.tt:0 "산업가 이념 VII 필요.\n#N 10#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."

 ve_doctrine_journey.20.t:0 "공석인 석좌"
 ve_doctrine_journey.20.d:0 "대학들은 새로운 석좌가 지역 학부, 국가적 우선순위, 혹은 공공 교육 직권 중 어디에 책임을 져야 하는지를 두고 의견이 갈립니다. 최초의 임용은 학술망이 인력과 이념을 얼마나 자유롭게 교류시킬지 결정할 것입니다."
 ve_doctrine_journey.20.a:0 "조율된 국가 석좌 프로그램에 자금을 지원합니다."
 ve_doctrine_journey.20.a.tt:0 "#N 15#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
 ve_doctrine_journey.20.b:0 "각 학부가 자체적으로 석좌를 정의하도록 둡니다."
 ve_doctrine_journey.20.b.tt:0 "즉각적인 자원 소모나 진척도 변화 없이 여정이 계속됩니다."
 ve_doctrine_journey.20.c:0 "석좌를 공공 강연망에 연계합니다."
 ve_doctrine_journey.20.c.tt:0 "학술 이념 V 필요.\n#N 10#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
 ve_doctrine_journey.21.t:0 "평가의 공화국"
 ve_doctrine_journey.21.d:0 "연구는 이제 구시대의 후원 체계가 평가할 수 있는 것보다 더 빠르게 기관들 사이를 오가고 있습니다. 학자들은 국가 차원의 동료평가를 제안하는 반면, 기성 아카데미들은 선별적 초청과 학문적 독립성을 옹호합니다."
 ve_doctrine_journey.21.a:0 "국가 동료평가 제도를 재정 지원합니다."
 ve_doctrine_journey.21.a.tt:0 "#N 15#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
 ve_doctrine_journey.21.b:0 "평가를 학술 협회들에 맡깁니다."
 ve_doctrine_journey.21.b.tt:0 "즉각적인 자원 소모나 진척도 변화 없이 여정이 계속됩니다."
 ve_doctrine_journey.21.c:0 "학제 간 평가 위원회를 소집합니다."
 ve_doctrine_journey.21.c.tt:0 "학술 이념 VII 필요.\n#N 10#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."

 ve_doctrine_journey.30.t:0 "참모대학"
 ve_doctrine_journey.30.d:0 "새로운 참모대학은 지휘관에게 무엇이 자격을 부여하는지 결정해야 합니다. 개혁가들은 시험과 공통 교육을 요구하고, 기성 지휘관들은 연공서열과 야전 복무에서 얻은 식견을 옹호합니다."
 ve_doctrine_journey.30.a:0 "국가 시험과 공통 교육과정에 자금을 지원합니다."
 ve_doctrine_journey.30.a.tt:0 "#N 15#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
 ve_doctrine_journey.30.b:0 "연공서열과 대학의 권고안 사이의 균형을 맞춥니다."
 ve_doctrine_journey.30.b.tt:0 "즉각적인 자원 소모나 진척도 변화 없이 여정이 계속됩니다."
 ve_doctrine_journey.30.c:0 "야전 장교들을 참모대학 강의실에 순환 근무시킵니다."
 ve_doctrine_journey.30.c.tt:0 "상비군 이념 V 필요.\n#N 10#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
 ve_doctrine_journey.31.t:0 "동원표"
 ve_doctrine_journey.31.d:0 "계획가들이 병력, 보급, 철도 운송을 위한 상충되는 일정표들을 작성했습니다. 단일한 국가 차원의 표는 조율을 약속하지만, 지역 지휘부는 경직된 시간표가 지역의 역량을 무시할 것이라 경고합니다."
 ve_doctrine_journey.31.a:0 "중앙 동원국에 자금을 지원한다."
 ve_doctrine_journey.31.a.tt:0 "#N 15#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
 ve_doctrine_journey.31.b:0 "지역 지휘부가 호환 가능한 일정을 유지하도록 둔다."
 ve_doctrine_journey.31.b.tt:0 "즉각적인 자원이나 진척도 변화 없이 여정이 계속됩니다."
 ve_doctrine_journey.31.c:0 "철로, 보급창, 지휘 계획을 통합한다."
 ve_doctrine_journey.31.c.tt:0 "전문직업군 이념 VII이 필요합니다.\n#N 10#!의 국가식견을 소모합니다.\n여정 진척도가 #P 4#! 증가합니다."
