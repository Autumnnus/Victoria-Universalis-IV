 ve_je_doctrine_journey_professional_army_status_neither:0 "진행률: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 개월#!\n월간 진행률: #N 0#!\n\n#N 병영 규모가 충족되지 않음#!: 최소한  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 병영 건물 수준이 필요합니다.\n#N 전문 교리가 충족되지 않음#!: 전문 육군법 또는 일반 참모 기술이 필요합니다.\n\n성공 보상:  #Y 기관 일반 참모#! (+7.5% 훈련 비율, 36개월). 60개월 이내에 진행도가 60에 도달하지 않으면 여정은 보상 없이 종료됩니다."
 ve_doctrine_journey_general_staff_reform_mdf:0 "기관 일반 직원"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "참모 대학, 동원대, 공통 훈련 표준은 군대의 내구성 있는 일부가 되었습니다. "

 ve_doctrine_journey.1.t:0 "공장 시스템 표준화"
 ve_doctrine_journey.1.d:0 "산업 협회는 기계, 검사 및 제조 관행을 일치시키기 위한 국가적 노력을 제안합니다. 이 사업은 5년 동안 지속되며 지속적인 산업 규모와 행정적 안정성을 요구합니다."
 ve_doctrine_journey.1.a:0 "표준화 노력을 시작하십시오."
 ve_doctrine_journey.1.b:0 "5년 후에 제안을 재고해 보세요."
 ve_doctrine_journey.1.c:0 "우리 공장에는 국가적 교리가 필요하지 않습니다."
 ve_doctrine_journey.2.t:0 "학자들의 공화국"
 ve_doctrine_journey.2.d:0 "총장과 학계에서는 대학을 지속 가능한 국가 연구 커뮤니티로 연결하기 위한 5년 간의 노력을 제안합니다. 그 성공 여부는 학문적 역량과 읽고 쓰는 능력의 확산에 달려 있습니다."
 ve_doctrine_journey.2.a:0 "학자공화국을 후원하라. "
 ve_doctrine_journey.2.b:0 "5년 안에 제안으로 돌아가라."
 ve_doctrine_journey.2.c:0 "학습은 지역적으로 조직화되어야 합니다."
 ve_doctrine_journey.3.t:0 "총참모부를 개편하다"
 ve_doctrine_journey.3.d:0 "고위 장교들은 훈련, 계획, 동원에 대한 5개년 개혁을 제안했습니다. 참모진은 전문적인 교리가 선호하는 사령관의 범위를 넘어서도 살아남을 수 있다는 것을 증명해야 할 것입니다."
 ve_doctrine_journey.3.a:0 "일반 직원 개혁을 의뢰하십시오."
 ve_doctrine_journey.3.b:0 "5년 뒤에 다시 계획을 재검토하라. "
 ve_doctrine_journey.3.c:0 "기존 지휘체계로도 충분하다."

 ve_doctrine_journey_start_tt:0 "5년간의 교리 여행을 시작합니다. 한 번에 하나의 교리 여행만 활성화할 수 있습니다."
 ve_doctrine_journey_defer_tt:0 "이 그룹의 제안을 다음으로 연기합니다. #Y 5년#!. 나중에 다시 제안될 수 있습니다."
 ve_doctrine_journey_decline_tt:0 "이 그룹의 교리 여행을 영구적으로 거부합니다."

 ve_doctrine_journey.10.t:0 "측정 및 공차"
 ve_doctrine_journey.10.d:0 "공장에서는 호환되지 않는 게이지, 피팅 및 공차를 사용합니다. 엔지니어들은 주정부에 하나의 카탈로그를 부과할 것을 촉구하는 반면, 지방 제조업체들은 엄격한 표준이 유용한 지역 관행을 동결시킬 수 있다고 경고합니다. "
 ve_doctrine_journey.10.a:0 "국가 표준 카탈로그에 자금을 지원하세요."
 ve_doctrine_journey.10.a.tt:0 "지출 #N 15#! National Insight.\n여정 진행 상황은  #P 4#!만큼 증가합니다."
 ve_doctrine_journey.10.b:0 "호환되는 지역 표준을 허용합니다."
 ve_doctrine_journey.10.b.tt:0 "여정은 즉각적인 리소스나 진행 상황 변경 없이 계속됩니다."
 ve_doctrine_journey.10.c:0 "건설 사무소를 활용하여 채택을 조정하세요."
 ve_doctrine_journey.10.c.tt:0 "산업주의 아이디어 V가 필요합니다.\n지출 #N 10#! National Insight.\n여정 진행 상황이  #P 4#! 증가합니다."
 ve_doctrine_journey.11.t:0 "국가 검사관"
 ve_doctrine_journey.11.d:0 "첫 번째 공통 표준은 이제 시행을 요구합니다. 공무원은 중앙 감사관을 제안하고, 제조업체는 자체 인증을 선호하며, 경험이 풍부한 산업 기획자는 두 가지 모두 감사를 주장합니다."
 ve_doctrine_journey.11.a:0 "중앙산업감독관을 설치하라."
 ve_doctrine_journey.11.a.tt:0 "지출 #N 15#! National Insight.\n여정 진행 상황이  #P 4#! 증가합니다."
 ve_doctrine_journey.11.b:0 "업계 자체 인증을 인식합니다."
 ve_doctrine_journey.11.b.tt:0 "즉각적인 리소스나 진행 상황 변경 없이 여정이 계속됩니다."
 ve_doctrine_journey.11.c:0 "하나의 시스템을 통해 검사관과 제조업체를 감사합니다."
 ve_doctrine_journey.11.c.tt:0 "산업가 아이디어 VII이 필요합니다.\n소비 #N 10#! National Insight.\n여정 진행 상황이  #P 4#! 증가합니다."

 ve_doctrine_journey.20.t:0 "오픈 의자"
 ve_doctrine_journey.20.d:0 "대학들은 새로운 위원장이 지역 교수진, 국가 우선 순위 또는 공공 교육 의무에 응답해야 하는지 여부에 대해 의견이 일치하지 않습니다. 첫 번째 임명은 학술 네트워크가 사람과 아이디어를 얼마나 자유롭게 교환하는지 정의합니다."
 ve_doctrine_journey.20.a:0 "조정된 전국 의장 프로그램에 자금을 지원합니다."
 ve_doctrine_journey.20.a.tt:0 "경비 #N 15#! 국가적 통찰력.\n여행 진행 상황이 다음과 같이 증가합니다. #P 4#!."
 ve_doctrine_journey.20.b:0 "각 교수진이 자신의 의자를 정의하도록 합니다."
 ve_doctrine_journey.20.b.tt:0 "여행은 즉각적인 자원이나 진행 변경 없이 계속됩니다."
 ve_doctrine_journey.20.c:0 "의자를 공개 강의 네트워크에 연결합니다."
 ve_doctrine_journey.20.c.tt:0 "학문적 아이디어 V가 필요합니다.\n지출 #N 10#! National Insight.\n여정 진행 상황이  #P 4#! 증가합니다."
 ve_doctrine_journey.21.t:0 "심판의 공화국"
 ve_doctrine_journey.21.d:0 "이제 연구는 기존 후원자들이 판단할 수 있는 것보다 더 빠르게 기관 간에 이동합니다. 학자들은 전국적인 동료 평가를 제안하는 반면, 기존 아카데미는 선택적 초대와 징계 독립성을 옹호합니다."
 ve_doctrine_journey.21.a:0 "전국 동료 검토 서비스에 자금을 지원합니다."
 ve_doctrine_journey.21.a.tt:0 "지출 #N 15#! National Insight.\n여정 진행 상황이  #P 4#!만큼 증가합니다."
 ve_doctrine_journey.21.b:0 "검토는 학식 있는 학회에 맡기십시오."
 ve_doctrine_journey.21.b.tt:0 "여정은 즉각적인 자원이나 진행 상황 변경 없이 계속됩니다."
 ve_doctrine_journey.21.c:0 "학제 간 검토 협의회를 소집합니다."
 ve_doctrine_journey.21.c.tt:0 "학문적 아이디어 VII이 필요합니다.\n소비 #N 10#! National Insight.\n여정 진행 상황이  #P 4#! 증가합니다."

 ve_doctrine_journey.30.t:0 "스태프 칼리지"
 ve_doctrine_journey.30.d:0 "새로운 참모 대학은 장교가 지휘에 적합한지 결정해야 합니다. 개혁자들은 시험과 공동 교육을 요구하는 반면, 기성 지휘관들은 직위와 현장 복무에서 얻은 판단력을 옹호합니다."
 ve_doctrine_journey.30.a:0 "국가 시험과 공통 커리큘럼에 자금을 지원합니다."
 ve_doctrine_journey.30.a.tt:0 "경비 #N 15#! 국가적 통찰력.\n여행 진행 상황이 다음과 같이 증가합니다. #P 4#!."
 ve_doctrine_journey.30.b:0 "대학 추천과 연공 서열의 균형을 맞춥니다."
 ve_doctrine_journey.30.b.tt:0 "여행은 즉각적인 자원이나 진행 상황 변경 없이 계속됩니다."
 ve_doctrine_journey.30.c:0 "현장 장교를 교직원 강의실로 순환시킵니다."
 ve_doctrine_journey.30.c.tt:0 "전문 육군 아이디어 V가 필요합니다.\n소비  #N 10#! 국가적 통찰력.\n여행 진행 상황이  #P 4#!만큼 증가합니다."
 ve_doctrine_journey.31.t:0 "동원 테이블"
 ve_doctrine_journey.31.d:0 "기획자는 인력, 보급품 및 철도 운송에 대한 경쟁 일정을 작성했습니다. 단일 국가 테이블은 조정을 약속하지만 지역 사령부는 엄격한 시간표가 지역 역량을 무시할 것이라고 경고합니다."
 ve_doctrine_journey.31.a:0 "중앙 동원국에 자금을 조달합니다."
 ve_doctrine_journey.31.a.tt:0 "지출 #N 15#! National Insight.\n여행 진행 상황이  #P 4#! 증가합니다."
 ve_doctrine_journey.31.b:0 "지역 사령부가 호환 가능한 일정을 유지하도록 합니다."
 ve_doctrine_journey.31.b.tt:0 "즉각적인 자원이나 진행 변경 없이 여정이 계속됩니다."
 ve_doctrine_journey.31.c:0 "철도, 기지 및 명령 계획을 통합합니다."
 ve_doctrine_journey.31.c.tt:0 "전문 육군 아이디어 VII가 필요합니다.\n지출 #N 10#! National Insight.\n여행 진행 상황이  #P 4#! 증가합니다."
