 ve_je_doctrine_journey_professional_army:0 "참모본부 개혁"
 ve_je_doctrine_journey_professional_army_reason:0 "유능한 장교단은 병영과 임명장 그 이상을 요구합니다. 훈련, 계획, 그리고 동원이 하나의 지속 가능한 참모 체계로 조직되어야 합니다."
 ve_je_doctrine_journey_professional_army_status_both:0 "진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0]개월#!\n월간 진척도: #P +2#!\n\n#P 병영 규모 충족#!: 최소 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 단계의 병영 건물.\n#P 전문 교리 충족#!: 전문직업군 법률 또는 참모본부 기술.\n\n성공 보상: #Y 제도적 참모본부#! (훈련 속도 +7.5%, 36개월). 60개월 내에 진척도 60에 도달하지 못하면 과업은 보상 없이 종료됩니다."
