l_korean:
 ve_je_doctrine_journey_industrialist:0 "공장제 표준화"
 ve_je_doctrine_journey_industrialist_reason:0 "산업 교리가 개별 공장들의 범위를 넘어 확산되었습니다. 이제 제조업자, 감독관, 행정관들은 지역의 관행을 지속 가능한 국가적 체제로 발전시켜야 합니다."
 ve_je_doctrine_journey_industrialist_status_both:0 "진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0]개월#!\n월간 진척도: #P +2#!\n\n#P 제조업 규모 충족됨#!: 제조업 건물 단계 #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! 이상.\n#P 안정적인 행정 충족됨#!: 0 이상의 행정력, 임박한 품귀 현상 부재, 그리고 국가 갈등 15% 미만.\n\n성공 보상: #P 국가식견 +40#!. 60개월 내에 진척도가 60에 도달하지 못하면, 이 여정은 보상 없이 종료됩니다."
