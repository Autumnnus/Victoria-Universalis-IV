 ve_je_doctrine_journey_professional_army:0 "참모부 개혁"
 ve_je_doctrine_journey_professional_army_reason:0 "전문 장교단에는 병영과 커미션 이상의 것이 필요합니다. 훈련, 계획 및 동원은 하나의 내구성 있는 참모 시스템으로 구성되어야 합니다."
 ve_je_doctrine_journey_professional_army_status_both:0 "진행률: #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] 개월#!\n월별 진행률: #P +2#!\n\n#P 병영 규모 충족#!: 최소  #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! 병영 건물 수준.\n#P 전문 교리 충족됨#!: 전문 육군 법률 또는 일반 참모 기술.\n\n성공 보상: #Y 기관 일반 직원#! (+7.5% 교육 비율, 36개월). 진행률이 60개월 이내에 60에 도달하지 않으면 여정은 보상 없이 종료됩니다."
