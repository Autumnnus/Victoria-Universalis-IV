 # events/Economic_Idea.txt and events/InnovativeIdeaGroupEvents.txt reference
 # only this one key set for all of their events, so the text is deliberately
 # neutral: an event in either file may grant a positive or a negative modifier.
 # Give each event its own keys when they are wired to an on_action.
 economic_flavor.1.t:0 "경제적 발전"
 economic_flavor.1.desc:0 "우리의 경제 교리가 각 부처가 계획하지 못한 방식으로 결실을 맺고 있습니다. 앞으로 어떤 일이 있든, 그 영향은 수년 동안 경제 전반에 체감될 것입니다."
 economic_flavor.1.a:0 "그렇게 하도록 하라"
 innovative_flavor.1.t:0 "교리의 전환"
 innovative_flavor.1.desc:0 "우리가 수용한 사상은 우리의 기관들이 작동하는 방식과, 세계의 다른 국가들이 우리를 평가하는 방식을 재정립하고 있습니다."
 innovative_flavor.1.a:0 "좋다"

