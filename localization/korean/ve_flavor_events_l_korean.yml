 # events/Economic_Idea.txt and events/InnovativeIdeaGroupEvents.txt reference
 # only this one key set for all of their events, so the text is deliberately
 # neutral: an event in either file may grant a positive or a negative modifier.
 # Give each event its own keys when they are wired to an on_action.
 economic_flavor.1.t:0 "경제 발전"
 economic_flavor.1.desc:0 "우리의 경제 교리는 부처가 계획하지 않은 방식으로 열매를 맺고 있습니다. 어떤 결과가 나오든 그 효과는 수년간 경제 전반에 걸쳐 느껴질 것입니다."
 economic_flavor.1.a:0 "그렇게 하십시오"
 innovative_flavor.1.t:0 "교리의 변화"
 innovative_flavor.1.desc:0 "우리가 받아들인 아이디어는 우리 기관이 작동하는 방식과 전 세계가 우리를 판단하는 방식을 바꾸고 있습니다."
 innovative_flavor.1.a:0 "좋아요"

