l_korean:
 ve_doctrine_ambient_cooldown_mdf:0 "교리 토론 쿨다운"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "국가의 기관들은 최근 교리 논쟁의 결과를 흡수하고 있습니다."
 ve_doctrine_ambient_ig_supported_mdf:0 "제도적 지원"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "정부는 이 이익 집단에 교리 논쟁을 해결하는 데 가시적인 역할을 부여했습니다."
 ve_doctrine_ambient_ig_slighted_mdf:0 "제도적 경시"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "정부는 최근 교리 합의에서 이 이익 그룹을 제외했습니다. "

 ve_doctrine_industrialist_positive_mdf:0 "표준화된 산업 관행 "
 ve_doctrine_industrialist_positive_mdf_desc:0 "제조업체는 산업 관행의 조정된 기관으로부터 혜택을 받고 있습니다. "
 ve_doctrine_industrialist_negative_mdf:0 "산업 병목 현상 "
 ve_doctrine_industrialist_negative_mdf_desc:0 "해결되지 않은 조정 실패는 제조를 제약하고 있습니다."
 ve_doctrine_academic_positive_mdf:0 "조정된 연구 네트워크"
 ve_doctrine_academic_positive_mdf_desc:0 "대학은 조정된 네트워크를 통해 방법, 인력, 결과를 공유하고 있습니다."
 ve_doctrine_academic_negative_mdf:0 "학업 병목 현상"
 ve_doctrine_academic_negative_mdf_desc:0 "학위 및 조정 분쟁이 대학을 혼란에 빠뜨리고 있습니다."
 ve_doctrine_nationalist_positive_mdf:0 "전국 협회 네트워크"
 ve_doctrine_nationalist_positive_mdf_desc:0 "국가 협회는 합법적인 정부를 보다 폭넓은 충성심으로 전환하고 있습니다. "
 ve_doctrine_nationalist_negative_mdf:0 "경쟁하는 국가 사회 "
 ve_doctrine_nationalist_negative_mdf_desc:0 "경쟁적인 국가 조직은 정치적 정당성을 새로운 불만으로 바꾸고 있습니다. "
 ve_doctrine_reformist_positive_mdf:0 "조직화된 개혁 네트워크"
 ve_doctrine_reformist_positive_mdf_desc:0 "정치 운동은 참여와 타협을 위한 질서 있는 채널을 확보했습니다."
 ve_doctrine_reformist_negative_mdf:0 "분열된 개혁 연합"
 ve_doctrine_reformist_negative_mdf_desc:0 "경쟁하는 개혁 조직은 정치적 동원을 급진주의로 전환하고 있습니다."
 ve_doctrine_professional_army_positive_mdf:0 "직원 훈련 주기"
 ve_doctrine_professional_army_positive_mdf_desc:0 "조정된 참모 프로그램은 군대의 훈련 시스템을 개선하고 있습니다."
 ve_doctrine_professional_army_negative_mdf:0 "장교 병목 현상"
 ve_doctrine_professional_army_negative_mdf_desc:0 "진급 및 인력 배치 분쟁으로 군사 훈련이 지연되고 있습니다."
 ve_doctrine_agrarian_positive_mdf:0 "조정된 농업 관행"
 ve_doctrine_agrarian_positive_mdf_desc:0 "농촌 기관은 농업 경제 전반에 신뢰할 수 있는 방법을 확산시키고 있습니다."
 ve_doctrine_agrarian_negative_mdf:0 "농업 공급 부족"
 ve_doctrine_agrarian_negative_mdf_desc:0 "부족 종자, 신용 및 조정으로 인해 농업 생산량이 감소하고 있습니다."

 ve_idea_evt.10.t:0 "최대 출력 시 안전 코드"
 ve_idea_evt.10.d:0 "연이은 공장 사고로 인해 산업 검사 문제가 공개되었습니다. 독립 검사관은 신뢰할 수 있는 표준을 약속하는 반면 제조업체는 자발적 규칙이 생산량과 주도권을 보존할 것이라고 주장합니다."
 ve_idea_evt.10.a:0 "독립 검사관을 임명합니다."
 ve_idea_evt.10.a.tt:0 "지출 #N 25#! 내셔널 인사이트. 노동조합은  #P +1을 얻었습니다.#! 승인과 산업가들은 패배 #N 1#! 24개월 동안 승인됩니다."
 ve_idea_evt.10.b:0 "산업계가 자발적인 코드를 작성하게 하세요."
 ve_idea_evt.10.b.tt:0 "산업가들은 이득을 얻습니다. #P +1#! 승인 및 노동조합 패배 #N 1#! 24개월 동안 승인."
 ve_idea_evt.10.c:0 "단계적으로 규칙을 표준화합니다."
 ve_idea_evt.10.c.tt:0 "소비 #N 10#! National Insight. 관심그룹 승인에는 변화가 없습니다."

 ve_idea_evt.11.t:0 "표준화된 기계 부품"
 ve_idea_evt.11.d:0 "여러 산업 지역의 엔지니어들이 게이지, 부속품 및 기계 부품의 공통 카탈로그를 제작했습니다. 국가 표준에 자금을 지원하는 것은 비용이 많이 들지만 제조 네트워크 전반의 마찰을 제거할 수 있습니다."
 ve_idea_evt.11.a:0 "전국 기준을 채택합니다."
 ve_idea_evt.11.a.tt:0 "지출 #N 40#! National Insight 및 이득 #P +5%#! 36개월 동안 제조 처리량."
 ve_idea_evt.11.b:0 "나중을 위해 결과를 보관합니다."
 ve_idea_evt.11.b.tt:0 "얻다 #P 15#! 내셔널 인사이트."
 ve_idea_evt.11.c:0 "우리의 생산 네트워크는 이미 준비되어 있습니다."
 ve_idea_evt.11.c.tt:0 "지출 #N 20#! National Insight 및 이익  #P +5%#! 36개월 동안의 제조 처리량."

 ve_idea_evt.12.t:0 "작업의 병목 현상"
 ve_idea_evt.12.d:0 "호환되지 않는 절차, 지연된 부품, 혼란스러운 일정으로 인해 국가의 공장이 막히는 동안 주문이 축적되고 있습니다. 정부는 전문가를 파견하거나, 문제를 기업에 맡기거나, 설립된 건설 사무소를 활용하여 대응을 조율할 수 있습니다."
 ve_idea_evt.12.a:0 "전문팀을 파견하세요."
 ve_idea_evt.12.a.tt:0 "지출 #N 25#! 국가적 통찰력과 산업 처벌을 피하십시오."
 ve_idea_evt.12.b:0 "이 문제는 공장이 스스로 해결해야 합니다."
 ve_idea_evt.12.b.tt:0 "24개월 동안  #N -5%#! 제조 처리량을 겪습니다."
 ve_idea_evt.12.c:0 "건설국을 활성화합니다."
 ve_idea_evt.12.c.tt:0 "지출 #N 10#! National Insight 및 산업 처벌을 피하십시오."

 ve_idea_evt.60.t:0 "기계화 및 임기"
 ve_idea_evt.60.d:0 "새로운 기계는 농업 생산량을 늘릴 수 있지만 소작농과 소작농은 급격한 전환으로 인해 농촌 생활이 뿌리째 뽑힐 것을 우려하고 있습니다. 정부는 기계화를 가속화할지, 먼저 소유권을 보호할지, 아니면 점진적인 지역 전환을 조정할지 결정해야 합니다."
 ve_idea_evt.60.a:0 "기계화 기금을 조성합니다."
 ve_idea_evt.60.a.tt:0 "지출 #N 25#! 국가적 통찰력 및 이득 #P +5%#! 24개월 동안의 농업 처리량. 산업가들은 이익을 얻습니다. #P +1#! 승인 및 농촌 주민들의 패배 #N 1#! 24개월 동안 승인."
 ve_idea_evt.60.b:0 "농장을 변경하기 전에 임차인을 확보하십시오."
 ve_idea_evt.60.b.tt:0 "농촌 사람들은  #P +1#! 승인을 얻고 지주는 24개월 동안  #N 1#! 승인을 잃습니다."
 ve_idea_evt.60.c:0 "점진적 전환을 위해 지역 생산 네트워크를 활용하십시오."
 ve_idea_evt.60.c.tt:0 "소비 #N 10#! 국가적 통찰력 및 이득 #P 24개월 동안 +5%#! 농업 처리량. 관심그룹 승인에는 변화가 없습니다."

 ve_idea_evt.61.t:0 "협동 곡물창고"
 ve_idea_evt.61.d:0 "농촌 대표자들은 매장량, 기록, 운송을 공유할 수 있는 협동 곡물 창고 네트워크를 시연했습니다. 국가 프로그램은 농업 조정을 강화할 수 있으며, 단순히 계획을 보존하는 것만으로도 정부의 제도적 지식을 풍부하게 할 수 있습니다."
 ve_idea_evt.61.a:0 "협력 네트워크에 자금을 조달합니다."
 ve_idea_evt.61.a.tt:0 "지출 #N 40#! 국가적 통찰력과 이득 #P 36개월 동안 +5%#! 농업 처리량."
 ve_idea_evt.61.b:0 "기록을 농업 사무소에 배포합니다."
 ve_idea_evt.61.b.tt:0 "이익 #P 15#! 국가적 통찰력."
 ve_idea_evt.61.c:0 "이미 존재하는 농촌 기관을 활용하십시오."
 ve_idea_evt.61.c.tt:0 "지출 #N 20#! 국가적 통찰력과 이득 #P 36개월 동안 +5%#! 농업 처리량."

 ve_idea_evt.62.t:0 "종자 및 신용 부족"
 ve_idea_evt.62.d:0 "부족한 종자 재고와 농촌 신용 경색은 다가오는 농업 주기를 위협합니다. 전문가들이 비상 대응을 조직할 수 있고, 지역 네트워크를 즉석에서 처리하거나, 설립된 생활 기관이 일시적으로 부담을 짊어질 수 있습니다."
 ve_idea_evt.62.a:0 "비상 전문 프로그램을 조직하십시오."
 ve_idea_evt.62.a.tt:0 " #N 25#! National Insight를 소비하고 농업 처벌을 피하세요."
 ve_idea_evt.62.b:0 "로컬 네트워크가 자체 솔루션을 찾도록 하세요."
 ve_idea_evt.62.b.tt:0 "고통 #N -5%#! 24개월 동안 농업 처리량."
 ve_idea_evt.62.c:0 "생계 네트워크를 임시 백본으로 사용합니다."
 ve_idea_evt.62.c.tt:0 "경비 #N 10#! 국가적 통찰력을 갖고 농업 처벌을 피하세요."

 ve_idea_evt.20.t:0 "후원 또는 동료 검토"
 ve_idea_evt.20.d:0 "정부는 연구비 지원을 통해 실질적인 결과를 기대하는 반면, 학자들은 후원이 증거를 정치적 편의로 대체할 것이라고 경고합니다. 항구적인 합의는 누가 국가의 학습을 판단하는지 정의해야 합니다. "
 ve_idea_evt.20.a:0 "독립적인 검토 위원회를 설립하십시오."
 ve_idea_evt.20.a.tt:0 "경비 #N 25#! 국가적 통찰력. 인텔리젠시아 이득 #P +1#! 승인 및 프티부르주아지는 패배 #N 1#! 24개월 동안 승인."
 ve_idea_evt.20.b:0 "국가가 ​​연구 우선순위를 정의하도록 하세요."
 ve_idea_evt.20.b.tt:0 "쁘띠 부르주아지의 이익 #P +1#! 승인 및 인텔리젠시아 패배 #N 1#! 24개월 동안 승인."
 ve_idea_evt.20.c:0 "공통적인 학업 기준을 제도화합니다."
 ve_idea_evt.20.c.tt:0 "경비 #N 10#! 국가적 통찰력. 관심그룹 승인에는 변화가 없습니다."
 ve_idea_evt.21.t:0 "지방 연구 네트워크"
 ve_idea_evt.21.d:0 "지방 대학들은 중앙의 지시 없이 강사, 도구, 연구 결과를 교환하기 시작했습니다. 공식적인 지원을 통해 이러한 즉석 협력을 국가 연구 네트워크로 전환할 수 있습니다."
 ve_idea_evt.21.a:0 "네트워크에 자금을 조달합니다."
 ve_idea_evt.21.a.tt:0 "지출 #N 40#! 국가적 통찰력과 이득 #P 36개월 동안 +5%#! 대학 처리량."
 ve_idea_evt.21.b:0 "보고서를 중앙 아카이브에 보관합니다."
 ve_idea_evt.21.b.tt:0 "얻다 #P 15#! 내셔널 인사이트."
 ve_idea_evt.21.c:0 "국립아카데미와 연결하세요."
 ve_idea_evt.21.c.tt:0 "Spend #N 20#! National Insight 및 이익  #P +5%#! 36개월 동안의 대학 처리량."
 ve_idea_evt.22.t:0 "자격 증명 병목 현상"
 ve_idea_evt.22.d:0 "대학에서는 증가하는 학생 수, 강사 및 새로운 학문을 충분히 신속하게 평가할 수 없습니다. 지연된 자격 증명은 이제 더 넓은 연구 시스템을 위협합니다."
 ve_idea_evt.22.a:0 "평가 역량을 확대합니다."
 ve_idea_evt.22.a.tt:0 "지출 #N 25#! National Insight 및 학문적 처벌을 피하십시오."
 ve_idea_evt.22.b:0 "기존 기관이 대처해야합니다."
 ve_idea_evt.22.b.tt:0 "고통 #N -5%#! 24개월 동안 대학 처리량."
 ve_idea_evt.22.c:0 "학교 네트워크를 통해 표준화합니다."
 ve_idea_evt.22.c.tt:0 "경비 #N 10#! 국가적 통찰력을 갖고 학문적 처벌을 피하십시오."

 ve_idea_evt.30.t:0 "하나의 정경, 많은 전통"
 ve_idea_evt.30.d:0 "국가적 표준을 준비하는 관리들은 지방 관습의 위치에 대해 의견이 일치하지 않습니다. 단일한 설명은 명확성을 보장하지만 지역 전통을 배제하면 그것이 정의하려는 국가 자체가 약화될 수 있습니다. "
 ve_idea_evt.30.a:0 "지역 전통을 공통 이야기에 엮습니다."
 ve_idea_evt.30.a.tt:0 "경비 #N 25#! 국가적 통찰력. 농촌 사람들의 이득 #P +1#! 승인 및 프티부르주아지는 패배 #N 1#! 24개월 동안 승인."
 ve_idea_evt.30.b:0 "하나의 공식 캐논을 선포합니다."
 ve_idea_evt.30.b.tt:0 "쁘띠 부르주아지의 이득 #P +1#! 승인 및 농촌 주민들은 24개월 동안  #N 1#! 승인을 잃습니다."
 ve_idea_evt.30.c:0 "훈련된 문화 간부에게 작업을 위탁하십시오."
 ve_idea_evt.30.c.tt:0 "지출 #N 10#! 국가적 통찰력. 이익 단체 승인 변경 없음."
 ve_idea_evt.31.t:0 "재향군인 전국 협회"
 ve_idea_evt.31.d:0 "퇴역 군인들은 의식, 상호 지원, 국가에 대한 충성을 연결하는 협회를 조직했습니다. 그들의 네트워크는 전국적으로 확장되거나 공식적인 역할을 부여하지 않고도 연구될 수 있습니다. "
 ve_idea_evt.31.a:0 "전국적인 협회를 지원하십시오."
 ve_idea_evt.31.a.tt:0 "지출 #N 40#! 국가적 통찰력 및 36개월 동안 합법성으로부터의 충성주의자  #P +5%#! 를 얻습니다."
 ve_idea_evt.31.b:0 "국가 기록 보관소에 그들의 경험을 기록하십시오."
 ve_idea_evt.31.b.tt:0 "얻기 #P 15#! National Insight."
 ve_idea_evt.31.c:0 "이미 구축된 전국 네트워크를 활용하십시오."
 ve_idea_evt.31.c.tt:0 "지출 #N 20#! 36개월 동안 국가적 통찰과 이득 #P +5%#! 충성주의자들이 36개월 동안."
 ve_idea_evt.32.t:0 "경쟁 국가 사회"
 ve_idea_evt.32.d:0 "경쟁 사회는 이제 국가를 대변할 권리를 주장합니다. 그들의 경쟁적인 행사와 출판물은 공유된 정치적 언어를 불만의 원천으로 바꾸고 있습니다. "
 ve_idea_evt.32.a:0 "공통 헌장의 초안을 작성하십시오."
 ve_idea_evt.32.a.tt:0 " #N 25#! 국가적 통찰력을 소비하고 민족주의적 페널티를 피하십시오."
 ve_idea_evt.32.b:0 "경쟁은 그 자체의 한계를 발견할 것입니다."
 ve_idea_evt.32.b.tt:0 "고통 #N +5%#! 24개월 동안 정당성에서 급진파."
 ve_idea_evt.32.c:0 "국가 기관이 중재하도록 하십시오."
 ve_idea_evt.32.c.tt:0 "지출 #N 10#! 국가적 통찰력과 민족주의적 처벌을 피하십시오."

 ve_idea_evt.40.t:0 "위원회 또는 거리"
 ve_idea_evt.40.d:0 "개혁가들은 전문가 위원회와 대중 압력으로 나누어집니다. 위원회는 일관된 입법을 약속하는 반면, 조직화된 운동은 공권력이 없는 개혁은 무기한 연기될 것이라고 주장합니다."
 ve_idea_evt.40.a:0 "독립적인 개혁 위원회를 만드세요."
 ve_idea_evt.40.a.tt:0 "지출 #N 25#! 국가적 통찰력. 인텔리젠시아 이득 #P +1#! 승인 및 노동조합 패배 #N 1#! 24개월 동안 승인됩니다."
 ve_idea_evt.40.b:0 "운동에 행동할 여지를 주십시오."
 ve_idea_evt.40.b.tt:0 "노조는  #P +1을 얻습니다.#! 승인과 산업가들은 패배 #N 1#! 24개월 동안 승인됩니다."
 ve_idea_evt.40.c:0 "확립된 권리 및 절차의 틀을 적용합니다."
 ve_idea_evt.40.c.tt:0 "지출 #N 10#! 내셔널 인사이트. 이익단체 승인 변경 없음. "
 ve_idea_evt.41.t:0 "청원 네트워크 "
 ve_idea_evt.41.d:0 "지역 청원은 불만을 분류하고 개혁을 제안할 수 있는 조정된 전국 네트워크가 되었습니다. 정부는 이를 협의 채널로 인정하거나 나중에 사용할 수 있도록 방법을 보존할 수 있습니다."
 ve_idea_evt.41.a:0 "네트워크를 공식 협의로 전환하십시오."
 ve_idea_evt.41.a.tt:0 "지출 #N 40#! 36개월 동안 국가적 통찰력을 얻고  #P +5%#! 정치 운동의 충성파를 얻습니다."
 ve_idea_evt.41.b:0 "리뷰 아카이브에 요구 사항을 제출하십시오."
 ve_idea_evt.41.b.tt:0 "이득 #P 15#! 국가통찰."
 ve_idea_evt.41.c:0 "기존 개혁조직을 활용하라."
 ve_idea_evt.41.c.tt:0 "지출 #N 20#! 36개월 동안 정치 운동에서 국가적 통찰력을 얻고  #P +5%#! 충성파를 얻습니다."
 ve_idea_evt.42.t:0 "연합 분열"
 ve_idea_evt.42.d:0 "개혁 연합은 우선순위, 시기 및 리더십을 놓고 분열하고 있습니다. 공동 강령이 복원되지 않는 한, 조직화된 정치 에너지는 라이벌 급진 진영으로 굳어질 것입니다."
 ve_idea_evt.42.a:0 "공통 프로그램을 다시 작성하십시오."
 ve_idea_evt.42.a.tt:0 "지출 #N 25#! 국가적 통찰과 개량주의적 처벌을 피하십시오."
 ve_idea_evt.42.b:0 "분단이 열린 정치에 들어가게 하십시오."
 ve_idea_evt.42.b.tt:0 "고통 #N +5%#! 24개월 동안 정치 운동의 급진주의자."
 ve_idea_evt.42.c:0 "평등주의적 틀을 다시 적용합니다."
 ve_idea_evt.42.c.tt:0 "지출 #N 10#! 국가적 통찰력을 갖고 개혁주의적 처벌을 피하십시오."

 ve_idea_evt.50.t:0 "연공서열 또는 공로"
 ve_idea_evt.50.d:0 "장교단은 승진을 두고 분열된다. 고위 사령관은 복무와 관례에 따라 계급을 방어하는 반면, 개혁가는 입증된 능력으로 발전할 수 있는 시험과 성과 기록을 요구합니다."
 ve_idea_evt.50.a:0 "자격시험을 소개합니다."
 ve_idea_evt.50.a.tt:0 "지출 #N 25#! 24개월 동안 National Insight 및 Gain #P +5%#! 교육 비율. 국군이 패하다 #N 1#! 24개월 동안 승인."
 ve_idea_evt.50.b:0 "연공서열을 유지합니다."
 ve_idea_evt.50.b.tt:0 "군은  #P +1을 얻습니다.#! 24개월 동안 승인을 받았으나 12개월 동안 훈련율이  #N -5%#!  감소합니다."
 ve_idea_evt.50.c:0 "일반 직원의 복무 기록을 활용합니다."
 ve_idea_evt.50.c.tt:0 "지출 #N 24개월 동안 10#! 국가적 통찰력 및 이득 #P +5%#! 교육 비율. 이익집단 승인은 변하지 않습니다."
 ve_idea_evt.51.t:0 "The Great Staff Training"
 ve_idea_evt.51.d:0 "대규모 참모 훈련은 동원, 교육 및 지휘에 대한 귀중한 교훈을 제공했습니다. 프로그램을 확장하면 이러한 교훈을 군대 전체에 전파할 수 있으며, 결과를 보관하면 적은 비용으로 보존할 수 있습니다."
 ve_idea_evt.51.a:0 "운동을 확장하세요."
 ve_idea_evt.51.a.tt:0 "지출 #N 40#! 국가적 통찰력과 이득 #P 36개월 동안 +5%#! 훈련 비율."
 ve_idea_evt.51.b:0 "결과를 교리 아카이브에 보관합니다."
 ve_idea_evt.51.b.tt:0 "Gain #P 15#! 국가 통찰력."
 ve_idea_evt.51.c:0 "전문 지휘 네트워크를 사용하십시오."
 ve_idea_evt.51.c.tt:0 "소비 #N 20#! 국가 통찰력 및 이득 #P 36개월 동안 +5%#! 훈련률."
 ve_idea_evt.52.t:0 "장교단 병목현상"
 ve_idea_evt.52.d:0 "군대는 교관과 참모 장교가 준비할 수 있는 것보다 빠르게 확장되고 있습니다. 훈련 일정은 이제 지친 소수의 간부 그룹에 따라 달라집니다. "
 ve_idea_evt.52.a:0 "훈련 간부를 확대하세요."
 ve_idea_evt.52.a.tt:0 " #N 25#! 국가 통찰력을 소비하고 군사 페널티를 피합니다."
 ve_idea_evt.52.b:0 "기존 간부들을 더 강하게 밀어냅니다."
 ve_idea_evt.52.b.tt:0 "고통 #N -5%#! 24개월 동안 훈련 비율."
 ve_idea_evt.52.c:0 "군수 직원 예비군을 이동합니다."
 ve_idea_evt.52.c.tt:0 "국가 통찰력 #N 10#! 을 소비하고 군사 페널티를 피합니다."
