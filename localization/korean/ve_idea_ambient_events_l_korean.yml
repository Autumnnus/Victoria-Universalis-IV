l_korean:
 ve_doctrine_ambient_cooldown_mdf:0 "교리 토론 대기 시간"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "국가의 기관들이 최근의 교리 토론 여파를 소화하고 있습니다."
 ve_doctrine_ambient_ig_supported_mdf:0 "기관의 지지"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "정부가 교리 토론을 매듭짓는 데 있어 이 이해 집단에 뚜렷한 직무를 부여했습니다."
 ve_doctrine_ambient_ig_slighted_mdf:0 "기관의 소외"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "정부가 최근의 교리 합의 과정에서 이 이해 집단을 배제했습니다."

 ve_doctrine_industrialist_positive_mdf:0 "표준화된 산업 관행"
 ve_doctrine_industrialist_positive_mdf_desc:0 "제조업체들이 체계화된 산업 관행 체계에서 이익을 얻고 있습니다."
 ve_doctrine_industrialist_negative_mdf:0 "산업 병목 현상"
 ve_doctrine_industrialist_negative_mdf_desc:0 "해결되지 않은 조율 실패가 제조업을 제약하고 있습니다."
 ve_doctrine_academic_positive_mdf:0 "조율된 연구 네트워크"
 ve_doctrine_academic_positive_mdf_desc:0 "대학들이 조율된 네트워크를 통해 방법, 인력, 연구 결과를 공유하고 있습니다."
 ve_doctrine_academic_negative_mdf:0 "학술적 병목 현상"
 ve_doctrine_academic_negative_mdf_desc:0 "자격 및 조율 분쟁이 대학들을 혼란에 빠뜨리고 있습니다."
 ve_doctrine_nationalist_positive_mdf:0 "국민 협회 네트워크"
 ve_doctrine_nationalist_positive_mdf_desc:0 "국민 협회들이 정통성 있는 정부를 더 넓은 충성도로 전환하고 있습니다."
 ve_doctrine_nationalist_negative_mdf:0 "경쟁하는 민족 단체들"
 ve_doctrine_nationalist_negative_mdf_desc:0 "경쟁 구도의 민족 조직들이 정치적 정통성을 새로운 불만으로 바꾸고 있습니다."
 ve_doctrine_reformist_positive_mdf:0 "조직된 개혁 네트워크"
 ve_doctrine_reformist_positive_mdf_desc:0 "정치 운동들이 참여와 타협을 위한 질서 있는 경로를 확보했습니다."
 ve_doctrine_reformist_negative_mdf:0 "분열된 개혁 연합"
 ve_doctrine_reformist_negative_mdf_desc:0 "경쟁하는 개혁 조직들이 정치적 동원을 급진주의로 변질시키고 있습니다."
 ve_doctrine_professional_army_positive_mdf:0 "참모 훈련 주기"
 ve_doctrine_professional_army_positive_mdf_desc:0 "체계적인 참모 프로그램이 육군의 훈련 제도를 개선하고 있습니다."
 ve_doctrine_professional_army_negative_mdf:0 "장교단 병목 현상"
 ve_doctrine_professional_army_negative_mdf_desc:0 "진급 및 인사 배치 분쟁이 군사 훈련을 지연시키고 있습니다."
 ve_doctrine_agrarian_positive_mdf:0 "조율된 농업 관행"
 ve_doctrine_agrarian_positive_mdf_desc:0 "농촌 기관들이 농업 경제 전반에 신뢰할 수 있는 영농법을 보급하고 있습니다."
 ve_doctrine_agrarian_negative_mdf:0 "농업 자재 품귀"
 ve_doctrine_agrarian_negative_mdf_desc:0 "종자, 신용, 조율의 부족이 농업 처리율을 떨어뜨리고 있습니다."

 ve_idea_evt.10.t:0 "최고 가동 상태의 안전 규정"
 ve_idea_evt.10.d:0 "잇따른 공장 사고로 인해 산업 안전 점검 문제가 수면 위로 떠올랐습니다. 독립적인 검사관들은 신뢰성 있는 기준을 약속하는 반면, 제조업자들은 자율 규제가 생산량과 기업가 정신을 유지할 것이라고 주장합니다."
 ve_idea_evt.10.a:0 "독립적인 검사관을 임명한다."
 ve_idea_evt.10.a.tt:0 "국가식견 #N 25#!을(를) 소모합니다. 노동조합이(가) 24개월 동안 찬성 #P +1#!을(를) 얻고 기업가이(가) 찬성 #N 1#!을(를) 잃습니다."
 ve_idea_evt.10.b:0 "산업계가 자율 규제를 작성하도록 둔다."
 ve_idea_evt.10.b.tt:0 "기업가가(가) 24개월 동안 찬성 #P +1#!을(를) 얻고 노동조합이(가) 찬성 #N 1#!을(를) 잃습니다."
 ve_idea_evt.10.c:0 "단계적으로 규칙을 표준화한다."
 ve_idea_evt.10.c.tt:0 "국가식견 #N 10#!을(를) 소모합니다. 이해 집단 찬성 변화가 없습니다."

 ve_idea_evt.11.t:0 "규격화된 기계 부품"
 ve_idea_evt.11.d:0 "여러 산업 지구의 공학자들이 게이지, 부속품, 기계 부품에 대한 공통 목록을 작성했습니다. 국가 표준을 제정하는 데는 비용이 많이 들지만, 제조업망 전반의 마찰을 해소할 수 있을 것입니다."
 ve_idea_evt.11.a:0 "전국적으로 표준을 채택합니다."
 ve_idea_evt.11.a.tt:0 "#N 40#!의 국가식견을 소모하고 36개월 동안 #P +5%#!의 제조업 처리율을 획득합니다."
 ve_idea_evt.11.b:0 "조사 결과를 나중을 위해 보관합니다."
 ve_idea_evt.11.b.tt:0 "#P 15#!의 국가식견을 획득합니다."
 ve_idea_evt.11.c:0 "우리의 생산망은 이미 준비되어 있습니다."
 ve_idea_evt.11.c.tt:0 "#N 20#!의 국가식견을 소모하고 36개월 동안 #P +5%#!의 제조업 처리율을 획득합니다."

 ve_idea_evt.12.t:0 "공장의 병목 현상"
 ve_idea_evt.12.d:0 "양립할 수 없는 절차, 지연된 부품, 혼란스러운 일정으로 인해 국가의 공장들이 마비되는 동안 명령이 쌓여가고 있습니다. 정부는 전문가를 파견하거나, 문제를 기업들에 맡기거나, 기존 건설 사무소를 동원해 대응을 조율할 수 있습니다."
 ve_idea_evt.12.a:0 "전문가 팀을 파견합니다."
 ve_idea_evt.12.a.tt:0 "#N 25#!의 국가식견을 소모하고 산업 페널티를 회피합니다."
 ve_idea_evt.12.b:0 "공장들이 스스로 해결해야 합니다."
 ve_idea_evt.12.b.tt:0 "24개월 동안 #N -5%#!의 제조업 처리율을 감수합니다."
 ve_idea_evt.12.c:0 "건설국을 가동합니다."
 ve_idea_evt.12.c.tt:0 "#N 10#!의 국가식견을 소모하고 산업 페널티를 회피합니다."

 ve_idea_evt.60.t:0 "기계화와 토지 소유권"
 ve_idea_evt.60.d:0 "새로운 기계화는 농업 생산량을 끌어올릴 수 있지만, 소작농과 소지주들은 급격한 전환이 농촌의 생계를 뿌리째 흔들 것을 우려하고 있습니다. 정부는 기계화를 가속할지, 소유권을 먼저 보호할지, 아니면 점진적인 지역적 전환을 조율할지 결정해야 합니다."
 ve_idea_evt.60.a:0 "기계화 기금을 조성합니다."
 ve_idea_evt.60.a.tt:0 "#N 25#!의 국가식견을 소모하고 24개월 동안 #P +5%#!의 농업 처리율을 획득합니다. 기업가가 24개월 동안 찬성 #P +1#!을 얻고 전원 주민이 찬성 #N 1#!을 잃습니다."
 ve_idea_evt.60.b:0 "농장을 변경하기 전에 소작농들을 보호합니다."
 ve_idea_evt.60.b.tt:0 "전원 주민이 찬성 #P +1#!을 얻고 지주가 24개월 동안 찬성 #N 1#!을 잃습니다."
 ve_idea_evt.60.c:0 "점진적 전환을 위해 지역 생산망을 활용합니다."
 ve_idea_evt.60.c.tt:0 "#N 10#!의 국가식견을 소모하고 24개월 동안 #P +5%#!의 농업 처리율을 획득합니다. 이해 집단 찬성이 변경되지 않습니다."

 ve_idea_evt.61.t:0 "협동 곡물창고"
 ve_idea_evt.61.d:0 "농촌 대표들이 비축물자, 기록, 운송을 공유할 수 있는 협동 곡물창고망을 선보였습니다. 국가 차원의 프로그램을 통해 농업 조율을 강화할 수 있으며, 단순히 계획을 보존하는 것만으로도 정부의 제도적 지식을 풍부하게 할 수 있습니다."
 ve_idea_evt.61.a:0 "협동조합망에 자금을 지원합니다."
 ve_idea_evt.61.a.tt:0 "#N 40#!의 국가식견을 소모하고 36개월 동안 #P +5%#!의 농업 처리율을 획득합니다."
 ve_idea_evt.61.b:0 "농업 사무소에 기록을 배포합니다."
 ve_idea_evt.61.b.tt:0 "#P 15#!의 국가식견을 획득합니다."
 ve_idea_evt.61.c:0 "이미 마련된 농촌 제도를 활용합니다."
 ve_idea_evt.61.c.tt:0 "#N 20#!의 국가식견을 소모하고 36개월 동안 #P +5%#!의 농업 처리율을 획득합니다."

 ve_idea_evt.62.t:0 "종자 및 신용 품귀"
 ve_idea_evt.62.d:0 "부실한 종자 재고와 타이트해지는 농촌 신용이 다가오는 농업 주기를 위협하고 있습니다. 전문가들이 비상 대응을 조직하거나, 지역망이 즉흥적으로 대처하도록 내버려두거나, 기존 자급자족 제도가 일시적으로 부담을 떠안을 수 있습니다."
 ve_idea_evt.62.a:0 "비상 전문성 프로그램을 조직합니다."
 ve_idea_evt.62.a.tt:0 "#N 25#!의 국가식견을 소모하고 농업 페널티를 회피합니다."
 ve_idea_evt.62.b:0 "지역망이 스스로 해결책을 찾도록 둡니다."
 ve_idea_evt.62.b.tt:0 "24개월 동안 #N -5%#!의 농업 처리율을 감수합니다."
 ve_idea_evt.62.c:0 "임시 뼈대로서 자급자족망을 활용합니다."
 ve_idea_evt.62.c.tt:0 "#N 10#!의 국가식견을 소모하고 농업 페널티를 회피합니다."

 ve_idea_evt.20.t:0 "후원 혹은 동료 평가"
 ve_idea_evt.20.d:0 "정부는 연구 지원금으로부터 실질적인 성과를 기대하는 한편, 학자들은 후원이 증거를 정치적 편의로 대체할 것이라 경고합니다. 지속 가능한 합의를 위해서는 국가의 학문을 심의할 주체를 정의해야 합니다."
 ve_idea_evt.20.a:0 "독립적인 심의위원회를 설립합니다."
 ve_idea_evt.20.a.tt:0 "#N 25#! 국가식견을 소모합니다. 24개월 동안 지식인이 #P +1#! 찬성을 얻고 소시민이 #N 1#! 찬성을 잃습니다."
 ve_idea_evt.20.b:0 "정부가 연구 우선순위를 정의하도록 합니다."
 ve_idea_evt.20.b.tt:0 "24개월 동안 소시민이 #P +1#! 찬성을 얻고 지식인이 #N 1#! 찬성을 잃습니다."
 ve_idea_evt.20.c:0 "공통 학술 기준을 제도화합니다."
 ve_idea_evt.20.c.tt:0 "#N 10#! 국가식견을 소모합니다. 이해 집단 찬성에 변동이 없습니다."
 ve_idea_evt.21.t:0 "지방 연구망"
 ve_idea_evt.21.d:0 "지방의 대학들이 중앙의 지시 없이도 강사, 기구, 연구 결과를 교류하기 시작했습니다. 공식적인 지원은 이 임시방편의 협력을 국가 연구망으로 발전시킬 수 있을 것입니다."
 ve_idea_evt.21.a:0 "연구망에 자금을 지원합니다."
 ve_idea_evt.21.a.tt:0 "#N 40#! 국가식견을 소모하고 36개월 동안 대학 처리율 #P +5%#!을(를) 얻습니다."
 ve_idea_evt.21.b:0 "보고서를 중앙 기록보관소에 보관합니다."
 ve_idea_evt.21.b.tt:0 "#P 15#! 국가식견을 얻습니다."
 ve_idea_evt.21.c:0 "국립 아카데미와 연계합니다."
 ve_idea_evt.21.c.tt:0 "#N 20#! 국가식견을 소모하고 36개월 동안 대학 처리율 #P +5%#!을(를) 얻습니다."
 ve_idea_evt.22.t:0 "자격증 병목 현상"
 ve_idea_evt.22.d:0 "대학들이 급증하는 학생, 강사, 새로운 학문의 수를 충분히 빠르게 평가하지 못하고 있습니다. 지연된 자격증 발급은 이제 광범위한 연구 체계를 위협하고 있습니다."
 ve_idea_evt.22.a:0 "평가 역량을 확장합니다."
 ve_idea_evt.22.a.tt:0 "#N 25#! 국가식견을 소모하고 학술적 패널티를 회피합니다."
 ve_idea_evt.22.b:0 "기존 기관들이 알아서 대처해야 합니다."
 ve_idea_evt.22.b.tt:0 "24개월 동안 대학 처리율 #N -5%#!을(를) 감수합니다."
 ve_idea_evt.22.c:0 "학교망을 통해 표준화합니다."
 ve_idea_evt.22.c.tt:0 "#N 10#! 국가식견을 소모하고 학술적 패널티를 회피합니다."

 ve_idea_evt.30.t:0 "하나의 전범, 여러 전통"
 ve_idea_evt.30.d:0 "국가 전범을 준비 중인 관료들은 지방 관습의 위치를 두고 의견이 엇갈리고 있습니다. 단일한 서술은 명확성을 약속하지만, 지역 전통을 배제하는 것은 그것이 정의하고자 하는 민족국가 그 자체를 약화할 수 있습니다."
 ve_idea_evt.30.a:0 "지역 전통을 공통의 이야기로 엮어냅니다."
 ve_idea_evt.30.a.tt:0 "#N 25#! 국가식견을 소모합니다. 24개월 동안 전원 주민이 #P +1#! 찬성을 얻고 소시민이 #N 1#! 찬성을 잃습니다."
 ve_idea_evt.30.b:0 "하나의 공식 전범을 선포합니다."
 ve_idea_evt.30.b.tt:0 "24개월 동안 소시민이 #P +1#! 찬성을 얻고 전원 주민이 #N 1#! 찬성을 잃습니다."
 ve_idea_evt.30.c:0 "훈련된 문화 간부에 작업을 맡깁니다."
 ve_idea_evt.30.c.tt:0 "#N 10#! 국가식견을 소모합니다. 이해 집단 찬성에 변동이 없습니다."
 ve_idea_evt.31.t:0 "참전용사 국가 협회"
 ve_idea_evt.31.d:0 "참전용사들은 의식, 상호 부조, 민족국가에 대한 충성심을 결합한 협회들을 조직했습니다. 이들의 조직망은 전국으로 확장되거나 공식적인 직무를 부여하지 않은 채 연구될 수 있습니다."
 ve_idea_evt.31.a:0 "전국적으로 협회를 지원합니다."
 ve_idea_evt.31.a.tt:0 "#N 40#! 국가식견을 소모하고 36개월 동안 정통성으로부터의 충성파 #P +5%#!을(를) 얻습니다."
 ve_idea_evt.31.b:0 "이들의 경험을 국가 기록보관소에 기록합니다."
 ve_idea_evt.31.b.tt:0 "#P 15#! 국가식견을 얻습니다."
 ve_idea_evt.31.c:0 "이미 구축된 국가 네트워크를 활용합니다."
 ve_idea_evt.31.c.tt:0 "#N 20#! 국가식견을 소모하고 36개월 동안 정통성으로부터의 충성파 #P +5%#!을(를) 얻습니다."
 ve_idea_evt.32.t:0 "경쟁하는 민족 사회"
 ve_idea_evt.32.d:0 "경쟁 관계의 사회들이 이제 민족을 대변할 권리를 주장하고 있다. 이들의 경쟁적인 행사와 출판물은 공동의 정치적 언어를 불만의 원천으로 변질시키고 있다."
 ve_idea_evt.32.a:0 "공통 강령을 기안한다."
 ve_idea_evt.32.a.tt:0 "#N 25#!의 국가식견을 소모하고 민족주의 패널티를 피합니다."
 ve_idea_evt.32.b:0 "경쟁은 스스로 한계를 찾을 것이다."
 ve_idea_evt.32.b.tt:0 "24개월 동안 정통성으로 인한 급진파 #N +5%#!를(을) 얻습니다."
 ve_idea_evt.32.c:0 "민족국가 기관들이 중재하도록 둔다."
 ve_idea_evt.32.c.tt:0 "#N 10#!의 국가식견을 소모하고 민족주의 패널티를 피합니다."

 ve_idea_evt.40.t:0 "위원회인가 거리인가"
 ve_idea_evt.40.d:0 "개혁론자들은 전문가 위원회와 대중의 압력 사이에서 분열되어 있다. 위원회는 일관된 입법을 약속하는 한편, 조직된 운동들은 대중의 실력행사 없는 개혁은 무기한 지연될 것이라고 주장한다."
 ve_idea_evt.40.a:0 "독립된 개혁 위원회를 창설한다."
 ve_idea_evt.40.a.tt:0 "#N 25#!의 국가식견을 소모합니다. 지식인이(가) 24개월 동안 찬성 #P +1#!을(를) 얻고 노동조합이(가) 24개월 동안 찬성 #N 1#!을(를) 잃습니다."
 ve_idea_evt.40.b:0 "운동 세력에게 행동할 여지를 준다."
 ve_idea_evt.40.b.tt:0 "노동조합이(가) 24개월 동안 찬성 #P +1#!을(를) 얻고 기업가가(가) 24개월 동안 찬성 #N 1#!을(를) 잃습니다."
 ve_idea_evt.40.c:0 "확립된 권리와 절차의 틀을 적용한다."
 ve_idea_evt.40.c.tt:0 "#N 10#!의 국가식견을 소모합니다. 이해 집단 찬성이 변경되지 않습니다."
 ve_idea_evt.41.t:0 "청원 네트워크"
 ve_idea_evt.41.d:0 "지역 청원들이 불만을 분류하고 개혁을 제안할 수 있는 조직된 전국적 네트워크로 발전했다. 정부는 이를 자문 채널로 승인하거나 그 수단을 나중을 위해 보존할 수 있다."
 ve_idea_evt.41.a:0 "네트워크를 공식적인 자문 기구로 전환한다."
 ve_idea_evt.41.a.tt:0 "#N 40#!의 국가식견을 소모하고 36개월 동안 정치 운동에 의한 충성파 #P +5%#!을(를) 얻습니다."
 ve_idea_evt.41.b:0 "요구사항들을 검토 기록고에 철한다."
 ve_idea_evt.41.b.tt:0 "국가식견 #P 15#!을(를) 얻습니다."
 ve_idea_evt.41.c:0 "이미 확립된 개혁 조직들을 활용한다."
 ve_idea_evt.41.c.tt:0 "#N 20#!의 국가식견을 소모하고 36개월 동안 정치 운동에 의한 충성파 #P +5%#!을(를) 얻습니다."
 ve_idea_evt.42.t:0 "균열이 생기는 연합"
 ve_idea_evt.42.d:0 "개혁 연합이 우선순위, 시기, 지도부를 두고 분열하고 있다. 공통 강령이 복원되지 않는 한, 조직된 정치적 에너지는 적대적인 급진파 진영으로 굳어질 것이다."
 ve_idea_evt.42.a:0 "공통 강령을 다시 작성한다."
 ve_idea_evt.42.a.tt:0 "#N 25#!의 국가식견을 소모하고 개혁 패널티를 피합니다."
 ve_idea_evt.42.b:0 "분열이 공개적인 정국으로 번지게 둔다."
 ve_idea_evt.42.b.tt:0 "24개월 동안 정치 운동에 의한 급진파 #N +5%#!을(를) 얻습니다."
 ve_idea_evt.42.c:0 "평등주의적 틀을 다시 적용한다."
 ve_idea_evt.42.c.tt:0 "#N 10#!의 국가식견을 소모하고 개혁 패널티를 피합니다."

 ve_idea_evt.50.t:0 "연공서열인가 능력주의인가"
 ve_idea_evt.50.d:0 "장교단이 진급 문제를 두고 분열되어 있다. 고참 지휘관들은 복무 기간과 관례에 따른 순위를 옹호하는 반면, 개혁론자들은 입증된 능력에 따른 진급을 열어줄 시험과 근무 성적 기록을 요구하고 있다."
 ve_idea_evt.50.a:0 "능력 시험을 도입한다."
 ve_idea_evt.50.a.tt:0 "#N 25#!의 국가식견을 소모하고 24개월 동안 훈련 속도 #P +5%#!을(를) 얻습니다. 군부가(가) 24개월 동안 찬성 #N 1#!을(를) 잃습니다."
 ve_idea_evt.50.b:0 "연공서열 제도를 유지한다."
 ve_idea_evt.50.b.tt:0 "군부가(가) 24개월 동안 찬성 #P +1#!을(를) 얻지만, 훈련 속도가 12개월 동안 #N -5%#!만큼 감소합니다."
 ve_idea_evt.50.c:0 "참모부의 복무 기록을 활용한다."
 ve_idea_evt.50.c.tt:0 "#N 10#!의 국가식견을 소모하고 24개월 동안 훈련 속도 #P +5%#!을(를) 얻습니다. 이해 집단 찬성이 변경되지 않습니다."
 ve_idea_evt.51.t:0 "대참모부 훈련"
 ve_idea_evt.51.d:0 "대규모 참모 훈련을 통해 동원, 교육, 지휘 부문의 귀중한 교훈이 도출되었다. 프로그램을 확대하면 육군 전반에 그 교훈을 전파할 수 있으며, 조사 결과를 기록으로 남기면 적은 비용으로 이를 보존할 수 있다."
 ve_idea_evt.51.a:0 "훈련을 확대한다."
 ve_idea_evt.51.a.tt:0 "#N 40#! 국가식견을 소모하고 36개월 동안 #P +5%#! 훈련 속도를 얻습니다."
 ve_idea_evt.51.b:0 "조사 결과를 교리 기록고에 보관한다."
 ve_idea_evt.51.b.tt:0 "#P 15#! 국가식견을 얻습니다."
 ve_idea_evt.51.c:0 "전문 지휘망을 활용한다."
 ve_idea_evt.51.c.tt:0 "#N 20#! 국가식견을 소모하고 36개월 동안 #P +5%#! 훈련 속도를 얻습니다."
 ve_idea_evt.52.t:0 "장교단 병목 현상"
 ve_idea_evt.52.d:0 "육군의 팽창 속도가 교관과 참모장교의 양성 속도를 앞지르고 있다. 현재 훈련 일정은 소수의 피로에 지친 간부진에 의존하고 있다."
 ve_idea_evt.52.a:0 "훈련 간부진을 확충한다."
 ve_idea_evt.52.a.tt:0 "#N 25#! 국가식견을 소모하고 군사 패널티를 피합니다."
 ve_idea_evt.52.b:0 "기존 간부진을 더욱 채찍질한다."
 ve_idea_evt.52.b.tt:0 "24개월 동안 #N -5%#! 훈련 속도를 감수합니다."
 ve_idea_evt.52.c:0 "병참 참모 예비대를 전속시킨다."
 ve_idea_evt.52.c.tt:0 "#N 10#! 국가식견을 소모하고 군사 패널티를 피합니다."
