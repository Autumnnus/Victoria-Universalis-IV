 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "민족국가"
 ve_ethnic_identity_mdf_desc:0 "국가는 주요 문화를 중심으로 정치적 구성원을 정의합니다."
 ve_civic_identity_mdf:0 "시민 국가"
 ve_civic_identity_mdf_desc:0 "국가는 공동 제도와 시민권을 통해 정치적 구성원을 정의합니다."
 ve_composite_identity_mdf:0 "복합 국가"
 ve_composite_identity_mdf_desc:0 "국가는 협상 및 행정 기관을 통해 여러 국민의 균형을 유지합니다."
 ve_ethnic_high_cohesion_mdf:0 "동원된 국가 공동체"
 ve_ethnic_high_cohesion_mdf_desc:0 "응집력 있는 민족 국가는 인구를 동원하고 국가를 합법화할 수 있습니다. "
 ve_civic_high_cohesion_mdf:0 "자신감 있는 시민 사회 "
 ve_civic_high_cohesion_mdf_desc:0 "공유된 시민 기관은 정당성과 사회적 이동성을 창출합니다."
 ve_composite_high_cohesion_mdf:0 "안정적인 임페리얼 컴팩트"
 ve_composite_high_cohesion_mdf_desc:0 "주 국민 간의 안정적인 협약은 정당성과 외교를 강화합니다."
 ve_low_national_cohesion_mdf:0 "낮은 국민 결속력"
 ve_low_national_cohesion_mdf_desc:0 "국가에 대한 국가의 정의는 정당성을 잃고 있다. "
 ve_identity_transition_backlash_mdf:0 "정체성 전환 반발"
 ve_identity_transition_backlash_mdf_desc:0 "기관과 공동체는 국가의 재정의에 저항한다. "
 ve_cultural_project_administration_mdf:0 "문화사업행정"
 ve_cultural_project_administration_mdf_desc:0 "공무원과 정치자본은 적극적인 문화사업에 전념한다."
 ve_cultural_project_backlash_mdf:0 "버려진 문화사업"
 ve_cultural_project_backlash_mdf_desc:0 "문화 프로그램의 갑작스러운 포기는 대중의 신뢰와 행정 조정을 손상시켰습니다."
 ve_national_curriculum_result_mdf:0 "국가 커리큘럼"
 ve_national_curriculum_result_mdf_desc:0 "공통 커리큘럼을 유지하면 관료주의가 소모되지만 교육과 자격이 확대됩니다."
 ve_shared_symbols_result_mdf:0 "공유 국가 상징"
 ve_shared_symbols_result_mdf_desc:0 "공유 시민 의식 및 상징은 충성심과 국가 권위를 강화합니다."
 ve_ethnic_campaign_active_mdf:0 "인종 통합 캠페인"
 ve_ethnic_campaign_active_mdf_desc:0 "국가는 적극적으로 동화를 가속화하여 문화 말살에 대한 저항을 불러일으키고 있습니다. "
