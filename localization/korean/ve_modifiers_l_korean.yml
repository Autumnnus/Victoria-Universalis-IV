 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "민족국가"
 ve_ethnic_identity_mdf_desc:0 "국가는 주류 문화에 기반하여 정치적 구성원을 정의합니다."
 ve_civic_identity_mdf:0 "시민국가"
 ve_civic_identity_mdf_desc:0 "국가는 공통된 기관과 시민권을 통해 정치적 구성원을 정의합니다."
 ve_composite_identity_mdf:0 "복합국가"
 ve_composite_identity_mdf_desc:0 "국가는 협상과 행정 기관을 통해 여러 민족 간의 균형을 유지합니다."
 ve_ethnic_high_cohesion_mdf:0 "동원된 민족 공동체"
 ve_ethnic_high_cohesion_mdf_desc:0 "결속력 있는 민족국가는 인구를 동원하고 국가의 정통성을 강화할 수 있습니다."
 ve_civic_high_cohesion_mdf:0 "자신감 있는 시민 사회"
 ve_civic_high_cohesion_mdf_desc:0 "공유된 시민 기관은 정통성과 사회적 이동성을 창출합니다."
 ve_composite_high_cohesion_mdf:0 "안정적인 제국 구성 협약"
 ve_composite_high_cohesion_mdf_desc:0 "국가 내 민족들 간의 안정적인 구성 협약은 정통성과 외교를 강화합니다."
 ve_low_national_cohesion_mdf:0 "낮은 국민통합도"
 ve_low_national_cohesion_mdf_desc:0 "국가의 민족 정의가 정통성을 잃어가고 있습니다."
 ve_identity_transition_backlash_mdf:0 "정체성 전환 반발"
 ve_identity_transition_backlash_mdf_desc:0 "기관과 공동체가 민족의 재정의에 저항합니다."
 ve_cultural_project_administration_mdf:0 "문화 사업 행정"
 ve_cultural_project_administration_mdf_desc:0 "관리들과 정치적 자본이 진행 중인 문화 사업에 투입되었습니다."
 ve_cultural_project_backlash_mdf:0 "중단된 문화 사업"
 ve_cultural_project_backlash_mdf_desc:0 "문화 프로그램의 갑작스러운 중단으로 대중의 신뢰와 행정적 조율이 손상되었습니다."
 ve_national_curriculum_result_mdf:0 "국가 교육과정"
 ve_national_curriculum_result_mdf_desc:0 "공통 교육과정은 교육과 자격을 확대하지만, 이를 유지하는 데 행정력이 소비됩니다."
 ve_shared_symbols_result_mdf:0 "공유된 국가 상징"
 ve_shared_symbols_result_mdf_desc:0 "공유된 시민 의례와 상징은 충성도와 국가 권위를 강화합니다."
 ve_ethnic_campaign_active_mdf:0 "민족 통합 캠페인"
 ve_ethnic_campaign_active_mdf_desc:0 "국가가 적극적으로 융화를 가속화하여 문화 말살에 대한 저항을 유발합니다."
 ve_ethnic_campaign_result_mdf:0 "융화 프로그램"
 ve_ethnic_campaign_result_mdf_desc:0 "완료된 통합 캠페인이 융화를 지속적으로 가속화하는 한편 문화 말살에 따른 긴장을 유발합니다."
 ve_civic_initiative_active_mdf:0 "동등한 시민권 발의"
 ve_civic_initiative_active_mdf_desc:0 "학교와 공공 기관이 기회를 확대하고 공공연한 편견을 줄이기 위해 재조직되고 있습니다."
