l_korean:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "국가 교리"
 VE_CP_COLLAPSE_TT:0 "이 국가의 빅토리아 유니버살리스 개요 숨기기"
 VE_CP_EXPAND_TT:0 "이 국가의 빅토리아 유니버살리스 개요 표시"

 VE_CP_INSIGHT_LABEL:0 "국가식견"
 VE_CP_INSIGHT_TT:0 "#header 국가식견#!\n보유량: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\n채택된 이념 무리 내의 개별 이념을 습득하는 데 소모됩니다."
 VE_CP_PIETY_LABEL:0 "종교개혁력"
 VE_CP_PIETY_TT:0 "#header 종교개혁력#!\n보유량: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\n종교 프로그램 및 대상 지정 종교 사업에 소모됩니다."
 VE_CP_MANDATE_LABEL:0 "문화위임력"
 VE_CP_MANDATE_TT:0 "#header 문화위임력#!\n보유량: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\n정체성 제도 변경 및 문화 사업에 소모됩니다."
 VE_CP_MOMENTUM_LABEL:0 "시대동력"
 VE_CP_MOMENTUM_TT:0 "#header 시대동력#!\n보유량: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\n만족된 시대 목표를 통해 획득하며 시대 보상을 구매하는 데 소모됩니다. 새로운 시대가 시작되면 대세가 초기화됩니다."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "이념"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header 이념 무리#!\n사용 중인 슬롯: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\n여유 슬롯: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n현재 교리 투자: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! 활성화된 구매 이념\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\n활성화된 무리 이념은 #Y 4, 8, 13, 19, 26#! 및 #Y 34#!에서 영구적인 역량을 획득합니다. 슬롯 5~6은 시대 2가 필요하며 슬롯 7은 시대 3이 필요합니다. 무리를 취소하면 현재 투자가 감소하며 식견은 환급되지 않지만 이미 획득한 역량은 유지됩니다."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "국가 이념"
 VE_CP_PROGRESS_LABEL:0 "이념 진척도"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header 국가 이념 진척도#!\n구매한 무리 이념: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\n무리 이념을 3개 구매할 때마다 다음 국가 이념이 해제됩니다. 21번째 이념은 국가 보너스도 부여합니다."
 VE_CP_NO_IDEA_GROUPS:0 "#lore 아직 채택된 이념 무리가 없습니다.#!"
 VE_CP_PROGRAMS_LABEL:0 "종교 프로그램"
 VE_CP_NONE_YET:0 "#lore 없음#!"
 VE_CP_PROJECT_LABEL:0 "사업"
 VE_CP_COHESION_LABEL:0 "국민통합도"
 VE_CP_OBJECTIVES_LABEL:0 "시대 목표"
 VE_CP_OBJECTIVES_TT:0 "#header 시대 목표#!\n본 시대에 완료함: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\n만족된 각 목표는 매달 시대동력을 지급합니다. 완료된 목표가 네 개이면 황금기가 해제됩니다."
 VE_CP_REWARDS_LABEL:0 "시대 보상"
 VE_CP_REWARDS_VALUE:0 "본 시대에 [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]개 구매함"
 VE_CP_REWARDS_TT:0 "#header 시대 보상#!\n본 시대에 구매함: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\n각 보상은 이전 보상보다 비용이 더 많이 들며, 보상 효과는 시대가 끝나면 소멸합니다. 슬롯 10~13은 국가 전용입니다."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "알 수 없는 시대"
 ve_cp_golden_age_industrial_active:0 "#P 산업 황금기#!"
 ve_cp_golden_age_cultural_active:0 "#P 문화 황금기#!"
 ve_cp_golden_age_strategic_active:0 "#P 전략 황금기#!"
 ve_cp_golden_age_spent:0 "#lore 황금기 사용됨#!"
 ve_cp_golden_age_ready:0 "#Y 황금기 이용 가능#!"
 ve_cp_golden_age_locked:0 "#lore 황금기 잠김#!"
 ve_cp_tier_high:0 "#P 번영함#!"
 ve_cp_tier_stable:0 "#lore 안정됨#!"
 ve_cp_tier_low:0 "#N 긴장됨#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore 채택되었으나 이 무리에서 구매한 이념이 아직 없습니다.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header 종교합의#!\n현재: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n균형점: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n월간 변동: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n수치는 매달 균형점을 향해 20% 이동하며 최대 #Y 5#! 포인트로 제한됩니다. #P 75#! 이상 시: [Country.GetCustom('ve_religious_high_settlement_effect')]\n#N 25#! 이하 시: #N 정통성 -5 및 법 제정 성공 -5%#!"
 VE_CP_COHESION_TT:0 "#header 국민통합도#!\n현재: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n균형점: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n월간 변동: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n국민통합도는 매월 균형점을 향해 잔여 거리의 20%만큼 이동하며, 최대 #Y 5#!포인트로 제한됩니다. #P 75#! 이상에서는 정체성 제도가 추가 이익을 제공하며, #N 25#! 이하에서는 국가적 불안정이 적용됩니다."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header 대상 종교 사업#!\n상태: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header 문화 사업#!\n상태: #Y [Country.GetCustom('ve_cultural_project_name')]#!\n대상: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "진척도: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n월간 진척도: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore 진행 중인 사업이 없습니다. 사업은 소유한 주의 패널에서 시작할 수 있으며, 정교분리 상태에서는 진행할 수 없습니다.#!"
 ve_cp_cultural_project_detail_active:0 "진척도: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n월간 진척도: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore 진행 중인 사업이 없습니다. 전국 단위 사업은 국가 정체성 패널에서, 대상 지정 사업은 소유한 주의 패널에서 시작합니다.#!"
