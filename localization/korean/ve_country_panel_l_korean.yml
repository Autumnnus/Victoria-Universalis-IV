l_korean:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "국가 교리"
 VE_CP_COLLAPSE_TT:0 "이 국가에 대한 Victoria Universalis 개요 숨기기"
 VE_CP_EXPAND_TT:0 "이 국가에 대한 Victoria Universalis 개요 표시"

 VE_CP_INSIGHT_LABEL:0 "내셔널 인사이트"
 VE_CP_INSIGHT_TT:0 "#header National Insight#!\n재고: #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\n수용된 아이디어 그룹 내의 개별 아이디어에 지출됨."
 VE_CP_PIETY_LABEL:0 "경건한 개혁"
 VE_CP_PIETY_TT:0 "#header Piety Reform#!\n재고: #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\n지출됨 종교 프로그램 및 대상 종교 프로젝트."
 VE_CP_MANDATE_LABEL:0 "문화 명령"
 VE_CP_MANDATE_TT:0 "#header 문화 명령#!\n재고: #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\n신원 모델 변경 및 문화 프로젝트에 소비됩니다."
 VE_CP_MOMENTUM_LABEL:0 "시대의 모멘텀"
 VE_CP_MOMENTUM_TT:0 "#header Era Momentum#!\n재고: #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\n만족된 시대 목표에서 획득하고 시대 보상에 소비합니다. 새로운 시대가 시작되면 모멘텀은 재설정됩니다."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "아이디어"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header 아이디어 그룹#!\n사용된 슬롯: #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\n무료 슬롯: #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n현재 교리 투자: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! 활성 구매 아이디어\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\n활성 그룹 아이디어는  #Y 4, 8, 13, 19, 26#! 및  #Y 34#!. 슬롯 5~6에는 나이 2가 필요하고 슬롯 7에는 나이 3이 필요합니다. 그룹을 취소하면 현재 투자가 줄어들고 Insight는 환불되지 않지만 이미 획득한 용량은 유지됩니다."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "국가 아이디어"
 VE_CP_PROGRESS_LABEL:0 "아이디어 진행률"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header 국가 아이디어 진행률#!\n구매한 그룹 아이디어: #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\n구매한 세 번째 그룹 아이디어마다 다음 국가 아이디어의 잠금이 해제됩니다. 21일에는 국가 보너스도 부여됩니다."
 VE_CP_NO_IDEA_GROUPS:0 "#lore 아직 수용된 아이디어 그룹이 없습니다.#!"
 VE_CP_PROGRAMS_LABEL:0 "종교 프로그램"
 VE_CP_NONE_YET:0 "#lore 아직 없음#!"
 VE_CP_PROJECT_LABEL:0 "프로젝트"
 VE_CP_COHESION_LABEL:0 "국가 결속"
 VE_CP_OBJECTIVES_LABEL:0 "시대 목표"
 VE_CP_OBJECTIVES_TT:0 "#header 시대 목표#!\n이 시대에 완료됨: #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\n만족된 각 목표는 매달 Era Momentum을 지불합니다. 4개의 완료된 목표는 황금 시대의 잠금을 해제합니다."
 VE_CP_REWARDS_LABEL:0 "시대 보상"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] 이 시대를 구입함"
 VE_CP_REWARDS_TT:0 "#header 시대 보상#!\n이 시대에 구입함: #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\n각 보상은 이전 보상보다 비용이 더 많이 들고, 보상 효과는 시대에 따라 끝납니다. 슬롯 10-13은 국가별로 다릅니다."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "알 수 없는 시대"
 ve_cp_golden_age_industrial_active:0 "#P 산업 황금 시대#!"
 ve_cp_golden_age_cultural_active:0 "#P 문화적 황금 시대#!"
 ve_cp_golden_age_strategic_active:0 "#P 전략적 황금 시대#!"
 ve_cp_golden_age_spent:0 "#lore 사용된 황금 시대#!"
 ve_cp_golden_age_ready:0 "#Y 황금 시대 사용 가능#!"
 ve_cp_golden_age_locked:0 "#lore 황금 시대 고정됨#!"
 ve_cp_tier_high:0 "#P 번성#!"
 ve_cp_tier_stable:0 "#lore 안정적#!"
 ve_cp_tier_low:0 "#N 긴장됨#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore 포용됨, 그러나 아직 이 그룹에서는 아이디어가 구입되지 않았습니다.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header 종교적 정착#!\n전류: #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\n평형: #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\n월별 이동: [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n미터는 매달 평형을 향해 20%씩 이동하며 다음으로 제한됩니다. #Y 5#! 전철기. ~에 #P 75#!: [Country.GetCustom('ve_religious_high_settlement_effect')]\n시간 #N 25#! 이하: #N -5 합법성 및 -5% 법률 제정 성공#!."
 VE_CP_COHESION_TT:0 "#header 국민 결속력#!\n현재: #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\n평형: #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\n월간 이동: [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\n결속력은 매달 평형을 향해 20% 이동하며,  #Y 5로 제한됩니다.#! 전철기. ~에 #P 75#! 아이덴티티 모델은 추가 혜택을 제공합니다. ~에 #N 25#! 이하 국가 불안정이 적용됩니다."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header 대상 종교 프로젝트#!\n상태: #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header 문화 프로젝트#!\n상태: #Y [Country.GetCustom('ve_cultural_project_name')]#!\n목표: [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "진행 상황: #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\n월별 진행 상황: [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore 실행 중인 프로젝트가 없습니다. 프로젝트는 소유된 상태의 패널에서 시작되며 전체 분리는 실행할 수 없습니다.#!"
 ve_cp_cultural_project_detail_active:0 "진행률: #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\n월간 진행률: [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore 실행 중인 프로젝트가 없습니다. 전국 프로젝트는 국가 정체성 패널에서 시작되며, 소유한 주의 패널을 대상으로 합니다.#!"
