 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 신앙 개혁/월#! 신앙고백 또는 국가 무신론 및 월별 문화 명령  #P +1#! 민족 국가에서."
 nationalist_idea_7_tt:0 "#P +1 종교 프로젝트 진행/월#! 고백 또는 국가 무신론, #P +1 문화 프로젝트 진행/월#! 민족 국가에서; 강제적인 종교 및 민족 통합 결과는 #Y 5%#! 에게 #Y 7%#!."
 embrace_idea_tt:0 "#header 아이디어 그룹 용량#!\n사용된 슬롯: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\n지금 무료 슬롯: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n현재 교리 투자: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! 활성 구매 아이디어\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title 용량 작동 방식#!\n각 활성 구매 그룹 아이디어 공급 #P +1#! 교리적 투자.  #Y 4, 8, 13, 19, 26에 도달#! 또는 #Y 34#! 영구적으로 하나의 그룹 슬롯을 추가합니다. 슬롯 5~6에도 2시대가 필요합니다. 슬롯 7에는 3세가 필요합니다.\n\n#title 포용 및 취소#!\n그룹을 수용하는 데는 통찰력이 필요하지 않지만 하나의 무료 슬롯을 차지합니다. 취소하면 해당 슬롯이 해제되고 그룹의 수정자가 제거되며 현재 교리 투자가 낮아집니다. 사용한 인사이트는 환불되지 않습니다. 이미 획득한 용량 슬롯은 영구적으로 사용할 수 있습니다."
 ve_idea_capacity_player_progress:0 "#title 다음 영구 슬롯#!\n슬롯: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n진행 상황: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 구매한 아이디어\n아직 필요함: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title 다음 영구 슬롯#!\n슬롯: #Y 5#!\n진행 상황: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 구매한 아이디어\n아직 필요함: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n연령 요구 사항: #N 연령 대기 중 2#!"
 ve_idea_capacity_player_age_3:0 "#title 다음 영구 슬롯#!\n슬롯: #Y 7#!\n진행 상황: #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 구매한 아이디어\n아직 필요함: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n연령 요구 사항: #N 3세 대기 중#!"
 ve_idea_capacity_player_max:0 "#P 최대 용량 도달: 7개의 영구 그룹 슬롯을 모두 사용할 수 있습니다.#!"
 ve_idea_capacity_country_progress:0 "#title 다음 영구 슬롯#!\n슬롯: #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n진행 상황: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! 구매한 아이디어\n아직 필요: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title 다음 영구 슬롯#!\n슬롯: #Y 5#!\n진행 상황: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! 구매한 아이디어\n아직 필요함: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n연령 요구 사항: #N 2세 대기 중#!"
 ve_idea_capacity_country_age_3:0 "#title 다음 영구 슬롯#!\n슬롯: #Y 7#!\n진행 상황: #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! 구매한 아이디어\n아직 필요함: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\n나이 요구 사항: #N 3세를 기다리는 중#!"
 ve_idea_capacity_country_max:0 "#P 최대 용량 도달: 영구 그룹 슬롯 7개를 모두 사용할 수 있습니다.#!"
 ve_idea_implementation_player_ready:0 "#P 준비 — 충분한 통찰력을 사용할 수 있을 때 다른 아이디어가 채택될 수 있습니다.#!"
 ve_idea_implementation_player_locked:0 "#N 구현 진행 중 — [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] 다른 아이디어가 채택되기 전에 남아 있습니다.#!"
 ve_idea_era_momentum_age_1_tt:0 "#P 1세 동안: +1 시대 모멘텀/월#! 이 레벨 IV 아이디어 그룹에서. 아이디어 그룹 기여는  #Y +2로 제한됩니다.#!."
 ve_idea_era_momentum_age_2_tt:0 "#P 2세 동안: 월간 시대 모멘텀 +1#! 이 레벨 IV 아이디어 그룹에서. 아이디어 그룹 기여 한도는 다음과 같습니다. #Y +2#!."
 ve_idea_era_momentum_age_3_tt:0 "#P 3세 동안: 이 레벨 IV 아이디어 그룹에서 월당 +1 시대 모멘텀#! . 아이디어 그룹 기여 한도는 다음과 같습니다. #Y +2#!."
 reformist_idea_5_system_tt:0 "#P +1 신앙 개혁/월#! 양심의 자유 또는 완전 별거 및  #P +1 문화 명령/월#! 시민 국가 또는 복합 국가."
 reformist_idea_7_system_tt:0 "#P +1 종교 프로젝트 진행/월#! 양심의 자유 및  #P +1 문화 프로젝트 진행/월#! 시민 국가 또는 복합 국가."
 academic_idea_5_system_tt:0 "#P +1 문화 명령/월#! 시민 국가. "
 academic_idea_7_system_tt:0 "#P +1 종교 프로젝트 진행/월 #!  국가 무신론 및  #P +1 문화 프로젝트 진행/월#! 시민국가에서."
 welfare_idea_6_system_tt:0 "#P +1 문화 프로젝트 진행/월#! 시민국가에서."
 diplomatic_idea_6_system_tt:0 "#P +1 문화 프로젝트 진행/월#! 복합 상태에서."
