 ve_national_ideas:0 " 국가 이념"
 ve_idea_points:0 "#tooltippable_name 국가식견"
 ve_national_insight_tt:0 "#header 국가식견#!\n비축량: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n이번 달: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\n구매 상태: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 효과#!\n국가식견을 사용하여 채택된 이념 무리 안의 개별 이념을 구매할 수 있습니다. 각 활성화된 구매는 국가 이념을 진척시키고 현재 교리 투자를 증가시키며, 투자 이정표에 도달하면 무리 역량이 영구적으로 주어집니다.\n\n#title 월간 수입 변동 요인#!\n기본: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\n문해력: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\n학교: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\n대학교: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\n행정: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\n정통성: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\n지식인: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\n부채, 갈등 및 도입: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title 비축량 압박#!\n수입 배율: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\n수입은 #Y 750#!에서 절반이 되며, #Y 900#!에서 4분의 1로 감소하고 #Y 1000#!에서 멈춥니다. 상한에 도달하기 전에 소비하여 낭비를 방지하십시오."
 ve_national_insight_implementation_strain:0 "교리 도입 과부하"
 ve_national_insight_implementation_strain_desc:0 "행정부는 새로 채택된 국가 교리에 맞춰 기관과 절차를 조정하고 있습니다. 이 24개월의 도입 주기가 끝날 때까지 다른 무리 이념을 채택할 수 없습니다."
 ve_total_ideas:0 "이념 무리"
 ve_traditions:0 "#tooltippable_concept 전통: "
 ve_bonus:0 "#tooltippable_concept 보너스: "
 ve_ambition:0 "지향"
 ve_ambition_tooltip:0 "#Y 지향#!\n#P 영구적인 정점 보상#!\n이 무리의 일곱 가지 이념이 모두 채택되면 자동으로 해제됩니다."
 ve_idea_cancel_warning:0 "#header [StateRegion.MakeScope.Var('idea_group')] 취소하시겠습니까?#!\n\n#N 이 무리의 모든 활성 이념 변화 요인이 제거됩니다.#!\n#N 해제된 경우 지향 변화 요인도 함께 제거됩니다.#!\n\n사용한 국가식견은 반환되지 않습니다.\n반환되는 국가식견: #Y 0#!\n\n#title 제거될 효과#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N 확인: 이 이념 무리를 취소합니다.#! 진척도와 변화 요인은 상실한 상태가 되며, 국가식견은 반환되지 않습니다."
 ve_idea_cancel_keep_tt:0 "이 이념 무리를 유지합니다 - 취소하지 않습니다."
 ve_embrace:0 "채택"
 ve_idea_locked:0 "경로가 닫힘"
 ve_idea_locked_tt:0 "#N 이 이념 무리는 이미 채택한 무리와 상호 배타적입니다. 이 경로를 열려면 해당 무리를 취소하십시오."
 ve_idea_age_locked:0 "기술 필요"
 ve_idea_age_locked_tt:0 "#N 이 이념 무리에는 아직 연구되지 않은 기술이 필요합니다."
 ve_idea_labour_technology_locked_tt:0 "#N [GetTechnology('labor_movement').GetName] 필요.#!"
 ve_idea_welfare_technology_locked_tt:0 "#N [GetTechnology('human_rights').GetName] 필요.#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N [GetTechnology('nationalism').GetName] 필요.#!"
 ve_idea_reformist_technology_locked_tt:0 "#N [GetTechnology('egalitarianism').GetName] 필요.#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N [GetTechnology('enlistment_offices').GetName] 필요.#!"
 ve_idea_colonial_technology_locked_tt:0 "#N [GetTechnology('quinine').GetName] 필요.#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N [GetTechnology('war_propaganda').GetName] 필요.#!"
 ve_boost_idea:0 "이념 강화"
 ve_boost_idea_tt:0 "#header 다음 이념 채택#!\n국가식견: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\n구매 상태: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 다음 단계 비용#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\n이 그룹에서 아직 채워지지 않은 다음 단계에 해당하는 비용을 소모합니다.\n\n#title 구매 시 효과#!\n#P 이 그룹의 다음 변화 요인이 활성화됩니다.#!\n#P 교리 투자 및 국가 이념 진척도가 각각 1 증가합니다.#!\n#N 24개월간의 교리 도입 주기가 시작됩니다. 이 기간에는 다른 그룹 이념을 구매할 수 없습니다.#!\n\n#title 버튼이 비활성화되는 이유#!\n식견이 다음 단계 비용보다 부족하거나, 교리 도입이 진행 중이거나, 그룹이 완료되었거나, 다음 단계에 연구되지 않은 기술이 요구되는 경우입니다.\n\n이 그룹을 취소하면 이념 변화 요인과 현재 진척도가 제거됩니다. 소모된 식견은 환급되지 않으나, 이정표로 이미 획득한 그룹 슬롯은 회수되지 않습니다."
