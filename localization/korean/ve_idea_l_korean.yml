l_korean:
 SOC_HEADER:0 "사회 아이디어"
 PROD_HEADER:0 "생산 아이디어"
 MIL_HEADER:0 "군사적 아이디어"
 ve_national_ideas:0 " 국가적 이념"
 ve_idea_points:0 "#tooltippable_name 내셔널 인사이트"
 ve_national_insight_tt:0 "#header National Insight#!\n재고량: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n이달: [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\n구매 상태: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 하는 일#!\nNational Insight는 수용된 아이디어 그룹 내의 개별 아이디어를 구매합니다. 각 활성 구매는 국가 아이디어를 발전시키고 현재 교리 투자에 추가됩니다. 투자 이정표에 도달하면 그룹 수용력이 영구적으로 부여됩니다.\n\n#title 월 소득이 변하는 이유#!\n기반: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\n문해력: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\n학교: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\n대학: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\n행정: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\n합법성: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\n지식인: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\n부채, 혼란 및 구현: [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title 주식 압력#!\n소득 승수: #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\n소득은  #Y 750#!에서 절반으로 줄어들고  #Y 900#! 에서 1/4로 떨어지며  #Y 1000#!에서 멈춥니다. 재고 상한선 이전에 지출하면 소득 낭비를 예방할 수 있다. "
 ve_national_insight_implementation_strain:0 "교리 시행 긴장"
 ve_national_insight_implementation_strain_desc:0 "정부는 새로 채택된 국가 교리에 제도와 절차를 적용하고 있다. 이 24개월 구현 주기가 끝날 때까지 다른 그룹 아이디어는 채택될 수 없습니다."
 ve_total_ideas:0 "아이디어 그룹"
 ve_traditions:0 "#tooltippable_concept 전통: "
 ve_bonus:0 "#tooltippable_concept 보너스: "
 ve_ambition:0 "야망"
 ve_ambition_tooltip:0 "#Y 야망#!\n#P 영구 최종 보상#!\n이 그룹의 7개 아이디어가 모두 수용되면 자동으로 잠금 해제됩니다."
 ve_idea_cancel_warning:0 "#header 취소 [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N 이 그룹의 모든 활성 아이디어 수정자는 다음과 같습니다. 제거됩니다.#!\n#N 그것의 야망 수정자는 잠금 해제된 경우에도 제거됩니다.#!\n\n사용된 국가 통찰력은 환불되지 않습니다.\n국가 통찰력 반환됨: #Y 0#!\n\n#title 제거될 효과#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N 확인: 이 아이디어 그룹을 취소합니다.#! 진행 및 수정자는 손실되고 국가 통찰력은 환불되지 않습니다."
 ve_idea_cancel_keep_tt:0 "이 아이디어 그룹 유지 - 수행 취소하지 마세요."
 ve_embrace:0 "포옹하다"
 ve_idea_locked:0 "닫힌 경로"
 ve_idea_locked_tt:0 "#N 이 아이디어 그룹은 귀하가 이미 수용한 아이디어 그룹과 상호 배타적입니다. 이 경로를 열려면 해당 그룹을 취소하십시오."
 ve_idea_age_locked:0 "Technology필수"
 ve_idea_age_locked_tt:0 "#N 이 아이디어 그룹에는 아직 연구되지 않은 기술이 필요합니다."
 ve_idea_labour_technology_locked_tt:0 "#N 필요하다 [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N 필요하다 [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N 필요하다 [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N 필요하다 [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N 필요하다 [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N 필요하다 [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N 필요하다 [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "부스트 아이디어"
 ve_boost_idea_tt:0 "#header 다음 아이디어 채택#!\nNational 통찰력: #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\n구매 상태: [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title 다음 단계의 비용#!\n#Y I: 200#!  •  #Y II: 250#!  •  #Y III: 300#!  •  #Y IV: 375#!\n#Y V: 450#!  •  #Y VI: 550#!  •  #Y VII: 675#!\n이 그룹의 다음 채워지지 않은 수준과 일치하는 비용을 사용합니다.\n\n#title 구매 시 발생하는 일#!\n#P 이 그룹의 다음 수정자가 활성화됩니다.#!\n#P 교리 투자 및 국가적 아이디어 진행이 각각 1씩 증가합니다.#!\n#N 24개월의 교리 구현 주기가 시작됩니다. 그 동안에는 다른 그룹 아이디어를 구매할 수 없습니다.#!\n\n#title 버튼을 비활성화할 수 있는 이유는 무엇입니까?#!\n통찰력은 다음 단계 비용보다 낮습니다. 교리 이행이 활성화되어 있습니다. 그룹이 완성되었습니다. 또는 다음 레벨에는 연구되지 않은 기술이 필요합니다.\n\n이 그룹을 취소하면 아이디어 수정자와 현재 진행 상황이 제거됩니다. 소비한 통찰력은 결코 환불되지 않지만, 마일스톤을 통해 이미 획득한 그룹 슬롯은 결코 취소되지 않습니다."
