 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P 종교개혁력 월간 +1#! (고백제 또는 국가 무신론주의 적용 시), 그리고 #P 문화위임력 월간 +1#! (민족국가 적용 시)."
 nationalist_idea_7_tt:0 "#P 종교 사업 진척도 월간 +1#! (고백제 또는 국가 무신론주의 적용 시); #P 문화 사업 진척도 월간 +1#! (민족국가 적용 시); 강압적 종교 및 민족국가 통합 결과가 #Y 5%#!에서 #Y 7%#!로 향상됩니다."
 embrace_idea_tt:0 "#header 이념 무리 수용량#!\n사용 중인 슬롯: #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\n현재 남은 슬롯: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\n현재 교리 투자: 활성화된 구입 이념 #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#!개\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title 수용량 작동 방식#!\n활성화된 구입 이념 무리마다 #P +1#!의 교리 투자가 공급됩니다. #Y 4, 8, 13, 19, 26#! 또는 #Y 34#!개 도달 시 무리 슬롯이 영구적으로 1개씩 증가합니다. 5~6번째 슬롯은 시대 2도 필요하며, 7번째 슬롯은 시대 3이 필요합니다.\n\n#title 수용 및 취소#!\n무리 수용에는 통찰력이 소모되지 않으나 빈 슬롯을 1개 차지합니다. 취소하면 해당 슬롯이 비워지고 무리의 변화 요인이 제거되며 현재 교리 투자가 감소합니다. 이미 소모된 통찰력은 환급되지 않습니다. 이미 획득한 수용량 슬롯은 영구적으로 유지됩니다."
 ve_idea_capacity_player_progress:0 "#title 다음 영구 슬롯#!\n슬롯: #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n진척도: 구입 이념 #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#!개\n추가 필요: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!개"
 ve_idea_capacity_player_age_2:0 "#title 다음 영구 슬롯#!\n슬롯: #Y 5#!\n진척도: 구입 이념 #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#!개\n추가 필요: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!개\n시대 요구 조건: #N 시대 2 대기 중#!"
 ve_idea_capacity_player_age_3:0 "#title 다음 영구 슬롯#!\n슬롯: #Y 7#!\n진척도: 구입 이념 #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#!개\n추가 필요: #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!개\n시대 요구 조건: #N 시대 3 대기 중#!"
 ve_idea_capacity_player_max:0 "#P 최대 수용량 도달: 7개의 영구 무리 슬롯을 모두 사용할 수 있습니다.#!"
 ve_idea_capacity_country_progress:0 "#title 다음 영구 슬롯#!\n슬롯: #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\n진척도: 구입 이념 #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#!개\n추가 필요: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!개"
 ve_idea_capacity_country_age_2:0 "#title 다음 영구 슬롯#!\n슬롯: #Y 5#!\n진척도: 구입 이념 #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#!개\n추가 필요: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!개\n시대 요구 조건: #N 시대 2 대기 중#!"
 ve_idea_capacity_country_age_3:0 "#title 다음 영구 슬롯#!\n슬롯: #Y 7#!\n진척도: 구입 이념 #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#!개\n추가 필요: #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!개\n시대 요구 조건: #N 시대 3 대기 중#!"
 ve_idea_capacity_country_max:0 "#P 최대 수용량 도달: 7개의 영구 무리 슬롯을 모두 사용할 수 있습니다.#!"
 ve_idea_implementation_player_ready:0 "#P 준비 완료 — 충분한 통찰력이 있을 경우 다른 이념을 채택할 수 있습니다.#!"
 ve_idea_implementation_player_locked:0 "#N 교리 구현 진행 중 — 다른 이념을 채택하기까지 [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] 남았습니다.#!"
 ve_idea_era_momentum_age_1_tt:0 "#P 1세 동안: +1 시대 모멘텀/월#! 이 레벨 IV 아이디어 그룹에서. 아이디어 그룹 기여는  #Y +2로 제한됩니다.#!."
 ve_idea_era_momentum_age_2_tt:0 "#P 2세 동안: 월간 시대 모멘텀 +1#! 이 레벨 IV 아이디어 그룹에서. 아이디어 그룹 기여 한도는 다음과 같습니다. #Y +2#!."
 ve_idea_era_momentum_age_3_tt:0 "#P 3세 동안: 이 레벨 IV 아이디어 그룹에서 월당 +1 시대 모멘텀#! . 아이디어 그룹 기여 한도는 다음과 같습니다. #Y +2#!."
 reformist_idea_5_system_tt:0 "#P 종교개혁력 월간 +1#! (신앙의 자유 또는 완전 분리 적용 시), 그리고 #P 문화위임력 월간 +1#! (시민국가 또는 복합국가 적용 시)."
 reformist_idea_7_system_tt:0 "#P 종교 사업 진척도 월간 +1#! (신앙의 자유 적용 시) 및 #P 문화 사업 진척도 월간 +1#! (시민국가 또는 복합국가 적용 시)."
 academic_idea_5_system_tt:0 "#P 문화위임력 월간 +1#! (시민국가 적용 시)."
 academic_idea_7_system_tt:0 "#P 종교 사업 진척도 월간 +1#! (국가 무신론주의 적용 시) 및 #P 문화 사업 진척도 월간 +1#! (시민국가 적용 시)."
 welfare_idea_6_system_tt:0 "시민국가에서 #P 문화 사업 진척도/월 +1#!."
 diplomatic_idea_6_system_tt:0 "복합국가에서 #P 문화 사업 진척도/월 +1#!."
