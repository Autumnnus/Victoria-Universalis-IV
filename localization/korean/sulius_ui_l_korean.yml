l_korean:
 SULIUS_LEGITIMACY_LEVEL_ACTIVE_TOOLTIP:0 "#tooltip_header [concept_legitimacy] \n[LegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\n$LEGITIMACY_LEVEL_BOUNDS_DESC$\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\n효과:#indent_newline:2 \n[LegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\n원인:#indent_newline:2 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 SULIUS_CAPITAL_MONEY:0 "#tooltip_header [concept_money]#!\n수지: #variable @money![AccessPlayer.PredictWeeklyBalance|D=+]#![GetPlayer.GetPowerDeltaIcon('money')]\n[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.GetPrincipal, '(CFixedPoint)0'), 'CREDIT_DESC', 'GOLD_RESERVES_DESC')]\n황금 매장량 한도: @money![GetPlayer.GetGoldReserveLimit|Dv]#!#![SelectLocalization(GetMetaPlayer.GetPlayedOrObservedCountry.IsValid, 'CAPITAL_MONEY_DELAYED', 'OBSERVER_NO_COUNTRY_SELECTED') ]"
 
 SULIUS_RESEARCH:0 "#tooltip_header [concept_technology]#!\n[SelectLocalization( GetPlayer.GetCurrentlyResearchedTechnology.IsValid, 'SULIUS_RESEARCHING', 'SULIUS_NOT_RESEARCHING' )]\n$TOOLTIP_DELIMITER$\n#V 기술 진척도#!\n#help [concept_innovation]로부터: @innovation![GetPlayer.GetWeeklyInnovation|+0]\n[concept_technology_spread]로부터: [GetPlayer.GetWeeklyTechnologySpreadForTechDesc(GetPlayer.GetCurrentlyResearchedTechnology.Self)]\n$TOOLTIP_DELIMITER$\n#V [concept_innovation]#!\n우리국은 매주 #v @innovation![GetPlayer.GetWeeklyInnovation|+2]#!의 [concept_innovation]을(를) 창출합니다:\n[GetPlayer.GetWeeklyInnovationDesc]\n\n매주 활성화된 연구에 투자할 수 있는 최대 [concept_innovation]은(는) @innovation![GetPlayer.GetWeeklyMaxInnovation|v2]입니다:\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\n투자 상한선이나 활성 연구 부족으로 소모되지 않은 모든 [concept_innovation]은(는) 우리국의 [concept_technology_spread] 속도를 증가시킵니다."
 SULIUS_RESEARCHING:0 "[GetPlayer.GetName]은(는) 현재 [GetPlayer.GetCurrentlyResearchedTechnology.GetName]을(를) 연구 중입니다#!\n진척도: #v @innovation! [GetPlayer.GetCurrentlyResearchedTechnology.GetProgress(GetPlayer.Self)|D]#! / #maximum [GetPlayer.GetCurrentlyResearchedTechnology.GetCost(GetPlayer.Self)|D]#! ([GetPlayer.GetCurrentlyResearchedTechnology.GetTimeLeftDesc( GetPlayer.Self )] 남음)"
 SULIUS_NOT_RESEARCHING:0 "[GetPlayer.GetName]은(는) 현재 어떤 기술도 연구하고 있지 않습니다."
