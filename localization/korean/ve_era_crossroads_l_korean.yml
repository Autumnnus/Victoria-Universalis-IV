l_korean:
 ve_je_era_crossroads_age_1:0 "증기와 국가"
 ve_je_era_crossroads_age_1_reason:0 "산업과 국가는 현대적 국가 지위로 나아가는 여러 길을 열었습니다. 선택된 행로는 단순한 개별 성취의 모음 그 이상이 되어야 합니다."
 ve_je_era_crossroads_age_1_status:0 "진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40에서의 이정표는 국가식견으로 자금을 조달하는 강화 효과를 제공합니다."
 ve_je_era_crossroads_age_1_route_1_status:0 "#Y 증기망#!\n진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준점: 본 시대 동안 확보한 소작농 점유율 목표와 철로 목표.\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40에서의 이정표는 국가식견으로 자금을 조달하는 강화 효과를 제공합니다."
 ve_je_era_crossroads_age_1_route_2_status:0 "#Y 교육받은 시민사회#!\n진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준점: 본 시대 동안 확보한 자유노동 목표와 식자 또는 학교 목표.\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40에서의 이정표는 국가식견으로 자금을 조달하는 강화 효과를 제공합니다."
 ve_je_era_crossroads_age_1_route_3_status:0 "#Y 행정 국가#!\n진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준점: 본 시대 동안 확보한 정통성 및 행정력 목표와 독립적 안정 목표.\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40에서의 이정표는 국가식견으로 자금을 조달하는 강화 효과를 제공합니다."
 ve_je_era_crossroads_age_2:0 "제국인가 대중사회인가?"
 ve_je_era_crossroads_age_2_reason:0 "제국과 대중사회는 외부 영향력, 복지, 민족국가 통합이 어떻게 서로를 정의할지 국가가 선택하도록 강제합니다."
 ve_je_era_crossroads_age_2_status:0 "진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40에서의 이정표는 국가식견으로 자금을 조달하는 강화 효과를 제공합니다."
 ve_je_era_crossroads_age_2_route_1_status:0 "#Y 제국의 지평#!\n진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준점: 본 시대 동안 확보한 열강국가 역량 목표와 항구 또는 이해 목표.\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40에서의 이정표는 국가식견으로 자금을 조달하는 강화 효과를 제공합니다."
 ve_je_era_crossroads_age_2_route_2_status:0 "#Y 대중 복지#!\n진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준점: 본 시대 동안 확보한 식자 또는 학교 목표와 사회 기관 목표.\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40에서의 이정표는 국가식견으로 자금을 조달하는 강화 효과를 제공합니다."
 ve_je_era_crossroads_age_2_route_3_status:0 "#Y 통합된 민족국가#!\n진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준점: 본 시대 동안 확보한 경제적 전환 목표와 저갈등 정통성 목표.\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40에서의 이정표는 국가식견으로 자금을 조달하는 강화 효과를 제공합니다."
 ve_je_era_crossroads_age_3:0 "동원된 사회"
 ve_je_era_crossroads_age_3_reason:0 "대중 정치와 총력전은 시민권, 산업, 전략적 대비 태세를 동일한 국가적 합의의 일부로 만듭니다."
 ve_je_era_crossroads_age_3_status:0 "진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40에서의 이정표는 국가식견으로 자금을 조달하는 강화 효과를 제공합니다."
 ve_je_era_crossroads_age_3_route_1_status:0 "#Y 사회 공화국#!\n진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n잔여 기간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준점: 본 시대 동안 확보된 대중 정치 목표와 성숙한 사회 기관 목표.\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40의 이정표에서 국가식견 소모를 통한 강화 제공."
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y 전략 지휘#!\n진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n잔여 기간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준점: 본 시대 동안 확보된 현대적 군대 편성 목표와 열강의 영향력 목표.\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40의 이정표에서 국가식견 소모를 통한 강화 제공."
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y 병기고 사회#!\n진척도: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n잔여 기간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0]개월#!\n월간 진척도: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준점: 본 시대 동안 확보된 전기 산업 목표와 대규모 군수품 목표.\n\n목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득. 진척도 20 및 40의 이정표에서 국가식견 소모를 통한 강화 제공."

 ve_era_crossroads.1.t:0 "증기와 국가"
 ve_era_crossroads.1.d:0 "철로, 학교, 개혁가, 그리고 관료들이 현대 민족국가를 향한 서로 다른 방향을 제시합니다. 정부는 사회와 국가 사이의 어떤 관계를 통해 첫 번째 시대를 조직할 것인지 결정해야 합니다."
 ve_era_crossroads.1.a:0 "증기망을 통해 국가를 결속한다."
 ve_era_crossroads.1.b:0 "교육받은 시민 사회를 건설한다."
 ve_era_crossroads.1.c:0 "행정 국가를 공고히 한다."
 ve_era_crossroads.1.d.option:0 "이 시대에는 국가적 갈림길이 필요하지 않다."
 ve_era_crossroads.1.a.tt:0 "#Y 증기망#! 진로를 시작합니다 (중점: 산업화, 소작농 이주 및 철로).\n• 목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득.\n• 진척도 속도: 기본 월간 진척도 +1, 완료된 시대 1 기준점(소작농 비중 및 기반 시설 목표)마다 추가로 +1 획득.\n• 교리 시너지: #Y 산업가 IV#! 또는 #Y 사회간접자본 IV#! 보유 시 이정표 결단 비용 할인 (10 대신 식견 5 소모)."
 ve_era_crossroads.1.b.tt:0 "#Y 교육받은 시민 사회#! 진로를 시작합니다 (중점: 교육, 식자 및 자유 노동).\n• 목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득.\n• 진척도 속도: 기본 월간 진척도 +1, 완료된 시대 1 기준점(자유 노동 및 식자/교육부 목표)마다 추가로 +1 획득.\n• 교리 시너지: #Y 학술 IV#! 또는 #Y 개혁 IV#! 보유 시 이정표 결단 비용 할인 (10 대신 식견 5 소모)."
 ve_era_crossroads.1.c.tt:0 "#Y 행정 국가#! 진로를 시작합니다 (중점: 정부 정통성, 행정력 및 안정성).\n• 목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득.\n• 진척도 속도: 기본 월간 진척도 +1, 완료된 시대 1 기준점(정통성/행정력 및 독립적 안정성 목표)마다 추가로 +1 획득.\n• 교리 시너지: #Y 관료 IV#! 또는 #Y 의회 IV#! 보유 시 이정표 결단 비용 할인 (10 대신 식견 5 소모)."
 ve_era_crossroads.2.t:0 "제국인가 대중 사회인가?"
 ve_era_crossroads.2.d:0 "국가는 이제 해외 진출, 대중 복지, 그리고 민족국가 통합을 별개의 문제로 다룰 수 없습니다. 이들 중 하나가 다른 것들이 추구될 방식을 정의하게 될 것입니다."
 ve_era_crossroads.2.a:0 "제국의 지평을 바라본다."
 ve_era_crossroads.2.b:0 "대중 복지 제도를 건설한다."
 ve_era_crossroads.2.c:0 "통합된 민족국가를 구축한다."
 ve_era_crossroads.2.d.option:0 "시éd이 스스로의 방향을 찾도록 둔다."
 ve_era_crossroads.2.a.tt:0 "#Y 제국의 지평#! 진로를 시작합니다 (중점: 외교적 역량 및 해외 진출).\n• 목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득.\n• 진척도 속도: 기본 월간 진척도 +1, 완료된 시대 2 기준점(공인된 국가 역량 및 항구/이해 관계 목표)마다 추가로 +1 획득.\n• 교리 시너지: #Y 외교 IV#! 또는 #Y 식민 IV#! 보유 시 이정표 결단 비용 할인 (10 대신 식견 5 소모)."
 ve_era_crossroads.2.b.tt:0 "#Y 대중 복지#! 진로를 시작합니다 (중점: 사회 기관, 의료 및 교육).\n• 목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득.\n• 진척도 속도: 기본 월간 진척도 +1, 완료된 시대 2 기준점(식자/교육부 및 사회 기관 목표)마다 추가로 +1 획득.\n• 교리 시너지: #Y 복지 IV#! 또는 #Y 개혁 IV#! 보유 시 이정표 결단 비용 할인 (10 대신 식견 5 소모)."
 ve_era_crossroads.2.c.tt:0 "#Y 통합된 민족국가#! 진로를 시작합니다 (중점: 경제적 전환 및 내부 안정성).\n• 목표: 진척도 60에 도달하여 #P +50 시대동력#! 획득.\n• 진척도 속도: 기본 월간 진척도 +1, 완료된 시대 2 기준점(경제적 전환 및 저갈등 정통성 목표)마다 추가로 +1 획득.\n• 교리 시너지: #Y 민족주의 IV#! 또는 #Y 노동 IV#! 보유 시 이정표 결단 비용 할인 (10 대신 식견 5 소모)."
 ve_era_crossroads.3.t:0 "동원된 사회"
 ve_era_crossroads.3.d:0 "대중 정치, 전략적 지휘, 그리고 산업 동원이 이제 모든 기관에 미치고 있습니다. 마지막 시대는 어떠한 형태의 동원이 민족국가를 정의할 것인지에 대한 선택을 요구합니다."
 ve_era_crossroads.3.a:0 "사회 공화국에 헌신한다."
 ve_era_crossroads.3.b:0 "민족국가를 전략적 지휘 하에 둔다."
 ve_era_crossroads.3.c:0 "병기창 사회를 구축한다."
 ve_era_crossroads.3.d.option:0 "상시 동원 계획을 거부합니다."
 ve_era_crossroads.3.a.tt:0 "#Y 사회 공화국#! 진로를 시작합니다 (초점: 대중 정치 및 사회적 기관).\n• 목표: 진척도 60에 도달하여 #P +50 시대동력#!을 획득합니다.\n• 진척도 속도: 기본 월간 진척도 +1을 얻으며, 완료된 시대 3 닻(대중 정치 및 성숙한 사회적 기관 목표) 하나당 추가로 +1을 얻습니다.\n• 교리 시너지: #Y 의회 IV#! 또는 #Y 복지 IV#!를 보유한 경우 더 저렴한 이정표 결단이 해제됩니다 (10이 아닌 국가식견 5)."
 ve_era_crossroads.3.b.tt:0 "#Y 전략적 지휘#! 진로를 시작합니다 (초점: 군사 현대화 및 전 세계적 권력 도달).\n• 목표: 진척도 60에 도달하여 #P +50 시대동력#!을 획득합니다.\n• 진척도 속도: 기본 월간 진척도 +1을 얻으며, 완료된 시대 3 닻(현대적 군대 구성 및 열강 도달 목표) 하나당 추가로 +1을 얻습니다.\n• 교리 시너지: #Y 전문직업군 IV#! 또는 #Y 방어 IV#!를 보유한 경우 더 저렴한 이정표 결단이 해제됩니다 (10이 아닌 국가식견 5)."
 ve_era_crossroads.3.c.tt:0 "#Y 병기창 사회#! 진로를 시작합니다 (초점: 산업 전시 경제 및 대규모 군수품).\n• 목표: 진척도 60에 도달하여 #P +50 시대동력#!을 획득합니다.\n• 진척도 속도: 기본 월간 진척도 +1을 얻으며, 완료된 시대 3 닻(전기 산업 및 대규모 군수품 목표) 하나당 추가로 +1을 얻습니다.\n• 교리 시너지: #Y 전시 경제 IV#! 또는 #Y 대규모 징병 IV#!를 보유한 경우 더 저렴한 이정표 결단이 해제됩니다 (10이 아닌 국가식견 5)."

 ve_era_crossroads_decline_tt:0 "현재 시대의 시대의 갈림길을 영구히 거부합니다. 이후 시대들은 계속 적합 상태로 유지됩니다."

 ve_era_crossroads.10.t:0 "국가 일정"
 ve_era_crossroads.10.d:0 "지방 관청, 민간 협회, 그리고 부처들은 각기 다른 속도로 선택된 전환을 추진하고 있습니다. 공통된 일정은 산만한 성취들을 국가 프로그램으로 전환할 수 있지만, 조율 그 자체로도 부족한 행정적 주의를 요구합니다."
 ve_era_crossroads.10.a:0 "중앙 조율 위원회에 자금을 지원한다."
 ve_era_crossroads.10.b:0 "기관들이 자체적인 시간표를 협상하도록 둔다."
 ve_era_crossroads.10.c:0 "우리의 확립된 교리들이 구축한 네트워크를 활용한다."
 ve_era_crossroads.10.a.tt:0 "#N 국가식견 10#!을 소모하여 #P +3 갈림길 진척도#!를 획득합니다."
 ve_era_crossroads.10.b.tt:0 "자원을 소모하지 않으며 갈림길 진척도에 즉각적인 변화를 주지 않습니다."
 ve_era_crossroads.10.c.tt:0 "진로에 적합한 IV레벨 이념 무리가 필요합니다. #N 국가식견 5#!을 소모하여 #P +3 갈림길 진척도#!를 획득합니다."

 ve_era_crossroads.11.t:0 "누가 진척을 지휘할 것인가?"
 ve_era_crossroads.11.d:0 "이 프로그램은 더 이상 느슨한 합의로 남기에는 너무나 중대해졌습니다. 장관들은 국가적 직권을 주장하고, 전문가들은 정치로부터의 격리를 요구하며, 지역 주체들은 경직된 지휘가 진척을 가능케 했던 기관들을 파괴할 것이라고 경고합니다."
 ve_era_crossroads.11.a:0 "중앙에 명확한 조율 직권을 부여한다."
 ve_era_crossroads.11.b:0 "협상된 권위의 수지를 보존한다."
 ve_era_crossroads.11.c:0 "조율을 우리의 교리적 기관들에 맡긴다."
 ve_era_crossroads.11.a.tt:0 "#N 국가식견 10#!을 소모하여 #P +3 갈림길 진척도#!를 획득합니다."
 ve_era_crossroads.11.b.tt:0 "자원을 소모하지 않으며 갈림길 진척도에 즉각적인 변화를 주지 않습니다."
 ve_era_crossroads.11.c.tt:0 "진로에 적합한 IV레벨 이념 무리가 필요합니다. #N 국가식견 5#!을 소모하여 #P +3 갈림길 진척도#!를 획득합니다."

 ve_era_crossroads.40.t:0 "증기와 국가"
 ve_era_crossroads.40.d:0 "선택된 진로는 더 이상 고립된 성취들의 연속이 아닙니다. 기반 시설, 시민권, 또는 행정은 이제 국가가 시대의 전환을 이해하고 지휘할 수 있는 지속 가능한 국가 프로그램의 형태를 형성합니다."
 ve_era_crossroads.40.a:0 "첫 번째 시대가 자신의 제도적 형식을 찾았습니다."
 ve_era_crossroads.40.a.tt:0 "완료된 시대의 갈림길이 #P +50 시대동력#!을 부여했습니다. 목표를 완료하거나 황금기 적합 여부를 변경하지는 않습니다."

 ve_era_crossroads.20.t:0 "국가의 도달 범위"
 ve_era_crossroads.20.d:0 "선택된 프로그램은 이제 이를 처음 후원했던 기관들의 범위를 넘어 확장되고 있습니다. 항구, 학교, 관청, 그리고 지역 당국은 국가적 조율이 어디에서 끝나고 지역적 재량권이 어디에서 시작되어야 하는지를 두고 의견이 엇갈리고 있습니다."
 ve_era_crossroads.20.a:0 "중앙 위원회를 통해 국가의 특약을 도식화한다."
 ve_era_crossroads.20.b:0 "기관의 경계가 협상을 통해 부각되도록 허용한다."
 ve_era_crossroads.20.c:0 "우리의 확립된 교리 네트워크를 통해 조율한다."
 ve_era_crossroads.20.a.tt:0 "#N 국가식견 10#!을 소모하여 #P +3 갈림길 진척도#!를 획득합니다."
 ve_era_crossroads.20.b.tt:0 "자원을 소모하지 않으며 갈림길 진척도에 즉각적인 변화를 주지 않습니다."
 ve_era_crossroads.20.c.tt:0 "진로에 적합한 IV레벨 이념 무리가 필요합니다. #N 국가식견 5#!을 소모하여 #P +3 갈림길 진척도#!를 획득합니다."

 ve_era_crossroads.21.t:0 "통합의 대가"
 ve_era_crossroads.21.d:0 "대외적 팽창, 사회적 복지, 그리고 국가적 규율은 모두 수혜자와 비용, 그리고 새로운 기대를 낳습니다. 이 계획은 국가가 그러한 부담을 어떻게 배분할지 결정할 때만 지속될 수 있습니다."
 ve_era_crossroads.21.a:0 "조정을 관리할 국가 위원회를 창설한다."
 ve_era_crossroads.21.b:0 "협상된 타협을 통해 부담을 분배한다."
 ve_era_crossroads.21.c:0 "우리의 교리 기관이 과부하를 흡수하도록 한다."
 ve_era_crossroads.21.a.tt:0 "#N 10 국가식견#!을 소모하여 #P +3 시대의 갈림길 진척도#!를 얻습니다."
 ve_era_crossroads.21.b.tt:0 "자원을 소모하지 않으며 시대의 갈림길 진척도에 즉각적인 변화를 주지 않습니다."
 ve_era_crossroads.21.c.tt:0 "진로에 적합한 레벨 IV 이념 무리가 필요합니다. #N 5 국가식견#!을 소모하여 #P +3 시대의 갈림길 진척도#!를 얻습니다."

 ve_era_crossroads.41.t:0 "제국과 대중사회"
 ve_era_crossroads.41.d:0 "선택된 정착지는 이제 국가의 대외적 팽창, 사회적 특약, 그리고 국가 기관을 연결합니다. 전략적 방향으로 시작되었던 것은 이제 대중사회를 통치하기 위한 지속 가능한 틀이 되었습니다."
 ve_era_crossroads.41.a:0 "두 번째 시대가 그 정착지를 찾았습니다."
 ve_era_crossroads.41.a.tt:0 "완료된 시대의 갈림길이 #P +50 시대동력#!을 부여했습니다. 목표를 완료하거나 황금기 자격 요건을 변경하지는 않습니다."

 ve_era_crossroads.30.t:0 "민족국가의 의무 소집"
 ve_era_crossroads.30.d:0 "시민, 지휘관, 노동자, 그리고 행정관 모두 선택된 계획에 따라 새로운 책임을 부여받고 있습니다. 그러한 임무가 서로에게 명백히 이해되지 않는다면, 동원은 상충되는 요구의 집합으로 남을 것입니다."
 ve_era_crossroads.30.a:0 "중앙 위원회를 통해 국가적 의무를 성문화한다."
 ve_era_crossroads.30.b:0 "기관들이 책임을 협상하게 한다."
 ve_era_crossroads.30.c:0 "우리의 교리 조직을 사용하여 의무를 조율한다."
 ve_era_crossroads.30.a.tt:0 "#N 10 국가식견#!을 소모하여 #P +3 시대의 갈림길 진척도#!를 얻습니다."
 ve_era_crossroads.30.b.tt:0 "자원을 소모하지 않으며 시대의 갈림길 진척도에 즉각적인 변화를 주지 않습니다."
 ve_era_crossroads.30.c.tt:0 "진로에 적합한 레벨 IV 이념 무리가 필요합니다. #N 5 국가식견#!을 소모하여 #P +3 시대의 갈림길 진척도#!를 얻습니다."

 ve_era_crossroads.31.t:0 "영구적인 비상사태"
 ve_era_crossroads.31.d:0 "대중 참여, 전략적 대비, 또는 산업 동원을 위해 구축된 기계 장치가 영구화되고 있습니다. 국가는 비상 규율이 평범한 국가 생활을 집어삼키도록 두지 않으면서 역량을 보존할 방법을 결정해야 합니다."
 ve_era_crossroads.31.a:0 "국가적 검토를 통해 영구적인 한계를 정의한다."
 ve_era_crossroads.31.b:0 "정착지를 의도적으로 유연하게 유지한다."
 ve_era_crossroads.31.c:0 "기계 장치를 억제하기 위해 교리 기관에 의존한다."
 ve_era_crossroads.31.a.tt:0 "#N 10 국가식견#!을 소모하여 #P +3 시대의 갈림길 진척도#!를 얻습니다."
 ve_era_crossroads.31.b.tt:0 "자원을 소모하지 않으며 시대의 갈림길 진척도에 즉각적인 변화를 주지 않습니다."
 ve_era_crossroads.31.c.tt:0 "진로에 적합한 레벨 IV 이념 무리가 필요합니다. #N 5 국가식견#!을 소모하여 #P +3 시대의 갈림길 진척도#!를 얻습니다."

 ve_era_crossroads.42.t:0 "동원된 사회"
 ve_era_crossroads.42.d:0 "시민권, 지휘, 그리고 산업 역량은 이제 지속 가능한 국가적 정착지를 형성합니다. 동원 기관들은 새로운 위기마다 즉흥적으로 내놓던 답변 대신 평범한 정부의 일원이 되었습니다."
 ve_era_crossroads.42.a:0 "마지막 시대가 그 민족국가 형식을 찾았습니다."
 ve_era_crossroads.42.a.tt:0 "완료된 시대의 갈림길이 #P +50 시대동력#!을 부여했습니다. 목표를 완료하거나 황금기 자격 요건을 변경하지는 않습니다."
