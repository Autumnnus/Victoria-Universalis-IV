l_korean:
 ve_je_era_crossroads_age_1:0 "증기와 국가"
 ve_je_era_crossroads_age_1_reason:0 "산업과 국가는 현대 국가로 가는 여러 길을 열었습니다. 선택한 과정은 개별적인 성취의 집합 그 이상이어야 합니다."
 ve_je_era_crossroads_age_1_status:0 "진행률: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월별 진행 상황: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n목표:  #P +50 Era Momentum#! 동안 60 진행 상황에 도달하세요. 20 및 40 진행의 이정표는 National Insight에서 자금을 지원하는 부스트를 제공합니다."
 ve_je_era_crossroads_age_1_route_1_status:0 "#Y Steam 네트워크#!\n진행률: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진행률: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n앵커: 이 시대 동안 확보된 농민 공유 목표 및 철도 목표.\n\n목표: 60 진행률 도달 #P +50 시대 모멘텀#!. 20 및 40 진행 단계의 이정표는 National Insight에서 지원하는 부스트를 제공합니다."
 ve_je_era_crossroads_age_1_route_2_status:0 "#Y 교육받은 시민권#!\n진행 상황: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진행 상황: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n기준: 이 시대에 확보된 자유 노동 목표와 읽고 쓰는 능력 또는 학교 목표.\n\n목표:  #P +50 시대 모멘텀#!에 대해 60 진행에 도달합니다. 20 및 40 진행의 이정표는 National Insight 자금 지원 부스트를 제공합니다."
 ve_je_era_crossroads_age_1_route_3_status:0 "#Y 행정 상태#!\n진행: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월별 진행 상황: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n앵커: 이 시대에 확보된 합법성과 관료주의 목표 및 독립적인 안정성 목표.\n\n목표: 60 진행률 도달 #P +50 시대 모멘텀#!. 20 및 40 진행 단계의 이정표는 National Insight에서 자금을 지원하는 부스트를 제공합니다."
 ve_je_era_crossroads_age_2:0 "제국인가, 대중사회인가?"
 ve_je_era_crossroads_age_2_reason:0 "제국과 대중 사회는 국가가 외부 도달 범위, 복지 및 국가 통합이 서로를 어떻게 정의할지 선택하도록 강요합니다."
 ve_je_era_crossroads_age_2_status:0 "진전: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진행 상황: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n목표:  #P +50 Era Momentum#! 동안 60 진행 상황에 도달하세요. 20 및 40 진행 단계의 이정표는 National Insight에서 자금을 지원하는 부스트를 제공합니다."
 ve_je_era_crossroads_age_2_route_1_status:0 "#Y Imperial Horizon#!\n진행률: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진행률: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n앵커: 인정된 국가 용량 목표와 이 시대 동안 확보된 항구 또는 이익 목표.\n\n목표:  #P +50 시대 모멘텀#!에 대해 60 발전에 도달합니다. 20 및 40 진전의 이정표는 National Insight 자금 지원을 제공합니다."
 ve_je_era_crossroads_age_2_route_2_status:0 "#Y 대중 복지#!\n진행: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진행 상황: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n앵커: 이 시대에 확보된 읽기 쓰기 능력 또는 학교 목표 및 사회 제도 목표.\n\n목표: 60점 도달,  #P +50 시대 추진력#!. 20 및 40 진행의 이정표는 National Insight 자금 지원 부스트를 제공합니다."
 ve_je_era_crossroads_age_2_route_3_status:0 "#Y Integrated Nation#!\n진행 상황: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월별 진행 상황: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n앵커: 이 시대에 확보된 경제 변혁 목표와 혼란이 적은 정당성 목표.\n\n목표: 진행률 60에 도달 #P +50 시대 모멘텀#!. 20 및 40 진행 단계의 이정표는 National Insight에서 자금을 지원하는 부스트를 제공합니다."
 ve_je_era_crossroads_age_3:0 "동원사회"
 ve_je_era_crossroads_age_3_reason:0 "대중 정치와 총력전은 시민권, 산업, 전략적 준비 상태를 동일한 국가 정착의 일부로 만듭니다."
 ve_je_era_crossroads_age_3_status:0 "진행률: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진행률: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n목표: 60 달성 진행률 #P +50 Era Momentum#!. 20 및 40 진행의 이정표는 National Insight에서 지원하는 부스트를 제공합니다."
 ve_je_era_crossroads_age_3_route_1_status:0 "#Y Social Republic#!\n진행: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월별 진행 상황: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n앵커: 이 시대에 확보된 대중 정치 목표와 성숙한 사회 제도 목표.\n\n목표:  #P +50 시대 모멘텀을 위해 60 발전 도달#!. 20 및 40 진행의 이정표는 National Insight에서 자금 지원을 받는 부스트를 제공합니다."
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y 전략 사령부#!\n진행: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월별 진행 상황: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n앵커: 현대의 힘 구성 목표와 이 시대에 확보된 강대국 도달 목표.\n\n목표: 진행 상황 60에 도달 #P +50 시대 모멘텀#!. 20 및 40 진행의 이정표는 National Insight 자금 지원 부스트를 제공합니다."
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y Arsenal Society#!\n진행: #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\n남은 시간: #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] 개월#!\n월간 진행 상황: #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\n앵커: 이 시대에 확보된 전기 산업 목표 및 대량 군비 목표.\n\n목표:  #P +50 시대 추진력에 대한 60 진행률 도달#!. 20 및 40 진행의 이정표는 National Insight에서 자금을 지원하는 부스트를 제공합니다."

 ve_era_crossroads.1.t:0 "Steam 및 주"
 ve_era_crossroads.1.d:0 "철도, 학교, 개혁가 및 행정관은 현대 국가에 대한 경쟁적인 설명을 제공합니다. 정부는 사회와 국가 사이의 어떤 관계가 첫 번째 시대를 조직할 것인지 결정해야 합니다. "
 ve_era_crossroads.1.a:0 "Steam 네트워크를 통해 국가를 하나로 묶습니다. "
 ve_era_crossroads.1.b:0 "교육받은 시민권을 구축하십시오."
 ve_era_crossroads.1.c:0 "행정국가를 통합하라. "
 ve_era_crossroads.1.d.option:0 "이 시대에는 국경이 필요하지 않다."
 ve_era_crossroads.1.a.tt:0 " #Y Steam 네트워크를 시작합니다#! 경로(초점: 산업화, 농민 이주 및 철도).\n• 목표: 60도 도달 진행률  #P +50 시대 추진력 획득#!.\n• 진행 속도: 기본 월별 진행 상황이 +1 증가하고, 완료된 각 1시대 닻(농민 공유 및 철도 목표)에 대해 추가로 +1을 얻습니다.\n• 교리 시너지: 보유 #Y 산업가 IV#!  #Y 인프라 IV#! 더 저렴한 마일스톤 결정을 잠금 해제합니다(10 대신 5 통찰력)."
 ve_era_crossroads.1.b.tt:0 "시작합니다 #Y 교육받은 시민권#! 경로(초점: 교육, 문해력 및 무료 노동).\n• 목표: 60점 달성 진행 상황 #P +50 시대 모멘텀#!.\n• 진행 속도: 기본 월별 진행 상황이 +1 증가하고 1세 기준이 완료될 때마다 추가로 +1이 추가됩니다(무료 노동 및 읽고쓰기/학교 목표).\n• 교리 시너지: 보유 #Y 학업 IV#! 또는 #Y 개혁주의자 IV#! 더 저렴한 마일스톤 결정을 잠금 해제합니다(10 대신 5 통찰력)."
 ve_era_crossroads.1.c.tt:0 "시작합니다 #Y 행정 상태#! 경로(초점: 정부 합법성, 관료주의 및 안정성).\n• 목표: 60점 달성 진행 상황 #P +50 시대 모멘텀#!.\n• 진행 속도: 기본 월별 진행 상황이 +1 증가하고, 완료된 각 1시대 기준에 대해 추가로 +1을 얻습니다(합법성/관료제 및 독립적 안정성 목표).\n• 교리 시너지: 보유 #Y 관료주의 IV#!  #Y 의회 IV#! 더 저렴한 마일스톤 결정을 잠금 해제합니다(10 대신 5 통찰력)."
 ve_era_crossroads.2.t:0 "제국인가 대중사회인가?"
 ve_era_crossroads.2.d:0 "국가는 더 이상 해외 진출, 대중 복지, 국민 통합을 별개의 문제로 다룰 수 없습니다. 그 중 하나는 다른 것의 추구 방법을 정의합니다."
 ve_era_crossroads.2.a:0 "Imperial Horizon을 바라보십시오. "
 ve_era_crossroads.2.b:0 "대중 복지 시스템을 구축하십시오."
 ve_era_crossroads.2.c:0 "통합국가를 건설하라."
 ve_era_crossroads.2.d.option:0 "시대가 자기의 방향을 찾도록 하라."
 ve_era_crossroads.2.a.tt:0 "시작하다 #Y 임페리얼 호라이즌#! 경로(초점: 외교력 및 해외 영향력).\n• 목표: 60 도달 진행 상황 달성 #P +50 시대 추진력#!.\n• 진행 속도: 기본 월별 진행률 +1을 얻고, 완료된 각 2시대 앵커(인정된 국가 역량 및 항구/관심 목표)에 대해 추가로 +1을 얻습니다.\n• 교리 시너지: 보유 #Y 외교 IV#!  #Y 콜로니얼 IV#! 더 저렴한 마일스톤 결정을 잠금 해제합니다(10 대신 5 통찰력)."
 ve_era_crossroads.2.b.tt:0 "시작 #Y 대중복지#! 경로(초점: 사회 기관, 의료 및 교육).\n• 목표: 60점 달성 진행 상황 #P +50 시대 모멘텀#!.\n• 진행 속도: 기본 월별 진행 상황이 +1 증가하고 2세 기준이 완료될 때마다 추가로 +1이 추가됩니다(읽기 능력/학교 및 사회 기관 목표).\n• 교리 시너지: 보유 #Y 복지 IV#! 또는 #Y 개혁주의자 IV#! 더 저렴한 마일스톤 결정을 잠금 해제합니다(10 대신 5 통찰력)."
 ve_era_crossroads.2.c.tt:0 "시작합니다 #Y 통합국가#! 경로(초점: 경제 변화 및 내부 안정성).\n• 목표: 60점 달성 진행 상황 달성 #P +50 시대 모멘텀#!.\n• 진행 속도: 기본 월별 진행 상황이 +1 증가하고, 완료된 각 2시대 기준에 대해 추가로 +1을 얻습니다(경제적 변혁 및 낮은 혼란의 합법성 목표).\n• 교리 시너지: 보유 #Y 민족주의자 IV#! 또는 #Y 노동 IV#! 더 저렴한 이정표 결정을 내릴 수 있습니다(10개가 아닌 5개의 통찰력). "
 ve_era_crossroads.3.t:0 "동원화된 사회"
 ve_era_crossroads.3.d:0 "대중 정치, 전략적 지휘 및 산업 동원은 이제 모든 기관에 적용됩니다. 마지막 시대에는 어떤 형태의 동원이 국가를 정의할지에 대한 선택이 요구됩니다."
 ve_era_crossroads.3.a:0 "사회 공화국을 약속합니다. "
 ve_era_crossroads.3.b:0 "국가를 전략적 지휘하에 두십시오. "
 ve_era_crossroads.3.c:0 "무기고 사회를 건설하십시오. "
 ve_era_crossroads.3.d.option:0 "영구 동원 프로젝트를 거부하십시오."
 ve_era_crossroads.3.a.tt:0 " #Y 사회공화국 시작#! 경로(초점: 대중 정치 및 사회 제도).\n• 목표: 60점 도달 진행 상황 #P +50 시대 추진력#!.\n• 진행 속도: 기본 월별 진행 상황이 +1 증가하고, 완료된 각 3시대 기준에 대해 추가로 +1이 추가됩니다(대중 정치 및 성숙한 사회 제도 목표).\n• 교리 시너지: 보유 #Y 의회 IV#!  #Y 복지 IV#! 더 저렴한 마일스톤 결정을 잠금 해제합니다(10 대신 5 통찰력)."
 ve_era_crossroads.3.b.tt:0 " #Y 전략사령부 개시#! 경로(초점: 군사 현대화 및 글로벌 전력 도달).\n• 목표: 60 도달 진행률 달성 #P +50 시대 추진력#!.\n• 진행 속도: 기본 월별 진행 상황이 +1 증가하고, 완료된 각 3시대 앵커에 대해 추가로 +1이 추가됩니다(현대 부대 구성 및 강대국 도달 목표).\n• 교리 시너지: 보유 #Y 직업군 IV#! 또는 #Y 방어 IV#! 더 저렴한 마일스톤 결정을 잠금 해제합니다(10 대신 5 통찰력)."
 ve_era_crossroads.3.c.tt:0 "시작합니다 #Y 아스날 소사이어티#! 경로(초점: 산업 전쟁 경제 및 대량 군비).\n• 목표: 진행 상황 60에 도달하여 획득 #P +50 시대 추진력#!.\n• 진행 속도: 기본 월별 진행 상황이 +1 증가하고, 완료된 각 3시대 앵커(전기 산업 및 대량 군비 목표)에 대해 추가로 +1을 얻습니다.\n• 교리 시너지: 보유 #Y 전쟁경제 IV#!  #Y 대량징병 IV#! 더 저렴한 마일스톤 결정을 잠금 해제합니다(10 대신 5 통찰력)."

 ve_era_crossroads_decline_tt:0 "현재 시대의 시대 교차로를 영구적으로 거부합니다. 이후 연령도 자격이 있습니다."

 ve_era_crossroads.10.t:0 "국가 달력"
 ve_era_crossroads.10.d:0 "지방청, 민간 협회, 부처는 다양한 속도로 선택한 변화를 추구하고 있습니다. 공통 달력을 사용하면 분산된 성과를 국가 프로그램으로 전환할 수 있지만 조정 자체에는 행정적인 관심이 거의 필요하지 않습니다."
 ve_era_crossroads.10.a:0 "중앙 조정 위원회에 자금을 지원합니다."
 ve_era_crossroads.10.b:0 "기관들이 각자의 시간표를 협상하도록 하세요."
 ve_era_crossroads.10.c:0 "우리가 확립한 교리에 따라 구축된 네트워크를 사용하십시오."
 ve_era_crossroads.10.a.tt:0 "지출 #N 10 내셔널 인사이트#! 획득하다 #P +3 교차로 진행 #!."
 ve_era_crossroads.10.b.tt:0 "자원을 소비하지 않고 교차로 진행을 즉시 변경하지 않습니다. "
 ve_era_crossroads.10.c.tt:0 "경로 맞춤 레벨 IV 아이디어 그룹이 필요합니다. 지출 #N 5 내셔널 인사이트#!  #P +3 교차로 진행 상황을 얻으려면#!."

 ve_era_crossroads.11.t:0 "진행을 직접 담당할 사람은 누구입니까?"
 ve_era_crossroads.11.d:0 "이 프로그램은 느슨한 계약을 유지하기에는 너무 중요해졌습니다. 장관들은 국가적 권위를 주장하고, 전문가들은 정치로부터의 격리를 요구하며, 지역 행위자들은 엄격한 명령이 발전을 가능하게 했던 제도를 무너뜨릴 것이라고 경고합니다."
 ve_era_crossroads.11.a:0 "센터에 명확한 조정 권한을 부여하십시오."
 ve_era_crossroads.11.b:0 "협상된 권위의 균형을 유지하십시오. "
 ve_era_crossroads.11.c:0 "교리 기관에 조정을 맡기십시오."
 ve_era_crossroads.11.a.tt:0 "지출 #N 10 내셔널 인사이트#! 획득하다 #P +3 교차로 진행#!."
 ve_era_crossroads.11.b.tt:0 "자원을 소비하지 않고 교차로 진행을 즉시 변경하지 않습니다."
 ve_era_crossroads.11.c.tt:0 "경로 적합 레벨 IV 아이디어 그룹이 필요합니다. 지출 #N 5 내셔널 인사이트#!  #P +3 교차로 진행률#!을 얻습니다."

 ve_era_crossroads.40.t:0 "Steam과 국가"
 ve_era_crossroads.40.d:0 "선택된 과정은 더 이상 고립된 성취의 연속이 아닙니다. 인프라, 시민권 또는 행정은 이제 국가가 시대의 변화를 이해하고 지시할 수 있는 지속적인 국가 프로그램을 형성합니다."
 ve_era_crossroads.40.a:0 "첫 번째 시대가 제도적 형태를 찾았습니다."
 ve_era_crossroads.40.a.tt:0 "완성된 시대 교차로는 #P +50 시대 모멘텀#!. 목표를 완료하지 않았거나 황금기 자격이 변경되지 않았습니다."

 ve_era_crossroads.20.t:0 "국가의 영향력"
 ve_era_crossroads.20.d:0 "선택한 프로그램은 이제 처음 후원했던 기관을 넘어 확장되었습니다. 항만, 학교, 사무실 및 지방 당국은 어디에서 국가적 조정이 끝나고 지방 재량권이 시작되어야 하는지에 대해 의견이 일치하지 않습니다."
 ve_era_crossroads.20.a:0 "중앙 위원회를 통해 국가의 의무를 지도화합니다."
 ve_era_crossroads.20.b:0 "협상을 통해 제도적 경계가 드러나도록 허용합니다."
 ve_era_crossroads.20.c:0 "확립된 교리 네트워크를 통해 조정하십시오."
 ve_era_crossroads.20.a.tt:0 "경비 #N 10 내셔널 인사이트#! 획득하다 #P +3 교차로 진행 #!."
 ve_era_crossroads.20.b.tt:0 "자원을 소비하지 않고 교차로 진행을 즉시 변경하지 않습니다. "
 ve_era_crossroads.20.c.tt:0 "경로 맞춤 레벨 IV 아이디어 그룹이 필요합니다. 지출 #N 5 내셔널 인사이트#!  #P +3 교차로 진행률을 얻습니다.#!."

 ve_era_crossroads.21.t:0 "통합의 대가"
 ve_era_crossroads.21.d:0 "외부 도달 범위, 사회적 공급 및 국가 규율은 모두 승자, 비용 및 새로운 기대치를 창출합니다. 국가가 그러한 부담을 어떻게 분배할 것인지 결정해야만 프로그램이 지속될 수 있습니다. "
 ve_era_crossroads.21.a:0 "조정을 관리하기 위해 국가위원회를 만드십시오."
 ve_era_crossroads.21.b:0 "협상된 타협을 통해 부담을 분산시키십시오."
 ve_era_crossroads.21.c:0 "우리의 교리 기관이 부담을 흡수하도록 하십시오."
 ve_era_crossroads.21.a.tt:0 "지출 #N 10 내셔널 인사이트#! 획득하다 #P +3 교차로 진행#!."
 ve_era_crossroads.21.b.tt:0 "자원을 소비하지 않고 교차로 진행을 즉시 변경하지 않습니다."
 ve_era_crossroads.21.c.tt:0 "경로 적합 레벨 IV 아이디어 그룹이 필요합니다. 지출 #N 5 내셔널 인사이트#!  #P +3 교차로 진행률#!을 얻습니다."

 ve_era_crossroads.41.t:0 "제국과 대중사회"
 ve_era_crossroads.41.d:0 "선택된 정착지는 이제 국가의 외부 영향력, 사회적 의무 및 국가 제도를 연결합니다. 전략적 방향으로 시작된 것이 대중사회를 통치하기 위한 견고한 틀이 되었습니다."
 ve_era_crossroads.41.a:0 "두 번째 시대가 정착을 찾았습니다."
 ve_era_crossroads.41.a.tt:0 "완성된 Era Crossroads는 #P +50 시대 모멘텀#!. 목표를 완료하지 않았거나 황금기 자격이 변경되지 않았습니다."

 ve_era_crossroads.30.t:0 "국가는 의무를 이행하도록 부름을 받았습니다"
 ve_era_crossroads.30.d:0 "시민, 지휘관, 노동자, 행정관 모두는 선택한 프로그램에 의해 새로운 의무를 부여받습니다. 이러한 임무가 서로 명확하게 설명되지 않는 한 동원은 경쟁적인 요구의 집합으로 남을 것입니다."
 ve_era_crossroads.30.a:0 "중앙위원회를 통해 국가 업무를 성문화합니다."
 ve_era_crossroads.30.b:0 "기관들이 그들의 책임을 협상하도록 하십시오. "
 ve_era_crossroads.30.c:0 "우리의 교리적 조직을 사용하여 의무를 조정하십시오."
 ve_era_crossroads.30.a.tt:0 "경비 #N 10 내셔널 인사이트#! 획득하다 #P +3 교차로 진행 #!."
 ve_era_crossroads.30.b.tt:0 "자원을 소비하지 않고 교차로 진행을 즉시 변경하지 않습니다. "
 ve_era_crossroads.30.c.tt:0 "경로 맞춤 레벨 IV 아이디어 그룹이 필요합니다. 지출 #N 5 내셔널 인사이트#!  #P +3 교차로 진행 #!."

 ve_era_crossroads.31.t:0 "영구적 비상사태"
 ve_era_crossroads.31.d:0 "대중 참여, 전략적 준비 또는 산업 동원을 위해 구축된 기계가 영구적이 되고 있습니다. 국가는 비상 규율이 일상적인 국가 생활을 소비하도록 허용하지 않고 역량을 보존할 방법을 결정해야 합니다. "
 ve_era_crossroads.31.a:0 "국가 검토를 통해 영구적인 한계를 정의합니다. "
 ve_era_crossroads.31.b:0 "합의를 의도적으로 유연하게 유지합니다. "
 ve_era_crossroads.31.c:0 "기구를 억제하기 위해 교리적 기관에 의존합니다."
 ve_era_crossroads.31.a.tt:0 "지출 #N 10 내셔널 인사이트#! 획득하다 #P +3 교차로 진행#!."
 ve_era_crossroads.31.b.tt:0 "자원을 소비하지 않고 교차로 진행을 즉시 변경하지 않습니다."
 ve_era_crossroads.31.c.tt:0 "경로 적합 레벨 IV 아이디어 그룹이 필요합니다. 지출 #N 5 내셔널 인사이트#!  #P +3 교차로 진행률#!을 얻습니다."

 ve_era_crossroads.42.t:0 "동원사회"
 ve_era_crossroads.42.d:0 "시민권, 지휘권, 산업 역량은 이제 내구성 있는 국가 정착지를 형성합니다. 동원 기관은 각각의 새로운 위기에 대한 즉석 답변으로 남겨두기보다는 일반 정부의 일부로 만들어졌습니다."
 ve_era_crossroads.42.a:0 "마지막 시대는 국가적 형태를 찾았습니다."
 ve_era_crossroads.42.a.tt:0 "완성된 Era Crossroads는  #P +50 Era Momentum#!을 부여했습니다. 목표를 완료하지 않았거나 황금기 자격이 변경되지 않았습니다."
