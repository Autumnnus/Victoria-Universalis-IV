l_korean:
 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "빅토리아 유니버살리스 IV 2.0"
 ve_welcome.1.d:0 "본 캠페인은 재구축된 빅토리아 유니버살리스 IV를 기반으로 실행됩니다. 요약하자면:\n\n#Y 종교#! - 이제 국교와 국가 법률에 따라 네 가지 종교 모델 중 하나가 결정됩니다. 0-100의 종교합의 수치가 주어지며, 모델별로 여덟 가지 영구 프로그램에 종교개혁력을 소모하고, 원하는 주에서 표적화된 종교 사업을 하나 진행할 수 있습니다.\n\n#Y 국가 정체성#! - 민족적, 시민적, 혹은 복합적 민족국가 체제에 소모 가능한 문화위임력, 높게 유지해야 할 국민통합도 수치, 그리고 다섯 가지 문화 프로젝트가 존재합니다.\n\n#Y 이념 그룹#! - 새로운 농업 그룹을 포함하여 생산, 사회, 군사에 걸쳐 21개의 그룹이 존재합니다. 그룹 슬롯은 달력이 아닌 교리 투자를 통해 획득하며, 모든 구매에는 24개월의 이행 기간이 소요됩니다.\n\n#Y 국가 이념#! - 12개의 새로운 국가 프로필이 추가되었으며, 진척도는 구매하는 모든 개별 이념 레벨에서 부여됩니다.\n\n#Y 시대#! - 목표가 있는 세 가지 시대, 13개의 시대 보상 슬롯과 세 개의 황금기, 그리고 각 시대별 하나의 전략적 시대의 갈림길 여정이 제공됩니다.\n\n#Y 신규 콘텐츠#! - 100개 이상의 새로운 이벤트가 추가되었습니다: 교리 딜레마, 다년간의 교리 여정, 사업 사건 및 위기, 그리고 오스만, 일본, 미국의 고유 역사 연계 이벤트.\n\n#Y 인터페이스#! - 새로운 상단 바 행, 재구축된 종교 및 국가 정체성 페이지, 모든 국가 패널에 표시되는 교리 정보, 그리고 전 세계 교리 장부."
 ve_welcome.1.f:0 "모든 교리는 이를 채택한 민족국가에 그 흔적을 남기는 법입니다."
 ve_welcome.1.a:0 "자세한 내용은 모드 설명을 참조하십시오. 즐거운 플레이 되시길 ^_^"
