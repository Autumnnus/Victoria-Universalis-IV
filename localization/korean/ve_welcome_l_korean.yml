 # Victoria Universalis IV 2.0 시작 이벤트 - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "이 캠페인은 새로 만들어진 Victoria Universalis IV에서 실행됩니다. 요약하면:\n\n#Y 종교#! - 교회와 국가 법이 이제 네 가지 종교 모델 중 하나를 결정합니다. 0~100의 종교적 정착도를 유지하고, 경건한 개혁을 모델별 여덟 가지 영구 프로그램에 사용하며, 원하는 주에서 하나의 종교 사업을 진행할 수 있습니다.\n\n#Y 국가 정체성#! - 민족 국가, 시민 국가, 복합 국가 중 하나를 선택합니다. 문화 명령을 사용하고, 국가 결속을 높게 유지하며, 다섯 가지 문화 사업을 진행합니다.\n\n#Y 아이디어 그룹#! - 생산, 사회, 군사에 걸친 21개 그룹이며 새로운 농경 그룹이 포함됩니다. 그룹 슬롯은 이제 연도가 아니라 교리 투자로 얻으며, 구매할 때마다 24개월의 시행 기간이 필요합니다.\n\n#Y 국가 아이디어#! - 열두 개의 새로운 국가 프로필이 추가되었고, 진행도는 구매한 모든 아이디어 단계에서 얻습니다.\n\n#Y 시대#! - 목표가 있는 세 시대, 열세 개의 시대 보상 슬롯, 세 가지 황금시대, 그리고 각 시대마다 전략적인 시대의 갈림길 여정이 있습니다.\n\n#Y 새 콘텐츠#! - 백 개가 넘는 새로운 이벤트: 교리 딜레마, 여러 해에 걸친 교리 여정, 사업 사건과 위기, 그리고 오스만, 일본, 미국 전용 연쇄 이벤트.\n\n#Y 인터페이스#! - 새로운 상단 바 줄, 새로 만든 종교 및 국가 정체성 페이지, 모든 국가 패널의 교리 요약, 그리고 전 세계를 담은 교리 원장."
 ve_welcome.1.f:0 "모든 교리는 그것을 받아들인 국가에 흔적을 남긴다."
 ve_welcome.1.a:0 "자세한 내용은 모드 설명을 참고하세요. 즐거운 시간 되세요 ^_^"
