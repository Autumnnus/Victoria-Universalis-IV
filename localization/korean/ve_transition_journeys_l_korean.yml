l_korean:
 ve_je_religious_settlement_transition:0 "종교합의 전환"
 ve_je_religious_settlement_transition_reason:0 "교회와 국가 간의 법적 합의가 변경되었습니다. 전환 위기가 효력을 유지하는 동안 기관, 공동체, 그리고 관료들은 이에 적응해야 합니다. 이 일지 항목의 일정이 아니라 위기 변화 요인이 기준이 됩니다."
 ve_je_religious_settlement_transition_complete_tt:0 "종교합의 전환 위기가 종료되었습니다."
 ve_je_religious_settlement_transition_status_confessional:0 "목표 합의: #Y 신조국가#!\n종교합의: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\n잔여 예상 기간: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0]개월#!\n완료된 이정표: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n위기 종료 시 결과: #Y 60 이상#! 조기 안정화, #Y 26~59#! 중립적 해결, #Y 25 이하#! 위기 발생. 남은 각 이정표는 종교합의에 영향을 주는 선택지를 제공합니다."
 ve_je_religious_settlement_transition_status_freedom:0 "목표 합의: #Y 양심의 자유#!\n종교합의: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\n잔여 예상 기간: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0]개월#!\n완료된 이정표: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n위기 종료 시 결과: #Y 60 이상#! 조기 안정화, #Y 26~59#! 중립적 해결, #Y 25 이하#! 위기 발생. 남은 각 이정표는 종교합의에 영향을 주는 선택지를 제공합니다."
 ve_je_religious_settlement_transition_status_separation:0 "목표 합의: #Y 정교분리#!\n종교합의: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\n잔여 예상 기간: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0]개월#!\n완료된 이정표: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n위기 종료 시 결과: #Y 60 이상#! 조기 안정화, #Y 26~59#! 중립적 해결, #Y 25 이하#! 위기 발생. 남은 각 이정표는 종교합의에 영향을 주는 선택지를 제공합니다."
 ve_je_religious_settlement_transition_status_atheism:0 "목표 합의: #Y 국가무신론#!\n종교합의: #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\n잔여 예상 기간: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0]개월#!\n완료된 이정표: #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\n위기 종료 시 결과: #Y 60 이상#! 조기 안정화, #Y 26~59#! 중립적 해결, #Y 25 이하#! 위기 발생. 남은 각 이정표는 종교합의에 영향을 주는 선택지를 제공합니다."

 ve_je_national_compact_transition:0 "국민 협약 전환"
 ve_je_national_compact_transition_reason:0 "국가적 소속감에 대한 새로운 정의가 채택되었습니다. 전환 반발이 효력을 유지하는 동안 행정가, 엘리트, 그리고 공동체들은 이 협약을 협상해야 합니다. 이 일지 항목의 일정이 아니라 반발 변화 요인이 기준이 됩니다."
 ve_je_national_compact_transition_complete_tt:0 "국민 협약 전환 반발이 종료되었습니다."
 ve_je_national_compact_transition_status_ethnic:0 "목표 정체성: #Y 민족적 정체성#!\n국민통합도: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\n잔여 예상 기간: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0]개월#!\n완료된 이정표: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\n반발 종료 시 결과: #Y 60 이상#! 결속력 조기 안정화, #Y 26~59#! 중립적 해결, #Y 25 이하#! 위기 발생. 남은 각 이정표는 국민통합도에 영향을 주는 선택지를 제공합니다."
 ve_je_national_compact_transition_status_civic:0 "목표 정체성: #Y 시민적 정체성#!\n국민통합도: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\n잔여 예상 기간: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0]개월#!\n완료된 이정표: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\n반발 종료 시 결과: #Y 60 이상#! 결속력 조기 안정화, #Y 26~59#! 중립적 해결, #Y 25 이하#! 위기 발생. 남은 각 이정표는 국민통합도에 영향을 주는 선택지를 제공합니다."
 ve_je_national_compact_transition_status_composite:0 "목표 정체성: #Y 복합적 정체성#!\n국민통합도: #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\n잔여 예상 기간: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0]개월#!\n완료된 이정표: #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\n반발 종료 시 결과: #Y 60 이상#! 결속력 조기 안정화, #Y 26~59#! 중립적 해결, #Y 25 이하#! 위기 발생. 남은 각 이정표는 국민통합도에 영향을 주는 선택지를 제공합니다."
 ve_je_transition_resolving_status:0 "전환 기록을 현재의 국가 합의와 조화시키는 중입니다."

 ve_rel_transition_conciliatory_tt:0 "종교개혁력 #N 10#!을(를) 소모하고 종교합의 #P 3#!을(를) 얻습니다."
 ve_rel_transition_central_tt:0 "종교개혁력 #P 5#!을(를) 얻고 종교합의 #N 3#!을(를) 잃습니다."
 ve_rel_transition_doctrine_tt:0 "종교개혁력 #N 5#!을(를) 소모하고 종교합의 #P 2#!을(를) 얻습니다."

 ve_rel_evt.210.t:0 "성직 임명의 한계"
 ve_rel_evt.210.d:0 "종교 당국이 공직 후보자 명단을 제출한 한편, 고위 관료들은 국가 봉사에서 무엇보다 능력이 보상되어야 한다고 역설합니다. 새로운 합의에 따른 첫 임명은 성직자의 조언이 끝나는 곳과 시민 권위가 시작되는 곳을 정의할 것입니다."
 ve_rel_evt.210.a:0 "혼성 임명 위원회를 소집한다."
 ve_rel_evt.210.b:0 "성직자들의 명단을 수용한다."
 ve_rel_evt.210.c:0 "표준 시험과 종교적 조언을 병행한다."

 ve_rel_evt.211.t:0 "학교와 충성도의 서약"
 ve_rel_evt.211.d:0 "본당 학교들은 공공 교육 체계 내에서 공인된 지위를 모색하고 있습니다. 이들의 후원자들은 종교 교육에 대한 보호를 요구하는 반면, 관리들은 상반된 교육 과정과 서약이 다음 세대를 분열시킬 것을 우려합니다."
 ve_rel_evt.211.a:0 "공통 핵심 교육 과정을 보장한다."
 ve_rel_evt.211.b:0 "단일한 충성 서약을 부과한다."
 ve_rel_evt.211.c:0 "타협안을 관료적 검열 아래 둔다."

 ve_rel_evt.220.t:0 "소수자 보호 조항의 언어"
 ve_rel_evt.220.d:0 "소수자 공동체는 자신들의 보호 조항이 새로운 합의에 명시되기를 원합니다. 반면 정부 법률가들은 공동체별 약속이 오랜 분열을 고착화할 수 있다고 경고하며 단일한 일반 조항을 선호합니다."
 ve_rel_evt.220.a:0 "보호 조항을 평이하게 작성한다."
 ve_rel_evt.220.b:0 "단일한 시민권 조항을 사용한다."
 ve_rel_evt.220.c:0 "개혁 연정이 문구를 중재하도록 한다."

 ve_rel_evt.221.t:0 "공동 기관에서의 대표성"
 ve_rel_evt.221.d:0 "이제 학교, 병원, 그리고 지역 위원회는 다양한 고백의 시민들에게 동등한 조건으로 봉사해야 합니다. 문제는 대표성이 지역적 현실을 따라야 하는가, 아니면 중앙에서 부과된 공식에 따라야 하는가 하는 점입니다."
 ve_rel_evt.221.a:0 "지역별로 대표성의 균형을 맞춘다."
 ve_rel_evt.221.b:0 "중앙 할당제를 설정한다."
 ve_rel_evt.221.c:0 "외교적 대표성 공식을 협상한다."

 ve_rel_evt.230.t:0 "중립적 등기부"
 ve_rel_evt.230.d:0 "출생, 결혼, 그리고 재산 명분이 종교적 관리자들로부터 민간 등기관으로 이전되고 있습니다. 관리들은 전환 기간 동안 중복 기록을 유지할 수 있지만, 개혁가들은 깔끔하고 즉각적인 단절을 요구합니다."
 ve_rel_evt.230.a:0 "전환 기간 동안 이중 기록을 유지한다."
 ve_rel_evt.230.b:0 "종교적 등기부를 즉시 폐쇄한다."
 ve_rel_evt.230.c:0 "훈련된 공공 서비스망을 배치한다."

 ve_rel_evt.231.t:0 "학교와 공공 의식"
 ve_rel_evt.231.d:0 "국가 중립성의 원칙이 학교 집회와 공공 의식에까지 이르렀습니다. 지역 공동체는 세습된 관습을 위한 여지를 원하지만, 중앙 관리들은 모호함을 남기지 않는 단 하나의 세속적 의전을 원합니다."
 ve_rel_evt.231.a:0 "지역 의식을 위한 여지를 남긴다."
 ve_rel_evt.231.b:0 "단 하나의 세속적 의전을 직권으로 명시한다."
 ve_rel_evt.231.c:0 "공동의 시민 의식 표준을 창설한다."

 ve_rel_evt.240.t:0 "세속 인력의 부족"
 ve_rel_evt.240.d:0 "새로운 행정부에는 종교 기관 없이 운영할 수 있는 교사, 등기관, 그리고 시찰관이 필요합니다. 훈련된 후보자가 너무 적으며, 기존 직원들에게 관행의 전환을 강요하면 저항을 불러일으킬 수 있습니다."
 ve_rel_evt.240.a:0 "새로운 인력 양성 프로그램을 자금 지원한다."
 ve_rel_evt.240.b:0 "기존 직원들이 적응하도록 강제한다."
 ve_rel_evt.240.c:0 "학술 훈련망을 구축한다."

 ve_rel_evt.241.t:0 "재산과 지하 예배"
 ve_rel_evt.241.d:0 "종교적 재산의 이전은 일부 신도들을 은둔으로 몰아넣었습니다. 즉각적인 몰수는 새로운 국가를 신속하게 갖추게 하겠지만, 성급한 합의는 사적 예배를 조직적인 반항으로 변질시킬 위험이 있습니다."
 ve_rel_evt.241.a:0 "재산을 점진적으로 이전한다."
 ve_rel_evt.241.b:0 "즉시 국유화한다."
 ve_rel_evt.241.c:0 "자산을 감독되는 복지 기관으로 진로를 돌린다."

 ve_rel_evt.290.t:0 "뿌리내리는 합의"
 ve_rel_evt.290.d:0 "전환기의 위기가 국가의 종교합의를 훼손하지 않고 지나갔습니다. 행정가들은 이제 새로운 규칙 안에서 일하고, 공동체들은 자리를 잡았으며, 정부는 이 경험을 개혁 역량이나 더욱 깊은 대중적 자신감으로 전환할 수 있습니다."
 ve_rel_evt.290.a:0 "다음 개혁에 교훈을 반영합니다."
 ve_rel_evt.290.a.tt:0 "#P 10#!의 종교개혁력을 획득합니다."
 ve_rel_evt.290.b:0 "공공연히 합의를 재확인합니다."
 ve_rel_evt.290.b.tt:0 "#P 3#!의 종교합의를 획득합니다."

 ve_rel_evt.291.t:0 "취약한 균형점"
 ve_rel_evt.291.d:0 "형식적인 전환은 완료되었으나, 새로운 합의는 확신보다는 조심스러운 타협에 머물러 있습니다. 이를 스스로 성숙해지도록 내버려두거나, 다른 제한적인 양보를 통해 강화하거나, 채택된 종교 제도에 적합한 기관들을 통해 안정시킬 수 있습니다."
 ve_rel_evt.291.a:0 "타협을 그대로 유지합니다."
 ve_rel_evt.291.a.tt:0 "추가적인 기계적 효과 없이 전환기가 종료됩니다."
 ve_rel_evt.291.b:0 "지막 타협안에 재정을 투입합니다."
 ve_rel_evt.291.b.tt:0 "#N 10#!의 종교개혁력을 소모하고 #P 3#!의 종교합의를 획득합니다."
 ve_rel_evt.291.c:0 "제도에 적합한 기관들에 합의를 위임합니다."
 ve_rel_evt.291.c.tt:0 "#N 5#!의 종교개혁력을 소모하고 #P 2#!의 종교합의를 획득합니다. 채택된 종교 제도에 적합한 이념이 필요합니다."

 ve_rel_evt.292.t:0 "합의의 위기"
 ve_rel_evt.292.d:0 "전환기 변화 요인이 만료되었음에도 국가는 새로운 종교 질서를 수용하지 못했습니다. 정부는 부족한 개혁 역량을 비상 타협안에 쏟아붓거나, 더 좁은 범위의 개입을 위해 제도 적합 기관들에 의존하거나, 해결되지 않은 갈등이 인구의 일부를 급진화하도록 방치할 수 있습니다."
 ve_rel_evt.292.a:0 "비상 타협안의 대가를 지불합니다."
 ve_rel_evt.292.a.tt:0 "#N 15#!의 종교개혁력을 소모하고 #P 5#!의 종교합의를 획득합니다."
 ve_rel_evt.292.b:0 "국가에게 남은 양보안은 없습니다."
 ve_rel_evt.292.b.tt:0 "국가 인구의 #N 0.25%#!가 급진파가 됩니다."
 ve_rel_evt.292.c:0 "이 합의를 위해 구축된 기관들을 사용합니다."
 ve_rel_evt.292.c.tt:0 "#N 5#!의 종교개혁력을 소모하고 #P 2#!의 종교합의를 획득합니다. 채택된 종교 제도에 적합한 이념이 필요합니다."

 ve_identity_transition_conciliatory_tt:0 "#N 10#!의 문화위임력을 소모하고 #P 3#!의 국민통합도를 획득합니다."
 ve_identity_transition_central_tt:0 "#P 5#!의 문화위임력을 획득하고 #N 3#!의 국민통합도를 잃습니다."
 ve_identity_transition_doctrine_tt:0 "#N 5#!의 문화위임력을 소모하고 #P 2#!의 국민통합도를 획득합니다."

 ve_cul_evt.210.t:0 "국가의 공식 언어"
 ve_cul_evt.210.d:0 "새로운 국가 콤팩트에는 법원, 학교, 공공 서비스를 위한 공통 언어가 필요합니다. 즉각적인 단일화는 행정하기에 쉽겠지만, 많은 숙련된 관료와 시민들은 아직 제안된 기준을 충족할 수 없습니다."
 ve_cul_evt.210.a:0 "단계적 교육을 통해 언어를 도입합니다."
 ve_cul_evt.210.b:0 "단일 언어령을 공포합니다."
 ve_cul_evt.210.c:0 "민족주의 행정부를 동원합니다."

 ve_cul_evt.211.t:0 "복무와 소속"
 ve_cul_evt.211.d:0 "군사 복무와 제대 군인 신분이 국가 소속의 증거가 되고 있습니다. 새로운 콤팩트에 편입된 공동체들은 적응할 시간을 요구하는 반면, 중앙 정부는 소속감이 하나의 획일적인 의무를 지녀야 한다고 고집합니다."
 ve_cul_evt.211.a:0 "전환기 면제 조치를 부여합니다."
 ve_cul_evt.211.b:0 "하나의 복무 의무를 적용합니다."
 ve_cul_evt.211.c:0 "보편적 복무 등록부를 생성합니다."

 ve_cul_evt.220.t:0 "평등 시민권 등록부"
 ve_cul_evt.220.d:0 "과거의 민족 및 종교 범주들이 공공 기록에 여전히 박혀 있습니다. 이를 즉시 제거하는 것은 평등한 시민권을 선언하는 일이 되겠지만, 지역 관청들은 서두른 개정이 명분을 말살하고 서비스 접근을 교란할 수 있다고 경고합니다."
 ve_cul_evt.220.a:0 "공통 시민권 등록부를 단계적으로 도입합니다."
 ve_cul_evt.220.b:0 "기존 범주들을 즉시 제거합니다."
 ve_cul_evt.220.c:0 "개혁 위원회 감독하에 전환을 진행합니다."

 ve_cul_evt.221.t:0 "보통학교, 보통공무"
 ve_cul_evt.221.d:0 "평등한 접근권은 법에 명시되어 있으나, 학교와 관공서에는 이를 실현할 인력이 턱없이 부족합니다. 정부는 인내심 있는 투자, 강제 가능한 하나의 중앙 표준, 그리고 학술 자격의 전국적 망 구축 중 하나를 선택해야 합니다."
 ve_cul_evt.221.a:0 "교사와 공무원에 투자합니다."
 ve_cul_evt.221.b:0 "하나의 중앙 표준을 강제합니다."
 ve_cul_evt.221.c:0 "학술 자격망을 구축합니다."

 ve_cul_evt.230.t:0 "구성 민족 평의회"
 ve_cul_evt.230.d:0 "복합협약에 명시된 공동체들은 행정 참여권을 요구하고 있습니다. 공개 협상을 통해 정통성을 얻을 수도 있으나, 수도에서 입안한 고정 할당제는 더욱 신속하고 예측 가능한 합의를 약속합니다."
 ve_cul_evt.230.a:0 "대표 협상을 개시합니다."
 ve_cul_evt.230.b:0 "수도의 고정 할당제를 부과합니다."
 ve_cul_evt.230.c:0 "의회 타협을 중재합니다."

 ve_cul_evt.231.t:0 "다중 행정"
 ve_cul_evt.231.d:0 "이제 지방 권력과 중앙 표준이 복합국가 전반에서 겹치고 있습니다. 명확한 규약이 없다면 모든 관청이 권한 한계를 매번 새로 협상하게 될 것이며, 너무 엄격한 지휘 체계는 협약의 의미를 퇴색시킬 수 있습니다."
 ve_cul_evt.231.a:0 "관한 규약을 협상합니다."
 ve_cul_evt.231.b:0 "중앙 지휘 체계를 확립합니다."
 ve_cul_evt.231.c:0 "공동 관료 장부를 생성합니다."

 ve_cul_evt.290.t:0 "새로운 국민협약"
 ve_cul_evt.290.d:0 "반발이 가라앉고 국가 구성원에 대한 새로운 정의가 뿌리내렸습니다. 정부는 행정적 교훈을 문화위임력으로 보존하거나, 이번 기회를 활용해 협약에 대한 자신감을 강화할 수 있습니다."
 ve_cul_evt.290.a:0 "경험치를 미래의 국정 운영으로 이어갑니다."
 ve_cul_evt.290.a.tt:0 "문화위임력을 #P 10#! 획득합니다."
 ve_cul_evt.290.b:0 "전국적으로 협약을 경축합니다."
 ve_cul_evt.290.b.tt:0 "국민통합도를 #P 3#! 획득합니다."

 ve_cul_evt.291.t:0 "취약한 협약"
 ve_cul_evt.291.d:0 "식민적 전환은 끝났으나 새로운 국가 정체성은 아직 고르게 수용되지 않았습니다. 정부는 타협안이 무르익도록 내버려두거나, 제한된 위임력을 소비해 또 다른 조정을 도모하거나, 채택된 모델에 적합한 기관을 통해 이를 강화할 수 있습니다."
 ve_cul_evt.291.a:0 "타협안이 스스로 수지를 찾도록 둡니다."
 ve_cul_evt.291.a.tt:0 "추가적인 메커니즘 효과 없이 전환이 종료됩니다."
 ve_cul_evt.291.b:0 "마지막 조정에 자금을 지원합니다."
 ve_cul_evt.291.b.tt:0 "문화위임력을 #N 10#! 소모하고 국민통합도를 #P 3#! 획득합니다."
 ve_cul_evt.291.c:0 "모델에 부합하는 기관에 협약을 맡깁니다."
 ve_cul_evt.291.c.tt:0 "문화위임력을 #N 5#! 소모하고 국민통합도를 #P 2#! 획득합니다. 채택된 정체성 제도에 적합한 이념이 필요합니다."

 ve_cul_evt.292.t:0 "국민협약의 위기"
 ve_cul_evt.292.d:0 "전환 반발이 소멸했음에도 불구하고, 소속감에 대한 새로운 정의는 광범위한 충성도를 이끌어내지 못했습니다. 정부는 부족한 위임력을 비상 조정에 쏟아붓거나, 모델에 부합하는 기관에 의존해 더 제한적인 개입을 하거나, 급진화의 물결을 받아들여야 합니다."
 ve_cul_evt.292.a:0 "비상 조정에 비용을 지불합니다."
 ve_cul_evt.292.a.tt:0 "문화위임력을 #N 15#! 소모하고 국민통합도를 #P 5#! 획득합니다."
 ve_cul_evt.292.b:0 "정부는 명시된 대로 협약을 집행할 것입니다."
 ve_cul_evt.292.b.tt:0 "국가 인구의 #N 0.25%#!가 급진파가 됩니다."
 ve_cul_evt.292.c:0 "이 정체성을 위해 구축된 기관을 활용합니다."
 ve_cul_evt.292.c.tt:0 "문화위임력을 #N 5#! 소모하고 국민통합도를 #P 2#! 획득합니다. 채택된 정체성 제도에 적합한 이념이 필요합니다."
