l_french:
 ve_je_religious_project:0 "Projet religieux"
 ve_je_religious_project_reason:0 "Le gouvernement dirige un projet religieux à long terme. Sa progression est régie par la capacité administrative, la légitimité politique, les conditions religieuses et les événements dans l’État cible."
 ve_je_religious_project_progress:0 "Progression du projet religieux vers son achèvement"
 ve_je_religious_project_status_confessional:0 "La conversion confessionnelle dans [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] cherche à étendre la religion d’État par le biais d’une campagne organisée.\n\nAchèvement à #Y 125#! de progression : convertit 5% de la population de l’État cible à la religion d’État, rembourse #P 20#! de Fonds de réforme pieuse et ajoute #P 5#! d’arrangement religieux."
 ve_je_religious_project_status_freedom:0 "Le rayonnement tolérant dans [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] bâtit un établissement fondé sur la conscience et l’association volontaire.\n\nAchèvement à #Y 100#! de progression : ajoute des loyalistes dans l’État sans conversion forcée, rembourse #P 20#! de Fonds de réforme pieuse et ajoute #P 7#! d’arrangement religieux."
 ve_je_religious_project_status_secularization:0 "La campagne de laïcisation dans [ROOT.GetCountry.MakeScope.Var('ve_religious_project_target_state').GetState.GetName] réduit l’autorité publique de la religion organisée.\n\nAchèvement à #Y 150#! de progression : convertit 5% de la population de l’État cible à l’athéisme, rembourse #P 25#! de Fonds de réforme pieuse et ajoute #P 8#! d’arrangement religieux."
 ve_je_religious_project_complete_tt:0 "Le projet religieux a atteint son objectif."
 ve_je_religious_project_fail_tt:0 "Le projet religieux a été annulé."

 ve_je_cultural_project:0 "Projet culturel"
 ve_je_cultural_project_reason:0 "Le gouvernement dirige un projet culturel à long terme. La capacité administrative, la légitimité, l’éducation, la cohésion nationale et les conditions locales en déterminent le rythme."
 ve_je_cultural_project_progress:0 "Progression du projet culturel vers son achèvement"
 ve_je_cultural_project_status_curriculum:0 "Un programme d’enseignement national est en préparation pour les écoles et institutions du pays.\n\nAchèvement à #Y 100#! de progression : #P +20#! de mandat culturel, #P +5#! de cohésion nationale, et un résultat sur 10 ans de +2% d’accès à l’éducation, +5% de qualifications, -25 de bureaucratie."
 ve_je_cultural_project_status_symbols:0 "Un programme de symboles communs forge un vocabulaire civique partagé.\n\nAchèvement à #Y 75#! de progression : #P +20#! de mandat culturel, #P +7#! de cohésion nationale, et un résultat sur 8 ans de +10% de loyalistes parmi les groupes sociaux pleinement acceptés et +25 d’autorité."
 ve_je_cultural_project_status_ethnic:0 "La campagne d’intégration ethnique dans [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] pousse une population minoritaire vers la culture principale.\n\nAchèvement à #Y 125#! de progression : convertit 5% des groupes sociaux de la culture cible à la culture principale (7% avec Nationaliste VII), #P +25#! de mandat culturel, #P +8#! de cohésion nationale, et un résultat d’assimilation sur 10 ans."
 ve_je_cultural_project_status_civic:0 "L’initiative d’égalité civique dans [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] étend un statut civique commun par-delà les frontières culturelles.\n\nAchèvement à #Y 100#! de progression : +15% d’acceptation pendant 10 ans, des loyalistes dans l’État, #P +25#! de mandat culturel, #P +10#! de cohésion nationale, et un résultat sur les qualifications et la migration sur 10 ans."
 ve_je_cultural_project_status_composite:0 "Le pacte constituant dans [ROOT.GetCountry.MakeScope.Var('ve_cultural_project_target_state').GetState.GetName] négocie une reconnaissance permanente au sein d’un État composite.\n\nAchèvement à #Y 150#! de progression (requiert 40+ de cohésion nationale) : +15% d’acceptation permanente, ajoute la culture à la liste constitutive, des loyalistes dans l’État, #P +30#! de mandat culturel, #P +12#! de cohésion nationale."
 ve_je_cultural_project_complete_tt:0 "Le projet culturel a atteint son objectif."
 ve_je_cultural_project_fail_tt:0 "Le projet culturel a été annulé."
 ve_je_project_resolving_status:0 "L’administration du projet dépose son rapport final."

 ve_evt_religious_incident_cooldown_mdf:0 "Délai de récupération d’incident du projet religieux"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "L’administration du projet absorbe les conséquences d’un incident récent."
 ve_evt_cultural_incident_cooldown_mdf:0 "Délai de récupération d’incident du projet culturel"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "L’administration du projet absorbe les conséquences d’un incident récent."
 ve_evt_central_clergy_supported_mdf:0 "Clergé central soutenu"
 ve_evt_central_clergy_supported_mdf_desc:0 "Le gouvernement a défendu l’autorité de la hiérarchie religieuse centrale."
 ve_evt_central_clergy_slighted_mdf:0 "Clergé central méprisé"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Le gouvernement a privilégié la pratique locale aux dépens des préférences de la hiérarchie religieuse centrale."
 ve_evt_municipal_patronage_mdf:0 "Réseaux de patronage municipal"
 ve_evt_municipal_patronage_mdf_desc:0 "Des notables locaux font avancer le projet par le biais d’arrangements qui affaiblissent la collecte d’impôts."

 ve_rel_evt.1.t:0 "La pétition des notables locaux"
 ve_rel_evt.1.d:0 "Une délégation de clercs, de personnalités municipales et d'anciens de quartier de [SCOPE.sState('ve_evt_target_state').GetName] a pétitionné auprès du Gouvernement pour ralentir la Conversion confessionnelle. Ils avertissent qu'un calendrier inflexible transformera l'obéissance en un ressentiment durable."
 ve_rel_evt.1.f:0 "\"Une foi imposée sans consultation peut remplir les registres tout en vidant les bancs des églises.\""
 ve_rel_evt.1.a:0 "Entendre leur pétition."
 ve_rel_evt.1.a.tt:0 "La progression du Projet religieux diminue de #N 4#!.\nL'établissement religieux augmente de #P 3#!."
 ve_rel_evt.1.b:0 "Le calendrier ne changera pas."
 ve_rel_evt.1.b.tt:0 "La progression du Projet religieux augmente de #P 5#!.\nL'établissement religieux diminue de #N 2#!.\n#N 0.5%#! de la Population de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_rel_evt.1.c:0 "Mandater des intermédiaires de confiance."
 ve_rel_evt.1.c.tt:0 "Dépenser #N 10#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 3#!.\nL'établissement religieux augmente de #P 1#!."

 ve_rel_evt.2.t:0 "Une Pénurie d'officiers de terrain"
 ve_rel_evt.2.d:0 "Des rapports en provenance de [SCOPE.sState('ve_evt_target_state').GetName] font état de requêtes sans réponse, d'instructions contradictoires et de districts n'ayant pas vu un agent de projet depuis des semaines. La Conversion confessionnelle devance l'administration chargée de la mener à bien."
 ve_rel_evt.2.f:0 "\"Un Décret peut traverser le pays en un jour. Un commis compétent ne le peut pas.\""
 ve_rel_evt.2.a:0 "Engager des officiers de terrain temporaires."
 ve_rel_evt.2.a.tt:0 "Dépenser #N 15#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 4#!."
 ve_rel_evt.2.b:0 "Ralentir le programme."
 ve_rel_evt.2.b.tt:0 "La progression du Projet religieux diminue de #N 6#!.\nL'établissement religieux augmente de #P 2#!."
 ve_rel_evt.2.c:0 "Recourir aux cadres du registre central."
 ve_rel_evt.2.c.tt:0 "Dépenser #N 10#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 5#!."

 ve_cul_evt.1.t:0 "Les bureaux de traduction"
 ve_cul_evt.1.d:0 "Les fonctionnaires de [SCOPE.sState('ve_evt_target_state').GetName] sont en désaccord sur la manière dont l'Initiative d’égalité civique devrait traiter la langue [SCOPE.sCulture('ve_evt_target_culture').GetName]. Les administrateurs locaux souhaitent des bureaux bilingues ; les ministères centraux exigent une norme administrative unique."
 ve_cul_evt.1.f:0 "\"Un citoyen ne devrait pas avoir besoin d'un interprète pour comprendre les droits accordés en son propre nom.\""
 ve_cul_evt.1.a:0 "Laisser vivre les langues locales dans les institutions publiques."
 ve_cul_evt.1.a.tt:0 "La progression du Projet culturel diminue de #N 4#!.\nLa Cohésion nationale augmente de #P 3#!."
 ve_cul_evt.1.b:0 "Imposer une norme administrative unique."
 ve_cul_evt.1.b.tt:0 "La progression du Projet culturel augmente de #P 5#!.\nLa Cohésion nationale diminue de #N 2#!.\n#N 0.5%#! de la Population [SCOPE.sCulture('ve_evt_target_culture').GetName] de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_cul_evt.1.c:0 "Établir une commission de traduction académique."
 ve_cul_evt.1.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du Projet culturel augmente de #P 3#!.\nLa Cohésion nationale augmente de #P 1#!."

 ve_cul_evt.2.t:0 "Une Pénurie d'instituteurs locaux"
 ve_cul_evt.2.d:0 "Les écoles de [SCOPE.sState('ve_evt_target_state').GetName] manquent d'enseignants capables de servir à la fois le programme de l'État et les communautés [SCOPE.sCulture('ve_evt_target_culture').GetName]. Faute de cadres locaux formés, l'égalité civique risque de n'être qu'une promesse inscrite sur le seul papier officiel."
 ve_cul_evt.2.f:0 "\"La Loi décrète l'égalité en un après-midi ; la classe doit l'enseigner pendant une génération.\""
 ve_cul_evt.2.a:0 "Financer de nouvelles écoles normales d'instituteurs."
 ve_cul_evt.2.a.tt:0 "Dépenser #N 15#! Mandat culturel.\nLa progression du Projet culturel augmente de #P 4#!."
 ve_cul_evt.2.b:0 "Ralentir l'application."
 ve_cul_evt.2.b.tt:0 "La progression du Projet culturel diminue de #N 6#!.\nLa Cohésion nationale augmente de #P 2#!."
 ve_cul_evt.2.c:0 "Utiliser les institutions déjà en place."
 ve_cul_evt.2.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du Projet culturel augmente de #P 5#!.\nLa Cohésion nationale augmente de #P 1#!."

 ve_rel_evt.3.t:0 "Registres contradictoires"
 ve_rel_evt.3.d:0 "Les registres paroissiaux, les livres de comptes municipaux et les rapports des agents de projet donnent des comptes rendus incompatibles de l'adhésion religieuse dans [SCOPE.sState('ve_evt_target_state').GetName]. L'administration doit décider s'il convient de perdre du temps à établir la vérité ou de procéder avec des chiffres qu'elle sait incertains."
 ve_rel_evt.3.f:0 "\"Chaque bureau possède un total exact. Aucun total ne correspond.\""
 ve_rel_evt.3.a:0 "Mener un audit complet."
 ve_rel_evt.3.a.tt:0 "Gagner #P 8#! de Fonds de réforme pieuse.\nLa progression du projet religieux diminue de #N 6#!."
 ve_rel_evt.3.b:0 "Procéder avec des estimations raisonnables."
 ve_rel_evt.3.b.tt:0 "Dépenser #N 8#! de Fonds de réforme pieuse.\nLa progression du projet religieux augmente de #P 5#!."
 ve_rel_evt.3.c:0 "Utiliser les registres de l'administration sacrée."
 ve_rel_evt.3.c.tt:0 "La progression du projet religieux augmente de #P 3#!."

 ve_rel_evt.4.t:0 "Rumeurs et contre-prédication"
 ve_rel_evt.4.d:0 "Des pamphlets, des sermons de rue et des rumeurs anxieuses décrivent désormais la Conversion confessionnelle dans [SCOPE.sState('ve_evt_target_state').GetName] comme une agression contre la vie locale. Les fonctionnaires préviennent que le silence permettra aux opposants de définir le projet, tandis que la répression pourrait confirmer leurs pires affirmations."
 ve_rel_evt.4.f:0 "\"Une rumeur ne requiert ni bureau, ni sceau, ni budget.\""
 ve_rel_evt.4.a:0 "Tenir des audiences publiques."
 ve_rel_evt.4.a.tt:0 "La progression du projet religieux diminue de #N 3#!.\nL'établissement religieux augmente de #P 3#!.\n#P 0.5%#! de la population dans [SCOPE.sState('ve_evt_target_state').GetName] devient Loyaliste."
 ve_rel_evt.4.b:0 "Punir les Militants."
 ve_rel_evt.4.b.tt:0 "La progression du projet religieux augmente de #P 4#!.\nL'établissement religieux diminue de #N 3#!.\n#N 1%#! de la population dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_rel_evt.4.c:0 "Publier les dossiers et les résultats."
 ve_rel_evt.4.c.tt:0 "Dépenser #N 10#! de Fonds de réforme pieuse.\nLa progression du projet religieux augmente de #P 2#!.\nL'établissement religieux augmente de #P 1#!."

 ve_rel_evt.5.t:0 "La langue du sermon"
 ve_rel_evt.5.d:0 "Le clergé du projet dans [SCOPE.sState('ve_evt_target_state').GetName] rapporte que les sermons formels préservent l'unité doctrinale mais ne parviennent pas à toucher de nombreux fidèles. Une prédication en langue locale ferait avancer la campagne, bien que la hiérarchie centrale craigne que cette adaptation ne devienne de l'indépendance."
 ve_rel_evt.5.f:0 "\"Une parole sacrée non entendue est parfaitement préservée — et reçue par personne.\""
 ve_rel_evt.5.a:0 "Prêcher dans les langues locales."
 ve_rel_evt.5.a.tt:0 "La progression du projet religieux augmente de #P 6#!.\nLes Croyants perdent #N 1#! d'Approbation pendant #Y 2.5 ans#!."
 ve_rel_evt.5.b:0 "Préserver l'unité liturgique."
 ve_rel_evt.5.b.tt:0 "La progression du projet religieux diminue de #N 3#!.\nL'établissement religieux augmente de #P 3#!.\nLes Croyants gagnent #P 1#! d'Approbation pendant #Y 2.5 ans#!."
 ve_rel_evt.5.c:0 "Former des interprètes instruits."
 ve_rel_evt.5.c.tt:0 "Dépenser #N 10#! de Fonds de réforme pieuse.\nLa progression du projet religieux augmente de #P 4#!.\nL'établissement religieux augmente de #P 1#!."

 ve_rel_evt.6.t:0 "Autorités ecclésiastiques rivales"
 ve_rel_evt.6.d:0 "Les personnalités nommées par le centre et le clergé local établi dans [SCOPE.sState('ve_evt_target_state').GetName] revendiquent chacun le droit de diriger la Conversion confessionnelle. Soutenir l'un ou l'autre camp pourrait rétablir le Commandement rapidement, mais le différend est déjà devenu un test pour savoir qui parle au nom de la foi."
 ve_rel_evt.6.f:0 "\"La querelle concerne la juridiction, ce qui est la manière dont les institutions décrivent le pouvoir.\""
 ve_rel_evt.6.a:0 "Soutenir le clergé central."
 ve_rel_evt.6.a.tt:0 "La progression du projet religieux augmente de #P 5#!.\nLes Croyants gagnent #P 1#! d'Approbation pendant #Y 2.5 ans#!.\nL'établissement religieux diminue de #N 3#!.\n#N 0.5%#! de la population dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_rel_evt.6.b:0 "Apaiser le clergé local."
 ve_rel_evt.6.b.tt:0 "La progression du projet religieux diminue de #N 4#!.\nLes Croyants perdent #N 1#! d'Approbation pendant #Y 2.5 ans#!.\nL'établissement religieux augmente de #P 3#!."
 ve_rel_evt.6.c:0 "Définir leurs pouvoirs par écrit."
 ve_rel_evt.6.c.tt:0 "Dépenser #N 10#! de Fonds de réforme pieuse.\nLa progression du projet religieux augmente de #P 3#!.\nL'établissement religieux augmente de #P 1#!."

 ve_cul_evt.3.t:0 "Les catégories du recensement"
 ve_cul_evt.3.d:0 "Les agents du recensement de [SCOPE.sState('ve_evt_target_state').GetName] ne parviennent pas à s'accorder sur la manière d'enregistrer les citoyens de culture [SCOPE.sCulture('ve_evt_target_culture').GetName]. Les répondants locaux emploient des identités superposées, tandis que les formulaires centraux exigent une seule réponse dans une seule case."
 ve_cul_evt.3.f:0 "\"Une catégorie simplifie les registres bien avant de simplifier le pays.\""
 ve_cul_evt.3.a:0 "Permettre l'auto-identification."
 ve_cul_evt.3.a.tt:0 "La progression du Projet culturel diminue de #N 4#!.\nLa cohésion nationale augmente de #P 4#!."
 ve_cul_evt.3.b:0 "Les catégories seront fixées de manière centralisée."
 ve_cul_evt.3.b.tt:0 "La progression du Projet culturel augmente de #P 6#!.\nLa cohésion nationale diminue de #N 4#!.\n#N 0.5%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] à [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_cul_evt.3.c:0 "Utiliser le système d'enregistrement moderne."
 ve_cul_evt.3.c.tt:0 "Dépenser #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 1#!."

 ve_cul_evt.4.t:0 "Les notables municipaux"
 ve_cul_evt.4.d:0 "Des figures tutélaires municipales à [SCOPE.sState('ve_evt_target_state').GetName] offrent leurs bureaux, leurs clients et leur influence pour faire avancer l'égalité civique de la population [SCOPE.sCulture('ve_evt_target_culture').GetName]. Leur coopération serait prompte, mais leur prix est le maintien du contrôle sur les revenus locaux."
 ve_cul_evt.4.f:0 "\"Le chemin le plus court vers l'hôtel de ville passe par plusieurs salons privés.\""
 ve_cul_evt.4.a:0 "Faire appel aux réseaux locaux."
 ve_cul_evt.4.a.tt:0 "La progression du Projet culturel augmente de #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] perd #N 5%#! de Capacité d'impôt pendant #Y 2 ans#!."
 ve_cul_evt.4.b:0 "Créer des conseils ouverts."
 ve_cul_evt.4.b.tt:0 "La progression du Projet culturel diminue de #N 3#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.4.c:0 "Négocier un accord fondé sur des règles."
 ve_cul_evt.4.c.tt:0 "Dépenser #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 3#!.\nLa cohésion nationale augmente de #P 1#!."

 ve_cul_evt.5.t:0 "Les concours de la Fonction publique"
 ve_cul_evt.5.d:0 "L'ouverture des concours de la Fonction publique aux candidats [SCOPE.sCulture('ve_evt_target_culture').GetName] a mis en lumière un fossé entre l'égalité juridique et la préparation pratique. Un accès immédiat serait symboliquement puissant, mais des années de scolarité inégale ne sauraient être effacées par décret."
 ve_cul_evt.5.f:0 "\"Le même examen ne constitue pas la même opportunité lorsqu'un seul candidat a été instruit dans sa langue.\""
 ve_cul_evt.5.a:0 "Financer des cours préparatoires."
 ve_cul_evt.5.a.tt:0 "Dépenser #N 15#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 2#!."
 ve_cul_evt.5.b:0 "L'égal accès commence immédiatement."
 ve_cul_evt.5.b.tt:0 "La progression du Projet culturel augmente de #P 7#!.\nLa cohésion nationale diminue de #N 4#!.\n#N 0.5%#! de la population à [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_cul_evt.5.c:0 "Mobiliser les réseaux scolaires et de bien-être."
 ve_cul_evt.5.c.tt:0 "Dépenser #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 2#!."
 ve_cul_evt.5.e:0 "Réformer d'abord le système des examens."
 ve_cul_evt.5.e.tt:0 "La progression du Projet culturel diminue de #N 4#!.\nLa cohésion nationale augmente de #P 3#!."

 ve_cul_evt.6.t:0 "La majorité contre-attaque"
 ve_cul_evt.6.d:0 "Les opposants à l'Initiative d'égalité civique soutiennent que l'octroi de droits communs à la population [SCOPE.sCulture('ve_evt_target_culture').GetName] diminue la position de tous les autres. Les manifestations à [SCOPE.sState('ve_evt_target_state').GetName] transforment une réforme administrative en épreuve de force politique nationale."
 ve_cul_evt.6.f:0 "\"Un droit partagé est présenté comme un privilège dérobé.\""
 ve_cul_evt.6.a:0 "Défendre l'initiative au grand jour."
 ve_cul_evt.6.a.tt:0 "La progression du Projet culturel augmente de #P 4#!.\nLa cohésion nationale diminue de #N 4#!.\n#N 1%#! de la population à [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_cul_evt.6.b:0 "Ralentir le rythme de la mise en œuvre."
 ve_cul_evt.6.b.tt:0 "La progression du Projet culturel diminue de #N 5#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.6.c:0 "Mobiliser la coalition réformatrice."
 ve_cul_evt.6.c.tt:0 "Dépenser #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 3#!.\nLa cohésion nationale augmente de #P 2#!.\n#P 0.5%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] à [SCOPE.sState('ve_evt_target_state').GetName] devient Loyaliste."

 ve_rel_evt.7.t:0 "La mission au point de rupture"
 ve_rel_evt.7.d:0 "La Conversion confessionnelle dans l'État de [SCOPE.sState('ve_evt_target_state').GetName] est proche de l'effondrement administratif et politique. Les bureaux ont cessé de se répondre, la résistance publique se durcit et le clergé de terrain prévient que la mission ne peut se poursuivre dans les conditions actuelles."
 ve_rel_evt.7.f:0 "\"Les rapports parlent encore d'une difficulté passagère. Les rues ont choisi un nom plus dur.\""
 ve_rel_evt.7.a:0 "Accepter les pertes et se retirer."
 ve_rel_evt.7.a.tt:0 "Annule le Projet religieux sans remboursement de Fonds de réforme pieuse.\nL'Arrangement religieux diminue de #N 5#!.\nPendant #Y 2 ans#! : #N -50#! Bureaucratie, #N -50#! Autorité et #N -3%#! de Succès de la promulgation de loi."
 ve_rel_evt.7.b:0 "Transférer des ressources d'urgence."
 ve_rel_evt.7.b.tt:0 "Dépense #N 25#! Fonds de réforme pieuse.\nLa Progression du Projet religieux diminue de #N 5#!.\n#N 1%#! de la population de l'État de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet continue."
 ve_rel_evt.7.c:0 "Continuer avec un personnel réduit."
 ve_rel_evt.7.c.tt:0 "La Progression du Projet religieux diminue de #N 10#!.\nL'Arrangement religieux diminue de #N 2#!.\nLe projet continue."
 ve_rel_evt.7.e:0 "Renégocier la méthode."
 ve_rel_evt.7.e.tt:0 "Dépense #N 15#! Fonds de réforme pieuse.\nLa Progression du Projet religieux diminue de #N 3#!.\nL'Arrangement religieux augmente de #P 2#!.\n#N 0.5%#! de la population de l'État de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet continue."

 ve_cul_evt.7.t:0 "L'initiative perd sa légitimité"
 ve_cul_evt.7.d:0 "L'Initiative d’égalité civique dans l'État de [SCOPE.sState('ve_evt_target_state').GetName] perd le soutien des institutions établies et des communautés [SCOPE.sCulture('ve_evt_target_culture').GetName] qu'elle était censée servir. Les mouvements radicaux présentent désormais chaque compromis comme la preuve que le gouvernement est incapable d'instaurer l'égalité."
 ve_cul_evt.7.f:0 "\"Une réforme peut survivre à l'opposition. Elle ne peut survivre au fait de devenir incroyable.\""
 ve_cul_evt.7.a:0 "Mettre fin à l'initiative."
 ve_cul_evt.7.a.tt:0 "Annule le Projet culturel sans remboursement de Mandat culturel.\nLa Cohésion nationale diminue de #N 5#!.\nPendant #Y 2 ans#! : #N -50#! Bureaucratie, #N -25#! Autorité et #N -3%#! de Succès de la promulgation de loi."
 ve_cul_evt.7.b:0 "Accorder des subventions locales d'urgence."
 ve_cul_evt.7.b.tt:0 "Dépense #N 25#! Mandat culturel.\nLa Progression du Projet culturel diminue de #N 5#!.\n#N 1%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] de l'État de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet continue."
 ve_cul_evt.7.c:0 "Continuer avec un programme minimal."
 ve_cul_evt.7.c.tt:0 "La Progression du Projet culturel diminue de #N 10#!.\nLa Cohésion nationale diminue de #N 2#!.\nLe projet continue."
 ve_cul_evt.7.e:0 "Rebâtir la coalition."
 ve_cul_evt.7.e.tt:0 "Dépense #N 15#! Mandat culturel.\nLa Progression du Projet culturel diminue de #N 3#!.\nLa Cohésion nationale augmente de #P 2#!.\n#N 0.5%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] de l'État de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet continue."

 ve_rel_evt.8.t:0 "Un accord local inattendu"
 ve_rel_evt.8.d:0 "Le clergé, les fonctionnaires municipaux et les anciens de la communauté de l'État de [SCOPE.sState('ve_evt_target_state').GetName] ont conclu un accord qu'aucune directive centrale n'aurait pu produire. La résistance locale recule, les fidèles coordonnent eux-mêmes la mission et la Conversion confessionnelle a acquis un dynamisme inattendu."
 ve_rel_evt.8.f:0 "\"Ce qui a commencé comme un ordre de la capitale est devenu un pacte forgé sur la place du village.\""
 ve_rel_evt.8.a:0 "Exploiter pleinement ce dynamisme."
 ve_rel_evt.8.a.tt:0 "L'Arrangement religieux augmente de #P 1#!.\nLa Progression du Projet religieux augmente de #P 25#!.\nSi la Progression atteint #Y 100#!, l'effet de fin normal du projet est appliqué."
 ve_rel_evt.8.b:0 "La durabilité avant la vitesse."
 ve_rel_evt.8.b.tt:0 "L'Arrangement religieux augmente de #P 4#!.\nLa Progression du Projet religieux augmente de #P 10#!.\nSi la Progression atteint #Y 100#!, l'effet de fin normal du projet est appliqué."

 ve_cul_evt.8.t:0 "Une coalition civique locale"
 ve_cul_evt.8.d:0 "Enseignants, fonctionnaires municipaux, associations professionnelles et représentants de la communauté [SCOPE.sCulture('ve_evt_target_culture').GetName] dans l'État de [SCOPE.sState('ve_evt_target_state').GetName] ont formé un comité commun. En résolvant les différends avant qu'ils n'atteignent la capitale, cette coalition a conféré à l'Initiative d’égalité civique un dynamisme que l'administration ne pouvait fabriquer."
 ve_cul_evt.8.f:0 "\"La citoyenneté est devenue réelle lorsque des institutions qui partageaient rarement une même table ont commencé à partager les responsabilités.\""
 ve_cul_evt.8.a:0 "Utiliser le dynamisme de la coalition."
 ve_cul_evt.8.a.tt:0 "La Cohésion nationale augmente de #P 1#!.\nLa Progression du Projet culturel augmente de #P 25#!.\nSi la Progression atteint #Y 100#!, l'effet de fin normal du projet est appliqué."
 ve_cul_evt.8.b:0 "Rendre les institutions permanentes."
 ve_cul_evt.8.b.tt:0 "La Cohésion nationale augmente de #P 4#!.\nLa Progression du Projet culturel augmente de #P 10#!.\nSi la Progression atteint #Y 100#!, l'effet de fin normal du projet est appliqué."

 ve_rel_evt.40.t:0 "Registres discordants"
 ve_rel_evt.40.d:0 "Les registres provinciaux de [SCOPE.sState('ve_evt_target_state').GetName] emploient des catégories incompatibles pour les congrégations, les associations civiques et les institutions publiques. Les rapports parvenant à la capitale se contredisent désormais, empêchant le projet de distinguer l'obéissance de la résistance."
 ve_rel_evt.40.f:0 "\"Une politique administrée au travers de trois registres ne tarde pas à engendrer trois réalités différentes.\""
 ve_rel_evt.40.a:0 "Envoyer un audit central."
 ve_rel_evt.40.a.tt:0 "Dépense de #N 10#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 5#!.\nL'implantation religieuse augmente de #P 1#!."
 ve_rel_evt.40.b:0 "Réconcilier les registres localement."
 ve_rel_evt.40.b.tt:0 "La progression du Projet religieux diminue de #N 3#!.\nL'implantation religieuse augmente de #P 2#!."
 ve_rel_evt.40.c:0 "Appliquer la procédure d'enregistrement standard."
 ve_rel_evt.40.c.tt:0 "Dépense de #N 5#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 4#!.\nL'implantation religieuse augmente de #P 1#!."

 ve_rel_evt.41.t:0 "Pénurie de personnel provincial"
 ve_rel_evt.41.d:0 "Les bureaux dirigeant le projet à [SCOPE.sState('ve_evt_target_state').GetName] ne parviennent pas à trouver un nombre suffisant d'employés de bureau, d'enseignants et d'inspecteurs formés. Les directives s'accumulent plus vite que les fonctionnaires locaux ne peuvent les interpréter, et des nominations hâtives menacent d'aggraver chaque litige."
 ve_rel_evt.41.f:0 "\"Le décret est arrivé en un jour. Ceux capables de l'exécuter mettront peut-être une génération à paraître.\""
 ve_rel_evt.41.a:0 "Financer un nouveau cadre de fonctionnaires."
 ve_rel_evt.41.a.tt:0 "Dépense de #N 15#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 6#!."
 ve_rel_evt.41.b:0 "Ralentir la mise en œuvre."
 ve_rel_evt.41.b.tt:0 "La progression du Projet religieux diminue de #N 6#!.\nL'implantation religieuse augmente de #P 2#!."
 ve_rel_evt.41.c:0 "Recourir au réseau d'Éducation existant."
 ve_rel_evt.41.c.tt:0 "Dépense de #N 10#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 5#!.\nL'implantation religieuse augmente de #P 1#!."

 ve_rel_evt.42.t:0 "Rumeurs à travers le district"
 ve_rel_evt.42.d:0 "Des rumeurs à [SCOPE.sState('ve_evt_target_state').GetName] affirment que le projet dissimule des mesures bien plus sévères que celles annoncées par le Gouvernement. Des organisateurs religieux et des Militants locaux répètent des récits contradictoires, tandis que le silence officiel laisse à chaque nouvelle version tout loisir de se propager."
 ve_rel_evt.42.f:0 "\"Une rumeur ne requiert ni bureau, ni budget, ni signature.\""
 ve_rel_evt.42.a:0 "Publier les rapports."
 ve_rel_evt.42.a.tt:0 "La progression du Projet religieux diminue de #N 3#!.\nL'implantation religieuse augmente de #P 4#!."
 ve_rel_evt.42.b:0 "Balayer l'agitation."
 ve_rel_evt.42.b.tt:0 "La progression du Projet religieux augmente de #P 5#!.\nL'implantation religieuse diminue de #N 3#!.\n#N 1%#! de la Population de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_rel_evt.42.c:0 "Mandater des médiateurs locaux."
 ve_rel_evt.42.c.tt:0 "Dépense de #N 10#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 4#!.\nL'implantation religieuse augmente de #P 2#!.\n#P 0.5%#! de la Population de [SCOPE.sState('ve_evt_target_state').GetName] devient Loyaliste."

 ve_rel_evt.43.t:0 "L'administration au point de rupture"
 ve_rel_evt.43.d:0 "Le projet à [SCOPE.sState('ve_evt_target_state').GetName] approche de l'effondrement administratif. Les bureaux provinciaux sont submergés, l'Assurance publique s'est effondrée, et l'Opposition Organisée traite à présent chaque nouvelle directive comme la preuve que le Gouvernement a perdu le contrôle."
 ve_rel_evt.43.f:0 "\"Quand les dossiers cessent de circuler, la crise descend dans la rue.\""
 ve_rel_evt.43.a:0 "Mettre un terme au programme."
 ve_rel_evt.43.a.tt:0 "Annule le Projet religieux sans remboursement de Fonds de réforme pieuse.\nL'implantation religieuse diminue de #N 5#!.\nPendant #Y 2 ans#! : #N -50#! de Bureaucratie, #N -50#! d'Autorité et #N -3%#! de Succès de la promulgation des lois."
 ve_rel_evt.43.b:0 "Transférer des ressources d'urgence."
 ve_rel_evt.43.b.tt:0 "Dépense de #N 25#! Fonds de réforme pieuse.\nLa progression du Projet religieux diminue de #N 5#!.\n#N 1%#! de la Population de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet se poursuit."
 ve_rel_evt.43.c:0 "Poursuivre avec un effectif réduit."
 ve_rel_evt.43.c.tt:0 "La progression du Projet religieux diminue de #N 10#!.\nL'implantation religieuse diminue de #N 2#!.\nLe projet se poursuit."
 ve_rel_evt.43.e:0 "Rebâtir le partenariat local."
 ve_rel_evt.43.e.tt:0 "Dépense de #N 15#! Fonds de réforme pieuse.\nLa progression du Projet religieux diminue de #N 3#!.\nL'implantation religieuse augmente de #P 2#!.\n#N 0.5%#! de la Population de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet se poursuit."

 ve_rel_evt.100.t:0 "Sièges au Conseil interreligieux"
 ve_rel_evt.100.d:0 "Les délégués de [SCOPE.sState('ve_evt_target_state').GetName] conviennent de la nécessité d'un conseil interreligieux, mais s'écharpent sur l'attribution des sièges. La Représentation proportionnelle rassurerait les communautés plus modestes, tandis qu'un arrangement fixe conçu dans la capitale permettrait de commencer les travaux immédiatement."
 ve_rel_evt.100.f:0 "\"Tout le monde soutient l'idée d'une table commune jusqu'à ce que l'on compte les chaises.\""
 ve_rel_evt.100.a:0 "Distribuer la représentation selon la Population."
 ve_rel_evt.100.a.tt:0 "La progression du Projet religieux diminue de #N 3#!.\nL'arrangement religieux augmente de #P 4#!."
 ve_rel_evt.100.b:0 "Imposer un compromis central fixe."
 ve_rel_evt.100.b.tt:0 "La progression du Projet religieux augmente de #P 5#!.\nL'arrangement religieux diminue de #N 2#!.\n#N 0,5%#! de la Population de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_rel_evt.100.c:0 "Habiliter les conseils interreligieux."
 ve_rel_evt.100.c.tt:0 "Dépenser #N 10#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 5#!.\nL'arrangement religieux augmente de #P 2#!."

 ve_rel_evt.101.t:0 "Un programme scolaire partagé"
 ve_rel_evt.101.d:0 "Les écoles de [SCOPE.sState('ve_evt_target_state').GetName] ont besoin de leçons civiques communes sans que le Rayonnement tolérant ne se transforme en campagne contre les croyances locales. Les enseignants réclament du matériel clair et une formation conjointe, tandis que les chefs de communauté insistent pour que l'instruction locale conserve une place pour leurs traditions."
 ve_rel_evt.101.f:0 "\"Une leçon partagée ne réussit que si chaque famille reconnaît la classe comme sienne.\""
 ve_rel_evt.101.a:0 "Financer un cadre pédagogique commun."
 ve_rel_evt.101.a.tt:0 "Dépenser #N 15#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 6#!.\nL'arrangement religieux augmente de #P 1#!."
 ve_rel_evt.101.b:0 "Laisser de la place aux programmes locaux."
 ve_rel_evt.101.b.tt:0 "La progression du Projet religieux diminue de #N 4#!.\nL'arrangement religieux augmente de #P 3#!."
 ve_rel_evt.101.c:0 "Intégrer la coalition de réforme dans les écoles."
 ve_rel_evt.101.c.tt:0 "Dépenser #N 10#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 5#!.\nL'arrangement religieux augmente de #P 2#!.\n#P 0,5%#! de la Population de [SCOPE.sState('ve_evt_target_state').GetName] devient Loyaliste."

 ve_rel_evt.102.t:0 "Une charte de garanties mutuelles"
 ve_rel_evt.102.d:0 "Les communautés religieuses, les fonctionnaires municipaux et les associations de réforme de [SCOPE.sState('ve_evt_target_state').GetName] ont rédigé une charte commune. Chaque signataire accepte les mêmes Obligations civiques en échange de garanties publiques garantissant qu'aucune communauté ne sera exclue des Institutions locales."
 ve_rel_evt.102.f:0 "\"La confiance est devenue possible lorsque chaque promesse a été écrite comme un droit de l'autre Parti.\""
 ve_rel_evt.102.a:0 "Utiliser le Dynamisme du pacte."
 ve_rel_evt.102.a.tt:0 "L'arrangement religieux augmente de #P 2#!.\nLa progression du Projet religieux augmente de #P 20#!.\nSi la progression atteint #Y 100#!, l'effet d'achèvement normal du projet est appliqué."
 ve_rel_evt.102.b:0 "Rendre les garanties permanentes."
 ve_rel_evt.102.b.tt:0 "L'arrangement religieux augmente de #P 4#!.\n#P 0,5%#! de la Population de [SCOPE.sState('ve_evt_target_state').GetName] devient Loyaliste.\nLa progression du Projet religieux augmente de #P 10#!.\nSi la progression atteint #Y 100#!, l'effet d'achèvement normal du projet est appliqué."

 ve_rel_evt.150.t:0 "Enseignants ou inspecteurs ?"
 ve_rel_evt.150.d:0 "La Campagne de laïcisation à [SCOPE.sState('ve_evt_target_state').GetName] a mis en lumière une Pénurie de personnel instruit. L'administration peut développer le corps enseignant qui bâtit la Capacité civique à long terme, ou s'en remettre à des inspecteurs capables de faire respecter les nouvelles règles avec le personnel déjà disponible."
 ve_rel_evt.150.f:0 "\"Un inspecteur peut fermer une école en un après-midi. Il faut parfois des années à un enseignant pour remplacer ce qui y était enseigné.\""
 ve_rel_evt.150.a:0 "Agrandir les corps enseignants."
 ve_rel_evt.150.a.tt:0 "Dépenser #N 15#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 6#!."
 ve_rel_evt.150.b:0 "Ralentir le programme pour l'adapter au personnel existant."
 ve_rel_evt.150.b.tt:0 "La progression du Projet religieux diminue de #N 5#!.\nL'arrangement religieux augmente de #P 2#!."
 ve_rel_evt.150.c:0 "Mandater le réseau d'Éducation publique."
 ve_rel_evt.150.c.tt:0 "Dépenser #N 10#! Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 5#!.\nL'arrangement religieux augmente de #P 1#!."

 ve_rel_evt.151.t:0 "Les Propriétés saisies"
 ve_rel_evt.151.d:0 "D'anciennes propriétés religieuses situées à [SCOPE.sState('ve_evt_target_state').GetName] sont prêtes à être transformées en écoles, cliniques et bureaux civiques. Leur transfert immédiat doterait la campagne d'une infrastructure précieuse, mais l'absence d'indemnisation devient un point de ralliement pour les Croyants."
 ve_rel_evt.151.f:0 "\"Les clés ont changé de mains en une matinée. La querelle de la propriété survivra aux serrures.\""
 ve_rel_evt.151.a:0 "Verser des indemnités échelonnées."
 ve_rel_evt.151.a.tt:0 "Coûte #N 15#! de Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 3#!.\nL'Arrangement religieux augmente de #P 3#!."
 ve_rel_evt.151.b:0 "Affecter immédiatement les propriétés au service public."
 ve_rel_evt.151.b.tt:0 "La progression du Projet religieux augmente de #P 7#!.\nL'Arrangement religieux diminue de #N 4#!.\n#N 1%#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLes Croyants perdent #N 1#! d'Approbation de pendant #Y 2.5 ans#!."
 ve_rel_evt.151.c:0 "Les transférer à des institutions de bien-être laïques."
 ve_rel_evt.151.c.tt:0 "Coûte #N 10#! de Fonds de réforme pieuse.\nLa progression du Projet religieux augmente de #P 5#!.\nL'Arrangement religieux augmente de #P 2#!.\n#P 0.5%#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient Loyaliste."

 ve_rel_evt.152.t:0 "Des associations civiques prennent racine"
 ve_rel_evt.152.d:0 "Des cercles d'enseignants, des sociétés de secours mutuel et des associations municipales de [SCOPE.sState('ve_evt_target_state').GetName] ont commencé à fournir des services autrefois assurés par des institutions religieuses. Leur coopération confère à la Campagne de laïcisation une assise civique locale plutôt qu'une simple présence administrative."
 ve_rel_evt.152.f:0 "\"Le nouvel ordre s'est maintenu lorsque les citoyens ont commencé à le préserver sans attendre l'inspecteur.\""
 ve_rel_evt.152.a:0 "Mettre à profit le dynamisme local."
 ve_rel_evt.152.a.tt:0 "L'Arrangement religieux augmente de #P 2#!.\nLa progression du Projet religieux augmente de #P 20#!.\nSi la progression atteint #Y 100#!, l'effet de fin normal du projet s'applique."
 ve_rel_evt.152.b:0 "Transformer ces associations en institutions permanentes."
 ve_rel_evt.152.b.tt:0 "L'Arrangement religieux augmente de #P 4#!.\nLa progression du Projet religieux augmente de #P 10#!.\nSi la progression atteint #Y 100#!, l'effet de fin normal du projet s'applique."

 ve_cul_evt.40.t:0 "Conseils scolaires locaux"
 ve_cul_evt.40.d:0 "Les conseils scolaires de [SCOPE.sState('ve_evt_target_state').GetName] s'opposent quant à la place de la langue [SCOPE.sCulture('ve_evt_target_culture').GetName] dans l'instruction publique. L'enseignement en langue locale préserverait la confiance, tandis qu'une langue administrative unique faciliterait la conduite du projet national."
 ve_cul_evt.40.f:0 "\"La langue choisie pour la première leçon décide souvent de qui s'estime chez lui dans l'école.\""
 ve_cul_evt.40.a:0 "Protéger la langue locale."
 ve_cul_evt.40.a.tt:0 "La progression du Projet culturel diminue de #N 4#!.\nLa Cohésion nationale augmente de #P 3#!."
 ve_cul_evt.40.b:0 "Imposer une langue administrative unique."
 ve_cul_evt.40.b.tt:0 "La progression du Projet culturel augmente de #P 5#!.\nLa Cohésion nationale diminue de #N 2#!.\n#N 0.5%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_cul_evt.40.c:0 "Agrandir les réseau d'enseignants."
 ve_cul_evt.40.c.tt:0 "Coûte #N 10#! de Mandat culturel.\nLa progression du Projet culturel augmente de #P 4#!.\nLa Cohésion nationale augmente de #P 2#!."

 ve_cul_evt.41.t:0 "Frontières statistiques"
 ve_cul_evt.41.d:0 "Les fonctionnaires menant le recensement à [SCOPE.sState('ve_evt_target_state').GetName] ne parviennent pas à s'entendre sur les limites de la communauté [SCOPE.sCulture('ve_evt_target_culture').GetName]. Les identités locales se croisent au fil des langues, des districts et des coutumes, mais le projet national exige des catégories comptabilisables et administrables."
 ve_cul_evt.41.f:0 "\"Une frontière tracée pour les besoins du recensement se voit bientôt dotée de fonctionnaires, de budgets et de défenseurs.\""
 ve_cul_evt.41.a:0 "Laisser place à l'auto-identification."
 ve_cul_evt.41.a.tt:0 "La progression du Projet culturel diminue de #N 3#!.\nLa Cohésion nationale augmente de #P 3#!."
 ve_cul_evt.41.b:0 "Laisser le pouvoir central fixer les frontières."
 ve_cul_evt.41.b.tt:0 "La progression du Projet culturel augmente de #P 6#!.\nLa Cohésion nationale diminue de #N 3#!.\n#N 0.5%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_cul_evt.41.c:0 "Employer le système de registre standard."
 ve_cul_evt.41.c.tt:0 "Coûte #N 10#! de Mandat culturel.\nLa progression du Projet culturel augmente de #P 5#!.\nLa Cohésion nationale augmente de #P 1#!."

 ve_cul_evt.42.t:0 "Le projet national au point de rupture"
 ve_cul_evt.42.d:0 "Le projet national dans [SCOPE.sState('ve_evt_target_state').GetName] approche de l'effondrement. Les mouvements radicaux affirment que le gouvernement a soit trahi la communauté [SCOPE.sCulture('ve_evt_target_culture').GetName], soit capitulé devant elle, tandis que les bureaux locaux ne possèdent plus l'assurance nécessaire pour imposer un nouveau compromis."
 ve_cul_evt.42.f:0 "\"Un accord attaqué à la fois comme une coercition et une capitulation risque bientôt de cesser d'être un accord.\""
 ve_cul_evt.42.a:0 "Mettre fin au projet."
 ve_cul_evt.42.a.tt:0 "Annule le Projet culturel sans remboursement de Mandat culturel.\nLa Cohésion nationale diminue de #N 5#!.\nPendant #Y 2 ans#! : #N -50#! Bureaucratie, #N -25#! Autorité et #N -3%#! de Succès de la promulgation des lois."
 ve_cul_evt.42.b:0 "Transférer des ressources locales d'urgence."
 ve_cul_evt.42.b.tt:0 "Dépense #N 25#! Mandats culturels.\nLa progression du Projet culturel diminue de #N 5#!.\n#N 1%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet se poursuit."
 ve_cul_evt.42.c:0 "Continuer avec un programme minimal."
 ve_cul_evt.42.c.tt:0 "La progression du Projet culturel diminue de #N 10#!.\nLa Cohésion nationale diminue de #N 2#!.\nLe projet se poursuit."
 ve_cul_evt.42.e:0 "Rebâtir le cadre de négociations."
 ve_cul_evt.42.e.tt:0 "Dépense #N 15#! Mandats culturels.\nLa progression du Projet culturel diminue de #N 3#!.\nLa Cohésion nationale augmente de #P 2#!.\n#N 0.5%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet se poursuit."

 ve_cul_evt.50.t:0 "La directive sur les patronymes et la langue"
 ve_cul_evt.50.d:0 "Les fonctionnaires de [SCOPE.sState('ve_evt_target_state').GetName] proposent d'uniformiser les noms de famille et les registres publics dans la langue nationale. Cette directive permettrait à l'administration centrale de classifier plus facilement la population [SCOPE.sCulture('ve_evt_target_culture').GetName], mais les familles craignent que l'identité privée ne devienne l'objet du commandement de l'État."
 ve_cul_evt.50.f:0 "\"Un nom consigné différemment dans les registres peut demeurer celui par lequel une famille se souvient d'elle-même.\""
 ve_cul_evt.50.a:0 "Financer une campagne d'enregistrement graduelle."
 ve_cul_evt.50.a.tt:0 "Dépense #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 4#!.\nLa Cohésion nationale augmente de #P 1#!.\n#N 0.5%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_cul_evt.50.b:0 "Appliquer une norme nationale unique."
 ve_cul_evt.50.b.tt:0 "La progression du Projet culturel augmente de #P 7#!.\nLa Cohésion nationale diminue de #N 4#!.\n#N 1%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_cul_evt.50.c:0 "Retirer la directive pour révision."
 ve_cul_evt.50.c.tt:0 "La progression du Projet culturel diminue de #N 5#!.\nLa Cohésion nationale augmente de #P 3#!."

 ve_cul_evt.51.t:0 "Les registres de conscription"
 ve_cul_evt.51.d:0 "Les officiers de l'Armée de [SCOPE.sState('ve_evt_target_state').GetName] exigent un registre unique pour les obligations de service, les patronymes et les commandements. Son application à la population [SCOPE.sCulture('ve_evt_target_culture').GetName] renforcerait la campagne d'intégration ethnique, mais la résistance grandit parmi les communautés qui voient dans l'armée un nouvel instrument d'effacement culturel."
 ve_cul_evt.51.f:0 "\"L'État n'apprend le nom des villages que lorsqu'il souhaite lever ses impôts ou convoquer ses fils.\""
 ve_cul_evt.51.a:0 "Appliquer les registres nationaux."
 ve_cul_evt.51.a.tt:0 "La progression du Projet culturel augmente de #P 5#!.\nLa Cohésion nationale diminue de #N 2#!.\n#N 0.5%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."
 ve_cul_evt.51.b:0 "Préserver les pratiques d'enregistrement locales."
 ve_cul_evt.51.b.tt:0 "La progression du Projet culturel diminue de #N 3#!.\nLa Cohésion nationale augmente de #P 3#!."
 ve_cul_evt.51.c:0 "Intégrer les registres par le service militaire."
 ve_cul_evt.51.c.tt:0 "Dépense #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 6#!.\nLa Cohésion nationale augmente de #P 1#!.\n#N 0.5%#! de la population [SCOPE.sCulture('ve_evt_target_culture').GetName] dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical."

 ve_cul_evt.100.t:0 "La délégation constituante"
 ve_cul_evt.100.d:0 "Une délégation de la communauté des [SCOPE.sCulture('ve_evt_target_culture').GetName] à [SCOPE.sState('ve_evt_target_state').GetName] est arrivée avec des exigences de représentation dans les institutions du Pacte constituant. La négociation ralentirait le projet mais en renforcerait la légitimité ; un arrangement imposé depuis la capitale pourrait avancer plus rapidement au détriment de la confiance."
 ve_cul_evt.100.f:0 "\"Un pacte ne devient commun que lorsque chaque constituant peut pointer du doigt une clause qu'il a aidé à rédiger.\""
 ve_cul_evt.100.a:0 "Négocier leur place dans le pacte."
 ve_cul_evt.100.a.tt:0 "La progression du Projet culturel diminue de #N 4#!.\nLa cohésion nationale augmente de #P 4#!."
 ve_cul_evt.100.b:0 "Imposer l'arrangement central."
 ve_cul_evt.100.b.tt:0 "La progression du Projet culturel augmente de #P 5#!.\nLa cohésion nationale diminue de #N 2#!.\n#N 0,5%#! de la population des [SCOPE.sCulture('ve_evt_target_culture').GetName] à [SCOPE.sState('ve_evt_target_state').GetName] devient radicale."
 ve_cul_evt.100.c:0 "Associer la coalition parlementaire aux pourparlers."
 ve_cul_evt.100.c.tt:0 "Dépenser #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 4#!.\nLa cohésion nationale augmente de #P 2#!."

 ve_cul_evt.101.t:0 "Double administration"
 ve_cul_evt.101.d:0 "Le Pacte constituant à [SCOPE.sState('ve_evt_target_state').GetName] dépend désormais de deux administrations qui se chevauchent. Les fonctionnaires centraux et les représentants de la communauté des [SCOPE.sCulture('ve_evt_target_culture').GetName] dupliquent les registres, contestent les nominations et émettent des instructions contradictoires alors que la bureaucratie du pays frôle l'épuisement."
 ve_cul_evt.101.f:0 "\"Deux bureaux partagent plus facilement l'Autorité qu'un meuble de classement.\""
 ve_cul_evt.101.a:0 "Financer un personnel administratif mixte."
 ve_cul_evt.101.a.tt:0 "Dépenser #N 15#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 6#!."
 ve_cul_evt.101.b:0 "Ralentir le pacte jusqu'à l'accord des bureaux."
 ve_cul_evt.101.b.tt:0 "La progression du Projet culturel diminue de #N 6#!.\nLa cohésion nationale augmente de #P 2#!."
 ve_cul_evt.101.c:0 "Unifier les bureaux sous l'égide de la Fonction publique."
 ve_cul_evt.101.c.tt:0 "Dépenser #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 2#!."

 ve_cul_evt.150.t:0 "Mise en œuvre dans les provinces"
 ve_cul_evt.150.d:0 "Les administrations provinciales signalent que le projet culturel national progresse à des vitesses radicalement différentes. Certains bureaux exigent des commissions de mise en œuvre financées, tandis que d'autres préviennent que l'imposition d'un calendrier unique à chaque région consumera un personnel déjà rare et affaiblira la confiance publique."
 ve_cul_evt.150.f:0 "\"Un décret national s'écrit une seule fois, mais il doit être appliqué dans chaque bureau du pays.\""
 ve_cul_evt.150.a:0 "Financer les commissions de mise en œuvre."
 ve_cul_evt.150.a.tt:0 "Dépenser #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 5#!."
 ve_cul_evt.150.b:0 "Adopter un calendrier progressif."
 ve_cul_evt.150.b.tt:0 "La progression du Projet culturel diminue de #N 4#!.\nLa cohésion nationale augmente de #P 2#!."
 ve_cul_evt.150.c:0 "Standardiser l'administration existante."
 ve_cul_evt.150.c.tt:0 "Dépenser #N 5#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 3#!.\nLa cohésion nationale augmente de #P 2#!."

 ve_cul_evt.151.t:0 "La langue d'enseignement"
 ve_cul_evt.151.d:0 "Le Programme d’enseignement national requiert une langue d'enseignement commune, pourtant les écoles du pays desservent des communautés aux traditions linguistiques très différentes. Des supports multilingues préserveraient la confiance mais retarderaient la distribution, tandis qu'un programme unique pourrait atteindre les salles de classe rapidement au risque de transformer l'éducation en affrontement culturel."
 ve_cul_evt.151.f:0 "\"Une leçon enseignée dans une langue que l'élève redoute peut être retenue pour tout sauf pour son objet.\""
 ve_cul_evt.151.a:0 "Financer des supports multilingues."
 ve_cul_evt.151.a.tt:0 "Dépenser #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 3#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.151.b:0 "Appliquer un programme d'enseignement national."
 ve_cul_evt.151.b.tt:0 "La progression du Projet culturel augmente de #P 6#!.\nLa cohésion nationale diminue de #N 3#!."
 ve_cul_evt.151.c:0 "Unir les réseaux d'enseignement et de bien-être."
 ve_cul_evt.151.c.tt:0 "Dépenser #N 10#! Mandats culturels.\nLa progression du Projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 2#!."

 ve_cul_evt.160.t:0 "Qui représente la Nation ?"
 ve_cul_evt.160.d:0 "Le projet des Symboles communs a rouvert le débat sur l'histoire, les uniformes, les monuments et les cérémonies aptes à incarner le pays tout entier. Alterner les traditions élargirait la reconnaissance au détriment de la promptitude ; consacrer un récit officiel unique assurerait la clarté tout en marginalisant une partie des citoyens."
 ve_cul_evt.160.f:0 "\"Un symbole ne devient national que lorsque les citoyens s'y reconnaissent sans qu'il soit besoin de l'expliquer.\""
 ve_cul_evt.160.a:0 "Alterner les symboles dans l'usage public."
 ve_cul_evt.160.a.tt:0 "La progression du Projet culturel diminue de #N 3#!.\nLa Cohésion nationale augmente de #P 4#!."
 ve_cul_evt.160.b:0 "Établir un récit officiel unique."
 ve_cul_evt.160.b.tt:0 "La progression du Projet culturel augmente de #P 6#!.\nLa Cohésion nationale diminue de #N 3#!."
 ve_cul_evt.160.c:0 "Concevoir une cérémonie publique partagée."
 ve_cul_evt.160.c.tt:0 "Dépense de #N 10#! de Mandat culturel.\nLa progression du Projet culturel augmente de #P 4#!.\nLa Cohésion nationale augmente de #P 2#!."
