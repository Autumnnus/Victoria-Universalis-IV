l_french:
 ve_je_religious_project:0 "Projet religieux"
 ve_je_religious_project_reason:0 "Le gouvernement dirige un projet religieux à long terme. Sa progression est régie par la capacité administrative, la légitimité politique, les conditions religieuses et les événements survenus dans l’État cible."
 ve_je_religious_project_progress:0 "Le projet religieux progresse vers son achèvement"
 ve_je_religious_project_status_confessional:0 "La conversion confessionnelle en [JournalEntry.GetTarget.GetState.GetName] cherche à étendre la foi de l'État à travers une campagne organisée.\n\nAchèvement à #Y 125#! progrès : convertit 5 % de la population de l'État cible à la religion d'État, rembourse #P 20#! la réforme de la piété et ajoute #P 5#! Règlement religieux."
 ve_je_religious_project_status_freedom:0 "The Freedom Outreach in [JournalEntry.GetTarget.GetState.GetName] construit un règlement basé sur la conscience et l'association volontaire.\n\nAchèvement à #Y 100#! progression : ajoute des loyalistes à l'État sans conversion forcée, remboursements #P 20#! Réforme de la piété, et ajoute #P 7#! Établissement religieux."
 ve_je_religious_project_status_secularization:0 "La campagne de sécularisation en [JournalEntry.GetTarget.GetState.GetName] réduit l'autorité publique de la religion organisée.\n\nAchèvement à #Y 150#! progrès : convertit 5 % de la population de l'État cible à l'athéisme, rembourse #P 25#! la réforme de la piété et ajoute #P 8#! établissements religieux."
 ve_je_religious_project_complete_tt:0 "Le projet religieux a atteint son objectif."
 ve_je_religious_project_fail_tt:0 "Le projet religieux a été annulé."

 ve_je_cultural_project:0 "Projet culturel"
 ve_je_cultural_project_reason:0 "Le gouvernement dirige un projet culturel à long terme. La capacité administrative, la légitimité, l’éducation, la cohésion nationale et les conditions locales déterminent son rythme."
 ve_je_cultural_project_progress:0 "Progrès du projet culturel vers son achèvement"
 ve_je_cultural_project_status_curriculum:0 "Un programme national est en cours d'élaboration pour les écoles et institutions du pays.\n\nAchèvement à #Y 100#! progression : #P +20#! Mandat culturel, #P +5#! Cohésion nationale et un résultat sur 10 ans de +2 % d'accès à l'éducation, +5 % de qualifications, -25 de bureaucratie."
 ve_je_cultural_project_status_symbols:0 "Un programme de symboles partagés est en train de forger un vocabulaire civique commun.\n\nAchèvement à #Y 75#! progrès : #P +20#! Mandat culturel, #P +7#! Cohésion nationale, et un résultat sur 8 ans de +10 % de loyalistes issus de pops pleinement acceptées et +25 d'autorité."
 ve_je_cultural_project_status_ethnic:0 "La campagne d'intégration ethnique en [JournalEntry.GetTarget.GetState.GetName]  pousse une population minoritaire vers la culture primaire.\n\nAchèvement à #Y 125#! progrès : convertit 5 % des pops de la culture cible à la culture primaire Nationaliste VII), #P +25#! Mandat culturel, #P +8#! Cohésion nationale et résultat d'assimilation sur 10 ans."
 ve_je_cultural_project_status_civic:0 "L'Initiative pour l'égalité des citoyens [JournalEntry.GetTarget.GetState.GetName] étend un statut civique commun à travers les lignes culturelles.\n\nAchèvement à #Y 100#! progrès : +15 % Acceptation pour 10 ans, loyalistes de l'État, #P +25#! Culturel Mandat, #P +10#! Cohésion nationale, et un résultat de qualification/migration sur 10 ans."
 ve_je_cultural_project_status_composite:0 "Le Pacte constitutif en [JournalEntry.GetTarget.GetState.GetName] négocie une reconnaissance permanente au sein d'un État composite.\n\nAchèvement à #Y 150#! progrès (nécessite 40+ Cohésion nationale) : permanent +15 % d'acceptation, ajoute la culture à la liste constituante, loyalistes de l'État, #P +30#! Mandat Culturel, #P +12#! Cohésion Nationale."
 ve_je_cultural_project_complete_tt:0 "Le Projet Culturel a atteint son objectif."
 ve_je_cultural_project_fail_tt:0 "Le projet culturel a été annulé."
 ve_je_project_resolving_status:0 "L'administration du projet dépose son rapport final."

 ve_evt_religious_incident_cooldown_mdf:0 "Temps de récupération d'un incident de projet religieux"
 ve_evt_religious_incident_cooldown_mdf_desc:0 "L'administration du projet absorbe les conséquences d'un incident récent."
 ve_evt_cultural_incident_cooldown_mdf:0 "Durée de récupération d'un incident de projet culturel"
 ve_evt_cultural_incident_cooldown_mdf_desc:0 "L'administration du projet absorbe les conséquences d'un incident récent."
 ve_evt_central_clergy_supported_mdf:0 "Le clergé central soutenu"
 ve_evt_central_clergy_supported_mdf_desc:0 "Le gouvernement a soutenu l'autorité de la hiérarchie religieuse centrale."
 ve_evt_central_clergy_slighted_mdf:0 "Le clergé central négligé"
 ve_evt_central_clergy_slighted_mdf_desc:0 "Le gouvernement a privilégié les pratiques locales plutôt que les préférences de la hiérarchie religieuse centrale."
 ve_evt_municipal_patronage_mdf:0 "Réseaux de mécénat municipaux"
 ve_evt_municipal_patronage_mdf_desc:0 "Les notables locaux font avancer le projet grâce à des arrangements qui affaiblissent la collecte des impôts."

 ve_rel_evt.1.t:0 "La pétition des notables locaux"
 ve_rel_evt.1.d:0 "Une délégation d'ecclésiastiques, de personnalités municipales et d'anciens du quartier de [SCOPE.sState('ve_evt_target_state').GetName] a demandé au gouvernement de ralentir la conversion confessionnelle. Ils préviennent qu’un calendrier rigide transformerait le respect des règles en un ressentiment durable."
 ve_rel_evt.1.f:0 "\\"La foi imposée sans conseil peut remplir les registres tout en vidant les bancs.\\""
 ve_rel_evt.1.a:0 "Écoutez leur pétition."
 ve_rel_evt.1.a.tt:0 "La progression du projet religieux diminue de #N 4#!.\nLa colonie religieuse augmente de #P 3#!."
 ve_rel_evt.1.b:0 "Le calendrier ne changera pas."
 ve_rel_evt.1.b.tt:0 "La progression du projet religieux augmente de #P 5#!.\nLa colonisation religieuse diminue de #N 2#!.\n#N 0,5 %#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_rel_evt.1.c:0 "Commissionnez des intermédiaires de confiance."
 ve_rel_evt.1.c.tt:0 "Dépensez #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 3#!.\nL'établissement religieux augmente de #P 1#!."

 ve_rel_evt.2.t:0 "Une pénurie d'agents de terrain"
 ve_rel_evt.2.d:0 "Les rapports de [SCOPE.sState('ve_evt_target_state').GetName] décritnt des pétitions sans réponse, des instructions contradictoires et des districts qui n'ont pas vu d'agent de projet depuis des semaines. La conversion confessionnelle dépasse l'administration chargée de la mettre en œuvre."
 ve_rel_evt.2.f:0 "\\"Un décret peut traverser le pays en un jour. Un employé compétent ne le peut pas.\\""
 ve_rel_evt.2.a:0 "Embaucher des agents de terrain temporaires."
 ve_rel_evt.2.a.tt:0 "Dépenser #N 15#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 4#!."
 ve_rel_evt.2.b:0 "Ralentissez le programme."
 ve_rel_evt.2.b.tt:0 "La progression du projet religieux diminue de #N 6#!.\nLes colonies religieuses augmentent de #P 2#!."
 ve_rel_evt.2.c:0 "Utilisez les cadres du registre central."
 ve_rel_evt.2.c.tt:0 "Dépensez #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 5#!."

 ve_cul_evt.1.t:0 "Les bureaux de traduction"
 ve_cul_evt.1.d:0 "fonctionnaires de [SCOPE.sState('ve_evt_target_state').GetName] désaccord sur la manière dont l’Initiative pour l’égalité des citoyens devrait répondre aux [SCOPE.sCulture('ve_evt_target_culture').GetName] langue. Les administrateurs locaux veulent des bureaux bilingues ; les ministères centraux exigent une norme administrative unique."
 ve_cul_evt.1.f:0 "\\"Un citoyen ne devrait pas avoir besoin d'un interprète pour comprendre les droits accordés en son propre nom.\\""
 ve_cul_evt.1.a:0 "Laisser les langues locales vivre dans les institutions publiques."
 ve_cul_evt.1.a.tt:0 "Les progrès du projet culturel diminuent de #N 4#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.1.b:0 "Imposer une norme administrative."
 ve_cul_evt.1.b.tt:0 "La progression du projet culturel augmente de #P 5#!.\nLa cohésion nationale diminue de #N 2#!.\n#N 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population en [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_cul_evt.1.c:0 "Établir une commission de traduction académique."
 ve_cul_evt.1.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 3#!.\nLa cohésion nationale augmente de #P 1#!."

 ve_cul_evt.2.t:0 "Une pénurie d’enseignants locaux"
 ve_cul_evt.2.d:0 "Les écoles de [SCOPE.sState('ve_evt_target_state').GetName] manque d’enseignants capables de servir à la fois le programme scolaire de l’État et [SCOPE.sCulture('ve_evt_target_culture').GetName] communautés. Sans un cadre local formé, l’égalité citoyenne risque de rester une promesse écrite uniquement sur papier officiel."
 ve_cul_evt.2.f:0 "\\"La loi déclare l'égalité en un après-midi ; la classe doit l'enseigner pendant une génération.\\""
 ve_cul_evt.2.a:0 "Financer de nouvelles écoles d'enseignants."
 ve_cul_evt.2.a.tt:0 "Dépenser #N 15#! Mandat culturel.\nLa progression du projet culturel augmente de #P 4#!."
 ve_cul_evt.2.b:0 "Mise en œuvre lente."
 ve_cul_evt.2.b.tt:0 "La progression du projet culturel diminue de #N 6#!.\nLa cohésion nationale augmente de #P 2#!."
 ve_cul_evt.2.c:0 "Utilisez les institutions déjà en place."
 ve_cul_evt.2.c.tt:0 "Dépensez #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 1#!."

 ve_rel_evt.3.t:0 "Registres contradictoires"
 ve_rel_evt.3.d:0 "Les registres paroissiaux, les registres municipaux et les rapports des responsables du projet donnent des comptes incompatibles sur l'adhésion religieuse en [SCOPE.sState('ve_evt_target_state').GetName]. L'administration doit décider si elle veut perdre du temps à établir la vérité ou procéder avec des chiffres qu'elle sait incertains."
 ve_rel_evt.3.f:0 "\\"Chaque bureau possède un total exact. Il n'y a pas deux totaux qui concordent.\\""
 ve_rel_evt.3.a:0 "Réalisez un audit complet."
 ve_rel_evt.3.a.tt:0 "Gain #P 8#! Réforme de la piété.\nLa progression du projet religieux diminue de #N 6#!."
 ve_rel_evt.3.b:0 "Procéder à des estimations raisonnables."
 ve_rel_evt.3.b.tt:0 "Dépenser #N 8#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 5#!."
 ve_rel_evt.3.c:0 "Utilisez les registres de l'administration sacrée."
 ve_rel_evt.3.c.tt:0 "La progression du projet religieux augmente de #P 3#!."

 ve_rel_evt.4.t:0 "Rumeurs et contre-prédications"
 ve_rel_evt.4.d:0 "Des brochures, des sermons de rue et des rumeurs anxieuses décrivent désormais la conversion confessionnelle dans [SCOPE.sState('ve_evt_target_state').GetName] comme une atteinte à la vie locale. Les responsables préviennent que le silence permettra aux opposants de définir le projet, tandis que la répression pourrait confirmer leurs affirmations les plus sombres."
 ve_rel_evt.4.f:0 "\\"Une rumeur ne nécessite ni bureau, ni sceau, ni budget.\\""
 ve_rel_evt.4.a:0 "Organiser des audiences publiques."
 ve_rel_evt.4.a.tt:0 "Les progrès du projet religieux diminuent de #N 3#!.\nLa colonie religieuse augmente de #P 3#!.\n#P 0,5%#! de la population [SCOPE.sState('ve_evt_target_state').GetName] devient loyaliste."
 ve_rel_evt.4.b:0 "Punissez les agitateurs."
 ve_rel_evt.4.b.tt:0 "La progression du projet religieux augmente de #P 4#!.\nLes établissements religieux diminuent de #N 3#!.\n#N 1 %#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_rel_evt.4.c:0 "Publiez les enregistrements et les résultats."
 ve_rel_evt.4.c.tt:0 "Dépensez #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 2#!.\nL'établissement religieux augmente de #P 1#!."

 ve_rel_evt.5.t:0 "La langue du sermon"
 ve_rel_evt.5.d:0 "Projet du clergé en [SCOPE.sState('ve_evt_target_state').GetName] rapportent que les sermons formels préservent l’unité doctrinale mais ne parviennent pas à atteindre de nombreux fidèles. La prédication en langue locale permettrait de faire avancer la campagne, même si la hiérarchie centrale craint que l'adaptation ne se transforme en indépendance."
 ve_rel_evt.5.f:0 "\\"Une parole sacrée inouïe est parfaitement préservée et n'est reçue par personne.\\""
 ve_rel_evt.5.a:0 "Prêchez dans les langues locales."
 ve_rel_evt.5.a.tt:0 "La progression du projet religieux augmente de #P 6#!.\nLes dévots perdent #N 1#! approbation pendant #Y 2,5 ans#!."
 ve_rel_evt.5.b:0 "Préserve l'unité liturgique."
 ve_rel_evt.5.b.tt:0 "La progression du projet religieux diminue de #N 3#!.\nL'établissement religieux augmente de #P 3#!.\nLes dévots gagnent #P 1#! approbation pour #Y 2,5 ans#!."
 ve_rel_evt.5.c:0 "Former des interprètes qualifiés."
 ve_rel_evt.5.c.tt:0 "Dépenser #N 10#! Réforme de la piété.\nLes progrès du projet religieux augmentent de #P 4#!.\nLes établissements religieux augmentent de #P 1#!."

 ve_rel_evt.6.t:0 "Autorités ecclésiastiques rivales"
 ve_rel_evt.6.d:0 "Nommés centraux et clergé local établi dans [SCOPE.sState('ve_evt_target_state').GetName] chacun revendique le droit de diriger la conversion confessionnelle. Soutenir un camp peut rétablir rapidement le commandement, mais le conflit est déjà devenu une épreuve pour savoir qui parle au nom de la foi."
 ve_rel_evt.6.f:0 "\\"La querelle concerne la juridiction, c'est à dire la manière dont les institutions décrivent le pouvoir.\\""
 ve_rel_evt.6.a:0 "Soutenir le clergé central."
 ve_rel_evt.6.a.tt:0 "La progression du projet religieux augmente de #P 5#!.\nLe gain des dévots #P 1#! Approbation pour #Y 2,5 ans#!.\nL'établissement religieux diminue de #N 3#!.\n#N 0,5 %#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_rel_evt.6.b:0 "Apaisez le clergé local."
 ve_rel_evt.6.b.tt:0 "La progression du projet religieux diminue de #N 4#!.\nLes dévots perdent #N 1#! l'approbation #Y 2,5 ans#!.\nL'établissement religieux augmente de #P 3#!."
 ve_rel_evt.6.c:0 "Définissez leurs pouvoirs par écrit."
 ve_rel_evt.6.c.tt:0 "Dépenser #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 3#!.\nLes établissements religieux augmentent de #P 1#!."

 ve_cul_evt.3.t:0 "Les catégories du recensement"
 ve_cul_evt.3.d:0 "Les responsables du recensement à [SCOPE.sState('ve_evt_target_state').GetName] ne pouvons pas nous mettre d'accord sur la façon dont les citoyens de [SCOPE.sCulture('ve_evt_target_culture').GetName] la culture doit être enregistrée. Les répondants locaux utilisent des identités qui se chevauchent, tandis que les formulaires centraux exigent une réponse dans une seule case."
 ve_cul_evt.3.f:0 "\\"Une catégorie simplifie le grand livre bien avant de simplifier le pays.\\""
 ve_cul_evt.3.a:0 "Permettez l'auto-identification."
 ve_cul_evt.3.a.tt:0 "La progression du projet culturel diminue de #N 4#!.\nLa cohésion nationale augmente de #P 4#!."
 ve_cul_evt.3.b:0 "Les catégories seront définies de manière centralisée."
 ve_cul_evt.3.b.tt:0 "La progression du projet culturel augmente de #P 6#!.\nLa cohésion nationale diminue de #N 4#!.\n#N 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population [SCOPE.sState('ve_evt_target_state').GetName] devient radicale."
 ve_cul_evt.3.c:0 "Utilisez le système d'enregistrement moderne."
 ve_cul_evt.3.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 1#!."

 ve_cul_evt.4.t:0 "Les notables municipaux"
 ve_cul_evt.4.d:0 "Les clients municipaux de [SCOPE.sState('ve_evt_target_state').GetName] offrir leurs bureaux, leurs clients et leur influence pour faire progresser l'égalité des citoyens pour les [SCOPE.sCulture('ve_evt_target_culture').GetName] population. Leur coopération serait rapide, mais leur prix est un contrôle continu sur les revenus locaux."
 ve_cul_evt.4.f:0 "\\"Le chemin le plus court jusqu'à la mairie passe par plusieurs salons privés.\\""
 ve_cul_evt.4.a:0 "Utiliser les réseaux locaux."
 ve_cul_evt.4.a.tt:0 "La progression du projet culturel augmente de #P 5#!.\n[SCOPE.sState('ve_evt_target_state').GetName] perd #N 5 %#! de capacité fiscale pendant #Y 2 ans#!."
 ve_cul_evt.4.b:0 "Créer des conseils ouverts."
 ve_cul_evt.4.b.tt:0 "La progression du projet culturel diminue de #N 3#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.4.c:0 "Négocier un règlement fondé sur des règles."
 ve_cul_evt.4.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 3#!.\nLa cohésion nationale augmente de #P 1#!."

 ve_cul_evt.5.t:0 "Les concours de la fonction publique"
 ve_cul_evt.5.d:0 "Ouverture des concours de la fonction publique aux [SCOPE.sCulture('ve_evt_target_culture').GetName] Les candidats ont mis en évidence un écart entre l’égalité juridique et la préparation pratique. Un accès immédiat serait symboliquement puissant, mais des années de scolarité inégale ne peuvent être effacées par décret."
 ve_cul_evt.5.f:0 "\\"Le même examen n'est pas la même opportunité lorsqu'un seul candidat a appris sa langue.\\""
 ve_cul_evt.5.a:0 "Cours préparatoires en finance."
 ve_cul_evt.5.a.tt:0 "Dépenser #N 15#! Mandat culturel.\nLa progression du projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 2#!."
 ve_cul_evt.5.b:0 "L'égalité d'accès commence immédiatement."
 ve_cul_evt.5.b.tt:0 "La progression du projet culturel augmente de #P 7#!.\nLa cohésion nationale diminue de #N 4#!.\n#N 0,5 %#! de la population [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_cul_evt.5.c:0 "Mobiliser les réseaux scolaires et sociaux."
 ve_cul_evt.5.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 2#!."
 ve_cul_evt.5.e:0 "Réformer d'abord le système d'examens."
 ve_cul_evt.5.e.tt:0 "La progression du projet culturel diminue de #N 4#!.\nLa cohésion nationale augmente de #P 3#!."

 ve_cul_evt.6.t:0 "La majorité fait reculer"
 ve_cul_evt.6.d:0 "Les opposants à l’Initiative pour l’égalité des citoyens affirment que l’extension des droits communs aux [SCOPE.sCulture('ve_evt_target_culture').GetName] la population diminue le statut de tous les autres. Des manifestations à [SCOPE.sState('ve_evt_target_state').GetName] font d'une réforme administrative un test politique national."
 ve_cul_evt.6.f:0 "\\"Un droit partagé est décrit comme un privilège volé.\\""
 ve_cul_evt.6.a:0 "Défendez ouvertement l'initiative."
 ve_cul_evt.6.a.tt:0 "La progression du projet culturel augmente de #P 4#!.\nLa cohésion nationale diminue de #N 4#!.\n#N 1 %#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_cul_evt.6.b:0 "Réduisez le rythme de mise en œuvre."
 ve_cul_evt.6.b.tt:0 "Les progrès du projet culturel diminuent de #N 5#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.6.c:0 "Mobiliser la coalition de réforme."
 ve_cul_evt.6.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 3#!.\nLa cohésion nationale augmente de #P 2#!.\n#P 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population de [SCOPE.sState('ve_evt_target_state').GetName] devient loyaliste."

 ve_rel_evt.7.t:0 "La mission au point de rupture"
 ve_rel_evt.7.d:0 "La conversion confessionnelle en [SCOPE.sState('ve_evt_target_state').GetName] est proche de l’effondrement administratif et politique. Les bureaux ne se répondent plus, la résistance du public se durcit et le clergé de campagne prévient que la mission ne peut pas continuer dans ses conditions actuelles."
 ve_rel_evt.7.f:0 "\\"Les rapports parlent encore d'une difficulté passagère. Les rues ont choisi un nom plus dur.\\""
 ve_rel_evt.7.a:0 "Acceptez les pertes et retirez-vous."
 ve_rel_evt.7.a.tt:0 "Annulez le projet religieux sans remboursement de la réforme de la piété.\nLe règlement religieux diminue de #N 5#!.\nPour #Y 2 ans#! : #N -50#! Bureaucratie, #N -50#! Autorité et #N -3 %#! Succès de la promulgation de la loi."
 ve_rel_evt.7.b:0 "Transférer des ressources d'urgence."
 ve_rel_evt.7.b.tt:0 "Dépenser #N 25#! Réforme de la piété.\nLa progression du projet religieux diminue de #N 5#!.\n#N 1%#! de la population dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet continue."
 ve_rel_evt.7.c:0 "Continuez avec un personnel restreint."
 ve_rel_evt.7.c.tt:0 "La progression du projet religieux diminue de #N 10#!.\nL'implantation religieuse diminue de #N 2#!.\nLe projet continue."
 ve_rel_evt.7.e:0 "Renégocier la méthode."
 ve_rel_evt.7.e.tt:0 "Dépenser #N 15#! Réforme de la piété.\nLa progression du projet religieux diminue de #N 3#!.\nL'implantation religieuse augmente de #P 2#!.\n#N 0,5 %#! de la population [SCOPE.sState('ve_evt_target_state').GetName] devient radicale.\nLe projet continue."

 ve_cul_evt.7.t:0 "L’initiative perd sa légitimité"
 ve_cul_evt.7.d:0 "L’Initiative pour l’égalité des citoyens en  [SCOPE.sState('ve_evt_target_state').GetName] est en train de perdre le soutien des institutions établies et du gouvernement. [SCOPE.sCulture('ve_evt_target_culture').GetName] communautés qu’il était censé servir. Les mouvements radicaux présentent désormais tout compromis comme la preuve que le gouvernement ne peut pas garantir l’égalité."
 ve_cul_evt.7.f:0 "\"Une réforme peut survivre à l'opposition. Elle ne peut pas survivre à devenir incroyable.\""
 ve_cul_evt.7.a:0 "Mettre fin à l'initiative."
 ve_cul_evt.7.a.tt:0 "Annuler le projet culturel sans remboursement du mandat culturel.\nLa cohésion nationale diminue de #N 5#!.\nPendant #Y 2 ans#! : #N -50#! bureaucratie, #N -25#! autorité et #N -3 %#! réussite de la promulgation de la loi."
 ve_cul_evt.7.b:0 "Émettre des subventions locales d'urgence."
 ve_cul_evt.7.b.tt:0 "Dépenser #N 25#! mandat culturel.\nLa progression du projet culturel diminue de #N 5#!.\n#N 1%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population [SCOPE.sState('ve_evt_target_state').GetName] devient Radicale.\nLe projet continue."
 ve_cul_evt.7.c:0 "Continuer avec un programme minimal."
 ve_cul_evt.7.c.tt:0 "La progression du projet culturel diminue de #N 10#!.\nLa cohésion nationale diminue de #N 2#!.\nLe projet continue."
 ve_cul_evt.7.e:0 "Reconstruire la coalition."
 ve_cul_evt.7.e.tt:0 "Dépenser #N 15#! Mandat culturel.\nLa progression du projet culturel diminue de #N 3#!.\nLa cohésion nationale augmente de #P 2#!.\n#N 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population en [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet continue."

 ve_rel_evt.8.t:0 "Une concorde locale inattendue"
 ve_rel_evt.8.d:0 "Le clergé, les fonctionnaires municipaux et les anciens de la communauté [SCOPE.sState('ve_evt_target_state').GetName] sont parvenus à un accord qu'aucune directive centrale n'aurait pu produire. La résistance locale recule, les congrégations coordonnent elles-mêmes la mission et la conversion confessionnelle a acquis un élan inattendu."
 ve_rel_evt.8.f:0 "\\"Ce qui a commencé comme un ordre de la capitale est devenu un pacte conclu sur la place de la ville.\\""
 ve_rel_evt.8.a:0 "Utilisez cet élan au maximum."
 ve_rel_evt.8.a.tt:0 "L'implantation religieuse augmente de #P 1#!.\nLa progression du projet religieux augmente de #P 25#!.\nSi la progression atteint #Y 100#!, l'effet d'achèvement normal du projet est appliqué."
 ve_rel_evt.8.b:0 "La durabilité avant la vitesse."
 ve_rel_evt.8.b.tt:0 "L'établissement religieux augmente de #P 4#!.\nLa progression du projet religieux augmente de #P 10#!.\nSi les progrès atteignent #Y 100#!, l'effet d'achèvement normal du projet est appliqué."

 ve_cul_evt.8.t:0 "Une coalition civique locale"
 ve_cul_evt.8.d:0 "Enseignants, fonctionnaires municipaux, associations professionnelles et représentants du [SCOPE.sCulture('ve_evt_target_culture').GetName] communauté dans [SCOPE.sState('ve_evt_target_state').GetName] ont formé un comité commun. En résolvant les conflits avant qu’ils n’atteignent la capitale, cette coalition a donné à l’Initiative pour l’égalité des citoyens un élan que l’administration n’a pas pu créer."
 ve_cul_evt.8.f:0 "« La citoyenneté est devenue réelle lorsque des institutions qui partageaient rarement la table ont commencé à partager les responsabilités. »"
 ve_cul_evt.8.a:0 "Utiliser l'élan de la coalition."
 ve_cul_evt.8.a.tt:0 "La cohésion nationale augmente de #P 1#!.\nLa progression du projet culturel augmente de #P 25#!.\nSi la progression atteint #Y 100#!, l'effet d'achèvement normal du projet est appliqué."
 ve_cul_evt.8.b:0 "Rendre les institutions permanentes."
 ve_cul_evt.8.b.tt:0 "La cohésion nationale augmente de #P 4#!.\nLa progression du projet culturel augmente de #P 10#!.\nSi la progression atteint #Y 100#!, l'effet d'achèvement normal du projet est appliqué."

 ve_rel_evt.40.t:0 "Enregistrements décalés"
 ve_rel_evt.40.d:0 "Registres provinciaux dans [SCOPE.sState('ve_evt_target_state').GetName] utiliser des catégories incompatibles pour les congrégations, les associations civiques et les institutions publiques. Les informations parvenues à la capitale se contredisent désormais, laissant le projet incapable de distinguer la conformité de la résistance."
 ve_rel_evt.40.f:0 "\\"Une politique administrée à travers trois grands livres acquiert bientôt trois réalités différentes.\\""
 ve_rel_evt.40.a:0 "Envoyez un audit central."
 ve_rel_evt.40.a.tt:0 "Dépensez #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 5#!.\nL'établissement religieux augmente de #P 1#!."
 ve_rel_evt.40.b:0 "Réconciliez les enregistrements localement."
 ve_rel_evt.40.b.tt:0 "La progression du projet religieux diminue de #N 3#!.\nLes colonies religieuses augmentent de #P 2#!."
 ve_rel_evt.40.c:0 "Appliquez la procédure d'enregistrement standard."
 ve_rel_evt.40.c.tt:0 "Dépensez #N 5#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 4#!.\nL'implantation religieuse augmente de #P 1#!."

 ve_rel_evt.41.t:0 "Une pénurie de personnel provincial"
 ve_rel_evt.41.d:0 "Les bureaux qui dirigent le projet [SCOPE.sState('ve_evt_target_state').GetName] ne trouvent pas suffisamment de commis, d'enseignants et d'inspecteurs qualifiés. Les directives s’accumulent plus vite que les autorités locales ne peuvent les interpréter, et les nominations précipitées menacent d’aggraver chaque conflit."
 ve_rel_evt.41.f:0 "\\"Le décret est arrivé en un jour. Les personnes capables de l'exécuter pourraient prendre une génération.\\""
 ve_rel_evt.41.a:0 "Financer un nouveau cadre de fonctionnaires."
 ve_rel_evt.41.a.tt:0 "Dépenser #N 15#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 6#!."
 ve_rel_evt.41.b:0 "Ralentir la mise en œuvre."
 ve_rel_evt.41.b.tt:0 "La progression du projet religieux diminue de #N 6#!.\nLes colonies religieuses augmentent de #P 2#!."
 ve_rel_evt.41.c:0 "Utiliser le réseau éducatif existant."
 ve_rel_evt.41.c.tt:0 "Dépenser #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 5#!.\nLa colonie religieuse augmente de #P 1#!."

 ve_rel_evt.42.t:0 "Des rumeurs dans tout le district"
 ve_rel_evt.42.d:0 "Des rumeurs dans [SCOPE.sState('ve_evt_target_state').GetName] affirment que le projet cache des mesures bien plus dures que celles annoncées par le gouvernement. Les organisateurs religieux et les agitateurs locaux répètent des histoires contradictoires, tandis que le silence officiel donne à chaque nouvelle version la possibilité de se propager."
 ve_rel_evt.42.f:0 "\\"Une rumeur ne nécessite aucun bureau, aucun budget et aucune signature.\\""
 ve_rel_evt.42.a:0 "Publiez les rapports."
 ve_rel_evt.42.a.tt:0 "La progression du projet religieux diminue de #N 3#!.\nLes colonies religieuses augmentent de #P 4.#!."
 ve_rel_evt.42.b:0 "Rejetez l'agitation."
 ve_rel_evt.42.b.tt:0 "La progression du projet religieux augmente de #P 5#!.\nLes colonies religieuses diminuent de #N 3#!.\n#N 1 %#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_rel_evt.42.c:0 "Commandez des médiateurs locaux."
 ve_rel_evt.42.c.tt:0 "Dépenser #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 4#!.\nLes colonies religieuses augmentent de #P 2#!.\n#P 0,5 %#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient loyaliste."

 ve_rel_evt.43.t:0 "L’administration au point de rupture"
 ve_rel_evt.43.d:0 "Le projet en [SCOPE.sState('ve_evt_target_state').GetName] est au bord de l’effondrement administratif. Les bureaux provinciaux sont débordés, la confiance du public s'est effondrée et l'opposition organisée considère désormais chaque nouvelle directive comme la preuve que le gouvernement a perdu le contrôle."
 ve_rel_evt.43.f:0 "\\"Quand les dossiers s'arrêtent, la crise se déplace dans la rue.\\""
 ve_rel_evt.43.a:0 "Terminez le programme."
 ve_rel_evt.43.a.tt:0 "Annulez le projet religieux sans remboursement de la réforme de la piété.\nL'établissement religieux diminue de #N 5#!.\nPendant #Y 2 ans#! : #N -50#! bureaucratie, #N -50#! autorité et #N -3 %#! réussite de la promulgation des lois."
 ve_rel_evt.43.b:0 "Transférer des ressources d'urgence."
 ve_rel_evt.43.b.tt:0 "Dépenser #N 25#! réforme de la piété.\nLa progression du projet religieux diminue de #N 5#!.\n#N 1 %#! de la population dans [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLe projet continue."
 ve_rel_evt.43.c:0 "Continuez avec un personnel restreint."
 ve_rel_evt.43.c.tt:0 "La progression du projet religieux diminue de #N 10#!.\nL'implantation religieuse diminue de #N 2#!.\nLe projet continue."
 ve_rel_evt.43.e:0 "Reconstruire le partenariat local."
 ve_rel_evt.43.e.tt:0 "Dépenser #N 15#! Réforme de la piété.\nLa progression du projet religieux diminue de #N 3#!.\nLes colonies religieuses augmentent de #P 2#!.\n#N 0,5 %#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient radical.\nLe projet continue."

 ve_rel_evt.100.t:0 "Sièges au Conseil interconfessionnel"
 ve_rel_evt.100.d:0 "Délégués en [SCOPE.sState('ve_evt_target_state').GetName] conviennent qu’un conseil interreligieux est nécessaire, mais ne déterminent pas qui mérite un siège. La représentation proportionnelle rassurerait les petites communautés, tandis qu'un établissement fixe conçu dans la capitale pourrait commencer à fonctionner immédiatement."
 ve_rel_evt.100.f:0 "\\"Tout le monde soutient une table commune jusqu'à ce que les chaises soient comptées.\\""
 ve_rel_evt.100.a:0 "Répartir la représentation par population."
 ve_rel_evt.100.a.tt:0 "La progression du projet religieux diminue de #N 3#!.\nL'implantation religieuse augmente de #P 4#!."
 ve_rel_evt.100.b:0 "Impose un compromis central fixe."
 ve_rel_evt.100.b.tt:0 "La progression du projet religieux augmente de #P 5#!.\nL'implantation religieuse diminue de #N 2#!.\n#N 0,5 %#! de la population [SCOPE.sState('ve_evt_target_state').GetName] devient radicale."
 ve_rel_evt.100.c:0 "Autonomisez les conseils interconfessionnels."
 ve_rel_evt.100.c.tt:0 "Dépensez #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 5#!.\nL'établissement religieux augmente de #P 2#!."

 ve_rel_evt.101.t:0 "Un programme scolaire partagé"
 ve_rel_evt.101.d:0 "Les écoles dans [SCOPE.sState('ve_evt_target_state').GetName] Nous avons besoin de leçons civiques communes sans transformer la campagne de sensibilisation à la liberté en une campagne contre les croyances locales. Les enseignants demandent du matériel clair et une formation commune, tandis que les dirigeants communautaires insistent pour que l'enseignement local laisse une place à leurs traditions."
 ve_rel_evt.101.f:0 "\\"Une leçon partagée ne réussit que si chaque famille reconnaît la salle de classe comme la sienne.\\""
 ve_rel_evt.101.a:0 "Financer un corps enseignant commun."
 ve_rel_evt.101.a.tt:0 "Dépenser #N 15#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 6#!.\nL'implantation religieuse augmente de #P 1#!."
 ve_rel_evt.101.b:0 "Laissez de la place aux programmes locaux."
 ve_rel_evt.101.b.tt:0 "La progression du projet religieux diminue de #N 4#!.\nL'implantation religieuse augmente de #P 3#!."
 ve_rel_evt.101.c:0 "Amenez la coalition réformatrice dans les écoles."
 ve_rel_evt.101.c.tt:0 "Dépensez #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 5#!.\nLes colonies religieuses augmentent de #P 2#!.\n#P 0,5 %#! de la population dans [SCOPE.sState('ve_evt_target_state').GetName] devient Loyaliste."

 ve_rel_evt.102.t:0 "Une Charte de Garanties Mutuelles"
 ve_rel_evt.102.d:0 "Les communautés religieuses, les élus municipaux et les associations réformatrices du [SCOPE.sState('ve_evt_target_state').GetName] ont rédigé une charte commune. Chaque signataire accepte les mêmes obligations civiques en échange de garanties publiques qu'aucune communauté ne sera exclue des institutions locales."
 ve_rel_evt.102.f:0 "\\"La confiance est devenue possible lorsque chaque promesse a été écrite comme un droit d'autrui.\\""
 ve_rel_evt.102.a:0 "Utilisez l'élan du pacte."
 ve_rel_evt.102.a.tt:0 "Les colonies religieuses augmentent de #P 2#!.\nLa progression du projet religieux augmente de #P 20#!.\nSi la progression atteint #Y 100#!, l'effet d'achèvement normal du projet est appliqué."
 ve_rel_evt.102.b:0 "Rendez les garanties permanentes."
 ve_rel_evt.102.b.tt:0 "L'établissement religieux augmente de #P 4#!.\n#P 0,5%#! de la population dans [SCOPE.sState('ve_evt_target_state').GetName] devient loyaliste.\nLa progression du projet religieux augmente de #P 10#!.\nSi la progression atteint #Y 100#!, l'effet d'achèvement normal du projet est appliqué."

 ve_rel_evt.150.t:0 "Enseignants ou inspecteurs ?"
 ve_rel_evt.150.d:0 "La campagne de sécularisation en [SCOPE.sState('ve_evt_target_state').GetName] a révélé une pénurie de personnel instruit. L’administration peut élargir le corps enseignant qui renforce les capacités civiques à long terme, ou s’appuyer sur des inspecteurs capables de faire appliquer les nouvelles règles avec le personnel déjà disponible."
 ve_rel_evt.150.f:0 "\\"Un inspecteur peut fermer une école en un après-midi. Un enseignant peut avoir besoin de plusieurs années pour remplacer ce qui y était enseigné.\\""
 ve_rel_evt.150.a:0 "Développer le corps enseignant."
 ve_rel_evt.150.a.tt:0 "Dépenser #N 15#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 6#!."
 ve_rel_evt.150.b:0 "Ralentissez le programme pour correspondre au personnel existant."
 ve_rel_evt.150.b.tt:0 "La progression du projet religieux diminue de #N 5#!.\nL'établissement religieux augmente de #P 2#!."
 ve_rel_evt.150.c:0 "Commandez le réseau d'éducation publique."
 ve_rel_evt.150.c.tt:0 "Dépensez #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 5#!.\nL'établissement religieux augmente de #P 1#!."

 ve_rel_evt.151.t:0 "Les biens saisis"
 ve_rel_evt.151.d:0 "Anciennes propriétés religieuses de [SCOPE.sState('ve_evt_target_state').GetName] soyez prêts à être convertis en écoles, cliniques et bureaux civiques. Un transfert immédiat donnerait à la campagne une infrastructure précieuse, mais l'absence de compensation est en train de devenir un point de ralliement pour les dévots."
 ve_rel_evt.151.f:0 "\\"Les clés ont changé de mains en une matinée. La dispute sur la propriété survivra aux serrures.\\""
 ve_rel_evt.151.a:0 "Payez l'indemnisation par étapes."
 ve_rel_evt.151.a.tt:0 "Dépensez #N 15#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 3#!.\nLes colonies religieuses augmentent de #P 3#!."
 ve_rel_evt.151.b:0 "Mettez immédiatement les propriétés en service public."
 ve_rel_evt.151.b.tt:0 "La progression des projets religieux augmente de #P 7#!.\nLes colonies religieuses diminuent de #N 4#!.\n#N 1 %#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient Radical.\nLes Dévots perdent #N 1#! Approbation pour #Y 2,5 ans#!."
 ve_rel_evt.151.c:0 "Transférez-les vers des institutions sociales laïques."
 ve_rel_evt.151.c.tt:0 "Dépensez #N 10#! Réforme de la piété.\nLa progression du projet religieux augmente de #P 5#!.\nL'implantation religieuse augmente de #P 2#!.\n#P 0,5 %#! de la population de [SCOPE.sState('ve_evt_target_state').GetName] devient loyaliste."

 ve_rel_evt.152.t:0 "Les associations civiques s'enracinent"
 ve_rel_evt.152.d:0 "Les cercles d'enseignants, les sociétés d'entraide et les associations municipales de [SCOPE.sState('ve_evt_target_state').GetName] ont commencé à fournir des services autrefois organisés par le biais d'institutions religieuses. Leur coopération a donné à la campagne de sécularisation une fondation civique locale au lieu d'une simple présence administrative."
 ve_rel_evt.152.f:0 "\\"Le nouvel ordre a perduré lorsque les citoyens ont commencé à le maintenir sans attendre un inspecteur.\\""
 ve_rel_evt.152.a:0 "Exploitez l'élan local."
 ve_rel_evt.152.a.tt:0 "L'établissement religieux augmente de #P 2#!.\nLa progression du projet religieux augmente de #P 20#!.\nSi la progression atteint #Y 100#!, l'effet d'achèvement normal du projet est appliqué."
 ve_rel_evt.152.b:0 "Transformez les associations en institutions permanentes."
 ve_rel_evt.152.b.tt:0 "L'établissement religieux augmente de #P 4#!.\nLa progression du projet religieux augmente de #P 10#!.\nSi la progression atteint #Y 100#!, l'effet d'achèvement normal du projet est appliqué."

 ve_cul_evt.40.t:0 "Conseils scolaires locaux"
 ve_cul_evt.40.d:0 "Les commissions scolaires en [SCOPE.sState('ve_evt_target_state').GetName] désaccord sur la place du [SCOPE.sCulture('ve_evt_target_culture').GetName] langue dans l'enseignement public. L'enseignement en langue locale préserverait la confiance, tandis qu'une langue administrative unique faciliterait la conduite du projet national."
 ve_cul_evt.40.f:0 "\\"La langue choisie pour le premier cours décide souvent qui croit que l'école lui appartient.\\""
 ve_cul_evt.40.a:0 "Protéger la langue locale."
 ve_cul_evt.40.a.tt:0 "La progression du projet culturel diminue de #N 4#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.40.b:0 "Imposer une seule langue administrative."
 ve_cul_evt.40.b.tt:0 "La progression du projet culturel augmente de #P 5#!.\nLa cohésion nationale diminue de #N 2#!.\n#N 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population [SCOPE.sState('ve_evt_target_state').GetName] devient radicale."
 ve_cul_evt.40.c:0 "Élargissez le réseau d'enseignants."
 ve_cul_evt.40.c.tt:0 "Dépensez #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 4#!.\nLa cohésion nationale augmente de #P 2#!."

 ve_cul_evt.41.t:0 "Limites statistiques "
 ve_cul_evt.41.d:0 "Enquêtes officielles [SCOPE.sState('ve_evt_target_state').GetName] ne peut pas se mettre d'accord sur le point où [SCOPE.sCulture('ve_evt_target_culture').GetName] la communauté commence et se termine. Les identités locales chevauchent la langue, le district et les coutumes, mais le projet national exige des catégories qui puissent être comptées et administrées."
 ve_cul_evt.41.f:0 "\\"Une frontière tracée pour le recensement acquiert bientôt des fonctionnaires, des budgets et des défenseurs.\\""
 ve_cul_evt.41.a:0 "Laissez de la place à l'auto-identification."
 ve_cul_evt.41.a.tt:0 "Les progrès du projet culturel diminuent de #N 3#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.41.b:0 "Laissez le centre définir les limites."
 ve_cul_evt.41.b.tt:0 "La progression du projet culturel augmente de #P 6#!.\nLa cohésion nationale diminue de #N 3#!.\n#N 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population en [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_cul_evt.41.c:0 "Utilisez le système de registre standard."
 ve_cul_evt.41.c.tt:0 "Dépensez #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 1#!."

 ve_cul_evt.42.t:0 "Le projet national au point de rupture"
 ve_cul_evt.42.d:0 "Le projet national en [SCOPE.sState('ve_evt_target_state').GetName] est sur le point de s'effondrer. Les mouvements radicaux affirment que le gouvernement a soit trahi le gouvernement, soit [SCOPE.sCulture('ve_evt_target_culture').GetName] communauté ou s'y sont soumis, tandis que les bureaux locaux n'ont plus la confiance nécessaire pour imposer un autre compromis."
 ve_cul_evt.42.f:0 "\\"Une colonie attaquée à la fois par la coercition et la reddition pourrait bientôt cesser d'être une colonie.\\""
 ve_cul_evt.42.a:0 " Mettre fin au projet."
 ve_cul_evt.42.a.tt:0 "Annulez le projet culturel sans remboursement du mandat culturel.\nLa cohésion nationale diminue de #N 5#!.\nPendant #Y 2 ans#! : #N -50#! Bureaucratie, #N -25#! Autorité et #N -3 %#! Réussite de l'adoption de la loi."
 ve_cul_evt.42.b:0 "Transférer des ressources locales d'urgence."
 ve_cul_evt.42.b.tt:0 "Dépenser #N 25#! Mandat culturel.\nLa progression du projet culturel diminue de #N 5#!.\n#N 1 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population devient [SCOPE.sState('ve_evt_target_state').GetName]  Radical.\nLe projet continue."
 ve_cul_evt.42.c:0 "Continuer avec un programme minimal."
 ve_cul_evt.42.c.tt:0 "Les progrès du projet culturel diminuent de #N 10#!.\nLa cohésion nationale diminue de #N 2#!.\nLe projet continue."
 ve_cul_evt.42.e:0 "Reconstruire le cadre de négociation."
 ve_cul_evt.42.e.tt:0 "Dépenser #N 15#! Mandat culturel.\nLes progrès du projet culturel diminuent de #N 3#!.\nLa cohésion nationale augmente de #P 2#!.\n#N 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population en [SCOPE.sState('ve_evt_target_state').GetName] devient radical.\nLe projet continue."

 ve_cul_evt.50.t:0 "La directive sur le nom et la langue"
 ve_cul_evt.50.d:0 "Les fonctionnaires de [SCOPE.sState('ve_evt_target_state').GetName] proposer de standardiser les noms de famille et les actes publics dans la langue nationale. La directive rendrait le [SCOPE.sCulture('ve_evt_target_culture').GetName] Il est plus facile pour l'administration centrale de classer la population, mais les familles craignent que l'identité privée ne devienne un objet de contrôle de l'État."
 ve_cul_evt.50.f:0 "\\"Un nom écrit différemment dans le registre peut toujours être le nom sous lequel une famille se souvient d'elle-même.\\""
 ve_cul_evt.50.a:0 "Financer une campagne d'inscription progressive."
 ve_cul_evt.50.a.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 4#!.\nLa cohésion nationale augmente de #P 1#!.\n#N 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population [SCOPE.sState('ve_evt_target_state').GetName] devient radicale."
 ve_cul_evt.50.b:0 "Appliquer une norme nationale."
 ve_cul_evt.50.b.tt:0 "Les progrès du projet culturel augmentent de #P 7#!.\nLa cohésion nationale diminue de #N 4#!.\n#N 1%#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population [SCOPE.sState('ve_evt_target_state').GetName] devient radicale."
 ve_cul_evt.50.c:0 "Retirez la directive pour révision."
 ve_cul_evt.50.c.tt:0 "Les progrès du projet culturel diminuent de #N 5#!.\nLa cohésion nationale augmente de #P 3#!."

 ve_cul_evt.51.t:0 "Les registres de conscription"
 ve_cul_evt.51.d:0 "Les responsables militaires [SCOPE.sState('ve_evt_target_state').GetName] exiger un registre unique pour les obligations de service, les noms et les commandements. En l'appliquant au [SCOPE.sCulture('ve_evt_target_culture').GetName] La population renforcerait la dynamique d’intégration ethnique, mais la résistance grandit parmi les communautés qui voient l’armée comme un autre instrument d’effacement culturel."
 ve_cul_evt.51.f:0 "\\"L'État apprend d'abord le nom d'un village lorsqu'il veut percevoir ses impôts ou convoquer ses fils.\\""
 ve_cul_evt.51.a:0 "Appliquer les registres nationaux."
 ve_cul_evt.51.a.tt:0 "La progression des projets culturels augmente de #P 5#!.\nLa cohésion nationale diminue de #N 2#!.\n#N 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population en [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_cul_evt.51.b:0 "Préserver les pratiques d’enregistrement locales."
 ve_cul_evt.51.b.tt:0 "Les progrès du projet culturel diminuent de #N 3#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.51.c:0 "Intégrer les registres par le service militaire."
 ve_cul_evt.51.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nL'avancement du projet culturel augmente de #P 6#!.\nLa cohésion nationale augmente de #P 1#!.\n#N 0,5 %#! du [SCOPE.sCulture('ve_evt_target_culture').GetName] La population in [SCOPE.sState('ve_evt_target_state').GetName] devient radicale."

 ve_cul_evt.100.t:0 "La Délégation Constituante"
 ve_cul_evt.100.d:0 "Une délégation de [SCOPE.sCulture('ve_evt_target_culture').GetName] la [SCOPE.sState('ve_evt_target_state').GetName] communauté"
 ve_cul_evt.100.f:0 "est arrivée avec des revendications de représentation dans les institutions du Pacte Constituant. La négociation ralentirait le projet mais renforcerait sa légitimité ; un règlement imposé par le capital pourrait avancer plus rapidement au détriment de la confiance."
 ve_cul_evt.100.a:0 "Négocier leur place dans le pacte."
 ve_cul_evt.100.a.tt:0 "La progression du projet culturel diminue de #N 4#!.\nLa cohésion nationale augmente de #P 4#!."
 ve_cul_evt.100.b:0 "Imposer le règlement central."
 ve_cul_evt.100.b.tt:0 "La progression du projet culturel augmente de #P 5#!.\nLa cohésion nationale diminue de #N 2#!.\n#N 0,5 %#! de la [SCOPE.sCulture('ve_evt_target_culture').GetName] population en [SCOPE.sState('ve_evt_target_state').GetName] devient radical."
 ve_cul_evt.100.c:0 "Faites participer la coalition parlementaire aux pourparlers."
 ve_cul_evt.100.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 4#!.\nLa cohésion nationale augmente de #P 2#!."

 ve_cul_evt.101.t:0 "Double administration"
 ve_cul_evt.101.d:0 "Le pacte constituant en [SCOPE.sState('ve_evt_target_state').GetName] dépend désormais de deux administrations qui se chevauchent. Les responsables centraux et les représentants du [SCOPE.sCulture('ve_evt_target_culture').GetName] la communauté duplique les registres, conteste les nominations et donne des instructions contradictoires tandis que la bureaucratie du pays est proche de l'épuisement."
 ve_cul_evt.101.f:0 "\\"Deux bureaux peuvent partager l'autorité plus facilement qu'ils ne peuvent partager un classeur.\\""
 ve_cul_evt.101.a:0 "Financer un personnel administratif commun."
 ve_cul_evt.101.a.tt:0 "Dépenser #N 15#! Mandat culturel.\nLa progression du projet culturel augmente de #P 6#!."
 ve_cul_evt.101.b:0 "Ralentissez le pacte jusqu'à ce que les bureaux soient d'accord."
 ve_cul_evt.101.b.tt:0 "La progression du projet culturel diminue de #N 6#!.\nLa cohésion nationale augmente de #P 2#!."
 ve_cul_evt.101.c:0 "Unifier les bureaux de la fonction publique."
 ve_cul_evt.101.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nL'avancement des projets culturels augmente de #P 5#!.\nLa cohésion nationale augmente de #P 2#!."

 ve_cul_evt.150.t:0 "Mise en œuvre dans les provinces"
 ve_cul_evt.150.d:0 "Les administrations provinciales signalent que le projet culturel national avance à des rythmes radicalement différents. Certains bureaux exigent des commissions de mise en œuvre financées, tandis que d'autres préviennent qu'imposer un calendrier unique à chaque région exigerait un personnel rare et affaiblirait la confiance du public."
 ve_cul_evt.150.f:0 "\\"Un décret national est écrit une fois, mais il doit être appliqué dans chaque bureau du pays.\\""
 ve_cul_evt.150.a:0 "Financer les commissions de mise en œuvre."
 ve_cul_evt.150.a.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 5#!."
 ve_cul_evt.150.b:0 "Utilisez un calendrier progressif."
 ve_cul_evt.150.b.tt:0 "La progression du projet culturel diminue de #N 4.#!.\nLa cohésion nationale augmente de #P 2#!."
 ve_cul_evt.150.c:0 "Standardiser l'administration existante."
 ve_cul_evt.150.c.tt:0 "Dépenser #N 5#! Mandat culturel.\nLes progrès du projet culturel augmentent de #P 3#!.\nLa cohésion nationale augmente de #P 2#!."

 ve_cul_evt.151.t:0 "La langue d'enseignement"
 ve_cul_evt.151.d:0 "Le programme national exige une langue d'enseignement commune, mais les écoles à travers le pays desservent des communautés aux traditions linguistiques très différentes. Les matériels multilingues préserveraient la confiance mais retarderaient leur distribution, tandis qu'un programme unique pourrait atteindre rapidement les salles de classe au risque de transformer l'éducation en un concours culturel."
 ve_cul_evt.151.f:0 "\"Une leçon enseignée dans une langue dont l'élève se méfie peut être mémorisée pour tout sauf pour son sujet.\\""
 ve_cul_evt.151.a:0 "Financer du matériel multilingue."
 ve_cul_evt.151.a.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 3#!.\nLa cohésion nationale augmente de #P 3#!."
 ve_cul_evt.151.b:0 "Appliquer un programme national."
 ve_cul_evt.151.b.tt:0 "La progression du projet culturel augmente de #P 6#!.\nLa cohésion nationale diminue de #N 3#!."
 ve_cul_evt.151.c:0 "Unissez les réseaux d'enseignement et de protection sociale."
 ve_cul_evt.151.c.tt:0 "Dépensez #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 5#!.\nLa cohésion nationale augmente de #P 2#!."

 ve_cul_evt.160.t:0 "Qui représente la nation ?"
 ve_cul_evt.160.d:0 "Le projet Symboles partagés a rouvert la question de savoir quelle histoire, quels uniformes, monuments et cérémonies peuvent représenter pour l'ensemble du pays. La rotation des traditions élargirait la reconnaissance mais ralentirait l'accord ; sélectionner un seul récit officiel créerait de la clarté tout en laissant de nombreux citoyens en dehors."
 ve_cul_evt.160.f:0 "\\"Un symbole ne devient national que lorsque les citoyens s'y reconnaissent sans avoir besoin d'explication.\\""
 ve_cul_evt.160.a:0 "Faites pivoter les symboles utilisés par le public."
 ve_cul_evt.160.a.tt:0 "La progression du projet culturel diminue de #N 3#!.\nLa cohésion nationale augmente de #P 4#!."
 ve_cul_evt.160.b:0 "Sélectionnez un récit officiel."
 ve_cul_evt.160.b.tt:0 "Les progrès du projet culturel augmentent de #P 6#!.\nLa cohésion nationale diminue de #N 3#!."
 ve_cul_evt.160.c:0 "Concevoir une cérémonie publique partagée."
 ve_cul_evt.160.c.tt:0 "Dépenser #N 10#! Mandat culturel.\nLa progression du projet culturel augmente de #P 4#!.\nLa cohésion nationale augmente de #P 2#!."
