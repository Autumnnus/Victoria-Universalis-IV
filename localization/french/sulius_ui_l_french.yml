l_french:
 SULIUS_LEGITIMACY_LEVEL_ACTIVE_TOOLTIP:0 "#tooltip_header [concept_legitimacy] \n[LegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\n$LEGITIMACY_LEVEL_BOUNDS_DESC$\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\nEffets :#indent_newline:2 \n[LegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\nCeci est dû à :#indent_newline:2 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 SULIUS_CAPITAL_MONEY:0 "#tooltip_header [concept_money]#!\nSolde : #variable @money![AccessPlayer.PredictWeeklyBalance|D=+]#![GetPlayer.GetPowerDeltaIcon('money')]\n[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.GetPrincipal, '(CFixedPoint)0'), 'CREDIT_DESC', 'GOLD_RESERVES_DESC')]\nLimite des réserves d'or : @money![GetPlayer.GetGoldReserveLimit|Dv]#!#![SelectLocalization(GetMetaPlayer.GetPlayedOrObservedCountry.IsValid, 'CAPITAL_MONEY_DELAYED', 'OBSERVER_NO_COUNTRY_SELECTED') ]"
 
 SULIUS_RESEARCH:0 "#tooltip_header [concept_technology]#!\n[SelectLocalization( GetPlayer.GetCurrentlyResearchedTechnology.IsValid, 'SULIUS_RESEARCHING', 'SULIUS_NOT_RESEARCHING' )]\n$TOOLTIP_DELIMITER$\n#V Progression de la technologie#!\n#help De [concept_innovation] : @innovation![GetPlayer.GetWeeklyInnovation|+0]\nDe [concept_technology_spread] : [GetPlayer.GetWeeklyTechnologySpreadForTechDesc(GetPlayer.GetCurrentlyResearchedTechnology.Self)]\n$TOOLTIP_DELIMITER$\n#V [concept_innovation]#!\nNous générons #v @innovation![GetPlayer.GetWeeklyInnovation|+2]#! [concept_innovation] chaque semaine :\n[GetPlayer.GetWeeklyInnovationDesc]\n\nUn maximum de @innovation![GetPlayer.GetWeeklyMaxInnovation|v2] [concept_innovation] peut être investi dans la recherche active chaque semaine :\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\nToute [concept_innovation] non dépensée en raison de plafonds d'investissement ou d'un manque de recherche active augmentera le taux de [concept_technology_spread] pour notre pays"
 SULIUS_RESEARCHING:0 "[GetPlayer.GetName] recherche actuellement [GetPlayer.GetCurrentlyResearchedTechnology.GetName]#!\nProgression : #v @innovation! [GetPlayer.GetCurrentlyResearchedTechnology.GetProgress(GetPlayer.Self)|D]#! / #maximum [GetPlayer.GetCurrentlyResearchedTechnology.GetCost(GetPlayer.Self)|D]#! ([GetPlayer.GetCurrentlyResearchedTechnology.GetTimeLeftDesc( GetPlayer.Self )] restants)"
 SULIUS_NOT_RESEARCHING:0 "[GetPlayer.GetName] ne mène actuellement aucune recherche active."
