l_french:
 ve_national_identity:0 "Identité nationale"
 ve_primary_cultures_label:0 "Cultures primaires"
 ve_identity_models:0 "Modèles d'identité"
 ve_identity_model_active_footer:0 "Déjà actifs"
 ve_switch_identity_button:0 "Coûts"
 ve_switch_identity_cost_label:0 "de changement #Y 200 Mandat culturel#!"
 ve_begin_project_button:0 "Commencer le projet"
 ve_identity_models_help:0 "Votre nation a toujours exactement un modèle d'identité et il est #P déjà actif#!  – vous n'avez rien à choisir ici. Le modèle décide uniquement comment #Y Cohésion nationale#! est gagné et quel projet culturel vous pouvez mener.\n#Y Le changement est facultatif :#! il coûte #Y 200 mandat culturel#!, réinitialise la cohésion à #Y 35#!, annule tout projet culturel en cours et bloque tout autre changement pendant 5 ans.\n#Y Passez la souris sur n'importe quelle carte ou compteur pour connaître tous ses effets.#!"
 ve_ethnic_identity_name:0 "Nation ethnique"
 ve_civic_identity_name:0 "Nation civique"
 ve_composite_identity_name:0 "État composite"
 ve_ethnic_identity_short:0 "La nation est définie autour de ses cultures primaires.\nLa cohésion vient de #Y dominance démographique#!."
 ve_civic_identity_short:0 "Une nation politique construite grâce à l'école.\nLa cohésion vient de #Y l'alphabétisation et des minorités acceptées#!."
 ve_composite_identity_short:0 "Plusieurs peuples sous des institutions négociées.\nLa cohésion vient #Y d'une population véritablement plurielle#!."
 ve_ethnic_identity_unlocks:0 "Débloque le #Y Campagne d'intégration ethnique#! projet"
 ve_civic_identity_unlocks:0 "Débloque le #Y Projet#! Equal Citizenship Initiative"
 ve_composite_identity_unlocks:0 "Débloque le #Y Pacte constituant#! projet"
 ve_ethnic_identity_desc:0 "#header Ethnic Nation#!\nLa nation est définie autour de ses cultures primaires.\n\n#Y Pendant son activité#!\n#P +15 % d'assimilation, +5 % d'autorité#!\n#N -5 % d'attraction migratoire, +5 % de radicaux issus de préjugés ouverts#!\n\n#Y Cohésion#!\nAugmente lorsque les cultures primaires représentent au moins 60 à 75 % de la population et chute nettement en dessous de 40 %.\n\n#Y À 75 de cohésion#!\n#P +5% de taux de conscription, +3 de légitimité#!\n\n#Y Projet culturel#!\nCampagne d'intégration ethnique"
 ve_civic_identity_desc:0 "#header Nation civique#!\nUne nation politique partagée se construit par l'éducation et la participation.\n\n#Y Pendant qu'elle est active#!\n#P +7% d'attraction migratoire, +1% d'accès à l'éducation#!\n#N -10% d'assimilation, -5% d'autorité, -50 Bureaucratie#!\n\n#Y Cohésion#!\nL'alphabétisation l'augmente, mais toute culture non primaire au-dessus de 10 % de la population avec une très faible acceptation la diminue.\n\n#Y À 75 Cohésion#!\n#P +5 % de Qualifications, +3 Légitimité#!\n\n#Y Projet Culturel#!\nCitoyenneté Égalité Initiative"
 ve_composite_identity_desc:0 "#header État composite#!\nPlusieurs peuples sont gouvernés par des institutions négociées.\n\n#Y Pendant leur activité#!\n#P -10 % de radicaux issus de l'effacement culturel et de la citoyenneté de second ordre, +5 % d'influence#!\n#N -15% Assimilation, -5% Autorité, -75 Bureaucratie#!\n\n#Y Cohésion#!\nUne population véritablement plurielle l'élève ; une population à plus de 90% de cultures primaires affaiblit ce modèle.\n\n#Y À 75 de cohésion#!\n#P +5% d'influence, +3 de légitimité#!\n\n#Y Projet culturel#!\nPacte constitutif"
 ve_identity_change_cost_tt:0 "Changer le modèle d'identité nécessite #Y 200 Mandat culturel#! et aucun contrecoup actif de transition d’identité. Le changement réinitialise la cohésion à #Y 35#!, provoque un #Y Un contrecoup de transition de 5 ans#! et annule tout projet culturel actif sans pénalité d'annulation supplémentaire."
 ve_cultural_mandate:0 "Mandat culturel"
 ve_culture_reform_point:0 "Mandat culturel"
 ve_cultural_mandate_hint:0 "Dépensé pour des projets culturels. L'épargner est sûr, mais le revenu diminue de moitié à 400 et s'arrête à 500."
 ve_culture_reform_point_tt:0 "#header Mandat culturel#!\nActuel : #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nVariation mensuelle : [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Pour quoi il est dépensé#!\nProjets culturels (75-150) et changements de modèle d'identité (200). Ni l'un ni l'autre n'est requis : le mandat d'épargne est sûr, le revenu n'est réduit que de moitié à 400 et s'arrête à 500.\n\n#Y Répartition mensuelle#!\nBase : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nSociété modèle : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nStabilité et mouvements culturels : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nAlignement des lois : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nIdée de doctrine : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nCap multiplicateur : #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Idée de doctrine — seul votre modèle d'identité actuel compte#!\n#P Nation ethnique#! : Nationaliste V #P +1#!\n#P Nation civique#! : Réformiste V #P +1#! ; Académique V #P +1#!\n#P État composite#! : Réformiste V #P +1#!\nLe total actif ci-dessus est plafonné à #Y +2#!.\n\nCivic Nation tire la composante de société modèle de l'alphabétisation, l'État composite de l'alphabétisation dans une société plurielle et la nation ethnique de la force démographique de la culture primaire.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "La cohésion nationale"
 ve_national_cohesion_hint:0 "dérive vers l'équilibre produit par votre modèle d'identité. À 75 ans et plus, vous gagnez un bonus, à 25 ans ou moins d'instabilité."
 ve_national_cohesion_tt:0 "#header Cohésion nationale#!\nActuel : #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nÉquilibre : #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMouvement mensuel : [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nConditions communes : [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nConditions du modèle d'identité : [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nLa cohésion déplace 20 % de la distance vers l'équilibre chaque mois, jusqu'à 5 points. Les mouvements culturels radicaux réduisent l’équilibre par 10. À 75 ans ou plus, le modèle actuel accorde un avantage supplémentaire ; à 25 ou moins, l'instabilité nationale s'applique.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Aucun effet"
 ve_cultural_projects:0 "Projets culturels"
 ve_cultural_projects_intro:0 "Les projets culturels sont #Y facultatif#!. Un seul peut se présenter à la fois : son coût de Mandat est payé immédiatement et #N -75 Bureaucratie et -25 Autorité#! postuler aussi longtemps qu'il fonctionne. Terminer un projet restitue du mandat et augmente la cohésion. Les projets à l’échelle nationale ne peuvent être répétés qu’après l’expiration de leur bénéfice d’achèvement ; une cible État/Culture terminée ne peut pas être sélectionnée à nouveau.\n#Y Survolez n'importe quelle carte ou compteur pour connaître tous ses effets.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Projet en cours"
 ve_cultural_project_progress:0 "Progression du projet"
 ve_cultural_project_progress_tt:0 "#header Progression mensuelle du projet#!\nActuel : #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nRestant : #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nTotal mensuel : [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (minimum 1, maximum 7)\n\n#Y Répartition mensuelle#!\nBase : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nSociété modèle : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nCohésion : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nMouvements culturels : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nÉtat-cible Turmoil : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nGroupes d'idées : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Groupes d'idées — seuls les bonus correspondant à votre modèle d'identité actuel sont actifs#!\n#P Nation ethnique#! : Nationaliste VII #P +1#!\n#P Nation civique#! : Réformiste VII, Académique VII ou Bien-être VI — #P +1#! chacun\n#P État composite#! : Réformiste VII ou Diplomatique VI — #P +1#! chacun\nLe total du groupe d'idées actif ci-dessus est plafonné à #Y +2#! ; tout bonus de contrepartie supplémentaire n'augmente pas les progrès.\n\nLa société modèle récompense l'alphabétisation civique, la concentration démographique ethnique ou la diversité composite selon le modèle d'identité actif. L'achèvement est résolu lors de la prochaine mise à jour mensuelle une fois que la progression atteint  #Y 100#!."
 ve_cancel_cultural_project_button:0 "Annuler le projet"
 ve_cancel_cultural_project_tt:0 "#header Annuler le projet culturel#!\nLe mandat culturel investi est #N non remboursé#!. La cohésion nationale échoue #N 5#! et un #N réaction de 2 ans#! empêche un autre projet."
 ve_start_cultural_project_button:0 "Démarrer le projet"
 ve_national_curriculum_name:0 "Programme national"
 ve_national_curriculum_cost:0 "Coût : #Y 100 Mandat culturel#!"
 ve_national_curriculum_short:0 "Une réforme scolaire à l'échelle nationale.\n#P +20 Mandat, +5 Cohésion#!, puis une meilleure éducation."
 ve_national_curriculum_desc:0 "#header Programme national#!\nUne réforme scolaire menée à travers tout le pays.\n\n#Y Coût#!\n#Y 100 Mandat Culturel#!, payé immédiatement\n\n#Y Une fois terminé#!\n#P +20 Mandat Culturel, +5 Cohésion Nationale#!\n\n#Y Pendant 10 ans après#!\n#P +2% Accès à l'Éducation, +5% Qualifications#!\n#N -25 Bureaucratie#!"
 ve_national_curriculum_requirements_tt:0 "Exigences #Y 100 Mandat Culturel#!, aucun projet culturel actif et aucun projet Contrecoup. Il ne peut pas non plus commencer alors que le précédent #Y Programme national#! l'avantage est actif."
 ve_shared_symbols_name:0 "Symboles partagés"
 ve_shared_symbols_cost:0 "Coût : #Y 75 Mandat culturel#!"
 ve_shared_symbols_short:0 "Drapeaux, hymnes et cérémonie publique.\n#P +20 Mandat, +7 Cohésion#!, puis loyalistes et Autorité."
 ve_shared_symbols_desc:0 "#header Symboles partagés#!\nDrapeaux, hymnes et cérémonie publique, promus dans tout le pays.\n\n#Y Coût#!\n#Y 75 Mandat culturel#!, payé immédiatement\n\n#Y À la fin#!\n#P +20 Mandat Culturel, +7 Cohésion Nationale#!\n\n#Y Pendant 8 ans après#!\n#P +10% Loyalistes issus de Pops Totalement Acceptées, +25 Autorité#!"
 ve_shared_symbols_requirements_tt:0 "Nécessite #Y 75 Mandat culturel#!, aucun projet culturel actif et aucun contrecoup de projet. Il ne peut pas non plus commencer alors que le précédent #Y Symboles partagés#! l’avantage est actif."
 ve_ethnic_campaign_name:0 "Campagne d'intégration ethnique"
 ve_ethnic_campaign_cost:0 "Coût : #Y 125 Mandat culturel#!"
 ve_ethnic_campaign_short:0 "Assimiler une grande minorité dans un État.\n#P +25 Mandat, +8 Cohésion#!, mais cela crée des radicaux."
 ve_ethnic_campaign_desc:0 "#header Campagne d'intégration ethnique#!\nMenée dans un seul État contre sa plus grande culture non primaire, qui doit contenir au moins #Y 5 %#! de la population de cet État.\n\n#Y Coût#!\n#Y 125 Culturel Mandat#!, payé immédiatement\n\n#Y À la fin#!\nAssimile #Y 5%#! de la culture cible dans une culture primaire, ou #Y 7%#! avec Nationaliste VII\n#P +25 Mandat Culturel, +8 Cohésion Nationale#!\nLaisse un #Y 10 ans#! programme d'assimilation dans l'État\n\n#Y Avertissement#!\n#N Le début et la fin du projet créent des radicaux au sein de la culture cible.#!"
 ve_civic_initiative_name:0 "Initiative d'égalité de citoyenneté"
 ve_civic_initiative_cost:0 "Coût : #Y 100 Mandat culturel#!"
 ve_civic_initiative_short:0 "Augmenter l'acceptation d'une minorité dans un État.\n#P +25 Mandat, +10 Cohésion#!, plus loyalistes."
 ve_civic_initiative_desc:0 "#header Initiative pour l'égalité de citoyenneté#!\nExécutée dans un seul État sur sa plus grande culture non primaire, qui doit contenir au moins #Y 5 %#!  de la population de cet État.\n\n#Y Coût#!\n#Y 100 Mandat culturel#!, payé immédiatement\n\n#Y À la fin#!\n#P +15 Acceptation de cette culture pendant 10 ans#!\nLoyalistes dans l'État cible\n#P +25 Mandat culturel, +10 Cohésion nationale#!\nDix ans d'amélioration des qualifications et d'attraction migratoire"
 ve_composite_compact_name:0 "Pacte constitutif"
 ve_composite_compact_cost:0 "Coût : #Y 150 Mandat culturel#! et #Y 40 Cohésion#!"
 ve_composite_compact_short:0 "Reconnaître une minorité en tant que culture constituante.\n#P +30 Mandat, +12 Cohésion#!, de manière permanente."
 ve_composite_compact_desc:0 "#header Pacte constitutif#!\nExécuté dans un seul État sur une culture non primaire non reconnue détenant au moins #Y 5 %#! de la population de cet État.\n\n#Y Coût#!\n#Y 150 Mandat culturel#!, payé immédiatement, et au moins #Y 40 Cohésion nationale#!\n\n#Y À la fin#!\n#P +15 Acceptation de cette culture, de façon permanente#!\nLa reconnaît comme une culture constitutive\nLoyalistes dans l'État cible\n#P +30 Mandat culturel, +12 Cohésion nationale#!"
 ve_targeted_project_start_instruction:0 "#Y Comment le démarrer#!\n1. Ouvrez l'un de vos propres États.\n2. Presse #Y Démarrer le projet#! dans le panneau de cet État.\nLa culture cible et tout ce qui manque encore sont répertoriés dans l'info-bulle de ce bouton."
 ve_targeted_project_state_requirements_tt:0 "L'État doit nous appartenir et contenir une culture non primaire éligible comprenant au moins #Y 5 %#! de sa population. La plus grande culture éligible devient la cible. Une culture déjà réalisée dans cet Etat ne peut être à nouveau ciblée, mais peut l'être dans un autre Etat. Le coût et les exigences du modèle d'identité actuel doivent également être respectés."
 ve_targeted_cultural_project_target:0 "Cible : #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! dans #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Portée : #Y Pays entier#!"
 ve_no_cultural_project_target:0 "Aucun objectif de projet"
 ve_no_active_cultural_project:0 "Aucun projet culturel actif"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "COHÉSIF - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "FRAGMENTÉ - #N l'instabilité nationale s'applique#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% de taux de conscription et +3 de légitimité#!."
 ve_civic_high_cohesion_effect:0 "#P +5% de qualifications et +3 de légitimité#!."
 ve_composite_high_cohesion_effect:0 "#P +5% d'influence et +3 de légitimité#!."
 ve_identity_transition_backlash_notice:0 "Un contrecoup de transition d'identité est toujours actif - le modèle ne peut pas être changé à nouveau avant son expiration."
 ve_cultural_project_backlash_notice:0 "Un projet annulé en bloque toujours un nouveau - le contrecoup de 2 ans doit d'abord expirer."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Réaction de transition active"
 ve_cultural_project_backlash_notice_short:0 "Annulation backlash active"
 ve_targeted_project_start_instruction_short:0 "Démarrez-le à partir d'un de vos propres États : ouvrez l'État et appuyez sur #Y Démarrer le projet#!."
