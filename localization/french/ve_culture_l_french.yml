l_french:
 ve_national_identity:0 "Identité nationale"
 ve_primary_cultures_label:0 "Cultures principales"
 ve_identity_models:0 "Modèles identitaires"
 ve_identity_model_active_footer:0 "Déjà actif"
 ve_switch_identity_button:0 "Changer"
 ve_switch_identity_cost_label:0 "Coûte #Y 200 Mandat culturel#!"
 ve_begin_project_button:0 "Commencer le projet"
 ve_identity_models_help:0 "Votre nation possède toujours exactement un Modèle identitaire et celui-ci est #P déjà actif#! — vous n'avez rien à choisir ici. Le modèle détermine uniquement la manière dont la #Y Cohésion nationale#! est générée et quel Projet culturel vous pouvez mener.\n#Y Le changement est facultatif :#! il coûte #Y 200 Mandat culturel#!, réinitialise la cohésion à #Y 35#!, annule tout Projet culturel en cours et bloque un nouveau changement pendant 5 ans.\n#Y Survolez toute carte ou jauge pour en voir tous les effets.#!"
 ve_ethnic_identity_name:0 "Nation ethnique"
 ve_civic_identity_name:0 "Nation civique"
 ve_composite_identity_name:0 "État composite"
 ve_ethnic_identity_short:0 "La nation est définie autour de ses cultures principales.\nLa cohésion provient de la #Y dominance démographique#!."
 ve_civic_identity_short:0 "Une nation politique bâtie par l'instruction.\nLa cohésion provient du #Y degré d’alphabétisation et des minorités acceptées#!."
 ve_composite_identity_short:0 "Plusieurs peuples sous des institutions négociées.\nLa cohésion provient d'#Y une population véritablement plurielle#!."
 ve_ethnic_identity_unlocks:0 "Débloque le projet #Y Campagne d’intégration ethnique#!"
 ve_civic_identity_unlocks:0 "Débloque le projet #Y Initiative d’égalité civique#!"
 ve_composite_identity_unlocks:0 "Débloque le projet #Y Pacte constituant#!"
 ve_ethnic_identity_desc:0 "#header Nation ethnique#!\nLa nation est définie autour de ses cultures principales.\n\n#Y Tant qu'il est actif#!\n#P +15% Assimilation, +5% Autorité#!\n#N -5% Attractivité migratoire, +5% de Radicaux dus aux Préjugés ouverts#!\n\n#Y Cohésion#!\nAugmente lorsque les cultures principales représentent au moins 60–75% de la population, et chute brutalement en dessous de 40%.\n\n#Y À 75 de cohésion#!\n#P +5% Taux d’enrôlement, +3 Légitimité#!\n\n#Y Projet culturel#!\nCampagne d’intégration ethnique"
 ve_civic_identity_desc:0 "#header Nation civique#!\nUne nation politique partagée est bâtie par l'éducation et la participation.\n\n#Y Tant qu'il est actif#!\n#P +7% Attractivité migratoire, +1% Accès à l’éducation#!\n#N -10% Assimilation, -5% Autorité, -50 Bureaucratie#!\n\n#Y Cohésion#!\nLe degré d’alphabétisation l'augmente, mais toute culture non principale représentant plus de 10% de la population avec une Acceptation très faible la réduit.\n\n#Y À 75 de cohésion#!\n#P +5% Qualifications, +3 Légitimité#!\n\n#Y Projet culturel#!\nInitiative d’égalité civique"
 ve_composite_identity_desc:0 "#header État composite#!\nPlusieurs peuples sont gouvernés par le biais d'institutions négociées.\n\n#Y Tant qu'il est actif#!\n#P -10% de Radicaux dus à l'Effacement culturel et à la Citoyenneté de second rang, +5% Influence#!\n#N -15% Assimilation, -5% Autorité, -75 Bureaucratie#!\n\n#Y Cohésion#!\nUne population véritablement plurielle l'augmente ; une population composée à plus de 90% de cultures principales affaiblit ce modèle.\n\n#Y À 75 de cohésion#!\n#P +5% Influence, +3 Légitimité#!\n\n#Y Projet culturel#!\nPacte constituant"
 ve_identity_change_cost_tt:0 "Modifier le Modèle identitaire requiert #Y 200 Mandat culturel#! et l'absence de retour de bâton de transition identitaire actif. Le changement réinitialise la cohésion à #Y 35#!, provoque un #Y retour de bâton de transition de 5 ans#! et annule tout Projet culturel actif sans pénalité d'annulation supplémentaire."
 ve_cultural_mandate:0 "Mandat culturel"
 ve_culture_reform_point:0 "Mandat culturel"
 ve_cultural_mandate_hint:0 "Dépensé pour les Projets culturels. Il est sans danger de l'accumuler, mais le gain est divisé par deux à 400 et s'arrête à 500."
 ve_culture_reform_point_tt:0 "#header Mandat culturel#!\nActuel : #Y [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\nVariation mensuelle : [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_identity')|+=0]\n\n#Y Ce à quoi il sert#!\nProjets culturels (75–150) et changements de Modèle identitaire (200). Aucun n'est obligatoire : accumuler du Mandat est sans danger, le gain est seulement divisé par deux à 400 et s'arrête à 500.\n\n#Y Répartition mensuelle#!\nDe base : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_base')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_legitimacy')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_administration')|+=0]\nSociété du modèle : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_education')|+=0]\nStabilité et Mouvements culturels : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_stability')|+=0]\nAlignement des lois : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_alignment')|+=0]\nDoctrine d'idée : [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_idea_bonus')|+=0]\nMultiplicateur de plafond : #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_mandate_cap_multiplier')|%0]#!\n\n#Y Doctrine d'idée — seul votre Modèle identitaire actuel compte#!\n#P Nation ethnique#! : Nationaliste V #P +1#!\n#P Nation civique#! : Réformiste V #P +1#! ; Académique V #P +1#!\n#P État composite#! : Réformiste V #P +1#!\nLe total actif ci-dessus est plafonné à #Y +2#!.\n\nLa Nation civique tire sa composante de société du modèle du degré d’alphabétisation, l'État composite du degré d’alphabétisation dans une société plurielle, et la Nation ethnique de la force démographique de ses cultures principales.\n\n$ve_cultural_mandate_hint$"
 ve_national_cohesion:0 "Cohésion nationale"
 ve_national_cohesion_hint:0 "Tend vers l'équilibre que produit votre Modèle identitaire. À 75 ou plus, vous obtenez un bonus, et à 25 ou moins, de l'instabilité."
 ve_national_cohesion_tt:0 "#header Cohésion nationale#!\nActuel : #Y [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nÉquilibre : #Y [GetPlayer.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMouvement mensuel : [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nConditions communes : [GetPlayer.MakeScope.ScriptValue('ve_common_national_cohesion')|0]\nConditions du modèle identitaire : [GetPlayer.MakeScope.ScriptValue('ve_identity_model_cohesion')|+=0]\n\nLa cohésion parcourt 20 % de la distance vers l'équilibre chaque mois, jusqu'à concurrence de 5 points. Les mouvements culturels radicaux réduisent l'équilibre de 10. À partir de 75, le modèle actuel octroie un avantage supplémentaire ; en dessous de 25, l'instabilité nationale s'installe.\n\n$ve_national_cohesion_hint$"
 bar_no_effect:0 "Aucun effet"
 ve_cultural_projects:0 "Projets culturels"
 ve_cultural_projects_intro:0 "Les projets culturels sont #Y optionnels#!. Un seul peut être mené à la fois : son coût en mandat est réglé immédiatement et #N -75 Bureaucratie et -25 Autorité#! s'appliquent tant qu'il est en cours. L'achèvement d'un projet restitue une partie du mandat et renforce la cohésion. Les projets paneuropéens ou nationaux ne peuvent être répétés qu'une fois leur bénéfice d'achèvement expiré ; une cible d'État ou de culture achevée ne peut plus être sélectionnée.\n#Y Survolez toute carte ou jauge pour en voir les effets complets.#!\n\n$ve_targeted_project_start_instruction$"
 ve_cultural_project_active_label:0 "Projet en cours"
 ve_cultural_project_progress:0 "Progression du projet"
 ve_cultural_project_progress_tt:0 "#header Progression mensuelle du projet#!\nActuel : #Y [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nRestant : #Y [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_remaining')|0]#!\nTotal mensuel : [GetPlayer.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0] (minimum 1, maximum 7)\n\n#Y Répartition mensuelle#!\nBase : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_base')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_administration')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_legitimacy')|+=0]\nSociété du modèle : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_education')|+=0]\nCohésion : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_cohesion')|+=0]\nMouvements culturels : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_movement')|+=0]\nAgitation dans l'État cible : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_target')|+=0]\nGroupes de doctrines : [GetPlayer.MakeScope.ScriptValue('ve_cultural_project_progress_idea_bonus')|+=0]\n\n#Y Groupes de doctrines — seuls les bonus correspondant à votre modèle identitaire actuel sont actifs#!\n#P Nation ethnique#! : Nationaliste VII #P +1#!\n#P Nation civique#! : Réformiste VII, Académique VII ou Bien-être VI — #P +1#! chacun\n#P État composite#! : Réformiste VII ou Diplomatique VI — #P +1#! chacun\nLe total des groupes de doctrines actifs ci-dessus est plafonné à #Y +2#! ; tout bonus correspondant supplémentaire n'augmente pas la progression.\n\nLes récompenses de la société du modèle encouragent l'alphabétisation civique, la concentration démographique ethnique ou la diversité composite selon le modèle identitaire actif. L'achèvement est acté lors de la mise à jour mensuelle suivant l'atteinte de #Y 100#! de progression."
 ve_cancel_cultural_project_button:0 "Annuler le projet"
 ve_cancel_cultural_project_tt:0 "#header Annuler le projet culturel#!\nLe mandat culturel investi n'est #N pas remboursé#!. La cohésion nationale diminue de #N 5#! et un #N retour de bâton de 2 ans#! empêche de lancer un autre projet."
 ve_start_cultural_project_button:0 "Lancer le projet"
 ve_national_curriculum_name:0 "Programme d’enseignement national"
 ve_national_curriculum_cost:0 "Coût : #Y 100 Mandat culturel#!"
 ve_national_curriculum_short:0 "Une réforme de l'enseignement à l'échelle du pays.\n#P +20 Mandat, +5 Cohésion#!, puis une meilleure éducation."
 ve_national_curriculum_desc:0 "#header Programme d’enseignement national#!\nUne réforme de la scolarisation menée dans tout le pays.\n\n#Y Coût#!\n#Y 100 Mandat culturel#!, payé immédiatement\n\n#Y À l'achèvement#!\n#P +20 Mandat culturel, +5 Cohésion nationale#!\n\n#Y Pendant les 10 ans qui suivent#!\n#P +2% Accès à l’éducation, +5% Qualifications#!\n#N -25 Bureaucratie#!"
 ve_national_curriculum_requirements_tt:0 "Requiert #Y 100 Mandat culturel#!, aucun projet culturel actif et aucun retour de bâton de projet. Il ne peut pas non plus commencer tant que le bénéfice du précédent #Y Programme d’enseignement national#! est actif."
 ve_shared_symbols_name:0 "Symboles communs"
 ve_shared_symbols_cost:0 "Coût : #Y 75 Mandat culturel#!"
 ve_shared_symbols_short:0 "Drapeaux, hymnes et cérémonies publiques.\n#P +20 Mandat, +7 Cohésion#!, puis loyalistes et Autorité."
 ve_shared_symbols_desc:0 "#header Symboles communs#!\nDrapeaux, hymnes et cérémonies publiques, promus dans tout le pays.\n\n#Y Coût#!\n#Y 75 Mandat culturel#!, payé immédiatement\n\n#Y À l'achèvement#!\n#P +20 Mandat culturel, +7 Cohésion nationale#!\n\n#Y Pendant les 8 ans qui suivent#!\n#P +10% Loyalistes issus des groupes sociaux pleinement acceptés, +25 Autorité#!"
 ve_shared_symbols_requirements_tt:0 "Requiert #Y 75 Mandat culturel#!, aucun projet culturel actif et aucun retour de bâton de projet. Il ne peut pas non plus commencer tant que le bénéfice des précédents #Y Symboles communs#! est actif."
 ve_ethnic_campaign_name:0 "Campagne d’intégration ethnique"
 ve_ethnic_campaign_cost:0 "Coût : #Y 125 Mandat culturel#!"
 ve_ethnic_campaign_short:0 "Assimiler une grande minorité dans un État.\n#P +25 Mandat, +8 Cohésion#!, mais cela engendre des radicaux."
 ve_ethnic_campaign_desc:0 "#header Campagne d’intégration ethnique#!\nMenée dans un seul État contre sa plus grande culture non principale, qui doit représenter au moins #Y 5%#! de la population de cet État.\n\n#Y Coût#!\n#Y 125 Mandat culturel#!, payé immédiatement\n\n#Y À l'achèvement#!\nAssimile #Y 5%#! de la culture cible en une culture principale, ou #Y 7%#! avec Nationaliste VII\n#P +25 Mandat culturel, +8 Cohésion nationale#!\nLaisse un programme d'assimilation de #Y 10 ans#! dans l'État\n\n#Y Avertissement#!\n#N Tant le lancement que l'achèvement du projet engendrent des radicaux au sein de la culture cible.#!"
 ve_civic_initiative_name:0 "Initiative d’égalité civique"
 ve_civic_initiative_cost:0 "Coût : #Y 100 Mandat culturel#!"
 ve_civic_initiative_short:0 "Élève l'Acceptation d'une minorité dans un État.\n#P +25 Mandat, +10 Cohésion#!, ainsi que des loyalistes."
 ve_civic_initiative_desc:0 "#header Initiative d’égalité civique#!\nMenée dans un seul État sur sa plus grande culture non principale, qui doit représenter au moins #Y 5%#! de la population de cet État.\n\n#Y Coût#!\n#Y 100 Mandat culturel#!, payé immédiatement\n\n#Y À l'achèvement#!\n#P +15 Acceptation pour cette culture pendant 10 ans#!\nLoyalistes dans l'État cible\n#P +25 Mandat culturel, +10 Cohésion nationale#!\nDix ans de Qualifications et d'Attractivité migratoire accrues"
 ve_composite_compact_name:0 "Pacte constituant"
 ve_composite_compact_cost:0 "Coût : #Y 150 Mandat culturel#! et #Y 40 Cohésion#!"
 ve_composite_compact_short:0 "Reconnaît une minorité comme culture constituante.\n#P +30 Mandat, +12 Cohésion#!, de manière permanente."
 ve_composite_compact_desc:0 "#header Pacte constituant#!\nAppliqué dans un seul État sur une culture non reconnue et non principale représentant au moins #Y 5%#! de la population de cet État.\n\n#Y Coût#!\n#Y 150 Mandat culturel#!, payé immédiatement, et au moins #Y 40 Cohésion nationale#!\n\n#Y À l'achèvement#!\n#P +15 Acceptation pour cette culture, de manière permanente#!\nLa reconnaît comme culture constituante\nLoyalistes dans l'État cible\n#P +30 Mandat culturel, +12 Cohésion nationale#!"
 ve_targeted_project_start_instruction:0 "#Y Comment le lancer#!\n1. Ouvrez l'un de vos propres États.\n2. Appuyez sur #Y Lancer le projet#! dans le panneau de cet État.\nLa culture cible et les éléments manquants sont énumérés dans l'infobulle de ce bouton."
 ve_targeted_project_state_requirements_tt:0 "L'État doit nous appartenir et contenir une culture non principale éligible représentant au moins #Y 5%#! de sa population. La plus grande culture éligible devient la cible. Une culture dont le projet est déjà achevé dans cet État ne peut plus être ciblée, mais peut l'être dans un autre État. Le coût et les exigences du Modèle identitaire actuel doivent également être satisfaits."
 ve_targeted_cultural_project_target:0 "Cible : #Y [ROOT.Var('ve_cultural_project_target_culture').GetCulture.GetName]#! dans #Y [ROOT.Var('ve_cultural_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_countrywide_cultural_project_target:0 "Portée : #Y Pays entier#!"
 ve_no_cultural_project_target:0 "Aucune cible de projet"
 ve_no_active_cultural_project:0 "Aucun projet culturel actif"

 #NATIONAL IDENTITY PAGE - status badges and blocking-timer notices
 ve_cohesion_tier_high:0 "COHÉRENT - [GetPlayer.GetCustom('ve_identity_high_cohesion_effect')]"
 ve_cohesion_tier_low:0 "FRAGMENTÉ - #N l'instabilité nationale s'applique#!."
 ve_ethnic_high_cohesion_effect:0 "#P +5% Taux d’enrôlement et +3 Légitimité#!."
 ve_civic_high_cohesion_effect:0 "#P +5% Qualifications et +3 Légitimité#!."
 ve_composite_high_cohesion_effect:0 "#P +5% Influence et +3 Légitimité#!."
 ve_identity_transition_backlash_notice:0 "Un retour de bâton de transition identitaire est toujours actif - le modèle ne peut être changé à nouveau tant qu'il n'a pas expiré."
 ve_cultural_project_backlash_notice:0 "Un projet annulé bloque toujours un nouveau projet - le retour de bâton de 2 ans doit d'abord expirer."

 #NATIONAL IDENTITY PAGE - one-screen layout: short forms used where a row has no room
 ve_identity_transition_backlash_notice_short:0 "Retour de bâton de transition actif"
 ve_cultural_project_backlash_notice_short:0 "Retour de bâton d'annulation actif"
 ve_targeted_project_start_instruction_short:0 "Lancez-le depuis l'un de vos propres États : ouvrez l'État et appuyez sur #Y Lancer le projet#!."
