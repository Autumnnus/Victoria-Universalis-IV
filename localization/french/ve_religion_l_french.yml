l_french:
 ve_piety:0 "Piété"
 ve_piety_reform:0 "Réforme de la piété"
 ve_piety_reform_tt:0 "#header Réforme de la piété#!\nActuel : #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nRevenu mensuel : [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Répartition mensuelle#!\nBase : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nSoutien dévot : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nIdée de doctrine : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Idée de doctrine — seul votre modèle religieux actuel compte#!\n#P État confessionnel / Athéisme d'État#! : Nationaliste V #P +1#!\n#P Liberté de conscience / Séparation totale#! : Réformiste V #P +1#!\nLe total actif ci-dessus est plafonné à #Y +1#!, donc les deux chemins ne peuvent pas se cumuler.\n\nDépensé en doctrines et programmes (#Y 25#! chacun) et en projet religieux ciblé (#Y 100-150#!, selon le modèle). Les revenus ralentissent #Y 400#! et s'arrête à #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doctrines et programmes"
 ve_piety_tt:0 "#header Établissement religieux#!\nÉtat actuel : #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nÉquilibre social : #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMouvement mensuel : [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Rupture de l'équilibre#!\nModèle d'établissement : [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nSupport du modèle : [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLégitimité, administration et stabilité : [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nLe compteur évolue de #Y 20 %#! vers l'équilibre chaque mois, limité à #Y ±5#!.\nÀ #P 75#! : [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nÀ #N 25#! ou moins : #N -5 Légitimité et -5 % de réussite de la promulgation de la loi#!.\n\nCe compteur ne paie plus pour les programmes - voir Piety Reform. Les programmes nécessitent au moins #Y 25#! Réforme de la piété, coût #Y 25#! et imposer un #Y 24 mois#! tension de mise en œuvre.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Projet religieux"
 ve_religious_project_progress_tt:0 "#header Projet religieux ciblé#!\nProgrès : #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nProgrès mensuel : [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (minimum 1, maximum 7)\n\n#Y Répartition mensuelle#!\nBase : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nSupport du modèle : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nInstallation : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nMouvements religieux : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nÉtat cible Tourmente : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nGroupes d'idées : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Groupes d'idées — seuls les bonus correspondant à votre modèle religieux actuel sont actifs#!\n#P État confessionnel#! : Nationaliste VII #P +1#!\n#P Liberté de conscience#! : Réformiste VII #P +1#!\n#P Athéisme d'État#! : Nationaliste VII #P +1#! et Académique VII #P +1#!\nLe total des groupes d'idées actifs ci-dessus est plafonné à #Y +2#!.\n\nDémarrez-en un à partir du panel d'un État. Conversion à l'athéisme confessionnel et d'État #Y 5%#! de la population de l'État cible à la fin, soit #Y 7%#! avec Nationaliste VII, et ajoutez des radicaux. La liberté de conscience ajoute plutôt des loyalistes sans forcer la conversion. La séparation totale ne peut pas démarrer un projet - c'est le modèle entièrement neutre.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "En cours"
 ve_religious_project_none:0 "Aucun actif"

