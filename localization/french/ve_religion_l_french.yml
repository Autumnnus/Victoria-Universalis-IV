 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Religion d'État"
 ve_settlement_tier_high:0 "RÉGLÉE - [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "CONTESTÉE - #N -5 Légitimité et -5 % de réussite dans l'adoption de la loi#!."
 ve_settlement_hint:0 "Dérive vers l'équilibre produit par votre modèle religieux. À 75+, vous gagnez un bonus, à 25 ou moins d'instabilité."
 ve_piety_reform_hint:0 "Dépensé pour des programmes (25 chacun) et pour des projets religieux. L'épargner est sûr, mais le revenu diminue de moitié à 400 et s'arrête à 500."
 ve_religious_project_hint:0 "Facultatif. Commencé à partir de l'un de vos propres États, si votre modèle religieux le permet."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Modèles religieux"
 ve_religious_models_help:0 "Votre modèle religieux est décidé par votre #Y Église et État#! la loi et est #P déjà actif#! - il n'y a rien à choisir ici. Le modèle décide uniquement comment #Y Règlement religieux#! est gagné, quels sont les huit programmes que vous pouvez adopter et quel projet religieux vous pouvez diriger.\n#Y Changer la loi est facultatif :#! il réinitialise le règlement à #Y 35#!, supprime tous les programmes que vous avez adoptés, annule un projet religieux en cours et applique un #Y 3-5 ans#! Crise de colonisation.\n#Y Survolez n'importe quelle carte ou compteur pour connaître tous ses effets.#!"
 ve_religious_model_active_footer:0 "Modèle actuel"
 ve_confessional_state_short:0 "L'Église et l'État gouvernent ensemble.\nLe règlement vient de #Y Approbation et influence dévotes#!."
 ve_freedom_state_short:0 "Chaque religion est tolérée sous un seul État.\nLe règlement vient de #Y un pays calme et bien géré#!."
 ve_separation_state_short:0 "L'État n'a aucune position religieuse.\nLe règlement commence le plus haut et récompense #Y faible agitation#!."
 ve_atheism_state_short:0 "Sécularisation active menée par l'État.\nLe règlement vient de #Y L'alphabétisation et l'Intelligentsia#!."
 ve_confessional_state_unlocks:0 "Exécute le #Y Conversion confessionnelle#! project"
 ve_freedom_state_unlocks:0 "Exécute le #Y Sensibilisation à la liberté#! projet"
 ve_separation_state_unlocks:0 "#N Ne peut pas exécuter un projet religieux #!"
 ve_atheism_state_unlocks:0 "Exécute le #Y Campagne de sécularisation#! projet"
 ve_confessional_state_desc:0 "#header État confessionnel#!\nL'Église et l'État gouvernent ensemble.\n\n#Y Pendant qu'ils sont actifs#!\n#P +5 % d'autorité, +10 % de conversion, +10 % de force politique dévote#!\n#N -3 % d'attraction migratoire, +5 % de radicaux contre les préjugés ouverts#!\nPlus un petit paquet pour la famille de foi de votre religion d'État (chrétienne, islamique, juive, dharmique, érudite ou animiste).\n\n#Y Établissement#!\nÉquilibre de base #Y 55#!. L'approbation et l'influence dévotes le font le plus bouger.\n\n#Y À 75 règlement#!\n#P +5 % d'autorité, +5 légitimité#!\n\n#Y Projet religieux#!\nConversion confessionnelle"
 ve_freedom_state_desc:0 "#header Liberté de conscience#!\nChaque religion est tolérée sous un seul État.\n\n#Y Alors qu'elle est active#!\n#P +5 % de migration d'attraction, -5% de radicaux issus de préjugés ouverts#!\n#N -15% de conversion, -25 bureaucratie#!\n\n#Y règlement#!\néquilibre de base #Y 55#!. Une faible agitation, une légitimité et une administration saine l'élèvent.\n\n#Y À 75 Règlement#!\n#P +5% d'attraction migratoire, +5 légitimité#!\n\n#Y Projet religieux#!\nSoutien à la liberté"
 ve_separation_state_desc:0 "#header Séparation totale#!\nLe modèle neutre : l'État ne prend aucune position religieuse.\n\n#Y Pendant qu'il est actif#!\n#P +8 % d'attraction migratoire, -10 % de radicaux de préjugés ouverts, -5 % de radicaux de violence Hostilité#!\n#N -30 % de conversion#!\n\n#Y Règlement#!\nÉquilibre de base #Y 60#!, le plus élevé des quatre. Une faible agitation l'augmente encore davantage.\n\n#Y À 75 règlement#!\n#P +5 % de réussite de l'adoption de la loi, +5 légitimité#!\n\n#Y Projet religieux#!\n#N Aucun. Ce modèle n'a délibérément aucune campagne religieuse.#!"
 ve_atheism_state_desc:0 "#header Athéisme d'État#!\nUn modèle de sécularisation agressif, pas tolérant.\n\n#Y Bien qu'il soit actif#!\n#P +5 % de diffusion technologique, +2 % d'accès à l'éducation, +20 % de conversion#!\n#N -5 % d'autorité, -10 % de force politique fervente, +5 % de radicaux contre les préjugés ouverts#!\n\n#Y Règlement#!\nÉquilibre de base #Y 45#!, le plus bas des quatre. L’alphabétisation et l’approbation de l’Intelligentsia l’élèvent ; une forte influence dévote le réduit.\n\n#Y À 75 de règlement#!\n#P +5 % de propagation technologique, +5 % de bureaucratie#!\n\n#Y Projet religieux#!\nCampagne de sécularisation\n\n#Y Remarque#!\nLe passage à ce modèle coûte un #N 5 ans#! crise au lieu de 3 si le taux d'alphabétisation est inférieur à 50 % ou si l'influence des dévots est de 20 % ou plus."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Les programmes sont #Y optionnel#! et permanent. Chacun coûte #Y 25 Réforme de la Piété#! et commence un #Y 24 mois#! une tension de mise en œuvre pendant laquelle aucun autre programme ne peut être adopté. Tous les huit appartiennent à votre modèle religieux actuel et sont perdus si ce modèle change.\n#Y Survolez n'importe quelle carte ou compteur pour connaître tous ses effets.#!"
 ve_religious_program_strain_notice:0 "Un programme est toujours en cours de mise en œuvre - aucun autre programme ne peut être adopté avant l'expiration de cette souche."
 ve_religious_program_adopted_badge:0 "ADOPTÉ"
 ve_adopt_program_button:0 "Adopter"
 ve_religious_program_cost_label:0 "Coûts #Y 25 Réforme de la piété#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Projet religieux ciblé"
 ve_religious_projects_intro:0 "Un projet religieux est #Y facultatif#! et un seul peut être exécuté à la fois. Son coût de Réforme de la Piété est payé immédiatement et #N -50 Bureaucratie et -25 Autorité#! s'appliquent aussi longtemps qu'elles fonctionnent. Le terminer rembourse un peu de réforme de la piété et augmente la colonie religieuse.\n#Y Survolez n'importe quelle carte ou compteur pour connaître tous ses effets.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Projet en cours"
 ve_religious_project_backlash_notice:0 "Un projet annulé en bloque toujours un nouveau - le délai de 24 mois doit d'abord expirer."
 ve_religious_project_start_instruction:0 "#Y Comment le démarrer#!\n1. Ouvrez l'un de vos propres États.\n2. Presse #Y Démarrer le projet#! dans le panneau de cet État.\nTout ce qui manque encore est répertorié dans l'info-bulle de ce bouton."
 ve_targeted_religious_project_target:0 "Cible : #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Aucun objectif de projet"
 ve_no_active_religious_project:0 "Aucun projet religieux actif"
 ve_confessional_conversion_name:0 "Conversion confessionnelle"
 ve_confessional_conversion_cost:0 "Coût : #Y 125 Réforme de la piété#!"
 ve_confessional_conversion_short:0 "Convertir un État à la religion d'État.\n#P +20 Réforme de piété, +5 Règlement#! une fois terminé - mais cela crée des radicaux."
 ve_confessional_conversion_desc:0 "#header Conversion confessionnelle#!\nCourez dans un seul État dont la part de votre propre religion est inférieure #Y 90 %#!.\n\n#Y Coût#!\n#Y 125 Réforme de la Piété#!, payé immédiatement\n\n#Y Pendant son fonctionnement#!\n#N -50 Bureaucratie, -25 Autorité#! pour le pays\n#N +20% de conversion et +20% de canaux de radicalisme#! dans l'État cible\n\n#Y Une fois terminé#!\nConvertit #Y 5%#! de la population de l'État à votre religion d'État, ou #Y 7%#! avec Nationaliste VII\n#P +20 Réforme de la piété, +5 Règlement religieux#!\n\n#Y Avertissement#!\n#N La conversion crée des radicaux dans l’État cible.#!"
 ve_freedom_outreach_name:0 "Sensibilisation à la liberté"
 ve_freedom_outreach_cost:0 "Coût : #Y 100 Réforme de la piété#!"
 ve_freedom_outreach_short:0 "Conquérir un État sans forcer la conversion.\n#P +20 Réforme de la piété, +7 Règlement#! à la fin, plus les loyalistes."
 ve_freedom_outreach_desc:0 "#header Promotion de la liberté#!\nExécuter dans un seul État dont la part de votre propre religion est inférieure à #Y 90 %#!.\n\n#Y Coût#!\n#Y 100 Piété Réforme#!, payée immédiatement\n\n#Y Pendant son fonctionnement#!\n#N -50 Bureaucratie, -25 Autorité#! pour le pays\n\n#Y Une fois terminé#!\n#P Pas de conversion forcée#! - loyalistes dans l'État cible à la place\n#P +20 Réforme de la piété, +7 Règlement religieux#!"
 ve_secularization_campaign_name:0 "Campagne de sécularisation"
 ve_secularization_campaign_cost:0 "Coût : #Y 150 Piété Réforme#!"
 ve_secularization_campaign_short:0 "Convertissez un État à l'athéisme.\n#P +25 Réforme de la piété, +8 Règlement#! à la fin - mais cela crée des radicaux."
 ve_secularization_campaign_desc:0 "#header Campagne de sécularisation#!\nExécutez dans un seul État dont la part de votre propre religion est inférieure à #Y 90 %#!.\n\n#Y Coût#!\n#Y 150 Réforme de la piété#!, payée immédiatement\n\n#Y Pendant qu'elle fonctionne#!\n#N -50 Bureaucratie, -25 Autorité#! pour le pays\n#N +20% Conversion et +20% de chaînes de radicalisme#! dans l'État cible\n\n#Y Une fois terminé#!\nConvertit #Y 5%#! de la population de l'État à l'athéisme, soit #Y 7%#! avec nationaliste VII\n#P +25 Réforme de piété, +8 Règlement religieux#!\n\n#Y Avertissement#!\n#N La conversion crée des radicaux dans l'État cible.#!"
 ve_religious_project_unavailable_name:0 "Aucun projet disponible"
 ve_religious_project_unavailable_cost:0 "#N La séparation totale ne peut pas mener un projet religieux#!"
 ve_religious_project_unavailable_short:0 "Le modèle neutre n'a délibérément pas de campagne religieuse. Adoptez une loi différente de l'Église et de l'État si vous le souhaitez."
 ve_religious_project_unavailable_desc:0 "#header Aucun projet disponible#!\nLa séparation totale est le modèle totalement neutre et ne peut pas démarrer un projet religieux ciblé.\n\nL'État confessionnel, la liberté de conscience et l'athéisme d'État mènent chacun leur propre projet. Adoptez la loi correspondante de l’Église et de l’État pour en obtenir un."

