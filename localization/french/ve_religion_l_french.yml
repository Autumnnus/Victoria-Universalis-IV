 #RELIGION PAGE (gui/ve_panel_religion.gui) - summary strip
 ve_state_religion_label:0 "Religion d’État"
 ve_settlement_tier_high:0 "APAISÉ - [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]"
 ve_settlement_tier_low:0 "CONTESTÉ - #N -5 Légitimité et -5% Succès de la promulgation#!."
 ve_settlement_hint:0 "Tend vers l'équilibre que produit votre Modèle religieux. À 75 ou plus, vous obtenez un bonus ; à 25 ou moins, de l'instabilité."
 ve_piety_reform_hint:0 "Dépensé pour les Programmes (25 chacun) et pour les Projets religieux. L'économiser ne présente pas de risque, mais les gains sont divisés par deux à 400 et cessent à 500."
 ve_religious_project_hint:0 "Facultatif. Lancé depuis l'un de vos propres États, si votre Modèle religieux le permet."

 #RELIGION PAGE - Religious Models section
 ve_religious_models:0 "Modèles religieux"
 ve_religious_models_help:0 "Votre Modèle religieux est déterminé par votre loi #Y Église et État#! et est #P déjà actif#! — il n'y a rien à choisir ici. Le modèle dicte uniquement la manière dont l'#Y Arrangement religieux#! est généré, les huit Programmes que vous pouvez adopter et le Projet religieux que vous pouvez mener.\n#Y Modifier la loi est facultatif :#! cela réinitialise l'Arrangement à #Y 35#!, supprime tous les Programmes que vous avez adoptés, annule tout Projet religieux en cours et déclenche une Crise d'arrangement de #Y 3 à 5 ans#!.\n#Y Survolez n'importe quelle carte ou jauge pour en voir tous les effets.#!"
 ve_religious_model_active_footer:0 "Modèle actuel"
 ve_confessional_state_short:0 "L'Église et l'État gouvernent ensemble.\nL'Arrangement provient de #Y l'approbation et du Poids politique des Croyants#!."
 ve_freedom_state_short:0 "Chaque foi est tolérée sous un État unique.\nL'Arrangement provient d'#Y un pays calme et bien administré#!."
 ve_separation_state_short:0 "L'État ne prend aucune position religieuse.\nL'Arrangement religieux commence au plus haut et récompense #Y le faible degré d’agitation#!."
 ve_atheism_state_short:0 "Laïcisation active menée par l'État.\nL'Arrangement religieux dépend #Y du degré d’alphabétisation et de l’Élite intellectuelle#!."
 ve_confessional_state_unlocks:0 "Lance le projet #Y Conversion confessionnelle#!."
 ve_freedom_state_unlocks:0 "Lance le projet #Y Rayonnement tolérant#!."
 ve_separation_state_unlocks:0 "#N Ne peut pas mener de Projet religieux#!."
 ve_atheism_state_unlocks:0 "Lance le projet #Y Campagne de laïcisation#!."
 ve_confessional_state_desc:0 "#header État confessionnel#!\nL'Église et l'État gouvernent ensemble.\n\n#Y Tant qu'il est actif#!\n#P +5% Autorité, +10% Conversion, +10% Force politique des Croyants#!\n#N -3% Attractivité migratoire, +5% Radicaux issus des préjugés ouverts#!\nPlus un petit ensemble pour la famille de foi de votre Religion d’État (chrétienne, islamique, judaïque, dharmique, lettrée ou animiste).\n\n#Y Arrangement religieux#!\nÉquilibre de base #Y 55#!. L'Approbation et le Poids politique des Croyants le font varier le plus.\n\n#Y À 75 d'Arrangement religieux#!\n#P +5% Autorité, +5 Légitimité#!\n\n#Y Projet religieux#!\nConversion confessionnelle"
 ve_freedom_state_desc:0 "#header Liberté de conscience#!\nChaque foi est tolérée sous un même État.\n\n#Y Tant qu'il est actif#!\n#P +5% Attractivité migratoire, -5% Radicaux issus des préjugés ouverts#!\n#N -15% Conversion, -25 Bureaucratie#!\n\n#Y Arrangement religieux#!\nÉquilibre de base #Y 55#!. Un faible degré d’agitation, la légitimité et une administration saine l'augmentent.\n\n#Y À 75 d'Arrangement religieux#!\n#P +5% Attractivité migratoire, +5 Légitimité#!\n\n#Y Projet religieux#!\nRayonnement tolérant"
 ve_separation_state_desc:0 "#header Séparation totale#!\nLe modèle neutre : l'État ne prend aucune position religieuse.\n\n#Y Tant qu'il est actif#!\n#P +8% Attractivité migratoire, -10% Radicaux issus des préjugés ouverts, -5% Radicaux issus de l'hostilité violente#!\n#N -30% Conversion#!\n\n#Y Arrangement religieux#!\nÉquilibre de base #Y 60#!, le plus élevé des quatre. Un faible degré d’agitation l'augmente davantage.\n\n#Y À 75 d'Arrangement religieux#!\n#P +5% Succès de la promulgation, +5 Légitimité#!\n\n#Y Projet religieux#!\n#N Aucun. Ce modèle ne comporte délibérément aucune campagne religieuse.#!"
 ve_atheism_state_desc:0 "#header Athéisme d’État#!\nUn modèle de laïcisation agressive, non tolérante.\n\n#Y Tant qu'il est actif#!\n#P +5% Diffusion de la technologie, +2% Accès à l’éducation, +20% Conversion#!\n#N -5% Autorité, -10% Force politique des Croyants, +5% Radicaux issus des préjugés ouverts#!\n\n#Y Arrangement religieux#!\nÉquilibre de base #Y 45#!, le plus bas des quatre. Le degré d’alphabétisation et l'approbation de l'Élite intellectuelle l'augmentent ; un fort Poids politique des Croyants le réduit.\n\n#Y À 75 d'Arrangement religieux#!\n#P +5% Diffusion de la technologie, +5% Bureaucratie#!\n\n#Y Projet religieux#!\nCampagne de laïcisation\n\n#Y Note#!\nPasser à ce modèle entraîne une crise de #N 5 ans#! au lieu de 3 si le degré d’alphabétisation est inférieur à 50% ou si le Poids politique des Croyants est de 20% ou plus."

 #RELIGION PAGE - Doctrines and Programs section
 ve_religious_programs_help:0 "Les programmes sont #Y optionnels#! et permanents. Chacun coûte #Y 25 Fonds de réforme pieuse#! et déclenche une tension de mise en œuvre de #Y 24 mois#! pendant laquelle aucun autre programme ne peut être adopté. Les huit appartiennent à votre Modèle religieux actuel et sont perdus si ce modèle change.\n#Y Survolez n'importe quelle carte ou jauge pour en voir tous les effets.#!"
 ve_religious_program_strain_notice:0 "Un programme est encore en cours de mise en œuvre - aucun autre programme ne peut être adopté tant que cette tension n'a pas pris fin."
 ve_religious_program_adopted_badge:0 "ADOPTÉ"
 ve_adopt_program_button:0 "Adopter"
 ve_religious_program_cost_label:0 "Coûte #Y 25 Fonds de réforme pieuse#!"

 #RELIGION PAGE - Targeted Religious Project section
 ve_religious_project_section:0 "Projet religieux ciblé"
 ve_religious_projects_intro:0 "Un Projet religieux est #Y optionnel#! et un seul peut être actif à la fois. Son coût en Fonds de réforme pieuse est payé immédiatement et les effets #N -50 Bureaucratie et -25 Autorité#! s'appliquent tant qu'il est en cours. Son achèvement rembourse une partie des Fonds de réforme pieuse et augmente l'Arrangement religieux.\n#Y Survolez n'importe quelle carte ou jauge pour en voir tous les effets.#!\n\n$ve_religious_project_start_instruction$"
 ve_religious_project_active_label:0 "Projet en cours"
 ve_religious_project_backlash_notice:0 "Un projet annulé bloque toujours un nouveau projet - le retour de bâton de 24 mois doit d'abord prendre fin."
 ve_religious_project_start_instruction:0 "#Y Comment le lancer#!\n1. Ouvrez l'un de vos États.\n2. Appuyez sur #Y Lancer le projet#! dans le panneau de cet État.\nTout ce qui manque encore est indiqué dans l'infobulle de ce bouton."
 ve_targeted_religious_project_target:0 "Cible : #Y [ROOT.Var('ve_religious_project_target_state').GetState.GetStateRegion.GetName]#!"
 ve_no_religious_project_target:0 "Aucune cible de projet"
 ve_no_active_religious_project:0 "Aucun projet religieux actif"
 ve_confessional_conversion_name:0 "Conversion confessionnelle"
 ve_confessional_conversion_cost:0 "Coût : #Y 125 Fonds de réforme pieuse#!"
 ve_confessional_conversion_short:0 "Convertit un État vers la Religion d’État.\n#P +20 Fonds de réforme pieuse, +5 d'Arrangement#! à l'achèvement - mais engendre des radicaux."
 ve_confessional_conversion_desc:0 "#header Conversion confessionnelle#!\nMené dans un seul État dont la part de votre propre religion est inférieure à #Y 90%#!.\n\n#Y Coût#!\n#Y 125 Fonds de réforme pieuse#!, payés immédiatement\n\n#Y Tant qu'il est en cours#!\n#N -50 Bureaucratie, -25 Autorité#! pour le pays\n#N +20% de conversion et +20% de radicalisme#! dans l'État cible\n\n#Y À l'achèvement#!\nConvertit #Y 5%#! de la Population de l'État à votre Religion d’État, ou #Y 7%#! avec Nationaliste VII\n#P +20 Fonds de réforme pieuse, +5 d'Arrangement religieux#!\n\n#Y Avertissement#!\n#N La conversion engendre des radicaux dans l'État cible.#!"
 ve_freedom_outreach_name:0 "Rayonnement tolérant"
 ve_freedom_outreach_cost:0 "Coût : #Y 100 Fonds de réforme pieuse#!"
 ve_freedom_outreach_short:0 "Rallie un État sans forcer la conversion.\n#P +20 Fonds de réforme pieuse, +7 d'Arrangement#! à l'achèvement, ainsi que des loyalistes."
 ve_freedom_outreach_desc:0 "#header Rayonnement tolérant#!\nÀ mener dans un seul État dont la proportion de votre propre religion est inférieure à #Y 90%#!.\n\n#Y Coût#!\n#Y 100 Fonds de réforme pieuse#!, payé immédiatement\n\n#Y Effets actifs#!\n#N -50 Bureaucratie, -25 Autorité#! pour le pays\n\n#Y À l'achèvement#!\n#P Pas de conversion forcée#! - des loyalistes dans l'État cible à la place\n#P +20 Fonds de réforme pieuse, +7 Arrangement religieux#!"
 ve_secularization_campaign_name:0 "Campagne de laïcisation"
 ve_secularization_campaign_cost:0 "Coût : #Y 150 Fonds de réforme pieuse#!"
 ve_secularization_campaign_short:0 "Convertir un État à l'athéisme.\n#P +25 Fonds de réforme pieuse, +8 Arrangement#! à l'achèvement - mais cela crée des radicaux."
 ve_secularization_campaign_desc:0 "#header Campagne de laïcisation#!\nMenée dans un seul État dont la part de votre propre religion est inférieure à #Y 90%#!.\n\n#Y Coût#!\n#Y 150 Fonds de réforme pieuse#!, payés immédiatement\n\n#Y Pendant son déroulement#!\n#N -50 Bureaucratie, -25 Autorité#! pour le pays\n#N +20% de conversion et +20% de canaux de radicalisme#! dans l'État cible\n\n#Y À l'achèvement#!\nConvertit #Y 5%#! de la Population de l'État à l'athéisme, ou #Y 7%#! avec Nationaliste VII\n#P +25 Fonds de réforme pieuse, +8 Arrangement religieux#!\n#Y Avertissement#!\n#N La conversion engendre des Radicaux dans l'État cible.#!\n"
 ve_religious_project_unavailable_name:0 "Aucun projet disponible"
 ve_religious_project_unavailable_cost:0 "#N La Séparation totale ne peut pas mener de Projet religieux#!"
 ve_religious_project_unavailable_short:0 "Le modèle neutre est délibérément dépourvu de campagne religieuse. Promulguez une loi sur l'Église et l'État différente pour en obtenir une."
 ve_religious_project_unavailable_desc:0 "#header Aucun projet disponible#!\nLa Séparation totale est le modèle pleinement neutre et ne peut lancer de Projet religieux ciblé.\n\nL'État confessionnel, la Liberté de conscience et l'Athéisme d’État mènent chacun leur propre projet. Promulguez la loi sur l'Église et l'État correspondante pour en obtenir un."

