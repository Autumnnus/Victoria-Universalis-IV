l_french:
 ve_piety:0 "Piété"
 ve_piety_reform:0 "Fonds de réforme pieuse"
 ve_piety_reform_tt:0 "#header Fonds de réforme pieuse#!\nActuel : #Y [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\nRevenu mensuel : [GetPlayer.MakeScope.ScriptValue('ve_monthly_piety_reform')|+=0]\n\n#Y Ventilation mensuelle#!\nDe base : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_base')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_legitimacy')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_administration')|+=0]\nSoutien des dévots : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_devout_support')|+=0]\nDoctrine de groupe : [GetPlayer.MakeScope.ScriptValue('ve_piety_reform_idea_bonus')|+=0]\n\n#Y Doctrine de groupe — seul votre Modèle religieux actuel compte#!\n#P État confessionnel / Athéisme d’État#! : Nationaliste V #P +1#!\n#P Liberté de conscience / Séparation totale#! : Réformiste V #P +1#!\nLe total actif ci-dessus est plafonné à #Y +1#!, empêchant ainsi le cumul des deux voies.\n\nConsommé par les doctrines et programmes (#Y 25#! chacun) ainsi que par le Projet religieux ciblé (#Y 100-150#!, selon le modèle). Le revenu ralentit au-delà de #Y 400#! et s'arrête à #Y 500#!.\n\n$ve_piety_reform_hint$"
 ve_aspects:0 "Doctrines et programmes"
 ve_piety_tt:0 "#header Arrangement religieux#!\nÉtat actuel : #Y [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nÉquilibre social : #Y [GetPlayer.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMouvement mensuel : [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\n#Y Ventilation de l'équilibre#!\nModèle d'arrangement : [GetPlayer.MakeScope.ScriptValue('ve_religious_model_base_equilibrium')|+=0]\nSoutien du modèle : [GetPlayer.MakeScope.ScriptValue('ve_religious_model_support')|+=0]\nLégitimité, administration et stabilité : [GetPlayer.MakeScope.ScriptValue('ve_religious_common_support')|+=0]\n\nLa jauge évolue de #Y 20%#! vers l'équilibre chaque mois, dans une limite de #Y ±5#!.\nÀ #P 75#! : [GetPlayer.GetCustom('ve_religious_high_settlement_effect')]\nÀ #N 25#! ou moins : #N -5 Légitimité et -5% Succès de la promulgation#!.\n\nCette jauge ne finance plus les programmes — voir Fonds de réforme pieuse. Les programmes requièrent au moins #Y 25#! Fonds de réforme pieuse, coûtent #Y 25#! et imposent une tension de #Y 24 mois#! lors de la mise en œuvre.\n\n$ve_settlement_hint$"

 #RELIGIOUS PROJECT (Phase 7 - replaces the old missionary system)
 ve_religious_project_progress:0 "Projet religieux"
 ve_religious_project_progress_tt:0 "#header Projet religieux ciblé#!\nProgression : #Y [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nProgression mensuelle : [GetPlayer.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0] (minimum 1, maximum 7)\n\n#Y Ventilation mensuelle#!\nDe base : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_base')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_administration')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_legitimacy')|+=0]\nSoutien du modèle : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_devout')|+=0]\nArrangement : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_equilibrium')|+=0]\nMouvements religieux : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_movement')|+=0]\nDegré d’agitation de l'État cible : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_target')|+=0]\nGroupes de doctrines : [GetPlayer.MakeScope.ScriptValue('ve_religious_project_progress_idea_bonus')|+=0]\n\n#Y Groupes de doctrines — seuls les bonus correspondant à votre Modèle religieux actuel sont actifs#!\n#P État confessionnel#! : Nationaliste VII #P +1#!\n#P Liberté de conscience#! : Réformiste VII #P +1#!\n#P Athéisme d’État#! : Nationaliste VII #P +1#! et Académique VII #P +1#!\nLe total des groupes de doctrines actifs ci-dessus est plafonné à #Y +2#!.\n\nLancez-en un depuis le panneau d'un État possédé. L'État confessionnel et l'Athéisme d’État convertissent #Y 5%#! de la population de l'État cible à son achèvement, ou #Y 7%#! avec Nationaliste VII, et génèrent des radicaux. La Liberté de conscience ajoute quant à elle des loyalistes sans forcer la conversion. La Séparation totale ne peut lancer de projet — il s'agit du modèle entièrement neutre.\n\n$ve_religious_project_hint$"
 ve_religious_project_in_progress:0 "En cours"
 ve_religious_project_none:0 "Aucun actif"

