 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "Nation ethnique"
 ve_ethnic_identity_mdf_desc:0 "L'État définit l'appartenance politique autour de ses cultures primaires."
 ve_civic_identity_mdf:0 "Nation civique"
 ve_civic_identity_mdf_desc:0 "L'État définit l'appartenance politique à travers des institutions communes et la citoyenneté."
 ve_composite_identity_mdf:0 "État composite"
 ve_composite_identity_mdf_desc:0 "L'État équilibre plusieurs peuples par le biais d'institutions négociées et administratives."
 ve_ethnic_high_cohesion_mdf:0 "Communauté nationale mobilisée"
 ve_ethnic_high_cohesion_mdf_desc:0 "Une nation ethnique cohésive peut mobiliser sa population et légitimer l'État."
 ve_civic_high_cohesion_mdf:0 "Société civique confiante"
 ve_civic_high_cohesion_mdf_desc:0 "Les institutions civiques partagées créent la légitimité et la mobilité sociale."
 ve_composite_high_cohesion_mdf:0 "Pacte impérial stable"
 ve_composite_high_cohesion_mdf_desc:0 "Un pacte stable entre les peuples de l'État se renforce légitimité et diplomatie."
 ve_low_national_cohesion_mdf:0 "Faible cohésion nationale"
 ve_low_national_cohesion_mdf_desc:0 "La définition étatique de la nation perd de sa légitimité."
 ve_identity_transition_backlash_mdf:0 "Contrecoup de la transition identitaire"
 ve_identity_transition_backlash_mdf_desc:0 "Les institutions et les communautés résistent à la redéfinition de la nation."
 ve_cultural_project_administration_mdf:0 "Administration du projet culturel"
 ve_cultural_project_administration_mdf_desc:0 "Les responsables et le capital politique se sont engagés dans le projet culturel actif."
 ve_cultural_project_backlash_mdf:0 "Projet culturel abandonné"
 ve_cultural_project_backlash_mdf_desc:0 "L’abandon brutal d’un programme culturel a porté atteinte à la confiance du public et à la coordination administrative."
 ve_national_curriculum_result_mdf:0 "Programme d'études national"
 ve_national_curriculum_result_mdf_desc:0 "Un programme d'études commun élargit l'éducation et les qualifications, même si son maintien consomme de la bureaucratie."
 ve_shared_symbols_result_mdf:0 "Symboles nationaux partagés"
 ve_shared_symbols_result_mdf_desc:0 "Les rituels et symboles civiques partagés renforcent la loyauté et l'autorité de l'État."
 ve_ethnic_campaign_active_mdf:0 "Campagne d'intégration ethnique"
 ve_ethnic_campaign_active_mdf_desc:0 "L'État accélère activement l'assimilation, provoquant une résistance à l'effacement culturel."
 ve_ethnic_campaign_result_mdf:0 "Programme d'assimilation"
 ve_ethnic_campaign_result_mdf_desc:0 "Une campagne d'intégration achevée continue d'accélérer l'assimilation tout en générant des tensions liées à l'effacement culturel."
 ve_civic_initiative_active_mdf:0 "Initiative pour l'égalité de citoyenneté "
 ve_civic_initiative_active_mdf_desc:0 "Les écoles et les institutions publiques sont en cours de réorganisation pour élargir les opportunités et réduire les préjugés ouverts."
 ve_civic_initiative_result_mdf:0 "Programme d'égalité de citoyenneté"
 ve_civic_initiative_result_mdf_desc:0 "L’initiative améliore les qualifications, l’attraction migratoire et la résistance aux préjugés ouverts."
 ve_composite_compact_active_mdf:0 "Négociations du Pacte constitutif"
 ve_composite_compact_active_mdf_desc:0 "Les négociations réduisent les griefs de citoyenneté de second ordre mais mettent temporairement à rude épreuve l'administration fiscale."
 ve_composite_compact_result_mdf:0 "Pacte constitutif"
 ve_composite_compact_result_mdf_desc:0 "Le pacte renforce la loyauté et réduit les griefs causés par une citoyenneté de second ordre."
