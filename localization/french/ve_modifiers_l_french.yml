 #Culture Modifiers
 ve_ethnic_identity_mdf:0 "Nation ethnique"
 ve_ethnic_identity_mdf_desc:0 "L'État définit l'appartenance politique autour de ses cultures principales."
 ve_civic_identity_mdf:0 "Nation civique"
 ve_civic_identity_mdf_desc:0 "L'État définit l'appartenance politique par des institutions communes et la citoyenneté."
 ve_composite_identity_mdf:0 "État composite"
 ve_composite_identity_mdf_desc:0 "L'État équilibre plusieurs peuples par des institutions négociées et administratives."
 ve_ethnic_high_cohesion_mdf:0 "Communauté nationale mobilisée"
 ve_ethnic_high_cohesion_mdf_desc:0 "Une nation ethnique cohérente peut mobiliser sa population et légitimer l'État."
 ve_civic_high_cohesion_mdf:0 "Société civique confiante"
 ve_civic_high_cohesion_mdf_desc:0 "Les institutions civiques partagées créent la Légitimité et la mobilité sociale."
 ve_composite_high_cohesion_mdf:0 "Pacte impérial stable"
 ve_composite_high_cohesion_mdf_desc:0 "Un pacte stable entre les peuples de l'État renforce la Légitimité et la diplomatie."
 ve_low_national_cohesion_mdf:0 "Faible Cohésion nationale"
 ve_low_national_cohesion_mdf_desc:0 "La définition de la Nation par l'État perd en Légitimité."
 ve_identity_transition_backlash_mdf:0 "Retour de bâton de la transition identitaire"
 ve_identity_transition_backlash_mdf_desc:0 "Les institutions et les communautés résistent à la redéfinition de la Nation."
 ve_cultural_project_administration_mdf:0 "Administration du Projet culturel"
 ve_cultural_project_administration_mdf_desc:0 "Des fonctionnaires et des capitaux politiques sont engagés dans le Projet culturel actif."
 ve_cultural_project_backlash_mdf:0 "Projet culturel abandonné"
 ve_cultural_project_backlash_mdf_desc:0 "L'abandon brutal d'un programme culturel a nui à la confiance du public et à la coordination administrative."
 ve_national_curriculum_result_mdf:0 "Programme d’enseignement national"
 ve_national_curriculum_result_mdf_desc:0 "Un programme d’enseignement commun développe l'Éducation et les Qualifications, bien que son maintien consomme de la Bureaucratie."
 ve_shared_symbols_result_mdf:0 "Symboles nationaux partagés"
 ve_shared_symbols_result_mdf_desc:0 "Les rituels et symboles civiques partagés renforcent la Loyauté et l'Autorité de l'État."
 ve_ethnic_campaign_active_mdf:0 "Campagne d’intégration ethnique"
 ve_ethnic_campaign_active_mdf_desc:0 "L'État accélère activement l'Assimilation, provoquant une résistance à l'effacement culturel."
 ve_ethnic_campaign_result_mdf:0 "Programme d'Assimilation"
 ve_ethnic_campaign_result_mdf_desc:0 "Une campagne d'Intégration terminée continue d'accélérer l'Assimilation tout en générant des Tensions liées à l'effacement culturel."
 ve_civic_initiative_active_mdf:0 "Initiative d’égalité civique"
 ve_civic_initiative_active_mdf_desc:0 "Les écoles et les institutions publiques sont réorganisées pour élargir les opportunités et réduire les préjugés manifestes."
 ve_civic_initiative_result_mdf:0 "Programme d'égalité civique"
 ve_civic_initiative_result_mdf_desc:0 "L'initiative améliore les Qualifications, l'Attractivité migratoire et la capacité à résister aux préjugés manifestes."
 ve_composite_compact_active_mdf:0 "Négociations du Pacte constituant"
 ve_composite_compact_active_mdf_desc:0 "Les Négociations réduisent les griefs liés à une citoyenneté de seconde zone mais pèsent temporairement sur l'administration de l'Impôt."
