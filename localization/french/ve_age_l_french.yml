l_french:
 ve_splendor:0 "#tooltippable_name Élan de l’époque : "
 ve_age_of_victoria_title:0 "Industrie et Nations"
 ve_age_of_victoria_desc:0 "Les vieux ordres se heurtent aux usines, aux voies ferrées, aux publics instruits et à l’État moderne. L’élan revient aux pays qui transforment les institutions héritées en une capacité nationale durable."
 ve_imperialism_age_title:0 "Empire et Société de masse"
 ve_imperialism_age_desc:0 "L’industrie s’étend à travers les continents tandis que l’éducation, les institutions publiques et les armées organisées reforment la société de masse. Les grandes puissances peuvent s’étendre à l’étranger ; les États plus modestes peuvent prospérer par la souveraineté et le développement intérieur."
 ve_great_wars_age_title:0 "Politique de masse et Guerre totale"
 ve_great_wars_age_desc:0 "L’électricité, le pétrole, la participation de masse, le bien-être et la guerre industrielle transforment les relations entre l’État et la société. La survie dépend désormais autant des institutions que des armées."
 ve_age_notify_option:0 "Une nouvelle ère s’annonce."
 ve_victorian_age_icon_p_tt:0 "#P Industrie et Nations (1836–1870)"
 ve_victorian_age_icon_n_tt:0 "#N Industrie et Nations (1836–1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Empire et Société de masse (1871–1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Empire et Société de masse (1871–1905)"
 ve_great_war_age_icon_p_tt:0 "#P Politique de masse et Guerre totale (1906–1936)"
 ve_great_war_age_icon_n_tt:0 "#N Politique de masse et Guerre totale (1906–1936)"

 ve_golden_age:0 "Âge d’or"
 ve_golden_age_industrial:0 "Âge d’or industriel"
 ve_golden_age_cultural:0 "Âge d’or culturel"
 ve_golden_age_strategic:0 "Âge d’or stratégique"
 ve_golden_age_tt:0 "Disponible à partir de #v 1845#! après avoir rempli #v 5 objectifs distincts#! au cours de l’ère actuelle. Un pays ne peut choisir qu’un seul Âge d’or pour toute la durée de la partie ; ses effets durent #v 15 ans#!."
 ve_golden_age_requirement_unused:0 "Aucun Âge d’or n’a été choisi au cours de cette campagne."
 ve_golden_age_requirement_year:0 "Requiert l’année #v 1845#! ou ultérieure."
 ve_golden_age_requirement_objectives:0 "Accomplir au moins #v 5 objectifs distincts#! au cours de l’ère actuelle."
 ve_golden_age_industrial_tt:0 "#header Âge d’or industriel#!\nPendant #Y 15 ans#! : #P +10% de Capacité de production manufacturière#! et #P +10% de Probabilités de découverte de ressources#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Âge d’or culturel#!\nPendant #Y 15 ans#! : #P +5% d’Accès à l’éducation#! et #P +10% de Prestige#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Âge d’or stratégique#!\nPendant #Y 15 ans#! : #P +5% d’Attaque de l’armée#! et #P -10% d’Épuisement de guerre en raison des Pertes#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Objectifs de l’ère"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Essor industriel"
 ve_victorian_age_obj_desc_1:0 "Réduire la proportion de paysans sous la barre des 40%."
 ve_victorian_age_obj_title_2:0 "#tooltip_header Fin du vieil ordre"
 ve_victorian_age_obj_desc_2:0 "Interdire l’esclavage et abolir le servage."
 ve_victorian_age_obj_title_3:0 "#tooltip_header État fonctionnel"
 ve_victorian_age_obj_desc_3:0 "Maintenir une légitimité d’au moins 70 et un solde de bureaucratie non négatif sans pénurie imminente."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Public instruit"
 ve_victorian_age_obj_desc_4:0 "Atteindre 50% de degré d’alphabétisation ou des écoles de niveau 3."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Marché intégré"
 ve_victorian_age_obj_desc_5:0 "Posséder au moins 3 niveaux de voies ferrées si la population est inférieure à 5 millions, ou 6 niveaux de voies ferrées dans le cas contraire."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Éveil national"
 ve_victorian_age_obj_desc_6:0 "Être indépendant avec une légitimité d’au moins 65 et un degré d’agitation inférieur à 5% dans le pays."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Portée mondiale"
 ve_victorian_age_obj_desc_7:0 "Être une grande puissance ou une puissance majeure, ou maintenir au moins 5 intérêts déclarés."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Puissance industrielle"
 ve_imperialism_age_obj_desc_1:0 "Atteindre un PIB de £100 millions ou réduire la part de la paysannerie en dessous de 25 %."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Éducation de masse"
 ve_imperialism_age_obj_desc_2:0 "Atteindre 65 % de Degré d’alphabétisation ou un Éducation de niveau 4."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Empire ou Souveraineté"
 ve_imperialism_age_obj_desc_3:0 "Posséder au moins 2 Sujets, ou demeurer indépendant et reconnu."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Commerce mondial"
 ve_imperialism_age_obj_desc_4:0 "Posséder 2 niveaux de Port pour une Population inférieure à 10 millions, 10 niveaux de Port sinon, ou maintenir 5 Intérêts déclarés."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Construction nationale"
 ve_imperialism_age_obj_desc_5:0 "Maintenir au moins 60 de Légitimité et un Degré d’agitation inférieur à 5 %."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header La question sociale"
 ve_imperialism_age_obj_desc_6:0 "Élever le Système de santé, la Sécurité au travail ou la Sécurité sociale au niveau 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Forces armées modernes"
 ve_imperialism_age_obj_desc_7:0 "Aligner au moins 50 % d'infanterie d'escarmouche ou de tranchée et 10 % d'artillerie mobile dans l'Armée."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Politique de masse"
 ve_great_wars_age_obj_desc_1:0 "Promulguer le Suffrage universel ou la République des conseils, ou maintenir 75 de Légitimité en tant que République parlementaire ou République présidentielle."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header État social"
 ve_great_wars_age_obj_desc_2:0 "Maintenir au moins deux institutions de niveau 3 parmi la Santé, la Sécurité sociale, la Sécurité au travail et les Écoles."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Économie électrifiée"
 ve_great_wars_age_obj_desc_3:0 "Posséder 1 niveau de centrale électrique si la Population est inférieure à 10 millions, ou 5 niveaux de centrale électrique sinon."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Pétrole et moteurs"
 ve_great_wars_age_obj_desc_4:0 "Posséder un puits de Pétrole ou au moins 5 niveaux d'industrie des moteurs."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Militaire moderne"
 ve_great_wars_age_obj_desc_5:0 "Aligner au moins 50 % d'infanterie de tranchée ou d'assaut et 15 % d'artillerie à shrapnels dans l'Armée."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Capacité de guerre totale"
 ve_great_wars_age_obj_desc_6:0 "Maintenir 40 unités militaires et au moins 5 niveaux d'industrie d'armement ou 3 niveaux d'usine de munitions."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Influence mondiale"
 ve_great_wars_age_obj_desc_7:0 "Être une puissance majeure ou une Grande puissance, diriger un Bloc de nations ou maintenir au moins 6 Intérêts déclarés."

 ve_age_splendor_tt:0 "#title Élan de l’époque#!\nStock actuel : #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nObjectifs satisfaits : #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nDoctrines (ère actuelle, max +2) : #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nVariation mensuelle : #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nObjectifs distincts accomplis cette ère : #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nRécompenses achetées cette ère : #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nCoût de la prochaine récompense : #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Contribution des doctrines#!\nTout groupe de niveau IV correspondant confère #P +1#! par mois uniquement lorsque son ère assignée est en cours. La ligne ci-dessus indique le total actif, plafonné à #Y +2#!.\n#P Ère 1#! : doctrines industrielles, commerciales, administratives et académiques\n#P Ère 2#! : doctrines de ressources, de société, diplomatiques, nationalistes/réformistes et coloniales\n#P Ère 3#! : doctrines militaires et d'économie de guerre\n\nChaque Objectif actuellement Satisfait confère également #P +1#! d'Élan de l’époque par mois. Les doctrines ne modifient pas l'accomplissement d'un objectif ni sa récompense unique de #P +50#!.\n\nLes coûts des récompenses s’intensifient au cours de chaque ère : #Y 200, 300, 400, 500#!, puis #Y 600#! pour chaque récompense ultérieure. L'élan et l'échelle des coûts sont réinitialisés au début d'une nouvelle ère."
 ve_age_obj_efct_tt:0 "Tant qu'il est Satisfait : #P +1 Élan de l’époque par mois#!\nPremière réalisation cette ère : #P +50 Élan de l’époque#!"
 splendor_default_bonus:0 "Posséder au moins #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! d'Élan de l’époque"
 ve_age_1_bonus_10_tt:0 "Requiert une Culture principale italienne septentrionale ou méridionale."
 ve_age_2_bonus_10_tt:0 "Requiert l'Autriche."
 ve_age_3_bonus_10_tt:0 "Requiert la Grande-Bretagne."
 ve_age_1_bonus_11_tt:0 "Requiert une Culture principale allemande du Nord ou du Sud."
 ve_age_2_bonus_11_tt:0 "Requiert la Russie."
 ve_age_3_bonus_11_tt:0 "Requiert la Chine des Qing."
 ve_age_1_bonus_12_tt:0 "Requiert les Pays-Bas."
 ve_age_2_bonus_12_tt:0 "Requiert la Belgique."
 ve_age_3_bonus_12_tt:0 "Requiert la France."
 ve_age_1_bonus_13_tt:0 "Nécessite l'Empire ottoman."
 ve_age_2_bonus_13_tt:0 "Nécessite les États-Unis."
 ve_age_3_bonus_13_tt:0 "Nécessite le Japon."
