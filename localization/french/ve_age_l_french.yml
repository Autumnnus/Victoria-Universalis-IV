l_french:
 ve_splendor:0 "#tooltippable_name Era Momentum : "
 ve_age_of_victoria_title:0 "Industrie et nations"
 ve_age_of_victoria_desc:0 "Les ordres anciens sont confrontés aux usines, aux chemins de fer, aux publics instruits et à l’État moderne. La dynamique appartient aux pays qui transforment les institutions héritées en capacités nationales durables."
 ve_imperialism_age_title:0 "Empire et société de masse"
 ve_imperialism_age_desc:0 "L’industrie s’étend sur tous les continents tandis que l’éducation, les institutions publiques et les armées organisées remodèlent la société de masse. Les grandes puissances peuvent s’étendre à l’étranger ; Les petits États peuvent prospérer grâce à la souveraineté et au développement interne."
 ve_great_wars_age_title:0 "Politique de masse et guerre totale"
 ve_great_wars_age_desc:0 "L’électricité, le pétrole, la participation des masses, l’aide sociale et la guerre industrielle transforment les relations entre l’État et la société. La survie dépend désormais autant des institutions que des armées."
 ve_age_notify_option:0 "Une nouvelle ère se lève."
 ve_victorian_age_icon_p_tt:0 "#P Industrie et nations (1836-1870)"
 ve_victorian_age_icon_n_tt:0 "#N Industrie et nations (1836-1870)"
 ve_imperialism_age_icon_p_tt:0 "#P Empire et société de masse (1871-1905)"
 ve_imperialism_age_icon_n_tt:0 "#N Empire et société de masse (1871-1905)"
 ve_great_war_age_icon_p_tt:0 "#P Politique de masse et guerre totale (1906-1936)"
 ve_great_war_age_icon_n_tt:0 "#N Politique de masse et guerre totale (1906-1936)"

 ve_golden_age:0 "Âge d'or"
 ve_golden_age_industrial:0 "Âge d'or industriel"
 ve_golden_age_cultural:0 "Âge d'or culturel"
 ve_golden_age_strategic:0 "Âge d'or stratégique"
 ve_golden_age_tt:0 "Disponible à partir de #v 1845#! après avoir complété #v 5 objectifs distincts#! à l’époque actuelle. Un pays ne peut choisir qu'un seul âge d'or pendant toute la partie ; ses effets durent #v 15 ans#!."
 ve_golden_age_requirement_unused:0 "Aucun âge d'or n'a été choisi au cours de cette campagne."
 ve_golden_age_requirement_year:0 "Nécessite l'année #v 1845#! ou plus tard."
 ve_golden_age_requirement_objectives:0 "Réalisez au moins #v 5 objectifs distincts#! dans l'ère actuelle."
 ve_golden_age_industrial_tt:0 "#header Âge d'or industriel#!\nPour #Y 15 ans#! : #P +10 % de débit de fabrication#! et #P +10 % de découverte de ressources Chance#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_cultural_tt:0 "#header Âge d'or culturel#!\nPendant #Y 15 ans#! : #P +5 % d'accès à l'éducation#! et #P +10 % de prestige#!.\n\n$ve_golden_age_tt$"
 ve_golden_age_strategic_tt:0 "#header Âge d'or stratégique#!\nPendant #Y 15 ans#! : #P +5 % d'attaque de l'armée#! et #P -10 % d'épuisement de guerre dû aux pertes#!.\n\n$ve_golden_age_tt$"
 ve_obj_header:0 "Objectifs d'âge"

 ve_victorian_age_obj_title_1:0 "#tooltip_header Décollage industriel"
 ve_victorian_age_obj_desc_1:0 "Réduire la part des paysans en dessous de 40 %."
 ve_victorian_age_obj_title_2:0 "#tooltip_header  Mettre fin à l'ordre ancien"
 ve_victorian_age_obj_desc_2:0 "Interdire l'esclavage et abolir le servage."
 ve_victorian_age_obj_title_3:0 "#tooltip_header État fonctionnel"
 ve_victorian_age_obj_desc_3:0 "Maintenir au moins 70 légitimité et un équilibre bureaucratique non négatif sans approche de pénurie."
 ve_victorian_age_obj_title_4:0 "#tooltip_header Public instruit"
 ve_victorian_age_obj_desc_4:0 "Atteindre 50 % d'alphabétisation ou d'écoles de niveau 3."
 ve_victorian_age_obj_title_5:0 "#tooltip_header Marché intégré"
 ve_victorian_age_obj_desc_5:0 "Posséder au moins 3 niveaux ferroviaires si la population est inférieure à 5 millions d'habitants, ou 6 niveaux ferroviaires dans le cas contraire."
 ve_victorian_age_obj_title_6:0 "#tooltip_header Éveil national"
 ve_victorian_age_obj_desc_6:0 "Être indépendant avec au moins 65 légitimité et moins de 5 % de troubles dans le pays."
 ve_victorian_age_obj_title_7:0 "#tooltip_header Portée mondiale"
 ve_victorian_age_obj_desc_7:0 "Être une puissance majeure ou grande, ou maintenir au moins 5 intérêts déclarés."

 ve_imperialism_age_obj_title_1:0 "#tooltip_header Puissance industrielle"
 ve_imperialism_age_obj_desc_1:0 "Atteignez 100 millions de livres sterling de PIB ou réduisez la part des paysans en dessous de 25 %."
 ve_imperialism_age_obj_title_2:0 "#tooltip_header Éducation de masse"
 ve_imperialism_age_obj_desc_2:0 "Atteignez 65 % d'alphabétisation ou des écoles de niveau 4."
 ve_imperialism_age_obj_title_3:0 "#tooltip_header Empire ou Souveraineté"
 ve_imperialism_age_obj_desc_3:0 "Avoir au moins 2 sujets, ou rester indépendant et reconnu."
 ve_imperialism_age_obj_title_4:0 "#tooltip_header Commerce mondial"
 ve_imperialism_age_obj_desc_4:0 "Posséder 2 niveaux de port si la population est inférieure à 10 millions, posséder 10 niveaux de port dans le cas contraire ou maintenir 5 intérêts déclarés."
 ve_imperialism_age_obj_title_5:0 "#tooltip_header Construction de la nation"
 ve_imperialism_age_obj_desc_5:0 "Maintenir au moins 60 légitimité et moins de 5 % de troubles dans le pays."
 ve_imperialism_age_obj_title_6:0 "#tooltip_header La question sociale "
 ve_imperialism_age_obj_desc_6:0 "Élever le système de santé, la sécurité au travail ou la sécurité sociale au niveau 2."
 ve_imperialism_age_obj_title_7:0 "#tooltip_header Forces armées modernes"
 ve_imperialism_age_obj_desc_7:0 "Alignez au moins 50 % d'infanterie d'escarmouche ou de tranchée et 10 % d'artillerie mobile dans l'armée."

 ve_great_wars_age_obj_title_1:0 "#tooltip_header Politique de masse"
 ve_great_wars_age_obj_desc_1:0 "Promulguer le suffrage universel ou la République du Conseil, ou maintenir la légitimité de 75 en tant que République parlementaire ou présidentielle."
 ve_great_wars_age_obj_title_2:0 "#tooltip_header État social"
 ve_great_wars_age_obj_desc_2:0 "Maintenir au moins deux institutions de niveau 3 parmi lesquelles la santé, la sécurité sociale, la sécurité sur le lieu de travail et les écoles."
 ve_great_wars_age_obj_title_3:0 "#tooltip_header Économie électrifiée"
 ve_great_wars_age_obj_desc_3:0 "Posséder 1 niveau de centrale électrique si la population est inférieure à 10 millions, ou 5 niveaux de centrale électrique dans le cas contraire."
 ve_great_wars_age_obj_title_4:0 "#tooltip_header Pétrole et moteurs"
 ve_great_wars_age_obj_desc_4:0 "Posséder une plate-forme pétrolière ou au moins 5 niveaux d'industrie automobile."
 ve_great_wars_age_obj_title_5:0 "#tooltip_header Militaire moderne"
 ve_great_wars_age_obj_desc_5:0 "Alignez au moins 50 % d'infanterie de tranchée ou d'escouade et 15 % d'artillerie à éclats d'obus dans l'armée."
 ve_great_wars_age_obj_title_6:0 "#tooltip_header Capacité de guerre totale"
 ve_great_wars_age_obj_desc_6:0 "Maintenez 40 unités militaires et au moins 5 niveaux d'industrie d'armement ou 3 niveaux d'usine de munitions."
 ve_great_wars_age_obj_title_7:0 "#tooltip_header Influence mondiale"
 ve_great_wars_age_obj_desc_7:0 "Soyez une puissance majeure ou grande, dirigez un bloc de pouvoir ou maintenez au moins 6 intérêts déclarés."

 ve_age_splendor_tt:0 "#title Era Momentum#!\nStock actuel : #v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue]#!\nObjectifs atteints : #P [GetPlayer.MakeScope.ScriptValue('ve_era_objectives_satisfied')|0]#!/7\nGroupes d'idées (âge actuel, max +2) : #P [GetPlayer.MakeScope.ScriptValue('ve_era_momentum_idea_bonus')|+=0]#!\nVariation mensuelle : #P [GetPlayer.MakeScope.ScriptValue('ve_monthly_era_momentum')|+=0]#!\nObjectifs distincts atteints à cet âge : #v [GetPlayer.MakeScope.Var('ve_triggered_objectives').GetValue]#!/7\nRécompenses achetées à cet âge : #v [GetPlayer.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\nCoût de la récompense suivante : #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#!\n\n#Y Comment les groupes d'idées contribuent#!\nTout groupe correspondant de niveau IV donne #P +1#! par mois uniquement tant que son âge assigné est actuel. La ligne ci-dessus montre le total actif, plafonné à #Y +2#!.\n#P Âge 1#! : Industrie, commerce, administration et groupes universitaires\n#P Âge 2#! : ressources, société, diplomatie, groupes nationalistes/réformistes et coloniaux\n#P Âge 3#! : groupes militaires et d'économie de guerre\n\nChaque objectif actuellement satisfait accorde également #P +1#! Era Momentum par mois. Les groupes d'idées ne modifient pas l'achèvement de l'objectif ou son unique #P +50#! récompense.\n\nLe coût des récompenses augmente à chaque âge : #Y 200, 300, 400, 500#!, puis  #Y 600#! pour chaque récompense ultérieure. Le Momentum et l'échelle de coût sont réinitialisés lorsqu'un nouvel âge commence."
 ve_age_obj_efct_tt:0 "Tant que satisfait : #P +1 Era Momentum par mois#!\nPremier achèvement de cet âge : #P +50 Era Momentum#!"
 splendor_default_bonus:0 "Avoir au moins #v [GetPlayer.MakeScope.ScriptValue('ve_era_reward_cost')|0]#! Era Momentum"
 ve_age_1_bonus_10_tt:0 "Nécessite une culture primaire de l'Italie du Nord ou du Sud de l'Italie."
 ve_age_2_bonus_10_tt:0 "Nécessite l'Autriche."
 ve_age_3_bonus_10_tt:0 "Nécessite la Grande-Bretagne."
 ve_age_1_bonus_11_tt:0 "Nécessite une culture primaire de l'Allemagne du Nord ou du Sud de l'Allemagne."
 ve_age_2_bonus_11_tt:0 "Nécessite la Russie."
 ve_age_3_bonus_11_tt:0 "Nécessite les Qing."
 ve_age_1_bonus_12_tt:0 "Nécessite les Pays-Bas."
 ve_age_2_bonus_12_tt:0 "Nécessite la Belgique."
 ve_age_3_bonus_12_tt:0 "Nécessite la France."
 ve_age_1_bonus_13_tt:0 "Nécessite l'Empire ottoman."
 ve_age_2_bonus_13_tt:0 "Nécessite les États-Unis."
 ve_age_3_bonus_13_tt:0 "Nécessite le Japon."
