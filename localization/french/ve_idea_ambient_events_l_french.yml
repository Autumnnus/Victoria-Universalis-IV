l_french:
 ve_doctrine_ambient_cooldown_mdf:0 "Temps de récupération du débat de doctrine"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Les institutions du pays absorbent les conséquences d'un récent débat de doctrine."
 ve_doctrine_ambient_ig_supported_mdf:0 "Soutien institutionnel"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Le gouvernement a donné à ce groupe d'intérêt un rôle visible dans le règlement d'un débat de doctrine."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Légère institutionnelle"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Le gouvernement a exclu ce groupe d'intérêt d'un récent règlement de doctrine."

 ve_doctrine_industrialist_positive_mdf:0 "Pratique industrielle standardisée"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Les fabricants bénéficient d'un ensemble coordonné de pratiques industrielles."
 ve_doctrine_industrialist_negative_mdf:0 "Industrielle Goulots d'étranglement"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Les échecs de coordination non résolus limitent la fabrication."
 ve_doctrine_academic_positive_mdf:0 "Réseau de recherche coordonné"
 ve_doctrine_academic_positive_mdf_desc:0 "Les universités partagent leurs méthodes, leur personnel et leurs résultats via un réseau coordonné."
 ve_doctrine_academic_negative_mdf:0 "Goulets d'étranglement académiques"
 ve_doctrine_academic_negative_mdf_desc:0 "Les conflits d'accréditation et de coordination perturbent les universités."
 ve_doctrine_nationalist_positive_mdf:0 "Réseau d'associations nationales"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Les associations nationales traduisent un gouvernement légitime en une loyauté plus large."
 ve_doctrine_nationalist_negative_mdf:0 "Sociétés nationales concurrentes"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Les organisations nationales rivales transforment la légitimité politique en nouvelles revendications."
 ve_doctrine_reformist_positive_mdf:0 "Réseau de réforme organisé"
 ve_doctrine_reformist_positive_mdf_desc:0 "Les mouvements politiques ont acquis des canaux ordonnés de participation et de compromis."
 ve_doctrine_reformist_negative_mdf:0 "Coalition de réforme fracturée"
 ve_doctrine_reformist_negative_mdf_desc:0 "Les organisations de réforme concurrentes transforment la mobilisation politique en radicalisme."
 ve_doctrine_professional_army_positive_mdf:0 "Cycle de formation du personnel"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Un programme d'état-major coordonné améliore le système de formation de l'armée."
 ve_doctrine_professional_army_negative_mdf:0 "Gout d'étranglement du corps des officiers"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Les conflits en matière de promotion et de recrutement ralentissent la formation militaire."
 ve_doctrine_agrarian_positive_mdf:0 "Pratiques agricoles coordonnées"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Les institutions rurales diffusent des méthodes fiables dans l’ensemble de l’économie agricole."
 ve_doctrine_agrarian_negative_mdf:0 "Pénurie d’approvisionnement agricole"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Les pénuries de semences, de crédit et de coordination réduisent le rendement agricole."

 ve_idea_evt.10.t:0 "Codes de sécurité à pleine puissance"
 ve_idea_evt.10.d:0 "Une série d'accidents d'usine a mis au grand jour la question de l'inspection industrielle. Les inspecteurs indépendants promettent des normes crédibles, tandis que les fabricants insistent sur le fait que les règles volontaires préserveront la production et l'initiative."
 ve_idea_evt.10.a:0 "Nommer des inspecteurs indépendants."
 ve_idea_evt.10.a.tt:0 "Dépenser #N 25#! Aperçu national. Les syndicats obtiennent #P +1#! approbation et les industriels perdent #N 1#! approbation pendant 24 mois."
 ve_idea_evt.10.b:0 "Laissons les industries rédiger des codes volontaires."
 ve_idea_evt.10.b.tt:0 "Les industriels gagnent #P +1#! Approbation et les syndicats perdent #N 1#! Approbation pour 24 mois."
 ve_idea_evt.10.c:0 "Standardiser les règles par étapes."
 ve_idea_evt.10.c.tt:0 "Dépenser #N 10#! National Insight. Aucun changement d’approbation du groupe d’intérêt."

 ve_idea_evt.11.t:0 "Pièces de machines standardisées"
 ve_idea_evt.11.d:0 "Les ingénieurs de plusieurs districts industriels ont produit un catalogue commun de jauges, de raccords et de pièces de machines. Le financement d’une norme nationale serait coûteux, mais pourrait éliminer les frictions au sein du réseau de fabrication."
 ve_idea_evt.11.a:0 "Adopter les normes à l’échelle nationale."
 ve_idea_evt.11.a.tt:0 "Dépenser #N 40#! Connaissance nationale et gain #P +5 %#! Débit de fabrication pendant 36 mois."
 ve_idea_evt.11.b:0 "Archiver les résultats pour plus tard."
 ve_idea_evt.11.b.tt:0 "Gagner #P 15#! Aperçu national."
 ve_idea_evt.11.c:0 "Nos réseaux de production sont déjà préparés."
 ve_idea_evt.11.c.tt:0 "Dépenser #N 20#! Aperçu et gain nationaux #P +5 %#! Débit de fabrication pendant 36 mois."

 ve_idea_evt.12.t:0 "Le goulot d'étranglement dans les travaux"
 ve_idea_evt.12.d:0 "Les commandes s'accumulent tandis que des procédures incompatibles, des composants en retard et des calendriers confus étouffent les usines du pays. Le gouvernement peut envoyer des spécialistes, laisser le problème aux entreprises ou faire appel à des bureaux de construction établis pour coordonner une réponse."
 ve_idea_evt.12.a:0 "Envoyez une équipe spécialisée."
 ve_idea_evt.12.a.tt:0 "Dépensez #N 25#! National Insight et éviter la pénalité industrielle."
 ve_idea_evt.12.b:0 "Les usines doivent résoudre ce problème elles-mêmes."
 ve_idea_evt.12.b.tt:0 "Souffrir #N -5%#! Débit de Fabrication pendant 24 mois."
 ve_idea_evt.12.c:0 "Activez les bureaux de construction."
 ve_idea_evt.12.c.tt:0 "Dépensez #N 10#! National Insight et éviter la pénalité industrielle."

 ve_idea_evt.60.t:0 "Mécanisation et régime foncier"
 ve_idea_evt.60.d:0 "De nouvelles machines pourraient augmenter la production agricole, mais les locataires et les petits exploitants craignent qu'une transition rapide ne déracine les moyens de subsistance ruraux. Le gouvernement doit décider s’il doit accélérer la mécanisation, protéger d’abord le régime foncier ou coordonner une transition locale progressive."
 ve_idea_evt.60.a:0 "Créer un fonds de mécanisation."
 ve_idea_evt.60.a.tt:0 "Dépenser #N 25#! Perspective nationale et gain #P +5 %#! Débit agricole pendant 24 mois. Les industriels obtiennent l’approbation #P +1#!  et les ruraux perdent #N 1#! Approbation pour 24 mois."
 ve_idea_evt.60.b:0 "Sécuriser les locataires avant de changer de ferme."
 ve_idea_evt.60.b.tt:0 "Les populations rurales gagnent #P +1#! Approbation et les propriétaires fonciers perdent #N 1#! Approbation pour 24 mois."
 ve_idea_evt.60.c:0 "Utiliser les réseaux de production locaux pour une transition progressive."
 ve_idea_evt.60.c.tt:0 "Dépenser #N 10#! Connaissance nationale et gain #P +5%#! Débit agricole pendant 24 mois. Aucun changement d’approbation du groupe d’intérêt."

 ve_idea_evt.61.t:0 "Greniers coopératifs"
 ve_idea_evt.61.d:0 "Les délégués ruraux ont démontré un réseau de greniers coopératifs capables de partager les réserves, les registres et le transport. Un programme national pourrait renforcer la coordination agricole, alors que le simple fait de préserver les plans enrichirait les connaissances institutionnelles du gouvernement."
 ve_idea_evt.61.a:0 "Financer le réseau coopératif."
 ve_idea_evt.61.a.tt:0 "Dépensez #N 40#! National Insight et gagnez #P +5 %#! Débit agricole pendant 36 mois."
 ve_idea_evt.61.b:0 "Distribuez les dossiers aux bureaux agricoles."
 ve_idea_evt.61.b.tt:0 "Gagnez #P 15#! Une vision nationale."
 ve_idea_evt.61.c:0 "Utilisez les institutions rurales déjà en place."
 ve_idea_evt.61.c.tt:0 "Dépensez #N 20#! Aperçu national et gain #P +5 %#! Débit agricole pendant 36 mois."

 ve_idea_evt.62.t:0 "Pénurie de semences et de crédit"
 ve_idea_evt.62.d:0 "La faiblesse des stocks de semences et le resserrement du crédit rural menacent le prochain cycle agricole. Les spécialistes peuvent organiser une intervention d’urgence, les réseaux locaux peuvent être laissés à l’improvisation ou les institutions de subsistance établies peuvent temporairement supporter le fardeau."
 ve_idea_evt.62.a:0 "Organiser un programme d’expertise d’urgence."
 ve_idea_evt.62.a.tt:0 "Dépenser #N 25#! National Insight et éviter la pénalité agricole."
 ve_idea_evt.62.b:0 "Laissons les réseaux locaux trouver leur propre solution."
 ve_idea_evt.62.b.tt:0 "Souffrir #N -5%#! Débit agricole pendant 24 mois."
 ve_idea_evt.62.c:0 "Utilisez les réseaux de subsistance comme épine dorsale temporaire."
 ve_idea_evt.62.c.tt:0 "Dépensez #N 10#! Inspection nationale et évitez la pénalité agricole."

 ve_idea_evt.20.t:0 "Mécénat ou examen par les pairs"
 ve_idea_evt.20.d:0 "Le gouvernement s'attend à des résultats pratiques de ses subventions de recherche, tandis que les universitaires préviennent que le favoritisme remplacera les preuves par des commodités politiques. Un règlement durable doit définir qui juge l'apprentissage du pays."
 ve_idea_evt.20.a:0 "Établir des commissions d'examen indépendantes."
 ve_idea_evt.20.a.tt:0 "Dépenser #N 25#! National Insight. L’Intelligentsia gagne #P +1#! Approbation et la Petite Bourgeoisie perd #N 1#! Approbation pendant 24 mois."
 ve_idea_evt.20.b:0 "Laissons l’État définir les priorités de recherche."
 ve_idea_evt.20.b.tt:0 "La Petite Bourgeoisie gagne #P +1#! Approbation et l’Intelligentsia perd #N 1#! Approbation pendant 24 mois."
 ve_idea_evt.20.c:0 "Institutionaliser des normes académiques communes."
 ve_idea_evt.20.c.tt:0 "Dépenser #N 10#!  Aperçu national. Aucun changement d’approbation du groupe d’intérêt."
 ve_idea_evt.21.t:0 "Un réseau de recherche provincial"
 ve_idea_evt.21.d:0 "Les collèges provinciaux ont commencé à échanger des professeurs, des instruments et des résultats sans direction centrale. Un soutien formel pourrait transformer cette coopération improvisée en un réseau national de recherche."
 ve_idea_evt.21.a:0 "Financer le réseau."
 ve_idea_evt.21.a.tt:0 "Dépensez #N 40#! National Insight et gagnez #P +5 %#! Le débit universitaire pendant 36 mois."
 ve_idea_evt.21.b:0 "Placez les rapports dans les archives centrales."
 ve_idea_evt.21.b.tt:0 "Gagnez #P 15#! National Insight."
 ve_idea_evt.21.c:0 "Connectez-le à l'académie nationale."
 ve_idea_evt.21.c.tt:0 "Dépensez #N 20#! Aperçu et gain nationaux #P +5 %#! Rendement universitaire pendant 36 mois."
 ve_idea_evt.22.t:0 "Le goulot d'étranglement des diplômes"
 ve_idea_evt.22.d:0 "Les universités ne peuvent pas évaluer assez rapidement le nombre croissant d'étudiants, d'instructeurs et de nouvelles disciplines. Les diplômes retardés menacent désormais le système de recherche dans son ensemble."
 ve_idea_evt.22.a:0 "Développer la capacité d’évaluation."
 ve_idea_evt.22.a.tt:0 "Dépenser #N 25#! National Insight et éviter la pénalité académique."
 ve_idea_evt.22.b:0 "Les institutions existantes doivent faire face."
 ve_idea_evt.22.b.tt:0 "Souffrir #N -5%#! Débit universitaire pendant 24 mois."
 ve_idea_evt.22.c:0 "Standardiser à travers le réseau scolaire."
 ve_idea_evt.22.c.tt:0 "Dépenser #N 10#! National Insight et éviter la pénalité académique."

 ve_idea_evt.30.t:0 "Un canon, plusieurs traditions"
 ve_idea_evt.30.d:0 "Les responsables qui préparent un canon national sont en désaccord sur la place des coutumes provinciales. Un récit unique promet de la clarté, mais exclure les traditions locales pourrait affaiblir la nation même qu’il entend définir."
 ve_idea_evt.30.a:0 "Intégrez les traditions locales à l’histoire commune."
 ve_idea_evt.30.a.tt:0 "Dépenser #N 25#! Regard national. Le peuple rural gagne #P +1#! Approbation et la Petite Bourgeoisie perd #N 1#! Approbation pendant 24 mois."
 ve_idea_evt.30.b:0 "Proclamez un canon officiel."
 ve_idea_evt.30.b.tt:0 "La Petite Bourgeoisie gagne #P +1#! Approbation et les gens ruraux perdent #N 1#! Approbation pendant 24 mois."
 ve_idea_evt.30.c:0 "Confiez le travail à des cadres culturels formés."
 ve_idea_evt.30.c.tt:0 "Dépensez #N 10#!  Aperçu national. Aucun changement dans l'approbation des groupes d'intérêt."
 ve_idea_evt.31.t:0 "Associations nationales d'anciens combattants"
 ve_idea_evt.31.d:0 "Les anciens combattants ont organisé des associations liant cérémonie, entraide et loyauté envers l’État. Leur réseau pourrait être étendu à l’échelle nationale ou étudié sans lui accorder un rôle officiel."
 ve_idea_evt.31.a:0 "Soutenir les associations à l’échelle nationale."
 ve_idea_evt.31.a.tt:0 "Dépenser #N 40#! Perspective nationale et gain #P +5%#! Loyalistes de légitimité pendant 36 mois."
 ve_idea_evt.31.b:0 "Enregistrez leur expérience dans les archives de l'État."
 ve_idea_evt.31.b.tt:0 "Gagnez #P 15#! National Insight."
 ve_idea_evt.31.c:0 "Utiliser les réseaux nationaux déjà établis."
 ve_idea_evt.31.c.tt:0 "Dépenser #N 20#! Aperçu national et gain #P +5 %#! de loyalistes grâce à la légitimité pendant 36 mois."
 ve_idea_evt.32.t:0 "Sociétés nationales concurrentes"
 ve_idea_evt.32.d:0 "Les sociétés rivales revendiquent désormais le droit de parler au nom de la nation. Leurs cérémonies et publications concurrentes transforment un langage politique commun en une source de griefs."
 ve_idea_evt.32.a:0 "Rédiger une charte commune."
 ve_idea_evt.32.a.tt:0 "Dépensez #N 25#! National Insight et évitez la pénalité nationaliste."
 ve_idea_evt.32.b:0 "La concurrence trouvera ses propres limites."
 ve_idea_evt.32.b.tt:0 "Souffrir #N +5%#! Radicaux de la légitimité pendant 24 mois."
 ve_idea_evt.32.c:0 "Laissons les institutions nationales arbitrer."
 ve_idea_evt.32.c.tt:0 "Dépensez #N 10#! Inspection nationale et évitez la sanction nationaliste."

 ve_idea_evt.40.t:0 "Comité ou rue"
 ve_idea_evt.40.d:0 "Les réformateurs sont partagés entre commissions d’experts et pressions de masse. Les commissions promettent une législation cohérente, tandis que les mouvements organisés insistent sur le fait que les réformes sans force publique seront retardées indéfiniment."
 ve_idea_evt.40.a:0 "Créer une commission de réforme indépendante."
 ve_idea_evt.40.a.tt:0 "Dépenser #N 25#! Regard national. L’Intelligentsia gagne #P +1#! L'approbation et les syndicats perdent #N 1#! l'approbation pendant 24 mois."
 ve_idea_evt.40.b:0 "Donnez aux mouvements une marge d'action."
 ve_idea_evt.40.b.tt:0 "Les syndicats gagnent #P +1#! Agrément et les industriels perdent #N 1#! Agrément pendant 24 mois."
 ve_idea_evt.40.c:0 "Appliquer le cadre établi de droits et de procédure."
 ve_idea_evt.40.c.tt:0 "Dépenser #N 10#! Aperçu national. Aucun changement d’approbation du groupe d’intérêt."
 ve_idea_evt.41.t:0 "Le réseau de pétitions"
 ve_idea_evt.41.d:0 "Les pétitions locales sont devenues un réseau national coordonné capable de trier les griefs et de proposer des réformes. Le gouvernement peut le reconnaître comme un canal consultatif ou conserver ses méthodes pour une utilisation ultérieure."
 ve_idea_evt.41.a:0 "Transformez le réseau en consultation formelle."
 ve_idea_evt.41.a.tt:0 "Dépenser #N 40#! Aperçu national et gain #P +5%#! Loyalistes des mouvements politiques pendant 36 mois."
 ve_idea_evt.41.b:0 "Déposez les demandes dans les archives de révision."
 ve_idea_evt.41.b.tt:0 "Gagnez #P 15#! Inspection nationale."
 ve_idea_evt.41.c:0 "Utilisez les organisations de réforme déjà établies."
 ve_idea_evt.41.c.tt:0 "Dépensez #N 20#! Aperçu national et gain #P +5 %#! de loyalistes issus des mouvements politiques pendant 36 mois."
 ve_idea_evt.42.t:0 "La coalition se fracture"
 ve_idea_evt.42.d:0 "La coalition réformatrice est divisée sur les priorités, le calendrier et le leadership. À moins qu’un programme commun ne soit rétabli, l’énergie politique organisée se durcira en camps radicaux rivaux."
 ve_idea_evt.42.a:0 "Réécrivez le programme commun."
 ve_idea_evt.42.a.tt:0 "Dépensez #N 25#! National Insight et éviter la sanction réformiste."
 ve_idea_evt.42.b:0 "Laissez la division entrer en politique ouverte."
 ve_idea_evt.42.b.tt:0 "Souffrir #N +5%#! des radicaux des mouvements politiques pendant 24 mois."
 ve_idea_evt.42.c:0 "Réappliquer le cadre égalitaire."
 ve_idea_evt.42.c.tt:0 "Dépenser #N 10#! National Insight et éviter la pénalité réformiste."

 ve_idea_evt.50.t:0 "Ancienneté ou mérite"
 ve_idea_evt.50.d:0 "Le corps des officiers est divisé sur la promotion. Les commandants supérieurs défendent leur rang en fonction du service et de la coutume, tandis que les réformateurs exigent des examens et des dossiers de performance qui ouvriraient la voie à un avancement vers des capacités avérées."
 ve_idea_evt.50.a:0 "Introduire des examens de mérite."
 ve_idea_evt.50.a.tt:0 "Dépensez #N 25#! National Insight et gagnez #P +5 %#! Taux de formation pendant 24 mois. Les Forces Armées perdent #N 1#! Agrément pendant 24 mois."
 ve_idea_evt.50.b:0 "Préserver le système d'ancienneté."
 ve_idea_evt.50.b.tt:0 "Les Forces Armées gagnent #P +1#! Approbation pour 24 mois, mais le taux de formation diminue de #N -5%#! pendant 12 mois."
 ve_idea_evt.50.c:0 "Utilisez les états de service de l'état-major."
 ve_idea_evt.50.c.tt:0 "Dépensez #N 10#! Insight National et gagnez #P +5%#! Taux de formation pendant 24 mois. L’approbation des groupes d’intérêt ne change pas."
 ve_idea_evt.51.t:0 "Le grand exercice du personnel"
 ve_idea_evt.51.d:0 "Un vaste exercice d’état-major a révélé de précieuses leçons en matière de mobilisation, d’instruction et de commandement. L'expansion du programme pourrait diffuser ces enseignements dans l'armée, tandis que l'archivage des résultats permettrait de les préserver à peu de frais."
 ve_idea_evt.51.a:0 "Élargir l'exercice."
 ve_idea_evt.51.a.tt:0 "Dépensez #N 40#! National Insight et gagnez #P +5%#! Taux de formation pendant 36 mois."
 ve_idea_evt.51.b:0 "Placez les résultats dans les archives de doctrine."
 ve_idea_evt.51.b.tt:0 "Gagnez #P 15#! National Insight."
 ve_idea_evt.51.c:0 "Utilisez le réseau de commandement professionnel."
 ve_idea_evt.51.c.tt:0 "Dépensez #N 20#! National Insight et gagnez #P +5%#! Taux de formation pendant 36 mois."
 ve_idea_evt.52.t:0 "Un goulot d'étranglement dans le corps des officiers"
 ve_idea_evt.52.d:0 "L'armée se développe plus vite que ses instructeurs et officiers d'état-major ne peuvent être préparés. Les programmes de formation dépendent désormais d'un groupe restreint de cadres épuisés."
 ve_idea_evt.52.a:0 "Élargissez le cadre de formation."
 ve_idea_evt.52.a.tt:0 "Dépensez #N 25#! National Insight et évitez la sanction militaire."
 ve_idea_evt.52.b:0 "Poussez plus fort les cadres existants."
 ve_idea_evt.52.b.tt:0 "Souffrez #N -5%#! Taux de formation pendant 24 mois."
 ve_idea_evt.52.c:0 "Transférez la réserve du personnel logistique."
 ve_idea_evt.52.c.tt:0 "Dépensez #N 10#! Insight National et évitez la pénalité militaire."
