l_french:
 ve_doctrine_ambient_cooldown_mdf:0 "Délai de débat sur la doctrine"
 ve_doctrine_ambient_cooldown_mdf_desc:0 "Les institutions du pays absorbent les conséquences d'un récent débat sur la doctrine."
 ve_doctrine_ambient_ig_supported_mdf:0 "Soutien institutionnel"
 ve_doctrine_ambient_ig_supported_mdf_desc:0 "Le Gouvernement a accordé à ce Groupe d’intérêt un rôle visible dans le règlement d'un débat sur la doctrine."
 ve_doctrine_ambient_ig_slighted_mdf:0 "Affront institutionnel"
 ve_doctrine_ambient_ig_slighted_mdf_desc:0 "Le Gouvernement a exclu ce Groupe d’intérêt d'un récent règlement sur la doctrine."

 ve_doctrine_industrialist_positive_mdf:0 "Pratique industrielle normalisée"
 ve_doctrine_industrialist_positive_mdf_desc:0 "Les fabricants bénéficient d'un ensemble coordonné de pratiques industrielles."
 ve_doctrine_industrialist_negative_mdf:0 "Goulots d'étranglement industriels"
 ve_doctrine_industrialist_negative_mdf_desc:0 "Des échecs de coordination non résolus contraignent la fabrication."
 ve_doctrine_academic_positive_mdf:0 "Réseau de recherche coordonné"
 ve_doctrine_academic_positive_mdf_desc:0 "Les universités partagent méthodes, personnel et résultats par le biais d'un réseau coordonné."
 ve_doctrine_academic_negative_mdf:0 "Goulots d'étranglement académiques"
 ve_doctrine_academic_negative_mdf_desc:0 "Des différends de qualifications et de coordination perturbent les universités."
 ve_doctrine_nationalist_positive_mdf:0 "Réseau d'associations nationales"
 ve_doctrine_nationalist_positive_mdf_desc:0 "Les associations nationales traduisent un Gouvernement légitime en une loyauté accrue."
 ve_doctrine_nationalist_negative_mdf:0 "Sociétés nationales concurrentes"
 ve_doctrine_nationalist_negative_mdf_desc:0 "Des organisations nationales rivales transforment la légitimité politique en nouveaux griefs."
 ve_doctrine_reformist_positive_mdf:0 "Réseau de réforme organisé"
 ve_doctrine_reformist_positive_mdf_desc:0 "Les mouvements politiques ont acquis des voies ordonnées pour la participation et le compromis."
 ve_doctrine_reformist_negative_mdf:0 "Coalition réformatrice fracturée"
 ve_doctrine_reformist_negative_mdf_desc:0 "Des organisations réformatrices concurrentes convertissent la mobilisation politique en radicalisme."
 ve_doctrine_professional_army_positive_mdf:0 "Cycle d'entraînement des états-majors"
 ve_doctrine_professional_army_positive_mdf_desc:0 "Un programme d'état-major coordonné améliore le système d'entraînement de l'Armée."
 ve_doctrine_professional_army_negative_mdf:0 "Goulot d'étranglement du corps des officiers"
 ve_doctrine_professional_army_negative_mdf_desc:0 "Des différends de promotion et de dotation en personnel ralentissent l'entraînement militaire."
 ve_doctrine_agrarian_positive_mdf:0 "Pratique agricole coordonnée"
 ve_doctrine_agrarian_positive_mdf_desc:0 "Les institutions rurales diffusent des méthodes fiables à travers l'économie agricole."
 ve_doctrine_agrarian_negative_mdf:0 "Pénurie d'approvisionnement agricole"
 ve_doctrine_agrarian_negative_mdf_desc:0 "Des pénuries de semences, de crédit et de coordination réduisent la Capacité de production agricole."

 ve_idea_evt.10.t:0 "Codes de sécurité à pleine production"
 ve_idea_evt.10.d:0 "Une série d'accidents d'usine a mis au premier plan la question de l'inspection industrielle. Des inspecteurs indépendants promettent des normes crédibles, tandis que les fabricants insistent sur le fait que des règles volontaires préserveront la production et l'initiative."
 ve_idea_evt.10.a:0 "Nommer des inspecteurs indépendants."
 ve_idea_evt.10.a.tt:0 "Dépenser #N 25#! Perspicacité nationale. Les Syndicats de travailleurs gagnent #P +1#! Approbation et les Industriels perdent #N 1#! Approbation pendant 24 mois."
 ve_idea_evt.10.b:0 "Laisser les industries rédiger des codes volontaires."
 ve_idea_evt.10.b.tt:0 "Les Industriels gagnent #P +1#! Approbation et les Syndicats de travailleurs perdent #N 1#! Approbation pendant 24 mois."
 ve_idea_evt.10.c:0 "Standardiser les règles par étapes."
 ve_idea_evt.10.c.tt:0 "Dépenser #N 10#! Perspicacité nationale. Aucune modification de l'Approbation des groupes d’intérêt."

 ve_idea_evt.11.t:0 "Pièces de machines standardisées"
 ve_idea_evt.11.d:0 "Des ingénieurs de divers districts industriels ont produit un catalogue commun de calibres, de raccords et de pièces détachées. Financer une norme nationale serait coûteux, mais permettrait d'éliminer les frictions dans le réseau manufacturier."
 ve_idea_evt.11.a:0 "Adopter les normes à l'échelle nationale."
 ve_idea_evt.11.a.tt:0 "Dépenser #N 40#! de Perspicacité nationale et obtenir #P +5%#! de Capacité de production de la manufacture pendant 36 mois."
 ve_idea_evt.11.b:0 "Archiver les conclusions pour plus tard."
 ve_idea_evt.11.b.tt:0 "Gagner #P 15#! de Perspicacité nationale."
 ve_idea_evt.11.c:0 "Nos réseaux de production sont déjà préparés."
 ve_idea_evt.11.c.tt:0 "Dépenser #N 20#! de Perspicacité nationale et obtenir #P +5%#! de Capacité de production de la manufacture pendant 36 mois."

 ve_idea_evt.12.t:0 "Le goulot d'étranglement dans les usines"
 ve_idea_evt.12.d:0 "Les commandes s'accumulent tandis que des procédures incompatibles, des composants retardés et des calendriers confus étouffent les usines du pays. Le gouvernement peut envoyer des spécialistes, laisser le problème aux entreprises ou utiliser les bureaux de construction établis pour coordonner une réponse."
 ve_idea_evt.12.a:0 "Dépêcher une équipe de spécialistes."
 ve_idea_evt.12.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale et éviter la pénalité industrielle."
 ve_idea_evt.12.b:0 "Les usines doivent résoudre cela par elles-mêmes."
 ve_idea_evt.12.b.tt:0 "Subir #N -5%#! de Capacité de production de la manufacture pendant 24 mois."
 ve_idea_evt.12.c:0 "Activer les bureaux de construction."
 ve_idea_evt.12.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale et éviter la pénalité industrielle."

 ve_idea_evt.60.t:0 "Mécanisation et régime foncier"
 ve_idea_evt.60.d:0 "De nouvelles machines pourraient accroître la production agricole, mais les fermiers et les petits propriétaires craignent qu'une transition rapide ne déracine les moyens de subsistance ruraux. Le gouvernement doit décider s'il convient d'accélérer la mécanisation, de protéger d'abord le régime foncier ou de coordonner une transition locale graduelle."
 ve_idea_evt.60.a:0 "Créer un fonds de mécanisation."
 ve_idea_evt.60.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale et obtenir #P +5%#! de Capacité de production de l’Agriculture pendant 24 mois. Les Industriels gagnent #P +1#! d'Approbation et les Ruraux perdent #N 1#! d'Approbation pendant 24 mois."
 ve_idea_evt.60.b:0 "Protéger les fermiers avant de modifier les exploitations."
 ve_idea_evt.60.b.tt:0 "Les Ruraux gagnent #P +1#! d'Approbation et les Propriétaires terriens perdent #N 1#! d'Approbation pendant 24 mois."
 ve_idea_evt.60.c:0 "Utiliser les réseaux de production locaux pour une transition graduelle."
 ve_idea_evt.60.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale et obtenir #P +5%#! de Capacité de production de l’Agriculture pendant 24 mois. Aucun changement d'Approbation du groupe d’intérêt."

 ve_idea_evt.61.t:0 "Greniers coopératifs"
 ve_idea_evt.61.d:0 "Des délégués ruraux ont présenté un réseau de greniers coopératifs capables de partager réserves, registres et transports. Un programme national pourrait renforcer la coordination agricole, tandis que la simple préservation des plans enrichirait tout de même les connaissances institutionnelles du gouvernement."
 ve_idea_evt.61.a:0 "Financer le réseau coopératif."
 ve_idea_evt.61.a.tt:0 "Dépenser #N 40#! de Perspicacité nationale et obtenir #P +5%#! de Capacité de production de l’Agriculture pendant 36 mois."
 ve_idea_evt.61.b:0 "Distribuer les registres aux bureaux agricoles."
 ve_idea_evt.61.b.tt:0 "Gagner #P 15#! de Perspicacité nationale."
 ve_idea_evt.61.c:0 "Utiliser les institutions rurales déjà en place."
 ve_idea_evt.61.c.tt:0 "Dépenser #N 20#! de Perspicacité nationale et obtenir #P +5%#! de Capacité de production de l’Agriculture pendant 36 mois."

 ve_idea_evt.62.t:0 "Pénurie de semences et de crédit"
 ve_idea_evt.62.d:0 "De mauvaises réserves de semences et un durcissement du crédit rural menacent le cycle agricole à venir. Des spécialistes peuvent organiser une réponse d'urgence, des réseaux locaux peuvent être laissés à l'improvisation, ou des institutions de subsistance établies peuvent porter temporairement le fardeau."
 ve_idea_evt.62.a:0 "Organiser un programme d'expertise d'urgence."
 ve_idea_evt.62.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale et éviter la pénalité agricole."
 ve_idea_evt.62.b:0 "Laisser les réseaux locaux trouver leur propre solution."
 ve_idea_evt.62.b.tt:0 "Subir #N -5%#! de Capacité de production de l’Agriculture pendant 24 mois."
 ve_idea_evt.62.c:0 "Utiliser les réseaux de subsistance comme colonne vertébrale temporaire."
 ve_idea_evt.62.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale et éviter la pénalité agricole."

 ve_idea_evt.20.t:0 "Patronage ou évaluation par les pairs"
 ve_idea_evt.20.d:0 "Le gouvernement attend des résultats pratiques de ses subventions à la recherche, tandis que les universitaires avertissent que le patronage remplacera les faits par la convenance politique. Un compromis durable doit définir qui juge l'érudition du pays."
 ve_idea_evt.20.a:0 "Établir des comités d'évaluation indépendants."
 ve_idea_evt.20.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale. L'Élite intellectuelle gagne #P +1#! en Approbation et la Petite bourgeoisie perd #N 1#! en Approbation pendant 24 mois."
 ve_idea_evt.20.b:0 "Laisser l'État définir les priorités de recherche."
 ve_idea_evt.20.b.tt:0 "La Petite bourgeoisie gagne #P +1#! en Approbation et l'Élite intellectuelle perd #N 1#! en Approbation pendant 24 mois."
 ve_idea_evt.20.c:0 "Institutionaliser des normes académiques communes."
 ve_idea_evt.20.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale. Aucune modification de l'Approbation des groupes d’intérêt."
 ve_idea_evt.21.t:0 "Un réseau de recherche provincial"
 ve_idea_evt.21.d:0 "Les collèges provinciaux ont commencé à échanger des conférenciers, des instruments et des découvertes sans direction centrale. Un soutien officiel pourrait transformer cette coopération improvisée en un réseau de recherche national."
 ve_idea_evt.21.a:0 "Financer le réseau."
 ve_idea_evt.21.a.tt:0 "Dépenser #N 40#! de Perspicacité nationale et gagner #P +5%#! de Capacité de production des Université pendant 36 mois."
 ve_idea_evt.21.b:0 "Placer les rapports dans les archives centrales."
 ve_idea_evt.21.b.tt:0 "Gagner #P 15#! de Perspicacité nationale."
 ve_idea_evt.21.c:0 "Le relier à l'académie nationale."
 ve_idea_evt.21.c.tt:0 "Dépenser #N 20#! de Perspicacité nationale et gagner #P +5%#! de Capacité de production des Université pendant 36 mois."
 ve_idea_evt.22.t:0 "Le goulet d'étranglement des diplômes"
 ve_idea_evt.22.d:0 "Les universités ne peuvent évaluer assez rapidement le nombre croissant d'étudiants, d'instructeurs et de nouvelles disciplines. Le retard des diplômes menace désormais l'ensemble du système de recherche."
 ve_idea_evt.22.a:0 "Étendre la capacité d'évaluation."
 ve_idea_evt.22.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale et éviter la pénalité académique."
 ve_idea_evt.22.b:0 "Les institutions existantes doivent s'adapter."
 ve_idea_evt.22.b.tt:0 "Subir #N -5%#! de Capacité de production des Université pendant 24 mois."
 ve_idea_evt.22.c:0 "Standardiser à travers le réseau scolaire."
 ve_idea_evt.22.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale et éviter la pénalité académique."

 ve_idea_evt.30.t:0 "Un canon, de nombreuses traditions"
 ve_idea_evt.30.d:0 "Les fonctionnaires préparant un canon national sont en désaccord sur la place des coutumes provinciales. Un récit unique promet la clarté, mais l'exclusion des traditions locales risque d'affaiblir la nation même qu'il entend définir."
 ve_idea_evt.30.a:0 "Tisser les traditions locales dans le récit commun."
 ve_idea_evt.30.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale. Les Ruraux gagnent #P +1#! en Approbation et la Petite bourgeoisie perd #N 1#! en Approbation pendant 24 mois."
 ve_idea_evt.30.b:0 "Proclamer un canon officiel unique."
 ve_idea_evt.30.b.tt:0 "La Petite bourgeoisie gagne #P +1#! en Approbation et les Ruraux perdent #N 1#! en Approbation pendant 24 mois."
 ve_idea_evt.30.c:0 "Confier le travail à des cadres culturels formés."
 ve_idea_evt.30.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale. Aucune modification de l'Approbation des groupes d’intérêt."
 ve_idea_evt.31.t:0 "Associations nationales d'anciens combattants"
 ve_idea_evt.31.d:0 "Les anciens combattants ont organisé des associations qui lient cérémonie, entraide et loyauté envers l'État. Leur réseau pourrait être étendu à l'échelle nationale ou étudié sans pour autant lui accorder un rôle officiel."
 ve_idea_evt.31.a:0 "Soutenir les associations à l'échelle nationale."
 ve_idea_evt.31.a.tt:0 "Dépenser #N 40#! de Perspicacité nationale et gagner #P +5%#! de Loyalistes de la Légitimité pendant 36 mois."
 ve_idea_evt.31.b:0 "Enregistrer leur expérience dans les archives de l'État."
 ve_idea_evt.31.b.tt:0 "Gagner #P 15#! de Perspicacité nationale."
 ve_idea_evt.31.c:0 "Utiliser les réseaux nationaux déjà établis."
 ve_idea_evt.31.c.tt:0 "Dépenser #N 20#! de Perspicacité nationale et gagner #P +5%#! de Loyalistes de la Légitimité pendant 36 mois."
 ve_idea_evt.32.t:0 "Sociétés nationales concurrentes"
 ve_idea_evt.32.d:0 "Des sociétés rivales revendiquent désormais le droit de parler au nom de la Nation. Leurs cérémonies et leurs publications concurrentes transforamient un langage politique partagé en source de griefs."
 ve_idea_evt.32.a:0 "Rédiger une charte commune."
 ve_idea_evt.32.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale et éviter la pénalité nationaliste."
 ve_idea_evt.32.b:0 "La concurrence trouvera ses propres limites."
 ve_idea_evt.32.b.tt:0 "Subir #N +5%#! de Radicaux dus à la Légitimité pendant 24 mois."
 ve_idea_evt.32.c:0 "Laisser les institutions nationales arbitrer."
 ve_idea_evt.32.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale et éviter la pénalité nationaliste."

 ve_idea_evt.40.t:0 "Comité ou rue"
 ve_idea_evt.40.d:0 "Les réformateurs sont divisés entre commissions d'experts et pression de la masse. Les comités promettent une législation cohérente, tandis que les mouvements organisés soutiennent qu'une réforme sans force publique sera retardée indéfiniment."
 ve_idea_evt.40.a:0 "Créer une commission de réforme indépendante."
 ve_idea_evt.40.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale. L’Élite intellectuelle gagne #P +1#! en Approbation et les Syndicats de travailleurs perdent #N 1#! en Approbation pendant 24 mois."
 ve_idea_evt.40.b:0 "Laisser aux mouvements une marge d’action."
 ve_idea_evt.40.b.tt:0 "Les Syndicats de travailleurs gagnent #P +1#! en Approbation et les Industriels perdent #N 1#! en Approbation pendant 24 mois."
 ve_idea_evt.40.c:0 "Appliquer le cadre établi des droits et des procédures."
 ve_idea_evt.40.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale. Aucune modification de l’Approbation du groupe d’intérêt."
 ve_idea_evt.41.t:0 "Le réseau de pétitions"
 ve_idea_evt.41.d:0 "Les pétitions locales sont devenues un réseau national coordonné, capable de trier les griefs et de proposer des réformes. Le Gouvernement peut le reconnaître comme canal consultatif ou préserver ses méthodes pour un usage ultérieur."
 ve_idea_evt.41.a:0 "Transformer le réseau en consultation officielle."
 ve_idea_evt.41.a.tt:0 "Dépenser #N 40#! de Perspicacité nationale et gagner #P +5%#! de Loyalists from Political Movements pendant 36 mois."
 ve_idea_evt.41.b:0 "Classer les revendications dans les archives d’examen."
 ve_idea_evt.41.b.tt:0 "Gagner #P 15#! de Perspicacité nationale."
 ve_idea_evt.41.c:0 "Recourir aux organisations de réforme déjà établies."
 ve_idea_evt.41.c.tt:0 "Dépenser #N 20#! de Perspicacité nationale et gagner #P +5%#! de Loyalists from Political Movements pendant 36 mois."
 ve_idea_evt.42.t:0 "La fracture de la coalition"
 ve_idea_evt.42.d:0 "La coalition réformatrice se divise sur les priorités, le calendrier et le leadership. À moins de rétablir un programme commun, l'énergie politique organisée se durcira en camps radicaux rivaux."
 ve_idea_evt.42.a:0 "Réécrire le programme commun."
 ve_idea_evt.42.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale et éviter la pénalité réformiste."
 ve_idea_evt.42.b:0 "Laisser la division entrer dans la politique ouverte."
 ve_idea_evt.42.b.tt:0 "Subir #N +5%#! de Radicals from Political Movements pendant 24 mois."
 ve_idea_evt.42.c:0 "Réappliquer le cadre égalitaire."
 ve_idea_evt.42.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale et éviter la pénalité réformiste."

 ve_idea_evt.50.t:0 "Ancienneté ou mérite"
 ve_idea_evt.50.d:0 "Le corps des officiers est divisé sur les avancements. Les commandants supérieurs défendent le rang fondé sur le service et l'usage, tandis que les réformateurs exigent des examens et des dossiers de performance qui ouvriraient l'accès aux grades supérieurs aux compétences avérées."
 ve_idea_evt.50.a:0 "Instaurer des examens au mérite."
 ve_idea_evt.50.a.tt:0 "Dépenser #N 25#! de Perspicacité nationale et gagner #P +5%#! de Taux d’entraînement pendant 24 mois. Les Forces armées perdent #N 1#! en Approbation pendant 24 mois."
 ve_idea_evt.50.b:0 "Préserver le système d'ancienneté."
 ve_idea_evt.50.b.tt:0 "Les Forces armées gagnent #P +1#! en Approbation pendant 24 mois, mais le Taux d’entraînement chute de #N -5%#! pendant 12 mois."
 ve_idea_evt.50.c:0 "Utiliser les dossiers de service de l'état-major."
 ve_idea_evt.50.c.tt:0 "Dépenser #N 10#! de Perspicacité nationale et gagner #P +5%#! de Taux d’entraînement pendant 24 mois. L'Approbation du groupe d’intérêt ne change pas."
 ve_idea_evt.51.t:0 "Le grand exercice d'état-major"
 ve_idea_evt.51.d:0 "Un vaste exercice d'état-major a mis en lumière de précieux enseignements en matière de mobilisation, d'instruction et de commandement. Développer ce programme permettrait de diffuser ces leçons au sein de l'armée, tandis que l'archivage des conclusions les préserverait à moindre coût."
 ve_idea_evt.51.a:0 "Développer l'exercice."
 ve_idea_evt.51.a.tt:0 "Dépense #N 40#! de Perspicacité nationale et octroie #P +5%#! de Taux d’entraînement pendant 36 mois."
 ve_idea_evt.51.b:0 "Verser les conclusions aux archives de la doctrine."
 ve_idea_evt.51.b.tt:0 "Octroie #P 15#! de Perspicacité nationale."
 ve_idea_evt.51.c:0 "Faire appel au réseau de commandement professionnel."
 ve_idea_evt.51.c.tt:0 "Dépense #N 20#! de Perspicacité nationale et octroie #P +5%#! de Taux d’entraînement pendant 36 mois."
 ve_idea_evt.52.t:0 "Un goulet d'étranglement dans le corps des officiers"
 ve_idea_evt.52.d:0 "L'armée s'accroît plus rapidement que ses instructeurs et ses officiers d'état-major ne peuvent être formés. Les programmes d'instruction reposent désormais sur un groupe restreint de cadres épuisés."
 ve_idea_evt.52.a:0 "Élargir le cadre des formateurs."
 ve_idea_evt.52.a.tt:0 "Dépense #N 25#! de Perspicacité nationale et évite la pénalité militaire."
 ve_idea_evt.52.b:0 "Solliciter davantage les cadres actuels."
 ve_idea_evt.52.b.tt:0 "Subit #N -5%#! de Taux d’entraînement pendant 24 mois."
 ve_idea_evt.52.c:0 "Transférer la réserve de l'état-major logistique."
 ve_idea_evt.52.c.tt:0 "Dépense #N 10#! de Perspicacité nationale et évite la pénalité militaire."
