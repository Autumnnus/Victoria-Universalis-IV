 ve_je_era_crossroads_age_2_route_2_status:0 "#Y Assistance sociale de masse#!\nProgrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif d'alphabétisation ou d'école et l'objectif d'institution sociale fixés au cours de cet âge.\n\nObjectif : atteindre 60 progrès pour #P +50 Era Momentum#!. Les jalons à 20 et 40 Progrès offrent un coup de pouce financé par National Insight."
 ve_je_era_crossroads_age_2_route_3_status:0 "#Y Nation intégrée#!\nProgrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de transformation économique et l'objectif de légitimité à faible perturbation garantis au cours de cette ère.\n\nObjectif : atteindre 60 progrès pour #P +50 d'élan d'ère#!. Les jalons à 20 et 40 Progress offrent un coup de pouce financé par National Insight."
 ve_je_era_crossroads_age_3:0 "La société mobilisée"
 ve_je_era_crossroads_age_3_reason:0 "La politique de masse et la guerre totale intègrent la citoyenneté, l’industrie et la préparation stratégique au même règlement national."
 ve_je_era_crossroads_age_3_status:0 "Progrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nObjectif : atteindre 60 Progrès pour #P +50 Era Momentum#!. Les jalons à 20 et 40 Progrès offrent un coup de pouce financé par National Insight."
 ve_je_era_crossroads_age_3_route_1_status:0 "#Y République Sociale#!\nProgrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de politique de masse et l'objectif d'institutions sociales matures garantis au cours de cet âge.\n\nObjectif : atteindre 60 progrès pour #P +50 Era Momentum#!. Les jalons à 20 et 40 Progrès offrent un coup de pouce financé par National Insight."
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y Commandement stratégique#!\nProgrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de composition de force moderne et l'objectif d'atteinte des grandes puissances fixés au cours de cet âge.\n\nObjectif : atteindre 60 progrès pour #P +50 Era Momentum#!. Les jalons à 20 et 40 Progrès offrent un coup de pouce financé par National Insight."
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y Arsenal Society#!\nProgrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de l'industrie électrique et l'objectif d'armement de masse fixés au cours de cet âge.\n\nObjectif : atteindre 60 progrès pour #P +50 Era Momentum#!. Les jalons à 20 et 40 Progress offrent un coup de pouce financé par National Insight."

 ve_era_crossroads.1.t:0 "Steam et l'État"
 ve_era_crossroads.1.d:0 "Les chemins de fer, les écoles, les réformateurs et les administrateurs offrent des visions rivales de la nation moderne. Le gouvernement doit décider quelle relation entre la société et l'État organisera le premier âge."
 ve_era_crossroads.1.a:0 "Relier le pays à travers un réseau Steam."
 ve_era_crossroads.1.b:0 "Construire une citoyenneté instruite."
 ve_era_crossroads.1.c:0 "Consolider un État administratif."
 ve_era_crossroads.1.d.option:0 "Cet âge n'a pas besoin de carrefour national."
 ve_era_crossroads.1.a.tt:0 "Démarre la #Y route du réseau Steam#!  (Focus : Industrialisation, migration paysanne et chemins de fer).\n• Objectif : Atteignez 60 progrès pour gagner #P +50 Era Momentum#!.\n• Vitesse de progression : gagne +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancrage de l'âge 1 terminé (objectifs de part paysanne et de chemin de fer).\n• Synergie de doctrine : avoir #Y Industrialist IV#! or #Y Infrastructure IV#! débloque des décisions d'étape moins coûteuses (5 Insight au lieu de 10)."
 ve_era_crossroads.1.b.tt:0 "Démarre la #Y Citoyenneté éduquée#! itinéraire (Focus : Éducation, alphabétisation et travail gratuit).\n• Objectif : Atteindre 60 Progrès pour gagner #P +50 Era Momentum#!.\n• Vitesse de progression : gagne +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque point d'ancrage de l'âge 1 terminé (objectifs de travail gratuit et d'alphabétisation/écoles).\n• Synergie de doctrine : avoir #Y Académique IV#! ou #Y Reformist IV#! débloque des décisions d'étape moins coûteuses (5 Insight au lieu de 10)."
 ve_era_crossroads.1.c.tt:0 "Démarre l' #Y État administratif#! (Focus : Légitimité gouvernementale, bureaucratie et stabilité).\n• Objectif : Atteignez 60 progrès pour gagner #P +50 Era Momentum#!.\n• Vitesse de progression : gagne +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancrage de l'âge 1 complété (objectifs de légitimité/bureaucratie et de stabilité indépendante).\n• Synergie de doctrine : avoir #Y Bureaucratique IV#! pour #Y Parlementaire IV#! débloque des décisions d'étape moins chères (5 Insight au lieu de 10)."
 ve_era_crossroads.2.t:0 "Empire ou société de masse ?"
 ve_era_crossroads.2.d:0 "L’État ne peut plus traiter la portée internationale, le bien-être populaire et l’intégration nationale comme des questions distinctes. L’un d’eux définira la manière dont les autres seront poursuivis."
 ve_era_crossroads.2.a:0 "Regardez vers l’horizon impérial."
 ve_era_crossroads.2.b:0 "Construisez un système de protection sociale de masse."
 ve_era_crossroads.2.c:0 "Forgez une nation intégrée."
 ve_era_crossroads.2.d.option:0 "Laissez l’époque trouver sa propre direction."
 ve_era_crossroads.2.a.tt:0 "Démarre le #Y Horizon Impérial#! (Focus : Puissance diplomatique et portée à l'étranger).\n• Objectif : Atteignez 60 progrès pour gagner #P +50 Era Momentum#!.\n• Vitesse de progression : gagne +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancrage de l'âge 2 terminé (objectifs de capacité d'État reconnue et de ports/intérêts).\n• Synergie de doctrine : avoir #Y Diplomatic IV#! ou #Y Colonial IV#! débloque des décisions d'étape moins coûteuses (5 Insight au lieu de 10)."
 ve_era_crossroads.2.b.tt:0 "Démarre le #Y Bien-être de masse#! itinéraire (Focus : Institutions sociales, soins de santé et éducation).\n• Objectif : Atteindre 60 Progrès à réaliser #P +50 Era Momentum#!.\n• Vitesse de progression : gagne +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque point d'ancrage de l'âge 2 terminé (objectifs d'alphabétisation/écoles et institutions sociales).\n• Synergie de doctrine : avoir #Y le bien-être IV#! ou #Y Reformist IV#! débloque des décisions d'étape moins coûteuses (5 Insight au lieu de 10)."
 ve_era_crossroads.2.c.tt:0 "Démarre la #Y Nation Intégrée#! itinéraire (Focus : transformation économique et stabilité interne).\n• Objectif : atteindre 60 progrès pour gagner #P +50 d'élan d'ère#!.\n• Vitesse de progression : gagne +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancrage de l'âge 2 terminé (objectifs de transformation économique et de légitimité à faible turbulence).\n• Synergie de doctrine : avoir #Y nationaliste IV#! ou #Y Travail IV#! débloque des décisions d'étape moins chères (5 Insight au lieu de 10)."
 ve_era_crossroads.3.t:0 "La société mobilisée"
 ve_era_crossroads.3.d:0 "La politique de masse, le commandement stratégique et la mobilisation industrielle touchent désormais toutes les institutions. L’ère finale exige un choix quant à la forme de mobilisation qui définira la nation."
 ve_era_crossroads.3.a:0 "Engagez-vous en faveur d'une République sociale."
 ve_era_crossroads.3.b:0 "Placez la nation sous commandement stratégique."
 ve_era_crossroads.3.c:0 "Construisez une société d'arsenal."
 ve_era_crossroads.3.d.option:0 "Rejetez un projet de mobilisation permanent."
 ve_era_crossroads.3.a.tt:0 "Démarre la #Y route de la République sociale#!  (Focus : Politique de masse et institutions sociales).\n• Objectif : Atteindre 60 progrès pour gagner #P +50 Era Momentum#!.\n• Vitesse de progression : Gagne +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque réalisation terminée. Ancrage de l'âge 3 (objectifs de politique de masse et d'institutions sociales matures).\n• Synergie de doctrine : avoir #Y Parlementaire IV#! or #Y Bien-être IV#! débloque des décisions d'étape moins chères (5 Insight au lieu de 10)."
 ve_era_crossroads.3.b.tt:0 "Démarre le #Y Commandement Stratégique#! itinéraire (Focus : Modernisation militaire et portée mondiale de la puissance).\n• Objectif : Atteignez 60 progrès pour gagner #P +50 Era Momentum#!.\n• Vitesse de progression : gagne +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancre de l'âge 3 complétée (objectifs de composition de force moderne et d'atteinte de grande puissance).\n• Synergie de doctrine : avoir #Y Professional Army IV#! ou #Y Defensive IV#! débloque des décisions d'étape moins coûteuses (5 Insight au lieu de 10)."
 ve_era_crossroads.3.c.tt:0 "Démarre la #Y Arsenal Society#! route (Focus : Économie de guerre industrielle et armements de masse).\n• Objectif : Atteignez 60 de progrès pour gagner #P +50 Era Momentum#!.\n• Vitesse de progression : Gagne +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancrage de l'âge 3 terminé. (Objectifs de l'industrie électrique et des armements de masse).\n• Synergie de doctrine : avoir #Y Économie de guerre IV#! pour #Y Mass Conscription IV#! débloque des décisions d'étape moins coûteuses (5 Insight au lieu de 10)."

 ve_era_crossroads_decline_tt:0 "Diminue définitivement le carrefour de l'ère actuelle. Les âges ultérieurs restent éligibles."

 ve_era_crossroads.10.t:0 "Un calendrier national"
 ve_era_crossroads.10.d:0 "Les bureaux provinciaux, les associations privées et les ministères poursuivent la transformation choisie à des rythmes différents. Un calendrier commun pourrait transformer des réalisations éparses en un programme national, mais la coordination elle-même exige peu d'attention administrative."
 ve_era_crossroads.10.a:0 "Financer une commission centrale de coordination."
 ve_era_crossroads.10.b:0 "Laisser les institutions négocier leur propre calendrier."
 ve_era_crossroads.10.c:0 "Utilisez les réseaux construits par nos doctrines établies."
 ve_era_crossroads.10.a.tt:0 "Dépensez #N 10 National Insight#! pour obtenir #P +3 Progression à la croisée des chemins#!."
 ve_era_crossroads.10.b.tt:0 "Ne dépensez aucune ressource et n'apportez aucun changement immédiat à la progression de Crossroads."
 ve_era_crossroads.10.c.tt:0 "Nécessite un groupe d'idées de niveau IV adapté à l'itinéraire. Dépenser #N 5 Insight national#! pour gagner #P +3 progrès à Crossroads#!."

 ve_era_crossroads.11.t:0 "Qui dirigera le progrès ?"
 ve_era_crossroads.11.d:0 "Le programme est devenu trop conséquent pour rester un accord flou. Les ministres revendiquent l’autorité nationale, les experts exigent d’être isolés de la politique et les acteurs locaux préviennent qu’un commandement rigide brisera les institutions qui ont rendu possible le progrès."
 ve_era_crossroads.11.a:0 "Donnez au centre un mandat de coordination clair."
 ve_era_crossroads.11.b:0 "Préserver l’équilibre des pouvoirs négocié."
 ve_era_crossroads.11.c:0 "Confier la coordination à nos institutions doctrinales."
 ve_era_crossroads.11.a.tt:0 "Dépenser #N 10 National Insight#! pour obtenir #P +3 progrès dans Crossroads#!."
 ve_era_crossroads.11.b.tt:0 "Ne dépensez aucune ressource et n'apportez aucun changement immédiat à la progression de Crossroads."
 ve_era_crossroads.11.c.tt:0 "Nécessite un groupe d'idées de niveau IV adapté à l'itinéraire. Dépensez #N 5 Insights nationaux#! pour obtenir #P +3 progrès à la croisée des chemins#!."

 ve_era_crossroads.40.t:0 "Steam et l'État"
 ve_era_crossroads.40.d:0 "La voie choisie n'est plus une série de réalisations isolées. L’infrastructure, la citoyenneté ou l’administration forment désormais un programme national durable à travers lequel l’État peut comprendre et diriger les transformations de l’époque."
 ve_era_crossroads.40.a:0 "Le premier âge a trouvé sa forme institutionnelle."
 ve_era_crossroads.40.a.tt:0 "Le carrefour des époques achevé a accordé #P +50 Era Momentum#!. Il n’a pas atteint un objectif ni modifié l’éligibilité à l’âge d’or."

 ve_era_crossroads.20.t:0 "La portée de l’État"
 ve_era_crossroads.20.d:0 "Le programme choisi s’étend désormais au-delà des institutions qui l’ont initialement parrainé. Les ports, les écoles, les bureaux et les autorités locales ne sont pas d’accord sur la question de savoir où doit s’arrêter la coordination nationale et où doit commencer le pouvoir discrétionnaire local."
 ve_era_crossroads.20.a:0 "Cartographier les obligations de l'État par le biais d'une commission centrale."
 ve_era_crossroads.20.b:0 "Permettre aux frontières institutionnelles d’émerger par la négociation."
 ve_era_crossroads.20.c:0 "Coordonner à travers nos réseaux doctrinaux établis."
 ve_era_crossroads.20.a.tt:0 "Dépenser #N 10 Aperçu national#! gagner #P +3 Progression à la croisée des chemins#!."
 ve_era_crossroads.20.b.tt:0 "Ne dépensez aucune ressource et n'apportez aucun changement immédiat à la progression de Crossroads."
 ve_era_crossroads.20.c.tt:0 "Nécessite un groupe d'idées de niveau IV adapté à l'itinéraire. Dépenser #N 5 Insight national#! pour gagner #P +3 progrès à Crossroads#!."

 ve_era_crossroads.21.t:0 "Le prix de l'intégration"
 ve_era_crossroads.21.d:0 "La portée externe, les prestations sociales et la discipline nationale créent toutes des gagnants, des coûts et de nouvelles attentes. Le programme ne peut durer que si l’État décide comment ces charges seront réparties."
 ve_era_crossroads.21.a:0 "Créer un conseil national pour gérer l’ajustement."
 ve_era_crossroads.21.b:0 "Répartissez le fardeau grâce à des compromis négociés."
 ve_era_crossroads.21.c:0 "Laissons nos institutions doctrinales absorber la pression."
 ve_era_crossroads.21.a.tt:0 "Dépenser #N 10 National Insight#! pour obtenir #P +3 progrès dans Crossroads#!."
 ve_era_crossroads.21.b.tt:0 "Ne dépensez aucune ressource et n'apportez aucun changement immédiat à la progression de Crossroads."
 ve_era_crossroads.21.c.tt:0 "Nécessite un groupe d'idées de niveau IV adapté à l'itinéraire. Dépensez #N 5 Insights nationaux#! pour obtenir #P +3 progrès à la croisée des chemins#!."

 ve_era_crossroads.41.t:0 "Empire et société de masse"
 ve_era_crossroads.41.d:0 "Le règlement choisi relie désormais la portée externe de l'État, les obligations sociales et les institutions nationales. Ce qui a commencé comme une orientation stratégique est devenu un cadre durable pour gouverner la société de masse."
 ve_era_crossroads.41.a:0 "Le deuxième âge a trouvé son habitat."
 ve_era_crossroads.41.a.tt:0 "Le carrefour des ères achevé a accordé #P +50 Era Momentum#!. Il n’a pas atteint un objectif ni modifié l’éligibilité à l’âge d’or."

 ve_era_crossroads.30.t:0 "La nation est appelée au devoir"
 ve_era_crossroads.30.d:0 "Les citoyens, les commandants, les travailleurs et les administrateurs se voient tous confier de nouvelles obligations par le programme choisi. À moins que ces devoirs ne soient rendus lisibles les uns aux autres, la mobilisation restera un ensemble de revendications concurrentes."
 ve_era_crossroads.30.a:0 "Codifier les devoirs nationaux par le biais d'une commission centrale."
 ve_era_crossroads.30.b:0 "Laissons les institutions négocier leurs responsabilités."
 ve_era_crossroads.30.c:0 "Utilisez nos organisations doctrinales pour coordonner le devoir."
 ve_era_crossroads.30.a.tt:0 "Dépenser #N 10 Aperçu national#! gagner #P +3 Progression à la croisée des chemins#!."
 ve_era_crossroads.30.b.tt:0 "Ne dépensez aucune ressource et n'apportez aucun changement immédiat à la progression de Crossroads."
 ve_era_crossroads.30.c.tt:0 "Nécessite un groupe d'idées de niveau IV adapté à l'itinéraire. Dépenser #N 5 Insight national#! pour gagner #P +3 progrès à la croisée des chemins#!."

 ve_era_crossroads.31.t:0 "Une urgence permanente"
 ve_era_crossroads.31.d:0 "Les mécanismes construits pour la participation de masse, la préparation stratégique ou la mobilisation industrielle deviennent permanents. L’État doit décider comment préserver ses capacités sans permettre à une discipline d’urgence de consumer la vie nationale ordinaire."
 ve_era_crossroads.31.a:0 "Définir des limites permanentes par le biais d’un examen national."
 ve_era_crossroads.31.b:0 "Gardez le règlement volontairement flexible."
 ve_era_crossroads.31.c:0 "S'appuyer sur les institutions doctrinales pour contenir la machinerie."
 ve_era_crossroads.31.a.tt:0 "Dépenser #N 10 National Insight#! pour obtenir #P +3 progrès dans Crossroads#!."
 ve_era_crossroads.31.b.tt:0 "Ne dépensez aucune ressource et n'apportez aucun changement immédiat à la progression de Crossroads."
 ve_era_crossroads.31.c.tt:0 "Nécessite un groupe d'idées de niveau IV adapté à l'itinéraire. Dépensez #N 5 Insights nationaux#! pour obtenir #P +3 progrès à la croisée des chemins#!."

 ve_era_crossroads.42.t:0 "La société mobilisée"
 ve_era_crossroads.42.d:0 "La citoyenneté, le commandement et la capacité industrielle forment désormais un règlement national durable. Les institutions de mobilisation ont été intégrées au gouvernement ordinaire plutôt que de rester comme des réponses improvisées à chaque nouvelle crise."
 ve_era_crossroads.42.a:0 "L'ère finale a trouvé sa forme nationale."
 ve_era_crossroads.42.a.tt:0 "L’Era Crossroads achevé a accordé #P +50 Era Momentum#!. Il n’a pas atteint un objectif ni modifié l’éligibilité à l’âge d’or."
