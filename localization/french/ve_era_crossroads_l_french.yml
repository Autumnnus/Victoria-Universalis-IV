 ve_je_era_crossroads_age_2_route_1_status:0 "#Y Horizon impérial#!\nProgression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgression mensuelle : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncrages : l'objectif de Capacité d'État reconnu et l'objectif de Ports ou d'Intérêts sécurisés au cours de cette Ère.\n\nObjectif : atteindre 60 de Progression pour obtenir #P +50 d’Élan de l’époque#!. Les jalons à 20 et 40 de Progression offrent un renfort financé par la Perspicacité nationale."
