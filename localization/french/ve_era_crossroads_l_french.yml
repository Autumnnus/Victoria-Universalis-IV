 ve_je_era_crossroads_age_1:0 "Steam et l'État"
 ve_je_era_crossroads_age_1_reason:0 "L’industrie et les nations ont ouvert plusieurs voies vers un État moderne. Le cours choisi doit devenir plus qu'un ensemble de réalisations isolées."
 ve_je_era_crossroads_age_1_status:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nObjectif : atteindre 60 progrès pour #P +50 Era Momentum#!. Les jalons à 20 et 40 Progress offrent un coup de pouce financé par National Insight."
 ve_je_era_crossroads_age_1_route_1_status:0 "#Y Steam Network#!\nProgrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de partage paysan et l'objectif ferroviaire sécurisés au cours de cet âge.\n\nObjectif : atteindre 60 progrès pour #P +50 Era Momentum#!. Les jalons à 20 et 40 Progrès offrent un coup de pouce financé par National Insight."
 ve_je_era_crossroads_age_1_route_2_status:0 "#Y Citoyenneté éduquée#!\nProgrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de travail libre et l'objectif d'alphabétisation ou d'écoles garantis au cours de cet âge.\n\nObjectif : atteindre 60 progrès pour #P +50 Era Momentum#!. Les jalons à 20 et 40 Progress offrent un coup de pouce financé par National Insight."
 ve_je_era_crossroads_age_1_route_3_status:0 "#Y État administratif#!\nProgrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgrès mensuel : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de légitimité et de bureaucratie et l'objectif de stabilité indépendante assurés au cours de cette ère.\n\nObjectif : atteindre 60 progrès pour #P +50 Era Momentum#!. Les jalons à 20 et 40 Progress offrent un coup de pouce financé par National Insight."
 ve_je_era_crossroads_age_2:0 "Empire ou société de masse ?"
 ve_je_era_crossroads_age_2_reason:0 "L’Empire et la société de masse obligent l’État à choisir comment la portée extérieure, le bien-être et l’intégration nationale se définiront mutuellement."
