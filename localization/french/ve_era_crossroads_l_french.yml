 ve_je_era_crossroads_age_3:0 "La société mobilisée"
 ve_je_era_crossroads_age_3_reason:0 "Politique de masse et Guerre totale fait de la citoyenneté, de l'Industrie et de la Mobilisation stratégique des éléments d'un même compromis national."
 ve_je_era_crossroads_age_3_status:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgression mensuelle : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nObjectif : atteindre 60 de Progression pour obtenir #P +50 d’Élan de l’époque#!. Les jalons à 20 et 40 de Progression offrent un renfort financé par la Perspicacité nationale."
 ve_je_era_crossroads_age_3_route_1_status:0 "#Y République sociale#!\nProgression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgression mensuelle : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de politique de masse et l'objectif d'institutions sociales matures sécurisés au cours de cette Ère.\n\nObjectif : atteindre 60 de Progression pour obtenir #P +50 d'Élan de l’époque#!. Les jalons à 20 et 40 de Progression offrent un renfort financé par la Perspicacité nationale."
 ve_je_era_crossroads_age_3_route_2_status:0 "#Y Commandement stratégique#!\nProgression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgression mensuelle : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de composition de force moderne et l'objectif de portée de grande puissance sécurisés au cours de cette Ère.\n\nObjectif : atteindre 60 de Progression pour obtenir #P +50 d'Élan de l’époque#!. Les jalons à 20 et 40 de Progression offrent un renfort financé par la Perspicacité nationale."
 ve_je_era_crossroads_age_3_route_3_status:0 "#Y Société d'arsenal#!\nProgression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgression mensuelle : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncres : l'objectif de l'industrie électrique et l'objectif d'armements de masse sécurisés au cours de cette Ère.\n\nObjectif : atteindre 60 de Progression pour obtenir #P +50 d'Élan de l’époque#!. Les jalons à 20 et 40 de Progression offrent un renfort financé par la Perspicacité nationale."

 ve_era_crossroads.1.t:0 "La vapeur et l’État"
 ve_era_crossroads.1.d:0 "Voies ferrées, écoles, réformateurs et administrateurs proposent des visions rivales de la nation moderne. Le gouvernement doit décider quelle relation entre la société et l'État organisera la première ère."
 ve_era_crossroads.1.a:0 "Unifier le pays par un réseau de vapeur."
 ve_era_crossroads.1.b:0 "Bâtir une citoyenneté éduquée."
 ve_era_crossroads.1.c:0 "Consolider un État administratif."
 ve_era_crossroads.1.d.option:0 "Cette ère n'a pas besoin de carrefour national."
 ve_era_crossroads.1.a.tt:0 "Lance la voie du #Y Réseau de vapeur#! (Foyer : Industrialisation, migration paysanne et voies ferrées).\n• Objectif : Atteindre 60 de Progression pour gagner #P +50 d'Élan de l’époque#!.\n• Vitesse de progression : Confère +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancre de l'Ère 1 achevée (objectifs de part paysanne et de voies ferrées).\n• Synergie de doctrine : Posséder #Y Doctrine industrielle IV#! ou #Y Doctrine des infrastructures IV#! débloque des décisions de jalon moins coûteuses (5 de Perspicacité au lieu de 10)."
 ve_era_crossroads.1.b.tt:0 "Lance la voie de la #Y Citoyenneté éduquée#! (Foyer : Éducation, degré d’alphabétisation et travail libre).\n• Objectif : Atteindre 60 de Progression pour gagner #P +50 d'Élan de l’époque#!.\n• Vitesse de progression : Confère +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancre de l'Ère 1 achevée (objectifs de travail libre et de degré d’alphabétisation/écoles).\n• Synergie de doctrine : Posséder #Y Doctrine académique IV#! ou #Y Doctrine réformiste IV#! débloque des décisions de jalon moins coûteuses (5 de Perspicacité au lieu de 10)."
 ve_era_crossroads.1.c.tt:0 "Lance la voie de l'#Y État administratif#! (Foyer : Légitimité du gouvernement, bureaucratie et stabilité).\n• Objectif : Atteindre 60 de Progression pour gagner #P +50 d'Élan de l’époque#!.\n• Vitesse de progression : Confère +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancre de l'Ère 1 achevée (objectifs de légitimité/bureaucratie et de stabilité indépendante).\n• Synergie de doctrine : Posséder #Y Doctrine bureaucratique IV#! ou #Y Doctrine parlementaire IV#! débloque des décisions de jalon moins coûteuses (5 de Perspicacité au lieu de 10)."
 ve_era_crossroads.2.t:0 "Empire ou société de masse ?"
 ve_era_crossroads.2.d:0 "L'État ne peut plus traiter la portée outre-mer, le bien-être populaire et l'intégration nationale comme des questions distinctes. L'une d'elles définira la manière dont les autres seront poursuivies."
 ve_era_crossroads.2.a:0 "Tourner les yeux vers l'horizon impérial."
 ve_era_crossroads.2.b:0 "Construire un système de bien-être de masse."
 ve_era_crossroads.2.c:0 "Forger une nation intégrée."
 ve_era_crossroads.2.d.option:0 "Laisser l'ère trouver sa propre direction."
 ve_era_crossroads.2.a.tt:0 "Lance la voie de l'#Y Horizon impérial#! (Foyer : Puissance diplomatique et portée outre-mer).\n• Objectif : Atteindre 60 de Progression pour gagner #P +50 d'Élan de l’époque#!.\n• Vitesse de progression : Confère +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancre de l'Ère 2 achevée (objectifs de capacité d'État reconnue et de ports/intérêts).\n• Synergie de doctrine : Posséder #Y Doctrine diplomatique IV#! ou #Y Doctrine coloniale IV#! débloque des décisions de jalon moins coûteuses (5 de Perspicacité au lieu de 10)."
 ve_era_crossroads.2.b.tt:0 "Lance la voie du #Y Bien-être de masse#! (Foyer : Institutions sociales, soins de santé et éducation).\n• Objectif : Atteindre 60 de Progression pour gagner #P +50 d'Élan de l’époque#!.\n• Vitesse de progression : Confère +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancre de l'Ère 2 achevée (objectifs de degré d’alphabétisation/écoles et d'institutions sociales).\n• Synergie de doctrine : Posséder #Y Doctrine de bien-être IV#! ou #Y Doctrine réformiste IV#! débloque des décisions de jalon moins coûteuses (5 de Perspicacité au lieu de 10)."
 ve_era_crossroads.2.c.tt:0 "Lance la voie de la #Y Nation intégrée#! (Foyer : Transformation économique et stabilité interne).\n• Objectif : Atteindre 60 de Progression pour gagner #P +50 d'Élan de l’époque#!.\n• Vitesse de progression : Confère +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque ancre de l'Ère 2 achevée (objectifs de transformation économique et de légitimité à faible degré d’agitation).\n• Synergie de doctrine : Posséder #Y Doctrine nationaliste IV#! ou #Y Doctrine du travail IV#! débloque des décisions de jalon moins coûteuses (5 de Perspicacité au lieu de 10)."
 ve_era_crossroads.3.t:0 "La société mobilisée"
 ve_era_crossroads.3.d:0 "La politique de masse, le commandement stratégique et la mobilisation industrielle s'étendent désormais à toutes les institutions. Le dernier âge exige de choisir quelle forme de mobilisation définira la nation."
 ve_era_crossroads.3.a:0 "S'engager en faveur d'une république sociale."
 ve_era_crossroads.3.b:0 "Placer la nation sous un commandement stratégique."
 ve_era_crossroads.3.c:0 "Bâtir une société d'arsenal."
 ve_era_crossroads.3.d.option:0 "Rejeter tout projet de mobilisation permanente."
 ve_era_crossroads.3.a.tt:0 "Lance la voie #Y République sociale#! (Concentration : Politique de masse et Institutions sociales).\n• Objectif : Atteindre 60 de Progression pour gagner #P +50 d'Élan de l’époque#!.\n• Vitesse de progression : Octroie +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque point d'ancrage de l'Âge 3 achevé (objectifs Politique de masse et Institutions sociales matures).\n• Synergie de doctrine : Posséder #Y Parlementaire IV#! ou #Y Bien-être IV#! débloque des décisions de jalon moins coûteuses (5 de Perspicacité nationale au lieu de 10)."
 ve_era_crossroads.3.b.tt:0 "Lance la voie #Y Commandement stratégique#! (Concentration : Modernisation militaire et Portée de grande puissance).\n• Objectif : Atteindre 60 de Progression pour gagner #P +50 d'Élan de l’époque#!.\n• Vitesse de progression : Octroie +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque point d'ancrage de l'Âge 3 achevé (objectifs Composition des forces modernes et Portée de grande puissance).\n• Synergie de doctrine : Posséder #Y Armée professionnelle IV#! ou #Y Défensive IV#! débloque des décisions de jalon moins coûteuses (5 de Perspicacité nationale au lieu de 10)."
 ve_era_crossroads.3.c.tt:0 "Lance la voie #Y Société d'arsenal#! (Concentration : Économie de guerre industrielle et Armements de masse).\n• Objectif : Atteindre 60 de Progression pour gagner #P +50 d'Élan de l’époque#!.\n• Vitesse de progression : Octroie +1 de progression mensuelle de base, plus +1 supplémentaire pour chaque point d'ancrage de l'Âge 3 achevé (objectifs Industrie électrique et Armements de masse).\n• Synergie de doctrine : Posséder #Y Économie de guerre IV#! ou #Y Conscription de masse IV#! débloque des décisions de jalon moins coûteuses (5 de Perspicacité nationale au lieu de 10)."

 ve_era_crossroads_decline_tt:0 "Refuse définitivement le Carrefour d’ère de l'âge actuel. Les âges ultérieurs restent éligibles."

 ve_era_crossroads.10.t:0 "Un calendrier national"
 ve_era_crossroads.10.d:0 "Les bureaux provinciaux, les associations privées et les ministères poursuivent la transformation choisie à des vitesses différentes. Un calendrier commun pourrait transformer des réalisations éparses en un programme national, mais la coordination en soi exige une attention administrative précieuse."
 ve_era_crossroads.10.a:0 "Financer une commission de coordination centrale."
 ve_era_crossroads.10.b:0 "Laisser les institutions négocier leur propre calendrier."
 ve_era_crossroads.10.c:0 "Utiliser les réseaux bâtis par nos doctrines établies."
 ve_era_crossroads.10.a.tt:0 "Dépenser #N 10 de Perspicacité nationale#! pour gagner #P +3 de progression de carrefour#!."
 ve_era_crossroads.10.b.tt:0 "Ne dépenser aucune ressource et n'apporter aucun changement immédiat à la progression du carrefour."
 ve_era_crossroads.10.c.tt:0 "Requiert un Groupe de doctrines de niveau IV correspondant à la voie. Dépenser #N 5 de Perspicacité nationale#! pour gagner #P +3 de progression de carrefour#!."

 ve_era_crossroads.11.t:0 "Qui dirigera la progression ?"
 ve_era_crossroads.11.d:0 "Le programme est devenu trop important pour rester un accord tacite. Les ministres revendiquent l'autorité nationale, les experts exigent d'être isolés de la politique, et les acteurs locaux préviennent qu'un commandement rigide brisera les institutions qui ont rendu la progression possible."
 ve_era_crossroads.11.a:0 "Donner au centre un mandat de coordination clair."
 ve_era_crossroads.11.b:0 "Préserver le solde d'autorité négocié."
 ve_era_crossroads.11.c:0 "Confier la coordination à nos institutions doctrinales."
 ve_era_crossroads.11.a.tt:0 "Dépenser #N 10 de Perspicacité nationale#! pour gagner #P +3 de progression de carrefour#!."
 ve_era_crossroads.11.b.tt:0 "Ne dépenser aucune ressource et n'apporter aucun changement immédiat à la progression du carrefour."
 ve_era_crossroads.11.c.tt:0 "Requiert un Groupe de doctrines de niveau IV correspondant à la voie. Dépenser #N 5 de Perspicacité nationale#! pour gagner #P +3 de progression de carrefour#!."

 ve_era_crossroads.40.t:0 "La vapeur et l’État"
 ve_era_crossroads.40.d:0 "La voie choisie n'est plus une série de réalisations isolées. L'infrastructure, la citoyenneté ou l'administration constituent désormais un programme national durable à travers lequel l'État peut comprendre et diriger les transformations de l'âge."
 ve_era_crossroads.40.a:0 "Le premier âge a trouvé sa forme institutionnelle."
 ve_era_crossroads.40.a.tt:0 "Le Carrefour d’ère achevé a accordé #P +50 d'Élan de l’époque#!. Il n'a pas achevé d'objectif ni modifié l'éligibilité à l'Âge d’or."

 ve_era_crossroads.20.t:0 "La portée de l'État"
 ve_era_crossroads.20.d:0 "Le programme choisi s'étend désormais au-delà des institutions qui l'ont parrainé à l'origine. Ports, écoles, bureaux et autorités locales sont en désaccord sur le point où la coordination nationale doit s'arrêter et où la liberté d'action locale doit commencer."
 ve_era_crossroads.20.a:0 "Cartographier les obligations de l'État par l'intermédiaire d'une commission centrale."
 ve_era_crossroads.20.b:0 "Permettre aux frontières institutionnelles d'émerger par la négociation."
 ve_era_crossroads.20.c:0 "Coordonner à travers nos réseaux doctrinales établis."
 ve_era_crossroads.20.a.tt:0 "Dépenser #N 10 de Perspicacité nationale#! pour gagner #P +3 de progression de carrefour#!."
 ve_era_crossroads.20.b.tt:0 "Ne dépenser aucune ressource et n'apporter aucun changement immédiat à la progression du carrefour."
 ve_era_crossroads.20.c.tt:0 "Requiert un Groupe de doctrines de niveau IV correspondant à la voie. Dépenser #N 5 de Perspicacité nationale#! pour gagner #P +3 de progression de carrefour#!."

 ve_era_crossroads.21.t:0 "Le Prix de l'Intégration"
 ve_era_crossroads.21.d:0 "L'expansion extérieure, la prévoyance sociale et la discipline nationale produisent toutes des gagnants, des coûts et des attentes nouvelles. Le programme ne pourra perdurer que si l'État décide de la répartition de ces charges."
 ve_era_crossroads.21.a:0 "Créer un office national pour gérer l'ajustement."
 ve_era_crossroads.21.b:0 "Répartir la charge par des compromis négociés."
 ve_era_crossroads.21.c:0 "Laisser nos institutions doctrinales absorber la tension."
 ve_era_crossroads.21.a.tt:0 "Dépenser #N 10 Perspicacité nationale#! pour obtenir #P +3 progression du carrefour d'ère#!."
 ve_era_crossroads.21.b.tt:0 "Ne dépenser aucune ressource et n'apporter aucun changement immédiat à la progression du carrefour d'ère."
 ve_era_crossroads.21.c.tt:0 "Requiert un groupe de doctrines de niveau IV adapté à la voie. Dépenser #N 5 Perspicacité nationale#! pour obtenir #P +3 progression du carrefour d'ère#!."

 ve_era_crossroads.41.t:0 "Empire et société de masse"
 ve_era_crossroads.41.d:0 "L'accord retenu relie désormais l'expansion extérieure de l'État, ses obligations sociales et ses institutions nationales. Ce qui n'était au départ qu'une orientation stratégique est devenu un cadre pérenne pour gouverner la société de masse."
 ve_era_crossroads.41.a:0 "Le second âge a trouvé son accord."
 ve_era_crossroads.41.a.tt:0 "Le carrefour d'ère achevé a octroyé #P +50 Élan de l’époque#!. Cela n'a ni accompli d'objectif ni modifié l'éligibilité à l'Âge d’or."

 ve_era_crossroads.30.t:0 "La Nation est appelée au devoir"
 ve_era_crossroads.30.d:0 "Citoyens, commandants, travailleurs et administrateurs se voient tous assigner de nouvelles obligations par le programme choisi. À moins de rendre ces devoirs intelligibles entre eux, la mobilisation ne sera qu'une accumulation d'exigences concurrentes."
 ve_era_crossroads.30.a:0 "Codifier les devoirs nationaux par le biais d'une commission centrale."
 ve_era_crossroads.30.b:0 "Laisser les institutions négocier leurs responsabilités."
 ve_era_crossroads.30.c:0 "Utiliser nos organisations doctrinales pour coordonner le devoir."
 ve_era_crossroads.30.a.tt:0 "Dépenser #N 10 Perspicacité nationale#! pour obtenir #P +3 progression du carrefour d'ère#!."
 ve_era_crossroads.30.b.tt:0 "Ne dépenser aucune ressource et n'apporter aucun changement immédiat à la progression du carrefour d'ère."
 ve_era_crossroads.30.c.tt:0 "Requiert un groupe de doctrines de niveau IV adapté à la voie. Dépenser #N 5 Perspicacité nationale#! pour obtenir #P +3 progression du carrefour d'ère#!."

 ve_era_crossroads.31.t:0 "Une urgence permanente"
 ve_era_crossroads.31.d:0 "L'appareil bâti pour la participation de masse, la préparation stratégique ou la mobilisation industrielle se pérennise. L'État doit décider comment préserver sa Capacité sans laisser la discipline d'urgence consumer la vie nationale ordinaire."
 ve_era_crossroads.31.a:0 "Définir des limites permanentes par le biais d'une révision nationale."
 ve_era_crossroads.31.b:0 "Maintenir l'accord volontairement flexible."
 ve_era_crossroads.31.c:0 "Compter sur les institutions doctrinales pour contenir l'appareil."
 ve_era_crossroads.31.a.tt:0 "Dépenser #N 10 Perspicacité nationale#! pour obtenir #P +3 progression du carrefour d'ère#!."
 ve_era_crossroads.31.b.tt:0 "Ne dépenser aucune ressource et n'apporter aucun changement immédiat à la progression du carrefour d'ère."
 ve_era_crossroads.31.c.tt:0 "Requiert un groupe de doctrines de niveau IV adapté à la voie. Dépenser #N 5 Perspicacité nationale#! pour obtenir #P +3 progression du carrefour d'ère#!."

 ve_era_crossroads.42.t:0 "La société mobilisée"
 ve_era_crossroads.42.d:0 "La citoyenneté, le commandement et la Capacité industrielle forment désormais un accord national pérenne. Les institutions de la mobilisation ont été intégrées au Gouvernement ordinaire plutôt que laissées à l'état de réponses improvisées face à chaque nouvelle crise."
 ve_era_crossroads.42.a:0 "Le dernier âge a trouvé sa forme nationale."
 ve_era_crossroads.42.a.tt:0 "Le carrefour d'ère achevé a octroyé #P +50 Élan de l’époque#!. Cela n'a ni accompli d'objectif ni modifié l'éligibilité à l'Âge d’or."
