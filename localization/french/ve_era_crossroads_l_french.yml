 ve_je_era_crossroads_age_1:0 "La vapeur et l’État"
 ve_je_era_crossroads_age_1_reason:0 "Industrie et Nations a ouvert plusieurs voies vers l'étatisme moderne. Le cap choisi doit devenir bien plus qu'une simple collection de réalisations isolées."
 ve_je_era_crossroads_age_1_status:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgression mensuelle : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nObjectif : atteindre 60 de Progression pour obtenir #P +50 d’Élan de l’époque#!. Les jalons à 20 et 40 de Progression offrent un renfort financé par la Perspicacité nationale."
 ve_je_era_crossroads_age_1_route_1_status:0 "#Y Réseau de voies ferrées#!\nProgression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgression mensuelle : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncrages : l'objectif de part paysanne et l'objectif de Voie ferrée sécurisés au cours de cette Ère.\n\nObjectif : atteindre 60 de Progression pour obtenir #P +50 d’Élan de l’époque#!. Les jalons à 20 et 40 de Progression offrent un renfort financé par la Perspicacité nationale."
 ve_je_era_crossroads_age_1_route_2_status:0 "#Y Citoyenneté instruite#!\nProgression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgression mensuelle : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncrages : l'objectif de travail libre et l'objectif de Degré d’alphabétisation ou d'Écoles sécurisés au cours de cette Ère.\n\nObjectif : atteindre 60 de Progression pour obtenir #P +50 d’Élan de l’époque#!. Les jalons à 20 et 40 de Progression offrent un renfort financé par la Perspicacité nationale."
 ve_je_era_crossroads_age_1_route_3_status:0 "#Y État administratif#!\nProgression : #Y [ROOT.GetCountry.MakeScope.Var('ve_era_crossroads_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_remaining_months')|0] mois#!\nProgression mensuelle : #P [ROOT.GetCountry.MakeScope.ScriptValue('ve_era_crossroads_monthly_progress')|0]#!\n\nAncrages : l'objectif de Légitimité et de Bureaucratie et l'objectif de stabilité indépendante sécurisés au cours de cette Ère.\n\nObjectif : atteindre 60 de Progression pour obtenir #P +50 d’Élan de l’époque#!. Les jalons à 20 et 40 de Progression offrent un renfort financé par la Perspicacité nationale."
 ve_je_era_crossroads_age_2:0 "Empire ou société de masse ?"
 ve_je_era_crossroads_age_2_reason:0 "Empire et société de masse contraint l'État à choisir comment la portée extérieure, le Bien-être et l'Intégration nationale se définiront mutuellement."
