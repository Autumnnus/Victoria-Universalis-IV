l_french:
 ve_je_religious_settlement_transition:0 "Transition d'arrangement religieux"
 ve_je_religious_settlement_transition_reason:0 "L'arrangement juridique entre l'Église et l'État a changé. Les Institutions, les communautés et les fonctionnaires doivent s'adapter tant que la crise de transition demeure en vigueur. Le modificateur de crise — et non le calendrier de cette Entrée du journal — fait foi."
 ve_je_religious_settlement_transition_complete_tt:0 "La crise de transition de l'arrangement religieux a pris fin."
 ve_je_religious_settlement_transition_status_confessional:0 "Arrangement cible : #Y État confessionnel#!\nArrangement religieux : #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTemps restant approximatif : #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] mois#!\nJalons achevés : #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nIssue à la fin de la crise : #Y 60+#! l'arrangement se stabilise rapidement, #Y 26-59#! se résout de manière neutre, #Y 25 ou moins#! dégénère en crise. Chaque jalon restant offre un choix influençant l'Arrangement religieux."
 ve_je_religious_settlement_transition_status_freedom:0 "Arrangement cible : #Y Liberté de conscience#!\nArrangement religieux : #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTemps restant approximatif : #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] mois#!\nJalons achevés : #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nIssue à la fin de la crise : #Y 60+#! l'arrangement se stabilise rapidement, #Y 26-59#! se résout de manière neutre, #Y 25 ou moins#! dégénère en crise. Chaque jalon restant offre un choix influençant l'Arrangement religieux."
 ve_je_religious_settlement_transition_status_separation:0 "Arrangement cible : #Y Total Separation#!\nArrangement religieux : #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTemps restant approximatif : #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] mois#!\nJalons achevés : #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nIssue à la fin de la crise : #Y 60+#! l'arrangement se stabilise rapidement, #Y 26-59#! se résout de manière neutre, #Y 25 ou moins#! dégénère en crise. Chaque jalon restant offre un choix influençant l'Arrangement religieux."
 ve_je_religious_settlement_transition_status_atheism:0 "Arrangement cible : #Y État athée#!\nArrangement religieux : #Y [ROOT.GetCountry.MakeScope.Var('piety_bar_point').GetValue|0]#!/100\nTemps restant approximatif : #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_remaining_months').GetValue|0] mois#!\nJalons achevés : #Y [ROOT.GetCountry.MakeScope.Var('ve_rel_transition_milestones_completed').GetValue|0]#!/2\n\nIssue à la fin de la crise : #Y 60+#! l'arrangement se stabilise rapidement, #Y 26-59#! se résout de manière neutre, #Y 25 ou moins#! dégénère en crise. Chaque jalon restant offre un choix influençant l'Arrangement religieux."

 ve_je_national_compact_transition:0 "Transition du pacte national"
 ve_je_national_compact_transition_reason:0 "L'État a adopté une nouvelle définition de l'appartenance nationale. Les administrateurs, les élites et les communautés doivent négocier le pacte tant que le retour de bâton de la transition demeure en vigueur. Le modificateur de retour de bâton — et non le calendrier de cette Entrée du journal — fait foi."
 ve_je_national_compact_transition_complete_tt:0 "Le retour de bâton de la transition du pacte national a pris fin."
 ve_je_national_compact_transition_status_ethnic:0 "Identité cible : #Y Identité ethnique#!\nCohésion nationale : #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTemps restant approximatif : #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] mois#!\nJalons achevés : #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nIssue à la fin du retour de bâton : #Y 60+#! la cohésion se stabilise rapidement, #Y 26-59#! se résout de manière neutre, #Y 25 ou moins#! dégénère en crise. Chaque jalon restant offre un choix influençant la Cohésion nationale."
 ve_je_national_compact_transition_status_civic:0 "Identité cible : #Y Identité civique#!\nCohésion nationale : #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTemps restant approximatif : #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] mois#!\nJalons achevés : #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nIssue à la fin du retour de bâton : #Y 60+#! la cohésion se stabilise rapidement, #Y 26-59#! se résout de manière neutre, #Y 25 ou moins#! dégénère en crise. Chaque jalon restant offre un choix influençant la Cohésion nationale."
 ve_je_national_compact_transition_status_composite:0 "Identité cible : #Y Identité composite#!\nCohésion nationale : #Y [ROOT.GetCountry.MakeScope.Var('ve_national_cohesion').GetValue|0]#!/100\nTemps restant approximatif : #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_remaining_months').GetValue|0] mois#!\nJalons achevés : #Y [ROOT.GetCountry.MakeScope.Var('ve_identity_transition_milestones_completed').GetValue|0]#!/2\n\nIssue à la fin du retour de bâton : #Y 60+#! la cohésion se stabilise rapidement, #Y 26-59#! se résout de manière neutre, #Y 25 ou moins#! dégénère en crise. Chaque jalon restant offre un choix influençant la Cohésion nationale."
 ve_je_transition_resolving_status:0 "Le registre de transition est en cours de réconciliation avec l'arrangement national actuel."

 ve_rel_transition_conciliatory_tt:0 "Dépenser #N 10#! fonds de réforme pieuse et gagner #P 3#! arrangement religieux."
 ve_rel_transition_central_tt:0 "Gagner #P 5#! fonds de réforme pieuse et perdre #N 3#! arrangement religieux."
 ve_rel_transition_doctrine_tt:0 "Dépenser #N 5#! fonds de réforme pieuse et gagner #P 2#! arrangement religieux."

 ve_rel_evt.210.t:0 "Les limites de la nomination cléricale"
 ve_rel_evt.210.d:0 "Les autorités religieuses ont soumis des listes de candidats aux charges publiques, tandis que les hauts fonctionnaires insistent pour que le service de l'État continue de récompenser la compétence. Les premières nominations sous le nouveau régime définiront où s'arrête le conseil clérical et où commence l'Autorité civile."
 ve_rel_evt.210.a:0 "Convoquer une commission de nomination mixte."
 ve_rel_evt.210.b:0 "Accepter les listes cléricales."
 ve_rel_evt.210.c:0 "Associer des examens standardisés au conseil religieux."

 ve_rel_evt.211.t:0 "Écoles et serments de Loyauté"
 ve_rel_evt.211.d:0 "Les écoles paroissiales recherchent une place reconnue dans le système public. Leurs mécènes exigent la protection de l'instruction religieuse, tandis que les fonctionnaires craignent que la concurrence des programmes et des serments ne divise la prochaine génération."
 ve_rel_evt.211.a:0 "Garantir un tronc commun partagé."
 ve_rel_evt.211.b:0 "Imposer un serment de Loyauté uniforme."
 ve_rel_evt.211.c:0 "Placer le compromis sous l'inspection Bureaucratique."

 ve_rel_evt.220.t:0 "Le libellé des garanties pour les minorités"
 ve_rel_evt.220.d:0 "Les communautés minoritaires souhaitent que leurs protections soient explicitement inscrites dans le nouveau règlement. Les juristes du Gouvernement privilégient quant à eux une clause générale unique, craignant que des promesses spécifiques à certaines communautés n'accentuent d'anciennes divisions."
 ve_rel_evt.220.a:0 "Rédiger les garanties clairement."
 ve_rel_evt.220.b:0 "Utiliser une clause de citoyenneté uniforme."
 ve_rel_evt.220.c:0 "Laisser la coalition réformatrice négocier la formulation."

 ve_rel_evt.221.t:0 "La représentation dans les Institutions communes"
 ve_rel_evt.221.d:0 "Les écoles, les hôpitaux et les conseils locaux doivent désormais servir les citoyens de différentes confessions sur un pied d'égalité. Il s'agit de déterminer si la représentation doit refléter les réalités locales ou obéir à une formule imposée par le centre."
 ve_rel_evt.221.a:0 "Équilibrer la représentation au niveau local."
 ve_rel_evt.221.b:0 "Fixer un quota central."
 ve_rel_evt.221.c:0 "Négocier une formule de représentation Diplomatique."

 ve_rel_evt.230.t:0 "Le registre Neutre"
 ve_rel_evt.230.d:0 "Les naissances, les mariages et les Revendications de propriété passent des mains des autorités religieuses à celles des officiers d'état civil. Les fonctionnaires peuvent conserver des doubles des registres pendant la période de transition, mais les réformateurs exigent une rupture nette et immédiate."
 ve_rel_evt.230.a:0 "Maintenir des registres doubles pendant une période de transition."
 ve_rel_evt.230.b:0 "Clore les registres religieux immédiatement."
 ve_rel_evt.230.c:0 "Déployer un réseau de la fonction publique formé à cet effet."

 ve_rel_evt.231.t:0 "Écoles et cérémonies publiques"
 ve_rel_evt.231.d:0 "Le Principe de la Neutralité de l'État a atteint les assemblées scolaires et les cérémonies publiques. Les communautés locales souhaitent préserver leurs coutumes ancestrales ; les fonctionnaires centraux exigent un protocole laïc unique ne laissant place à aucune ambiguïté."
 ve_rel_evt.231.a:0 "Laisser de la place aux cérémonies locales."
 ve_rel_evt.231.b:0 "Instaurer un protocole laïc obligatoire."
 ve_rel_evt.231.c:0 "Créer une norme cérémonielle civique partagée."

 ve_rel_evt.240.t:0 "Une Pénurie de cadres laïcs"
 ve_rel_evt.240.d:0 "La nouvelle administration a besoin d'enseignants, d'archivistes et d'inspecteurs capables de travailler sans le concours des institutions religieuses. Les candidats formés sont trop peu nombreux, et contraindre le personnel en place à modifier ses pratiques risque de provoquer des résistances."
 ve_rel_evt.240.a:0 "Financer un nouveau programme de formation des cadres."
 ve_rel_evt.240.b:0 "Contraindre le personnel existant à s'adapter."
 ve_rel_evt.240.c:0 "Mettre en place un réseau de formation Académique."

 ve_rel_evt.241.t:0 "Propriété et culte clandestin"
 ve_rel_evt.241.d:0 "Le transfert des biens religieux a poussé certaines congrégations dans la clandestinité. Une confiscation immédiate doterait rapidement le nouvel État, mais un accord pris dans la précipitation risque de transformer le culte privé en défi Organisé."
 ve_rel_evt.241.a:0 "Transférer la propriété progressivement."
 ve_rel_evt.241.b:0 "La Nationaliser immédiatement."
 ve_rel_evt.241.c:0 "Acheminer les avoirs vers des institutions de Bien-être supervisées."

 ve_rel_evt.290.t:0 "Un arrangement s'implante"
 ve_rel_evt.290.d:0 "La crise de transition s'est résorbée sans briser l'arrangement religieux du pays. Les administrateurs travaillent désormais selon les nouvelles règles, les communautés connaissent leur position et le gouvernement peut convertir cette expérience en capacité de réforme ou en une assurance publique plus profonde."
 ve_rel_evt.290.a:0 "Tirer les leçons de cette expérience pour la prochaine réforme."
 ve_rel_evt.290.a.tt:0 "Gagne #P 10#! Fonds de réforme pieuse."
 ve_rel_evt.290.b:0 "Réaffirmer publiquement l'arrangement."
 ve_rel_evt.290.b.tt:0 "Gagne #P 3#! Arrangement religieux."

 ve_rel_evt.291.t:0 "Un équilibre fragile"
 ve_rel_evt.291.d:0 "La transition formelle est achevée, mais le nouvel arrangement demeure le fruit de la prudence plutôt que de la conviction. On peut le laisser mûrir de lui-même, le renforcer par une concession supplémentaire limitée ou le stabiliser au moyen d'institutions adaptées au Modèle religieux adopté."
 ve_rel_evt.291.a:0 "Laisser le compromis en l'état."
 ve_rel_evt.291.a.tt:0 "La transition prend fin sans effet mécanique supplémentaire."
 ve_rel_evt.291.b:0 "Financer un dernier accommodement."
 ve_rel_evt.291.b.tt:0 "Dépense #N 10#! Fonds de réforme pieuse et gagne #P 3#! Arrangement religieux."
 ve_rel_evt.291.c:0 "Confier l'arrangement à des institutions adaptées au modèle."
 ve_rel_evt.291.c.tt:0 "Dépense #N 5#! Fonds de réforme pieuse et gagne #P 2#! Arrangement religieux. Requiert une Doctrine adaptée au Modèle religieux adopté."

 ve_rel_evt.292.t:0 "Une crise d'arrangement"
 ve_rel_evt.292.d:0 "Le modificateur de transition a expiré, pourtant le pays n'a pas accepté le nouvel ordre religieux. Le gouvernement peut consacrer de rares capacités de réforme à un accommodement d'urgence, s'en remettre à des institutions adaptées au modèle pour une intervention plus ciblée, ou laisser le conflit non résolu radicaliser une partie de la population."
 ve_rel_evt.292.a:0 "Payer le prix d'un accommodement d'urgence."
 ve_rel_evt.292.a.tt:0 "Dépense #N 15#! Fonds de réforme pieuse et gagne #P 5#! Arrangement religieux."
 ve_rel_evt.292.b:0 "L'État n'a plus de concessions à offrir."
 ve_rel_evt.292.b.tt:0 "#N 0.25%#! de la Population du pays devient Radical."
 ve_rel_evt.292.c:0 "Utiliser les institutions bâties pour cet arrangement."
 ve_rel_evt.292.c.tt:0 "Dépense #N 5#! Fonds de réforme pieuse et gagne #P 2#! Arrangement religieux. Requiert une Doctrine adaptée au Modèle religieux adopté."

 ve_identity_transition_conciliatory_tt:0 "Dépense #N 10#! Mandat culturel et gagne #P 3#! Cohésion nationale."
 ve_identity_transition_central_tt:0 "Gagne #P 5#! Mandat culturel et perd #N 3#! Cohésion nationale."
 ve_identity_transition_doctrine_tt:0 "Dépense #N 5#! Mandat culturel et gagne #P 2#! Cohésion nationale."

 ve_cul_evt.210.t:0 "La langue officielle de l'État"
 ve_cul_evt.210.d:0 "Le nouveau pacte national exige une langue commune pour les tribunaux, les écoles et la fonction publique. Une uniformité immédiate serait facile à administrer, mais de nombreux fonctionnaires et citoyens expérimentés ne peuvent encore satisfaire à la norme proposée."
 ve_cul_evt.210.a:0 "Introduire la langue par un enseignement progressif."
 ve_cul_evt.210.b:0 "Émettre un décret unilingue."
 ve_cul_evt.210.c:0 "Mobiliser l'administration nationaliste."

 ve_cul_evt.211.t:0 "Service et appartenance"
 ve_cul_evt.211.d:0 "Le service militaire et le statut d'ancien combattant deviennent des preuves d'appartenance nationale. Les communautés intégrées dans le nouveau pacte exigent du temps pour s'adapter, tandis que le pouvoir central insiste sur le fait que l'appartenance doit comporter une obligation uniforme."
 ve_cul_evt.211.a:0 "Accorder des exemptions transitoires."
 ve_cul_evt.211.b:0 "Appliquer une obligation de service unique."
 ve_cul_evt.211.c:0 "Créer un registre de service universel."

 ve_cul_evt.220.t:0 "Le registre de la citoyenneté égale"
 ve_cul_evt.220.d:0 "Les anciennes catégories ethniques et religieuses restent ancrées dans les registres publics. Les supprimer immédiatement proclamerait l'égalité de la citoyenneté, mais les bureaux locaux préviennent qu'une conversion hâtive pourrait effacer des Revendications et perturber l'accès aux services."
 ve_cul_evt.220.a:0 "Mettre en place progressivement un registre civique commun."
 ve_cul_evt.220.b:0 "Supprimer immédiatement les anciennes catégories."
 ve_cul_evt.220.c:0 "Placer la conversion sous l'égide d'une commission de réforme."

 ve_cul_evt.221.t:0 "École commune, service commun"
 ve_cul_evt.221.d:0 "L'égalité d'accès est garantie par la loi, pourtant les écoles et les bureaux publics manquent du personnel nécessaire pour l'assurer. Le gouvernement doit choisir entre un investissement patient, une norme centrale applicable et un réseau national de qualifications académiques."
 ve_cul_evt.221.a:0 "Investir dans les enseignants et les agents de la fonction publique."
 ve_cul_evt.221.b:0 "Imposer une norme centrale unique."
 ve_cul_evt.221.c:0 "Construire un réseau de qualifications académiques."

 ve_cul_evt.230.t:0 "Le Conseil des peuples constitutifs"
 ve_cul_evt.230.d:0 "Les communautés mentionnées dans le pacte composite exigent d'avoir voix au chapitre dans son administration. Des négociations ouvertes peuvent produire de la Légitimité, tandis qu'un quota fixe conçu dans la capitale promet un règlement plus rapide et plus prévisible."
 ve_cul_evt.230.a:0 "Ouvrir des négociations représentatives."
 ve_cul_evt.230.b:0 "Imposer le quota fixe de la capitale."
 ve_cul_evt.230.c:0 "Négocier un compromis parlementaire."

 ve_cul_evt.231.t:0 "Administration stratifiée"
 ve_cul_evt.231.d:0 "L'autorité locale et les normes centrales se chevauchent désormais à travers l'État composite. Sans protocole clair, chaque bureau négociera à nouveau les limites ; avec une chaîne de Commandement trop rigide, le pacte risque de perdre son sens."
 ve_cul_evt.231.a:0 "Négocier un protocole de compétences."
 ve_cul_evt.231.b:0 "Établir une chaîne de Commandement centrale."
 ve_cul_evt.231.c:0 "Créer un registre bureaucratique partagé."

 ve_cul_evt.290.t:0 "Un nouveau pacte national"
 ve_cul_evt.290.d:0 "Le retour de bâton s'est apaisé et la nouvelle définition de l'appartenance nationale a pris racine. Le gouvernement peut préserver les leçons administratives en tant que Mandat culturel ou saisir l'occasion pour renforcer l'Assurance dans le pacte."
 ve_cul_evt.290.a:0 "Transposer cette Expérience dans l'art de gouverner futur."
 ve_cul_evt.290.a.tt:0 "Gagner #P 10#! Mandat culturel."
 ve_cul_evt.290.b:0 "Célébrer le pacte à travers le pays."
 ve_cul_evt.290.b.tt:0 "Gagner #P 3#! Cohésion nationale."

 ve_cul_evt.291.t:0 "Un pacte fragile"
 ve_cul_evt.291.d:0 "La transition officielle est achevée, mais la nouvelle identité nationale reste inégalement Accepté. Le gouvernement peut laisser le compromis mûrir, dépenser un mandat limité pour un accommodement supplémentaire ou le renforcer par le biais d'institutions adaptées au modèle adopté."
 ve_cul_evt.291.a:0 "Laisser le compromis trouver son propre Solde."
 ve_cul_evt.291.a.tt:0 "La transition se termine sans effet mécanique supplémentaire."
 ve_cul_evt.291.b:0 "Financer un ultime accommodement."
 ve_cul_evt.291.b.tt:0 "Dépenser #N 10#! Mandat culturel et gagner #P 3#! Cohésion nationale."
 ve_cul_evt.291.c:0 "Confier le pacte à des institutions adaptées au modèle."
 ve_cul_evt.291.c.tt:0 "Dépenser #N 5#! Mandat culturel et gagner #P 2#! Cohésion nationale. Requiert une Doctrine adaptée au Modèle identitaire adopté."

 ve_cul_evt.292.t:0 "Une crise du pacte national"
 ve_cul_evt.292.d:0 "Le retour de bâton de la transition a pris fin, mais la nouvelle définition de l'appartenance n'a pas réussi à inspirer une large Loyauté. Le gouvernement peut dépenser un mandat rare en accommodements d'urgence, s'en remettre à des institutions adaptées au modèle pour une intervention plus restreinte ou accepter une vague de Radicalisation."
 ve_cul_evt.292.a:0 "Payer pour un accommodement d'urgence."
 ve_cul_evt.292.a.tt:0 "Dépenser #N 15#! Mandat culturel et gagner #P 5#! Cohésion nationale."
 ve_cul_evt.292.b:0 "L'État appliquera le pacte tel qu'il a été rédigé."
 ve_cul_evt.292.b.tt:0 "#N 0.25%#! de la Population du pays devient Radical."
 ve_cul_evt.292.c:0 "Utiliser les institutions bâties pour cette identité."
 ve_cul_evt.292.c.tt:0 "Dépenser #N 5#! Mandat culturel et gagner #P 2#! Cohésion nationale. Requiert une Doctrine adaptée au Modèle identitaire adopté."
