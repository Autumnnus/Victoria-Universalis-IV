 VE_AGE_BONUS_SELECTED:0 "#bold Ère#!"

 #TOPBAR CONTENT
 # The VE resource row. Chip values stay short because a chip is only 60-74
 # wide; the caps, breakdowns and rules live in the chip tooltips, which reuse
 # the full panel tooltips and only add a scale line and the click hint.
 ve_tb_insight_value:0 "#v [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!"
 ve_tb_idea_groups_value:0 "#v [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0]/[GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!"
 ve_tb_piety_reform_value:0 "#v [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0]#!"
 ve_tb_settlement_value:0 "#v [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0]#!"
 ve_tb_mandate_value:0 "#v [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0]#!"
 ve_tb_cohesion_value:0 "#v [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0]#!"
 ve_tb_momentum_value:0 "#v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue|0]#!"
 ve_tb_religious_project_value:0 "#v [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0]%#!"
 ve_tb_cultural_project_value:0 "#v [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0]%#!"

 ve_tb_click_ideas:0 "\n\n#Y Cliquez#! pour ouvrir le panneau Idées."
 ve_tb_click_religion:0 "\n\n#Y Cliquez#! pour ouvrir le panneau Religion panneau."
 ve_tb_click_culture:0 "\n\n#Y Cliquez#! pour ouvrir le panneau Identité nationale."
 ve_tb_click_era:0 "\n\n#Y Cliquez sur#! pour ouvrir le panneau Era."

 ve_tb_insight_tt:0 "$ve_national_insight_tt$$ve_tb_click_ideas$"
 ve_tb_idea_groups_tt:0 "$embrace_idea_tt$\n\n#title Progression des idées nationales#!\n#Y [GetPlayer.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\nLes idées nationales se débloquent à #Y 3, 6, 9, 12, 15, 18#! et #Y 21#! idées de groupe achetées actives.$ve_tb_click_ideas$"
 ve_tb_piety_reform_tt:0 "$ve_piety_reform_tt$$ve_tb_click_religion$"
 ve_tb_settlement_tt:0 "$ve_piety_tt$$ve_tb_click_religion$"
 ve_tb_religious_project_tt:0 "$ve_religious_project_progress_tt$$ve_tb_click_religion$"
 ve_tb_mandate_tt:0 "$ve_culture_reform_point_tt$$ve_tb_click_culture$"
 ve_tb_cohesion_tt:0 "$ve_national_cohesion_tt$$ve_tb_click_culture$"
 ve_tb_cultural_project_tt:0 "$ve_cultural_project_progress_tt$$ve_tb_click_culture$"
 ve_tb_momentum_tt:0 "$ve_age_splendor_tt$$ve_tb_click_era$"
 ve_targeted_religious_project_state_action:0 "#tooltippable_name Projet religieux ciblé"
 ve_targeted_religious_project_state_action_tt:0 "#header Projet religieux ciblé#!\nLance le projet associé au modèle religieux actuel par rapport à la composition religieuse de cet État. La séparation totale ne peut pas en démarrer une. Ouvrez le panneau Religion pour connaître les coûts exacts, les règles de progression et les résultats."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Projet culturel ciblé"
 ve_start_religious_project_button:0 "Démarrer le projet"
 ve_cancel_religious_project_button:0 "Annuler le projet"
 ve_confirm_cancel_button:0 "#N Oui, annuler#!"
 ve_keep_project_button:0 "Conserver le projet"
 ve_targeted_religious_project_state_requirements_tt:0 "L'État doit nous appartenir, et notre propre religion ne doit pas déjà tenir le coup. #Y 90%#! ou plus de sa population. Le confessionnalisme, la liberté de conscience et l’athéisme d’État peuvent chacun en déclencher un ; La séparation totale ne le peut pas. Le coût de la réforme de la piété du modèle religieux actif doit également être couvert."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "Le modèle religieux permet un projet ciblé (la séparation totale ne peut pas en démarrer un)"
 ve_religious_project_req_no_active:0 "Aucun projet religieux ciblé déjà en cours"
 ve_religious_project_req_no_backlash:0 "Pas dans le délai de récupération de 24 mois après l'annulation d'un projet"
 ve_religious_project_req_reform_point:0 "Assez de réforme de la piété pour le modèle religieux actif (#Y 125#! Confessionnel / #Y 100#! Liberté de conscience / #Y 150#! Athéisme d'État)"
 ve_religious_project_req_target:0 "Notre propre religion représente moins de #Y 90%#! de la population de cet État"
 ve_religious_project_cancel_warning:0 "#header Annuler le projet religieux ciblé ?#!\n\nLes progrès réalisés jusqu'à présent sont perdus. #N -5 Règlement religieux#! et un #N 24 mois#! Les modificateurs de temps de recharge sont appliqués avant qu'un autre projet puisse être démarré."
 ve_cultural_project_req_no_active:0 "Aucun projet culturel déjà en cours"
 ve_cultural_project_req_no_backlash:0 "Pas dans le délai de récupération de 24 mois après l'annulation d'un projet"
 ve_cultural_project_req_reform_point:0 "Assez de mandat culturel pour le modèle d'identité actif (#Y 125#! Ethnique / #Y 100#! Civic / #Y 150#! Composite, plus #Y 40#! Cohésion pour Composite)"
 ve_cultural_project_req_target:0 "Cet État possède une culture non primaire éligible avec au moins #Y 5 %#! de sa population"
 ve_cultural_project_cancel_warning:0 "#header Annuler le projet culturel ?#!\n\nLes progrès réalisés jusqu'à présent sont perdus. #N -5 Cohésion Nationale#! et un #N 24 mois#! les modificateurs de temps de recharge sont appliqués avant qu'un autre projet puisse être démarré."
 alert_can_unlock_ideas_name:0 "Peut adopter une idée"
 alert_can_unlock_ideas_hint:0 "Nous avons suffisamment de perspicacité nationale pour qu'au moins un groupe adopte la prochaine idée, et aucun cycle de mise en œuvre de la doctrine ne bloque actuellement l'achat."
 alert_max_piety_name:0 "Peut adopter un programme religieux-étatique"
 alert_max_piety_hint:0 "Notre réforme de la piété est suffisamment élevée pour adopter un autre programme religieux."
 alert_ve_can_begin_cultural_project_name:0 "Les mandats culturels s’accumulent"
 alert_ve_can_begin_cultural_project_hint:0 "Nous avons plus de #Y 300#! Mandat culturel et projet culturel que nous pourrions démarrer. Le revenu du mandat est divisé par deux à 400 et s'arrête à 500, cela vaut donc la peine d'être dépensé. Rien n'est forcé : notre modèle d'identité est déjà actif."
 alert_can_unlock_age_bonus_name:0 "Peut débloquer une récompense d'ère"
 alert_can_unlock_age_bonus_hint:0 "Nous avons suffisamment d'Era Momentum pour choisir une autre récompense."
 ag_ve_missionary_group_name:0 "Les actions religieuses et culturelles"
 alert_can_use_missionary_name:0 "peuvent envoyer des missionnaires"
 alert_can_use_missionary_hint:0 "Nos missionnaires attendent une mission active. Cliquez sur un État possédé et convertissez la population locale."
 ag_ve_state_project_group_name:0 "Projets d'État ciblés"
 alert_ve_can_begin_targeted_cultural_project_name:0 "Peut commencer un projet culturel ciblé"
 alert_ve_can_begin_targeted_cultural_project_hint:0 "Nous avons les ressources et un État éligible pour le projet culturel ciblé de notre modèle d'identité."
 alert_ve_can_begin_targeted_religious_project_name:0 "Peut commencer un projet religieux ciblé"
 alert_ve_can_begin_targeted_religious_project_hint:0 "Nous avons la Réforme de la Piété et un État éligible au projet de Modèle Religieux actif."
 ve_culture_reform_cost_tt:0 "Exigence de réforme de la culture héritée."
 ve_state_religion_tt:0 "#P Active les mécanismes d'État confessionnels et 3 missionnaires.#! L'autorité religieuse répond fortement au soutien des dévots."
 ve_freedom_of_conscience_tt:0 "#P Active les mécanismes d'État pluraliste et 1 missionnaire.#! L'harmonie religieuse récompense une coexistence stable."
 ve_total_separation_tt:0 "#P Permet les mécanismes de l'État pluraliste.#! Les missionnaires sont handicapés."
 ve_ethnostate_tt:0 "#P S'aligne fortement sur le modèle d'identité de la nation ethnique.#! Il entre en conflit avec la nation civique et convient moins à un État composite."
 ve_national_supremacy_tt:0 "#P S'aligne sur le modèle d'identité de la nation ethnique.#! Il est en conflit avec la nation civique."
 ve_racial_segregation_tt:0 "#P S'aligne sur le modèle d'identité de l'État composite.#! Il ne fournit qu'un soutien partiel à une nation ethnique."
 ve_cultural_exclusion_tt:0 "#P S'aligne sur le modèle d'identité de l'État composite et soutient en partie la nation civique.#!"
 ve_multicultural_tt:0 "#P S'aligne fortement avec le modèle d'identité de la nation civique.#! Il est en conflit avec la nation ethnique."
 ve_send_missionary_tt:0 "#variable Le missionnaire convertit la religion de la population locale tous les #gold 6 mois.\n\n#white Si La population de l'État est inférieure à 250 000 : #darker_white 0 % #white Décroissance de la puissance de base de conversion de base\n#white Si la population de l'État est inférieure à 500 000 : #negative_value -0,02 % #white Dégradation de la puissance de base de conversion\n#white Si la population de l'État est inférieure à 750 000 : #negative_value -0,03 % #white Dégradation de la puissance de base de conversion\n#white Si la population de l'État est inférieure à 1 m : #negative_value -0,04 % #white Dégradation de la puissance de base de conversion\n#white Si la population de l'État est inférieure 5 m : #negative_value -0,043 % #white Dégradation de la puissance de base de conversion\n#white Si la population de l'État est inférieure à 10 m : #negative_value -0,045 % #white Dégradation de la puissance de base de conversion\n#white Si la population de l'État est supérieure à 10 m : #negative_value -0,0475 % #white Dégradation de la puissance de base de conversion"
 ve_targeted_cultural_project_state_action_tt:0 "#header Projet culturel ciblé#!\nDémarre le projet associé à l'identité actuelle Modèle. La plus grande culture non primaire éligible avec au moins #Y 5%#! de la population de cet État devient la cible. Ouvrez le panneau Identité nationale pour connaître les coûts exacts, les règles de progression et les résultats."
