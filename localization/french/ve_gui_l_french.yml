 VE_TEXT_MENU_TITLE:0 "Victoria Universalis IV"
 VE_BTN:0 "Victoria Universalis"
 VE_TOOLTIP:0 "Ouvrir le panneau de Victoria Universalis"
 VE_IDEAS:0 "Doctrines"
 VE_IDEAS_SELECTED:0 "#bold Doctrines#!"
 VE_RELIGION:0 "Religion"
 VE_RELIGION_SELECTED:0 "#bold Religion#!"
 VE_CULTURE:0 "Identité nationale"
 VE_CULTURE_SELECTED:0 "#bold Identité nationale#!"
 VE_AGE_BONUS:0 "Ère"
 VE_AGE_BONUS_SELECTED:0 "#bold Ère#!"

 #TOPBAR CONTENT
 # The VE resource row. Chip values stay short because a chip is only 60-74
 # wide; the caps, breakdowns and rules live in the chip tooltips, which reuse
 # the full panel tooltips and only add a scale line and the click hint.
 ve_tb_insight_value:0 "#v [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!"
 ve_tb_idea_groups_value:0 "#v [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0]/[GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!"
 ve_tb_piety_reform_value:0 "#v [GetPlayer.MakeScope.Var('piety_reform_point').GetValue|0]#!"
 ve_tb_settlement_value:0 "#v [GetPlayer.MakeScope.Var('piety_bar_point').GetValue|0]#!"
 ve_tb_mandate_value:0 "#v [GetPlayer.MakeScope.Var('culture_reform_point').GetValue|0]#!"
 ve_tb_cohesion_value:0 "#v [GetPlayer.MakeScope.Var('ve_national_cohesion').GetValue|0]#!"
 ve_tb_momentum_value:0 "#v [GetPlayer.MakeScope.Var('ve_splender_points').GetValue|0]#!"
 ve_tb_religious_project_value:0 "#v [GetPlayer.MakeScope.Var('ve_religious_project_progress').GetValue|0]%#!"
 ve_tb_cultural_project_value:0 "#v [GetPlayer.MakeScope.Var('ve_cultural_project_progress').GetValue|0]%#!"

 ve_tb_click_ideas:0 "\n\n#Y Clic#! pour ouvrir le panneau des Doctrines."
 ve_tb_click_religion:0 "\n\n#Y Clic#! pour ouvrir le panneau de la Religion."
 ve_tb_click_culture:0 "\n\n#Y Clic#! pour ouvrir le panneau de l'Identité nationale."
 ve_tb_click_era:0 "\n\n#Y Clic#! pour ouvrir le panneau de l'Ère."

 ve_tb_insight_tt:0 "$ve_national_insight_tt$$ve_tb_click_ideas$"
 ve_tb_idea_groups_tt:0 "$embrace_idea_tt$\n\n#title Progression des idées nationales#!\n#Y [GetPlayer.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\nLes Idées nationales sont débloquées à #Y 3, 6, 9, 12, 15, 18#! et #Y 21#! doctrines de groupe actives achetées.$ve_tb_click_ideas$"
 ve_tb_piety_reform_tt:0 "$ve_piety_reform_tt$$ve_tb_click_religion$"
 ve_tb_settlement_tt:0 "$ve_piety_tt$$ve_tb_click_religion$"
 ve_tb_religious_project_tt:0 "$ve_religious_project_progress_tt$$ve_tb_click_religion$"
 ve_tb_mandate_tt:0 "$ve_culture_reform_point_tt$$ve_tb_click_culture$"
 ve_tb_cohesion_tt:0 "$ve_national_cohesion_tt$$ve_tb_click_culture$"
 ve_tb_cultural_project_tt:0 "$ve_cultural_project_progress_tt$$ve_tb_click_culture$"
 ve_tb_momentum_tt:0 "$ve_age_splendor_tt$$ve_tb_click_era$"
 ve_targeted_religious_project_state_action:0 "#tooltippable_name Projet religieux ciblé"
 ve_targeted_religious_project_state_action_tt:0 "#header Projet religieux ciblé#!\nLance le projet associé au Modèle religieux actuel contre la composition religieuse de cet État. La Séparation totale ne peut pas en lancer. Ouvrez le panneau de la Religion pour connaître les coûts exacts, les règles de progression et les résultats."
 ve_targeted_cultural_project_state_action:0 "#tooltippable_name Projet culturel ciblé"
 ve_start_religious_project_button:0 "Lancer le projet"
 ve_cancel_religious_project_button:0 "Annuler le projet"
 ve_confirm_cancel_button:0 "#N Oui, annuler#!"
 ve_keep_project_button:0 "Conserver le projet"
 ve_targeted_religious_project_state_requirements_tt:0 "L'État doit nous appartenir, et notre propre religion ne doit pas déjà détenir #Y 90%#! ou plus de sa population. L'État confessionnel, la Liberté de conscience et l'Athéisme d’État peuvent chacun en lancer un ; la Séparation totale le ne peut pas. Le coût en Fonds de réforme pieuse du Modèle religieux actif doit également être acquitté."

 #Itemized "why is this disabled" requirement lines (Phase 7)
 ve_religious_project_req_model:0 "Le Modèle religieux permet un projet ciblé (la Séparation totale ne peut pas en lancer un)"
 ve_religious_project_req_no_active:0 "Aucun Projet religieux ciblé déjà en cours"
 ve_religious_project_req_no_backlash:0 "Pas dans le délai de récupération de 24 mois suivant l'annulation d'un projet"
 ve_religious_project_req_reform_point:0 "Assez de Fonds de réforme pieuse pour le Modèle religieux actif (#Y 125#! Confessionnel / #Y 100#! Liberté de conscience / #Y 150#! Athéisme d’État)"
 ve_religious_project_req_target:0 "Notre propre religion représente moins de #Y 90%#! de la population de cet état"
 ve_religious_project_cancel_warning:0 "#header Annuler le Projet religieux ciblé ?#!\n\nLa progression accomplie jusqu'à présent est perdue. #N -5 Arrangement religieux#! et un modificateur de délai de récupération de #N 24 mois#! sont appliqués avant qu'un autre projet ne puisse être lancé."
 ve_cultural_project_req_no_active:0 "Aucun Projet culturel déjà en cours"
 ve_cultural_project_req_no_backlash:0 "Pas dans le délai de récupération de 24 mois suivant l'annulation d'un projet"
 ve_cultural_project_req_reform_point:0 "Assez de Mandat culturel pour le Modèle identitaire actif (#Y 125#! Ethnique / #Y 100#! Civique / #Y 150#! Composite, plus #Y 40#! de Cohésion pour l'État composite)"
 ve_cultural_project_req_target:0 "Cet état possède une culture non principale éligible représentant au moins #Y 5%#! de sa population"
 ve_cultural_project_cancel_warning:0 "#header Annuler le Projet culturel ?#!\n\nLa progression accomplie jusqu'à présent est perdue. #N -5 Cohésion nationale#! et un modificateur de délai de récupération de #N 24 mois#! sont appliqués avant qu'un autre projet ne puisse être lancé."
 alert_can_unlock_ideas_name:0 "Peut adopter une doctrine"
 alert_can_unlock_ideas_hint:0 "Nous disposons d'assez de Perspicacité nationale pour la doctrine suivante d'au moins un groupe adopté, et aucun cycle de mise en œuvre des doctrines ne bloque actuellement l'achat."
 alert_max_piety_name:0 "Peut adopter un programme religieux de l'État"
 alert_max_piety_hint:0 "Nos Fonds de réforme pieuse sont suffisants pour adopter un autre Programme religieux."
 alert_ve_can_begin_cultural_project_name:0 "Accumulation de Mandats culturels"
 alert_ve_can_begin_cultural_project_hint:0 "Nous disposons de plus de #Y 300#! Mandats culturels et d'un Projet culturel que nous pourrions lancer. Le revenu en mandat est réduit de moitié à 400 et s'arrête à 500, il est donc judicieux de les dépenser. Rien n'est forcé : notre Modèle identitaire est déjà actif."
 alert_can_unlock_age_bonus_name:0 "Peut débloquer une Récompense d’ère"
 alert_can_unlock_age_bonus_hint:0 "Nous avons assez d'Élan de l’époque pour choisir une autre récompense."
 ag_ve_missionary_group_name:0 "Actions religieuses et culturelles"
 alert_can_use_missionary_name:0 "Peut envoyer des missionnaires"
 alert_can_use_missionary_hint:0 "Nos missionnaires attendent une mission active. Cliquez sur un état possédé et convertissez la population locale."
 ag_ve_state_project_group_name:0 "Projets d'État ciblés"
 alert_ve_can_begin_targeted_cultural_project_name:0 "Peut commencer un Projet culturel ciblé"
 alert_ve_can_begin_targeted_cultural_project_hint:0 "Nous disposons des ressources et d'un état éligible pour le Projet culturel ciblé de notre Modèle identitaire."
 alert_ve_can_begin_targeted_religious_project_name:0 "Peut commencer un Projet religieux ciblé"
 alert_ve_can_begin_targeted_religious_project_hint:0 "Nous disposons des Fonds de réforme pieuse et d'un état éligible pour le projet du Modèle religieux actif."
 ve_culture_reform_cost_tt:0 "Exigence de réforme culturelle historique."
 ve_state_religion_tt:0 "#P Permet les mécaniques d'État confessionnel et 3 missionnaires.#! L'Autorité religieuse réagit fortement au soutien des Croyants."
 ve_freedom_of_conscience_tt:0 "#P Permet les mécaniques d'État pluraliste et 1 missionnaire.#! L'Harmonie religieuse récompense une coexistence stable."
 ve_total_separation_tt:0 "#P Permet les mécaniques d'État pluraliste.#! Les missionnaires sont désactivés."
 ve_ethnostate_tt:0 "#P S'aligne fortement sur le Modèle identitaire de Nation ethnique.#! Il entre en conflit avec la Nation civique et convient moins à un État composite."
 ve_national_supremacy_tt:0 "#P S'aligne sur le Modèle identitaire de Nation ethnique.#! Il entre en conflit avec la Nation civique."
 ve_racial_segregation_tt:0 "#P S'aligne sur le Modèle identitaire d'État composite.#! Il n'offre qu'un soutien partiel à une Nation ethnique."
 ve_cultural_exclusion_tt:0 "#P S'aligne sur le Modèle identitaire d'État composite et soutient partiellement la Nation civique.#!"
 ve_multicultural_tt:0 "#P S'aligne fortement sur le Modèle identitaire de Nation civique.#! Il entre en conflit avec la Nation ethnique."
 ve_send_missionary_tt:0 "#variable Le missionnaire convertit la religion de la population locale tous les #gold 6 mois.\n\n#white Si la population de l'état est inférieure à 250k : #darker_white 0% #white Déclin de la puissance de base de la conversion\n#white Si la population de l'état est inférieure à 500k : #negative_value -0,02% #white Déclin de la puissance de base de la conversion\n#white Si la population de l'état est inférieure à 750k : #negative_value -0,03% #white Déclin de la puissance de base de la conversion\n#white Si la population de l'état est inférieure à 1m : #negative_value -0,04% #white Déclin de la puissance de base de la conversion\n#white Si la population de l'état est inférieure à 5m : #negative_value -0,043% #white Déclin de la puissance de base de la conversion\n#white Si la population de l'état est inférieure à 10m : #negative_value -0,045% #white Déclin de la puissance de base de la conversion\n#white Si la population de l'état est supérieure à 10m+ : #negative_value -0,0475% #white Déclin de la puissance de base de la conversion"
 ve_targeted_cultural_project_state_action_tt:0 "#header Projet culturel ciblé#!\nLance le projet associé au Modèle identitaire actuel. La plus grande culture non principale éligible représentant au moins #Y 5%#! de la population de cet état devient la cible. Ouvrez le panneau de l'Identité nationale pour connaître les coûts exacts, les règles de progression et les résultats."
