l_french:
 # Country panel doctrine section - gui/ve_country_panel_doctrines.gui
 VE_CP_HEADER:0 "Doctrine nationale"
 VE_CP_COLLAPSE_TT:0 "Masquer la vue d'ensemble Victoria Universalis pour ce pays"
 VE_CP_EXPAND_TT:0 "Afficher la vue d'ensemble Victoria Universalis pour ce pays"

 VE_CP_INSIGHT_LABEL:0 "Perspicacité nationale"
 VE_CP_INSIGHT_TT:0 "#header Perspicacité nationale#!\nStock : #Y [Country.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\n\nDépensée pour les doctrines individuelles au sein d'un groupe de doctrines adopté."
 VE_CP_PIETY_LABEL:0 "Fonds de réforme pieuse"
 VE_CP_PIETY_TT:0 "#header Fonds de réforme pieuse#!\nStock : #Y [Country.MakeScope.Var('piety_reform_point').GetValue|0] / 500#!\n\nDépensés pour les programmes religieux et le projet religieux ciblé."
 VE_CP_MANDATE_LABEL:0 "Mandat culturel"
 VE_CP_MANDATE_TT:0 "#header Mandat culturel#!\nStock : #Y [Country.MakeScope.Var('culture_reform_point').GetValue|0] / 500#!\n\nDépensé pour modifier le modèle identitaire et pour les projets culturels."
 VE_CP_MOMENTUM_LABEL:0 "Élan de l’époque"
 VE_CP_MOMENTUM_TT:0 "#header Élan de l’époque#!\nStock : #Y [Country.MakeScope.Var('ve_splender_points').GetValue|0]#!\n\nGagné grâce aux objectifs d’ère satisfaits et dépensé en récompenses d’ère. L'élan est réinitialisé lorsqu'une nouvelle ère commence."
 VE_CP_MOMENTUM_VALUE:0 "[Country.MakeScope.Var('ve_splender_points').GetValue|0]"

 VE_CP_IDEAS_TITLE:0 "Doctrines"
 VE_CP_GROUP_SLOTS:0 "[Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]"
 VE_CP_GROUP_SLOTS_TT:0 "#header Groupes de doctrines#!\nEmplacements utilisés : #Y [Country.MakeScope.Var('idea_group_unlocked').GetValue|0] / [Country.MakeScope.Var('idea_group_cap').GetValue|0]#!\nEmplacements libres : #Y [Country.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInvestissement doctrinal actuel : #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! doctrines actives achetées\n\n[Country.GetCustom('ve_idea_capacity_country_detail')]\n\nLes doctrines de groupes actifs octroient une capacité permanente à #Y 4, 8, 13, 19, 26#! et #Y 34#!. Les emplacements 5 à 6 requièrent également l'ère 2 et l'emplacement 7 requiert l'ère 3. Annuler un groupe réduit l'investissement actuel et ne rembourse jamais la perspicacité, mais la capacité déjà gagnée est conservée."
 VE_CP_NATIONAL_IDEAS_LABEL:0 "Idées nationales"
 VE_CP_PROGRESS_LABEL:0 "Progression des doctrines"
 VE_CP_NATIONAL_IDEA_PROGRESS_TT:0 "#header Progression des idées nationales#!\nDoctrines de groupe achetées : #Y [Country.MakeScope.Var('national_idea_pool').GetValue|0] / 21#!\n\nToutes les trois doctrines de groupe achetées, la prochaine idée nationale est débloquée. La vingt et unième octroie également le bonus national."
 VE_CP_NO_IDEA_GROUPS:0 "#lore Aucun groupe de doctrines adopté pour l'instant.#!"
 VE_CP_PROGRAMS_LABEL:0 "Programmes religieux"
 VE_CP_NONE_YET:0 "#lore Aucun pour l'instant#!"
 VE_CP_PROJECT_LABEL:0 "Projet"
 VE_CP_COHESION_LABEL:0 "Cohésion nationale"
 VE_CP_OBJECTIVES_LABEL:0 "Objectifs d’ère"
 VE_CP_OBJECTIVES_TT:0 "#header Objectifs d’ère#!\nAccomplis dans cette ère : #Y [Country.MakeScope.Var('ve_triggered_objectives').GetValue|0] / 7#!\n\nChaque objectif satisfait rapporte de l'élan de l’époque chaque mois. Quatre objectifs accomplis débloquent un âge d’or."
 VE_CP_REWARDS_LABEL:0 "Récompenses d’ère"
 VE_CP_REWARDS_VALUE:0 "[Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0] achetées cette ère"
 VE_CP_REWARDS_TT:0 "#header Récompenses d’ère#!\nAchetées dans cette ère : #Y [Country.MakeScope.Var('ve_age_rewards_purchased').GetValue|0]#!\n\nChaque récompense coûte plus cher que la précédente, et les effets des récompenses prennent fin avec l'ère. Les emplacements 10 à 13 sont spécifiques au pays."

 # Customizable localization targets - common/customizable_localization/ve_country_panel_cl.txt
 ve_cp_unknown_age:0 "Ère inconnue"
 ve_cp_golden_age_industrial_active:0 "#P Âge d’or industriel#!"
 ve_cp_golden_age_cultural_active:0 "#P Âge d’or culturel#!"
 ve_cp_golden_age_strategic_active:0 "#P Âge d’or stratégique#!"
 ve_cp_golden_age_spent:0 "#lore Âge d’or utilisé#!"
 ve_cp_golden_age_ready:0 "#Y Âge d’or disponible#!"
 ve_cp_golden_age_locked:0 "#lore Âge d’or verrouillé#!"
 ve_cp_tier_high:0 "#P Florissant#!"
 ve_cp_tier_stable:0 "#lore Stable#!"
 ve_cp_tier_low:0 "#N Mis à rude épreuve#!"

 # Scripted GUI tooltip - common/scripted_guis/ve_country_panel.txt
 ve_cp_group_no_idea_bought:0 "#lore Adopté, mais aucune doctrine achetée dans ce groupe pour l'instant.#!"

 # Country-scoped meter and project tooltips. These must never use GetPlayer:
 # the country panel shows them for foreign countries too.
 VE_CP_SETTLEMENT_TT:0 "#header Arrangement religieux#!\nActuel : #Y [Country.MakeScope.Var('piety_bar_point').GetValue|0] / 100#!\nÉquilibre : #Y [Country.MakeScope.ScriptValue('ve_religious_state_equilibrium')|0]#!\nMouvement mensuel : [Country.MakeScope.ScriptValue('ve_monthly_religious_state')|+=0]\n\nLa jauge se déplace de 20% vers l'équilibre chaque mois, limitée à #Y 5#! points. À #P 75#! : [Country.GetCustom('ve_religious_high_settlement_effect')]\nÀ #N 25#! ou moins : #N -5 de Légitimité et -5% de succès de la promulgation#!"
 VE_CP_COHESION_TT:0 "#header Cohésion nationale#!\nActuelle : #Y [Country.MakeScope.Var('ve_national_cohesion').GetValue|0] / 100#!\nÉquilibre : #Y [Country.MakeScope.ScriptValue('ve_national_cohesion_equilibrium')|0]#!\nMouvement mensuel : [Country.MakeScope.ScriptValue('ve_monthly_national_cohesion')|+=0]\n\nLa cohésion évolue de 20% vers l'équilibre chaque mois, avec une limite de #Y 5#! points. À #P 75#!, le modèle identitaire octroie un avantage supplémentaire ; à #N 25#! ou moins, l'instabilité nationale s'applique."
 VE_CP_RELIGIOUS_PROJECT_TT:0 "#header Projet religieux ciblé#!\nStatut : #Y [Country.GetCustom('ve_religious_project_status')]#!\n[Country.GetCustom('ve_cp_religious_project_detail')]"
 VE_CP_CULTURAL_PROJECT_TT:0 "#header Projet culturel#!\nStatut : #Y [Country.GetCustom('ve_cultural_project_name')]#!\nCible : [Country.GetCustom('ve_cultural_project_target')]\n[Country.GetCustom('ve_cp_cultural_project_detail')]\n\n[Country.GetCustom('ve_cultural_project_description')]"

 ve_cp_religious_project_detail_active:0 "Progression : #Y [Country.MakeScope.Var('ve_religious_project_progress').GetValue|0] / 100#!\nProgression mensuelle : [Country.MakeScope.ScriptValue('ve_monthly_religious_project_progress')|+=0]"
 ve_cp_religious_project_detail_none:0 "#lore Aucun projet en cours. Un projet se lance depuis le panneau d'un État possédé, et la Séparation totale ne permet pas d'en mener un.#!"
 ve_cp_cultural_project_detail_active:0 "Progression : #Y [Country.MakeScope.Var('ve_cultural_project_progress').GetValue|0] / 100#!\nProgression mensuelle : [Country.MakeScope.ScriptValue('ve_monthly_cultural_project_progress')|+=0]"
 ve_cp_cultural_project_detail_none:0 "#lore Aucun projet en cours. Les projets à l'échelle du pays se lancent depuis le panneau de l'Identité nationale, et les projets ciblés depuis le panneau d'un État possédé.#!"
