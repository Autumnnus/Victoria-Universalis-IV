l_french:
 ve_tag_flavor_delayed_result_tt:0 "Les conséquences de ce choix institutionnel se feront sentir dans environ un an."
 ve_tag_flavor_free_route_tt:0 "Cet itinéraire ne nécessite aucune perspicacité nationale, aucun mandat culturel ou réforme de la piété."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Un lexique civique commun"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Un vocabulaire officiel partagé entraîne la réforme dans les écoles et les bureaux provinciaux, mais des explications constantes consomment l'autorité centrale."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Continuité sacrée"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "La réforme a été encadrée par des institutions religieuses héritées, renforçant le commandement tout en réduisant les canaux par lesquels circulent les méthodes étrangères."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Traduction administrative"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "La bureaucratie traduit la réforme en procédure familière. L’administration devient plus stable, mais le changement législatif perd un peu de vitesse."
 ve_tag_flavor.1.t:0 "Le langage de la réforme"
 ve_tag_flavor.1.d:0 "Un décret peut quitter la capitale dans une prose impeccable et néanmoins arriver dans une école, un tribunal, un bureau provincial ou une fondation religieuse sous la forme de quatre instructions différentes. Les réformateurs exigent désormais un vocabulaire commun. La question est de savoir quelles institutions donneront son sens à ce vocabulaire."
 ve_tag_flavor.1.a:0 "Rédiger un lexique civique commun."
 ve_tag_flavor.1.a.tt:0 "Nécessite une nation civique ou un État composite.\nDépenser #N 20 Mandat culturel#! maintenant.\nAprès environ un an : gagnez #P 8 en connaissance nationale#! et #P 3 en cohésion nationale#!, puis gagnez #P +1 % d'accès à l'éducation#! et #N -25 d'autorité#! pendant 24 mois."
 ve_tag_flavor.1.b:0 "Réforme fondamentale dans la continuité sacrée."
 ve_tag_flavor.1.b.tt:0 "Nécessite le modèle religieux confessionnel.\nDépensez #N 20 de réforme de la piété#! maintenant.\nAprès environ un an : gagnez #P 8 de connaissance nationale#! et #P 3 d'établissement religieux#!, puis gagnez #P +25 d'autorité#! et #N -2,5 % de technologie Étalé#! pendant 24 mois."
 ve_tag_flavor.1.c:0 "Laissez chaque bureau traduire la commande."
 ve_tag_flavor.1.c.tt:0 "Après environ un an : gain #P 4 National Insight#!, puis gagnez #P +25 Bureaucratie#! et #N -2,5 % de vitesse de promulgation de la loi#! pendant 24 mois."
 ve_tag_flavor.2.t:0 "Les mots deviennent une procédure"
 ve_tag_flavor.2.d:0 "Une année de circulaires, de commentaires, de manuels scolaires, de sermons et de correspondance provinciale a donné au programme de réforme une langue de travail. Ce n’est pas parfaitement uniforme, mais les responsables savent désormais quelles phrases suscitent l’accord – et lesquelles cachent encore un désaccord."
 ve_tag_flavor.2.a:0 "Le vocabulaire entre dans la machinerie de l’État."
 ve_tag_flavor.2.a.tt:0 "Le résultat choisi il y a un an entre désormais en vigueur. Ses changements de ressources sont limités à leurs limites normales et son modificateur institutionnel dure 24 mois."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Bureaux de traduction"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Les bureaux spécialisés accélèrent la circulation des méthodes étrangères, même si leur autonomie affaiblit le commandement immédiat du centre."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Emprunt dirigé"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Les institutions importées sont réorganisées sous direction centrale. L’autorité est préservée, mais chaque réforme met plus de temps à passer par les voies officielles."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Adoption sélective"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "L’État n’admet que des méthodes conciliables avec l’autorité établie, troquant la vitesse de diffusion contre le contrôle politique."
 ve_tag_flavor.10.t:0 "Méthodes empruntées, autorité autochtone"
 ve_tag_flavor.10.d:0 "Les manuels, machines, plans scolaires et tableaux administratifs étrangers arrivent plus vite qu'aucun ministère ne peut les juger. Certains fonctionnaires exigent des bureaux de traduction permanents ; d’autres insistent pour que chaque institution empruntée soit restructurée sous direction centrale. Une troisième faction n'admettrait que ce qui peut être absorbé sans troubler l'ordre établi."
 ve_tag_flavor.10.a:0 "Établir des bureaux de traduction."
 ve_tag_flavor.10.a.tt:0 "Nécessite l'Idée académique IV ou l'Idée d'infrastructure IV.\nDépenser #N 15 Insight national#! maintenant.\nAprès environ un an : gagnez #P 10 Era Momentum#!, puis gagnez #P +2,5 % de propagation technologique#! et #N -25 Autorité#! pendant 24 mois."
 ve_tag_flavor.10.b:0 "Emprunter uniquement sous direction centrale."
 ve_tag_flavor.10.b.tt:0 "Nécessite l'Idée nationale japonaise IV.\nDépenser #N 10 National Insight#! maintenant.\nAprès environ un an : gagnez #P 7 Era Momentum#!, puis gagnez #P +25 en Autorité#! et #N -2,5 % de vitesse d'adoption des lois#! pendant 24 mois."
 ve_tag_flavor.10.c:0 "Adoptez sélectivement et préservez le commandement."
 ve_tag_flavor.10.c.tt:0 "Après environ un an : gagnez #P 3 ères d'élan#!, puis gagnez #P +25 d'autorité#! et #N -2,5 % de spread technologique#! pendant 24 mois."
 ve_tag_flavor.11.t:0 "Des méthodes faites nôtres"
 ve_tag_flavor.11.d:0 "Une année de traduction, de tests, de reformulation et d'argumentation officielle a séparé la nouveauté de l'utilité. Les méthodes adoptées n'apparaissent plus comme des instructions étrangères ; ils sont entrés dans le vocabulaire de commandement de l'État."
 ve_tag_flavor.11.a:0 "Utilisez ce qui a survécu à l’examen."
 ve_tag_flavor.11.a.tt:0 "Le résultat choisi il y a un an prend désormais effet. Era Momentum conserve son plancher zéro normal et le modificateur institutionnel dure 24 mois."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Pacte de citoyenneté"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Un langage commun de citoyenneté facilite l'arrivée et la participation, mais expliquer le pacte dans chaque juridiction consomme de l'autorité centrale."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Une affaire composite"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "L'administration fédérale apprend à négocier entre les communautés constituantes, renforçant ainsi ses fonctions tout en réduisant la pression en faveur d'une forme culturelle unique."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Ambigüité fédérale"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "L'ambiguïté délibérée élargit la voix diplomatique de l'Union, mais diminue pour un temps l'équilibre de la cohésion nationale de 2."
 ve_tag_flavor.20.t:0 "Le sens de l'Union"
 ve_tag_flavor.20.d:0 "Les nouveaux arrivants, les États établis et les communautés aux coutumes publiques différentes invoquent tous l’Union dans leurs propres termes. Les législateurs conviennent qu’une formule commune est nécessaire, mais ne se demandent pas si elle doit définir la citoyenneté individuelle, préserver un marché entre les communautés constituantes ou rester suffisamment large pour que chaque juridiction puisse l’interpréter."
 ve_tag_flavor.20.a:0 "Rédigez un pacte de citoyenneté."
 ve_tag_flavor.20.a.tt:0 "Nécessite une nation civique.\nDépenser #N 20 mandat culturel#! maintenant.\nAprès environ un an : gagnez #P 8 en vision nationale#! et #P 3 en cohésion nationale#!, puis gagnez #P +2,5 % d'attraction migratoire#! et #N -25 d'autorité#! pendant 24 mois."
 ve_tag_flavor.20.b:0 "Négociez un marché composite."
 ve_tag_flavor.20.b.tt:0 "Nécessite un État composite.\nDépenser #N 20 Mandat Culturel#! maintenant.\nAprès environ un an : gagnez #P 8 en Connaissance Nationale#! et #P 3 en Cohésion Nationale#!, puis gagnez #P +25 en Bureaucratie#! et #N -2,5% d'assimilation#! pendant 24 mois."
 ve_tag_flavor.20.c:0 "Laissez la formule fédérale délibérément large."
 ve_tag_flavor.20.c.tt:0 "Après environ un an : gagnez #P 4 perspectives nationales#! et #P +25 Influence#! pendant 24 mois. Tant que le modificateur est actif, l’équilibre de cohésion nationale est #N 2 inférieures#!."
 ve_tag_flavor.21.t:0 "Une formule pour l'Union"
 ve_tag_flavor.21.d:0 "Une année de congrès, de rapports de comités, de résolutions d'État et de débats publics a produit un langage que les institutions peuvent utiliser. Ses silences sont aussi conséquents que ses déclarations, définissant quels différends l'Union règle et lesquels elle laisse à la négociation."
 ve_tag_flavor.21.a:0 "Laissez la formule entrer dans la vie publique."
 ve_tag_flavor.21.a.tt:0 "Le résultat choisi il y a un an entre désormais en vigueur. Les changements de ressources sont limités à leurs limites normales et le modificateur institutionnel dure 24 mois."
