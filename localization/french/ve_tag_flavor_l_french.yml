l_french:
 ve_tag_flavor_delayed_result_tt:0 "Les conséquences de ce choix institutionnel se manifesteront dans environ un an."
 ve_tag_flavor_free_route_tt:0 "Cette voie ne consomme ni Perspicacité nationale, ni Mandat culturel, ni Fonds de réforme pieuse."
 ve_tag_flavor_tur_civic_lexicon_mdf:0 "Un lexique civique commun"
 ve_tag_flavor_tur_civic_lexicon_mdf_desc:0 "Un vocabulaire officiel partagé insuffle la réforme dans les écoles et les bureaux provinciaux, mais l'explication constante consomme l'Autorité centrale."
 ve_tag_flavor_tur_sacred_continuity_mdf:0 "Continuité sacrée"
 ve_tag_flavor_tur_sacred_continuity_mdf_desc:0 "La réforme a été encadrée par les institutions religieuses héritées, renforçant le Commandement tout en réduisant les canaux par lesquels circulent les méthodes étrangères."
 ve_tag_flavor_tur_administrative_translation_mdf:0 "Traduction administrative"
 ve_tag_flavor_tur_administrative_translation_mdf_desc:0 "La bureaucratie traduit la réforme en procédures familières. L'administration devient plus stable, mais le changement législatif perd en rapidité."
 ve_tag_flavor.1.t:0 "Le langage de la réforme"
 ve_tag_flavor.1.d:0 "Un décret peut quitter la capitale dans une prose irréprochable et arriver néanmoins dans une école, un tribunal, un bureau provincial ou une fondation religieuse sous la forme de quatre instructions différentes. Les réformateurs exigent désormais un vocabulaire commun. Reste à savoir quelles institutions donneront à ce vocabulaire sa signification."
 ve_tag_flavor.1.a:0 "Rédiger un lexique civique commun."
 ve_tag_flavor.1.a.tt:0 "Nécessite Nation civique ou État composite.\nConsomme #N 20 Mandat culturel#! maintenant.\nAprès environ un an : gagne #P 8 Perspicacité nationale#! et #P 3 Cohésion nationale#!, puis gagne #P +1% Accès à l’éducation#! et #N -25 Autorité#! pendant 24 mois."
 ve_tag_flavor.1.b:0 "Ancrer la réforme dans la continuité sacrée."
 ve_tag_flavor.1.b.tt:0 "Nécessite le Modèle religieux confessionnel.\nConsomme #N 20 Fonds de réforme pieuse#! maintenant.\nAprès environ un an : gagne #P 8 Perspicacité nationale#! et #P 3 Arrangement religieux#!, puis gagne #P +25 Autorité#! et #N -2,5% Diffusion de la technologie#! pendant 24 mois."
 ve_tag_flavor.1.c:0 "Laisser chaque bureau traduire l'ordre."
 ve_tag_flavor.1.c.tt:0 "Après environ un an : gagne #P 4 Perspicacité nationale#!, puis gagne #P +25 Bureaucratie#! et #N -2,5% Vitesse de promulgation#! pendant 24 mois."
 ve_tag_flavor.2.t:0 "Les mots deviennent procédures"
 ve_tag_flavor.2.d:0 "Une année de circulaires, de commentaires, de manuels scolaires, de sermons et de correspondance provinciale a doté le programme de réforme d'une langue de travail. Elle n'est pas parfaitement uniforme, mais les fonctionnaires savent désormais quelles expressions commandent l'accord — et lesquelles dissimulent encore des désaccords."
 ve_tag_flavor.2.a:0 "Le vocabulaire entre dans la machinerie de l'État."
 ve_tag_flavor.2.a.tt:0 "Le résultat choisi il y a un an prend effet. Les modifications de ressources sont limitées à leurs seuils normaux, et son modificateur institutionnel dure 24 mois."
 ve_tag_flavor_jap_translation_bureaus_mdf:0 "Bureaux de traduction"
 ve_tag_flavor_jap_translation_bureaus_mdf_desc:0 "Des bureaux spécialisés accélèrent la circulation des méthodes étrangères, bien que leur autonomie affaiblisse le commandement immédiat du centre."
 ve_tag_flavor_jap_directed_borrowing_mdf:0 "Emprunt dirigé"
 ve_tag_flavor_jap_directed_borrowing_mdf_desc:0 "Les institutions importées sont réorganisées sous direction centrale. L'Autorité est préservée, mais chaque réforme met plus de temps à traverser les canaux officiels."
 ve_tag_flavor_jap_selective_adoption_mdf:0 "Adoption sélective"
 ve_tag_flavor_jap_selective_adoption_mdf_desc:0 "L'État n'admet que les méthodes pouvant être réconciliées avec l'Autorité établie, troquant la rapidité de la diffusion contre le contrôle politique."
 ve_tag_flavor.10.t:0 "Méthodes empruntées, Autorité indigène"
 ve_tag_flavor.10.d:0 "Manuels, machines, plans scolaires et tableaux administratifs étrangers arrivent plus vite que tout ministère ne peut les juger. Certains fonctionnaires réclament des bureaux de traduction permanents ; d'autres insistent pour que chaque institution empruntée soit refondue sous direction centrale. Une troisième faction n'admettrait que ce qui peut être absorbé sans perturber l'ordre établi."
 ve_tag_flavor.10.a:0 "Établir des bureaux de traduction."
 ve_tag_flavor.10.a.tt:0 "Nécessite Académique IV ou Doctrine des infrastructures IV.\nConsomme #N 15 Perspicacité nationale#! maintenant.\nAprès environ un an : gagne #P 10 Élan de l’époque#!, puis gagne #P +2,5% Diffusion de la technologie#! et #N -25 Autorité#! pendant 24 mois."
 ve_tag_flavor.10.b:0 "N'emprunter que sous direction centrale."
 ve_tag_flavor.10.b.tt:0 "Nécessite Idée nationale japonaise IV.\nConsomme #N 10 Perspicacité nationale#! maintenant.\nAprès environ un an : gagne #P 7 Élan de l’époque#!, puis gagne #P +25 Autorité#! et #N -2,5% Vitesse de promulgation#! pendant 24 mois."
 ve_tag_flavor.10.c:0 "Adopter sélectivement et préserver le commandement."
 ve_tag_flavor.10.c.tt:0 "Après environ un an : gagne #P 3 Élan de l’époque#!, puis gagne #P +25 Autorité#! et #N -2,5% Diffusion de la technologie#! pendant 24 mois."
 ve_tag_flavor.11.t:0 "Des méthodes faites nôtres"
 ve_tag_flavor.11.d:0 "Une année de traduction, d'essais, de refonte et de querelles officielles a séparé la nouveauté de l'utilité. Les méthodes adoptées n'apparaissent plus comme des instructions étrangères ; elles sont entrées dans le vocabulaire de commandement propre à l'État."
 ve_tag_flavor.11.a:0 "Utiliser ce qui a survécu à l'examen."
 ve_tag_flavor.11.a.tt:0 "Le résultat choisi il y a un an prend effet. L'Élan de l’époque conserve son seuil plancher de zéro, et le modificateur institutionnel dure 24 mois."
 ve_tag_flavor_usa_citizenship_compact_mdf:0 "Pacte de citoyenneté"
 ve_tag_flavor_usa_citizenship_compact_mdf_desc:0 "Un langage commun de la citoyenneté facilite l'arrivée et la participation, mais expliquer le pacte à travers chaque juridiction consomme l'Autorité centrale."
 ve_tag_flavor_usa_composite_bargain_mdf:0 "Compromis composite"
 ve_tag_flavor_usa_composite_bargain_mdf_desc:0 "L'administration fédérale apprend à négocier entre les communautés constitutives, renforçant les bureaux tout en réduisant la pression vers une forme culturelle unique."
 ve_tag_flavor_usa_federal_ambiguity_mdf:0 "Ambiguïté fédérale"
 ve_tag_flavor_usa_federal_ambiguity_mdf_desc:0 "Une ambiguïté délibérée élargit la voix diplomatique de l'Union, mais abaisse temporairement l'équilibre de la Cohésion nationale de 2."
 ve_tag_flavor.20.t:0 "Le sens de l'Union"
 ve_tag_flavor.20.d:0 "Les nouveaux arrivants, les États établis et les communautés aux coutumes publiques différentes invoquent tous l'Union selon leurs propres termes. Les législateurs conviennent qu'une formule commune est nécessaire, mais ne s'accordent pas sur le fait de savoir si elle doit définir la citoyenneté individuelle, préserver un compromis entre les communautés constitutives ou rester suffisamment vaste pour être interprétée par chaque juridiction."
 ve_tag_flavor.20.a:0 "Rédiger un pacte de citoyenneté."
 ve_tag_flavor.20.a.tt:0 "Nécessite une Nation civique.\nDépensez #N 20 Mandat culturel#! maintenant.\nAprès environ un an : gagnez #P 8 Perspicacité nationale#! et #P 3 Cohésion nationale#!, puis gagnez #P +2,5% Attractivité migratoire#! et #N -25 Autorité#! pendant 24 mois."
 ve_tag_flavor.20.b:0 "Négocier un compromis composite."
 ve_tag_flavor.20.b.tt:0 "Nécessite un État composite.\nDépensez #N 20 Mandat culturel#! maintenant.\nAprès environ un an : gagnez #P 8 Perspicacité nationale#! et #P 3 Cohésion nationale#!, puis gagnez #P +25 Bureaucratie#! et #N -2,5% Assimilation#! pendant 24 mois."
 ve_tag_flavor.20.c:0 "Laisser la formule fédérale délibérément vaste."
 ve_tag_flavor.20.c.tt:0 "Après environ un an : gagnez #P 4 Perspicacité nationale#! et #P +25 Influence#! pendant 24 mois. Tant que le modificateur est actif, l'équilibre de la Cohésion nationale est #N réduit de 2#!."
 ve_tag_flavor.21.t:0 "Une formule pour l'Union"
 ve_tag_flavor.21.d:0 "Une année de conventions, de rapports de comités, de résolutions d'États et de débats publics a produit un langage que les institutions peuvent utiliser. Ses silences ont autant de poids que ses déclarations, définissant quels litiges l'Union règle et lesquels elle laisse à la négociation."
 ve_tag_flavor.21.a:0 "Laisser la formule entrer dans la vie publique."
 ve_tag_flavor.21.a.tt:0 "Le résultat choisi il y a un an prend désormais effet. Les modifications de ressources sont limitées à leurs seuils normaux, et le modificateur institutionnel dure 24 mois."
