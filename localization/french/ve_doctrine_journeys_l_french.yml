 ve_je_doctrine_journey_academic:0 "Une république des savants"
 ve_je_doctrine_journey_academic_reason:0 "Les universités et les sociétés savantes sont prêtes à devenir une communauté nationale de recherche, pourvu que leurs institutions et leurs fondements sociaux puissent le soutenir."
 ve_je_doctrine_journey_academic_status_both:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +2#!\n\n#P Échelle universitaire atteinte#! : au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! niveaux de bâtiment Université.\n#P Fondation d'alphabétisation atteinte#! : au moins 50 % de Degré d’alphabétisation ou 5 points de pourcentage au-dessus de la valeur de départ du journal.\n\nRécompense de réussite : #P +15 Élan de l’époque#!. Si la progression n'atteint pas 60 en 60 mois, le journal se conclut sans récompense."
