l_french:
 ve_je_doctrine_journey_industrialist:0 "Standardisation du système fabril"
 ve_je_doctrine_journey_industrialist_reason:0 "La doctrine industrielle s'est étendue au-delà des manufactures individuelles. Fabricants, inspecteurs et administrateurs doivent désormais transformer la pratique locale en un système national pérenne."
 ve_je_doctrine_journey_industrialist_status_both:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +2#!\n\n#P Échelle manufacturière atteinte#! : au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! niveaux de bâtiment de fabrication.\n#P Administration stable atteinte#! : Bureaucratie non négative, pas de pénurie imminente et moins de 15 % de Degré d’agitation dans le pays.\n\nRécompense de réussite : #P +40 Perspicacité nationale#!. Si la progression n'atteint pas 60 en 60 mois, le journal se conclut sans récompense."
