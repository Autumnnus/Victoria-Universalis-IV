l_french:
 ve_je_doctrine_journey_industrialist:0 "Standardiser le système d'usine"
 ve_je_doctrine_journey_industrialist_reason:0 "La doctrine industrielle s'est répandue au-delà des usines individuelles. Les fabricants, les inspecteurs et les administrateurs doivent désormais transformer les pratiques locales en un système national durable."
 ve_je_doctrine_journey_industrialist_status_both:0 "Progrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +2#!\n\n#P Échelle de fabrication respectée#!: au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! Niveaux de construction de fabrication.\n#P Administration stable respectée#! : Bureaucratie non négative, pas de pénurie imminente et moins de 15 % de troubles dans le pays.\n\nRécompense de réussite :  #P +40 Insight national#!. Si la progression n'atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
 ve_je_doctrine_journey_industrialist_status_core:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +1#!\n\n#P Échelle de fabrication respectée#!: au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! Niveaux des bâtiments de fabrication.\n#N Administration stable non satisfaite#! : nécessite une bureaucratie non négative, pas de pénurie imminente et moins de 15 % de troubles dans le pays.\n\nRécompense de réussite : #P +40 Insight national#!. Si la progression n'atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
 ve_je_doctrine_journey_industrialist_status_support:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +1#!\n\n#N Échelle de fabrication non respectée#! : nécessite au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! Niveaux de construction manufacturière.\n#P Administration stable rencontrée#! : bureaucratie non négative, pas de pénurie imminente et moins de 15 % de troubles dans le pays.\n\nRécompense du succès : #P +40 Aperçu national#!. Si la progression n’atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
 ve_je_doctrine_journey_industrialist_status_neither:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #N 0#!\n\n#N Échelle de fabrication non respectée#!: nécessite au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_industrialist_required_manufacturing')|0]#! niveaux de construction de fabrication.\n#N Administration stable non satisfaite#! : nécessite une bureaucratie non négative, pas de pénurie imminente et moins de 15 % de troubles dans le pays.\n\nRécompense de réussite : #P +40 Insight national#!. Si la progression n’atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
 ve_je_doctrine_journey_academic:0 "Une République de savants"
 ve_je_doctrine_journey_academic_reason:0 "Les universités et les sociétés savantes sont prêtes à devenir une communauté nationale de recherche, à condition que leurs institutions et leurs fondations sociales puissent la soutenir."
 ve_je_doctrine_journey_academic_status_both:0 "Progrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgrès mensuel : #P +2#!\n\n#P Échelle universitaire respectée#!: au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! Niveaux des bâtiments universitaires.\n#P Fondation d'alphabétisation respectée#! : au moins 50 % d'alphabétisation ou 5 points de pourcentage au-dessus de la valeur de départ du voyage.\n\nRécompense de réussite : #P +15 Era Momentum#!. Si la progression n'atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
