 ve_je_doctrine_journey_academic_status_support:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +1#!\n\n#N Échelle universitaire non atteinte#! : requiert au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! niveaux de bâtiment Université.\n#P Fondation d'alphabétisation atteinte#! : au moins 50 % de Degré d’alphabétisation ou 5 points de pourcentage au-dessus de la valeur de départ du journal.\n\nRécompense de réussite : #P +15 Élan de l’époque#!. Si la progression n'atteint pas 60 en 60 mois, le journal se conclut sans récompense."
 ve_je_doctrine_journey_academic_status_neither:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #N 0#!\n\n#N Échelle des universités non atteinte#! : requiert au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! niveaux de bâtiment d'Université.\n#N Fondement d'alphabétisation non atteint#! : requiert au moins 50 % de Degré d’alphabétisation ou 5 points de pourcentage au-dessus de la valeur de départ du Parcours de doctrine.\n\nRécompense de réussite : #P +15 Élan de l’époque#!. Si la progression n'atteint pas 60 en l'espace de 60 mois, le Parcours de doctrine se conclut sans récompense."
 ve_je_doctrine_journey_professional_army:0 "Réforme de l’état-major général"
 ve_je_doctrine_journey_professional_army_reason:0 "Un corps d'officiers professionnel exige plus que des casernes et des commissions. L'entraînement, la planification et la mobilisation doivent être organisés en un système d'état-major durable."
 ve_je_doctrine_journey_professional_army_status_both:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +2#!\n\n#P Échelle des casernes atteinte#! : au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveaux de bâtiment de Caserne.\n#P Doctrine professionnelle atteinte#! : loi Armée professionnelle ou technologie État-major général.\n\nRécompense de réussite : #Y État-major général institutionnel#! (+7,5 % de Taux d’entraînement, 36 mois). Si la progression n'atteint pas 60 en l'espace de 60 mois, le Parcours de doctrine se conclut sans récompense."
 ve_je_doctrine_journey_professional_army_status_core:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +1#!\n\n#P Échelle des casernes atteinte#! : au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveaux de bâtiment de Caserne.\n#N Doctrine professionnelle non atteinte#! : requiert la loi Armée professionnelle ou la technologie État-major général.\n\nRécompense de réussite : #Y État-major général institutionnel#! (+7,5 % de Taux d’entraînement, 36 mois). Si la progression n'atteint pas 60 en l'espace de 60 mois, le Parcours de doctrine se conclut sans récompense."
 ve_je_doctrine_journey_professional_army_status_support:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +1#!\n\n#N Échelle des casernes non atteinte#! : requiert au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveaux de bâtiment de Caserne.\n#P Doctrine professionnelle atteinte#! : loi Armée professionnelle ou technologie État-major général.\n\nRécompense de réussite : #Y État-major général institutionnel#! (+7,5 % de Taux d’entraînement, 36 mois). Si la progression n'atteint pas 60 en l'espace de 60 mois, le Parcours de doctrine se conclut sans récompense."
 ve_je_doctrine_journey_professional_army_status_neither:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #N 0#!\n\n#N Échelle des casernes non atteinte#! : requiert au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveaux de bâtiment de Caserne.\n#N Doctrine professionnelle non atteinte#! : requiert la loi Armée professionnelle ou la technologie État-major général.\n\nRécompense de réussite : #Y État-major général institutionnel#! (+7,5 % de Taux d’entraînement, 36 mois). Si la progression n'atteint pas 60 en l'espace de 60 mois, le Parcours de doctrine se conclut sans récompense."
 ve_doctrine_journey_general_staff_reform_mdf:0 "État-major général institutionnel"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Les écoles d'état-major, les tables de mobilisation et les normes d'entraînement communes font désormais durablement partie des forces armées."

 ve_doctrine_journey.1.t:0 "Standardisation du système fabril"
 ve_doctrine_journey.1.d:0 "Les associations industrielles proposent un effort national visant à harmoniser les machines, les inspections et les pratiques manufacturières. Cette entreprise durerait cinq ans et exigerait une échelle industrielle soutenue ainsi qu'une stabilité administrative."
 ve_doctrine_journey.1.a:0 "Commencer l'effort de standardisation."
 ve_doctrine_journey.1.b:0 "Reconsidérer la proposition dans cinq ans."
 ve_doctrine_journey.1.c:0 "Nos usines n'ont pas besoin de doctrine nationale."
 ve_doctrine_journey.2.t:0 "Une république des savants"
 ve_doctrine_journey.2.d:0 "Recteurs et sociétés savantes proposent un effort de cinq ans pour relier les universités en une communauté de recherche nationale et durable. Son succès dépendrait tant de la capacité académique que de la diffusion de l'alphabétisation."
 ve_doctrine_journey.2.a:0 "Sponsoriser la république des savants."
 ve_doctrine_journey.2.b:0 "Revenir sur la proposition dans cinq ans."
 ve_doctrine_journey.2.c:0 "L'enseignement doit demeurer organisé à l'échelle locale."
 ve_doctrine_journey.3.t:0 "Réforme de l’état-major général"
 ve_doctrine_journey.3.d:0 "Les officiers supérieurs proposent une réforme quinquennale de l'entraînement, de la planification et de la mobilisation. L'état-major général devra prouver que la doctrine professionnelle peut survivre au-delà d'un cercle de commandants favorisés."
 ve_doctrine_journey.3.a:0 "Commander la réforme de l'état-major général."
 ve_doctrine_journey.3.b:0 "Examiner à nouveau les plans dans cinq ans."
 ve_doctrine_journey.3.c:0 "Le système de commandement actuel est suffisant."

 ve_doctrine_journey_start_tt:0 "Lance ce Parcours de doctrine de cinq ans. Un seul Parcours de doctrine peut être actif à la fois."
 ve_doctrine_journey_defer_tt:0 "Retarde l'offre de ce groupe de #Y 5 ans#!. Elle pourra être proposée à nouveau par la suite."
 ve_doctrine_journey_decline_tt:0 "Refuse définitivement le Parcours de doctrine de ce groupe."

 ve_doctrine_journey.10.t:0 "Mesures et tolérances"
 ve_doctrine_journey.10.d:0 "Les usines utilisent des calibres, des raccords et des tolérances incompatibles. des ingénieurs exhortent l'État à imposer un catalogue unique, tandis que les fabricants provinciaux préviennent qu'une norme rigide pourrait figer des pratiques locales utiles."
 ve_doctrine_journey.10.a:0 "Financer un catalogue national de normes."
 ve_doctrine_journey.10.a.tt:0 "Dépense #N 15#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."
 ve_doctrine_journey.10.b:0 "Autoriser des normes régionales compatibles."
 ve_doctrine_journey.10.b.tt:0 "Le périple se poursuit sans modification immédiate des ressources ou de la progression."
 ve_doctrine_journey.10.c:0 "Utiliser les bureaux de construction pour coordonner l'adoption."
 ve_doctrine_journey.10.c.tt:0 "Requiert la Doctrine industrielle V.\nDépense #N 10#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."
 ve_doctrine_journey.11.t:0 "L'Inspection nationale"
 ve_doctrine_journey.11.d:0 "Les premières normes communes exigent désormais une application rigoureuse. Les fonctionnaires proposent une inspection centrale, les fabricants préfèrent l'autocertification et les planificateurs industriels chevronnés plaident pour un audit combinant les deux."
 ve_doctrine_journey.11.a:0 "Établir une inspection industrielle centrale."
 ve_doctrine_journey.11.a.tt:0 "Dépense #N 15#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."
 ve_doctrine_journey.11.b:0 "Reconnaître l'autocertification de l'industrie."
 ve_doctrine_journey.11.b.tt:0 "Le périple se poursuit sans modification immédiate des ressources ou de la progression."
 ve_doctrine_journey.11.c:0 "Auditer les inspecteurs et les fabricants au moyen d'un système unique."
 ve_doctrine_journey.11.c.tt:0 "Requiert la Doctrine industrielle VII.\nDépense #N 10#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."

 ve_doctrine_journey.20.t:0 "Chaires vacantes"
 ve_doctrine_journey.20.d:0 "Les universités ne s'entendent pas sur le point de savoir si les nouvelles chaires doivent dépendre des facultés locales, des priorités nationales ou d'un Mandat d'enseignement public. Les premières nominations définiront la liberté avec laquelle le réseau savant échangera hommes et doctrines."
 ve_doctrine_journey.20.a:0 "Financer un programme de chaires nationales coordonné."
 ve_doctrine_journey.20.a.tt:0 "Dépense #N 15#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."
 ve_doctrine_journey.20.b:0 "Laisser chaque faculté définir ses propres chaires."
 ve_doctrine_journey.20.b.tt:0 "Le périple se poursuit sans modification immédiate des ressources ou de la progression."
 ve_doctrine_journey.20.c:0 "Lier les chaires à un réseau de conférences publiques."
 ve_doctrine_journey.20.c.tt:0 "Requiert la Doctrine académique V.\nDépense #N 10#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."
 ve_doctrine_journey.21.t:0 "Une république d'arbitres"
 ve_doctrine_journey.21.d:0 "La recherche circule désormais entre les institutions plus rapidement que le vieux mécénat ne peut l'évaluer. Les savants proposent une évaluation par les pairs à l'échelle nationale, tandis que les académies établies défendent l'invitation sélective et l'indépendance disciplinaire."
 ve_doctrine_journey.21.a:0 "Financer un service national d'évaluation par les pairs."
 ve_doctrine_journey.21.a.tt:0 "Dépense #N 15#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."
 ve_doctrine_journey.21.b:0 "Laisser l'évaluation aux sociétés savantes."
 ve_doctrine_journey.21.b.tt:0 "Le périple se poursuit sans modification immédiate des ressources ou de la progression."
 ve_doctrine_journey.21.c:0 "Convoquer des conseils d'évaluation interdisciplinaires."
 ve_doctrine_journey.21.c.tt:0 "Requiert la Doctrine académique VII.\nDépense #N 10#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."

 ve_doctrine_journey.30.t:0 "L'École de guerre"
 ve_doctrine_journey.30.d:0 "La nouvelle école de guerre doit déterminer ce qui rend un officier apte au Commandement. Les réformateurs exigent des examens et un enseignement commun, tandis que les Commandants établis défendent l'ancienneté et le jugement acquis sur le terrain."
 ve_doctrine_journey.30.a:0 "Financer des examens nationaux et un programme commun."
 ve_doctrine_journey.30.a.tt:0 "Dépense #N 15#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."
 ve_doctrine_journey.30.b:0 "Concilier l'ancienneté et les recommandations de l'école."
 ve_doctrine_journey.30.b.tt:0 "Le périple se poursuit sans modification immédiate des ressources ou de la progression."
 ve_doctrine_journey.30.c:0 "Faire alterner les officiers de terrain dans les salles de classe de l'état-major."
 ve_doctrine_journey.30.c.tt:0 "Requiert la Doctrine Armée professionnelle V.\nDépense #N 10#! de Perspicacité nationale.\nLa progression du périple augmente de #P 4#!."
 ve_doctrine_journey.31.t:0 "Les tableaux de mobilisation"
 ve_doctrine_journey.31.d:0 "Les planificateurs ont établi des calendriers rivaux concernant les hommes, les approvisionnements et le transport ferroviaire. Un tableau national unique promet la coordination, mais les commandements régionaux avertissent que des horaires rigides ignoreront la capacité locale."
 ve_doctrine_journey.31.a:0 "Financer un bureau central de mobilisation."
 ve_doctrine_journey.31.a.tt:0 "Coûte #N 15#! de Perspicacité nationale.\nLa progression de la Périple augmente de #P 4#!."
 ve_doctrine_journey.31.b:0 "Laisser les commandements régionaux maintenir des calendriers compatibles."
 ve_doctrine_journey.31.b.tt:0 "Le Périple continue sans modification immédiate des ressources ou de la progression."
 ve_doctrine_journey.31.c:0 "Intégrer la planification des voies ferrées, des dépôts et du commandement."
 ve_doctrine_journey.31.c.tt:0 "Requiert la doctrine Armée professionnelle VII.\nCoûte #N 10#! de Perspicacité nationale.\nLa progression du Périple augmente de #P 4#!."
