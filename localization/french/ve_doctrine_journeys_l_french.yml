 ve_je_doctrine_journey_academic_status_neither:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgrès mensuel : #N 0#!\n\n#N Échelle universitaire non atteinte#! : nécessite au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_academic_required_universities')|0]#! niveaux de construction universitaire.\n#N Fondation d'alphabétisation non atteinte#! : nécessite au moins 50 % d'alphabétisation ou 5 points de pourcentage au-dessus de la valeur de départ du voyage.\n\nRécompense de réussite : #P +15 Era Momentum#!. Si le progrès n'atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
 ve_je_doctrine_journey_professional_army:0 "Réformer l'état-major général"
 ve_je_doctrine_journey_professional_army_reason:0 "Un corps d'officiers professionnels a besoin de plus que des casernes et des commissions. La formation, la planification et la mobilisation doivent être organisées en un seul système de personnel durable."
 ve_je_doctrine_journey_professional_army_status_both:0 "Progrès : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgrès mensuel : #P +2#!\n\n#P Échelle caserne atteinte#!: au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveaux de construction de casernes.\n#P Doctrine professionnelle respectée#! : droit professionnel de l'armée ou technologie d'état-major.\n\nRécompense de réussite : #Y état-major institutionnel#! (+7,5% de taux de formation, 36 mois). Si la progression n'atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
 ve_je_doctrine_journey_professional_army_status_core:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #P +1#!\n\n#P Échelle de caserne remplie#! : au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveaux de construction de casernes.\n#N Doctrine professionnelle non respectée#! : nécessite la loi de l'armée professionnelle ou la technologie d'état-major général.\n\nRécompense de réussite : #Y État-major institutionnel#! (+7,5 % de taux de formation, 36 mois). Si la progression n'atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
 ve_je_doctrine_journey_professional_army_status_support:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgrès mensuel : #P +1#!\n\n#N Échelle de caserne non respectée#! : nécessite au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! niveaux de construction de casernes.\n#P Doctrine professionnelle respectée#! : Droit de l'armée professionnelle ou technologie d'état-major général.\n\nRécompense de réussite : #Y État-major institutionnel#! (+7,5% Taux de Formation, 36 mois). Si la progression n'atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
 ve_je_doctrine_journey_professional_army_status_neither:0 "Progression : #Y [ROOT.GetCountry.MakeScope.Var('ve_doctrine_journey_progress').GetValue|0]#!/60\nTemps restant : #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_remaining_months')|0] mois#!\nProgression mensuelle : #N 0#!\n\n#N Barème des casernes non respecté#!: nécessite au moins #Y [ROOT.GetCountry.MakeScope.ScriptValue('ve_doctrine_journey_professional_army_required_barracks')|0]#! Niveaux des bâtiments des casernes.\n#N Doctrine professionnelle non respectée#! : nécessite la technologie de droit de l'armée professionnelle ou d'état-major général.\n\nRécompense de réussite : #Y Etat-Major Institutionnel#! (+7,5% Taux de Formation, 36 mois). Si la progression n’atteint pas 60 dans les 60 mois, le voyage se termine sans récompense."
 ve_doctrine_journey_general_staff_reform_mdf:0 "Etat-Major Institutionnel"
 ve_doctrine_journey_general_staff_reform_mdf_desc:0 "Les écoles d’état-major, les tables de mobilisation et les normes communes de formation sont devenus des éléments durables des forces armées."

 ve_doctrine_journey.1.t:0 "Standardiser le système d'usine"
 ve_doctrine_journey.1.d:0 "Les associations industrielles proposent un effort national pour aligner les machines, les inspections et les pratiques de fabrication. L'entreprise durerait cinq ans et exigerait une échelle industrielle soutenue et une stabilité administrative."
 ve_doctrine_journey.1.a:0 "Commencer l'effort de normalisation."
 ve_doctrine_journey.1.b:0 "Reconsidérer la proposition dans cinq ans."
 ve_doctrine_journey.1.c:0 "Nos usines n’ont pas besoin de doctrine nationale."
 ve_doctrine_journey.2.t:0 "Une République de savants"
 ve_doctrine_journey.2.d:0 "Les recteurs et les sociétés savantes proposent un effort sur cinq ans pour relier les universités à une communauté nationale de recherche durable. Son succès dépendrait à la fois de la capacité académique et de la diffusion de l'alphabétisation."
 ve_doctrine_journey.2.a:0 "Parrainer la république des savants."
 ve_doctrine_journey.2.b:0 "Revenir sur la proposition dans cinq ans."
 ve_doctrine_journey.2.c:0 "L'apprentissage doit rester organisé localement."
 ve_doctrine_journey.3.t:0 "Réformer l'état-major"
 ve_doctrine_journey.3.d:0 "Les officiers supérieurs proposent une réforme quinquennale de la formation, de la planification et de la mobilisation. L'état-major devrait prouver que la doctrine professionnelle peut survivre au-delà d'un cercle de commandants privilégiés."
 ve_doctrine_journey.3.a:0 "Commander la réforme de l'état-major."
 ve_doctrine_journey.3.b:0 "Revoir les plans dans cinq ans."
 ve_doctrine_journey.3.c:0 "Le système de commandement existant est suffisant."

 ve_doctrine_journey_start_tt:0 "Commence ce voyage doctrinal de cinq ans. Un seul parcours de doctrine peut être actif à la fois."
 ve_doctrine_journey_defer_tt:0 "Retarde l'offre de ce groupe de #Y 5 ans#!. Il pourra être proposé à nouveau par la suite."
 ve_doctrine_journey_decline_tt:0 "Refuse définitivement le parcours doctrinaire de ce groupe."

 ve_doctrine_journey.10.t:0 "Mesures et tolérances "
 ve_doctrine_journey.10.d:0 "Les usines utilisent des jauges, des raccords et des tolérances incompatibles. Les ingénieurs exhortent l'État à imposer un catalogue unique, tandis que les fabricants provinciaux préviennent qu'une norme rigide pourrait geler les pratiques locales utiles."
 ve_doctrine_journey.10.a:0 "Financer un catalogue national de normes."
 ve_doctrine_journey.10.a.tt:0 "Dépenser #N 15#! National Insight.\nLa progression du voyage augmente de #P 4#!."
 ve_doctrine_journey.10.b:0 "Autoriser les normes régionales compatibles."
 ve_doctrine_journey.10.b.tt:0 "Le voyage continue sans ressource immédiate ni changement de progression."
 ve_doctrine_journey.10.c:0 "Utiliser les bureaux de construction pour coordonner l'adoption."
 ve_doctrine_journey.10.c.tt:0 "Nécessite l'idée industrielle V.\nDépenser #N 10#! National Insight.\nLa progression du voyage augmente de #P 4#!."
 ve_doctrine_journey.11.t:0 "L'Inspection nationale"
 ve_doctrine_journey.11.d:0 "Les premières normes communes doivent désormais être appliquées. Les autorités proposent une inspection centrale, les fabricants préfèrent l'autocertification et les planificateurs industriels expérimentés plaident en faveur d'un audit des deux."
 ve_doctrine_journey.11.a:0 "Établir une inspection industrielle centrale."
 ve_doctrine_journey.11.a.tt:0 "Dépenser #N 15#! National Insight.\nLa progression du voyage augmente de #P 4#!."
 ve_doctrine_journey.11.b:0 "Reconnaître l'autocertification de l'industrie."
 ve_doctrine_journey.11.b.tt:0 "Le voyage se poursuit sans ressource immédiate ni changement de progression."
 ve_doctrine_journey.11.c:0 "Auditez les inspecteurs et les fabricants via un seul système."
 ve_doctrine_journey.11.c.tt:0 "Nécessite l'idée industrielle VII.\nDépenser #N 10#! Insight national.\nLa progression du voyage augmente de #P 4#!."

 ve_doctrine_journey.20.t:0 "Chaires ouvertes"
 ve_doctrine_journey.20.d:0 "Les universités ne sont pas d'accord sur la question de savoir si les nouvelles chaires doivent répondre aux facultés locales, aux priorités nationales ou à un mandat d'enseignement public. Les premières nominations définiront la liberté avec laquelle le réseau scientifique échange des personnes et des idées."
 ve_doctrine_journey.20.a:0 "Financer un programme de chaire national coordonné."
 ve_doctrine_journey.20.a.tt:0 "Dépensez #N 15#! National Insight.\nLa progression du voyage augmente de #P 4#!."
 ve_doctrine_journey.20.b:0 "Laissez chaque faculté définir ses propres chaires."
 ve_doctrine_journey.20.b.tt:0 "Le voyage continue sans ressources immédiates ni changement de progression."
 ve_doctrine_journey.20.c:0 "Liez les chaires à un réseau de conférences public."
 ve_doctrine_journey.20.c.tt:0 "Nécessite l'idée académique V.\nDépenser #N 10#! National Insight.\nLa progression du voyage augmente de #P 4#!."
 ve_doctrine_journey.21.t:0 "Une république d'arbitres"
 ve_doctrine_journey.21.d:0 "La recherche circule désormais entre les institutions plus rapidement que les anciens mécénats ne peuvent en juger. Les chercheurs proposent un examen national par les pairs, tandis que les académies établies défendent l'invitation sélective et l'indépendance disciplinaire."
 ve_doctrine_journey.21.a:0 "Financer un service national d’évaluation par les pairs."
 ve_doctrine_journey.21.a.tt:0 "Dépenser #N 15#! Aperçu national.\nLa progression du voyage augmente de #P 4#!."
 ve_doctrine_journey.21.b:0 "Laissez l'examen aux sociétés savantes."
 ve_doctrine_journey.21.b.tt:0 "Le voyage continue sans ressources immédiates ni changement de progrès."
 ve_doctrine_journey.21.c:0 "Convoquez des conseils d'évaluation interdisciplinaires."
 ve_doctrine_journey.21.c.tt:0 "Nécessite l'idée académique VII.\nDépensez #N 10#! Insight national.\nLa progression du voyage augmente de #P 4#!."

 ve_doctrine_journey.30.t:0 "Le Collège du Personnel"
 ve_doctrine_journey.30.d:0 "Le nouveau collège d'état-major doit décider ce qui rend un officier apte au commandement. Les réformateurs exigent des examens et une instruction commune, tandis que les commandants établis défendent l'ancienneté et le jugement acquis en service sur le terrain."
 ve_doctrine_journey.30.a:0 "Financer des examens nationaux et un programme commun."
 ve_doctrine_journey.30.a.tt:0 "Dépensez #N 15#! National Insight.\nLa progression du voyage augmente de #P 4#!."
 ve_doctrine_journey.30.b:0 "Équilibrez l'ancienneté avec les recommandations du collège."
 ve_doctrine_journey.30.b.tt:0 "Le voyage se poursuit sans changement immédiat de ressources ni de progrès."
 ve_doctrine_journey.30.c:0 "Faites alterner les officiers de terrain dans les salles de classe d'état-major."
 ve_doctrine_journey.30.c.tt:0 "Nécessite l'idée V de l'armée professionnelle.\nDépenser #N 10#! Insight national.\nLa progression du voyage augmente de #P 4#!."
 ve_doctrine_journey.31.t:0 "Les tables de mobilisation"
 ve_doctrine_journey.31.d:0 "Les planificateurs ont produit des horaires concurrents pour les hommes, les fournitures et le transport ferroviaire. Une table nationale unique promet une coordination, mais les commandements régionaux préviennent que des calendriers rigides ignoreront les capacités locales."
 ve_doctrine_journey.31.a:0 "Financer un bureau central de mobilisation."
 ve_doctrine_journey.31.a.tt:0 "Dépenser #N 15#! National Insight.\nLa progression du voyage augmente de #P 4#!."
 ve_doctrine_journey.31.b:0 "Laissez les commandements régionaux maintenir des horaires compatibles."
 ve_doctrine_journey.31.b.tt:0 "Le voyage continue sans changement immédiat de ressources ni de progrès."
 ve_doctrine_journey.31.c:0 "Intégrez la planification des chemins de fer, des dépôts et des commandements."
 ve_doctrine_journey.31.c.tt:0 "Nécessite l'idée professionnelle de l'armée VII.\nDépenser #N 10#! National Insight.\nLa progression du voyage augmente de #P 4#!."
