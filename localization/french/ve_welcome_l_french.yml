 # Événement d'accueil de Victoria Universalis IV 2.0 - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Cette campagne utilise la Victoria Universalis IV reconstruite. En bref :\n\n#Y Religion#! - Votre loi Église et État définit désormais l'un des quatre Modèles religieux. Vous disposez d'une jauge de Règlement religieux de 0 à 100, vous dépensez la Réforme de la piété sur huit programmes permanents par modèle et vous pouvez mener un Projet religieux ciblé dans l'État de votre choix.\n\n#Y Identité nationale#! - Nation ethnique, civique ou composite, avec le Mandat culturel à dépenser, une jauge de Cohésion nationale à maintenir haute et cinq Projets culturels.\n\n#Y Groupes d'idées#! - 21 groupes répartis en Production, Société et Militaire, dont le nouveau groupe Agraire. Les emplacements de groupe se gagnent maintenant par l'investissement doctrinal et non par le calendrier, et chaque achat impose une période de mise en oeuvre de 24 mois.\n\n#Y Idées nationales#! - Douze nouveaux profils de pays, et la progression vient désormais de chaque niveau d'idée acheté.\n\n#Y Ères#! - Trois ères avec objectifs, treize récompenses d'ère et trois Âges d'or, ainsi qu'un parcours stratégique de Carrefour de l'ère par ère.\n\n#Y Nouveau contenu#! - Plus de cent nouveaux événements : dilemmes doctrinaux, Parcours doctrinaux pluriannuels, incidents et crises de projet, et chaînes thématiques pour les Ottomans, le Japon et les États-Unis.\n\n#Y Interface#! - Une nouvelle rangée dans la barre supérieure, des pages Religion et Identité nationale refondues, un résumé doctrinal sur le panneau de chaque pays et un Grand livre de doctrine mondial."
 ve_welcome.1.f:0 "Chaque doctrine laisse sa marque sur la nation qui l'adopte."
 ve_welcome.1.a:0 "Pour les détails, consultez la description du mod. Bon jeu ^_^"
