 # Victoria Universalis IV 2.0 welcome popup - events/ve_welcome_events.txt
 ve_welcome.1.t:0 "Victoria Universalis IV 2.0"
 ve_welcome.1.d:0 "Cette campagne se déroule sur la version refondue de Victoria Universalis IV. En résumé :\n\n#Y Religion#! - Votre loi sur l'Église et l'État détermine désormais l'un des quatre Modèles religieux. Vous disposez d'une jauge d'Arrangement religieux de 0 à 100, dépensez des Fonds de réforme pieuse pour huit programmes permanents par modèle et pouvez mener un Projet religieux ciblé dans un État de votre choix.\n\n#Y Identité nationale#! - Nationalité ethnique, civique ou composite, avec un Mandat culturel à dépenser, une jauge de Cohésion nationale à maintenir élevée et cinq Projets culturels.\n\n#Y Groupes de doctrines#! - 21 groupes répartis entre Production, Société et Militaire, incluant le nouveau groupe Agriculture. Les emplacements de groupes s'obtiennent par l'investissement dans les doctrines plutôt que par le calendrier, et chaque achat vous impose une période de mise en œuvre de 24 mois.\n\n#Y Doctrines nationales#! - Douze nouveaux profils de pays, et la progression découle désormais de chaque niveau de doctrine acquis.\n\n#Y Ères#! - Trois Ères dotées d'objectifs, treize emplacements de Récompense d’ère et trois Âges d'or, ainsi qu'un Carrefour d’ère stratégique par Ère.\n\n#Y Nouveau contenu#! - Plus d'une centaine de nouveaux événements : dilemmes doctrinaux, Périples doctrinaux pluriannuels, incidents et crises liés aux projets, ainsi que des chaînes narratives pour les Ottomans, le Japon et les États-Unis.\n\n#Y Interface#! - Une nouvelle ligne de barre supérieure, des pages de Religion et d'Identité nationale refondues, un affichage des doctrines sur chaque panneau de pays, et un Registre des doctrines mondial."
 ve_welcome.1.f:0 "Chaque doctrine laisse son empreinte sur la nation qui l'adopte."
 ve_welcome.1.a:0 "Pour plus de détails, consultez la description du mod. Bon jeu ^_^"
