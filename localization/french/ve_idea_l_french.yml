 SOC_HEADER:0 "Idées de société"
 PROD_HEADER:0 "Idées de production"
 MIL_HEADER:0 "Idées militaires"
 ve_national_ideas:0 " Idées nationales"
 ve_idea_points:0 "#tooltippable_name Aperçu national"
 ve_national_insight_tt:0 "#header National Insight#!\nStock : #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nCe mois-ci : [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nStatut d'achat : [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Ce qu'il fait#!\nNational Insight achète des idées individuelles au sein d'un groupe d'idées adopté. Chaque achat actif fait progresser les idées nationales et s'ajoute à l'investissement actuel dans la doctrine ; Atteindre un jalon d'investissement récompense de manière permanente la capacité du groupe.\n\n#title Pourquoi les revenus mensuels changent#!\nBase : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nAlphabétisation : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nÉcoles : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniversités : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nIntelligentsia : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nDette, troubles et mise en œuvre : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Pression des stocks#!\nMultiplicateur de revenu : #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nLe revenu est réduit de moitié à #Y 750#!, tombe à un quart à #Y 900#! et s'arrête à #Y 1000#!. Dépenser avant le plafond des actions évite le gaspillage de revenus."
 ve_national_insight_implementation_strain:0 "Tension de mise en œuvre de la doctrine"
 ve_national_insight_implementation_strain_desc:0 "L'administration adapte ses institutions et ses procédures à une doctrine nationale nouvellement adoptée. Une autre idée de groupe ne peut pas être adoptée avant la fin de ce cycle de mise en œuvre de 24 mois."
 ve_total_ideas:0 "Groupes d'idées"
 ve_traditions:0 "#tooltippable_concept Traditions : "
 ve_bonus:0 "#tooltippable_concept Bonus : "
 ve_ambition:0 "Ambition"
 ve_ambition_tooltip:0 "#Y Ambition#!\n#P Récompense finale permanente#!\nSe débloque automatiquement lorsque les sept idées de ce groupe ont été adoptées."
 ve_idea_cancel_warning:0 "#header Annuler [StateRegion.MakeScope.Var('idea_group')]?#!\n\n#N Chaque modificateur d'idée actif dans ce groupe sera supprimé.#!\n#N Son modificateur Ambition sera également supprimé s'il a été débloqué.#!\n\nL'Insight National dépensé n'est pas remboursé.\nInsight National renvoyé : #Y 0#!\n\n#title Effets qui seront supprimés#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Confirmer : annuler ce groupe d'idées.#! Progression et les modificateurs sont perdus, National Insight n'est pas remboursé."
 ve_idea_cancel_keep_tt:0 "Conservez ce groupe d'idées - n'annulez pas."
 ve_embrace:0 "Embrassez"
 ve_idea_locked:0 "Chemin fermé"
 ve_idea_locked_tt:0 "#N Ce groupe d’idées s’exclut mutuellement avec celui que vous avez déjà adopté. Annulez ce groupe pour ouvrir ce chemin."
 ve_idea_age_locked:0 "Technologie requise"
 ve_idea_age_locked_tt:0 "#N Ce groupe d'idées nécessite une technologie qui n'a pas encore fait l'objet de recherches."
 ve_idea_labour_technology_locked_tt:0 "#N Requiert [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Requiert [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Nécessite [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Nécessite [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Nécessite [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Requiert [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Requiert [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Idée Boost"
 ve_boost_idea_tt:0 "#header Adoptez la prochaine idée#!\nNational Insight : #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nStatut d'achat : [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Coût du niveau suivant#!\n#Y I : 200#!  •  #Y II : 250#!  •  #Y III : 300#!  •  #Y IV : 375#!\n#Y V : 450#!  •  #Y VI : 550#!  •  #Y VII : 675#!\nUtilisez le coût correspondant au prochain niveau non rempli de ce groupe.\n\n#title Que se passe-t-il lors de l'achat#!\n#P Le modificateur suivant de ce groupe devient actif.#!\n#P Les progrès de l'investissement dans la doctrine et de l'idée nationale augmentent chacun de 1.#!\n#N Un cycle de mise en œuvre de la doctrine de 24 mois commence. Aucune autre idée de groupe ne peut être achetée pendant cette période.#!\n\n#title Pourquoi le bouton peut-il être désactivé ?#!\nInsight est inférieur au coût du niveau suivant ; La mise en œuvre de la doctrine est active ; le groupe est complet ; ou le niveau suivant nécessite une technologie non étudiée.\n\nL'annulation de ce groupe supprime ses modificateurs d'idées et sa progression actuelle. Les insights dépensés ne sont jamais remboursés, mais un emplacement de groupe déjà gagné grâce à un jalon n'est jamais révoqué."
 academic_idea_name:0 "#b Idée académique"
 agrarian_idea_name:0 "#b Idée agraire"
 financial_idea_name:0 "#b Idée financière"
 infrastructure_idea_name:0 "#b Idée d'infrastructure"
 extraction_idea_name:0 "#b Idée d'extraction"
 mass_conscription_idea_name:0 "#b Idée de conscription de masse"
 war_economy_idea_name:0 "#b Idée d'économie de guerre"
 diplomatic_idea_name:0 "#b Idée diplomatique"
 offensive_idea_name:0 "#b Idée offensive"
