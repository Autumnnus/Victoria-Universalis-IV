l_french:
 SOC_HEADER:0 "Idées de la société"
 PROD_HEADER:0 "Idées de production"
 MIL_HEADER:0 "Idées militaires"
 ve_national_ideas:0 " Idées nationales"
 ve_idea_points:0 "#tooltippable_name Perspicacité nationale"
 ve_national_insight_tt:0 "#header Perspicacité nationale#!\nRéserve : #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0] / 1000#!\nCe mois-ci : [GetPlayer.MakeScope.ScriptValue('ve_monthly_national_insight')|+=0]\nÉtat des achats : [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Effets#!\nLa perspicacité nationale permet d'acquérir les doctrines individuelles au sein d'un groupe de doctrines adopté. Chaque achat actif fait progresser les idées nationales et alimente l'investissement en doctrines actuel ; l'atteinte d'un palier d'investissement confère de manière permanente de la capacité de groupe.\n\n#title Évolution du revenu mensuel#!\nBase : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_base')|+=0]\nAlphabétisation : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_literacy')|+=0]\nÉcoles : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_education')|+=0]\nUniversités : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_universities')|+=0]\nAdministration : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_administration')|+=0]\nLégitimité : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_legitimacy')|+=0]\nIntelligentsia : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_intelligentsia')|+=0]\nDette, degré d’agitation et mise en œuvre : [GetPlayer.MakeScope.ScriptValue('ve_national_insight_stability')|+=0]\n\n#title Pression sur la réserve#!\nMultiplicateur de revenu : #Y [GetPlayer.MakeScope.ScriptValue('ve_national_insight_cap_multiplier')|%0]#!\nLe revenu est réduit de moitié à #Y 750#!, tombe à un quart à #Y 900#! et s'arrête à #Y 1000#!. Dépenser avant d'atteindre la limite évite tout gaspillage."
 ve_national_insight_implementation_strain:0 "Surcharge de mise en œuvre"
 ve_national_insight_implementation_strain_desc:0 "L'administration adapte ses institutions et ses procédures à une doctrine nationale récemment adoptée. Aucune autre doctrine de groupe ne peut être adoptée avant la fin de ce cycle de mise en œuvre de 24 mois."
 ve_total_ideas:0 "Groupes de doctrines"
 ve_traditions:0 "#tooltippable_concept Traditions : "
 ve_bonus:0 "#tooltippable_concept Bonus : "
 ve_ambition:0 "Aboutissement"
 ve_ambition_tooltip:0 "#Y Aboutissement#!\n#P Récompense définitive permanente#!\nSe débloque automatiquement lorsque les sept doctrines de ce groupe ont été adoptées."
 ve_idea_cancel_warning:0 "#header Annuler [StateRegion.MakeScope.Var('idea_group')] ?#!\n\n#N Tous les modificateurs de doctrines actifs de ce groupe seront supprimés.#!\n#N Son modificateur d'aboutissement sera également supprimé s'il a été débloqué.#!\n\nLa perspicacité nationale dépensée n'est pas remboursée.\nPerspicacité nationale restituée : #Y 0#!\n\n#title Effets supprimés#!\n[GetScriptedGui('cancel_idea').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('idea_group',MakeScopeFlag(StateRegion.MakeScope.Var('idea_group').GetFlagName)).End)]"
 ve_idea_cancel_confirm_tt:0 "#N Confirmer : annuler ce groupe de doctrines.#! La progression et les modificateurs sont perdus, la perspicacité nationale n'est pas remboursée."
 ve_idea_cancel_keep_tt:0 "Conserver ce groupe de doctrines — ne pas l'annuler."
 ve_embrace:0 "Adopter"
 ve_idea_locked:0 "Voie fermée"
 ve_idea_locked_tt:0 "#N Ce groupe de doctrines s'exclut mutuellement avec celui que vous avez déjà adopté. Annulez ce groupe pour ouvrir cette voie."
 ve_idea_age_locked:0 "Technologie requise"
 ve_idea_age_locked_tt:0 "#N Ce groupe de doctrines requiert une technologie qui n'a pas encore été recherchée."
 ve_idea_labour_technology_locked_tt:0 "#N Requiert [GetTechnology('labor_movement').GetName].#!"
 ve_idea_welfare_technology_locked_tt:0 "#N Requiert [GetTechnology('human_rights').GetName].#!"
 ve_idea_nationalist_technology_locked_tt:0 "#N Requiert [GetTechnology('nationalism').GetName].#!"
 ve_idea_reformist_technology_locked_tt:0 "#N Requiert [GetTechnology('egalitarianism').GetName].#!"
 ve_idea_mass_conscription_technology_locked_tt:0 "#N Requiert [GetTechnology('enlistment_offices').GetName].#!"
 ve_idea_colonial_technology_locked_tt:0 "#N Requiert [GetTechnology('quinine').GetName].#!"
 ve_idea_war_economy_technology_locked_tt:0 "#N Requiert [GetTechnology('war_propaganda').GetName].#!"
 ve_boost_idea:0 "Améliorer la doctrine"
 ve_boost_idea_tt:0 "#header Adopter la doctrine suivante#!\nPerspicacité nationale : #Y [GetPlayer.MakeScope.Var('idea_point_pool').GetValue|0]#!\nÉtat des achats : [GetPlayer.GetCustom('ve_idea_implementation_player_status')]\n\n#title Coût du niveau suivant#!\n#Y I : 200#!  •  #Y II : 250#!  •  #Y III : 300#!  •  #Y IV : 375#!\n#Y V : 450#!  •  #Y VI : 550#!  •  #Y VII : 675#!\nUtilisez le coût correspondant au prochain niveau non acquis de ce groupe.\n\n#title Effets de l'achat#!\n#P Le modificateur suivant de ce groupe devient actif.#!\n#P L'investissement en doctrines et la progression des idées nationales augmentent chacun de 1.#!\n#N Un cycle de mise en œuvre de 24 mois commence. Aucune autre doctrine de groupe ne peut être achetée pendant cette période.#!\n\n#title Pourquoi le bouton peut-il être désactivé ?#!\nLa perspicacité est inférieure au coût du niveau suivant ; la mise en œuvre de doctrines est active ; le groupe est complet ; ou le niveau suivant requiert une technologie non recherchée.\n\nL'annulation de ce groupe supprime ses modificateurs de doctrines ainsi que sa progression actuelle. La perspicacité dépensée n'est jamais remboursée, mais un emplacement de groupe déjà acquis par un jalon n'est jamais révoqué."
 academic_idea_name:0 "#b Doctrine académique"
 agrarian_idea_name:0 "#b Doctrine agricole"
 financial_idea_name:0 "#b Doctrine financière"
 infrastructure_idea_name:0 "#b Doctrine des infrastructures"
 extraction_idea_name:0 "#b Doctrine extractive"
 mass_conscription_idea_name:0 "#b Doctrine de conscription de masse"
 war_economy_idea_name:0 "#b Doctrine d'économie de guerre"
 diplomatic_idea_name:0 "#b Doctrine diplomatique"
 offensive_idea_name:0 "#b Doctrine offensive"
 industrialist_idea_name:0 "#b Doctrine industrielle"
 mercantile_idea_name:0 "#b Doctrine mercantile"
 defensive_idea_name:0 "#b Doctrine défensive"
 bureaucratic_idea_name:0 "#b Doctrine bureaucratique"
 welfare_idea_name:0 "#b Doctrine de bien-être"
 naval_idea_name:0 "#b Doctrine navale"
 nationalist_idea_name:0 "#b Doctrine nationaliste"
 reformist_idea_name:0 "#b Doctrine réformiste"
 professional_army_idea_name:0 "#b Doctrine d'armée professionnelle"
 parliamentary_idea_name:0 "#b Doctrine parlementaire"
 labour_idea_name:0 "#b Doctrine du travail"
