 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 de fonds de réforme pieuse/mois#! en régime confessionnel ou en athéisme d’État, et #P +1 de mandat culturel/mois#! en nation ethnique."
 nationalist_idea_7_tt:0 "#P +1 de progression de projet religieux/mois#! en régime confessionnel ou en athéisme d’État ; #P +1 de progression de projet culturel/mois#! en nation ethnique ; les résultats d’intégration religieuse et ethnique coercitive passent de #Y 5%#! à #Y 7%#!."
 embrace_idea_tt:0 "#header Capacité en groupes de doctrines#!\nEmplacements utilisés : #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nEmplacements libres actuels : #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInvestissement en doctrines actuel : #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! doctrines achetées actives\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Fonctionnement de la capacité#!\nChaque doctrine de groupe achetée et active fournit #P +1#! d’investissement en doctrines. Atteindre #Y 4, 8, 13, 19, 26#! ou #Y 34#! ajoute définitivement un emplacement de groupe. Les emplacements 5 à 6 requièrent également l’ère 2 ; l’emplacement 7 requiert l’ère 3.\n\n#title Adoption et annulation#!\nAdopter un groupe ne coûte aucun discernement mais occupe un emplacement libre. L’annuler libère cet emplacement, retire les modificateurs du groupe et réduit l’investissement en doctrines actuel ; le discernement dépensé n’est pas remboursé. Tout emplacement de capacité déjà acquis reste définitivement disponible."
 ve_idea_capacity_player_progress:0 "#title Prochain emplacement permanent#!\nEmplacement : #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgression : #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! doctrines achetées\nEncore requis : #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Prochain emplacement permanent#!\nEmplacement : #Y 5#!\nProgression : #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! doctrines achetées\nEncore requis : #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nCondition d’ère : #N En attente de l’ère 2#!"
 ve_idea_capacity_player_age_3:0 "#title Prochain emplacement permanent#!\nEmplacement : #Y 7#!\nProgression : #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! doctrines achetées\nEncore requis : #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nCondition d’ère : #N En attente de l’ère 3#!"
 ve_idea_capacity_player_max:0 "#P Capacité maximale atteinte : les 7 emplacements de groupes permanents sont disponibles.#!"
 ve_idea_capacity_country_progress:0 "#title Prochain emplacement permanent#!\nEmplacement : #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgression : #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! doctrines achetées\nEncore requis : #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title Prochain emplacement permanent#!\nEmplacement : #Y 5#!\nProgression : #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! doctrines achetées\nEncore requis : #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nCondition d’ère : #N En attente de l’ère 2#!"
 ve_idea_capacity_country_age_3:0 "#title Prochain emplacement permanent#!\nEmplacement : #Y 7#!\nProgression : #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! doctrines achetées\nEncore requis : #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nCondition d’ère : #N En attente de l’ère 3#!"
 ve_idea_capacity_country_max:0 "#P Capacité maximale atteinte : les 7 emplacements de groupes permanents sont disponibles.#!"
 ve_idea_implementation_player_ready:0 "#P Prêt — une autre doctrine peut être adoptée si le discernement est suffisant.#!"
 ve_idea_implementation_player_locked:0 "#N Mise en œuvre en cours — [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] restants avant qu’une autre doctrine puisse être adoptée.#!"
 ve_idea_era_momentum_age_1_tt:0 "#P Pendant l’ère 1 : +1 d’élan de l’époque/mois#! provenant de ce groupe de doctrines de niveau IV. La contribution du groupe de doctrines est limitée à #Y +2#!."
