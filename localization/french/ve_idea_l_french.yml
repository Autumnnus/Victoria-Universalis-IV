 ve_max_idea_text:0 "[GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / 7"
 nationalist_idea_5_tt:0 "#P +1 Réforme de la piété/mois#! dans l'athéisme confessionnel ou d'État, et #P +1 Mandat culturel/mois#! dans la nation ethnique."
 nationalist_idea_7_tt:0 "#P +1 progression du projet religieux/mois#! dans l'athéisme confessionnel ou d'État ; #P +1 progression du projet culturel/mois#! dans la nation ethnique ; Les résultats coercitifs de l'intégration religieuse et ethnique s'améliorent de #Y 5 %#! à #Y 7 %#!."
 embrace_idea_tt:0 "#header Capacité du groupe d'idées#!\nEmplacements utilisés : #Y [GetPlayer.MakeScope.Var('idea_group_unlocked').GetValue|0] / [GetPlayer.MakeScope.Var('idea_group_cap').GetValue|0]#!\nEmplacements gratuits maintenant : #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_free_slots')|0]#!\nInvestissement actuel dans la doctrine : #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0]#! idées achetées actives\n\n[GetPlayer.GetCustom('ve_idea_capacity_player_detail')]\n\n#title Comment fonctionne la capacité#!\nChaque idée de groupe active achetée fournit #P +1#! Investissement dans la doctrine. Atteindre #Y 4, 8, 13, 19, 26#! ou #Y 34#!  ajoute de manière permanente un emplacement de groupe. Les emplacements 5 à 6 nécessitent également l'âge 2 ; L'emplacement 7 nécessite l'âge de 3 ans.\n\n#title Adhésion et annulation#!\nAdhérer un groupe ne coûte aucun Insight mais occupe un emplacement libre. L'annulation libère cet emplacement, supprime les modificateurs du groupe et réduit l'investissement en doctrine actuel ; Les Insights dépensés ne sont pas remboursés. Tout emplacement de capacité déjà gagné reste disponible en permanence."
 ve_idea_capacity_player_progress:0 "#title Emplacement permanent suivant#!\nEmplacement : #Y [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgression : #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [GetPlayer.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! idées achetées\nEncore nécessaire : #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_player_age_2:0 "#title Prochain emplacement permanent#!\nEmplacement : #Y 5#!\nProgression : #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! idées achetées\nEncore nécessaire : #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nÂge requis : #N En attente d'âge 2#!"
 ve_idea_capacity_player_age_3:0 "#title Prochain emplacement permanent#!\nSlot : #Y 7#!\nProgression : #Y [GetPlayer.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! idées achetées\nEncore nécessaire : #Y [GetPlayer.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nÂge requis : #N En attente de 3 ans#!"
 ve_idea_capacity_player_max:0 "#P Capacité maximale atteinte : les 7 emplacements de groupe permanents sont disponibles.#!"
 ve_idea_capacity_country_progress:0 "#title Prochain emplacement permanent#!\nSlot : #Y [Country.MakeScope.ScriptValue('ve_next_idea_group_slot')|0]#!\nProgression : #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / [Country.MakeScope.ScriptValue('ve_next_idea_group_capacity_threshold')|0]#! idées achetées\nToujours requis : #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!"
 ve_idea_capacity_country_age_2:0 "#title Prochain emplacement permanent#!\nEmplacement : #Y 5#!\nProgression : #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 19#! idées achetées\nEncore nécessaire : #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nÂge requis : #N En attente de 2 ans#!"
 ve_idea_capacity_country_age_3:0 "#title Prochain emplacement permanent#!\nEmplacement : #Y 7#!\nProgression : #Y [Country.MakeScope.Var('ve_idea_capacity_progress').GetValue|0] / 34#! idées achetées\nToujours requis : #Y [Country.MakeScope.ScriptValue('ve_idea_group_capacity_remaining')|0]#!\nÂge requis : #N En attente de 3 ans#!"
 ve_idea_capacity_country_max:0 "#P Capacité maximale atteinte : les 7 emplacements de groupe permanents sont disponibles.#!"
 ve_idea_implementation_player_ready:0 "#P Prêt — une autre idée pourra être adoptée lorsque suffisamment d'Insight sera disponible.#!"
 ve_idea_implementation_player_locked:0 "#N Mise en œuvre en cours — [GetPlayer.GetTimedModifierDurationRemaining('ve_national_insight_implementation_strain')] restant avant qu'une autre idée puisse être adoptée.#!"
 ve_idea_era_momentum_age_1_tt:0 "#P Pendant l'âge 1 : +1 Era Momentum/mois#! de ce groupe d'idées de niveau IV. La contribution du groupe d'idées est plafonnée à #Y +2#!."
 ve_idea_era_momentum_age_2_tt:0 "#P Pendant l'âge 2 : +1 Era Momentum/mois#! de ce groupe d'idées de niveau IV. La contribution du groupe d'idées est plafonnée à #Y +2#!."
 ve_idea_era_momentum_age_3_tt:0 "#P Pendant l'âge de 3 ans : +1 Era Momentum/mois#! de la part de ce groupe d'idées de niveau IV. La contribution du groupe d'idées est plafonnée à #Y +2#!."
 reformist_idea_5_system_tt:0 "#P +1 Réforme de la Piété/mois#! en Liberté de Conscience ou Séparation Totale, et #P +1 Mandat Culturel/mois#! en Nation Civique ou État Composite."
 reformist_idea_7_system_tt:0 "#P +1 Progression du Projet Religieux/mois#! en Liberté de Conscience et #P +1 avancement de Projet Culturel/mois#! en Nation Civique ou État Composite."
 academic_idea_5_system_tt:0 "#P +1 Mandat Culturel/mois#! en Nation Civique."
 academic_idea_7_system_tt:0 "#P +1 avancement de Projet Religieux/mois#! en Athéisme d'État et #P +1 avancement de Projet Culturel/mois#! dans Civic Nation."
 welfare_idea_6_system_tt:0 "#P +1 avancement du projet culturel/mois#! dans Civic Nation."
 diplomatic_idea_6_system_tt:0 "#P +1 avancement du projet culturel/mois#! dans Composite State."
